    application: |
      auto-env's backlog wants `autoenv mcp` exposing status/logs/restart.
      Implement it the same way: `auto env mcp serve` spawns `auto env status`
      / up / down / restart as subprocesses and wraps their JSON. Since auto-env
      already emits JSON on stdout with diagnostics on stderr, the wrapper is
      trivial and no business logic leaks into the MCP layer — the CLI stays the
      single source of truth. NOTE the dep tension: an MCP SDK is a new runtime
      dependency; check whether a minimal pure-Go stdio JSON-RPC loop suffices
      before pulling one in.
