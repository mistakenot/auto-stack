    confidence: high
    dependencies: none
    score: 3
    summary: |
      Hack distinguishes `git rev-parse --git-dir` (per-worktree) from
      `--git-common-dir` (shared across all linked worktrees of one repo), uses
      --path-format=absolute, realpaths the result, and derives the primary
      checkout root by stripping a trailing /.git. The common dir is the canonical
      "is this the same repo?" key when reconciling registry entries
      (isSameRepositoryFamily).
    application: |
      auto-env keys the registry on repo_root + branch. Adding a git_common_dir
      field (resolved once via `git -C <root> rev-parse --path-format=absolute
      --git-common-dir`, then realpath'd) gives a stable id that survives a
      worktree being moved/renamed, and lets `ls`/`prune` group all worktrees of
      one repo. Cheap. Low impact: today's repo_root+branch key already works; this
      is robustness insurance that becomes useful once ls/prune land.
    evidence: |
      git-worktree.ts resolveGitWorktreeDir/resolveGitRepositoryIdentity/
      resolveGitPrimaryWorktreeRoot; projects-registry.ts isSameRepositoryFamily
      (name collision = "same project, moved" only if common-dirs match).

