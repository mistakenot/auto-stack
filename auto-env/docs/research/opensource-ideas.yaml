    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: a Go MCP SDK (one new runtime dep — weigh vs minimal-deps rule)
    score: 6
    summary: |
      Hack's MCP server reimplements no logic: each tool shells out to the same
      `hack` CLI with `--json`, parses stdout, and returns a uniform
      {ok, command, exitCode, stdout, stderr, data} payload. resolveHack
      Invocation finds the binary; one buildToolResult/buildToolError wraps every
