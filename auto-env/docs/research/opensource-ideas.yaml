  - id: I010
    title: "Aggregated read-model for `ls`: registry ⨝ runtime ⨝ branches → derived status"
    source: hack-dance/hack
    commits: []
    files: [src/lib/project-views.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-views.ts
    discovered: 2026-06-18
