  - id: I017
    title: "Worktree-shared secret key chain (checkout key → shared key under git common dir → env)"
    source: hack-dance/hack
    commits: []
    files: [src/lib/project-env-config.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-env-config.ts
    discovered: 2026-06-18
    status: candidate
    change_type: additive
    area: new internal/secrets (keyed off worktree)
    effort: M
    impact: medium
    risk: low
    confidence: medium
    dependencies: none (crypto/aes GCM in stdlib)
    score: 3
    summary: |
      Secret values stored as v1:iv:tag:ct (AES-256-GCM, key=sha256(keytext)).
      The key is resolved local-first: checkout-local .hack.secret.key → shared
      key under the git common dir (so all linked worktrees decrypt the same
      committed secrets without copying gitignored files) → primary-worktree
      inherited key → HACK_ENV_SECRET_KEY. The key is only required when a secret
      entry actually exists. chmod 0600 + auto-gitignore.
    application: |
      Only relevant if auto-env env overlays ever hold secrets. The
      shared-key-under-git-common-dir trick is the right worktree pattern: sibling
      worktrees share one key located via `git rev-parse --git-common-dir` rather
      than each copying an untracked file — serves parallel-worktree isolation
      with no per-worktree secret setup. Would land as internal/secrets using
      crypto/aes GCM, with worktree.CommonDir() feeding the lookup. Off the current
      backlog (no secrets feature yet), hence low score.
    evidence: |
      resolveProjectEnvSharedKeyPath (commonDir != worktreeDir → commonDir/
      .hack.secret.key); resolveProjectEnvKey order local→shared→inherited→env;
      required computed from hasSecretEntries; crypto aes-256-gcm,
      key=sha256(keytext), "v1:base64(iv):base64(tag):base64(ct)".

  - id: I018
    title: "Git-common-dir worktree identity (stable repo-family ID)"
    source: hack-dance/hack
    commits: []
    files: [src/lib/git-worktree.ts, src/lib/projects-registry.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/git-worktree.ts
