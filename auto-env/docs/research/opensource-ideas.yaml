profile:
  recorded: 2026-06-18
  project: |
    auto-env (`auto env`) — a Go CLI that gives worktree-based coding agents
    isolated development environments. It generates concrete config from a
    Process Compose template, allocating a free port per discovered `${PORT_*}`
    token so parallel worktrees never collide. It orchestrates existing tools
    (Process Compose for the runtime, Docker for stateful services, git for
    worktree detection) rather than reinventing them.
  architecture: |
    Go + Cobra. Internal packages:
      - port      — allocates/derives a port per `${PORT_*}` token (currently
                    deterministic by slot; does NOT bind-probe for liveness)
      - template  — discovers `${PORT_*}` tokens, substitutes `${BRANCH}`,
                    `${BRANCH_SLUG}`, `${NAME}`; unresolved var = hard error
      - manifest  — newline-delimited list of the files an env generated
      - registry  — JSON state per env: repo_root, branch, branch_slug, slot,
                    ports map, files
      - worktree  — git worktree detection (repo root, branch, slot)
      - cli       — commands: up / down / status / init / agents / quickstart
    State is file-based JSON (registry + manifest), NOT SQLite. Commands default
    to JSON on stdout (strictly parseable payload; diagnostics to stderr). Repo
    convention: every hard error carries a concrete remediation hint; list/read
    commands return all valid items even when some are invalid; prefer minimal
    runtime deps (reuse embedded pure-Go libs over new binaries/SDKs).
  stack: [Go, Cobra, Process Compose, Docker, git]
  goals: |
    - Parallel worktree development without port conflicts.
    - First-class support for autonomous coding agents (Claude Code, Codex,
      opencode) — agent-agnostic by default, optional per-agent integrations.
    - Orchestrate existing tools; stay thin.
    Active backlog (from requirements.md): `doctor`, `ls`, `prune`,
    `restart <svc>`, `reload` (re-render + apply without teardown), `logs`;
    config-hash drift detection; stale-state recovery (Process Compose died but
    state says running — detect via socket reachability); timeout/partial-failure
    behavior on `up`; concurrent-`up` race safety; Claude Code Worktree/Session
    hooks; `autoenv mcp` server exposing status/logs/restart; AGENTS.md
    scaffolding; optional Caddy per-branch host mapping.
  non_goals: |
    - Multi-user / multi-machine / distributed operation.
    - Replacing Process Compose or Docker Compose.
    - Production deployment workflows.
    - Hosted services, auth/account/org/team, public ingress (Cloudflare
      tunnels), TLS/DNS provisioning, web dashboards.

