    area: registry + manifest + cli (status)
    effort: S
    impact: medium
    risk: low
    confidence: medium
    dependencies: none (crypto/sha256)
    score: 7
    summary: |
      Hack records a digest of every input file alongside materialized output
      (.env.state.json). A status/doctor check recomputes the digests and reports
      exactly which inputs changed (or vanished) since materialization, each with
      the recovery command to run.
    application: |
      This is auto-env's "config-hash drift detection" backlog item. Store a
      sha256 of the source template(s) + resolved port/branch inputs in each
      registry entry (internal/registry), then have `auto env status`
      (cli/status.go) report "generated config is stale — N source files changed
      since `auto env up`, run `auto env reload`" instead of trusting the on-disk
      manifest blindly. Fits the existing manifest/registry model with no new
      subsystem.
    evidence: |
      buildProjectEnvStateDigests over resolved.files; collectProjectEnv
      MaterializationIssues diffs state.inputs vs current digests → "N env input
      files changed since materialization" + "(run: hack env materialize)".

  - id: I003
    title: "Deterministic runtime-state truth table (pid x socket x state-file)"
    source: hack-dance/hack
    commits: []
    files: [src/daemon/status.ts, src/daemon/process.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/daemon/status.ts
    discovered: 2026-06-18
    status: shortlisted
    change_type: additive
    area: registry (stale-state recovery) + cli (status/up)
    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: none (syscall.Kill, net.DialTimeout)
    score: 6
    summary: |
      buildDaemonStatusReport is a PURE function that crosses three independent
      observations — recorded PID alive (process.kill(pid,0)), API/socket
      reachable, state file present — into one of {running, starting,
      incompatible, stale, stopped} plus a concrete nextStep. "stale" is split by
      reason (pid_not_running vs socket_only). Observation (readDaemonStatus) is
      kept separate from classification, so the truth table is trivially
      table-testable with no I/O.
    application: |
      auto-env's registry can say a slot is "running" while Process Compose has
      died. Add a pure StatusOf(observed) → {Running, Stale(reason), Dead}
      classifier crossing (a) PID liveness via syscall.Kill(pid,0),
      (b) Process Compose unix-socket reachability via net.DialTimeout, and
      (c) registry-entry presence. This is the stated "stale-state recovery
      via socket reachability" item. Surface in `auto env status`; have
      `auto env up` auto-clean a stale entry before re-provisioning. Keep probe
      and classifier in separate funcs (internal/registry/status.go) so the table
      is unit-tested.
    evidence: |
      src/daemon/status.ts buildDaemonStatusReport → status + staleReason +
      nextStep; src/daemon/process.ts isProcessRunning via process.kill(pid,0);
      readDaemonStatus isolates the I/O probe from classification.

  - id: I004
    title: "`prune` reaper: probe each entry, attach a reason, confirm, remove + teardown"
    source: hack-dance/hack
    commits: []
    files: [src/lib/project-runtime-hygiene.ts, src/commands/projects.ts, src/lib/projects-registry.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-runtime-hygiene.ts
    discovered: 2026-06-18
    status: shortlisted
    change_type: additive
    area: registry + cli (new prune command)
    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: registry; worktree git detection
    score: 6
    summary: |
      `hack projects prune` separates detection from action: findMissingRegistry
      Entries (rows whose project dir / compose file is gone) and findOrphan
      RuntimeProjects (running containers whose working dir is gone), each
      carrying a structured `reason`. handlePrune lists candidates with reasons,
      asks ONE confirmation, then removeProjectsById (set-membership filter under
      a lock, atomic write) plus stops the orphaned runtime, and reports counts.
      Detection is cheap pathExists — no Docker calls needed to decide.
    application: |
      auto-env's `prune` backlog item, almost verbatim. The reap predicate
      differs: orphaned when the worktree path is missing OR its git branch is
      gone (`git show-ref --verify refs/heads/<branch>` fails). Mirror the shape
      in cli/prune.go: scan registry entries, attach a reason per orphan, dry-run
      report by default, require --yes (or confirm) to delete the JSON entry AND
      tear down its Process Compose/Docker env AND release the port slot. Keep
      registry rewrites atomic (temp file + rename). Two agents surfaced this
      independently.
    evidence: |
      project-runtime-hygiene.ts findMissingRegistryEntries / findOrphanRuntime
      Projects (reason strings + containerIds); commands/projects.ts handlePrune
      (candidate table, one confirm, remove + stop + report); projects-registry.ts
      removeProjectsById.

  - id: I005
    title: "MCP server as a thin shell-out wrapper over the existing CLI"
    source: hack-dance/hack
    commits: []
    files: [src/mcp/server.ts, src/commands/mcp.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/mcp/server.ts
    discovered: 2026-06-18
