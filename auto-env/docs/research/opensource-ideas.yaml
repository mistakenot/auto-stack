    effort: M
    impact: high
    risk: low
    confidence: medium
    dependencies: registry; runtime/process-compose state lookup
    score: 6
    summary: |
      buildProjectViews joins three independent signals per project — registry
      entry, live runtime (running counts), discovered branch instances — into one
      stable read model. Branch instances are detected purely by naming convention
