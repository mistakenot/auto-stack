ideas:
  # newest first; this baseline batch is ordered by score descending.

  - id: I001
    title: "Bind-probe port liveness before allocating/launching"
    source: hack-dance/hack
    commits: []
    files: [src/lib/project-lifecycle-singleton.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-lifecycle-singleton.ts
    discovered: 2026-06-18
    status: shortlisted
    change_type: additive
    area: port
    effort: S
    impact: high
    risk: low
    confidence: high
    dependencies: none (stdlib net)
    score: 10
    summary: |
      Hack probes whether a TCP port is actually free by attempting to bind a
      listener on 127.0.0.1 and catching EADDRINUSE (inspectTcpPortState →
      free/occupied/error; inspectListeningTcpPorts maps a set to its occupied
      subset). A real liveness check, not arithmetic.
    application: |
      auto-env's port.Allocate (internal/port/port.go) derives a port from the
      slot but never verifies it is free — a deterministic slot can still collide
      with an unrelated process. Add port.Probe(p) using
      net.Listen("tcp","127.0.0.1:<p>") + immediate Close (treat
      address-in-use as occupied), and call it in cli/up.go to fail fast (or hunt
      the next free slot) with a clear remediation hint BEFORE rendering a config
      that points at an occupied port. Directly serves the no-port-conflict goal.
    evidence: |
      TS: Bun.listen({hostname:'127.0.0.1',port}); listener.stop() => free; catch
      EADDRINUSE => occupied. Go equivalent: ln,err := net.Listen("tcp",addr); if
      err != nil { /* in use */ } else { ln.Close() }.

  - id: I002
    title: "Config-drift detection via input-file digests in state"
    source: hack-dance/hack
    commits: []
    files: [docs/env.md, src/lib/project-env-config.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-env-config.ts
    discovered: 2026-06-18
