  - id: I011
    title: "Lock-guarded atomic JSON registry with stale-lock steal + parse-tolerant reads"
    source: hack-dance/hack
    commits: []
    files: [src/lib/projects-registry.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/projects-registry.ts
    discovered: 2026-06-18
    status: candidate
    change_type: additive
    area: registry
    effort: M
    impact: medium
    risk: low
    confidence: high
    dependencies: none (os/syscall)
    score: 4
    summary: |
      Every mutation runs under withRegistryLock: acquire an exclusive lockfile
      via O_CREAT|O_EXCL, retry with backoff on EEXIST, treat a lock older than
      30s (mtime) as stale and steal it, time out after 2s. Writes go to
      <path>.tmp then rename() (atomic). Reads are crash-tolerant: any JSON parse
      failure or schema-version mismatch yields an empty registry rather than an
      error, and per-entry parse failures are skipped individually (rest survive).
    application: |
      auto-env's registry is file-based JSON mutated by concurrent `up`/`down`
      across parallel worktrees and autonomous agents — exactly the race this
      guards. An O_EXCL lockfile + stale-mtime steal + temp-file+rename gives
      safe concurrent writes with zero new deps (pure os/syscall) in
      internal/registry. The parse-tolerant read (drop bad rows, keep good ones,
      version-gate) matches the repo rule "return available valid results even
      when some items are invalid". Serves the concurrent-`up` safety backlog.
    evidence: |
      projects-registry.ts withRegistryLock/acquireRegistryLock/isLockStale,
      writeRegistryAtomic (temp+rename), readProjectsRegistry/parseRegistry
      tolerant fallback.

  - id: I012
    title: "Transactional lifecycle starter with abort() rollback on partial up-failure"
    source: hack-dance/hack
    commits: []
    files: [src/commands/project.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/commands/project.ts
    discovered: 2026-06-18
    status: candidate
    change_type: additive
    area: cli (up) + registry
    effort: M
    impact: medium
    risk: low
    confidence: high
    dependencies: up flow + registry write
    score: 4
    summary: |
      createLifecycleProcessStarter wraps startup as a transaction: startMany()
      starts processes in order; finalize() persists state ONLY if something
      started; abort() (in catch) kills the partial session AND removes the state
      entry. The up flow also removes the runtime-state entry when compose up
      returns non-zero. Net: the state file never claims "running" after a
      failed/partial up.
    application: |
      auto-env's backlog calls out "timeout behavior on up (leave partial state,
      report failures)" + concurrent-up safety. Mirror try/finalize/abort in
      cli/up.go: write the registry entry only after Process Compose/Docker
      confirm healthy; on failure/timeout run a compensating teardown (free the
      slot, stop what started) and either remove the entry or mark it "partial"
      so I003's classifier treats it as stale, not running. The borrowable rule is
      "never leave a bare running claim after a failed up", not the exact
      kill-everything choice.
    evidence: |
      project.ts createLifecycleProcessStarter finalize()/abort() (abort kills
      session + removeLifecycleStateEntry); startLifecycleProcesses catch →
      starter.abort(); runRestartUpPhase removes runtime-state entry on non-zero
      up code.

  - id: I013
    title: "Declarative prerequisite matrix: command → required checks → policy (block/guide/warn)"
