  - id: I006
    title: "Uniform doctor check framework: typed result + timed runner + tri-state severity"
    source: hack-dance/hack
    commits: []
    files: [src/commands/doctor.ts, src/commands/doctor-utils.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/commands/doctor.ts
    discovered: 2026-06-18
    status: candidate
    change_type: additive
    area: cli (new doctor command) + new internal/doctor
    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      Every diagnostic is a uniform record (name, status ok|warn|error, message,
      and a copy-pasteable remediation hint embedded in the message). A single
      runCheck wrapper records duration and races each check against a per-check
      timeout, downgrading a hang to a warn rather than blocking the command;
      thrown errors are caught → status=error. The command aggregates results and
      exits non-zero if any error. Checks are data, not control flow.
    application: |
      Build a Go `Check struct { Name; Status; Message; Remediation; DurationMs }`
      and a runCheck(ctx,name,fn,timeout) using context.WithTimeout + a goroutine
      (auto-env shells out to docker/process-compose, which can hang). Each
      concern becomes a check fn: docker present + daemon reachable,
      process-compose present, registry JSON parseable, port-allocation
      consistent, template renderable, worktree git state. Emit []Check as the
      JSON payload to stdout; exit non-zero on any error. This is the backbone the
      backlog `doctor` command needs and satisfies the auto-stack-wide "every tool
      has a doctor reporting problems as JSON" convention. Give each Check a
      structured Remediation field (cleaner than embedding in the message for JSON
      consumers) — auto-env's CLAUDE.md already mandates a remediation hint per
      hard error.
    evidence: |
      doctor.ts CheckResult/TimedCheckResult interfaces; runCheck wrapper with
      Promise.race timeout + catch→error; per-check remediation strings e.g.
      "Missing (run: hack global install)", "Not found (run: hack doctor --fix)";
      final hasError → exit 1.

  - id: I007
    title: "Singleton fixed-port policy: start | adopt-healthy | fail-on-partial"
    source: hack-dance/hack
    commits: []
    files: [src/lib/project-lifecycle-singleton.ts, docs/lifecycle.md]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/lib/project-lifecycle-singleton.ts
    discovered: 2026-06-18
    status: candidate
    change_type: additive
    area: port + registry + cli (up/down)
    effort: M
    impact: high
    risk: medium
    confidence: high
    dependencies: bind-probe helper (see I001)
    score: 6
    summary: |
      resolveLifecycleSingletonDecision is a pure function over (expected ports,
      occupied ports, onConflict) → start | adopt | fail. All expected ports free
      → start; ALL already listening + opt-in → adopt (skip launch, and DON'T
      tear it down on `down`); only SOME occupied → fail-fast (never create a
      partial competing stack). Occupancy is a real bind probe, not lsof parsing.
    application: |
      auto-env's per-worktree ports are dynamic, but some env dependencies are
      genuinely shared singletons (one Docker Postgres/Redis, a shared tunnel)
      that should not get a per-slot port. Add an optional fixed-port declaration
      in the template/config and an adopt/fail decision in cli/up.go: full set
      already healthy + opt-in → adopt (mark the registry entry not-owned so
      `down` never kills it); partial occupancy → fail fast with the offending
      ports. Also doubles as idempotency/recovery for a slot's own block. Lands as
      internal/port/singleton.go (pure, table-tested). risk: medium — adopting a
      process you didn't start needs careful ownership tracking.
    evidence: |
      resolveLifecycleSingletonDecision: occupied=0 → start; missing>0 → fail
      (partial); onConflict='adopt' & all occupied → adopt ("leave running on
      down"); else fail. docs/lifecycle.md "Why singleton exists". Two agents
      flagged this independently.

  - id: I008
    title: "Per-agent config from one source: marker-fenced, idempotent, removable"
    source: hack-dance/hack
    commits: []
    files: [src/mcp/agent-docs.ts, src/mcp/install.ts, src/agents/codex-skill.ts]
    permalink: https://github.com/hack-dance/hack/blob/7da1cc258171c7e2cafe9f1902b593dec325e970/src/mcp/agent-docs.ts
    discovered: 2026-06-18
    status: candidate
    change_type: structural-rebuild
    area: cli (agents) + new internal/agentcfg
    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: replaces existing agents.go logic
    score: 6
    summary: |
      All per-agent setup is driven from one renderer plus per-target path
      resolvers. agent-docs.ts upserts a snippet into AGENTS.md/CLAUDE.md fenced
      by `<!-- hack:agent-docs:start/end -->` markers (regex replace-in-place,
      never duplicate-append); install.ts writes MCP entries into
      .claude/settings.json, .cursor/mcp.json (JSON merge) and .codex/config.toml
      (TOML block) from one buildEntry; codex-skill.ts writes a SKILL.md. Every
      op returns {target, status: created|updated|noop|removed|error, path} and
      has matching check/remove functions.
    application: |
      auto-env's current cli/agents.go does a raw substring-append into
      CLAUDE/AGENTS/GEMINI with no markers — re-running after the snippet text
      changes leaves a stale copy forever, and there's no remove path. Rebuild it
      the Hack way: fence the auto-env block with `<!-- autoenv:start/end -->`,
      replace-in-place on re-run, add check/remove, and return a structured
      per-target status. Then extend the same one-source pattern to emit MCP/hook
      config blocks per target. Serves the AGENTS.md-scaffolding backlog and fixes
      a real idempotency bug.
    evidence: |
      agent-docs.ts DOC_MARKER_START/END + upsertSnippet regex replace;
      resolveUpsertStatus → created|updated|noop. install.ts resolveConfigPath
      switch(target); installCodexConfig guarded by hasCodexServerBlock. Contrast:
      auto-env cli/agents.go ~line 67 strings.Contains append-only, no
      markers/remove.

