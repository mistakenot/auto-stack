# lock-flow scenario: ONE host container, ONE registered project workspace,
# TWO Workers. The lock store is host-global (one ~/.auto/lock/locks.json), so
# the case that matters is two Workers contending on one host — and a second
# container would be a second *host* (the harness seeds a distinct HOST_ID per
# container), which is deliberately not what this scenario is (D-11, cf.
# mail-flow's D-062-1). The Workers are told apart by AUTO_LOCK_WORKER, set per
# invocation by the DSL. See src/harness/scenarios/lock_flow.py.
services:
  host:
    build:
      context: ../../..
      dockerfile: harness/scenarios/lock-flow/Dockerfile
      target: host
    hostname: lock-host
    environment:
      HOST_ID: lock-host
    # No daemon runs here: the guard lives in `auto hooks fire`, which is a
    # plain subprocess. `auto` shells out to git and gh; tini reaps them.
    init: true
    healthcheck:
      # Ready-file is written only after the project is registered, the hooks
      # are installed and the lock config is in place.
      test: ["CMD-SHELL", "test -f /tmp/lock-ready.json"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s
