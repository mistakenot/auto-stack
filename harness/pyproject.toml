[project]
name = "auto-harness"
version = "0.1.0"
description = "End-to-end, hermetic, scenario-based test harness for the auto-stack"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pytest>=8.0",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scenario stacks build real images and can take minutes; keep output verbose.
addopts = "-ra"
