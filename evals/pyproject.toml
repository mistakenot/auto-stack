[project]
name = "auto-evals"
version = "0.1.0"
description = "auto-stack eval suite: Harbor tasks, experiments, and the thin tooling layer on top"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
evals = "auto_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
