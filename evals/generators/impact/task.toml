# harbor-canary GUID $canary
# GENERATED by `evals generate` from generators/impact.toml. Edit the spec or the
# templates in generators/impact/, then regenerate. Do not edit this file by hand.
schema_version = "1.4"
artifacts = ["/app/answer.json", "/logs/agent/trajectory.json"]

[task]
name = "$org/$name"
version = "$version"
description = "$description"
authors = [{ name = "$org" }]
keywords = ["impact", "go", "reverse-dependencies", "$granularity-level", "$fixture"]

[metadata]
area = "impact"
objective = "$objective"
fixture = "$fixture"
subject = "$subject"
fixture_repo = "$repo"
fixture_rev = "$rev"
module_dir = "$module_dir"
target = "$target_dir"
granularity = "$granularity"
truth_source = "go list at fixture_rev inside $go_image; non-test Deps closure (evals generate)"
generator = "impact"
difficulty = "$difficulty"
answer_size = $answer_size
direct_dependents = $direct
max_chain_depth = $depth

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 1024

[agent]
timeout_sec = 1200.0

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
os = "linux"
