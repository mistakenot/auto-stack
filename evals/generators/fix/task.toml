# harbor-canary GUID $canary
# GENERATED by `evals generate` from generators/fix.toml. Edit the spec or the
# templates in generators/fix/, then regenerate. Do not edit this file by hand.
schema_version = "1.4"
artifacts = ["/tmp/agent.patch", "/logs/agent/trajectory.json"]

[task]
name = "$org/$name"
version = "$version"
description = "$description"
authors = [{ name = "$org" }]
keywords = ["fix", "go", "swe", "$fixture"]

[metadata]
area = "fix"
objective = "issue"
fixture = "$fixture"
subject = "$subject"
fixture_repo = "$repo"
fixture_rev = "$parent"
fix_commit = "$sha"
statement_source = "$statement_source"
truth_source = "tests added by fix_commit, validated in $go_image: $n_f2p fail before the fix and pass after; $n_p2p must keep passing"
generator = "fix"
difficulty = "$difficulty"
src_files_changed = $n_src
fix_lines = $fix_lines

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

# The agent's edits cross into the separate verifier as a patch.
[[verifier.collect]]
command = "cd /app/$repo_dir && git add -A && git diff --cached --binary HEAD > /tmp/agent.patch"
timeout_sec = 60

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 6144
os = "linux"
