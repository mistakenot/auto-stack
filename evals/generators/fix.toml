# Spec for generated `fix-*` tasks, SWE-bench style. Render with `uv run evals generate`.
#
# Each [[tasks]] entry names an upstream bug-fix commit. The agent gets the
# repository at the commit's parent plus a problem statement. The verifier runs
# the commit's own tests against the agent's patch. `evals generate` validates
# every commit first (see src/auto_evals/fixmine.py) and refuses one that does
# not have tests failing before the fix and passing after it.
#
# Statements live in generators/fix/statements/<subject>.md:
# - "issue #N": the linked issue's title and body, verbatim.
# - "curated from PR #N": a symptom-only report written from the PR, with
#   observed and expected behaviour and no hint of the fix.
# Bump a task's `version` whenever a change alters what it measures.
#
# A fixture with a root go.work sets `workspace = true`: Go's workspace mode
# rejects GOFLAGS=-mod=mod, and `go build ./...` matches nothing at its root.
#
# Rejected after review:
# - cli/cli 8fcd6a64 (issue #14404, merge --delete-branch owner case): the hidden
#   test stubs `isCrossRepository`, so it passes only with upstream's choice of
#   API field. A correct case-insensitive owner comparison fails it. All 9 Opus
#   trials resolved the issue that way and scored 0. A task that every arm fails
#   while the oracle passes needs this review before its results count.

[fixtures.ghcli]
repo = "https://github.com/cli/cli"
repo_dir = "cli"

[fixtures.cobra]
repo = "https://github.com/spf13/cobra"
repo_dir = "cobra"

[fixtures.caddy]
repo = "https://github.com/caddyserver/caddy"
repo_dir = "caddy"

# auto-stack itself: a go.work monorepo with a long CLAUDE.md, ~47 skills and a
# committed Playbook (.auto/reflect), from 2026-06-29 on.
[fixtures.autostack]
repo = "https://github.com/mistakenot/auto-stack"
repo_dir = "auto-stack"
workspace = true

