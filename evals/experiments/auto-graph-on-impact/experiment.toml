# Model: Claude Haiku 4.5. See auto-graph-opus-on-impact-file for Opus 5.5.
# Experiment: does the auto graph CLI help Claude Code answer impact questions?
# Pre-registered: the question, the primary metric, and what each arm changes are
# written down before results exist, so the analysis cannot drift to fit them.

question = "Does putting the auto graph CLI in front of Claude Code improve blast-radius answers?"
hypothesis = "The auto-graph arm raises mean reward (F1) over control without raising agent time."
dataset = "impact"
primary_metric = "reward"
secondary_metrics = ["precision", "recall", "agent_sec", "input_tokens", "output_tokens", "cost_usd"]

# Commands run from the evals/ directory before any arm starts.
prepare = [
  "make -C .. dist GOOS=linux GOARCH=amd64 DIST_DIR=evals/.build",
]

[arms.control]
description = "Stock Claude Code with its built-in tools."

[arms.auto-graph]
description = "Control plus the auto binary on PATH and one line pointing at `auto graph quickstart`."
# Resolved-config paths this arm may differ from control on. `evals lint` fails if
# the actual difference is anything else.
changes = ["environment.mounts", "extra_instructions"]
# Treatment uptake: the share of trials whose trajectory runs a command matching
# this regex. An arm nobody uses measures nothing.
uptake = "\\bauto\\s+graph\\b"
