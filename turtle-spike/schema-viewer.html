<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-Stack System Spec — Schema Viewer</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
  #header {
    padding: 16px 24px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  #header h1 { font-size: 18px; font-weight: 600; color: #f0f6fc; }
  #header .stats { font-size: 13px; color: #8b949e; }
  #controls {
    padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  #controls label { font-size: 13px; color: #8b949e; }
  #controls select, #controls input {
    background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    padding: 4px 8px; border-radius: 6px; font-size: 13px;
  }
  #controls button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 4px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #controls button:hover { background: #30363d; }
  #legend {
    padding: 8px 24px; background: #0d1117; border-bottom: 1px solid #30363d;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .legend-item {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: #8b949e; padding: 2px 8px;
    background: #161b22; border-radius: 12px; border: 1px solid #30363d;
    cursor: pointer; user-select: none;
  }
  .legend-item:hover { border-color: #58a6ff; }
  .legend-item.dimmed { opacity: 0.3; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #graph { width: 100%; height: calc(100vh - 140px); }
  #detail {
    position: fixed; right: 16px; top: 140px; width: 320px; max-height: calc(100vh - 160px);
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 16px; overflow-y: auto; display: none; font-size: 13px; z-index: 10;
  }
  #detail h3 { font-size: 15px; color: #f0f6fc; margin-bottom: 8px; }
  #detail .prop { margin: 4px 0; }
  #detail .prop-key { color: #8b949e; }
  #detail .prop-val { color: #c9d1d9; }
  #detail .edge-list { margin-top: 12px; }
  #detail .edge-item { padding: 2px 0; color: #58a6ff; }
  #close-detail {
    position: absolute; top: 8px; right: 12px; cursor: pointer;
    color: #8b949e; font-size: 18px; background: none; border: none;
  }
</style>
</head>

const container = document.getElementById('graph');
let network;
let nodesDS, edgesDS;
let hiddenGroups = new Set();

function buildNetwork(layout) {
  const options = {
    nodes: {
      font: { color: '#c9d1d9', size: 12 },
      borderWidth: 1,
      borderWidthSelected: 3,
    },
    edges: {
      color: { color: '#30363d', highlight: '#58a6ff', hover: '#58a6ff' },
      font: { color: '#8b949e', size: 10, strokeWidth: 0 },
      smooth: { type: 'curvedCW', roundness: 0.15 },
      width: 1,
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      multiselect: true,
    },
    physics: layout === 'physics' ? {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.008, springLength: 120 },
      stabilization: { iterations: 200 },
    } : false,
  };

  if (layout === 'hierarchical') {
    options.layout = {
      hierarchical: {
        direction: 'LR',
        sortMethod: 'directed',
        levelSeparation: 200,
        nodeSpacing: 80,
      },
    };
  }

  nodesDS = new vis.DataSet(getFilteredNodes());
  edgesDS = new vis.DataSet(getFilteredEdges());
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, options);

  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      showDetail(params.nodes[0]);
    } else {
      document.getElementById('detail').style.display = 'none';
    }
  });
}

function getFilteredNodes() {
  const filter = document.getElementById('typeFilter').value;
  let filtered = allNodes;
  if (filter === 'no-fields') {
    filtered = allNodes.filter(n => n.group !== 'Field');
  }
  return filtered.filter(n => !hiddenGroups.has(n.group));
}

function getFilteredEdges() {
  const visibleIds = new Set(getFilteredNodes().map(n => n.id));
  return allEdges.filter(e => visibleIds.has(e.from) && visibleIds.has(e.to));
}

function refresh() {
  const layout = document.getElementById('layoutSelect').value;
  buildNetwork(layout);
}

function showDetail(nodeId) {
  const node = allNodes.find(n => n.id === nodeId);
  if (!node) return;

  const detail = document.getElementById('detail');
  document.getElementById('detail-title').textContent = node.label;

  let body = '<div class="prop"><span class="prop-key">Type:</span> <span class="prop-val">' + node.group + '</span></div>';
  body += '<div class="prop"><span class="prop-key">URI:</span> <span class="prop-val" style="word-break:break-all;font-size:11px">' + nodeId.split('#').pop() + '</span></div>';

  // Outgoing edges
  const outgoing = allEdges.filter(e => e.from === nodeId);
  if (outgoing.length) {
    body += '<div class="edge-list"><b>Outgoing (' + outgoing.length + '):</b>';
    outgoing.forEach(e => {
      const target = allNodes.find(n => n.id === e.to);
      body += '<div class="edge-item">&rarr; ' + e.label + ' &rarr; ' + (target ? target.label : '?') + '</div>';
    });
    body += '</div>';
  }

  // Incoming edges
  const incoming = allEdges.filter(e => e.to === nodeId);
  if (incoming.length) {
    body += '<div class="edge-list"><b>Incoming (' + incoming.length + '):</b>';
    incoming.forEach(e => {
      const source = allNodes.find(n => n.id === e.from);
      body += '<div class="edge-item">&larr; ' + (source ? source.label : '?') + ' &rarr; ' + e.label + '</div>';
    });
    body += '</div>';
  }

  document.getElementById('detail-body').innerHTML = body;
  detail.style.display = 'block';
}

// Event handlers
document.getElementById('typeFilter').addEventListener('change', refresh);
document.getElementById('layoutSelect').addEventListener('change', refresh);
document.getElementById('fitBtn').addEventListener('click', () => network && network.fit());
document.getElementById('resetBtn').addEventListener('click', () => {
  hiddenGroups.clear();
  document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('dimmed'));
  document.getElementById('typeFilter').value = 'all';
  document.getElementById('search').value = '';
  refresh();
});
document.getElementById('close-detail').addEventListener('click', () => {
  document.getElementById('detail').style.display = 'none';
});

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  if (!q) { network.fit(); return; }
  const matches = allNodes.filter(n => n.label.toLowerCase().includes(q)).map(n => n.id);
  if (matches.length) {
    network.selectNodes(matches);
    network.focus(matches[0], { scale: 1.2, animation: true });
  }
});

// Legend toggle
document.querySelectorAll('.legend-item').forEach(el => {
  el.addEventListener('click', function() {
    const group = this.textContent.replace(/\s*\(\d+\)/, '');
    if (hiddenGroups.has(group)) {
      hiddenGroups.delete(group);
      this.classList.remove('dimmed');
    } else {
      hiddenGroups.add(group);
      this.classList.add('dimmed');
    }
    refresh();
  });
});

// Initial render — start with overview (no fields)
document.getElementById('typeFilter').value = 'no-fields';
buildNetwork('physics');
</script>
