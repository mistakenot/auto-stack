<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>auto-ui</title>
  <!-- The `*` external-all prefix tells esm.sh NOT to inline transitive deps, so every nested
       `import "preact"` resolves through THIS import map → a single preact instance (hooks work).
       Because deps are externalized, EVERY bare specifier they import must also be in this map —
       e.g. `htm/preact` imports bare `htm` and `preact`, so both leaf packages are listed below. -->
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.24.3",
      "preact/hooks": "https://esm.sh/*preact@10.24.3/hooks",
      "htm": "https://esm.sh/htm@3.1.1",
      "htm/preact": "https://esm.sh/*htm@3.1.1/preact",
      "react": "https://esm.sh/*preact@10.24.3/compat",
      "react-dom": "https://esm.sh/*preact@10.24.3/compat",
      "marked": "https://esm.sh/marked@13.0.0",
      "dompurify": "https://esm.sh/dompurify@3.2.4"
    }
  }
  </script>
  <!-- Pico CSS v2 — classless styling for semantic HTML. Vendored into vendor/ (not a CDN
       fetch) so it embeds in the binary via //go:embed and works offline. Used as a base
       reset + for rendered-markdown internals; app.css owns the app shell + explorer chrome. -->
  <link rel="stylesheet" href="./vendor/pico.min.css" />
  <!-- Display/UI/reading fonts for the "Drafting Table" design. CDN-loaded (this host has
       network; pd-components already use a CDN); falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet"
  />
  <!-- app.css — the "Drafting Table" design system: app shell, file-tree rail, editor pane. -->
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
