  - id: I003
    title: "Strip terminal escapes from untrusted skill metadata before printing"
    source: vercel-labs/skills
    commits: []
    files: [src/sanitize.ts, tests/sanitize-terminal.test.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/sanitize.ts
    discovered: 2026-06-20
    status: shortlisted
    change_type: additive
    area: "internal/skill output (ls, lint diagnostics) + a new lint check"
    effort: S
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 9
    summary: |
      sanitizeMetadata() strips ANSI/VT100/C1 escape sequences (CSI, OSC, DCS/PM/
      APC, simple ESC, C1 0x80-0x9F, raw control chars except \t\n), collapses
      newlines, and trims — applied to name/description on parse before any
      terminal output. Defends against CWE-150 terminal-injection via crafted
      frontmatter.
    application: |
      auto-skill's `ls` and `lint` print name + description straight from arbitrary
      SKILL.md frontmatter to the terminal — a malicious skill can embed escape
      sequences (hyperlinks, title spoofing, cursor games). Add a Go
      sanitizeMetadata() applied wherever frontmatter is emitted, plus a lint
      check `terminal_escape_detected` (severity warning/error) mirroring the
      existing `secret_detected` check. Smallest-effort, highest-value win:
      closes a real injection vector the tool itself introduces.
    evidence: |
      const CSI_RE=/\x1b\[[\x30-\x3f]*[\x20-\x2f]*[\x40-\x7e]/g;
      const OSC_RE=/\x1b\][\s\S]*?(?:\x07|\x1b\\)/g;
      const C1_RE=/[\x80-\x9f]/g;  // stripTerminalEscapes() applies all of these.

  - id: I004
    title: "Path-traversal-safe skill name handling (sanitizeName + isSubpathSafe)"
    source: vercel-labs/skills
    commits: []
    files: [src/sanitize.ts, tests/sanitize-name.test.ts, tests/subpath-traversal.test.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/tests/subpath-traversal.test.ts
    discovered: 2026-06-20
    status: candidate
    change_type: additive
    area: "internal/skill path resolution (create, future export/install)"
    effort: S
    impact: medium
    risk: low
    confidence: medium
    dependencies: none
    score: 6
    summary: |
      sanitizeName() lowercases, hyphenates spaces/specials, strips leading/
      trailing dots+hyphens, truncates to 255. isSubpathSafe(base, sub) resolves
      both and asserts the target stays within base — rejecting `..` and absolute
      escapes before any file write.
    application: |
      auto-skill validates the name regex but doesn't defend file operations
      against traversal when a name/subpath comes from outside (today `create`,
      tomorrow `add`/`export` from remote sources — [[I009]]). Add an
      isSubpathSafe() guard before any path join/write so a crafted skill name
      can't write outside `./skills/`.
    evidence: |
      isSubpathSafe(base,sub){ const b=normalize(resolve(base));
      const t=normalize(resolve(join(base,sub)));
      return t.startsWith(b+sep)||t===b; }

  - id: I005
    title: "metadata.internal hidden-skill flag gated by env var"
    source: vercel-labs/skills
    commits: []
    files: [src/frontmatter.ts, src/skills.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/skills.ts
    discovered: 2026-06-20
    status: shortlisted
    change_type: additive
    area: "internal/skill discovery + ls filtering"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      `metadata.internal: true` hides a skill from normal discovery/listing;
      it's only surfaced when INSTALL_INTERNAL_SKILLS=1 (or an explicit
      includeInternal option). Lets authors keep WIP/internal skills in the repo
      without exposing them to agents.
    application: |
      Add a `metadata.internal` flag to auto-skill's model so `ls` (and any future
      export) skips internal skills unless an env/flag opts in. Cheap, useful for
      dogfooding half-written skills in this very repo without polluting the
      agent's discovery listing. `lint` should still validate internal skills.
    evidence: |
      const isInternal = data.metadata?.internal === true;
      if (isInternal && !shouldInstallInternalSkills() && !options?.includeInternal)
        return null;

  - id: I006
    title: "Catalog-layout (depth-2) discovery with shadowing + dedupe"
    source: vercel-labs/skills
    commits: []
    files: [src/skills.ts, tests/nested-container-discovery.test.ts, tests/full-depth-discovery.test.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/skills.ts
    discovered: 2026-06-20
    status: candidate
    change_type: additive
    area: "internal/skill discovery walk"
    effort: M
    impact: medium
    risk: low
    confidence: medium
    dependencies: none
    score: 3
    summary: |
      Discovery walks known container dirs one level deep for the flat layout
      (skills/<name>/SKILL.md) and one extra level for catalog layouts
      (skills/<category>/<name>/SKILL.md). A shallower SKILL.md shadows anything
      nested below it; a seenNames Set dedupes; a recursive fallback (--full-depth)
      runs only when nothing is found.
    application: |
      auto-skill's discovery is a flat scan of `./skills/<name>/`. Adopt the
      depth-2 catalog walk (so skills can be grouped by category), the shadowing
      rule (don't descend past a found SKILL.md), and the seenNames dedupe. Keep
      the depth-2 set scoped to container dirs so the repo root isn't trawled.
    evidence: |
      const deepContainerDirs=new Set(prioritySearchDirs.slice(1));
      for(const dir of prioritySearchDirs){ const walkDeep=deepContainerDirs.has(dir);
      const found=await tryAddSkillAt(childDir); if(found||!walkDeep) continue;
      /* descend one extra level */ }

