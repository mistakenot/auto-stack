profile:
  recorded: 2026-06-20
  project: |
    auto-skill (`auto skill`) is a Go (cobra) CLI in the auto-stack monorepo that
    manages agent skills stored in a project's canonical `./skills/` directory.
    Skills are `SKILL.md` files (directory + SKILL.md) with YAML frontmatter
    (name, description, optional metadata). Today it scaffolds skills from a
    best-practices template (`create`), validates them against a cross-agent
    best-practices schema (`lint` — the core feature), lists them ls-style (`ls`),
    and detects drift between a skill and its source docs via autodoc-style
    hash-freshness links. Docs are authoritative; skills encode distilled versions
    that link back to source docs.
  architecture: |
    Go module github.com/mistakenot/auto-skill (depends on auto-shared). Cobra
    command tree in internal/cli/ (root.go, agents.go, sync.go, update.go).
    Skill model + discovery + validation in internal/skill/skill.go: name regex
    ^[a-z0-9]+(-[a-z0-9]+)*$, name==dir match, secret detection (AKIA / api-key
    / sk- patterns), trigger-phrase regex, weak-opening regex, markdown/side-file
    link resolution, autodoc tag regex [autodoc(id@hash, scopeHash)], token
    budgets (chars/4). Frontmatter parsed with gopkg.in/yaml.v3. CLI resolves a
    project root via --root override (used by tests under .tmp/). Output is JSON
    by default to stdout, diagnostics to stderr; lint returns structured
    diagnostic objects (severity, code, path, field, message, value). CLAUDE.md
    carries an autodoc-generated doc index between marker comments. Discovery is
    a flat scan of `./skills/<name>/SKILL.md` only.
  stack: [Go, Cobra, yaml.v3]
  goals: |
    Near-term: harden the `lint` schema and keep scaffolding/listing fast and
    deterministic. Aspirational (docs/meta_skill.md, docs/requirements.md, and
    the user's stated intent to "build our own version" of an open skills CLI):
    grow toward skill distribution — fetching/installing skills from remote
    sources, exporting/syncing skills into agent-specific discovery paths
    (.claude/skills/, .agents/skills/, etc.), mining skills from session
    history (via auto-etl/CASS), and hybrid search over skills.
  non_goals: |
    Phoning home / usage telemetry — auto-stack is local-first; data stays on the
    user's machine. Heavy runtime dependencies (prefer pure-Go, reuse embedded
    libs). Reimplementing meta_skill's full Rust feature set wholesale; borrow
    patterns selectively. Executable/eval-based skill frontmatter.

