  - id: I008
    title: "Frontmatter field-type validation + reject executable frontmatter"
    source: vercel-labs/skills
    commits: []
    files: [src/frontmatter.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/frontmatter.ts
    discovered: 2026-06-20
    status: shortlisted
    change_type: additive
    area: "internal/skill lint (frontmatter checks)"
    effort: S
    impact: medium
    risk: low
    confidence: medium
    dependencies: none
    score: 6
    summary: |
      Their parser uses a strict `^---\n...\n---` block and explicitly does NOT
      support a `---js` executable variant (eval/RCE risk), then type-checks that
      `name` and `description` are actually strings — because YAML will happily
      parse `name: 123` or `name: true`.
    application: |
      auto-skill uses yaml.v3 (safe), but its checks assert presence, not type.
      Add lint checks: `name`/`description` must be strings (a YAML scalar that
      parses to int/bool is an error, not a silently-coerced value), and reject
      any non-standard executable frontmatter fence. Hardens the core lint schema
      cheaply.
    evidence: |
      "// We intentionally do not support ---js executable frontmatter (eval risk)"
      + explicit `typeof data.name === 'string'` / `typeof data.description === 'string'` guards.

  - id: I009
    title: "Remote skill fetch without full clone (GitHub Trees API + source-parser)"
    source: vercel-labs/skills
    commits: []
    files: [src/source-parser.ts, src/blob.ts, src/git.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/blob.ts
    discovered: 2026-06-20
    status: candidate
    change_type: additive
    area: "new subsystem: `auto skill add <source>`"
    effort: L
    impact: high
    risk: medium
    confidence: medium
    dependencies: "GitHub API (optional token via GITHUB_TOKEN/GH_TOKEN/gh auth token)"
    score: 4
    summary: |
      source-parser.ts normalizes many source formats (owner/repo, full GitHub
      URL, /tree/<branch>/<path> deep links, GitLab, bare git URLs, local paths,
      owner/repo#ref@skill fragments) into one descriptor. blob.ts then fetches a
      skill via the GitHub Trees API (/git/trees/<branch>?recursive=1) with
      branch fallback (ref→main→master→HEAD) and lazy auth (unauthenticated
      first, token only after a 403) — no clone needed. git.ts is the shallow-
      clone fallback for non-GitHub sources, with LFS smudge disabled.
    application: |
      The foundation for "build our own version": `auto skill add <source>`.
      Borrow the source-parser format matrix and the Trees-API fast path so the
      common case (a GitHub repo) costs one API call and zero clones. Pairs with
      [[I004]] (safe extraction) and [[I010]] (lockfile + install).
    evidence: |
      fetchRepoTree(ownerRepo, ref?, getToken?): branches = ref?[ref]:['HEAD','main','master'];
      try unauthenticated, on 403 set _rateLimitedThisSession and retry with getToken().
      findSkillMdPaths(tree) filters tree blobs ending in skill.md by priority dir.

  - id: I010
    title: "Symlink-canonical install model + dual lockfiles with tree-SHA freshness"
    source: vercel-labs/skills
    commits: []
    files: [src/installer.ts, src/skill-lock.ts, src/local-lock.ts, src/update.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/skill-lock.ts
    discovered: 2026-06-20
    status: candidate
    change_type: additive
    area: "new subsystem: install/update + lockfiles"
    effort: L
    impact: high
    risk: medium
    confidence: medium
    dependencies: none
    score: 4
    summary: |
      One canonical copy per skill with relative symlinks into each agent dir
      (copy-mode fallback when symlinks fail). Two lockfiles: a global
      ~/.agents/.skill-lock.json (versioned v3, auto-wiped on old version,
      tracks GitHub tree SHA `skillFolderHash` + timestamps) and a project
      skills-lock.json (checked in, content-hash, timestampless + alphabetized
      to minimize merge conflicts). `update` compares stored tree SHA vs live
      tree SHA — detecting updates with zero content download.
    application: |
      When auto-skill grows install/export, adopt: (1) canonical-store + symlink
      per agent (one source of truth, easy updates) over N copies; (2) a
      merge-friendly checked-in project lock (content hash, no timestamps,
      sorted); (3) tree-SHA-vs-stored-hash freshness — which mirrors auto-skill's
      existing autodoc hash-freshness idea, applied to whole skill folders.
    evidence: |
      update: latestHash=getSkillFolderHashFromTree(tree, entry.skillPath);
      if(latestHash && latestHash!==entry.skillFolderHash) updates.push(...).
      local-lock hash: for(f of files){ h.update(f.relativePath); h.update(f.content); }

