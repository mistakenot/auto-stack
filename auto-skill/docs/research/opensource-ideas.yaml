  - id: I012
    title: "`use` command — run a skill as a prompt without installing"
    source: vercel-labs/skills
    commits: []
    files: [src/use.ts, src/find.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/use.ts
    discovered: 2026-06-20
    status: candidate
    change_type: additive
    area: "new command: `auto skill use`"
    effort: M
    impact: medium
    risk: low
    confidence: medium
    dependencies: none
    score: 4
    summary: |
      `skills use <source>@<skill>` resolves a skill, materializes its files to a
      temp dir, and prints a wrapped prompt (<SKILL.md>...</SKILL.md> + a pointer
      to supporting files) to stdout — pipe into `claude`, or `--agent` launches a
      supported agent interactively. find.ts adds keyword/interactive search
      against a skills.sh API with an agent-friendly non-TTY fallback.
    application: |
      Add `auto skill use <name>` that emits a ready-to-pipe prompt from a LOCAL
      skill (no remote fetch needed for v1) — handy for one-shot use and for
      testing a skill's wording before committing it. The buildUsePrompt wrapper
      is a clean, copyable format.
    evidence: |
      buildUsePrompt: ["You are being given a Skill to execute...",
      "Use the following SKILL.md as your instructions:",
      `<SKILL.md>\n${skillMd}\n</SKILL.md>`].join('\n\n').

  - id: I013
