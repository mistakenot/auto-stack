ideas:
  # Baseline snapshot of vercel-labs/skills @ e5c075e. All ideas discovered together.
  - id: I001
    title: "Agent registry + multi-agent skill export/sync"
    source: vercel-labs/skills
    commits: []
    files: [src/agents.ts, src/installer.ts]
    permalink: https://github.com/vercel-labs/skills/blob/e5c075e3a84b37c5eb398ab74e581558d3fceb0e/src/agents.ts
    discovered: 2026-06-20
    status: shortlisted
    change_type: additive
    area: "new subsystem: agent registry + `auto skill sync/export`"
    effort: L
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 4
    summary: |
      A flat `Record<AgentType, AgentConfig>` maps ~70 agents to their project
      skillsDir (e.g. .claude/skills) and globalSkillsDir, plus a detectInstalled()
      probe. Many agents share `.agents/skills`; some are project-only
      (globalSkillsDir undefined). The installer writes a canonical copy and
      exports it into each selected agent's directory.
    application: |
      This is auto-skill's documented "future concern" (requirements.md: syncing/
      exporting to agent paths). Add a Go registry (struct AgentConfig{Name,
      DisplayName, ProjectDir, GlobalDir}) and an `auto skill sync`/`export`
      command that materializes `./skills/` into selected agent discovery dirs.
      Directly serves the user's "build our own version" goal. See [[I010]] for
      the symlink-canonical install model and [[I002]] for keeping the registry
      a validated single source of truth.
    evidence: |
      agents.ts: `export const agents: Record<AgentType, AgentConfig> = {
        'claude-code': { name:'claude-code', displayName:'Claude Code',
        skillsDir:'.claude/skills', globalSkillsDir: join(claudeHome,'skills'),
        detectInstalled: async () => existsSync(claudeHome) }, ... }`
    notes: |
      Big rock (L). The headline strategic item; ranks below the quick wins by
      impact-to-effort but is the heart of a distribution-capable auto-skill.

