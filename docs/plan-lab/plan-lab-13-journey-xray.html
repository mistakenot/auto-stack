  pop.classList.add('on');
  if(anchor){ const r=anchor.getBoundingClientRect(); const w=pop.offsetWidth, h=pop.offsetHeight;
    let left=Math.min(Math.max(12,r.left),innerWidth-w-12), top=r.bottom+8; if(top+h>innerHeight-12) top=Math.max(12,r.top-h-8);
    pop.style.left=left+'px'; pop.style.top=top+'px'; }
  if(ref.startsWith('G:')){ S.selGoal=ref.slice(2); renderGoals(); renderRail(); }
}
function closePop(){ $('#pop').classList.remove('on'); popStack=[]; if(S.selGoal){S.selGoal=null; renderGoals(); renderRail();} }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-plan],[data-goal],[data-j],[data-pop],[data-jump],[data-crumb],[data-back],[data-close],[data-copy],[data-view],[data-speed],[data-opt],[data-dir],[data-file],[data-sym],[data-pkg],.hit');
  const inPop=e.target.closest('#pop');
  if(!t){ if(!inPop) closePop(); return; }
  const ds=t.dataset;
  if(ds.plan){ setPlan(ds.plan); return; }
  if(ds.goal){ if(S.selGoal===ds.goal){closePop();return;} openPop('G:'+ds.goal,t); return; }
  if(ds.j!=null&&t.classList.contains('jcard')){ setJourney(+ds.j); return; }
  if(ds.pop){ openPop(ds.pop,inPop?null:t,!!inPop); return; }
  if(ds.jump!=null){ closePop(); setJourney(+ds.jump); return; }
  if(ds.crumb!=null){ const k=+ds.crumb; const ref=popStack[k]; popStack=popStack.slice(0,k); openPop(ref,null,popStack.length>0); return; }
  if(ds.back){ popStack.pop(); const ref=popStack.pop(); openPop(ref,null,popStack.length>0); return; }
  if(ds.close){ closePop(); return; }
  if(ds.copy){ try{ navigator.clipboard.writeText(ds.copy).then(()=>{t.textContent='copied';setTimeout(()=>t.textContent='copy',1200)},()=>{t.textContent='select ↓'}); }catch(err){ t.textContent='select ↓'; } return; }
  if(ds.view){ stop(); S.view=ds.view; S.i=0; S.q=null; renderJHead(); renderFrame(); writeHash(); return; }
  if(ds.speed){ S.speed=+ds.speed; store.set('speed',S.speed); renderTL(); if(S.playing) schedule(); return; }
  if(ds.opt!=null){ answer(+ds.opt); return; }
  if(ds.dir){ const cur0=t.querySelector('.caret'); const open=cur0?cur0.textContent==='▾':false; S.treeOpen[ds.dir]=ds.dir.endsWith('#more')?!S.treeOpen[ds.dir]:!open; renderTree(); return; }
  if(ds.sym||ds.file||ds.pkg){ // lens → jump to next frame touching it
    const cols=columns(), n=cols.length; const match=f=>ds.sym?f.file+'#'+f.symbol===ds.sym:ds.file?f.file===ds.file:f.pkg===ds.pkg;
    if(quizOn()) return;
    for(let k=1;k<=n;k++){ const ci=(S.i+k)%n; if(trackIdx().some(tt=>{const f=frameAt(cols[ci],tt);return f&&match(f);})){ stop(); go(ci); return; } }
    return; }
  if(t.classList.contains('hit')){ if(quizOn()) return; stop(); go(+ds.col); return; }
});
document.addEventListener('mouseover',e=>{
  const h=e.target.closest('.hit'); const tip=$('#tip');
  if(h){ const f=frameAt(columns()[+h.dataset.col],+h.dataset.t); if(f){ tip.innerHTML=`<b>${esc(f.symbol)}</b> · ${esc(f.layer)}<br>${esc(f.file)}<br><span style="color:var(--ink)">${tick(f.does)}</span>${f.effect?`<br><span style="color:var(--mint)">${tick(f.effect)}</span>`:''}`; tip.style.display='block'; } }
  else tip.style.display='none';
  const d=e.target.closest('.dn'); document.querySelectorAll('.dn.hov').forEach(x=>x.classList.remove('hov')); if(d) d.classList.add('hov');
});
document.addEventListener('mousemove',e=>{ const tip=$('#tip'); if(tip.style.display==='block'){ tip.style.left=Math.min(e.clientX+14,innerWidth-370)+'px'; tip.style.top=(e.clientY+16)+'px'; } });
$('#bPlay').onclick=()=>S.playing?stop():play();
$('#bNext').onclick=()=>{stop();step(1)};
$('#bPrev').onclick=()=>{stop();S.q=null;go(S.i-1)};
$('#bFirst').onclick=()=>{stop();S.q=null;go(0)};
$('#bLast').onclick=()=>{stop(); if(quizOn()) return; go(columns().length-1)};
$('#bQuiz').onclick=()=>toggleQuiz();
function toggleQuiz(){ stop(); S.quiz=!S.quiz; S.q=null; if(S.quiz){ S.score={r:0,t:0}; S.answered={}; if(J().tracks.length>1&&S.view==='both') S.view='b'; S.i=0; } renderRail(); renderJHead(); renderFrame(); }
$('#helpBtn').onclick=e=>{ const pop=$('#pop'); popStack=['help']; pop.innerHTML=`<div class="crumb">keyboard<button class="x" data-close="1">✕</button></div><h3>Drive the x-ray</h3>
  <div class="gwt" style="grid-template-columns:90px 1fr"><b><span class="kbd">Space</span></b><span>play / pause</span><b><span class="kbd">←</span> <span class="kbd">→</span></b><span>step a frame</span><b><span class="kbd">Home</span> <span class="kbd">End</span></b><span>first / last frame</span><b><span class="kbd">[</span> <span class="kbd">]</span></b><span>previous / next journey</span><b><span class="kbd">P</span></b><span>predict mode — guess where the call goes next</span><b><span class="kbd">1</span>–<span class="kbd">4</span></b><span>answer</span><b><span class="kbd">B</span></b><span>cycle before ⇄ after on a paired journey</span><b><span class="kbd">Esc</span></b><span>close a card</span></div>
  <p class="desc" style="margin-top:10px">Click any node, file, symbol or package to jump to the next frame that touches it. Goals, ACs and decisions open as cards you can drill through.</p>`;
  pop.classList.add('on'); const r=e.target.getBoundingClientRect(); pop.style.left=Math.max(12,r.right-pop.offsetWidth)+'px'; pop.style.top=(r.bottom+8)+'px'; };
// scrubber drag
(function(){ const sc=$('#scrub'); let drag=false;
  const at=e=>{ const r=sc.getBoundingClientRect(); const n=columns().length; const u=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); return Math.round(u*(n-1)); };
  sc.addEventListener('pointerdown',e=>{ if(quizOn()) return; drag=true; sc.setPointerCapture(e.pointerId); stop(); go(at(e)); });
  sc.addEventListener('pointermove',e=>{ if(drag){ const i=at(e); if(i!==S.i) go(i); } });
  sc.addEventListener('pointerup',()=>drag=false);
})();
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  if(e.key==='Escape'){ closePop(); return; }
  if(e.key===' '){ e.preventDefault(); S.playing?stop():play(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); stop(); step(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); stop(); S.q=null; go(S.i-1); }
  else if(e.key==='Home'){ stop(); S.q=null; go(0); }
  else if(e.key==='End'){ stop(); if(!quizOn()) go(columns().length-1); }
  else if(e.key===']'){ setJourney((S.j+1)%cur().J.length); }
  else if(e.key==='['){ setJourney((S.j-1+cur().J.length)%cur().J.length); }
  else if(e.key==='p'||e.key==='P'){ toggleQuiz(); }
  else if((e.key==='b'||e.key==='B')&&J().tracks.length>1){ const order=S.quiz?['a','b']:['a','both','b']; S.view=order[(order.indexOf(S.view)+1)%order.length]; S.i=0; S.q=null; renderJHead(); renderFrame(); }
  else if(/^[1-4]$/.test(e.key)&&S.q){ answer(+e.key-1); }
});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ renderFilm(); renderDeps(); },120); });
addEventListener('hashchange',()=>{ const p=S.plan, j=S.j; readHash(); if(S.plan!==p){depLayoutKey=null;} if(S.plan!==p||S.j!==j) renderAll(); else renderFrame(); });

readHash(); renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ renderFilm(); renderDeps(); });
})();
</script>
