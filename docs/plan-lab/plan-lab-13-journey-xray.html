<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey X-Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b10; --film:#0b1219; --film2:#0e1720; --panel:#0c131b; --line:#1b2833; --line2:#243542;
  --ink:#d9e6ee; --ink2:#9fb0bd; --ink3:#5f7382; --ink4:#3a4b58;
  --cyan:#6fe6ff; --cyanD:#1f6d80; --amber:#ffb85c; --amberD:#6e4a1d; --bone:#b9c4cc; --boneD:#4a5864;
  --rust:#ff8a5c; --mint:#7af0b4; --red:#ff5f6d; --violet:#b69cff;
  --trA:#ff9e64; --trB:#6fe6ff;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans Condensed",system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans);overflow:hidden;
  background-image:radial-gradient(1200px 600px at 55% 40%, #0d1a24 0%, transparent 70%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
code,.mono{font-family:var(--mono)}
.app{display:grid;grid-template-rows:48px auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh}

/* header */
header{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#060a0e}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand h1{margin:0;font:400 25px/1 var(--serif);letter-spacing:.2px}
.brand h1 i{color:var(--cyan);text-shadow:0 0 18px rgba(111,230,255,.45)}
.brand small{font:500 10px var(--mono);color:var(--ink3);letter-spacing:.14em}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:#0a1016}
.seg button{padding:4px 11px;border-radius:999px;font:500 12px var(--mono);color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--ink);color:#061016}
.seg button small{font-size:9.5px;letter-spacing:.1em;opacity:.7;margin-left:5px}
.kind{font:600 10px var(--mono);letter-spacing:.14em;padding:3px 8px;border-radius:4px;white-space:nowrap}
.kind.green{color:var(--cyan);border:1px solid var(--cyanD)}
.kind.brown{color:var(--amber);border:1px solid var(--amberD)}
.legend{margin-left:auto;min-width:0;display:flex;gap:14px;align-items:center;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.legend b{font-weight:600}
.lg-add{color:var(--cyan)} .lg-edit{color:var(--amber)} .lg-same{color:var(--bone)} .lg-del{color:var(--red)}
.helpbtn{width:26px;height:26px;border:1px solid var(--line2);border-radius:50%;font:600 12px var(--mono);color:var(--ink2)}

/* goals */
.goals{display:grid;grid-template-columns:repeat(var(--gn,7),minmax(0,1fr));gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:#080d12}
.goal{text-align:left;padding:7px 10px 8px;border:1px solid var(--line);border-radius:8px;background:#0a1117;display:flex;gap:8px;align-items:flex-start;transition:border-color .2s,background .2s,opacity .2s;min-width:0}
.goal .gl{font:500 18px/1 var(--sans);color:var(--ink3);margin-top:1px}
.goal .gid{font:600 10px var(--mono);color:var(--ink3);letter-spacing:.08em;display:block}
.goal .gt{font:500 12.5px/1.25 var(--sans);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goal .gcov{font:10px var(--mono);color:var(--ink4);margin-top:3px;display:block}
.goal.lit{border-color:var(--cyanD);background:#0b1820}
.goal.lit .gl,.goal.lit .gid{color:var(--cyan)} .goal.lit .gt{color:var(--ink)}
.goal.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.goal:hover{border-color:var(--line2)}

/* main grid */
.main{display:grid;grid-template-columns:238px minmax(0,1fr) 400px;min-height:0}
.rail,.center,.lenses{min-height:0}
.rail{border-right:1px solid var(--line);overflow:auto;padding:12px 12px 20px;background:#080c11}
.center{overflow:auto;padding:12px 18px 24px;position:relative}
.lenses{border-left:1px solid var(--line);display:grid;grid-template-rows:minmax(0,46fr) minmax(0,54fr);grid-template-columns:minmax(0,1fr);min-width:0;background:#080c11}
.hd{font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.hd .g{font-size:13px;letter-spacing:0;color:var(--ink2)}

/* rail */
.jlist{display:flex;flex-direction:column;gap:6px;margin:8px 0 16px}
.jcard{text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 8px 6px;background:#0a1016;transition:border-color .2s,opacity .2s}
.jcard:hover{border-color:var(--line2)}
.jcard.on{border-color:var(--cyan);background:#0b1820;box-shadow:0 0 22px -8px rgba(111,230,255,.5)}
.jcard.dim{opacity:.35}
.jcard .jt{display:flex;gap:6px;align-items:baseline}
.jcard .jid{font:600 10.5px var(--mono);color:var(--cyan);white-space:nowrap}
.jcard .jn{font:11px/1.25 var(--mono);color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jcard.on .jn{color:var(--ink)}
.jcard svg{display:block;margin-top:4px;width:100%;height:26px}
.jcard .mix{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:4px;background:#111b24}
.mix i{display:block}
.planbox{border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--ink2)}
.planbox p{margin:6px 0 8px}
.counts{display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--mono);color:var(--ink3)}
.scorebox{margin-top:12px;font:11px var(--mono);color:var(--ink3)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;background:#0b1117}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.g{color:var(--cyan);border-color:var(--cyanD)}
.chip.ac .box{display:inline-block;width:11px;height:11px;border:1.2px solid currentColor;border-radius:2px;position:relative}.chip.ac .box::after{content:"";position:absolute;left:3px;top:0.5px;width:3px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.chip.ac{color:var(--mint);border-color:#1f5a41}
.chip.d{color:var(--violet);border-color:#3f3470}
.chip.r{color:var(--amber);border-color:var(--amberD)}

/* journey header */
.jhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.jtitle{font:500 15px/1.3 var(--mono);color:var(--ink);word-break:break-word}
.jtitle .glyph{color:var(--cyan);margin-right:6px}
.jtitle .trk{display:block}
.jtitle .trk em{font-style:normal;font:600 10px var(--mono);letter-spacing:.1em;padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}
.jtrig{font:12px var(--sans);color:var(--ink3);margin-top:2px}
.jchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.jmeta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mixline{font:11px var(--mono);color:var(--ink3);white-space:nowrap}

/* caption */
.cap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;margin:10px 0 8px;min-height:112px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:linear-gradient(180deg,#0c151d,#0a1117);position:relative;overflow:hidden}
.cap.two{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:2px;font:10.5px var(--mono);color:var(--ink3);justify-content:flex-end;overflow:hidden}
.stack .hd{margin-bottom:4px}
.stack .bar{height:14px;border-left:2px solid var(--line2);padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#121c26,transparent)}
.stack .bar.top{border-left-color:var(--cyan);color:var(--ink);background:linear-gradient(90deg,#123040,transparent)}
.capmain{min-width:0}
.cl1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:11.5px var(--mono);color:var(--ink3)}
.layerchip{font:600 10px var(--mono);letter-spacing:.12em;padding:2px 6px;border-radius:3px;background:#13212c;color:var(--ink2);text-transform:uppercase}
.cl1 .path b{color:var(--ink);font-weight:500}
.chg{font:600 10.5px var(--mono)}
.chg.add{color:var(--cyan)} .chg.edit{color:var(--amber)} .chg.same{color:var(--bone)}
.symbig{font:500 22px/1.2 var(--mono);color:var(--ink);margin-top:4px;word-break:break-all;text-shadow:0 0 22px rgba(111,230,255,.25)}
.sig{font:11.5px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.does{font:15px/1.3 var(--sans);color:var(--ink2);margin-top:4px}
.effects{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.eff{font:11px var(--mono);color:var(--mint);display:inline-flex;gap:6px;align-items:center}
.eff .t,.ebadge{font:600 9px var(--mono);letter-spacing:.1em;border:1px solid currentColor;border-radius:3px;padding:1px 4px}
.eff.ROW{color:var(--mint)} .eff.FILE{color:var(--amber)} .eff.OUT{color:var(--cyan)} .eff.ERR{color:var(--rust)}
.note{font:11px var(--mono);color:var(--amber)}
.twocap{min-width:0;border-left:3px solid var(--trA);padding-left:10px}
.twocap.b{border-left-color:var(--trB)}
.twocap .symbig{font-size:16px}
.twocap .does{font-size:13px}
.twocap .none{color:var(--ink4);font:12px var(--mono);margin-top:18px}

/* quiz */
.quiz{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.quiz .q{font:400 21px/1.2 var(--serif);color:var(--ink)}
.quiz .q i{color:var(--cyan)}
.quiz .from{font:11.5px var(--mono);color:var(--ink3)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{text-align:left;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:#0c1620;display:flex;gap:8px;align-items:center;min-width:0}
.opt:hover{border-color:var(--cyan)}
.opt .k{font:600 10px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.opt .os{font:500 13px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .of{font:10.5px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.right{border-color:var(--mint);background:#0d2219}
.opt.wrong{border-color:var(--red);background:#2a1016}
.verdict{font:600 12px var(--mono)}
.verdict.ok{color:var(--mint)} .verdict.no{color:var(--red)}

/* film */
.filmwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--film);overflow-x:auto;overflow-y:hidden}
.filmwrap::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);}
#film{display:block}
#film text{font-family:var(--mono)}
.band{fill:#0c141c} .band.alt{fill:#0a1118} .band.idle{opacity:.45}
.bandlbl{font:600 9.5px var(--mono);letter-spacing:.12em;fill:var(--ink3)}
.bandlbl.idle{fill:var(--ink4)}
.slice{stroke:#16222d;stroke-width:1}
.slice.past{stroke:#1a2e3a}
.scan{fill:url(#scanG)}
.seg{fill:none;stroke-width:2;stroke-linecap:round}
.seg.call{stroke:var(--trc,var(--cyan))}
.seg.ret{stroke:var(--trc,var(--cyan));stroke-dasharray:3 4;opacity:.75}
.seg.future{opacity:.16}
.node{stroke-width:2;transition:r .2s}
.node.add{fill:#0b1820;stroke:var(--cyan)} .node.edit{fill:#1d1508;stroke:var(--amber)} .node.same{fill:#11171c;stroke:var(--bone)}
.node.future{opacity:.28}
.node.active{filter:url(#glow)}
.ring{fill:none;stroke:var(--trc,var(--cyan));stroke-width:1.5;opacity:.9}
.nlbl{font-size:10px;fill:var(--ink3)}
.nlbl.past{fill:var(--ink2)} .nlbl.active{fill:var(--ink);font-weight:600} .nlbl.future{fill:var(--ink4)}
.effbadge rect{fill:#0b1117;stroke-width:1}
.effbadge text{font:600 8.5px var(--mono);letter-spacing:.06em}
.effbadge.future{opacity:.22}
.efflink{stroke-dasharray:1 3;stroke-width:1}
.colnum{font-size:9.5px;fill:var(--ink4)} .colnum.active{fill:var(--cyan);font-weight:600}
.divg{fill:rgba(255,158,100,.05)} .divg.b{fill:rgba(111,230,255,.05)}
.forklbl{font:600 9px var(--mono);letter-spacing:.12em}
.pulse{fill:#fff;filter:url(#glow)}
.hit{fill:transparent;cursor:pointer}
.notemark{fill:var(--amber)}

/* timeline */
.tl{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.tbtn{width:32px;height:32px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;color:var(--ink2);background:#0b1218}
.tbtn:hover{border-color:var(--ink3);color:var(--ink)}
.tbtn.play{width:40px;background:var(--ink);color:#061016;border-color:var(--ink)}
.tbtn svg{width:14px;height:14px;fill:currentColor}
.scrub{flex:1;min-width:160px;height:32px;position:relative;cursor:pointer;touch-action:none}
.scrub .trk{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line2);border-radius:2px}
.scrub .fill{position:absolute;left:0;top:15px;height:2px;background:var(--cyan);border-radius:2px;box-shadow:0 0 10px var(--cyan)}
.scrub .tick{position:absolute;top:11px;width:2px;height:10px;background:var(--ink4);margin-left:-1px;border-radius:1px}
.scrub .tick.eff{background:var(--mint);height:12px;top:10px}
.scrub .tick.past{background:var(--ink2)}
.scrub .knob{position:absolute;top:8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan)}
.frameno{font:12px var(--mono);color:var(--ink3);min-width:54px;text-align:right}
.frameno b{color:var(--ink)}
.predict{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font:600 11.5px var(--mono);color:var(--ink2)}
.predict.on{border-color:var(--mint);color:var(--mint);background:#0d2219}
.predict .sc{font-weight:500;color:var(--ink3)}

/* ledger */
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px}
.box{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#0a1016;min-width:0}
.ledger{display:flex;flex-direction:column;gap:3px;margin-top:6px;font:11.5px var(--mono)}
.lrow{display:flex;gap:8px;align-items:baseline;color:var(--ink2);opacity:1;transition:opacity .3s}
.lrow .n{color:var(--ink4);min-width:20px}
.lrow.future{opacity:.22}
.lrow.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:rgba(122,240,180,.18)}to{background:transparent}}
.result{font:11.5px/1.45 var(--mono);color:var(--ink3);white-space:pre-wrap;word-break:break-word;margin-top:6px;transition:color .3s}
.result.done{color:var(--cyan);text-shadow:0 0 14px rgba(111,230,255,.3)}
.result .trkl{font:600 10px var(--mono);letter-spacing:.1em}
.empty{color:var(--ink4);font:11.5px var(--mono)}

/* lenses */
.lens{min-height:0;min-width:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.lens .hd{padding:10px 14px 6px}
.lens .hd .sub{margin-left:auto;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--ink4)}
.tree{overflow-y:auto;overflow-x:hidden;padding:0 8px 12px 10px;font:11.5px/1 var(--mono);flex:1}
.tr{display:flex;align-items:center;gap:6px;height:19px;padding:0 4px;border-radius:4px;white-space:nowrap;color:var(--ink3);cursor:pointer}
.tr:hover{background:#0f1a23}
.tr .ind{flex:none}
.tr .m{width:10px;text-align:center;font-weight:600;flex:none}
.tr .m.add{color:var(--cyan)} .tr .m.edit{color:var(--amber)} .tr .m.same,.tr .m.context{color:var(--ink4)} .tr .m.delete{color:var(--red)}
.tr.dir{color:var(--ink2)}
.tr.dir .caret{color:var(--ink4);width:10px;flex:none}
.tr.file.inj{color:var(--ink)}
.tr.file.act{background:#0f2531;color:#fff}
.tr .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr .fn{margin-left:auto;display:flex;gap:2px;flex:none}
.tr .fn i{font-style:normal;font-size:9px;min-width:14px;height:13px;display:grid;place-items:center;border-radius:3px;background:#122130;color:var(--ink3);padding:0 2px}
.tr .fn i.past{color:var(--ink)} .tr .fn i.cur{background:var(--cyan);color:#061016}
.tr.sym{height:18px;color:var(--ink3)}
.tr.sym .sn{color:var(--ink2);flex:none}
.tr.sym .sg{color:var(--ink4);overflow:hidden;text-overflow:ellipsis;font-size:10.5px;min-width:0;flex:1}
.tr.sym.act{background:linear-gradient(90deg,#123447,#0c1a23 70%);box-shadow:inset 2px 0 0 var(--cyan)}
.tr.sym.act .sn{color:#fff;text-shadow:0 0 12px var(--cyan)}
.tr.sym.actA{box-shadow:inset 2px 0 0 var(--trA);background:linear-gradient(90deg,#3a2415,#0c1a23 70%)}
.tr.more{color:var(--ink4);font-size:10.5px}
.tr.more .mx{margin-left:6px}
.deps{position:relative;overflow:auto;flex:1;padding:4px 10px 16px}
.dgrid{position:relative;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.drank{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 6px;position:relative;z-index:1}
.dn{font:10.5px var(--mono);padding:3px 7px;border-radius:5px;border:1px solid var(--line2);background:#0b1218;color:var(--ink3);white-space:nowrap;cursor:pointer;transition:all .2s}
.dn.add{border-color:var(--cyanD);border-style:solid}
.dn.edit{border-color:var(--amberD)}
.dn.external,.dn.doc,.dn.harness{border-style:dashed}
.dn.inj{color:var(--ink);background:#0f1b25}
.dn.inj.add{color:var(--cyan)} .dn.inj.edit{color:var(--amber)}
.dn.act{box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(111,230,255,.55);background:#0f2a36;color:#fff}
.dn.actA{box-shadow:0 0 0 1px var(--trA),0 0 16px rgba(255,158,100,.5)}
.dn.hov{background:#16242f}
#dsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.de{fill:none;stroke:#1a2733;stroke-width:1}
.de.add{stroke:#1b4552}
.de.inj{stroke:#3a5a6c;stroke-width:1.4}
.de.act{stroke:var(--cyan);stroke-width:2.2;stroke-dasharray:6 5;animation:dash .6s linear infinite;filter:drop-shadow(0 0 4px var(--cyan))}
.de.actA{stroke:var(--trA);stroke-width:2;stroke-dasharray:6 5;animation:dash .6s linear infinite}
.de.implicit{stroke:var(--cyan);stroke-width:1.2;stroke-dasharray:2 4;opacity:.8}
@keyframes dash{to{stroke-dashoffset:-11}}
.forbid{font:10.5px var(--mono);color:var(--ink4);padding:6px 14px 10px;border-top:1px solid var(--line)}
.forbid summary{cursor:pointer;color:var(--ink3)}
.forbid li{margin:4px 0;color:var(--ink3)}
.forbid li b{color:var(--amber);font-weight:500}

/* popover */
#pop{position:fixed;z-index:50;width:min(460px,calc(100vw - 24px));max-height:min(70vh,640px);overflow:auto;background:#0d151d;border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 80px -20px #000,0 0 0 1px #000;padding:14px 16px 16px;display:none}
#pop.on{display:block;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#pop .crumb{display:flex;gap:6px;align-items:center;font:11px var(--mono);color:var(--ink3);margin-bottom:6px}
#pop .crumb button{color:var(--ink2)}
#pop .x{margin-left:auto;font-size:14px;color:var(--ink3)}
#pop h3{margin:2px 0 6px;font:400 22px/1.15 var(--serif)}

ny change to autowatch `Backend` or `hooks.CaptureEnv` allowlist","`--text` output mode"]},"goals":[{"id":"G1","title":"Mail has its own vocabulary, defined before any code.","description":"Mail, Address, Subscription, Delivery and Binding land in the glossary first, then the same words are used in schema, events, CLI and commits. Nothing in mail is called a Message, which already names a Session exchange.","sources":["plan goal 1","rail G16","epic D-4"]},{"id":"G2","title":"Agents on one host can send each other mail that waits.","description":"Subscribe, send, list, ack work with no daemon running. Mail sent before anyone subscribes still reaches the later subscriber. Addresses are free-form names with no physical identity in them.","sources":["plan goal 5","C1","rail G5","rail G6","epic D-9","epic D-11"]},{"id":"G3","title":"A busy agent is told it has mail at almost no cost.","description":"The existing PostToolUse hook tells the agent it has mail. The no-mail path costs one stat, never opens the store, and can never stall or break the hook.","sources":["plan goal 7","rail G8","D-062-3","D-062-9"]},{"id":"G4","title":"Delivery is honest: explicit ack, at-least-once, one winner.","description":"Reading never retires mail. Each subscription has its own delivery state, filled lazily from a cursor. Concurrent acks resolve to exactly one winner, and losers are told. No ordering or exactly-once is promised.","sources":["plan goal 6","rail G2","rail G3","rail G4","rail G13","epic D-7","epic D-10"]},{"id":"G5","title":"The store is an append-only log that is safe to wipe.","description":"An event log is the authority; projections update in the same transaction and mail rows never change. The `alpha` marker is in the event types and the filename, and `reset` is a supported operation.","sources":["plan goal 4","rail G1","rail G10","epic D-1","epic D-2"]},{"id":"G6","title":"Only the mail client can reach the store.","description":"`mail.Client` is the one API; the store is internal, so the Go compiler enforces the boundary. A contract suite pins the seam so a second (RPC) client is a new test target, not a redesign.","sources":["plan goal 3","plan goal 2","rail G11","D-062-5","D-062-8"]},{"id":"G7","title":"A real two-agent harness run is the final verdict.","description":"A one-container `mail-flow` scenario runs the real binary through the C1 loop, the nudge and the ack. Existing scenarios and `make check`/`make test` stay green — nothing shipped breaks.","sources":["plan goal 8","plan goal 9","rail G15","D-062-1"]}],"acs":[{"id":"AC1","goal":"G1","title":"The glossary defines the five mail terms, and code avoids `message`.","given":"a glossary with no mail vocabulary","when":"it is updated as the first change, before any Go file","then":"Mail, Address, Subscription, Delivery, Binding exist with _Avoid_/_Has_; `glossary.py check` passes; no mail entity is named `message`","detail":"Defines Mail, Address, Subscription, Delivery and Binding, each with a definition and an _Avoid_ line; _Has_ relations resolve; `glossary.py check` exits 0; ER block refreshed by `glossary.py diagram --write`, not hand-edited; Mail's _Avoid_ lists message and no schema table, event type, Go identifier, CLI noun or JSON field names the stored unit `message` (`--message` stays the body flag); frontmatter summary names the five terms and `auto doc fixed` keeps freshness green.","verify":{"kind":"go-test","cmd":"python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md && cd auto-mail && go test ./mail -run 'TestNoMessageEntity|TestSchemaAndEventTypesUseTheMailVocabulary' -v","tests":["auto-mail/mail/mail_test.go:TestNoMessageEntity","auto-mail/mail/mail_test.go:TestSchemaAndEventTypesUseTheMailVocabulary"]},"verifyNote":"\"Before any code\" is a commit-order property; the squash merge hides it, so ordering is manual (PR history).","decisions":["D10"],"phases":["P1"],"rails":["R12"],"source":"AC-1"},{"id":"AC2","goal":"G2","title":"The C1 transcript runs verbatim with JSON-only stdout.","given":"an initialised store and two workspaces on one host","when":"subscribe, send, list, ack, list run in order","then":"each prints the documented JSON on stdout only; ids round-trip; `from` follows the three-rung ladder","detail":"subscribe → {address, subscription:\"sub_…\", backfilled}; send → {id:<ULID>, to, subscriptions, bound}; list → [{id, from, sentAt, body}]; ack → {id, acked:true, wonTransition:true}; list again → []. Diagnostics on stderr. `from`: --from wins; else a subscription bound to the caller (lowest id); else `<projectId>/agent` or `unregistered/agent`.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run 'TestC1Loop|TestFromLadder' -v && go test ./internal/store -run TestFromAddressLadderFollowsTheLogNotTheID","tests":["auto-mail/internal/cli/cli_test.go:TestC1Loop","auto-mail/internal/cli/cli_test.go:TestFromLadder","auto-mail/internal/store/store_test.go:TestFromAddressLadderFollowsTheLogNotTheID","harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked"]},"decisions":["D16"],"phases":["P1","P2"],"source":"AC-2"},{"id":"AC3","goal":"G5","title":"Mail rows and events never change; state changes are new events.","given":"a mail row and its `alpha.mail.sent` event","when":"the mail is listed and then acked","then":"prior rows are byte-identical; the ack is a new `alpha.mail.acked` row; triggers abort UPDATE/DELETE","detail":"Full row snapshots of `mail` and `events` are identical before/after; the state change is an appended `alpha.mail.acked`; the insert path is the only write path to `events` (source check plus SQLite triggers raising on UPDATE or DELETE).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/store -run 'TestEventLogIsAppendOnly|TestMailRowIsImmutable|TestListAndAckLeaveMailAndEventsByteIdentical' -v","tests":["auto-mail/internal/store/store_test.go:TestEventLogIsAppendOnly", ation"]},"decisions":["D7","D13"],"phases":["P2","P5"],"rails":["R10"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"At-least-once and unordered is documented; re-acks are idempotent.","given":"`auto mail docs` and `auto-mail/CLAUDE.md`","when":"a delivery is acked twice, or the same id is listed twice","then":"docs state at-least-once/unordered/idempotent; re-ack appends nothing and reports `wonTransition:false`","detail":"Duplicate delivery is simulated at the client boundary (a Client decorator repeating one List entry), never by a second `deliveries` row, which the PK forbids. No test asserts ordering.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract","tests":["auto-mail/conformance/conformance_test.go:TestDirectClientConformance","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheDeliveryContract"]},"phases":["P4","P5"],"rails":["R4"],"source":"AC-7"},{"id":"AC8","goal":"G2","title":"Addresses are free-form and carry no physical identity.","given":"address validation and a sender with TMUX/NTM env set","when":"`auto-web/bugs` is sent to","then":"`/` is accepted and never normalised; no host/session/pane id appears in the mail row","detail":"Validation rejects only empty, whitespace-padded, control-character and over-length values, each with a remediation. Physical context lives only on `bindings` as an opaque (manager, target) pair — no typed `tmux_pane_id` column.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v","tests":["auto-mail/mail/mail_test.go:TestValidateAddressIsPermissive","auto-mail/mail/mail_test.go:TestBindingLadder","auto-mail/mail/mail_test.go:TestNoPhysicalIdentityInStoredMail","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_addresses_carry_no_physical_identity"]},"decisions":["D2","D15"],"phases":["P2","P3"],"rails":["R5"],"source":"AC-8"},{"id":"AC9","goal":"G2","title":"Sending to nobody persists and reports both counts.","given":"an address nobody has subscribed to","when":"`auto mail send --to <address>` runs","then":"exit 0, mail persisted, `subscriptions:0, bound:0`, typo hint on stderr; a later subscriber receives it","detail":"With a subscription but no binding row, payload is `subscriptions:1, bound:0` — in T1 `bound` counts binding rows, not liveness (D-062-2).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'","tests":["auto-mail/internal/cli/cli_test.go:TestSendWithNoSubscriptionPersists","auto-mail/internal/store/store_test.go:TestSubscriptionsAndBoundDiverge","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber"]},"decisions":["D2","D15"],"phases":["P4"],"rails":["R6"],"source":"AC-9"},{"id":"AC10","goal":"G3","title":"The hook nudge costs one stat and can never break the hook.","given":"any mailbox state and a PostToolUse payload","when":"`auto hooks fire --agent claude` runs","then":"zero store opens on both paths; one `hookSpecificOutput` naming `auto mail list` when mail waits; exit 0 always","detail":"Zero opens asserted with a counting store-opener over the package var; stats at most one path. A host that never ran `auto mail init` gets no `alpha-store.db`. Nudge only on PostToolUse; with a matching hint rule both fragments share one emission. Absent, unreadable, locked or corrupt store → exit 0, no malformed stdout, bounded time.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHealsItself' -v && cd ../auto-cli && go test ./cmd/auto -run 'TestFire(NudgesOnlyWhenMailIsWaiting|NudgeCarriesNoMailboxContent|NudgesOnPostToolUseOnly|EmitsOneObjectWhenMailAndHintBothMatch|SurvivesABrokenMailDirectory|CreatesNoMailStore)|TestEmitAdditionalContextWritesAtMostOneObject' -v","tests":["auto-mail/mail/mail_test.go:TestHasPendingOpensNoStore","auto-mail/mail/mail_test.go:TestNudgeTextCarriesNoMailboxContent","auto-mail/mail/mail_test.go:TestPendingFlagLifecycle","auto-mail/mail/mail_test.go:TestFalsePositiveFlagHealsItself","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnlyWhenMailIsWaiting","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgeCarriesNoMailboxContent","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnPostToolUseOnly","auto-cli/cmd/auto/hooksmail_test.go:TestFireEmitsOneObjectWhenMailAndHintBothMatch","auto-cli/cmd/auto/hooksmail_test.go:TestFireSurvivesABrokenMailDirectory","auto-cli/cmd/auto/hooksmail_test.go:TestFireCreatesNoMailStore","auto-cli/cmd/auto/hints_test.go:TestEmitAdditionalContextWritesAtMostOneObject","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail","harness/tests/mail_flow/test_mail_loop.py:test_hook_fire_never_breaks_the_agent","harness/tests/mail_flow/test_mail_loop.py:test_hook_creates_no_store_on_a_host_that_never_ran_init"]},"decisions":["D3","D6","D9","D2"],"phases":["P3"],"rails":["R7"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"`alpha` is in event types and filename, and reset works.","given":"the store","when":"its path, events and `reset` are inspected","then":"path is `~/.auto/mail/alpha-store.db`; types are exactly the four `alpha.mail.*`; envelopes carry `version`; reset wipes and the tool works again","detail":"T1 vocabulary: `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — every type prefixed and these four the complete set. `auto mail reset` reports what it removed. `auto mail docs` states: no upcasters, no migrations, no compatibility guarantee, may be wiped on upgrade.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/store -run 'TestEveryEnvelopeCarriesAVersion|TestAppendRejectsAnEventOutsideTheAlphaNamespace' -v && go test ./internal/cli -run 'TestInitCreatesAlphaStore|TestReset|TestDocsStatesTheAlphaContract' -v && go test ./mail -run 'TestResetWipesTheAlphaStore|TestSchemaAndEventTypesUseTheMailVocabulary'","tests":["auto-mail/internal/store/store_test.go:TestEveryEnvelopeCarriesAVersion","auto-mail/internal/store/store_test.go:TestAppendRejectsAnEventOutsideTheAlphaNamespace","auto-mail/internal/cli/cli_test.go:TestInitCreatesAlphaStore","auto-mail/internal/cli/cli_test.go:TestResetWipesTheStoreAndTheC1LoopRunsAgain","auto-mail/internal/cli/cli_test.go:TestResetOnAFreshHostRemovesNothing","auto-mail/internal/cli/cli_test.go:TestResetRecoversAStoreWrittenByAnotherSchema","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheAlphaContract","auto-mail/mail/mail_test.go:TestResetWipesTheAlphaStore","harness/tests/mail_flow/test_mail_loop.py:test_store_carries_the_alpha_marker_in_its_filename"]},"decisions":["D4","D12"],"phases":["P1","P5"],"rails":["R8"],"source":"AC-11"},{"id":"AC12","goal":"G6","title":"Nothing outside the mail store package opens the mail store.","given":"the whole repository","when":"a guard test walks every module, the harness and `skills/`","then":"no file outside `auto-mail/internal/store` both names the mail store and opens a DB; no outside import of `auto-mail/internal/…`","detail":"Scoped to the mail store, not SQLite in general (auto-watch and auto-search legitimately import `modernc.org/sqlite`). The internal-import half is already a compile-time guarantee; the test is a regression guard. `auto-cli` reaches mail only through `auto-mail/mail`. Failure names the file and says \"go through mail.Client\".","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v","tests":["auto-mail/conformance/seam_test.go:TestNothingOutsideTheMailPackageOpensTheStore"]},"decisions":["D8","D5"],"phases":["P5"],"rails":["R9"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"The whole loop passes end to end in the harness.","given":"`uv run harness mail-flow up` from `harness/`","when":"`uv run pytest tests/mail_flow -v` runs","then":"one container, one host id, two workspaces; the C1 loop, nudge, ack and send-before-subscribe pass against the real binary","detail":"`check_ready()` fails fast if the store is uninitialised or a workspace unregistered. Bounded retry on observable outcomes, no sleep-to-settle, no count assertions duplicates would break. Registered in `SCENARIOS`; no existing scenario changed. `make check`, `make test`, `make test-race` green with auto-mail in `RACE_PROJECTS`.","verify":{"kind":"harness","cmd":"cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race","tests":["harness/tests/mail_flow/test_mail_loop.py:test_single_host_two_registered_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_list_is_empty_json_from_both_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_docs_are_discoverable_from_a_workspace","harness/tests/mail_flow/test_mail_loop.py:test_init_is_idempotent","harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber","harness/tests/mail_flow/test_mail_loop.py:test_from_now_opts_out_of_the_backlog","harness/tests/mail_flow/test_mail_loop.py:test_broadcast_gives_each_subscription_its_own_ack_state","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail"]},"verifyNote":"Harness is not in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One client interface is the only API. A skill or hook running sqlite3 against the store would freeze the schema.","ac":"AC12","goal":"G6","source":"G11"},{"id":"R10","title":"Ack transitions exactly once and reports whether it won","text":"Ack is a conditional update inside the append transaction; a loser is told, never silently treated as success.","ac":"AC6","goal":"G4","source":"G13"},{"id":"R11","title":"Done means it passes end to end in the harness","text":"A harness scenario running the real binary is the verdict; bounded retry, and missing seams are findings, not workarounds.","ac":"AC13","goal":"G7","source":"G15"},{"id":"R12","title":"The ontology lands before the code","text":"Canonical terms go into the glossary first, then the same word is used in every surface.","ac":"AC1","goal":"G1","source":"G16"}],"phases":[{"id":"P1","title":"Ontology, module skeleton, and the scenario comes up","summary":"Glossary first; `auto mail init/docs/list` on a minimal store; mounted in `auto`; `mail-flow` scenario green.","dependsOn":[],"goals":["G1","G6","G7"],"acs":["AC1","AC11","AC13"],"files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","harness/tests/m l/ulid/ulid_test.go`, `auto-mail/mail/export_test.go`.","`cli_test.go` imports `auto-mail/internal/store` (test-only, inside the module — allowed by the internal rule).","Seam guard flags a file only if it both names the mail store (alpha-store.db, alpha-flags, .auto/mail) AND contains a DB opener (sqlite, database/sql, sql.Open, sqlite3) — matches the T7 resolution.","Glossary Binding definition dropped \"and liveness\" from the plan's draft wording — consistent with D-062-2 (no liveness in T1).","Old plan ids G1–G16 are guard rails; renamed R1–R12 here (source keeps the epic id). Goals G1–G7 are new clusters.","Epic decisions D-1, D-2, D-4, D-7, D-9, D-10, D-11 are included as D10–D16 (by: epic); D-3, D-5 (superseded), D-6, D-8, D-12, D-13 are referenced only via out-of-scope."]}</script>
<script type="application/json" id="model-052">{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8","F3","F11"]}],"acs":[{"id":"AC1","goal":"G1","title":"gap list surfaces reported gaps","given":"feedback events carrying a `gap`","when":"`auto reflect gap list`","then":"JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted","detail":"Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSurfacesGaps","auto-reflect/internal/cli/gap_integration_test.go:TestGapListOmitsGaplessFeedback"]},"decisions":["D1","D14"],"phases":["P5"],"source":"AC-1"},{"id":"AC2","goal":"G1","title":"gap list obeys list conventions","given":"gaps across sessions and times","when":"`gap list` unfiltered, or with a time filter","then":"all gaps unfiltered; `--since/--after/--before` filter; empty state is `[]`; text mode works","detail":"Given gaps spanning multiple sessions/domains/times, when I run gap list with no filters, then all gaps are returned; and --since/--after/--before and --domain filter correctly (one filter mode at a time), input normalized, JSON by default with --format text available.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapList(SinceFilter|EmptyReturnsArray|TextFormat|DomainUnsupported)'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSinceFilter","auto-reflect/internal/cli/gap_integration_test.go:TestGapListEmptyReturnsArray","auto-reflect/internal/cli/gap_integration_test.go:TestGapListTextFormat","auto-reflect/internal/cli/gap_integration_test.go:TestGapListDomainUnsupported"]},"decisions":["D14"],"phases":["P5"],"source":"AC-2"},{"id":"AC3","goal":"G2","title":"One pending count, two callers agree","given":"an ETL fixture with non-canonical session remotes","when":"`miner status` and `stats` run on it","then":"`pending` == `pending_to_mine`; both from `miner.PendingCount`","detail":"Given any repo + ETL state, when I run `auto reflect miner status` and `auto reflect stats`, then pending == pending_to_mine (both computed by one shared function), and the counted universe is documented. A unit test pins them equal on a fixture where they previously diverged.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestMinerStatusPendingMatchesStats|TestMinerStatusCoveragePctNullWhenNoInScopeSessions'","tests":["auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusPendingMatchesStats","auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusCoveragePctNullWhenNoInScopeSessions"]},"decisions":["D13"],"phases":["P4"],"source":"AC-3"},{"id":"AC4","goal":"G3","title":"Mutations expose a top-level id","given":"the uniform output envelope","when":"`observation add`, `rule create/edit/promote/retire/graduate`, `consolidate`","then":"id(s) at `.id` / `.ids`, never null or only nested","detail":"Given the uniform output envelope, when I run an id-minting / entity mutation (observation add, rule create/edit/promote/retire/graduate, consolidate), then the relevant id(s) are reachable at a predictable top-level path (.id for single, .ids for many), never null and never only nested. (feedback echoes the feedback ids it acted on as ids; rebuild carries counts only.)","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestObservationAddExposesTopLevelID|TestConsolidateDeterministicIDs'","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddExposesTopLevelID","auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs"]},"decisions":["D3","D5","D7"],"phases":["P1","P2","P3"],"source":"AC-4"},{"id":"AC5","goal":"G3","title":"Collection rows expose `.id` without data loss","given":"`retrieve`, `select`, `rule list`, `observation list`, `events list`, `gap list`","when":"their JSON is parsed","then":"each row id at a uniform path; prior fields kept; skill refs + quickstart updated","detail":"Given the envelope migration of retrieve, select, rule list, observation list, events list, gap list, when I parse their JSON, then each element's id is reachable at a uniform path (.[].id or .results[].id), every field present before the change is still present, and the reflect-playbook skill refs + quickstart are updated to the new paths.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestObservationListElementsCarryID && go test ./cmd/autoreflect -run TestE2ELoopQuickstart","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationListElementsCarryID","auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart"]},"decisions":["D7"],"phases":["P1","P3"],"source":"AC-5"},{"id":"AC6","goal":"G4","title":"Consolidate is deterministic and idempotent","given":"one consolidation delta document","when":"`consolidate --dry-run` then `consolidate`, then apply again","then":"same rule id in both runs; second apply adds no duplicate","detail":"Given one consolidation delta document, when I run consolidate --dry-run and then consolidate (separate invocations), then the rule id is identical across both; and re-running the same consolidate a second time is a no-op (no duplicate rule) because the content-derived id already exists.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestConsolidateDeterministicIDs|TestObservationAddIsIdempotent' && go test ./internal/idhash","tests":["auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs","auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddIsIdempotent","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDeterministic"]},"decisions":["D4","D8","D9"],"phases":["P1","P2"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"Ids keep their format","given":"content-derived minting","when":"rule / observation ids are generated","then":"still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; validators unchanged","detail":"Given content-derived minting, when rule/observation ids are generated, then they still match ^r-[0-9a-f]{8}$ / ^ob-[0-9a-f]{8}$; existing validators are unchanged; events already on disk keep their original ids.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/idhash ./internal/observations -run 'TestDerive|TestNewObservationIDFormat|TestCanonicalPartsDeriveStableID'","tests":["auto-reflect/internal/idhash/idhash_test.go:TestDeriveFormat","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDifferentPartsDifferentID","auto-reflect/internal/observations/model_test.go:TestNewObservationIDFormat","auto-reflect/internal/observations/model_test.go:TestCanonicalPartsDeriveStableID"]},"decisions":["D6"],"phases":["P1","P2"],"source":"AC-7"},{"id":"AC8","goal":"G6","title":"init writes an idempotent .gitignore","given":"a repo","when":"`auto reflect init` runs (twice)","then":"`.auto/reflect/.gitignore` ignores `playbook.json`, not `events/`; not rewritten","detail":"Given a repo, when I run auto reflect init (or init --project), then .auto/reflect/.gitignore exists and ignores playbook.json (not events/); running init again does not overwrite or duplicate it.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestInitWritesStateGitignore|TestInitGitignoreIdempotent'","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore","auto-reflect/internal/cli/init_test.go:TestInitGitignoreIdempotent"]},"decisions":["D2","D10"],"phases":["P7"],"source":"AC-8"},{"id":"AC9","goal":"G6","title":"Canonical events tracked, cache ignored","given":"the repo's own `.auto/reflect/`","when":"git status is checked after init","then":"`events/*.jsonl` committable; `playbook.json` untracked","detail":"Given the repo's own .auto/reflect/, when I check git status after init, then .auto/reflect/events/*.jsonl is tracked/committable and playbook.json is untracked (removed from the index with git rm --cached if previously tracked).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestInitWritesStateGitignore && git ls-files .auto/reflect","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore"]},"decisions":["D2"],"phases":["P7"],"source":"AC-9"},{"id":"AC10","goal":"G6","title":"doctor detects stale or partial state","given":"missing `events/`, stale snapshot, or legacy `feedback.jsonl`","when":"`auto reflect doctor`","then":"JSON `[{check,status,message,hint}]`; hints on failures; exit 1 on any fail","detail":"Given a partial reflect state (e.g. state dir present but events/ missing, or playbook.json stale vs the folded event log), when I run auto reflect doctor, then it returns structured JSON [{check,status,message,hint}], each failure carries a concrete remediation hint, and the process exits non-zero on any fail.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestDoctor","tests":["auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorHealthyAllPass","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorMissingEventsFails","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorStaleSnapshotWarns","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorLegacyFeedbackWarns"]},"decisions":["D11"],"phases":["P6"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"Rule listings carry timestamps","given":"a folded rule with timestamps set by `Fold`","when":"`rule list` and `rule get`","then":"both expose non-empty `created_at` / `updated_at`","detail":"Given a folded rule with created_at/updated_at set by Fold, when I run auto reflect rule list and rule get, then both expose non-empty created_at/updated_at (list no longer drops them in its projection map).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/rules -run TestFoldSurfacesTimestampsForListView","tests":["auto-reflect/internal/rules/projection_test.go:TestFoldSurfacesTimestampsForListView"]},"decisions":["D12"],"phases":["P3"],"source":"AC-11"},{"id":"AC12","goal":"G7","title":"outcome enum and correction_density documented","given":"the docs","when":"a reader consults quickstart and skill references","then":"`outcome` enum (distinct from ack status) and `correction_density` definition + scale are documented","detail":"Given the docs, when a reader consults quickstart and the reflect-playbook references, then the feedback outcome enum (success|partial|fail|abandoned, distinct from miner ack status) and correction_density (definition + scale) are documented; a malformed outcome error already names the valid set.","verify":{"kind":"manual","cmd":"auto reflect quickstart | grep -E 'abandoned|correction_density'; grep -n correction_density skills/reflect-playbook/references/mine.md","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"Legacy yaml removed","given":"the superseded process artifacts","when":"the task lands","then":"`docs/reflection/observations.yaml` deleted; only retired `playbook-*` skills referenced it","detail":"Given the superseded process artifacts, when the task lands, then docs/reflection/observations.yaml is deleted and the reflect-playbook 'supersedes' note reflects the removal. The only remaining referencers are the already-superseded playbook-observe/-refine/-search skills (no Go code reads the file); per F11 a future run would regenerate an empty file — the discard is intended.","verify":{"kind":"manual","cmd":"git ls-tree 34d1d22 docs/reflection/observations.yaml  # expect empty; git grep -n 'observations.yaml' 34d1d22 -- '*.go'","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-13"},{"id":"AC14","goal":"G1","title":"No regressions; the e2e loop runs through gap list","given":"all changes","when":"`go build ./...` and the full auto-reflect suite run","then":"all green with assertions moved to the new envelope; loop completes through `gap list`","detail":"Given all changes, when I run go build ./... and the full auto-reflect test suite, then everything builds and passes (existing assertions updated to the new envelope), and the end-to-end reflect loop completes as in quickstart.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go build ./... && go test ./...","tests":["auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EPromoteTaskGate","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2ELifecycleRetrieval","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EGraduateEnforced"]},"decisions":[],"phases":["P1","P2","P3","P4","P5","P6","P7"],"source":"AC-14"}],"decisions":[{"id":"D1","title":"Gaps get a dedicated `gap list` command","chosen":"Dedicated `auto reflect gap list` noun","why":"Matches the gap -> observation mental model and is discoverable.","rejected":[{"option":"Generic `events list --full/--payload` flag","why":"Payload dump, not a gap view; hides the loop-back.","wouldBreak":["G1"]},{"option":"Both","why":"Two surfaces for one need.","wouldBreak":[]}],"by":"charlie","goals":["G1"],"acs":["AC1","AC2"],"source":"D-1"},{"id":"D2","title":"The event log is git-tracked","chosen":"`events/*.jsonl` committed; `.gitignore` ignores only `playbook.json`","why":"Shared playbook history travels with the repo; any clone can `rebuild`.","rejected":[{"option":"Ignore events too (machine-local state)","why":"Loses shared history across clones and hosts.","wouldBreak":["AC9"]}],"by":"charlie","goals":["G6"],"acs":["AC8","AC9"],"source":"D-2"},{"id":"D3","title":"Restructure to a uniform envelope (breaking)","chosen":"Normalize output shapes around top-level ids","why":"Cleanest end state; consumers and skill refs move in lockstep.","rejected":[{"option":"Additive-only `.id`/`.ids` on today's shapes","why":"Leaves the inconsistent nesting in place.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-3"},{"id":"D4","title":"Content-derived ids ship in this task","chosen":"Implement F7 now, not as a follow-up","why":"Deterministic ids make `--dry-run` output actionable; fits the output-contract theme.","rejected":[{"option":"Defer F7 to a follow-up","why":"Dry-run previews stay un-actionable.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-4"},{"id":"D5","title":"Envelope changes CLI output only, not stored events","chosen":"Presentation-layer restructure; payload names + `schema_version=1` untouched","why":"The append-only log must fold identically forever; the playbook is a disposable view.","rejected":[{"option":"Rename stored payload fields / bump schema","why":"Breaks the append-only on-disk contract.","wouldBreak":["AC14"]}],"by":"agent","goals":["G3"],"acs":["AC4"],"source":"D-5"},{"id":"D6","title":"Content-derived ids keep existing formats","chosen":"Only minting changes (random -> hash prefix); regexes stay","why":"Existing ids stay valid and validators unchanged.","rejected":[{"option":"New / longer id format","why":"Invalidates validators and on-disk ids.","wouldBreak":["AC7"]}],"by":"agent","goals":["G4"],"acs":["AC7"],"source":"D-6"},{"id":"D7","title":"Top-level id on mutations, per-row id on reads","chosen":"Mutations expose `.id`/`.ids`; collections stay arrays with row `.id`","why":"Predictable threading with minimal breakage; lists still return plain payloads.","rejected":[{"option":"Wrap every command in `{ok,data}`","why":"Over-wraps reads, breaks more consumers, fights list convention.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-7"},{"id":"D8","title":"Only rule and observation ids are content-derived","chosen":"`r-`/`ob-` hashed; `rt-`/`fb-`/`ev-` stay random","why":"Loop and event records are distinct-in-time; hashing would collapse them.","rejected":[{"option":"Content-derive all ids","why":"Two identical retrievals would merge into one record.","wouldBreak":["AC14"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-8"},{"id":"D9","title":"Pure content hash, no collision suffix","chosen":"`prefix-` + first 8 hex of sha256(parts joined by newline)","why":"Clean idempotency; distinct-content 32-bit collision risk is negligible; evidence in obs hash keeps findings distinct.","rejected":[{"option":"Hash + suffix on collision","why":"Breaks idempotency and needs a state read at mint.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6","AC7"],"source":"D-9"},{"id":"D10","title":"Per-state-dir .gitignore","chosen":"`.auto/reflect/.gitignore` written stat-then-skip (auto-doc style)","why":"Keeps the policy with the state it governs.","rejected":[{"option":"Append to repo-root `.gitignore` (auto-skill style)","why":"Scatters reflect policy into the repo root.","wouldBreak":["AC8"]}],"by":"agent","goals":["G6"],"acs":["AC8"],"source":"Rejected Alternatives (F9)"},{"id":"D11","title":"Health checks live in a new `doctor`","chosen":"New `auto reflect doctor` mirroring auto-graph's","why":"`doctor` is the conventional health command across auto-* tools.","rejected":[{"option":"Extend `gate check`","why":"Gate is a loop-closure check, not state health.","wouldBreak":["AC10"]}],"by":"agent","goals":["G6"],"acs":["AC10"],"source":"Rejected Alternatives (F1)"},{"id":"D12","title":"Fix timestamps in the list view, not Fold","chosen":"Add `created_at`/`updated_at` to `rule list`'s projection map","why":"`Fold` already sets them from `Event.TS`; only the list map dropped them.","rejected":[{"option":"Change `Fold`","why":"Fold is already correct.","wouldBreak":[]}],"by":"agent","goals":["G5"],"acs":["AC11"],"source":"Rejected Alternatives (F6)"},{"id":"D13","title":"PendingCount carries the scope axis","chosen":"`PendingCount(repoRoot, etlRoot, allWorkspaces bool)`","why":"`miner status --all` must count the same universe as its total/mined breakdown.","rejected":[{"option":"Single-source with repo scope only (as planned)","why":"Under `--all`, total != pending + mined.","wouldBreak":["AC3"]}],"by":"agent","goals":["G2"],"acs":["AC3"],"source":"as-built (PR review)"},{"id":"D14","title":"`gap list --domain` fails fast","chosen":"Exit 1 with hint to `observation list --kind gap --domain`","why":"Feedback gaps carry no domain; a silent `[]` would mislead.","rejected":[{"option":"Accept `--domain` and filter (as planned)","why":"Filter can never match anything.","wouldBreak":[]}],"by":"agent","goals":["G1"],"acs":["AC2"],"source":"as-built"}],"findings":[{"id":"F4","title":"Feedback gaps are write-only","priority":"P1","fix":"Add `auto reflect gap list`.","goal":"G1"},{"id":"F2","title":"`miner status` pending (390) != `stats` pending_to_mine (396)","priority":"P1","fix":"Both call `miner.PendingCount`; scope key uses `sharedgit.NormalizeRemoteURL`.","goal":"G2"},{"id":"F5","title":"Each command nests minted ids differently; `rule promote` `.id` is null","priority":"P2","fix":"Uniform envelope: `.id`/`.ids` on mutations, row `.id` on reads.","goal":"G3"},{"id":"F7","title":"Dry-run ids differ from apply ids","priority":"P2","fix":"Content-hash `r-`/`ob-` ids via `idhash.Derive`.","goal":"G4"},{"id":"F6","title":"Rule `created_at`/`updated_at` come back empty","priority":"P2","fix":"Add them to the `rule list` projection map.","goal":"G5"},{"id":"F1","title":"Stale/partial init state undetected","priority":"P2","fix":"New `auto reflect doctor` with remediation hints.","goal":"G6"},{"id":"F9","title":"`.auto/reflect/` git policy self-contradictory","priority":"P2","fix":"`init` writes `.gitignore` ignoring `playbook.json`; untrack it.","goal":"G6"},{"id":"F8","title":"`outcome` enum undocumented","priority":"P3","fix":"Docstring + quickstart + retrieve.md.","goal":"G7"},{"id":"F3","title":"`correction_density` undocumented","priority":"P3","fix":"Docstring in score.go + mine.md.","goal":"G7"},{"id":"F11","title":"Legacy `docs/reflection/*.yaml` still present","priority":"P3","fix":"Delete `observations.yaml`; no migration.","goal":"G7"},{"id":"F10","title":"No nudge for observed-but-unacked sessions","priority":"P3","fix":"Out of scope (deferred).","goal":null}],"phases":[{"id":"P1","title":"Foundations + walking skeleton","summary":"idhash + output envelope, proven on `observation add/list`.","dependsOn":[],"goals":["G3","G4"],"acs":["AC4","AC5","AC7"],"files":["auto-reflec
