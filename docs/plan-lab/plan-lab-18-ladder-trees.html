*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px 80px}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}

.tabs{display:flex;gap:4px}

.sel{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;font:12px var(--mono);color:var(--mute);display:flex;gap:10px;align-items:center;min-height:36px}

.g{display:grid;grid-template-columns:22px max-content 1fr;padding:6px 0}
.r{display:contents}

.r.head .tx{color:#fff;font-weight:600}
.tx .br{color:#4b5260}

.blk .k.hl,.k.hl{background:var(--hl)!important;color:#111!important;outline:none}
.cm .f{color:#8fa3bf}
.chip{font:600 11px var(--mono);padding:0 4px;border-radius:3px;margin-left:4px;white-space:nowrap}

.blk code{background:#232833;color:#e8eaee}

.mods .row{cursor:pointer}
.mods .r .tx .cnt{color:var(--cdim)}

.rung:last-child{border-bottom:1px solid var(--line)}
.rung>.top{display:flex;align-items:baseline;gap:14px;padding:13px 6px;width:100%;text-align:left}
.rung>.top:hover{background:var(--paper)}
.rung .gid{font:700 13px var(--mono);color:var(--g);width:40px;flex:none}
.rung .ttl{font-size:17px;font-weight:600;flex:1;letter-spacing:-.005em}

.rung .car{font:12px var(--mono);color:var(--mute);width:12px}
.rung.open>.top{background:var(--paper)}

.rung.open .body{display:block}
.desc{color:var(--ink2);max-width:80ch;margin:0 0 10px}
.acb{margin:18px 0 6px;border-left:3px solid var(--ac);padding-left:14px}
.acb .ah{font-weight:600;font-size:15px}
.acb .ah .id{font:700 13px var(--mono);color:var(--ac);margin-right:8px}
.gwt{display:grid;grid-template-columns:52px 1fr;gap:1px 8px;margin:6px 0;color:var(--ink2);max-width:95ch}
.gwt span:nth-child(odd){font:600 11px var(--mono);color:var(--mute);text-transform:uppercase;padding-top:2px}
.sub{font:600 11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.none{font:12px var(--mono);color:var(--mute)}
.ds{margin-top:22px;border-left:3px solid var(--d);padding-left:14px}
.idk{font-weight:700;font-family:var(--mono)}
.idk.G{color:var(--g)} .idk.AC{color:var(--ac)} .idk.D{color:var(--d)}
.legend{font:12px var(--mono);color:var(--mute);margin:4px 0 0}
.legend span{margin-right:14px}
</style>

ail client can reach the store.", "description": "`mail.Client` is the one API; the store is internal, so the Go compiler enforces the boundary. A contract suite pins the seam so a second (RPC) client is a new test target, not a redesign.", "sources": ["plan goal 3", "plan goal 2", "rail G11", "D-062-5", "D-062-8"]}, {"id": "G7", "title": "A real two-agent harness run is the final verdict.", "description": "A one-container `mail-flow` scenario runs the real binary through the C1 loop, the nudge and the ack. Existing scenarios and `make check`/`make test` stay green — nothing shipped breaks.", "sources": ["plan goal 8", "plan goal 9", "rail G15", "D-062-1"]}], "acs": [{"id": "AC1", "goal": "G1", "title": "The glossary defines the five mail terms, and code avoids `message`.", "given": "a glossary with no mail vocabulary", "when": "it is updated as the first change, before any Go file", "then": "Mail, Address, Subscription, Delivery, Binding exist with _Avoid_/_Has_; `glossary.py check` passes; no mail entity is named `message`", "detail": "Defines Mail, Address, Subscription, Delivery and Binding, each with a definition and an _Avoid_ line; _Has_ relations resolve; `glossary.py check` exits 0; ER block refreshed by `glossary.py diagram --write`, not hand-edited; Mail's _Avoid_ lists message and no schema table, event type, Go identifier, CLI noun or JSON field names the stored unit `message` (`--message` stays the body flag); frontmatter summary names the five terms and `auto doc fixed` keeps freshness green.", "verify": {"kind": "go-test", "cmd": "python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md && cd auto-mail && go test ./mail -run 'TestNoMessageEntity|TestSchemaAndEventTypesUseTheMailVocabulary' -v", "tests": ["auto-mail/mail/mail_test.go:TestNoMessageEntity", "auto-mail/mail/mail_test.go:TestSchemaAndEventTypesUseTheMailVocabulary"]}, "verifyNote": "\"Before any code\" is a commit-order property; the squash me ], "phases": ["P2", "P4"], "rails": ["R2"], "source": "AC-4"}, {"id": "AC5", "goal": "G4", "title": "Reading never retires mail; ack is always its own call.", "given": "one unacked mail", "when": "`auto mail list` runs twice with no ack between", "then": "the mail is returned both times, no ack event is appended, and after `ack` list is `[]`", "detail": "No `alpha.mail.acked` is appended by `list`; there is no flag on `list` that acks (checked against its flag set).", "verify": {"kind": "go-test", "cmd": "cd auto-mail && go test ./internal/cli -run TestListDoesNotRetire -v && go test ./internal/store -run TestListDoesNotRetireAndStampsReadOnce && go test ./conformance -run 'TestDirectClientConformance/reading-never-retires-mail'", "tests": ["auto-mail/internal/cli/cli_test.go:TestListDoesNotRetire", "auto-mail/internal/store/store_test.go:TestListDoesNotRetireAndStampsReadOnce", "auto-mail/conformance/conformance_test.go:TestDirectClientConformance", "harness/tests/mail_flow/test_mail_loop.py:test_ack_is_explicit_and_transitions_exactly_once"]}, "phases": ["P2", "P4"], "rails": ["R3"], "source": "AC-5"}, {"id": "AC6", "goal": "G4", "title": "Concurrent acks produce exactly one winner, and losers are told.", "given": "one delivery and 16 goroutines acking it under `-race`", "when": "they all complete", "then": "one `wonTransition:true`, fifteen false, one `alpha.mail.acked` event; all exit 0", "detail": "Every caller sees `acked:true` and exit 0; losers get a stderr note naming who won (D-062-7). Unknown id, or an id the caller has no delivery for, exits non-zero with a remediation hint.", "verify": {"kind": "race", "cmd": "cd auto-mail && go test -race ./internal/store -run 'TestAckTransitionsExactlyOnce|TestAckDistinguishesUnknownFromUndelivered' -v && go test ./internal/cli -run 'TestAckLosingTheRaceStillExitsZero|TestAckUnknownIDExitsNonZeroWithRemediation'", "tests": ["auto-mail/internal/store/store_test.go:TestAckTransitionsExactlyOnce", "auto-mail/internal/sto lks every module, the harness and `skills/`", "then": "no file outside `auto-mail/internal/store` both names the mail store and opens a DB; no outside import of `auto-mail/internal/…`", "detail": "Scoped to the mail store, not SQLite in general (auto-watch and auto-search legitimately import `modernc.org/sqlite`). The internal-import half is already a compile-time guarantee; the test is a regression guard. `auto-cli` reaches mail only through `auto-mail/mail`. Failure names the file and says \"go through mail.Client\".", "verify": {"kind": "go-test", "cmd": "cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v", "tests": ["auto-mail/conformance/seam_test.go:TestNothingOutsideTheMailPackageOpensTheStore"]}, "decisions": ["D8", "D5"], "phases": ["P5"], "rails": ["R9"], "source": "AC-12"}, {"id": "AC13", "goal": "G7", "title": "The whole loop passes end to end in the harness.", "given": "`uv run harness mail-flow up` from `harness/`", "when": "`uv run pytest tests/mail_flow -v` runs", "then": "one container, one host id, two workspaces; the C1 loop, nudge, ack and send-before-subscribe pass against the real binary", "detail": "`check_ready()` fails fast if the store is uninitialised or a workspace unregistered. Bounded retry on observable outcomes, no sleep-to-settle, no count assertions duplicates would break. Registered in `SCENARIOS`; no existing scenario changed. `make check`, `make test`, `make test-race` green with auto-mail in `RACE_PROJECTS`.", "verify": {"kind": "harness", "cmd": "cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race", "tests": ["harness/tests/mail_flow/test_mail_loop.py:test_single_host_two_registered_workspaces", "harness/tests/mail_flow/test_mail_loop.py:test_list_is_empty_json_from_both_workspaces", "harness/tests/mail_flow/test_mail_loop.py:test_docs_are_discoverable_from_a_workspace", "harness/tests/mail_flow/test_mail_loop.py:test_init_is_idempotent", "harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked", "harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber", "harness/tests/mail_flow/test_mail_loop.py:test_from_now_opts_out_of_the_backlog", "harness/tests/mail_flow/test_mail_loop.py:test_broadcast_gives_each_subscription_its_own_ack_state", "harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail"]}, "verifyNote": "Harness is not in CI (pre-existing gap); it runs locally on demand.", "decisions": ["D1"], "phases": ["P1", "P2", "P3", "P4", "P5"], "rails": ["R11"], "source": "AC-13"}], "decisions": [{"id": "D1", "title": "Two agents on one host = one container, two workspaces", "chosen": "Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`", "why": "The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.", "rejected": [{"option": "Two containers sharing a `~/.auto` volume", "why": "Breaks one-container-one-host; shared HOME collides on ready files and host id", "wouldBreak": ["AC13"]}, {"option": "Two containers with distinct host ids", "why": "That is multi-host, which the MVP is not", "wouldBreak": ["AC13", "G2"]}], "by": "agent", "goals": ["G7"], "acs": ["AC13"], "source": "D-062-1"}, {"id": "D2", "title": "A binding is keyed by the physical context hooks already capture", "chosen": "Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows", "why": "The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and R7 forbids hook writes.", "rejected": [{"option": "Key on `session_id`", "why": "The CLI cannot see it — that bridge is T2 (D-13)", "wouldBreak": ["AC10"]}, {"option": "Key on cwd only", "why": "Two agents in one checkout collide — this host's normal state", "wouldBreak": ["AC10"]}, {"option": "`--as <label>` flag on subscribe", "why": "Pushes identity onto the caller; free-form labels collide silently", "wouldBreak": ["AC8"]}, {"option": "Hook refreshes `last_seen` each fire", "why": "A store write in the hot path (thread T1)", "wouldBreak": ["AC10", "G3"]}], "by": "agent", "goals": ["G3", "G2"], "acs": ["AC8", "AC9", "AC10"], "source": "D-062-2"}, {"id": "D3", "title": "The no-mail hook path is gated by a pending-flag file", "chosen": "An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store", "why": "R7 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.", "rejected": [{"option": "Open the store read-only and count", "why": "Not stat cost; puts SQLite in every agent's hot path", "wouldBreak": ["AC10"]}, {"option": "Shared in-memory/daemon cache", "why": "Puts the daemon back in the path D-11 removed it from", "wouldBreak": ["AC10", "G2"]}], "by": "agent", "goals": ["G3"], "acs": ["AC10"], "source": "D-062-3"}, {"id": "D4", "title": "T1 ships init, docs and reset; quickstart and doctor are T4's", "chosen": "`init`, `docs` (full reference) and `reset` (R8) in T1", "why": "The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.", "rejected": [{"option": "Stub `quickstart`/`doctor` now", "why": "Worse than none — the \"ships complete and unused\" failure", "wouldBreak": []}, {"option": "Pull T4 adoption work forward", "why": "Breaks the slice; duplicates work once `#parent` and waking exist", "wouldBreak": []}], "by": "agent", "goals": ["G5", "G7"], "acs": ["AC11", "AC12"], "source": "D-062-4"}, {"id": "D5", "title": "Define the Client seam; ship one implementation plus a contract suite", "chosen": "`mail.Client` + direct-store impl only; conformance suite written against the interface, run now", "why": "D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.", "rejected": [{"option": "Build both implementations in T1", "why": "Drags the daemon and its failure modes into the skeleton", "wouldBreak": ["G2"]}, {"option": "No suite until two implementations", "why": "The second impl then pays for it and skips it", "wouldBreak": ["AC4", "AC5", "AC7", "AC9"]}], "by": "agent", "goals": ["G6"], "acs": ["AC4", "AC5", "AC7", "AC9", "AC12"], "source": "D-062-5"}, {"id": "D6", "title": "Inline notification is the pending flag; the bus event waits for T3", "chosen": "`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published", "why": "The receiver's own hook reads the flag on the same host — no bus hop needed.", "rejected": [{"option": "Publish a bus event from `send` now", "why": "Buys nothing in-band; adds a daemon dependency", "wouldBreak": ["G2"]}, {"option": "Rely on the bus instead of the flag", "why": "Bus is at-most-once and drops slow subscribers", "wouldBreak": ["AC10"]}], "by": "agent", "goals": ["G3"], "acs": ["AC10"], "source": "D-062-6"}, {"id": "D7", "title": "Losing an ack race is a reported outcome, not an error exit", "chosen": "Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner", "why": "R10 fixes the payload, not the exit code; losing a race is not invalid usage.", "rejected": [{"option": "Exit non-zero on a lost race", "why": "Shells would treat a correct outcome as failure", "wouldBreak": ["AC6"]}, {"option": "Exit 0 and say nothing", "why": "The silent success R10 forbids", "wouldBreak": ["AC6"]}], "by": "agent", "goals": ["G4"], "acs": ["AC6"], "source": "D-062-7"}, {"id": "D8", "title": "One exported domain package, `auto-mail/mail`; the store stays internal", "chosen": "Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`", "why": "Makes R9 a compile-time property rather than a convention or a doctor check.", "rejected": [{"option": "Export nothing; hook shells out to `auto mail`", "why": "A process spawn in the hot path (R7)", "wouldBreak": ["AC10"]}, {"option": "Export the store too", "why": "R9 becomes a convention; schema freezes", "wouldBreak": ["AC12"]}, {"option": "Put the client in `auto-shared`", "why": "Inverts ownership; store has nowhere to live", "wouldBreak": ["AC12"]}], "by": "agent", "goals": ["G6"], "acs": ["AC12"], "source": "D-062-8"}, {"id": "D9", "title": "The hook writes one hookSpecificOutput object carrying every fragment", "chosen": "Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first", "why": "Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.", "rejected": [{"option": "Emit a second JSON line", "why": "Undefined behaviour the existing code guards against", "wouldBreak": ["AC10"]}, {"option": "Make mail a `triggerRegistry` entry", "why": "Registry matches payload shape; mail is a filesystem stat on every PostToolUse", "wouldBreak": ["AC10"]}], "by": "agent", "goals": ["G3"], "acs": ["AC10"], "source": "D-062-9"}, {"id": "D10", "title": "No `message` noun: `auto mail` is itself the resource", "chosen": "Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding", "why": "Message already names a Session exchange; `auto mail message get` would collide in one binary.", "rejected": [{"option": "`auto mail letter …`", "why": "Coins a term; metaphor fights the channel model", "wouldBreak": ["AC1"]}, {"option": "Qualify Message by context", "why": "In-binary collision remains", "wouldBreak": ["AC1"]}], "by": "epic", "goals": ["G1"], "acs": ["AC1"], "source": "epic D-4"}, {"id": "D11", "title": "Event-source the delivery lifecycle", "chosen": "Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded", "why": "Keeps cross-host merge a union rather than conflict resolution.", "rejected": [{"option": "Mutable tables", "why": "Divergent mutable state across hosts has no good merge", "wouldBreak": ["AC3"]}, {"option": "Full CQRS with a projection process", "why": "Rebuild tooling and eventual consistency for a few hundred rows a day", "wouldBreak": []}], "by": "epic", "goals": ["G5"], "acs": ["AC3"], "source": "epic D-1"}, {"id": "D12", "title": "Alpha marker in the type string and the store filename", "chosen": "`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported", "why": "Event types become permanent; the marker buys freedom to get them wrong.", "rejected": [{"option": "`v1` naming", "why": "Implies v2 and upcasters", "wouldBreak": ["AC11"]}, {"option": "Docs-only note", "why": "Does not stop a skill matching a bare type", "wouldBreak": ["AC11"]}], "by": "epic", "goals": ["G5"], "acs": ["AC11"], "source": "epic D-2"}, {"id": "D13", "title": "Broadcast delivery, with ack as a compare-and-set", "chosen": "Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won", "why": "Two subscriptions never contend; shared-subscription races resolve safely to one winner.", "rejected": [{"option": "Separate lock table", "why": "A second thing to keep consistent", "wouldBreak": []}, {"option": "Unconditional ack write", "why": "Cannot tell winner from loser", "wouldBreak": ["AC6"]}], "by": "epic", "goals": ["G4"], "acs": ["AC4", "AC6"], "source": "epic D-7"}, {"id": "D14", "title": "Subscriptions backfill unacked history from a cursor", "chosen": "Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out", "why": "Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).", "rejected": [{"option": "Eager rows at send time", "why": "Silently breaks J2", "wouldBreak": ["AC4", "AC9"]}, {"option": "Backfill from subscription time only", " : "A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.", "baseCommit": "f4b0ca4", "builtCommit": "34d1d22", "pr": "https://github.com/mistakenot/auto-stack/pull/116", "outOfScope": ["F10 ack-nudge warning (deferred)", "Gap resolution tracking (gap -> closing observation link)", "On-disk event schema changes (no schema_version bump, no payload renames)", "/reflect-playbook skill flow redesign (only its reference docs change)", "Generic `events list --full` payload dump"]}, "goals": [{"id": "G1", "title": "The reflect loop closes: feedback gaps are readable with one command.", "description": "`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.", "sources": ["F4", "D-1", "AC-14"]}, {"id": "G2", "title": "Miner status and stats always report the same pending count.", "description": "Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.", "sources": ["F2"]}, {"id": "G3", "title": "Every command exposes the ids it touches at a predictable path.", "description": "Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.", "sources": ["F5", "D-3", "D-5", "D-7"]}, {"id": "G4", "title": "The same content always gets the same rule or observation id.", "description": "Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.", "sources": ["F7", "D-4", "D-6", "D-8", "D-9"]}, {"id": "G5", "title": "Rule listings show when each rule was created and updated.", "description": "`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.", "sources": ["F6"]}, {"id": "G6", "title": "Broken reflect state is diagnosable, and git tracks only the canonical log.", "description": "A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.", "sources": ["F1", "F9", "D-2"]}, {"id": "G7", "title": "Docs explain every loop signal, and the legacy process is gone.", "description": "The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.", "sources": ["F8", "F3", "F11"]}], "acs": [{"id": "AC1", "goal": "G1", "title": "gap list surfaces reported gaps", "given": "feedback events carrying a `gap`", "when": "`auto reflect gap list`", "then": "JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted", "detail": "Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'", "tests": ["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSurfacesGaps", "auto-reflect/internal/cli/gap_integration_test.go:TestGapListOmitsGaplessFeedback"]}, "decisions": ["D1", "D14"], "phases": ["P5"], "source": "AC-1"}, {"id": "AC2", "goal": "G1", "title": "gap list obeys list conventions", "given": "gaps across sessions and times", "when": "`gap list` unfiltered, or with a time filter", "then": "all gaps unfiltered; `--since/--after/--before` filter; empty state is `[]`; text mode works", "detail": "Given gaps spanning multiple sessions/domains/times, when I run gap list with no filters, then all gaps are returned; and --since/--after/--before and --domain filter correctly (one filter mode at a time), input normalized, JSON by default with --format text available.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestGapList(SinceFilter|EmptyReturnsArray|TextFormat|DomainUnsupported)'", "tests": ["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSinceFilter", "auto-reflect/internal/cli/gap_integration_test.go:TestGapListEmptyReturnsArray", "auto-reflect/internal/cli/gap_integration_test.go:TestGapListTextFormat", "auto-reflect/internal/cli/gap_integration_test.go:TestGapListDomainUnsupported"]}, "decisions": ["D14"], "phases": ["P5"], "source": "AC-2"}, {"id": "AC3", "goal": "G2", "title": "One pending count, two callers agree", "given": "an ETL fixture with non-canonical session remotes", "when": "`miner status` and `stats` run on it", "then": "`pending` == `pending_to_mine`; both from `miner.PendingCount`", "detail": "Given any repo + ETL state, when I run `auto reflect miner status` and `auto reflect stats`, then pending == pending_to_mine (both computed by one shared function), and the counted universe is documented. A unit test pins them equal on a fixture where they previously diverged.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestMinerStatusPendingMatchesStats|TestMinerStatusCoveragePctNullWhenNoInScopeSessions'", "tests": ["auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusPendingMatchesStats", "auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusCoveragePctNullWhenNoInScopeSessions"]}, "decisions": ["D13"], "phases": ["P4"], "source": "AC-3"}, {"id": "AC4", "goal": "G3", "title": "Mutations expose a top-level id", "given": "the uniform output envelope", "when": "`observation add`, `rule create/edit/promote/retire/graduate`, `consolidate`", "then": "id(s) at `.id` / `.ids`, never null or only nested", "detail": "Given the uniform output envelope, when I run an id-minting / entity mutation (observation add, rule create/edit/promote/retire/graduate, consolidate), then the relevant id(s) are reachable at a predictable top-level path (.id for single, .ids for many), never null and never only nested. (feedback echoes the feedback ids it acted on as ids; rebuild carries counts only.)", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestObservationAddExposesTopLevelID|TestConsolidateDeterministicIDs'", "tests": ["auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddExposesTopLevelID", "auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs"]}, "decisions": ["D3", "D5", "D7"], "phases": ["P1", "P2", "P3"], "source": "AC-4"}, {"id": "AC5", "goal": "G3", "title": "Collection rows expose `.id` without data loss", "given": "`retrieve`, `select`, `rule list`, `observation list`, `events list`, `gap list`", "when": "their JSON is parsed", "then": "each row id at a uniform path; prior fields kept; skill refs + quickstart updated", "detail": "Given the envelope migration of retrieve, select, rule list, observation list, events list, gap list, when I parse their JSON, then each element's id is reachable at a uniform path (.[].id or .results[].id), every field present before the change is still present, and the reflect-playbook skill refs + quickstart are updated to the new paths.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run TestObservationListElementsCarryID && go test ./cmd/autoreflect -run TestE2ELoopQuickstart", "tests": ["auto-reflect/internal/cli/observation_integration_test.go:TestObservationListElementsCarryID", "auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart"]}, "decisions": ["D7"], "phases": ["P1", "P3"], "source": "AC-5"}, {"id": "AC6", "goal": "G4", "title": "Consolidate is deterministic and idempotent", "given": "one consolidation delta document", "when": "`consolidate --dry-run` then `consolidate`, then apply again", "then": "same rule id in both runs; second apply adds no duplicate", "detail": "Given one consolidation delta document, when I run consolidate --dry-run and then consolidate (separate invocations), then the rule id is identical across both; and re-running the same consolidate a second time is a no-op (no duplicate rule) because the content-derived id already exists.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestConsolidateDeterministicIDs|TestObservationAddIsIdempotent' && go test ./internal/idhash", "tests": ["auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs", "auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddIsIdempotent", "auto-reflect/internal/idhash/idhash_test.go:TestDeriveDeterministic"]}, "decisions": ["D4", "D8", "D9"], "phases": ["P1", "P2"], "source": "AC-6"}, {"id": "AC7", "goal": "G4", "title": "Ids keep their format", "given": "content-derived minting", "when": "rule / observation ids are generated", "then": "still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; validators unchanged", "detail": "Given content-derived minting, when rule/observation ids are generated, then they still match ^r-[0-9a-f]{8}$ / ^ob-[0-9a-f]{8}$; existing validators are unchanged; events already on disk keep their original ids.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/idhash ./internal/observations -run 'TestDerive|TestNewObservationIDFormat|TestCanonicalPartsDeriveStableID'", "tests": ["auto-reflect/internal/idhash/idhash_test.go:TestDeriveFormat", "auto-reflect/internal/idhash/idhash_test.go:TestDeriveDifferentPartsDifferentID", "auto-reflect/internal/observations/model_test.go:TestNewObservationIDFormat", "auto-reflect/internal/observations/model_test.go:TestCanonicalPartsDeriveStableID"]}, "decisions": ["D6"], "phases": ["P1", "P2"], "source": "AC-7"}, {"id": "AC8", "goal": "G6", "title": "init writes an idempotent .gitignore", "given": "a repo", "when": "`auto reflect init` runs (twice)", "then": "`.auto/reflect/.gitignore` ignores `playbook.json`, not `events/`; not rewritten", "detail": "Given a repo, when I run auto reflect init (or init --project), then .auto/reflect/.gitignore exists and ignores playbook.json (not events/); running init again does not overwrite or duplicate it.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run 'TestInitWritesStateGitignore|TestInitGitignoreIdempotent'", "tests": ["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore", "auto-reflect/internal/cli/init_test.go:TestInitGitignoreIdempotent"]}, "decisions": ["D2", "D10"], "phases": ["P7"], "source": "AC-8"}, {"id": "AC9", "goal": "G6", "title": "Canonical events tracked, cache ignored", "given": "the repo's own `.auto/reflect/`", "when": "git status is checked after init", "then": "`events/*.jsonl` committable; `playbook.json` untracked", "detail": "Given the repo's own .auto/reflect/, when I check git status after init, then .auto/reflect/events/*.jsonl is tracked/committable and playbook.json is untracked (removed from the index with git rm --cached if previously tracked).", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run TestInitWritesStateGitignore && git ls-files .auto/reflect", "tests": ["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore"]}, "decisions": ["D2"], "phases": ["P7"], "source": "AC-9"}, {"id": "AC10", "goal": "G6", "title": "doctor detects stale or partial state", "given": "missing `events/`, stale snapshot, or legacy `feedback.jsonl`", "when": "`auto reflect doctor`", "then": "JSON `[{check,status,message,hint}]`; hints on failures; exit 1 on any fail", "detail": "Given a partial reflect state (e.g. state dir present but events/ missing, or playbook.json stale vs the folded event log), when I run auto reflect doctor, then it returns structured JSON [{check,status,message,hint}], each failure carries a concrete remediation hint, and the process exits non-zero on any fail.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/cli -run TestDoctor", "tests": ["auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorHealthyAllPass", "auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorMissingEventsFails", "auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorStaleSnapshotWarns", "auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorLegacyFeedbackWarns"]}, "decisions": ["D11"], "phases": ["P6"], "source": "AC-10"}, {"id": "AC11", "goal": "G5", "title": "Rule listings carry timestamps", "given": "a folded rule with timestamps set by `Fold`", "when": "`rule list` and `rule get`", "then": "both expose non-empty `created_at` / `updated_at`", "detail": "Given a folded rule with created_at/updated_at set by Fold, when I run auto reflect rule list and rule get, then both expose non-empty created_at/updated_at (list no longer drops them in its projection map).", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go test ./internal/rules -run TestFoldSurfacesTimestampsForListView", "tests": ["auto-reflect/internal/rules/projection_test.go:TestFoldSurfacesTimestampsForListView"]}, "decisions": ["D12"], "phases": ["P3"], "source": "AC-11"}, {"id": "AC12", "goal": "G7", "title": "outcome enum and correction_density documented", "given": "the docs", "when": "a reader consults quickstart and skill references", "then": "`outcome` enum (distinct from ack status) and `correction_density` definition + scale are documented", "detail": "Given the docs, when a reader consults quickstart and the reflect-playbook references, then the feedback outcome enum (success|partial|fail|abandoned, distinct from miner ack status) and correction_density (definition + scale) are documented; a malformed outcome error already names the valid set.", "verify": {"kind": "manual", "cmd": "auto reflect quickstart | grep -E 'abandoned|correction_density'; grep -n correction_density skills/reflect-playbook/references/mine.md", "tests": []}, "decisions": [], "phases": ["P7"], "source": "AC-12"}, {"id": "AC13", "goal": "G7", "title": "Legacy yaml removed", "given": "the superseded process artifacts", "when": "the task lands", "then": "`docs/reflection/observations.yaml` deleted; only retired `playbook-*` skills referenced it", "detail": "Given the superseded process artifacts, when the task lands, then docs/reflection/observations.yaml is deleted and the reflect-playbook 'supersedes' note reflects the removal. The only remaining referencers are the already-superseded playbook-observe/-refine/-search skills (no Go code reads the file); per F11 a future run would regenerate an empty file — the discard is intended.", "verify": {"kind": "manual", "cmd": "git ls-tree 34d1d22 docs/reflection/observations.yaml  # expect empty; git grep -n 'observations.yaml' 34d1d22 -- '*.go'", "tests": []}, "decisions": [], "phases": ["P7"], "source": "AC-13"}, {"id": "AC14", "goal": "G1", "title": "No regressions; the e2e loop runs through gap list", "given": "all changes", "when": "`go build ./...` and the full auto-reflect suite run", "then": "all green with assertions moved to the new envelope; loop completes through `gap list`", "detail": "Given all changes, when I run go build ./... and the full auto-reflect test suite, then everything builds and passes (existing assertions updated to the new envelope), and the end-to-end reflect loop completes as in quickstart.", "verify": {"kind": "go-test", "cmd": "cd auto-reflect && go build ./... && go test ./...", "tests": ["auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart", "auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EPromoteTaskGate", "auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2ELifecycleRetrieval", "auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EGraduateEnforced"]}, "decisions": [], "phases": ["P1", "P2", "P3", "P4", "P5", "P6", "P7"], "source": "AC-14"}], "decisions": [{"id": "D1", "title": "Gaps get a dedicated `gap list` command", "chosen": "Dedicated `auto reflect gap list` noun", "why": "Matches the gap -> observation mental model and is discoverable.", "rejected": [{"option": "Generic `events list --full/--payload` flag", "why": "Payload dump, not a gap view; hides the loop-back.", "wouldBreak": ["G1"]}, {"option": "Both", "why": "Two surfaces for one need.", "wouldBreak": []}], "by": "charlie", "goals": ["G1"], "acs": ["AC1", "AC2"], "source": "D-1"}, {"id": "D2", "title": "The event log is git-tracked", "chosen": "`events/*.jsonl` committed; `.gitignore` ignores only `playbook.json`", "why": "Shared playbook history travels with the repo; any clone can `rebuild`.", "rejected": [{"option": "Ignore events too (machine-local state)", "why": "Loses shared history across clones and hosts.", "wouldBreak": ["AC9"]}], "by": "charlie", "goals": ["G6"], "acs": ["AC8", "AC9"], "source": "D-2"}, {"id": "D3", "title": "Restructure to a uniform envelope (breaking)", "chosen": "Normalize output shapes around top-level ids", "why": "Cleanest end state; consumers and skill refs move in lockstep.", "rejected": [{"option": "Additive-only `.id`/`.ids` on today's shapes", "why": "Leaves the inconsistent nesting in place.", "wouldBreak": ["AC5"]}], "by": "charlie", "goals": ["G3"], "acs": ["AC4", "AC5"], "source": "D-3"}, {"id": "D4", "title": "Content-derived ids ship in this task", "chosen": "Implement F7 now, not as a follow-u function callTree(cs){
  let prevFile=null;
  const lines=cs.frames.map((fr,i)=>{
    const s=symInfo(fr.file,fr.symbol); const ch=s.change||'same';
    const ind='  '.repeat(fr.depth);
    const showFile=fr.file!==prevFile; prevFile=fr.file;
    const ds=decisionsMentioning(fr.symbol);
    const cm=(showFile?kf(fr.file)+' ':'')+`<span>${rich(fr.does||'')}</span>`+(fr.effect?` <span style="color:#8fa3bf">→ ${esc(fr.effect)}</span>`:'')+ds.map(chip).join('');
    return {cls:CLS[ch],gut:GUT[ch],tx:ind+ks(fr.symbol),plain:ind+fr.symbol,cm,cplain:(showFile?fr.file+'  ':'')+(fr.does||'')+(ds.length?'  '+ds.join(' '):'')};
  });
  lines.unshift({cls:'head',tx:esc('$ '+cs.title),plain:'$ '+cs.title,cm:(cs.goals||[]).map(chip).join('')+(cs.acs||[]).map(chip).join(''),cplain:[...(cs.goals||[]),...(cs.acs||[])].join(' ')});
  return block(`call tree · ${cs.id}`,lines);
}
// ---- file tree (├──) for a set of files
function fileTree(files,{symbols=true,onlyChanged=false,strip=''}={}){
  const root={d:{},f:[]};
  files.forEach(f=>{const parts=(strip&&f.path.startsWith(strip)?f.path.slice(strip.length):f.path).split('/');let n=root;parts.slice(0,-1).forEach(p=>{n=n.d[p]=n.d[p]||{d:{},f:[]};});n.f.push(f);});
  // compress single-child dirs
  const lines=[];
  function walk(n,prefix){
    const entries=[...Object.keys(n.d).sort().map(k=>({k,dir:n.d[k]})),...n.f.sort((a,b)=>a.path.localeCompare(b.path)).map(f=>({f}))];
    entries.forEach((e,i)=>{
      const last=i===entries.length-1, br=last?'└── ':'├── ', nx=prefix+(last?'    ':'│   ');
      if(e.dir){let name=e.k,d=e.dir;while(!d.f.length&&Object.keys(d.d).length===1){const k=Object.keys(d.d)[0];name+='/'+k;d=d.d[k];}
        lines.push({cls:'dim',tx:`<span class="br">${prefix+br}</span>${esc(name)}/`,plain:prefix+br+name+'/'});walk(d,nx);}
      else{const f=e.f,ch=f.change;const fname=f.path.split('/').pop();
        lines.push({cls:CLS[ch],gut:GUT[ch],tx:`<span class="br">${prefix+br}</span><span class="k" data-k="f:${esc(f.path)}">${esc(fname)}</span>`,plain:prefix+br+fname,
          cm:rich((f.why||'').slice(0,90)+((f.why||'').length>90?'…':''))+(!symbols&&(f.symbols||[]).length?` <span style="color:#4b5260">· ${f.symbols.length} sym</span>`:''),cplain:''});
        if(symbols){let syms=(f.symbols||[]);const same=syms.filter(s=>s.change==='same'||!s.change);
          if(onlyChanged) syms=syms.filter(s=>s.change&&s.change!=='same');
          syms.forEach((s,j)=>{const l=j===syms.length-1&&!(onlyChanged&&same.length);const b2=l?'└── ':'├── ';const sc=s.change||'same';
            lines.push({cls:CLS[sc],gut:GUT[sc],tx:`<span class="br">${nx+b2}</span>${ks(s.name)}`,plain:nx+b2+s.name,cm:s.note?esc(s.note):'',cplain:s.note||''});});
          if(onlyChanged&&same.length) lines.push({cls:'dim',tx:`<span class="br">${nx}└── </span>… ${same.length} unchanged`,plain:nx+'└── … '+same.length+' unchanged'});
        }}
    });
  }
  walk(root,'');
  return lines;
}
function counts(fs){const c={add:0,edit:0,delete:0,context:0};fs.forEach(f=>c[f.change]=(c[f.change]||0)+1);return c;}
// ---- module overview
function renderMods(){
  const by={};M.files.forEach(f=>{const m=f.path.split('/')[0];(by[m]=by[m]||[]).push(f);});
  const mods=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
  let h='';
  const head=mods.map(m=>{const c=counts(by[m]);const ch=c.add&&!c.edit&&!c.delete?'add':(c.add||c.edit||c.delete)?'edit':'context';
    const pad=m.padEnd(22);const cnt=`${c.add?'+'+c.add:''} ${c.edit?'~'+c.edit:''} ${c.delete?'-'+c.delete:''} ${c.context?'·'+c.context+' ctx':''}`.replace(/\s+/g,' ').trim();
    return {m,ch,pad,cnt};});
  h+=`<div class="blk mods"><div class="hd"><span class="t">${M.files.length} files · ${mods.length} modules · click a module to unfold</span><button class="cp" data-b="mods">copy</button></div><div class="g">`;
  BLK.mods=head.map(x=>GUT[x.ch]+' ▸ '+x.pad+x.cnt).join('\n');
  head.forEach(x=>{
    h+=`<div class="r ${CLS[x.ch]} row" data-mod="${esc(x.m)}"><span class="gu">${GUT[x.ch]}</span><span class="tx"><span class="car">▸</span> <span class="k" data-k="m:${esc(x.m)}">${esc(x.m)}/</span>${' '.repeat(Math.max(1,22-x.m.length))}<span class="cnt">${esc(x.cnt)}</span></span><span class="cm">${[...new Set(by[x.m].flatMap(f=>f.goals||[]))].sort().map(chip).join('')}</span></div>`;
    h+=`<div class="modbody" data-modb="${esc(x.m)}" style="display:none;grid-column:1/-1"></div>`;
  });
  h+='</div></div>';
  document.getElementById('mods').innerHTML=h;
  document.querySelectorAll('.mods .row').forEach(r=>r.addEventListener('click',e=>{
    if(e.target.closest('.chip')) return;
    const m=r.dataset.mod,b=document.querySelector(`[data-modb="${CSS.escape(m)}"]`);
    const open=b.style.display==='none';
    if(open&&!b.innerHTML){const ls=fileTree(by[m],{symbols:false,strip:m+'/'});
      b.innerHTML=`<div class="g" style="padding:0 0 6px">`+ls.map(l=>({...l,tx:'  '+l.tx})).map(rowH).join('')+'</div>';paint();}
    b.style.display=open?'block':'none'; r.querySelector('.car').textContent=open?'▾':'▸';
  }));
}
// ---- ladder
function renderLadder(){
  const h=M.goals.map(g=>{
    const acs=M.acs.filter(a=>a.goal===g.id);
    const acIds=new Set(acs.map(a=>a.id));
    const ds=M.decisions.filter(d=>(d.goals||[]).includes(g.id)||(d.acs||[]).some(a=>acIds.has(a)));
    return `<div class="rung" data-g="${g.id}"><button class="top"><span class="car">▸</span><span class="gid k" data-k="i:${g.id}">◎${g.id}</span><span class="ttl">${rich(g.title)}</span><span class="meta">${acs.length} AC · ${ds.length} D</span></button><div class="body"></div></div>`;
  }).join('');
  const L=document.getElementById('ladder'); L.innerHTML=h;
  L.querySelectorAll('.rung>.top').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('.k.gid')&&e.shiftKey)return;toggleRung(b.parentElement);}));
}
function toggleRung(r,force){
  const open=force??!r.classList.contains('open');
  r.classList.toggle('open',open); r.querySelector('.car').textContent=open?'▾':'▸';
  if(open&&!r.querySelector('.body').innerHTML){r.querySelector('.body').innerHTML=goalBody(r.dataset.g);paint();}
}
function goalBody(gid){
  const g=M.goals.find(x=>x.id===gid);
  const acs=M.acs.filter(a=>a.goal===gid), acIds=new Set(acs.map(a=>a.id));
  let h=`<p class="desc">${rich(g.description||'')}</p>`;
  acs.forEach(a=>{
    h+=`<div class="acb"><div class="ah"><span class="id k" data-k="i:${a.id}">✓${a.id}</span>${rich(a.title)}</div>
      <div class="gwt"><span>given</span><span>${rich(a.given)}</span><span>when</span><span>${rich(a.when)}</span><span>then</span><span>${rich(a.then)}</span></div>`;
    const v=a.verify||{};
    const vl=[{wide:true,cls:'head',tx:esc('$ '+(v.cmd||'(no command)')),plain:'$ '+(v.cmd||''),cm:`<span style="color:#9aa3b2">${esc(v.kind||'')}</span>`}];
    (v.tests||[]).forEach(t=>{const [p,n]=t.split(':');vl.push({tx:'  '+(n?ks(n):esc(p)),plain:'  '+(n||p),cm:n?kf(p):'',cplain:n?p:''});});
    h+=block(`verify · ${esc(v.kind||'')} · ${(v.tests||[]).length} tests`,vl);
    const css=M.callstacks.filter(c=>(c.acs||[]).includes(a.id));
    h+=`<div class="sub">call tree${css.length>1?'s':''} that prove it</div>`;
    h+=css.length?css.map(callTree).join(''):`<div class="none">no traced journey for ${a.id} — proof is the tests above</div>`;
    const fs=M.files.filter(f=>(f.acs||[]).includes(a.id));
    h+=`<div class="sub">files it touches</div>`;
    h+=fs.length?block(`file tree · ${fs.length} files · ${Object.entries(counts(fs)).filter(e=>e[1]).map(([k,n])=>GUT[k].trim()?GUT[k]+n:'·'+n+' ctx').join(' ')}`,fileTree(fs)):`<div class="none">no files tagged with ${a.id}</div>`;
    h+=`</div>`;
  });
  const ds=M.decisions.filter(d=>(d.goals||[]).includes(gid)||(d.acs||[]).some(x=>acIds.has(x)));
  if(ds.length){
    h+=`<div class="ds"><div class="sub" style="margin-top:0">decisions that constrain ${gid}</div>`;
    const lines=[];
    ds.forEach(d=>{
      lines.push({cls:'head',tx:`<span class="k" data-k="i:${d.id}">◆${d.id}</span> ${esc(d.title)}`,plain:'◆'+d.id+' '+d.title,cm:esc(d.source||'')+' · '+esc(d.by||'')+(d.acs||[]).map(chip).join(''),cplain:(d.source||'')});
      lines.push({cls:'add',gut:'+',tx:'  '+richShort(d.chosen),plain:'  '+d.chosen,cm:rich(d.why||''),cplain:d.why||''});
      (d.rejected||[]).forEach(r=>lines.push({cls:'del',gut:'-',tx:'  '+richShort(r.option),plain:'  '+r.option,cm:rich(r.why||'')+(r.wouldBreak||[]).map(chip).join(''),cplain:(r.why||'')+(r.wouldBreak?.length?'  breaks '+r.wouldBreak.join(' '):'')}));
    });
    h+=block(`${ds.length} decisions · + chosen · − rejected`,lines)+'</div>';
  }
  return h;
}
function richShort(t){t=t||'';return rich(t.length>70?t.slice(0,68)+'…':t);}
// ---- highlight
function paint(){
  document.querySelectorAll('.k.hl').forEach(e=>e.classList.remove('hl'));
  const s=document.getElementById('sel');
  if(!SEL){s.innerHTML='nothing selected — click a symbol, file or ID';return;}
  const hits=[...document.querySelectorAll('.k')].filter(e=>e.dataset.k===SEL||(SEL.startsWith('f:')&&e.dataset.k===SEL)||(SEL.startsWith('m:')&&e.dataset.k.startsWith('f:'+SEL.slice(2)+'/')));
  hits.forEach(e=>e.classList.add('hl'));
  const id=SEL.slice(2);
  // where does it appear (including collapsed goals)
  const where=M.goals.filter(g=>goalMentions(g.id,SEL)).map(g=>g.id);
  s.innerHTML=`<b>${esc(id)}</b> ${hits.length} on screen · appears under ${where.length?where.map(w=>`<button data-open="${w}">◎${w}</button>`).join(' '):'no goal'} <button data-open="*">open all</button> <button id="clr">clear</button>`;
}
const MENT={};
function goalMentions(gid,key){
  const k=gid+'|'+key; if(k in MENT) return MENT[k];
  const tmp=document.createElement('div'); tmp.innerHTML=goalBody(gid);
  return MENT[k]=[...tmp.querySelectorAll('.k')].some(e=>e.dataset.k===key||(key.startsWith('m:')&&e.dataset.k.startsWith('f:'+key.slice(2)+'/')))||key==='i:'+gid;
}
document.addEventListener('click',e=>{
  const cp=e.target.closest('.cp'); if(cp){navigator.clipboard?.writeText(BLK[cp.dataset.b]).catch(()=>{});cp.textContent='copied';setTimeout(()=>cp.textContent='copy',900);return;}
  const o=e.target.closest('[data-open]'); if(o){document.querySelectorAll('.rung').forEach(r=>{if(o.dataset.open==='*'||r.dataset.g===o.dataset.open)toggleRung(r,true)});paint();
    const f=document.querySelector('.k.hl:not(.sel *)'); if(f&&o.dataset.open!=='*') f.scrollIntoView({block:'center'}); return;}
  if(e.target.id==='clr'){SEL=null;paint();return;}
  const k=e.target.closest('.k'); if(k){e.stopPropagation();e.preventDefault();SEL=SEL===k.dataset.k?null:k.dataset.k;paint();}
},true);
function load(){
  const pid=(location.hash.slice(1)||'062'); M=DATA[pid]||DATA['062'];
  IDX={};[...M.goals,...M.acs,...M.decisions,...(M.rails||[])].forEach(x=>IDX[x.id]=x);
  Object.keys(MENT).forEach(k=>delete MENT[k]); BID=0;
  document.getElementById('ttl').textContent=`${M.plan.id} · ${M.plan.title}`;
  document.getElementById('one').innerHTML=rich(M.plan.oneLiner)+` <span style="color:var(--mute);font:12px var(--mono)">${esc(M.plan.kind)} · ${esc(M.plan.baseCommit)}→${esc(M.plan.builtCommit)}</span>`;
  ['062','052'].forEach(p=>document.getElementById('t'+p).classList.toggle('on',p===M.plan.id));
  SEL=null; renderMods(); renderLadder(); paint();
}
addEventListener('hashchange',load); load();
</script>
