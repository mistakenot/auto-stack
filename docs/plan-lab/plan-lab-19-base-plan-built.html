<script id="data" type="application/json">{"062":{"plan":{"id":"062","title":"auto-mail walking skeleton","kind":"greenfield","oneLiner":"Build the new `auto mail` tool end to end — glossary, store, CLI, hook nudge, harness — so agents on one host can trade durable, acked mail.","problem":"The stack broadcasts events outward, but nothing carries a message to a named recipient and keeps it until acted on. A supervisor learns its child crashed by silence; an agent that finds a bug in another project has nowhere to put it. T1 must also retire the real risk: telling a working agent it has mail, in-band and cheaply.","baseCommit":"41c1516","builtCommit":"0c73e78","pr":"https://github.com/mistakenot/auto-stack/pull/146","epic":"docs/epics/epic-005-auto-mail-mvp.html (T1)","transcript":{"id":"C1","steps":[{"cmd":"auto mail subscribe auto-web/bugs","out":"{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"},{"cmd":"auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }"},{"cmd":"auto mail list","out":"[ { \"id\": \"01K9X2QF7M3B0V8N\", \"from\": \"auto-stack/reviewer\", \"sentAt\": \"2026-08-25T10:14:02Z\", \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" } } ]"},{"cmd":"auto mail ack 01K9X2QF7M3B0V8N","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }"},{"cmd":"auto mail list","out":"[]"}]},"outOfScope":["`#parent` resolution and self-identification (epic T2, D-13)","Waking idle agents: keystrokes, effector seam, liveness, escalation (T3)","Daemon reconcile tick (T3, D-12)","`quickstart`, `doctor`, journey J2 end to end, adoption guidance (T4)","RPC `mail.Client` and `mail.*` daemon methods (D-062-5)","\"You have mail\" bus event (T3, D-062-6)","Queue mode, leases, dead-letter, cross-host, `#new`, prefix subs, `wait`, retention (backlog)","Any change to autowatch `Backend` or `hooks.CaptureEnv` allowlist","`--text` output mode"]},"goals":[{"id":"G1","title":"Mail has its own vocabulary, defined before any code.","description":"Mail, Address, Subscription, Delivery and Binding land in the glossary first, then the same words are used in schema, events, CLI and commits. Nothing in mail is called a Message, which already names a Session exchange.","sources":["plan goal 1","rail G16","epic D-4"]},{"id":"G2","title":"Agents on one host can send each other mail that waits.","description":"Subscribe, send, list, ack work with no daemon running. Mail sent before anyone subscribes still reaches the later subscriber. Addresses are free-form names with no physical identity in them.","sources":["plan goal 5","C1","rail G5","rail G6","epic D-9","epic D-11"]},{"id":"G3","title":"A busy agent is told it has mail at almost no cost.","description":"The existing PostToolUse hook tells the agent it has mail. The no-mail path costs one stat, never opens the store, and can never stall or break the hook.","sources":["plan goal 7","rail G8","D-062-3","D-062-9"]},{"id":"G4","title":"Delivery is honest: explicit ack, at-least-once, one winner.","description":"Reading never retires mail. Each subscription has its own delivery state, filled lazily from a cursor. Concurrent acks resolve to exactly one winner, and losers are told. No ordering or exactly-once is promised.","sources":["plan goal 6","rail G2","rail G3","rail G4","rail G13","epic D-7","epic D-10"]},{"id":"G5","title":"The store is an append-only log that is safe to wipe.","description":"An event log is the authority; projections update in the same transaction and mail rows never change. The `alpha` marker is in the event types and the filename, and `reset` is a supported operation.","sources":["plan goal 4","rail G1","rail G10","epic D-1","epic D-2"]},{"id":"G6","title":"Only the mail client can reach the store.","description":"`mail.Client` is the one API; the store is internal, so the Go compiler enforces the boundary. A contract suite pins the seam so a second (RPC) client is a new test target, not a redesign.","sources":["plan goal 3","plan goal 2","rail G11","D-062-5","D-062-8"]},{"id":"G7","title":"A real two-agent harness run is the final verdict.","description":"A one-container `mail-flow` scenario runs the real binary through the C1 loop, the nudge and the ack. Existing scenarios and `make check`/`make test` stay green — nothing shipped breaks.","sources":["plan goal 8","plan goal 9","rail G15","D-062-1"]}],"acs":[{"id":"AC1","goal":"G1","title":"The glossary defines the five mail terms, and code avoids `message`.","cmd":"python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md && cd auto-mail && go test ./mail -run 'TestNoMessageEntity|TestSchemaAndEventTypesUseTheMailVocabulary' -v"},{"id":"AC2","goal":"G2","title":"The C1 transcript runs verbatim with JSON-only stdout.","cmd":"cd auto-mail && go test ./internal/cli -run 'TestC1Loop|TestFromLadder' -v && go test ./internal/store -run TestFromAddressLadderFollowsTheLogNotTheID"},{"id":"AC3","goal":"G5","title":"Mail rows and events never change; state changes are new events.","cmd":"cd auto-mail && go test ./internal/store -run 'TestEventLogIsAppendOnly|TestMailRowIsImmutable|TestListAndAckLeaveMailAndEventsByteIdentical' -v"},{"id":"AC4","goal":"G4","title":"Delivery state lives on a deliveries join, filled lazily from a cursor.","cmd":"cd auto-mail && go test ./internal/store -run 'TestNoConsumerStateOnTheMailRow|TestCursorBackfillAndFromNow|TestBroadcastFanOut|TestSendMaterialisesNoDeliveries|TestFromNowCursorIsDecidedByTheStoreNotByAnID' -v && go test ./conformance -run TestDirectClientConformance -v"},{"id":"AC5","goal":"G4","title":"Reading never retires mail; ack is always its own call.","cmd":"cd auto-mail && go test ./internal/cli -run TestListDoesNotRetire -v && go test ./internal/store -run TestListDoesNotRetireAndStampsReadOnce && go test ./conformance -run 'TestDirectClientConformance/reading-never-retires-mail'"},{"id":"AC6","goal":"G4","title":"Concurrent acks produce exactly one winner, and losers are told.","cmd":"cd auto-mail && go test -race ./internal/store -run 'TestAckTransitionsExactlyOnce|TestAckDistinguishesUnknownFromUndelivered' -v && go test ./internal/cli -run 'TestAckLosingTheRaceStillExitsZero|TestAckUnknownIDExitsNonZeroWithRemediation'"},{"id":"AC7","goal":"G4","title":"At-least-once and unordered is documented; re-acks are idempotent.","cmd":"cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract"},{"id":"AC8","goal":"G2","title":"Addresses are free-form and carry no physical identity.","cmd":"cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v"},{"id":"AC9","goal":"G2","title":"Sending to nobody persists and reports both counts.","cmd":"cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'"},{"id":"AC10","goal":"G3","title":"The hook nudge costs one stat and can never break the hook.","cmd":"cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHealsItself' -v && cd ../auto-cli && go test ./cmd/auto -run 'TestFire(NudgesOnlyWhenMailIsWaiting|NudgeCarriesNoMailboxContent|NudgesOnPostToolUseOnly|EmitsOneObjectWhenMailAndHintBothMatch|SurvivesABrokenMailDirectory|CreatesNoMailStore)|TestEmitAdditionalContextWritesAtMostOneObject' -v"},{"id":"AC11","goal":"G5","title":"`alpha` is in event types and filename, and reset works.","cmd":"cd auto-mail && go test ./internal/store -run 'TestEveryEnvelopeCarriesAVersion|TestAppendRejectsAnEventOutsideTheAlphaNamespace' -v && go test ./internal/cli -run 'TestInitCreatesAlphaStore|TestReset|TestDocsStatesTheAlphaContract' -v && go test ./mail -run 'TestResetWipesTheAlphaStore|TestSchemaAndEventTypesUseTheMailVocabulary'"},{"id":"AC12","goal":"G6","title":"Nothing outside the mail store package opens the mail store.","cmd":"cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v"},{"id":"AC13","goal":"G7","title":"The whole loop passes end to end in the harness.","cmd":"cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","source":"D-062-1","by":"agent"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","source":"D-062-2","by":"agent"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","source":"D-062-3","by":"agent"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","source":"D-062-4","by":"agent"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","source":"D-062-5","by":"agent"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","source":"D-062-6","by":"agent"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","source":"D-062-7","by":"agent"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","source":"D-062-8","by":"agent"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","source":"D-062-9","by":"agent"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","source":"epic D-4","by":"epic"},{"id":"D11","title":"Event-source the delivery lifecycle","source":"epic D-1","by":"epic"},{"id":"D12","title":"Alpha marker in the type string and the store filename","source":"epic D-2","by":"epic"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","source":"epic D-7","by":"epic"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","source":"epic D-10","by":"epic"},{"id":"D15","title":"Addresses are free-form; structure is convention","source":"epic D-9","by":"epic"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","source":"epic D-11","by":"epic"}],"files":[{"p":"docs/concepts/UBIQUITOUS_LANGUAGE.md","c":"edit","inBase":true,"inBuilt":true,"why":"R12, first: add the five mail terms with _Avoid_/_Has_; refresh ER block; update summary.","tags":["AC1","D10","G1"],"unplanned":null,"div":null,"syms":[{"n":"## Mail","c":"add","sig":"","note":"new section","extra":null,"div":null},{"n":"Mail","c":"add","sig":"","note":"avoid: message","extra":null,"div":null},{"n":"Address","c":"add","sig":"","note":"","extra":null,"div":null},{"n":"Subscription","c":"add","sig":"","note":"","extra":null,"div":null},{"n":"Delivery","c":"add","sig":"","note":"","extra":null,"div":null},{"n":"Binding","c":"add","sig":"","note":"no liveness claim in T1","extra":null,"div":"dropped \"and liveness\" from the draft wording"},{"n":"Domain at a glance","c":"edit","sig":"","note":"generated ER block refreshed","extra":null,"div":null}]},{"p":"CLAUDE.md","c":"edit","inBase":true,"inBuilt":true,"why":"Add the auto-mail row to the Sub-Projects table.","tags":["AC13","D1","D4","G7"],"unplanned":null,"div":null,"syms":[{"n":"Sub-Projects","c":"edit","sig":"","note":"auto-mail row added","extra":null,"div":null}]},{"p":"go.work","c":"edit","inBase":true,"inBuilt":true,"why":"Add ./auto-mail to the use block.","tags":["AC13","D1","D4","G7"],"unplanned":null,"div":null,"syms":[{"n":"use","c":"edit","sig":"./auto-mail","note":"","extra":null,"div":null}]},{"p":"Makefile","c":"edit","inBase":true L), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when <script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const st={plan:'062',mode:'bp',filter:null,sel:null,only:false};
try{const h=location.hash.slice(1).split('/');if(DATA[h[0]])st.plan=h[0];if(['bp','pb','bb'].includes(h[1]))st.mode=h[1];}catch(e){}
const MODESUB={bp:'What the plan proposes, against the code at the base commit.',pb:'Where the build diverged from the plan. ≠ marks a divergence; the comment says how.',bb:'The net change that landed. ≠ chips flag lines the plan did not predict.'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G2C={'+':'add','-':'del','~':'chg','≠':'neq',' ':'dim'};
const tok=(k,label,cls='')=>`<span class="tok ${cls}" data-k="${esc(k)}">${esc(label)}</span>`;
const chip=id=>{const t=id.startsWith('AC')?'AC':id[0];return `<span class="chip ${t}${st.filter===id?' on':''}" data-f="${id}">${id}</span>`};
const trunc=(s,n)=>s&&s.length>n?s.slice(0,n-1)+'…':(s||'');
// line = {g, pre, html, plain, cm (html), cmPlain, tags}
function renderLines(lines){
  if(!lines.length)return '<div class="empty">(nothing on either side for this selection)</div>';
  return lines.map(l=>`<div class="ln ${G2C[l.g]||'dim'}"><span class="g">${l.g===' '?'':esc(l.g)}</span><span class="c">${esc(l.pre||'')}${l.html}</span><span class="m">${l.cm||''}</span></div>`).join('');
}
function block(id,title,src,lines,extra=''){
  const txt=lines.map(l=>(l.g+' '+(l.pre||'')+l.plain).padEnd(66)+'  '+(l.cmPlain||'')).join('\n');
  const k='b'+Math.random().toString(36).slice(2);COPY[k]=txt;
  return `<div class="blk"><div class="hd"><span class="id">${esc(id)}</span><span>${title}</span><span class="src">${esc(src||'')}</span><button class="copy" data-copy="${k}">copy</button></div><div class="code">${renderLines(lines)}</div>${extra}</div>`;
}
let COPY={};
const D=()=>DATA[st.plan];
const tagHit=tags=>!st.filter||(tags||[]).includes(st.filter);

/* ---------- FILE TREE ---------- */
function fileLines(){
  const d=D(),m=st.mode,out=[];
  const plannedHas=f=>!f.unplanned&&f.c!=='delete';
  const side=(f,s)=>s==='base'?f.inBase:s==='planned'?(f.unplanned?false:(f.c==='delete'?false:true)):f.inBuilt;
  const A=m==='pb'?'planned':'base',B=m==='bp'?'planned':'built';
  const rows=[];
  for(const f of d.files){
    let a=side(f,A),b=side(f,B);
    if(m==='pb'&&f.unplanned&&f.inBase){a=true}  // unplanned edit of an existing file: exists on both sides, diverges
    if(!a&&!b)continue;
    const syms=[];
    for(const s of f.syms){
      let g=' ',cm='';
      if(m==='pb'){
        if(s.extra){g='≠';cm='not in plan — '+s.extra}
        else if(s.div){g='≠';cm=s.div}
        else cm=trunc(s.note||s.sig,60);
      }else{
        if(m==='bp'&&s.extra)continue;
        g=s.c==='add'?'+':s.c==='delete'?'-':s.c==='edit'?'~':' ';
        if(!a&&b){if(s.c==='delete')continue;g='+'}
        if(a&&!b)g='-';
        cm=trunc(s.note||s.sig,58);
        if(m==='bb'&&(s.extra||s.div))cm+=` <span class="chip" style="color:#d2b6ff;border-color:#5b2a9e" title="${esc(s.extra||s.div)}">≠ plan</span>`;
      }
      syms.push({g,name:s.n,cm});
    }
    let g;
    if(m==='pb'){g=f.unplanned?'≠':(f.div||syms.some(s=>s.g!==' '))?'≠':' '}
    else g=!a&&b?'+':a&&!b?'-':(f.c==='edit'||syms.some(s=>s.g!==' '))?'~':' ';
    let fcm=m==='pb'&&f.unplanned?'not in plan — '+f.unplanned:m==='pb'&&f.div?f.div:trunc(f.why,62);
    rows.push({f,g,fcm,syms,vis:tagHit(f.tags)});
  }
  // folder tree
  const root={kids:{},files:[]};
  for(const r of rows){if(!r.vis)continue;const parts=r.f.p.split('/');let n=root;for(const p of parts.slice(0,-1)){n=n.kids[p]=n.kids[p]||{kids:{},files:[]}}n.files.push(r)}
  function compress(name,n){let nm=name;while(!n.files.length&&Object.keys(n.kids).length===1){const [k,v]=Object.entries(n.kids)[0];nm+='/'+k;n=v}return [nm,n]}
  function marks(n){const all=[...n.files.map(r=>r.g),...Object.values(n.kids).flatMap(marks)];return all}
  function walk(n,pre,path){
    const ents=[...Object.entries(n.kids).map(([k,v])=>['d',...compress(k,v)]),...n.files.map(r=>['f',r])];
    ents.sort((x,y)=>(x[0]===y[0]?0:x[0]==='d'?-1:1));
    ents.forEach((e,i)=>{
      const last=i===ents.length-1,br=last?'└── ':'├── ',cont=pre+(last?'    ':'│   ');
      if(e[0]==='d'){
        const ms=marks(e[2]);const g=ms.every(x=>x==='+')?'+':ms.every(x=>x==='-')?'-':' ';
        const full=path?path+'/'+e[1]:e[1];
        out.push({g,pre:pre+br,html:tok(full,e[1]+'/','dir'),plain:e[1]+'/',cm:'',cmPlain:'',folder:true});
        walk(e[2],cont,full);
      }else{
        const r=e[1],nm=r.f.p.split('/').pop();
        const chips=(r.f.tags||[]).filter(t=>!t.startsWith('D')).slice(0,4).map(chip).join('');
        out.push({g:r.g,pre:pre+br,html:tok(r.f.p,nm),plain:nm,cm:esc(r.fcm)+chips,cmPlain:r.fcm});
        r.syms.forEach(s=>out.push({g:s.g,pre:cont+'  ',html:tok(s.name,s.name),plain:s.name,cm:s.cm,cmPlain:s.cm.replace(/<[^>]+>/g,'')}));
      }
    });
  }
  walk(root,'','');
  return st.only?pruneUnchanged(out):out;
}
function pruneUnchanged(lines){ // keep changed lines and their folder/file ancestors
  const keep=new Array(lines.length).fill(false);
  const depth=l=>(l.pre||'').length;
  for(let i=0;i<lines.length;i++){if(lines[i].g!==' '){keep[i]=true;let d=depth(lines[i]);for(let j=i-1;j>=0&&d>0;j--){if(depth(lines[j])<d){keep[j]=true;d=depth(lines[j])}}}}
  return lines.filter((l,i)=>keep[i]);
}

/* ---------- DEPENDENCY TREE ---------- */
function depLines(){
  const d=D(),m=st.mode;
  const inSide=(e,s)=>s==='base'?e.c==='same':s==='planned'?!e.extra:true;
  const A=m==='pb'?'planned':'base',B=m==='bp'?'planned':'built';
  const by={};
  for(const e of d.edges){const a=inSide(e,A),b=inSide(e,B);if(!a&&!b)continue;if(!tagHit(e.tags))continue;(by[e.from]=by[e.from]||[]).push({e,a,b})}
  const out=[];
  const froms=Object.keys(by).sort();
  froms.forEach(f=>{
    const node=d.nodes[f]||{c:'same'};
    const exA=m==='pb'?true:(node.c!=='add'),exB=true;
    const g=m==='pb'?' ':(!exA&&exB?'+':(node.c==='edit'?'~':' '));
    out.push({g,pre:'',html:tok(f,f,'dir'),plain:f,cm:node.c==='add'&&m!=='pb'?'new package':'',cmPlain:''});
    by[f].sort((x,y)=>x.e.to.localeCompare(y.e.to)).forEach((x,i,arr)=>{
      const br=i===arr.length-1?'└── ':'├── ';
      let g=' ',cm=x.e.note||'';
      if(m==='pb'){if(x.e.extra){g='≠';cm='not in plan — '+x.e.extra}}
      else g=!x.a&&x.b?'+':x.a&&!x.b?'-':' ';
      out.push({g,pre:'  '+br,html:tok(x.e.to,x.e.to),plain:x.e.to,cm:esc(cm),cmPlain:cm});
    });
  });
  return st.only?pruneUnchanged(out):out;
}

/* ---------- CALL TREES ---------- */
function lcs(a,b,key){
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=key(a[i])===key(b[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(key(a[i])===key(b[j])){out.push(['=',a[i],b[j]]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push(['-',a[i],null]);i++}else{out.push(['+',null,b[j]]);j++}}
  while(i<n)out.push(['-',a[i++],null]);while(j<m)out.push(['+',null,b[j++]]);return out;
}
function symEdited(file,s){const f=D().files.find(x=>x.p===file);if(!f)return false;const y=f.syms.find(z=>z.n===s);return y&&y.c==='edit'}
function journeyLines(j){
  const m=st.mode,fn=D().frameNote||{};
  const A=m==='pb'?j.planned:j.base,B=m==='bp'?j.planned:j.built;
  const key=f=>f.s+'|'+f.f;
  return lcs(A,B,key).map(([op,a,b])=>{
    const f=b||a;let g=op==='='?' ':op,cm=f.does||'';
    if(m==='pb'){
      if(op==='+'){g='≠';cm=fn[f.s]||'not in plan: '+cm}
      else if(op==='-'){cm=cm.startsWith('planned')?cm:'planned: '+cm}
      else if(fn[f.s]){g='≠';cm=fn[f.s]}
    }else{
      if(op==='='&&(f.note||symEdited(f.f,f.s)))g='~';
      if(f.note&&m==='bb')cm+=' · '+f.note;
      if(m==='bb'&&fn[f.s])cm+='  ≠';
    }
    const fileNm=f.f.split('/').slice(-2).join('/');
    return {g,pre:'  '.repeat(f.d),html:tok(f.s,f.s),plain:f.s,d:f.d,
      cm:tok(f.f,trunc(fileNm,34))+'  '+esc(trunc(cm,74)),cmPlain:fileNm+'  '+cm};
  });
}

/* ---------- RAIL + PAGE ---------- */
function rail(){
  const d=D();let h='<h3>Goals &amp; acceptance</h3>';
  for(const g of d.goals){
    h+=`<div class="it${st.filter===g.id?' on':''}" data-f="${g.id}" title="${esc(g.title)}"><b>${g.id}</b><span>${esc(g.title)}</span></div>`;
    for(const a of d.acs.filter(a=>a.goal===g.id))h+=`<div class="it ac${st.filter===a.id?' on':''}" data-f="${a.id}" title="${esc(a.title+'\n'+a.cmd)}"><b>${a.id}</b><span>${esc(a.title)}</span></div>`;
  }
  h+='<h3>Decisions</h3>';
  for(const x of d.decisions)h+=`<div class="it${st.filter===x.id?' on':''}" data-f="${x.id}" title="${esc(x.source+' · '+x.title)}"><b>${x.id}</b><span>${esc(x.title)}</span></div>`;
  document.getElementById('rail').innerHTML=h;
}
function page(){
  COPY={};const d=D(),m=st.mode,p=d.plan;
  document.getElementById('title').textContent=`${p.id} ${p.title}`;
  document.querySelectorAll('#plans button').forEach(b=>b.classList.toggle('on',b.dataset.p===st.plan));
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('modesub').textContent=MODESUB[m];
  const cm={bp:[p.baseCommit,'plan'],pb:['plan',p.builtCommit],bb:[p.baseCommit,p.builtCommit]}[m];
  let h=`<div class="legend"><span>${esc(cm[0])} → ${esc(cm[1])}</span><span><b style="background:#1f6f3b">+</b> added</span><span><b style="background:#8b1e24">-</b> removed</span><span><b style="background:#8a6500">~</b> changed</span><span><b style="background:#5b2a9e">≠</b> build diverged from plan</span><span>blank = unchanged (dimmed)</span></div>`;
  if(p.kind==='greenfield'&&m!=='pb')h+=`<div class="banner"><b>Greenfield: the base is nearly empty, and that is the point.</b> At <code>${p.baseCommit}</code> there is no <code>auto-mail/</code> at all. Everything under it is <code>+</code>. The only lines with a "before" are the seams it plugs into: the <code>auto hooks fire</code> path in <code>auto-cli</code>, <code>go.work</code>, the <code>Makefile</code>, the glossary and the harness.</div>`;
  if(m!=='pb'&&p.kind==='brownfield')h+=`<div class="banner"><b>Brownfield:</b> most lines are blank, which means they already existed at <code>${p.baseCommit}</code>. The change lands as small <code>+</code>/<code>~</code> marks in existing code.</div>`;
  if(m==='pb')h+=`<div class="banner"><b>How "planned" is derived:</b> it is the as-built model with every recorded divergence reverted. Those divergences are the model's <code>notes</code> (${d.notes.length}), mapped to files, symbols, frames and imports. Lines without a <code>≠</code> matched the plan as far as the plan said anything.</div>`;
  if(st.filter){const it=[...d.goals,...d.acs,...d.decisions].find(x=>x.id===st.filter);h+=`<div class="banner filt">Filtered to <b>${st.filter}</b>: ${esc(it?it.title:'')}${it&&it.cmd?` <code style="font-size:11.5px">${esc(it.cmd)}</code>`:''}<button data-f="${st.filter}">clear</button></div>`}
  const fl=fileLines();
  h+=`<h2>1 · File tree<small>folders → files → symbols</small></h2>`+block('files',`${fl.filter(l=>!l.folder&&!l.pre.endsWith('  ')).length?'':''}${esc(p.id)} file tree`,'from files[] · base/built existence from git ls-tree',fl);
  const dl=depLines();
  h+=`<h2>2 · Dependency tree<small>package → imports</small></h2>`+block('deps','package imports','deps.edges · base = edges already present at '+p.baseCommit,dl);
  h+=`<h2>3 · Call trees<small>one per journey; indentation = calls</small></h2>`;
  let shown=0;
  for(const j of d.journeys){
    if(!tagHit(j.tags))continue;shown++;
    const ls=journeyLines(j);
    const vis=st.only?ls.filter(l=>l.g!==' '):ls;
    h+=block(j.id,esc(j.title)+' '+j.tags.filter(t=>!t.startsWith('D')).map(chip).join(''),'base: '+j.basesrc,vis,j.result&&m!=='bp'?`<div class="res">→ ${esc(trunc(j.result,220))}</div>`:'');
  }
  if(!shown)h+='<div class="banner">No journey is tagged with this id. The file and dependency trees above still show the lines it touches.</div>';
  document.getElementById('main').innerHTML=h;
  rail();applySel();
  try{history.replaceState(null,'','#'+st.plan+'/'+st.mode)}catch(e){}
}
function applySel(){document.querySelectorAll('.tok.sel').forEach(e=>e.classList.remove('sel'));if(st.sel)document.querySelectorAll('.tok').forEach(e=>{if(e.dataset.k===st.sel)e.classList.add('sel')})}
document.addEventListener('click',e=>{
  const pb=e.target.closest('#plans button');if(pb){st.plan=pb.dataset.p;st.filter=null;page();return}
  const mb=e.target.closest('#modes button');if(mb){st.mode=mb.dataset.m;page();return}
  const f=e.target.closest('[data-f]');if(f){st.filter=st.filter===f.dataset.f?null:f.dataset.f;page();return}
  const c=e.target.closest('[data-copy]');if(c){navigator.clipboard&&navigator.clipboard.writeText(COPY[c.dataset.copy]).then(()=>{c.textContent='copied';setTimeout(()=>c.textContent='copy',900)},()=>{});return}
  const t=e.target.closest('.tok');if(t){st.sel=st.sel===t.dataset.k?null:t.dataset.k;applySel();}
});
document.addEventListener('mouseover',e=>{const t=e.target.closest('.tok');document.querySelectorAll('.tok.hl').forEach(x=>x.classList.remove('hl'));if(t)document.querySelectorAll('.tok').forEach(x=>{if(x.dataset.k===t.dataset.k)x.classList.add('hl')})});
document.getElementById('onlych').addEventListener('change',e=>{st.only=e.target.checked;page()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('/');let ch=false;if(DATA[h[0]]&&h[0]!==st.plan){st.plan=h[0];st.filter=null;ch=true}if(['bp','pb','bb'].includes(h[1])&&h[1]!==st.mode){st.mode=h[1];ch=true}if(ch)page()});
page();
</script></body></html>
