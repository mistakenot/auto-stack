<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#f4f1ea;--ink:#1b1a17;--mute:#6b665c;--line:#d9d3c5;--card:#fffdf8;--accent:#d2461e;--green:#2f7d4f;--brown:#9a6a2b;--chip:#ece6d8;
  --red:#b3261e;--violet:#6b4fa0;--blue:#2e6a8e;--file:#a39d90;
  --sans:"Inter",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15140f;--ink:#efeadf;--mute:#a39d90;--line:#34312a;--card:#1e1c17;--accent:#ff7a4d;--green:#6cc592;--brown:#e0a85c;--chip:#2a2721;
  --red:#ff6b6b;--violet:#b39ddb;--blue:#7fb8dc;--file:#6f6a5e;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15140f;--ink:#efeadf;--mute:#a39d90;--line:#34312a;--card:#1e1c17;--accent:#ff7a4d;--green:#6cc592;--brown:#e0a85c;--chip:#2a2721;
  --red:#ff6b6b;--violet:#b39ddb;--blue:#7fb8dc;--file:#6f6a5e;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;display:flex;flex-direction:column}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.86em}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font:700 20px/1.1 var(--serif);margin:0}
header .sub{color:var(--mute);font-size:13px;flex:1 1 300px;min-width:0}
header .pid{font-family:var(--mono);font-size:12px;color:var(--mute)}
header .spacer{flex:1}
.btn{font:500 13px var(--sans);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
svg#g{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
svg#g:active{cursor:grabbing}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.tools>*{pointer-events:auto}
.search{position:relative;flex:0 1 280px;min-width:160px}
.search input{width:100%;font:14px var(--sans);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sugg{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;display:none;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.sugg div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.sugg div:hover,.sugg div.hi{background:var(--chip)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;background:transparent}
details.legend{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;flex:0 1 640px;font-size:12px}
details.legend summary{cursor:pointer;font-weight:600;list-style:none}
details.legend summary::before{content:"▸ ";color:var(--mute)}
details.legend[open] summary::before{content:"▾ "}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:0 10px;margin-top:4px}
.lg h4{grid-column:1/-1;margin:4px 0 1px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lg label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.lg label .n{color:var(--mute);font-family:var(--mono);font-size:11px}
.lg svg{flex:none}
.hint{position:absolute;left:12px;bottom:10px;color:var(--mute);font-size:12px;pointer-events:none}
/* panel */
aside{width:400px;flex:none;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:16px}
aside .handle{display:none}
aside h2{font:700 19px/1.25 var(--serif);margin:4px 0 8px;overflow-wrap:anywhere}
aside h3{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--ink)}
.chip.mono{font-family:var(--mono)}
.prose p{margin:6px 0}
.prose ul{margin:6px 0;padding-left:18px}
.prose code{background:var(--chip);border-radius:4px;padding:0 3px}
pre{font:12px/1.5 var(--mono);background:var(--chip);border-radius:8px;padding:10px;overflow:auto;white-space:pre;margin:6px 0}
.ref{cursor:pointer;color:var(--accent);text-decoration:underline dotted;text-underline-offset:2px}
.erow{display:flex;gap:8px;align-items:baseline;padding:4px 6px;border-radius:6px;cursor:pointer}
.erow:hover{background:var(--chip)}
.erow .et{font-family:var(--mono);font-size:11px;color:var(--mute);width:104px;flex:none;white-space:nowrap}
.erow .lab{font-family:var(--mono);font-size:11.5px;font-weight:600;flex:none}
.erow .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ins li{margin:4px 0}
ol.steps{padding-left:20px;margin:6px 0}
/* svg */
.link{fill:none;stroke-width:1.2;transition:opacity .2s}
.node{cursor:pointer;transition:opacity .2s}
.node text.glyph{font-family:var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--bg);font-weight:700}
.node text.lbl{font:600 10.5px var(--mono);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.node text.lbl.file{font-weight:400;font-size:9.5px;fill:var(--mute)}
.dim{opacity:.08}
.node.sel circle,.node.sel path{stroke:var(--accent);stroke-width:3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;max-width:300px;display:none;z-index:6}
@media (max-width:760px){
  header .sub{flex-basis:100%;order:5}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;height:52vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(calc(100% - 48px));transition:transform .25s;z-index:10;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-top:0}
  aside.open{transform:none}
  aside .handle #handle-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:8px}
  aside .handle{display:flex;position:sticky;top:0;background:var(--card);height:48px;padding:6px 0 0;align-items:center;justify-content:space-between;cursor:pointer;z-index:2;font-weight:600}
  aside .handle::before{content:"";position:absolute;top:4px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
  #stage{padding-bottom:52px}
  details.legend{max-width:100%;flex-basis:100%}
  .hint{display:none}
  .bandlbl{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Plan Constellation</h1>
  <span class="pid" id="pid"></span>
  <span class="sub">Every node and edge of the plan as one force map — goals on top, files at the bottom. Click a star to trace its lineage up and down.</span>
  <a class="btn" href="index.html">← lab index</a>
  <button class="btn" id="theme" title="Toggle theme">◐</button>
</header>
<main>
  <div id="stage">
    <svg id="g"></svg>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="Search id, label or text…" autocomplete="off"><div class="sugg" id="sugg"></div></div>
      <div class="seg"><button class="btn on" id="lay-band">Bands</button><button class="btn" id="lay-free">Free</button></div>
      <button class="btn" id="files">Show files</button>
      <button class="btn" id="fit">Fit</button>
      <details class="legend" id="legend"><summary>Legend &amp; filters</summary><div class="lg" id="lg"></div></details>
    </div>
    <div class="hint">drag to pan · scroll to zoom · click a node to trace · Esc to clear</div>
    <div class="tip" id="tip"></div>
  </div>
  <aside id="panel"><div class="handle" id="handle"><span id="handle-t">Overview</span><span>⌃</span></div><div id="pbody"></div></aside>
</main>

<script type="application/json" id="plan-graph">
{
  "version": "1.0.0",
  "id": "001-hqax",
  "nodes": [
    {
      "id": "ac-21xb",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** any graph written by the CLI\n- **When** it is read and written again\n- **Then** the bytes are identical: nodes sorted by type then ID, edges by (from, type, to), fixed key order, 2-space indent, no HTML escaping, trailing newline\n- **And** `auto plan fmt <plan>` rewrites a hand-edited file into canonical form; `fmt --check` exits non-zero when it isn't\n- **And** only malformed JSON fails to decode (`parse-error`); everything else is reported by validation with its JSON path",
        "title": "graph.json is canonical and deterministic",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/graph/ -run 'RoundTrip|Fmt'",
          "tests": [
            "auto-plan/internal/graph/graph_test.go",
            "auto-plan/internal/cli/cli_integration_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-34fe",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** the schema\n- **Then** goal, ac, decision, alternative, rail, defect, stage, file, question, tree, journey, leg and child exist, with required fields validated for presence and format\n- **And** edge types are typed by their endpoints and a wrong endpoint type is rejected (`proves` is ac→goal only, `about` is tree→any, …)",
        "title": "Every node type from the design is representable",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/schema/ ./internal/graph/",
          "tests": [
            "auto-plan/internal/schema/registry_test.go",
            "auto-plan/internal/graph/graph_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-4qrn",
      "type": "ac",
      "status": "active",
      "rank": "a2",
      "fields": {
        "gwt": "- **Given** a plan at `lifecycle: requirements` holding only goals, questions and decisions\n- **Then** lint reports no errors\n- **And** at `solution`, `goal-no-ac` and `ac-no-verify` apply; at `plan`, stage and file coverage apply too\n- **And** open `question` nodes report `open-question` as a gate at every step",
        "title": "Partial plans are valid at their lifecycle step",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/lint/ -run Lifecycle",
          "tests": [
            "auto-plan/internal/lint/lint_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-6733",
      "type": "ac",
      "status": "active",
      "rank": "a1",
      "fields": {
        "gwt": "- **Given** any mutating command\n- **When** it succeeds\n- **Then** stdout carries a top-level `id` plus the changed fields, and the file on disk is canonical\n- **When** it would create an invalid graph\n- **Then** it exits non-zero with `[]ValidationError` and a hint, and `graph.json` is **byte-identical** to before",
        "title": "Writes are validated and atomic, and report what changed",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/cli/ -run Rejected",
          "tests": [
            "auto-plan/internal/graph/graph_test.go",
            "auto-plan/internal/cli/cli_integration_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-6xez",
      "type": "ac",
      "status": "active",
      "rank": "a1",
      "fields": {
        "gwt": "- **Given** the real `auto` binary built from source and a fresh temp workspace\n- **When** the `lifecycle` scenario runs init → new → add/link/update/unlink → a rejected write → retire → lifecycle → fmt → lint\n- **Then** at every `# checkpoint` each `graph.json` is byte-identical to its snapshot\n- **When** the `dogfood` scenario re-expresses epic 005, task 062 and task 052 from CLI commands alone\n- **Then** every snapshot matches and `auto plan lint all` exits 0",
        "title": "E2E: scripted CLI scenarios in a temp workspace produce exactly the expected graph.json",
        "verify": {
          "cmd": "cd auto-plan && go test ./e2e/",
          "tests": [
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-7msa",
      "type": "ac",
      "status": "active",
      "rank": "a1",
      "fields": {
        "gwt": "- **Given** a plan\n- **When** `auto plan show <plan> --text` runs\n- **Then** each ◎ goal, its ✓ ACs with verify commands, and the ◆ decisions that constrain it with `-` rejected alternatives; then rails, defects and open questions\n- **And** the JSON form carries the same information",
        "title": "show renders the plan as a goal ladder an agent can read at a glance",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/render/ -run Show",
          "tests": [
            "auto-plan/internal/render/render_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-fqq9",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** a plan with active and retired nodes\n- **When** `auto plan add <plan> ac …` runs\n- **Then** the new ID matches `^[a-z]{1,4}-[0-9a-hjkmnp-tv-z]{4}$`, regenerated on collision with any ID in the plan, retired included\n- **And** it gets a `rank` after its last sibling; `move` changes only that node's rank\n- **And** no command changes or deletes an ID; `retire` sets `status: retired`",
        "title": "IDs are generated, stable and never reused",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/graph/ -run 'ID|Rank|Move|Retire'",
          "tests": [
            "auto-plan/internal/graph/graph_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-g3z3",
      "type": "ac",
      "status": "active",
      "rank": "a4",
      "fields": {
        "gwt": "- **Given** an epic with goals, journeys + legs, rails, decisions and `child` nodes, and a task plan referencing epic nodes by qualified ID\n- **When** `auto plan lint all` runs\n- **Then** it reports `rail-unhonored`, `rail-undischarged` (per child), `leg-undelivered`, `child-missing`, `child-epic-mismatch`, `superseded-ref` and child `dependency-cycle`\n- **And** child plans never copy rail text",
        "title": "Epics: inheritance is referenced, and gaps are caught",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/lint/ -run Epic",
          "tests": [
            "auto-plan/internal/lint/lint_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-h5qy",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** a repo whose plans root holds `001-a/` and `003-b/` (or does not exist yet)\n- **When** `auto plan new stage-briefs --kind task` runs from any subdirectory\n- **Then** it creates `004-stage-briefs/graph.json` (highest + 1, or `001`) holding exactly the `plan` node at `lifecycle: requirements` and no edges\n- **And** `--kind` accepts only `task|epic`; a bad name or an existing folder exits non-zero with a hint and writes nothing",
        "title": "auto plan new creates a numbered plan folder",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/workspace/ ./internal/cli/ ./e2e/",
          "tests": [
            "auto-plan/internal/workspace/workspace_test.go",
            "auto-plan/internal/cli/cli_integration_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-mybp",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** a populated plan\n- **Then** `list` returns IDs, metadata and titles only; `describe` the cheap summary rung with truncated text and the exact `get` recovery command; `get` the full node plus edges; `search` case-insensitive matches in one plan or all",
        "title": "Resource verbs: list, describe, get and search return the right fidelity",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/cli/ -run 'List|Describe|Get|Search'",
          "tests": [
            "auto-plan/internal/cli/cli_integration_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-qxxe",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` before any `auto-plan` Go file exists\n- **When** the task's first change adds a **Planning** section\n- **Then** it defines Plan, Child Plan, Goal, Acceptance Criterion, Decision, Alternative, Rail, Defect, Stage, File Change, Journey, Leg, Question and Tree in the house format\n- **And** Segment's, Observation's and TaskDef's `_Avoid_` lines are narrowed to their own domains\n- **And** every registry node type names its canonical term (`NodeType.Term`) and a registry test proves each exists in the glossary\n- **And** `glossary.py check` exits 0",
        "title": "The vocabulary lands first and the glossary stays valid",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/schema/ -run Glossary",
          "tests": [
            "auto-plan/internal/schema/registry_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-r6cp",
      "type": "ac",
      "status": "active",
      "rank": "a3",
      "fields": {
        "gwt": "- **Given** a plan at `lifecycle: plan`\n- **Then** lint reports `unplanned-file`, `untracked-file`, `missing-dep`, `dependency-cycle` and `open-question` with pd-lint's meanings",
        "title": "lint subsumes today's pd-lint checks",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/lint/ -run PdLint",
          "tests": [
            "auto-plan/internal/lint/lint_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-rap2",
      "type": "ac",
      "status": "active",
      "rank": "a2",
      "fields": {
        "gwt": "- **Given** any node, including a qualified epic node\n- **When** `auto plan trace <plan> <id> [--up|--down]` runs\n- **Then** it prints the chain of edges to the roots (up) and the leaves (down), crossing into the epic via the child plan",
        "title": "trace shows lineage in both directions",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/render/ -run Trace",
          "tests": [
            "auto-plan/internal/render/render_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-t9jf",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** fixture graphs that each break one rule\n- **When** `auto plan lint <plan>` (or `lint all`) runs\n- **Then** each fixture yields exactly its code and a clean fixture yields none\n- **And** output is `{plan, ok, issues:[{code,severity,path,field,message,hint}]}`; exit 1 on any error, warnings alone exit 0",
        "title": "lint reports every structural problem, structured, with remediation",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/lint/",
          "tests": [
            "auto-plan/internal/lint/lint_test.go",
            "auto-plan/internal/cli/cli_integration_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-temp",
      "type": "ac",
      "status": "active",
      "rank": "a5",
      "fields": {
        "gwt": "- **Given** `make build` from the repo root\n- **Then** `auto plan` is mounted: `TestAllToolsMounted`, `go.work`, Makefile `PROJECTS`, the root `CLAUDE.md` table\n- **And** `auto plan quickstart` and `auto plan docs` print the happy path and the full reference\n- **And** `make check`, `make test` and `make stale-refs` are green",
        "title": "Mounted, documented and dogfooded end to end",
        "verify": {
          "cmd": "make build && make check && make stale-refs",
          "tests": [
            "auto-cli/cmd/auto/main_test.go",
            "auto-plan/internal/cli/cli_integration_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-w7q1",
      "type": "ac",
      "status": "active",
      "rank": "a4",
      "fields": {
        "gwt": "- **Given** a plan at `lifecycle: plan`\n- **When** `auto plan brief <plan> <stage>` runs\n- **Then** it holds the stage's steps and commit, its `dependsOn` stages with status, its file tree, covered ACs with verify commands, constraining decisions and rails, and open questions\n- **And** nothing about other stages beyond their IDs and titles",
        "title": "A stage brief gives an executing agent everything for one stage",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/render/ -run Brief",
          "tests": [
            "auto-plan/internal/render/render_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-zcn4",
      "type": "ac",
      "status": "active",
      "rank": "a3",
      "fields": {
        "gwt": "- **Given** a `tree` node\n- **Then** `auto plan tree <plan> <id>` renders the aligned gutter and comment column\n- **Given** a plan's `file` nodes\n- **Then** `auto plan tree <plan> --files [--stage <id>]` derives a `├──` file tree with a `+ ~ -` gutter",

<script>
const G = JSON.parse(document.getElementById('plan-graph').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- model ---------- */
const TYPES = {
  plan:{name:'Plan',glyph:'★',color:'--accent'},
  goal:{name:'Goal',glyph:'◎',color:'--accent'},
  defect:{name:'Defect',glyph:'✗',color:'--red'},
  ac:{name:'Acceptance criterion',glyph:'✓',color:'--green'},
  tree:{name:'Tree',glyph:'⌥',color:'--blue'},
  question:{name:'Question',glyph:'?',color:'--violet'},
  decision:{name:'Decision',glyph:'◆',color:'--brown'},
  alternative:{name:'Rejected alternative',glyph:'−',color:'--mute'},
  stage:{name:'Stage',glyph:'▸',color:'--ink'},
  file:{name:'File',glyph:'~',color:'--file'},
};
const EDGES = {
  proves:{color:'--green',dash:'',w:1.6,desc:'ac → goal'},
  constrains:{color:'--brown',dash:'5 3',w:1.2,desc:'decision → goal|ac'},
  rejects:{color:'--mute',dash:'1 3',w:1.2,desc:'decision → alternative'},
  wouldBreak:{color:'--red',dash:'4 2',w:1.6,desc:'alternative → ac|goal'},
  supersedes:{color:'--accent',dash:'8 3 2 3',w:1.8,desc:'newer → older decision'},
  dependsOn:{color:'--ink',dash:'',w:2.4,desc:'stage → earlier stage'},
  covers:{color:'--blue',dash:'',w:1,desc:'stage → ac'},
  touches:{color:'--file',dash:'',w:.7,desc:'stage → file'},
  addresses:{color:'--accent',dash:'2 2',w:1.4,desc:'goal → defect'},
  about:{color:'--violet',dash:'1 2',w:1.4,desc:'tree → any'},
};
// which end of an edge is "upper" in the trace sense (toward goals); lateral = 1 hop only
const UP = {proves:'to',constrains:'to',wouldBreak:'to',covers:'to',about:'to',rejects:'from',touches:'from',addresses:'from',supersedes:null,dependsOn:null};

const byRank = (a,b) => (a.rank < b.rank ? -1 : a.rank > b.rank ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const nodes = G.nodes.map(n => ({...n}));
const N = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = G.edges.filter(e => N[e.from] && N[e.to]).map(e => ({...e, source: e.from, target: e.to}));
const outE = {}, inE = {};
nodes.forEach(n => { outE[n.id] = []; inE[n.id] = []; });
edges.forEach(e => { outE[e.from].push(e); inE[e.to].push(e); });
const deg = id => outE[id].length + inE[id].length;
const ofType = t => nodes.filter(n => n.type === t).sort(byRank);

// positional labels
ofType('goal').forEach((n,i) => n.label = 'G' + (i+1));
ofType('decision').forEach((n,i) => n.label = 'D' + (i+1));
ofType('defect').forEach((n,i) => n.label = 'X' + (i+1));
ofType('question').forEach((n,i) => n.label = 'Q' + (i+1));
ofType('tree').forEach((n,i) => n.label = 'T' + (i+1));
{ // stages by dependsOn chain
  const st = ofType('stage'); const next = {};
  edges.filter(e => e.type === 'dependsOn').forEach(e => next[e.to] = e.from);
  let cur = st.find(s => !outE[s.id].some(e => e.type === 'dependsOn')); let i = 1; const seen = new Set();
  while (cur && !seen.has(cur.id)) { seen.add(cur.id); cur.label = 'S' + i; cur.order = i - 1; i++; cur = N[next[cur.id]]; }
  st.filter(s => !s.label).forEach(s => { s.label = 'S' + i; s.order = i - 1; i++; });
}
{ // ACs under first goal they prove
  const goals = ofType('goal'); const cnt = {};
  ofType('ac').forEach(a => {
    const gs = outE[a.id].filter(e => e.type === 'proves').map(e => N[e.to]).sort(byRank);
    const g = gs[0]; const gl = g ? g.label.slice(1) : '0';
    cnt[gl] = (cnt[gl] || 0) + 1; a.label = 'AC' + gl + '.' + cnt[gl];
  });
}
{ // alternatives under the rejecting decision
  const cnt = {};
  ofType('alternative').forEach(a => {
    const d = inE[a.id].find(e => e.type === 'rejects'); const dl = d ? N[d.from].label : 'D?';
    cnt[dl] = (cnt[dl] || 0) + 1; a.label = dl + '−' + String.fromCharCode(96 + cnt[dl]);
  });
}
ofType('file').forEach(n => { n.label = (n.fields.path || n.id).split('/').pop(); });
N.plan && (N.plan.label = 'PLAN');
const titleOf = n => n.type === 'file' ? n.fields.path : n.type === 'plan' ? n.fields.name : (n.fields.title || n.id);
const glyphOf = n => n.type === 'file' ? (n.fields.change === 'add' ? '+' : n.fields.change === 'delete' ? '−' : '~') : TYPES[n.type].glyph;
const radius = n => n.type === 'goal' ? 17 : n.type === 'plan' ? 13 : n.type === 'stage' ? 11 + Math.min(6, deg(n.id) / 8) : n.type === 'file' ? 4.5 + Math.min(3, deg(n.id) / 2) : n.type === 'alternative' ? 6 : 9;
$('#pid').textContent = G.id + (N.plan ? ' · ' + N.plan.fields.name : '');

/* ---------- state ---------- */
const typeOn = Object.fromEntries(Object.keys(TYPES).map(t => [t, t !== 'file']));
const edgeOn = Object.fromEntries(Object.keys(EDGES).map(t => [t, t !== 'touches']));
let layout = 'band', selected = null, lit = null;

/* ---------- svg ---------- */
const svg = d3.select('#g');
const defs = svg.append('defs');
Object.entries(EDGES).forEach(([t, s]) => {
  defs.append('marker').attr('id', 'm-' + t).attr('viewBox', '0 -4 8 8').attr('refX', 8).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').style('fill', `var(${s.color})`);
});
const root = svg.append('g');
const bandG = root.append('g');
const linkG = root.append('g');
const nodeG = root.append('g');
const zoom = d3.zoom().scaleExtent([0.15, 6]).on('zoom', ev => root.attr('transform', ev.transform));
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', ev => { if (ev.target === svg.node()) select(null); });

let W = 1000, H = 700;
const BANDS = [['plan','goal','defect'],['ac'],['tree','question'],['decision'],['alternative'],['stage'],['file']];
const BAND_NAME = ['Goals','Acceptance criteria','Trees · questions','Decisions','Rejected alternatives','Stages','Files'];
function bandY() {
  const vis = BANDS.map((b, i) => [b, i]).filter(([b]) => b.some(t => typeOn[t]));
  const map = {}, rows = [];
  vis.forEach(([b, i], k) => { const y = H * (0.1 + 0.82 * (vis.length === 1 ? 0.5 : k / (vis.length - 1))); b.forEach(t => map[t] = y); rows.push({y, name: BAND_NAME[i]}); });
  return {map, rows};
}
function targetX(n) {
  if (n.type === 'stage') return W * (0.08 + 0.84 * (n.order / Math.max(1, ofType('stage').length - 1)));
  if (n.type === 'goal') { const g = ofType('goal'); return W * (0.12 + 0.76 * (g.indexOf(n) / Math.max(1, g.length - 1))); }
  if (n.type === 'defect') return W * 0.94;
  if (n.type === 'plan') return W * 0.04;
  if (deg(n.id) === 0) return W * 0.97;
  return W / 2;
}

const sim = d3.forceSimulation().alphaDecay(0.035)
  .force('link', d3.forceLink().id(d => d.id).distance(l => l.type === 'touches' ? 40 : l.type === 'dependsOn' ? 60 : 70).strength(l => l.type === 'touches' ? 0.15 : 0.3))
  .force('charge', d3.forceManyBody().strength(d => d.type === 'file' ? -40 : -160).distanceMax(400))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .on('tick', ticked);

let linkSel = linkG.selectAll('path'), nodeSel = nodeG.selectAll('g');

function visibleNodes() { return nodes.filter(n => typeOn[n.type]); }
function visibleEdges(vis) { const s = new Set(vis.map(n => n.id)); return edges.filter(e => edgeOn[e.type] && s.has(e.from) && s.has(e.to)); }

function applyForces() {
  const {map, rows} = bandY();
  if (layout === 'band') {
    sim.force('y', d3.forceY(d => map[d.type] ?? H / 2).strength(d => deg(d.id) === 0 ? 0.3 : 0.55));
    sim.force('x', d3.forceX(d => targetX(d)).strength(d => d.type === 'stage' ? 0.7 : d.type === 'goal' ? 0.25 : deg(d.id) === 0 || d.type === 'defect' ? 0.4 : 0.03));
  } else {
    sim.force('y', d3.forceY(H / 2).strength(0.04));
    sim.force('x', d3.forceX(W / 2).strength(0.04));
  }
  const bs = bandG.selectAll('g').data(layout === 'band' ? rows : [], d => d.name);
  bs.exit().remove();
  const be = bs.enter().append('g');
  be.append('line').attr('stroke', 'var(--line)').attr('stroke-dasharray', '2 6');
  be.append('text').attr('class', 'bandlbl').style('font', '600 11px var(--sans)').style('letter-spacing', '.08em').attr('fill', 'var(--mute)');
  be.merge(bs).select('line').attr('x1', -W).attr('x2', 2 * W).attr('y1', d => d.y).attr('y2', d => d.y);
  be.merge(bs).select('text').attr('x', -W * 0.02).attr('y', d => d.y - 22).attr('text-anchor', 'end').text(d => d.name.toUpperCase());
}

function rebuild(reheat = 0.8) {
  const vn = visibleNodes(), ve = visibleEdges(vn);
  const {map} = bandY();
  vn.forEach(n => { if (n.x == null) { n.x = targetX(n) + (Math.random() - .5) * W * 0.6; n.y = (map[n.type] ?? H / 2) + (Math.random() - .5) * 40; } });
  linkSel = linkG.selectAll('path').data(ve, d => d.id);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append('path').attr('class', 'link')
    .style('stroke', d => `var(${EDGES[d.type].color})`).attr('stroke-width', d => EDGES[d.type].w)
    .attr('stroke-dasharray', d => EDGES[d.type].dash || null)
    .attr('marker-end', d => d.type === 'touches' ? null : `url(#m-${d.type})`).merge(linkSel);
  nodeSel = nodeG.selectAll('g.node').data(vn, d => d.id);
  nodeSel.exit().remove();
  const ne = nodeSel.enter().append('g').attr('class', 'node')
    .on('click', (ev, d) => { ev.stopPropagation(); select(d.id); })
    .on('mouseenter', (ev, d) => showTip(ev, d)).on('mousemove', (ev, d) => showTip(ev, d)).on('mouseleave', () => $('#tip').style.display = 'none')
    .call(d3.drag().on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end', (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  ne.append('circle').attr('r', d => radius(d))
    .style('fill', d => d.type === 'file' || d.type === 'alternative' ? 'var(--card)' : `var(${TYPES[d.type].color})`)
    .style('stroke', d => d.type === 'file' || d.type === 'alternative' ? `var(${TYPES[d.type].color})` : 'var(--bg)')
    .attr('stroke-width', d => d.type === 'goal' ? 3 : 1.5)
    .attr('stroke-dasharray', d => d.status === 'retired' ? '2 2' : null)
    .style('opacity', d => d.status === 'retired' ? 0.55 : 1);
  ne.filter(d => d.type === 'goal').append('circle').attr('r', 23).style('fill', 'none').style('stroke', 'var(--accent)').attr('stroke-width', 1).attr('stroke-dasharray', '2 3');
  ne.filter(d => d.type !== 'file').append('text').attr('class', 'glyph')
    .style('font-size', d => (radius(d) * 1.1) + 'px')
    .style('fill', d => d.type === 'alternative' ? 'var(--mute)' : 'var(--bg)').text(d => glyphOf(d));
  ne.append('text').attr('class', d => 'lbl' + (d.type === 'file' ? ' file' : ''))
    .attr('x', d => radius(d) + 3).attr('y', d => d.type === 'goal' ? -radius(d) - 4 : 3).text(d => d.type === 'file' ? glyphOf(d) + ' ' + d.label : d.label);
  nodeSel = ne.merge(nodeSel);
  sim.nodes(vn); sim.force('link').links(ve);
  applyForces();
  sim.alpha(reheat).restart();
  paintLit();
}

function ticked() {
  linkSel.attr('d', d => {
    const s = d.source, t = d.target, dx = t.x - s.x, dy = t.y - s.y, L = Math.hypot(dx, dy) || 1;
    const rt = radius(t) + (d.type === 'touches' ? 0 : 2), rs = radius(s);
    const x1 = s.x + dx / L * rs, y1 = s.y + dy / L * rs, x2 = t.x - dx / L * rt, y2 = t.y - dy / L * rt;
    if (d.type === 'dependsOn' || d.type === 'supersedes') { const c = 0.25; return `M${x1},${y1}Q${(x1 + x2) / 2 - dy * c},${(y1 + y2) / 2 + dx * c} ${x2},${y2}`; }
    return `M${x1},${y1}L${x2},${y2}`;
  });
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  const mx = d3.min(sim.nodes(), d => d.x) - 24;
  bandG.selectAll('text').attr('x', mx);
}

function fit(ids, dur = 600) {
  const pts = (ids ? ids.map(i => N[i]) : sim.nodes()).filter(n => n && n.x != null && typeOn[n.type]);
  if (!pts.length) return;
  const x0 = d3.min(pts, d => d.x) - 40, x1 = d3.max(pts, d => d.x) + 60, y0 = d3.min(pts, d => d.y) - 50, y1 = d3.max(pts, d => d.y) + 40;
  const box = $('#stage').getBoundingClientRect();
  const topPad = $('.tools').getBoundingClientRect().height + 20, botPad = innerWidth <= 760 ? ($('#panel').classList.contains('open') || (ids && ids.length === 1) ? innerHeight * 0.52 : 70) : 20;
  const aw = box.width, ah = box.height - topPad - botPad;
  const k = ids && ids.length === 1 ? Math.max(1.3, d3.zoomTransform(svg.node()).k) : Math.min(2.2, 0.92 * Math.min(aw / (x1 - x0), ah / (Math.max(1, y1 - y0))));
  const tx = aw / 2 - k * (x0 + x1) / 2, ty = topPad + ah / 2 - k * (y0 + y1) / 2;
  svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

/* ---------- trace ---------- */
function trace(id) {
  const up = new Set([id]), down = new Set([id]), lateral = new Set(), litE = new Set();
  const walk = (set, dir) => {
    const q = [id];
    while (q.length) {
      const cur = q.shift();
      [...outE[cur], ...inE[cur]].forEach(e => {
        const u = UP[e.type]; if (!u) return;
        const upper = e[u], lower = u === 'to' ? e.from : e.to;
        const nxt = dir === 'up' ? (lower === cur ? upper : null) : (upper === cur ? lower : null);
        if (!nxt) return; litE.add(e.id);
        if (!set.has(nxt)) { set.add(nxt); q.push(nxt); }
      });
    }
  };
  walk(up, 'up'); walk(down, 'down');
  [...outE[id], ...inE[id]].filter(e => !UP[e.type]).forEach(e => { lateral.add(e.from === id ? e.to : e.from); litE.add(e.id); });
  return {up, down, lateral, edges: litE, all: new Set([...up, ...down, ...lateral])};
}
function paintLit() {
  nodeSel.classed('dim', d => lit && !lit.all.has(d.id)).classed('sel', d => d.id === selected);
  linkSel.classed('dim', d => lit && !lit.edges.has(d.id));
}

/* ---------- selection & panel ---------- */
function select(id, {zoomTo = false} = {}) {
  selected = id; lit = id ? trace(id) : null;
  if (id) $('#legend').open = false; // the open legend would cover the traced goals at the top
  if (id && !typeOn[N[id].type]) { typeOn[N[id].type] = true; if (N[id].type === 'file') edgeOn.touches = true; syncControls(); rebuild(0.5); setTimeout(() => fit([id]), 500); }
  else if (zoomTo && id) fit([id]);
  paintLit(); renderPanel();
  if (innerWidth <= 760) $('#panel').classList.toggle('open', !!id);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { select(null); hideSugg(); } });

const refLink = id => N[id] ? `<span class="ref" data-id="${esc(id)}">${esc(N[id].label || id)}</span>` : `<code>${esc(id)}</code>`;
function inline(s) {
  return String(s).split(/(`[^`]*`)/).map(p => p.startsWith('`') && p.endsWith('`') && p.length > 1 ? `<code>${esc(p.slice(1, -1))}</code>`
    : esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[([a-z0-9-]+)\]\]/g, (m, id) => refLink(id))).join('');
}
function md(s) {
  if (!s) return '';
  let out = '', inList = false;
  String(s).split('\n').forEach(line => {
    const m = line.match(/^\s*[-*]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(m[1])}</li>`; }
    else { if (inList) { out += '</ul>'; inList = false; } if (line.trim()) out += `<p>${inline(line)}</p>`; }
  });
  return out + (inList ? '</ul>' : '');
}
const nodeTag = n => `<span class="lab" style="color:var(${TYPES[n.type].color === '--file' ? '--mute' : TYPES[n.type].color})">${esc(glyphOf(n))} ${esc(n.type === 'file' ? '' : n.label)}</span>`;
function edgeRows(list, side) {
  return list.map(e => { const o = N[side === 'out' ? e.to : e.from];
    return `<div class="erow" data-id="${esc(o.id)}"><span class="et">${side === 'out' ? '' : '← '}${e.type}${side === 'out' ? ' →' : ''}</span>${nodeTag(o)}<span class="tt">${esc(titleOf(o))}</span></div>`; }).join('');
}
function fieldsHTML(n) {
  const f = n.fields || {}; let h = '';
  const kv = pairs => '<dl class="kv">' + pairs.filter(p => p[1] != null && p[1] !== '').map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + '</dl>';
  switch (n.type) {
    case 'goal': case 'defect': h += `<div class="prose">${md(f.description)}</div>`; break;
    case 'ac':
      h += `<h3>Given / when / then</h3><div class="prose">${md(f.gwt)}</div>`;
      if (f.verify) { h += `<h3>Verify</h3>${f.verify.cmd ? `<pre>${esc(f.verify.cmd)}</pre>` : ''}`;
        if (f.verify.tests && f.verify.tests.length) h += '<ul>' + f.verify.tests.map(t => `<li><code>${esc(t)}</code></li>`).join('') + '</ul>'; }
      break;
    case 'decision':
      h += kv([['by', esc(f.by)], ['reversibility', esc(f.reversibility)]]);
      h += `<h3>Chosen</h3><div class="prose">${md(f.chosen)}</div><h3>Why</h3><div class="prose">${md(f.why)}</div>`; break;
    case 'alternative': h += `<h3>Why rejected</h3><div class="prose">${md(f.why)}</div>`; break;
    case 'question':
      h += kv([['status', esc(f.status)]]) + `<h3>Recommended</h3><div class="prose">${md(f.recommended)}</div>`;
      if (f.answer) h += `<h3>Answer</h3><div class="prose">${md(f.answer)}</div>`; break;
    case 'tree': h += kv([['kind', esc(f.kind)]]) + `<pre>${esc(f.body)}</pre>`; break;
    case 'file': h += kv([['path', `<code>${esc(f.path)}</code>`], ['change', esc(f.change)]]) + `<h3>Why</h3><div class="prose">${md(f.why)}</div>`; break;
    case 'stage':
      h += kv([['status', esc(f.status)]]);
      if (f.steps && f.steps.length) h += '<h3>Steps</h3><ol class="steps">' + f.steps.map(s => `<li>${inline(s)}</li>`).join('') + '</ol>';
      if (f.commit) h += `<h3>Commit</h3><pre>${esc(f.commit)}</pre>`; break;
    case 'plan': h += kv(Object.entries(f).map(([k, v]) => [k, esc(v)])); break;
    default: h += `<pre>${esc(JSON.stringify(f, null, 2))}</pre>`;
  }
  return h;
}
function renderPanel() {
  const b = $('#pbody');
  if (!selected) { $('#handle-t').textContent = 'Overview · what the shape shows'; b.innerHTML = overviewHTML(); bindRefs(); return; }
  const n = N[selected];
  $('#handle-t').textContent = `${glyphOf(n)} ${n.label} · ${titleOf(n)}`;
  const counts = t => [...lit[t]].filter(i => i !== n.id).length;
  b.innerHTML = `<div class="kicker"><span class="chip">${esc(TYPES[n.type].name)}</span><span class="chip mono">${esc(n.id)}</span>
    ${n.status === 'retired' ? '<span class="chip" style="color:var(--red)">retired</span>' : ''}<span class="mono">rank ${esc(n.rank)}</span></div>
    <h2>${nodeTag(n)} ${esc(titleOf(n))}</h2>
    <div class="kicker">trace: ${counts('up')} up · ${counts('down')} down · ${counts('lateral')} lateral — <span class="ref" id="fitlit">zoom to lineage</span> · <span class="ref" id="clr">clear</span></div>
    ${fieldsHTML(n)}
    <h3>Edges out (${outE[n.id].length})</h3>${edgeRows(outE[n.id], 'out') || '<div class="kicker">none</div>'}
    <h3>Edges in (${inE[n.id].length})</h3>${edgeRows(inE[n.id], 'in') || '<div class="kicker">none</div>'}`;
  $('#fitlit').onclick = () => fit([...lit.all]);
  $('#clr').onclick = () => select(null);
  bindRefs(); b.parentElement.scrollTop = 0;
}
function bindRefs() { $('#pbody').querySelectorAll('[data-id]').forEach(el => el.onclick = ev => { ev.stopPropagation(); select(el.dataset.id, {zoomTo: true}); }); }

function overviewHTML() {
  const top = (t, k = 3) => ofType(t).sort((a, b) => deg(b.id) - deg(a.id) || byRank(a, b)).slice(0, k);
  const li = (n, extra = '') => `<li>${refLink(n.id)} <span class="tt">${esc(titleOf(n))}</span> — <b>${deg(n.id)}</b> edges${extra}</li>`;
  const touches = edges.filter(e => e.type === 'touches'), stages = ofType('stage');
  const sTouch = id => outE[id].filter(e => e.type === 'touches').length;
  const s1 = top('stage', 2);
  const first2 = s1.slice(0, 2).reduce((a, s) => a + sTouch(s.id), 0);
  const fileHits = d3.rollup(touches, v => v.length, e => e.to);
  const multi = [...fileHits.values()].filter(v => v > 1).length;
  const isolated = nodes.filter(n => deg(n.id) === 0);
  const coverCnt = d3.rollup(edges.filter(e => e.type === 'covers'), v => v.length, e => e.to);
  const thinGoals = ofType('goal').filter(g => !inE[g.id].some(e => e.type === 'constrains')).map(g => refLink(g.id));
  const byType = d3.rollup(edges, v => v.length, e => e.type);
  return `<h2>The whole plan, ${nodes.length} nodes · ${edges.length} edges</h2>
  <div class="kicker">${[...byType].sort((a, b) => b[1] - a[1]).map(([t, c]) => `<span class="chip">${t} ${c}</span>`).join(' ')}</div>
  <h3>What the shape reveals</h3><ul class="ins">
  <li><b>Two stages are the gravitational centre.</b> ${s1.slice(0, 2).map(s => refLink(s.id)).join(' and ')} touch ${first2} of ${touches.length} file edges (${Math.round(100 * first2 / touches.length)}%) — the remaining ${stages.length - 2} stages share the rest, so in the full view the file band is pulled toward two poles rather than spread under the chain.</li>
  <li><b>Files are shared, not owned.</b> ${multi} of ${fileHits.size} touched files are revisited by more than one stage; ${refLink(top('file', 1)[0].id)} (<code>${esc(top('file', 1)[0].fields.path)}</code>) is touched by ${fileHits.get(top('file', 1)[0].id)} stages.</li>
  <li><b>Hub AC:</b> ${refLink(top('ac', 1)[0].id)} “${esc(titleOf(top('ac', 1)[0]))}” carries ${deg(top('ac', 1)[0].id)} edges — covered by ${coverCnt.get(top('ac', 1)[0].id) || 0} stages and leaned on by several decisions and a would-break alternative.</li>
  <li><b>Isolated stars:</b> ${isolated.length} nodes have no edges — ${isolated.map(n => refLink(n.id)).join(' ')}. All ${ofType('question').length} questions float free: answered, but never linked to what they settled.</li>
  <li><b>Unconstrained goal${thinGoals.length === 1 ? '' : 's'}:</b> ${thinGoals.join(' ') || 'none'} — no decision constrains ${thinGoals.length === 1 ? 'it' : 'them'}; ${refLink(top('goal', 7).slice(-1)[0].id)} hangs on a single proves edge.</li>
  <li><b>No coverage gaps:</b> every AC is covered by ≥1 stage, every goal is proven, every decision constrains something.</li>
  </ul>
  <h3>Most connected</h3><ul class="ins">${top('stage', 2).map(n => li(n)).join('')}${top('ac', 2).map(n => li(n)).join('')}${top('goal', 1).map(n => li(n)).join('')}${top('decision', 1).map(n => li(n)).join('')}${top('file', 1).map(n => li(n)).join('')}</ul>
  <p class="kicker">Click any node (or a link above) to trace it the way <code>auto plan trace</code> does: up toward goals via proves / covers / constrains, down toward stages, files and alternatives. dependsOn and supersedes are shown one hop sideways.</p>`;
}

/* ---------- controls ---------- */
function swatchNode(t) { const c = `var(${TYPES[t].color})`, hollow = t === 'file' || t === 'alternative';
  return `<svg width="16" height="16"><circle cx="8" cy="8" r="6" style="fill:${hollow ? 'var(--card)' : c};stroke:${c}" stroke-width="1.5"/></svg>`; }
function swatchEdge(t) { const s = EDGES[t];
  return `<svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" style="stroke:var(${s.color})" stroke-width="${Math.max(1.2, s.w)}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/></svg>`; }
function buildLegend() {
  const tc = d3.rollup(nodes, v => v.length, n => n.type), ec = d3.rollup(edges, v => v.length, e => e.type);
  $('#lg').innerHTML = '<h4>Nodes</h4>' + Object.keys(TYPES).filter(t => tc.get(t)).map(t =>
    `<label><input type="checkbox" data-t="${t}">${swatchNode(t)}${TYPES[t].glyph} ${TYPES[t].name.replace('Acceptance criterion', 'AC').replace('Rejected alternative', 'Alternative')} <span class="n">${tc.get(t)}</span></label>`).join('')
    + '<h4>Edges</h4>' + Object.keys(EDGES).filter(t => ec.get(t)).map(t =>
    `<label title="${EDGES[t].desc}"><input type="checkbox" data-e="${t}">${swatchEdge(t)}${t} <span class="n">${ec.get(t)}</span></label>`).join('');
  $('#lg').querySelectorAll('input').forEach(i => i.onchange = () => {
    if (i.dataset.t) typeOn[i.dataset.t] = i.checked; else edgeOn[i.dataset.e] = i.checked;
    if (selected && !typeOn[N[selected].type]) select(null);
    syncControls(); rebuild(0.6);
  });
  syncControls();
}
function syncControls() {
  $('#lg').querySelectorAll('input').forEach(i => i.checked = i.dataset.t ? typeOn[i.dataset.t] : edgeOn[i.dataset.e]);
  $('#files').classList.toggle('on', typeOn.file);
  $('#files').textContent = typeOn.file ? 'Hide files' : 'Show files (' + ofType('file').length + ')';
}
$('#files').onclick = () => { const on = !typeOn.file; typeOn.file = on; edgeOn.touches = on; if (!on && selected && N[selected].type === 'file') select(null); syncControls(); rebuild(0.7); setTimeout(() => fit(), 900); };
$('#lay-band').onclick = () => { layout = 'band'; $('#lay-band').classList.add('on'); $('#lay-free').classList.remove('on'); applyForces(); sim.alpha(0.8).restart(); setTimeout(() => fit(), 1200); };
$('#lay-free').onclick = () => { layout = 'free'; $('#lay-free').classList.add('on'); $('#lay-band').classList.remove('on'); applyForces(); sim.alpha(0.9).restart(); setTimeout(() => fit(), 1500); };
$('#fit').onclick = () => fit();
$('#handle').onclick = () => $('#panel').classList.toggle('open');
$('#theme').onclick = () => { const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#15140f';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; };

// search
const hay = n => [n.id, n.label, titleOf(n), JSON.stringify(n.fields)].join(' ').toLowerCase();
let hits = [], hiIdx = 0;
function hideSugg() { $('#sugg').style.display = 'none'; }
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim().toLowerCase(); if (!q) { hideSugg(); return; }
  const score = n => (n.id.toLowerCase() === q || (n.label || '').toLowerCase() === q) ? 0 : (n.label || '').toLowerCase().startsWith(q) || n.id.startsWith(q) ? 1 : titleOf(n).toLowerCase().includes(q) ? 2 : 3;
  hits = nodes.filter(n => hay(n).includes(q)).sort((a, b) => score(a) - score(b) || byRank(a, b)).slice(0, 12); hiIdx = 0;
  $('#sugg').innerHTML = hits.length ? hits.map((n, i) => `<div data-i="${i}" class="${i ? '' : 'hi'}">${nodeTag(n)}<span class="tt">${esc(titleOf(n))}</span></div>`).join('') : '<div class="kicker" style="cursor:default">no match</div>';
  $('#sugg').style.display = 'block';
  $('#sugg').querySelectorAll('[data-i]').forEach(d => d.onclick = () => { pick(hits[+d.dataset.i]); });
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && hits[hiIdx]) { pick(hits[hiIdx]); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hiIdx = (hiIdx + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % Math.max(1, hits.length);
    $('#sugg').querySelectorAll('[data-i]').forEach((d, i) => d.classList.toggle('hi', i === hiIdx)); }
});
function pick(n) { hideSugg(); $('#q').blur(); select(n.id, {zoomTo: true}); }
document.addEventListener('click', e => { if (!e.target.closest('.search')) hideSugg(); });

function showTip(ev, d) {
  const t = $('#tip'), box = $('#stage').getBoundingClientRect();
  t.innerHTML = `<b>${esc(glyphOf(d))} ${esc(d.type === 'file' ? '' : d.label)}</b> ${esc(titleOf(d))} <span style="opacity:.7">· ${deg(d.id)} edges</span>`;
  t.style.display = 'block';
  t.style.left = Math.min(ev.clientX - box.left + 12, box.width - t.offsetWidth - 8) + 'px';
  t.style.top = (ev.clientY - box.top + 14) + 'px';
}

/* ---------- boot ---------- */
function size() { const r = $('#stage').getBoundingClientRect(); const m = innerWidth <= 760; W = m ? Math.max(360, r.width * 1.05) : Math.max(600, r.width); H = m ? Math.max(720, r.height * 1.45) : Math.max(520, r.height); }
size();
if (innerWidth <= 760) { $('#legend').open = false; } else { $('#legend').open = true; }
buildLegend();
rebuild(1);
sim.stop(); for (let i = 0; i < 320; i++) sim.tick(); ticked();
fit(null, 0);
sim.alpha(0.05).restart();
renderPanel();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { size(); applyForces(); sim.alpha(0.4).restart(); setTimeout(() => fit(), 700); }, 200); });
</script>
</body>
</html>
