<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceability Matrices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1b1a17;--mute:#6b665c;--line:#d9d3c5;--card:#fffdf8;--accent:#d2461e;--green:#2f7d4f;--brown:#9a6a2b;--chip:#ece6d8;
  --lit:rgba(210,70,30,.13);--dim:.28;--shadow:0 10px 40px rgba(0,0,0,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--ink:#efeadf;--mute:#a39d90;--line:#34312a;--card:#1e1c17;--accent:#ff7a4d;--green:#6cc592;--brown:#e0a85c;--chip:#2a2721;--lit:rgba(255,122,77,.16);--shadow:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--ink:#efeadf;--mute:#a39d90;--line:#34312a;--card:#1e1c17;--accent:#ff7a4d;--green:#6cc592;--brown:#e0a85c;--chip:#2a2721;--lit:rgba(255,122,77,.16);--shadow:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
.mono,code{font-family:"JetBrains Mono",ui-monospace,monospace}
code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:.88em;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;color:inherit}
header{padding:18px 16px 10px;max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
header h1{font:700 26px/1.1 Fraunces,serif;margin:0;letter-spacing:-.01em}
header .what{flex:1 1 320px;color:var(--mute);margin:0}
header .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute)}
header .meta a{text-decoration:none}
#theme{border:1px solid var(--line);background:var(--card);border-radius:50%;width:30px;height:30px;cursor:pointer}
main{max-width:1440px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .badge{font:600 11px "JetBrains Mono",monospace;background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;display:none}
.tab .badge.on{display:inline-block}
#lineage{min-height:34px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--mute);margin-bottom:8px}
#lineage .sel{color:var(--ink);font-weight:600}
#lineage button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:12px}
.wrap{width:fit-content;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:72vh;max-width:100%;position:relative}
table.mx{width:max-content;border-collapse:separate;border-spacing:0;font-size:12px}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;z-index:2;background:var(--card);vertical-align:bottom}
.mx th.rowh{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;font-weight:400}
.mx thead th.corner{left:0;z-index:3;text-align:left;padding:6px 8px;font-weight:500;color:var(--mute);min-width:200px}
.colh{cursor:pointer;padding:6px 2px !important;min-width:34px;font:600 11px "JetBrains Mono",monospace;white-space:nowrap}
.colh .v{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block}
.colh.goalcol{background:var(--chip) !important}
.rowh{cursor:pointer;padding:5px 8px !important;width:1%;min-width:200px;max-width:280px}
.rowh .lab{font:600 11px "JetBrains Mono",monospace;margin-right:6px}
.rowh .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.rowh .rid{display:block;overflow-wrap:anywhere;font:10px "JetBrains Mono",monospace;color:var(--mute)}
.rowh .dir{color:var(--mute)}
.gchip{display:inline-block;margin-right:2px;font:600 10px "JetBrains Mono",monospace;background:var(--chip);border-radius:4px;padding:0 4px;margin-left:3px;color:var(--brown)}
tr.grp th{background:var(--chip) !important;text-align:left;padding:5px 8px !important;cursor:pointer;font-weight:600;position:sticky;left:0}
tr.grp th .rid{font:10px "JetBrains Mono",monospace;color:var(--mute);font-weight:400}
td.c{width:34px;height:30px;text-align:center;cursor:default;font:600 13px "JetBrains Mono",monospace}
td.c.on{color:#fff}
td.c.cov{background:var(--green)}
td.c.con{background:var(--accent)}
td.c.imp{color:var(--accent);font-weight:400}
td.c.add{background:var(--green)}
td.c.edit{background:var(--brown)}
td.churn,th.churn{min-width:56px;text-align:center;font:600 12px "JetBrains Mono",monospace}
td.churn .bar{display:block;height:4px;background:var(--accent);margin:2px auto 0;border-radius:2px}
td.c:hover{outline:2px solid var(--ink);outline-offset:-2px}
.mx.has-sel tr.dim > *:not(.rowh){opacity:var(--dim)}
.mx.has-sel tr.dim > .rowh{opacity:.45}
.mx.has-sel td.cdim{opacity:var(--dim)}
.mx.has-sel .colh.dim{opacity:.35}
.mx .lit.rowh,.mx .colh.lit{background:var(--lit) !important;box-shadow:inset 3px 0 0 var(--accent)}
.mx .colh.lit{box-shadow:inset 0 -3px 0 var(--accent)}
.mx .sel-node{outline:2px solid var(--accent);outline-offset:-2px}
tr.superseded .ttl{text-decoration:line-through;color:var(--mute)}
tr.superseded > *{opacity:.55}
tr.retired .ttl{text-decoration:line-through;color:var(--mute)}
.oneway{color:var(--accent);font-weight:700;margin-left:4px}
#readout{font-size:12px;color:var(--mute);padding:6px 2px;min-height:30px}
#readout b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);padding:4px 2px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;text-align:center;color:#fff;font:600 10px/14px "JetBrains Mono",monospace}
aside.readings{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 6px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:980px){aside.readings{position:static;max-height:none}}
aside h2{font:700 19px Fraunces,serif;margin:0 0 2px}
aside .sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.finding{border-top:1px solid var(--line);padding:10px 0}
.finding .hd{display:flex;gap:8px;align-items:baseline}
.finding .sev{font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;border-radius:4px;padding:1px 5px;flex:none}
.sev.warn{background:var(--accent);color:#fff}.sev.info{background:var(--chip);color:var(--mute)}.sev.ok{background:var(--green);color:#fff}
.finding .t{font-weight:600}
.finding p{margin:4px 0;color:var(--mute);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.nchip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 6px;font:11px "JetBrains Mono",monospace;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nchip:hover{border-color:var(--accent)}
.nchip .n{color:var(--mute);margin-left:3px}
#detail{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;z-index:20;overflow:auto;padding:16px 18px 40px}
#detail.open{transform:none}
@media (max-width:600px){#detail{top:auto;height:78vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%)}}
#detail .close{position:sticky;top:0;float:right;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;padding:2px 9px}
#detail h3{font:700 21px/1.2 Fraunces,serif;margin:4px 0 4px;overflow-wrap:anywhere}
#detail .kind{font:12px "JetBrains Mono",monospace;color:var(--mute)}
#detail dl{margin:12px 0}
#detail dt{font:600 11px "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;margin-top:10px}
#detail dd{margin:2px 0 0;overflow-wrap:anywhere}
#detail dd ul,#detail dd ol{margin:4px 0;padding-left:20px}
#detail pre{background:var(--chip);padding:8px;border-radius:6px;overflow:auto;font-size:12px;white-space:pre-wrap}
#detail h4{font:600 13px Inter;margin:16px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.edge{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:2px 0}
.edge .et{font:11px "JetBrains Mono",monospace;color:var(--mute);min-width:84px;flex:none}
.reflink{cursor:pointer;color:var(--accent);text-decoration:underline dotted}
.edge .reflink{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.rowh,.mx thead th.corner{min-width:150px !important;max-width:170px}.rowh .ttl{font-size:11.5px}}
.panel-note{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Traceability Matrices</h1>
  <p class="what">Coverage computed from edges, not prose — covers, constrains and touches as three linked grids, with health readings derived from the graph.</p>
  <div class="meta"><span class="mono" id="planid"></span><a href="index.html">← lab index</a><button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></div>
</header>
<main>
  <section>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="lineage"></div>
    <div class="wrap" id="wrap"></div>
    <div id="readout">Hover or tap a cell to read the pair. Click a row or column header to trace its lineage across all three matrices.</div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="readings" id="readings"></aside>
</main>
<div id="detail" aria-live="polite"></div>

<script type="application/json" id="plan-graph">
{
  "version": "1.0.0",
  "id": "001-hqax",
  "nodes": [
    {
      "id": "ac-21xb",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** any graph written by the CLI\n- **When** it is read and written again\n- **Then** the bytes are identical: nodes sorted by type then ID, edges by (from, type, to), fixed key order, 2-space indent, no HTML escaping, trailing newline\n- **And** `auto plan fmt <plan>` rewrites a hand-edited file into canonical form; `fmt --check` exits non-zero when it isn't\n- **And** only malformed JSON fails to decode (`parse-error`); everything else is reported by validation with its JSON path",
        "title": "graph.json is canonical and deterministic",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/graph/ -run 'RoundTrip|Fmt'",
          "tests": [
            "auto-plan/internal/graph/graph_test.go",
            "auto-plan/internal/cli/cli_integration_test.go",
            "auto-plan/e2e/e2e_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-34fe",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** the schema\n- **Then** goal, ac, decision, alternative, rail, defect, stage, file, question, tree, journey, leg and child exist, with required fields validated for presence and format\n- **And** edge types are typed by their endpoints and a wrong endpoint type is rejected (`proves` is ac→goal only, `about` is tree→any, …)",
        "title": "Every node type from the design is representable",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/schema/ ./internal/graph/",
          "tests": [
            "auto-plan/internal/schema/registry_test.go",

    {

      "status": "active",
      "rank": "a1",
      "fields": {
        "gwt": "- **Given** the real `auto` binary built from source and a fresh temp workspace\n- **When** the `lifecycle` scenario runs init → new → add/link/update/unlink → a rejected write → retire → lifecycle → fmt → lint\n- **Then** at every `# checkpoint` each `graph.json` is byte-identical to its snapshot\n- **When** the `dogfood` scenario re-expresses epic 005, task 062 and task 052 from CLI commands alone\n- **Then** every snapshot matches and `auto plan lint all` exits 0",

    {

    },
    {

      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** a plan with active and retired nodes\n- **When** `auto plan add <plan> ac …` runs\n- **Then** the new ID matches `^[a-z]{1,4}-[0-9a-hjkmnp-tv-z]{4}$`, regenerated on collision with any ID in the plan, retired included\n- **And** it gets a `rank` after its last sibling; `move` changes only that node's rank\n- **And** no command changes or deletes an ID; `retire` sets `status: retired`",

      "type": "ac",

        "gwt": "- **Given** a repo whose plans root holds `001-a/` and `003-b/` (or does not exist yet)\n- **When** `auto plan new stage-briefs --kind task` runs from any subdirectory\n- **Then** it creates `004-stage-briefs/graph.json` (highest + 1, or `001`) holding exactly the `plan` node at `lifecycle: requirements` and no edges\n- **And** `--kind` accepts only `task|epic`; a bad name or an existing folder exits non-zero with a hint and writes nothing",

          "tests": [

      }
    },
    {
      "id": "ac-mybp",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** a populated plan\n- **Then** `list` returns IDs, metadata and titles only; `describe` the cheap summary rung with truncated text and the exact `get` recovery command; `get` the full node plus edges; `search` case-insensitive matches in one plan or all",
        "title": "Resource verbs: list, describe, get and search return the right fidelity",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/cli/ -run 'List|Describe|Get|Search'",
          "tests": [
            "auto-plan/internal/cli/cli_integration_test.go"
          ]
        }
      }
    },
    {
      "id": "ac-qxxe",
      "type": "ac",
      "status": "active",
      "rank": "a0",
      "fields": {
        "gwt": "- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` before any `auto-plan` Go file exists\n- **When** the task's first change adds a **Planning** section\n- **Then** it defines Plan, Child Plan, Goal, Acceptance Criterion, Decision, Alternative, Rail, Defect, Stage, File Change, Journey, Leg, Question and Tree in the house format\n- **And** Segment's, Observation's and TaskDef's `_Avoid_` lines are narrowed to their own domains\n- **And** every registry node type names its canonical term (`NodeType.Term`) and a registry test proves each exists in the glossary\n- **And** `glossary.py check` exits 0",
        "title": "The vocabulary lands first and the glossary stays valid",
        "verify": {
          "cmd": "cd auto-plan && go test ./internal/schema/ -run Glossary",
          "tests": [
            "auto-plan/internal/schema/registry_test.go"
          ]

    {
      "id": "ac-r6cp",
      "type": "ac",
      "status": "active",
      "rank": "a3",
      "fields": {
        "gwt": "- **Given** a plan at `lifecycle: plan`\n- **Then** lint reports `unplanned-file`, `untracked-file`, `missing-dep`, `dependency-cycle` and `open-question` with pd-lint's meanings",
        "title": "lint subsumes today's pd-lint checks",

        "gwt": "- **Given** `make build` from the repo root\n- **Then** `auto plan` is mounted: `TestAllToolsMounted`, `go.work`, Makefile `PROJECTS`, the root `CLAUDE.md` table\n- **And** `auto plan quickstart` and `auto plan docs` print the happy path and the full reference\n- **And** `make check`, `make test` and `make stale-refs` are green",
        "title": "Mounted, documented and dogfooded end to end",
        "verify": {

<script>
(() => {
const G = JSON.parse(document.getElementById('plan-graph').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = new Map(G.nodes.map(n => [n.id, n]));
const rankSort = (a, b) => (a.rank || '') < (b.rank || '') ? -1 : (a.rank || '') > (b.rank || '') ? 1 : a.id < b.id ? -1 : 1;
const ofType = t => G.nodes.filter(n => n.type === t).sort(rankSort);
const out = new Map(), inn = new Map();
for (const e of G.edges) {
  (out.get(e.from) || out.set(e.from, []).get(e.from)).push(e);
  (inn.get(e.to) || inn.set(e.to, []).get(e.to)).push(e);
}
const outs = (id, t) => (out.get(id) || []).filter(e => !t || e.type === t).map(e => e.to);
const ins = (id, t) => (inn.get(id) || []).filter(e => !t || e.type === t).map(e => e.from);
const GLYPH = {goal:'◎',ac:'✓',decision:'◆',alternative:'−',defect:'✗',question:'?',stage:'▸',tree:'⌥',plan:'▤'};

// ---------- positional labels ----------
const goals = ofType('goal'), decisions = ofType('decision'), files = ofType('file');
const label = new Map();
goals.forEach((g, i) => label.set(g.id, 'G' + (i + 1)));
decisions.forEach((d, i) => label.set(d.id, 'D' + (i + 1)));
const goalIdx = new Map(goals.map((g, i) => [g.id, i]));
const acGoals = id => outs(id, 'proves').filter(g => goalIdx.has(g)).sort((a, b) => goalIdx.get(a) - goalIdx.get(b));
const acsByGoal = new Map(goals.map(g => [g.id, []]));
for (const ac of ofType('ac')) { const fg = acGoals(ac.id)[0]; if (fg) acsByGoal.get(fg).push(ac); }
const orphanACs = ofType('ac').filter(a => !acGoals(a.id).length);
goals.forEach((g, gi) => acsByGoal.get(g.id).forEach((a, i) => label.set(a.id, `AC${gi + 1}.${i + 1}`)));
orphanACs.forEach((a, i) => label.set(a.id, `AC?.${i + 1}`));
const acs = [...goals.flatMap(g => acsByGoal.get(g.id)), ...orphanACs];
// stages: topological along dependsOn (prereqs first)
const stageNodes = ofType('stage');
const stages = []; { const done = new Set(); let left = [...stageNodes];
  while (left.length) { const ready = left.filter(s => outs(s.id, 'dependsOn').every(p => done.has(p) || !byId.has(p)));
    const pick = ready.length ? ready : [left[0]]; pick.forEach(s => { stages.push(s); done.add(s.id); }); left = left.filter(s => !done.has(s.id)); } }
stages.forEach((s, i) => label.set(s.id, 'S' + (i + 1)));
const L = id => label.get(id) || (byId.get(id)?.type === 'file' ? byId.get(id).fields.path.split('/').filter(Boolean).pop() : id);
const title = n => n.fields.title || (n.fields.path ? n.fields.path.replace(/\/$/, '').split('/').pop() + (n.fields.path.endsWith('/') ? '/' : '') : '') || n.fields.name || n.id;
const activeStage = s => byId.get(s)?.status === 'active';

// ---------- lineage ----------
function lineage(id) {
  const n = byId.get(id); const S = new Set([id]); if (!n) return S;
  const add = xs => xs.forEach(x => S.add(x));
  const acDecisions = acIds => { const r = []; acIds.forEach(a => { r.push(...ins(a, 'constrains')); acGoals(a).forEach(g => r.push(...ins(g, 'constrains'))); }); return r; };
  const fromStages = st => { add(st); const a = st.flatMap(s => outs(s, 'covers')); add(a); a.forEach(x => add(acGoals(x))); add(acDecisions(a)); add(st.flatMap(s => outs(s, 'touches'))); };
  if (n.type === 'stage') fromStages([id]);
  else if (n.type === 'ac') { add(acGoals(id)); add(acDecisions([id])); const st = ins(id, 'covers'); add(st); add(st.flatMap(s => outs(s, 'touches'))); }
  else if (n.type === 'goal') { const a = ins(id, 'proves'); add(a); add(ins(id, 'constrains')); add(acDecisions(a)); const st = a.flatMap(x => ins(x, 'covers')); add(st); add(st.flatMap(s => outs(s, 'touches'))); }
  else if (n.type === 'decision') { const t = outs(id, 'constrains'); add(t); const a = new Set(); t.forEach(x => { const tn = byId.get(x); if (tn?.type === 'ac') { a.add(x); acGoals(x).forEach(g => S.add(g)); } if (tn?.type === 'goal') ins(x, 'proves').forEach(y => a.add(y)); }); add([...a]); const st = [...a].flatMap(x => ins(x, 'covers')); add(st); add(st.flatMap(s => outs(s, 'touches'))); add(outs(id, 'supersedes')); add(ins(id, 'supersedes')); }
  else if (n.type === 'file') fromStages(ins(id, 'touches'));
  return S;
}
let sel = null, lit = null;

// ---------- matrices ----------
const fileGroups = (() => { const m = new Map(); for (const f of [...files].sort((a, b) => a.fields.path < b.fields.path ? -1 : 1)) { const p = f.fields.path.split('/').filter(Boolean); const k = p.length > 1 ? p[0] + '/' : '(repo root)'; (m.get(k) || m.set(k, []).get(k)).push(f); } return [...m].sort((a, b) => b[1].length - a[1].length); })();
const superseded = new Set(G.edges.filter(e => e.type === 'supersedes').map(e => e.to));
const covers = new Set(G.edges.filter(e => e.type === 'covers').map(e => e.from + '|' + e.to));
const touches = new Set(G.edges.filter(e => e.type === 'touches').map(e => e.from + '|' + e.to));
const constrains = new Set(G.edges.filter(e => e.type === 'constrains').map(e => e.from + '|' + e.to));

const MATRICES = {
  cov: { name: 'AC × Stage', verb: 'covers', corner: '✓ AC  ╲  ▸ stage',
    cols: stages.map(s => s.id),
    groups: goals.map(g => ({ head: g.id, rows: acsByGoal.get(g.id).map(a => a.id) })).concat(orphanACs.length ? [{ head: null, name: 'ACs proving no goal', rows: orphanACs.map(a => a.id) }] : []),
    cell: (r, c) => covers.has(c + '|' + r) ? { cls: 'on cov', txt: '●', say: `<b>${L(c)}</b> covers <b>${L(r)}</b>` } : null,
    legend: `<span><span class="sw" style="background:var(--green)">●</span>stage covers AC</span><span>ACs proving two goals sit under the first, with both goal chips</span>` },
  con: { name: 'Decision × Goal/AC', verb: 'constrains', corner: '◆ decision  ╲  ◎ goal · ✓ AC',
    cols: [...goals.map(g => g.id), ...acs.map(a => a.id)],
    groups: [{ head: null, rows: decisions.map(d => d.id) }],
    cell: (r, c) => {
      if (constrains.has(r + '|' + c)) return { cls: 'on con', txt: '◆', say: `<b>${L(r)}</b> constrains <b>${L(c)}</b>` };
      if (byId.get(c).type === 'ac' && acGoals(c).some(g => constrains.has(r + '|' + g))) return { cls: 'imp', txt: '·', say: `<b>${L(r)}</b> reaches <b>${L(c)}</b> via its goal ${acGoals(c).filter(g => constrains.has(r + '|' + g)).map(L).join(', ')}` };
      return null; },
    legend: `<span><span class="sw" style="background:var(--accent)">◆</span>constrains (edge)</span><span><span class="sw" style="color:var(--accent);background:var(--chip)">·</span>inherited via goal</span><span><span class="oneway">⚠</span> one-way decision</span><span><s>struck</s> superseded</span>` },
  touch: { name: 'File × Stage', verb: 'touches', corner: '+ ~ file  ╲  ▸ stage',
    cols: stages.map(s => s.id), churn: true,
    groups: fileGroups.map(([k, fs]) => ({ head: null, name: k, rows: fs.map(f => f.id) })),
    cell: (r, c) => { if (!touches.has(c + '|' + r)) return null; const ch = byId.get(r).fields.change; return { cls: 'on ' + (ch === 'add' ? 'add' : 'edit'), txt: ch === 'add' ? '+' : ch === 'delete' ? '−' : '~', say: `<b>${L(c)}</b> touches <code>${esc(byId.get(r).fields.path)}</code> (${ch})` }; },
    legend: `<span><span class="sw" style="background:var(--green)">+</span>file is added</span><span><span class="sw" style="background:var(--brown)">~</span>file is edited</span><span>churn = stages touching it</span>` },
};
let tab = 'cov';

function rowHead(id) {
  const n = byId.get(id); const t = n.type;
  let extra = '';
  if (t === 'ac') extra = acGoals(id).map(g => `<span class="gchip" title="${esc(title(byId.get(g)))}">◎${L(g)}</span>`).join('');
  if (t === 'decision' && n.fields.reversibility === 'one-way') extra = `<span class="oneway" title="one-way decision">⚠ one-way</span>`;
  if (t === 'file') { const p = n.fields.path; const i = p.replace(/\/$/, '').lastIndexOf('/'); const top = p.split('/')[0] + '/'; const dir = p.slice(0, i + 1); return `<div class="ttl mono" style="font-size:11.5px;font-weight:600">${esc(p.slice(i + 1))}</div><span class="rid">${esc(dir.startsWith(top) && p.includes('/') ? dir.slice(top.length) : dir)} · ${n.id}${n.status === 'retired' ? ' · retired' : ''}</span>`; }
  return `<div class="ttl"><span class="lab">${GLYPH[t]} ${L(id)}</span>${esc(title(n))}</div><span class="rid">${extra}${extra ? ' ' : ''}${n.id}${superseded.has(id) ? ' · superseded by ' + ins(id, 'supersedes').map(L).join(',') : ''}</span>`;
}
function render() {
  const M = MATRICES[tab];
  const colLit = c => !lit || lit.has(c);
  let h = `<table class="mx${lit ? ' has-sel' : ''}"><thead><tr><th class="corner rowh">${M.corner}</th>`;
  for (const c of M.cols) { const n = byId.get(c); h += `<th class="colh${n.type === 'goal' ? ' goalcol' : ''}${lit ? (lit.has(c) ? ' lit' : ' dim') : ''}${sel === c ? ' sel-node' : ''}" data-id="${c}" title="${esc(L(c) + ' — ' + title(n))}"><span class="${L(c).length > 3 ? 'v' : ''}">${L(c)}</span></th>`; }
  if (M.churn) h += `<th class="churn">churn</th>`;
  h += `</tr></thead><tbody>`;
  const span = M.cols.length + 1 + (M.churn ? 1 : 0);
  const maxChurn = M.churn ? Math.max(...files.map(f => ins(f.id, 'touches').length)) : 0;
  for (const g of M.groups) {
    if (g.head) { const gn = byId.get(g.head); h += `<tr class="grp${lit && !lit.has(g.head) ? ' dim' : ''}"><th colspan="${span}" data-id="${g.head}" class="${sel === g.head ? 'sel-node' : ''}">◎ ${L(g.head)} · ${esc(title(gn))} <span class="rid">${gn.id}</span></th></tr>`; }
    else if (g.name) h += `<tr class="grp"><th colspan="${span}" style="cursor:default">${esc(g.name)} <span class="rid">${g.rows.length} files</span></th></tr>`;
    for (const r of g.rows) {
      const n = byId.get(r); const rl = !lit || lit.has(r);
      const cls = [rl ? '' : 'dim', superseded.has(r) ? 'superseded' : '', n.status === 'retired' ? 'retired' : ''].join(' ');
      h += `<tr class="${cls}"><th class="rowh${lit && rl ? ' lit' : ''}${sel === r ? ' sel-node' : ''}" data-id="${r}">${rowHead(r)}</th>`;
      for (const c of M.cols) { const v = M.cell(r, c); h += `<td class="c ${v ? v.cls : ''}${lit && !(rl && colLit(c)) ? ' cdim' : ''}" data-r="${r}" data-c="${c}">${v ? v.txt : ''}</td>`; }
      if (M.churn) { const k = ins(r, 'touches').length; h += `<td class="churn">${k}<span class="bar" style="width:${Math.round(40 * k / maxChurn)}px"></span></td>`; }
      h += `</tr>`;
    }
  }
  $('#wrap').innerHTML = h + `</tbody></table>`;
  $('#legend').innerHTML = M.legend;
  renderTabs(); renderLineage();
}
function renderTabs() {
  $('#tabs').innerHTML = Object.entries(MATRICES).map(([k, M]) => {
    let badge = '';
    if (lit) { const ids = new Set([...M.cols, ...M.groups.flatMap(g => g.rows)]); badge = [...lit].filter(x => ids.has(x)).length; }
    return `<button class="tab" role="tab" aria-selected="${k === tab}" data-tab="${k}">${M.name}<span class="badge${lit ? ' on' : ''}">${badge}</span></button>`; }).join('');
}
function renderLineage() {
  if (!sel) { $('#lineage').innerHTML = `<span>No lineage selected — click any header.</span>`; return; }
  const n = byId.get(sel); const cnt = t => [...lit].filter(x => byId.get(x)?.type === t).length;
  $('#lineage').innerHTML = `<span>Lineage of</span><span class="sel">${GLYPH[n.type] || ''} ${esc(L(sel))} · ${esc(title(n).slice(0, 70))}</span><span>${cnt('goal')} goals · ${cnt('ac')} ACs · ${cnt('decision')} decisions · ${cnt('stage')} stages · ${cnt('file')} files</span><button data-act="detail">details</button><button data-act="clear">clear ×</button>`;
}
function select(id, openDetail = true) {
  if (sel === id && !openDetail) { sel = null; lit = null; } else { sel = id; lit = lineage(id); }
  render(); if (openDetail && sel) showDetail(sel);
}

// ---------- prose ----------
function inline(s) {
  return String(s).split(/(`[^`]*`)/).map(p => p.startsWith('`') && p.endsWith('`') && p.length > 1 ? `<code>${esc(p.slice(1, -1))}</code>`
    : esc(p).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[\[([a-z0-9-]+)\]\]/g, (m, id) => byId.has(id) ? `<span class="reflink" data-id="${id}">${esc(L(id))}</span>` : m)).join('');
}
function md(s) {
  const lines = String(s ?? '').split('\n'); let h = '', inList = false;
  for (const l of lines) { const m = l.match(/^\s*[-*]\s+(.*)/);
    if (m) { if (!inList) { h += '<ul>'; inList = true; } h += `<li>${inline(m[1])}</li>`; }
    else { if (inList) { h += '</ul>'; inList = false; } if (l.trim()) h += `<p style="margin:2px 0">${inline(l)}</p>`; } }
  return h + (inList ? '</ul>' : '');
}
function showDetail(id) {
  const n = byId.get(id); if (!n) return;
  let h = `<button class="close" data-act="close">close ×</button><div class="kind">${GLYPH[n.type] || ''} ${n.type} · ${n.id} · ${n.status}${n.rank ? ' · rank ' + n.rank : ''}</div><h3>${esc(L(id))} — ${esc(title(n))}</h3><dl>`;
  for (const [k, v] of Object.entries(n.fields)) {
    if (k === 'title') continue;
    let body;
    if (Array.isArray(v)) body = `<ol>${v.map(x => `<li>${inline(x)}</li>`).join('')}</ol>`;
    else if (v && typeof v === 'object') body = Object.entries(v).map(([kk, vv]) => `<div><b class="mono" style="font-size:11px">${esc(kk)}</b> ${Array.isArray(vv) ? `<ul>${vv.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul>` : `<code>${esc(vv)}</code>`}</div>`).join('');
    else if (k === 'body') body = `<pre>${esc(v)}</pre>`;
    else body = md(v);
    h += `<dt>${esc(k)}</dt><dd>${body}</dd>`;
  }
  h += `</dl>`;
  const edgeRows = (list, dir) => list.map(e => { const o = dir === 'out' ? e.to : e.from; const on = byId.get(o);
    return `<div class="edge"><span class="et">${dir === 'out' ? e.type + ' →' : '← ' + e.type}</span><span class="reflink" data-id="${o}">${GLYPH[on?.type] || ''} ${esc(L(o))} · ${esc(on ? title(on) : '(missing)')}</span></div>`; }).join('');
  const ord = x => { const l = L(x); const m = l.match(/^([A-Z]+)(\d+)(?:\.(\d+))?$/); return m ? m[1] + String(m[2]).padStart(3, '0') + String(m[3] || 0).padStart(3, '0') : 'Z' + l; };
  const srt = k => (a, b) => a.type.localeCompare(b.type) || ord(a[k]).localeCompare(ord(b[k]));
  const o = [...(out.get(id) || [])].sort(srt('to')), i = [...(inn.get(id) || [])].sort(srt('from'));
  h += `<h4>Edges out (${o.length})</h4>${edgeRows(o, 'out') || '<div class="panel-note">none</div>'}<h4>Edges in (${i.length})</h4>${edgeRows(i, 'in') || '<div class="panel-note">none</div>'}`;
  h += `<h4>Lineage rule</h4><div class="panel-note">Lineage follows covers → proves → constrains → touches outward from the selected ${n.type}; it is what the matrices highlight.</div>`;
  $('#detail').innerHTML = h; $('#detail').classList.add('open'); $('#detail').scrollTop = 0;
}

// ---------- readings ----------
function readings() {
  const F = [];
  const push = (sev, t, p, ids) => F.push({ sev, t, p, ids });
  const covN = a => ins(a, 'covers').filter(activeStage).length;
  const acA = acs.filter(a => a.status === 'active');
  const zero = acA.filter(a => !covN(a.id)), one = acA.filter(a => covN(a.id) === 1);
  const maxC = Math.max(...acA.map(a => covN(a.id)));
  push(zero.length ? 'warn' : 'ok', zero.length ? `${zero.length} AC${zero.length > 1 ? 's' : ''} covered by no stage` : 'Every AC is covered by at least one stage', zero.length ? 'Nothing in the build sequence claims to prove these.' : `${acA.length} ACs, ${G.edges.filter(e => e.type === 'covers').length} covers edges.`, zero.map(a => a.id));
  push('info', `${one.length} ACs rest on a single stage`, 'Thinly covered: one stage is the only place each gets proven.', one.map(a => a.id));
  const many = acA.filter(a => covN(a.id) === maxC && maxC > 1); if (many.length) push('info', `Widest coverage: ${maxC} stages`, 'ACs revisited across the most stages — usually cross-cutting behaviour.', many.map(a => a.id));
  const idle = stages.filter(s => !outs(s.id, 'covers').length);
  push(idle.length ? 'warn' : 'ok', idle.length ? `${idle.length} stage${idle.length > 1 ? 's' : ''} cover no AC` : 'Every stage covers an AC', idle.length ? 'Work with no acceptance claim attached — refactors, plumbing or a missing covers edge.' : '', idle.map(s => s.id));
  const churn = f => ins(f.id, 'touches').length;
  const hot = files.filter(f => churn(f) >= 4).sort((a, b) => churn(b) - churn(a));
  push(hot.length ? 'warn' : 'ok', `${hot.length} hotspot file${hot.length === 1 ? '' : 's'} (touched by ≥4 stages)`, hot.length ? 'Repeated edits across stages: merge-conflict and serial-update risk. ' + hot.map(f => `${L(f.id)}×${churn(f)}`).join(', ') : '', hot.map(f => f.id));
  const untouched = files.filter(f => !churn(f) && f.status === 'active'); if (untouched.length) push('warn', `${untouched.length} planned file${untouched.length > 1 ? 's' : ''} no stage touches`, 'A File Change with no stage that delivers it.', untouched.map(f => f.id));
  const covered = new Set(G.edges.filter(e => e.type === 'covers' && activeStage(e.from)).map(e => e.to));
  const reach = d => outs(d, 'constrains').some(x => { const t = byId.get(x); return t?.type === 'ac' ? covered.has(x) : t?.type === 'goal' ? ins(x, 'proves').some(a => covered.has(a)) : false; });
  const noTarget = decisions.filter(d => !outs(d.id, 'constrains').length);
  const dead = decisions.filter(d => outs(d.id, 'constrains').length && !reach(d.id));
  push(noTarget.length ? 'warn' : 'ok', `${noTarget.length} decision${noTarget.length === 1 ? '' : 's'} constrain nothing`, noTarget.length ? 'No constrains edge at all: the choice is recorded but cannot be traced to any goal or AC a stage proves.' + (noTarget.filter(d => superseded.has(d.id)).length ? ` ${noTarget.filter(d => superseded.has(d.id)).map(d => L(d.id)).join(', ')} superseded.` : '') : '', noTarget.map(d => d.id));
  push(dead.length ? 'warn' : 'ok', dead.length ? `${dead.length} decisions constrain only uncovered work` : 'Every constraining decision reaches covered work', dead.length ? 'They point at goals/ACs no active stage covers.' : 'Each constrains edge lands on an AC (or a goal whose AC) some active stage covers.', dead.map(d => d.id));
  const supStill = decisions.filter(d => superseded.has(d.id) && outs(d.id, 'constrains').length);
  push(supStill.length ? 'warn' : 'info', `${superseded.size} superseded decision${superseded.size === 1 ? '' : 's'}`, supStill.length ? `${supStill.map(d => L(d.id)).join(', ')} still carr${supStill.length > 1 ? 'y' : 'ies'} constrains edges — the newer decision may not have inherited them.` : 'None still carries a constrains edge.', [...superseded].flatMap(o => [o, ...ins(o, 'supersedes')]));
  const oneway = decisions.filter(d => d.fields.reversibility === 'one-way');
  push('info', `${oneway.length} one-way decisions`, 'Hard to reverse; reach = goals/ACs constrained. ' + oneway.map(d => `${L(d.id)}→${outs(d.id, 'constrains').length}`).join(', '), oneway.map(d => d.id));
  const oneStage = goals.filter(g => { const a = ins(g.id, 'proves'); const st = new Set(a.flatMap(x => ins(x, 'covers'))); return a.length && st.size === 1; });
  push(oneStage.length ? 'warn' : 'ok', oneStage.length ? `${oneStage.length} goal${oneStage.length > 1 ? 's' : ''} land entirely in one stage` : 'No goal lands entirely in one stage', oneStage.map(g => `${L(g.id)}: all ACs in ${L(ins(ins(g.id, 'proves')[0], 'covers')[0])}`).join('; ') || '', oneStage.flatMap(g => [g.id, ...new Set(ins(g.id, 'proves').flatMap(x => ins(x, 'covers')))]));
  const span = goals.map(g => { const st = new Set(ins(g.id, 'proves').flatMap(x => ins(x, 'covers'))); return [g, st.size]; }).sort((a, b) => b[1] - a[1])[0];
  if (span) push('info', `Widest goal: ${L(span[0].id)} spans ${span[1]} stages`, esc(title(span[0])), [span[0].id]);
  const noAC = goals.filter(g => !ins(g.id, 'proves').length); if (noAC.length) push('warn', `${noAC.length} goals have no AC`, 'Unprovable as written.', noAC.map(g => g.id));
  const retired = G.nodes.filter(n => n.status === 'retired');
  retired.forEach(r => push('info', `Retired ${r.type}: ${r.fields.path || title(r)}`, `${ins(r.id, 'touches').length ? 'Still touched by ' + ins(r.id, 'touches').map(L).join(', ') + ' — edges kept for history.' : 'No stage touches it.'} ${r.fields.why ? inline(r.fields.why) : ''}`, [r.id, ...ins(r.id, 'touches')]));
  const sev = { warn: 0, info: 1, ok: 2 }; F.sort((a, b) => sev[a.sev] - sev[b.sev]);
  $('#readings').innerHTML = `<h2>Readings</h2><p class="sub">${F.filter(f => f.sev === 'warn').length} findings to look at, computed live from ${G.edges.length} edges. Click a chip to trace it.</p>` +
    F.map(f => `<div class="finding"><div class="hd"><span class="sev ${f.sev}">${f.sev}</span><span class="t">${esc(f.t)}</span></div>${f.p ? `<p>${f.p}</p>` : ''}<div class="chips">${[...new Set(f.ids)].map(id => `<button class="nchip" data-id="${id}" title="${esc(title(byId.get(id)))}">${GLYPH[byId.get(id).type] || (byId.get(id).fields.change === 'add' ? '+' : '~')} ${esc(L(id))}<span class="n">${id}</span></button>`).join('')}</div></div>`).join('');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-id],[data-act],td.c');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.act === 'clear') { sel = null; lit = null; render(); return; }
  if (t.dataset.act === 'detail') { showDetail(sel); return; }
  if (t.dataset.act === 'close') { $('#detail').classList.remove('open'); return; }
  if (t.dataset.id) { select(t.dataset.id); return; }
  if (t.matches('td.c')) readout(t);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#detail').classList.remove('open'); });
function readout(td) {
  const { r, c } = td.dataset; const v = MATRICES[tab].cell(r, c);
  const rn = byId.get(r), cn = byId.get(c);
  $('#readout').innerHTML = v ? v.say + ` <span class="mono">(${r} · ${c})</span>` : `<b>${esc(L(r))}</b> — <b>${esc(L(c))}</b>: no ${MATRICES[tab].verb} edge. <span class="mono">${esc(title(rn).slice(0, 50))} / ${esc(title(cn).slice(0, 40))}</span>`;
}
$('#wrap').addEventListener('mouseover', e => { const td = e.target.closest('td.c'); if (td) readout(td); });
$('#theme').addEventListener('click', () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; });
const P = byId.get('plan'); $('#planid').textContent = `${G.id || 'plan'} · ${P ? P.fields.name + ' · ' + P.fields.lifecycle : ''}`;
{ const q = new URLSearchParams(location.hash.slice(1)); if (MATRICES[q.get('tab')]) tab = q.get('tab'); if (byId.has(q.get('sel'))) { sel = q.get('sel'); lit = lineage(sel); } }
render(); readings(); if (sel && new URLSearchParams(location.hash.slice(1)).has('open')) showDetail(sel);
})();
</script>
</body>
</html>
