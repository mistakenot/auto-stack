<script type="application/json" id="feedback-data">{"052": "# Feedback: Task 052\n\n## Problems faced\n1. **The whole loop \"works locally, fails in CI\" on a single omitempty field** — `TestE2ELoopQuickstart` asserted the `gap list` row carried a `session_id`, but `session_id` is `omitempty` and the feedback event's session resolves from `events.DetectSessionID()` (env vars). The dev shell exported a session id (inherited by the test subprocess), so it passed; the clean CI runner had none → field omitted → CI red. Fix was to pin `AUTO_SESSION_ID` for the e2e loop (first in detection precedence) so the loop runs under one deterministic session, matching how a real agent always runs. Lesson: any test asserting an env-derived/`omitempty` field must set that env explicitly, or it's only testing the dev host.\n2. **F2 root cause was a normalization mismatch, not \"two universes\"** — the 390-vs-396 pending divergence came from `miner status` scope-keying with a scheme-strip that skipped `sharedgit.NormalizeRemoteURL`, while `miner.PendingCount` ran it. Sessions whose `git_remote` was `.git`-suffixed / ssh-form / mixed-case fell out of one count but not the other. The plan's instruction to *reproduce the divergence first* (write the failing assertion before collapsing) was what surfaced it cleanly.\n3. **Content-derived ids + a variadic signature is a silent footgun** — `NewRuleID(parts ...string)` means a missed zero-arg caller still compiles but mints a constant id, which `projection.go` then drops all-but-first of. The plan had already flagged the third caller (`rule create`); without that pin it would have been a build-clean, test-passing data-loss bug.\n\n## Reflections\n- **What was tricky?** The CI-only failure — nothing local reproduced it until I cleared the four session env vars (`env -u …`) to simulate a clean runner. That `env -u` trick became the reliable repro.\n- **What would you tell yourself at the start?** Run the full suite *with the ambient session env cleared* before declaring a phase green, especially for anything touching feedback/gate/gap scope. The e2e phase passed locally and still broke CI.\n- **What did you almost do but didn't?** Almost made `gap list` always emit `session_id` (drop `omitempty`) to satisfy the test — but that diverges from the `events list` convention and papers over the real issue (the loop genuinely had no session). Fixing the *test's* environment was the honest fix.\n- The `--all` pending-universe bug (review thread) was a direct consequence of single-sourcing onto `PendingCount` without threading the scope flag — collapsing duplication is right, but the shared function has to carry every axis the callers varied on.\n\n## Useful context\n- `context.md`'s file:line grounding (especially the F2/F6/F7 sections and the \"third `NewRuleID` caller\" note) was the highest-leverage artifact — it turned each phase into a targeted edit rather than a search.\n- `auto-graph/internal/cli/doctor.go` as the canonical `doctor` template; `cli/events.go` as the closest `gap list` pattern. Mirroring existing siblings kept the new nouns idiomatic.\n- Decisions D-5/D-6/D-9 (envelope = presentation-only, no schema bump; pure content hash, idempotency intended) were the load-bearing constraints — they pre-answered the \"should I change the stored payload?\" and \"should I add a collision suffix?\" questions that came up mid-implementation and in review.\n- `reflect-playbook` is a **managed skill**: edit `skills/reflect-playbook/` source and re-render via full `auto skill sync --locked` (never `--target`, which deletes other rendered skills). Editing the `.claude/` render target directly trips the pre-commit `skills-check`.\n"}</script>
<script>
/* ================= data helpers ================= */
const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const FEEDBACK = JSON.parse(document.getElementById('feedback-data').textContent);
const STORIES = {};
let PLAN = '062';

function walk(n, f, parent) { f(n, parent); (n.c || []).forEach(ch => walk(ch, f, n)); }
function nodes(plan, t) { const out = []; walk(DATA[plan], n => { if (n.t === t) out.push(n); }); return out; }
function mdOf(n) { return (n.c || []).filter(c => c.t === '#md').map(c => c.v).join('\n\n'); }
function htmlOf(n) { return (n.c || []).filter(c => c.t === '#html').map(c => c.v).join(' '); }
const _ta = document.createElement('textarea');
function decode(s) { _ta.innerHTML = s; return _ta.value; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function dedent(s) {
  const lines = s.split('\n'); const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(isFinite(ind) ? ind : 0)).join('\n');
}
function md(s) {
  s = dedent(s).replace(/\]\(\.\.\/\.\.\//g, '](./')
    .replace(/\n(\*\*(Context|Decision|Alternatives|Consequences):\*\*)/g, '\n\n$1');
  return marked.parse(s, { gfm: true });
}
const byId = (plan, t, id) => nodes(plan, t).find(n => n.a.id === id);
function slug(s) { return String(s).replace(/[^A-Za-z0-9]+/g, '-'); }

/* rails (062) and findings (052) come from the plans' own markdown tables */
function tableRows(plan, secId, re) {
  const sec = byId(plan, 'section', secId); if (!sec) return {};
  const out = {};
  mdOf(sec).split('\n').forEach(l => { const m = l.match(re); if (m) m[1].split(/\s*\/\s*/).forEach(k => out[k.trim()] = { key: m[1], line: l }); });
  return out;
}
function rails() { return tableRows('062', 'inherited-rails', /^\|\s*\*\*(G\d+)\*\*\s*\|/); }
function findings() { return tableRows('052', 'goals', /^\|\s*\*\*(F[\dF\s/]+?)\*\*/); }
function cells(line) { return line.split('|').slice(1, -1).map(c => c.trim()); }

/* ================= record renderer (verbatim plan) ================= */
function rid(plan, n) {
  if (n.t === 'phase') return `rec-${plan}-P${n.a.n}`;
  if (n.t === 'file') return `rec-${plan}-f-${slug(n.a.path)}`;
  if (n.t === 'thread') return null;
  return n.a && n.a.id ? `rec-${plan}-${slug(n.a.id)}` : null;
}
function kids(plan, n) { return (n.c || []).map(c => render(plan, c)).join(''); }
function render(plan, n) {
  const a = n.a || {};
  const idAttr = rid(plan, n) ? ` id="${rid(plan, n)}"` : '';
  switch (n.t) {
    case 'doc': return kids(plan, n);
    case 'tab': return `<section class="rec-tab" id="rec-${plan}-tab-${slug(a.name)}"><h3>${esc(a.name)}</h3>${kids(plan, n)}</section>`;
    case 'scope': case 'decisions': return '';
    case '#md': return `<div class="md">${md(n.v)}</div>`;
    case '#html': return `<div class="md">${n.v}</div>`;
    case 'section': return `<div class="rec-sec filt"${idAttr}><h4>${esc(a.title || a.id)}</h4>${a.summary ? `<p class="sum">${esc(a.summary)}</p>` : ''}${kids(plan, n)}</div>`;
    case 'decision': return `<div class="card dec filt"${idAttr}><div class="hd"><span class="id">${esc(a.id)}</span><span class="ti">${esc(a.title)}</span></div>
      <div class="meta">status ${esc(a.status || '')} · decided by ${esc(a.by || '')}</div>${a.summary ? `<p class="sm">${esc(a.summary)}</p>` : ''}${kids(plan, n)}</div>`;
    case 'thread': return `<div class="thread filt"><div class="th">REVIEW THREAD · <b>${esc(a.title)}</b> · on ${esc(a.anchor)} · ${esc(a.priority || '')} · ${esc(a.status || '')}</div>${kids(plan, n)}</div>`;
    case 'comment': return `<div class="cm ${esc(a.by)}"><div class="who">${a.by === 'review' ? 'reviewer' : 'author'}</div><div class="md">${htmlOf(n).includes('<') || !/`/.test(htmlOf(n)) ? htmlOf(n) : md(decode(htmlOf(n)))}</div></div>`;
    case 'ac': return `<div class="card ac filt"${idAttr}><div class="hd"><span class="id">${esc(a.id)}</span><span class="ti">${esc(a.title)}</span></div>
      <div class="meta">phases ${esc(a.phases || '—')} · tests ${esc((a.tests || '—').split(',').join(', '))}</div>${kids(plan, n)}</div>`;
    case 'cli': {
      let h = `<div class="cli filt"${idAttr}>${a.title ? `<div class="ttl">${esc(a.title)}</div>` : ''}`;
      (n.c || []).forEach(c => {
        if (c.t === 'cmd') h += `<div class="cmd">${esc(decode(htmlOf(c)))}${c.a.note ? ` <span class="nt"># ${esc(c.a.note)}${c.a.status ? ' · ' + esc(c.a.status) : ''}</span>` : ''}</div>`;
        if (c.t === 'out') h += `<pre>${esc(decode(htmlOf(c)))}</pre>`;
      });
      return h + `</div>${a.caption ? `<p class="cap2">${esc(a.caption)}</p>` : ''}`;
    }
    case 'mermaid': return `<figure class="mm"><pre class="mermaid">${esc(decode(htmlOf(n)))}</pre>${a.caption ? `<figcaption>${esc(a.caption)}</figcaption>` : ''}</figure>`;
    case 'api': return `<div class="api filt"><div class="nm">${esc(a.kind)} ${esc(a.name)} <span class="fl">· ${esc(a.path || '')}</span></div>${a.caption ? `<p class="cap2">${esc(a.caption)}</p>` : ''}${(n.c || []).filter(c => c.t === 'member').map(m => `<div class="mem"><code>${esc(m.a.sig)}</code><br>${htmlOf(m)}</div>`).join('')}</div>`;
    case 'files': return `<table class="files">${(n.c || []).filter(c => c.t === 'file' || c.t === 'thread').map(f => f.t === 'file'
      ? `<tr class="filt" id="${rid(plan, f)}"><td>${esc(f.a.path)}</td><td><span class="chg ${esc(f.a.change)}">${esc(f.a.change)}</span></td><td>${htmlOf(f)}</td></tr>`
      : `<tr><td colspan="3">${render(plan, f)}</td></tr>`).join('')}</table>`;
    case 'stepper': return kids(plan, n);
    case 'phase': return `<div class="card phase filt"${idAttr}><div class="hd"><span class="id">P${esc(a.n)}</span><span class="ti">${esc(a.title)}</span></div>
      <div class="meta">status ${esc(a.status || '')}${a['depends-on'] ? ' · depends on P' + a['depends-on'].split(',').join(', P') : ' · no dependencies'} · ${a.files ? a.files.split(',').length : 0} files</div>
      ${kids(plan, n)}<div class="fl"><b>Files:</b> ${(a.files || '').split(',').filter(Boolean).map(esc).join(' · ')}</div></div>`;
    case 'trace': return traceMatrix(plan, a.caption);
    default: return kids(plan, n);
  }
}
function traceMatrix(plan, caption) {
  const acs = nodes(plan, 'ac'), ph = nodes(plan, 'phase').map(p => p.a.n);
  return `<div class="filt"><p class="cap2">${esc(caption || 'Acceptance coverage')} — generated from each criterion's <code>phases</code> attribute.</p><table class="trace"><tr><th>AC</th>${ph.map(p => `<th>P${p}</th>`).join('')}<th>tests</th></tr>
  ${acs.map(ac => { const ps = (ac.a.phases || '').split(','); return `<tr><td><a href="#${rid(plan, ac)}">${esc(ac.a.id)}</a></td>${ph.map(p => ps.includes(p) ? '<td class="y">●</td>' : '<td></td>').join('')}<td style="text-align:left">${(ac.a.tests || '—').split(',').map(t => esc(t.split('/').pop())).join(', ')}</td></tr>`; }).join('')}</table></div>`;
}

function renderRecord(plan) {
  const doc = DATA[plan]; const a = doc.a;
  const cnt = t => nodes(plan, t).length;
  const files = nodes(plan, 'file'); const ch = k => files.filter(f => f.a.change === k).length;
  let h = `<div class="in"><div class="kick">Appendix · complete and verbatim</div><h2 class="rh">The Record</h2>
  <p class="lede">Everything in plan ${esc(a.title)}, in its own words: every acceptance criterion, decision, review thread, phase and file. The story above is an argument; this is the evidence.</p>
  <div class="rtoc">${doc.c.filter(t => t.t === 'tab').map(t => `<a href="#rec-${plan}-tab-${slug(t.a.name)}">${esc(t.a.name)}</a>`).join('')}
   <span style="padding:4px 6px">${cnt('ac')} ACs · ${cnt('decision')} decisions · ${cnt('thread')} threads · ${cnt('phase')} phases · ${files.length} files (${ch('add')} add, ${ch('edit')} edit${ch('delete') ? ', ' + ch('delete') + ' delete' : ''})</span></div>
  <input class="rfilter" type="search" placeholder="filter the record (e.g. wonTransition, F7, doctor)…" aria-label="Filter the record">
  ${render(plan, doc)}`;
  if (FEEDBACK[plan]) h += `<div class="feedback filt" id="rec-${plan}-feedback"><div class="rec-sec"><h4>Post-execution feedback</h4><p class="sum">docs/tasks/052-reflect-tool-hardening/feedback.md — written after the task shipped, verbatim.</p><div class="md">${md(FEEDBACK[plan])}</div></div></div>`;
  h += `<p class="foot">Source: ${plan === '062' ? 'docs/tasks/062-auto-mail-walking-skeleton/plan.html' : 'docs/tasks/052-reflect-tool-hardening/plan.html'} · status ${esc(a.status)} · generated ${esc(a.generated)} · PR <a href="${esc(a.pr)}">${esc(a.pr)}</a> · next prompt <code>${esc(a['next-prompt'] || '')}</code></p></div>`;
  const el = document.getElementById('record'); el.innerHTML = h;
  el.querySelector('.rfilter').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    el.querySelectorAll('.filt').forEach(x => x.classList.toggle('hidden-by-filter', !!q && !x.textContent.toLowerCase().includes(q) && !x.querySelector('.filt:not(.hidden-by-filter)')));
    // parents containing a visible match stay visible
    if (q) el.querySelectorAll('.filt').forEach(x => { if (!x.classList.contains('hidden-by-filter')) { let p = x.parentElement.closest('.filt'); while (p) { p.classList.remove('hidden-by-filter'); p = p.parentElement.closest('.filt'); } } });

/* ================= mermaid (lazy) ================= */
let mermaidPending = false, mermaidLoading = false;
function maybeMermaid() {

  if (!window.mermaid) {
    if (mermaidLoading) return; mermaidLoading = true;
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    s.onload = () => { mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: 'IBM Plex Mono' }); maybeMermaid(); };

}

/* ================= drawer ================= */
function resolve(plan, ref) {
  let m;
  if (ref.startsWith('T:')) {
    const anchor = ref.slice(2); const ts = nodes(plan, 'thread').filter(t => t.a.anchor === anchor);
    return ts.length ? { title: `Review thread${ts.length > 1 ? 's' : ''} on ${anchor}`, html: ts.map(t => render(plan, t)).join(''), jump: null } : null;
  }
  if (ref === 'S:feedback' && FEEDBACK[plan]) return { title: 'Post-execution feedback', html: `<div class="md">${md(FEEDBACK[plan])}</div>`, jump: `rec-${plan}-feedback` };
  if (ref.startsWith('S:')) { const s = byId(plan, 'section', ref.slice(2)); return s ? { title: s.a.title, html: render(plan, s), jump: rid(plan, s) } : null; }
  if ((m = ref.match(/^P(\d)$/))) { const p = nodes(plan, 'phase').find(x => x.a.n === m[1]); return p ? { title: `Phase ${m[1]}`, html: render(plan, p), jump: rid(plan, p) } : null; }

    const r = rails()[ref]; if (!r) return null; const c = cells(r.line); const ac = byId(plan, 'ac', c[2]);
    return { title: `Guard rail ${ref}`, html: `<div class="card dec"><div class="hd"><span class="id">${ref}</span><span class="ti">${md(c[1]).replace(/<\/?p>/g, '')}</span></div><div class="meta">inherited from epic 005 · becomes ${esc(c[2])} (constraint abridged in the plan's table)</div></div>` + (ac ? render(plan, ac) : ''), jump: ac ? rid(plan, ac) : null };
  }

    const rel = new RegExp('\\b' + ref + '\\b');
    const acs = nodes(plan, 'ac').filter(x => rel.test(x.a.title)); const decs = nodes(plan, 'decision').filter(x => rel.test(x.a.title + x.a.summary));

  }
  const ac = byId(plan, 'ac', ref); if (ac) return { title: ref, html: render(plan, ac) + nodes(plan, 'thread').filter(t => t.a.anchor === ref).map(t => render(plan, t)).join(''), jump: rid(plan, ac) };
  const d = byId(plan, 'decision', ref); if (d) return { title: ref, html: render(plan, d) + nodes(plan, 'thread').filter(t => t.a.anchor === ref).map(t => render(plan, t)).join(''), jump: rid(plan, d) };
  return null;
}
function openDrawer(ref) {
  const r = resolve(PLAN, ref); if (!r) return;
  const dr = document.getElementById('drawer');
  dr.querySelector('.ttl').textContent = r.title;
  dr.querySelector('.body').innerHTML = r.html + (r.jump ? `<p class="foot"><a href="#${r.jump}" data-close>↓ see it in the Record, in context</a></p>` : '');
  dr.classList.add('open'); document.getElementById('scrim').classList.add('open');

}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ref]'); if (c) { e.preventDefault(); openDrawer(c.dataset.ref); return; }

});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* chips: {AC-3} {D-062-2} {G8} {F4} {P2} {T:anchor} {S:section-id} */
function chips(html) {

/* ================= svg helpers ================= */
function wrap(text, n) { const out = []; let line = ''; String(text).split(' ').forEach(w => { if ((line + ' ' + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }); if (line) out.push(line); return out; }
function T(x, y, lines, o = {}) {

  lines = Array.isArray(lines) ? lines : [lines];

}
function S(s, h, g) { return `${s != null ? ` data-s="${s}"` : ''}${h != null ? ` data-h="${h}"` : ''}${g != null ? ` data-g="${g}"` : ''}`; }

}

  files.forEach((f, i) => { const cx = x + (i % per) * (size + 3), cy = y + Math.floor(i / per) * (size + 3); const c = f.a.change;
    h += `<rect x="${cx}" y="${cy}" width="${size}" height="${size}" rx="2" style="fill:${c === 'add' ? 'var(--verm)' : c === 'delete' ? 'var(--paper)' : 'var(--ink3)'};stroke:${c === 'delete' ? 'var(--red)' : 'none'};stroke-width:1.5"><title>${esc(f.a.path)} (${c})</title></rect>${c === 'delete' ? `<path d="M${cx} ${cy + size}L${cx + size} ${cy}" stroke="var(--red)" stroke-width="1.5"/>` : ''}`; });
  return h;
}
function phaseAcs(plan, n) { return nodes(plan, 'ac').filter(a => (a.a.phases || '').split(',').includes(String(n))).map(a => a.a.id); }

/* ================= scrolly engine ================= */
let svgEl, story, cur = -1, obs, fxKill = null, MV = new Map();
function paint(el, st) { el.setAttribute('transform', `translate(${st.x.toFixed(2)} ${st.y.toFixed(2)}) scale(${st.s.toFixed(4)})`); el.style.opacity = st.o; }
function mountStory(plan) {

  // masthead
  document.getElementById('mast').innerHTML = `<div><div class="kick">Task ${plan} · <b>${story.field}</b></div><h1>${story.title}</h1><p class="dek">${story.dek}</p></div>
   <div class="facts"><div class="row"><span>plan</span><span>${esc(d.title)}</span></div><div class="row"><span>status</span><span>${esc(d.status)} · generated ${esc(d.generated)}</span></div>
   <div class="row"><span>pull request</span><span><a href="${esc(d.pr)}">#${esc(d.pr.split('/').pop())}</a></span></div>
   <div class="row"><span>acceptance criteria</span><span>${nodes(plan, 'ac').length}</span></div><div class="row"><span>decisions</span><span>${nodes(plan, 'decision').length}</span></div>
   <div class="row"><span>phases</span><span>${nodes(plan, 'phase').length} · ${story.shape}</span></div><div class="row"><span>files</span><span>${files.length} — ${ch('add')} new · ${ch('edit')} edited${ch('delete') ? ' · ' + ch('delete') + ' deleted' : ''}</span></div>
   <div class="row"><span>review threads</span><span>${nodes(plan, 'thread').length}, all resolved</span></div>
   <div class="field"><b>${story.field.toUpperCase()}</b>${story.fieldNote}</div></div>`;
  document.querySelectorAll('.pick button,.switch button').forEach(b => b.classList.toggle('on', b.dataset.plan === plan));
