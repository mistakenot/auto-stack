<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Lab 03 · Scrollytelling</title>
<meta name="description" content="Plans 062 (auto-mail walking skeleton) and 052 (reflect-tool hardening) told as scrollytelling stories, with a complete verbatim appendix.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --paper:#f5f0e6; --paper2:#efe8da; --card:#fbf8f2; --ink:#1c1a16; --ink2:#57524a; --ink3:#9a9384;
  --rule:#d8cfbd; --grid:#e4dccb;
  --verm:#cf3f1c; --gold:#b98a14; --gold2:#d9a927; --red:#c0331c; --graphite:#7d776c;
  --acc:var(--verm);
  --serif:'Instrument Serif', 'Times New Roman', serif;
  --body:'Newsreader', Georgia, serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
}
body.p052{ --acc:var(--gold); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161410; --paper2:#1e1b16; --card:#211e18; --ink:#efe8da; --ink2:#bdb4a3; --ink3:#7b7466;
    --rule:#3a352c; --grid:#24211b; --verm:#f0643e; --gold:#e0b03a; --gold2:#f0c552; --red:#f0573a; --graphite:#a39c8e;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
code{font-family:var(--mono);font-size:.82em;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:.05em .3em;border-radius:3px;word-break:break-word}
a{color:inherit}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;padding:8px 20px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.topbar .brand{font-family:var(--serif);font-size:20px;letter-spacing:0;font-style:italic}
.topbar .sp{flex:1}
.switch{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.switch button{font:inherit;background:none;border:0;color:var(--ink);padding:5px 12px;cursor:pointer}
.switch button.on{background:var(--ink);color:var(--paper)}
.topbar a.jump{text-decoration:none;border-bottom:1px solid var(--ink3)}

/* ---------- masthead ---------- */
.mast{max-width:1180px;margin:0 auto;padding:110px 24px 40px;display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:end}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.kick b{color:var(--acc);font-weight:500}
.mast h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,128px);line-height:.92;margin:.18em 0 .2em;letter-spacing:-.01em}
.mast h1 em{color:var(--acc)}
.dek{font-size:23px;line-height:1.4;color:var(--ink2);max-width:36ch;font-style:italic}
.facts{border-top:2px solid var(--ink);padding-top:12px;font-family:var(--mono);font-size:12.5px;line-height:1.9}
.facts .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--rule)}
.facts .row span:last-child{text-align:right}
.facts .field{margin-top:14px;padding:12px 14px;background:var(--card);border:1px solid var(--rule);font-family:var(--body);font-size:15px;line-height:1.45;letter-spacing:0}
.facts .field b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;display:block;color:var(--acc);margin-bottom:4px}
.pick{max-width:1180px;margin:0 auto 20px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pick button{all:unset;cursor:pointer;border:1px solid var(--rule);padding:14px 16px;background:var(--card);display:block}
.pick button .n{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink2)}
.pick button .t{font-family:var(--serif);font-size:28px;line-height:1.1;display:block}
.pick button.on{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pick button:focus-visible{outline:2px solid var(--acc)}

/* ---------- scrolly ---------- */
.scrolly{position:relative;display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:0 40px;max-width:1480px;margin:0 auto;padding:0 24px}
.steps{position:relative;z-index:2;padding:30vh 0 40vh}
.step{margin:0 0 72vh;padding:22px 24px 20px;background:var(--card);border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule);opacity:.35;transition:opacity .4s, border-color .4s}
.step.active{opacity:1;border-color:var(--ink)}
.step:last-child{margin-bottom:10vh}
.step .sk{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.step h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.06;margin:.2em 0 .4em}
.step p{margin:.55em 0}
.step .note{font-size:15.5px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:12px}
.pq{margin:.8em 0;padding:0 0 0 16px;border-left:4px solid var(--acc);font-family:var(--serif);font-size:25px;line-height:1.18}
.pq.big{font-size:30px}
.pq code{font-size:.7em}
.step ul,.step ol{padding-left:1.1em;margin:.5em 0}
.step li{margin:.3em 0;font-size:16.5px}
.flist{list-style:none;padding:0!important}
.flist li{padding-left:0}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;border:1px solid var(--ink3);background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 8px 1px;cursor:pointer;white-space:nowrap;vertical-align:1px;transition:all .15s}
.chip:hover,.chip:focus-visible{background:var(--ink);color:var(--paper);border-color:var(--ink);outline:none}
.chip.t{border-style:dashed}
.chip.s{border-radius:3px}

.graphic{position:sticky;top:48px;height:calc(100vh - 56px);display:flex;flex-direction:column;padding:10px 0 12px}
.ghead{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink2)}
.chapters{display:flex;gap:3px}
.chapters div{flex:1;border-top:3px solid var(--rule);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-size:9.5px;letter-spacing:.1em;transition:all .3s}
.chapters div.done{border-color:var(--ink3)}
.chapters div.on{border-color:var(--acc);color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid;vertical-align:3px;margin-right:4px}
.gwrap{flex:1;min-height:0;position:relative}
.gwrap svg{width:100%;height:100%;display:block;overflow:hidden}
svg .halo{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.term{margin-top:8px;background:#1c1a16;color:#efe8da;font-family:var(--mono);font-size:12px;line-height:1.5;padding:10px 14px;border-radius:6px;min-height:0;white-space:pre-wrap;overflow-wrap:anywhere;transition:opacity .35s;max-height:30%;overflow:auto}
.term.off{opacity:0}
.term .p{color:#e7a37f}
body.p052 .term .p{color:#e8c46b}
.term .c{color:#9a9384}

/* ---------- svg vocabulary ---------- */
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--ink2);white-space:pre}
svg .serif{font-family:var(--serif);fill:var(--ink)}
svg .it{font-style:italic}
svg .cap{font-size:9.5px;letter-spacing:.14em;fill:var(--ink2)}
svg .accf{fill:var(--acc)}
svg .redf{fill:var(--red)}
svg .goldf{fill:var(--gold)}
svg .paperf{fill:var(--paper)}
svg .inkf{fill:var(--ink)}
svg .gridline{stroke:var(--grid);stroke-width:.7}
svg .box{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
svg .box2{fill:var(--paper);stroke:var(--ink2);stroke-width:1}
svg .frame{fill:none;stroke:var(--ink);stroke-width:1.2}
svg .inkfill{fill:var(--ink)}
svg .accfill{fill:var(--acc);stroke:none}
svg .hair{stroke:var(--rule);stroke-width:1}
svg .link{stroke:var(--ink);stroke-width:1.3}
svg .flow{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .flowacc{fill:none;stroke:var(--acc);stroke-width:2}
svg .dash{fill:none;stroke:var(--ink3);stroke-width:1.3;stroke-dasharray:5 5}
svg .wall{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round}
svg .ring{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 4}
svg .bolt{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round}
svg .ahead{fill:var(--ink)}
svg .ahead.a{fill:var(--acc)}
svg .ahead.g{fill:var(--gold)}
svg .ahead.r{fill:var(--red)}
svg .ghost rect{fill:var(--paper);stroke:var(--ink3);stroke-dasharray:5 4;stroke-width:1.2}
svg .ghost text{fill:var(--ink3)}
svg .ghost text.serif{fill:var(--ink2)}
svg .evrow{fill:var(--paper2);stroke:var(--ink2);stroke-width:.8}
svg .bar{fill:var(--ink2)}
svg .pulse{fill:none;stroke:var(--acc);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}
svg .risk circle{fill:var(--acc)} svg .risk text{fill:var(--paper);font-size:11px;font-weight:600}
svg [data-ref]{cursor:pointer}
/* 052 palette */
svg .struct{fill:none;stroke:var(--graphite);stroke-width:2.2}
svg .structd{fill:none;stroke:var(--graphite);stroke-width:1;stroke-dasharray:2 4}
svg .defect{fill:none;stroke:var(--red);stroke-width:2.6}
svg .seam{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--gold2) 60%,transparent))}
svg .station{fill:var(--card);stroke:var(--graphite);stroke-width:2}
svg .badge circle{fill:var(--paper);stroke:var(--red);stroke-width:2}
svg .badge text{fill:var(--red);font-size:10px;font-weight:600}
svg .badge.gold circle{fill:var(--gold);stroke:var(--gold)}
svg .badge.gold text{fill:var(--paper)}
svg .gold .struct, svg .struct.gold{stroke:var(--gold)}
svg .gold .station{stroke:var(--gold);stroke-width:3}
svg .orbit{fill:var(--gold);stroke:var(--paper);stroke-width:2}

/* state machinery */
svg [data-s]{opacity:0;pointer-events:none;transition:opacity .6s ease}
svg [data-s].on{opacity:1;pointer-events:auto}
svg.focus [data-s].on:not(.hi):not(.nest):not(.fresh){opacity:.3}
svg.focus .hi [data-s].on{opacity:1}
svg .dr{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset 1.2s ease, opacity .6s}
svg .dr.on{stroke-dashoffset:0}
svg .hi .box, svg .box.hi{stroke:var(--acc);stroke-width:2.4}
svg .hi .station{stroke:var(--acc);stroke-width:3}
svg .hi .frame, svg .frame.hi{stroke:var(--acc);stroke-width:2.2}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);border-left:2px solid var(--ink);z-index:60;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.drawer header button{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:0 4px}
.drawer .body{overflow:auto;padding:6px 20px 40px;font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.25);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}

/* ---------- record (appendix) ---------- */
.record{border-top:3px double var(--ink);margin-top:40px;padding:60px 24px 120px;background:var(--paper2)}
.record .in{max-width:1080px;margin:0 auto}
.record h2.rh{font-family:var(--serif);font-weight:400;font-size:64px;margin:0;line-height:1}
.record .lede{font-size:19px;color:var(--ink2);max-width:62ch;font-style:italic}
.rtoc{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px;font-family:var(--mono);font-size:12px}
.rtoc a{text-decoration:none;border:1px solid var(--rule);padding:4px 10px;background:var(--card)}
.rtoc a:hover{border-color:var(--ink)}
.rfilter{width:100%;max-width:420px;font:14px var(--mono);padding:8px 10px;border:1px solid var(--ink3);background:var(--card);color:var(--ink)}
.rec-tab{margin-top:44px}
.rec-tab>h3{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px;color:var(--acc)}
.rec-sec{margin:22px 0 10px}
.rec-sec>h4{font-family:var(--serif);font-weight:400;font-size:30px;margin:.3em 0 .1em;line-height:1.1}
.rec-sec>.sum{font-style:italic;color:var(--ink2);margin:.1em 0 .6em}
.md{font-size:16px}
.md p{margin:.5em 0}
.md table{border-collapse:collapse;font-size:14px;margin:.6em 0;width:100%}
.md th,.md td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.md th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.md blockquote{border-left:3px solid var(--acc);margin:.6em 0;padding:.1em 0 .1em 14px;font-style:italic}
.md pre{background:var(--card);border:1px solid var(--rule);padding:10px;overflow:auto;font-size:12.5px}
.md pre code{background:none;padding:0}
.card{background:var(--card);border:1px solid var(--rule);padding:12px 16px;margin:12px 0;position:relative}
.card .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .id{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--acc)}
.card .ti{font-family:var(--serif);font-size:22px;line-height:1.15;flex:1;min-width:60%}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em;margin-top:4px}
.card .sm{font-style:italic;color:var(--ink2);margin:.35em 0}
.card.dec{border-left:4px solid var(--ink)}
.card.ac{border-left:4px solid var(--acc)}
.card.phase{border-left:4px solid var(--ink2)}
.thread{border:1px dashed var(--ink3);background:transparent;padding:10px 14px;margin:8px 0 14px 18px;font-size:14.5px}
.thread .th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);margin-bottom:4px}
.thread .th b{color:var(--ink)}
.cm{margin:6px 0;padding:6px 10px;border-radius:4px}
.cm.review{background:color-mix(in srgb,var(--red) 7%,transparent)}
.cm.author{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cm .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.cli{background:#1c1a16;color:#efe8da;border-radius:6px;padding:12px 14px;margin:12px 0;font-family:var(--mono);font-size:12.5px;overflow:auto}
.cli .ttl{color:#9a9384;font-size:11px;margin-bottom:6px}
.cli .cmd{color:#fff}.cli .cmd::before{content:'$ ';color:#e7a37f}
.cli .nt{color:#9a9384}
.cli pre{margin:2px 0 10px;white-space:pre-wrap;color:#cfc6b4;font-family:inherit}
.cap2{font-size:13.5px;color:var(--ink2);font-style:italic}
.api{border:1px solid var(--rule);background:var(--card);margin:12px 0;padding:10px 14px}
.api .nm{font-family:var(--mono);font-weight:500}
.api .mem{margin:6px 0;padding-left:10px;border-left:2px solid var(--rule);font-size:14.5px}
.api .mem code{display:inline-block;background:none;padding:0;font-size:12.5px;color:var(--acc)}
.files{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.files td{border-bottom:1px solid var(--rule);padding:4px 6px;vertical-align:top}
.files td:first-child{font-family:var(--mono);font-size:12px;white-space:nowrap}
.chg{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;text-transform:uppercase}
.chg.add{background:color-mix(in srgb,var(--verm) 16%,transparent);color:var(--verm)}
.chg.edit{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink2)}
.chg.delete{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);text-decoration:line-through}
.fl{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.7}
.trace{border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:10px 0}
.trace th,.trace td{border:1px solid var(--rule);padding:3px 8px;text-align:center}
.trace td:first-child,.trace th:first-child{text-align:left}
.trace td.y{background:color-mix(in srgb,var(--acc) 22%,transparent);font-weight:600}
figure.mm{margin:14px 0;background:var(--card);border:1px solid var(--rule);padding:12px;overflow:auto}
figure.mm pre{font-size:11px;margin:0;white-space:pre-wrap}
figure.mm figcaption{font-size:13px;font-style:italic;color:var(--ink2);margin-top:6px}
.hidden-by-filter{display:none!important}
.feedback{border:2px solid var(--ink);background:var(--card);padding:6px 18px;margin-top:28px}
.foot{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:50px}

/* ---------- mobile ---------- */
@media (max-width: 900px){
  body{font-size:17px}
  .mast{grid-template-columns:1fr;padding-top:84px;gap:18px}
  .pick{grid-template-columns:1fr}
  .scrolly{display:flex;flex-direction:column;padding:0 16px}
  .scrolly .graphic{order:-1}
  #stepno{display:none}
  .switch button{padding:5px 9px}
  .graphic{top:44px;height:54vh;z-index:1;background:var(--paper);margin:0 -16px;padding:6px 10px}
  .legend{display:none}
  .term{font-size:10.5px;max-height:26%}
  .steps{padding:4vh 0 30vh;margin-top:0}
  .step{margin-bottom:60vh;background:color-mix(in srgb,var(--card) 96%,transparent);opacity:.9}
  .step h2{font-size:28px}
  .pq{font-size:21px}.pq.big{font-size:23px}
  .topbar .brand{display:none}
  .topbar{padding:8px 12px;gap:8px}
  .record{padding:40px 16px 80px}
  .record h2.rh{font-size:46px}
  .files td:first-child{white-space:normal;word-break:break-all}
}
figure.mm svg{max-height:640px;width:auto!important;max-width:100%!important;height:auto;display:block;margin:0 auto}

</style>
</head>
<body>
<div class="topbar"><span class="brand">Plan Lab · The Story</span><span class="kick" id="stepno"></span><span class="sp"></span>
 <div class="switch" role="tablist" aria-label="Choose plan"><button data-plan="062">062 · green</button><button data-plan="052">052 · brown</button></div>
 <a class="jump" href="#record">the record ↓</a></div>
<header class="mast" id="mast"></header>
<nav class="pick" aria-label="Choose plan">
 <button data-plan="062"><span class="n">TASK 062 · GREEN FIELD</span><span class="t">A Mail Travels</span></button>
 <button data-plan="052"><span class="n">TASK 052 · BROWN FIELD</span><span class="t">The Loop That Was Open</span></button>
</nav>
<main class="scrolly">
 <div class="steps" id="steps"></div>
 <div class="graphic" aria-hidden="false">
  <div class="ghead"><div class="chapters" id="chapters"></div><div class="legend" id="legend"></div></div>
  <div class="gwrap" id="gwrap"></div>
  <div class="term off" id="term"></div>
 </div>
</main>
<section class="record" id="record"></section>

<script type="application/json" id="plan-data">{"062":{"t":"doc","a":{"title":"062: auto-mail-walking-skeleton","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/146","generated":"2026-08-25","next-prompt":"/commit-task 062"},"c":[{"t":"tab","a":{"name":"Requirements"},"c":[{"t":"scope","a":{},"c":[]},{"t":"section","a":{"id":"problem","title":"Problem"},"c":[{"t":"#md","v":"The stack carries events *outward* — `auto-shared/bus` broadcasts what happened\nto whoever is listening — but nothing carries a message **to a named recipient**\nand guarantees it survives until someone acts on it. A supervisor learns its\nchild crashed by noticing silence. An agent in `auto-stack` that finds a bug in\n`auto-web` has nowhere to put that fact. Two agents in a swarm rediscover the\nsame thing independently.\n\n[Epic 005](../../epics/epic-005-auto-mail-mvp.html) fills that gap with\n`auto mail`: a durable, addressed, at-least-once channel between agents on one\nhost. This task is the epic's **T1 — the walking skeleton**.\n\nThe risk T1 exists to retire is not the store. It is **hook → notification**:\nwhether a working agent can be told it has mail, in-band, cheaply, without\nbreaking its turn. Deferring that would defer all the risk, so it is inside the\nskeleton. The second thing it retires is the *oracle*: the harness scenario is\nstood up now so T2–T4 are developed against a working end-to-end test rather\nthan one that arrives at the end and can only confirm what was already built."}]},{"t":"section","a":{"id":"scope-statement","title":"What this task is","summary":"Ontology first, then a harness scenario with two agents on one host, then one message travelling between them and being acked — proven by the scenario."},"c":[{"t":"#md","v":"Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab)."}]},{"t":"section","a":{"id":"target-transcript","title":"The transcript this task must make real (C1)"},"c":[{"t":"cli","a":{"id":"C1","title":"zsh — two agents trading a message","caption":"Subscribe, send, list, ack — the whole T1 surface. Copied from epic 005; T1 must reproduce these payload shapes."},"c":[{"t":"cmd","a":{"note":"receiver binds a virtual channel","status":"done"},"c":[{"t":"#html","v":"auto mail subscribe auto-web/bugs"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }<\/script>"}]},{"t":"cmd","a":{"note":"sender is in a different project, same host","status":"done"},"c":[{"t":"#html","v":"<script type=\"text/plain\">auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"<\/script>"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }<\/script>"}]},{"t":"cmd","a":{"note":"receiver is nudged mid-turn, then lists","status":"done"},"c":[{"t":"#html","v":"auto mail list"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">[\n  {\n    \"id\": \"01K9X2QF7M3B0V8N\",\n    \"from\": \"auto-stack/reviewer\",\n    \"sentAt\": \"2026-08-25T10:14:02Z\",\n    \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" }\n  }\n]<\/script>"}]},{"t":"cmd","a":{"note":"explicit ack — separate call, always","status":"done"},"c":[{"t":"#html","v":"auto mail ack 01K9X2QF7M3B0V8N"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }<\/script>"}]},{"t":"cmd","a":{"note":"acked mail is gone from the default view","status":"done"},"c":[{"t":"#html","v":"auto mail list"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"[]"}]}]}]},{"t":"section","a":{"id":"goals","title":"Goals"},"c":[{"t":"#md","v":"1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4).** `auto mail subscribe|send|list|ack` — flat\n   verbs on `mail` as the resource noun, JSON on stdout, diagnostics on stderr.\n   Plus `init`, `docs` and `reset`.\n\n6. **Broadcast delivery with a compare-and-set ack (D-7, G2, G13).** Consumer\n   state is keyed by `(subscription, mail)`, delivery rows are materialised\n   **lazily against a subscription cursor** (D-10), and `ack` is a conditional\n   update inside the append-and-project transaction that **reports whether this\n   call won the transition**.\n\n7. **An in-band nudge to a working agent (G8).** `auto hooks fire` — the\n   existing PostToolUse adapter that already emits `hookSpecificOutput.\n   additionalContext` for hint rules — also tells an agent it has mail. The\n   no-mail path costs a `stat`, never opens the store, and can never stall or\n   break the hook.\n\n8. **The harness scenario is the verdict (G15).** A new, purely additive\n   `mail-flow` scenario under `harness/scenarios/` brings up two agents on one\n   host, runs the C1 loop against the **real `auto` binary in a container**, and\n   asserts the nudge and the ack. A capability that cannot be demonstrated there\n   is not finished.\n\n9. **Nothing already shipped breaks.** The package is new; the only edits to\n   existing code are additive command registration, the hook's mail check, and\n   the glossary. `make check` and `make test` stay green."}]},{"t":"section","a":{"id":"inherited-rails","title":"Inherited guard rails","summary":"Twelve rails from epic 005. Each maps to exactly one acceptance criterion in the Verification tab."},"c":[{"t":"#md","v":"| Rail | Constraint (abridged) | Becomes |\n|---|---|---|\n| **G1** | Mail rows and events are immutable; state changes are appended and re-projected | AC-3 |\n| **G2** | Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row | AC-4 |\n| **G3** | Ack is a separate explicit call; reading does not retire mail | AC-5 |\n| **G4** | At-least-once and unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to."}]},{"t":"section","a":{"id":"out-of-scope","title":"Out of Scope"},"c":[{"t":"#md","v":"Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem)."}]},{"t":"section","a":{"id":"references","title":"Reference code & docs","summary":"Verified paths this task builds on or extends."},"c":[{"t":"#md","v":"**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck."}]},{"t":"section","a":{"id":"decisions","title":"Decisions taken while writing these requirements"},"c":[{"t":"#md","v":"These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected."}]},{"t":"decision","a":{"id":"D-062-1","title":"Two agents on one host = two workspaces in one container, not two containers","status":"accepted","by":"agent","summary":"The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts."},"c":[{"t":"#md","v":"**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control."}]},{"t":"decision","a":{"id":"D-062-2","title":"A binding is keyed by the physical context hooks already capture","status":"accepted","by":"agent","summary":"Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing."},"c":[{"t":"#md","v":"**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes."}]},{"t":"thread","a":{"anchor":"D-062-2","status":"resolved","priority":"p1","title":"Binding freshness conflicts with the stat-only hook path"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"D-062-2 says every hook fire refreshes `last_seen` on the matching binding row, and AC-9 treats stale versus live bindings as observable through the `bound` count. But AC-10, the end-state flow, and Phase 3 require the hook mail check to perform zero store opens and even leave `~/.auto/mail/alpha-store.db` nonexistent on a host that never ran `auto mail init`. A hook cannot update a SQLite `bindings.last_seen` row without opening or creating the store. The current hook code also only captures context and then emits hints (`auto-cli/cmd/auto/hookscmd.go:94-124`); there is no existing binding-refresh sink. Resolve this before execution: either defer `last_seen`/staleness to T3 and define T1 `bound` as current binding rows, or add an explicit refresh mechanism and acceptance coverage that still satisfies G8."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Correct, and a real contradiction rather than an ambiguity — a `last_seen` refresh is a store write, and G8 forbids one in the hook. Resolved by scoping, not by weakening G8: D-062-2 now states that <strong>`subscribe` is the only writer of a binding row in T1<\/strong>, and that heartbeat refresh arrives with T3, which already owns liveness (G9, D-8) and has a daemon to carry the write. The consequence you implied is now recorded explicitly: in T1 <code>bound<\/code> means \"a binding row exists\", not \"an agent is alive right now\", and <code>auto mail docs<\/code> says so, so nobody reads a liveness promise into the count early. AC-9's \"stale or absent\" wording is corrected to \"no binding row\". The <code>last_seen<\/code> column is still created and stamped at subscribe, so T3 adds a writer rather than a schema change."}]}]},{"t":"decision","a":{"id":"D-062-3","title":"The no-mail hook path is gated by a pending-flag file, not a store read","status":"accepted","by":"agent","summary":"G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite."},"c":[{"t":"#md","v":"**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package."}]},{"t":"thread","a":{"anchor":"D-062-3","status":"resolved","priority":"p1","title":"Present pending-flag behavior contradicts AC-10"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"D-062-3 says an absent flag returns immediately, but \"only a present flag causes a store open\"; its consequences also say a false positive costs one store open and emits nothing. Later sections require the opposite: the Approach says \"The nudge never opens the store\", the end-state flow says the hook stats the flag with no DB open, AC-10 requires zero store opens on either path, and Phase 3 tests `HasPending` for zero opens on both paths while emitting a nudge when the flag exists. These are mutually exclusive contracts. Pick whether a present flag is authoritative enough to emit the fixed nudge, or whether the hook confirms through the store, then align D-062-3, AC-10, and Phase 3."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Accepted — D-062-3 was written before the design settled and kept its earlier \"a present flag causes a store open\" text while every later section said the opposite. The hook opening the store was the stale half, so D-062-3 is now aligned to the rest: the hook stats exactly one path and <strong>never opens the store on either path<\/strong>; the flag is authoritative for the <em>decision to nudge<\/em>. That is safe precisely because the nudge is a fixed constant carrying no mailbox content, so a wrong decision can neither leak nor misstate anything. The consequences are restated to match: a false positive costs the agent one wasted <code>auto mail list<\/code>, which finds nothing and clears the flag itself, making drift self-healing rather than sticky."}]}]},{"t":"decision","a":{"id":"D-062-4","title":"T1 ships init, docs and reset; quickstart and doctor land in T4","status":"accepted","by":"agent","summary":"The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing."},"c":[{"t":"#md","v":"**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim."}]},{"t":"decision","a":{"id":"D-062-5","title":"T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface","status":"accepted","by":"agent","summary":"D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3."},"c":[{"t":"#md","v":"**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire."}]},{"t":"decision","a":{"id":"D-062-6","title":"Inline notification in T1 is the pending flag; the bus event waits for the daemon","status":"accepted","by":"agent","summary":"D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host."},"c":[{"t":"#md","v":"**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes."}]},{"t":"decision","a":{"id":"D-062-7","title":"Losing an ack race is a reported outcome, not an error exit","status":"accepted","by":"agent","summary":"wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage."},"c":[{"t":"#md","v":"**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free."}]},{"t":"section","a":{"id":"open-questions","title":"Open Questions & Assumptions","summary":"No open pd-questions — every fork was resolvable from the epic or an existing repo pattern. These are the assumptions carried forward."},"c":[{"t":"#md","v":"Assumptions this task proceeds on. Each is safe to revisit without redoing work:\n\n- [ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\n  backlog records maildir as \"genuinely better for lock-free concurrent append\"\n  but superseded by SQLite once subscriptions, read state and bindings exist.\n  `modernc.org/sqlite` is already a direct dependency of two modules, so this\n  adds no runtime dependency.\n- [ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\n  write connection per process, with every write in one immediate transaction.**\n  D-11 names this as an explicit T1 concern; this is the conventional answer and\n  is asserted under `-race` rather than assumed.\n- [ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\n  cross-host merge argument in the backlog (§3). Subscription ids follow the\n  `sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\n  the store relies on**: cursors and every \"after this point\" comparison use the\n  log's own append sequence, because ULID monotonicity is process-local and\n  every `auto mail` verb is a separate process (D-11).\n- [ ] **The body is a JSON object**, and `--message <text>` is sugar for\n  `{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n  `kind` vocabulary and the open `attributes` map are additive fields on the\n  envelope.\n- [ ] **`auto mail list` with no filters returns every unacked delivery for every\n  subscription the caller is bound to**, per the project convention that\n  list commands return all items when no filters are given. `--address` scopes it\n  to one subscription.\n- [ ] **The sender's `from` address is resolved by a three-rung ladder**, because\n  a plain `auto mail send` process sees neither the hook payload's `agent` nor a\n  `session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n  `--from <address>`; (2) the address of a subscription bound to the caller's\n  `(manager, target)` — lowest subscription id when there is more than one, so it\n  is deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\n  project registry, or `unregistered/agent` when the cwd is not a registered\n  project. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\n  own reply address first, which is also how it becomes reachable for a reply. The\n  result is always a resolved absolute address, never a relative handle (G5).\n- [ ] **`--text` output mode is not built in T1.** JSON is the default and the\n  only mode; the consumers in T1 are agents and the harness. It arrives with T4's\n  adoption surface if a human ever needs it."}]},{"t":"decisions","a":{},"c":[]}]},{"t":"tab","a":{"name":"Verification"},"c":[{"t":"section","a":{"id":"test-strategy","title":"Test Strategy","summary":"Conformance-test driven: the guard rails are written as executable expectations first, and the harness scenario is the verdict."},"c":[{"t":"#md","v":"The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment."}]},{"t":"section","a":{"id":"coverage-map","title":"Coverage Map"},"c":[{"t":"mermaid","a":{"caption":"What each layer proves, and which rails it carries"},"c":[{"t":"#html","v":"flowchart TB\n  subgraph L5[\"harness/scenarios/mail-flow — THE VERDICT\"]\n    H1[\"C1 loop end to end<br/>subscribe → send → list → ack → list\"]\n    H2[\"in-band nudge<br/>auto hooks fire emits additionalContext\"]\n    H3[\"no-mail hook never creates the store\"]\n    H4[\"send with no subscription persists<br/>later subscriber sees it\"]\n  end\n  subgraph L4[\"CLI + hook integration (auto-mail, auto-cli)\"]\n    C1[\"exact C1 JSON payload shapes\"]\n    C2[\"single stdout emission, PostToolUse only\"]\n    C3[\"hook exits 0 with a corrupt/absent store\"]\n  end\n  subgraph L3[\"race (-race, RACE_PROJECTS)\"]\n    R1[\"N acks → exactly one wonTransition\"]\n    R2[\"N writer processes → no lost events\"]\n  end\n  subgraph L2[\"conformance suite (auto-mail/conformance)\"]\n    F1[\"explicit ack; list does not retire\"]\n    F2[\"backfill from cursor on subscribe\"]\n    F3[\"subscriptions vs bound counts\"]\n  end\n  subgraph L1[\"package tests (internal/mail)\"]\n    U1[\"append-only log; no UPDATE on events\"]\n    U2[\"deliveries keyed by (subscription, mail)\"]\n    U3[\"free-form addresses; separator allowed\"]\n    U4[\"pending flag: zero store opens when absent\"]\n  end\n  L1 --> L2 --> L3 --> L4 --> L5\n  L5 --> V[\"G15: done\"]"}]}]},{"t":"section","a":{"id":"acceptance-criteria","title":"Acceptance Criteria","summary":"Thirteen criteria: one per inherited guard rail, plus the C1 transcript and the harness scenario itself."},"c":[{"t":"#md","v":"Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped."},{"t":"ac","a":{"id":"AC-1","title":"G16 — the ontology lands before the code that uses it","phases":"1","tests":"auto-mail/mail/mail_test.go"},"c":[{"t":"#md","v":"- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green"}]},{"t":"ac","a":{"id":"AC-2","title":"C1 — the epic's transcript runs verbatim","phases":"1,2","tests":"auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py"},"c":[{"t":"#md","v":"- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `<projectId>/agent`, or `unregistered/agent` outside a registered project"}]},{"t":"thread","a":{"anchor":"AC-2","status":"resolved","priority":"p1","title":"Default `from` address is not derivable today"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"C1 omits `--from`, but the expected list payload includes `\"from\": \"auto-stack/reviewer\"`. The assumptions and Phase 2 say the fallback is derived from `&lt;project&gt;/&lt;agent&gt;` or `&lt;projectId&gt;/agent` via the registry. Checked `auto-shared/config/projects.go:20-31`: `ProjectRef` stores ID, Path, Remote, Name, Tools, and RegisteredAt, but no agent name. A normal `auto mail send` CLI process also does not receive the hook payload's `agent` or `session_id`, and T2 explicitly defers self-identification. Define the T1 source of `from` before implementation: require `--from` in C1/harness, use a documented env var, use a literal fallback such as `&lt;project&gt;/agent`, or add a subscribe-before-send identity path, then cover that exact behavior in AC-2."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Correct, and the evidence is right — <code>config.ProjectRef<\/code> carries no agent name, and a plain <code>auto mail send<\/code> sees neither the hook payload's <code>agent<\/code> nor a <code>session_id<\/code>; self-identification is exactly what D-13 defers to T2, so T1 must not depend on it. Resolved by defining an explicit three-rung ladder rather than leaving it to the implementer: (1) <code>--from &lt;address&gt;<\/code>; (2) the address of a subscription bound to the caller's <code>(manager, target)<\/code>, lowest subscription id when several so it is deterministic; (3) the literal <code>&lt;projectId&gt;/agent<\/code> from the registry, or <code>unregistered/agent<\/code> outside a registered project. C1's <code>auto-stack/reviewer<\/code> is rung 2 — the sender subscribed to its own reply address first, which is also what makes it reachable for a reply. AC-2 now asserts all three rungs, and the harness scenario has the sender subscribe first so C1's shape is the shape actually exercised."}]}]},{"t":"ac","a":{"id":"AC-3","title":"G1 — mail and events are immutable","phases":"2,5","tests":"auto-mail/internal/store/store_test.go"},"c":[{"t":"#md","v":"- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)"}]},{"t":"ac","a":{"id":"AC-4","title":"G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor","phases":"2,4","tests":"auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go"},"c":[{"t":"#md","v":"- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)"}]},{"t":"thread","a":{"anchor":"AC-4","status":"resolved","priority":"p2","title":"Cursor flag spelling is inconsistent"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"AC-4 says the opt-out cursor case is created with `--from now`, but the command surface, file-change tree, and Phase 4 all use `--from-now`. Cobra will only accept `--from now` if a separate `--from` flag is implemented, which the plan does not list. Pick one spelling and make the acceptance criterion, CLI examples, and tests agree; if the intended surface is the flat boolean flag, AC-4 should name `--from-now`."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Correct — a typo in AC-4, not a second flag. Every other surface (the command transcript, the file-change tree, Phase 4) says <code>--from-now<\/code>, which is the intended boolean flag; AC-4 now says the same. No <code>--from<\/code> flag exists on <code>subscribe<\/code>."}]}]},{"t":"ac","a":{"id":"AC-5","title":"G3 — ack is a separate explicit call; reading does not retire","phases":"2,4","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go"},"c":[{"t":"#md","v":"- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller"}]},{"t":"ac","a":{"id":"AC-6","title":"G13 / D-7 — ack transitions exactly once and reports whether it won","phases":"2,5","tests":"auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go"},"c":[{"t":"#md","v":"- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint"}]},{"t":"ac","a":{"id":"AC-7","title":"G4 — at-least-once and unordered, as documented","phases":"4,5","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go"},"c":[{"t":"#md","v":"- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide"}]},{"t":"thread","a":{"anchor":"AC-7","status":"resolved","priority":"p2","title":"Duplicate delivery-row test contradicts the delivery key"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"AC-7 says duplicate delivery handling is simulated by injecting a duplicate delivery row, but AC-4 and the schema require `deliveries` to be keyed by `(subscription_id, mail_id)`. A duplicate row for the same delivery should be rejected by the schema; a row for another subscription is broadcast fan-out, not a duplicate delivery. If the goal is to prove at-least-once/idempotent handling, simulate duplicate list output at the client/CLI boundary or use two distinct subscriptions deliberately. Do not require a persistent row shape the schema is supposed to forbid."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Accepted — asking a test to insert a row the <code>(subscription_id, mail_id)<\/code> primary key is supposed to forbid would have been asserting against the schema G2 requires. The intent was always the caller-facing half of G4, so the simulation moves to where duplicates can actually appear: a <code>Client<\/code> decorator that repeats one entry in the <code>List<\/code> result. AC-7 now states that explicitly, and says in as many words that a second <code>deliveries<\/code> row must not be used."}]}]},{"t":"ac","a":{"id":"AC-8","title":"G5 / D-9 — addresses are virtual and free-form","phases":"2,3","tests":"auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go"},"c":[{"t":"#md","v":"- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)"}]},{"t":"ac","a":{"id":"AC-9","title":"G6 — send with no subscription persists, and reports both counts","phases":"4","tests":"auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py"},"c":[{"t":"#md","v":"- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)"}]},{"t":"ac","a":{"id":"AC-10","title":"G8 — the nudge is free when there is no mail, and can never break the hook","phases":"3","tests":"auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py"},"c":[{"t":"#md","v":"- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent"}]},{"t":"ac","a":{"id":"AC-11","title":"G10 / D-2 — alpha is in the type string and the filename, and reset works","phases":"1,5","tests":"auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go"},"c":[{"t":"#md","v":"- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade"}]},{"t":"thread","a":{"anchor":"AC-11","status":"resolved","priority":"p2","title":"`alpha.mail.read` is omitted from the alpha event list"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"The Solution and Phase 2 define four event types, including `alpha.mail.read`, and the end-state schema says `read_at` is written in T1 so T3 has escalation history. AC-11's event-type list names only `alpha.mail.subscribed`, `alpha.mail.sent`, and `alpha.mail.acked`. If that list is treated as exhaustive, a correct read event will fail the acceptance test; if it is illustrative, the criterion is ambiguous. Include `alpha.mail.read` explicitly or state that the listed event types are examples."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Correct — the list was written before the decision to stamp <code>read_at<\/code> in T1 (taken so T3's escalation predicate has history to read) and was never updated. AC-11 now names the complete T1 vocabulary — <code>alpha.mail.subscribed<\/code>, <code>alpha.mail.sent<\/code>, <code>alpha.mail.read<\/code>, <code>alpha.mail.acked<\/code> — and states that the assertion is twofold: every emitted type carries the <code>alpha.<\/code> prefix, and these four are the complete set. No ambiguity about exhaustive versus illustrative is left."}]}]},{"t":"ac","a":{"id":"AC-12","title":"G11 — nothing outside the mail package reads the store","phases":"5","tests":"auto-mail/conformance/seam_test.go"},"c":[{"t":"#md","v":"- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")"}]},{"t":"thread","a":{"anchor":"AC-12","status":"resolved","priority":"p1","title":"SQLite import guard fails against existing modules"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"AC-12 says a repo-wide guard should fail on any `modernc.org/sqlite` import outside `auto-mail/internal/mail`; Phase 5 says outside `auto-mail/internal/store`. Both versions fail against the current repo before this task starts: `auto-watch/internal/store/store.go:15`, `auto-search/internal/indexdb/schema.go:9`, and `auto-search/internal/cochange/load.go:23` already import `modernc.org/sqlite`, and `auto-watch`/`auto-search` have direct v1.53.0 requirements in their `go.mod` files. The seam guard should target direct mail-store access instead: `alpha-store.db`, `~/.auto/mail`, `sqlite3` invocations against that path, and `auto-mail/internal/store` imports from outside the allowed mail packages. Also align the allowed path with the Solution, which uses `auto-mail/internal/store`, not `auto-mail/internal/mail`."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Correct, and this one would have failed on day zero — <code>auto-watch/internal/store/store.go<\/code> and <code>auto-search/internal/indexdb/schema.go<\/code> import <code>modernc.org/sqlite<\/code> for their own stores, entirely legitimately. The guard was aimed at the wrong thing: G11 is about the <em>mail store<\/em>, not about SQLite. AC-12 and Phase 5 are rewritten to target direct mail-store access — the <code>alpha-store.db<\/code> filename, an <code>~/.auto/mail<\/code> path opened as a database, a <code>sqlite3<\/code> invocation against either — plus an import guard on <code>auto-mail/internal/...<\/code> from outside the module. Both now say <code>auto-mail/internal/store<\/code>; the stale <code>internal/mail<\/code> path in AC-12 is gone. AC-12 also notes that the internal-import half is already a compile-time guarantee, so the test is a regression guard rather than the guarantee itself."}]}]},{"t":"ac","a":{"id":"AC-13","title":"G15 — it passes end to end in the harness","phases":"1,2,3,4,5","tests":"harness/tests/mail_flow/test_mail_loop.py"},"c":[{"t":"#md","v":"- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the send-before-subscribe case passes (AC-9's J2 half)\n- **And** every assertion uses bounded retry on the observable outcome, with no\n  `sleep`-to-settle and no assertion on counts that duplicates would break\n- **And** the scenario is registered in `harness/src/harness/cli.py`'s `SCE
