NARIOS`\n  and adding it changed no existing scenario\n- **And** `make check` and `make test` are green from the repo root, with\n  `make test-race` green for the new `auto-mail` entry in `RACE_PROJECTS`"}]},{"t":"trace","a":{"caption":"Acceptance coverage"},"c":[]}]},{"t":"section","a":{"id":"verification-gaps","title":"Known Gaps & Risks"},"c":[{"t":"#md","v":"Stated rather than hidden. None of these blocks T1; each names who closes it.\n\n- **The `mail.Client` seam has one implementation.** Seam 1 warns that an\n  abstraction with one implementation is a guess. The conformance suite is the\n  mitigation (D-062-5), but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10)."}]}]},{"t":"tab","a":{"name":"Solution"},"c":[{"t":"section","a":{"id":"approach","title":"Approach","summary":"A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle."},"c":[{"t":"#md","v":"Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built."}]},{"t":"decision","a":{"id":"D-062-8","title":"One exported package, `auto-mail/mail`; the store stays internal","status":"accepted","by":"agent","summary":"Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint."},"c":[{"t":"#md","v":"**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence."}]},{"t":"thread","a":{"anchor":"D-062-8","status":"resolved","priority":"p2","title":"`rootcmd` is a second exported package"},"c":[{"t":"comment","a":{"by":"review"},"c":[{"t":"#html","v":"D-062-8 says the public surface is exactly one package, `auto-mail/mail`, and that everything else stays under `internal/`. The file-change tree also adds `auto-mail/rootcmd/rootcmd.go`, and `auto-cli/cmd/auto/main.go` must import that package to mount `auto mail`, matching every existing tool's pattern. Clarify that the invariant is \"one exported domain/client API plus the required `rootcmd` mounting facade\"; otherwise an implementer could either hide `rootcmd` under `internal/` and break mounting, or write a seam guard that incorrectly treats the facade as a violation."}]},{"t":"comment","a":{"by":"author"},"c":[{"t":"#html","v":"Fair, and the wording was genuinely misleading — an implementer following it literally would either have hidden <code>rootcmd<\/code> under <code>internal/<\/code> and broken mounting, or written a guard that flagged the façade. D-062-8 now states the invariant as \"one exported <strong>domain<\/strong> API (<code>auto-mail/mail<\/code>) plus the mandatory <code>rootcmd<\/code> mounting façade\", and records that the façade holds no domain logic and never touches the store — a wiring surface, not an API. The seam guard in Phase 5 is scoped accordingly."}]}]},{"t":"decision","a":{"id":"D-062-9","title":"The hook writes one hookSpecificOutput object, carrying every fragment","status":"accepted","by":"agent","summary":"The existing hint path already emits at most one object per event; a second producer must join it, not write a second line."},"c":[{"t":"#md","v":"**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge."}]},{"t":"section","a":{"id":"end-state-flow","title":"How one message travels","summary":"Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions."},"c":[{"t":"mermaid","a":{"caption":"The T1 path — no daemon anywhere in it"},"c":[{"t":"#html","v":"sequenceDiagram\n  participant A as agent A (auto mail send)\n  participant M as mail.Client (direct)\n  participant DB as alpha-store.db\n  participant FL as alpha-flags/\n  participant HK as agent B hook (auto hooks fire)\n  participant B as agent B (auto mail list/ack)\n\n  B->>M: Subscribe(\"auto-web/bugs\")\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.subscribed;<br/>insert subscription + binding(manager,target); COMMIT\n  A->>M: Send(to, body)\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.sent;<br/>insert mail; insert deliveries for bound subs; COMMIT\n  M->>FL: touch flag(sha8(manager,target))\n  M-->>A: {id, to, subscriptions:1, bound:1}\n  HK->>FL: stat one path (no DB open)\n  HK-->>B: hookSpecificOutput.additionalContext (fixed text)\n  B->>M: List()\n  M->>DB: materialise deliveries from cursor;<br/>append alpha.mail.read (first read only)\n  M-->>B: [ {id, from, sentAt, body} ]\n  B->>M: Ack(id)\n  M->>DB: BEGIN IMMEDIATE;<br/>UPDATE deliveries SET acked_at=? WHERE acked_at IS NULL;<br/>append alpha.mail.acked; COMMIT\n  M->>FL: rm flag if nothing unacked remains\n  M-->>B: {id, acked:true, wonTransition:true}"}]}]},{"t":"section","a":{"id":"end-state-schema","title":"The store at the end of this task"},"c":[{"t":"mermaid","a":{"caption":"events is the authority; mail is immutable; deliveries and bindings are projections"},"c":[{"t":"#html","v":"erDiagram\n  MAIL ||--o{ DELIVERY : \"copied to\"\n  SUBSCRIPTION ||--o{ DELIVERY : \"owns state of\"\n  ADDRESS ||--o{ SUBSCRIPTION : \"bound by\"\n  SUBSCRIPTION ||--o| BINDING : \"currently held by\"\n  EVENT {\n    int seq\n    ulid id\n    string type\n    int version\n    time occurred_at\n    json payload\n  }\n  MAIL {\n    ulid id\n    int seq\n    string to_address\n    json envelope\n    json body\n    time sent_at\n  }\n  SUBSCRIPTION {\n    string id\n    int seq\n    string address\n    string name\n    int from_cursor\n    time created_at\n  }\n  DELIVERY {\n    string subscription_id\n    ulid mail_id\n    time first_seen_at\n    time read_at\n    time acked_at\n    string acked_by\n  }\n  BINDING {\n    string subscription_id\n    string manager\n    string target\n    string session\n    time last_seen\n  }"}]},{"t":"#md","v":"Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against."}]},{"t":"section","a":{"id":"end-state-api","title":"The client seam"},"c":[{"t":"api","a":{"kind":"interface","name":"mail.Client","lang":"go","path":"auto-mail/mail/client.go","caption":"The only API. CLI, hook, daemon and every future auto-* tool go through it."},"c":[{"t":"member","a":{"kind":"method","sig":"Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)"},"c":[{"t":"#html","v":"Creates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled."}]},{"t":"member","a":{"kind":"method","sig":"Send(ctx context.Context, in SendInput) (SendResult, error)"},"c":[{"t":"#html","v":"Appends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6)."}]},{"t":"member","a":{"kind":"method","sig":"List(ctx context.Context, in ListInput) ([]Delivery, error)"},"c":[{"t":"#html","v":"Materialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3)."}]},{"t":"member","a":{"kind":"method","sig":"Ack(ctx context.Context, in AckInput) (AckResult, error)"},"c":[{"t":"#html","v":"Compare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13)."}]},{"t":"member","a":{"kind":"method","sig":"Reset(ctx context.Context) (ResetResult, error)"},"c":[{"t":"#html","v":"Removes the store and the flag directory. A supported operation, because alpha (G10)."}]},{"t":"member","a":{"kind":"method","sig":"Close() error"},"c":[{"t":"#html","v":"Releases the store handle."}]}]},{"t":"api","a":{"kind":"module","name":"package mail — free functions and types","lang":"go","path":"auto-mail/mail/pending.go","caption":"Deliberately not methods: the nudge must not require a client, because constructing one would open the store."},"c":[{"t":"member","a":{"kind":"function","sig":"NewDirect(home string) (Client, error)"},"c":[{"t":"#html","v":"The direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process."}]},{"t":"member","a":{"kind":"function","sig":"HasPending(home string, b Binding) bool"},"c":[{"t":"#html","v":"Stats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8)."}]},{"t":"member","a":{"kind":"function","sig":"NudgeText() string"},"c":[{"t":"#html","v":"The fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too)."}]},{"t":"member","a":{"kind":"function","sig":"BindingFor(cwd string) Binding"},"c":[{"t":"#html","v":"Derives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2)."}]},{"t":"member","a":{"kind":"function","sig":"ValidateAddress(s string) error"},"c":[{"t":"#html","v":"Permissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable."}]},{"t":"member","a":{"kind":"type","sig":"type Binding struct { Manager, Target, Session string }"},"c":[{"t":"#html","v":"The opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5)."}]}]}]},{"t":"section","a":{"id":"end-state-cli","title":"The command surface at the end of this task"},"c":[{"t":"cli","a":{"title":"zsh — the full auto mail surface after T1","caption":"C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4)."},"c":[{"t":"cmd","a":{"note":"creates ~/.auto/mail/ and the alpha store","status":"done"},"c":[{"t":"#html","v":"auto mail init"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"store\": \"/home/u/.auto/mail/alpha-store.db\", \"created\": true, \"alpha\": true }<\/script>"}]},{"t":"cmd","a":{"note":"the full command reference, including the alpha contract","status":"done"},"c":[{"t":"#html","v":"auto mail docs"}]},{"t":"cmd","a":{"note":"opt to start from now instead of the backlog (D-10)","status":"done"},"c":[{"t":"#html","v":"auto mail subscribe auto-web/bugs --from-now"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }<\/script>"}]},{"t":"cmd","a":{"note":"nobody has subscribed — still exits 0, still persists (G6)","status":"done"},"c":[{"t":"#html","v":"<script type=\"text/plain\">auto mail send --to auto-web/typo --message \"hello?\"<\/script>"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"id\": \"01K9X2R0000000000\", \"to\": \"auto-web/typo\", \"subscriptions\": 0, \"bound\": 0 }\n# stderr: no subscription exists for \"auto-web/typo\" — mail is persisted and a later\n# subscriber will receive it, but check the address for a typo.<\/script>"}]},{"t":"cmd","a":{"note":"scope to one subscription; no filters returns everything bound to you","status":"done"},"c":[{"t":"#html","v":"auto mail list --address auto-web/bugs"}]},{"t":"cmd","a":{"note":"a second acker is told it lost, and still exits 0 (D-062-7)","status":"done"},"c":[{"t":"#html","v":"auto mail ack 01K9X2QF7M3B0V8N"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": false }\n# stderr: already acked at 2026-08-25T10:15:40Z by sub_01K9X2M4<\/script>"}]},{"t":"cmd","a":{"note":"alpha means reset is supported, not a workaround (G10)","status":"done"},"c":[{"t":"#html","v":"auto mail reset --yes"}]},{"t":"out","a":{},"c":[{"t":"#html","v":"<script type=\"text/plain\">{ \"removed\": [\"/home/u/.auto/mail/alpha-store.db\", \"/home/u/.auto/mail/alpha-flags\"] }<\/script>"}]}]}]},{"t":"section","a":{"id":"file-changes","title":"File Changes"},"c":[{"t":"files","a":{},"c":[{"t":"file","a":{"path":"docs/concepts/UBIQUITOUS_LANGUAGE.md","change":"edit"},"c":[{"t":"#html","v":"G16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary."}]},{"t":"file","a":{"path":"auto-mail/go.mod","change":"add"},"c":[{"t":"#html","v":"module github.com/mistakenot/auto-mail; replace auto-shared =&gt; ../auto-shared; modernc.org/sqlite + cobra."}]},{"t":"file","a":{"path":"auto-mail/go.sum","change":"add"},"c":[{"t":"#html","v":"Checksums for the dependency set (all already present elsewhere in the workspace)."}]},{"t":"file","a":{"path":"auto-mail/CLAUDE.md","change":"add"},"c":[{"t":"#html","v":"Tool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped)."}]},{"t":"file","a":{"path":"auto-mail/cmd/automail/main.go","change":"add"},"c":[{"t":"#html","v":"Minimal entry point delegating to cli.Execute."}]},{"t":"file","a":{"path":"auto-mail/rootcmd/rootcmd.go","change":"add"},"c":[{"t":"#html","v":"New(stdout, stderr) façade so auto-cli can mount `auto mail`."}]},{"t":"file","a":{"path":"auto-mail/internal/app/app.go","change":"add"},"c":[{"t":"#html","v":"App context (stdout, stderr, cwd), per the blueprint."}]},{"t":"file","a":{"path":"auto-mail/internal/cli/root.go","change":"add"},"c":[{"t":"#html","v":"Root cobra command, ExitError, Execute; wires the subcommands."}]},{"t":"file","a":{"path":"auto-mail/internal/cli/init.go","change":"add"},"c":[{"t":"#html","v":"`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store."}]},{"t":"file","a":{"path":"auto-mail/internal/cli/docs.go","change":"add"},"c":[{"t":"#html","v":"`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer."}]},{"t":"file","a":{"path":"auto-mail/internal/cli/subscribe.go","change":"add"},"c":[{"t":"#html","v":"`auto mail subscribe &lt;address&gt; [--from-now] [--name]`; records the caller's binding."}]},{"t":"file","a":{"path":"auto-mail/internal/cli/send.go","change":"add"},"c":[{"t":"#html","v":"`auto mail send --to --message [--body] [--from]`; resolves the sender's absolu
