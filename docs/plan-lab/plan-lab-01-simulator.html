o reflect rebuild`); legacy\n   0-byte `feedback.jsonl` flagged. Preserve null-vs-zero coverage.\n2. Register `doctor` in `root.go` (after P5's gap registration — serialized to\n   avoid a root.go conflict).\n3. **Verify (F1):** `doctor_integration_test.go` — healthy state all `pass`\n   exit 0; missing `events/` ⇒ `fail` + hint + exit 1; stale snapshot ⇒ `warn`.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Doctor'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect doctor — state health checks (F1)`."}, {"n": "7", "title": "Docs, init gitignore, cleanup, e2e", "status": "done", "depends-on": "2,3,4,6", "files": ["auto-reflect/internal/cli/init.go", "auto-reflect/internal/cli/init_test.go", "auto-reflect/internal/cli/quickstart.go", "auto-reflect/internal/loop/feedback.go", "auto-reflect/internal/miner/score.go", "auto-reflect/cmd/autoreflect/e2e_loop_test.go", "auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go", "auto-reflect/CLAUDE.md", ".claude/skills/reflect-playbook/SKILL.md", ".claude/skills/reflect-playbook/references/retrieve.md", ".claude/skills/reflect-playbook/references/observe.md", ".claude/skills/reflect-playbook/references/mine.md", ".claude/skills/reflect-playbook/references/consolidate.md", "docs/reflection/observations.yaml"], "body": "1. `init.go`: after `MkdirAll(eventsDir)`, write `.auto/reflect/.gitignore`\n   (`playbook.json\\n`) only if absent (auto-doc stat-then-skip pattern).\n   **Verify (F9):** `init_test.go` — file created with `playbook.json`; second\n   init doesn't overwrite/duplicate; `events/` not ignored.\n2. Repo hygiene: `git rm --cached .auto/reflect/playbook.json`; commit the new\n   `.auto/reflect/.gitignore` and the existing `events/` log (D-2).\n3. Docstrings: `loop/feedback.go` (outcome enum), `miner/score.go`\n   (correction_density). (F8/F3)\n4. Delete `docs/reflection/observations.yaml`. The only live referencers are the\n   already-superseded `playbook-observe`/`-refine`/`-s ">[\n  { \"id\": \"ev-3a9c1d77\", \"session_id\": \"518b6d9a…\", \"ts\": \"2026-06-28T13:52:…\",\n    \"report\": \"no rule covered worktree teardown on complete-task\",\n    \"moment\": \"deleting the branch after merge\" }\n]<\/script>"}, {"note": "F7: same id on dry-run and apply (separate runs)", "status": "todo", "cmd": "auto reflect consolidate --dry-run delta.json | jq -r '.ids[0]'", "out": "r-1a2b3c4d"}, {"status": "todo", "cmd": "auto reflect consolidate delta.json | jq -r '.ids[0]'", "out": "r-1a2b3c4d   # identical → pre-stage `rule promote r-1a2b3c4d` from the preview"}, {"note": "F1: structured health, exit 1 on fail", "status": "todo", "cmd": "auto reflect doctor", "out": "<script type=\"text/plain\">[\n  { \"check\": \"events_dir\", \"status\": \"pass\", \"message\": \"12 shards, all decodable\" },\n  { \"check\": \"playbook_freshness\", \"status\": \"warn\",\n    \"message\": \"snapshot stale vs log\", \"hint\": \"run auto reflect rebuild\" }\n]<\/script>"}]}], "apis": [{"kind": "module", "name": "idhash", "lang": "go", "path": "auto-reflect/internal/idhash/idhash.go", "caption": "One deterministic id minter, reused by rules + observations", "tab": "Solution", "members": [{"kind": "function", "sig": "Derive(prefix string, parts ...string) string", "doc": "Returns prefix + first 8 hex of sha256 over the newline-joined parts. Deterministic; keeps the `^<prefix>-[0-9a-f]{8}$` shape."}]}, {"kind": "module", "name": "cli/output", "lang": "go", "path": "auto-reflect/internal/cli/output.go", "caption": "Uniform mutation-result envelope", "tab": "Solution", "members": [{"kind": "function", "sig": "mutationResult(id string, fields map[string]any) map[string]any", "doc": "Injects a top-level `id` into a command's result map."}, {"kind": "function", "sig": "mutationResultIDs(ids []string, fields map[string]any) map[string]any", "doc": "Injects top-level `id` (first) + `ids` for multi-id mutations like `consolidate`."}]}], "mermaids": [{"caption": "Testing layers", "tab": "Verification", "src": "flowchart TD\n  U[Unit: id determinism, Fold timestamps, pending count, gap projection] --> I[Integration: CLI envelope contracts, gap list, doctor]\n  I --> E[E2E: full reflect loop on disk fixture + gap read-back]\n  E --> M[Manual: replay spike loop, confirm F1-F11 closed]"}, {"caption": "Phase dependency DAG", "tab": "Plan", "src": "flowchart LR\n  P1[P1 Foundations + skeleton] --> P2[P2 Rule content ids]\n  P1 --> P3[P3 Envelope rollout + timestamps]\n  P1 --> P4[P4 Pending count]\n  P1 --> P5[P5 gap list]\n  P5 --> P6[P6 doctor]\n  P2 --> P7[P7 Docs, init, cleanup, e2e]\n  P3 --> P7\n  P4 --> P7\n  P6 --> P7"}]}, "rails": {"G1": {"title": "Messages and events are immutable", "kind": "functional", "metric": null, "body": "A message row is never updated after insert, and a delivery event is never rewritten. State changes are appended and re-projected. This is what keeps the log mergeable across hosts later."}, "G2": {"title": "Consumer state lives in a deliveries join, never on the message", "kind": "functional", "metric": null, "body": "Read and ack state is keyed by (subscription, message), even though the MVP has exactly one subscription per address. That redundancy is the feature: fan-out becomes extra rows, competing consumers become a column. Putting <code>read_at<\/code> on the message silently encodes \"one consumer, forever\"."}, "G3": {"title": "Ack is a separate explicit call, from the first consumer", "kind": "functional", "metric": null, "body": "Reading does not retire a message. Ack may do nothing but stamp a timestamp — no timer, no redelivery — but every consumer must call it. Retrofitting that call into N prompts and skills is the migration that cannot be done."}, "G14": {"title": "Injected keystrokes are a fixed constant, into a verified agent", "kind": "security", "metric": null, "body": "Two rules, both absolute. <strong>Content:<\/strong> the injected sequence is a fixed constant — an instruction to go and read mail — never interpolated from an envelope or body, or a sender would be typing into a stranger's pane. <strong>Target:<\/strong> the effector must confirm the pane still runs the bound agent before injecting. Hook silence is also what an <em>exited<\/em> agent looks like, and a pane that has fallen back to a shell would execute whatever is typed into it."}, "G13": {"title": "Ack transitions exactly once and reports whether it won", "kind": "functional", "metric": null, "body": "Ack is a conditional update inside the same transaction that appends its event, so concurrent acks on one delivery resolve to exactly one winner. The call returns which it was — a loser is told, never silently treated as success. This is call-site-visible behaviour, so it is fixed now rather than added when leases arrive."}, "G4": {"title": "At-least-once and unordered, as documented", "kind": "functional", "metric": null, "body": "The MVP delivers exactly once, in order, by accident. The contract promises neither. Consumers are idempotent on message id from day one. Promising the stronger guarantee now means ten consumers quietly depend on it."}, "G5": {"title": "Addresses are virtual — no physical identity in them", "kind": "functional", "metric": null, "body": "Physical identity (session, host, herdr/ntm pane) appears only as binding metadata, never in an address, never in a stored envelope's <code>to<\/code> field. Relative handles like <code>#parent<\/code> resolve at send time; the stored envelope always carries the resolved absolute address. Addresses themselves are free-form strings with no enforced structure — validation must stay permissive enough to allow a separator, so hierarchical names remain expressible and prefix filtering stays buildable."}, "G6": {"title": "Sending to an address with no subscription persists, and a later subscriber sees it", "kind": "reliability", "metric": null, "body": "The cross-project journey depends on both halves: mail sent to a project nobody is working in must persist, <em>and<\/em> the agent who subscribes tomorrow must receive it. A send reports two distinct counts — how many <strong>subscriptions<\/strong> exist (durable readers) and how many are currently <strong>bound<\/strong> (live agents) — because zero-subscriptions and zero-bound mean different things to a sender, and only the first is a likely address typo."}, "G7": {"title": "Hook environment capture stays an allowlist", "kind": "security", "metric": "allowlist only, zero secrets persisted", "body": "Capture widens to reach herdr panes. It must stay a prefix allowlist and never become \"everything except known secrets\" — agent environments carry live credentials (this host's sessions expose a messaging token in plain env). Captured values land in a host-global store on every hook fire."}, "G8": {"title": "The nudge is free when there is no mail", "kind": "operability", "metric": "no-mail path is a stat-level check", "body": "Notification runs in the agent's critical path on tool calls. The common case — no pending mail — must cost about what a <code>stat<\/code> costs, and must never be able to stall or break the hook. Same discipline as the existing tmux capture timeout."}, "G9": {"title": "Delivery never corrupts a working agent", "kind": "functional", "metric": null, "body": "Intrusiveness escalates, never leads. Every message first waits for an in-band hook nudge; keystrokes are the last resort, firing only when the agent is idle by hook silence <em>and<\/em> the message has aged past a threshold. Injection into a running agent can land mid-tool-call or into a permission prompt, so the dangerous mechanism is never spent on the ordinary case."}, "G10": {"title": "Alpha: the store may be wiped, nothing may depend on it", "kind": "compat", "metric": null, "body": "Event types and the store file carry an <code>alpha<\/code> marker. No upcasters, no migrations, no compatibility guarantee; reset is a supported operation. The marker lives in the type string and the filename, not only in docs — a doc note does not stop a skill matching on a bare type name."}, "G12": {"title": "No session manager is hard-coded into stored data", "kind": "compat", "metric": null, "body": "A binding records its physical target as an opaque <code>(manager, target)<\/code> pair — never a typed <code>tmux_pane_id<\/code> / <code>herdr_pane_id<\/code> column. Delivery goes through an effector interface with one implementation per manager. Adding or retiring a manager is then data plus an implementation, never a schema change; and because bindings are a heartbeat-backed projection, retiring one is a delete rather than a migration."}, "G15": {"title": "A capability is done when it passes end to end in the harness", "kind": "operability", "metric": null, "body": "The guiding oracle is a harness scenario running the real <code>auto<\/code> binary in containers over real transports, with a realistic but <em>minimal<\/em> setup. Unit and package tests are supporting evidence, not the verdict — a task whose capability cannot be demonstrated end to end is not finished. Two disciplines carry over from the harness: assert the observable outcome with bounded retry rather than polling to settle, and treat a missing product seam as a finding to raise, never as something to patch around inside the scenario."}, "G16": {"title": "The ontology lands before the code that uses it", "kind": "functional", "metric": null, "body": "Canonical terms go into the ubiquitous-language glossary <em>first<\/em>, and then the same word is used everywhere — schema, event types, CLI, RPC methods, prose and commits. Naming is the one decision that propagates into every surface at once, including the ungreppable ones, so it cannot be tidied up afterwards. This epic already demonstrated the failure: the data model was drafted with an entity named MESSAGE immediately after a decision not to use that noun."}, "G11": {"title": "Nothing outside the mail package reads the store", "kind": "operability", "metric": null, "body": "One client interface is the only API. The moment a skill or hook runs <code>sqlite3<\/code> against the store, the schema is frozen and the transport swap is dead. Worth a doctor check, not just a convention."}}}</script>

const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

let CUR = '062';            // current plan
let REFSET = new Set();     // refs resolvable in the drawer for the current plan

function md(s) {
  if (!s) return '';
  try { if (window.marked) return window.marked.parse(s, { mangle: false, headerIds: false }); } catch (e) { }
  return '<p>' + esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '</p><p>') + '</p>';
}
// inline formatter for narration strings: `code`, **bold**, refs
function fmt(s) {
  const parts = String(s).split(/(`[^`]*`)/g);
  return parts.map(p => {
    if (p.startsWith('`') && p.endsWith('`') && p.length > 1) return '<code>' + esc(p.slice(1, -1)) + '</code>';
    let t = esc(p).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
    return linkRefs(t);
  }).join('');
}
function linkRefs(t) {
  return t.replace(/\b(AC-\d+|D-062-\d|D-\d+|G\d{1,2}|F\d{1,2}(?:\/F\d)?|P\d)\b/g, m => {
    if (REFSET.has(m) || /^G\d/.test(m) && CUR === '062' || /^F\d/.test(m) && CUR === '052') return `<span class="ref" data-ref="${m}">${m}</span>`;
    return m;
  });
}
document.addEventListener('click', e => {
  const r = e.target.closest('.ref'); if (!r) return;
  e.preventDefault(); e.stopPropagation(); openRef(r.dataset.ref);
});

// JSON pretty + colour
function jhtml(v) {
  const s = JSON.stringify(v, null, 2);
  return esc(s).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false)\b|\bnull\b|-?\b\d+(?:\.\d+)?\b/g, (m, str, colon, bool) => {
    if (str) return colon ? `<span class="jk">${str}</span>${colon}` : `<span class="js">${str}</span>`;
    if (bool) return `<span class="jb">${m}</span>`;
    if (m === 'null') return `<span class="jz">null</span>`;
    return `<span class="jn">${m}</span>`;
  });
}

function sha256Sync(str) {

  const n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l * 8 / 4294967296));
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19], w = new Int32Array(64);

async function stepPreset() {

  <div class="plate disc"><div class="plate-h"><b>What running the spec surfaced</b> · places the text disagrees with itself<span class="sp"></span>the machine had to pick one</div><div class="body">${DISC052.map(d => `<details><summary><span class="v">${esc(d.v)}</span>${fmt(d.t)}</summary><div class="dd">${d.d.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')}</div></details>`).join('')}</div></div>
  <div class="legend"><span><span class="sw" style="background:var(--paper-3)"></span>before — auto reflect ${TOOLV}</span><span><span class="sw" style="background:var(--ev)"></span>after 052</span><span><span class="illus">dotted</span> = illustrative value the plan does not fix</span></div>`;
  $$('#stTabs button').forEach(b => b.onclick = () => goStation(b.dataset.f));
  $$('#ghostBody .ghost').forEach(b => b.onclick = () => { const i = +b.dataset.i; const d = $('#ghostDetail'); if (R.oos === i) { R.oos = -1; d.classList.remove('on'); return; } R.oos = i; d.innerHTML = fmt(OOS052[i].d); d.classList.add('on'); });
  renderDag(); renderDial052(); renderStation();
}
window.R52 = { goStation };
/* ===================== switching ===================== */
function setPlan(id, push) {
  CUR = id === '052' ? '052' : '062';
  buildRefSet();
  document.body.dataset.plan = CUR;
  $('#sw062').classList.toggle('on', CUR === '062'); $('#sw052').classList.toggle('on', CUR === '052');
  document.title = CUR === '062' ? 'Executable Spec · 062 auto mail' : 'Executable Spec · 052 reflect';
  if (push !== false && location.hash !== '#' + CUR) history.replaceState(null, '', '#' + CUR);
  closeDrawer();
  if (CUR === '062') { mount062(); } else { mount052(); }
  if ($('#drawer').classList.contains('on')) renderDrawer();
  window.scrollTo(0, 0);
}
$('#sw062').onclick = () => setPlan('062'); $('#sw052').onclick = () => setPlan('052');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if ((h === '052' || h === '062') && h !== CUR) setPlan(h, false); });
setPlan(location.hash.slice(1) === '052' ? '052' : '062', false);

</script>
