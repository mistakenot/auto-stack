<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executable Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --paper:#ece7da; --paper-2:#e3ddcc; --paper-3:#d8d1bd; --card:#f6f2e8;
  --ink:#1b1a17; --ink-2:#47433b; --ink-3:#7f7a6c; --rule:#c9c1ab; --rule-2:#b3aa91;
  --term:#16171a; --term-2:#1f2126; --term-3:#2a2d33; --tt:#e9e3d3; --td:#8d8878;
  --ev:#d4441c; --ev-soft:#f3cdbd; --proj:#2c4ccc; --proj-soft:#cfd7f5;
  --flag:#d79600; --flag-soft:#f5e2b0; --ok:#2e7a4c; --ok-soft:#cfe6d6; --bad:#c02a2a; --bad-soft:#f2cccc;
  --ghost:#aaa393; --lamp:#ffb42e;
  --serif:"Instrument Serif", Georgia, serif;
  --sans:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;
  background-image:radial-gradient(circle at 1px 1px, rgba(27,26,23,.09) 1px, transparent 0);background-size:18px 18px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.92em}
a{color:var(--proj)}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:10px 20px;background:rgba(236,231,218,.94);backdrop-filter:blur(6px);border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;letter-spacing:-.01em;line-height:1}
.brand h1 i{color:var(--ev)}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em}
.switch{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.switch button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.switch button .tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.switch button.on{background:var(--ink);color:var(--paper)}
.switch button.on .tag{color:var(--flag)}
.dial{display:flex;align-items:center;gap:8px;margin-left:auto}
.dial .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.chain{display:flex;align-items:center}
.chain button{width:34px;height:26px;border:1.5px solid var(--ink);background:var(--card);font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:4px;position:relative}
.chain button+button{margin-left:12px}
.chain button+button::before{content:"";position:absolute;left:-13.5px;top:50%;width:12px;border-top:1.5px solid var(--ink)}
.chain button.lit{background:var(--ink);color:var(--flag)}
.dagchain button+button::before{display:none}
.chain button.off{border-style:dashed;color:var(--ink-3);border-color:var(--ink-3)}
.drawer-btn{border:1.5px solid var(--ink);background:var(--flag);padding:6px 12px;border-radius:6px;font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.drawer-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
/* ---------- layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:16px 20px 60px;max-width:1720px;margin:0 auto}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.side{min-width:0}
.plate{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;position:relative}
.plate-h{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-2)}
.plate-h b{color:var(--ink);font-weight:600;text-transform:none;letter-spacing:.02em;font-size:12px}
.plate-h .sp{flex:1}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:end;padding:6px 2px 0}
.hero h2{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.02;margin:0;letter-spacing:-.015em}
.hero h2 em{color:var(--ev)}
.hero p{margin:6px 0 0;color:var(--ink-2);font-size:14.5px;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.stat{font-family:var(--mono);font-size:11px;border:1px solid var(--ink-2);border-radius:3px;padding:3px 7px;background:var(--paper);white-space:nowrap}
.stat b{font-weight:600}
/* ---------- scenario bar ---------- */
.scen{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.3px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip:hover{background:var(--paper-2)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip .rails{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:500}
.chip.on .rails{color:var(--flag)}
.chip.all{background:var(--flag);}
.transport{display:flex;gap:8px;align-items:stretch}
.transport .btns{display:flex;gap:4px}
.tbtn{border:1.3px solid var(--ink);background:var(--card);border-radius:5px;padding:4px 10px;font-weight:700;font-size:13px;min-width:36px}
.tbtn:hover{background:var(--paper-2)}
.tbtn.primary{background:var(--ink);color:var(--paper)}
.tbtn[disabled]{opacity:.35;cursor:default}
.narr{flex:1;border-left:3px solid var(--ev);padding:2px 0 2px 12px;min-height:44px}
.narr .step{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.narr .txt{font-size:14.5px;line-height:1.42}
.narr .txt code{background:var(--paper-2);padding:0 3px;border-radius:2px}
.ref{font-family:var(--mono);font-size:.86em;font-weight:600;color:var(--proj);border-bottom:1px dotted var(--proj);cursor:pointer;white-space:nowrap}
.ref:hover{background:var(--proj-soft)}
/* ---------- terminals ---------- */
.agents{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.term{background:var(--term);color:var(--tt);border-radius:8px;border:1.5px solid var(--ink);display:flex;flex-direction:column;min-width:0;box-shadow:3px 3px 0 var(--ink)}
.term-h{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--term-3);font-family:var(--mono);font-size:11px}
.term-h .who{font-weight:600;color:#fff}
.term-h .cwd{color:var(--td)}
.term-h .sp{flex:1}
.envsel{background:var(--term-2);border:1px solid var(--term-3);color:var(--tt);font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:2px 4px}
.term-body{height:268px;overflow:auto;padding:8px 10px;font-family:var(--mono);font-size:11.8px;line-height:1.5;scroll-behavior:smooth}
.term-body .ln{white-space:pre-wrap;word-break:break-word}
.term-body .cmd{color:#fff}
.term-body .cmd .pr{color:var(--flag)}
.term-body .out{color:var(--tt)}
.term-body .err{color:#ff9d7a}
.term-body .dim{color:var(--td)}
.term-body .gate{color:#a9a390;font-style:italic;border-left:2px dashed #5c5a52;padding-left:8px;margin:2px 0}
.term-body .exit{display:inline-block;font-size:10px;border-radius:2px;padding:0 4px;margin-left:4px}
.exit.z{background:#24402f;color:#9fe0b4}.exit.nz{background:#5a2424;color:#ffb3b3}
.jk{color:#9fc1ff}.js{color:#f2d58a}.jn{color:#9fe0b4}.jb{color:#ff9d7a}.jz{color:#b8b3a3}
.term-in{display:flex;align-items:center;gap:6px;border-top:1px solid var(--term-3);padding:6px 10px}
.term-in .pr{font-family:var(--mono);font-size:12px;color:var(--flag);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-family:var(--mono);font-size:12px}
.qk{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}
.qk button{background:var(--term-2);border:1px solid var(--term-3);color:var(--tt);font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:3px 7px}
.qk button:hover{border-color:var(--flag);color:#fff}
.qk button.hook{border-color:#6b5520;color:var(--flag)}
.term.flash{animation:tflash .7s}
@keyframes tflash{0%{box-shadow:0 0 0 3px var(--flag),3px 3px 0 var(--ink)}100%{box-shadow:3px 3px 0 var(--ink)}}
/* ---------- seam ---------- */
.seam{padding:8px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.lane{display:grid;grid-template-columns:170px 34px minmax(0,1fr) 34px 200px;align-items:center;gap:0;font-size:12.5px}
.lane .from,.lane .to{font-family:var(--mono);font-size:11.5px}
.lane small{color:var(--ink-3);font-family:var(--sans);font-size:11px}
.lane .arrow{height:2px;background:var(--ink);position:relative;margin:0 4px}
.lane .arrow::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:7px solid var(--ink);border-right:0}
.lane .arrow.amber{background:var(--flag)}.lane .arrow.amber::after{border-left-color:var(--flag)}
.lane .arrow.dashed{background:none;border-top:2px dashed var(--ghost);height:0}.lane .arrow.dashed::after{display:none}
.door{border:1.5px solid var(--ink);border-radius:6px;background:var(--card);padding:5px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.door b{font-family:var(--mono);font-size:12px}
.door.amber{border-color:#a87400;background:#fbf1d6}
.door.dashed{border:1.5px dashed var(--ghost);background:transparent;color:var(--ink-3)}
.ghostlane{opacity:.6}.ghostlane .to{display:none}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.mp{font-family:var(--mono);font-size:10.5px;border:1px solid var(--ink-2);border-radius:3px;padding:1px 5px;background:#fff;display:inline-flex;gap:5px;align-items:center;transition:all .3s}
.mp i{font-style:normal;color:var(--ink-3)}
.mp.idle{opacity:.5}
.mp.hot{background:var(--ink);color:var(--flag);border-color:var(--ink);transform:translateY(-1px)}
.mp.hot i{color:#fff}
/* ---------- instruments row ---------- */
.inst{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
.hookp .body,.fsp .body{padding:10px 12px}
.meter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.gauge{border:1px solid var(--rule-2);border-radius:5px;padding:5px 9px;background:var(--paper);min-width:112px}
.gauge .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.gauge .v{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.1}
.gauge.zero .v{color:var(--ok)}
.gauge.hot .v{color:var(--ev)}
.statline{font-family:var(--mono);font-size:11.5px;padding:6px 8px;border-radius:4px;background:var(--paper-2);margin-bottom:8px;word-break:break-all}
.statline .res{font-weight:600}
.statline .res.no{color:var(--ink-3)}.statline .res.yes{color:var(--flag)}
.emit{background:var(--term);color:var(--tt);font-family:var(--mono);font-size:11.3px;border-radius:5px;padding:8px 10px;min-height:62px;white-space:pre-wrap;word-break:break-word}
.emit.empty{color:var(--td);font-style:italic}
.hookctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px}
.hookctl select,.hookctl label{font-family:var(--mono);font-size:11px}
.hookctl select{background:var(--paper);border:1px solid var(--rule-2);border-radius:3px;padding:2px 4px}
.fbtn{border:1.3px solid var(--ink);background:var(--paper);border-radius:4px;padding:3px 9px;font-size:12px;font-weight:600}
.fbtn:hover{background:var(--flag-soft)}
.fbtn.hookfire{background:var(--flag);}
.tree{font-family:var(--mono);font-size:11.8px;line-height:1.75}
.tree .n{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tree .ind{display:inline-block;width:16px;color:var(--rule-2)}
.tree .absent{color:var(--ghost);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.tree .pill{font-size:9.5px;border-radius:2px;padding:0 4px;text-transform:uppercase;letter-spacing:.06em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--paper-3);color:var(--ink-3)}
.pill.fl{background:var(--flag-soft);color:#8a5d00}
.pill.ev{background:var(--ev-soft);color:var(--ev)}
.tree .flagf{color:#8a5d00}
.tree .flagf.pop{animation:pop .8s}
@keyframes pop{0%{background:var(--flag)}100%{background:transparent}}
.note{font-size:12px;color:var(--ink-2);margin-top:6px}
/* ---------- store ---------- */
.store .body{padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tbl{min-width:0}
.tbl.wide{grid-column:1/-1}
.tbl h4{margin:0 0 4px;display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12px;font-weight:600}
.tbl h4 .role{font-weight:400;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.tbl h4 .role.auth{color:var(--ev)}
.tbl h4 .role.proj{color:var(--proj)}
.tscroll{overflow:auto;max-height:190px;border:1px solid var(--rule);border-radius:4px;background:#fbf8f1}
table.t{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:10.8px}
table.t th{position:sticky;top:0;background:var(--paper-2);text-align:left;font-weight:600;padding:3px 6px;border-bottom:1px solid var(--rule-2);white-space:nowrap;color:var(--ink-2)}
table.t td{padding:3px 6px;border-bottom:1px solid #ebe5d6;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
table.t td.null{color:var(--ghost);font-style:italic}
table.t tr.new-ev td{animation:nev 1.6s}
table.t tr.new-pj td{animation:npj 1.6s}
table.t tr.chg td.chg{animation:npj 1.6s;font-weight:600}
@keyframes nev{0%{background:var(--ev-soft)}100%{background:transparent}}
@keyframes npj{0%{background:var(--proj-soft)}100%{background:transparent}}
table.t tr.shake{animation:shake .5s}
table.t tr.shake td{background:var(--bad-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.tamper{display:none;gap:3px}
table.t tr:hover .tamper{display:inline-flex}
.tamper button{font-family:var(--mono);font-size:9px;border:1px solid var(--bad);color:var(--bad);background:#fff;border-radius:2px;padding:0 4px}
.empty-t{padding:10px;color:var(--ghost);font-family:var(--mono);font-size:11px;font-style:italic}
.store-absent{grid-column:1/-1;padding:26px;text-align:center;border:1.5px dashed var(--rule-2);border-radius:6px;color:var(--ink-3);font-family:var(--mono);font-size:12px}
.abort{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;background:var(--bad-soft);border:1px solid var(--bad);color:#7a1414;border-radius:4px;padding:6px 9px}
/* ---------- race ---------- */
.race{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:8px}
.gr{height:34px;border:1.3px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;background:var(--paper);transition:all .2s}
.gr .g{font-size:8.5px;color:var(--ink-3)}
.gr.won{background:var(--ok);color:#fff;border-color:var(--ok);transform:translateY(-3px)}
.gr.won .g{color:#dff}
.gr.lost{background:var(--paper-3);color:var(--ink-3);border-style:dashed}
.gr.run{background:var(--flag-soft)}
/* ---------- ghost machinery ---------- */
.ghosts .body{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px}
.ghost{border:1.5px dashed var(--ghost);border-radius:6px;padding:6px 10px;color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.025) 6px 12px);font-size:12.5px;text-align:left;max-width:280px}
.ghost b{display:block;color:var(--ink-2);font-weight:600}
.ghost .when{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.ghost:hover{border-color:var(--ink-2);color:var(--ink-2)}
.ghost-detail{flex-basis:100%;font-size:13px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--ghost);padding:6px 10px;display:none}
.ghost-detail.on{display:block}
/* ---------- rails panel ---------- */
.railp{position:sticky;top:66px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.railp .prog{padding:10px 12px;border-bottom:1px solid var(--rule)}
.railp .prog .big{font-family:var(--serif);font-size:34px;line-height:1}
.railp .prog .big small{font-size:16px;color:var(--ink-3)}
.bar{height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--flag),var(--ev));transition:width .5s}
.rlist{overflow:auto;padding:6px}
.rail{border:1px solid transparent;border-radius:6px;padding:6px 7px;display:grid;grid-template-columns:22px 1fr;gap:4px 8px;cursor:pointer}
.rail:hover{background:var(--paper);border-color:var(--rule)}
.lamp{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-2);margin-top:2px;background:var(--paper-2);transition:all .35s}
.rail.lit .lamp{background:radial-gradient(circle at 40% 35%,#fff6d8,var(--lamp) 55%,#d27a00);border-color:#9a5a00;box-shadow:0 0 10px 2px rgba(255,180,46,.65)}
.rail.just .lamp{animation:lampOn 1.2s}
@keyframes lampOn{0%{box-shadow:0 0 0 0 rgba(255,180,46,1)}40%{box-shadow:0 0 22px 10px rgba(255,180,46,.8)}100%{box-shadow:0 0 10px 2px rgba(255,180,46,.65)}}
.rail .rt{font-size:12.5px;line-height:1.3}
.rail .rt b{font-family:var(--mono);font-size:11.5px;margin-right:4px}
.rail .rt .to{font-family:var(--mono);font-size:10.5px;color:var(--proj);white-space:nowrap}
.rail.ghosted{opacity:.45}
.rail.ghosted .lamp{border-style:dashed}
.rail .more{grid-column:2;display:none;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:6px;margin-top:2px}
.rail.open .more{display:block}
.rail .more .q{font-family:var(--serif);font-size:15.5px;line-height:1.3;color:var(--ink);margin:2px 0 6px}
.rail .more .ex{font-size:12px;background:var(--flag-soft);border-radius:3px;padding:4px 6px;margin:6px 0}
.rail .more .acb{font-size:12px;max-height:210px;overflow:auto;background:var(--paper);border-radius:4px;padding:4px 8px;margin-top:6px}
.rail .more .acb ul{padding-left:16px;margin:4px 0}
.rail .more .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sub-h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);padding:8px 8px 2px}
/* ---------- discrepancies ---------- */
.disc .body{padding:8px 12px 10px}
.disc details{border-top:1px dashed var(--rule);padding:6px 0}
.disc details:first-child{border-top:0}
.disc summary{cursor:pointer;font-weight:600;font-size:13px}
.disc summary .v{font-family:var(--mono);font-size:10px;color:var(--ev);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.disc .dd{font-size:12.8px;color:var(--ink-2);padding:4px 0 0 2px}
.disc .dd blockquote{margin:4px 0;padding:2px 10px;border-left:2px solid var(--rule-2);font-family:var(--serif);font-size:15px;color:var(--ink)}
/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}

<script type="application/json" id="plan-data">{"062": {"doc": {"title": "062: auto-mail-walking-skeleton", "status": "complete", "pr": "https://github.com/mistakenot/auto-stack/pull/146", "generated": "2026-08-25", "next-prompt": "/commit-task 062"}, "sections": [{"id": "problem", "title": "Problem", "tab": "Requirements", "body": "The stack carries events *outward* — `auto-shared/bus` broadcasts what happened\nto whoever is listening — but nothing carries a message **to a named recipient**\nand guarantees it survives until someone acts on it. A supervisor learns its\nchild crashed by noticing silence. An agent in `auto-stack` that finds a bug in\n`auto-web` has nowhere to put that fact. Two agents in a swarm rediscover the\nsame thing independently.\n\n[Epic 005](../../epics/epic-005-auto-mail-mvp.html) fills that gap with\n`auto mail`: a durable, addressed, at-least-once channel between agents on one\nhost. This task is the epic's **T1 — the walking skeleton**.\n\nThe risk T1 exists to retire is not the store. It is **hook → notification**:\nwhether a working agent can be told it has mail, in-band, cheaply, without\nbreaking its turn. Deferring that would defer all the risk, so it is inside the\nskeleton. The second thing it retires is the *oracle*: the harness scenario is\nstood up now so T2–T4 are developed against a working end-to-end test rather\nthan one that arrives at the end and can only confirm what was already built."}, {"id": "scope-statement", "title": "What this task is", "summary": "Ontology first, then a harness scenario with two agents on one host, then one message travelling between them and being acked — proven by the scenario.", "tab": "Requirements", "body": "Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab)."}, {"id": "target-transcript", "title": "The transcript this task must make real (C1)", "tab": "Requirements", "body": ""}, {"id": "goals", "title": "Goals", "tab": "Requirements", "body": "1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4) unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to."}, {"id": "out-of-scope", "title": "Out of Scope", "tab": "Requirements", "body": "Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem)."}, {"id": "references", "title": "Reference code & docs", "summary": "Verified paths this task builds on or extends.", "tab": "Requirements", "body": "**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck."}, {"id": "decisions", "title": "Decisions taken while writing these requirements", "tab": "Requirements", "body": "These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected."}, {"id": "open-questions", "title": "Open Questions & Assumptions", "summary": "No open pd-questions — every fork was resolvable from the epic or an existing repo pattern. These are the assumptions carried forward.", "tab": "Requirements", "body": "Assumptions this task proceeds on. Each is safe to revisit without redoing work:\n\n- [ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\n  backlog records maildir as \"genuinely better for lock-free concurrent append\"\n  but superseded by SQLite once subscriptions, read state and bindings exist.\n  `modernc.org/sqlite` is already a direct dependency of two modules, so this\n  adds no runtime dependency.\n- [ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\n  write connection per process, with every write in one immediate transaction.**\n  D-11 names this as an explicit T1 concern; this is the conventional answer and\n  is asserted under `-race` rather than assumed.\n- [ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\n  cross-host merge argument in the backlog (§3). Subscription ids follow the\n  `sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\n  the store relies on**: cursors and every \"after this point\" comparison use the\n  log's own append sequence, because ULID monotonicity is process-local and\n  every `auto mail` verb is a separate process (D-11).\n- [ ] **The body is a JSON object**, and `--message <text>` is sugar for\n  `{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n  `kind` vocabulary and the open `attributes` map are additive fields on the\n  envelope.\n- [ ] **`auto mail list` with no filters returns every unacked delivery for every\n  subscription the caller is bound to**, per the project convention that\n  list commands return all items when no filters are given. `--address` scopes it\n  to one subscription.\n- [ ] **The sender's `from` address is resolved by a three-rung ladder**, because\n  a plain `auto mail send` process sees neither the hook payload's `agent` nor a\n  `session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n  `--from <address>`; (2) the address of a subscription bound to the caller's\n  `(manager, target)` — lowest subscription id when there is more than one, so it\n  is deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\n  project registry, or `unregistered/agent` when the cwd is not a registered\n  project. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\n  own reply address first, which is also how it becomes reachable for a reply. The\n  result is always a resolved absolute address, never a relative handle (G5).\n- [ ] **`--text` output mode is not built in T1.** JSON is the default and the\n  only mode; the consumers in T1 are agents and the harness. It arrives with T4's\n  adoption surface if a human ever needs it."}, {"id": "test-strategy", "title": "Test Strategy", "summary": "Conformance-test driven: the guard rails are written as executable expectations first, and the harness scenario is the verdict.", "tab": "Verification", "body": "The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment."}, {"id": "coverage-map", "title": "Coverage Map", "tab": "Verification", "body": ""}, {"id": "acceptance-criteria", "title": "Acceptance Criteria", "summary": "Thirteen criteria: one per inherited guard rail, plus the C1 transcript and the harness scenario itself.", "tab": "Verification", "body": "Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped."}, {"id": "verification-gaps", "title": "Known Gaps & Risks", "tab": "Verification", "body": "Stated rather than hidden. None of these blocks T1; each names who closes it.\n\n- **The `mail.Client` seam has one implementation.** Seam 1 warns that an\n  abstraction with one implementation is a guess. The conformance suite is the\n  mitigation (D-062-5), but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10)."}, {"id": "approach", "title": "Approach", "summary": "A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle.", "tab": "Solution", "body": "Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built."}, {"id": "end-state-flow", "title": "How one message travels", "summary": "Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions.", "tab": "Solution", "body": ""}, {"id": "end-state-schema", "title": "The store at the end of this task", "tab": "Solution", "body": "Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against."}, {"id": "end-state-api", "title": "The client seam", "tab": "Solution", "body": ""}, {"id": "end-state-cli", "title": "The command surface at the end of this task", "tab": "Solution", "body": ""}, {"id": "file-changes", "title": "File Changes", "tab": "Solution", "body": ""}, {"id": "rejected-alternatives", "title": "Rejected Alternatives", "tab": "Solution", "body": "- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none."}, {"id": "summary", "title": "Summary", "tab": "Plan", "body": "Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle."}, {"id": "execution-sequence", "title": "Execution Sequence", "tab": "Plan", "body": "The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit."}, {"id": "success-criteria", "title": "Success Criteria", "tab": "Plan", "body": "- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines."}], "decisions": [{"id": "D-062-1", "title": "Two agents on one host = two workspaces in one container, not two containers", "status": "accepted", "by": "agent", "summary": "The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts.", "tab": "Requirements", "body": "**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control."}, {"id": "D-062-2", "title": "A binding is keyed by the physical context hooks already capture", "status": "accepted", "by": "agent", "summary": "Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing.", "tab": "Requirements", "body": "**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes."}, {"id": "D-062-3", "title": "The no-mail hook path is gated by a pending-flag file, not a store read", "status": "accepted", "by": "agent", "summary": "G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite.", "tab": "Requirements", "body": "**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package."}, {"id": "D-062-4", "title": "T1 ships init, docs and reset; quickstart and doctor land in T4", "status": "accepted", "by": "agent", "summary": "The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing.", "tab": "Requirements", "body": "**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim."}, {"id": "D-062-5", "title": "T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface", "status": "accepted", "by": "agent", "summary": "D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3.", "tab": "Requirements", "body": "**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire."}, {"id": "D-062-6", "title": "Inline notification in T1 is the pending flag; the bus event waits for the daemon", "status": "accepted", "by": "agent", "summary": "D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host.", "tab": "Requirements", "body": "**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes."}, {"id": "D-062-7", "title": "Losing an ack race is a reported outcome, not an error exit", "status": "accepted", "by": "agent", "summary": "wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage.", "tab": "Requirements", "body": "**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free."}, {"id": "D-062-8", "title": "One exported package, `auto-mail/mail`; the store stays internal", "status": "accepted", "by": "agent", "summary": "Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint.", "tab": "Solution", "body": "**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence."}, {"id": "D-062-9", "title": "The hook writes one hookSpecificOutput object, carrying every fragment", "status": "accepted", "by": "agent", "summary": "The existing hint path already emits at most one object per event; a second producer must join it, not write a second line.", "tab": "Solution", "body": "**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge."}], "acs": [{"id": "AC-1", "title": "G16 — the ontology lands before the code that uses it", "phases": "1", "tests": "auto-mail/mail/mail_test.go", "body": "- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green"}, {"id": "AC-2", "title": "C1 — the epic's transcript runs verbatim", "phases": "1,2", "tests": "auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `<projectId>/agent`, or `unregistered/agent` outside a registered project"}, {"id": "AC-3", "title": "G1 — mail and events are immutable", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go", "body": "- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)"}, {"id": "AC-4", "title": "G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor", "phases": "2,4", "tests": "auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go", "body": "- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)"}, {"id": "AC-5", "title": "G3 — ack is a separate explicit call; reading does not retire", "phases": "2,4", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller"}, {"id": "AC-6", "title": "G13 / D-7 — ack transitions exactly once and reports whether it won", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint"}, {"id": "AC-7", "title": "G4 — at-least-once and unordered, as documented", "phases": "4,5", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide"}, {"id": "AC-8", "title": "G5 / D-9 — addresses are virtual and free-form", "phases": "2,3", "tests": "auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go", "body": "- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)"}, {"id": "AC-9", "title": "G6 — send with no subscription persists, and reports both counts", "phases": "4", "tests": "auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)"}, {"id": "AC-10", "title": "G8 — the nudge is free when there is no mail, and can never break the hook", "phases": "3", "tests": "auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent"}, {"id": "AC-11", "title": "G10 / D-2 — alpha is in the type string and the filename, and reset works", "phases": "1,5", "tests": "auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go", "body": "- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade"}, {"id": "AC-12", "title": "G11 — nothing outside the mail package reads the store", "phases": "5", "tests": "auto-mail/conformance/seam_test.go", "body": "- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")"}, {"id": "AC-13", "title": "G15 — it passes end to end in the harness", "phases": "1,2,3,4,5", "tests": "harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the
