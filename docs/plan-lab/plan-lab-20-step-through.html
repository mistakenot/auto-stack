store/project.go`, all inside one `BEGIN IMMEDIATE` transaction per operation: - `subscribe` \u2192 append `alpha.mail.subscribed`; upsert the subscription (address + `from_cursor`) and its binding row. - `send` \u2192 append `alpha.mail.sent`; insert the immutable `mail` row, carrying the `seq` of that event as the store's own ordering of mail. It writes **no** `deliveries` rows: materialisation is the read path's, and only the read path's (D-10). Send additionally *reads* the two counts it reports and the bindings whose pending flag the mail should raise. - `list` \u2192 materialise any missing `deliveries` rows from each subscription's `from_cursor` (D-10, lazily on read); stamp `read_at` and append `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append nothing; return unacked rows. - `ack` \u2192 `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=? AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).", "verify": "", "cmds": [], "dont": []}, {"n": 4, "do": "**Addresses and bindings.** `mail/address.go`: `ValidateAddress` \u2014 permissive, `/` explicitly allowed and never normalised (D-9); rejects empty, whitespace-padded, control characters and over-length, each with a remediation message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder `tmux` \u2192 `ntm` \u2192 `cwd` over `hooks.CaptureContext()` (D-062-2), returning the opaque pair. **Neither ever writes physical identity into an address or an envelope** (G5).", "verify": "", "cmds": [], "dont": ["**Addresses and bindings.** `mail/address.go`: `ValidateAddress` \u2014 permissive, `/` explicitly allowed and never normalised (D-9);"]}, {"n": 5, "do": "**The direct client.** Implement the remaining five `Client` methods in `mail/direct.go` over the projection, returning exactly the C1 payload shapes. The sender's `from` follows the three-rung ladder: `--from` \u2192 the address of a subscription bound to the caller's `(manager, target)` (lowest subscription id when several) \u2192 the literal `/agent` from the registry, or `unregistered/agent` outside a registered project. Always a resolved absolute address, never a relative handle.", "verify": "", "cmds": [], "dont": ["Always a resolved absolute address, never a relative handle."]}, {"n": 6, "do": "**The CLI verbs.** `subscribe.go` (positional address, `--from-now`, `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go` (`--address`, `--subscription`; unfiltered returns every unacked delivery for every subscription bound to the caller), `ack.go` (positional mail id; `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero with a remediation hint for an unknown id). `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the exact payloads and that stdout is pure JSON.", "verify": "", "cmds": [], "dont": []}, {"n": 7, "do": "**The harness proves it (G15).** Extend `mail_flow.py` with `subscribe/send/list/ack` DSL helpers returning parsed JSON, and `test_mail_loop.py` with the C1 loop across the two workspaces: **project-a subscribes to its own reply address first** (so `from` resolves by rung 2, as C1 shows), project-b subscribes to the target address, project-a sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on presence of the mail id, never on counts (G4 permits duplicates).", "verify": "", "cmds": [], "dont": ["assert on presence of the mail id, never on counts (G4 permits duplicates)."]}, {"n": 8, "do": "", "verify": "**Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`; repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`. **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`.", "cmds": ["cd auto-mail && go build ./... && go test ./...", "make check && make test", "uv run pytest tests/mail_ l could sort below the cursor and be admitted by nothing, ever. The write lock is what makes a high-water mark true instead.", "verify": "**Verify:** send to an unsubscribed address, subscribe afterwards, `list` returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and `backfilled` is 0.", "cmds": [], "dont": ["The cursor is a log position, **never a minted id**."]}, {"n": 2, "do": "**Broadcast (D-7).** Two subscriptions on one address each get their own `deliveries` row and their own ack state; acking one leaves the other unacked.", "verify": "**Verify:** `store_test.go` plus a conformance case.", "cmds": [], "dont": []}, {"n": 3, "do": "**Both counts (G6).** `send` reports `subscriptions` (durable readers) and `bound` (rows with a live binding) as **distinct** numbers, exits 0 with `0/0` for an unknown address, persists the mail, and writes the likely-typo hint to **stderr** only.", "verify": "", "cmds": [], "dont": []}, {"n": 4, "do": "**The conformance suite.** `auto-mail/conformance/conformance.go` \u2014 a `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack appending no second event, backfill-on-subscribe both ways, subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses with a separator. `conformance_test.go` runs it against `NewDirect`. **Deliberately absent: any assertion about ordering** (G4).", "verify": "", "cmds": [], "dont": []}, {"n": 5, "do": "**The harness proves the J2 half.** Extend `test_mail_loop.py` with send-before-subscribe across the two workspaces: project-a sends to an address nobody holds, project-b subscribes afterwards and receives it.", "verify": "", "cmds": [], "dont": []}, {"n": 6, "do": "", "verify": "**Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root `make check && make test`; `uv run pytest tests/mail_fl lAndFromNow|TestBroadcastFanOut|TestSendMaterialisesNoDeliveries|TestFromNowCursorIsDecidedByTheStoreNotByAnID' -v && go test ./conformance -run TestDirectClientConformance -v", "kind": "go-test"}, "AC5": {"t": "Reading never retires mail; ack is always its own call.", "cmd": "cd auto-mail && go test ./internal/cli -run TestListDoesNotRetire -v && go test ./internal/store -run TestListDoesNotRetireAndStampsReadOnce && go test ./conformance -run 'TestDirectClientConformance/reading-never-retires-mail'", "kind": "go-test"}, "AC6": {"t": "Concurrent acks produce exactly one winner, and losers are told.", "cmd": "cd auto-mail && go test -race ./internal/store -run 'TestAckTransitionsExactlyOnce|TestAckDistinguishesUnknownFromUndelivered' -v && go test ./internal/cli -run 'TestAckLosingTheRaceStillExitsZero|TestAckUnknownIDExitsNonZeroWithRemediation'", "kind": "race"}, "AC7": {"t": "At-least-once and unordered is documented; re-acks are idempotent.", "cmd": "cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract", "kind": "go-test"}, "AC8": {"t": "Addresses are free-form and carry no physical identity.", "cmd": "cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v", "kind": "go-test"}, "AC9": {"t": "Sending to nobody persists and reports both counts.", "cmd": "cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'", "kind": "go-test"}, "AC10": {"t": "The hook nudge costs one stat and can never break the hook.", "cmd": "cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHe  "src": "D-062-4"}, "D5": {"t": "Define the Client seam; ship one implementation plus a contract suite", "src": "D-062-5"}, "D6": {"t": "Inline notification is the pending flag; the bus event waits for T3", "src": "D-062-6"}, "D7": {"t": "Losing an ack race is a reported outcome, not an error exit", "src": "D-062-7"}, "D8": {"t": "One exported domain package, `auto-mail/mail`; the store stays internal", "src": "D-062-8"}, "D9": {"t": "The hook writes one hookSpecificOutput object carrying every fragment", "src": "D-062-9"}, "D10": {"t": "No `message` noun: `auto mail` is itself the resource", "src": "epic D-4"}, "D11": {"t": "Event-source the delivery lifecycle", "src": "epic D-1"}, "D12": {"t": "Alpha marker in the type string and the store filename", "src": "epic D-2"}, "D13": {"t": "Broadcast delivery, with ack as a compare-and-set", "src": "epic D-7"}, "D14": {"t": "Subscriptions backfill unacked history from a cursor", "src": "epic D-10"}, "D15": {"t": "Addresses are free-form; structure is convention", "src": "epic D-9"}, "D16": {"t": "The MVP CLI writes the store directly; no daemon required", "src": "epic D-11"}}, "rails": [{"id": "R1", "title": "Mail and events are immutable", "text": "A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected \u2014 this keeps the log mergeable across hosts.", "ac": "AC3", "goal": "G5", "source": "G1"}, {"id": "R2", "title": "Consumer state lives in a deliveries join", "text": "Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.", "ac": "AC4", "goal": "G4", "source": "G2"}, {"id": "R3", "title": "Ack is a separate explicit call", "text": "Reading does not retire mail. Every consumer must call ack.", "ac": "AC5", "goal": "G4", "source": "G3"}, {"id": "R4", "title": "At-least-once and unordered, as documented", "text": "The contract promises neither exactly-once nor order; consumers are idempotent on ma let plan='062',idx=0,pinned=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function chip(id,cls,title){return `<span class="chip ${cls}" data-k="${id}" title="${esc(title||'')}">${id}</span>`}
function chipsAC(a){const P=D[plan];return a.map(x=>chip(x,'ac',P.acs[x]?.t)).join('')}
function copyBtn(txt){return `<button class="cp" data-copy="${esc(txt)}">copy</button>`}
function renderDag(){
  const P=D[plan],ph=P.phases,cur=ph[idx],doneSet=new Set();
  const anc=id=>{const p=ph.find(x=>x.id===id);p.deps.forEach(d=>{doneSet.add(d);anc(d)})};anc(cur.id);
  const lab=p=>`<span class="ph ${p.id===cur.id?'on':doneSet.has(p.id)?'done':''}" data-ph="${p.id}">${p.id}</span>`;
  const short=t=>esc(t.length>34?t.slice(0,33)+'…':t);
  let chain=ph.every(p=>p.deps.length<=1&&(!p.deps.length||ph.findIndex(q=>q.id===p.deps[0])===ph.indexOf(p)-1));
  let out='';
  if(chain){out=ph.map(lab).join(' → ')+'\n'+'<span style="color:var(--mut)">a chain: each phase builds on the one before</span>'}
  else{
    // primary parent = deepest dep; joins (3+ deps) listed at root with their inputs
    const kids={};const roots=[];
    ph.forEach(p=>{if(!p.deps.length||p.deps.length>2){roots.push(p);return}
      const par=p.deps.slice().sort((a,b)=>ph.find(x=>x.id===b).depth-ph.find(x=>x.id===a).depth)[0];(kids[par]=kids[par]||[]).push(p)});
    const walk=(p,pre,last,top)=>{const extra=p.deps.length>2?'  ⇐ '+p.deps.join(' '):(p.deps.length===2?'  (also needs '+p.deps.filter(d=>d!==(ph.find(x=>kids[x.id]&&kids[x.id].includes(p))||{}).id).join(' ')+')':'');
      out+=(top?'':pre+(last?'└── ':'├── '))+lab(p)+' '+short(p.title)+'<span style="color:var(--mut)">'+extra+'</span>\n';
      const k=kids[p.id]||[];k.forEach((c,i)=>walk(c,top?'':pre+(last?'    ':'│   '),i===k.length-1,false))};
    roots.forEach(r=>walk(r,'',true,true));
  }
  document.getElementById('dag').innerHTML=out;
  document.getElementById('phead').innerHTML=`<h2>${cur.id} · ${esc(cur.title)}</h2><div class="sum">${md(cur.summary)}</div>
   <div class="row" style="margin-top:6px"><span class="lbl">goals</span>${cur.goals.map(g=>chip(g,'g',P.goals[g])).join('')} <span class="lbl" style="margin-left:10px">after</span><span class="mono">${cur.deps.length?cur.deps.join(', '):'—'}</span></div>`;
}
function linesHTML(L){return L.map(l=>{const cls=l.g==='+'?'a':l.g==='-'?'r':l.g==='~'?'c':(l.dim?'dim':'');
  const inf=l.inf?`<span class="inf" title="symbol-to-phase attribution inferred (${l.inf==='text'?'named in this phase\'s plan text':l.inf==='file'?'file added in this phase':'earliest phase that touches the file'})">?${l.inf}</span>`:'';
  const tx=l.k?l.t.replace(/(\S+)$/,m=>`<span data-k="${esc(l.k)}">${esc(m)}</span>`):esc(l.t);
  const cm=[l.c?`<span ${l.f?`data-k="${esc(l.f)}"`:''}>${esc(l.c)}</span>`:'',l.d?esc(l.d):'',l.n?'⚠ '+esc(l.n):'',(l.chips||[]).map(x=>chip(x,'ac')).join('')].filter(Boolean).join('  · ');
  return `<div class="ln ${cls}"><span class="gu">${l.g===' '?'':l.g}</span><span class="tx">${tx}${inf}</span><span class="cm">${cm}</span></div>`}).join('')}
function plain(L){return L.map(l=>(l.g||' ')+' '+l.t+(l.c?'    '+l.c:'')).join('\n')}
function render(){
  const P=D[plan],cur=P.phases[idx];
  document.getElementById('t062').className=plan==='062'?'on':'';document.getElementById('t052').className=plan==='052'?'on':'';
  document.getElementById('one').innerHTML=`<b>${P.plan.id}</b> ${esc(P.plan.title)} · ${P.plan.kind} · ${md(P.plan.oneLiner)}`;
  renderDag();
  // executor card
  const acHTML=cur.acs.map(a=>`<div class="row">${chip(a,'ac')} ${md(P.acs[a].t)}<div class="cmd"><code>${esc(P.acs[a].cmd)}</code>${copyBtn(P.acs[a].cmd)}</div></div>`).join('');
  const railsHTML=cur.rails.map(r=>{const R=P.rails.find(x=>x.id===r);return `<li>${chip(r,'r',R.text)} ${esc(R.title)} ${chip(R.ac,'ac')}</li>`}).join('');
  const decHTML=cur.decs.map(d=>`<li>${chip(d,'d',P.decisions[d].src)} ${md(P.decisions[d].t)}</li>`).join('');
  document.getElementById('left').innerHTML=`
  <div class="card"><h3>Executor card · steps (from the plan's ${cur.id} text)</h3>
   <ol class="steps">${cur.steps.map(s=>`<li>${md(s.do)}${s.verify?`<div class="v">${md(s.verify)}</div>`:''}</li>`).join('')}</ol></div>
  <div class="card"><h3>Verify commands</h3>${cur.cmds.map(c=>`<div class="cmd"><code>${esc(c)}</code>${copyBtn(c)}</div>`).join('')||'<div class="empty">none in plan text</div>'}
   <p class="note" style="margin-top:6px">Phase-gate commands as written in the plan (052's are run from <code>auto-reflect/</code>).</p></div>
  <div class="card"><h3>Commit</h3><div class="cmd"><code>${esc(cur.commit)}</code>${copyBtn(cur.commit)}</div></div>
  <div class="card"><h3>ACs this phase discharges</h3>${acHTML}</div>
  <div class="card"><h3>Don't break</h3>
   ${cur.keep.length?`<div class="row"><span class="lbl">keep green (earlier phases)</span>${chipsAC(cur.keep)}</div>`:'<div class="row"><span class="lbl">first phase</span> nothing earlier to regress</div>'}
   ${cur.dont.length?`<ul class="dont">${cur.dont.map(d=>`<li>${md(d)}</li>`).join('')}</ul>`:''}
   ${railsHTML?`<div class="row"><span class="lbl">guard rails already made executable</span></div><ul class="dont">${railsHTML}</ul>`:''}
   ${decHTML?`<div class="row"><span class="lbl">decisions riding on this phase's ACs</span></div><ul class="dont">${decHTML}</ul>`:''}
  </div>`;
  // right
  const ft=cur.files;
  const calls=cur.calls.map(c=>`<div class="block"><div class="bh"><b data-k="${c.id}">${c.before?c.before+' → ':''}${c.id}</b><span>${esc(c.title)}</span><span class="sp"></span>${chipsAC(c.acs)}
    <span class="st ${c.status}">${c.status==='complete'?'complete after '+cur.id:'still needs '+c.future.join(' ')}</span>${copyBtn(plain(c.lines))}</div><div class="lines">${linesHTML(c.lines)}</div></div>`).join('');
  document.getElementById('right').innerHTML=`
   <div class="block"><div class="bh"><b>File tree after ${cur.id}</b><span>+ added · ~ changed · − deleted in ${cur.id} only; plain = exists (earlier phase or base)</span><span class="sp"></span>${copyBtn(plain(ft))}</div><div class="lines">${linesHTML(ft)}</div></div>
   <p class="note">Symbols listed are only those attributed to ${cur.id}. Attribution comes from <code>files[].phases</code>; where a file spans several phases, the symbol's phase is inferred and marked <span style="color:#b45309">?text</span> (named in this phase's plan text) or <span style="color:#b45309">?earliest</span>.</p>
   <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px">Call trees ${cur.id} changes or completes — diff vs before ${cur.id}</h3>
   ${calls||`<div class="empty">No journey frame is attributed to ${cur.id} (its changes sit inside files shared with other phases; see the file tree).</div>`}`;
  applyHL();
  try{localStorage.setItem('lab20',JSON.stringify({plan,idx}))}catch(e){}
}
function setHash(){location.hash=plan+'/'+D[plan].phases[idx].id}
function fromHash(){const m=location.hash.match(/#(062|052)(?:\/(P\d+))?/);if(m){plan=m[1];const i=D[plan].phases.findIndex(p=>p.id===m[2]);idx=i<0?0:i}}
function applyHL(k){k=k||pinned;document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(!k)return;
  document.querySelectorAll('[data-k]').forEach(e=>{if(e.dataset.k===k)e.classList.add('hl')})}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-k]');if(t)applyHL(t.dataset.k)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-k]'))applyHL()});
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){navigator.clipboard?.writeText(c.dataset.copy);c.textContent='copied';setTimeout(()=>c.textContent='copy',900);return}
  const p=e.target.closest('[data-ph]');if(p){idx=D[plan].phases.findIndex(x=>x.id===p.dataset.ph);setHash();return}
  const t=e.target.closest('[data-k]');if(t){pinned=pinned===t.dataset.k?null:t.dataset.k;applyHL()}});
document.getElementById('prev').onclick=()=>{idx=Math.max(0,idx-1);setHash()};
document.getElementById('next').onclick=()=>{idx=Math.min(D[plan].phases.length-1,idx+1);setHash()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){idx=Math.min(D[plan].phases.length-1,idx+1);setHash()}
  else if(e.key==='ArrowLeft'){idx=Math.max(0,idx-1);setHash()}else if(e.key==='Escape'){pinned=null;applyHL()}});
window.addEventListener('hashchange',()=>{fromHash();render()});
if(!location.hash){try{const s=JSON.parse(localStorage.getItem('lab20'));if(s&&D[s.plan]){plan=s.plan;idx=s.idx}}catch(e){}}
fromHash();render();
