<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Replay · Plan Lab 17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014; --panel:#14171d; --panel2:#1a1e26; --panel3:#222733; --line:#272c37; --line2:#343a48;
  --ink:#ece9e1; --ink2:#c9c6be; --mute:#8a8f9d; --faint:#555b69;
  --add:#5fd394; --add-d:#1d3b2c; --edit:#f4b247; --edit-d:#3d301a; --del:#ef6f62; --del-d:#3d1f1d;
  --sel:#6cc3ff; --sel-d:#16324a; --cs:#c39bf0; --cs-d:#2c2140; --goal:#f7df72; --div:#ff8fb1;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.35}
body{overflow:hidden;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
code,.mono{font-family:var(--mono);font-size:.86em}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2b303c;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header{height:50px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#0b0d10}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--edit)}
.brand small{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.12em}
.planswitch{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.planswitch button{padding:5px 12px;font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:baseline}
.planswitch button small{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em}
.planswitch button.on{background:var(--panel3);color:var(--ink)}
.planswitch button.on[data-plan="062"] small{color:var(--add)}
.planswitch button.on[data-plan="052"] small{color:var(--edit)}
.hstats{display:flex;gap:14px;margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.hstats b{color:var(--ink);font-weight:600}
.hbtn{border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;white-space:nowrap;color:var(--ink2)}
.hbtn:hover{border-color:var(--mute);color:var(--ink)}
.hbtn.on{border-color:var(--sel);color:var(--sel)}
.hbtn.ff{background:var(--edit);color:#1b1407;border-color:var(--edit);font-weight:600}

/* ---------- scrubber ---------- */
#scrub{height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(#101318,#0e1014)}
.transport{display:flex;gap:4px}
.transport button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.transport button:hover{border-color:var(--mute)}
.transport button.play{background:var(--ink);color:#111;border-color:var(--ink);width:40px}
#track{position:relative;flex:1;height:44px;cursor:pointer;user-select:none;touch-action:none}
.segs{position:absolute;inset:0;display:flex;gap:3px}
.seg{position:relative;height:100%;border-radius:6px;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-width:14px}
.seg.base{background:repeating-linear-gradient(45deg,#161a21 0 6px,#12151b 6px 12px)}
.seg .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1f2a24,#27402f);width:0}
.plan052 .seg .fill{background:linear-gradient(90deg,#2b2518,#43361b)}
.seg .lab{position:absolute;left:7px;top:5px;right:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);pointer-events:none}
.seg .lab b{font-family:var(--mono);font-weight:600;color:var(--ink);margin-right:5px;font-size:10.5px}
.seg .ticks{position:absolute;left:0;right:0;bottom:4px;height:10px;display:flex;pointer-events:none;padding:0 3px}
.seg .ticks i{flex:1;border-left:1px solid #ffffff14;height:6px;margin-top:4px}
.seg .ticks i.cpk{border-left:0;height:10px;margin-top:0;display:flex;justify-content:center}
.seg .ticks i.cpk:after{content:'';width:7px;height:7px;transform:rotate(45deg);border:1.5px solid var(--mute);margin-top:1px}
.seg.done .ticks i.cpk:after{background:var(--add);border-color:var(--add)}
.plan052 .seg.done .ticks i.cpk:after{background:var(--edit);border-color:var(--edit)}
.seg .divb{position:absolute;right:5px;top:4px;font-family:var(--mono);font-size:10px;color:var(--div);background:#3a1a28;border-radius:4px;padding:0 4px}
.seg.cur{border-color:var(--ink2)}
#head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px;pointer-events:none;box-shadow:0 0 8px #fff8;transition:left .18s}
#head:before{content:'';position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
#now{width:230px;font-size:11.5px;line-height:1.3;color:var(--mute)}
#now b{display:block;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now code{color:var(--ink2)}

/* ---------- main grid ---------- */
main{position:relative;display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1.12fr);height:calc(100vh - 112px)}
main>section,main>aside{overflow:auto;border-right:1px solid var(--line);min-height:0}
.ph{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.ph h2{margin:0;font-size:12px;font-family:var(--mono);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.ph .sub{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- overview ---------- */
#ov{background:#101217}
.ovhead{padding:14px 16px 10px}
.kind{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.kind.g{background:var(--add-d);color:var(--add)}.kind.b{background:var(--edit-d);color:var(--edit)}
.ovhead h1{margin:0 0 4px;font-size:21px;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.ovhead p{margin:0;color:var(--mute);font-size:12.5px}
.ovhead .commits{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.oblock{padding:8px 12px 10px;border-top:1px solid var(--line)}
.olab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute);margin:2px 4px 6px;display:flex;justify-content:space-between}
.goal{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;padding:6px 4px;border-radius:8px;cursor:pointer;align-items:start}
.goal:hover{background:var(--panel)}
.goal .ring{width:28px;height:28px;position:relative}
.goal .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.goal .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--mute)}
.goal .gt{font-size:13.5px;line-height:1.25;color:var(--ink2);font-weight:600}
.goal .gt b{font-family:var(--mono);font-size:10px;color:var(--goal);margin-right:4px;font-weight:600}
.goal.done .gt{color:var(--ink)}
.goal .acs{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.acq{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--mute);border-radius:4px;padding:1px 4px 1px 2px;cursor:pointer;border:1px solid transparent}
.acq i{width:11px;height:11px;border:1.5px solid var(--faint);border-radius:2.5px;display:grid;place-items:center;font-style:normal;font-size:8px;line-height:1;position:relative;overflow:hidden}
.acq.part i{border-color:var(--ink2)}
.acq.part i:after{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--p,50%);background:var(--ink2);opacity:.45}
.acq.ok{color:var(--ink)}
.acq.ok i{background:var(--add);border-color:var(--add);color:#0c1a12}
.acq.ok i:before{content:'✓';font-weight:700}
.acq.flash{animation:flash 1.1s}
@keyframes flash{0%{background:#5fd39455;box-shadow:0 0 0 4px #5fd39433}100%{background:transparent;box-shadow:none}}
.goal.hl,.acq.hl,.dia.hl,.tri.hl{outline:1.5px solid var(--sel);outline-offset:1px;background:var(--sel-d)}
.strip{display:flex;flex-wrap:wrap;gap:3px 4px;padding:0 2px}
.dia,.tri{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;color:var(--mute);padding:2px 5px 2px 3px;border-radius:5px;cursor:pointer}
.dia:before{content:'◆';color:var(--faint);font-size:11px}
.dia.on{color:var(--ink2)}.dia.on:before{color:var(--sel)}
.tri:before{content:'▲';color:var(--faint);font-size:9px}
.tri.on{color:var(--ink2)}.tri.on:before{color:var(--add)}
.plan052 .tri.on:before{color:var(--edit)}
.dia:hover,.tri:hover,.acq:hover{background:var(--panel2)}
.phrow{display:flex;gap:3px;flex-wrap:wrap}
.phrow button{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--mute)}
.phrow button.done{color:var(--ink2);border-color:#3b4a40}
.plan052 .phrow button.done{border-color:#4a4029}
.phrow button.cur{background:var(--ink);color:#111;border-color:var(--ink)}
#focus{position:sticky;bottom:8px;z-index:4;box-shadow:0 -10px 30px #000a;max-height:55vh;overflow:auto;margin:8px 12px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:10px 12px;font-size:12.5px;display:none}
#focus.on{display:block}
#focus .fk{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.1em;display:flex;justify-content:space-between}
#focus .fk button{color:var(--mute)}
#focus h3{margin:3px 0 6px;font-size:15px;line-height:1.2}
#focus p{margin:4px 0;color:var(--ink2)}
#focus pre{white-space:pre-wrap;word-break:break-word;background:#0b0d10;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:10.5px;color:var(--add);margin:6px 0}
#focus .rej{color:var(--mute);font-size:11.5px;border-left:2px solid var(--del);padding-left:7px;margin:4px 0}
#focus .tests{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
#focus .tests div:before{content:'✓ ';color:var(--add)}

/* ---------- file system slice ---------- */
#fs{background:
  linear-gradient(#ffffff05 1px,transparent 1px) 0 0/100% 22px,
  linear-gradient(90deg,#ffffff04 1px,transparent 1px) 0 0/22px 100%, var(--bg)}
.fscount{display:flex;gap:10px;font-family:var(--mono);font-size:11px}
.fscount .a{color:var(--add)}.fscount .e{color:var(--edit)}.fscount .d{color:var(--del)}
.tree{padding:8px 8px 60px 10px;font-size:12.5px}
.dir{margin:2px 0}
.dname{font-family:var(--mono);font-size:11.5px;color:var(--mute);padding:3px 4px;display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:4px}
.dname:hover{color:var(--ink2)}
.dname:before{content:'▾';font-size:9px;width:8px}
.dir.closed>.dname:before{content:'▸'}
.dir.closed>.dkids{display:none}
.dname .dc{margin-left:auto;font-size:10px;color:var(--faint)}
.dkids{margin-left:9px;padding-left:9px;border-left:1px dashed var(--line2)}
.file{position:relative;padding:4px 6px 5px 6px;margin:2px 0;border-radius:6px;border:1px solid transparent;transition:background .3s,border-color .3s,opacity .3s}
.frow{display:flex;align-items:baseline;gap:7px;cursor:pointer}
.fg{font-family:var(--mono);font-size:12px;width:10px;text-align:center;font-weight:600}
.fn{font-family:var(--mono);font-size:12px;color:var(--ink)}
.fmeta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap}
.file[data-ch="add"] .fg{color:var(--add)}
.file[data-ch="edit"] .fg{color:var(--edit)}
.file[data-ch="delete"] .fg{color:var(--del)}
.file[data-ch="context"] .fg{color:var(--faint)}
.file[data-ch="context"] .fn{color:var(--mute)}
.file.ghost{opacity:.26;border:1px dashed var(--line2)}
.file.ghost .fn{color:var(--mute)}
body.noghost .file.ghost,body.noghost .dir.empty{display:none}
.file.gone .fn{text-decoration:line-through;color:var(--del)}
.file.landing{background:#ffffff0d;border-color:var(--ink2);box-shadow:0 0 0 3px #ffffff0a}
.file.touched{background:#5fd39410}
.plan052 .file.touched{background:#f4b24714}
.file.hl{border-color:var(--sel);background:var(--sel-d)}
.file.post .fmeta{color:var(--div)}
.syms{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 0 17px}
.sym{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:all .35s}
.sym:hover{border-color:var(--mute)}
.sym.k-type,.sym.k-interface{font-style:italic}
.sym.ghost{opacity:.25;border-style:dashed;background:transparent}
body.noghost .sym.ghost{display:none}
.sym.born{background:var(--add-d);border-color:#2e6a4a;color:#c9f3da}
.sym.reno{background:var(--edit-d);border-color:#6b5322;color:#fbe1b0}
.sym.reno:before{content:'~';color:var(--edit);margin-right:2px}
.sym.pend{border-color:#6b5322;border-style:dashed}
.sym.pend:before{content:'~';color:#6b5322;margin-right:2px}
.sym.gone{text-decoration:line-through;color:var(--del);opacity:.6}
.sym.fresh{animation:pop .9s}
@keyframes pop{0%{transform:scale(.4);opacity:0;box-shadow:0 0 0 0 #fff8}40%{transform:scale(1.15);opacity:1;box-shadow:0 0 0 5px #ffffff30}100%{transform:scale(1)}}
.sym.hl{border-color:var(--sel)!important;background:var(--sel-d)!important;color:#fff!important;opacity:1!important}
.sym.miss{outline:1.5px dashed var(--cs);outline-offset:1px;opacity:.9!important}
.sym.pulse{box-shadow:0 0 0 3px var(--cs);border-color:var(--cs)!important;color:#fff!important;opacity:1!important}
.tgrp{margin:3px 0 0 17px;font-family:var(--mono);font-size:10px;color:var(--mute);cursor:pointer;display:inline-block}
.tgrp:hover{color:var(--ink2)}
.tsyms{display:none}
.file.topen .tsyms{display:flex}
.tsyms .sym{font-size:9.8px}
.tsyms .sym:before{content:'✓ ';color:var(--faint)}
.tsyms .sym.born:before,.tsyms .sym.live:before{color:var(--add)}

/* ---------- right column ---------- */
#right{display:flex;flex-direction:column;border-right:0}
#dep{flex:0 0 auto;border-bottom:1px solid var(--line)}
#graph{padding:6px 10px 4px;position:relative}
#graph svg{width:100%;display:block}
.gn rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1.2;transition:all .35s}
.gn text{font-family:var(--mono);font-size:11px;fill:var(--ink2);pointer-events:none}
.gn .gm{font-size:9px;fill:var(--mute)}
.gn{cursor:pointer;transition:opacity .35s}
.gn.ghost{opacity:.22}.gn.ghost rect{stroke-dasharray:3 3;fill:transparent}
.gn.k-add rect{stroke:#2e6a4a}
.gn.k-edit rect{stroke:#6b5322}
.gn.busy rect{stroke:var(--ink);stroke-width:2;fill:#2a3040}
.gn.reno rect{fill:var(--edit-d)}
.gn.fresh rect{fill:var(--add-d)}
.gn.k-external rect{fill:#101216}
.gn.hl rect{stroke:var(--sel);stroke-width:2.2;fill:var(--sel-d)}
.gn.pulse rect{stroke:var(--cs);stroke-width:2.6;fill:var(--cs-d)}
.ge{fill:none;stroke:#3a4150;stroke-width:1.3;transition:all .35s}
.ge.add{stroke:#3c7a58}
.plan052 .ge.add{stroke:#8a6a2a}
.ge.ghost{opacity:.12;stroke-dasharray:3 4}
.ge.hl{stroke:var(--sel);stroke-width:2.2;opacity:1}
.ge.fresh{stroke:var(--add);stroke-width:2.6}
body.has-sel .gn:not(.hl):not(.pulse){opacity:.35}
body.has-sel .ge:not(.hl){opacity:.18}
.forb{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mute)}
.forb span{cursor:help}.forb .fbt{font-family:var(--mono);font-size:10.5px;color:var(--mute)}.forb .fbt:hover{color:var(--ink2)}.forb .fbl{display:none;flex-direction:column;gap:2px;width:100%}.forb.open .fbl{display:flex}
.forb span:before{content:'▲ ';color:var(--del);font-size:9px}
#cs{flex:1 1 auto;min-height:0;overflow:auto}
.cslist{padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.csr{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:all .3s}
.csr:hover{border-color:var(--line2)}
.csr .cg{font-size:16px;color:var(--faint);text-align:center;line-height:1}
.csr .ct{font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.csr .ct b{color:var(--cs);font-weight:600;margin-right:5px}
.csr .cst{font-family:var(--mono);font-size:10px;white-space:nowrap;color:var(--mute)}
.csr.locked{opacity:.62}
.csr.locked .cst{color:var(--faint)}
.csr.legacy .cst{color:var(--edit)}
.csr.ready .cg{color:var(--cs)}
.csr.ready .cst{color:var(--add)}
.csr.retired{opacity:.45}.csr.retired .ct{text-decoration:line-through}
.csr.unlock{animation:unl 1.6s}
@keyframes unl{0%{box-shadow:0 0 0 0 var(--cs);background:var(--cs-d)}100%{box-shadow:0 0 0 10px transparent}}
.csr.sel{border-color:var(--cs);background:var(--cs-d)}
.csr.hl{border-color:var(--sel)}
#ladder{margin:8px 10px 4px;border:1px solid var(--line2);border-radius:10px;background:#101318;display:none}
#ladder.on{display:block}
.lhd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lhd .ttl{font-family:var(--mono);font-size:11.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhd .ttl small{display:block;color:var(--mute);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtn{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--cs);color:var(--cs);white-space:nowrap}
.lbtn:disabled{opacity:.35;cursor:not-allowed}
.lbtn.primary{background:var(--cs);color:#1a1026}
#lanes{padding:6px 6px 0}
#lanes svg{width:100%;display:block}
.lane text{font-family:var(--mono);font-size:10px;fill:var(--mute)}
.lane rect{fill:#ffffff05}
.fd{cursor:pointer}
.fd circle{stroke-width:2;transition:all .3s}
.fd.ok circle{fill:var(--panel3);stroke:var(--cs)}
.fd.miss circle{fill:var(--bg);stroke:var(--faint);stroke-dasharray:2 2}
.fd.pend circle{fill:var(--edit-d);stroke:var(--edit)}
.fd.cur circle{fill:var(--cs);stroke:#fff;r:8}
.fd text{font-family:var(--mono);font-size:9px;fill:var(--mute)}
.fpath{fill:none;stroke:var(--cs);stroke-width:1.5;opacity:.5}
.fpath.lock{stroke:var(--faint);stroke-dasharray:3 3}
#fdetail{padding:6px 12px 10px;font-size:12px;min-height:58px}
#fdetail .fs1{font-family:var(--mono);font-size:12px;color:var(--ink)}
#fdetail .fs1 i{font-style:normal;font-size:10px;padding:1px 5px;border-radius:3px;margin-right:6px;background:var(--panel3);color:var(--ink2)}
#fdetail .fs2{color:var(--mute);font-family:var(--mono);font-size:10.5px;margin-top:2px}
#fdetail .fs3{color:var(--ink2);margin-top:3px}
#fdetail .eff{color:var(--add);font-family:var(--mono);font-size:10.5px}
#fdetail .lockmsg{color:var(--cs);font-family:var(--mono);font-size:11px}

og)","Any change to autowatch `Backend` or `hooks.CaptureEnv` allowlist","`--text` output mode"]},"goals":[{"id":"G1","title":"Mail has its own vocabulary, defined before any code.","description":"Mail, Address, Subscription, Delivery and Binding land in the glossary first, then the same words are used in schema, events, CLI and commits. Nothing in mail is called a Message, which already names a Session exchange.","sources":["plan goal 1","rail G16","epic D-4"]},{"id":"G2","title":"Agents on one host can send each other mail that waits.","description":"Subscribe, send, list, ack work with no daemon running. Mail sent before anyone subscribes still reaches the later subscriber. Addresses are free-form names with no physical identity in them.","sources":["plan goal 5","C1","rail G5","rail G6","epic D-9","epic D-11"]},{"id":"G3","title":"A busy agent is told it has mail at almost no cost.","description":"The existing PostToolUse hook tells the agent it has mail. The no-mail path costs one stat, never opens the store, and can never stall or break the hook.","sources":["plan goal 7","rail G8","D-062-3","D-062-9"]},{"id":"G4","title":"Delivery is honest: explicit ack, at-least-once, one winner.","description":"Reading never retires mail. Each subscription has its own delivery state, filled lazily from a cursor. Concurrent acks resolve to exactly one winner, and losers are told. No ordering or exactly-once is promised.","sources":["plan goal 6","rail G2","rail G3","rail G4","rail G13","epic D-7","epic D-10"]},{"id":"G5","title":"The store is an append-only log that is safe to wipe.","description":"An event log is the authority; projections update in the same transaction and mail rows never change. The `alpha` marker is in the event types and the filename, and `reset` is a supported operation.","sources":["plan goal 4","rail G1","rail G10","epic D-1","epic D-2"]},{"id":"G6","title":"Only the mail client can reach the store.","description":"`mail.Client` is the one API; the ","then":"the mail is returned both times, no ack event is appended, and after `ack` list is `[]`","detail":"No `alpha.mail.acked` is appended by `list`; there is no flag on `list` that acks (checked against its flag set).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run TestListDoesNotRetire -v && go test ./internal/store -run TestListDoesNotRetireAndStampsReadOnce && go test ./conformance -run 'TestDirectClientConformance/reading-never-retires-mail'","tests":["auto-mail/internal/cli/cli_test.go:TestListDoesNotRetire","auto-mail/internal/store/store_test.go:TestListDoesNotRetireAndStampsReadOnce","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_ack_is_explicit_and_transitions_exactly_once"]},"phases":["P2","P4"],"rails":["R3"],"source":"AC-5"},{"id":"AC6","goal":"G4","title":"Concurrent acks produce exactly one winner, and losers are told.","given":"one delivery and 16 goroutines acking it under `-race`","when":"they all complete","then":"one `wonTransition:true`, fifteen false, one `alpha.mail.acked` event; all exit 0","detail":"Every caller sees `acked:true` and exit 0; losers get a stderr note naming who won (D-062-7). Unknown id, or an id the caller has no delivery for, exits non-zero with a remediation hint.","verify":{"kind":"race","cmd":"cd auto-mail && go test -race ./internal/store -run 'TestAckTransitionsExactlyOnce|TestAckDistinguishesUnknownFromUndelivered' -v && go test ./internal/cli -run 'TestAckLosingTheRaceStillExitsZero|TestAckUnknownIDExitsNonZeroWithRemediation'","tests":["auto-mail/internal/store/store_test.go:TestAckTransitionsExactlyOnce","auto-mail/internal/store/store_test.go:TestAckTransitionsExactlyOnceUnderConcurrency","auto-mail/internal/store/store_test.go:TestAckDistinguishesUnknownFromUndelivered","auto-mail/internal/cli/cli_test.go:TestAckLosingTheRaceStillExitsZero","auto-mail/internal/cli/cli_test.go:TestAckUnknownIDExitsNonZeroWithRemediation"]},"decisions":["D7","D13"],"phases":["P2","P5"],"rails":["R10"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"At-least-once and unordered is documented; re-acks are idempotent.","given":"`auto mail docs` and `auto-mail/CLAUDE.md`","when":"a delivery is acked twice, or the same id is listed twice","then":"docs state at-least-once/unordered/idempotent; re-ack appends nothing and reports `wonTransition:false`","detail":"Duplicate delivery is simulated at the client boundary (a Client decorator repeating one List entry), never by a second `deliveries` row, which the PK forbids. No test asserts ordering.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract","tests":["auto-mail/conformance/conformance_test.go:TestDirectClientConformance","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheDeliveryContract"]},"phases":["P4","P5"],"rails":["R4"],"source":"AC-7"},{"id":"AC8","goal":"G2","title":"Addresses are free-form and carry no physical identity.","given":"address validation and a sender with TMUX/NTM env set","when":"`auto-web/bugs` is sent to","then":"`/` is accepted and never normalised; no host/session/pane id appears in the mail row","detail":"Validation rejects only empty, whitespace-padded, control-character and over-length values, each with a remediation. Physical context lives only on `bindings` as an opaque (manager, target) pair — no typed `tmux_pane_id` column.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v","tests":["auto-mail/mail/mail_test.go:TestValidateAddressIsPermissive","auto-mail/mail/mail_test.go:TestBindingLadder","auto-mail/mail/mail_test.go:TestNoPhysicalIdentityInStoredMail","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_addresses_carry_no_physical_identity"]},"decisions":["D2","D15"],"phases":["P2","P3"],"rails":["R5"],"source":"AC-8"},{"id":"AC9","goal":"G2","title":"Sending to nobody persists and reports both counts.","given":"an address nobody has subscribed to","when":"`auto mail send --to <address>` runs","then":"exit 0, mail persisted, `subscriptions:0, bound:0`, typo hint on stderr; a later subscriber receives it","detail":"With a subscription but no binding row, payload is `subscriptions:1, bound:0` — in T1 `bound` counts binding rows, not liveness (D-062-2).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'","tests":["auto-mail/internal/cli/cli_test.go:TestSendWithNoSubscriptionPersists","auto-mail/internal/store/store_test.go:TestSubscriptionsAndBoundDiverge","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber"]},"decisions":["D2","D15"],"phases":["P4"],"rails":["R6"],"source":"AC-9"},{"id":"AC10","goal":"G3","title":"The hook nudge costs one stat and can never break the hook.","given":"any mailbox state and a PostToolUse payload","when":"`auto hooks fire --agent claude` runs","then":"zero store opens on both paths; one `hookSpecificOutput` naming `auto mail list` when mail waits; exit 0 always","detail":"Zero opens asserted with a counting store-opener over the package var; stats at most one path. A host that never ran `auto mail init` gets no `alpha-store.db`. Nudge only on PostToolUse; with a matching hint rule both fragments share one emission. Absent, unreadable, locked or corrupt store → exit 0, no malformed stdout, bounded time.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHealsItself' -v && cd ../auto-cli && go test ./cmd/auto -run 'TestFire(NudgesOnlyWhenMailIsWaiting|NudgeCarriesNoMailboxContent|NudgesOnPostToolUseOnly|EmitsOneObjectWhenMailAndHintBothMatch|SurvivesABrokenMailDirectory|CreatesNoMailStore)|TestEmitAdditionalContextWritesAtMostOneObject' -v","tests":["auto-mail/mail/mail_test.go:TestHasPendingOpensNoStore","auto-mail/mail/mail_test.go:TestNudgeTextCarriesNoMailboxContent","auto-mail/mail/mail_test.go:TestPendingFlagLifecycle","auto-mail/mail/mail_test.go:TestFalsePositiveFlagHealsItself","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnlyWhenMailIsWaiting","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgeCarriesNoMailboxContent","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnPostToolUseOnly","auto-cli/cmd/auto/hooksmail_test.go:TestFireEmitsOneObjectWhenMailAndHintBothMatch","auto-cli/cmd/auto/hooksmail_test.go:TestFireSurvivesABrokenMailDirectory","auto-cli/cmd/auto/hooksmail_test.go:TestFireCreatesNoMailStore","auto-cli/cmd/auto/hints_test.go:TestEmitAdditionalContextWritesAtMostOneObject","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail","harness/tests/mail_flow/test_mail_loop.py:test_hook_fire_never_breaks_the_agent","harness/tests/mail_flow/test_mail_loop.py:test_hook_creates_no_store_on_a_host_that_never_ran_init"]},"decisions":["D3","D6","D9","D2"],"phases":["P3"],"rails":["R7"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"`alpha` is in event types and filename, and reset works.","given":"the store","when":"its path, events and `reset` are inspected","then":"path is `~/.auto/mail/alpha-store.db`; types are exactly the four `alpha.mail.*`; envelopes carry `version`; reset wipes and the tool works again","detail":"T1 vocabulary: `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — every type prefixed and these four the complete set. `auto mail reset` reports what it removed. `auto mail docs` states: no upcasters, no migrations, no compatibility guarantee, may be wiped on upgrade.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/store -run 'TestEveryEnvelopeCarriesAVersion|TestAppendRejectsAnEventOutsideTheAlphaNamespace' -v && go test ./internal/cli -run 'TestInitCreatesAlphaStore|TestReset|TestDocsStatesTheAlphaContract' -v && go test ./mail -run 'TestResetWipesTheAlphaStore|TestSchemaAndEventTypesUseTheMailVocabulary'","tests":["auto-mail/internal/store/store_test.go:TestEveryEnvelopeCarriesAVersion","auto-mail/internal/store/store_test.go:TestAppendRejectsAnEventOutsideTheAlphaNamespace","auto-mail/internal/cli/cli_test.go:TestInitCreatesAlphaStore","auto-mail/internal/cli/cli_test.go:TestResetWipesTheStoreAndTheC1LoopRunsAgain","auto-mail/internal/cli/cli_test.go:TestResetOnAFreshHostRemovesNothing","auto-mail/internal/cli/cli_test.go:TestResetRecoversAStoreWrittenByAnotherSchema","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheAlphaContract","auto-mail/mail/mail_test.go:TestResetWipesTheAlphaStore","harness/tests/mail_flow/test_mail_loop.py:test_store_carries_the_alpha_marker_in_its_filename"]},"decisions":["D4","D12"],"phases":["P1","P5"],"rails":["R8"],"source":"AC-11"},{"id":"AC12","goal":"G6","title":"Nothing outside the mail store package opens the mail store.","given":"the whole repository","when":"a guard test walks every module, the harness and `skills/`","then":"no file outside `auto-mail/internal/store` both names the mail store and opens a DB; no outside import of `auto-mail/internal/…`","detail":"Scoped to the mail store, not SQLite in general (auto-watch and auto-search legitimately import `modernc.org/sqlite`). The internal-import half is already a compile-time guarantee; the test is a regression guard. `auto-cli` reaches mail only through `auto-mail/mail`. Failure names the file and says \"go through mail.Client\".","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v","tests":["auto-mail/conformance/seam_test.go:TestNothingOutsideTheMailPackageOpensTheStore"]},"decisions":["D8","D5"],"phases":["P5"],"rails":["R9"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"The whole loop passes end to end in the harness.","given":"`uv run harness mail-flow up` from `harness/`","when":"`uv run pytest tests/mail_flow -v` runs","then":"one container, one host id, two workspaces; the C1 loop, nudge, ack and send-before-subscribe pass against the real binary","detail":"`check_ready()` fails fast if the store is uninitialised or a workspace unregistered. Bounded retry on observable outcomes, no sleep-to-settle, no count assertions duplicates would break. Registered in `SCENARIOS`; no existing scenario changed. `make check`, `make test`, `make test-race` green with auto-mail in `RACE_PROJECTS`.","verify":{"kind":"harness","cmd":"cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race","tests":["harness/tests/mail_flow/test_mail_loop.py:test_single_host_two_registered_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_list_is_empty_json_from_both_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_docs_are_discoverable_from_a_workspace","harness/tests/mail_flow/test_mail_loop.py:test_init_is_idempotent","harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber","harness/tests/mail_flow/test_mail_loop.py:test_from_now_opts_out_of_the_backlog","harness/tests/mail_flow/test_mail_loop.py:test_broadcast_gives_each_subscription_its_own_ack_state","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail"]},"verifyNote":"Harness is not in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One client interface is the only API. A skill or hook running sqlite3 against the store would freeze the schema.","ac":"AC12","goal":"G6","source":"G11"},{"id":"R10","title":"Ack transitions exactly once and reports whether it won","text":"Ack is a conditional update inside the append transaction; a loser is told, never silently treated as success.","ac":"AC6","goal":"G4","source":"G13"},{"id":"R11","title":"Done means it passes end to end in the harness","text":"A harness scenario running the real binary is the verdict; bounded retry, and missing seams are findings, not workarounds.","ac":"AC13","goal":"G7","source":"G15"},{"id":"R12","title":"The ontology lands before the code","text":"Canonical terms go into the glossary first, then the same word is used in every surface.","ac":"AC1","goal":"G1","source":"G16"}],"phases":[{"id":"P1","title":"Ontology, module skeleton, and the scenario comes up","summary":"Glossary first; `auto mail init/docs/list` on a minimal store; mounted in `auto`; `mail-flow` scenario green.","dependsOn":[],"goals":["G1","G6","G7"],"acs":["AC1","AC11","AC13"],"files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","harness/ internal/ulid/ulid_test.go`, `auto-mail/mail/export_test.go`.","`cli_test.go` imports `auto-mail/internal/store` (test-only, inside the module — allowed by the internal rule).","Seam guard flags a file only if it both names the mail store (alpha-store.db, alpha-flags, .auto/mail) AND contains a DB opener (sqlite, database/sql, sql.Open, sqlite3) — matches the T7 resolution.","Glossary Binding definition dropped \"and liveness\" from the plan's draft wording — consistent with D-062-2 (no liveness in T1).","Old plan ids G1–G16 are guard rails; renamed R1–R12 here (source keeps the epic id). Goals G1–G7 are new clusters.","Epic decisions D-1, D-2, D-4, D-7, D-9, D-10, D-11 are included as D10–D16 (by: epic); D-3, D-5 (superseded), D-6, D-8, D-12, D-13 are referenced only via out-of-scope."]},"052":{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8","F3","F11"]}],"acs":[{"id":"AC1","goal":"G1","title":"gap list surfaces reported gaps","given":"feedback events carrying a `gap`","when":"`auto reflect gap list`","then":"JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted","detail":"Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSurfacesGaps","auto-reflect/internal/cli/gap_integration_test.go:TestGapListOmitsGaplessFeedback"]},"decisions":["D1","D14"],"phases":["P5"],"source":"AC-1"},{"id":"AC2","goal":"G1","title":"gap list obeys list conventions","given":"gaps across sessions and times","when":"`gap list` unfiltered, or with a time filter","then":"all gaps unfiltered; `--since/--after/--before` filter; empty state is `[]`; text mode works","detail":"Given gaps spanning multiple sessions/domains/times, when I run gap list with no filters, then all gaps are returned; and --since/--after/--before and --domain filter correctly (one filter mode at a time), input normalized, JSON by default with --format text available.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapList(SinceFilter|EmptyReturnsArray|TextFormat|DomainUnsupported)'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSinceFilter","auto-reflect/internal/cli/gap_integration_test.go:TestGapListEmptyReturnsArray","auto-reflect/internal/cli/gap_integration_test.go:TestGapListTextFormat","auto-reflect/internal/cli/gap_integration_test.go:TestGapListDomainUnsupported"]},"decisions":["D14"],"phases":["P5"],"source":"AC-2"},{"id":"AC3","goal":"G2","title":"One pending count, two callers agree","given":"an ETL fixture with non-canonical session remotes","when":"`miner status` and `stats` run on it","then":"`pending` == `pending_to_mine`; both from `miner.PendingCount`","detail":"Given any repo + ETL state, when I run `auto reflect miner status` and `auto reflect stats`, then pending == pending_to_mine (both computed by one shared function), and the counted universe is documented. A unit test pins them equal on a fixture where they previously diverged.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestMinerStatusPendingMatchesStats|TestMinerStatusCoveragePctNullWhenNoInScopeSessions'","tests":["auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusPendingMatchesStats","auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusCoveragePctNullWhenNoInScopeSessions"]},"decisions":["D13"],"phases":["P4"],"source":"AC-3"},{"id":"AC4","goal":"G3","title":"Mutations expose a top-level id","given":"the uniform output envelope","when":"`observation add`, `rule create/edit/promote/retire/graduate`, `consolidate`","then":"id(s) at `.id` / `.ids`, never null or only nested","detail":"Given the uniform output envelope, when I run an id-minting / entity mutation (observation add, rule create/edit/promote/retire/graduate, consolidate), then the relevant id(s) are reachable at a predictable top-level path (.id for single, .ids for many), never null and never only nested. (feedback echoes the feedback ids it acted on as ids; rebuild carries counts only.)","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestObservationAddExposesTopLevelID|TestConsolidateDeterministicIDs'","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddExposesTopLevelID","auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs"]},"decisions":["D3","D5","D7"],"phases":["P1","P2","P3"],"source":"AC-4"},{"id":"AC5","goal":"G3","title":"Collection rows expose `.id` without data loss","given":"`retrieve`, `select`, `rule list`, `observation list`, `events list`, `gap list`","when":"their JSON is parsed","then":"each row id at a uniform path; prior fields kept; skill refs + quickstart updated","detail":"Given the envelope migration of retrieve, select, rule list, observation list, events list, gap list, when I parse their JSON, then each element's id is reachable at a uniform path (.[].id or .results[].id), every field present before the change is still present, and the reflect-playbook skill refs + quickstart are updated to the new paths.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestObservationListElementsCarryID && go test ./cmd/autoreflect -run TestE2ELoopQuickstart","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationListElementsCarryID","auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart"]},"decisions":["D7"],"phases":["P1","P3"],"source":"AC-5"},{"id":"AC6","goal":"G4","title":"Consolidate is deterministic and idempotent","given":"one consolidation delta document","when":"`consolidate --dry-run` then `consolidate`, then apply again","then":"same rule id in both runs; second apply adds no duplicate","detail":"Given one consolidation delta document, when I run consolidate --dry-run and then consolidate (separate invocations), then the rule id is identical across both; and re-running the same consolidate a second time is a no-op (no duplicate rule) because the content-derived id already exists.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestConsolidateDeterministicIDs|TestObservationAddIsIdempotent' && go test ./internal/idhash","tests":["auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs","auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddIsIdempotent","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDeterministic"]},"decisions":["D4","D8","D9"],"phases":["P1","P2"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"Ids keep their format","given":"content-derived minting","when":"rule / observation ids are generated","then":"still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; validators unchanged","detail":"Given content-derived minting, when rule/observation ids are generated, then they still match ^r-[0-9a-f]{8}$ / ^ob-[0-9a-f]{8}$; existing validators are unchanged; events already on disk keep their original ids.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/idhash ./internal/observations -run 'TestDerive|TestNewObservationIDFormat|TestCanonicalPartsDeriveStableID'","tests":["auto-reflect/internal/idhash/idhash_test.go:TestDeriveFormat","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDifferentPartsDifferentID","auto-reflect/internal/observations/model_test.go:TestNewObservationIDFormat","auto-reflect/internal/observations/model_test.go:TestCanonicalPartsDeriveStableID"]},"decisions":["D6"],"phases":["P1","P2"],"source":"AC-7"},{"id":"AC8","goal":"G6","title":"init writes an idempotent .gitignore","given":"a repo","when":"`auto reflect init` runs (twice)","then":"`.auto/reflect/.gitignore` ignores `playbook.json`, not `events/`; not rewritten","detail":"Given a repo, when I run auto reflect init (or init --project), then .auto/reflect/.gitignore exists and ignores playbook.json (not events/); running init again does not overwrite or duplicate it.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestInitWritesStateGitignore|TestInitGitignoreIdempotent'","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore","auto-reflect/internal/cli/init_test.go:TestInitGitignoreIdempotent"]},"decisions":["D2","D10"],"phases":["P7"],"source":"AC-8"},{"id":"AC9","goal":"G6","title":"Canonical events tracked, cache ignored","given":"the repo's own `.auto/reflect/`","when":"git status is checked after init","then":"`events/*.jsonl` committable; `playbook.json` untracked","detail":"Given the repo's own .auto/reflect/, when I check git status after init, then .auto/reflect/events/*.jsonl is tracked/committable and playbook.json is untracked (removed from the index with git rm --cached if previously tracked).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestInitWritesStateGitignore && git ls-files .auto/reflect","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore"]},"decisions":["D2"],"phases":["P7"],"source":"AC-9"},{"id":"AC10","goal":"G6","title":"doctor detects stale or partial state","given":"missing `events/`, stale snapshot, or legacy `feedback.jsonl`","when":"`auto reflect doctor`","then":"JSON `[{check,status,message,hint}]`; hints on failures; exit 1 on any fail","detail":"Given a partial reflect state (e.g. state dir present but events/ missing, or playbook.json stale vs the folded event log), when I run auto reflect doctor, then it returns structured JSON [{check,status,message,hint}], each failure carries a concrete remediation hint, and the process exits non-zero on any fail.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestDoctor","tests":["auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorHealthyAllPass","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorMissingEventsFails","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorStaleSnapshotWarns","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorLegacyFeedbackWarns"]},"decisions":["D11"],"phases":["P6"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"Rule listings carry timestamps","given":"a folded rule with timestamps set by `Fold`","when":"`rule list` and `rule get`","then":"both expose non-empty `created_at` / `updated_at`","detail":"Given a folded rule with created_at/updated_at set by Fold, when I run auto reflect rule list and rule get, then both expose non-empty created_at/updated_at (list no longer drops them in its projection map).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/rules -run TestFoldSurfacesTimestampsForListView","tests":["auto-reflect/internal/rules/projection_test.go:TestFoldSurfacesTimestampsForListView"]},"decisions":["D12"],"phases":["P3"],"source":"AC-11"},{"id":"AC12","goal":"G7","title":"outcome enum and correction_density documented","given":"the docs","when":"a reader consults quickstart and skill references","then":"`outcome` enum (distinct from ack status) and `correction_density` definition + scale are documented","detail":"Given the docs, when a reader consults quickstart and the reflect-playbook references, then the feedback outcome enum (success|partial|fail|abandoned, distinct from miner ack status) and correction_density (definition + scale) are documented; a malformed outcome error already names the valid set.","verify":{"kind":"manual","cmd":"auto reflect quickstart | grep -E 'abandoned|correction_density'; grep -n correction_density skills/reflect-playbook/references/mine.md","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"Legacy yaml removed","given":"the superseded process artifacts","when":"the task lands","then":"`docs/reflection/observations.yaml` deleted; only retired `playbook-*` skills referenced it","detail":"Given the superseded process artifacts, when the task lands, then docs/reflection/observations.yaml is deleted and the reflect-playbook 'supersedes' note reflects the removal. The only remaining referencers are the already-superseded playbook-observe/-refine/-search skills (no Go code reads the file); per F11 a future run would regenerate an empty file — the discard is intended.","verify":{"kind":"manual","cmd":"git ls-tree 34d1d22 docs/reflection/observations.yaml  # expect empty; git grep -n 'observations.yaml' 34d1d22 -- '*.go'","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-13"},{"id":"AC14","goal":"G1","title":"No regressions; the e2e loop runs through gap list","given":"all changes","when":"`go build ./...` and the full auto-reflect suite run","then":"all green with assertions moved to the new envelope; loop completes through `gap list`","detail":"Given all changes, when I run go build ./... and the full auto-reflect test suite, then everything builds and passes (existing assertions updated to the new envelope), and the end-to-end reflect loop completes as in quickstart.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go build ./... && go test ./...","tests":["auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EPromoteTaskGate","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2ELifecycleRetrieval","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EGraduateEnforced"]},"decisions":[],"phases":["P1","P2","P3","P4","P5","P6","P7"],"source":"AC-14"}],"decisions":[{"id":"D1","title":"Gaps get a dedicated `gap list` command","chosen":"Dedicated `auto reflect gap list` noun","why":"Matches the gap -> observation mental model and is discoverable.","rejected":[{"option":"Generic `events list --full/--payload` flag","why":"Payload dump, not a gap view; hides the loop-back.","wouldBreak":["G1"]},{"option":"Both","why":"Two surfaces for one need.","wouldBreak":[]}],"by":"charlie","goals":["G1"],"acs":["AC1","AC2"],"source":"D-1"},{"id":"D2","title":"The event log is git-tracked","chosen":"`events/*.jsonl` committed; `.gitignore` ignores only `playbook.json`","why":"Shared playbook history travels with the repo; any clone can `rebuild`.","rejected":[{"option":"Ignore events too (machine-local state)","why":"Loses shared history across clones and hosts.","wouldBreak":["AC9"]}],"by":"charlie","goals":["G6"],"acs":["AC8","AC9"],"source":"D-2"},{"id":"D3","title":"Restructure to a uniform envelope (breaking)","chosen":"Normalize output shapes around top-level ids","why":"Cleanest end state; consumers and skill refs move in lockstep.","rejected":[{"option":"Additive-only `.id`/`.ids` on today's shapes","why":"Leaves the inconsistent nesting in place.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-3"},{"id":"D4","title":"Content-derived ids ship in this task","chosen":"Implement F7 now, not as a follow-up","why":"Deterministic ids make `--dry-run` output actionable; fits the output-contract theme.","rejected":[{"option":"Defer F7 to a follow-up","why":"Dry-run previews stay un-actionable.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-4"},{"id":"D5","title":"Envelope changes CLI output only, not stored events","chosen":"Presentation-layer restructure; payload names + `schema_version=1` untouched","why":"The append-only log must fold identically forever; the playbook is a disposable view.","rejected":[{"option":"Rename stored payload fields / bump schema","why":"Breaks the append-only on-disk contract.","wouldBreak":["AC14"]}],"by":"agent","goals":["G3"],"acs":["AC4"],"source":"D-5"},{"id":"D6","title":"Content-derived ids keep existing formats","chosen":"Only minting changes (random -> hash prefix); regexes stay","why":"Existing ids stay valid and validators unchanged.","rejected":[{"option":"New / longer id format","why":"Invalidates validators and on-disk ids.","wouldBreak":["AC7"]}],"by":"agent","goals":["G4"],"acs":["AC7"],"source":"D-6"},{"id":"D7","title":"Top-level id on mutations, per-row id on reads","chosen":"Mutations expose `.id`/`.ids`; collections stay arrays with row `.id`","why":"Predictable threading with minimal breakage; lists still return plain payloads.","rejected":[{"option":"Wrap every command in `{ok,data}`","why":"Over-wraps reads, breaks more consumers, fights list convention.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4" };

   file's first phase. */
const SYM_PHASE = {
  '062': {'harness/src/harness/scenarios/mail_flow.py::MailFlowScenario.subscribe':'P2'}

const LAYERS = ['Agent','Harness','CLI','Seam','Hook','Domain','Store','SQLite','FS'];
const LAYER_COL = {Agent:'#f1948a',Harness:'#d7bde2',CLI:'#6cc3ff',Seam:'#48c9b0',Hook:'#c39bf0',Domain:'#f7df72',Store:'#f4b247',SQLite:'#eb984e',FS:'#a3e4d7'};

/* ================= derive the replay timeline ================= */
function derive(id){
  const M = ALL[id];
  const n = M.phases.length;
  const pi = {}; M.phases.forEach((p,i)=>pi[p.id]=i+1);
  const fileBy = {}; M.files.forEach(f=>fileBy[f.path]=f);
  const ptext = [''].concat(M.phases.map(p=>[p.title,p.summary,p.commit].join(' ')));
  const ticks = [{kind:'base'}], cp=[0], pstart=[0], fileTick={};
  M.phases.forEach((p,i)=>{
    const k=i+1, seen=new Set(), list=[];
    (p.files||[]).forEach(fp=>{ if(fileBy[fp] && !seen.has(fp)){ seen.add(fp); list.push(fp);} });
    M.files.forEach(f=>{ if((f.phases||[]).includes(p.id) && !seen.has(f.path)){ seen.add(f.path); list.push(f.path);} });
    pstart[k]=ticks.length;
    list.forEach(fp=>{ (fileTick[fp]=fileTick[fp]||{})[k]=ticks.length; ticks.push({kind:'file',phase:k,file:fp}); });
    cp[k]=ticks.length; ticks.push({kind:'cp',phase:k});
  });
  const SHIP = ticks.length; ticks.push({kind:'ship'});
  const phaseOfTick = t => { if(t===0) return 0; for(let k=1;k<=n;k++) if(t<=cp[k]) return k; return n+1; };

  const syms = {}; // key path::name
  const files = M.files.map(f=>{
    const ph = (f.phases||[]).map(x=>pi[x]).filter(Boolean).sort((a,b)=>a-b);
    const first = ph[0];
    const firstTick = first ? fileTick[f.path][first] : (f.change==='context' ? 0 : SHIP);
    const F = {src:f, path:f.path, change:f.change, phases:ph, post: !first && f.change!=='context',
      born: f.change==='add' ? firstTick : 0,
      goneAt: f.change==='delete' ? firstTick : Infinity,
      touchTicks: ph.map(k=>fileTick[f.path][k]), syms:[]};
    f.symbols.forEach(s=>{
      let ch = f.change==='add' ? 'add' : (f.change==='context' ? 'same' : s.change);
      let k = first, tick = 0;
      if(ch!=='same'){
        const o = (SYM_PHASE[id]||{})[f.path+'::'+s.name]; if(o && pi[o] && ph.includes(pi[o])) k = pi[o];
        tick = k ? fileTick[f.path][k] : SHIP;
      }
      const S = {src:s, key:f.path+'::'+s.name, file:F, name:s.name, kind:s.kind, change:ch, tick, phase: ch==='same'?0:(k||n+1)};
      syms[S.key]=S; F.syms.push(S);
    });
    return F;
  });
  const fileMap = {}; files.forEach(F=>fileMap[F.path]=F);
  const symExists = (S,t) => S.change==='add' ? t>=S.tick : S.change==='delete' ? t<S.tick : true;
  const symDone = (S,t) => S.change==='same' ? true : t>=S.tick;
  const fileExists = (F,t) => t>=F.born && t<F.goneAt;

  // ACs
  const acs = M.acs.map(a=>{
    const ks = (a.phases||[]).map(x=>pi[x]).filter(Boolean);
    return {src:a, id:a.id, ks, doneAt: ks.length?Math.max(...ks):n, doneTick: cp[ks.length?Math.max(...ks):n],
      tests:(a.verify&&a.verify.tests)||[]};
  });
  const acMap={}; acs.forEach(a=>acMap[a.id]=a);
  const acProg = (A,t) => A.ks.length ? A.ks.filter(k=>t>=cp[k]).length/A.ks.length : (t>=A.doneTick?1:0);

  // findings / rails
  const fixedAt = {};
  M.phases.forEach((p,i)=>{ (p.commit.match(/F\d+/g)||[]).forEach(fid=>{ if(!fixedAt[fid]) fixedAt[fid]=cp[i+1]; }); });
  const tris = (M.rails||M.findings||[]).map(r=> M.rails ? {id:r.id,title:r.title,text:r.text,ac:r.ac,src:r, onTick: acMap[r.ac]?acMap[r.ac].doneTick:SHIP}
                                                  : {id:r.id,title:r.title,text:r.fix,ac:null,src:r, onTick: fixedAt[r.id]!=null?fixedAt[r.id]:(r.priority==='deferred'?Infinity:SHIP)});

  // callstacks
  const green = M.plan.kind==='greenfield';
  const cs = M.callstacks.map(c=>{
    const frames = c.frames.map(fr=>({src:fr, sym: syms[fr.file+'::'+fr.symbol] || null}));
    const before = /^BEFORE/i.test(c.title), after=/^AFTER/i.test(c.title);
    // phases in which this journey's ACs are worked on: in brownfield, an edited
    // frame only "counts" if it is renovated for this journey's ACs
    const rel = new Set(); (c.acs||[]).forEach(a=>{ const A=acMap[a]; if(A) A.ks.forEach(k=>rel.add(k)); });
    const counts = f => f.sym && (f.sym.change==='add' || (f.sym.change==='edit' && !before && (green || rel.has(f.sym.phase))));
    let ready = 0;
    frames.forEach(f=>{ if(counts(f)) ready=Math.max(ready,f.sym.tick); });
    return {src:c, id:c.id, frames, before, after, counts, readyTick: before?0:ready, readyPhase: phaseOfTick(before?0:ready)};
  });
  const afterCs = cs.find(c=>c.after);
  cs.forEach(c=>{ c.retireTick = (c.before && afterCs) ? afterCs.readyTick : Infinity; });
  const isCmd = S => /^new\w*Cmd$/.test(S.name) && !/Root/.test(S.name);
  const csState = (C,t) => {
    if(t>=C.retireTick) return {st:'retired', missing:[], pend:[]};
    const missing = C.frames.filter(f=>f.sym && !symExists(f.sym,t));
    const pend = C.before?[]:C.frames.filter(f=>C.counts(f) && !symDone(f.sym,t));
    // greenfield: any unbuilt frame locks the journey. brownfield: the journey
    // already runs on the old code unless its command itself is new.
    const locked = green ? missing.length>0 : missing.some(f=>isCmd(f.sym));
    return {st: locked?'locked':pend.length?'legacy':'ready', missing: locked?missing:[], pend};
  };
  // deps
  const dirOf = p => p.slice(0,p.lastIndexOf('/'));
  const nodeOfFile = {};
  M.deps.nodes.forEach(nd=>{ (nd.files||[]).forEach(fp=>nodeOfFile[fp]=nd.id); });
  files.forEach(F=>{ if(!nodeOfFile[F.path]){ const nd=M.deps.nodes.find(x=>x.id===dirOf(F.path)||x.id===F.path); if(nd) nodeOfFile[F.path]=nd.id; } });
  const nodes = M.deps.nodes.map(nd=>{
    const fs = files.filter(F=>nodeOfFile[F.path]===nd.id);
    let born = 0;
    if(nd.change==='add'){ const bs = fs.filter(F=>F.change==='add').map(F=>F.born); born = bs.length?Math.min(...bs):0; }
    return {src:nd, id:nd.id, kind:nd.kind, change:nd.change, files:fs, born};
  });
  const nodeMap={}; nodes.forEach(N=>nodeMap[N.id]=N);
  const ov = EDGE_PHASE[id]||{};
  const edges = M.deps.edges.filter(e=>nodeMap[e.from]&&nodeMap[e.to]).map(e=>{
    let born = 0;
    if(e.change==='add'){
      born = Math.max(nodeMap[e.from].born, nodeMap[e.to].born);
      const o = ov[e.from+'|'+e.to];
      if(o){ const k=pi[o]; const ff = nodeMap[e.from].files.map(F=>fileTick[F.path]&&fileTick[F.path][k]).filter(x=>x!=null); born = ff.length?Math.min(...ff):pstart[k]; }
    }
    return {src:e, from:e.from, to:e.to, change:e.change, born};
  });

  const div = (DIVERGE[id]||[]).map(d=>({...d, k: d.phase==='ship'? n+1 : pi[d.phase]}));
  return {id, M, n, pi, ticks, cp, pstart, SHIP, phaseOfTick, files, fileMap, syms, symExists, symDone, fileExists,
          acs, acMap, acProg, tris, cs, csState, nodes, nodeMap, nodeOfFile, edges, div};
}

/* ================= state ================= */
const DERIVED = {};
const S = {plan:'062', t:0, playing:false, timer:null, sel:null, ghosts:true, gates:true, cs:null, frame:-1, fplay:null, openCp:null, quiz:{}};

let prevT = 0;

function renderSegs(){
  const segs = $('#segs'); segs.innerHTML='';
  const total = D.ticks.length;
  const mk = (cls, flex, html, k) => { const d=document.createElement('div'); d.className='seg '+cls; d.style.flex=flex; d.innerHTML='<div class="fill"></div>'+html; d.dataset.k=k; segs.appendChild(d); return d; };
  mk('base', '0 0 34px', '<div class="lab"><b>P0</b></div>', 0);
  D.M.phases.forEach((p,i)=>{
    const k=i+1, cnt = D.cp[k]-D.pstart[k]+1;
    const nd = D.div.filter(d=>d.k===k).length;
    let ticks=''; for(let j=0;j<cnt-1;j++) ticks+='<i></i>'; ticks+='<i class="cpk"></i>';
    const sg = mk('', cnt+' 1 0', `<div class="lab"><b>${p.id}</b><span>${esc(p.title)}</span></div>${nd?`<span class="divb" title="${nd} plan-vs-built divergence(s)">≠${nd}</span>`:''}<div class="ticks">${ticks}</div>`, k); sg.title = p.id+' · '+p.title;
  });
  mk('ship', '0 0 58px', `<div class="lab"><b>■</b><span>ship</span></div>`, D.n+1);
}

function tickToX(t){
  // map a tick to x% across the custom track
  const segs = [...document.querySelectorAll('#segs .seg')];
  const k = D.phaseOfTick(t);
  const seg = segs[Math.min(k, segs.length-1)];
  if(!seg) return 0;
  const tr = $('#track').getBoundingClientRect(), r = seg.getBoundingClientRect();
  let f;
  if(k===0) f=.5; else if(k>D.n) f=.5; else { const a=D.pstart[k], b=D.cp[k]; const cnt=b-a+1; f = (t-a+1)/cnt - .5/cnt; }
  return r.left - tr.left + r.width*f;
}
function xToTick(x){
  const segs = [...document.querySelectorAll('#segs .seg')];
  const tr = $('#track').getBoundingClientRect();
  for(let i=0;i<segs.length;i++){
    const r = segs[i].getBoundingClientRect(); const lx=r.left-tr.left, rx=r.right-tr.left+3;
    if(x<=rx || i===segs.length-1){
      const k=+segs[i].dataset.k;
      if(k===0) return 0; if(k>D.n) return D.SHIP;
      const a=D.pstart[k], b=D.cp[k], cnt=b-a+1;
      const f = Math.max(0, Math.min(.9999,(x-lx)/r.width));
      return a + Math.floor(f*cnt);
    }
  }
  return D.SHIP;
}

function renderOverview(){
  const M = D.M, green = M.plan.kind==='greenfield';
  let h = `<div class="ovhead"><span class="kind ${green?'g':'b'}">${green?'GREENFIELD · EMPTY LOT → NEW MODULE':'BROWNFIELD · RENOVATION IN PLACE'}</span>
    <h1>${esc(M.plan.id)} · ${esc(M.plan.title)}</h1><p>${md(M.plan.oneLiner)}</p>
    <div class="commits">${esc(M.plan.baseCommit)} → ${esc(M.plan.builtCommit)} · <a href="${esc(M.plan.pr)}" style="color:inherit" target="_blank" rel="noopener">PR</a></div></div>`;

  h += `</div><div class="oblock"><div class="olab"><span>◆ DECISIONS</span><span>${M.decisions.length}</span></div><div class="strip">${M.decisions.map(d=>`<span class="dia" data-d="${d.id}" data-sel="D:${d.id}" title="${esc(d.title)}">${d.id}</span>`).join('')}</div></div>`;
  h += `<div class="oblock"><div class="olab"><span>▲ ${M.rails?'RAILS (honoured when their AC is proven)':'FINDINGS (fixed by phase)'}</span><span>${D.tris.length}</span></div><div class="strip">${D.tris.map(r=>`<span class="tri" data-tri="${r.id}" data-sel="R:${r.id}" title="${esc(r.title)}">${r.id}</span>`).join('')}</div></div>`;
  h += `<div class="oblock"><div class="olab"><span>▷ PHASES</span><span>click = jump to checkpoint</span></div><div class="phrow">${M.phases.map((p,i)=>`<button data-jump="${i+1}" title="${esc(p.title)}">${p.id}</button>`).join('')}</div></div>`;

  <div class="note">Phase attribution is replayed from the plan's per-phase file lists; the code itself landed as one squash commit (${esc(M.plan.builtCommit)}). A symbol is dated to the first phase that touches its file.</div>`;
