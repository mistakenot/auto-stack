}

function buildTreeData(){
  const root = {name:'', dirs:{}, files:[]};
  D.files.forEach(F=>{
    const parts = F.path.split('/'); let node=root;
    for(let i=0;i<parts.length-1;i++){ node = node.dirs[parts[i]] || (node.dirs[parts[i]]={name:parts[i],dirs:{},files:[]}); }
    node.files.push(F);
  });
  // compress single-child chains
  const compress = nd => {
    Object.values(nd.dirs).forEach(compress);
    const ks = Object.keys(nd.dirs);
    Object.keys(nd.dirs).forEach(k=>{
      let c = nd.dirs[k];
      while(!c.files.length && Object.keys(c.dirs).length===1){ const only=Object.values(c.dirs)[0]; c = {name:c.name+'/'+only.name, dirs:only.dirs, files:only.files}; }
      nd.dirs[k]=c;
    });
  };
  compress(root);
  return root;
}
function renderTree(){
  const root = buildTreeData();
  const green = D.M.plan.kind==='greenfield';
  const glyph = {add:'+',edit:'~',delete:'−',context:'·'};
  const fileHtml = F => {
    const main = F.syms.filter(s=>s.kind!=='test'), tests = F.syms.filter(s=>s.kind==='test');
    const chip = s => `<span class="sym k-${s.kind}" data-sym="${esc(s.key)}" data-sel="S:${esc(s.key)}" title="${esc((s.src.sig||s.name)+(s.src.note?' — '+s.src.note:''))}">${esc(s.name)}</span>`;
    const ph = F.phases.length ? F.phases.map(k=>'P'+k).join(' ') : (F.post?'post-merge':(green?'neighbour':'as found'));
    return `<div class="file" data-file="${esc(F.path)}" data-ch="${F.change}"><div class="frow" data-sel="F:${esc(F.path)}"><span class="fg">${glyph[F.change]||'·'}</span><span class="fn">${esc(F.path.split('/').pop())}</span><span class="fmeta">${ph}</span></div>
      ${main.length?`<div class="syms">${main.map(chip).join('')}</div>`:''}
      ${tests.length?`<span class="tgrp" data-tg="1">▸ <span class="tc">${tests.length}</span> tests</span><div class="syms tsyms">${tests.map(chip).join('')}</div>`:''}</div>`;
  };
  const dirHtml = (nd, path) => {
    const weight = d => { let w=0; const walk=x=>{ x.files.forEach(F=>{ if(F.change!=='context') w++; }); Object.values(x.dirs).forEach(walk); }; walk(d); return w; };
    const ds = Object.values(nd.dirs).sort((a,b)=> path? a.name.localeCompare(b.name) : (weight(b)-weight(a) || a.name.localeCompare(b.name)));
    const fs = nd.files.slice().sort((a,b)=>a.path.localeCompare(b.path));
    return ds.map(d=>{ const p=path?path+'/'+d.name:d.name; return `<div class="dir" data-dir="${esc(p)}"><div class="dname">${esc(d.name)}/<span class="dc"></span></div><div class="dkids">${dirHtml(d,p)}</div></div>`; }).join('') + fs.map(fileHtml).join('');
  };
  $('#tree').innerHTML = dirHtml(root,'');
  // cache elements
  D.fileEl = {}; D.symEl = {};
  document.querySelectorAll('#tree .file').forEach(el=>D.fileEl[el.dataset.file]=el);
  document.querySelectorAll('#tree .sym').forEach(el=>D.symEl[el.dataset.sym]=el);
  D.dirEls = [...document.querySelectorAll('#tree .dir')];
}

function shortPkg(id){
  const p=id.split('/');
  if(id.endsWith('.md')) return p[p.length-1].replace('.md','');
  if(p[0].includes('.')&&p.length>1) return p[p.length-1];
  if(p.length<=2) return p.slice(1).join('/')||p[0];
  return p.slice(1).join('/');
}
function renderGraph(){
  const nodes = D.nodes, edges = D.edges;
  const out={}, inc={}; nodes.forEach(N=>{out[N.id]=[];inc[N.id]=[];});
  edges.forEach(e=>{ out[e.from].push(e.to); inc[e.to].push(e.from); });
  const rank={}; const R = (id,seen) => { if(rank[id]!=null) return rank[id]; if(seen.has(id)) return 0; seen.add(id); const ps=inc[id]; const r = ps.length?Math.max(...ps.map(p=>R(p,seen)+1)):0; seen.delete(id); return rank[id]=r; };
  nodes.forEach(N=>R(N.id,new Set()));
  // pull pure sinks (externals, shared) as far right as their deepest in-neighbour allows
  const maxR = Math.max(...Object.values(rank));
  const cols=[]; nodes.forEach(N=>{ (cols[rank[N.id]]=cols[rank[N.id]]||[]).push(N.id); });
  for(let it=0;it<6;it++){
    cols.forEach((col,ci)=>{ if(!ci) return; const pos={}; cols[ci-1].forEach((id,j)=>pos[id]=j);
      const bc = id => { const ps=inc[id].filter(p=>pos[p]!=null); return ps.length? ps.reduce((a,p)=>a+pos[p],0)/ps.length : 1e3; };
      col.sort((a,b)=>bc(a)-bc(b)); });
  }
  const NW=112, NH=24, CW=122, RH=40, pad=6;
  const avail = Math.max(360, ($('#graph').clientWidth||560)-20);
  const per = Math.max(3, Math.floor(avail/CW));
  // vertical layout: each rank is a row; long ranks wrap into staggered sub-rows
  const P={}; let y=pad, W=Math.min(per, Math.max(...cols.map(c=>c.length)))*CW;
  cols.forEach(col=>{
    for(let i=0;i<col.length;i+=per){
      const chunk=col.slice(i,i+per); const off=(W-chunk.length*CW)/2 + (i?CW/2*((i/per)%2):0);
      chunk.forEach((id,j)=>P[id]={x:Math.min(W-CW,off+j*CW)+5,y});
      y+=RH;
    }
  });
  const H=y+pad-(RH-NH);
  const modCol = m => ({'auto-mail':'#5fd394','auto-cli':'#6cc3ff','auto-shared':'#8a8f9d','auto-reflect':'#f4b247','harness':'#c39bf0'})[m]||'#555b69';
  let s = `<svg viewBox="0 0 ${W+10} ${H}" preserveAspectRatio="xMidYMin meet" style="max-width:${W+10}px;margin:0 auto">`;
  edges.forEach((e,i)=>{ const a=P[e.from], b=P[e.to];
    let d;
    if(b.y>a.y){ const x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y, my=(y1+y2)/2; d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`; }
    else if(b.y===a.y){ const l=a.x<b.x; const x1=l?a.x+NW:a.x, x2=l?b.x:b.x+NW, y1=a.y+NH/2; d=`M${x1},${y1} C${(x1+x2)/2},${y1-18} ${(x1+x2)/2},${y1-18} ${x2},${y1}`; }
    else { const x1=a.x+NW, y1=a.y+NH/2, x2=b.x+NW, y2=b.y+NH/2; d=`M${x1},${y1} C${x1+40},${y1} ${x2+40},${y2} ${x2},${y2}`; }
    s+=`<path class="ge ${e.change}" data-e="${i}" d="${d}"><title>${esc(e.from+' → '+e.to+(e.src.note?' — '+e.src.note:''))}</title></path>`; });
  nodes.forEach(N=>{ const p=P[N.id]; const lab=shortPkg(N.id); const mod=N.src.module||N.id.split('/')[0];
    s+=`<g class="gn k-${N.change} k-${N.kind}" data-n="${esc(N.id)}" data-sel="N:${esc(N.id)}" transform="translate(${p.x},${p.y})"><title>${esc(N.id)}</title><rect width="${NW}" height="${NH}" rx="5"/><rect width="3" height="${NH}" rx="1.5" style="fill:${modCol(mod)};stroke:none"/><text x="8" y="16">${esc(lab.length>16?lab.slice(0,15)+'…':lab)}</text></g>`; });
  s+='</svg>';
  $('#graph').innerHTML = s;
  $('#depsub').textContent = `${nodes.length} packages · ${edges.length} imports`;
  const fb = D.M.deps.forbidden||[];
  $('#forb').innerHTML = fb.length ? `<button class="fbt">▲ ${fb.length} forbidden imports ▸</button><div class="fbl">${fb.map(f=>`<span title="${esc(f.why+' — enforced by '+f.enforcedBy)}">${esc(f.from)} ↛ ${esc(f.to)}</span>`).join('')}</div>` : '';
}

/* ================= per-tick update ================= */
function update(full){
  const t = S.t, T = D.ticks[t], k = D.phaseOfTick(t);
  const green = D.M.plan.kind==='greenfield';
  // scrubber
  document.querySelectorAll('#segs .seg').forEach(seg=>{
    const sk=+seg.dataset.k; const fill=seg.querySelector('.fill');
    let f=0;
    if(sk===0) f=1; else if(sk>D.n) f = t>=D.SHIP?1:0; else { const a=D.pstart[sk], b=D.cp[sk]; f = t<a?0 : t>=b?1 : (t-a+1)/(b-a+1); }
    fill.style.width=(f*100)+'%';
    seg.classList.toggle('done', sk>=1 && sk<=D.n && t>=D.cp[sk]);
    seg.classList.toggle('cur', sk===k);
  });
  $('#head').style.left = tickToX(t)+'px';
  let nowH;
  if(T.kind==='base') nowH = `<b>P0 · ${green?'empty lot':'as found'}</b><code>${esc(D.M.plan.baseCommit)}</code> — ${green?'only the neighbours exist':'the existing neighbourhood'}`;
  else if(T.kind==='file'){ const idx=t-D.pstart[T.phase]+1, cnt=D.cp[T.phase]-D.pstart[T.phase]; const F=D.fileMap[T.file]; nowH = `<b>${D.M.phases[T.phase-1].id} · ${idx}/${cnt} ${F.change==='add'?'+ building':F.change==='delete'?'− removing':'~ renovating'}</b><code>${esc(T.file)}</code>`; }
  else if(T.kind==='cp') nowH = `<b>▷ ${D.M.phases[T.phase-1].id} checkpoint</b>${esc(D.M.phases[T.phase-1].title)}`;
  else nowH = `<b>■ shipped</b><code>${esc(D.M.plan.builtCommit)}</code> merged`;
  $('#now').innerHTML = nowH;
  $('#pl').textContent = S.playing?'❚❚':'▶';

  // files + symbols
  let nb=0, nr=0, ng=0, totalAdd=0, totalEdit=0;
  const curFile = T.kind==='file' ? T.file : null;
  D.files.forEach(F=>{
    const el = D.fileEl[F.path]; if(!el) return;
    const ex = D.fileExists(F,t), gone = F.change==='delete' && t>=F.goneAt;
    el.classList.toggle('ghost', !ex && !gone);
    el.classList.toggle('gone', gone);
    el.classList.toggle('landing', F.path===curFile);
    el.classList.toggle('touched', k>=1 && k<=D.n && F.phases.includes(k) && F.touchTicks.some(tt=>tt<=t && D.phaseOfTick(tt)===k));
    el.classList.toggle('post', F.post);
    let liveTests=0;
    F.syms.forEach(Sy=>{
      const se = D.symEl[Sy.key]; if(!se) return;
      const exists = D.symExists(Sy,t), done = D.symDone(Sy,t);
      if(Sy.change==='add'){ totalAdd++; if(exists) nb++; }
      if(Sy.change==='edit'){ totalEdit++; if(done) nr++; }
      if(Sy.change==='delete' && !exists) ng++;
      se.classList.toggle('ghost', !exists && Sy.change!=='delete');
      se.classList.toggle('gone', Sy.change==='delete' && !exists);
      se.classList.toggle('born', Sy.change==='add' && exists);
      se.classList.toggle('reno', Sy.change==='edit' && done);
      se.classList.toggle('pend', Sy.change==='edit' && !done);
      se.classList.toggle('live', exists);
      const fresh = !full && ((Sy.change==='add'||Sy.change==='edit') && Sy.tick<=t && Sy.tick>prevT);
      if(fresh){ se.classList.remove('fresh'); void se.offsetWidth; se.classList.add('fresh'); }
      if(Sy.kind==='test' && exists) liveTests++;
    });
    const tc = el.querySelector('.tc'); if(tc){ const tot=F.syms.filter(s=>s.kind==='test').length; tc.textContent = liveTests===tot?tot:`${liveTests}/${tot}`; }
  });
  D.dirEls.forEach(dl=>{
    const all = dl.querySelectorAll('.file'); let vis=0; all.forEach(f=>{ if(!f.classList.contains('ghost')) vis++; });
    dl.classList.toggle('empty', vis===0);
    dl.querySelector(':scope>.dname .dc').textContent = vis===all.length? all.length : `${vis}/${all.length}`;
  });
  $('#fscount').innerHTML = green
    ? `<span class="a">+${nb}/${totalAdd} symbols</span>${ng?`<span class="d">−${ng}</span>`:''}${totalEdit?`<span class="e">~${nr}/${totalEdit}</span>`:''}`
    : `<span class="e">~${nr}/${totalEdit} renovated</span><span class="a">+${nb}/${totalAdd} new</span>${ng?`<span class="d">−${ng}</span>`:''}`;
  if(curFile && S.playing) scrollTreeTo(curFile);

  // graph
  document.querySelectorAll('#graph .gn').forEach(g=>{
    const N = D.nodeMap[g.dataset.n];
    const ex = t>=N.born;
    g.classList.toggle('ghost', !ex);
    g.classList.toggle('busy', !!curFile && D.nodeOfFile[curFile]===N.id);
    g.classList.toggle('reno', N.change==='edit' && N.files.some(F=>F.touchTicks.some(tt=>tt<=t)));
    g.classList.toggle('fresh', N.change==='add' && ex);
  });
  document.querySelectorAll('#graph .ge').forEach(p=>{
    const E = D.edges[+p.dataset.e];
    p.classList.toggle('ghost', t<E.born);
    const fr = !full && E.born<=t && E.born>prevT && E.change==='add';
    if(fr){ p.classList.add('fresh'); setTimeout(()=>p.classList.remove('fresh'),1400); }
  });

  // callstacks
  let ready=0;
  document.querySelectorAll('#cslist .csr').forEach(r=>{
    const C = D.cs.find(c=>c.id===r.dataset.cs); const st = D.csState(C,t);
    const prevSt = D.csState(C,prevT).st;
    r.classList.remove('locked','legacy','ready','retired'); r.classList.add(st.st);
    if(st.st==='ready') ready++;
    r.querySelector('.cst').textContent = st.st==='locked' ? `◌ ${st.missing.length} missing` : st.st==='legacy' ? `~ old path · ${st.pend.length} to change` : st.st==='retired' ? 'retired' : (C.before?'▶ as found':'▶ playable');
    if(!full && prevSt!==st.st && st.st==='ready'){ r.classList.remove('unlock'); void r.offsetWidth; r.classList.add('unlock'); }
  });
  $('#cssub').textContent = `${ready}/${D.cs.length} ${green?'playable':'running as planned'}`;

  // overview
  let ver=0;
  D.acs.forEach(A=>{
    const p = D.acProg(A,t), pp = D.acProg(A,prevT);
    document.querySelectorAll(`.acq[data-ac="${A.id}"]`).forEach(el=>{
      el.classList.toggle('ok', p>=1); el.classList.toggle('part', p>0 && p<1); el.style.setProperty('--p', Math.round(p*100)+'%');
      if(!full && p>=1 && pp<1){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    });
    if(p>=1) ver++;
  });
  $('#acsum').textContent = `${ver}/${D.acs.length} ✓`;
  document.querySelectorAll('#ov .goal').forEach(g=>{
    const gid = g.dataset.sel.slice(2); const as = D.acs.filter(a=>a.src.goal===gid);
    const p = as.length ? as.reduce((s,a)=>s+D.acProg(a,t),0)/as.length : 0;
    g.querySelector('.rg').setAttribute('stroke-dasharray', `${(p*69.1).toFixed(1)} 70`);
    g.classList.toggle('done', p>=1);
  });
  document.querySelectorAll('#ov .dia').forEach(el=>{
    const d = D.M.decisions.find(x=>x.id===el.dataset.d);
    el.classList.toggle('on', (d.acs||[]).some(a=>D.acMap[a] && D.acProg(D.acMap[a],t)>0) || t>=D.SHIP);
  });
  document.querySelectorAll('#ov .tri').forEach(el=>{ const r=D.tris.find(x=>x.id===el.dataset.tri); el.classList.toggle('on', t>=r.onTick); });
  document.querySelectorAll('#ov .phrow button').forEach(b=>{ const kk=+b.dataset.jump; b.classList.toggle('done', t>=D.cp[kk]); b.classList.toggle('cur', kk===k); });

  // header stats
  const q = quizScore();
  $('#hstats').innerHTML = `<span>files <b>${D.files.filter(F=>D.fileExists(F,t)&&F.change!=='context').length}</b>/${D.files.filter(F=>F.change!=='context').length}</span><span>ACs <b>${ver}</b>/${D.acs.length}</span><span>≡ <b>${ready}</b>/${D.cs.length}</span><span>quiz <b>${q.right}</b>/${q.asked}${q.skip?` · ${q.skip} skipped`:''}</span>`;

  // checkpoint chip
  const chip = $('#cpchip');
  if((T.kind==='cp'||T.kind==='ship') && S.openCp==null){ chip.classList.add('on'); chip.textContent = T.kind==='cp' ? `▷ open ${D.M.phases[T.phase-1].id} checkpoint` : '■ open ship report'; }
  else chip.classList.remove('on');

  if(S.cs) renderLadder();
  applySel();
  prevT = t;
  try{ history.replaceState(null,'','#'+S.plan+(t?'@'+t:'')); }catch(e){}
}

function scrollTreeTo(path){
  const el = D.fileEl[path]; const box = $('#fs .tree');
  const sc = getComputedStyle($('#fs')).overflowY!=='visible' ? $('#fs') : box;
  if(!el || !sc) return;
  // open parent dirs
  let p = el.parentElement; while(p && p!==box){ if(p.classList.contains('dir')) p.classList.remove('closed'); p=p.parentElement; }
  const er = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  if(er.top < sr.top+50 || er.bottom > sr.bottom-20) sc.scrollTop += (er.top - sr.top) - sc.clientHeight*0.35;
}

/* ================= playback ================= */
function setT(t, opts={}){
  t = Math.max(0, Math.min(D.SHIP, t));
  S.t = t; if(!opts.keepCp) closeCp();
  update();
  const T = D.ticks[t];
  if(opts.gate && S.gates && (T.kind==='cp'||T.kind==='ship')){ pause(); openCp(T.kind==='cp'?T.phase:D.n+1); }
}
function play(){
  if(S.t>=D.SHIP){ S.t=0; prevT=0; update(true); }
  closeCp(); S.playing=true; update(); tickLoop();
}
function tickLoop(){
  clearTimeout(S.timer);
  if(!S.playing) return;
  const T = D.ticks[S.t];
  const dur = T.kind==='cp' ? 900 : 380;
  S.timer = setTimeout(()=>{ if(!S.playing) return; if(S.t>=D.SHIP){ pause(); return; } setT(S.t+1,{gate:true}); if(S.playing) tickLoop(); }, dur);
}
function pause(){ S.playing=false; clearTimeout(S.timer); $('#pl').textContent='▶'; }
function nextCp(){ const nx = D.cp.slice(1).find(c=>c>S.t); pause(); setT(nx!=null?nx:D.SHIP,{gate:true}); }
function fastForward(){ pause(); closeCp(); S.t=D.SHIP; update(); openCp(D.n+1); }

/* ================= selection sync ================= */
function relations(sel){
  const R = {files:new Set(), syms:new Set(), nodes:new Set(), cs:new Set(), acs:new Set(), goals:new Set(), ds:new Set(), tris:new Set()};
  if(!sel) return R;
  const [type, ...rest] = sel.split(':'); const id = rest.join(':');
  const addFile = p => { R.files.add(p); const n=D.nodeOfFile[p]; if(n) R.nodes.add(n); };
  const addAc = aid => { const A=D.acMap[aid]; if(!A) return; R.acs.add(aid); A.tests.forEach(tk=>{ const i=tk.lastIndexOf(':'); const key=tk.slice(0,i)+'::'+tk.slice(i+1); if(D.syms[key]){ R.syms.add(key); addFile(tk.slice(0,i)); } }); };
  const addCs = C => { R.cs.add(C.id); C.frames.forEach(f=>{ if(f.sym){ R.syms.add(f.sym.key); addFile(f.sym.file.path);} }); };
  if(type==='G'){ R.goals.add(id); D.acs.filter(a=>a.src.goal===id).forEach(a=>addAc(a.id)); D.files.forEach(F=>{ if((F.src.goals||[]).includes(id)) addFile(F.path); }); D.cs.forEach(C=>{ if((C.src.goals||[]).includes(id)) R.cs.add(C.id); }); D.M.decisions.forEach(d=>{ if((d.goals||[]).includes(id)) R.ds.add(d.id); }); }
  if(type==='AC'){ addAc(id); const A=D.acMap[id]; R.goals.add(A.src.goal); (A.src.decisions||[]).forEach(d=>R.ds.add(d)); D.files.forEach(F=>{ if((F.src.acs||[]).includes(id)) addFile(F.path); }); D.cs.forEach(C=>{ if((C.src.acs||[]).includes(id)) R.cs.add(C.id); }); D.M.decisions.forEach(d=>{ if((d.acs||[]).includes(id)) R.ds.add(d.id); }); }
  if(type==='D'){ const d=D.M.decisions.find(x=>x.id===id); R.ds.add(id); (d.goals||[]).forEach(g=>R.goals.add(g)); (d.acs||[]).forEach(a=>{ addAc(a); D.files.forEach(F=>{ if((F.src.acs||[]).includes(a)) addFile(F.path); }); }); }
  if(type==='R'){ const r=D.tris.find(x=>x.id===id); R.tris.add(id); if(r.src.goal) R.goals.add(r.src.goal); if(r.ac) addAc(r.ac); }
  if(type==='F'){ const F=D.fileMap[id]; addFile(id); F.syms.forEach(s=>R.syms.add(s.key)); (F.src.acs||[]).forEach(a=>R.acs.add(a)); (F.src.goals||[]).forEach(g=>R.goals.add(g)); D.cs.forEach(C=>{ if(C.frames.some(f=>f.src.file===id)) R.cs.add(C.id); }); }
  if(type==='S'){ const Sy=D.syms[id]; R.syms.add(id); addFile(Sy.file.path); D.cs.forEach(C=>{ if(C.frames.some(f=>f.sym===Sy)) R.cs.add(C.id); }); D.acs.forEach(A=>{ if(A.tests.some(tk=>tk.replace(/:([^:]+)$/,'::$1')===id)) { R.acs.add(A.id); R.goals.add(A.src.goal);} }); }
  if(type==='N'){ const N=D.nodeMap[id]; R.nodes.add(id); N.files.forEach(F=>R.files.add(F.path)); D.cs.forEach(C=>{ if(C.frames.some(f=>f.sym && D.nodeOfFile[f.sym.file.path]===id)) R.cs.add(C.id); }); }
  if(type==='CS'){ const C=D.cs.find(c=>c.id===id); addCs(C); (C.src.acs||[]).forEach(a=>R.acs.add(a)); (C.src.goals||[]).forEach(g=>R.goals.add(g)); }

}

/* ================= call-stack ladder ================= */
function openLadder(id){ S.cs=id; S.frame=-1; stopFrames(); document.querySelectorAll('.csr').forEach(r=>r.classList.toggle('sel', r.dataset.cs===id)); $('#ladder').classList.add('on'); renderLadder(); const cs=$('#cs'); if(getComputedStyle(cs).overflowY!=='visible') cs.scrollTop=0; }
function closeLadder(silent){ S.cs=null; stopFrames(); $('#ladder').classList.remove('on'); document.querySelectorAll('.csr').forEach(r=>r.classList.remove('sel')); clearPulse(); }
function clearPulse(){ document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse')); }
function renderLadder(){
  const C = D.cs.find(c=>c.id===S.cs); if(!C) return;
  const st = D.csState(C,S.t);
  $('#lttl').innerHTML = `<b style="color:var(--cs)">≡ ${C.id}</b> ${esc(C.src.title)}<small>${esc(C.src.trigger||'')}</small>`;
  $('#lplay').disabled = st.st==='locked';
  $('#lplay').textContent = st.st==='locked' ? '◌ locked' : (S.fplay?'❚❚ pause':'▶ play');
  const used = LAYERS.filter(L=>C.frames.some(f=>f.src.layer===L));
  const LH=22, X0=62, n=C.frames.length, W=Math.max(420, X0+n*38+20), H=used.length*LH+22;
  const xs = i => X0+14+i*((W-X0-30)/Math.max(1,n-1||1));
  const ys = L => 8+used.indexOf(L)*LH+LH/2;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  used.forEach((L,i)=>{ s+=`<g class="lane"><rect x="0" y="${8+i*LH}" width="${W}" height="${LH-2}" rx="4"/><text x="6" y="${8+i*LH+LH/2+3}" style="fill:${LAYER_COL[L]}">${L}</text></g>`; });
  let path=''; C.frames.forEach((f,i)=>{ path += (i?'L':'M')+xs(i)+','+ys(f.src.layer); });
  s+=`<path class="fpath ${st.st==='locked'?'lock':''}" d="${path}"/>`;
  C.frames.forEach((f,i)=>{
    const Sy=f.sym; const miss = Sy && !D.symExists(Sy,S.t); const pend = !C.before && Sy && Sy.change==='edit' && !D.symDone(Sy,S.t);
    s+=`<g class="fd ${miss?'miss':pend?'pend':'ok'} ${i===S.frame?'cur':''}" data-fi="${i}"><title>${esc(f.src.symbol+' — '+f.src.does)}</title><circle cx="${xs(i)}" cy="${ys(f.src.layer)}" r="${i===S.frame?8:5.5}"/><text x="${xs(i)}" y="${H-3}" text-anchor="middle">${i+1}</text></g>`;
  });
  s+='</svg>';
  $('#lanes').innerHTML=s;
  // detail
  let d='';

    const f=C.frames[S.frame], Sy=f.sym;
    d = `<div class="fs1"><i style="color:${LAYER_COL[f.src.layer]}">${f.src.layer}</i>${esc(f.src.symbol)}</div><div class="fs2">${esc(f.src.file)}</div><div class="fs3">${md(f.src.does)}${f.src.effect?` <span class="eff">→ ${md(f.src.effect)}</span>`:''}${f.src.note?` <span style="color:var(--mute)">· ${md(f.src.note)}</span>`:''}</div>`;
    if(S.frame===C.frames.length-1 && C.src.result) d+=`<div class="res">${esc(C.src.result)}</div>`;
  } else if(st.st==='locked'){
    const byP = {}; st.missing.forEach(f=>{ const p=f.sym.phase; (byP[p]=byP[p]||[]).push(f); });
    d = `<div class="lockmsg">◌ Not executable yet — ${st.missing.length} frame${st.missing.length>1?'s':''} still unbuilt.</div><div class="missl">${st.missing.map(f=>`<span data-sel="S:${esc(f.sym.key)}">${esc(f.sym.name)} <em>P${f.sym.phase}</em></span>`).join('')}</div>`;
  } else if(st.st==='legacy'){
    d = `<div class="lockmsg" style="color:var(--edit)">~ Runs today on the old code — ${st.pend.length} frame${st.pend.length>1?'s':''} still to change on this path.</div><div class="missl">${st.pend.map(f=>`<span data-sel="S:${esc(f.sym.key)}" style="border-color:var(--edit)">${esc(f.sym.name)} <em>P${f.sym.phase}</em></span>`).join('')}</div>`;
  } else if(st.st==='retired'){
    d = `<div class="lockmsg" style="color:var(--mute)">Retired — this was the path as found; its replacement is now live.</div>`;
  } else d = `<div class="fs3" style="color:var(--mute)">${C.frames.length} frames across ${used.length} layers. Press play to walk the journey; each frame lights its symbol in the folder tree and its package in the import graph.</div>`;

function showFrame(i){
  const C = D.cs.find(c=>c.id===S.cs); if(!C) return;
  S.frame=i; clearPulse();
  const f=C.frames[i];
  if(f && f.sym){ const el=D.symEl[f.sym.key]; if(el){ el.classList.add('pulse'); if(el.closest('.tsyms')) el.closest('.file').classList.add('topen'); scrollTreeTo(f.sym.file.path);} const n=D.nodeOfFile[f.sym.file.path]; if(n){ const g=document.querySelector(`#graph .gn[data-n="${CSS.escape(n)}"]`); if(g) g.classList.add('pulse'); } }
  renderLadder();
}
function playFrames(){
  const C = D.cs.find(c=>c.id===S.cs); if(!C) return;
  if(S.fplay){ stopFrames(); renderLadder(); return; }
  if(D.csState(C,S.t).st==='locked') return;
  let i = S.frame>=C.frames.length-1 ? 0 : S.frame+1;
  const step = () => { showFrame(i); i++; if(i<C.frames.length) S.fplay=setTimeout(step, 820); else { S.fplay=null; renderLadder(); } };
  S.fplay = setTimeout(()=>{},0); step();
}
function stopFrames(){ if(S.fplay){ clearTimeout(S.fplay); S.fplay=null; } }

/* ================= checkpoint + quiz ================= */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(a,r){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function quizFor(k){
  const r = rng(k*7919 + (S.plan==='062'?11:23));
  const tcp = D.cp[k], qs=[];
  const green = D.M.plan.kind==='greenfield';
  const newly = D.acs.filter(a=>a.doneAt===k), future = D.acs.filter(a=>a.doneAt>k);
  const unlocked = D.cs.filter(c=>!c.before && c.readyPhase===k);
  if(unlocked.length){
    const c = unlocked[Math.floor(r()*unlocked.length)];
    const others = shuffle(D.cs.filter(x=>!x.before && x.readyPhase!==k), r).slice(0,3);
    const last = c.frames.filter(f=>f.sym && f.sym.tick===c.readyTick).map(f=>f.sym.name);
    qs.push({id:'j'+k, q: green?'Which journey just became playable?':'Which journey now runs as planned?',
      opts: shuffle([c,...others],r).map(o=>({label:o.id+' · '+o.src.title, ok:o===c, sel:'CS:'+o.id})),
      explain: `${c.id} needed <code>${esc([...new Set(last)].slice(0,3).join('</code>, <code>'))}</code> — landed this phase.`});
  }
  if(newly.length && future.length>=2){
    const a = newly[Math.floor(r()*newly.length)];
    const ds = shuffle(future,r).slice(0,3);
    qs.push({id:'a'+k, q:'What can we now prove?', opts: shuffle([a,...ds],r).map(o=>({label:o.id+' · '+o.src.title.replace(/`/g,''), ok:o===a, sel:'AC:'+o.id})),
      explain: `${a.id} is green: <code>${esc((a.tests[0]||a.src.verify.cmd).split('/').pop())}</code>. The others still need a later phase.`});
  }
  if(qs.length<2){
    const locked = D.cs.filter(c=>{ const s=D.csState(c,tcp); return s.st==='locked'||s.st==='legacy'; });
    if(locked.length){
      const c = locked[Math.floor(r()*locked.length)]; const s=D.csState(c,tcp);
      const missing = (s.st==='locked'?s.missing:s.pend).map(f=>f.sym);
      const m = missing[Math.floor(r()*missing.length)];
      const have = shuffle([...new Map(c.frames.filter(f=>f.sym && !missing.some(x=>x.name===f.sym.name)).map(f=>[f.sym.name,f.sym])).values()], r).slice(0,3);
      if(have.length>=2) qs.push({id:'b'+k, q: s.st==='locked' ? `${c.id} is still locked. Which symbol blocks it?` : `${c.id} still runs the old path. Which frame is not renovated yet?`,
        opts: shuffle([m,...have],r).map(o=>({label:o.name, ok:o===m, sel:'S:'+o.key})),
        explain: `<code>${esc(m.name)}</code> lands in P${m.phase} (${esc(m.file.path.split('/').pop())}).`});
    }
  }
  if(qs.length<2){
    const pool = (newly.length?newly:D.acs).filter(a=>a.tests.length);
    if(pool.length){
      const a = pool[Math.floor(r()*pool.length)];
      const others = shuffle(D.acs.filter(x=>x!==a && x.tests.length),r).slice(0,3).map(x=>x.tests[0]);
      const right = a.tests[0];
      qs.push({id:'t'+k, q:`Which test proves ${a.id} — “${a.src.title.replace(/`/g,'')}”?`, opts: shuffle([right,...others],r).map(o=>({label:o.split(':').pop(), ok:o===right})),
        explain: `<code>${esc(right)}</code>`});
    }
  }
  return qs.slice(0,2);
}
function quizScore(){ let right=0, asked=0, skip=0; Object.values(S.quiz).forEach(v=>{ if(v==='skip') skip++; else { asked++; if(v==='ok') right++; } }); return {right,asked,skip}; }
function openCp(k){
  S.openCp = k;
  const green = D.M.plan.kind==='greenfield';
  if(k>D.n){ renderShip(); $('#cp').classList.add('on'); update(); return; }
  const p = D.M.phases[k-1];
  const verified = D.acs.filter(a=>a.ks.includes(k));
  const unl = D.cs.filter(c=>!c.before && c.readyPhase===k);
  const retired = D.cs.filter(c=>c.before && D.phaseOfTick(c.retireTick)===k);
  const dv = D.div.filter(d=>d.k===k);
  $('#cphd').innerHTML = `<span class="pid">▷ ${p.id} ✓</span><h3>${esc(p.title)}<small>${md(p.summary)}</small></h3><div class="x"><button class="hbtn" data-cpact="prev">◀ ${k>1?'P'+(k-1):'P0'}</button><button class="hbtn ff" data-cpact="go">${k<D.n?'continue ▷ P'+(k+1):'continue ■ ship'}</button><button class="hbtn" data-cpact="close" title="Esc">✕</button></div>`;
  let left = `<div class="commit">${esc(p.commit)}</div><h4>✓ proven at this checkpoint</h4>`;
  left += verified.map(A=>{ const full = A.doneAt===k; return `<div class="vac ${full?'':'partial'}"><div class="vt" data-sel="AC:${A.id}"><i>${full?'✓ VERIFIED':'◐ '+A.ks.filter(x=>x<=k).length+'/'+A.ks.length}</i><b>${A.id}</b>${md(A.src.title)}</div><pre>${esc(A.src.verify.cmd)}</pre>${A.tests.length?`<div class="tn">${A.tests.slice(0,4).map(x=>{const [f,tn]=[x.slice(0,x.lastIndexOf(':')),x.slice(x.lastIndexOf(':')+1)]; return `<span>${esc(tn)}</span> <span style="color:var(--faint)">${esc(f.split('/').pop())}</span>`;}).join('<br>')}${A.tests.length>4?`<br>+${A.tests.length-4} more`:''}</div>`:`<div class="man">▲ ${esc(A.src.verify.kind)} — no automated test</div>`}</div>`; }).join('') || '<div class="unl"><span class="none">No AC completes here — this phase is groundwork.</span></div>';
  let right = `<h4>≡ journeys ${green?'unlocked':'now running as planned'}</h4><div class="unl">${unl.length?unl.map(c=>`<button data-opencs="${c.id}">▶ ${c.id} ${esc(c.src.title.length>38?c.src.title.slice(0,37)+'…':c.src.title)}</button>`).join(''):`<span class="none">none yet — ${D.cs.filter(c=>D.csState(c,D.cp[k]).st==='locked').length} still locked</span>`}${retired.map(c=>`<button data-opencs="${c.id}" style="border-color:var(--faint);color:var(--mute);background:none">✕ ${c.id} retired</button>`).join('')}</div>`;
  if(dv.length){ right += `<h4 style="color:var(--div)">≠ plan said / build did</h4>` + dv.map(divHtml).join(''); }
  right += `<h4 style="margin-top:10px">? quiz gate</h4>` + quizHtml(k);
  $('#cpbody').innerHTML = `<div class="cpcol">${left}</div><div class="cpcol">${right}</div>`;
  $('#cp').classList.add('on'); $('#cp').dataset.k=k;
  update();
}
function divHtml(d){ return `<div class="dv"><div class="tag">≠ ${esc(d.tag)}</div><div class="dl"><span>PLAN</span><span class="p">${md(d.plan)}</span><span>BUILT</span><span class="b">${md(d.built)}</span></div>${d.refs.length?`<div class="missl" style="margin-top:5px">${d.refs.map(r=>{ const key = r.includes('::')?'S:'+r:'F:'+r; const ok = r.includes('::')?D.syms[r]:D.fileMap[r]; return ok?`<span data-sel="${esc(key)}" style="border-color:var(--div)">${esc(r.split('::').pop().split('/').pop())}</span>`:''; }).join('')}</div>`:''}</div>`; }
function quizHtml(k){
  const qs = quizFor(k);
  if(!qs.length) return '<div class="unl"><span class="none">No question at this gate.</span></div>';
  return qs.map((q,qi)=>{
    const ans = S.quiz[S.plan+':'+q.id];
    const done = !!ans;
    return `<div class="quiz" data-q="${q.id}" data-k="${k}" data-qi="${qi}"><div class="qh">GATE ${D.M.phases[k-1].id} · Q${qi+1}/${qs.length}</div><div class="qq">${esc(q.q)}</div><div class="qo">${q.opts.map((o,oi)=>`<button data-oi="${oi}" ${done?'disabled':''} class="${done&&o.ok?'right':''}">${esc(o.label)}</button>`).join('')}</div>${done?`<div class="qx">${ans==='skip'?'<b class="no">skipped</b> — answer: ':ans==='ok'?'<b>right.</b> ':'<b class="no">not quite.</b> '}${q.explain}</div>`:`<button class="qs" data-skip="1">skip</button>`}</div>`;
  }).join('');
}
function answer(qEl, oi, skip){
  const k=+qEl.dataset.k, qi=+qEl.dataset.qi; const q=quizFor(k)[qi];
  const key = S.plan+':'+q.id;
  if(S.quiz[key]) return;
  S.quiz[key] = skip ? 'skip' : (q.opts[oi].ok ? 'ok' : 'no');
  store.set('quiz-'+S.plan, S.quiz);
  const btns = qEl.querySelectorAll('.qo button');
  btns.forEach((b,i)=>{ b.disabled=true; if(q.opts[i].ok) b.classList.add('right'); });
  if(!skip && !q.opts[oi].ok) btns[oi].classList.add('wrong');
  const sk=qEl.querySelector('.qs'); if(sk) sk.remove();
  const x=document.createElement('div'); x.className='qx'; x.innerHTML = (skip?'<b class="no">skipped</b> — answer: ':q.opts[oi].ok?'<b>right.</b> ':'<b class="no">not quite.</b> ')+q.explain; qEl.appendChild(x);
  if(q.opts[skip?q.opts.findIndex(o=>o.ok):oi].sel) select(q.opts[q.opts.findIndex(o=>o.ok)].sel, true), S.sel && applySel();
  update();
}
function renderShip(){
  const M=D.M, green=M.plan.kind==='greenfield';
  const q=quizScore();
  const added = D.files.filter(F=>F.change==='add').length, edited=D.files.filter(F=>F.change==='edit').length, del=D.files.filter(F=>F.change==='delete').length;
  const syA = Object.values(D.syms).filter(s=>s.change==='add').length, syE = Object.values(D.syms).filter(s=>s.change==='edit').length;
  $('#cphd').innerHTML = `<span class="pid">■ SHIPPED</span><h3>${esc(M.plan.id)} · ${esc(M.plan.title)}<small>${esc(M.plan.baseCommit)} → ${esc(M.plan.builtCommit)} · all ${D.acs.length} ACs verified</small></h3><div class="x"><button class="hbtn" data-cpact="replay">↺ replay from P0</button><button class="hbtn" data-cpact="close" title="Esc">✕</button></div>`;
  const dv = D.div;
  let left = `<div class="shipstats"><div><b>+${added}</b>files built</div><div><b>~${edited}</b>${green?'seam files edited':'files renovated'}</div>${del?`<div><b>−${del}</b>removed</div>`:''}<div><b>${syA}</b>new symbols</div><div><b>${syE}</b>symbols edited</div><div><b>${D.cs.filter(c=>D.csState(c,D.SHIP).st==='ready').length}/${D.cs.length}</b>journeys ${green?'playable':'as planned'}</div><div><b>${q.right}/${q.asked}</b>quiz${q.skip?` · ${q.skip} skipped`:''}</div></div>`;
  left += `<h4>✓ every acceptance criterion, with its proof</h4>` + D.acs.map(A=>`<div class="vac" style="padding:5px 8px"><div class="vt" data-sel="AC:${A.id}"><i>${A.src.verify.kind==='manual'?'MANUAL':'✓'}</i><b>${A.id}</b>${md(A.src.title)}</div><pre>${esc(A.src.verify.cmd)}</pre></div>`).join('');
  let right = `<h4 style="color:var(--div)">≠ every plan-vs-built divergence, by phase</h4>` + dv.map(d=>`<div style="font-family:var(--mono);font-size:10px;color:var(--mute);margin:6px 0 2px">${d.k>D.n?'at merge':M.phases[d.k-1].id}</div>`+divHtml(d)).join('');
  $('#cpbody').innerHTML = `<div class="cpcol">${left}</div><div class="cpcol">${right}</div>`;
}
function closeCp(){ if(S.openCp==null) return; S.openCp=null; $('#cp').classList.remove('on'); const chip=$('#cpchip'); if(chip) update(); }

/* ================= events ================= */
document.addEventListener('click', e=>{
  const t = e.target;
  const pb = t.closest('#planswitch button'); if(pb){ switchPlan(pb.dataset.plan); return; }
  if(t.closest('[data-clear]')){ select(null); S.sel=null; applySel(); return; }
  const qb = t.closest('.quiz .qo button'); if(qb){ answer(qb.closest('.quiz'), +qb.dataset.oi, false); return; }
  const qs = t.closest('.quiz [data-skip]'); if(qs){ answer(qs.closest('.quiz'), -1, true); return; }
  const ca = t.closest('[data-cpact]'); if(ca){ const a=ca.dataset.cpact; const k=+($('#cp').dataset.k||0);
    if(a==='close') closeCp();
    if(a==='go'){ closeCp(); if(S.t<D.SHIP){ S.t++; update(); } play(); }
    if(a==='prev'){ closeCp(); pause(); setT(k>1?D.cp[k-1]:0,{gate:true}); }
    if(a==='replay'){ closeCp(); S.t=0; prevT=0; update(true); play(); }
    return; }
  const oc = t.closest('[data-opencs]'); if(oc){ openLadder(oc.dataset.opencs); S.sel='CS:'+oc.dataset.opencs; applySel(); closeCp(); setTimeout(playFrames,250); if(window.innerWidth<860) $('#ladder').scrollIntoView({behavior:'smooth'}); return; }
  const jm = t.closest('[data-jump]'); if(jm){ pause(); setT(D.cp[+jm.dataset.jump],{gate:true}); return; }
  if(t.closest('.fbt')){ $('#forb').classList.toggle('open'); return; }
  const tg = t.closest('.tgrp'); if(tg){ tg.closest('.file').classList.toggle('topen'); tg.firstChild.textContent = tg.closest('.file').classList.contains('topen')?'▾ ':'▸ '; return; }
  const dn = t.closest('.dname'); if(dn){ dn.parentElement.classList.toggle('closed'); return; }
  const fd = t.closest('.fd'); if(fd){ stopFrames(); showFrame(+fd.dataset.fi); return; }
  const csr = t.closest('.csr'); if(csr){ const id=csr.dataset.cs; if(S.cs===id){ closeLadder(); S.sel=null; applySel(); } else { openLadder(id); S.sel='CS:'+id; applySel(); } return; }
  const sel = t.closest('[data-sel]'); if(sel){ select(sel.dataset.sel); return; }
});
$('#lplay').addEventListener('click', e=>{ e.stopPropagation(); playFrames(); });
$('#lclose').addEventListener('click', e=>{ e.stopPropagation(); closeLadder(); if(S.sel&&S.sel.startsWith('CS:')){S.sel=null;applySel();} });
$('#pl').onclick = ()=> S.playing ? (pause(), update()) : play();
$('#fw').onclick = ()=>{ pause(); setT(S.t+1,{gate:true}); };
$('#bk').onclick = ()=>{ pause(); setT(S.t-1); };
$('#ffbtn').onclick = fastForward;
$('#cpchip').onclick = ()=>{ const T=D.ticks[S.t]; openCp(T.kind==='cp'?T.phase:D.n+1); };
$('#gatebtn').onclick = ()=>{ S.gates=!S.gates; $('#gatebtn').classList.toggle('on',S.gates); $('#gatebtn').textContent = S.gates?'‖ gates on':'gates off'; };
$('#ghostbtn').onclick = ()=>{ S.ghosts=!S.ghosts; document.body.classList.toggle('noghost',!S.ghosts); $('#ghostbtn').classList.toggle('on',S.ghosts); };
(function(){ const tr=$('#track'); let drag=false;
  const at = e => { const r=tr.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const t=xToTick(x); if(t!==S.t){ pause(); setT(t); } };
  tr.addEventListener('pointerdown', e=>{ drag=true; tr.setPointerCapture(e.pointerId); at(e); });
  tr.addEventListener('pointermove', e=>{ if(drag) at(e); });
  tr.addEventListener('pointerup', e=>{ drag=false; const T=D.ticks[S.t]; if(T.kind==='cp'&&S.gates) openCp(T.phase); });
})();
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(e.key===' '){ e.preventDefault(); S.playing?(pause(),update()):play(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); if(e.shiftKey) nextCp(); else { pause(); setT(S.t+1,{gate:true}); } }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); pause(); if(e.shiftKey){ const pv=[0,...D.cp.slice(1)].filter(c=>c<S.t); setT(pv.length?pv[pv.length-1]:0,{gate:true}); } else setT(S.t-1); }
  else if(e.key==='Escape'){ if(S.openCp!=null) closeCp(); else if(S.cs){ closeLadder(); if(S.sel&&S.sel.startsWith('CS:')) S.sel=null; applySel(); } else if(S.sel){ S.sel=null; applySel(); } }
  else if(e.key==='f'||e.key==='F'){ fastForward(); }
});
window.addEventListener('resize', ()=>{ if(D) $('#head').style.left = tickToX(S.t)+'px'; });
window.addEventListener('hashchange', ()=>{ const h=parseHash(); if(h.plan!==S.plan) switchPlan(h.plan, h.t); });
function parseHash(){ const m=(location.hash||'').match(/^#(062|052)(?:@(\d+))?/); return m?{plan:m[1], t:m[2]?+m[2]:0}:{plan:'062',t:0}; }
function switchPlan(p, t){
  pause(); closeCp(); S.plan=p; S.sel=null; S.t=0; prevT=0; renderAll();
  if(t){ S.t=Math.min(t,D.SHIP); prevT=S.t; update(true); }
}
window.__lab17 = {get D(){return D;}, S};
const h0 = parseHash();
switchPlan(h0.plan, h0.t);
})();
</script>
