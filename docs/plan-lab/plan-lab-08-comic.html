<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Lab 08 — The Graphic Novel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --ink:#141414; --paper:#fbf6e9; --cyan:#19a7ce; --mag:#e0357a; --yel:#ffd23f; --red:#e63946; --grn:#2a9d55;
  --page:#f3ecd9; --gutter:14px; --cap-bg:#ffd23f; --cap-ink:#141414; --panel-border:3px solid var(--ink);
  --title-font:'Bangers',system-ui,sans-serif; --cap-font:'Comic Neue',system-ui,sans-serif; --ball-font:'Comic Neue',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --hud-bg:#141414; --hud-ink:#fbf6e9; --accent:var(--mag); --chip-bg:#141414; --chip-ink:#ffd23f;
  --back-bg:#fffdf6;
}
body[data-plan="052"]{
  --ink:#0d0d0f; --paper:#e8e2d4; --page:#16161a; --cap-bg:#e9dfc4; --cap-ink:#1a1a1a; --panel-border:2px solid #d9d2c1;
  --title-font:'Bebas Neue',system-ui,sans-serif; --cap-font:'Special Elite',ui-monospace,monospace;
  --hud-bg:#0b0b0d; --hud-ink:#e8e2d4; --accent:#c1272d; --chip-bg:#c1272d; --chip-ink:#fff; --back-bg:#efe9da;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--cap-font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body[data-plan="062"]{background-color:#f3ecd9;background-image:radial-gradient(rgba(224,53,122,.10) 1.4px,transparent 1.6px);background-size:9px 9px}
body[data-plan="052"]{background-color:#16161a;background-image:repeating-linear-gradient(104deg,rgba(255,255,255,.025) 0 1px,transparent 1px 7px)}
code,.mono{font-family:var(--mono)}
button{font:inherit;cursor:pointer}

/* ---------------- HUD ---------------- */
.hud{position:sticky;top:0;z-index:50;background:var(--hud-bg);color:var(--hud-ink);display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:3px solid var(--accent);flex-wrap:wrap}
.hud .brand{font-family:var(--title-font);font-size:22px;letter-spacing:1px;white-space:nowrap}
.hud .brand small{font-family:var(--mono);font-size:10px;opacity:.6;letter-spacing:0;margin-left:6px}
.switch{display:flex;border:2px solid var(--hud-ink);border-radius:4px;overflow:hidden}
.switch button{background:transparent;color:var(--hud-ink);border:0;padding:5px 12px;font-family:var(--title-font);font-size:17px;letter-spacing:1px}
.switch button[aria-pressed="true"]{background:var(--hud-ink);color:var(--hud-bg)}
.switch button .sub{font-family:var(--mono);font-size:10px;letter-spacing:0;opacity:.75;margin-left:4px}
.hud select{background:transparent;color:var(--hud-ink);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:5px 6px;font-family:var(--mono);font-size:12px;max-width:260px}
.hud select option{color:#111}
.hud .spacer{flex:1}
.hud .tog{background:transparent;color:var(--hud-ink);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:5px 10px;font-family:var(--mono);font-size:12px}
.hud .tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.progress{position:absolute;left:0;bottom:-3px;height:3px;background:var(--hud-ink);width:0}

/* ---------------- BOOK ---------------- */
.book{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gutter);margin-bottom:var(--gutter)}
.strip > *{min-width:0}
.panel{position:relative;border:var(--panel-border);background:var(--paper);overflow:hidden;min-width:0;display:flex;flex-direction:column}
body[data-plan="062"] .panel{box-shadow:5px 5px 0 var(--ink)}
body[data-plan="052"] .panel{box-shadow:0 0 0 4px #0b0b0d, 0 8px 22px rgba(0,0,0,.6)}
.panel.hl{outline:5px solid var(--accent);outline-offset:3px}
.front{display:flex;flex-direction:column;flex:1;position:relative}
.front .txt{position:relative;z-index:2;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px}
.front .art{display:block;width:100%;height:auto;margin-top:auto;position:relative;z-index:1}
.front .txt + .art{margin-top:max(-54px, calc(-1 * var(--ov, 54px)))}
.front .foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:6px;pointer-events:auto;max-width:calc(100% - 70px)}
.chip{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--chip-bg);color:var(--chip-ink);border:0;border-radius:3px;padding:2px 5px;line-height:1.3;cursor:pointer;white-space:nowrap}
.chip:hover{filter:brightness(1.25)}
.flipbtn{pointer-events:auto;border:0;background:transparent;width:64px;height:64px;position:relative;padding:0}
.flipbtn::before{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 46px 46px;border-color:transparent transparent var(--ink) transparent;transition:border-width .15s}
.flipbtn::after{content:"PLAN";position:absolute;right:-1px;bottom:9px;width:40px;text-align:center;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--paper);transform:rotate(-45deg)}
.flipbtn:hover::before{border-width:0 0 58px 58px}
.panel.noart .front .txt{padding-bottom:44px}

/* backgrounds */
.bg-paper{background:var(--paper)}
.bg-cyan{background-color:#bfe7f3;background-image:radial-gradient(rgba(25,167,206,.45) 1.6px,transparent 1.8px);background-size:8px 8px}
.bg-mag{background-color:#f8cfe0;background-image:radial-gradient(rgba(224,53,122,.40) 1.6px,transparent 1.8px);background-size:8px 8px}
.bg-yel{background-color:#fff0a8;background-image:radial-gradient(rgba(240,170,0,.45) 1.6px,transparent 1.8px);background-size:8px 8px}
.bg-burst{background:repeating-conic-gradient(from 0deg at 50% 70%,#ffd23f 0deg 9deg,#ffb703 9deg 18deg)}
.bg-burstred{background:repeating-conic-gradient(from 0deg at 50% 60%,#e63946 0deg 8deg,#c81d2b 8deg 16deg)}
.bg-night{background:linear-gradient(#1b2a4a,#35507f);color:#fff}
.bg-lines{background-color:#fff;background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.06) 22px 24px)}
.bg-grn{background-color:#cdebd6;background-image:radial-gradient(rgba(42,157,85,.40) 1.6px,transparent 1.8px);background-size:8px 8px}
.bg-blinds{background-color:#1d1c1f;background-image:repeating-linear-gradient(160deg,rgba(233,223,196,.16) 0 16px,transparent 16px 34px)}
.bg-rain{background:linear-gradient(#0f1014,#23252c);}
.bg-rain::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(100deg,rgba(255,255,255,.07) 0 1px,transparent 1px 11px);pointer-events:none}
.bg-lamp{background:radial-gradient(ellipse at 50% 20%,rgba(224,165,38,.55),rgba(20,18,16,1) 65%)}
.bg-cork{background-color:#9b7650;background-image:radial-gradient(rgba(60,35,15,.35) 1px,transparent 1.4px),radial-gradient(rgba(255,230,190,.18) 1px,transparent 1.4px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.bg-concrete{background:linear-gradient(#cfc8b8,#a9a293)}
.bg-red{background:radial-gradient(ellipse at 50% 40%,#5a1115,#1a0708 75%)}
.bg-dusk{background:linear-gradient(#2a2c35,#4a4a52)}

/* captions & balloons */
.cap{align-self:flex-start;max-width:92%;background:var(--cap-bg);color:var(--cap-ink);border:2px solid var(--ink);padding:6px 9px;font-family:var(--cap-font);font-size:14.5px;line-height:1.35;box-shadow:2px 2px 0 var(--ink)}
body[data-plan="052"] .cap{box-shadow:none;border-color:#1a1a1a;font-size:14px}
.cap.wide{max-width:100%;align-self:stretch}
.cap.r{align-self:flex-end}
.cap b,.cap strong{font-weight:700}
.cap code,.ball code,.back code{font-size:.86em;background:rgba(0,0,0,.08);padding:0 3px;border-radius:2px;word-break:break-word}
.ball{position:relative;max-width:78%;background:#fff;color:#111;border:2.5px solid #111;border-radius:22px;padding:8px 13px;font-family:var(--ball-font);font-size:15px;line-height:1.3;font-weight:700}
.ball.l{align-self:flex-start;margin-left:4%}
.ball.c{align-self:center}
.ball.r{align-self:flex-end;margin-right:4%}
.ball::after{content:"";position:absolute;bottom:-16px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid #111}
.ball::before{content:"";position:absolute;bottom:-11px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:12px solid #fff;z-index:1}
.ball.l::after{left:22px}.ball.l::before{left:25px}
.ball.c::after{left:calc(50% - 9px)}.ball.c::before{left:calc(50% - 6px)}
.ball.r::after{right:22px}.ball.r::before{right:25px}
.ball.tl::after{left:22px;right:auto}.ball.tl::before{left:25px;right:auto}
.ball.tr::after{right:22px;left:auto}.ball.tr::before{right:25px;left:auto}
.ball.think{border-radius:40px;border-style:dashed}
.ball.think::after,.ball.think::before{display:none}
.ball.shout{border-radius:6px;background:#fff;font-family:var(--title-font);font-size:22px;letter-spacing:.5px;font-weight:400;border-width:3px;transform:rotate(-1.5deg)}
body[data-plan="052"] .ball.shout{font-size:26px}
.ball.whisper{border-style:dashed;font-weight:400;font-style:italic}
.ball .who{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.55;margin-bottom:2px}
.ball.cmd{background:#111;color:#e9f5e1;border-radius:8px;font-family:var(--mono);font-weight:400;font-size:12.5px;max-width:96%;white-space:pre-wrap;word-break:break-word}
.ball.cmd::before{border-top-color:#111}
.ball.cmd .who{color:#9ad;opacity:.85}
.ball.cmd .pr{color:#ffd23f}
.tape{align-self:stretch;margin:0 3%;background:#fffef6;color:#222;border:2px dashed #555;border-radius:2px;padding:6px 9px;font-family:var(--mono);font-size:12px;line-height:1.4;white-space:pre-wrap;word-break:break-word;box-shadow:2px 2px 0 rgba(0,0,0,.35);position:relative}
.tape .lbl{position:absolute;top:-9px;left:8px;background:#141414;color:#ffd23f;font-size:9px;padding:0 5px;letter-spacing:.5px}
.tape.err .lbl{background:#e63946;color:#fff}
.tape.err{border-color:#e63946;color:#8a1520}
body[data-plan="052"] .tape{background:#f3eee2}
.sfxbox{position:absolute;z-index:4;font-family:var(--title-font);color:#ffd23f;-webkit-text-stroke:2px #111;paint-order:stroke fill;letter-spacing:1px;pointer-events:none;text-shadow:3px 3px 0 #111}
.panelbody{padding:2px 0}

/* chapter headers */
.chapter{grid-column:1/-1;position:relative;padding:22px 20px;border:var(--panel-border);background:var(--ink);color:var(--paper);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
body[data-plan="062"] .chapter{box-shadow:5px 5px 0 #e0357a}
.chapter .kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--yel)}
body[data-plan="052"] .chapter .kicker{color:#e0a526}
.chapter h2{margin:4px 0 2px;font-family:var(--title-font);font-weight:400;font-size:clamp(34px,5vw,54px);line-height:.95;letter-spacing:1px}
.chapter .ph{font-family:var(--mono);font-size:12px;opacity:.85}
.chapter .ph b{color:var(--yel)}
.chapter .dag{width:clamp(170px,26vw,300px);height:auto}
.andthen{grid-column:1/-1;text-align:center;font-family:var(--title-font);font-size:24px;letter-spacing:2px;color:var(--ink);padding:2px 0}
body[data-plan="052"] .andthen{color:#e0a526;font-size:28px}
.andthen small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.5px;opacity:.7}

/* materials strip */
.mats{grid-column:1/-1;border:var(--panel-border);background:var(--paper);padding:10px 12px 12px;position:relative}
.mats h4{margin:0 0 8px;font-family:var(--title-font);font-weight:400;font-size:20px;letter-spacing:1px}
.mats h4 span{font-family:var(--mono);font-size:11px;letter-spacing:0;opacity:.7;margin-left:6px}
.mats .crates{display:flex;flex-wrap:wrap;gap:6px}
.crate{word-break:break-all;font-family:var(--mono);font-size:10.5px;padding:4px 7px 4px 5px;border:2px solid var(--ink);background:#e8c98f;position:relative;display:flex;gap:5px;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.crate i{font-style:normal;font-weight:700;font-size:9px;padding:0 4px;border-radius:2px;color:#fff;background:var(--grn)}
.crate i.edit{background:#c77d00}
.crate i.delete{background:var(--red)}
body[data-plan="052"] .crate{background:#efe7d2;border-style:dashed;border-color:#6d6452}
body[data-plan="052"] .mats{background:#d8d0bd}

/* cast */
.cast{grid-column:1/-1;border:var(--panel-border);background:var(--paper);padding:14px}
.cast h3{margin:0 0 10px;font-family:var(--title-font);font-weight:400;font-size:34px;letter-spacing:1px}
.cast .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who-card{border:2px solid var(--ink);background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s}
.who-card:hover{transform:translateY(-3px) rotate(-.6deg)}
.who-card svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--ink)}
.who-card .nm{font-family:var(--title-font);font-size:20px;letter-spacing:.5px;padding:5px 7px 0}
.who-card .ds{font-size:12.5px;line-height:1.3;padding:2px 7px 8px}
.who-card .ds code{font-size:10.5px;word-break:break-all}
.who-card .tag{font-family:var(--mono);font-size:10px;margin:0 7px 8px;align-self:flex-start}
body[data-plan="052"] .who-card{background:#efe9da}
body[data-plan="052"] .cast{background:#d8d0bd}

/* flip back */
.back{display:none;padding:14px 14px 16px;background:var(--back-bg);font-family:system-ui,sans-serif;color:#1b1b1b;font-size:14px;line-height:1.5;max-height:720px;overflow:auto}
.panel.flipped .front{display:none}
.panel.flipped{grid-column:1/-1 !important}
.ref .meta{word-break:break-word}
.panel.flipped .back{display:block;animation:flipin .38s ease-out}
@keyframes flipin{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.back .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #1b1b1b;padding-bottom:6px;margin-bottom:8px;position:sticky;top:-14px;background:var(--back-bg);z-index:2}
.back .bh span{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.back .bh button{border:2px solid #1b1b1b;background:#fff;padding:3px 8px;font-family:var(--mono);font-size:11px;font-weight:700}
.ref{border-left:4px solid var(--accent);padding:4px 0 4px 10px;margin:0 0 12px}
.ref .rid{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:#1b1b1b;padding:1px 6px;border-radius:2px;margin-right:6px}
.ref .rt{font-weight:700}
.ref .meta{font-family:var(--mono);font-size:11px;color:#555;margin:2px 0 4px}
.ref .md p{margin:.35em 0}.ref .md ul,.ref .md ol{margin:.3em 0;padding-left:1.3em}
.ref .md pre{background:#161616;color:#e8e8e8;padding:8px;overflow:auto;font-size:12px;border-radius:3px}
.ref .md table{border-collapse:collapse;font-size:12px}.ref .md td,.ref .md th{border:1px solid #bbb;padding:3px 5px;vertical-align:top}
.ref .dzlink{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.cmt{border:1px solid #bbb;background:#fff;padding:6px 9px;margin:6px 0;border-radius:3px}
.cmt.author{background:#f0f7ee}
.cmt .by{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;color:#666}

/* letters page */
.letters{grid-column:1/-1;border:var(--panel-border);background:#fffdf3;padding:18px 20px}
.letters h3{margin:0;font-family:var(--title-font);font-weight:400;font-size:40px;letter-spacing:1px}
.letters .sub{font-family:var(--mono);font-size:11px;opacity:.7;margin-bottom:12px}
.letters .cols{columns:2 340px;column-gap:26px}
.letter{break-inside:avoid;margin:0 0 16px;font-family:system-ui,sans-serif;font-size:13.5px;line-height:1.5}
.letter .lt{font-family:var(--title-font);font-size:19px;letter-spacing:.4px;line-height:1.1;margin-bottom:4px}
.letter .pri{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--red);color:#fff;padding:1px 5px;margin-right:5px;vertical-align:2px}
.letter .pri.p2{background:#c77d00}.letter .pri.p3{background:#777}
.letter .anc{font-family:var(--mono);font-size:10px;opacity:.7}
.letter .q{font-style:italic;border-left:3px solid #999;padding-left:9px;margin:5px 0}
.letter .a{padding-left:12px;border-left:3px solid var(--grn);margin-top:4px}
.letter .a b.ed{font-family:var(--title-font);font-weight:400;font-size:15px;letter-spacing:.5px;color:var(--grn)}
body[data-plan="052"] .letters{background:#e9e2cf}
body[data-plan="052"] .letter .q{font-family:'Special Elite',monospace;font-style:normal;font-size:13px}

/* cover */
.cover{grid-column:1/-1;position:relative;border:var(--panel-border);overflow:hidden}
.cover svg{display:block;width:100%;height:auto}
.cover .meta{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.cover .meta a,.cover .meta span{font-family:var(--mono);font-size:11px;font-weight:700;background:#141414;color:#ffd23f;padding:2px 7px;text-decoration:none}
body[data-plan="052"] .cover .meta a,body[data-plan="052"] .cover .meta span{background:#e8e2d4;color:#111}

/* dossier */
.dossier{max-width:1000px;margin:0 auto;padding:10px 16px 90px;font-family:system-ui,sans-serif}
.dossier > header{border:var(--panel-border);background:var(--ink);color:var(--paper);padding:18px 20px}
.dossier > header h2{margin:0;font-family:var(--title-font);font-weight:400;font-size:44px;letter-spacing:1px}
.dossier > header p{margin:4px 0 0;font-size:14px;opacity:.85}
.dz-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dz-tabs button{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 10px;font-family:var(--mono);font-size:12px;font-weight:700}
body[data-plan="052"] .dz-tabs button{border-color:#d9d2c1}
.dz-tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.dz-body{background:#fffdf7;color:#1b1b1b;border:var(--panel-border);padding:16px 18px;font-size:14px;line-height:1.55}
.dz-body h3{font-family:var(--title-font);font-weight:400;font-size:26px;letter-spacing:.5px;margin:18px 0 6px}
.dz-item{border-top:1px solid #ddd;padding:10px 0}
.dz-item:target,.dz-item.hl{background:#fff3b0}
.dz-item .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.dz-item .rid{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:#1b1b1b;padding:1px 6px;border-radius:2px}
.dz-item .t{font-weight:700}
.dz-item .meta{font-family:var(--mono);font-size:11px;color:#555}
.drawn{font-family:var(--mono);font-size:11px;margin-top:4px}
.drawn button{border:0;background:#1b1b1b;color:#ffd23f;font-family:var(--mono);font-size:10.5px;padding:1px 5px;margin:1px 3px 1px 0;border-radius:2px}
.drawn .none{color:#b00}
.dz-body .md pre{background:#161616;color:#e8e8e8;padding:8px;overflow:auto;font-size:12px;border-radius:3px}
.dz-body .md table{border-collapse:collapse;font-size:12.5px;display:block;overflow:auto}.dz-body .md td,.dz-body .md th{border:1px solid #bbb;padding:3px 6px;vertical-align:top}
.dz-body .md code{font-size:.88em;background:#f0ece0;padding:0 3px;border-radius:2px}
.dz-body .md pre code{background:none;padding:0}
.ftable{width:100%;border-collapse:collapse;font-size:12.5px}
.ftable td,.ftable th{border-bottom:1px solid #e3e0d6;padding:4px 6px;text-align:left;vertical-align:top}
.ftable td:first-child{font-family:var(--mono);font-size:11.5px;word-break:break-all}

<div class="footer-note">Plan Lab 08 · The Graphic Novel · every panel is inline SVG · sources: docs/tasks/062-auto-mail-walking-skeleton/plan.html, docs/tasks/052-reflect-tool-hardening/plan.html, epic-005 guard rails, the 052 spike report and feedback.md</div>
<script id="plan-data" type="application/json">{"062": {"doc": {"title": "062: auto-mail-walking-skeleton", "status": "complete", "pr": "https://github.com/mistakenot/auto-stack/pull/146", "generated": "2026-08-25", "next-prompt": "/commit-task 062"}, "sections": [{"id": "problem", "title": "Problem", "tab": "Requirements", "body": "The stack carries events *outward* — `auto-shared/bus` broadcasts what happened\nto whoever is listening — but nothing carries a message **to a named recipient**\nand guarantees it survives until someone acts on it. A supervisor learns its\nchild crashed by noticing silence. An agent in `auto-stack` that finds a bug in\n`auto-web` has nowhere to put that fact. Two agents in a swarm rediscover the\nsame thing independently.\n\n[Epic 005](../../epics/epic-005-auto-mail-mvp.html) fills that gap with\n`auto mail`: a durable, addressed, at-least-once channel between agents on one\nhost. This task is the epic's **T1 — the walking skeleton**.\n\nThe risk T1 exists to retire is not the store. It is **hook → notification**:\nwhether a working agent can be told it has mail, in-band, cheaply, without\nbreaking its turn. Deferring that would defer all the risk, so it is inside the\nskeleton. The second thing it retires is the *oracle*: the harness scenario is\nstood up now so T2–T4 are developed against a working end-to-end test rather\nthan one that arrives at the end and can only confirm what was already built."}, {"id": "scope-statement", "title": "What this task is", "summary": "Ontology first, then a harness scenario with two agents on one host, then one message travelling between them and being acked — proven by the scenario.", "tab": "Requirements", "body": "Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab)."}, {"id": "target-transcript", "title": "The transcript this task must make real (C1)", "tab": "Requirements", "body": ""}, {"id": "goals", "title": "Goals", "tab": "Requirements", "body": "1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4).** `auto mail subscribe|send|list|ack` — flat\n   verbs on `mail` as the resource noun, JSON on stdout, diagnostics on stderr.\n   Plus `init`, `docs` and `reset`.\n\n6. **Broadcast delivery with a compare-and-set ack (D-7, G2, G13).** Consumer\n   state is keyed by `(subscription, mail)`, delivery rows are materialised\n   **lazily against a subscription cursor** (D-10), and `ack` is a conditional\n   update inside the append-and-project transaction that **reports whether this\n   call won the transition**.\n\n7. **An in-band nudge to a working agent (G8).** `auto hooks fire` — the\n   existing PostToolUse adapter that already emits `hookSpecificOutput.\n   additionalContext` for hint rules — also tells an agent it has mail. The\n   no-mail path costs a `stat`, never opens the store, and can never stall or\n   break the hook.\n\n8. **The harness scenario is the verdict (G15).** A new, purely additive\n   `mail-flow` scenario under `harness/scenarios/` brings up two agents on one\n   host, runs the C1 loop against the **real `auto` binary in a container**, and\n   asserts the nudge and the ack. A capability that cannot be demonstrated there\n   is not finished.\n\n9. **Nothing already shipped breaks.** The package is new; the only edits to\n   existing code are additive command registration, the hook's mail check, and\n   the glossary. `make check` and `make test` stay green."}, {"id": "inherited-rails", "title": "Inherited guard rails", "summary": "Twelve rails from epic 005. Each maps to exactly one acceptance criterion in the Verification tab.", "tab": "Requirements", "body": "| Rail | Constraint (abridged) | Becomes |\n|---|---|---|\n| **G1** | Mail rows and events are immutable; state changes are appended and re-projected | AC-3 |\n| **G2** | Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row | AC-4 |\n| **G3** | Ack is a separate explicit call; reading does not retire mail | AC-5 |\n| **G4** | At-least-once and unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to."}, {"id": "out-of-scope", "title": "Out of Scope", "tab": "Requirements", "body": "Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem)."}, {"id": "references", "title": "Reference code & docs", "summary": "Verified paths this task builds on or extends.", "tab": "Requirements", "body": "**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck."}, {"id": "decisions", "title": "Decisions taken while writing these requirements", "tab": "Requirements", "body": "These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected."}, {"id": "open-questions", "title": "Open Questions & Assumptions", "summary": "No open pd-questions — every fork was resolvable from the epic or an existing repo pattern. These are the assumptions carried forward.", "tab": "Requirements", "body": "Assumptions this task proceeds on. Each is safe to revisit without redoing work:\n\n- [ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\n  backlog records maildir as \"genuinely better for lock-free concurrent append\"\n  but superseded by SQLite once subscriptions, read state and bindings exist.\n  `modernc.org/sqlite` is already a direct dependency of two modules, so this\n  adds no runtime dependency.\n- [ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\n  write connection per process, with every write in one immediate transaction.**\n  D-11 names this as an explicit T1 concern; this is the conventional answer and\n  is asserted under `-race` rather than assumed.\n- [ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\n  cross-host merge argument in the backlog (§3). Subscription ids follow the\n  `sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\n  the store relies on**: cursors and every \"after this point\" comparison use the\n  log's own append sequence, because ULID monotonicity is process-local and\n  every `auto mail` verb is a separate process (D-11).\n- [ ] **The body is a JSON object**, and `--message <text>` is sugar for\n  `{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n  `kind` vocabulary and the open `attributes` map are additive fields on the\n  envelope.\n- [ ] **`auto mail list` with no filters returns every unacked delivery for every\n  subscription the caller is bound to**, per the project convention that\n  list commands return all items when no filters are given. `--address` scopes it\n  to one subscription.\n- [ ] **The sender's `from` address is resolved by a three-rung ladder**, because\n  a plain `auto mail send` process sees neither the hook payload's `agent` nor a\n  `session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n  `--from <address>`; (2) the address of a subscription bound to the caller's\n  `(manager, target)` — lowest subscription id when there is more than one, so it\n  is deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\n  project registry, or `unregistered/agent` when the cwd is not a registered\n  project. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\n  own reply address first, which is also how it becomes reachable for a reply. The\n  result is always a resolved absolute address, never a relative handle (G5).\n- [ ] **`--text` output mode is not built in T1.** JSON is the default and the\n  only mode; the consumers in T1 are agents and the harness. It arrives with T4's\n  adoption surface if a human ever needs it."}, {"id": "test-strategy", "title": "Test Strategy", "summary": "Conformance-test driven: the guard rails are written as executable expectations first, and the harness scenario is the verdict.", "tab": "Verification", "body": "The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment."}, {"id": "coverage-map", "title": "Coverage Map", "tab": "Verification", "body": ""}, {"id": "acceptance-criteria", "title": "Acceptance Criteria", "summary": "Thirteen criteria: one per inherited guard rail, plus the C1 transcript and the harness scenario itself.", "tab": "Verification", "body": "Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped."}, {"id": "verification-gaps", "title": "Known Gaps & Risks", "tab": "Verification", "body": "Stated rather than hidden. None of these blocks T1; each names who closes it.\n\n- **The `mail.Client` seam has one implementation.** Seam 1 warns that an\n  abstraction with one implementation is a guess. The conformance suite is the\n  mitigation (D-062-5), but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10)."}, {"id": "approach", "title": "Approach", "summary": "A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle.", "tab": "Solution", "body": "Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built."}, {"id": "end-state-flow", "title": "How one message travels", "summary": "Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions.", "tab": "Solution", "body": ""}, {"id": "end-state-schema", "title": "The store at the end of this task", "tab": "Solution", "body": "Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against."}, {"id": "end-state-api", "title": "The client seam", "tab": "Solution", "body": ""}, {"id": "end-state-cli", "title": "The command surface at the end of this task", "tab": "Solution", "body": ""}, {"id": "file-changes", "title": "File Changes", "tab": "Solution", "body": ""}, {"id": "rejected-alternatives", "title": "Rejected Alternatives", "tab": "Solution", "body": "- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none."}, {"id": "summary", "title": "Summary", "tab": "Plan", "body": "Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle."}, {"id": "execution-sequence", "title": "Execution Sequence", "tab": "Plan", "body": "The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit."}, {"id": "success-criteria", "title": "Success Criteria", "tab": "Plan", "body": "- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines."}], "decisions": [{"id": "D-062-1", "title": "Two agents on one host = two workspaces in one container, not two containers", "status": "accepted", "by": "agent", "summary": "The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts.", "tab": "Requirements", "body": "**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control."}, {"id": "D-062-2", "title": "A binding is keyed by the physical context hooks already capture", "status": "accepted", "by": "agent", "summary": "Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing.", "tab": "Requirements", "body": "**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes."}, {"id": "D-062-3", "title": "The no-mail hook path is gated by a pending-flag file, not a store read", "status": "accepted", "by": "agent", "summary": "G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite.", "tab": "Requirements", "body": "**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package."}, {"id": "D-062-4", "title": "T1 ships init, docs and reset; quickstart and doctor land in T4", "status": "accepted", "by": "agent", "summary": "The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing.", "tab": "Requirements", "body": "**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim."}, {"id": "D-062-5", "title": "T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface", "status": "accepted", "by": "agent", "summary": "D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3.", "tab": "Requirements", "body": "**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire."}, {"id": "D-062-6", "title": "Inline notification in T1 is the pending flag; the bus event waits for the daemon", "status": "accepted", "by": "agent", "summary": "D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host.", "tab": "Requirements", "body": "**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes."}, {"id": "D-062-7", "title": "Losing an ack race is a reported outcome, not an error exit", "status": "accepted", "by": "agent", "summary": "wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage.", "tab": "Requirements", "body": "**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free."}, {"id": "D-062-8", "title": "One exported package, `auto-mail/mail`; the store stays internal", "status": "accepted", "by": "agent", "summary": "Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint.", "tab": "Solution", "body": "**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence."}, {"id": "D-062-9", "title": "The hook writes one hookSpecificOutput object, carrying every fragment", "status": "accepted", "by": "agent", "summary": "The existing hint path already emits at most one object per event; a second producer must join it, not write a second line.", "tab": "Solution", "body": "**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge."}], "acs": [{"id": "AC-1", "title": "G16 — the ontology lands before the code that uses it", "phases": "1", "tests": "auto-mail/mail/mail_test.go", "body": "- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green"}, {"id": "AC-2", "title": "C1 — the epic's transcript runs verbatim", "phases": "1,2", "tests": "auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `<projectId>/agent`, or `unregistered/agent` outside a registered project"}, {"id": "AC-3", "title": "G1 — mail and events are immutable", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go", "body": "- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)"}, {"id": "AC-4", "title": "G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor", "phases": "2,4", "tests": "auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go", "body": "- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)"}, {"id": "AC-5", "title": "G3 — ack is a separate explicit call; reading does not retire", "phases": "2,4", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller"}, {"id": "AC-6", "title": "G13 / D-7 — ack transitions exactly once and reports whether it won", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint"}, {"id": "AC-7", "title": "G4 — at-least-once and unordered, as documented", "phases": "4,5", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "body": "- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide"}, {"id": "AC-8", "title": "G5 / D-9 — addresses are virtual and free-form", "phases": "2,3", "tests": "auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go", "body": "- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)"}, {"id": "AC-9", "title": "G6 — send with no subscription persists, and reports both counts", "phases": "4", "tests": "auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)"}, {"id": "AC-10", "title": "G8 — the nudge is free when there is no mail, and can never break the hook", "phases": "3", "tests": "auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail
