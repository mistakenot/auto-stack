any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced."}, {"id": "end-state", "title": "End-state CLI", "tab": "Solution", "body": ""}, {"id": "key-apis", "title": "Key APIs", "tab": "Solution", "body": ""}, {"id": "file-changes", "title": "File Changes", "tab": "Solution", "body": ""}, {"id": "rejected-alternatives", "title": "Rejected Alternatives", "tab": "Solution", "body": "- **F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n  `gap list` matches the gap→observation mental model and is discoverable.\n- **F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\n  more consumers, and fights the repo's \"list returns a plain payload of all\n  items\" convention. Top-level id on mutations + per-element id on reads solves\n  the threading pain with the least breakage.\n- **F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n  (D-3): leaves the inconsistent nesting in place; we still normalize the shapes.\n- **F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\n  and event ids are distinct-in-time records; hashing would collapse them.\n- **F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\n  collision is negligible; a suffix breaks the idempotency property and adds a\n  state read at mint.\n- **F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\n  per-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.\n- **F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\n  the conventional health command across auto-* tools.\n- **F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\n  only gap is the list view dropping them."}, {"id": "solution-decisions", "title": "Decisions", "tab": "Solution", "body": ""}, {"id": "summary", "title": "Summary", "tab": "Plan", "body": "Stand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits."}, {"id": "execution-sequence", "title": "Execution Sequence", "tab": "Plan", "body": ""}, {"id": "phases", "title": "Phases", "tab": "Plan", "body": ""}, {"id": "success-criteria", "title": "Success Criteria", "tab": "Plan", "body": "- **P1** → AC-4, AC-5 (observation), AC-7\n- **P2** → AC-6, AC-7\n- **P3** → AC-4, AC-5, AC-11\n- **P4** → AC-3\n- **P5** → AC-1, AC-2\n- **P6** → AC-10\n- **P7** → AC-8, AC-9, AC-12, AC-13, and AC-14 (full-suite + e2e green)\n\nAll 14 acceptance criteria pass; `go build ./...` and `go test ./...` clean;\n`golangci-lint` clean; the end-to-end reflect loop completes through `gap list`."}], "decisions": [{"id": "D-1", "title": "F4 surface = dedicated `gap list`", "status": "accepted", "by": "charlie", "summary": "Dedicated `auto reflect gap list`, not a generic events --full flag.", "tab": "Requirements", "body": "**Decision:** Expose gaps via a dedicated `auto reflect gap list` command.\n**Alternatives:** A generic `events list --full/--payload` flag; both.\n**Consequences:** Matches the \"gap → observation\" mental model and is discoverable;\nthe generic payload-dump flag is left out of scope."}, {"id": "D-2", "title": "Event log is git-tracked", "status": "accepted", "by": "charlie", "summary": "events/ tracked; init .gitignore ignores only playbook.json.", "tab": "Requirements", "body": "**Decision:** The canonical `.auto/reflect/events/*.jsonl` log is committed\n(shared playbook history; any clone can `rebuild`). The init-written\n`.auto/reflect/.gitignore` ignores only the disposable `playbook.json`.\n**Alternatives:** Ignore events too (machine-local reflect state).\n**Consequences:** Reflect history travels with the repo and across hosts."}, {"id": "D-3", "title": "F5 = restructure to a uniform envelope (breaking)", "status": "accepted", "by": "charlie", "summary": "One uniform output envelope; top-level id/ids. Breaks existing consumers.", "tab": "Requirements", "body": "**Decision:** Restructure command output to one uniform envelope rather than\nadditively bolting a top-level `.id` onto today's shapes.\n**Alternatives:** Non-breaking additive `.id`/`.ids`.\n**Consequences:** Cleanest end state; existing output consumers (and the skill\nreferences' documented extraction paths) must be updated in lockstep."}, {"id": "D-4", "title": "Content-derived ids included in 052", "status": "accepted", "by": "charlie", "summary": "Deterministic content-hashed ids ship in this task.", "tab": "Requirements", "body": "**Decision:** Implement content-derived ids (F7) in this task, not a follow-up.\n**Consequences:** Adds collision-handling design; fits the output-contract theme\nsince deterministic ids make `--dry-run` output actionable."}, {"id": "D-5", "title": "F5 changes CLI output only — not the stored event schema", "status": "accepted", "by": "agent", "summary": "Envelope restructure is presentation-layer; on-disk payloads + schema_version=1 unchanged.", "tab": "Requirements", "body": "**Context:** Stored payload field names (`observation_id`, `rule_id`, …) are part\nof the append-only on-disk contract; `events.SchemaVersion` is 1 and must fold\nidentically forever.\n**Decision:** F5 restructures only CLI *output* marshalling. Stored event payload\nfield names and `schema_version` are untouched.\n**Consequences:** No schema bump; the uniform envelope is a view over canonical\ndata, consistent with \"playbook is a disposable cache, events are canonical.\""}, {"id": "D-6", "title": "Content-derived ids preserve existing id formats", "status": "accepted", "by": "agent", "summary": "Only minting changes (random → content hash); regex formats like ^ob-[0-9a-f]{8}$ stay.", "tab": "Requirements", "body": "**Context:** Ids are validated against fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`."}, {"id": "D-7", "title": "F5 final shape: top-level id on mutations, per-element id on reads", "status": "accepted", "by": "charlie", "summary": "Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.", "tab": "Solution", "body": "**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array."}, {"id": "D-8", "title": "Content-derived ids: rules + observations only", "status": "accepted", "by": "charlie", "summary": "r-/ob- become content hashes; rt-/fb-/ev- stay random.", "tab": "Solution", "body": "**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids."}, {"id": "D-9", "title": "Pure content hash, no collision suffix", "status": "accepted", "by": "charlie", "summary": "id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.", "tab": "Solution", "body": "**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks)."}], "acs": [{"id": "AC-1", "title": "gap list surfaces reported gaps (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "body": "**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted."}, {"id": "AC-2", "title": "gap list obeys list conventions (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "body": "**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available."}, {"id": "AC-3", "title": "One pending count, two callers agree (F2)", "phases": "4", "tests": "auto-reflect/internal/cli/miner_integration_test.go", "body": "**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged."}, {"id": "AC-4", "title": "Mutating commands expose a top-level id (F5)", "phases": "1,2,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go", "body": "**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)"}, {"id": "AC-5", "title": "Collection commands expose .[].id without data loss (F5)", "phases": "1,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go", "body": "**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths."}, {"id": "AC-6", "title": "Content-derived ids make consolidate deterministic + idempotent (F7)", "phases": "1,2", "tests": "auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go", "body": "**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists."}, {"id": "AC-7", "title": "Ids keep their format (F7/D-6)", "phases": "1,2", "tests": "auto-reflect/internal/idhash/idhash_test.go", "body": "**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids."}, {"id": "AC-8", "title": "init writes an idempotent .gitignore (F9)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "body": "**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it."}, {"id": "AC-9", "title": "Canonical events tracked, cache ignored (F9/D-2)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "body": "**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked)."}, {"id": "AC-10", "title": "doctor detects stale/partial state (F1)", "phases": "6", "tests": "auto-reflect/internal/cli/doctor_integration_test.go", "body": "**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail."}, {"id": "AC-11", "title": "Rule listings carry timestamps (F6)", "phases": "3", "tests": "auto-reflect/internal/rules/projection_test.go", "body": "**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto reflect rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map)."}, {"id": "AC-12", "title": "outcome enum + correction_density documented (F8/F3)", "phases": "7", "tests": "", "body": "**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set."}, {"id": "AC-13", "title": "Legacy yaml removed (F11)", "phases": "7", "tests": "", "body": "**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove."}, {"id": "AC-14", "title": "No regressions (cross-cutting)", "phases": "1,2,3,4,5,6,7", "tests": "auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go", "body": "**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`."}], "threads": [{"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`feedback` can't expose a minted top-level id without a service.go change not in the plan", "tab": "Verification", "comments": [{"by": "review", "text": "AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes."}, {"by": "author", "text": "Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope)."}]}, {"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes", "tab": "Verification", "comments": [{"by": "review", "text": "AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`."}, {"by": "author", "text": "Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list."}]}, {"anchor": "AC-13", "status": "resolved", "priority": "p3", "title": "`no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills", "tab": "Verification", "comments": [{"by": "review", "text": "The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove."}, {"by": "author", "text": "Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match."}]}, {"anchor": "end-state", "status": "resolved", "priority": "p2", "title": "gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists", "tab": "Solution", "comments": [{"by": "review", "text": "The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`."}, {"by": "author", "text": "Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id."}]}, {"anchor": "auto-reflect/internal/rules/model.go", "status": "resolved", "priority": "p1", "title": "Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id", "tab": "Solution", "comments": [{"by": "review", "text": "There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan."}, {"by": "author", "text": "Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2."}]}, {"anchor": "auto-reflect/internal/observations/model.go", "status": "resolved", "priority": "p3", "title": "Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set", "tab": "Solution", "comments": [{"by": "review", "text": "Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered."}, {"by": "author", "text": "Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately."}]}], "phases": [{"n": "1", "title": "Foundations + walking skeleton", "status": "done", "files": ["auto-reflect/internal/idhash/idhash.go", "auto-reflect/internal/idhash/idhash_test.go", "auto-reflect/internal/cli/output.go", "auto-reflect/internal/observations/model.go", "auto-reflect/internal/observations/model_test.go", "auto-reflect/internal/cli/observation.go", "auto-reflect/internal/cli/observation_integration_test.go"], "body": "Thin path through every layer the task touches: id minting → command → output\n→ test.\n\n1. Add `internal/idhash/idhash.go`: `Derive(prefix string, parts ...string)\n   string` = `prefix + first 8 hex of sha256(strings.Join(parts,\"\\n\"))`.\n   **Verify:** `idhash_test.go` — same parts → same id; format `^p-[0-9a-f]{8}$`;\n   different parts → different id.\n2. Add `cli/output.go`: `mutationResult(id, fields)` and\n   `mutationResultIDs(ids, fields)` injecting top-level `id`/`ids`.\n   **Verify:** unit/compile.\n3. `observations/model.go`: `NewObservationID` takes canonical parts\n   (`kind,subject,evidence…,domain,severity`) and calls `idhash.Derive(\"ob\",…)`.\n   Update the existing zero-arg `TestNewObservationIDFormat`\n   (`observations/model_test.go`) for the new signature.\n   **Verify:** `go test ./internal/observations/...`.\n4. `observation.go`: `observation add` returns top-level `.id`\n   (via `mutationResult`); `observation list` elements carry top-level `id`.\n   **Verify:** `observation_integration_test.go` — `add` exposes `.id` matching\n   `^ob-[0-9a-f]{8}$`; re-adding identical observation is idempotent (same id);\n   `list | jq '.observations[].id'` non-empty.\n5. **Phase verify:** `go build ./...`; `go test ./internal/observations/...\n   ./internal/cli/... -run 'Observation|Idhash'`; `golangci-lint run`.\n6. **Commit:** `feat(052): content-hash ids + output envelope (skeleton on observation)`."}, {"n": "2", "title": "Rule content ids + consolidate determinism", "status": "done", "depends-on": "1", "files": ["auto-reflect/internal/rules/model.go", "auto-reflect/internal/cli/consolidate.go", "auto-reflect/internal/cli/rule.go", "auto-reflect/internal/cli/consolidate_integration_test.go", "auto-reflect/internal/loop/service_test.go"], "body": "1. `rules/model.go`: `NewRuleID` takes canonical parts\n   (`domain,use_when,content,rule_type`) → `idhash.Derive(\"r\",…)`.\n   **Verify:** `go test ./internal/rules/...`.\n2. Feed content to **every** `NewRuleID` caller — the signature is variadic, so a\n   missed zero-arg call still compiles but mints a constant id: `consolidate.go`\n   `createDraft`/`split`, **and `rule.go` `rule create`** (the third caller).\n   Emit top-level `ids` from `consolidate` via `mutationResultIDs`; dry-run and\n   apply now mint the same id from the same content. Update `loop/service_test.go`\n   (calls `NewRuleID` zero-arg today) for the new signature.\n   **Verify (the F7 acceptance):** `consolidate_integration_test.go` — run\n   `--dry-run` then apply on one delta in separate command calls; assert\n   `ids[0]` identical; assert a second apply is a no-op (no duplicate rule in\n   the refold); plus a `rule create` smoke check that two distinct creates get\n   distinct ids.\n3. **Phase verify:** `go build ./...`; `go test ./internal/rules/...\n   ./internal/loop/... ./internal/cli/... -run 'Rule|Consolidate|Service'`;\n   `golangci-lint run`.\n4. **Commit:** `feat(052): deterministic content-derived rule ids (F7)`."}, {"n": "3", "title": "Envelope rollout + rule timestamps", "status": "done", "depends-on": "1,2", "files": ["auto-reflect/internal/cli/rule.go", "auto-reflect/internal/cli/retrieve.go", "auto-reflect/internal/cli/select.go", "auto-reflect/internal/cli/feedback.go", "auto-reflect/internal/rules/projection_test.go"], "body": "1. `rule.go`: `create/edit/promote/retire/graduate` return top-level `.id`\n   (fixes the `null`); `rule list` projection map gains `created_at`/`updated_at`\n   (F6 — values already on the folded `Rule`).\n   **Verify:** `rule get`/`list | jq '.rules[].created_at'` non-empty.\n2. `retrieve.go`, `select.go`: each array element gains a top-level `id`\n   (aliasing `retrieval_id`/`feedback_id`, which stay).\n   **Verify:** `retrieve|select | jq '.[].id'` non-empty.\n3. `feedback.go`: recorded result echoes `ids` (the feedback ids acted on).\n4. `projection_test.go`: assert `Fold` surfaces `created_at`/`updated_at` and\n   `rule list` carries them.\n   **Verify (F6).**\n5. **Phase verify:** `go build ./...`; `go test ./internal/...\n   -run 'Rule|Retrieve|Select|Feedback|Projection'`; `golangci-lint run`.\n6. **Commit:** `feat(052): uniform id access on commands + rule timestamps (F5,F6)`."}, {"n": "4", "title": "Single-source pending count", "status": "done", "depends-on": "1", "files": ["auto-reflect/internal/cli/miner.go", "auto-reflect/internal/cli/miner_integration_test.go"], "body": "1. **First reproduce** the divergence: a test that drives `miner status` and\n   `stats` on a fixture and asserts they currently differ (pin the bug before\n   fixing — Verification risk note).\n2. `miner.go`: delete the hand-rolled pending loop (~L280); call\n   `miner.PendingCount(repoRoot, etlRoot)` — the same function `stats` uses.\n   Preserve the 023 null-vs-zero coverage contract in the status output.\n3. **Verify (F2):** `miner_integration_test.go` — `miner status` `pending` ==\n   `stats` `pending_to_mine` on the same fixture.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... ./internal/miner/...\n   -run 'Miner|Stats|Pending'`; `golangci-lint run`.\n5. **Commit:** `fix(052): one pending-count source for miner status + stats (F2)`."}, {"n": "5", "title": "gap list command", "status": "done", "depends-on": "1", "files": ["auto-reflect/internal/cli/gap.go", "auto-reflect/internal/cli/gap_integration_test.go", "auto-reflect/internal/cli/root.go"], "body": "1. Add `cli/gap.go` `newGapCmd` → `gap list`: read `feedback` events\n   (`events.ReadAll`), decode `FeedbackPayload`, skip when `Gap == nil`, project\n   `{id (feedback event id, ev-…), session_id, ts, report, moment}` as an array with\n   per-element `id`. Flags `--since/--after/--before`, `--domain`,\n   `--format json|text`; return all when unfiltered (one filter mode at a time).\n2. Register `gap` in `root.go`.\n3. **Verify (F4):** `gap_integration_test.go` — events with gaps surface\n   (report+moment+source); gapless feedback omitted; `--since` filters; empty\n   state returns `[]`; text mode works.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Gap'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect gap list — readable feedback gaps (F4)`."}, {"n": "6", "title": "doctor command", "status": "done", "depends-on": "5", "files": ["auto-reflect/internal/cli/doctor.go", "auto-reflect/internal/cli/doctor_integration_test.go", "auto-reflect/internal/cli/root.go"], "body": "1. Add `cli/doctor.go` mirroring `auto-graph/internal/cli/doctor.go`:\n   `[]{check,status(pass|warn|fail),message,hint}` JSON, exit non-zero on any\n   `fail`. Checks: state dir present; `events/` present & decodable; snapshot\n   fresh vs folded log (stale ⇒ warn + `run auto reflect rebuild`); legacy\n   0-byte `feedback.jsonl` flagged. Preserve null-vs-zero coverage.\n2. Register `doctor` in `root.go` (after P5's gap registration — serialized to\n   avoid a root.go conflict).\n3. **Verify (F1):** `doctor_integration_test.go` — healthy state all `pass`\n   exit 0; missing `events/` ⇒ `fail` + hint + exit 1; stale snapshot ⇒ `warn`.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Doctor'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect doctor — state health checks (F1)`."}, {"n": "7", "title": "Docs, init gitignore, cleanup, e2e", "status": "done", "depends-on": "2,3,4,6", "files": ["auto-reflect/internal/cli/init.go", "auto-reflect/internal/cli/init_test.go", "auto-reflect/internal/cli/quickstart.go", "auto-reflect/internal/loop/feedback.go", "auto-reflect/internal/miner/score.go", "auto-reflect/cmd/autoreflect/e2e_loop_test.go", "auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go", "auto-reflect/CLAUDE.md", ".claude/skills/reflect-playbook/SKILL.md", ".claude/skills/reflect-playbook/references/retrieve.md", ".claude/skills/reflect-playbook/references/observe.md", ".claude/skills/reflect-playbook/references/mine.md", ".claude/skills/reflect-playbook/references/consolidate.md", "docs/reflection/observations.yaml"], "body": "1. `init.go`: after `MkdirAll(eventsDir)`, write `.auto/reflect/.gitignore`\n   (`playbook.json\\n`) only if absent (auto-doc stat-then-skip pattern).\n   **Verify (F9):** `init_test.go` — file created with `playbook.json`; second\n   init doesn't overwrite/duplicate; `events/` not ignored.\n2. Repo hygiene: `git rm --cached .auto/reflect/playbook.json`; commit the new\n   `.auto/reflect/.gitignore` and the existing `events/` log (D-2).\n3. Docstrings: `loop/feedback.go` (outcome enum), `miner/score.go`\n   (correction_density). (F8/F3)\n4. Delete `docs/reflection/observations.yaml`. The only live referencers are the\n   already-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\n   reads it); per F11 no migration — confirm the trio is retired. (F11)\n5. Docs: `quickstart.go` + skill refs (`SKILL.md`, `retrieve.md`, `observe.md`,\n   `mine.md`, `consolidate.md`) — new `jq` id paths, `gap list`, `doctor`,\n   outcome enum, correction_density, observation-`kind gap` vs feedback-gap.\n   `CLAUDE.md` autodoc index (run `auto doc fix`).\n6. Extend `e2e_loop_test.go` through `gap list`; update `e2e_lifecycle_test.go`\n   output-shape assertions to the new envelope.\n   **Verify (F4/F5/AC-14):** full loop mine→…→feedback→gap list passes.\n7. **Phase verify:** `go build ./...`; **full** `go test ./...`;\n   `golangci-lint run`; `auto reflect quickstart` happy path by hand.\n8. **Commit:** `docs(052): gap/doctor/enum docs, init gitignore, drop legacy yaml (F8,F3,F9,F11)`."}], "files": [{"path": "auto-reflect/internal/idhash/idhash.go", "change": "add", "note": "Content-hash id helper (F7)."}, {"pat sable** source of truth) is **untracked** (`??`).\n- So a fresh clone ships a `playbook.json` it **cannot** `rebuild` (no events to refold from). Pick one coherent policy: gitignore the cache + (optionally) track events, or gitignore both. Add to `.gitignore` either way.", "inScope": true, "plan": {"row": "F9", "prio": "", "finding": "`.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked)", "fix": "`auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**."}}, {"id": "F10", "title": "Mining does not advance the cursor (separate `miner ack` is a footgun)", "body": "Adding 11 observations left `pending` unchanged; only `miner ack` moved it. Documented, but easy to forget — and if you forget, the session resurfaces forever. A \"you observed against session X but never acked it\" nudge would help.", "inScope": false}, {"id": "F11", "title": "Legacy `docs/reflection/observations.yaml` (389 KB) still present", "body": "The skill says it *supersedes* the legacy `playbook-*` trio and *\"do not dual-write the old yaml.\"* But the old hand-rolled `observations.yaml` is still in the repo with no migration/cleanup path, so both systems coexist. A `migrate` or at least a documented \"archive the old yaml\" step would close this out.", "inScope": true, "plan": {"row": "F11", "prio": "", "finding": "Legacy `docs/reflection/*.yaml` from the superseded process still present", "fix": "**Remove** the legacy yaml (no migration — old process)."}}], "feedback": "# Feedback: Task 052\n\n## Problems faced\n1. **The whole loop \"works locally, fails in CI\" on a single omitempty field** — `TestE2ELoopQuickstart` asserted the `gap list` row carried a `session_id`, but `session_id` is `omitempty` and the feedback event's session resolves from `events.DetectSessionID()` (env vars). The dev shell exported a session id (inherited by the test e honest fix.\n- The `--all` pending-universe bug (review thread) was a direct consequence of single-sourcing onto `PendingCount` without threading the scope flag — collapsing duplication is right, but the shared function has to carry every axis the callers varied on.\n\n## Useful context\n- `context.md`'s file:line grounding (especially the F2/F6/F7 sections and the \"third `NewRuleID` caller\" note) was the highest-leverage artifact — it turned each phase into a targeted edit rather than a search.\n- `auto-graph/internal/cli/doctor.go` as the canonical `doctor` template; `cli/events.go` as the closest `gap list` pattern. Mirroring existing siblings kept the new nouns idiomatic.\n- Decisions D-5/D-6/D-9 (envelope = presentation-only, no schema bump; pure content hash, idempotency intended) were the load-bearing constraints — they pre-answered the \"should I change the stored payload?\" and \"should I add a collision suffix?\" questions that came up mid-implementation and in review.\n- `reflect-playbook` is a **managed skill**: edit `skills/reflect-playbook/` source and re-render via full `auto skill sync --locked` (never `--target`, which deletes other rendered skills). Editing the `.claude/` render target directly trips the pre-commit `skills-check`.\n"}}</script>

/* ============================================================
   RENDERER — turns STORY_xxx scripts + embedded plan DATA into
   the comic, the flip-backs, the letters page and the dossier.
   ============================================================ */
const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const STORIES = { '062': STORY_062, '052': STORY_052 };
const META = {
  '062': { kicker:'ISSUE', mode:'origin', chapterWord:'CHAPTER', matsTitle:'MATERIALS DELIVERED', letters:'LETTERS' },
  '052': { kicker:'CASE FILE', mode:'noir', chapterWord:'CHAPTER', matsTitle:'EVIDENCE LOG', letters:'TRANSCRIPTS' },
};
let PLAN = '062';
let REG = {};          // panelId -> {refs,label}
let DRAWN = {};        // refId -> [panelId]
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const clean = s => String(s||'').replace(/<script type="text\/plain">/g,'').replace(/<\/script>/g,'').trim();
const md = s => { s = clean(s); try { if (window.marked) return marked.parse(s, {mangle:false, headerIds:false}); } catch(e){} return `<pre>${esc(s)}</pre>`; };
const tick = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const safeCmt = s => esc(s).replace(/&lt;(\/?)(code|strong|em|b|i)&gt;/g,'<$1$2>').replace(/`([^`]+)`/g,'<code>$1</code>');

/* ---------------- reference resolution ---------------- */
function D(){ return DATA[PLAN]; }
function chipLabel(ref){
  if(ref.startsWith('T:')) return 'thread · '+(ref.slice(2).split('/').slice(-2).join('/'));
  if(ref.startsWith('S:')) return '§ '+ref.slice(2);
  if(ref.startsWith('CLI:')){ const [,i,j]=ref.split(':'); const c=D().clis[+i]; const nm=(c&&c.id)||(PLAN==='052'?'end-state CLI':(+i===1?'full surface':'CLI')); return j!==undefined? `${nm} · step ${+j+1}` : nm; }
  if(ref.startsWith('API:')){ const a=D().apis[+ref.slice(4)]; return 'API · '+(a?a.name.split(' ')[0]:'?'); }
  if(ref==='FB') return 'feedback.md';
  return ref;
}
function resolve(ref){
  const d=D(); let o=null;
  if(/^G\d+$/.test(ref) && d.rails){ const r=d.rails.find(x=>x.id===ref); if(r) o={id:r.id,title:r.title,meta:`epic 005 guard rail · ${r.kind}${r.metric?' · metric: '+r.metric:''} · ${r.inherited?'inherited by T1 → '+r.ac:'referenced only (not an inherited T1 rail)'}`,
      html:md(r.body)+(r.inherited?`<p><b>Plan’s abridged constraint:</b> ${md(r.abridged).replace(/^<p>|<\/p>\s*$/g,'')}</p>`:'')}; }
  else if(/^F\d+$/.test(ref) && d.findings){ const f=d.findings.find(x=>x.id===ref); if(f) o={id:f.id,title:f.title,meta:`spike report finding · ${f.inScope?('in scope'+(f.plan.prio?' · '+f.plan.prio:'')):'OUT OF SCOPE (deferred)'}`,
      html:md(f.body)+(f.inScope?`<p><b>Plan goal row (${esc(f.plan.row)}):</b></p>${md('**Finding:** '+f.plan.finding+'\n\n**Fix:** '+f.plan.fix)}`: md((d.sections.find(s=>s.id==='out-of-scope')||{}).body||''))}; }
  else if(/^AC-\d+$/.test(ref)){ const a=d.acs.find(x=>x.id===ref); if(a) o={id:a.id,title:a.title,meta:`phases ${a.phases||'—'} · tests ${a.tests||'—'}`,html:md(a.body)}; }
  else if(/^D-/.test(ref)){ const x=d.decisions.find(y=>y.id===ref); if(x) o={id:x.id,title:x.title,meta:`${x.status} · by ${x.by} · ${x.tab} tab`,html:(x.summary?`<p><i>${tick(x.summary)}</i></p>`:'')+md(x.body)}; }
  else if(/^P\d+$/.test(ref)){ const p=d.phases.find(y=>y.n===ref.slice(1)); if(p) o={id:'P'+p.n,title:p.title,meta:`status ${p.status||'—'} · depends on ${p['depends-on']||'—'} · ${p.files.length} files`,html:md(p.body)+`<details><summary>${p.files.length} files in this phase</summary><ul>${p.files.map(f=>`<li><code>${esc(f)}</code></li>`).join('')}</ul></details>`}; }
  else if(ref.startsWith('T:')){ const ts=d.threads.filter(t=>t.anchor===ref.slice(2)); if(ts.length) o={id:'thread',title:`${ts.length>1?ts.length+' threads':'Review thread'} on ${ref.slice(2)}`,meta:ts.map(t=>`${t.priority} · ${t.status}`).join(' | '),
      html:ts.map(t=>`<p><b>${esc(t.title)}</b></p>`+t.comments.map(c=>`<div class="cmt ${c.by}"><div class="by">${c.by==='review'?'reviewer':'author'}</div>${safeCmt(c.text)}</div>`).join('')).join('')}; }
  else if(ref.startsWith('S:')){ const s=d.sections.find(y=>y.id===ref.slice(2)); if(s) o={id:'§',title:s.title,meta:`${s.tab} tab · section #${s.id}`,html:(s.summary?`<p><i>${tick(s.summary)}</i></p>`:'')+md(s.body)}; }
  else if(ref.startsWith('CLI:')){ const [,i,j]=ref.split(':'); const c=d.clis[+i]; if(c){ const steps=j!==undefined?[c.steps[+j]]:c.steps; o={id:c.id||'CLI',title:c.title,meta:c.caption||'',html:`<div class="term">${steps.map(s=>`${s.note?`<span class="n"># ${esc(s.note)}${s.status?' ['+esc(s.status)+']':''}</span>\n`:''}<span class="c">$ ${esc(clean(s.cmd))}</span>\n${esc(clean(s.out))}`).join('\n\n')}</div>`}; } }
  else if(ref.startsWith('API:')){ const a=d.apis[+ref.slice(4)]; if(a) o={id:'API',title:a.name,meta:`${a.kind} · ${a.path}`,html:`<p><i>${esc(a.caption||'')}</i></p><ul>${a.members.map(m=>`<li><code>${esc(m.sig)}</code><br>${esc(clean(m.doc))}</li>`).join('')}</ul>`}; }
  else if(ref==='FB' && d.feedback){ o={id:'feedback',title:'Post-execution feedback (docs/tasks/052-reflect-tool-hardening/feedback.md)',meta:'how it actually went — not part of the plan',html:md(d.feedback.replace(/^# .*\n/,''))}; }
  return o || {id:ref,title:'(unresolved reference)',meta:'',html:''};
}
function refBlock(ref){ const o=resolve(ref); return `<div class="ref"><div><span class="rid">${esc(o.id)}</span><span class="rt">${esc(o.title)}</span></div><div class="meta">${esc(o.meta)}</div><div class="md">${o.html}</div><button class="dzlink" data-dz="${esc(ref)}">open in the full dossier ↓</button></div>`; }

/* ---------------- panel pieces ---------------- */
function seqHTML(seq){ return (seq||[]).map(s=>{
  if(s.c!==undefined) return `<div class="cap${s.w?' wide':''}${s.r?' r':''}">${s.c}</div>`;
  if(s.b!==undefined){ const k=s.k||''; const who=s.who?`<span class="who">${esc(s.who)}</span>`:''; const body = k==='cmd' ? `<span class="pr">$</span> ${esc(s.b)}` : s.b; return `<div class="ball ${s.at||'l'} ${k}">${who}${body}</div>`; }
  if(s.t!==undefined) return `<div class="tape${s.err?' err':''}"><span class="lbl">${esc(s.l||'stdout')}</span>${esc(s.t)}</div>`;
  if(s.html!==undefined) return `<div class="panelbody">${s.html}</div>`;
  return ''; }).join(''); }
function chipsHTML(refs){ return `<div class="chips">${(refs||[]).map(r=>`<button class="chip" data-ref="${esc(r)}" title="flip to the plan text">${esc(chipLabel(r))}</button>`).join('')}</div>`; }
function backHTML(){ return `<div class="back"></div>`; }
let PID=0;
function reg(refs,label){ const id='p'+(++PID); REG[id]={refs:refs||[],label}; (refs||[]).forEach(r=>{(DRAWN[r]=DRAWN[r]||[]).push(id);}); return id; }

function panelHTML(p,label){
  const id=reg(p.refs,label); const W=p.w*80, H=p.vhh||p.vh||300;
  const art = (!p.noart && p.art) ? `<svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${esc(label)}">${p.art(W)}</svg>` : '';

    <div class="front"><div class="txt">${seqHTML(p.seq)}</div>${art}<div class="foot">${chipsHTML(p.refs)}<button class="flipbtn" aria-label="flip panel to plan text"></button></div></div>${backHTML()}</div>`;
}

/* ---------------- DAG (chain vs web) ---------------- */
function layers(){ const ph=D().phases; const L={}; const dep=n=>{ const p=ph.find(x=>x.n===n); const ds=(p['depends-on']||'').split(',').filter(Boolean); return ds; };
  const lv=n=>{ if(L[n]!==undefined) return L[n]; const ds=dep(n); L[n]=ds.length?Math.max(...ds.map(lv))+1:0; return L[n]; };
  ph.forEach(p=>lv(p.n)); return {L,dep}; }
function dagSVG(cur,big){
  const ph=D().phases, {L,dep}=layers(); const maxL=Math.max(...Object.values(L)); const byL={}; ph.forEach(p=>(byL[L[p.n]]=byL[L[p.n]]||[]).push(p.n));
  const Wd=big?960:300, Hd=big?400:110, pad=big?120:22; const pos={};
  Object.entries(byL).forEach(([l,ns])=>ns.forEach((n,i)=>{ pos[n]=[pad+(Wd-2*pad)*(maxL?l/maxL:0.5), Hd/2-(big?14:0)+(i-(ns.length-1)/2)*(big?118:34)]; }));
  const noir=PLAN==='052'; const line=noir?C.blood:'#ffd23f'; const nodeF=noir?'#efe9da':'#fbf6e9';
  let e=''; ph.forEach(p=>dep(p.n).forEach(d=>{ const [x1,y1]=pos[d],[x2,y2]=pos[p.n]; e+=`<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" fill="none" stroke="${line}" stroke-width="${big?3:2}" ${noir?'':'stroke-dasharray="0"'}/>`; }));
  const r=big?30:11; let nd='';
  ph.forEach(p=>{ const [x,y]=pos[p.n]; const on=p.n===String(cur); nd+=`<g class="dagnode" data-ch="${p.n}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${on?r+3:r}" fill="${on?(noir?C.blood:'#e0357a'):nodeF}" stroke="${noir?'#000':'#141414'}" stroke-width="${big?3:2}"/><text x="${x}" y="${y+(big?6:4)}" text-anchor="middle" font-family="${noir?'Bebas Neue':'Bangers'}" font-size="${big?22:11}" fill="${on?'#fff':'#141414'}">P${p.n}</text>${big?(()=>{ const words=p.title.split(' '); const lines=['']; words.forEach(w=>{ if((lines[lines.length-1]+' '+w).trim().length>24) lines.push(w); else lines[lines.length-1]=(lines[lines.length-1]+' '+w).trim(); }); const bw=Math.max(...lines.map(l=>l.length))*7.4+16; return `<rect x="${x-bw/2}" y="${y+r+6}" width="${bw}" height="${lines.length*16+8}" fill="#efe9da" stroke="#000" stroke-width="1.5" transform="rotate(${(+p.n%3-1)*1.5} ${x} ${y+r})"/>`+lines.map((l,i)=>`<text x="${x}" y="${y+r+22+i*16}" text-anchor="middle" font-family="Special Elite" font-size="13" fill="#111">${esc(l)}</text>`).join(''); })():''}</g>`; });
  return `<svg class="dag" viewBox="0 0 ${Wd} ${Hd}">${e}${nd}</svg>`;
}

/* ---------------- block renderers ---------------- */
function fileChange(path){ const f=D().files.find(x=>x.path===path); return f?f.change:'?'; }
let CH=0, PN=0, SEC=null;
function renderBlock(b){
  const m=META[PLAN];
  if(b.type==='cover'){ PN=0; const id=reg(b.refs,'Cover'); const d=D().doc;
    return `<div class="strip" id="ch-cover"><div class="panel cover" id="${id}" style="grid-column:1/-1"><div class="front"><svg viewBox="0 0 960 ${b.vh||440}" role="img" aria-label="cover">${b.art(960)}</svg>
      <div class="meta"><span>${esc(d.title)}</span><span>status: ${esc(d.status)}</span><a href="${esc(d.pr)}" target="_blank" rel="noopener">${esc(d.pr.replace('https://github.com/',''))}</a><span>generated ${esc(d.generated)}</span></div>
      <div class="foot">${chipsHTML(b.refs)}<button class="flipbtn" aria-label="flip"></button></div></div>${backHTML()}</div></div>`; }
  if(b.type==='cast'){ return `<div class="strip"><div class="cast" id="ch-cast"><h3>${esc(b.title)}</h3><div class="grid">${b.people.map((p,i)=>{ const id=reg(p.refs,'Cast · '+p.nm); return `<div class="who-card" data-refs="${esc(p.refs.join('|'))}" data-pid="${id}" tabindex="0"><svg viewBox="0 0 160 152">${p.art()}</svg><div class="nm">${esc(p.nm)}</div>${(()=>{ let ds=p.ds; if(!ds && p.tag && D().findings){ const f=D().findings.find(x=>x.id===p.tag); if(f) ds=esc(f.title).replace(/`([^`]+)`/g,'<code>$1</code>'); } return ds?`<div class="ds">${ds}</div>`:''; })()}${p.tag?`<span class="chip tag">${esc(p.tag)}</span>`:''}</div>`; }).join('')}</div><div class="profile"></div></div></div>`; }
  if(b.type==='strip'){ return `<div class="strip">${b.panels.map(p=>{ PN++; return panelHTML(p, (SEC||(CH?`Ch.${CH}`:'Prologue'))+` · panel ${PN}`); }).join('')}</div>`; }
  if(b.type==='andthen'){ if(b.sec){SEC=b.sec;PN=0;} } if(b.type==='andthen') return `<div class="strip"><div class="andthen">${esc(b.text)}<small>${esc(b.sub||'')}</small></div></div>`;
  if(b.type==='chapter'){ CH=b.n; PN=0; SEC=null; const p=D().phases.find(x=>x.n===String(b.n)); const id=reg(['P'+b.n],`Ch.${b.n} header`);
    const deps=p['depends-on']?`depends on <b>P${p['depends-on'].split(',').join(', P')}</b>`:'<b>first</b> — no dependencies';
    return `<div class="strip" id="ch-${b.n}"><div class="panel chapter-wrap" id="${id}" style="grid-column:1/-1"><div class="front"><div class="chapter"><div><div class="kicker">${m.chapterWord} ${b.n} · Phase ${p.n} · ${esc(p.status||'')}</div><h2>${esc(b.title)}</h2><div class="ph">“${esc(p.title)}” · ${deps} · ${p.files.length} files</div></div>${dagSVG(b.n,false)}</div><div class="foot">${chipsHTML(['P'+b.n])}<button class="flipbtn" aria-label="flip to the phase text"></button></div></div>${backHTML()}</div></div>`; }
  if(b.type==='mats'){ const p=D().phases.find(x=>x.n===b.phase); const counts={}; p.files.forEach(f=>{const c=fileChange(f); counts[c]=(counts[c]||0)+1;});
    return `<div class="strip"><div class="mats"><h4>${m.matsTitle} — Phase ${p.n}<span>${p.files.length} files · ${Object.entries(counts).map(([k,v])=>`${v} ${k}`).join(' · ')}</span></h4><div class="crates">${p.files.map(f=>{const c=fileChange(f); return `<span class="crate" title="${esc((D().files.find(x=>x.path===f)||{}).note||'')}"><i class="${c}">${c==='add'?'NEW':c.toUpperCase()}</i>${esc(f)}</span>`;}).join('')}</div></div></div>`; }
  if(b.type==='casemap'){ const id=reg(['S:execution-sequence','S:summary'],'Case map');
    return `<div class="strip" id="ch-map"><div class="panel bg-cork" id="${id}" style="grid-column:1/-1"><div class="front"><div class="txt"><div class="cap">THE CASE MAP. Not a chain — a web. P1 unlocks P2, P4 and P5; P3 waits on P1 and P2; P6 waits on P5; P7 waits on P2, P3, P4 and P6. Click a pin to jump.</div></div>${dagSVG(0,true).replace('class="dag"','class="art casemap"')}<div class="foot">${chipsHTML(['S:execution-sequence','S:summary'])}<button class="flipbtn"></button></div></div>${backHTML()}</div></div>`; }
  if(b.type==='letters'){ const ts=D().threads; return `<div class="strip" id="ch-letters"><div class="letters"><h3>${esc(b.title)}</h3><div class="sub">${esc(b.sub)}</div><div class="cols">${ts.map(t=>{ const rv=t.comments.find(c=>c.by==='review'), au=t.comments.find(c=>c.by==='author'); return `<div class="letter"><div class="lt"><span class="pri ${esc(t.priority)}">${esc(t.priority)}</span>${esc(t.title)}</div><div class="anc">on ${esc(t.anchor)} · ${esc(t.status)}</div>${rv?`<div class="q">${PLAN==='062'?'Dear Editor — ':'Q: '}${safeCmt(rv.text)}</div>`:''}${au?`<div class="a"><b class="ed">${PLAN==='062'?'THE EDITOR REPLIES:':'A:'}</b> ${safeCmt(au.text)}</div>`:''}</div>`; }).join('')}</div></div></div>`; }
  return '';
}

/* ---------------- dossier ---------------- */
function drawnHTML(ref){ const ps=DRAWN[ref]||[]; return `<div class="drawn">drawn in: ${ps.length?ps.map(p=>`<button data-goto="${p}">${esc(REG[p].label)}</button>`).join(''):'<span class="none">not illustrated — dossier only</span>'}</div>`; }
function dzItem(ref, extra=''){ const o=resolve(ref); return `<div class="dz-item" id="dz-${esc(ref)}"><div class="hd"><span class="rid">${esc(o.id)}</span><span class="t">${esc(o.title)}</span></div><div class="meta">${esc(o.meta)}</div><div class="md">${o.html}</div>${extra}${drawnHTML(ref)}</div>`; }
function dossierTabs(){ const d=D(); const t=[];
  if(d.rails) t.push(['Guard rails', ()=>`<p>Twelve rails inherited from epic 005 (each → exactly one AC), plus the four the plan references but defers (G7, G9, G12, G14). Full epic text.</p>`+d.rails.map(r=>dzItem(r.id)).join('')]);
  if(d.findings) t.push(['Findings F1–F11', ()=>`<p>The spike report’s findings, verbatim, with the plan’s goal-table row for each one in scope.</p>`+d.findings.map(f=>dzItem(f.id)).join('')]);
  t.push(['Acceptance criteria', ()=>d.acs.map(a=>dzItem(a.id)).join('')]);
  t.push(['Decisions', ()=>d.decisions.map(x=>dzItem(x.id)).join('')]);
  t.push(['Phases', ()=>d.phases.map(p=>dzItem('P'+p.n)).join('')]);
  t.push([`Files (${d.files.length})`, ()=>`<table class="ftable"><tr><th>path</th><th>change</th><th>note</th><th>phase(s)</th></tr>${d.files.map(f=>`<tr><td>${esc(f.path)}</td><td><span class="badge ${f.change}">${f.change}</span></td><td>${esc(f.note)}</td><td>${d.phases.filter(p=>p.files.includes(f.path)).map(p=>'P'+p.n).join(', ')||'—'}</td></tr>`).join('')}</table>`]);
  t.push([`Review threads (${d.threads.length})`, ()=>[...new Set(d.threads.map(x=>x.anchor))].map(a=>dzItem('T:'+a)).join('')]);
  t.push([`All sections (${d.sections.length})`, ()=>['Requirements','Verification','Solution','Plan'].map(tab=>`<h3>${tab} tab</h3>`+d.sections.filter(s=>s.tab===tab).map(s=>dzItem('S:'+s.id)).join('')).join('')]);
  t.push(['Transcripts & APIs', ()=>d.clis.map((c,i)=>dzItem('CLI:'+i)).join('')+d.apis.map((a,i)=>dzItem('API:'+i)).join('')]);
  t.push(['Diagrams', ()=>d.mermaids.map((m,i)=>`<div class="dz-item"><div class="hd"><span class="rid">mermaid</span><span class="t">${esc(m.caption||'')}</span></div><div class="meta">${esc(m.tab)} tab</div><div class="mm" data-mm="${i}"><pre>${esc(m.src)}</pre></div></div>`).join('')]);
  if(d.feedback) t.push(['Feedback', ()=>dzItem('FB')]);
  t.push(['Coverage', ()=>{ const ids=[...(d.rails||[]).filter(r=>r.inherited).map(r=>r.id),...(d.findings||[]).map(f=>f.id),...d.acs.map(a=>a.id),...d.decisions.map(x=>x.id),...d.phases.map(p=>'P'+p.n),...[...new Set(d.threads.map(x=>x.anchor))].map(a=>'T:'+a)];
     const miss=ids.filter(i=>!(DRAWN[i]||[]).length);
     return `<p>Every guard rail / finding, acceptance criterion, decision, phase and review thread, and whether a panel illustrates it. Green = drawn in at least one panel (its flip side carries the verbatim text). <b>${ids.length-miss.length}/${ids.length}</b> illustrated${miss.length?'; the rest live in the dossier':''}. All ${d.files.length} files appear in the per-chapter ${META[PLAN].matsTitle.toLowerCase()} strips and the Files tab.</p><div class="cov">${ids.map(i=>`<div class="${(DRAWN[i]||[]).length?'':'miss'}" title="${esc(chipLabel(i))}">${esc(i.startsWith('T:')?'thread '+i.slice(2).split('/').slice(-2).join('/'):i)}</div>`).join('')}</div>`; }]);
  return t;
}
let MM=null;
function loadMermaid(){ if(MM) return MM; MM=new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js'; s.onload=()=>{ try{ mermaid.initialize({startOnLoad:false,theme:'neutral',securityLevel:'strict'}); }catch(e){} res(window.mermaid); }; s.onerror=()=>res(null); document.head.appendChild(s); }); return MM; }
async function renderMermaids(root){ const m=await loadMermaid(); if(!m) return; for(const el of $$('[data-mm]',root)){ const src=D().mermaids[+el.dataset.mm].src; try{ const {svg}=await m.render('mm'+PLAN+el.dataset.mm+Date.now(), src); el.innerHTML=svg; }catch(e){ /* keep source */ } } }
function renderDossier(){
  const tabs=dossierTabs(); const el=$('#dossier');
  el.innerHTML=`<header><h2>THE FULL DOSSIER</h2><p>Back matter. Everything in the plan, verbatim, so nothing the comic compresses is lost. Every panel’s <b>PLAN</b> corner flips to the exact source text; every item here links back to the panels that draw it.</p></header>
   <div class="dz-tabs" role="tablist">${tabs.map((t,i)=>`<button role="tab" aria-selected="${i===0}" data-tab="${i}">${esc(t[0])}</button>`).join('')}</div><div class="dz-body"></div>`;
  const show=i=>{ $$('.dz-tabs button',el).forEach((b,j)=>b.setAttribute('aria-selected',String(i===j))); const body=$('.dz-body',el); body.innerHTML=tabs[i][1](); if(tabs[i][0]==='Diagrams') renderMermaids(body); };
  show(0); el._show=show; el._tabs=tabs;
}
function openDossier(ref){
  const el=$('#dossier'), tabs=el._tabs; let idx=0;
  const want = /^G\d/.test(ref)?'Guard rails': /^F\d/.test(ref)?'Findings': /^AC-/.test(ref)?'Acceptance': /^D-/.test(ref)?'Decisions': /^P\d/.test(ref)?'Phases': ref.startsWith('T:')?'Review threads': ref.startsWith('S:')?'All sections': (ref.startsWith('CLI')||ref.startsWith('API'))?'Transcripts': ref==='FB'?'Feedback':'';
  tabs.forEach((t,i)=>{ if(want && t[0].startsWith(want)) idx=i; }); el._show(idx);
  const it=document.getElementById('dz-'+ref); if(it){ it.classList.add('hl'); setTimeout(()=>it.classList.remove('hl'),2200); it.scrollIntoView({behavior:'smooth',block:'center'}); } else el.scrollIntoView({behavior:'smooth'});
}

/* ---------------- flip mechanics ---------------- */
function flip(panel, on){
  const want = on===undefined ? !panel.classList.contains('flipped') : on;
  if(want){ const back=$('.back',panel); if(!back.dataset.done){ const r=REG[panel.id]; back.innerHTML=`<div class="bh"><span>From the plan — verbatim · ${esc(r.label)}</span><button class="unflip">↩ back to the panel</button></div>${r.refs.map(refBlock).join('')}`; back.dataset.done='1'; } }
  panel.classList.toggle('flipped', want);
}

/* ---------------- boot ---------------- */
function render(){
  REG={}; DRAWN={}; PID=0; CH=0; PN=0; SEC=null;
  document.body.dataset.plan=PLAN;
  $$('.switch button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.plan===PLAN)));
  const book=$('#book'); book.innerHTML=STORIES[PLAN].map(renderBlock).join('');
  renderDossier();
  const sel=$('#jump'); const opts=[['ch-cover','Cover'],['ch-cast',PLAN==='052'?'The usual suspects':'The cast']];
  if(PLAN==='052') opts.push(['ch-map','The case map']);
  D().phases.forEach(p=>{ const blk=STORIES[PLAN].find(b=>b.type==='chapter'&&String(b.n)===p.n); opts.push(['ch-'+p.n,`Ch.${p.n} — ${blk?blk.title:''}`]); });
  opts.push(['ch-letters',META[PLAN].letters],['dossier','Full dossier']);
  sel.innerHTML=`<option value="">Jump to…</option>`+opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
  $('#flipall').setAttribute('aria-pressed','false');
  document.title = PLAN==='062' ? 'Plan Lab 08 — #062 The Walking Skeleton' : 'Plan Lab 08 — #052 The Case of the Open Loop';
}
function setPlan(p){ PLAN=p; if(location.hash!=='#'+p) history.replaceState(null,'','#'+p); render(); window.scrollTo(0,0); }

document.addEventListener('click',e=>{
  const t=e.target;
  const sw=t.closest('.switch button'); if(sw){ setPlan(sw.dataset.plan); return; }
  if(t.closest('.flipbtn')){ flip(t.closest('.panel')); return; }
  if(t.closest('.unflip')){ const p=t.closest('.panel'); flip(p,false); p.scrollIntoView({block:'nearest'}); return; }
  const chip=t.closest('.chip[data-ref]'); if(chip){ const p=chip.closest('.panel'); if(p){ flip(p,true); const b=$(`.ref:nth-of-type(${REG[p.id].refs.indexOf(chip.dataset.ref)+1})`,p); } return; }
  const dz=t.closest('[data-dz]'); if(dz){ openDossier(dz.dataset.dz); return; }
  const go=t.closest('[data-goto]'); if(go){ const p=document.getElementById(go.dataset.goto); if(p){ p.scrollIntoView({behavior:'smooth',block:'center'}); p.classList.add('hl'); setTimeout(()=>p.classList.remove('hl'),2200);} return; }
  const tab=t.closest('.dz-tabs button'); if(tab){ $('#dossier')._show(+tab.dataset.tab); return; }
  const node=t.closest('.dagnode'); if(node){ const c=document.getElementById('ch-'+node.dataset.ch); if(c) c.scrollIntoView({behavior:'smooth'}); return; }
  const card=t.closest('.who-card'); if(card){ const prof=card.closest('.cast').querySelector('.profile'); const same=prof.dataset.for===card.dataset.pid; $$('.who-card',card.parentElement).forEach(c=>c.style.outline=''); if(same){ prof.innerHTML=''; prof.dataset.for=''; return; } card.style.outline='4px solid var(--accent)'; prof.dataset.for=card.dataset.pid; prof.innerHTML=`<div class="back" style="display:block;margin-top:12px;border:2px solid var(--ink)"><div class="bh"><span>From the plan — ${esc(card.querySelector('.nm').textContent)}</span><button class="unflip-prof">close</button></div>${card.dataset.refs.split('|').map(refBlock).join('')}</div>`; return; }
  if(t.closest('.unflip-prof')){ const prof=t.closest('.profile'); prof.innerHTML=''; prof.dataset.for=''; $$('.who-card').forEach(c=>c.style.outline=''); return; }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('who-card')){ e.preventDefault(); e.target.click(); } });
$('#jump').addEventListener('change',e=>{ const v=e.target.value; if(!v) return; const el=document.getElementById(v); if(el) el.scrollIntoView({behavior:'smooth'}); e.target.value=''; });
$('#flipall').addEventListener('click',e=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',String(on)); $$('#book .panel').forEach(p=>flip(p,on)); });
window.addEventListener('scroll',()=>{ const h=document.documentElement; const f=h.scrollTop/(h.scrollHeight-h.clientHeight||1); $('.progress').style.width=(f*100).toFixed(1)+'%'; },{passive:true});
window.addEventListener('hashchange',()=>{ const p=location.hash.slice(1); if(STORIES[p] && p!==PLAN) setPlan(p); });
PLAN = STORIES[location.hash.slice(1)] ? location.hash.slice(1) : '062';
render();

document.getElementById('todossier').addEventListener('click',()=>document.getElementById('dossier').scrollIntoView({behavior:'smooth'}));

</script>
</body>
