check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent"}, {"id": "AC-11", "title": "G10 / D-2 — alpha is in the type string and the filename, and reset works", "phases": "1,5", "tests": "auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go", "body": "- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade"}, {"id": "AC-12", "title": "G11 — nothing outside the mail package reads the store", "phases": "5", "tests": "auto-mail/conformance/seam_test.go", "body": "- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")"}, {"id": "AC-13", "title": "G15 — it passes end to end in the harness", "phases": "1,2,3,4,5", "tests": "harness/tests/mail_flow/test_mail_loop.py", "body": "- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the send-before-subscribe case passes (AC-9's J2 half)\n- **And** every assertion uses bounded retry on the observable outcome, with no\n  `sleep`-to-settle and no assertion on counts that duplicates would break\n- **And** the scenario is registered in `harness/src/harness/cli.py`'s `SCENARIOS`\n  and adding it changed no existing scenario\n- **And** `make check` and `make test` are green from the repo root, with\n  `make test-race` green for the new `auto-mail` entry in `RACE_PROJECTS`"}], "threads": [{"anchor": "D-062-2", "status": "resolved", "priority": "p1", "title": "Binding freshness conflicts with the stat-only hook path", "tab": "Requirements", "comments": [{"by": "review", "text": "D-062-2 says every hook fire refreshes `last_seen` on the matching binding row, and AC-9 treats stale versus live bindings as observable through the `bound` count. But AC-10, the end-state flow, and Phase 3 require the hook mail check to perform zero store opens and even leave `~/.auto/mail/alpha-store.db` nonexistent on a host that never ran `auto mail init`. A hook cannot update a SQLite `bindings.last_seen` row without opening or creating the store. The current hook code also only captures context and then emits hints (`auto-cli/cmd/auto/hookscmd.go:94-124`); there is no existing binding-refresh sink. Resolve this before execution: either defer `last_seen`/staleness to T3 and define T1 `bound` as current binding rows, or add an explicit refresh mechanism and acceptance coverage that still satisfies G8."}, {"by": "author", "text": "Correct, and a real contradiction rather than an ambiguity — a `last_seen` refresh is a store write, and G8 forbids one in the hook. Resolved by scoping, not by weakening G8: D-062-2 now states that <strong>`subscribe` is the only writer of a binding row in T1<\/strong>, and that heartbeat refresh arrives with T3, which already owns liveness (G9, D-8) and has a daemon to carry the write. The consequence you implied is now recorded explicitly: in T1 <code>bound<\/code> means \"a binding row exists\", not \"an agent is alive right now\", and <code>auto mail docs<\/code> says so, so nobody reads a liveness promise into the count early. AC-9's \"stale or absent\" wording is corrected to \"no binding row\". The <code>last_seen<\/code> column is still created and stamped at subscribe, so T3 adds a writer rather than a schema change."}]}, {"anchor": "D-062-3", "status": "resolved", "priority": "p1", "title": "Present pending-flag behavior contradicts AC-10", "tab": "Requirements", "comments": [{"by": "review", "text": "D-062-3 says an absent flag returns immediately, but \"only a present flag causes a store open\"; its consequences also say a false positive costs one store open and emits nothing. Later sections require the opposite: the Approach says \"The nudge never opens the store\", the end-state flow says the hook stats the flag with no DB open, AC-10 requires zero store opens on either path, and Phase 3 tests `HasPending` for zero opens on both paths while emitting a nudge when the flag exists. These are mutually exclusive contracts. Pick whether a present flag is authoritative enough to emit the fixed nudge, or whether the hook confirms through the store, then align D-062-3, AC-10, and Phase 3."}, {"by": "author", "text": "Accepted — D-062-3 was written before the design settled and kept its earlier \"a present flag causes a store open\" text while every later section said the opposite. The hook opening the store was the stale half, so D-062-3 is now aligned to the rest: the hook stats exactly one path and <strong>never opens the store on either path<\/strong>; the flag is authoritative for the <em>decision to nudge<\/em>. That is safe precisely because the nudge is a fixed constant carrying no mailbox content, so a wrong decision can neither leak nor misstate anything. The consequences are restated to match: a false positive costs the agent one wasted <code>auto mail list<\/code>, which finds nothing and clears the flag itself, making drift self-healing rather than sticky."}]}, {"anchor": "AC-2", "status": "resolved", "priority": "p1", "title": "Default `from` address is not derivable today", "tab": "Verification", "comments": [{"by": "review", "text": "C1 omits `--from`, but the expected list payload includes `\"from\": \"auto-stack/reviewer\"`. The assumptions and Phase 2 say the fallback is derived from `<project>/<agent>` or `<projectId>/agent` via the registry. Checked `auto-shared/config/projects.go:20-31`: `ProjectRef` stores ID, Path, Remote, Name, Tools, and RegisteredAt, but no agent name. A normal `auto mail send` CLI process also does not receive the hook payload's `agent` or `session_id`, and T2 explicitly defers self-identification. Define the T1 source of `from` before implementation: require `--from` in C1/harness, use a documented env var, use a literal fallback such as `<project>/agent`, or add a subscribe-before-send identity path, then cover that exact behavior in AC-2."}, {"by": "author", "text": "Correct, and the evidence is right — <code>config.ProjectRef<\/code> carries no agent name, and a plain <code>auto mail send<\/code> sees neither the hook payload's <code>agent<\/code> nor a <code>session_id<\/code>; self-identification is exactly what D-13 defers to T2, so T1 must not depend on it. Resolved by defining an explicit three-rung ladder rather than leaving it to the implementer: (1) <code>--from <address><\/code>; (2) the address of a subscription bound to the caller's <code>(manager, target)<\/code>, lowest subscription id when several so it is deterministic; (3) the literal <code><projectId>/agent<\/code> from the registry, or <code>unregistered/agent<\/code> outside a registered project. C1's <code>auto-stack/reviewer<\/code> is rung 2 — the sender subscribed to its own reply address first, which is also what makes it reachable for a reply. AC-2 now asserts all three rungs, and the harness scenario has the sender subscribe first so C1's shape is the shape actually exercised."}]}, {"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "Cursor flag spelling is inconsistent", "tab": "Verification", "comments": [{"by": "review", "text": "AC-4 says the opt-out cursor case is created with `--from now`, but the command surface, file-change tree, and Phase 4 all use `--from-now`. Cobra will only accept `--from now` if a separate `--from` flag is implemented, which the plan does not list. Pick one spelling and make the acceptance criterion, CLI examples, and tests agree; if the intended surface is the flat boolean flag, AC-4 should name `--from-now`."}, {"by": "author", "text": "Correct — a typo in AC-4, not a second flag. Every other surface (the command transcript, the file-change tree, Phase 4) says <code>--from-now<\/code>, which is the intended boolean flag; AC-4 now says the same. No <code>--from<\/code> flag exists on <code>subscribe<\/code>."}]}, {"anchor": "AC-7", "status": "resolved", "priority": "p2", "title": "Duplicate delivery-row test contradicts the delivery key", "tab": "Verification", "comments": [{"by": "review", "text": "AC-7 says duplicate delivery handling is simulated by injecting a duplicate delivery row, but AC-4 and the schema require `deliveries` to be keyed by `(subscription_id, mail_id)`. A duplicate row for the same delivery should be rejected by the schema; a row for another subscription is broadcast fan-out, not a duplicate delivery. If the goal is to prove at-least-once/idempotent handling, simulate duplicate list output at the client/CLI boundary or use two distinct subscriptions deliberately. Do not require a persistent row shape the schema is supposed to forbid."}, {"by": "author", "text": "Accepted — asking a test to insert a row the <code>(subscription_id, mail_id)<\/code> primary key is supposed to forbid would have been asserting against the schema G2 requires. The intent was always the caller-facing half of G4, so the simulation moves to where duplicates can actually appear: a <code>Client<\/code> decorator that repeats one entry in the <code>List<\/code> result. AC-7 now states that explicitly, and says in as many words that a second <code>deliveries<\/code> row must not be used."}]}, {"anchor": "AC-11", "status": "resolved", "priority": "p2", "title": "`alpha.mail.read` is omitted from the alpha event list", "tab": "Verification", "comments": [{"by": "review", "text": "The Solution and Phase 2 define four event types, including `alpha.mail.read`, and the end-state schema says `read_at` is written in T1 so T3 has escalation history. AC-11's event-type list names only `alpha.mail.subscribed`, `alpha.mail.sent`, and `alpha.mail.acked`. If that list is treated as exhaustive, a correct read event will fail the acceptance test; if it is illustrative, the criterion is ambiguous. Include `alpha.mail.read` explicitly or state that the listed event types are examples."}, {"by": "author", "text": "Correct — the list was written before the decision to stamp <code>read_at<\/code> in T1 (taken so T3's escalation predicate has history to read) and was never updated. AC-11 now names the complete T1 vocabulary — <code>alpha.mail.subscribed<\/code>, <code>alpha.mail.sent<\/code>, <code>alpha.mail.read<\/code>, <code>alpha.mail.acked<\/code> — and states that the assertion is twofold: every emitted type carries the <code>alpha.<\/code> prefix, and these four are the complete set. No ambiguity about exhaustive versus illustrative is left."}]}, {"anchor": "AC-12", "status": "resolved", "priority": "p1", "title": "SQLite import guard fails against existing modules", "tab": "Verification", "comments": [{"by": "review", "text": "AC-12 says a repo-wide guard should fail on any `modernc.org/sqlite` import outside `auto-mail/internal/mail`; Phase 5 says outside `auto-mail/internal/store`. Both versions fail against the current repo before this task starts: `auto-watch/internal/store/store.go:15`, `auto-search/internal/indexdb/schema.go:9`, and `auto-search/internal/cochange/load.go:23` already import `modernc.org/sqlite`, and `auto-watch`/`auto-search` have direct v1.53.0 requirements in their `go.mod` files. The seam guard should target direct mail-store access instead: `alpha-store.db`, `~/.auto/mail`, `sqlite3` invocations against that path, and `auto-mail/internal/store` imports from outside the allowed mail packages. Also align the allowed path with the Solution, which uses `auto-mail/internal/store`, not `auto-mail/internal/mail`."}, {"by": "author", "text": "Correct, and this one would have failed on day zero — <code>auto-watch/internal/store/store.go<\/code> and <code>auto-search/internal/indexdb/schema.go<\/code> import <code>modernc.org/sqlite<\/code> for their own stores, entirely legitimately. The guard was aimed at the wrong thing: G11 is about the <em>mail store<\/em>, not about SQLite. AC-12 and Phase 5 are rewritten to target direct mail-store access — the <code>alpha-store.db<\/code> filename, an <code>~/.auto/mail<\/code> path opened as a database, a <code>sqlite3<\/code> invocation against either — plus an import guard on <code>auto-mail/internal/...<\/code> from outside the module. Both now say <code>auto-mail/internal/store<\/code>; the stale <code>internal/mail<\/code> path in AC-12 is gone. AC-12 also notes that the internal-import half is already a compile-time guarantee, so the test is a regression guard rather than the guarantee itself."}]}, {"anchor": "D-062-8", "status": "resolved", "priority": "p2", "title": "`rootcmd` is a second exported package", "tab": "Solution", "comments": [{"by": "review", "text": "D-062-8 says the public surface is exactly one package, `auto-mail/mail`, and that everything else stays under `internal/`. The file-change tree also adds `auto-mail/rootcmd/rootcmd.go`, and `auto-cli/cmd/auto/main.go` must import that package to mount `auto mail`, matching every existing tool's pattern. Clarify that the invariant is \"one exported domain/client API plus the required `rootcmd` mounting facade\"; otherwise an implementer could either hide `rootcmd` under `internal/` and break mounting, or write a seam guard that incorrectly treats the facade as a violation."}, {"by": "author", "text": "Fair, and the wording was genuinely misleading — an implementer following it literally would either have hidden <code>rootcmd<\/code> under <code>internal/<\/code> and broken mounting, or written a guard that flagged the façade. D-062-8 now states the invariant as \"one exported <strong>domain<\/strong> API (<code>auto-mail/mail<\/code>) plus the mandatory <code>rootcmd<\/code> mounting façade\", and records that the façade holds no domain logic and never touches the store — a wiring surface, not an API. The seam guard in Phase 5 is scoped accordingly."}]}], "phases": [{"n": "1", "title": "Ontology, module skeleton, and the scenario comes up", "files": ["docs/concepts/UBIQUITOUS_LANGUAGE.md", "auto-mail/go.mod", "auto-mail/go.sum", "auto-mail/CLAUDE.md", "auto-mail/cmd/automail/main.go", "auto-mail/rootcmd/rootcmd.go", "auto-mail/internal/app/app.go", "auto-mail/internal/cli/root.go", "auto-mail/internal/cli/init.go", "auto-mail/internal/cli/docs.go", "auto-mail/internal/cli/list.go", "auto-mail/internal/cli/cli_test.go", "auto-mail/internal/config/settings.go", "auto-mail/mail/client.go", "auto-mail/mail/direct.go", "auto-mail/mail/mail_test.go", "auto-mail/internal/store/store.go", "auto-mail/internal/store/schema.go", "auto-cli/cmd/auto/main.go", "auto-cli/go.mod", "auto-cli/go.sum", "go.work", "Makefile", "CLAUDE.md", "harness/scenarios/mail-flow/Dockerfile", "harness/scenarios/mail-flow/docker-compose.yaml", "harness/scenarios/mail-flow/scripts/host-entrypoint.sh", "harness/src/harness/scenarios/mail_flow.py", "harness/src/harness/cli.py", "harness/tests/mail_flow/__init__.py", "harness/tests/mail_flow/conftest.py", "harness/tests/mail_flow/test_mail_loop.py"], "status": "done", "body": "**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.\n\n1. **Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   with five entries in the house format (bold term, definition, `_Avoid_:`,\n   optional `_Has_:`):\n   - **Mail** — the stored unit of an addressed, durable message between agents.\n     `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n   - **Address** — a virtual, free-form name a Mail is sent to, carrying no\n     physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n     `_Has_`: many Subscriptions.\n   - **Subscription** — a durable reader of an Address, holding its own cursor\n     and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n     `_Has_`: many Deliveries, one Binding.\n   - **Delivery** — the per-Subscription copy of one Mail and its read/ack\n     state. `_Avoid_`: receipt, copy, inbox item.\n   - **Binding** — the current physical target and liveness of a Subscription,\n     recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n     link, attachment, route.\n   Then update the frontmatter `summary` to name the five new terms.\n   **Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   exits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\n   refreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n   **Do not hand-edit the generated ER block.**\n\n2. **Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\n   copying `auto-artifact/`'s shape: `go.mod`\n   (`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n   `replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n   `modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n   `internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n   `internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\n   dir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n   `auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n   **Verify:** `cd auto-mail && go build ./...` after each file, per the project's\n   Go build discipline.\n\n3. **The store, minimal.** `internal/store/store.go`: `Open(path)` with\n   `os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n   `auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n   `busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n   `WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n   `schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n   `subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\n   creating the full shape now avoids a migration inside the task).\n   **Verify:** a store test that opens, migrates twice (idempotent) and closes.\n\n4. **The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\n   all six methods, the input/result types matching the C1 payloads, and sentinel\n   errors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\n   implementation where `List` works (returning an empty slice against a fresh\n   store) and the other four return a `not implemented in this phase` error.\n   Everything else stays under `internal/`, so no other module can reach the\n   store (D-062-8).\n\n5. **CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n   `EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n   `{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\n   reference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n   (JSON array on stdout, `[]` when empty).\n   `internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n   `[]` and writes nothing to stdout but JSON.\n   `auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\n   identifier, table name or event type in the module names the stored unit\n   `message` (the `--message` body flag is explicitly allowed).\n\n6. **Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\n   require + local replace; `auto-cli/cmd/auto/main.go` imports\n   `mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n   `mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n   `auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\n   table (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n   **Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.\n\n7. **The scenario comes up (the epic's second of three things).**\n   `harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\n   monorepo source with context `../../..`, mirroring\n   `harness/scenarios/event-flow/Dockerfile`.\n   `docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\n   healthcheck gating on `/tmp/mail-ready.json`.\n   `scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\n   empty commit + `auto init --project` in **both** `/workspace/project-a` and\n   `/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n   `harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\n   with `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\n   fail-fasts with a diagnostic if the ready file is missing, either workspace is\n   unregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\n   a `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\n   workspace (base64-piped, per the event-flow convention).\n   Register `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n   `harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\n   session-scoped fixture plus one test asserting the stack is up, both\n   workspaces are registered, and `auto mail list` returns `[]` from each.\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   from the repo root `make check` and `make test`; from `harness/`\n   `uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n   `uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\n   scenarios are untouched.\n   **Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`."}, {"n": "2", "title": "One message travels between two agents and is acked", "files": ["auto-mail/internal/store/schema.go", "auto-mail/internal/store/events.go", "auto-mail/internal/store/project.go", "auto-mail/internal/store/store_test.go", "auto-mail/internal/ulid/ulid.go", "auto-mail/mail/client.go", "auto-mail/mail/direct.go", "auto-mail/mail/address.go", "auto-mail/mail/binding.go", "auto-mail/mail/mail_test.go", "auto-mail/internal/cli/subscribe.go", "auto-mail/internal/cli/send.go", "auto-mail/internal/cli/list.go", "auto-mail/internal/cli/ack.go", "auto-mail/internal/cli/cli_test.go", "harness/src/harness/scenarios/mail_flow.py", "harness/tests/mail_flow/test_mail_loop.py"], "status": "done", "depends-on": "1", "body": "The epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.\n\n1. **Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\n   lexicographically sortable **within one process** (the cross-host merge\n   property `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n   `sub_` + the ULID's leading 8 chars.\n   **Verify:** a test asserting monotonicity across 10k ids in one process and\n   sort order matching generation order — and scoped to say so, because that\n   ordering does not survive a process boundary and nothing in the store may\n   rest on it. Ordering the store depends on comes from the log's own `seq`\n   (see the cursor, below).\n\n2. **Events.** `internal/store/events.go`: the four `alpha.*` types —\n   `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n   `alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n   `Append(tx, ev)` as the **only** writer of the `events` table. Add the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n   `schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.\n\n3. **Projection.** `internal/store/project.go`, all inside one\n   `BEGIN IMMEDIATE` transaction per operation:\n   - `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n     (address + `from_cursor`) and its binding row.\n   - `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n     carrying the `seq` of that event as the store's own ordering of mail. It\n     writes **no** `deliveries` rows: materialisation is the read path's, and\n     only the read path's (D-10). Send additionally *reads* the two counts it\n     reports and the bindings whose pending flag the mail should raise.\n   - `list` → materialise any missing `deliveries` rows from each subscription's\n     `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n     `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n     nothing; return unacked rows.\n   - `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n     AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n     `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).\n\n4. **Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n   `/` explicitly allowed and never normalised (D-9); rejects empty,\n   whitespace-padded, control characters and over-length, each with a remediation\n   message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n   `tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\n   opaque pair. **Neither ever writes physical identity into an address or an\n   envelope** (G5).\n\n5. **The direct client.** Implement the remaining five `Client` methods in\n   `mail/direct.go` over the projection, returning exactly the C1 payload shapes.\n   The sender's `from` follows the three-rung ladder: `--from` → the address of a\n   subscription bound to the caller's `(manager, target)` (lowest subscription id\n   when several) → the literal `<projectId>/agent` from the registry, or\n   `unregistered/agent` outside a registered project. Always a resolved absolute\n   address, never a relative handle.\n\n6. **The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n   `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n   (`--address`, `--subscription`; unfiltered returns every unacked delivery for\n   every subscription bound to the caller), `ack.go` (positional mail id;\n   `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\n   with a remediation hint for an unknown id).\n   `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\n   exact payloads and that stdout is pure JSON.\n\n7. **The harness proves it (G15).** Extend `mail_flow.py` with\n   `subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n   `test_mail_loop.py` with the C1 loop across the two workspaces:\n   **project-a subscribes to its own reply address first** (so `from` resolves by\n   rung 2, as C1 shows), project-b subscribes to the target address, project-a\n   sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\n   presence of the mail id, never on counts (G4 permits duplicates).\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`."}, {"n": "3", "title": "The in-band nudge reaches a working agent", "files": ["auto-mail/mail/pending.go", "auto-mail/mail/binding.go", "auto-mail/mail/mail_test.go", "auto-mail/internal/config/settings.go", "auto-mail/internal/cli/list.go", "auto-mail/internal/cli/ack.go", "auto-cli/cmd/auto/hints.go", "auto-cli/cmd/auto/hookscmd.go", "auto-cli/cmd/auto/hints_test.go", "auto-cli/cmd/auto/hooksmail_test.go", "harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json", "harness/src/harness/scenarios/mail_flow.py", "harness/tests/mail_flow/test_mail_loop.py"], "status": "done", "depends-on": "2", "body": "The riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.\n\n1. **The pending flag.** `mail/pending.go`:\n   `flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\n   bytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n   `HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\n   every error — missing dir, permission denied — as \"no mail\". Add\n   `NudgeText() string`, a **constant**: an instruction to run `auto mail list`\n   and `auto mail ack` when acted on, with **no** interpolation of sender,\n   address, subject or body (G14's content rule, adopted for the in-band channel).\n   Wire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\n   subscriptions have nothing unacked left — the self-healing loop that bounds\n   flag drift (D-062-3).\n   **Verify:** `mail_test.go` — a counting store-opener injected over the package\n   var proves `HasPending` performs **zero** opens on both paths; flag lifecycle\n   across send → list → ack; a false-positive flag causes one `list` and then\n   clears itself.\n\n2. **Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\n   change `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\n   fragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\n   add `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\n   which writes **exactly one** `hookResponse` object, or nothing when every\n   fragment is empty. Update `hints_test.go` for the split — the behavioural\n   assertions carry over unchanged.\n\n3. **Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n   `matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n   `mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\n   fragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\n   stays inside the never-return-an-error region — any failure is swallowed and\n   the hook still exits 0.\n\n4. **Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\n   nudge emitted only when the flag exists; only on `PostToolUse`; **one**\n   `hookSpecificOutput` object when a hint rule also matches, with mail first;\n   exit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\n   file; and — the observable form of G8 — firing hooks on a `HOME` where\n   `auto mail init` never ran leaves `alpha-store.db` **non-existent**.\n\n5. **The harness proves it.** Add\n   `harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\n   PostToolUse payload, `cwd` patched per fire, mirroring\n   `event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n   `mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\n   returns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n   `test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n   `hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\n   the next fire emits nothing.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`;\n   `cd auto-cli && go test ./...`; repo-root `make check && make test`;\n   `uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n   (the hints change touches a path `event-flow` exercises — prove it is intact).\n   **Commit** `feat(062): in-band mail nudge on hook fire at stat cost`."}, {"n": "4", "title": "Delivery semantics and the Client conformance suite", "files": ["auto-mail/conformance/conformance.go", "auto-mail/conformance/conformance_test.go", "auto-mail/internal/store/project.go", "auto-mail/internal/store/store_test.go", "auto-mail/mail/direct.go", "auto-mail/internal/cli/subscribe.go", "auto-mail/internal/cli/send.go", "auto-mail/internal/cli/list.go", "auto-mail/internal/cli/ack.go", "auto-mail/internal/cli/cli_test.go", "harness/src/harness/scenarios/mail_flow.py", "harness/tests/mail_flow/test_mail_loop.py"], "status": "done", "depends-on": "3", "body": "The call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).\n\n1. **Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\n   the store's own high-water mark, `MAX(mail.seq)` read inside the same\n   `BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\n   the beginning of the log), and report `backfilled` as the count of unacked\n   mail the new cursor admits.\n\n   The cursor is a log position, **never a minted id**. A `--from-now` cursor of\n   `ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\n   ordering *between processes*, and D-11 makes every verb its own process: two\n   ids drawn in the same millisecond share a timestamp prefix and draw\n   independent tails, so a mail could sort below the cursor and be admitted by\n   nothing, ever. The write lock is what makes a high-water mark true instead.\n   **Verify:** send to an unsubscribed address, subscribe afterwards, `list`\n   returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n   `backfilled` is 0.\n\n2. **Broadcast (D-7).** Two subscriptions on one address each get their own\n   `deliveries` row and their own ack state; acking one leaves the other unacked.\n   **Verify:** `store_test.go` plus a conformance case.\n\n3. **Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n   `bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n   `0/0` for an unknown address, persists the mail, and writes the\n   likely-typo hint to **stderr** only.\n\n4. **The conformance suite.** `auto-mail/conformance/conformance.go` — a\n   `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n   `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\n   the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\n   appending no second event, backfill-on-subscribe both ways,\n   subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\n   with a separator. `conformance_test.go` runs it against `NewDirect`.\n   **Deliberately absent: any assertion about ordering** (G4).\n\n5. **The harness proves the J2 half.** Extend `test_mail_loop.py` with\n   send-before-subscribe across the two workspaces: project-a sends to an address\n   nobody holds, project-b subscribes afterwards and receives it.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`."}, {"n": "5", "title": "Rails made executable: immutability, the ack race, reset, the seam guard, docs", "files": ["auto-mail/internal/store/store_test.go", "auto-mail/internal/cli/reset.go", "auto-mail/internal/cli/cli_test.go", "auto-mail/internal/cli/docs.go", "auto-mail/conformance/seam_test.go", "auto-mail/CLAUDE.md", "Makefile", "harness/CLAUDE.md"], "status": "done", "depends-on": "4", "body": "Everything the guard rails assert but nothing so far has been forced to prove.\n\n1. **Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\n   before a `list` + `ack` cycle and assert byte-identical rows after; assert the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\n   assert the ack appears as a **new** `alpha.mail.acked` row.\n\n2. **The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n   `Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\n   event, and every caller seeing `acked: true`. Plus a concurrent-writer test:\n   N processes' worth of goroutines sending to one address lose no events and\n   leave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n   `Makefile`.\n   **Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).\n\n3. **Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n   `alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\n   without `--yes` on a non-empty store with a remediation hint.\n   **Verify:** `cli_test.go` — reset then the C1 loop again from empty.\n\n4. **The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\n   repo root by walking up for `go.work` (skip the test if absent, so a\n   standalone module checkout still passes), then walk every module's Go source,\n   `harness/` and `skills/`, asserting that the **mail store** is named nowhere\n   outside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n   `~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\n   either. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n   `auto-search` import it for their own stores and would fail the guard on day\n   zero. Also assert no package outside `auto-mail` imports\n   `auto-mail/internal/...` (a regression guard over what the compiler already\n   enforces). Failure names the offending file and says \"go through\n   mail.Client\".\n\n5. **The alpha contract in writing (G10, G4).** `internal/cli/docs.go` and\n   `auto-mail/CLAUDE.md` both state, in as many words: **at-least-once,\n   unordered, consumers must be idempotent on mail id**; and **alpha — no\n   upcasters, no migrations, no compatibility guarantee, the store may be wiped\n   on upgrade, `reset` is supported**. `auto-mail/CLAUDE.md` also records the one\n   deliberate exception to `docs/auto-package-patterns.md` (D-062-8) so the next\n   package author does not read it as licence, and notes that `quickstart` and\n   `doctor` are epic task T4's.\n\n6. **Harness docs.** Add the `mail-flow` scenario to `harness/CLAUDE.md`'s\n   Scenarios section alongside `skill-remote` and `event-flow`, including why it\n   is one container (D-062-1).\n\n7. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check`, `make test`, `make test-race`; from `harness/`\n   `uv run pytest -v` (all three scenarios). Run `auto doc fix` if any doc\n   frontmatter drifted. **Commit**\n   `feat(062): mail immutability, ack-race, reset, seam guard and the alpha contract`.\n   Open the PR."}], "files": [{"path": "docs/concepts/UBIQUITOUS_LANGUAGE.md", "change": "edit", "note": "G16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary."}, {"path": "auto-mail/go.mod", "change": "add", "note": "module github.com/mistakenot/auto-mail; replace auto-shared => ../auto-shared; modernc.org/sqlite + cobra."}, {"path": "auto-mail/go.sum", "change": "add", "note": "Checksums for the dependency set (all already present elsewhere in the workspace)."}, {"path": "auto-mail/CLAUDE.md", "change": "add", "note": "Tool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped)."}, {"path": "auto-mail/cmd/automail/main.go", "change": "add", "note": "Minimal entry point delegating to cli.Execute."}, {"path": "auto-mail/rootcmd/rootcmd.go", "change": "add", "note": "New(stdout, stderr) façade so auto-cli can mount `auto mail`."}, {"path": "auto-mail/internal/app/app.go", "change": "add", "note": "App context (stdout, stderr, cwd), per the blueprint."}, {"path": "auto-mail/internal/cli/root.go", "change": "add", "note": "Root cobra command, ExitError, Execute; wires the subcommands."}, {"path": "auto-mail/internal/cli/init.go", "change": "add", "note": "`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store."}, {"path": "auto-mail/internal/cli/docs.go", "change": "add", "note": "`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer."}, {"path": "auto-mail/internal/cli/subscribe.go", "change": "add", "note": "`auto mail subscribe <address> [--from-now] [--name]`; records the caller's binding."}, {"path": "auto-mail/internal/cli/send.go", "change": "add", "note": "`auto mail send --to --message [--body] [--from]`; resolves the sender's absolute from-address."}, {"path": "auto-mail/internal/cli/list.go", "change": "add", "note": "`auto mail list [--address] [--subscription]`; all bound subscriptions when unfiltered; clears a stale flag."}, {"path": "auto-mail/internal/cli/ack.go", "change": "add", "note": "`auto mail ack <mail-id>`; prints wonTransition, exit 0 on a lost race (D-062-7)."}, {"path": "auto-mail/internal/cli/reset.go", "change": "add", "note": "`auto mail reset [--yes]`; removes the store and flag directory, reports what it removed."}, {"path": "auto-mail/internal/cli/cli_test.go", "change": "add", "note": "Command-level tests against a temp HOME asserting the exact C1 payload shapes and the error paths."}, {"path": "auto-mail/internal/config/settings.go", "change": "add", "note": "Store and flag paths under ~/.auto/mail/, settings load/validate via auto-shared/config."}, {"path": "auto-mail/mail/client.go", "change": "add", "note": "The public seam: Client interface, inputs/results, domain types, sentinel errors. The only exported package."}, {"path": "auto-mail/mail/direct.go", "change": "add", "note": "NewDirect: the direct-store implementation D-11 binds the MVP CLI to."}, {"path": "auto-mail/mail/address.go", "change": "add", "note": "ValidateAddress — permissive, separator explicitly allowed and never normalised (D-9)."}, {"path": "auto-mail/mail/binding.go", "change": "add", "note": "BindingFor: the (manager, target) ladder over hooks.CaptureContext (D-062-2)."}, {"path": "auto-mail/mail/pending.go", "change": "add", "note": "The pending-flag file: Set/Clear/HasPending (stat only) and NudgeText (a fixed constant)."}, {"path": "auto-mail/mail/mail_test.go", "change": "add", "note": "Address validation, binding ladder, flag lifecycle, and the zero-store-opens assertion via an injected counting opener."}, {"path": "auto-mail/internal/store/store.go", "change": "add", "note": "Open (MkdirAll, sql.Open, WAL + busy_timeout + foreign_keys), Close, single write connection, transaction helper."}, {"path": "auto-mail/internal/store/schema.go", "change": "add", "note": "DDL: events (+ append-only triggers), mail (+ immutability trigger), subscriptions, deliveries, bindings, indexes, schema_migrations."}, {"path": "auto-mail/internal/store/events.go", "change": "add", "note": "The alpha.mail.* event types, the versioned envelope, and the append path (the only writer of `events`)."}, {"path": "auto-mail/internal/store/project.go", "change": "add", "note": "Same-transaction projection: mail insert, lazy delivery materialisation from the cursor, read stamp, ack compare-and-set, binding upsert."}, {"path": "auto-mail/internal/store/store_test.go", "change": "add", "note": "Immutability (triggers abort UPDATE/DELETE), cursor backfill, broadcast fan-out, and the concurrent-writer test run under -race."}, {"path": "auto-mail/internal/ulid/ulid.go", "change": "add", "note": "Sender-generated ids, monotonic and sortable within one process — the cross-host merge property the backlog names. Not the store's ordering: cursors use the log's `seq`."}, {"path": "auto-mail/conformance/conformance.go", "change": "add", "note": "The Client contract suite, written against the interface: explicit ack, wonTransition, backfill-on-subscribe, subscriptions-vs-bound, idempotent re-ack."}, {"path": "auto-mail/conformance/conformance_test.go", "change": "add", "note": "Runs the suite against the direct-store implementation; T3 adds the RPC one as a second target."}, {"path": "auto-mail/conformance/seam_test.go", "change": "add", "note": "AC-12 guard: walks the repo (located via go.work) asserting the store filename and sqlite imports appear only under auto-mail/internal/store."}, {"path": "auto-cli/cmd/auto/main.go", "change": "edit", "note": "Import mailcmd and add mailcmd.New(stdout, stderr) to root.AddCommand."}, {"path": "auto-cli/cmd/auto/hints.go", "change": "edit", "note": "Split emission from matching: matchHint returns the rendered fragment; emitAdditionalContext writes exactly one hookSpecificOutput object for all fragments."}, {"path": "auto-cli/cmd/auto/hookscmd.go", "change": "edit", "note": "After the existing sinks, stat the pending flag for the firing agent's binding and prepend the fixed mail fragment to the single emission."}, {"path": "auto-cli/cmd/auto/hints_test.go", "change": "edit", "note": "Update for the matchHint/emitAdditionalContext split; existing behaviour assertions unchanged."}, {"path": "auto-cli/cmd/auto/hooksmail_test.go", "change": "add", "note": "Hook-side tests: nudge emitted only with a flag and only on PostToolUse, one emission when a hint also matches, exit 0 with an absent/unreadable store, and no store file created."}, {"path": "auto-cli/go.mod", "change": "edit", "note": "Require github.com/mistakenot/auto-mail with a local replace directive."}, {"path": "auto-cli/go.sum", "change": "edit", "note": "Checksums for the new module edge."}, {"path": "go.work", "change": "edit", "note": "Add ./auto-mail to the use block."}, {"path": "Makefile", "change": "edit", "note": "Add auto-mail to PROJECTS and to RACE_PROJECTS (the ack race and concurrent writers must run under -race)."}, {"path": "CLAUDE.md", "change": "edit", "note": "Add the auto-mail row to the Sub-Projects table."}, {"path": "harness/scenarios/mail-flow/Dockerfile", "change": "add", "note": "Builds the real auto binary from monorepo source (context ../../..) into a single host image."}, {"path": "harness/scenarios/mail-flow/docker-compose.yaml", "change": "add", "note": "One `host` service, init: true, healthcheck gating on the mail-ready file."}, {"path": "harness/scenarios/mail-flow/scripts/host-entrypoint.sh", "change": "add", "note": "Seeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file."}, {"path": "harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json", "change": "add", "note": "A minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern)."}, {"path": "harness/src/harness/scenarios/mail_flow.py", "change": "add", "note": "MailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry."}, {"path": "harness/src/harness/cli.py", "change": "edit", "note": "One line registering mail-flow in SCENARIOS."}, {"path": "harness/tests/mail_flow/__init__.py", "change": "add", "note": "Package marker, mirroring tests/event_flow."}, {"path": "harness/tests/mail_flow/conftest.py", "change": "add", "note": "Session-scoped fixture: up(build=True) then down() at teardown."}, {"path": "harness/tests/mail_flow/test_mail_loop.py", "change": "add", "note": "AC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion."}, {"path": "harness/CLAUDE.md", "change": "edit", "note": "Document the mail-flow scenario alongside skill-remote and event-flow."}], "clis": [{"id": "C1", "title": "zsh — two agents trading a message", "caption": "Subscribe, send, list, ack — the whole T1 surface. Copied from epic 005; T1 must reproduce these payload shapes.", "tab": "Requirements", "steps": [{"note": "receiver binds a virtual channel", "status": "done", "cmd": "auto mail subscribe auto-web/bugs", "out": "<script type=\"text/plain\">{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }<\/script>"}, {"note": "sender is in a different project, same host", "status": "done", "cmd": "<script type=\"text/plain\">auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"<\/script>", "out": "<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }<\/script>"}, {"note": "receiver is nudged mid-turn, then lists", "status": "done", "cmd": "auto mail list", "out": "<script type=\"text/plain\">[\n  {\n    \"id\": \"01K9X2QF7M3B0V8N\",\n    \"from\": \"auto-stack/reviewer\",\n    \"sentAt\": \"2026-08-25T10:14:02Z\",\n    \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" }\n  }\n]<\/script>"}, {"note": "explicit ack — separate call, always", "status": "done", "cmd": "auto mail ack 01K9X2QF7M3B0V8N", "out": "<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }<\/script>"}, {"note": "acked mail is gone from the default view", "status": "done", "cmd": "auto mail list", "out": "[]"}]}, {"title": "zsh — the full auto mail surface after T1", "caption": "C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4).", "tab": "Solution", "steps": [{"note": "creates ~/.auto/mail/ and the alpha store", "status": "done", "cmd": "auto mail init", "out": "<script type=\"text/plain\">{ \"store\": \"/home/u/.auto/mail/alpha-store.db\", \"created\": true, \"alpha\": true }<\/script>"}, {"note": "the full command reference, including the alpha contract", "status": "done", "cmd": "auto mail docs", "out": ""}, {"note": "opt to start from now instead of the backlog (D-10)", "status": "done", "cmd": "auto mail subscribe auto-web/bugs --from-now", "out": "<script type=\"text/plain\">{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }<\/script>"}, {"note": "nobody has subscribed — still exits 0, still persists (G6)", "status": "done", "cmd": "<script type=\"text/plain\">auto mail send --to auto-web/typo --message \"hello?\"<\/script>", "out": "<script type=\"text/plain\">{ \"id\": \"01K9X2R0000000000\", \"to\": \"auto-web/typo\", \"subscriptions\": 0, \"bound\": 0 }\n# stderr: no subscription exists for \"auto-web/typo\" — mail is persisted and a later\n# subscriber will receive it, but check the address for a typo.<\/script>"}, {"note": "scope to one subscription; no filters returns everything bound to you", "status": "done", "cmd": "auto mail list --address auto-web/bugs", "out": ""}, {"note": "a second acker is told it lost, and still exits 0 (D-062-7)", "status": "done", "cmd": "auto mail ack 01K9X2QF7M3B0V8N", "out": "<script type=\"text/plain\">{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": false }\n# stderr: already acked at 2026-08-25T10:15:40Z by sub_01K9X2M4<\/script>"}, {"note": "alpha means reset is supported, not a workaround (G10)", "status": "done", "cmd": "auto mail reset --yes", "out": "<script type=\"text/plain\">{ \"removed\": [\"/home/u/.auto/mail/alpha-store.db\", \"/home/u/.auto/mail/alpha-flags\"] }<\/script>"}]}], "apis": [{"kind": "interface", "name": "mail.Client", "lang": "go", "path": "auto-mail/mail/client.go", "caption": "The only API. CLI, hook, daemon and every future auto-* tool go through it.", "tab": "Solution", "members": [{"kind": "method", "sig": "Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)", "doc": "Creates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled."}, {"kind": "method", "sig": "Send(ctx context.Context, in SendInput) (SendResult, error)", "doc": "Appends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6)."}, {"kind": "method", "sig": "List(ctx context.Context, in ListInput) ([]Delivery, error)", "doc": "Materialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3)."}, {"kind": "method", "sig": "Ack(ctx context.Context, in AckInput) (AckResult, error)", "doc": "Compare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13)."}, {"kind": "method", "sig": "Reset(ctx context.Context) (ResetResult, error)", "doc": "Removes the store and the flag directory. A supported operation, because alpha (G10)."}, {"kind": "method", "sig": "Close() error", "doc": "Releases the store handle."}]}, {"kind": "module", "name": "package mail — free functions and types", "lang": "go", "path": "auto-mail/mail/pending.go", "caption": "Deliberately not methods: the nudge must not require a client, because constructing one would open the store.", "tab": "Solution", "members": [{"kind": "function", "sig": "NewDirect(home string) (Client, error)", "doc": "The direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process."}, {"kind": "function", "sig": "HasPending(home string, b Binding) bool", "doc": "Stats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8)."}, {"kind": "function", "sig": "NudgeText() string", "doc": "The fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too)."}, {"kind": "function", "sig": "BindingFor(cwd string) Binding", "doc": "Derives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2)."}, {"kind": "function", "sig": "ValidateAddress(s string) error", "doc": "Permissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable."}, {"kind": "type", "sig": "type Binding struct { Manager, Target, Session string }", "doc": "The opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5)."}]}], "mermaids": [{"caption": "What each layer proves, and which rails it carries", "tab": "Verification", "src": "flowchart TB\n  subgraph L5[\"harness/scenarios/mail-flow — THE VERDICT\"]\n    H1[\"C1 loop end to end<br/>subscribe → send → list → ack → list\"]\n    H2[\"in-band nudge<br/>auto hooks fire emits additionalContext\"]\n    H3[\"no-mail hook never creates the store\"]\n    H4[\"send with no subscription persists<br/>later subscriber sees it\"]\n  end\n  subgraph L4[\"CLI + hook integration (auto-mail, auto-cli)\"]\n    C1[\"exact C1 JSON payload shapes\"]\n    C2[\"single stdout emission, PostToolUse only\"]\n    C3[\"hook exits 0 with a corrupt/absent store\"]\n  end\n  subgraph L3[\"race (-race, RACE_PROJECTS)\"]\n    R1[\"N acks → exactly one wonTransition\"]\n    R2[\"N writer processes → no lost events\"]\n  end\n  subgraph L2[\"conformance suite (auto-mail/conformance)\"]\n    F1[\"explicit ack; list does not retire\"]\n    F2[\"backfill from cursor on subscribe\"]\n    F3[\"subscriptions vs bound counts\"]\n  end\n  subgraph L1[\"package tests (internal/mail)\"]\n    U1[\"append-only log; no UPDATE on events\"]\n    U2[\"deliveries keyed by (subscription, mail)\"]\n    U3[\"free-form addresses; separator allowed\"]\n    U4[\"pending flag: zero store opens when absent\"]\n  end\n  L1 --> L2 --> L3 --> L4 --> L5\n  L5 --> V[\"G15: done\"]"}, {"caption": "The T1 path — no daemon anywhere in it", "tab": "Solution", "src": "sequenceDiagram\n  participant A as agent A (auto mail send)\n  participant M as mail.Client (direct)\n  participant DB as alpha-store.db\n  participant FL as alpha-flags/\n  participant HK as agent B hook (auto hooks fire)\n  participant B as agent B (auto mail list/ack)\n\n  B->>M: Subscribe(\"auto-web/bugs\")\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.subscribed;<br/>insert subscription + binding(manager,target); COMMIT\n  A->>M: Send(to, body)\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.sent;<br/>insert mail; insert deliveries for bound subs; COMMIT\n  M->>FL: touch flag(sha8(manager,target))\n  M-->>A: {id, to, subscriptions:1, bound:1}\n  HK->>FL: stat one path (no DB open)\n  HK-->>B: hookSpecificOutput.additionalContext (fixed text)\n  B->>M: List()\n  M->>DB: materialise deliveries from cursor;<br/>append alpha.mail.read (first read only)\n  M-->>B: [ {id, from, sentAt, body} ]\n  B->>M: Ack(id)\n  M->>DB: BEGIN IMMEDIATE;<br/>UPDATE deliveries SET acked_at=? WHERE acked_at IS NULL;<br/>append alpha.mail.acked; COMMIT\n  M->>FL: rm flag if nothing unacked remains\n  M-->>B: {id, acked:true, wonTransition:true}"}, {"caption": "events is the authority; mail is immutable; deliveries and bindings are projections", "tab": "Solution", "src": "erDiagram\n  MAIL ||--o{ DELIVERY : \"copied to\"\n  SUBSCRIPTION ||--o{ DELIVERY : \"owns state of\"\n  ADDRESS ||--o{ SUBSCRIPTION : \"bound by\"\n  SUBSCRIPTION ||--o| BINDING : \"currently held by\"\n  EVENT {\n    int seq\n    ulid id\n    string type\n    int version\n    time occurred_at\n    json payload\n  }\n  MAIL {\n    ulid id\n    int seq\n    string to_address\n    json envelope\n    json body\n    time sent_at\n  }\n  SUBSCRIPTION {\n    string id\n    int seq\n    string address\n    string name\n    int from_cursor\n    time created_at\n  }\n  DELIVERY {\n    string subscription_id\n    ulid mail_id\n    time first_seen_at\n    time read_at\n    time acked_at\n    string acked_by\n  }\n  BINDING {\n    string subscription_id\n    string manager\n    string target\n    string session\n    time last_seen\n  }"}, {"caption": "Phase dependency DAG — a chain, because each phase is verified inside the oracle the previous one stood up", "tab": "Plan", "src": "flowchart LR\n  P1[\"P1 · Ontology + module + scenario up<br/>glossary · auto mail init/docs/list · mail-flow green\"]\n  P2[\"P2 · One message travels<br/>subscribe/send/list/ack · log + projection · C1 in the harness\"]\n  P3[\"P3 · The in-band nudge<br/>pending flag · hooks fire emits additionalContext\"]\n  P4[\"P4 · Delivery semantics<br/>cursor backfill · broadcast · counts · conformance suite\"]\n  P5[\"P5 · Rails made executable<br/>immutability · ack race · reset · seam guard · docs\"]\n  P1 --> P2 --> P3 --> P4 --> P5"}], "rails": [{"id": "G1", "kind": "functional", "title": "Messages and events are immutable", "body": "A message row is never updated after insert, and a delivery event is never rewritten. State changes are appended and re-projected. This is what keeps the log mergeable across hosts later.", "inherited": true, "abridged": "Mail rows and events are immutable; state changes are appended and re-projected", "ac": "AC-3"}, {"id": "G2", "kind": "functional", "title": "Consumer state lives in a deliveries join, never on the message", "body": "Read and ack state is keyed by (subscription, message), even though the MVP has exactly one subscription per address. That redundancy is the feature: fan-out becomes extra rows, competing consumers become a column. Putting <code>read_at<\/code> on the message silently encodes \"one consumer, forever\".", "inherited": true, "abridged": "Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row", "ac": "AC-4"}, {"id": "G3", "kind": "functional", "title": "Ack is a separate explicit call, from the first consumer", "body": "Reading does not retire a message. Ack may do nothing but stamp a timestamp — no timer, no redelivery — but every consumer must call it. Retrofitting that call into N prompts and skills is the migration that cannot be done.", "inherited": true, "abridged": "Ack is a separate explicit call; reading does not retire mail", "ac": "AC-5"}, {"id": "G4", "kind": "functional", "title": "At-least-once and unordered, as documented", "body": "The MVP delivers exactly once, in order, by accident. The contract promises neither. Consumers are idempotent on message id from day one. Promising the stronger guarantee now means ten consumers quietly depend on it.", "inherited": true, "abridged": "At-least-once and unordered *as documented*; consumers idempotent on mail id", "ac": "AC-7"}, {"id": "G5", "kind": "functional", "title": "Addresses are virtual — no physical identity in them", "body": "Physical identity (session, host, herdr/ntm pane) appears only as binding metadata, never in an address, never in a stored envelope's <code>to<\/code> field. Relative handles like <code>#parent<\/code> resolve at send time; the stored envelope always carries the resolved absolute address. Addresses themselves are free-form strings with no enforced structure — validation must stay permissive enough to allow a separator, so hierarchical names remain expressible and prefix filtering stays buildable.", "inherited": true, "abridged": "Addresses are virtual — no physical identity in them or in a stored envelope's `to`", "ac": "AC-8"}, {"id": "G6", "kind": "reliability", "title": "Sending to an address with no subscription persists, and a later subscriber sees it", "body": "The cross-project journey depends on both halves: mail sent to a project nobody is working in must persist, <em>and<\/em> the agent who subscribes tomorrow must receive it. A send reports two distinct counts — how many <strong>subscriptions<\/strong> exist (durable readers) and how many are currently <strong>bound<\/strong> (live agents) — because zero-subscriptions and zero-bound mean different things to a sender, and only the first is a likely address typo.", "inherited": true, "abridged": "Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound`", "ac": "AC-9"}, {"id": "G7", "kind": "security", "metric": "allowlist only, zero secrets persisted", "title": "Hook environment capture stays an allowlist", "body": "Capture widens to reach herdr panes. It must stay a prefix allowlist and never become \"everything except known secrets\" — agent environments carry live credentials (this host's sessions expose a messaging token in plain env). Captured values land in a host-global store on every hook fire.", "inherited": false}, {"id": "G8", "kind": "operability", "metric": "no-mail path is a stat-level check", "title": "The nudge is free when there is no mail", "body": "Notification runs in the agent's critical path on tool calls. The common case — no pending mail — must cost about what a <code>stat<\/code> costs, and must never be able to stall or break the hook. Same discipline as the existing tmux capture timeout.", "inherited": true, "abridged": "The no-mail nudge path is a stat-level check and can never stall or break the hook", "ac": "AC-10"}, {"id": "G9", "kind": "functional", "title": "Delivery never corrupts a working agent", "body": "Intrusiveness escalates, never leads. Every message first waits for an in-band hook nudge; keystrokes are the last resort, firing only when the agent is idle by hook silence <em>and<\/em> the message has aged past a threshold. Injection into a running agent can land mid-tool-call or into a permission prompt, so the dangerous mechanism is never spent on the ordinary case.", "inherited": false}, {"id": "G10", "kind": "compat", "title": "Alpha: the store may be wiped, nothing may depend on it", "body": "Event types and the store file carry an <code>alpha<\/code> marker. No upcasters, no migrations, no compatibility guarantee; reset is a supported operation. The marker lives in the type string and the filename, not only in docs — a doc note does not stop a skill matching on a bare type name.", "inherited": true, "abridged": "Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store", "ac": "AC-11"}, {"id": "G11", "kind": "operability", "title": "Nothing outside the mail package reads the store", "body": "One client interface is the only API. The moment a skill or hook runs <code>sqlite3<\/code> against the store, the schema is frozen and the transport swap is dead. Worth a doctor check, not just a convention.", "inherited": true, "abridged": "Nothing outside the mail package reads the store", "ac": "AC-12"}, {"id": "G12", "kind": "compat", "title": "No session manager is hard-coded into stored data", "body": "A binding records its physical target as an opaque <code>(manager, target)<\/code> pair — never a typed <code>tmux_pane_id<\/code> / <code>herdr_pane_id<\/code> column. Delivery goes through an effector interface with one implementation per manager. Adding or retiring a manager is then data plus an implementation, never a schema change; and because bindings are a heartbeat-backed projection, retiring one is a delete rather than a migration.", "inherited": false}, {"id": "G13", "kind": "functional", "title": "Ack transitions exactly once and reports whether it won", "body": "Ack is a conditional update inside the same transaction that appends its event, so concurrent acks on one delivery resolve to exactly one winner. The call returns which it was — a loser is told, never silently treated as success. This is call-site-visible behaviour, so it is fixed now rather than added when leases arrive.", "inherited": true, "abridged": "Ack transitions exactly once and reports whether it won", "ac": "AC-6"}, {"id": "G14", "kind": "security", "title": "Injected keystrokes are a fixed constant, into a verified agent", "body": "Two rules, both absolute. <strong>Content:<\/strong> the injected sequence is a fixed constant — an instruction to go and read mail — never interpolated from an envelope or body, or a sender would be typing into a stranger's pane. <strong>Target:<\/strong> the effector must confirm the pane still runs the bound agent before injecting. Hook silence is also what an <em>exited<\/em> agent looks like, and a pane that has fallen back to a shell would execute whatever is typed into it.", "inherited": false}, {"id": "G15", "kind": "operability", "title": "A capability is done when it passes end to end in the harness", "body": "The guiding oracle is a harness scenario running the real <code>auto<\/code> binary in containers over real transports, with a realistic but <em>minimal<\/em> setup. Unit and package tests are supporting evidence, not the verdict — a task whose capability cannot be demonstrated end to end is not finished. Two disciplines carry over from the harness: assert the observable outcome with bounded retry rather than polling to settle, and treat a missing product seam as a finding to raise, never as something to patch around inside the scenario.", "inherited": true, "abridged": "A capability is done when it passes end to end in the harness", "ac": "AC-13"}, {"id": "G16", "kind": "functional", "title": "The ontology lands before the code that uses it", "body": "Canonical terms go into the ubiquitous-language glossary <em>first<\/em>, and then the same word is used everywhere — schema, event types, CLI, RPC methods, prose and commits. Naming is the one decision that propagates into every surface at once, including the ungreppable ones, so it cannot be tidied up afterwards. This epic already demonstrated the failure: the data model was drafted with an entity named MESSAGE immediately after a decision not to use that noun.", "inherited": true, "abridged": "The ontology lands before the code that uses it", "ac": "AC-1"}]}, "052": {"doc": {"title": "052: reflect-tool-hardening", "status": "complete", "pr": "https://github.com/mistakenot/auto-stack/pull/116", "generated": "2026-06-28", "next-prompt": "/execute-task 052"}, "sections": [{"id": "problem", "title": "Problem", "tab": "Requirements", "body": "The `/reflect-playbook` end-to-end spike on 2026-06-28\n(`.tmp/reflect-playbook-spike-findings.md`) found the `auto reflect` loop's\n**skeleton is solid** — deterministic, gated, append-only, with good error\nremediation — but its **read / output side is untrustworthy**: the loop\n*captures* signal well yet *surfaces* it poorly.\n\nThe headline: reported feedback **gaps** (the explicit bridge back to Stage-1\nobservation) are persisted to the event log but **cannot be read back through\nany command** — you must `grep` raw JSONL. So the advertised closed loop\n(\"gap → next observation\") is, in practice, open. Alongside it the spike found\ntwo disagreeing pending-counts, per-command JSON shapes that make id-threading\nerror-prone, non-deterministic ids, a self-contradictory git policy for\n`.auto/reflect/`, and a few smaller doc/projection gaps.\n\nThis task fixes the **high-priority** findings so the loop becomes\n\"trustworthy\" rather than \"works if you hold it right.\""}, {"id": "goals", "title": "Goals", "tab": "Requirements", "body": "Each goal maps to a finding code (`F#`) from the spike report.\n\n| # | Finding | Fix |\n|---|---------|-----|\n| **F4** (P1) | Feedback gaps are write-only | Add `auto reflect gap list` — surfaces each reported gap (report + moment + source feedback id / session / ts), so the gap → observation loop-back has tooling. |\n| **F2** (P1) | `miner status` `pending` (390) ≠ `stats` `pending_to_mine` (396) | Collapse both onto **one shared counting function** (single source of truth); document exactly which session universe it counts. |\n| **F5** (P2) | Each command nests its minted id differently; `rule promote` top-level `.id` is `null` | **Restructure to a uniform output envelope** with a predictable top-level `.id` / `.ids` (and `.[].id` for collection results). Breaking change to the CLI output contract. |\n| **F7** | Dry-run ids ≠ apply ids, so you can't pre-stage `promote` | Mint rule & observation ids as **deterministic content hashes** so `--dry-run` == apply. Existing id *formats* preserved. |\n| **F9** | `.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked) | `auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**. |\n| **F1** | Stale/partial init state undetected (dir exists, no `events/`; legacy 0-byte `feedback.jsonl`) | Add init / `doctor` detection of stale or partial reflect state with a concrete remediation hint. |\n| **F6** | Rule `created_at` / `updated_at` come back `\"\"` / `null` | Populate them in the rules projection from the underlying event timestamps (`Event.TS`) — no new stored data needed. |\n| **F8 / F3** (P3) | `outcome` enum & `correction_density` undocumented | Document the `outcome` enum (`success\\|partial\\|fail\\|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`. |\n| **F11** | Legacy `docs/reflection/*.yaml` from the superseded process still present | **Remove** the legacy yaml (no migration — old process). |"}, {"id": "decisions-made", "title": "Decisions made (with Charlie, 2026-06-28)", "tab": "Requirements", "body": "The four load-bearing forks were resolved before drafting; recorded here as ADRs\nso the executor inherits them. Two further constraints (D-5, D-6) are calls the\nagent made to keep the append-only event contract intact."}, {"id": "out-of-scope", "title": "Out of Scope", "tab": "Requirements", "body": "- **F10 ack-nudge** — a \"you observed against session X but never `ack`ed it\"\n  warning. Nice-to-have; deferred.\n- **Gap *resolution* tracking** — linking a reported gap to the observation that\n  closed it. `gap list` lists all gaps; v1 has no resolution state (no such link\n  exists today).\n- **On-disk event schema changes** — no `schema_version` bump, no stored payload\n  field renames (see D-5).\n- **The `/reflect-playbook` skill prompt/flow redesign** — only its reference docs\n  are touched (F8/F3), not its orchestration.\n- **A generic `events list --full` payload dump** — superseded by the dedicated\n  `gap list` (D-1)."}, {"id": "open-questions", "title": "Open Questions", "tab": "Requirements", "body": "All four load-bearing forks are resolved (see Decisions). The items below are\nassumptions the plan proceeds on — recorded so they can be revisited, but not\ngating:\n\n- [ ] **`gap list` shape** — lists every reported gap with its source (feedback\n  id, session id, ts, `report`, `moment`); no open/resolved state, since no\n  gap → observation link exists. *(assumption)*\n- [ ] **F2 root cause** — the off-by-6 (390 vs 396) is assumed to be one divergent\n  computation, not two legitimately different universes; fix = collapse both call\n  sites onto a shared function. The exact cause is pinned during implementation.\n  *(assumption)*\n- [ ] **Content-hash inputs** — hash over each entity's canonical content fields\n  (rule: `domain + use_when + content + rule_type`; observation:\n  `kind + subject + evidence`). Finalized in `/new-solution`. *(assumption)*\n- [ ] **Scope size** — this bundles 9 findings; if it proves too large at the\n  solution stage, F8/F3 (docs) + F11 (legacy removal) split cleanly into a\n  follow-up. *(assumption)*"}, {"id": "source", "title": "Source", "tab": "Requirements", "body": "- Spike findings: `.tmp/reflect-playbook-spike-findings.md` (throwaway/demo run,\n  2026-06-28; executor session `518b6d9a`).\n- Tool: `auto-reflect/` (`reflect version v0.24.0-21-ge183760`)."}, {"id": "test-strategy", "title": "Test Strategy", "tab": "Verification", "body": "The module already has the harnesses we need — lean on them rather than inventing\nnew ones:\n\n- **Unit** — pure-function changes: content-derived id determinism\n  (`rules`/`observations` model tests), `Fold` timestamp population\n  (`projection_test.go`), the single shared pending-count function\n  (`miner` test), feedback-gap projection for `gap list`.\n- **Integration** — CLI output contracts via the existing\n  `*_integration_test.go` (events, observation, consolidate) and a new\n  `gap`/`doctor` integration test. These assert the **new uniform envelope** and\n  are where most of the F5 churn lands (every output-shape assertion moves to\n  `.id`/`.ids`/`.[].id`).\n- **E2E** — the existing `cmd/autoreflect/e2e_*_test.go` lifecycle/loop suites,\n  extended so the full mine → observe → consolidate → promote → retrieve →\n  select → feedback → **gap list** loop runs against an on-disk fixture\n  (per CLAUDE.md: populate a stable dataset on disk, run the tools as a user).\n- **Manual replay** — re-run the spike's bounded loop and confirm every spike\n  finding (F1–F11 in scope) is closed; reset throwaway artifacts after.\n\nConventions enforced throughout (CLAUDE.md / `auto-package-patterns.md`):\nJSON default + 2-space indent, stdout = payload only / diagnostics + remediation\nto stderr, non-zero exit on any error, `validate()` structured errors, and\n`go build ./...` clean after every file."}, {"id": "coverage-map", "title": "Coverage Map", "tab": "Verification", "body": ""}, {"id": "acceptance-criteria", "title": "Acceptance Criteria", "tab": "Verification", "body": ""}, {"id": "verification-gaps", "title": "Known Gaps & Risks", "tab": "Verification", "body": "- **F5 is a breaking output change.** No external consumers are known, but the\n  reflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\n  the documented `jq` paths break. Mitigation: update docs in the same task.\n- **Content-id collisions.** Across *distinct* content an 8-hex prefix collision\n  is astronomically unlikely; *identical* content → identical id is intended\n  (idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\n  accepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\n  loop call is a distinct event, not a content identity (see Solution).\n- **F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\n  logic drift. Before collapsing, confirm it isn't a legitimate dual-universe\n  count (subagents/scope) — the unit test must reproduce the divergence first,\n  then prove the shared function fixes it.\n- **doctor depth.** v1 checks state-dir presence, event decodability, and\n  snapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\n  monotonicity) may be deferred to a follow-up.\n- **No migration of old ids.** Events written before this task keep random ids;\n  only newly minted ids are content-derived. This is intentional (append-only)."}, {"id": "approach", "title": "Approach", "tab": "Solution", "body": "Nine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on
