<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --paper:#f3efe4; --paper2:#ebe5d6; --card:#fbf9f3; --ink:#1c2230; --ink2:#4a5263; --ink3:#838a97; --line:#d8d1bf; --line2:#c6bda7;
  --ghost:#ddd6c4; --ghostInk:#a49c88;
  --add:#2e8a57; --edit:#c98518; --del:#c0392b; --ctx:#7d8594; --same:#8f96a3;
  --glow:#ff5a1f; --route:#ff6a2b; --lit:#1c2230; --focus:#2255d6;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif; --serif:"Fraunces",Georgia,serif;
  --rowH:24px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:13px/1.4 var(--sans);overflow:hidden;
  background-image:linear-gradient(rgba(28,34,48,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(28,34,48,.035) 1px,transparent 1px);background-size:32px 32px}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:rgba(28,34,48,.06);padding:0 .25em;border-radius:3px}

/* ---------- header ---------- */
#hdr{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1.5px solid var(--ink);background:var(--paper)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand svg{flex:none}
.brand b{font:600 22px/1 var(--serif);letter-spacing:-.01em}
.brand small{font:500 10px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-top:4px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card);flex:none}
.seg button{border:0;background:none;padding:6px 10px;font:500 12px var(--sans);display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button .k{font:500 9.5px var(--mono);letter-spacing:.1em;opacity:.65;text-transform:uppercase}
.seglbl{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-right:-6px}
.tog{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 10px;font:500 12px var(--sans);white-space:nowrap}
.tog.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tog.game{border-color:var(--glow);color:var(--glow);font-weight:600}
.tog.game.on{background:var(--glow);color:#fff}
.hsp{flex:1}
.hgrp{display:flex;align-items:center;gap:8px}

/* ---------- body grid ---------- */
#main{display:grid;grid-template-columns:264px minmax(0,1fr) 352px;height:calc(100% - 56px)}
#rail{border-right:1.5px solid var(--ink);overflow:auto;background:rgba(251,249,243,.6);padding:12px 12px 40px}
#stageWrap{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
#card{border-left:1.5px solid var(--ink);overflow-y:auto;overflow-x:hidden;background:var(--card);padding:16px 16px 60px}

/* ---------- rail ---------- */
.rp{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin:14px 0 6px;display:flex;justify-content:space-between}
.rp:first-child{margin-top:0}
.plantitle{font:600 17px/1.15 var(--serif)}
.plankind{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin:6px 0 2px}
.plankind.greenfield{background:#dcefe2;color:#1d6b40}.plankind.brownfield{background:#f3e3c6;color:#8a5a0e}
.goal{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 6px 6px 26px;border-radius:7px;position:relative;margin:1px 0}
.goal .gl{position:absolute;left:4px;top:5px;font-size:16px;line-height:1;color:var(--gc)}
.goal .gt{font:500 13px/1.25 var(--sans)}
.goal .gid{font:600 10px var(--mono);color:var(--gc);margin-right:4px}
.goal .acs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.goal:hover{background:rgba(28,34,48,.05)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line2);background:var(--card);border-radius:5px;padding:1px 5px;font:500 10.5px var(--mono);white-space:nowrap;color:var(--ink)}
.chip i{font-style:normal;font-size:10px;opacity:.85}
.chip.t-ac i{display:inline-grid;place-items:center;width:11px;height:11px;border:1px solid currentColor;border-radius:2px;font-size:8px;line-height:1}
.chip:hover{border-color:var(--ink)}
.rail-dim .dimmable{opacity:.28}
.dimmable.rel{opacity:1!important}
.chip.rel,.goal.rel .gt{font-weight:600}
.chip.rel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chip.selx,.goal.selx{outline:2px solid var(--focus);outline-offset:1px}
.csrow{display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:4px 4px;border-radius:6px;font-size:12px}
.csrow:hover{background:rgba(28,34,48,.05)}
.csrow .cid{font:600 10px var(--mono);white-space:nowrap;padding-top:2px}
.csrow.rel{font-weight:600}
.csrow.playing{background:#ffe7da}

/* ---------- stage ---------- */
#stage{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
#stage::before{content:"";position:absolute;left:0;right:12px;top:0;height:40px;z-index:4;background:linear-gradient(var(--paper) 60%,rgba(243,239,228,0));pointer-events:none}
#crumbs{position:absolute;left:12px;top:10px;z-index:5;display:flex;gap:4px;align-items:center;font:500 11px var(--mono);pointer-events:auto}
#crumbs button{border:1px solid var(--line2);background:var(--card);border-radius:5px;padding:2px 6px;font:500 11px var(--mono)}
#legend{position:absolute;right:14px;top:8px;z-index:5;background:rgba(251,249,243,.92);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font:500 10.5px var(--mono);display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 330px);justify-content:flex-end;padding:4px 9px}
#legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#legend b{display:inline-block;width:10px;height:10px;border-radius:2px}
#banner{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:6;display:none}

/* tree */
#tree{padding:44px 0 80px}
#treev::-webkit-scrollbar{width:10px}
.trow{height:var(--rowH);display:flex;align-items:center;gap:6px;padding-left:calc(40px + var(--d) * 16px);padding-right:12px;white-space:nowrap;cursor:pointer;position:relative;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(40px + 7px),transparent 0);}
.depson .trow{padding-right:178px}
.trow:hover{background:rgba(28,34,48,.05)}
.trow .tw{width:12px;flex:none;color:var(--ink3);font-size:10px;text-align:center}
.trow .cg{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:4px;font:700 12px/1 var(--mono);color:#fff;background:var(--c)}
.trow.k-sym .cg{width:13px;height:13px;border-radius:50%;font-size:9px}
.trow.k-dir .cg{background:none;color:var(--c);font-size:14px}
.trow .nm{font:500 12.5px var(--mono);color:var(--ink)}
.trow.k-dir .nm{font-weight:600}
.trow.k-sym .nm{font-size:12px}
.trow .sg{font:400 11px var(--mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow .mt{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none;padding-left:8px}
.trow .gd{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.trow .ph{font:600 9.5px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 3px}
.trow .litn{font:600 9.5px var(--mono);background:var(--ink);color:var(--paper);border-radius:8px;padding:0 5px}
.trow .newtag{font:600 9px var(--mono);letter-spacing:.1em;color:var(--add);border:1px solid var(--add);border-radius:3px;padding:0 4px;text-transform:uppercase}
.trow.ghost .nm{color:var(--ghostInk);font-weight:400}
.trow.ghost .cg{background:var(--ghost);color:var(--ghostInk)}
.trow.ghost.k-dir .cg{background:none;color:var(--ghostInk)}
.trow .cnt{font:400 10.5px var(--mono);color:var(--ghostInk)}
.trow.del .nm{text-decoration:line-through;text-decoration-color:var(--del)}
.trow.graft::before{content:"";position:absolute;left:calc(33px + var(--gd0) * 16px);top:0;bottom:0;width:3px;background:var(--add);opacity:.55;border-radius:2px}
.trow.lit{background:rgba(255,106,43,.10)}
.trow.lit .nm{font-weight:600}
.trow.sel{background:rgba(34,85,214,.13);box-shadow:inset 3px 0 0 var(--focus)}
.trow.touch .cg{animation:pulse 1.2s ease-in-out infinite}
.trow.frame{background:rgba(255,106,43,.22)}
.dimlit .trow:not(.lit):not(.sel):not(.k-dir) .nm{opacity:.45}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,43,.0)}50%{box-shadow:0 0 0 4px rgba(255,106,43,.45)}}
#treeSvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

/* columns */
#cols{display:flex;padding:44px 12px 80px;gap:0;align-items:stretch;min-height:100%}
.col{width:236px;flex:none;border:1.5px solid var(--ink);border-right-width:0;background:var(--card);overflow:auto;max-height:calc(100% - 0px)}
.col:last-child{border-right-width:1.5px}
.colh{position:sticky;top:0;background:var(--paper2);border-bottom:1px solid var(--line2);padding:6px 9px;font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink2);z-index:1}
.colh .imp{font-weight:400;letter-spacing:0;margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.citem{display:flex;align-items:center;gap:6px;padding:4px 9px;cursor:pointer;border-bottom:1px solid rgba(28,34,48,.05);min-height:26px}
.citem:hover{background:rgba(28,34,48,.05)}
.citem.on{background:var(--ink);color:var(--paper)}
.citem.on .nm,.citem.on .sg{color:var(--paper)}
.citem .cg{width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:700 11px var(--mono);color:#fff;background:var(--c)}
.citem.k-dir .cg{background:none;color:var(--c);font-size:13px}
.citem.k-sym .cg{border-radius:50%;width:12px;height:12px;font-size:8px}
.citem .nm{font:500 12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .sg{display:block;font:400 10.5px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .tx{min-width:0;flex:1}
.citem .ar{margin-left:auto;color:var(--ink3);font-size:11px}
.citem.ghost .nm{color:var(--ghostInk)}
.citem.ghost .cg{background:var(--ghost);color:var(--ghostInk)}
.citem.ghost.k-dir .cg{background:none;color:var(--ghostInk)}
.citem.lit{box-shadow:inset 3px 0 0 var(--route);background:rgba(255,106,43,.1)}
.citem.frame{background:rgba(255,106,43,.3)}
.citem .litn{font:600 9.5px var(--mono);background:var(--route);color:#fff;border-radius:8px;padding:0 5px}
.citem.on,.citem.on.lit,.citem.on.frame{background:var(--ink)!important;color:var(--paper)}
.citem.on.lit{box-shadow:inset 4px 0 0 var(--route)}
.citem.depmark .nm::after{content:" ⤳";color:var(--add)}

/* svg views */
#svgv svg{display:block}
.arc{stroke:var(--paper);stroke-width:.6px;cursor:pointer}
.arc.ghost{fill:var(--ghost)}
.arc.dimmed{opacity:.28}
.arc.litarc{stroke:var(--ink);stroke-width:1.2px}
.arc.touch{stroke:var(--route);stroke-width:1.8px}
.arc.selarc{stroke:var(--focus);stroke-width:2.4px}
.alabel{font:500 10px var(--mono);fill:var(--ink);pointer-events:none}
.alabel.w{fill:#fff}
.dep{fill:none;stroke-width:1.4px;mix-blend-mode:multiply}
.route{fill:none;stroke:var(--route);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
.routeflow{fill:none;stroke:#fff;stroke-width:1.4px;stroke-dasharray:4 10;animation:flow 1s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-14}}
.fpin{fill:var(--route);stroke:#fff;stroke-width:1.5px}
.fpin.cur{animation:pin 1s ease-in-out infinite}
@keyframes pin{50%{r:9}}
.fnum{font:700 9px var(--mono);fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.center-lbl{font:600 15px var(--serif);fill:var(--ink);text-anchor:middle}
.center-sub{font:500 10px var(--mono);fill:var(--ink3);text-anchor:middle;letter-spacing:.08em}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font:500 11.5px var(--mono);padding:5px 8px;border-radius:6px;max-width:420px;display:none;line-height:1.35}
#tip .s{color:#c9c2ad;font-weight:400}

/* dock */
#dock{border-top:1.5px solid var(--ink);background:var(--card);display:grid;grid-template-columns:minmax(260px,.9fr) minmax(0,1.6fr);min-height:0}
#scrub{padding:10px 14px;border-right:1px solid var(--line2)}
#player{padding:10px 14px;min-width:0}
.dh{display:flex;align-items:center;gap:8px;font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-bottom:8px}
.dh .sp{flex:1}
.ib{border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;width:28px;height:26px;display:inline-grid;place-items:center;font-size:12px;padding:0}
.ib.on{background:var(--ink);color:var(--paper)}
.steps{display:flex;align-items:stretch;gap:0;position:relative}
.step{flex:1;border:0;background:none;padding:0;position:relative;text-align:center;min-width:0}
.step .dot{display:block;margin:0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font:600 9.5px/19px var(--mono);position:relative;z-index:1}
.step.done .dot{background:var(--ink);color:var(--paper)}
.step.cur .dot{background:var(--route);border-color:var(--route);color:#fff;box-shadow:0 0 0 4px rgba(255,106,43,.25)}
.step .sl{display:block;font:500 10px var(--mono);color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.steps::before{content:"";position:absolute;left:5%;right:5%;top:11px;height:1.5px;background:var(--ink)}
.scrubnote{font:400 11.5px var(--sans);color:var(--ink2);margin-top:6px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cssel{display:flex;gap:4px;flex-wrap:wrap}
.cssel button{border:1px solid var(--line2);background:var(--paper);border-radius:5px;padding:1px 6px;font:600 10.5px var(--mono)}
.cssel button.on{background:var(--route);border-color:var(--route);color:#fff}
#lanes{position:relative;height:auto;margin-top:6px}
#lanes svg{display:block;width:100%}
.lane-l{font:600 9px var(--mono);fill:var(--ink3);letter-spacing:.08em}
.lane-bg{fill:rgba(28,34,48,.035)}
.fdot{cursor:pointer}
#fcap{font:500 12px var(--sans);min-height:34px;margin-top:4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#fcap .ly{font:600 9.5px var(--mono);letter-spacing:.1em;background:var(--route);color:#fff;border-radius:3px;padding:1px 5px;text-transform:uppercase}
#fcap .sy{font:600 12px var(--mono)}
#fcap .fx{font:500 11px var(--mono);color:var(--route)}
#fcap .fl{font:400 11px var(--mono);color:var(--ink3)}

/* card */
.ck{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ck .x{margin-left:auto;border:0;background:none;font-size:15px;color:var(--ink3);padding:0 2px}
.ct{font:600 21px/1.18 var(--serif);margin:0 0 8px;letter-spacing:-.005em}
.ct.goalt{font-size:24px}
.cpath{font:500 12px var(--mono);word-break:break-all;margin-bottom:8px}
.cpath .dirp{color:var(--ink3)}
.csec{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin:16px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.lin{display:grid;grid-template-columns:22px 1fr;gap:5px 6px;align-items:start}
.lin .lg{font-size:14px;text-align:center;line-height:20px}
.p{margin:0 0 8px;color:var(--ink2);font-size:12.5px}
.gwt{display:grid;grid-template-columns:44px 1fr;gap:3px 8px;font-size:12px;color:var(--ink2)}
.gwt b{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;padding-top:2px}
.cmd{position:relative;background:var(--ink);color:#e9e4d6;font:500 11px/1.45 var(--mono);padding:9px 34px 9px 10px;border-radius:7px;white-space:pre-wrap;word-break:break-word}
.cmd button{position:absolute;right:6px;top:6px;border:1px solid #555d6e;background:none;color:#e9e4d6;border-radius:4px;font:500 10px var(--mono);padding:1px 5px}
.kind{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--ink2)}
.syml{display:flex;flex-direction:column;gap:1px}
.symi{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start;border:0;background:none;text-align:left;padding:3px 4px;border-radius:5px;width:100%}
.symi:hover{background:rgba(28,34,48,.05)}
.symi .cg{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font:700 9px/1 var(--mono);color:#fff;background:var(--c);margin-top:2px}
.symi .n{font:600 11.5px var(--mono);word-break:break-all}
.symi .sg{display:block;font:400 10.5px var(--mono);color:var(--ink3);word-break:break-word}
.symi .no{display:block;font:400 11px var(--sans);color:var(--ink2)}
.symi.lit{background:rgba(255,106,43,.12)}
.symi.selx{background:rgba(34,85,214,.13)}
.rej{border-left:3px solid var(--del);padding:3px 8px;margin:6px 0;font-size:12px;color:var(--ink2)}
.rej b{color:var(--ink);font-weight:600}
.chosen{border-left:3px solid var(--add);padding:3px 8px;font-size:12.5px;margin-bottom:8px}
.frl{display:flex;flex-direction:column;gap:2px}
.fri{display:grid;grid-template-columns:18px 64px 1fr;gap:6px;align-items:baseline;border:0;background:none;text-align:left;padding:3px 4px;border-radius:5px;font-size:11.5px;width:100%}
.fri:hover{background:rgba(28,34,48,.05)}
.fri.cur{background:rgba(255,106,43,.2)}
.fri .i{font:600 10px var(--mono);color:var(--ink3)}
.fri .l{font:600 9.5px var(--mono);text-transform:uppercase;color:var(--route);letter-spacing:.06em}
.fri .s{font:600 11px var(--mono)}
.fri .d{color:var(--ink2)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stat div{border:1px solid var(--line2);border-radius:7px;padding:6px 7px;background:var(--paper)}
.stat b{display:block;font:600 19px/1 var(--serif)}
.stat span{font:500 9.5px var(--mono);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 4px;background:var(--ghost)}
.hint{font-size:12px;color:var(--ink3);margin-top:10px}
.hint kbd{font:500 10px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
.tagline{font:italic 400 14px/1.35 var(--serif);color:var(--ink2);margin:4px 0 10px}

/* game */
.gamebox{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;max-width:760px;min-width:580px}
.gamebox .q{flex:1;font:500 13px/1.35 var(--sans)}
.gamebox .q small{display:block;font:600 9.5px var(--mono);letter-spacing:.14em;color:#ffb28f;text-transform:uppercase;margin-bottom:2px}
.gamebox .q code{background:rgba(255,255,255,.12);color:#fff}

Harness is not in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One client interface is the only API. A skill or hook running sqlite3 against the store would freeze the schema.","ac":"AC12","goal":"G6","source":"G11"},{"id":"R10","title":"Ack transitions exactly once and reports whether it won","text":"Ack is a conditional update inside the append transaction; a loser is told, never silently treated as success.","ac":"AC6","goal":"G4","source":"G13"},{"id":"R11","title":"Done means it passes end to end in the harness","text":"A harness scenario running the real binary is the verdict; bounded retry, and missing seams are findings, not workarounds.","ac":"AC13","goal":"G7","source":"G15"},{"id":"R12","title":"The ontology lands before the code","text":"Canonical terms go into the glossary first, then the same word is used in every surface.","ac":"AC1","goal":"G1","source":"G16"}],"phases":[{"id":"P1","title":"Ontology, module skeleton, and the scenario comes up","summary":"Glossary first; `auto mail init/docs/list` on a minimal store; mounted in `auto`; `mail-flow` scenario green.","dependsOn":[],"goals":["G1","G6","G7"],"acs":["AC1","AC11","AC13"],"files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","har mail/internal/ulid/ulid_test.go`, `auto-mail/mail/export_test.go`.","`cli_test.go` imports `auto-mail/internal/store` (test-only, inside the module — allowed by the internal rule).","Seam guard flags a file only if it both names the mail store (alpha-store.db, alpha-flags, .auto/mail) AND contains a DB opener (sqlite, database/sql, sql.Open, sqlite3) — matches the T7 resolution.","Glossary Binding definition dropped \"and liveness\" from the plan's draft wording — consistent with D-062-2 (no liveness in T1).","Old plan ids G1–G16 are guard rails; renamed R1–R12 here (source keeps the epic id). Goals G1–G7 are new clusters.","Epic decisions D-1, D-2, D-4, D-7, D-9, D-10, D-11 are included as D10–D16 (by: epic); D-3, D-5 (superseded), D-6, D-8, D-12, D-13 are referenced only via out-of-scope."]},"052":{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8 <script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const dirname = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
const basename = p => p.slice(p.lastIndexOf('/') + 1);
const store = { get(k, d) { try { const v = localStorage.getItem('lab15.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('lab15.' + k, JSON.stringify(v)); } catch (e) {} } };

const GOALC = ['#3d5fd9', '#e0621b', '#11987a', '#cf2f6b', '#7a4be0', '#c99400', '#1a8fb0', '#6b8e23'];
const CHG = { add: 'var(--add)', edit: 'var(--edit)', delete: 'var(--del)', context: 'var(--ctx)', same: 'var(--same)', ghost: 'var(--ghost)' };
const CHGHEX = { add: '#2e8a57', edit: '#c98518', delete: '#c0392b', context: '#7d8594', same: '#8f96a3', ghost: '#ddd6c4' };
const CHGGLYPH = { add: '+', edit: '~', delete: '−', context: '·', same: '·', ghost: '·' };
const LAYERS = ['Agent', 'Harness', 'CLI', 'Hook', 'Seam', 'Domain', 'Store', 'SQLite', 'FS'];
const GL = { goal: '◎', ac: '✓', dec: '◆', rail: '▲', finding: '▲', phase: '▷', cs: '≡', thread: '✎' };

/* =========================================================== model prep */
function prep(pid) {
  const m = DATA.models[pid];
  const ghosts = DATA.ghosts[pid];
  const P = { pid, m };
  P.goalIdx = Object.fromEntries(m.goals.map((g, i) => [g.id, i]));
  P.phaseIdx = Object.fromEntries(m.phases.map((p, i) => [p.id, i + 1]));
  P.N = m.phases.length;
  P.acById = Object.fromEntries(m.acs.map(a => [a.id, a]));
  P.decById = Object.fromEntries(m.decisions.map(d => [d.id, d]));
  P.goalById = Object.fromEntries(m.goals.map(g => [g.id, g]));
  P.phById = Object.fromEntries(m.phases.map(p => [p.id, p]));
  P.csById = Object.fromEntries(m.callstacks.map(c => [c.id, c]));
  P.railById = Object.fromEntries((m.rails || []).map(r => [r.id, r]));
  P.findById = Object.fromEntries((m.findings || []).map(r => [r.id, r]));
  P.thrById = Object.fromEntries((m.threads || []).map(r => [r.id, r]));
  P.fileByPath = Object.fromEntries(m.files.map(f => [f.path, f]));
  P.goalColor = g => GOALC[P.goalIdx[g] % GOALC.length] || '#8f96a3';

  // --- tree
  const root = { id: '', name: repoLabel(), kind: 'dir', children: [], parent: null };
  const byPath = new Map([['', root]]);
  function ensureDir(path, ghost) {
    if (byPath.has(path)) return byPath.get(path);
    const parent = ensureDir(dirname(path), false);
    const n = { id: path, name: basename(path), kind: 'dir', children: [], parent, ghost: !!ghost };
    parent.children.push(n); byPath.set(path, n); return n;
  }
  for (const f of m.files) {
    const d = ensureDir(dirname(f.path));
    const fn = { id: f.path, name: basename(f.path), kind: 'file', f, change: f.change, children: [], parent: d };
    d.children.push(fn); byPath.set(f.path, fn);
    for (const s of f.symbols) {
      const sn = { id: f.path + '#' + s.name, name: s.name, kind: 'sym', s, change: s.change, children: [], parent: fn, file: fn };
      fn.children.push(sn); byPath.set(sn.id, sn);
    }
  }
  for (const g of ghosts) {
    if (byPath.has(g.p)) continue;
    const d = ensureDir(dirname(g.p));
    let n;
    if (g.t === 'd') n = { id: g.p, name: basename(g.p), kind: 'dir', children: [], parent: d, ghost: true, count: g.n };
    else if (g.t === 'm') n = { id: g.p, name: '… ' + g.n + ' more', kind: 'more', children: [], parent: d, ghost: true, count: g.n };
    else n = { id: g.p, name: basename(g.p), kind: 'file', children: [], parent: d, ghost: true };
    d.children.push(n); byPath.set(g.p, n);
  }
  // externals from deps
  const ext = m.deps.nodes.filter(n => n.kind === 'external');
  if (ext.length) {
    const eg = { id: '⟨go modules⟩', name: '⟨go modules⟩', kind: 'dir', children: [], parent: root, ghost: true, ext: true };
    root.children.push(eg); byPath.set(eg.id, eg);
    for (const e of ext) { const n = { id: '⟨ext⟩' + e.id, name: e.id, kind: 'dir', children: [], parent: eg, ghost: true, ext: true }; eg.children.push(n); byPath.set(n.id, n); }
  }
  // sort
  const rank = n => n.kind === 'more' ? 3 : n.ext ? 4 : n.kind === 'dir' ? 0 : n.kind === 'file' ? 1 : 2;
  (function sortRec(n) {
    if (n.kind !== 'file') n.children.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    n.children.forEach(sortRec);
  })(root);
  // compact single-dir chains
  P.alias = new Map();
  (function compact(n) {
    for (let i = 0; i < n.children.length; i++) {
      let c = n.children[i];
      while (c.kind === 'dir' && !c.ghost && c.children.length === 1 && c.children[0].kind === 'dir' && !c.children[0].ghost) {
        const cc = c.children[0];
        cc.name = c.name + '/' + cc.name; cc.parent = n; P.alias.set(c.id, cc); n.children[i] = cc; c = cc;
      }
      compact(c);
    }
  })(root);
  P.root = root; P.byPath = byPath;
  P.node = id => P.alias.get(id) || byPath.get(id);

  // --- derived
  const all = []; (function walk(n, d) { n.depth = d; all.push(n); n.children.forEach(c => walk(c, d + 1)); })(root, 0);
  P.all = all;
  const phaseOfFile = f => { if (!f.phases || !f.phases.length) return (f.change === 'context') ? 0 : P.N; return Math.min(...f.phases.map(p => P.phaseIdx[p] || P.N)); };
  // symbol goal: tests named by AC > callstack frames > file goal
  const symGoal = new Map();
  for (const a of m.acs) for (const t of (a.verify.tests || [])) { const [fp, s] = t.split(':'); const k = fp + '#' + s; if (!symGoal.has(k)) symGoal.set(k, a.goal); }
  for (const c of m.callstacks) for (const fr of c.frames) { const k = fr.file + '#' + fr.symbol; if (!symGoal.has(k) && c.goals && c.goals.length) symGoal.set(k, c.goals[0]); }
  for (let i = all.length - 1; i >= 0; i--) {
    const n = all[i];
    if (n.kind === 'file' && n.f) {
      n.first = n.f.change === 'add' || n.f.change === 'edit' || n.f.change === 'delete' ? phaseOfFile(n.f) : 0;
      n.goal = n.f.goals && n.f.goals[0];
      n.files = [n];
    } else if (n.kind === 'sym') {
      n.goal = symGoal.get(n.id) || n.parent.f.goals[0];
    } else if (n.kind === 'dir') {
      n.files = n.children.flatMap(c => c.files || []);
      n.hasGhost = n.ghost || n.children.some(c => c.ghost || c.hasGhost);
      n.isNew = !n.ghost && n.files.length > 0 && !n.hasGhost && n.files.every(f => f.f.change === 'add');
      const gc = {}; n.files.forEach(f => (f.f.goals || []).forEach(g => gc[g] = (gc[g] || 0) + 1));
      n.goal = Object.keys(gc).sort((a, b) => gc[b] - gc[a])[0];
      n.nChanged = n.files.filter(f => f.f.change !== 'context').length;
    } else n.files = [];
  }

    drawRoute(gR, pts, upto, segF);

}
function arcLit(d) {
  const n = d.data;
  if (n.kind === 'sym' || n.kind === 'file') return isLit(n);
  if (n.kind === 'dir') return litCount(n) > 0;

}

    : `After ${m.phases[S.step - 1].id}: ${md(m.phases[S.step - 1].summary)}`;
  $('#scrub').innerHTML = `<div class="dh">▷ Phase scrubber <span class="sp"></span><span style="letter-spacing:.04em;text-transform:none">${vis}/${tot} changes landed</span><button class="ib ${S.scrubbing ? 'on' : ''}" data-act="grow" title="play the build">${S.scrubbing ? '❚❚' : '▶'}</button></div>
    <div class="steps">${steps.map((s, i) => `<button class="step ${i < S.step ? 'done' : ''} ${i === S.step ? 'cur' : ''}" data-step="${i}" title="${esc(s.t)}"><span class="dot">${i === 0 ? '○' : i}</span><span class="sl">${i === 0 ? 'base' : s.id}</span></button>`).join('')}</div>
    <div class="scrubnote">${note}</div>`;
  // player
  const c = S.cs ? P.csById[S.cs] : null;
  let h = `<div class="dh">≡ Route player <span class="cssel">${m.callstacks.map(x => `<button data-cs="${x.id}" class="${S.cs === x.id ? 'on' : ''}" title="${esc(x.title)}">${x.id}</button>`).join('')}</span><span class="sp"></span>
    ${c ? `<button class="ib" data-act="prev" title="←">‹</button><button class="ib ${S.playing ? 'on' : ''}" data-act="play" title="space">${S.playing ? '❚❚' : '▶'}</button><button class="ib" data-act="next" title="→">›</button><button class="ib" data-act="stopcs" title="close route">✕</button>` : ''}</div>`;
  if (!c) h += `<div class="hint" style="margin-top:14px">Pick a call stack — the action plays as a glowing route through the folders, and as slices through the layers below.</div>`;
  else {
    const layers = LAYERS.filter(l => c.frames.some(f => f.layer === l));
    const W = Math.max(300, $('#player').clientWidth - 28), lh = 13, H = layers.length * lh + 4;
    const x = i => 60 + (W - 76) * (c.frames.length === 1 ? 0 : i / (c.frames.length - 1));
    const y = l => layers.indexOf(l) * lh + lh / 2 + 2;
    let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
    layers.forEach((l, i) => { svg += `<rect class="lane-bg" x="0" y="${i * lh + 2}" width="${W}" height="${lh - 1}" rx="2" opacity="${i % 2 ? 0 : 1}"/><text class="lane-l" x="4" y="${i * lh + lh / 2 + 5}">${l.toUpperCase()}</text>`; });
    const upto = S.frame < 0 ? -1 : S.frame;
    let d = ''; c.frames.forEach((f, i) => { if (i <= Math.max(upto, 0)) d += (i ? 'L' : 'M') + x(i) + ',' + y(f.layer); });
    let dAll = ''; c.frames.forEach((f, i) => { dAll += (i ? 'L' : 'M') + x(i) + ',' + y(f.layer); });
    svg += `<path d="${dAll}" fill="none" stroke="#c6bda7" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    if (upto >= 0) svg += `<path d="${d}" fill="none" stroke="#ff6a2b" stroke-width="2.4"/>`;
    c.frames.forEach((f, i) => { svg += `<circle class="fdot" data-frame="${c.id}:${i}" cx="${x(i)}" cy="${y(f.layer)}" r="${i === upto ? 5.5 : 4}" fill="${i <= upto ? '#ff6a2b' : '#fbf9f3'}" stroke="${i <= upto ? '#fff' : '#838a97'}" stroke-width="1.3"><title>${i + 1}. ${esc(f.layer)} · ${esc(f.symbol)} — ${esc(f.does)}</title></circle>`; });
    svg += `</svg>`;
    const fr = upto >= 0 ? c.frames[upto] : null;
    h += `<div id="lanes">${svg}</div><div id="fcap">${fr ? `<span class="ly">${upto + 1}/${c.frames.length} · ${esc(fr.layer)}</span><span class="sy">${esc(fr.symbol)}</span><span>${md(fr.does)}</span>${fr.effect ? `<span class="fx">→ ${md(fr.effect)}</span>` : ''}<span class="fl">${esc(fr.file)}</span>` : `<span class="fl">${md(c.title)} — press ▶ or →</span>`}</div>`;
  }
  $('#player').innerHTML = h;
}

/* =========================================================== actions */
function select(sel) {
  if (S.game) return;
  if (sel && S.sel && S.sel.t === sel.t && S.sel.id === sel.id) sel = null;
  S.sel = sel;
  if (sel && ['file', 'sym', 'dir'].includes(sel.t)) {
    const n = P.node(sel.id);
    if (n) {
      revealInTree(n);
      S.colPath = colPathTo(n.kind === 'sym' ? n.parent : n);
      if (n.kind === 'file') S.openFiles.add(n.id);
    }
  }
  render();
  if (sel && ['file', 'sym', 'dir'].includes(sel.t)) scrollTreeTo(P.node(sel.id));
  else if (sel) scrollToFirstLit();
}
function scrollToFirstLit() {
  if (S.layout !== 'tree') return;
  const el = document.querySelector('#tree .trow.lit');
  if (el) { const v = $('#treev'); v.scrollTo({ top: Math.max(0, el.offsetTop - 90), behavior: 'smooth' }); }
}
function scrollPrimary() {
  if (S.layout !== 'tree') return;
  const tops = P.root.children.filter(n => n.kind === 'dir' && !n.ghost).sort((a, b) => b.nChanged - a.nChanged);
  const n = tops[0]; if (!n) return;
  const el = document.querySelector(`#tree .trow[data-node="${CSS.escape(n.id)}"]`);
  if (el) $('#treev').scrollTop = Math.max(0, el.offsetTop - 60);
}
function revealInTree(n) { let x = n.parent; while (x) { S.collapsed.delete(x.id); x = x.parent; } }
function scrollTreeTo(n) {
  if (S.layout !== 'tree' || !n) return;
  const el = document.querySelector(`#tree .trow[data-node="${CSS.escape(n.id)}"]`);
  if (el) { const v = $('#treev'); const r = el.offsetTop; if (r < v.scrollTop + 40 || r > v.scrollTop + v.clientHeight - 60) v.scrollTo({ top: r - v.clientHeight / 3, behavior: 'smooth' }); }
}
function clickNode(n, fromSvg) {
  if (S.game) return gameAnswer(n);
  if (!n || n.kind === 'more') return;
  const t = n.kind === 'sym' ? 'sym' : n.kind === 'file' ? 'file' : 'dir';
  if (n.kind === 'file' && n.ghost) return;
  if (fromSvg && t === 'dir' && S.sel && S.sel.id === n.id && !n.ghost) { S.focus = n.id; S.sel = null; render(); return; }
  select({ t, id: n.id });
}
function setCS(id) {
  if (S.cs === id) { if (!S.playing) play(); return; }
  S.cs = id; S.frame = -1; S.sel = { t: 'cs', id };
  // reveal all frame files
  P.csById[id].frames.forEach(fr => { const n = P.node(fr.file); if (n) revealInTree(n); });
  render(); play();
}
function setFrame(i) {
  const c = P.csById[S.cs]; if (!c) return;
  S.frame = Math.max(0, Math.min(c.frames.length - 1, i));
  const fr = c.frames[S.frame]; const n = P.node(fr.file + '#' + fr.symbol) || P.node(fr.file);
  if (n) { revealInTree(n); S.colPath = colPathTo(n.kind === 'sym' ? n.parent : n); if (S.focus && !isAnc(P.node(S.focus), n)) S.focus = ''; }
  render(); if (n) scrollTreeTo(n);
}
function play() {
  stopPlay(); const c = P.csById[S.cs]; if (!c) return;
  if (S.frame >= c.frames.length - 1) S.frame = -1;
  S.playing = setInterval(() => { if (S.frame >= c.frames.length - 1) { stopPlay(); renderDock(); return; } setFrame(S.frame + 1); }, 1100);
  setFrame(S.frame + 1);
}
function stopPlay() { if (S.playing) clearInterval(S.playing); S.playing = null; }
function grow() {
  if (S.scrubbing) { clearInterval(S.scrubbing); S.scrubbing = null; render(); return; }
  S.step = 0; render();
  S.scrubbing = setInterval(() => { if (S.step >= P.N) { clearInterval(S.scrubbing); S.scrubbing = null; render(); return; } S.step++; render(); }, 1400);
}
function setPlan(id) {
  if (S.plan === id) return;
  stopPlay(); if (S.scrubbing) { clearInterval(S.scrubbing); S.scrubbing = null; }
  S.plan = id; P = PLANS[id]; S.sel = null; S.cs = null; S.frame = -1; S.step = P.N; S.focus = ''; S.colPath = []; S.collapsed = new Set(); S.openFiles = new Set(); PREV = new Map();
  if (S.game) startGame();
  try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; }
  d3.select('#svgv').selectAll('*').remove();
  render(); scrollPrimary();
}

/* =========================================================== GAME */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startGame() {
  const m = P.m; const pool = [];
  m.files.filter(f => f.change !== 'context').forEach(f => f.symbols.filter(s => s.change !== 'same' && s.kind !== 'heading' && s.kind !== 'term').forEach(s => pool.push({ kind: 'sym', q: `Where does <code>${esc(s.name)}</code> live?`, sub: s.sig ? `<code>${esc(s.sig)}</code>` : esc(s.kind), target: dirname(f.path), reveal: f.path + '#' + s.name })));
  m.acs.forEach(a => { const t = (a.verify.tests || [])[0]; if (t) { const fp = t.split(':')[0]; pool.push({ kind: 'ac', q: `Which folder holds the proof for <b>✓ ${a.id}</b>?`, sub: md(a.title), target: dirname(fp), reveal: t.replace(':', '#') }); } });
  m.callstacks.forEach(c => c.frames.forEach((fr, i) => { if (fr.depth > 0) pool.push({ kind: 'cs', q: `${c.id} step ${i + 1} (${esc(fr.layer)}): “${md(fr.does)}” — which folder?`, sub: `<code>${esc(fr.symbol)}</code>`, target: dirname(fr.file), reveal: fr.file + '#' + fr.symbol }); }));
  const syms = shuffle(pool.filter(p => p.kind === 'sym')).slice(0, 4), acs = shuffle(pool.filter(p => p.kind === 'ac')).slice(0, 2), css = shuffle(pool.filter(p => p.kind === 'cs')).slice(0, 2);
  S.game = { qs: shuffle([...syms, ...acs, ...css]), i: 0, score: 0, tries: 0, fb: null, answered: false, done: false, log: [] };
  S.sel = null; S.cs = null; S.frame = -1; stopPlay(); S.step = P.N; S.focus = '';
  S.collapsed = new Set(P.all.filter(n => n.kind === 'dir' && n !== P.root && !n.ghost).map(n => n.id)); S.colPath = [];
  document.body.classList.add('gamemode');
}
function gameTarget() { const q = S.game.qs[S.game.i]; return P.node(q.target); }
function gameAnswer(n) {
  const G = S.game; if (!G || G.done) return;
  if (G.answered) return;
  let d = n.kind === 'sym' ? n.parent.parent : n.kind === 'file' || n.kind === 'more' ? n.parent : n;
  const tgt = gameTarget();
  G.tries++;
  if (d === tgt) { G.score += G.tries === 1 ? 2 : 1; G.fb = { c: 'ok', t: G.tries === 1 ? '✓ Spot on — first try. +2' : '✓ Found it. +1' }; G.answered = true; G.log.push({ ok: true, q: G.qs[G.i] }); revealAnswer(); }
  else if (isAnc(d, tgt)) { G.tries--; G.fb = { c: 'warm', t: `Warmer — it is inside <code>${esc(d.id || d.name)}/</code>. Go deeper.` }; S.collapsed.delete(d.id); S.colPath = colPathTo(d); if (S.layout === 'sun' || S.layout === 'ice') S.focus = d.id; }
  else if (G.tries >= 3) { G.fb = { c: 'no', t: `✕ It lives in <code>${esc(tgt.id)}/</code>.` }; G.answered = true; G.log.push({ ok: false, q: G.qs[G.i] }); revealAnswer(); }
  else { G.fb = { c: 'no', t: `✕ Not <code>${esc(d.id || d.name)}/</code> — ${3 - G.tries} tr${3 - G.tries === 1 ? 'y' : 'ies'} left.` }; }
  render();
}
function revealAnswer() {
  const q = S.game.qs[S.game.i]; const n = P.node(q.reveal) || P.node(q.target);
  if (n) { revealInTree(n); S.colPath = colPathTo(n.kind === 'sym' ? n.parent : n); S.focus = ''; S.game.revealId = n.id; setTimeout(() => scrollTreeTo(n), 30); }
}
function gameNext() {
  const G = S.game; G.i++; G.tries = 0; G.fb = null; G.answered = false; G.revealId = null;
  if (G.i >= G.qs.length) G.done = true;
  S.collapsed = new Set(P.all.filter(n => n.kind === 'dir' && n !== P.root && !n.ghost).map(n => n.id)); S.focus = ''; S.colPath = [];
  render();
}
function endGame() { S.game = null; document.body.classList.remove('gamemode'); S.collapsed = new Set(); render(); }
function renderBanner() {
  const b = $('#banner'); const G = S.game;
  if (!G) { b.style.display = 'none'; return; }
  b.style.display = 'block';
  if (G.done) { b.innerHTML = `<div class="gamebox"><div class="q"><small>⊕ where does it live? · done</small>You placed <b>${G.log.filter(l => l.ok).length}/${G.qs.length}</b> things on the map.</div><div class="sc">${G.score}<span>points</span></div><button data-game="again">Again</button><button data-game="end">Exit</button></div>`; return; }
  const q = G.qs[G.i];
  b.innerHTML = `<div class="gamebox"><div class="q"><small>⊕ where does it live? · ${G.i + 1}/${G.qs.length} · click a folder</small>${q.q}<br><span style="opacity:.75;font-size:12px">${q.sub}</span>${G.fb ? `<div class="fb ${G.fb.c}">${G.fb.t}</div>` : ''}</div><div class="sc">${G.score}<span>points</span></div>${G.answered ? `<button data-game="next">Next →</button>` : `<button data-game="skip">Reveal</button>`}<button data-game="end">Exit</button></div>`;
}
function gameSummary() {
  const G = S.game;
  const by = {}; G.log.forEach(l => { by[l.q.kind] = by[l.q.kind] || [0, 0]; by[l.q.kind][1]++; if (l.ok) by[l.q.kind][0]++; });
  const nm = { sym: 'Symbols', ac: 'AC proofs', cs: 'Route frames' };
  return `<div class="ck">⊕ result</div><h2 class="ct">${G.score} points · ${G.log.filter(l => l.ok).length}/${G.qs.length} placed</h2>
    ${Object.entries(by).map(([k, [a, b]]) => `<p class="p"><b>${nm[k]}</b>: ${a}/${b}</p>`).join('')}
    <div class="csec">Missed</div>${G.log.filter(l => !l.ok).map(l => `<p class="p">${l.q.q} → <a href="#" data-node="${esc(l.q.reveal)}" class="mono">${esc(l.q.target)}/</a></p>`).join('') || '<p class="p">Nothing — you know this map.</p>'}`;
}

/* =========================================================== render */
function render() {
  LIT = computeLit();
  if (S.game && S.game.revealId) { LIT = { files: new Set(), syms: new Set(), rel: new Set(), any: true }; const n = P.node(S.game.revealId); if (n) { if (n.kind === 'sym') { LIT.syms.add(n.id); LIT.files.add(n.parent.id); } else LIT.files.add(n.id); } }
  renderHeader(); renderRail(); renderLegend(); renderBanner();
  ['treev', 'colsv', 'svgv'].forEach(id => $('#' + id).style.display = 'none');
  if (S.layout === 'tree') { $('#treev').style.display = 'block'; renderTree(); }
  else if (S.layout === 'cols') { $('#colsv').style.display = 'block'; renderCols(); }
  else { $('#svgv').style.display = 'block'; renderSvgView(); }
  renderDock(); renderCard();
}

/* =========================================================== events */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-plan],[data-layout],[data-color],[data-tog],[data-game],[data-sel],[data-cs],[data-node],[data-twist],[data-step],[data-act],[data-frame],[data-focus],[data-copy]');
  if (!t) { return; }
  if (t.tagName === 'A') ev.preventDefault();
  const ds = t.dataset;
  if (ds.plan) return setPlan(ds.plan);
  if (ds.layout) { S.layout = ds.layout; store.set('layout', S.layout); PREV = new Map(); return render(); }
  if (ds.color) { S.color = ds.color; store.set('color', S.color); return render(); }
  if (ds.tog) { S[ds.tog] = !S[ds.tog]; store.set(ds.tog, S[ds.tog]); return render(); }
  if (ds.game) {
    if (ds.game === '1') { if (S.game) endGame(); else { startGame(); render(); } return; }
    if (ds.game === 'end') return endGame();
    if (ds.game === 'again') { startGame(); return render(); }
    if (ds.game === 'next') return gameNext();
    if (ds.game === 'skip') { S.game.fb = { c: 'no', t: `It lives in <code>${esc(gameTarget().id)}/</code>.` }; S.game.answered = true; S.game.log.push({ ok: false, q: S.game.qs[S.game.i] }); revealAnswer(); return render(); }
  }
  if (ds.copy) { try { navigator.clipboard.writeText(ds.copy); t.textContent = 'copied'; } catch (e) {} return; }
  if (ds.twist) {
    ev.stopPropagation();
    const n = P.node(ds.twist); if (!n) return;
    if (n.kind === 'dir') { S.collapsed.has(n.id) ? S.collapsed.delete(n.id) : S.collapsed.add(n.id); }
    else if (n.kind === 'file') { S.openFiles.has(n.id) ? S.openFiles.delete(n.id) : S.openFiles.add(n.id); }
    return render();
  }
  if (ds.frame) { const [cid, i] = ds.frame.split(':'); if (S.cs !== cid) { S.cs = cid; stopPlay(); } S.sel = S.sel && S.sel.t === 'sym' ? S.sel : { t: 'cs', id: cid }; stopPlay(); return setFrame(+i); }
  if (ds.sel) { const [tt, id] = ds.sel.split(':'); return select({ t: tt, id }); }
  if (ds.cs) return setCS(ds.cs);
  if (ds.step) { if (S.scrubbing) { clearInterval(S.scrubbing); S.scrubbing = null; } S.step = +ds.step; return render(); }
  if (ds.focus != null && ds.focus !== undefined && t.hasAttribute('data-focus')) { S.focus = ds.focus; return render(); }
  if (ds.act) {
    const a = ds.act;
    if (a === 'clear') { S.sel = null; return render(); }
    if (a === 'grow') return grow();
    if (a === 'play') { if (S.playing) { stopPlay(); renderDock(); } else play(); return; }
    if (a === 'prev') { stopPlay(); return setFrame(S.frame - 1); }
    if (a === 'next') { stopPlay(); return setFrame(S.frame + 1); }
    if (a === 'stopcs') { stopPlay(); S.cs = null; S.frame = -1; if (S.sel && S.sel.t === 'cs') S.sel = null; return render(); }
    if (a === 'expandAll') { S.collapsed = new Set(); return render(); }
    if (a === 'collapseAll') { S.collapsed = new Set(P.all.filter(n => n.kind === 'dir' && n !== P.root && n.depth >= 1 && !n.ghost).map(n => n.id)); return render(); }
  }
  if (ds.node != null && t.hasAttribute('data-node')) {
    const n = P.node(ds.node); if (!n) return;
    if (S.game) return gameAnswer(n);
    if (t.classList.contains('citem') && n.kind === 'dir') { S.colPath = colPathTo(n); }
    return clickNode(n, false);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.closest && ev.target.closest('input,textarea')) return;
  if (ev.key === 'Escape') {
    if (S.game) return endGame();
    if (S.sel) { S.sel = null; return render(); }
    if (S.cs) { stopPlay(); S.cs = null; S.frame = -1; return render(); }
    if (S.focus) { const f = P.node(S.focus); S.focus = f && f.parent ? f.parent.id : ''; return render(); }
    return;
  }
  const lk = { '1': 'tree', '2': 'cols', '3': 'sun', '4': 'ice' }[ev.key];
  if (lk) { S.layout = lk; store.set('layout', lk); PREV = new Map(); return render(); }
  if (S.cs && ev.key === 'ArrowRight') { ev.preventDefault(); stopPlay(); return setFrame(S.frame + 1); }
  if (S.cs && ev.key === 'ArrowLeft') { ev.preventDefault(); stopPlay(); return setFrame(S.frame - 1); }
  if (S.cs && ev.key === ' ') { ev.preventDefault(); if (S.playing) { stopPlay(); renderDock(); } else play(); }
});
window.addEventListener('hashchange', () => { const id = location.hash.replace('#', ''); if (PLANS[id]) setPlan(id); });
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(render, 120); });
render(); scrollPrimary();

</script>
</body>
</html>
