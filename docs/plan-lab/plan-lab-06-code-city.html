nge":"delete","why":"Legacy superseded-process artifact (F11).","before":6249,"after":null}],"threads":[{"anchor":"AC-4","status":"resolved","priority":"p2","title":"`feedback` can't expose a minted top-level id without a service.go change not in the plan","comments":[{"by":"review","text":"AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes."},{"by":"author","text":"Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope)."}],"tab":"Verification"},{"anchor":"AC-4","status":"resolved","priority":"p2","title":"`rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes","comments":[{"by":"review","text":"AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`."},{"by":"author","text":"Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list."}],"tab":"Verification"},{"anchor":"AC-13","status":"resolved","priority":"p3","title":"`no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills","comments":[{"by":"review","text":"The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove."},{"by":"author","text":"Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match."}],"tab":"Verification"},{"anchor":"end-state","status":"resolved","priority":"p2","title":"gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists","comments":[{"by":"review","text":"The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`."},{"by":"author","text":"Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id."}],"tab":"Solution"},{"anchor":"auto-reflect/internal/rules/model.go","status":"resolved","priority":"p1","title":"Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id","comments":[{"by":"review","text":"There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan."},{"by":"author","text":"Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2."}],"tab":"Solution"},{"anchor":"auto-reflect/internal/observations/model.go","status":"resolved","priority":"p3","title":"Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set","comments":[{"by":"review","text":"Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered."},{"by":"author","text":"Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately."}],"tab":"Solution"}],"tabs":[{"name":"Requirements","md":"\n## Problem\n\nThe `/reflect-playbook` end-to-end spike on 2026-06-28\n(`.tmp/reflect-playbook-spike-findings.md`) found the `auto reflect` loop's\n**skeleton is solid** — deterministic, gated, append-only, with good error\nremediation — but its **read / output side is untrustworthy**: the loop\n*captures* signal well yet *surfaces* it poorly.\n\nThe headline: reported feedback **gaps** (the explicit bridge back to Stage-1\nobservation) are persisted to the event log but **cannot be read back through\nany command** — you must `grep` raw JSONL. So the advertised closed loop\n(\"gap → next observation\") is, in practice, open. Alongside it the spike found\ntwo disagreeing pending-counts, per-command JSON shapes that make id-threading\nerror-prone, non-deterministic ids, a self-contradictory git policy for\n`.auto/reflect/`, and a few smaller doc/projection gaps.\n\nThis task fixes the **high-priority** findings so the loop becomes\n\"trustworthy\" rather than \"works if you hold it right.\"\n\n## Goals\n\nEach goal maps to a finding code (`F#`) from the spike report.\n\n| # | Finding | Fix |\n|---|---------|-----|\n| **F4** (P1) | Feedback gaps are write-only | Add `auto reflect gap list` — surfaces each reported gap (report + moment + source feedback id / session / ts), so the gap → observation loop-back has tooling. |\n| **F2** (P1) | `miner status` `pending` (390) ≠ `stats` `pending_to_mine` (396) | Collapse both onto **one shared counting function** (single source of truth); document exactly which session universe it counts. |\n| **F5** (P2) | Each command nests its minted id differently; `rule promote` top-level `.id` is `null` | **Restructure to a uniform output envelope** with a predictable top-level `.id` / `.ids` (and `.[].id` for collection results). Breaking change to the CLI output contract. |\n| **F7** | Dry-run ids ≠ apply ids, so you can't pre-stage `promote` | Mint rule & observation ids as **deterministic content hashes** so `--dry-run` == apply. Existing id *formats* preserved. |\n| **F9** | `.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked) | `auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**. |\n| **F1** | Stale/partial init state undetected (dir exists, no `events/`; legacy 0-byte `feedback.jsonl`) | Add init / `doctor` detection of stale or partial reflect state with a concrete remediation hint. |\n| **F6** | Rule `created_at` / `updated_at` come back `\"\"` / `null` | Populate them in the rules projection from the underlying event timestamps (`Event.TS`) — no new stored data needed. |\n| **F8 / F3** (P3) | `outcome` enum & `correction_density` undocumented | Document the `outcome` enum (`success\\|partial\\|fail\\|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`. |\n| **F11** | Legacy `docs/reflection/*.yaml` from the superseded process still present | **Remove** the legacy yaml (no migration — old process). |\n\n## Decisions made (with Charlie, 2026-06-28)\n\nThe four load-bearing forks were resolved before drafting; recorded here as ADRs\nso the executor inherits them. Two further constraints (D-5, D-6) are calls the\nagent made to keep the append-only event contract intact.\n\n### D-1 — F4 surface = dedicated `gap list`\n\n`accepted` · by **charlie** — *Dedicated `auto reflect gap list`, not a generic events --full flag.*\n\n**Decision:** Expose gaps via a dedicated `auto reflect gap list` command.\n**Alternatives:** A generic `events list --full/--payload` flag; both.\n**Consequences:** Matches the \"gap → observation\" mental model and is discoverable;\nthe generic payload-dump flag is left out of scope.\n\n### D-2 — Event log is git-tracked\n\n`accepted` · by **charlie** — *events/ tracked; init .gitignore ignores only playbook.json.*\n\n**Decision:** The canonical `.auto/reflect/events/*.jsonl` log is committed\n(shared playbook history; any clone can `rebuild`). The init-written\n`.auto/reflect/.gitignore` ignores only the disposable `playbook.json`.\n**Alternatives:** Ignore events too (machine-local reflect state).\n**Consequences:** Reflect history travels with the repo and across hosts.\n\n### D-3 — F5 = restructure to a uniform envelope (breaking)\n\n`accepted` · by **charlie** — *One uniform output envelope; top-level id/ids. Breaks existing consumers.*\n\n**Decision:** Restructure command output to one uniform envelope rather than\nadditively bolting a top-level `.id` onto today's shapes.\n**Alternatives:** Non-breaking additive `.id`/`.ids`.\n**Consequences:** Cleanest end state; existing output consumers (and the skill\nreferences' documented extraction paths) must be updated in lockstep.\n\n### D-4 — Content-derived ids included in 052\n\n`accepted` · by **charlie** — *Deterministic content-hashed ids ship in this task.*\n\n**Decision:** Implement content-derived ids (F7) in this task, not a follow-up.\n**Consequences:** Adds collision-handling design; fits the output-contract theme\nsince deterministic ids make `--dry-run` output actionable.\n\n### D-5 — F5 changes CLI output only — not the stored event schema\n\n`accepted` · by **agent** — *Envelope restructure is presentation-layer; on-disk payloads + schema_version=1 unchanged.*\n\n**Context:** Stored payload field names (`observation_id`, `rule_id`, …) are part\nof the append-only on-disk contract; `events.SchemaVersion` is 1 and must fold\nidentically forever.\n**Decision:** F5 restructures only CLI *output* marshalling. Stored event payload\nfield names and `schema_version` are untouched.\n**Consequences:** No schema bump; the uniform envelope is a view over canonical\ndata, consistent with \"playbook is a disposable cache, events are canonical.\"\n\n### D-6 — Content-derived ids preserve existing id formats\n\n`accepted` · by **agent** — *Only minting changes (random → content hash); regex formats like ^ob-[0-9a-f]{8}$ stay.*\n\n**Context:** Ids are validated against fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`.\n\n## Out of Scope\n\n- **F10 ack-nudge** — a \"you observed against session X but never `ack`ed it\"\n  warning. Nice-to-have; deferred.\n- **Gap *resolution* tracking** — linking a reported gap to the observation that\n  closed it. `gap list` lists all gaps; v1 has no resolution state (no such link\n  exists today).\n- **On-disk event schema changes** — no `schema_version` bump, no stored payload\n  field renames (see D-5).\n- **The `/reflect-playbook` skill prompt/flow redesign** — only its reference docs\n  are touched (F8/F3), not its orchestration.\n- **A generic `events list --full` payload dump** — superseded by the dedicated\n  `gap list` (D-1).\n\n## Open Questions\n\nAll four load-bearing forks are resolved (see Decisions). The items below are\nassumptions the plan proceeds on — recorded so they can be revisited, but not\ngating:\n\n- [ ] **`gap list` shape** — lists every reported gap with its source (feedback\n  id, session id, ts, `report`, `moment`); no open/resolved state, since no\n  gap → observation link exists. *(assumption)*\n- [ ] **F2 root cause** — the off-by-6 (390 vs 396) is assumed to be one divergent\n  computation, not two legitimately different universes; fix = collapse both call\n  sites onto a shared function. The exact cause is pinned during implementation.\n  *(assumption)*\n- [ ] **Content-hash inputs** — hash over each entity's canonical content fields\n  (rule: `domain + use_when + content + rule_type`; observation:\n  `kind + subject + evidence`). Finalized in `/new-solution`. *(assumption)*\n- [ ] **Scope size** — this bundles 9 findings; if it proves too large at the\n  solution stage, F8/F3 (docs) + F11 (legacy removal) split cleanly into a\n  follow-up. *(assumption)*\n\n## Source\n\n- Spike findings: `.tmp/reflect-playbook-spike-findings.md` (throwaway/demo run,\n  2026-06-28; executor session `518b6d9a`).\n- Tool: `auto-reflect/` (`reflect version v0.24.0-21-ge183760`).\n"},{"name":"Verification","md":"\n## Test Strategy\n\nThe module already has the harnesses we need — lean on them rather than inventing\nnew ones:\n\n- **Unit** — pure-function changes: content-derived id determinism\n  (`rules`/`observations` model tests), `Fold` timestamp population\n  (`projection_test.go`), the single shared pending-count function\n  (`miner` test), feedback-gap projection for `gap list`.\n- **Integration** — CLI output contracts via the existing\n  `*_integration_test.go` (events, observation, consolidate) and a new\n  `gap`/`doctor` integration test. These assert the **new uniform envelope** and\n  are where most of the F5 churn lands (every output-shape assertion moves to\n  `.id`/`.ids`/`.[].id`).\n- **E2E** — the existing `cmd/autoreflect/e2e_*_test.go` lifecycle/loop suites,\n  extended so the full mine → observe → consolidate → promote → retrieve →\n  select → feedback → **gap list** loop runs against an on-disk fixture\n  (per CLAUDE.md: populate a stable dataset on disk, run the tools as a user).\n- **Manual replay** — re-run the spike's bounded loop and confirm every spike\n  finding (F1–F11 in scope) is closed; reset throwaway artifacts after.\n\nConventions enforced throughout (CLAUDE.md / `auto-package-patterns.md`):\nJSON default + 2-space indent, stdout = payload only / diagnostics + remediation\nto stderr, non-zero exit on any error, `validate()` structured errors, and\n`go build ./...` clean after every file.\n\n## Coverage Map\n\n*Diagram: Testing layers*\n\n```\nflowchart TD\n  U[Unit: id determinism, Fold timestamps, pending count, gap projection] --> I[Integration: CLI envelope contracts, gap list, doctor]\n  I --> E[E2E: full reflect loop on disk fixture + gap read-back]\n  E --> M[Manual: replay spike loop, confirm F1-F11 closed]\n```\n\n## Acceptance Criteria\n\n### AC-1 — gap list surfaces reported gaps (F4)\n\nPhases: 5 · Tests: `auto-reflect/internal/cli/gap_integration_test.go`\n\n**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted.\n\n### AC-2 — gap list obeys list conventions (F4)\n\nPhases: 5 · Tests: `auto-reflect/internal/cli/gap_integration_test.go`\n\n**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available.\n\n### AC-3 — One pending count, two callers agree (F2)\n\nPhases: 4 · Tests: `auto-reflect/internal/cli/miner_integration_test.go`\n\n**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged.\n\n### AC-4 — Mutating commands expose a top-level id (F5)\n\nPhases: 1,2,3 · Tests: `auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go`\n\n**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)\n\n> **Review thread** on `AC-4` — `feedback` can't expose a minted top-level id without a service.go change not in the plan (p2, resolved)\n\n> *review:* AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes.\n\n> *author:* Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope).\n\n> **Review thread** on `AC-4` — `rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes (p2, resolved)\n\n> *review:* AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`.\n\n> *author:* Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list.\n\n### AC-5 — Collection commands expose .[].id without data loss (F5)\n\nPhases: 1,3 · Tests: `auto-reflect/internal/cli/observation_integration_test.go`\n\n**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths.\n\n### AC-6 — Content-derived ids make consolidate deterministic + idempotent (F7)\n\nPhases: 1,2 · Tests: `auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go`\n\n**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists.\n\n### AC-7 — Ids keep their format (F7/D-6)\n\nPhases: 1,2 · Tests: `auto-reflect/internal/idhash/idhash_test.go`\n\n**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids.\n\n### AC-8 — init writes an idempotent .gitignore (F9)\n\nPhases: 7 · Tests: `auto-reflect/internal/cli/init_test.go`\n\n**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it.\n\n### AC-9 — Canonical events tracked, cache ignored (F9/D-2)\n\nPhases: 7 · Tests: `auto-reflect/internal/cli/init_test.go`\n\n**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked).\n\n### AC-10 — doctor detects stale/partial state (F1)\n\nPhases: 6 · Tests: `auto-reflect/internal/cli/doctor_integration_test.go`\n\n**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail.\n\n### AC-11 — Rule listings carry timestamps (F6)\n\nPhases: 3 · Tests: `auto-reflect/internal/rules/projection_test.go`\n\n**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto reflect rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map).\n\n### AC-12 — outcome enum + correction_density documented (F8/F3)\n\nPhases: 7 · Tests: `—`\n\n**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set.\n\n### AC-13 — Legacy yaml removed (F11)\n\nPhases: 7 · Tests: `—`\n\n**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove.\n\n> **Review thread** on `AC-13` — `no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills (p3, resolved)\n\n> *review:* The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove.\n\n> *author:* Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match.\n\n### AC-14 — No regressions (cross-cutting)\n\nPhases: 1,2,3,4,5,6,7 · Tests: `auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go`\n\n**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`.\n\n## Known Gaps & Risks\n\n- **F5 is a breaking output change.** No external consumers are known, but the\n  reflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\n  the documented `jq` paths break. Mitigation: update docs in the same task.\n- **Content-id collisions.** Across *distinct* content an 8-hex prefix collision\n  is astronomically unlikely; *identical* content → identical id is intended\n  (idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\n  accepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\n  loop call is a distinct event, not a content identity (see Solution).\n- **F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\n  logic drift. Before collapsing, confirm it isn't a legitimate dual-universe\n  count (subagents/scope) — the unit test must reproduce the divergence first,\n  then prove the shared function fixes it.\n- **doctor depth.** v1 checks state-dir presence, event decodability, and\n  snapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\n  monotonicity) may be deferred to a follow-up.\n- **No migration of old ids.** Events written before this task keep random ids;\n  only newly minted ids are content-derived. This is intentional (append-only).\n"},{"name":"Solution","md":"\n## Approach\n\nNine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced.\n\n## End-state CLI\n\n** zsh — the hardened surface** — What success looks like\n\n```\n$ auto reflect gap list --since 7d\n```\n*F4: gaps are readable, no more grepping jsonl*\n\n```\n[\n  { \"id\": \"ev-3a9c1d77\", \"session_id\": \"518b6d9a…\", \"ts\": \"2026-06-28T13:52:…\",\n    \"report\": \"no rule covered worktree teardown on complete-task\",\n    \"moment\": \"deleting the branch after merge\" }\n]\n```\n\n```\n$ auto reflect consolidate --dry-run delta.json | jq -r '.ids[0]'\n```\n*F7: same id on dry-run and apply (separate runs)*\n\n```\nr-1a2b3c4d\n```\n\n```\n$ auto reflect consolidate delta.json | jq -r '.ids[0]'\n```\n**\n\n```\nr-1a2b3c4d   # identical → pre-stage `rule promote r-1a2b3c4d` from the preview\n```\n\n```\n$ auto reflect doctor\n```\n*F1: structured health, exit 1 on fail*\n\n```\n[\n  { \"check\": \"events_dir\", \"status\": \"pass\", \"message\": \"12 shards, all decodable\" },\n  { \"check\": \"playbook_freshness\", \"status\": \"warn\",\n    \"message\": \"snapshot stale vs log\", \"hint\": \"run auto reflect rebuild\" }\n]\n```\n\n> **Review thread** on `end-state` — gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists (p2, resolved)\n\n> *review:* The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`.\n\n> *author:* Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id.\n\n## Key APIs\n\n**API: idhash**\n\n- `Derive(prefix string, parts ...string) string`\nReturns prefix + first 8 hex of sha256 over the newline-joined parts. Deterministic; keeps the `^<prefix>-[0-9a-f]{8}$` shape.\n\n**API: cli/output**\n\n- `mutationResult(id string, fields map[string]any) map[string]any`\nInjects a top-level `id` into a command's result map.\n\n- `mutationResultIDs(ids []string, fields map[string]any) map[string]any`\nInjects top-level `id` (first) + `ids` for multi-id mutations like `consolidate`.\n\n## File Changes\n\n- **`auto-reflect/internal/idhash/idhash.go`** (add)\nContent-hash id helper (F7).\n\n- **`auto-reflect/internal/idhash/idhash_test.go`** (add)\nDeterminism + format tests (F7).\n\n- **`auto-reflect/internal/cli/gap.go`** (add)\n`gap list` command (F4).\n\n- **`auto-reflect/internal/cli/gap_integration_test.go`** (add)\ngap list integration tests (F4).\n\n- **`auto-reflect/internal/cli/doctor.go`** (add)\n`doctor` command (F1).\n\n- **`auto-reflect/internal/cli/doctor_integration_test.go`** (add)\ndoctor integration tests (F1).\n\n- **`auto-reflect/internal/cli/output.go`** (add)\nUniform mutation-result envelope helpers (F5).\n\n- **`auto-reflect/internal/cli/root.go`** (edit)\nRegister `gap` + `doctor` commands.\n\n- **`auto-reflect/internal/rules/model.go`** (edit)\n`NewRuleID(parts…)` content-derived via idhash (F7).\n\n> **Review thread** on `auto-reflect/internal/rules/model.go` — Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id (p1, resolved)\n\n> *review:* There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan.\n\n> *author:* Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2.\n\n- **`auto-reflect/internal/observations/model.go`** (edit)\n`NewObservationID(parts…)` content-derived incl. evidence (F7).\n\n- **`auto-reflect/internal/observations/model_test.go`** (edit)\nUpdate zero-arg id test for the variadic signature (F7).\n\n- **`auto-reflect/internal/loop/service_test.go`** (edit)\nUpdate zero-arg `NewRuleID` call for the variadic signature (F7).\n\n> **Review thread** on `auto-reflect/internal/observations/model.go` — Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set (p3, resolved)\n\n> *review:* Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered.\n\n> *author:* Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately.\n\n- **`auto-reflect/internal/cli/consolidate.go`** (edit)\nFeed content to id mint; top-level `ids`; deterministic dry-run id (F5/F7).\n\n- **`auto-reflect/internal/cli/observation.go`** (edit)\nTop-level `id` on add; per-element `id` on list (F5).\n\n- **`auto-reflect/internal/cli/rule.go`** (edit)\nTop-level `id` on mutations; `created_at`/`updated_at` in list map (F5/F6).\n\n- **`auto-reflect/internal/cli/retrieve.go`** (edit)\nPer-element top-level `id` (F5).\n\n- **`auto-reflect/internal/cli/select.go`** (edit)\nPer-element top-level `id` (F5).\n\n- **`auto-reflect/internal/cli/feedback.go`** (edit)\nTop-level `id`/`ids` on the recorded feedback (F5).\n\n- **`auto-reflect/internal/cli/miner.go`** (edit)\nReplace hand-rolled pending loop with `miner.PendingCount` (F2).\n\n- **`auto-reflect/internal/cli/miner_integration_test.go`** (add)\nPin `miner status` pending == `stats` pending_to_mine (F2).\n\n- **`auto-reflect/internal/cli/init.go`** (edit)\nWrite idempotent `.auto/reflect/.gitignore` (F9).\n\n- **`auto-reflect/internal/cli/init_test.go`** (add)\ninit writes/keeps `.gitignore`; idempotent (F9).\n\n- **`auto-reflect/internal/cli/quickstart.go`** (edit)\nDocs: gap list, doctor, outcome enum, correction_density, id paths (F4/F1/F8/F3/F5).\n\n- **`auto-reflect/internal/loop/feedback.go`** (edit)\nDocstring for the `outcome` enum (F8).\n\n- **`auto-reflect/internal/miner/score.go`** (edit)\nDocstring for `correction_density` (F3).\n\n- **`auto-reflect/internal/rules/projection_test.go`** (edit)\nAssert folded timestamps surface (F6).\n\n- **`auto-reflect/internal/cli/consolidate_integration_test.go`** (edit)\nAssert deterministic ids + new envelope (F5/F7).\n\n- **`auto-reflect/internal/cli/observation_integration_test.go`** (edit)\nAssert new envelope + content ids (F5/F7).\n\n- **`auto-reflect/cmd/autoreflect/e2e_loop_test.go`** (edit)\nExtend the loop through `gap list`; new envelope paths (F4/F5).\n\n- **`auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go`** (edit)\nUpdate output-shape assertions (F5).\n\n- **`auto-reflect/CLAUDE.md`** (edit)\nAutodoc index: new `gap`/`doctor` commands.\n\n- **`.claude/skills/reflect-playbook/SKILL.md`** (edit)\nId-threading invariant, gap list, health check (F4/F5).\n\n- **`.claude/skills/reflect-playbook/references/retrieve.md`** (edit)\njq id paths, gap list, outcome enum (F5/F4/F8).\n\n- **`.claude/skills/reflect-playbook/references/observe.md`** (edit)\nClarify observation `--kind gap` vs feedback gap (F4).\n\n- **`.claude/skills/reflect-playbook/references/mine.md`** (edit)\nDocument correction_density (F3).\n\n- **`.claude/skills/reflect-playbook/references/consolidate.md`** (edit)\nId-threading examples to new envelope (F5).\n\n- **`docs/reflection/observations.yaml`** (delete)\nLegacy superseded-process artifact (F11).\n\n## Rejected Alternatives\n\n- **F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n  `gap list` matches the gap→observation mental model and is discoverable.\n- **F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\n  more consumers, and fights the repo's \"list returns a plain payload of all\n  items\" convention. Top-level id on mutations + per-element id on reads solves\n  the threading pain with the least breakage.\n- **F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n  (D-3): leaves the inconsistent nesting in place; we still normalize the shapes.\n- **F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\n  and event ids are distinct-in-time records; hashing would collapse them.\n- **F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\n  collision is negligible; a suffix breaks the idempotency property and adds a\n  state read at mint.\n- **F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\n  per-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.\n- **F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\n  the conventional health command across auto-* tools.\n- **F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\n  only gap is the list view dropping them.\n\n## Decisions\n\n### D-7 — F5 final shape: top-level id on mutations, per-element id on reads\n\n`accepted` · by **charlie** — *Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.*\n\n**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array.\n\n### D-8 — Content-derived ids: rules + observations only\n\n`accepted` · by **charlie** — *r-/ob- become content hashes; rt-/fb-/ev- stay random.*\n\n**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids.\n\n### D-9 — Pure content hash, no collision suffix\n\n`accepted` · by **charlie** — *id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.*\n\n**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks).\n"},{"name":"Plan","md":"\n## Summary\n\nStand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits.\n\n## Execution Sequence\n\n*Diagram: Phase dependency DAG*\n\n```\nflowchart LR\n  P1[P1 Foundations + skeleton] --> P2[P2 Rule content ids]\n  P1 --> P3[P3 Envelope rollout + timestamps]\n  P1 --> P4[P4 Pending count]\n  P1 --> P5[P5 gap list]\n  P5 --> P6[P6 doctor]\n  P2 --> P7[P7 Docs, init, cleanup, e2e]\n  P3 --> P7\n  P4 --> P7\n  P6 --> P7\n```\n\n## Phases\n\n### Phase 1 — Foundations + walking skeleton\n\nStatus: done\n\nThin path through every layer the task touches: id minting → command → output\n→ test.\n\n1. Add `internal/idhash/idhash.go`: `Derive(prefix string, parts ...string)\n   string` = `prefix + first 8 hex of sha256(strings.Join(parts,\"\\n\"))`.\n   **Verify:** `idhash_test.go` — same parts → same id; format `^p-[0-9a-f]{8}$`;\n   different parts → different id.\n2. Add `cli/output.go`: `mutationResult(id, fields)` and\n   `mutationResultIDs(ids, fields)` injecting top-level `id`/`ids`.\n   **Verify:** unit/compile.\n3. `observations/model.go`: `NewObservationID` takes canonical parts\n   (`kind,subject,evidence…,domain,severity`) and calls `idhash.Derive(\"ob\",…)`.\n   Update the existing zero-arg `TestNewObservationIDFormat`\n   (`observations/model_test.go`) for the new signature.\n   **Verify:** `go test ./internal/observations/...`.\n4. `observation.go`: `observation add` returns top-level `.id`\n   (via `mutationResult`); `observation list` elements carry top-level `id`.\n   **Verify:** `observation_integration_test.go` — `add` exposes `.id` matching\n   `^ob-[0-9a-f]{8}$`; re-adding identical observation is idempotent (same id);\n   `list | jq '.observations[].id'` non-empty.\n5. **Phase verify:** `go build ./...`; `go test ./internal/observations/...\n   ./internal/cli/... -run 'Observation|Idhash'`; `golangci-lint run`.\n6. **Commit:** `feat(052): content-hash ids + output envelope (skeleton on observation)`.\n\n### Phase 2 — Rule content ids + consolidate determinism\n\nStatus: done · depends on 1\n\n1. `rules/model.go`: `NewRuleID` takes canonical parts\n   (`domain,use_when,content,rule_type`) → `idhash.Derive(\"r\",…)`.\n   **Verify:** `go test ./internal/rules/...`.\n2. Feed content to **every** `NewRuleID` caller — the signature is variadic, so a\n   missed zero-arg call still compiles but mints a constant id: `consolidate.go`\n   `createDraft`/`split`, **and `rule.go` `rule create`** (the third caller).\n   Emit top-level `ids` from `consolidate` via `mutationResultIDs`; dry-run and\n   apply now mint the same id from the same content. Update `loop/service_test.go`\n   (calls `NewRuleID` zero-arg today) for the new signature.\n   **Verify (the F7 acceptance):** `consolidate_integration_test.go` — run\n   `--dry-run` then apply on one delta in separate command calls; assert\n   `ids[0]` identical; assert a second apply is a no-op (no duplicate rule in\n   the refold); plus a `rule create` smoke check that two distinct creates get\n   distinct ids.\n3. **Phase verify:** `go build ./...`; `go test ./internal/rules/...\n   ./internal/loop/... ./internal/cli/... -run 'Rule|Consolidate|Service'`;\n   `golangci-lint run`.\n4. **Commit:** `feat(052): deterministic content-derived rule ids (F7)`.\n\n### Phase 3 — Envelope rollout + rule timestamps\n\nStatus: done · depends on 1,2\n\n1. `rule.go`: `create/edit/promote/retire/graduate` return top-level `.id`\n   (fixes the `null`); `rule list` projection map gains `created_at`/`updated_at`\n   (F6 — values already on the folded `Rule`).\n   **Verify:** `rule get`/`list | jq '.rules[].created_at'` non-empty.\n2. `retrieve.go`, `select.go`: each array element gains a top-level `id`\n   (aliasing `retrieval_id`/`feedback_id`, which stay).\n   **Verify:** `retrieve|select | jq '.[].id'` non-empty.\n3. `feedback.go`: recorded result echoes `ids` (the feedback ids acted on).\n4. `projection_test.go`: assert `Fold` surfaces `created_at`/`updated_at` and\n   `rule list` carries them.\n   **Verify (F6).**\n5. **Phase verify:** `go build ./...`; `go test ./internal/...\n   -run 'Rule|Retrieve|Select|Feedback|Projection'`; `golangci-lint run`.\n6. **Commit:** `feat(052): uniform id access on commands + rule timestamps (F5,F6)`.\n\n### Phase 4 — Single-source pending count\n\nStatus: done · depends on 1\n\n1. **First reproduce** the divergence: a test that drives `miner status` and\n   `stats` on a fixture and asserts they currently differ (pin the bug before\n   fixing — Verification risk note).\n2. `miner.go`: delete the hand-rolled pending loop (~L280); call\n   `miner.PendingCount(repoRoot, etlRoot)` — the same function `stats` uses.\n   Preserve the 023 null-vs-zero coverage contract in the status output.\n3. **Verify (F2):** `miner_integration_test.go` — `miner status` `pending` ==\n   `stats` `pending_to_mine` on the same fixture.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... ./internal/miner/...\n   -run 'Miner|Stats|Pending'`; `golangci-lint run`.\n5. **Commit:** `fix(052): one pending-count source for miner status + stats (F2)`.\n\n### Phase 5 — gap list command\n\nStatus: done · depends on 1\n\n1. Add `cli/gap.go` `newGapCmd` → `gap list`: read `feedback` events\n   (`events.ReadAll`), decode `FeedbackPayload`, skip when `Gap == nil`, project\n   `{id (feedback event id, ev-…), session_id, ts, report, moment}` as an array with\n   per-element `id`. Flags `--since/--after/--before`, `--domain`,\n   `--format json|text`; return all when unfiltered (one filter mode at a time).\n2. Register `gap` in `root.go`.\n3. **Verify (F4):** `gap_integration_test.go` — events with gaps surface\n   (report+moment+source); gapless feedback omitted; `--since` filters; empty\n   state returns `[]`; text mode works.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Gap'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect gap list — readable feedback gaps (F4)`.\n\n### Phase 6 — doctor command\n\nStatus: done · depends on 5\n\n1. Add `cli/doctor.go` mirroring `auto-graph/internal/cli/doctor.go`:\n   `[]{check,status(pass|warn|fail),message,hint}` JSON, exit non-zero on any\n   `fail`. Checks: state dir present; `events/` present & decodable; snapshot\n   fresh vs folded log (stale ⇒ warn + `run auto reflect rebuild`); legacy\n   0-byte `feedback.jsonl` flagged. Preserve null-vs-zero coverage.\n2. Register `doctor` in `root.go` (after P5's gap registration — serialized to\n   avoid a root.go conflict).\n3. **Verify (F1):** `doctor_integration_test.go` — healthy state all `pass`\n   exit 0; missing `events/` ⇒ `fail` + hint + exit 1; stale snapshot ⇒ `warn`.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Doctor'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect doctor — state health checks (F1)`.\n\n### Phase 7 — Docs, init gitignore, cleanup, e2e\n\nStatus: done · depends on 2,3,4,6\n\n1. `init.go`: after `MkdirAll(eventsDir)`, write `.auto/reflect/.gitignore`\n   (`playbook.json\\n`) only if absent (auto-doc stat-then-skip pattern).\n   **Verify (F9):** `init_test.go` — file created with `playbook.json`; second\n   init doesn't overwrite/duplicate; `events/` not ignored.\n2. Repo hygiene: `git rm --cached .auto/reflect/playbook.json`; commit the new\n   `.auto/reflect/.gitignore` and the existing `events/` log (D-2).\n3. Docstrings: `loop/feedback.go` (outcome enum), `miner/score.go`\n   (correction_density). (F8/F3)\n4. Delete `docs/reflection/observations.yaml`. The only live referencers are the\n   already-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\n   reads it); per F11 no migration — confirm the trio is retired. (F11)\n5. Docs: `quickstart.go` + skill refs (`SKILL.md`, `retrieve.md`, `observe.md`,\n   `mine.md`, `consolidate.md`) — new `jq` id paths, `gap list`, `doctor`,\n   outcome enum, correction_density, observation-`kind gap` vs feedback-gap.\n   `CLAUDE.md` autodoc index (run `auto doc fix`).\n6. Extend `e2e_loop_test.go` through `gap list`; update `e2e_lifecycle_test.go`\n   output-shape assertions to the new envelope.\n   **Verify (F4/F5/AC-14):** full loop mine→…→feedback→gap list passes.\n7. **Phase verify:** `go build ./...`; **full** `go test ./...`;\n   `golangci-lint run`; `auto reflect quickstart` happy path by hand.\n8. **Commit:** `docs(052): gap/doctor/enum docs, init gitignore, drop legacy yaml (F8,F3,F9,F11)`.\n\n## Success Criteria\n\n- **P1** → AC-4, AC-5 (observation), AC-7\n- **P2** → AC-6, AC-7\n- **P3** → AC-4, AC-5, AC-11\n- **P4** → AC-3\n- **P5** → AC-1, AC-2\n- **P6** → AC-10\n- **P7** → AC-8, AC-9, AC-12, AC-13, and AC-14 (full-suite + e2e green)\n\nAll 14 acceptance criteria pass; `go build ./...` and `go test ./...` clean;\n`golangci-lint` clean; the end-to-end reflect loop completes through `gap list`.\n\n<\/html>\n"}],"sections":[],"city":[[".auto/doc/.gitignore",3],[".auto/doc/settings.json",15],[".auto/env/.gitignore",1],[".auto/env/config.json",4],[".auto/env/files/start.sh",4],[".auto/reflect/feedback.jsonl",0],[".auto/reflect/playbook.json",45],[".auto/skill/settings.json",3],[".auto/skills/lock.json",467],[".auto/skills/manifest.json",412],[".auto/skills/skills.yaml",91],[".auto/watch/.gitignore",1],[".auto/watch/project.json",18],[".beads/.gitignore",40],[".be function makeScaffoldGeo(h){ // unit footprint, height h: posts, floor rings, cross-bracing

  const im = new THREE.InstancedMesh(bGeo, new THREE.MeshStandardMaterial({roughness:.78, metalness:.08}), ctx.length);

    const top = p.split('/')[0]; c.set('#5d6878').lerp(dTint.get(top) || c, .5).multiplyScalar(.95 + Math.min(h,8)*.04); im.setColorAt(i, c); W.instPaths.push(p); });
  im.castShadow = im.receiveShadow = true; root.add(im); W.inst = im;
  // changed buildings
  for (const f of m.files.values()){
    const lot = L.lots.get(f.path); if (!lot) continue;
    const hB = f.before != null ? hOf(f.before) : 0, hA = f.after != null ? hOf(f.after) : 0;
    const mat = new THREE.MeshStandardMaterial({color:'#6b7584', roughness:.55, metalness:.1, emissive:'#000', transparent:true, opacity:1});
    const mesh = new THREE.Mesh(bGeo, mat); mesh.position.set(lot.x, 0, lot.z); mesh.castShadow = mesh.receiveShadow = true; mesh.userData.path = f.path;
    root.add(mesh);
    const o = { f, lot, hB, hA, mesh, mat, cur:{h:f.change==='add'?0:hB} };
    if (f.change === 'add'){
      o.scaffold = new THREE.LineSegments(makeScaffoldGeo(hA + .25), new THREE.LineBasicMaterial({color:COL.new, transparent:true, opacity:.95}));
      o.scaffold.scale.set(lot.fp*1.12, 1, lot.fp*1.12); o.scaffold.position.set(lot.x, 0, lot.z); root.add(o.scaffold);
      o.stake = rectLine(lot.x - lot.fp/2, lot.z - lot.fp/2, lot.fp, lot.fp, .2, COL.stake, true); root.add(o.stake);
    }
    if (f.change === 'delete'){
      o.rubble = new THREE.Mesh(bGeo, new THREE.MeshStandardMaterial({color:'#5a2622', roughness:1})); o.rubble.scale.set(lot.fp*1.2, .12, lot.fp*1.2); o.rubble.position.set(lot.x, 0, lot.z); root.add(o.rubble);
      o.outline = rectLine(lot.x - lot.fp*.7, lot.z - lot.fp*.7, lot.fp*1.4, lot.fp*1.4, .15, COL.demo, true); root.add(o.outline);
      const n = 260, pos = new Float32Array(n*3), vel = []; for (let i=0;i<n;i++){ vel.push([(Math.random()-.5)*.08, Math.random()*.06, (Math.random()-.5)*.08]); }
      const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(pos,3));
      o.dust = new THREE.Points(dg, new THREE.PointsMaterial({color:'#c9a48a', size:.28, transparent:true, opacity:0, depthWrite:false})); o.dust.userData.vel = vel; root.add(o.dust);
    }
    // work light for renovation (brownfield signature)
    if (f.change !== 'add'){
      o.lamp = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), new THREE.MeshBasicMaterial({color:CH[f.change].c, transparent:true, opacity:0})); root.add(o.lamp);
      const bg = new THREE.CylinderGeometry(lot.fp*.18, lot.fp*.42, 26, 12, 1, true); bg.translate(0, 13, 0);
      o.beam = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({color:CH[f.change].c, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
      o.beam.position.set(lot.x, 0, lot.z); root.add(o.beam);
    }
    // floating label
    const el = document.createElement('div'); el.className = 'flabel'; el.style.setProperty('--c', CH[f.change].c); el.textContent = f.path.split('/').pop();
    o.label = new CSS2DObject(el); o.label.visible = false; root.add(o.label);
    W.changed.set(f.path, o);
  }
  // district labels
  for (const d of L.districts){
    if (d.count < 25 && !newDirs.has(d.path) && ![...m.files.keys()].some(p=>p.startsWith(d.path+'/'))) continue;
    const el = document.createElement('div');
    const isNew = newDirs.has(d.path), hot = [...m.files.keys()].some(p=>p.startsWith(d.path+'/'));
    el.className = 'dlabel' + (isNew ? ' newd' : hot ? ' hot' : '');
    el.innerHTML = isNew ? `${esc(d.name)}<small>RESERVED LOT · NEW DISTRICT</small>` : esc(d.name);
    const lab = new CSS2DObject(el); lab.position.set(d.x + d.w/2, isNew ? 1.2 : .3, d.y + d.h + .2); root.add(lab); W.labels.push(lab);
  }
  // greenfield signature: a tower crane over the new district
  if (m.green){
    const nd = L.districts.find(d=>newDirs.has(d.path));
    if (nd){ W.crane = buildCrane(Math.max(8, Math.max(...[...W.changed.values()].filter(o=>o.f.path.startsWith(nd.path+'/')).map(o=>o.hA)) + 3));
      W.crane.position.set(nd.x + nd.w*.15, 0, nd.y + nd.h*.85); root.add(W.crane); W.craneDistrict = nd; }
  }
  return W;
}

/* =========================================================
   4. PHASE STATE — what every changed building looks like at step s
   step 0 = plan day, 1..N = phases, N+1 = handover (as built)
   ========================================================= */
let S = { plan:'062', step:0, playing:false, t0:0 };
function stateOf(f, s, N){
  if (s === 0) return f.change === 'add' ? 'staked' : 'standing';
  if (s > N) return f.change === 'add' ? 'built' : f.change === 'edit' ? 'renovated' : 'gone';
  const active = f.phases.includes(s);
  if (f.change === 'add'){ if (s < f.first) return 'staked'; if (s === f.first) return 'constructing'; return active ? 'built-active' : 'built'; }
  if (f.change === 'edit'){ if (s < f.first) return 'standing'; return active ? 'renovating' : 'renovated'; }
  if (s < f.first) return 'doomed'; if (s === f.first) return 'demolishing'; return 'gone';
}
function applyStep(animate){
  const m = MODELS[S.plan], W = world, N = m.N, s = S.step, now = performance.now();
  if (has3D){
    for (const o of W.changed.values()){
      const st = stateOf(o.f, s, N); const prev = o.state; o.state = st;
      let targetH = o.cur.h;
      if (st==='staked') targetH = 0; else if (st==='standing'||st==='doomed') targetH = o.hB;
      else if (['constructing','built','built-active','renovating','renovated'].includes(st)) targetH = o.hA;
      else if (st==='demolishing'||st==='gone') targetH = .001;
      o.anim = { from:o.cur.h, to:targetH, t0:now, dur: animate ? (st==='constructing' ? 2600 : st==='demolishing' ? 1800 : 1100) : 0, delay: animate ? Math.random()*500 : 0 };
      if (st==='demolishing' && animate && prev !== 'demolishing') o.dustT0 = now + 250;
      if (o.scaffold) o.scaffold.visible = st==='constructing';
      if (o.stake) o.stake.visible = st==='staked';
      if (o.rubble){ o.rubble.visible = st==='gone'; o.outline.visible = st==='gone' || st==='demolishing'; }
      const col = { staked:'#000', standing:'#6b7584', doomed:'#7a5e5e', constructing:COL.built, built:COL.built, 'built-active':COL.built, renovating:'#7fe9dd', renovated:'#5f9f9a', demolishing:COL.demo, gone:'#000' }[st];
      o.mat.color.set(col);
      o.mat.opacity = st==='constructing' ? .72 : 1;
      o.mat.emissive.set(st==='constructing'||st==='built-active' ? COL.new : st==='renovating' ? COL.reno : st==='demolishing' ? COL.demo : st==='renovated' ? '#0f3d39' : st==='built' ? '#3a2208' : '#000');
      o.pulse = ['constructing','built-active','renovating','demolishing'].includes(st);
      o.mesh.visible = st !== 'staked' && !(st==='gone' && !animate);
      o.label.visible = o.pulse && m.phases[s-1] && m.phases[s-1].files.length <= 8;
      o.label.position.set(o.lot.x, targetH + .5, o.lot.z);
      if (o.lamp){ o.lamp.position.set(o.lot.x, o.hA + .7, o.lot.z); }
    }
    for (const np of W.newPlates){ const on = s >= np.first; np.mesh.visible = on; np.survey.visible = !on || s===np.first; }
    if (W.crane) W.crane.visible = s >= 1 && s <= N;
    for (const l of W.labels) if (l.element.classList.contains('newd')) { l.element.querySelector('small').textContent = s===0 ? 'RESERVED LOT · NEW DISTRICT' : s<=N ? 'UNDER CONSTRUCTION' : 'NEW DISTRICT · AS BUILT'; }
  }
  renderTimeline(); renderPhaseCap();
  if (document.body.classList.contains('mode2d')) draw2D();
  if (panelStack.length && panelStack[panelStack.length-1].kind==='phase') showPanel(panelStack[panelStack.length-1], true);
}
function setStep(s, animate=true){ const m = MODELS[S.plan]; S.step = Math.max(0, Math.min(m.N+1, s)); applyStep(animate); }

/* =========================================================
   5. TIMELINE — phase ticks with a dependency arc diagram
   ========================================================= */
function renderTimeline(){
  const m = MODELS[S.plan], svg = $('#tsvg'), W = $('#track').clientWidth, H = $('#track').clientHeight;
  const N = m.N, x0 = 54, x1 = W - 30, base = H - 26;
  const X = i => x0 + (x1-x0) * i/(N+1);
  const acc = m.green ? COL.new : COL.reno;
  let h = '';
  // rail
  h += `<line x1="${X(0)}" y1="${base}" x2="${X(N+1)}" y2="${base}" stroke="#2a3441" stroke-width="2"/>`;
  h += `<line x1="${X(0)}" y1="${base}" x2="${X(S.step)}" y2="${base}" stroke="${acc}" stroke-width="3"/>`;
  // dependency arcs
  for (const ph of m.phases) for (const d of ph.deps){
    const a = X(d), b = X(ph.n), r = (b-a)/2, lit = S.step >= ph.n;
    h += `<path d="M${a} ${base-9} A ${r} ${Math.min(r*.62, base-18)} 0 0 1 ${b} ${base-9}" fill="none" stroke="${lit?acc:'#3a4656'}" stroke-width="${lit?1.6:1.2}" opacity="${lit?.95:.8}"/>`;
  }
  // ticks
  for (let i=0;i<=N+1;i++){
    const x = X(i), on = i === S.step, done = i < S.step;
    const lab = i===0 ? 'PLAN DAY' : i===N+1 ? 'AS BUILT' : 'P'+i;
    const r = i===0||i===N+1 ? 6 : 9;
    h += `<g class="tk" data-s="${i}" style="cursor:pointer">
      <rect x="${x-24}" y="${base-26}" width="48" height="48" fill="transparent"/>
      <circle cx="${x}" cy="${base}" r="${on ? r+3 : r}" fill="${on ? acc : done ? '#1b2430' : '#0c1117'}" stroke="${on||done ? acc : '#4c5663'}" stroke-width="2"/>
      ${i>0&&i<=N ? `<text x="${x}" y="${base+4}" text-anchor="middle" font-family="Big Shoulders Display" font-weight="900" font-size="12" fill="${on?'#0a0d12':done?acc:'#b9b3a6'}">${i}</text>` : ''}
      <text x="${x}" y="${base+24}" text-anchor="middle" font-family="Big Shoulders Display" font-weight="700" letter-spacing="1.5" font-size="11" fill="${on?'#ece5d6':'#7d8795'}">${i===0||i===N+1?lab:''}</text></g>`;
  }
  // per-phase file sparkline (how much gets built per phase) under arcs
  const maxF = Math.max(...m.phases.map(p=>p.files.length));
  for (const ph of m.phases){
    const cnt = {add:0, edit:0, delete:0}; for (const p of ph.files){ const f = m.files.get(p); cnt[f.first===ph.n ? f.change : 'edit']++; }
    const x = X(ph.n) + 14; let y = base - 4;
    for (const k of ['add','edit','delete']) if (cnt[k]){ const hh = 22*cnt[k]/maxF; h += `<rect x="${x}" y="${y-hh}" width="5" height="${hh}" fill="${CH[k].c}" opacity=".85"/>`; y -= hh; }
  }
  h += `<text class="depcap" x="${(X(0)+X(N+1))/2}" y="${base+24}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#7d8795">${m.phases.every(p=>p.deps.length<=1 && (p.deps[0]??p.n-1)===p.n-1) ? 'DEPENDENCIES: A STRICT CHAIN — each phase waits on the one before' : 'DEPENDENCIES: A DAG — each arc joins a phase to one it waits on'}</text>`;
  h += `<foreignObject x="0" y="${base-17}" width="36" height="36"><button xmlns="http://www.w3.org/1999/xhtml" id="play" title="Play phases">${S.playing ? '<svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" fill="#ece5d6"/><rect x="8.5" y="1" width="3.5" height="12" fill="#ece5d6"/></svg>' : '<svg viewBox="0 0 14 14"><path d="M3 1 L13 7 L3 13Z" fill="#ece5d6"/></svg>'}</button></foreignObject>`;
  svg.innerHTML = h;
  svg.querySelectorAll('.tk').forEach(g => g.onclick = () => { stopTour(); stopPlay(); setStep(+g.dataset.s); openPhaseCard(+g.dataset.s); });
  $('#play').onclick = () => S.playing ? stopPlay() : startPlay();
}
function renderPhaseCap(){
  const m = MODELS[S.plan], s = S.step, N = m.N, acc = m.green ? COL.new : COL.reno;
  document.documentElement.style.setProperty('--acc', acc);
  let pn, pt, pm;
  if (s === 0){ pn = '0'; pt = `Plan day — the repo as it stood when the plan was written`; pm = `commit ${m.P.base.slice(0,7)} · ${m.P.baseDate} · ${m.base.size.toLocaleString()} files (.agents/ mirror omitted) · building height ∝ √lines`; }
  else if (s > N){ pn = '✓'; pt = `Handover — as built`; pm = `plan status “${m.P.doc.status}” · heights from merge commit ${m.P.asBuilt} (${m.P.mergeDate}) · ${m.P.mergeSubject}`; }
  else { const ph = m.phases[s-1]; pn = 'P'+s; pt = ph.title; pm = `${ph.files.length} files · status ${ph.status}${ph.deps.length ? ' · depends on P'+ph.deps.join(', P') : ' · no dependencies'} · ACs signed here: ${m.P.acs.filter(a=>a.phaseList.includes(s)).map(a=>a.id).join(' ')}`; }
  $('#phasecap').innerHTML = `<div class="pn">${pn}</div><div><div class="pt">${esc(pt)}</div><div class="pm">${esc(pm)}</div></div>${s>=1&&s<=N ? '<button class="tbtn more" id="phmore">Phase card →</button>' : ''}`;
  $('#phmore') && ($('#phmore').onclick = () => openPhaseCard(s));
}
let playTimer = null;
function startPlay(){ stopTour(); S.playing = true; if (S.step > MODELS[S.plan].N) setStep(0, false); const tick = () => { const m = MODELS[S.plan]; if (S.step > m.N){ stopPlay(); return; } setStep(S.step+1); playTimer = setTimeout(tick, 3400); }; tick(); }
function stopPlay(){ S.playing = false; clearTimeout(playTimer); renderTimeline(); }

/* =========================================================
   6. PANEL — site brief, building inspector, cross-linked cards
   ========================================================= */
let panelStack = [];
function pushPanel(v){ panelStack.push(v); showPanel(v); }
function resetPanel(){ panelStack = []; showPanel({kind:'brief'}); }
$('#back').onclick = () => { panelStack.pop(); showPanel(panelStack[panelStack.length-1] || {kind:'brief'}); };
function refChips(text){
  const m = MODELS[S.plan]; const ids = [...new Set((text||'').match(/\b(AC-\d+|D-062-\d+|D-\d+|G\d+|F\d+)\b/g) || [])];
  if (!ids.length) return '';
  return `<div class="chips" style="margin-top:8px">${ids.map(id => {
    if (m.acById.has(id) || m.decById.has(id) || m.railById.has(id)) return `<button class="chip" data-ref="${id}">${id}</button>`;
    return `<span class="chip dead" title="${id} is defined in epic 005, not in this plan — see the dossier's Requirements tab for the plan's own summary of it">${id} ↗ epic</span>`;
  }).join('')}</div>`;
}
function wire(root){

  root.querySelectorAll('[data-file]').forEach(b => b.onclick = () => openFile(b.dataset.file, true));

  root.querySelectorAll('[data-thread]').forEach(b => b.onclick = () => pushPanel({kind:'thread', i:+b.dataset.thread}));

function openRef(id){ const m = MODELS[S.plan];
  if (m.acById.has(id)) pushPanel({kind:'ac', id}); else if (m.decById.has(id)) pushPanel({kind:'dec', id}); else if (m.railById.has(id)) pushPanel({kind:'rail', id}); }
function openFile(path, fly){ const m = MODELS[S.plan];
  pushPanel({kind:'file', path}); highlight(path); if (fly) focusPaths([path], 24); if (document.body.classList.contains('mode2d')) draw2D(); }
function openPhaseCard(s){ const m = MODELS[S.plan]; if (s<1||s>m.N) { resetPanel(); return; }
  const top = panelStack[panelStack.length-1]; if (top && top.kind==='phase') { panelStack[panelStack.length-1] = {kind:'phase', n:s}; showPanel(panelStack[panelStack.length-1]); } else pushPanel({kind:'phase', n:s}); }
function threadBlock(th){ const m = MODELS[S.plan]; const i = m.P.threads.indexOf(th);
  return `<div class="thread"><div class="ttl">${mdi(th.title)}</div><div class="meta">review thread · on ${esc(th.anchor)} · ${esc(th.priority)} · ${esc(th.status)}</div>

function fileRow(f){ return `<button class="row" data-file="${esc(f.path)}"><span class="fdot" style="--c:${CH[f.change].c}"></span><span style="font-family:var(--mono);font-size:12px">${esc(f.path)}</span><span class="tag">P${f.phases.join(',')}</span></button>`; }
