/* =========================================================
   7. INTERACTION — hover, click, focus, fly-through
   ========================================================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hoverPath = null, selPath = null, selRing = null;
function pick(ev){
  const r = renderer.domElement.getBoundingClientRect(); mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera);
  const objs = [world.inst, ...[...world.changed.values()].filter(o=>o.mesh.visible).map(o=>o.mesh)];
  const hit = ray.intersectObjects(objs, false)[0]; if (!hit) return null;
  if (hit.object === world.inst) return world.instPaths[hit.instanceId];
  return hit.object.userData.path;
}
function describe(path){ const m = MODELS[S.plan], f = m.files.get(path);
  if (!f) return {p:path, m:`${m.base.get(path)} lines · untouched`};
  return {p:path, m:`${CH[f.change].label} · P${f.phases.join(',')} · ${f.before??'—'} → ${f.after??'—'} lines`, c:CH[f.change].c}; }
function showTip(ev, path){ const tip = $('#tip'); if (!path){ tip.style.display='none'; return; }
  const d = describe(path); tip.innerHTML = `<div class="p" style="${d.c?'color:'+d.c:''}">${esc(d.p)}</div><div class="m">${esc(d.m)}</div>`;
  tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 430) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
function highlight(path){
  selPath = path; if (!has3D) return;
  if (selRing){ world.root.remove(selRing); selRing = null; }
  const lot = world.L.lots.get(path); if (!lot) return;
  selRing = new THREE.Mesh(new THREE.RingGeometry(lot.fp*.9, lot.fp*1.15, 40), new THREE.MeshBasicMaterial({color:'#ffffff', side:THREE.DoubleSide, transparent:true, opacity:.9}));
  selRing.rotation.x = -Math.PI/2; selRing.position.set(lot.x, .25, lot.z); world.root.add(selRing);
}
if (has3D){
  let down = null;
  renderer.domElement.addEventListener('pointermove', ev => { if (tour.on) return; const p = pick(ev); hoverPath = p; showTip(ev, p); renderer.domElement.style.cursor = p ? 'pointer' : 'grab'; });
  renderer.domElement.addEventListener('pointerleave', () => showTip(null, null));
  renderer.domElement.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; if (tour.on) stopTour(); cam.fly = null; });
  renderer.domElement.addEventListener('pointerup', ev => { if (!down || Math.hypot(ev.clientX-down[0], ev.clientY-down[1]) > 5) return; const p = pick(ev); if (p){ panelStack = []; pushPanel({kind:'file', path:p}); highlight(p); } });
}

// camera flights
const cam = { fly:null };
function flyTo(pos, target, dur=2200){ if (!has3D) return; cam.fly = { p0:camera.position.clone(), t0v:controls.target.clone(), p1:pos, t1:target, s:performance.now(), dur }; }
function focusPaths(paths, minDist=18, az=null, el=.62){
  if (!has3D) return; const L = world.L; const b = new THREE.Box3();
  for (const p of paths){ const l = L.lots.get(p); if (l) b.expandByPoint(new THREE.Vector3(l.x, 0, l.z)); }
  if (b.isEmpty()) return; const c = b.getCenter(new THREE.Vector3()); const size = b.getSize(new THREE.Vector3());
  const d = Math.max(minDist, Math.max(size.x, size.z) * 1.35 + 8);
  const cur = camera.position.clone().sub(controls.target); const a = az ?? Math.atan2(cur.x, cur.z);
  flyTo(new THREE.Vector3(c.x + Math.sin(a)*Math.cos(el)*d, Math.sin(el)*d, c.z + Math.cos(a)*Math.cos(el)*d), c.clone().setY(1));
}
function overview(){ const m = MODELS[S.plan]; const side = world.L.side;
  const c = new THREE.Vector3(); for (const p of m.files.keys()){ const l = world.L.lots.get(p); c.x += l.x; c.z += l.z; } c.divideScalar(m.files.size);
  const d = side * .66, el = .68, az = .62;
  return { pos:new THREE.Vector3(c.x + Math.sin(az)*Math.cos(el)*d, Math.sin(el)*d, c.z + Math.cos(az)*Math.cos(el)*d), target:c }; }
// fly-through tour: aerial → site → each phase → handover
const tour = { on:false, i:0, timer:null, steps:[] };
function buildTour(){
  const m = MODELS[S.plan], all = [...m.files.keys()];
  const steps = [{ step:0, focus:null, k:`Plan ${m.P.id} · plan day`, t: m.green ? 'A vacant lot on the edge of town' : 'An occupied district, full of tenants', s: m.green ? `The ${m.base.size.toLocaleString()}-file city at ${m.P.base.slice(0,7)}. auto-mail does not exist yet — only surveyor's stakes.` : `The ${m.base.size.toLocaleString()}-file city at ${m.P.base.slice(0,7)}. Every site but ${m.count.add} already has a building on it.` },
    { step:0, focus:all, k:'The site', t: m.green ? `${m.count.add} lots staked, ${m.count.edit} neighbours to touch` : `${m.count.edit} buildings to renovate, ${m.count.add} infill, ${m.count.delete} to demolish`, s:'Orange dashes are lots staked for new construction; everything else is standing stock.' }];
  for (const ph of m.phases) steps.push({ step:ph.n, focus:ph.files, k:`Phase ${ph.n} of ${m.N}${ph.deps.length?' · after P'+ph.deps.join(', P'):''}`, t:ph.title.replace(/`/g,''), s:`${ph.files.length} sites · ACs signed here: ${m.P.acs.filter(a=>a.phaseList.includes(ph.n)).map(a=>a.id).join(', ')}` });
  steps.push({ step:m.N+1, focus:null, k:'Handover', t: m.green ? 'A new district on the skyline' : 'Same skyline, renewed inside', s:`As built at ${m.P.asBuilt} — ${m.P.mergeSubject}` });
  return steps;
}
function startTour(){ stopPlay(); tour.steps = buildTour(); tour.on = true; tour.i = 0; document.body.classList.add('touring'); $('#tourbtn').classList.add('on'); $('#tourbtn').textContent = '■ Stop tour'; runTourStep(); }
function runTourStep(){
  if (!tour.on) return; const st = tour.steps[tour.i]; if (!st){ stopTour(); return; }
  setStep(st.step); const m = MODELS[S.plan];
  if (st.focus) focusPaths(st.focus, 30, .7 + tour.i*.35, .55 + (tour.i%2)*.12); else { const o = overview(); flyTo(o.pos, o.target, 2600); }
  const tc = $('#tourcap'); tc.querySelector('.k').textContent = st.k; tc.querySelector('.t').textContent = st.t; tc.querySelector('.s').textContent = st.s; tc.classList.add('on');
  if (st.step>=1 && st.step<=m.N) openPhaseCard(st.step);
  tour.timer = setTimeout(() => { tour.i++; runTourStep(); }, st.step>=1&&st.step<=m.N ? 5200 : 4600);
}
function stopTour(){ if (!tour.on) return; tour.on = false; document.body.classList.remove('touring'); clearTimeout(tour.timer); $('#tourcap').classList.remove('on'); $('#tourbtn').classList.remove('on'); $('#tourbtn').textContent = '▶ Fly-through'; }
$('#tourbtn').onclick = () => tour.on ? stopTour() : startTour();
addEventListener('keydown', e => { if (e.key==='Escape'){ stopTour(); $('#dossier').classList.remove('on'); }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key==='ArrowRight'){ stopTour(); setStep(S.step+1); } if (e.key==='ArrowLeft'){ stopTour(); setStep(S.step-1); } });

/* =========================================================
   8. 2D SITE MAP — fallback + legend-first reading
   ========================================================= */
const c2 = $('#map2d'), g2 = c2.getContext('2d'); const view2 = { k:1, x:0, y:0 }; let hit2 = [];
function draw2D(){
  const m = MODELS[S.plan], L = m.L, dpr = Math.min(devicePixelRatio, 2); const w = c2.clientWidth, h = c2.clientHeight;
  c2.width = w*dpr; c2.height = h*dpr; g2.setTransform(dpr,0,0,dpr,0,0); g2.clearRect(0,0,w,h);
  const wide = w > 900, rl = wide ? 470 : 8, rt = wide ? 110 : 110, rr = w - 16, rb = h - (wide ? 185 : 150);
  const base = Math.min(rr-rl, rb-rt) / (L.side * 1.02); const k = base * view2.k;
  const ox = (rl+rr)/2 + view2.x, oy = (rt+rb)/2 + view2.y; const X = x => ox + x*k, Y = z => oy + z*k;
  const N = m.N, s = S.step; const newDirs = world.newDirs || new Set(); hit2 = [];
  if (!L.oldDirs){ L.oldDirs = new Set(); for (const q of m.base.keys()){ const parts = q.split('/'); for (let i=1;i<parts.length;i++) L.oldDirs.add(parts.slice(0,i).join('/')); } }
  for (const p of L.plates){ const isNew = !L.oldDirs.has(p.path);
    g2.fillStyle = isNew ? (s>0 ? '#2a1c10' : 'transparent') : ['#141b24','#18212c','#1c2632','#202b38'][Math.min(p.depth-1,3)];
    g2.fillRect(X(p.x), Y(p.y), p.w*k, p.h*k);
    if (isNew){ g2.setLineDash([4,3]); g2.strokeStyle = COL.stake; g2.lineWidth = 1; g2.strokeRect(X(p.x)+.5, Y(p.y)+.5, p.w*k-1, p.h*k-1); g2.setLineDash([]); } }
  for (const [p, lines] of m.base){ if (m.files.has(p)) continue; const l = L.lots.get(p); const hh = hOf(lines);
    const v = Math.round(42 + hh*6); g2.fillStyle = `rgb(${v},${v+6},${v+16})`; const sz = l.fp*k; g2.fillRect(X(l.x)-sz/2, Y(l.z)-sz/2, sz, sz); hit2.push([p, X(l.x), Y(l.z), sz]); }
  const t = performance.now()/1000;
  for (const f of m.files.values()){ const l = L.lots.get(f.path), st = stateOf(f, s, N); const sz = Math.max(l.fp*k, 6); const x = X(l.x)-sz/2, y = Y(l.z)-sz/2;
    if (st==='staked'){ g2.setLineDash([2,2]); g2.strokeStyle = COL.stake; g2.strokeRect(x,y,sz,sz); g2.setLineDash([]); }
    else if (st==='gone'){ g2.strokeStyle = COL.demo; g2.beginPath(); g2.moveTo(x,y); g2.lineTo(x+sz,y+sz); g2.moveTo(x+sz,y); g2.lineTo(x,y+sz); g2.stroke(); }
    else { g2.fillStyle = { standing:'#7d8795', doomed:'#8a5a5a', constructing:COL.new, built:COL.built, 'built-active':COL.new, renovating:COL.reno, renovated:'#3f8c85', demolishing:COL.demo }[st]; g2.fillRect(x,y,sz,sz);
      if (['constructing','built-active','renovating','demolishing'].includes(st)){ g2.strokeStyle = '#fff'; g2.lineWidth = 1.5; g2.strokeRect(x-2,y-2,sz+4,sz+4); g2.lineWidth = 1; } }
    if (f.path === selPath){ g2.strokeStyle = '#fff'; g2.lineWidth = 2; g2.strokeRect(x-4,y-4,sz+8,sz+8); g2.lineWidth = 1; }
    hit2.push([f.path, X(l.x), Y(l.z), sz]); }
  g2.font = '700 12px "Big Shoulders Display"'; g2.textAlign = 'left';
  for (const d of L.districts){ if (d.w*k < 44) continue; const isNew = newDirs.has(d.path); g2.fillStyle = isNew ? COL.new : '#aab3bf'; g2.fillText(d.name.toUpperCase(), X(d.x)+3, Y(d.y)+12); }
}
c2.addEventListener('wheel', e => { e.preventDefault(); const f = Math.exp(-e.deltaY*.0015); view2.k = Math.max(.6, Math.min(12, view2.k*f)); draw2D(); }, {passive:false});
let drag2 = null;
c2.addEventListener('pointerdown', e => drag2 = {x:e.clientX, y:e.clientY, vx:view2.x, vy:view2.y, moved:false});
c2.addEventListener('pointermove', e => { if (drag2){ const dx = e.clientX-drag2.x, dy = e.clientY-drag2.y; if (Math.hypot(dx,dy)>4) drag2.moved = true; view2.x = drag2.vx+dx; view2.y = drag2.vy+dy; if (drag2.moved) draw2D(); return; }
  const r = c2.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top; const h = hit2.findLast(([p,x,y,s]) => Math.abs(mx-x) <= s/2+1 && Math.abs(my-y) <= s/2+1); showTip(e, h?.[0]); });
c2.addEventListener('pointerup', e => { const d = drag2; drag2 = null; if (d && d.moved) return; const r = c2.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  const h = hit2.findLast(([p,x,y,s]) => Math.abs(mx-x) <= s/2+1 && Math.abs(my-y) <= s/2+1); if (h){ panelStack = []; pushPanel({kind:'file', path:h[0]}); selPath = h[0]; draw2D(); } });
c2.addEventListener('pointerleave', () => showTip(null,null));
function setMode(two){ if (!has3D) two = true; document.body.classList.toggle('mode2d', two); $('#v2d').classList.toggle('on', two); $('#v3d').classList.toggle('on', !two); if (two){ stopTour(); draw2D(); } }

let dosTab = 'Requirements';
function openDossier(tab){ const m = MODELS[S.plan]; dosTab = tab || dosTab; $('#dossier').classList.add('on'); $('#dtitle').textContent = m.P.doc.title;
  $('#dtabs').innerHTML = m.P.tabs.map(t=>`<button class="dtab ${t.name===dosTab?'on':''}" data-t="${t.name}">${t.name}</button>`).join(' ');
  $('#dtabs').querySelectorAll('.dtab').forEach(b => b.onclick = () => openDossier(b.dataset.t));
  $('#dprose').innerHTML = `<p style="font-family:var(--mono);font-size:12px;color:var(--muted)">Full plan text, flattened from <code>docs/tasks/${m.P.slug}/plan.html</code>. Diagrams are shown as their mermaid source.</p>` + md(m.P.tabs.find(t=>t.name===dosTab).md); $('#dbody').scrollTop = 0; }
$('#dosbtn').onclick = () => openDossier(); $('#dclose').onclick = () => $('#dossier').classList.remove('on');

function switchPlan(id, first){
  if (!MODELS[id]) id = '062'; stopTour(); stopPlay();
  S.plan = id; document.querySelectorAll('.permit').forEach(b => b.setAttribute('aria-pressed', b.dataset.plan === id));
  if (world && has3D){ world.root.traverse(o => { if (o.isCSS2DObject) o.element.remove(); }); scene.remove(world.root); world.root.traverse(o => { o.geometry?.dispose(); }); }
  if (selRing) selRing = null; selPath = null;
  world = buildWorld(MODELS[id]);
  if (location.hash !== '#'+id) history.replaceState(null, '', '#'+id);
  renderBanner(); resetPanel(); setStep(0, false);
  if (has3D){ const o = overview(); if (first){ camera.position.copy(o.pos).multiplyScalar(1.4); controls.target.copy(o.target); } flyTo(o.pos, o.target, first ? 2400 : 1600); }
  view2.k = 1; view2.x = view2.y = 0;
}
document.querySelectorAll('.permit').forEach(b => b.onclick = () => switchPlan(b.dataset.plan));
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== S.plan && MODELS[h]) switchPlan(h); });

/* =========================================================
   10. LOOP
   ========================================================= */
function resize(){ const w = stage.clientWidth, h = stage.clientHeight;
  if (has3D){ renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w/h; const off = w > 900 ? 150 : 60; camera.setViewOffset(w, h + off, 0, off, w, h); camera.updateProjectionMatrix(); composer.setSize(w, h); bloom.resolution.set(w/2, h/2); }
  renderTimeline(); if (document.body.classList.contains('mode2d')) draw2D(); }
addEventListener('resize', resize);
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
function frame(now){
  requestAnimationFrame(frame);
  if (!has3D || document.body.classList.contains('mode2d') || document.hidden) return;
  const t = now/1000;
  if (cam.fly){ const k = Math.min(1, (now - cam.fly.s)/cam.fly.dur), e = ease(k); camera.position.lerpVectors(cam.fly.p0, cam.fly.p1, e); controls.target.lerpVectors(cam.fly.t0v, cam.fly.t1, e); if (k>=1) cam.fly = null; }
  else if (tour.on){ // slow drift while dwelling
    const off = camera.position.clone().sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0,1,0), .0009); camera.position.copy(controls.target).add(off); }
  controls.update();
  for (const o of world.changed.values()){
    const a = o.anim; if (a){ const k = a.dur ? Math.max(0, Math.min(1, (now - a.t0 - a.delay)/a.dur)) : 1; o.cur.h = a.from + (a.to - a.from) * (o.state==='constructing' ? k : ease(k)); if (k>=1 && o.state==='gone') o.mesh.visible = false; }
    const h = Math.max(o.cur.h, .001), fp = o.lot.fp * (o.state==='demolishing' ? 1 + .06*Math.sin(t*40) : 1);
    o.mesh.scale.set(fp, h, fp);
    if (o.pulse) o.mat.emissiveIntensity = (o.state==='constructing' ? .35 : o.state==='renovating' ? 1.1 : .7) + .5*Math.sin(t*3.2 + o.lot.x);
    else o.mat.emissiveIntensity = o.state==='renovated' ? .9 : .6;
    if (o.lamp){ const on = o.state==='renovating' || o.state==='demolishing'; o.lamp.material.opacity = on ? .6 + .4*Math.sin(t*5 + o.lot.z) : 0; o.lamp.position.y = o.cur.h + .6;
      o.beam.material.opacity = on ? .16 + .08*Math.sin(t*2.2 + o.lot.x) : o.state==='doomed' ? .05 : 0; o.beam.position.y = o.cur.h; o.beam.visible = o.beam.material.opacity > 0; }
    if (o.dust){ const T = o.dustT0 ? (now - o.dustT0)/1000 : -1; const mat = o.dust.material;
      if (T >= 0 && T < 3.2){ const pos = o.dust.geometry.attributes.position, vel = o.dust.userData.vel;
        for (let i=0;i<vel.length;i++){ const [vx,vy,vz] = vel[i]; const tt = Math.max(0, T - (i%20)*.05); pos.setXYZ(i, o.lot.x + vx*tt*30, Math.max(0, o.hB*((i%13)/13) * (1-tt/1.5) + vy*tt*10 - tt*tt*1.2), o.lot.z + vz*tt*30); }
        pos.needsUpdate = true; mat.opacity = Math.max(0, .85 - T/3.4); } else mat.opacity = 0; }
  }
  if (world.crane && world.crane.visible){ world.crane.userData.jib.rotation.y = Math.sin(t*.25)*1.2 + .6; world.crane.userData.beacon.visible = Math.sin(t*6) > 0; }
  if (selRing) selRing.material.opacity = .55 + .35*Math.sin(t*4);
  composer.render(); labelR.render(scene, camera);
}

renderLegend();
const initial = location.hash.slice(1);
switchPlan(MODELS[initial] ? initial : '062', true);
if (!has3D) setMode(true);
resize();
requestAnimationFrame(frame);
window.__lab = { scene, camera, renderer, composer, get world(){ return world; }, S, setStep, switchPlan, startTour, stopTour, openFile, openRef, setMode, MODELS, focusPaths };
</script>
