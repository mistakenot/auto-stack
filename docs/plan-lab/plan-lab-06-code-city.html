(sha8(manager,target))\n  M-->>A: {id, to, subscriptions:1, bound:1}\n  HK->>FL: stat one path (no DB open)\n  HK-->>B: hookSpecificOutput.additionalContext (fixed text)\n  B->>M: List()\n  M->>DB: materialise deliveries from cursor;append alpha.mail.read (first read only)\n  M-->>B: [ {id, from, sentAt, body} ]\n  B->>M: Ack(id)\n  M->>DB: BEGIN IMMEDIATE;UPDATE deliveries SET acked_at=? WHERE acked_at IS NULL;append alpha.mail.acked; COMMIT\n  M->>FL: rm flag if nothing unacked remains\n  M-->>B: {id, acked:true, wonTransition:true}\n```\n\n## The store at the end of this task\n\n*Diagram: events is the authority; mail is immutable; deliveries and bindings are projections*\n\n```\nerDiagram\n  MAIL ||--o{ DELIVERY : \"copied to\"\n  SUBSCRIPTION ||--o{ DELIVERY : \"owns state of\"\n  ADDRESS ||--o{ SUBSCRIPTION : \"bound by\"\n  SUBSCRIPTION ||--o| BINDING : \"currently held by\"\n  EVENT {\n    int seq\n    ulid id\n    string type\n    int version\n    time occurred_at\n    json payload\n  }\n  MAIL {\n    ulid id\n    int seq\n    string to_address\n    json envelope\n    json body\n    time sent_at\n  }\n  SUBSCRIPTION {\n    string id\n    int seq\n    string address\n    string name\n    int from_cursor\n    time created_at\n  }\n  DELIVERY {\n    string subscription_id\n    ulid mail_id\n    time first_seen_at\n    time read_at\n    time acked_at\n    string acked_by\n  }\n  BINDING {\n    string subscription_id\n    string manager\n    string target\n    string session\n    time last_seen\n  }\n\nNotes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against.\n```\n\n## The client seam\n\n**API: mail.Client**\n\n- `Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)`\nCreates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled.\n\n- `Send(ctx context.Context, in SendInput) (SendResult, error)`\nAppends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6).\n\n- `List(ctx context.Context, in ListInput) ([]Delivery, error)`\nMaterialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3).\n\n- `Ack(ctx context.Context, in AckInput) (AckResult, error)`\nCompare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13).\n\n- `Reset(ctx context.Context) (ResetResult, error)`\nRemoves the store and the flag directory. A supported operation, because alpha (G10).\n\n- `Close() error`\nReleases the store handle.\n\n**API: package mail — free functions and types**\n\n- `NewDirect(home string) (Client, error)`\nThe direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process.\n\n- `HasPending(home string, b Binding) bool`\nStats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8).\n\n- `NudgeText() string`\nThe fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too).\n\n- `BindingFor(cwd string) Binding`\nDerives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2).\n\n- `ValidateAddress(s string) error`\nPermissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable.\n\n- `type Binding struct { Manager, Target, Session string }`\nThe opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5).\n\n## The command surface at the end of this task\n\n** zsh — the full auto mail surface after T1** — C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4).\n\n```\n$ auto mail init\n```\n*creates ~/.auto/mail/ and the alpha store*\n\n```\n{ \"store\": \"/home/u/.auto/mail/alpha-store.db\", \"created\": true, \"alpha\": true }\n```\n\n```\n$ auto mail docs\n```\n*the full command reference, including the alpha contract*\n\n```\n$ auto mail subscribe auto-web/bugs --from-now\n```\n*opt to start from now instead of the backlog (D-10)*\n\n```\n{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }\n```\n\n```\n$ auto mail send --to auto-web/typo --message \"hello?\"\n```\n*nobody has subscribed — still exits 0, still persists (G6)*\n\n```\n{ \"id\": \"01K9X2R0000000000\", \"to\": \"auto-web/typo\", \"subscriptions\": 0, \"bound\": 0 }\n# stderr: no subscription exists for \"auto-web/typo\" — mail is persisted and a later\n# subscriber will receive it, but check the address for a typo.\n```\n\n```\n$ auto mail list --address auto-web/bugs\n```\n*scope to one subscription; no filters returns everything bound to you*\n\n```\n$ auto mail ack 01K9X2QF7M3B0V8N\n```\n*a second acker is told it lost, and still exits 0 (D-062-7)*\n\n```\n{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": false }\n# stderr: already acked at 2026-08-25T10:15:40Z by sub_01K9X2M4\n```\n\n```\n$ auto mail reset --yes\n```\n*alpha means reset is supported, not a workaround (G10)*\n\n```\n{ \"removed\": [\"/home/u/.auto/mail/alpha-store.db\", \"/home/u/.auto/mail/alpha-flags\"] }\n```\n\n## File Changes\n\n- **`docs/concepts/UBIQUITOUS_LANGUAGE.md`** (edit)\nG16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary.\n\n- **`auto-mail/go.mod`** (add)\nmodule github.com/mistakenot/auto-mail; replace auto-shared => ../auto-shared; modernc.org/sqlite + cobra.\n\n- **`auto-mail/go.sum`** (add)\nChecksums for the dependency set (all already present elsewhere in the workspace).\n\n- **`auto-mail/CLAUDE.md`** (add)\nTool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped).\n\n- **`auto-mail/cmd/automail/main.go`** (add)\nMinimal entry point delegating to cli.Execute.\n\n- **`auto-mail/rootcmd/rootcmd.go`** (add)\nNew(stdout, stderr) façade so auto-cli can mount `auto mail`.\n\n- **`auto-mail/internal/app/app.go`** (add)\nApp context (stdout, stderr, cwd), per the blueprint.\n\n- **`auto-mail/internal/cli/root.go`** (add)\nRoot cobra command, ExitError, Execute; wires the subcommands.\n\n- **`auto-mail/internal/cli/init.go`** (add)\n`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store.\n\n- **`auto-mail/internal/cli/docs.go`** (add)\n`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer.\n\n- **`auto-mail/internal/cli/subscribe.go`** (add)\n`auto mail subscribe <address> [--from-now] [--name]`; records the caller's binding.\n\n- **`auto-mail/internal/cli/send.go`** (add)\n`auto mail send --to --message [--body] [--from]`; resolves the sender's absolute from-address.\n\n- **`auto-mail/internal/cli/list.go`** (add)\n`auto mail list [--address] [--subscription]`; all bound subscriptions when unfiltered; clears a stale flag.\n\n- **`auto-mail/internal/cli/ack.go`** (add)\n`auto mail ack <mail-id>`; prints wonTransition, exit 0 on a lost race (D-062-7).\n\n- **`auto-mail/internal/cli/reset.go`** (add)\n`auto mail reset [--yes]`; removes the store and flag directory, reports what it removed.\n\n- **`auto-mail/internal/cli/cli_test.go`** (add)\nCommand-level tests against a temp HOME asserting the exact C1 payload shapes and the error paths.\n\n- **`auto-mail/internal/config/settings.go`** (add)\nStore and flag paths under ~/.auto/mail/, settings load/validate via auto-shared/config.\n\n- **`auto-mail/mail/client.go`** (add)\nThe public seam: Client interface, inputs/results, domain types, sentinel errors. The only exported package.\n\n- **`auto-mail/mail/direct.go`** (add)\nNewDirect: the direct-store implementation D-11 binds the MVP CLI to.\n\n- **`auto-mail/mail/address.go`** (add)\nValidateAddress — permissive, separator explicitly allowed and never normalised (D-9).\n\n- **`auto-mail/mail/binding.go`** (add)\nBindingFor: the (manager, target) ladder over hooks.CaptureContext (D-062-2).\n\n- **`auto-mail/mail/pending.go`** (add)\nThe pending-flag file: Set/Clear/HasPending (stat only) and NudgeText (a fixed constant).\n\n- **`auto-mail/mail/mail_test.go`** (add)\nAddress validation, binding ladder, flag lifecycle, and the zero-store-opens assertion via an injected counting opener.\n\n- **`auto-mail/internal/store/store.go`** (add)\nOpen (MkdirAll, sql.Open, WAL + busy_timeout + foreign_keys), Close, single write connection, transaction helper.\n\n- **`auto-mail/internal/store/schema.go`** (add)\nDDL: events (+ append-only triggers), mail (+ immutability trigger), subscriptions, deliveries, bindings, indexes, schema_migrations.\n\n- **`auto-mail/internal/store/events.go`** (add)\nThe alpha.mail.* event types, the versioned envelope, and the append path (the only writer of `events`).\n\n- **`auto-mail/internal/store/project.go`** (add)\nSame-transaction projection: mail insert, lazy delivery materialisation from the cursor, read stamp, ack compare-and-set, binding upsert.\n\n- **`auto-mail/internal/store/store_test.go`** (add)\nImmutability (triggers abort UPDATE/DELETE), cursor backfill, broadcast fan-out, and the concurrent-writer test run under -race.\n\n- **`auto-mail/internal/ulid/ulid.go`** (add)\nSender-generated ids, monotonic and sortable within one process — the cross-host merge property the backlog names. Not the store's ordering: cursors use the log's `seq`.\n\n- **`auto-mail/conformance/conformance.go`** (add)\nThe Client contract suite, written against the interface: explicit ack, wonTransition, backfill-on-subscribe, subscriptions-vs-bound, idempotent re-ack.\n\n- **`auto-mail/conformance/conformance_test.go`** (add)\nRuns the suite against the direct-store implementation; T3 adds the RPC one as a second target.\n\n- **`auto-mail/conformance/seam_test.go`** (add)\nAC-12 guard: walks the repo (located via go.work) asserting the store filename and sqlite imports appear only under auto-mail/internal/store.\n\n- **`auto-cli/cmd/auto/main.go`** (edit)\nImport mailcmd and add mailcmd.New(stdout, stderr) to root.AddCommand.\n\n- **`auto-cli/cmd/auto/hints.go`** (edit)\nSplit emission from matching: matchHint returns the rendered fragment; emitAdditionalContext writes exactly one hookSpecificOutput object for all fragments.\n\n- **`auto-cli/cmd/auto/hookscmd.go`** (edit)\nAfter the existing sinks, stat the pending flag for the firing agent's binding and prepend the fixed mail fragment to the single emission.\n\n- **`auto-cli/cmd/auto/hints_test.go`** (edit)\nUpdate for the matchHint/emitAdditionalContext split; existing behaviour assertions unchanged.\n\n- **`auto-cli/cmd/auto/hooksmail_test.go`** (add)\nHook-side tests: nudge emitted only with a flag and only on PostToolUse, one emission when a hint also matches, exit 0 with an absent/unreadable store, and no store file created.\n\n- **`auto-cli/go.mod`** (edit)\nRequire github.com/mistakenot/auto-mail with a local replace directive.\n\n- **`auto-cli/go.sum`** (edit)\nChecksums for the new module edge.\n\n- **`go.work`** (edit)\nAdd ./auto-mail to the use block.\n\n- **`Makefile`** (edit)\nAdd auto-mail to PROJECTS and to RACE_PROJECTS (the ack race and concurrent writers must run under -race).\n\n- **`CLAUDE.md`** (edit)\nAdd the auto-mail row to the Sub-Projects table.\n\n- **`harness/scenarios/mail-flow/Dockerfile`** (add)\nBuilds the real auto binary from monorepo source (context ../../..) into a single host image.\n\n- **`harness/scenarios/mail-flow/docker-compose.yaml`** (add)\nOne `host` service, init: true, healthcheck gating on the mail-ready file.\n\n- **`harness/scenarios/mail-flow/scripts/host-entrypoint.sh`** (add)\nSeeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file.\n\n- **`harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json`** (add)\nA minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern).\n\n- **`harness/src/harness/scenarios/mail_flow.py`** (add)\nMailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry.\n\n- **`harness/src/harness/cli.py`** (edit)\nOne line registering mail-flow in SCENARIOS.\n\n- **`harness/tests/mail_flow/__init__.py`** (add)\nPackage marker, mirroring tests/event_flow.\n\n- **`harness/tests/mail_flow/conftest.py`** (add)\nSession-scoped fixture: up(build=True) then down() at teardown.\n\n- **`harness/tests/mail_flow/test_mail_loop.py`** (add)\nAC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion.\n\n- **`harness/CLAUDE.md`** (edit)\nDocument the mail-flow scenario alongside skill-remote and event-flow.\n\n## Rejected Alternatives\n\n- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none.\n"},{"name":"Plan","md":"\n## Summary\n\nFive phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle.\n\n## Execution Sequence\n\n*Diagram: Phase dependency DAG — a chain, because each phase is verified inside the oracle the previous one stood up*\n\n```\nflowchart LR\n  P1[\"P1 · Ontology + module + scenario upglossary · auto mail init/docs/list · mail-flow green\"]\n  P2[\"P2 · One message travelssubscribe/send/list/ack · log + projection · C1 in the harness\"]\n  P3[\"P3 · The in-band nudgepending flag · hooks fire emits additionalContext\"]\n  P4[\"P4 · Delivery semanticscursor backfill · broadcast · counts · conformance suite\"]\n  P5[\"P5 · Rails made executableimmutability · ack race · reset · seam guard · docs\"]\n  P1 --> P2 --> P3 --> P4 --> P5\n\nThe chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit.\n```\n\n### Phase 1 — Ontology, module skeleton, and the scenario comes up\n\nStatus: done\n\n**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.\n\n1. **Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   with five entries in the house format (bold term, definition, `_Avoid_:`,\n   optional `_Has_:`):\n   - **Mail** — the stored unit of an addressed, durable message between agents.\n     `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n   - **Address** — a virtual, free-form name a Mail is sent to, carrying no\n     physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n     `_Has_`: many Subscriptions.\n   - **Subscription** — a durable reader of an Address, holding its own cursor\n     and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n     `_Has_`: many Deliveries, one Binding.\n   - **Delivery** — the per-Subscription copy of one Mail and its read/ack\n     state. `_Avoid_`: receipt, copy, inbox item.\n   - **Binding** — the current physical target and liveness of a Subscription,\n     recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n     link, attachment, route.\n   Then update the frontmatter `summary` to name the five new terms.\n   **Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   exits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\n   refreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n   **Do not hand-edit the generated ER block.**\n\n2. **Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\n   copying `auto-artifact/`'s shape: `go.mod`\n   (`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n   `replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n   `modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n   `internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n   `internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\n   dir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n   `auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n   **Verify:** `cd auto-mail && go build ./...` after each file, per the project's\n   Go build discipline.\n\n3. **The store, minimal.** `internal/store/store.go`: `Open(path)` with\n   `os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n   `auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n   `busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n   `WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n   `schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n   `subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\n   creating the full shape now avoids a migration inside the task).\n   **Verify:** a store test that opens, migrates twice (idempotent) and closes.\n\n4. **The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\n   all six methods, the input/result types matching the C1 payloads, and sentinel\n   errors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\n   implementation where `List` works (returning an empty slice against a fresh\n   store) and the other four return a `not implemented in this phase` error.\n   Everything else stays under `internal/`, so no other module can reach the\n   store (D-062-8).\n\n5. **CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n   `EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n   `{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\n   reference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n   (JSON array on stdout, `[]` when empty).\n   `internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n   `[]` and writes nothing to stdout but JSON.\n   `auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\n   identifier, table name or event type in the module names the stored unit\n   `message` (the `--message` body flag is explicitly allowed).\n\n6. **Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\n   require + local replace; `auto-cli/cmd/auto/main.go` imports\n   `mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n   `mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n   `auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\n   table (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n   **Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.\n\n7. **The scenario comes up (the epic's second of three things).**\n   `harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\n   monorepo source with context `../../..`, mirroring\n   `harness/scenarios/event-flow/Dockerfile`.\n   `docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\n   healthcheck gating on `/tmp/mail-ready.json`.\n   `scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\n   empty commit + `auto init --project` in **both** `/workspace/project-a` and\n   `/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n   `harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\n   with `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\n   fail-fasts with a diagnostic if the ready file is missing, either workspace is\n   unregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\n   a `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\n   workspace (base64-piped, per the event-flow convention).\n   Register `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n   `harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\n   session-scoped fixture plus one test asserting the stack is up, both\n   workspaces are registered, and `auto mail list` returns `[]` from each.\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   from the repo root `make check` and `make test`; from `harness/`\n   `uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n   `uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\n   scenarios are untouched.\n   **Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`.\n\n### Phase 2 — One message travels between two agents and is acked\n\nStatus: done · depends on 1\n\nThe epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.\n\n1. **Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\n   lexicographically sortable **within one process** (the cross-host merge\n   property `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n   `sub_` + the ULID's leading 8 chars.\n   **Verify:** a test asserting monotonicity across 10k ids in one process and\n   sort order matching generation order — and scoped to say so, because that\n   ordering does not survive a process boundary and nothing in the store may\n   rest on it. Ordering the store depends on comes from the log's own `seq`\n   (see the cursor, below).\n\n2. **Events.** `internal/store/events.go`: the four `alpha.*` types —\n   `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n   `alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n   `Append(tx, ev)` as the **only** writer of the `events` table. Add the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n   `schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.\n\n3. **Projection.** `internal/store/project.go`, all inside one\n   `BEGIN IMMEDIATE` transaction per operation:\n   - `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n     (address + `from_cursor`) and its binding row.\n   - `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n     carrying the `seq` of that event as the store's own ordering of mail. It\n     writes **no** `deliveries` rows: materialisation is the read path's, and\n     only the read path's (D-10). Send additionally *reads* the two counts it\n     reports and the bindings whose pending flag the mail should raise.\n   - `list` → materialise any missing `deliveries` rows from each subscription's\n     `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n     `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n     nothing; return unacked rows.\n   - `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n     AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n     `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).\n\n4. **Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n   `/` explicitly allowed and never normalised (D-9); rejects empty,\n   whitespace-padded, control characters and over-length, each with a remediation\n   message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n   `tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\n   opaque pair. **Neither ever writes physical identity into an address or an\n   envelope** (G5).\n\n5. **The direct client.** Implement the remaining five `Client` methods in\n   `mail/direct.go` over the projection, returning exactly the C1 payload shapes.\n   The sender's `from` follows the three-rung ladder: `--from` → the address of a\n   subscription bound to the caller's `(manager, target)` (lowest subscription id\n   when several) → the literal `/agent` from the registry, or\n   `unregistered/agent` outside a registered project. Always a resolved absolute\n   address, never a relative handle.\n\n6. **The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n   `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n   (`--address`, `--subscription`; unfiltered returns every unacked delivery for\n   every subscription bound to the caller), `ack.go` (positional mail id;\n   `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\n   with a remediation hint for an unknown id).\n   `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\n   exact payloads and that stdout is pure JSON.\n\n7. **The harness proves it (G15).** Extend `mail_flow.py` with\n   `subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n   `test_mail_loop.py` with the C1 loop across the two workspaces:\n   **project-a subscribes to its own reply address first** (so `from` resolves by\n   rung 2, as C1 shows), project-b subscribes to the target address, project-a\n   sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\n   presence of the mail id, never on counts (G4 permits duplicates).\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`.\n\n### Phase 3 — The in-band nudge reaches a working agent\n\nStatus: done · depends on 2\n\nThe riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.\n\n1. **The pending flag.** `mail/pending.go`:\n   `flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\n   bytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n   `HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\n   every error — missing dir, permission denied — as \"no mail\". Add\n   `NudgeText() string`, a **constant**: an instruction to run `auto mail list`\n   and `auto mail ack` when acted on, with **no** interpolation of sender,\n   address, subject or body (G14's content rule, adopted for the in-band channel).\n   Wire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\n   subscriptions have nothing unacked left — the self-healing loop that bounds\n   flag drift (D-062-3).\n   **Verify:** `mail_test.go` — a counting store-opener injected over the package\n   var proves `HasPending` performs **zero** opens on both paths; flag lifecycle\n   across send → list → ack; a false-positive flag causes one `list` and then\n   clears itself.\n\n2. **Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\n   change `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\n   fragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\n   add `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\n   which writes **exactly one** `hookResponse` object, or nothing when every\n   fragment is empty. Update `hints_test.go` for the split — the behavioural\n   assertions carry over unchanged.\n\n3. **Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n   `matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n   `mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\n   fragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\n   stays inside the never-return-an-error region — any failure is swallowed and\n   the hook still exits 0.\n\n4. **Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\n   nudge emitted only when the flag exists; only on `PostToolUse`; **one**\n   `hookSpecificOutput` object when a hint rule also matches, with mail first;\n   exit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\n   file; and — the observable form of G8 — firing hooks on a `HOME` where\n   `auto mail init` never ran leaves `alpha-store.db` **non-existent**.\n\n5. **The harness proves it.** Add\n   `harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\n   PostToolUse payload, `cwd` patched per fire, mirroring\n   `event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n   `mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\n   returns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n   `test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n   `hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\n   the next fire emits nothing.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`;\n   `cd auto-cli && go test ./...`; repo-root `make check && make test`;\n   `uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n   (the hints change touches a path `event-flow` exercises — prove it is intact).\n   **Commit** `feat(062): in-band mail nudge on hook fire at stat cost`.\n\n### Phase 4 — Delivery semantics and the Client conformance suite\n\nStatus: done · depends on 3\n\nThe call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).\n\n1. **Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\n   the store's own high-water mark, `MAX(mail.seq)` read inside the same\n   `BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\n   the beginning of the log), and report `backfilled` as the count of unacked\n   mail the new cursor admits.\n\n   The cursor is a log position, **never a minted id**. A `--from-now` cursor of\n   `ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\n   ordering *between processes*, and D-11 makes every verb its own process: two\n   ids drawn in the same millisecond share a timestamp prefix and draw\n   independent tails, so a mail could sort below the cursor and be admitted by\n   nothing, ever. The write lock is what makes a high-water mark true instead.\n   **Verify:** send to an unsubscribed address, subscribe afterwards, `list`\n   returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n   `backfilled` is 0.\n\n2. **Broadcast (D-7).** Two subscriptions on one address each get their own\n   `deliveries` row and their own ack state; acking one leaves the other unacked.\n   **Verify:** `store_test.go` plus a conformance case.\n\n3. **Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n   `bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n   `0/0` for an unknown address, persists the mail, and writes the\n   likely-typo hint to **stderr** only.\n\n4. **The conformance suite.** `auto-mail/conformance/conformance.go` — a\n   `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n   `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\n   the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\n   appending no second event, backfill-on-subscribe both ways,\n   subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\n   with a separator. `conformance_test.go` runs it against `NewDirect`.\n   **Deliberately absent: any assertion about ordering** (G4).\n\n5. **The harness proves the J2 half.** Extend `test_mail_loop.py` with\n   send-before-subscribe across the two workspaces: project-a sends to an address\n   nobody holds, project-b subscribes afterwards and receives it.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`.\n\n### Phase 5 — Rails made executable: immutability, the ack race, reset, the seam guard, docs\n\nStatus: done · depends on 4\n\nEverything the guard rails assert but nothing so far has been forced to prove.\n\n1. **Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\n   before a `list` + `ack` cycle and assert byte-identical rows after; assert the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\n   assert the ack appears as a **new** `alpha.mail.acked` row.\n\n2. **The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n   `Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\n   event, and every caller seeing `acked: true`. Plus a concurrent-writer test:\n   N processes' worth of goroutines sending to one address lose no events and\n   leave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n   `Makefile`.\n   **Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).\n\n3. **Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n   `alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\n   without `--yes` on a non-empty store with a remediation hint.\n   **Verify:** `cli_test.go` — reset then the C1 loop again from empty.\n\n4. **The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\n   repo root by walking up for `go.work` (skip the test if absent, so a\n   standalone module checkout still passes), then walk every module's Go source,\n   `harness/` and `skills/`, asserting that the **mail store** is named nowhere\n   outside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n   `~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\n   either. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n   `auto-search` import it for their own stores and would fail the guard on day\n   zero. Also assert no package outside `auto-mail` imports\n   `auto-mail/internal/...` (a regression guard over what the compiler already\n   enforces). Failure names the offending file and says \"go through\n   mail.Client\".\n\n5. **The alpha contract in writing (G10, G4).** `internal/cli/docs.go` and\n   `auto-mail/CLAUDE.md` both state, in as many words: **at-least-once,\n   unordered, consumers must be idempotent on mail id**; and **alpha — no\n   upcasters, no migrations, no compatibility guarantee, the store may be wiped\n   on upgrade, `reset` is supported**. `auto-mail/CLAUDE.md` also records the one\n   deliberate exception to `docs/auto-package-patterns.md` (D-062-8) so the next\n   package author does not read it as licence, and notes that `quickstart` and\n   `doctor` are epic task T4's.\n\n6. **Harness docs.** Add the `mail-flow` scenario to `harness/CLAUDE.md`'s\n   Scenarios section alongside `skill-remote` and `event-flow`, including why it\n   is one container (D-062-1).\n\n7. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check`, `make test`, `make test-race`; from `harness/`\n   `uv run pytest -v` (all three scenarios). Run `auto doc fix` if any doc\n   frontmatter drifted. **Commit**\n   `feat(062): mail immutability, ack-race, reset, seam guard and the alpha contract`.\n   Open the PR.\n\n## Success Criteria\n\n- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines.\n\n<\/html>\n"}],"sections":[],"city":[[".auto/doc/.gitignore",3],[".auto/doc/settings.json",15],[".auto/env/.gitignore",1],[".auto/env/c /lint.py",56],["turtle-spike/scripts/parse.py",17],["turtle-spike/scripts/test_sparql.py",60],["turtle-spike/scripts/validate.py",31],["turtle-spike/shapes/etl-shapes.ttl",132],["turtle-spike/shapes/shapes.ttl",61],["turtle-spike/spec/auto-etl-generated.ttl",650],["turtle-spike/spec/auto-etl.ttl",854],["turtle-spike/spec/system.ttl",243],["turtle-spike/tests/all-components-reachable.rq",9],["turtle-spike/tests/etl-commands-invoke-known-stages.rq",11],["turtle-spike/tests/etl-datasets-have-id.rq",14],["turtle-spike/tests/etl-foreign-keys-valid.rq",11],["turtle-spike/tests/etl-no-duplicate-field-names.rq",11],["turtle-spike/tests/etl-pipeline-connected.rq",13],["turtle-spike/tests/no-dependency-cycles.rq",6],["turtle-spike/tests/no-self-dependency.rq",6],["turtle-spike/tools/schema2ttl/.gitignore",1],["turtle-spike/tools/schema2ttl/go.mod",3],["turtle-spike/tools/schema2ttl/main.go",359],["turtle-spike/tools/schema2ttl/main_test.go",121]],"baseDate":"2026-08-25","mergeSubject":"feat(062): auto-mail walking skeleton (#146)","mergeDate":"2026-08-31","rails":[{"id":"G1","prio":"","text":"Mail rows and events are immutable; state changes are appended and re-projected","third":"AC-3"},{"id":"G2","prio":"","text":"Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row","third":"AC-4"},{"id":"G3","prio":"","text":"Ack is a separate explicit call; reading does not retire mail","third":"AC-5"},{"id":"G4","prio":"","text":"At-least-once and unordered *as documented*; consumers idempotent on mail id","third":"AC-7"},{"id":"G5","prio":"","text":"Addresses are virtual — no physical identity in them or in a stored envelope's `to`","third":"AC-8"},{"id":"G6","prio":"","text":"Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound`","third":"AC-9"},{"id":"G8","prio":"","text":"The no-mail nudge path is a stat-level check and can never stall or break the hook","third":"AC-10"},{"id":"G10","prio":"","text":"Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store","third":"AC-11"},{"id":"G11","prio":"","text":"Nothing outside the mail package reads the store","third":"AC-12"},{"id":"G13","prio":"","text":"Ack transitions exactly once and reports whether it won","third":"AC-6"},{"id":"G15","prio":"","text":"A capability is done when it passes end to end in the harness","third":"AC-13"},{"id":"G16","prio":"","text":"The ontology lands before the code that uses it","third":"AC-1"}]},{"id":"052","slug":"052-reflect-tool-hardening","doc":{"title":"052: reflect-tool-hardening","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/116","generated":"2026-06-28","next-prompt":"/execute-task 052"},"base":"f4b0ca4c5d7fa37ace152b2b72403711a5dd11c5","asBuilt":"34d1d22","decisions":[{"id":"D-1","title":"F4 surface = dedicated `gap list`","status":"accepted","by":"charlie","summary":"Dedicated `auto reflect gap list`, not a generic events --full flag.","body":"**Decision:** Expose gaps via a dedicated `auto reflect gap list` command.\n**Alternatives:** A generic `events list --full/--payload` flag; both.\n**Consequences:** Matches the \"gap → observation\" mental model and is discoverable;\nthe generic payload-dump flag is left out of scope.","tab":"Requirements"},{"id":"D-2","title":"Event log is git-tracked","status":"accepted","by":"charlie","summary":"events/ tracked; init .gitignore ignores only playbook.json.","body":"**Decision:** The canonical `.auto/reflect/events/*.jsonl` log is committed\n(shared playbook history; any clone can `rebuild`). The init-written\n`.auto/reflect/.gitignore` ignores only the disposable `playbook.json`.\n**Alternatives:** Ignore events too (machine-local reflect state).\n**Consequences:** Reflect history travels with the repo and across hosts.","tab":"Requirements"},{"id":"D-3","title":"F5 = restructure to a uniform envelope (breaking)","status":"accepted","by":"charlie","summary":"One uniform output envelope; top-level id/ids. Breaks existing consumers.","body":"**Decision:** Restructure command output to one uniform envelope rather than\nadditively bolting a top-level `.id` onto today's shapes.\n**Alternatives:** Non-breaking additive `.id`/`.ids`.\n**Consequences:** Cleanest end state; existing output consumers (and the skill\nreferences' documented extraction paths) must be updated in lockstep.","tab":"Requirements"},{"id":"D-4","title":"Content-derived ids included in 052","status":"accepted","by":"charlie","summary":"Deterministic content-hashed ids ship in this task.","body":"**Decision:** Implement content-derived ids (F7) in this task, not a follow-up.\n**Consequences:** Adds collision-handling design; fits the output-contract theme\nsince deterministic ids make `--dry-run` output actionable.","tab":"Requirements"},{"id":"D-5","title":"F5 changes CLI output only — not the stored event schema","status":"accepted","by":"agent","summary":"Envelope restructure is presentation-layer; on-disk payloads + schema_version=1 unchanged.","body":"**Context:** Stored payload field names (`observation_id`, `rule_id`, …) are part\nof the append-only on-disk contract; `events.SchemaVersion` is 1 and must fold\nidentically forever.\n**Decision:** F5 restructures only CLI *output* marshalling. Stored event payload\nfield names and `schema_version` are untouched.\n**Consequences:** No schema bump; the uniform envelope is a view over canonical\ndata, consistent with \"playbook is a disposable cache, events are canonical.\"","tab":"Requirements"},{"id":"D-6","title":"Content-derived ids preserve existing id formats","status":"accepted","by":"agent","summary":"Only minting changes (random → content hash); regex formats like ^ob-[0-9a-f]{8}$ stay.","body":"**Context:** Ids are validated against fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`.","tab":"Requirements"},{"id":"D-7","title":"F5 final shape: top-level id on mutations, per-element id on reads","status":"accepted","by":"charlie","summary":"Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.","body":"**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array.","tab":"Solution"},{"id":"D-8","title":"Content-derived ids: rules + observations only","status":"accepted","by":"charlie","summary":"r-/ob- become content hashes; rt-/fb-/ev- stay random.","body":"**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids.","tab":"Solution"},{"id":"D-9","title":"Pure content hash, no collision suffix","status":"accepted","by":"charlie","summary":"id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.","body":"**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks).","tab":"Solution"}],"acs":[{"id":"AC-1","title":"gap list surfaces reported gaps (F4)","phases":"5","tests":"auto-reflect/internal/cli/gap_integration_test.go","body":"**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted."},{"id":"AC-2","title":"gap list obeys list conventions (F4)","phases":"5","tests":"auto-reflect/internal/cli/gap_integration_test.go","body":"**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available."},{"id":"AC-3","title":"One pending count, two callers agree (F2)","phases":"4","tests":"auto-reflect/internal/cli/miner_integration_test.go","body":"**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged."},{"id":"AC-4","title":"Mutating commands expose a top-level id (F5)","phases":"1,2,3","tests":"auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go","body":"**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)"},{"id":"AC-5","title":"Collection commands expose .[].id without data loss (F5)","phases":"1,3","tests":"auto-reflect/internal/cli/observation_integration_test.go","body":"**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths."},{"id":"AC-6","title":"Content-derived ids make consolidate deterministic + idempotent (F7)","phases":"1,2","tests":"auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go","body":"**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists."},{"id":"AC-7","title":"Ids keep their format (F7/D-6)","phases":"1,2","tests":"auto-reflect/internal/idhash/idhash_test.go","body":"**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids."},{"id":"AC-8","title":"init writes an idempotent .gitignore (F9)","phases":"7","tests":"auto-reflect/internal/cli/init_test.go","body":"**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it."},{"id":"AC-9","title":"Canonical events tracked, cache ignored (F9/D-2)","phases":"7","tests":"auto-reflect/internal/cli/init_test.go","body":"**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked)."},{"id":"AC-10","title":"doctor detects stale/partial state (F1)","phases":"6","tests":"auto-reflect/internal/cli/doctor_integration_test.go","body":"**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail."},{"id":"AC-11","title":"Rule listings carry timestamps (F6)","phases":"3","tests":"auto-reflect/internal/rules/projection_test.go","body":"**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto reflect rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map)."},{"id":"AC-12","title":"outcome enum + correction_density documented (F8/F3)","phases":"7","tests":"","body":"**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set."},{"id":"AC-13","title":"Legacy yaml removed (F11)","phases":"7","tests":"","body":"**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove."},{"id":"AC-14","title":"No regressions (cross-cutting)","phases":"1,2,3,4,5,6,7","tests":"auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go","body":"**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`."}],"phases":[{"n":"1","title":"Foundations + walking skeleton","status":"done","files":["auto-reflect/internal/idhash/idhash.go","auto-reflect/internal/idhash/idhash_test.go","auto-reflect/internal/cli/output.go","auto-reflect/internal/observations/model.go","auto-reflect/internal/observations/model_test.go","auto-reflect/internal/cli/observation.go","auto-reflect/internal/cli/observation_integration_test.go"],"body":"Thin path through every layer the task touches: id minting → command → output\n→ test.\n\n1. Add `internal/idhash/idhash.go`: `Derive(prefix string, parts ...string)\n   string` = `prefix + first 8 hex of sha256(strings.Join(parts,\"\\n\"))`.\n   **Verify:** `idhash_test.go` — same parts → same id; format `^p-[0-9a-f]{8}$`;\n   different parts → different id.\n2. Add `cli/output.go`: `mutationResult(id, fields)` and\n   `mutationResultIDs(ids, fields)` injecting top-level `id`/`ids`.\n   **Verify:** unit/compile.\n3. `observations/model.go`: `NewObservationID` takes canonical parts\n   (`kind,subject,evidence…,domain,severity`) and calls `idhash.Derive(\"ob\",…)`.\n   Update the existing zero-arg `TestNewObservationIDFormat`\n   (`observations/model_test.go`) for the new signature.\n   **Verify:** `go test ./internal/observations/...`.\n4. `observation.go`: `observation add` returns top-level `.id`\n   (via `mutationResult`); `observation list` elements carry top-level `id`.\n   **Verify:** `observation_integration_test.go` — `add` exposes `.id` matching\n   `^ob-[0-9a-f]{8}$`; re-adding identical observation is idempotent (same id);\n   `list | jq '.observations[].id'` non-empty.\n5. **Phase verify:** `go build ./...`; `go test ./internal/observations/...\n   ./internal/cli/... -run 'Observation|Idhash'`; `golangci-lint run`.\n6. **Commit:** `feat(052): content-hash ids + output envelope (skeleton on observation)`."},{"n":"2","title":"Rule content ids + consolidate determinism","status":"done","depends-on":"1","files":["auto-reflect/internal/rules/model.go","auto-reflect/internal/cli/consolidate.go","auto-reflect/internal/cli/rule.go","auto-reflect/internal/cli/consolidate_integration_test.go","auto-reflect/internal/loop/service_test.go"],"body":"1. `rules/model.go`: `NewRuleID` takes canonical parts\n   (`domain,use_when,content,rule_type`) → `idhash.Derive(\"r\",…)`.\n   **Verify:** `go test ./internal/rules/...`.\n2. Feed content to **every** `NewRuleID` caller — the signature is variadic, so a\n   missed zero-arg call still compiles but mints a constant id: `consolidate.go`\n   `createDraft`/`split`, **and `rule.go` `rule create`** (the third caller).\n   Emit top-level `ids` from `consolidate` via `mutationResultIDs`; dry-run and\n   apply now mint the same id from the same content. Update `loop/service_test.go`\n   (calls `NewRuleID` zero-arg today) for the new signature.\n   **Verify (the F7 acceptance):** `consolidate_integration_test.go` — run\n   `--dry-run` then apply on one delta in separate command calls; assert\n   `ids[0]` identical; assert a second apply is a no-op (no duplicate rule in\n   the refold); plus a `rule create` smoke check that two distinct creates get\n   distinct ids.\n3. **Phase verify:** `go build ./...`; `go test ./internal/rules/...\n   ./internal/loop/... ./internal/cli/... -run 'Rule|Consolidate|Service'`;\n   `golangci-lint run`.\n4. **Commit:** `feat(052): deterministic content-derived rule ids (F7)`."},{"n":"3","title":"Envelope rollout + rule timestamps","status":"done","depends-on":"1,2","files":["auto-reflect/internal/cli/rule.go","auto-reflect/internal/cli/retrieve.go","auto-reflect/internal/cli/select.go","auto-reflect/internal/cli/feedback.go","auto-reflect/internal/rules/projection_test.go"],"body":"1. `rule.go`: `create/edit/promote/retire/graduate` return top-level `.id`\n   (fixes the `null`); `rule list` projection map gains `created_at`/`updated_at`\n   (F6 — values already on the folded `Rule`).\n   **Verify:** `rule get`/`list | jq '.rules[].created_at'` non-empty.\n2. `retrieve.go`, `select.go`: each array element gains a top-level `id`\n   (aliasing `retrieval_id`/`feedback_id`, which stay).\n   **Verify:** `retrieve|select | jq '.[].id'` non-empty.\n3. `feedback.go`: recorded result echoes `ids` (the feedback ids acted on).\n4. `projection_test.go`: assert `Fold` surfaces `created_at`/`updated_at` and\n   `rule list` carries them.\n   **Verify (F6).**\n5. **Phase verify:** `go build ./...`; `go test ./internal/...\n   -run 'Rule|Retrieve|Select|Feedback|Projection'`; `golangci-lint run`.\n6. **Commit:** `feat(052): uniform id access on commands + rule timestamps (F5,F6)`."},{"n":"4","title":"Single-source pending count","status":"done","depends-on":"1","files":["auto-reflect/internal/cli/miner.go","auto-reflect/internal/cli/miner_integration_test.go"],"body":"1. **First reproduce** the divergence: a test that drives `miner status` and\n   `stats` on a fixture and asserts they currently differ (pin the bug before\n   fixing — Verification risk note).\n2. `miner.go`: delete the hand-rolled pending loop (~L280); call\n   `miner.PendingCount(repoRoot, etlRoot)` — the same function `stats` uses.\n   Preserve the 023 null-vs-zero coverage contract in the status output.\n3. **Verify (F2):** `miner_integration_test.go` — `miner status` `pending` ==\n   `stats` `pending_to_mine` on the same fixture.\n4
