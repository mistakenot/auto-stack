<script type="importmap">

<style>
:root{
  --bg:#080b10; --bg2:#0f141b; --panel:#0d1218f2; --line:#243040; --line2:#1a2330;
  --ink:#ece5d6; --ink2:#b9b3a6; --muted:#7d8795; --dim:#4c5663;
  --new:#ff8a1f; --built:#f3e3c3; --reno:#35e0cf; --demo:#ff4d4d; --stake:#ffb45c;
  --display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'IBM Plex Sans', system-ui, sans-serif;
  --panelW: 400px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--stake)}
code{font-family:var(--mono);font-size:.86em;background:#ffffff0d;padding:.05em .3em;border-radius:3px}
#stage{position:fixed;inset:0;right:var(--panelW)}
#gl canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none}
#map2d{position:absolute;left:0;top:0;width:100%;height:100%;display:none;background:radial-gradient(ellipse at 50% 40%,#111822,#07090d)}
body.mode2d #stage #map2d{display:block}
body.mode2d #gl,body.mode2d #labels{visibility:hidden}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:var(--panelW);top:0;display:flex;align-items:flex-start;gap:18px;padding:14px 18px;pointer-events:none;z-index:5;
  background:linear-gradient(#080b10ee,#080b1000)}
#top>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:900;font-size:34px;line-height:.82;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;white-space:nowrap;font-weight:500;font-size:12.5px;letter-spacing:.24em;color:var(--muted);margin-top:6px}
.permits{display:flex;gap:8px;margin-left:8px}
.permit{border:1px solid var(--line);background:#0c1117cc;padding:7px 12px 8px;text-align:left;min-width:190px;border-radius:2px;position:relative;transition:.2s}
.permit .k{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--muted)}
.permit .t{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1.05}
.permit .s{font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
.permit[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.permit[aria-pressed=true] .k{color:var(--acc)}
.permit.g{--acc:var(--new)} .permit.b{--acc:var(--reno)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:1px solid var(--line);background:#0c1117cc;padding:8px 12px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;border-radius:2px}
.tbtn:hover{border-color:var(--ink2)}
.tbtn.on{background:var(--ink);color:#0a0d12;border-color:var(--ink)}
.tbtn.tour{border-color:var(--new);color:var(--new)}
.tbtn.tour.on{background:var(--new);color:#140a00}

/* ---------- banner (greenfield/brownfield) ---------- */
#banner{position:fixed;left:0;top:84px;z-index:4;max-width:470px;pointer-events:none;padding:8px 40px 18px 18px;background:radial-gradient(ellipse at 0% 30%,#080b10e6 0%,#080b10b0 55%,#080b1000 75%)}
#banner .kind{font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;letter-spacing:.01em;text-transform:uppercase;color:var(--acc);
  text-shadow:0 0 30px color-mix(in srgb,var(--acc) 35%,transparent)}
#banner .sub{font-size:14px;line-height:1.45;color:var(--ink2);margin-top:10px;max-width:400px}
#banner .sub b{color:var(--ink)}
#banner .meter{display:flex;height:8px;margin-top:12px;width:320px;border-radius:1px;overflow:hidden;background:#1a2230}
#banner .meter i{display:block;height:100%}
#banner .mlegend{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:12px}
#banner .mlegend span:before{content:'';display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--c);vertical-align:0}

/* ---------- timeline ---------- */
#timeline{position:fixed;left:0;right:var(--panelW);bottom:0;z-index:5;padding:26px 22px 16px;background:linear-gradient(#080b1000,#080b10e8 30%,#080b10fa)}
#phasecap{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;min-height:44px}
#phasecap .pn{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;color:var(--acc)}
#phasecap .pt{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1.05}
#phasecap .pm{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
#phasecap .more{margin-left:auto;align-self:center}
.track{position:relative;height:110px;user-select:none}
.track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl-play{position:absolute;left:-2px;bottom:10px}
#play{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink2);background:#0c1117;display:grid;place-items:center;padding:0}
#play svg{width:14px;height:14px}

/* ---------- panel ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);background:var(--panel);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column}
#panelhead{padding:12px 18px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;min-height:48px}
#back{border:1px solid var(--line);background:none;padding:4px 9px;font-family:var(--mono);font-size:12px;border-radius:2px}
#crumbs{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#pbody{overflow-y:auto;overflow-x:hidden;padding:16px 18px 40px;flex:1;scrollbar-width:thin;scrollbar-color:#2a3441 transparent}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow:after{content:'';flex:1;height:1px;background:var(--line2)}
.eyebrow:first-child{margin-top:0}
h2.big{font-family:var(--display);font-weight:900;font-size:30px;line-height:.98;margin:4px 0 8px;letter-spacing:.005em}
h3.path{font-family:var(--mono);font-weight:500;font-size:14.5px;word-break:break-all;margin:6px 0 10px;line-height:1.35}
.stamp{display:inline-block;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.22em;text-transform:uppercase;padding:4px 9px 3px;border:2px solid var(--c);color:var(--c);transform:rotate(-2deg);border-radius:2px}
.prose{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.prose p{margin:.5em 0}
.prose strong{color:var(--ink)}
.prose ul,.prose ol{padding-left:1.25em;margin:.4em 0}
.prose li{margin:.2em 0}
.prose pre{background:#05070a;border:1px solid var(--line2);padding:8px 10px;overflow:auto;font-size:11.5px;border-radius:3px}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;font-size:12px;margin:.6em 0;display:block;overflow:auto}
.prose th,.prose td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.prose blockquote{margin:.5em 0;border-left:3px solid var(--line);padding-left:10px;color:var(--ink2)}
.why{font-size:14.5px;line-height:1.5;color:var(--ink);border-left:3px solid var(--c);padding:2px 0 2px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;font-family:var(--mono);color:var(--ink2)}
.kv b{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#121922;border-radius:2px;padding:3px 7px;font-family:var(--mono);font-size:11.5px;color:var(--ink);text-align:left}
.chip:hover{border-color:var(--ink2)}
.chip.ph{border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc)}
.chip.dead{opacity:.6;cursor:help}
.row{display:block;width:100%;overflow-wrap:anywhere;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:8px 2px;font-size:13px;line-height:1.35;color:var(--ink2)}
.row:hover{background:#ffffff08;color:var(--ink)}
.row .id{font-family:var(--mono);font-size:11.5px;color:var(--ink);margin-right:6px;font-weight:600}
.row .tag{float:right;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:8px}
.fdot{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:7px;vertical-align:0;background:var(--c)}
.hbar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink2);margin:6px 0}
.hbar .b{height:10px;background:#1b2430;flex:1;position:relative}
.hbar .b i{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.thread{border:1px solid var(--line2);border-radius:3px;margin:8px 0;padding:8px 10px;background:#0a0e13}
.thread .ttl{font-size:13px;color:var(--ink);font-weight:600}
.thread .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:2px 0 6px}
.thread .who{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.thread .who.review{color:#ffb45c} .thread .who.author{color:var(--reno)}
details.more>summary{cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.cta{display:block;width:100%;margin-top:18px;border:1px solid var(--ink2);background:none;padding:10px;font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
.cta:hover{background:var(--ink);color:#0a0d12}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);margin:10px 0}
.stat div{background:#0b1016;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:.9;color:var(--c)}
.stat span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* ---------- tooltip, labels ---------- */
#tip{position:fixed;z-index:9;pointer-events:none;background:#06080bf2;border:1px solid var(--line);padding:6px 9px;font-family:var(--mono);font-size:11.5px;max-width:420px;display:none;border-radius:2px}
#tip .p{color:var(--ink);word-break:break-all}
#tip .m{color:var(--muted);margin-top:2px}
.dlabel{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#aab3bf;text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;transform:translateY(-6px)}
.dlabel.hot{color:var(--acc);font-size:16px}
.dlabel.newd{color:var(--new);font-size:19px;letter-spacing:.2em}
.dlabel.newd small{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--stake);text-align:center}
.flabel{font-family:var(--mono);font-size:10.5px;color:#fff;background:#000000b0;border-left:2px solid var(--c);padding:1px 5px;white-space:nowrap;transform:translateY(-4px)}

/* ---------- legend ---------- */
#legend{position:fixed;right:calc(var(--panelW) + 16px);top:98px;z-index:4;background:#0a0e13cc;border:1px solid var(--line2);padding:8px 10px;font-size:11.5px;color:var(--ink2);width:auto;border-radius:2px;backdrop-filter:blur(4px)}
#legend .h{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
#legend .h button{background:none;border:0;color:var(--muted);font-size:11px;padding:0;font-family:var(--mono);letter-spacing:0}
#legend .li{display:flex;align-items:center;gap:6px;margin:3px 0;line-height:1.2;white-space:nowrap}
#legend svg{flex:none}
#legend .foot{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.4}
#legend.min .li,#legend.min .foot{display:none}
body.mode2d #legend{right:auto;left:18px;top:290px}

/* ---------- tour caption ---------- */
#tourcap{position:fixed;left:50%;transform:translateX(calc(-50% - var(--panelW)/2));bottom:128px;z-index:7;max-width:680px;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#tourcap.on{opacity:1}
body.touring #phasecap{visibility:hidden}
#tourcap .k{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:12px;color:var(--new);text-transform:uppercase}
#tourcap .t{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-shadow:0 2px 20px #000}
#tourcap .s{font-size:14.5px;color:var(--ink2);margin-top:6px;text-shadow:0 1px 8px #000}

/* ---------- dossier ---------- */
#dossier{position:fixed;inset:0;z-index:20;background:#07090c;display:none;flex-direction:column}
#dossier.on{display:flex}
#dossier header{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line)}
#dossier header h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0 18px 0 0;letter-spacing:.02em}
#dossier .dtab{border:1px solid var(--line);background:none;padding:6px 12px;font-family:var(--display);font-weight:700;letter-spacing:.16em;font-size:13px;text-transform:uppercase}
#dossier .dtab.on{background:var(--ink);color:#0a0d12}
#dossier .x{margin-left:auto}
#dbody{overflow:auto;flex:1;padding:24px}
#dbody .prose{max-width:860px;margin:0 auto;font-size:14.5px}
#dbody .prose h2{font-family:var(--display);font-weight:900;font-size:30px;color:var(--ink);margin:1.4em 0 .3em;letter-spacing:.01em}
#dbody .prose h3{font-family:var(--display);font-weight:700;font-size:21px;color:var(--acc);margin:1.3em 0 .2em}

#nogl{display:none}
body.nogl #nogl{display:block;position:fixed;left:18px;bottom:150px;z-index:6;font-family:var(--mono);font-size:12px;color:var(--stake)}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  :root{--panelW:0px}
  #stage{right:0;bottom:44vh}
  #top{right:0;flex-wrap:wrap;padding:10px 12px;gap:8px}
  .brand{font-size:24px} .brand small{display:none}
  .permits{margin-left:0} .permit{min-width:0;padding:5px 8px} .permit .t{font-size:16px} .permit .s{display:none}
  .tools{margin-left:0}
  #banner{display:none} .depcap{display:none}
  #legend{display:none}
  #panel{top:auto;height:44vh;width:100%;border-left:0;border-top:1px solid var(--line)}
  #timeline{right:0;bottom:44vh;padding:0 12px 6px}
  #phasecap .pn{font-size:28px} #phasecap .pt{font-size:16px} #phasecap .pm,#phasecap .more{display:none}
  .track{height:84px}
  #tourcap{transform:translateX(-50%);bottom:calc(44vh + 120px)} #tourcap .t{font-size:22px}
}
</style>
</head>

<header id="top">
  <div class="brand">Code&nbsp;City<small>PLAN LAB 06 · A TASK PLAN AS URBAN DEVELOPMENT</small></div>
  <div class="permits" role="tablist" aria-label="Plan">

    <button class="permit b" data-plan="052" aria-pressed="false"><div class="k">PERMIT 052 · BROWNFIELD</div><div class="t">reflect-tool hardening</div><div class="s" id="ps052"></div></button>

<div id="banner"></div>

</div>

<script id="plan-data" type="application/json">{"plans":[{"id":"062","slug":"062-auto-mail-walking-skeleton","doc":{"title":"062: auto-mail-walking-skeleton","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/146","generated":"2026-08-25","next-prompt":"/commit-task 062"},"base":"41c1516d631e25bbb013bba2564374fdc773df3e","asBuilt":"0c73e78","decisions":[{"id":"D-062-1","title":"Two agents on one host = two workspaces in one container, not two containers","status":"accepted","by":"agent","summary":"The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts.","body":"**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control.","tab":"Requirements"},{"id":"D-062-2","title":"A binding is keyed by the physical context hooks already capture","status":"accepted","by":"agent","summary":"Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing.","body":"**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes.","tab":"Requirements"},{"id":"D-062-3","title":"The no-mail hook path is gated by a pending-flag file, not a store read","status":"accepted","by":"agent","summary":"G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite.","body":"**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package.","tab":"Requirements"},{"id":"D-062-4","title":"T1 ships init, docs and reset; quickstart and doctor land in T4","status":"accepted","by":"agent","summary":"The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing.","body":"**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim.","tab":"Requirements"},{"id":"D-062-5","title":"T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface","status":"accepted","by":"agent","summary":"D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3.","body":"**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire.","tab":"Requirements"},{"id":"D-062-6","title":"Inline notification in T1 is the pending flag; the bus event waits for the daemon","status":"accepted","by":"agent","summary":"D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host.","body":"**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes.","tab":"Requirements"},{"id":"D-062-7","title":"Losing an ack race is a reported outcome, not an error exit","status":"accepted","by":"agent","summary":"wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage.","body":"**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free.","tab":"Requirements"},{"id":"D-062-8","title":"One exported package, `auto-mail/mail`; the store stays internal","status":"accepted","by":"agent","summary":"Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint.","body":"**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence.","tab":"Solution"},{"id":"D-062-9","title":"The hook writes one hookSpecificOutput object, carrying every fragment","status":"accepted","by":"agent","summary":"The existing hint path already emits at most one object per event; a second producer must join it, not write a second line.","body":"**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge.","tab":"Solution"}],"acs":[{"id":"AC-1","title":"G16 — the ontology lands before the code that uses it","phases":"1","tests":"auto-mail/mail/mail_test.go","body":"- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green"},{"id":"AC-2","title":"C1 — the epic's transcript runs verbatim","phases":"1,2","tests":"auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py","body":"- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `/agent`, or `unregistered/agent` outside a registered project"},{"id":"AC-3","title":"G1 — mail and events are immutable","phases":"2,5","tests":"auto-mail/internal/store/store_test.go","body":"- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)"},{"id":"AC-4","title":"G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor","phases":"2,4","tests":"auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go","body":"- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)"},{"id":"AC-5","title":"G3 — ack is a separate explicit call; reading does not retire","phases":"2,4","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go","body":"- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller"},{"id":"AC-6","title":"G13 / D-7 — ack transitions exactly once and reports whether it won","phases":"2,5","tests":"auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go","body":"- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint"},{"id":"AC-7","title":"G4 — at-least-once and unordered, as documented","phases":"4,5","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go","body":"- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide"},{"id":"AC-8","title":"G5 / D-9 — addresses are virtual and free-form","phases":"2,3","tests":"auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go","body":"- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)"},{"id":"AC-9","title":"G6 — send with no subscription persists, and reports both counts","phases":"4","tests":"auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py","body":"- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)"},{"id":"AC-10","title":"G8 — the nudge is free when there is no mail, and can never break the hook","phases":"3","tests":"auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py","body":"- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent"},{"id":"AC-11","title":"G10 / D-2 — alpha is in the type string and the filename, and reset works","phases":"1,5","tests":"auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go","body":"- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade"},{"id":"AC-12","title":"G11 — nothing outside the mail package reads the store","phases":"5","tests":"auto-mail/conformance/seam_test.go","body":"- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")"},{"id":"AC-13","title":"G15 — it passes end to end in the harness","phases":"1,2,3,4,5","tests":"harness/tests/mail_flow/test_mail_loop.py","body":"- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the send-before-subscribe case passes (AC-9's J2 half)\n- **And** every assertion uses bounded retry on the observable outcome, with no\n  `sleep`-to-settle and no assertion on counts that duplicates would break\n- **And** the scenario is registered in `harness/src/harness/cli.py`'s `SCENARIOS`\n  and adding it changed no existing scenario\n- **And** `make check` and `make test` are green from the repo root, with\n  `make test-race` green for the new `auto-mail` entry in `RACE_PROJECTS`"}],"phases":[{"n":"1","title":"Ontology, module skeleton, and the scenario comes up","files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","harness/tests/mail_flow/__init__.py","harness/tests/mail_flow/conftest.py","harness/tests/mail_flow/test_mail_loop.py"],"status":"done","body":"**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.\n\n1. **Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   with five entries in the house format (bold term, definition, `_Avoid_:`,\n   optional `_Has_:`):\n   - **Mail** — the stored unit of an addressed, durable message between agents.\n     `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n   - **Address** — a virtual, free-form name a Mail is sent to, carrying no\n     physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n     `_Has_`: many Subscriptions.\n   - **Subscription** — a durable reader of an Address, holding its own cursor\n     and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n     `_Has_`: many Deliveries, one Binding.\n   - **Delivery** — the per-Subscription copy of one Mail and its read/ack\n     state. `_Avoid_`: receipt, copy, inbox item.\n   - **Binding** — the current physical target and liveness of a Subscription,\n     recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n     link, attachment, route.\n   Then update the frontmatter `summary` to name the five new terms.\n   **Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   exits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\n   refreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n   **Do not hand-edit the generated ER block.**\n\n2. **Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\n   copying `auto-artifact/`'s shape: `go.mod`\n   (`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n   `replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n   `modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n   `internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n   `internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\n   dir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n   `auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n   **Verify:** `cd auto-mail && go build ./...` after each file, per the project's\n   Go build discipline.\n\n3. **The store, minimal.** `internal/store/store.go`: `Open(path)` with\n   `os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n   `auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n   `busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n   `WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n   `schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n   `subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\n   creating the full shape now avoids a migration inside the task).\n   **Verify:** a store test that opens, migrates twice (idempotent) and closes.\n\n4. **The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\n   all six methods, the input/result types matching the C1 payloads, and sentinel\n   errors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\n   implementation where `List` works (returning an empty slice against a fresh\n   store) and the other four return a `not implemented in this phase` error.\n   Everything else stays under `internal/`, so no other module can reach the\n   store (D-062-8).\n\n5. **CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n   `EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n   `{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\n   reference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n   (JSON array on stdout, `[]` when empty).\n   `internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n   `[]` and writes nothing to stdout but JSON.\n   `auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\n   identifier, table name or event type in the module names the stored unit\n   `message` (the `--message` body flag is explicitly allowed).\n\n6. **Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\n   require + local replace; `auto-cli/cmd/auto/main.go` imports\n   `mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n   `mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n   `auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\n   table (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n   **Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.\n\n7. **The scenario comes up (the epic's second of three things).**\n   `harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\n   monorepo source with context `../../..`, mirroring\n   `harness/scenarios/event-flow/Dockerfile`.\n   `docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\n   healthcheck gating on `/tmp/mail-ready.json`.\n   `scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\n   empty commit + `auto init --project` in **both** `/workspace/project-a` and\n   `/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n   `harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\n   with `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\n   fail-fasts with a diagnostic if the ready file is missing, either workspace is\n   unregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\n   a `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\n   workspace (base64-piped, per the event-flow convention).\n   Register `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n   `harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\n   session-scoped fixture plus one test asserting the stack is up, both\n   workspaces are registered, and `auto mail list` returns `[]` from each.\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   from the repo root `make check` and `make test`; from `harness/`\n   `uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n   `uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\n   scenarios are untouched.\n   **Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`."},{"n":"2","title":"One message travels between two agents and is acked","files":["auto-mail/internal/store/schema.go","auto-mail/internal/store/events.go","auto-mail/internal/store/project.go","auto-mail/internal/store/store_test.go","auto-mail/internal/ulid/ulid.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/address.go","auto-mail/mail/binding.go","auto-mail/mail/mail_test.go","auto-mail/internal/cli/subscribe.go","auto-mail/internal/cli/send.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/ack.go","auto-mail/internal/cli/cli_test.go","harness/src/harness/scenarios/mail_flow.py","harness/tests/mail_flow/test_mail_loop.py"],"status":"done","depends-on":"1","body":"The epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.\n\n1. **Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\n   lexicographically sortable **within one process** (the cross-host merge\n   property `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n   `sub_` + the ULID's leading 8 chars.\n   **Verify:** a test asserting monotonicity across 10k ids in one process and\n   sort order matching generation order — and scoped to say so, because that\n   ordering does not survive a process boundary and nothing in the store may\n   rest on it. Ordering the store depends on comes from the log's own `seq`\n   (see the cursor, below).\n\n2. **Events.** `internal/store/events.go`: the four `alpha.*` types —\n   `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n   `alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n   `Append(tx, ev)` as the **only** writer of the `events` table. Add the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n   `schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.\n\n3. **Projection.** `internal/store/project.go`, all inside one\n   `BEGIN IMMEDIATE` transaction per operation:\n   - `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n     (address + `from_cursor`) and its binding row.\n   - `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n     carrying the `seq` of that event as the store's own ordering of mail. It\n     writes **no** `deliveries` rows: materialisation is the read path's, and\n     only the read path's (D-10). Send additionally *reads* the two counts it\n     reports and the bindings whose pending flag the mail should raise.\n   - `list` → materialise any missing `deliveries` rows from each subscription's\n     `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n     `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n     nothing; return unacked rows.\n   - `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n     AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n     `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).\n\n4. **Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n   `/` explicitly allowed and never normalised (D-9); rejects empty,\n   whitespace-padded, control characters and over-length, each with a remediation\n   message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n   `tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\n   opaque pair. **Neither ever writes physical identity into an address or an\n   envelope** (G5).\n\n5. **The direct client.** Implement the remaining five `Client` methods in\n   `mail/direct.go` over the projection, returning exactly the C1 payload shapes.\n   The sender's `from` follows the three-rung ladder: `--from` → the address of a\n   subscription bound to the caller's `(manager, target)` (lowest subscription id\n   when several) → the literal `/agent` from the registry, or\n   `unregistered/agent` outside a registered project. Always a resolved absolute\n   address, never a relative handle.\n\n6. **The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n   `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n   (`--address`, `--subscription`; unfiltered returns every unacked delivery for\n   every subscription bound to the caller), `ack.go` (positional mail id;\n   `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\n   with a remediation hint for an unknown id).\n   `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\n   exact payloads and that stdout is pure JSON.\n\n7. **The harness proves it (G15).** Extend `mail_flow.py` with\n   `subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n   `test_mail_loop.py` with the C1 loop across the two workspaces:\n   **project-a subscribes to its own reply address first** (so `from` resolves by\n   rung 2, as C1 shows), project-b subscribes to the target address, project-a\n   sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\n   presence of the mail id, never on counts (G4 permits duplicates).\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`."},{"n":"3","title":"The in-band nudge reaches a working agent","files":["auto-mail/mail/pending.go","auto-mail/mail/binding.go","auto-mail/mail/mail_test.go","auto-mail/internal/config/settings.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/ack.go","auto-cli/cmd/auto/hints.go","auto-cli/cmd/auto/hookscmd.go","auto-cli/cmd/auto/hints_test.go","auto-cli/cmd/auto/hooksmail_test.go","harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","harness/src/harness/scenarios/mail_flow.py","harness/tests/mail_flow/test_mail_loop.py"],"status":"done","depends-on":"2","body":"The riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.\n\n1. **The pending flag.** `mail/pending.go`:\n   `flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\n   bytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n   `HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\n   every error — missing dir, permission denied — as \"no mail\". Add\n   `NudgeText() string`, a **constant**: an instruction to run `auto mail list`\n   and `auto mail ack` when acted on, with **no** interpolation of sender,\n   address, subject or body (G14's content rule, adopted for the in-band channel).\n   Wire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\n   subscriptions have nothing unacked left — the self-healing loop that bounds\n   flag drift (D-062-3).\n   **Verify:** `mail_test.go` — a counting store-opener injected over the package\n   var proves `HasPending` performs **zero** opens on both paths; flag lifecycle\n   across send → list → ack; a false-positive flag causes one `list` and then\n   clears itself.\n\n2. **Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\n   change `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\n   fragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\n   add `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\n   which writes **exactly one** `hookResponse` object, or nothing when every\n   fragment is empty. Update `hints_test.go` for the split — the behavioural\n   assertions carry over unchanged.\n\n3. **Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n   `matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n   `mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\n   fragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\n   stays inside the never-return-an-error region — any failure is swallowed and\n   the hook still exits 0.\n\n4. **Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\n   nudge emitted only when the flag exists; only on `PostToolUse`; **one**\n   `hookSpecificOutput` object when a hint rule also matches, with mail first;\n   exit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\n   file; and — the observable form of G8 — firing hooks on a `HOME` where\n   `auto mail init` never ran leaves `alpha-store.db` **non-existent**.\n\n5. **The harness proves it.** Add\n   `harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\n   PostToolUse payload, `cwd` patched per fire, mirroring\n   `event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n   `mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\n   returns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n   `test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n   `hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\n   the next fire emits nothing.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`;\n   `cd auto-cli && go test ./...`; repo-root `make check && make test`;\n   `uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n   (the hints change touches a path `event-flow` exercises — prove it is intact).\n   **Commit** `feat(062): in-band mail nudge on hook fire at stat cost`."},{"n":"4","title":"Delivery semantics and the Client conformance suite","files":["auto-mail/conformance/conformance.go","auto-mail/conformance/conformance_test.go","auto-mail/internal/store/project.go","auto-mail/internal/store/store_test.go","auto-mail/mail/direct.go","auto-mail/internal/cli/subscribe.go","auto-mail/internal/cli/send.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/ack.go","auto-mail/internal/cli/cli_test.go","harness/src/harness/scenarios/mail_flow.py","harness/tests/mail_flow/test_mail_loop.py"],"status":"done","depends-on":"3","body":"The call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).\n\n1. **Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\n   the store's own high-water mark, `MAX(mail.seq)` read inside the same\n   `BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\n   the beginning of the log), and report `backfilled` as the count of unacked\n   mail the new cursor admits.\n\n   The cursor is a log position, **never a minted id**. A `--from-now` cursor of\n   `ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\n   ordering *between processes*, and D-11 makes every verb its own process: two\n   ids drawn in the same millisecond share a timestamp prefix and draw\n   independent tails, so a mail could sort below the cursor and be admitted by\n   nothing, ever. The write lock is what makes a high-water mark true instead.\n   **Verify:** send to an unsubscribed address, subscribe afterwards, `list`\n   returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n   `backfilled` is 0.\n\n2. **Broadcast (D-7).** Two subscriptions on one address each get their own\n   `deliveries` row and their own ack state; acking one leaves the other unacked.\n   **Verify:** `store_test.go` plus a conformance case.\n\n3. **Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n   `bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n   `0/0` for an unknown address, persists the mail, and writes the\n   likely-typo hint to **stderr** only.\n\n4. **The conformance suite.** `auto-mail/conformance/conformance.go` — a\n   `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n   `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\n   the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\n   appending no second event, backfill-on-subscribe both ways,\n   subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\n   with a separator. `conformance_test.go` runs it against `NewDirect`.\n   **Deliberately absent: any assertion about ordering** (G4).\n\n5. **The harness proves the J2 half.** Extend `test_mail_loop.py` with\n   send-before-subscribe across the two workspaces: project-a sends to an address\n   nobody holds, project-b subscribes afterwards and receives it.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`."},{"n":"5","title":"Rails made executable: immutability, the ack race, reset, the seam guard, docs","files":["auto-mail/internal/store/store_test.go","auto-mail/internal/cli/reset.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/cli/docs.go","auto-mail/conformance/seam_test.go","auto-mail/CLAUDE.md","Makefile","harness/CLAUDE.md"],"status":"done","depends-on":"4","body":"Everything the guard rails assert but nothing so far has been forced to prove.\n\n1. **Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\n   before a `list` + `ack` cycle and assert byte-identical rows after; assert the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\n   assert the ack appears as a **new** `alpha.mail.acked` row.\n\n2. **The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n   `Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\n   event, and every caller seeing `acked: true`. Plus a concurrent-writer test:\n   N processes' worth of goroutines sending to one address lose no events and\n   leave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n   `Makefile`.\n   **Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).\n\n3. **Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n   `alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\n   without `--yes` on a non-empty store with a remediation hint.\n   **Verify:** `cli_test.go` — reset then the C1 loop again from empty.\n\n4. **The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\n   repo root by walking up for `go.work` (skip the test if absent, so a\n   standalone module checkout still passes), then walk every module's Go source,\n   `harness/` and `skills/`, asserting that the **mail store** is named nowhere\n   outside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n   `~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\n   either. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n   `auto-search` import it for their own stores and would fail the guard on day\n   zero. Also assert no package outside `auto-mail` imports\n   `auto-mail/internal/...` (a regression guard over what the compiler already\n   enforces). Failure names the offending file and says \"go through\n   mail.Client\".\n\n5. **The alpha contract in writing (G10, G4).** `internal/cli/docs.go` and\n   `auto-mail/CLAUDE.md` both state, in as many words: **at-least-once,\n   unordered, consumers must be idempotent on mail id**; and **alpha — no\n   upcasters, no migrations, no compatibility guarantee, the store may be wiped\n   on upgrade, `reset` is supported**. `auto-mail/CLAUDE.md` also records the one\n   deliberate exception to `docs/auto-package-patterns.md` (D-062-8) so the next\n   package author does not read it as licence, and notes that `quickstart` and\n   `doctor` are epic task T4's.\n\n6. **Harness docs.** Add the `mail-flow` scenario to `harness/CLAUDE.md`'s\n   Scenarios section alongside `skill-remote` and `event-flow`, including why it\n   is one container (D-062-1).\n\n7. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check`, `make test`, `make test-race`; from `harness/`\n   `uv run pytest -v` (all three scenarios). Run `auto doc fix` if any doc\n   frontmatter drifted. **Commit**\n   `feat(062): mail immutability, ack-race, reset, seam guard and the alpha contract`.\n   Open the PR."}],"files":[{"path":"docs/concepts/UBIQUITOUS_LANGUAGE.md","change":"edit","why":"G16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary.","before":106,"after":140},{"path":"auto-mail/go.mod","change":"add","why":"module github.com/mistakenot/auto-mail; replace auto-shared => ../auto-shared; modernc.org/sqlite + cobra.","before":null,"after":25},{"path":"auto-mail/go.sum","change":"add","why":"Checksums for the dependency set (all already present elsewhere in the workspace).","before":null,"after":61},{"path":"auto-mail/CLAUDE.md","change":"add","why":"Tool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped).","before":null,"after":113},{"path":"auto-mail/cmd/automail/main.go","change":"add","why":"Minimal entry point delegating to cli.Execute.","before":null,"after":12},{"path":"auto-mail/rootcmd/rootcmd.go","change":"add","why":"New(stdout, stderr) façade so auto-cli can mount `auto mail`.","before":null,"after":19},{"path":"auto-mail/internal/app/app.go","change":"add","why":"App context (stdout, stderr, cwd), per the blueprint.","before":null,"after":14},{"path":"auto-mail/internal/cli/root.go","change":"add","why":"Root cobra command, ExitError, Execute; wires the subcommands.","before":null,"after":88},{"path":"auto-mail/internal/cli/init.go","change":"add","why":"`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store.","before":null,"after":54},{"path":"auto-mail/internal/cli/docs.go","change":"add","why":"`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer.","before":null,"after":120},{"path":"auto-mail/internal/cli/subscribe.go","change":"add","why":"`auto mail subscribe <address> [--from-now] [--name]`; records the caller's binding.","before":null,"after":51},{"path":"auto-mail/internal/cli/send.go","change":"add","why":"`auto mail send --to --message [--body] [--from]`; resolves the sender's absolute from-address.","before":null,"after":96},{"path":"auto-mail/internal/cli/list.go","change":"add","why":"`auto mail list [--address] [--subscription]`; all bound subscriptions when unfiltered; clears a stale flag.","before":null,"after":52},{"path":"auto-mail/internal/cli/ack.go","change":"add","why":"`auto mail ack <mail-id>`; prints wonTransition, exit 0 on a lost race (D-062-7).","before":null,"after":59},{"path":"auto-mail/internal/cli/reset.go","change":"add","why":"`auto mail reset [--yes]`; removes the store and flag directory, reports what it removed.","before":null,"after":97},{"path":"auto-mail/internal/cli/cli_test.go","change":"add","why":"Command-level tests against a temp HOME asserting the exact C1 payload shapes and the error paths.","before":null,"after":862},{"path":"auto-mail/internal/config/settings.go","change":"add","why":"Store and flag paths under ~/.auto/mail/, settings load/validate via auto-shared/config.","before":null,"after":70},{"path":"auto-mail/mail/client.go","change":"add","why":"The public seam: Client interface, inputs/results, domain types, sentinel errors. The only exported package.","before":null,"after":159},{"path":"auto-mail/mail/direct.go","change":"add","why":"NewDirect: the direct-store implementation D-11 binds the MVP CLI to.","before":null,"after":355},{"path":"auto-mail/mail/address.go","change":"add","why":"ValidateAddress — permissive, separator explicitly allowed and never normalised (D-9).","before":null,"after":51},{"path":"auto-mail/mail/binding.go","change":"add","why":"BindingFor: the (manager, target) ladder over hooks.CaptureContext (D-062-2).","before":null,"after":75},{"path":"auto-mail/mail/pending.go","change":"add","why":"The pending-flag file: Set/Clear/HasPending (stat only) and NudgeText (a fixed constant).","before":null,"after":112},{"path":"auto-mail/mail/mail_test.go","change":"add","why":"Address validation, binding ladder, flag lifecycle, and the zero-store-opens assertion via an injected counting opener.","before":null,"after":714},{"path":"auto-mail/internal/store/store.go","change":"add","why":"Open (MkdirAll, sql.Open, WAL + busy_timeout + foreign_keys), Close, single write connection, transaction helper.","before":null,"after":107},{"path":"auto-mail/internal/store/schema.go","change":"add","why":"DDL: events (+ append-only triggers), mail (+ immutability trigger), subscriptions, deliveries, bindings, indexes, schema_migrations.","before":null,"after":199},{"path":"auto-mail/internal/store/events.go","change":"add","why":"The alpha.mail.* event types, the versioned envelope, and the append path (the only writer of `events`).","before":null,"after":132},{"path":"auto-mail/internal/store/project.go","change":"add","why":"Same-transaction projection: mail insert, lazy delivery materialisation from the cursor, read stamp, ack compare-and-set, binding upsert.","before":null,"after":758},{"path":"auto-mail/internal/store/store_test.go","change":"add","why":"Immutability (triggers abort UPDATE/DELETE), cursor backfill, broadcast fan-out, and the concurrent-writer test run under -race.","before":null,"after":1236},{"path":"auto-mail/internal/ulid/ulid.go","change":"add","why":"Sender-generated ids, monotonic and sortable within one process — the cross-host merge property the backlog names. Not the store's ordering: cursors use the log's `seq`.","before":null,"after":159},{"path":"auto-mail/conformance/conformance.go","change":"add","why":"The Client contract suite, written against the interface: explicit ack, wonTransition, backfill-on-subscribe, subscriptions-vs-bound, idempotent re-ack.","before":null,"after":460},{"path":"auto-mail/conformance/conformance_test.go","change":"add","why":"Runs the suite against the direct-store implementation; T3 adds the RPC one as a second target.","before":null,"after":29},{"path":"auto-mail/conformance/seam_test.go","change":"add","why":"AC-12 guard: walks the repo (located via go.work) asserting the store filename and sqlite imports appear only under auto-mail/internal/store.","before":null,"after":177},{"path":"auto-cli/cmd/auto/main.go","change":"edit","why":"Import mailcmd and add mailcmd.New(stdout, stderr) to root.AddCommand.","before":109,"after":111},{"path":"auto-cli/cmd/auto/hints.go","change":"edit","why":"Split emission from matching: matchHint returns the rendered fragment; emitAdditionalContext writes exactly one hookSpecificOutput object for all fragments.","before":188,"after":220},{"path":"auto-cli/cmd/auto/hookscmd.go","change":"edit","why":"After the existing sinks, stat the pending flag for the firing agent's binding and prepend the fixed mail fragment to the single emission.","before":393,"after":432},{"path":"auto-cli/cmd/auto/hints_test.go","change":"edit","why":"Update for the matchHint/emitAdditionalContext split; existing behaviour assertions unchanged.","before":421,"after":513},{"path":"auto-cli/cmd/auto/hooksmail_test.go","change":"add","why":"Hook-side tests: nudge emitted only with a flag and only on PostToolUse, one emission when a hint also matches, exit 0 with an absent/unreadable store, and no store file created.","before":null,"after":302},{"path":"auto-cli/go.mod","change":"edit","why":"Require github.com/mistakenot/auto-mail with a local replace directive.","before":91,"after":94},{"path":"auto-cli/go.sum","change":"edit","why":"Checksums for the new module edge.","before":212,"after":212},{"path":"go.work","change":"edit","why":"Add ./auto-mail to the use block.","before":17,"after":18},{"path":"Makefile","change":"edit","why":"Add auto-mail to PROJECTS and to RACE_PROJECTS (the ack race and concurrent writers must run under -race).","before":371,"after":376},{"path":"CLAUDE.md","change":"edit","why":"Add the auto-mail row to the Sub-Projects table.","before":337,"after":343},{"path":"harness/scenarios/mail-flow/Dockerfile","change":"add","why":"Builds the real auto binary from monorepo source (context ../../..) into a single host image.","before":null,"after":28},{"path":"harness/scenarios/mail-flow/docker-compose.yaml","change":"add","why":"One `host` service, init: true, healthcheck gating on the mail-ready file.","before":null,"after":25},{"path":"harness/scenarios/mail-flow/scripts/host-entrypoint.sh","change":"add","why":"Seeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file.","before":null,"after":30},{"path":"harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","change":"add","why":"A minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern).","before":null,"after":9},{"path":"harness/src/harness/scenarios/mail_flow.py","change":"add","why":"MailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry.","before":null,"after":362},{"path":"harness/src/harness/cli.py","change":"edit","why":"One line registering mail-flow in SCENARIOS.","before":92,"after":100},{"path":"harness/tests/mail_flow/__init__.py","change":"add","why":"Package marker, mirroring tests/event_flow.","before":null,"after":0},{"path":"harness/tests/mail_flow/conftest.py","change":"add","why":"Session-scoped fixture: up(build=True) then down() at teardown.","before":null,"after":20},{"path":"harness/tests/mail_flow/test_mail_loop.py","change":"add","why":"AC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion.","before":null,"after":361},{"path":"harness/CLAUDE.md","change":"edit","why":"Document the mail-flow scenario alongside skill-remote and event-flow.","before":137,"after":176}],"threads":[{"anchor":"D-062-2","status":"resolved","priority":"p1","title":"Binding freshness conflicts with the stat-only hook path","comments":[{"by":"review","text":"D-062-2 says every hoo
