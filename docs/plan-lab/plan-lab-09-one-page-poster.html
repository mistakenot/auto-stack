gainst fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`."}, {"id": "D-7", "title": "F5 final shape: top-level id on mutations, per-element id on reads", "status": "accepted", "by": "charlie", "summary": "Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.", "tab": "Solution", "body": "**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array."}, {"id": "D-8", "title": "Content-derived ids: rules + observations only", "status": "accepted", "by": "charlie", "summary": "r-/ob- become content hashes; rt-/fb-/ev- stay random.", "tab": "Solution", "body": "**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids."}, {"id": "D-9", "title": "Pure content hash, no collision suffix", "status": "accepted", "by": "charlie", "summary": "id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.", "tab": "Solution", "body": "**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks)."}], "acs": [{"id": "AC-1", "title": "gap list surfaces reported gaps (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "body": "**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted."}, {"id": "AC-2", "title": "gap list obeys list conventions (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "body": "**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available."}, {"id": "AC-3", "title": "One pending count, two callers agree (F2)", "phases": "4", "tests": "auto-reflect/internal/cli/miner_integration_test.go", "body": "**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged."}, {"id": "AC-4", "title": "Mutating commands expose a top-level id (F5)", "phases": "1,2,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go", "body": "**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)"}, {"id": "AC-5", "title": "Collection commands expose .[].id without data loss (F5)", "phases": "1,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go", "body": "**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths."}, {"id": "AC-6", "title": "Content-derived ids make consolidate deterministic + idempotent (F7)", "phases": "1,2", "tests": "auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go", "body": "**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists."}, {"id": "AC-7", "title": "Ids keep their format (F7/D-6)", "phases": "1,2", "tests": "auto-reflect/internal/idhash/idhash_test.go", "body": "**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids."}, {"id": "AC-8", "title": "init writes an idempotent .gitignore (F9)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "body": "**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it."}, {"id": "AC-9", "title": "Canonical events tracked, cache ignored (F9/D-2)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "body": "**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked)."}, {"id": "AC-10", "title": "doctor detects stale/partial state (F1)", "phases": "6", "tests": "auto-reflect/internal/cli/doctor_integration_test.go", "body": "**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail."}, {"id": "AC-11", "title": "Rule listings carry timestamps (F6)", "phases": "3", "tests": "auto-reflect/internal/rules/projection_test.go", "body": "**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto reflect rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map)."}, {"id": "AC-12", "title": "outcome enum + correction_density documented (F8/F3)", "phases": "7", "tests": "", "body": "**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set."}, {"id": "AC-13", "title": "Legacy yaml removed (F11)", "phases": "7", "tests": "", "body": "**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove."}, {"id": "AC-14", "title": "No regressions (cross-cutting)", "phases": "1,2,3,4,5,6,7", "tests": "auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go", "body": "**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`."}], "threads": [{"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`feedback` can't expose a minted top-level id without a service.go change not in the plan", "tab": "Verification", "comments": [{"by": "review", "text": "AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes."}, {"by": "author", "text": "Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope)."}]}, {"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes", "tab": "Verification", "comments": [{"by": "review", "text": "AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`."}, {"by": "author", "text": "Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list."}]}, {"anchor": "AC-13", "status": "resolved", "priority": "p3", "title": "`no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills", "tab": "Verification", "comments": [{"by": "review", "text": "The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove."}, {"by": "author", "text": "Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match."}]}, {"anchor": "end-state", "status": "resolved", "priority": "p2", "title": "gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists", "tab": "Solution", "comments": [{"by": "review", "text": "The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`."}, {"by": "author", "text": "Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id."}]}, {"anchor": "auto-reflect/internal/rules/model.go", "status": "resolved", "priority": "p1", "title": "Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id", "tab": "Solution", "comments": [{"by": "review", "text": "There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan."}, {"by": "author", "text": "Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2."}]}, {"anchor": "auto-reflect/internal/observations/model.go", "status": "resolved", "priority": "p3", "title": "Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set", "tab": "Solution", "comments": [{"by": "review", "text": "Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered."}, {"by": "author", "text": "Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately."}]}], "files": [{"path": "auto-reflect/internal/idhash/idhash.go", "change": "add", "note": "Content-hash id helper (F7)."}, {"path": "auto-reflect/internal/idhash/idhash_test.go", "change": "add", "note": "Determinism + format tests (F7)."}, {"path": "auto-reflect/internal/cli/gap.go", "change": "add", "note": "`gap list` command (F4)."}, {"path": "auto-reflect/internal/cli/gap_integration_test.go", "change": "add", "note": "gap list integration tests (F4)."}, {"path": "auto-reflect/internal/cli/doctor.go", "change": "add", "note": "`doctor` command (F1)."}, {"path": "auto-reflect/internal/cli/doctor_integration_test.go", "change": "add", "note": "doctor integration tests (F1)."}, {"path": "auto-reflect/internal/cli/output.go", "change": "add", "note": "Uniform mutation-result envelope helpers (F5)."}, {"path": "auto-reflect/internal/cli/root.go", "change": "edit", "note": "Register `gap` + `doctor` commands."}, {"path": "auto-reflect/internal/rules/model.go", "change": "edit", "note": "`NewRuleID(parts…)` content-derived via idhash (F7)."}, {"path": "auto-reflect/internal/observations/model.go", "change": "edit", "note": "`NewObservationID(parts…)` content-derived incl. evidence (F7)."}, {"path": "auto-reflect/internal/observations/model_test.go", "change": "edit", "note": "Update zero-arg id test for the variadic signature (F7)."}, {"path": "auto-reflect/internal/loop/service_test.go", "change": "edit", "note": "Update zero-arg `NewRuleID` call for the variadic signature (F7)."}, {"path": "auto-reflect/internal/cli/consolidate.go", "change": "edit", "note": "Feed content to id mint; top-level `ids`; deterministic dry-run id (F5/F7)."}, {"path": "auto-reflect/internal/cli/observation.go", "change": "edit", "note": "Top-level `id` on add; per-element `id` on list (F5)."}, {"path": "auto-reflect/internal/cli/rule.go", "change": "edit", "note": "Top-level `id` on mutations; `created_at`/`updated_at` in list map (F5/F6)."}, {"path": "auto-reflect/internal/cli/retrieve.go", "change": "edit", "note": "Per-element top-level `id` (F5)."}, {"path": "auto-reflect/internal/cli/select.go", "change": "edit", "note": "Per-element top-level `id` (F5)."}, {"path": "auto-reflect/internal/cli/feedback.go", "change": "edit", "note": "Top-level `id`/`ids` on the recorded feedback (F5)."}, {"path": "auto-reflect/internal/cli/miner.go", "change": "edit", "note": "Replace hand-rolled pending loop with `miner.PendingCount` (F2)."}, {"path": "auto-reflect/internal/cli/miner_integration_test.go", "change": "add", "note": "Pin `miner status` pending == `stats` pending_to_mine (F2)."}, {"path": "auto-reflect/internal/cli/init.go", "change": "edit", "note": ", "prio": "P1", "text": "`miner status` `pending` (390) ≠ `stats` `pending_to_mine` (396)", "fix": "Collapse both onto **one shared counting function** (single source of truth); document exactly which session universe it counts.", "ac": ["AC-3"]}, {"id": "F5", "prio": "P2", "text": "Each command nests its minted id differently; `rule promote` top-level `.id` is `null`", "fix": "**Restructure to a uniform output envelope** with a predictable top-level `.id` / `.ids` (and `.[].id` for collection results). Breaking change to the CLI output contract.", "ac": ["AC-4", "AC-5"]}, {"id": "F7", "prio": "", "text": "Dry-run ids ≠ apply ids, so you can't pre-stage `promote`", "fix": "Mint rule & observation ids as **deterministic content hashes** so `--dry-run` == apply. Existing id *formats* preserved.", "ac": ["AC-6", "AC-7"]}, {"id": "F9", "prio": "", "text": "`.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked)", "fix": "`auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**.", "ac": ["AC-8", "AC-9"]}, {"id": "F1", "prio": "", "text": "Stale/partial init state undetected (dir exists, no `events/`; legacy 0-byte `feedback.jsonl`)", "fix": "Add init / `doctor` detection of stale or partial reflect state with a concrete remediation hint.", "ac": ["AC-10"]}, {"id": "F6", "prio": "", "text": "Rule `created_at` / `updated_at` come back `\"\"` / `null`", "fix": "Populate them in the rules projection from the underlying event timestamps (`Event.TS`) — no new stored data needed.", "ac": ["AC-11"]}, {"id": "F8/F3", "prio": "P3", "text": "`outcome` enum & `correction_density` undocumented", "fix": "Document the `outcome` enum (`success|partial|fail|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`.", "ac": ["AC-12"]}, {"id": "F11", "prio": "", "text": "Legacy `docs/ const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inl(s){ // inline markdown → html (code, bold, italic)
  return String(s ?? '').split('`').map((p,i)=> i%2 ? '<code>'+esc(p)+'</code>'
    : esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g,'$1<i>$2</i>')).join('');
}
function md(s){
  if(!s) return '';
  if(window.marked){ try{ return marked.parse(s,{gfm:true,breaks:false}).replace(/href="\.\.\/\.\.\//g,'href="'); }catch(e){} }
  return s.split(/\n{2,}/).map(p=>'<p>'+inl(p)+'</p>').join('');
}
const splitDec = b => String(b||'').replace(/\n\*\*(Decision|Alternatives|Consequences):\*\*/g,'\n\n**$1:**');
const plain = s => String(s ?? '').replace(/`/g,'').replace(/\*\*/g,'').replace(/(^|\s)\*(\S)/g,'$1$2').replace(/(\S)\*(\s|$)/g,'$1$2');
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if(a) for(const [k,v] of Object.entries(a)){
    if(v==null||v===false) continue;
    if(k==='html') e.innerHTML=v; else if(k==='style' && typeof v==='object') Object.assign(e.style,v); else e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null && c!==false) e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function s(tag,a,...kids){ const e=document.createElementNS(SVGNS,tag); if(a) for(const [k,v] of Object.entries(a)) if(v!=null) e.setAttribute(k,v); for(const c of kids.flat()) if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); return e; }
const firstSentence = t => { const parts = String(t).split(/(?<=[.!?])\s+/); let out=''; for(const p of parts){ out+=(out?' ':'')+p; if(out.length>=40) break; } return out; };

/* ================= model per plan ================= */
function model(key){
  const R = D.plans[key].raw, P = D.plans[key].poster;
  const sec = id => R.sections.find(x=>x.id===id) || {body:''};
  const phases = R.phases.map(p=>({n:+p.n, title:p.title, status:p.status, deps:(p['depends-on']||'').split(',').filter(Boolean).map(Number), files:p.files.split(',').map(f=>f.trim()), body:p.body}));
  const crit = {}; // success criteria per phase
  sec('success-criteria').body.split(/\n(?=- )/).forEach(b=>{ const m=b.match(/^- \*\*P(\d)\*\*\s*→\s*([\s\S]*)$/); if(m) crit[+m[1]]={text:m[2].replace(/\s+/g,' ').trim(), acs:[...new Set(m[2].match(/AC-\d+/g)||[])]}; });
  const threads = R.threads.map((t,i)=>({...t, no:i+1}));
  const hind = (P.hind||[]).map((x,i)=>({...x, no:String.fromCharCode(65+i)}));
  const risks = [];
  sec('verification-gaps').body.split(/\n(?=- \*\*)/).forEach(b=>{ const m=b.match(/^- \*\*(.+?)\*\*\s*([\s\S]*)$/); if(m) risks.push({lead:m[1], text:b.replace(/^- /,'')}); });
  const alt = d => { const m=(d.body||'').match(/\*\*Alternatives:\*\*\s*([\s\S]*?)(?=\n\*\*[A-Z][a-z]+:\*\*|$)/); return m? m[1].replace(/\s+/g,' ').trim() : ''; };
  const decisions = R.decisions.map(d=>({...d, alt:alt(d)}));
  return {key,R,P,sec,phases,crit,threads,hind,risks,decisions};
}

function offTop(el, root){ let y=0; while(el && el!==root){ y+=el.offsetTop; el=el.offsetParent; } return y; }
function finishPoster(po){
  const {notes, Dn, tail} = po._notes;
  const base = 340, top0 = 36;
  notes.forEach(n=>{ Dn.append(n.el); const a = po.querySelector(`[data-anchor="${CSS.escape(n.anchor)}"]`); n.y = a ? offTop(a,po)-base-4 : top0; });
  notes.sort((a,b)=>a.y-b.y);
  let y = top0; const gap=10;
  notes.forEach(n=>{ n.el.style.top = Math.max(y,n.y)+'px'; y = Math.max(y,n.y) + n.el.offsetHeight + gap; });
  // pull up if overflowing into the tail block
  let limit = 1262 - tail.offsetHeight - 16;
  for(let i=notes.length-1;i>=0;i--){ const t=parseFloat(notes[i].el.style.top), hgt=notes[i].el.offsetHeight; if(t+hgt>limit){ notes[i].el.style.top=(limit-hgt)+'px'; } limit=parseFloat(notes[i].el.style.top)-gap; }
  if(po._rej.rejList.offsetHeight > po._rej.spacer.clientHeight) po._rej.rejList.remove(); else po.querySelector('.rej').style.display='none';
  const {box,M,K} = po._flow;
  if(M.P.flow==='seq') drawSeq(box,M,K); else drawLoop(box,M,K);
}

function drawSeq(box,M,K){
  const src = M.R.mermaid.find(m=>m.src.startsWith('sequenceDiagram')).src;
  const parts=[], msgs=[];
  src.split('\n').forEach(l=>{ l=l.trim(); let m;
    if(m=l.match(/^participant (\w+) as (.+)$/)) parts.push({id:m[1],label:m[2]});
    else if(m=l.match(/^(\w+)(-->>|->>)(\w+):\s*(.*)$/)) msgs.push({from:m[1],dash:m[2]==='-->>',to:m[3],lines:m[4].split('<br/>')}); });
  const W=640, Hh=box.clientHeight, pad=52, step=(W-pad*2)/(parts.length-1);
  const X = id => pad + parts.findIndex(p=>p.id===id)*step;
  const svg = s('svg',{width:W,height:Hh,style:'display:block'});
  const mid = 'ah'+M.key;
  svg.append(s('defs',null,s('marker',{id:mid,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},s('path',{d:'M0 0 L10 5 L0 10 z',fill:'var(--ink)'}))));
  const partKey = {M:'end-state-api',DB:'end-state-schema',FL:'end-state-api',HK:'approach',A:'target-transcript',B:'target-transcript'};
  const headH=40;
  // total height estimate → spacing
  const LH=10.4, totalLines = msgs.reduce((a,m)=>a+m.lines.length,0);
  const gapY = Math.max(2, Math.min(16, (Hh-headH-20-totalLines*LH)/msgs.length - 6));
  let y = headH+12;
  const lifeTop=headH, lifeBot=Hh-6;
  parts.forEach(p=>{ const x=X(p.id);
    svg.append(s('line',{x1:x,y1:lifeTop,x2:x,y2:lifeBot,stroke:'var(--hair)','stroke-width':1.2}));
    const [a,b] = p.label.includes(' (')? [p.label.slice(0,p.label.indexOf(' (')), p.label.slice(p.label.indexOf(' (')+1)] : [p.label,''];
    const g = s('g',{class:'k','data-k':K('sec',partKey[p.id])});
    g.append(s('rect',{x:x-step/2+4,y:0,width:step-8,height:headH-6,fill:p.id==='FL'||p.id==='DB'?'var(--paper2)':'var(--paper)',stroke:'var(--ink)','stroke-width':1.2}));
    g.append(s('text',{x,y:15,'text-anchor':'middle',class:'svs','font-size':11.5,'font-weight':700,fill:'var(--ink)'},a));
    if(b) g.append(s('text',{x,y:28,'text-anchor':'middle',class:'svt','font-size':7.6,fill:'var(--ink2)',textLength:b.length*4.6>step-16?step-16:null,lengthAdjust:'spacingAndGlyphs'},b));
    svg.append(g);
  });
  msgs.forEach((m,i)=>{
    const x1=X(m.from), x2=X(m.to), lx=Math.min(x1,x2)+6;
    const g = s('g',{class:'k','data-k':reg(K('seq',i),()=>({kick:'Sequence · Solution › How one message travels',title:`${m.from} ${m.dash?'-->>':'->>'} ${m.to}`,html:'<pre>'+esc(m.lines.join('\n'))+'</pre><p class="src">'+esc(M.R.mermaid.find(q=>q.src===src).caption)+'</p>'}))});
    g.append(s('rect',{x:Math.min(x1,x2),y:y-9,width:Math.abs(x2-x1),height:m.lines.length*LH+6,fill:'transparent'}));
    m.lines.forEach((t,j)=>{ const tw=t.length*5.8, over=lx+tw>W-2; g.append(s('text',{x:over?W-2:lx,y:y+j*LH,'text-anchor':over?'end':'start',class:'svt halo','font-weight':/no DB open|fixed text/.test(t)?600:400},t)); });
    const ay = y + (m.lines.length-1)*LH + 6;
    g.append(s('line',{x1,y1:ay,x2:x2+(x2>x1?-2:2),y2:ay,stroke:'var(--ink)','stroke-width':1.3,'stroke-dasharray':m.dash?'4 3':null,'marker-end':`url(#${mid})`}));

function drawLoop(box,M,K){

  const n=ST.length, a0=Math.PI; // observe at the left

    if(closing){ const am=(a1+a2)/2, [tx,ty]=[cx+(r-16)*Math.cos(am), cy+(r-16)*Math.sin(am)];
      const g=s('g',{class:'k','data-k':K('sec','problem')});

  });
  // mine → observe (entry)
  const ob=ST[0];
  const mx0=40, my0=ob.y;
  const mg=s('g',{class:'k','data-k':K('con','F2')});
  mg.append(s('path',{d:`M${mx0+25} ${my0} L${ob.x-40} ${ob.y}`,fill:'none',stroke:'var(--mute)','stroke-width':1.2,'marker-end':`url(#${mid})`}));
  mg.append(s('rect',{x:mx0-24,y:my0-10,width:48,height:20,rx:10,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':1.2}));
  mg.append(s('text',{x:mx0,y:my0+4,'text-anchor':'middle',class:'svt','font-size':11},'mine'));
  mg.append(s('text',{x:mx0-24,y:my0+28,class:'svs','font-size':10.5},s('tspan',{'font-weight':700},'F2 '),'one PendingCount:'));
  mg.append(s('text',{x:mx0-24,y:my0+41,class:'svs','font-size':10.5},'miner status = stats'));
  mg.append(s('text',{x:mx0-24,y:my0+56,class:'svs','font-size':10.5},s('tspan',{'font-weight':700},'F3 '),'correction_density'));
  mg.append(s('text',{x:mx0-24,y:my0+69,class:'svs','font-size':10.5},'documented'));
  svg.append(mg);
  // stations + annotations
  ST.forEach(st=>{
    const tw = st.n.length*6.7+18;
    const g=s('g',{class:'k','data-k':K('sec','approach')});
    g.append(s('rect',{x:st.x-tw/2,y:st.y-11,width:tw,height:22,rx:11,fill:st.isNew?'var(--ink)':'var(--paper)',stroke:'var(--ink)','stroke-width':st.isNew?0:1.3}));
    g.append(s('text',{x:st.x,y:st.y+4,'text-anchor':'middle',class:'svt','font-size':11,style:`fill:${st.isNew?'var(--paper)':'var(--ink)'}`,'font-weight':st.isNew?600:400},st.n));
    svg.append(g);
    const ca=Math.cos(st.a), sa=Math.sin(st.a);
    const above = st.n==='observe' || (Math.abs(ca)<=0.3 && sa<0), below = !above && Math.abs(ca)<=0.3 && sa>0;

    M.decisions.filter(d=>d.tab===tab).forEach(d=>{ w.append(h('div',{class:'x-item',id:K('dec',d.id)},h('div',{class:'x-id'},`${d.id} · ${d.status} · by ${d.by}`),h('h3',{html:inl(d.title)}),h('div',{class:'x-id',html:'<i>'+inl(d.summary)+'</i>'}),h('div',{class:'body',html:md(splitDec(d.body))}))); thrFor(d.id).forEach(t=>{w.append(side(t)); w.append(thrBlock(t));}); });
  });
  if(M.hind.length){ w.append(h('h2',null,'As executed — feedback.md')); M.hind.forEach(t=>w.append(h('div',{class:'x-item',id:K('hind',t.no)},h('div',{class:'x-id'},`note ${t.no} · near ${t.anchor}`),h('div',{class:'cm hb',html:'<div class="by">feedback.md · problems faced</div>'+md('**'+t.title+'** — '+t.text)})))); }
  textBuiltFor=key;
}
function openText(key, target){
  key = key || (view==='compare'?'062':view);
  if(textBuiltFor!==key) buildText(key);
  const el=document.getElementById('text'); el.classList.add('show'); hideTip(true);
  if(target){ const t=document.getElementById('x-'+target); if(t){ t.scrollIntoView({block:'start'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); } }
  else el.scrollTop=0;
  document.getElementById('bt').setAttribute('aria-pressed','true');
}
function closeText(){ document.getElementById('text').classList.remove('show'); document.getElementById('bt').removeAttribute('aria-pressed'); }

/* ================= stage: fit / zoom / pan ================= */
const stage=document.getElementById('stage'), world=document.getElementById('world');
let view='062', T={s:.5,x:0,y:0}, WW=2400, WH=1700;
function apply(anim){ world.classList.toggle('anim',!!anim); world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.s})`; stage.classList.toggle('zoomed',T.s>=fitScale()*1.4); document.getElementById('zv').textContent=Math.round(T.s*100)+'%'; }
function fitScale(){ const r=stage.getBoundingClientRect(); return Math.min((r.width-56)/WW,(r.height-(view==='compare'?150:56))/WH); }
function fit(anim){ const r=stage.getBoundingClientRect(), sc=fitScale(); T={s:sc,x:(r.width-WW*sc)/2,y:(r.height-WH*sc)/2+(view==='compare'?30:0)}; apply(anim); }
function zoomAt(px,py,ns,anim){ ns=Math.max(fitScale()*.6,Math.min(3,ns)); const wx=(px-T.x)/T.s, wy=(py-T.y)/T.s; T={s:ns,x:px-wx*ns,y:py-wy*ns}; apply(anim); }
function render(v){
  view=v; world.innerHTML=''; TIP.clear(); hideTip(true);
  const keys = v==='compare'?['062','052']:[v];
  keys.forEach((k,i)=>{ const plate=h('div',{class:'plate',style:{left:(i*(2400+220))+'px',top:'0'}}); if(v==='compare') plate.append(h('div',{class:'cap'},k==='062'?'062 · green field':'052 · brown field')); const po=buildPoster(k); plate.append(po); world.append(plate); finishPoster(po); });
  WW = keys.length*2400 + (keys.length-1)*220; WH=1700;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));
  document.title = v==='compare'?'062 vs 052 — One-Sheet Plans': (v==='062'?'062 auto-mail — One-Sheet Plan':'052 reflect — One-Sheet Plan');
  fit(false);
  if(document.getElementById('text').classList.contains('show')) openText(v==='compare'?'062':v);
}
// pointer: drag to pan, click to zoom, pinch
const pts=new Map(); let drag=null, pinch=null;
stage.addEventListener('pointerdown',e=>{ if(e.button!==0&&e.pointerType==='mouse') return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1) drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y,moved:false,target:e.target};
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:T.s}; drag=null; } });
stage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){ const [a,b]=[...pts.values()], r=stage.getBoundingClientRect(); zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){ drag.moved=true; stage.classList.add('dragging'); hideTip(); } if(drag.moved){ T.x=drag.tx+dx; T.y=drag.ty+dy; apply(false);} } });
function endPtr(e){ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); stage.classList.remove('dragging');
  if(pts.size<2) pinch=null;
  if(drag && !drag.moved && e.type==='pointerup'){
    const r=stage.getBoundingClientRect();
    const k = drag.target.closest && drag.target.closest('[data-k]');
    if(T.s < fitScale()*1.4 && !(k && e.pointerType!=='mouse')) zoomAt(e.clientX-r.left,e.clientY-r.top,Math.max(1,fitScale()*2.2),true);
    else if(k){ showTip(k.getAttribute('data-k'),e.clientX,e.clientY,true); }
    else hideTip(true);
  }
  drag=null; }
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); const f=Math.exp(-(e.ctrlKey?e.deltaY*3:e.deltaY)*0.0015); zoomAt(e.clientX-r.left,e.clientY-r.top,T.s*f,false); hideTip(); },{passive:false});
stage.addEventListener('dblclick',e=>{ e.preventDefault(); fit(true); });
window.addEventListener('resize',()=>fit(false));

/* ================= tooltip behaviour ================= */
const tip=document.getElementById('tip'); let pinned=false, curKey=null;
function showTip(key,x,y,pin){
  const fn=TIP.get(key); if(!fn) return;
  if(pinned && !pin) return;
  const d=fn(); curKey=key;
  tip.innerHTML=`<div class="tk"><span>${esc(d.kick||'')}</span><span class="x" title="close (Esc)">✕</span></div><div class="tt">${inl(d.title)}</div><div class="tb">${d.html||''}</div>`+(d.go?`<span class="go" data-go="${esc(d.go)}">Open in the full text →</span>`:'')+`<div class="pinhint">${T.s<fitScale()*1.4?'click to zoom in · ':''}click the mark to pin this card</div>`;
  tip.classList.add('show'); tip.classList.toggle('pinned',!!pin); pinned=!!pin;
  placeTip(x,y);
}
function placeTip(x,y){ const r=tip.getBoundingClientRect(), W=innerWidth, H=innerHeight; let tx=x+18, ty=y+16; if(tx+r.width>W-8) tx=Math.max(8,x-r.width-18); if(ty+r.height>H-8) ty=Math.max(56,H-r.height-8); tip.style.left=tx+'px'; tip.style.top=ty+'px'; }
function hideTip(force){ if(pinned&&!force) return; tip.classList.remove('show','pinned'); pinned=false; curKey=null; }
stage.addEventListener('mouseover',e=>{ if(drag&&drag.moved) return; const k=e.target.closest('[data-k]'); if(k) showTip(k.getAttribute('data-k'),e.clientX,e.clientY,false); });
stage.addEventListener('mousemove',e=>{ if(!pinned && tip.classList.contains('show')) placeTip(e.clientX,e.clientY); });
stage.addEventListener('mouseout',e=>{ const k=e.target.closest('[data-k]'); if(k && !(e.relatedTarget && k.contains(e.relatedTarget))) hideTip(); });
tip.addEventListener('click',e=>{ if(e.target.classList.contains('x')) hideTip(true); const g=e.target.closest('[data-go]'); if(g){ const [k,...rest]=g.dataset.go.split('|'); openText(k, k+'|'+rest.join('|')); } });

/* ================= controls ================= */
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ location.hash=b.dataset.view; }));
document.getElementById('zfit').onclick=()=>fit(true);
document.getElementById('z100').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1,true); };
document.getElementById('bt').onclick=()=>{ document.getElementById('text').classList.contains('show')?closeText():openText(); };
document.getElementById('bp').onclick=()=>window.print();
addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,textarea')) return;
  const r=stage.getBoundingClientRect();
  if(e.key==='Escape'){ hideTip(true); closeText(); }
  else if(e.key==='t'||e.key==='T') document.getElementById('bt').click();
  else if(e.key==='0'||e.key==='f') fit(true);
  else if(e.key==='1') zoomAt(r.width/2,r.height/2,1,true);
  else if(e.key==='+'||e.key==='=') zoomAt(r.width/2,r.height/2,T.s*1.3,true);
  else if(e.key==='-') zoomAt(r.width/2,r.height/2,T.s/1.3,true);
  else if(e.key==='c') location.hash='compare'; });
function fromHash(){ const v=(location.hash||'').replace('#',''); render(['062','052','compare'].includes(v)?v:'062'); }
addEventListener('hashchange',fromHash);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fromHash);
</script>
