, {"id": "source", "title": "Source", "summary": "", "tab": "Requirements", "md": "- Spike findings: `.tmp/reflect-playbook-spike-findings.md` (throwaway/demo run,\n  2026-06-28; executor session `518b6d9a`).\n- Tool: `auto-reflect/` (`reflect version v0.24.0-21-ge183760`).", "blocks": [{"kind": "md", "text": "- Spike findings: `.tmp/reflect-playbook-spike-findings.md` (throwaway/demo run,\n  2026-06-28; executor session `518b6d9a`).\n- Tool: `auto-reflect/` (`reflect version v0.24.0-21-ge183760`)."}]}, {"id": "test-strategy", "title": "Test Strategy", "summary": "", "tab": "Verification", "md": "The module already has the harnesses we need — lean on them rather than inventing\nnew ones:\n\n- **Unit** — pure-function changes: content-derived id determinism\n  (`rules`/`observations` model tests), `Fold` timestamp population\n  (`projection_test.go`), the single shared pending-count function\n  (`miner` test), feedback-gap projection for `gap list`.\n- **Integration** — CLI output contracts via the existing\n  `*_integration_test.go` (events, observation, consolidate) and a new\n  `gap`/`doctor` integration test. These assert the **new uniform envelope** and\n  are where most of the F5 churn lands (every output-shape assertion moves to\n  `.id`/`.ids`/`.[].id`).\n- **E2E** — the existing `cmd/autoreflect/e2e_*_test.go` lifecycle/loop suites,\n  extended so the full mine → observe → consolidate → promote → retrieve →\n  select → feedback → **gap list** loop runs against an on-disk fixture\n  (per CLAUDE.md: populate a stable dataset on disk, run the tools as a user).\n- **Manual replay** — re-run the spike's bounded loop and confirm every spike\n  finding (F1–F11 in scope) is closed; reset throwaway artifacts after.\n\nConventions enforced throughout (CLAUDE.md / `auto-package-patterns.md`):\nJSON default + 2-space indent, stdout = payload only / diagnostics + remediation\nto stderr, non-zero exit on any error, `validate()` structured errors, and\n`go build ./...` clean after every file.", "blocks": [{"kind": "md", "text": "The module already has the harnesses we need — lean on them rather than inventing\nnew ones:\n\n- **Unit** — pure-function changes: content-derived id determinism\n  (`rules`/`observations` model tests), `Fold` timestamp population\n  (`projection_test.go`), the single shared pending-count function\n  (`miner` test), feedback-gap projection for `gap list`.\n- **Integration** — CLI output contracts via the existing\n  `*_integration_test.go` (events, observation, consolidate) and a new\n  `gap`/`doctor` integration test. These assert the **new uniform envelope** and\n  are where most of the F5 churn lands (every output-shape assertion moves to\n  `.id`/`.ids`/`.[].id`).\n- **E2E** — the existing `cmd/autoreflect/e2e_*_test.go` lifecycle/loop suites,\n  extended so the full mine → observe → consolidate → promote → retrieve →\n  select → feedback → **gap list** loop runs against an on-disk fixture\n  (per CLAUDE.md: populate a stable dataset on disk, run the tools as a user).\n- **Manual replay** — re-run the spike's bounded loop and confirm every spike\n  finding (F1–F11 in scope) is closed; reset throwaway artifacts after.\n\nConventions enforced throughout (CLAUDE.md / `auto-package-patterns.md`):\nJSON default + 2-space indent, stdout = payload only / diagnostics + remediation\nto stderr, non-zero exit on any error, `validate()` structured errors, and\n`go build ./...` clean after every file."}]}, {"id": "coverage-map", "title": "Coverage Map", "summary": "", "tab": "Verification", "md": "", "blocks": [{"kind": "mermaid", "idx": 0}]}, {"id": "acceptance-criteria", "title": "Acceptance Criteria", "summary": "", "tab": "Verification", "md": "", "blocks": []}, {"id": "verification-gaps", "title": "Known Gaps & Risks", "summary": "", "tab": "Verification", "md": "- **F5 is a breaking output change.** No external consumers are known, but the\n  reflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\n  the documented `jq` paths break. Mitigation: update docs in the same task.\n- **Content-id collisions.** Across *distinct* content an 8-hex prefix collision\n  is astronomically unlikely; *identical* content → identical id is intended\n  (idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\n  accepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\n  loop call is a distinct event, not a content identity (see Solution).\n- **F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\n  logic drift. Before collapsing, confirm it isn't a legitimate dual-universe\n  count (subagents/scope) — the unit test must reproduce the divergence first,\n  then prove the shared function fixes it.\n- **doctor depth.** v1 checks state-dir presence, event decodability, and\n  snapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\n  monotonicity) may be deferred to a follow-up.\n- **No migration of old ids.** Events written before this task keep random ids;\n  only newly minted ids are content-derived. This is intentional (append-only).", "blocks": [{"kind": "md", "text": "- **F5 is a breaking output change.** No external consumers are known, but the\n  reflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\n  the documented `jq` paths break. Mitigation: update docs in the same task.\n- **Content-id collisions.** Across *distinct* content an 8-hex prefix collision\n  is astronomically unlikely; *identical* content → identical id is intended\n  (idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\n  accepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\n  loop call is a distinct event, not a content identity (see Solution).\n- **F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\n  logic drift. Before collapsing, confirm it isn't a legitimate dual-universe\n  count (subagents/scope) — the unit test must reproduce the divergence first,\n  then prove the shared function fixes it.\n- **doctor depth.** v1 checks state-dir presence, event decodability, and\n  snapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\n  monotonicity) may be deferred to a follow-up.\n- **No migration of old ids.** Events written before this task keep random ids;\n  only newly minted ids are content-derived. This is intentional (append-only)."}]}, {"id": "approach", "title": "Approach", "summary": "", "tab": "Solution", "md": "Nine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced.", "blocks": [{"kind": "md", "text": "Nine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced."}]}, {"id": "end-state", "title": "End-state CLI", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "cli", "idx": 0}]}, {"id": "key-apis", "title": "Key APIs", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "api", "idx": 0}, {"kind": "api", "idx": 1}]}, {"id": "file-changes", "title": "File Changes", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "files"}]}, {"id": "rejected-alternatives", "title": "Rejected Alternatives", "summary": "", "tab": "Solution", "md": "- **F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n  `gap list` matches the gap→observation mental model and is discoverable.\n- **F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\n  more consumers, and fights the repo's \"list returns a plain payload of all\n  items\" convention. Top-level id on mutations + per-element id on reads solves\n  the threading pain with the least breakage.\n- **F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n  (D-3): leaves the inconsistent nesting in place; we still normalize the shapes.\n- **F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\n  and event ids are distinct-in-time records; hashing would collapse them.\n- **F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\n  collision is negligible; a suffix breaks the idempotency property and adds a\n  state read at mint.\n- **F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\n  per-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.\n- **F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\n  the conventional health command across auto-* tools.\n- **F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\n  only gap is the list view dropping them.", "blocks": [{"kind": "md", "text": "- **F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n  `gap list` matches the gap→observation mental model and is discoverable.\n- **F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\n  more consumers, and fights the repo's \"list returns a plain payload of all\n  items\" convention. Top-level id on mutations + per-element id on reads solves\n  the threading pain with the least breakage.\n- **F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n  (D-3): leaves the inconsistent nesting in place; we still normalize the shapes.\n- **F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\n  and event ids are distinct-in-time records; hashing would collapse them.\n- **F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\n  collision is negligible; a suffix breaks the idempotency property and adds a\n  state read at mint.\n- **F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\n  per-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.\n- **F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\n  the conventional health command across auto-* tools.\n- **F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\n  only gap is the list view dropping them."}]}, {"id": "solution-decisions", "title": "Decisions", "summary": "", "tab": "Solution", "md": "", "blocks": []}, {"id": "summary", "title": "Summary", "summary": "", "tab": "Plan", "md": "Stand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits.", "blocks": [{"kind": "md", "text": "Stand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits."}]}, {"id": "execution-sequence", "title": "Execution Sequence", "summary": "", "tab": "Plan", "md": "", "blocks": [{"kind": "mermaid", "idx": 1}]}, {"id": "phases", "title": "Phases", "summary": "", "tab": "Plan", "md": "", "blocks": []}, {"id": "success-criteria", "title": "Success Criteria", "summary": "", "tab": "Plan", "md": "- **P1** → AC-4, AC-5 (observation), AC-7\n- **P2** → AC-6, AC-7\n- **P3** → AC-4, AC-5, AC-11\n- **P4** → AC-3\n- **P5** → AC-1, AC-2\n- **P6** → AC-10\n- **P7** → AC-8, AC-9, AC-12, AC-13, and AC-14 (full-suite + e2e green)\n\nAll 14 acceptance criteria pass; `go build ./...` and `go test ./...` clean;\n`golangci-lint` clean; the end-to-end reflect loop completes through `gap list`.", "blocks": [{"kind": "md", "text": "- **P1** → AC-4, AC-5 (observation), AC-7\n- **P2** → AC-6, AC-7\n- **P3** → AC-4, AC-5, AC-11\n- **P4** → AC-3\n- **P5** → AC-1, AC-2\n- **P6** → AC-10\n- **P7** → AC-8, AC-9, AC-12, AC-13, and AC-14 (full-suite + e2e green)\n\nAll 14 acceptance criteria pass; `go build ./...` and `go test ./...` clean;\n`golangci-lint` clean; the end-to-end reflect loop completes through `gap list`."}]}], "decisions": [{"id": "D-1", "title": "F4 surface = dedicated `gap list`", "status": "accepted", "by": "charlie", "summary": "Dedicated `auto reflect gap list`, not a generic events --full flag.", "tab": "Requirements", "section": "decisions-made", "md": "**Decision:** Expose gaps via a dedicated `auto reflect gap list` command.\n**Alternatives:** A generic `events list --full/--payload` flag; both.\n**Consequences:** Matches the \"gap → observation\" mental model and is discoverable;\nthe generic payload-dump flag is left out of scope."}, {"id": "D-2", "title": "Event log is git-tracked", "status": "accepted", "by": "charlie", "summary": "events/ tracked; init .gitignore ignores only playbook.json.", "tab": "Requirements", "section": "decisions-made", "md": "**Decision:** The canonical `.auto/reflect/events/*.jsonl` log is committed\n(shared playbook history; any clone can `rebuild`). The init-written\n`.auto/reflect/.gitignore` ignores only the disposable `playbook.json`.\n**Alternatives:** Ignore events too (machine-local reflect state).\n**Consequences:** Reflect history travels with the repo and across hosts."}, {"id": "D-3", "title": "F5 = restructure to a uniform envelope (breaking)", "status": "accepted", "by": "charlie", "summary": "One uniform output envelope; top-level id/ids. Breaks existing consumers.", "tab": "Requirements", "section": "decisions-made", "md": "**Decision:** Restructure command output to one uniform envelope rather than\nadditively bolting a top-level `.id` onto today's shapes.\n**Alternatives:** Non-breaking additive `.id`/`.ids`.\n**Consequences:** Cleanest end state; existing output consumers (and the skill\nreferences' documented extraction paths) must be updated in lockstep."}, {"id": "D-4", "title": "Content-derived ids included in 052", "status": "accepted", "by": "charlie", "summary": "Deterministic content-hashed ids ship in this task.", "tab": "Requirements", "section": "decisions-made", "md": "**Decision:** Implement content-derived ids (F7) in this task, not a follow-up.\n**Consequences:** Adds collision-handling design; fits the output-contract theme\nsince deterministic ids make `--dry-run` output actionable."}, {"id": "D-5", "title": "F5 changes CLI output only — not the stored event schema", "status": "accepted", "by": "agent", "summary": "Envelope restructure is presentation-layer; on-disk payloads + schema_version=1 unchanged.", "tab": "Requirements", "section": "decisions-made", "md": "**Context:** Stored payload field names (`observation_id`, `rule_id`, …) are part\nof the append-only on-disk contract; `events.SchemaVersion` is 1 and must fold\nidentically forever.\n**Decision:** F5 restructures only CLI *output* marshalling. Stored event payload\nfield names and `schema_version` are untouched.\n**Consequences:** No schema bump; the uniform envelope is a view over canonical\ndata, consistent with \"playbook is a disposable cache, events are canonical.\""}, {"id": "D-6", "title": "Content-derived ids preserve existing id formats", "status": "accepted", "by": "agent", "summary": "Only minting changes (random → content hash); regex formats like ^ob-[0-9a-f]{8}$ stay.", "tab": "Requirements", "section": "decisions-made", "md": "**Context:** Ids are validated against fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`."}, {"id": "D-7", "title": "F5 final shape: top-level id on mutations, per-element id on reads", "status": "accepted", "by": "charlie", "summary": "Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.", "tab": "Solution", "section": "solution-decisions", "md": "**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array."}, {"id": "D-8", "title": "Content-derived ids: rules + observations only", "status": "accepted", "by": "charlie", "summary": "r-/ob- become content hashes; rt-/fb-/ev- stay random.", "tab": "Solution", "section": "solution-decisions", "md": "**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids."}, {"id": "D-9", "title": "Pure content hash, no collision suffix", "status": "accepted", "by": "charlie", "summary": "id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.", "tab": "Solution", "section": "solution-decisions", "md": "**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks)."}], "threads": [{"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`feedback` can't expose a minted top-level id without a service.go change not in the plan", "tab": "Verification", "comments": [{"by": "review", "html": "AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes."}, {"by": "author", "html": "Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope)."}]}, {"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "`rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes", "tab": "Verification", "comments": [{"by": "review", "html": "AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`."}, {"by": "author", "html": "Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list."}]}, {"anchor": "AC-13", "status": "resolved", "priority": "p3", "title": "`no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills", "tab": "Verification", "comments": [{"by": "review", "html": "The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove."}, {"by": "author", "html": "Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match."}]}, {"anchor": "end-state", "status": "resolved", "priority": "p2", "title": "gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists", "tab": "Solution", "comments": [{"by": "review", "html": "The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`."}, {"by": "author", "html": "Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id."}]}, {"anchor": "auto-reflect/internal/rules/model.go", "status": "resolved", "priority": "p1", "title": "Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id", "tab": "Solution", "comments": [{"by": "review", "html": "There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan."}, {"by": "author", "html": "Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2."}]}, {"anchor": "auto-reflect/internal/observations/model.go", "status": "resolved", "priority": "p3", "title": "Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set", "tab": "Solution", "comments": [{"by": "review", "html": "Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered."}, {"by": "author", "html": "Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately."}]}], "acs": [{"id": "AC-1", "title": "gap list surfaces reported gaps (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "md": "**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted."}, {"id": "AC-2", "title": "gap list obeys list conventions (F4)", "phases": "5", "tests": "auto-reflect/internal/cli/gap_integration_test.go", "md": "**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available."}, {"id": "AC-3", "title": "One pending count, two callers agree (F2)", "phases": "4", "tests": "auto-reflect/internal/cli/miner_integration_test.go", "md": "**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged."}, {"id": "AC-4", "title": "Mutating commands expose a top-level id (F5)", "phases": "1,2,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go", "md": "**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)"}, {"id": "AC-5", "title": "Collection commands expose .[].id without data loss (F5)", "phases": "1,3", "tests": "auto-reflect/internal/cli/observation_integration_test.go", "md": "**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths."}, {"id": "AC-6", "title": "Content-derived ids make consolidate deterministic + idempotent (F7)", "phases": "1,2", "tests": "auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go", "md": "**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists."}, {"id": "AC-7", "title": "Ids keep their format (F7/D-6)", "phases": "1,2", "tests": "auto-reflect/internal/idhash/idhash_test.go", "md": "**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids."}, {"id": "AC-8", "title": "init writes an idempotent .gitignore (F9)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "md": "**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it."}, {"id": "AC-9", "title": "Canonical events tracked, cache ignored (F9/D-2)", "phases": "7", "tests": "auto-reflect/internal/cli/init_test.go", "md": "**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked)."}, {"id": "AC-10", "title": "doctor detects stale/partial state (F1)", "phases": "6", "tests": "auto-reflect/internal/cli/doctor_integration_test.go", "md": "**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail."}, {"id": "AC-11", "title": "Rule listings carry timestamps (F6)", "phases": "3", "tests": "auto-reflect/internal/rules/projection_test.go", "md": "**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto reflect rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map)."}, {"id": "AC-12", "title": "outcome enum + correction_density documented (F8/F3)", "phases": "7", "tests": "", "md": "**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set."}, {"id": "AC-13", "title": "Legacy yaml removed (F11)", "phases": "7", "tests": "", "md": "**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove."}, {"id": "AC-14", "title": "No regressions (cross-cutting)", "phases": "1,2,3,4,5,6,7", "tests": "auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go", "md": "**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`."}], "phases": [{"n": "1", "title": "Foundations + walking skeleton", "status": "done", "files": "auto-reflect/internal/idhash/idhash.go,auto-reflect/internal/idhash/idhash_test.go,auto-reflect/internal/cli/output.go,auto-reflect/internal/observations/model.go,auto-reflect/internal/observations/model_test.go,auto-reflect/internal/cli/observation.go,auto-reflect/internal/cli/observation_integration_test.go", "md": "Thin path through every layer the task touches: id minting → command → output\n→ test.\n\n1. Add `internal/idhash/idhash.go`: `Derive(prefix string, parts ...string)\n   string` = `prefix + first 8 hex of sha256(strings.Join(parts,\"\\n\"))`.\n   **Verify:** `idhash_test.go` — same parts → same id; format `^p-[0-9a-f]{8}$`;\n   different parts → different id.\n2. Add `cli/output.go`: `mutationResult(id, fields)` and\n   `mutationResultIDs(ids, fields)` injecting top-level `id`/`ids`.\n   **Verify:** unit/compile.\n3. `observations/model.go`: `NewObservationID` takes canonical parts\n   (`kind,subject,evidence…,domain,severity`) and calls `idhash.Derive(\"ob\",…)`.\n   Update the existing zero-arg `TestNewObservationIDFormat`\n   (`observations/model_test.go`) for the new signature.\n   **Verify:** `go test ./internal/observations/...`.\n4. `observation.go`: `observation add` returns top-level `.id`\n   (via `mutationResult`); `observation list` elements carry top-level `id`.\n   **Verify:** `observation_integration_test.go` — `add` exposes `.id` matching\n   `^ob-[0-9a-f]{8}$`; re-adding identical observation is idempotent (same id);\n   `list | jq '.observations[].id'` non-empty.\n5. **Phase verify:** `go build ./...`; `go test ./internal/observations/...\n   ./internal/cli/... -run 'Observation|Idhash'`; `golangci-lint run`.\n6. **Commit:** `feat(052): content-hash ids + output envelope (skeleton on observation)`."}, {"n": "2", "title": "Rule content ids + consolidate determinism", "status": "done", "depends-on": "1", "files": "auto-reflect/internal/rules/model.go,auto-reflect/internal/cli/consolidate.go,auto-reflect/internal/cli/rule.go,auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/loop/service_test.go", "md": "1. `rules/model.go`: `NewRuleID` takes canonical parts\n   (`domain,use_when,content,rule_type`) → `idhash.Derive(\"r\",…)`.\n   **Verify:** `go test ./internal/rules/...`.\n2. Feed content to **every** `NewRuleID` caller — the signature is variadic, so a\n   missed zero-arg call still compiles but mints a constant id: `consolidate.go`\n   `createDraft`/`split`, **and `rule.go` `rule create`** (the third caller).\n   Emit top-level `ids` from `consolidate` via `mutationResultIDs`; dry-run and\n   apply now   { id: "k1", q: "What is the only API into mail?", a: "`mail.Client`. The CLI, the hook and every future consumer go through it; nothing outside the mail package opens the store.", ref: "G11", refs: ["G11", "AC-12", "D-062-8"] },

  { id: "k3", q: "Name the complete T1 event vocabulary.", a: "`alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — and these four are the complete set.", ref: "AC-11", refs: ["AC-11", "G10"] },
  { id: "k4", q: "In T1, what does `bound` mean?", a: "“a binding row exists”, not “an agent is alive right now”.", ref: "D-062-2", refs: ["D-062-2", "AC-9"] },
  { id: "k5", q: "Who writes binding rows in T1?", a: "Only `subscribe` — it stamps the pair and `last_seen` once. The hook never writes one.", ref: "D-062-2", refs: ["D-062-2"] },
  { id: "k6", q: "What does the no-mail hook path cost?", a: "One `stat`. It never opens the store — on either path — and can never stall or break the hook.", ref: "AC-10", refs: ["AC-10", "G8", "D-062-3"] },
  { id: "k7", q: "Where is an agent's pending flag?", a: "`~/.auto/mail/alpha-flags/` + the first 8 hex bytes of `sha256(manager + \"\\x00\" + target)`.", ref: "P3", refs: ["P3", "D-062-3"] },
  { id: "k8", q: "Where does consumer state (`read_at`, `acked_at`) live?", a: "Only on `deliveries`, keyed by `(subscription_id, mail_id)`. No consumer-state column on `mail`.", ref: "AC-4", refs: ["AC-4", "G2"] },
  { id: "k9", q: "Who writes `deliveries` rows, and when?", a: "The read path, lazily against the subscription cursor (D-10). `send` writes none.", ref: "AC-4", refs: ["AC-4", "G2"] },
  { id: "k10", q: "The delivery contract, in as many words?", a: "At-least-once, unordered, consumers must be idempotent on mail id.", ref: "AC-7", refs: ["AC-7", "G4"] },
  { id: "k11", q: "Losing an ack race: payload and exit code?", a: "`wonTransition:false` on stdout, a one-line stderr note naming who won, exit 0.", ref: "D-062-7", refs: ["D-062-7", "AC-6", "G13"] },
  { id: "k12", q: "The binding ladder (fallback order)?", a: "`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved worktree path.", ref: "D-062-2", refs: ["D-062-2", "AC-8"] },
  { id: "k13", q: "The `from` ladder?", a: "`--from` → address of a subscription bound to the caller (lowest id) → `<projectId>/agent` or `unregistered/agent`.", ref: "AC-2", refs: ["AC-2"] },
  { id: "k14", q: "SQLite pragmas for concurrent writers?", a: "`journal_mode = WAL`, `busy_timeout = 5000`, `foreign_keys = ON` — the exact set auto-watch uses — plus `BEGIN IMMEDIATE` per operation.", ref: "P1", refs: ["P1", "S:approach"] },
  { id: "k15", q: "Why one container for “two agents on one host”?", a: "The store is host-global and the harness gives each container a distinct `HOST_ID` — two containers would be two hosts.", ref: "D-062-1", refs: ["D-062-1", "AC-13"] },
  { id: "k16", q: "What word must never name the stored unit?", a: "message — it's already bound to a role-tagged exchange within a Session. (`--message` survives as the body flag.)", ref: "AC-1", refs: ["AC-1", "G16"] },
  { id: "k17", q: "Which packages does auto-mail export?", a: "One domain API, `auto-mail/mail`, plus the mandatory `rootcmd` mounting façade. The store is `internal/`.", ref: "D-062-8", refs: ["D-062-8", "G11"] },

  { id: "k19", q: "What is the harness readiness gate (no doctor in T1)?", a: "`auto mail list` returning `[]` against an initialised store.", ref: "D-062-4", refs: ["D-062-4", "AC-13"] },

function parseTable(mdText){

}
function strip(s){ return s.replace(/\*\*/g,'').replace(/`/g,''); }

  P.sections.forEach(s => M.sec[s.id]=s);
  const add = n => { M.nodes.push(n); M.byKey[n.key]=n; };
  if (p==='062') {
    const rs = M.sec['inherited-rails'];
    parseTable(rs.md).forEach(r => add({ key:strip(r[0]), kind:'rail', label:strip(r[0]), title:r[1], to:[strip(r[2])], anchor:'rail' }));

  P.decisions.forEach(d => add({ key:d.id, kind:'decision', label:d.id, title:d.title, obj:d }));
  P.phases.forEach(ph => add({ key:'P'+ph.n, kind:'phase', label:'P'+ph.n, title:ph.title, obj:ph }));

  if (p==='052') {
    P.acs.forEach(a => { const m=a.title.match(/\(([^)]*)\)\s*$/); if(!m) return; const t=m[1].split('/'); let k=null; if(t[0]==='F8'&&t[1]==='F3') k='F8/F3'; else if(/^F\d+$/.test(t[0])) k=t[0]; if(k&&M.byKey[k]) (M.byKey[k].to=M.byKey[k].to||[]).push(a.id); });
  }

  const b = QB[p];
  M.qs = [].concat(
    b.contra.map(q=>Object.assign({type:'contra', mode:'contra'},q)),
    b.lurk.map(q=>Object.assign({type:'lurk', mode:'lurk'},q)),
    b.predict.map(q=>Object.assign({mode:'predict'},q)),

  // node -> items
  M.nodeItems = {};
  const tag = (key, item) => { if(M.byKey[key]) (M.nodeItems[key]=M.nodeItems[key]||[]).push(item); };
  M.qs.forEach(q => (q.refs||[]).forEach(k => tag(k, {t:'q', id:q.id})));
  M.cards.forEach(c => (c.refs||[]).forEach(k => tag(k, {t:'c', id:c.id})));

  M.threadsOn = {};
  P.threads.forEach((t,i) => { (M.threadsOn[t.anchor]=M.threadsOn[t.anchor]||[]).push(i); });
  MODEL[p]=M;
}

/* ---------------- mastery ---------------- */
function itemScore(p, it){
  if (it.t==='q'){ const r=S.results[p+':'+it.id] || S.results[it.id]; if(!r) return 0; return r.first?1:(r.last?0.6:(r.done?0.15:0)); }
  const c=S.cards[p+':'+it.id]; if(!c) return 0; return c.box>=3?1:(c.box===2?0.5:0);
}
function nodeMastery(p,key){ const its=MODEL[p].nodeItems[key]||[]; if(!its.length) return 0; return its.reduce((a,it)=>a+itemScore(p,it),0)/its.length; }
function planMastery(p){ const M=MODEL[p]; const ns=M.nodes; return ns.reduce((a,n)=>a+nodeMastery(p,n.key),0)/ns.length; }
function modeProgress(p, mode){ const qs=MODEL[p].qs.filter(q=>q.mode===mode); const done=qs.filter(q=>S.results[q.id]&&S.results[q.id].done).length; return {done, total:qs.length, firsts:qs.filter(q=>S.results[q.id]&&S.results[q.id].first).length}; }

function refId(key){ return 'ref-'+key.replace(/[^A-Za-z0-9]+/g,'-'); }
function refLabel(p,key){

}

/* ---- generic pointer drag ---- */
let picked=null;
function makeDraggable(chip, onDrop, noPick){
  chip.addEventListener('pointerdown', e=>{
    if(session&&session.state!=='idle') return;
    if(e.button!==0) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
    let lastY=0, raf=0; const tick=()=>{ if(!moved){ raf=0; return; } const v = lastY<110 ? -(110-lastY)/6 : lastY>innerHeight-150 ? (lastY-(innerHeight-150))/6 : 0; if(v) window.scrollBy(0,v); raf=requestAnimationFrame(tick); };
    const move=ev=>{ const dx=ev.clientX-sx, dy=ev.clientY-sy; lastY=ev.clientY; if(moved && !raf) raf=requestAnimationFrame(tick);
      if(!moved && Math.hypot(dx,dy)>5){ moved=true; ghost=chip.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=chip.offsetWidth+'px'; document.body.append(ghost); chip.classList.add('dragging'); }
      if(moved){ ghost.style.left=(ev.clientX-chip.offsetWidth/2)+'px'; ghost.style.top=(ev.clientY-20)+'px';
        const t=document.elementFromPoint(ev.clientX,ev.clientY); $$('.over').forEach(x=>x.classList.remove('over')); const z=t&&t.closest('.dz'); if(z) z.classList.add('over'); } };
    const up=ev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      if(ghost){ moved=false; cancelAnimationFrame(raf); raf=0; ghost.remove(); ghost=null; chip.classList.remove('dragging'); const t=document.elementFromPoint(ev.clientX,ev.clientY); $$('.over').forEach(x=>x.classList.remove('over')); const z=t&&t.closest('.dz'); if(z) onDrop(chip,z,t); }
      else if(!noPick){ // tap to pick
        if(picked===chip){ chip.classList.remove('picked'); picked=null; } else { if(picked) picked.classList.remove('picked'); picked=chip; chip.classList.add('picked'); } } };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}
function tapZone(zone, onDrop){ zone.addEventListener('click', e=>{ if(session&&session.state!=='idle') return; if(picked && !e.target.closest('.chip')){ const c=picked; picked.classList.remove('picked'); picked=null; onDrop(c,zone,e.target); } }); }

function bins(q, root){

function cardState(id){ return S.cards[plan+':'+id] || {box:1, due:0}; }
function isDue(c){ return cardState(c.id).due <= Date.now(); }
let cram=false; const cramDone=new Set();

  if (cram) { queue = shuffle(M.cards.filter(c=>!cramDone.has(c.id)), 31); if(!queue.length){ cram=false; cramDone.clear(); queue=M.cards.filter(isDue); } }
  const D=h('div',{class:'deck'});
  D.append(h('div',{class:'maphead'}, h('div',{}, h('h2',{},'Invariant cards'), h('p',{},'The rules this plan must never break. Leitner boxes: a right answer moves a card up a box and pushes its next review out (5 min → 1 day → 3 days → 7 days); a miss sends it back to box 1.')),

      else if (b.kind==='cli'){ const c=P.clis[b.idx]; sec.append(h('div',{class:'clibox'}, h('div',{class:'ct'}, (c.title||'')+(c.caption?' — '+c.caption:'')), c.steps.map(st=>[ st.note? h('div',{class:'n'}, '# '+st.note+(st.status?' ['+st.status+']':'')):null, h('div',{class:'c'}, st.cmd), st.out? h('div',{class:'o'}, st.out):null ]))); }
      else if (b.kind==='mermaid'){ const m=P.mermaids[b.idx]; sec.append(h('div',{class:'mer'}, h('pre',{class:'mermaid'}, m.src), h('div',{class:'cap'}, m.caption||''))); }
      else if (b.kind==='api'){ const a=P.apis[b.idx]; sec.append(h('div',{class:'api'}, h('div',{class:'an'}, a.name), h('div',{class:'ap'}, (a.kind||'')+' · '+(a.path||'')+(a.caption?' — '+a.caption:'')), a.members.map(mm=>h('div',{class:'mem'}, h('code',{}, mm.sig), h('div',{html:inl(mm.doc)}))))); }
      else if (b.kind==='files'){ sec.append(filesEl()); }
    });
    // attached items
    P.decisions.filter(d=>d.section===s.id).forEach(d=>sec.append(decEl(d)));
    if (s.id==='acceptance-criteria') P.acs.forEach(a=>sec.append(acEl(a)));
    if ((plan==='062'&&s.id==='execution-sequence')||(plan==='052'&&s.id==='phases')) P.phases.forEach(ph=>sec.append(phEl(ph)));
    threadsFor(s.id).forEach(x=>sec.append(threadEl(x)));
    body.append(sec);
  });
  const jumps=[['Top',null]].concat(navTabs.map(t=>[t,'tab-'+t]), [[plan==='062'?'Rails':'Findings', refId(plan==='062'?'S:inherited-rails':'S:goals')],['ACs',refId('S:acceptance-criteria')],['Files',refId('S:file-changes')],['Rejected',refId('S:rejected-alternatives')]]);
  jumps.forEach(([l,id])=>nav.append(h('button',{onclick:()=>{ const el=id&&document.getElementById(id); $('#dbody').scrollTop = el? el.offsetTop-8 : 0; }}, l)));
  renderMermaid();
}
function renderMermaid(){
  const run=()=>{ try { mermaid.initialize({startOnLoad:false, theme:'neutral', securityLevel:'strict', fontFamily:'Bricolage Grotesque', flowchart:{htmlLabels:true}}); mermaid.run({nodes:$$('#dbody pre.mermaid:not([data-processed])')}).then(rescroll).catch(()=>{}); } catch(e){} };
  if (window.mermaid) return run();
  if (mermaidLoaded) return; mermaidLoaded=true;
  const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js'; sc.onload=run; sc.onerror=()=>{}; document.head.append(sc);
}

/* ---------------- boot ---------------- */
if (!location.hash) history.replaceState(null,'','#062');
route();
window.__GTP = { MODEL, S, coverage(){ const out={}; for(const p in MODEL){ out[p]=MODEL[p].nodes.filter(n=>!(MODEL[p].nodeItems[n.key]||[]).length).map(n=>n.key); } return out; } };
})();
</script>
