<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grill the Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --paper:#F5F0E6; --paper2:#EDE6D8; --card:#FFFDF8; --ink:#1F1B15; --ink2:#3C352B; --muted:#7A7064; --line:#E0D6C5; --line2:#CFC3AE;
  --ok:#2F9A45; --ok-deep:#1F7431; --ok-soft:#DDF3DF; --bad:#D6474C; --bad-deep:#A62D32; --bad-soft:#FCE3E2;
  --gold:#C9971B; --p1:#D6474C; --p2:#D98A1C; --p3:#6B7C93;
  --r:16px; --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(60,40,10,.18);
  --ui:'Bricolage Grotesque', system-ui, sans-serif; --serif:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
body[data-plan="062"]{ --acc:#1E9A57; --acc-deep:#126E3D; --acc-soft:#DCF1E3; --acc-ink:#0E4F2C; --field:#EAF0FA; --field-line:#CBD8F0; --bp:#2E5BCC; }
body[data-plan="052"]{ --acc:#C2561F; --acc-deep:#8C3811; --acc-soft:#F7E3D4; --acc-ink:#6A2A0C; --field:#EFE7D9; --field-line:#DCCDB4; --bp:#8A6E4B; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--ui); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:background .4s}
button{font:inherit; color:inherit}
code,.mono{font-family:var(--mono); font-size:.86em}
code{background:rgba(120,100,70,.10); padding:.08em .35em; border-radius:5px; overflow-wrap:anywhere}
a{color:var(--acc-deep)}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; height:64px}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; text-decoration:none; color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--serif); font-weight:800; font-size:22px; letter-spacing:-.02em; white-space:nowrap}
.brand i{font-family:var(--serif); font-style:italic; font-weight:400; color:var(--acc)}
.switch{flex:none; display:flex; background:var(--paper2); border-radius:999px; padding:4px; gap:2px; margin-left:8px; border:1px solid var(--line)}
.switch button{border:0; background:transparent; padding:6px 14px; border-radius:999px; cursor:pointer; font-weight:600; font-size:14px; color:var(--muted); display:flex; gap:7px; align-items:center; white-space:nowrap}
.switch button .dot{width:9px; height:9px; border-radius:50%}
.switch button[data-p="062"] .dot{background:#1E9A57}
.switch button[data-p="052"] .dot{background:#C2561F}
.switch button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch .flv{font-weight:500; font-size:12px; color:var(--muted)}
.spacer{flex:1}
.stat{display:flex; align-items:center; gap:6px; font-weight:700; font-size:15px; padding:6px 10px; border-radius:12px}
.stat svg{width:20px; height:20px}
.stat.xp{color:#B98309}.stat.combo{color:#E0602A}.stat.mast{color:var(--acc-deep)}
.btn-plan{border:1.5px solid var(--line2); background:var(--card); border-radius:12px; padding:7px 13px; font-weight:600; cursor:pointer; display:flex; gap:7px; align-items:center; font-size:14px}
.btn-plan:hover{border-color:var(--ink2)}

/* ---------- chunky buttons ---------- */
.b3{--c:var(--acc); --d:var(--acc-deep); border:0; background:var(--c); color:#fff; font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:15px; padding:13px 26px; border-radius:14px; box-shadow:0 4px 0 var(--d); cursor:pointer; transition:transform .06s, box-shadow .06s, filter .15s}
.b3:hover{filter:brightness(1.05)}
.b3:active{transform:translateY(4px); box-shadow:0 0 0 var(--d)}
.b3[disabled]{--c:#D9D1C3; --d:#C4BAA8; color:#9A8F7F; cursor:not-allowed; filter:none}
.b3.ghost{--c:var(--card); --d:var(--line2); color:var(--ink2); border:2px solid var(--line2); box-shadow:0 3px 0 var(--line2)}
.b3.okc{--c:var(--ok); --d:var(--ok-deep)} .b3.badc{--c:var(--bad); --d:var(--bad-deep)}
.b3.sm{padding:9px 16px; font-size:13px; border-radius:11px}

/* ---------- home ---------- */
.hero{position:relative; margin:22px 0 18px; border-radius:26px; overflow:hidden; border:1px solid var(--field-line); background:var(--field)}
.hero .bg{position:absolute; inset:0; pointer-events:none}
body[data-plan="062"] .hero .bg{background-image:linear-gradient(var(--field-line) 1px,transparent 1px),linear-gradient(90deg,var(--field-line) 1px,transparent 1px),linear-gradient(rgba(46,91,204,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(46,91,204,.07) 1px,transparent 1px); background-size:80px 80px,80px 80px,16px 16px,16px 16px; opacity:.9}
.hero-in{position:relative; display:grid; grid-template-columns:1.25fr 1fr; gap:28px; padding:34px 36px}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc-deep); background:var(--card); border:1.5px solid var(--acc); padding:5px 11px; border-radius:999px}
.hero h1{font-family:var(--serif); font-weight:800; font-size:clamp(34px,4.4vw,54px); line-height:1.02; letter-spacing:-.025em; margin:16px 0 12px}
.hero h1 em{font-style:italic; font-weight:400; color:var(--acc); padding-right:.12em}
.hero .lede{font-family:var(--serif); font-size:19px; line-height:1.45; color:var(--ink2); max-width:560px; margin:0}
.hero .lede q{quotes:"“" "”"}
.hero .meta{margin-top:16px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 14px}
.hero .meta b{color:var(--ink2)}
.shape{background:color-mix(in srgb,var(--card) 88%,transparent); border:1px solid var(--line); border-radius:18px; padding:18px 18px 14px; align-self:start; box-shadow:var(--shadow)}
.shape h4{margin:0 0 10px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700}
.nums{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px}
.num b{display:block; font-family:var(--serif); font-size:30px; font-weight:800; line-height:1}
.num span{font-size:12px; color:var(--muted); line-height:1.2; display:block; margin-top:3px}
.fbar{display:flex; height:14px; border-radius:7px; overflow:hidden; margin:6px 0 6px; background:var(--paper2)}
.fbar i{display:block; height:100%}
.flegend{display:flex; gap:12px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.flegend span::before{content:""; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; background:var(--c)}
.pshape{margin-top:12px}
.pshape svg{width:100%; height:auto; display:block}
.pshape .cap{font-size:12px; color:var(--muted); margin-top:4px}

.modes{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:8px 0 26px}
.mode{position:relative; background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:20px 20px 18px; cursor:pointer; box-shadow:0 4px 0 var(--line); transition:transform .12s, box-shadow .12s, border-color .12s; display:flex; flex-direction:column; min-height:190px; text-align:left}
.mode:hover{transform:translateY(-2px); box-shadow:0 6px 0 var(--line2); border-color:var(--line2)}
.mode:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line2)}
.mode.feature{grid-column:span 2; grid-row:span 2; background:var(--ink); color:#F7F1E4; border-color:var(--ink); box-shadow:0 5px 0 #000; min-height:396px; overflow:hidden}
.mode.feature:hover{box-shadow:0 7px 0 #000}
.mode.wide{grid-column:1/-1; flex-direction:row; gap:28px; min-height:0; align-items:stretch}
.mode.wide .wl{flex:0 0 300px; display:flex; flex-direction:column}
.minimap{flex:1; display:grid; gap:10px; align-content:center}
.mg small{display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.mg .sq{display:flex; flex-wrap:wrap; gap:5px}
.mg .sq i{width:26px; height:18px; border-radius:5px; border:1.5px dashed var(--acc); background:color-mix(in srgb,var(--acc) calc(var(--m)*100%),var(--card))}
body[data-plan="052"] .mg .sq i{border:1.5px solid #CDBFA8; background:color-mix(in srgb,#C9971B calc(var(--m)*100%),#E6DCCB)}
.mode .ic{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc-deep); margin-bottom:12px}
.mode.feature .ic{background:rgba(255,255,255,.1); color:#FFD27A}
.mode h3{margin:0 0 6px; font-size:21px; font-weight:800; letter-spacing:-.01em; line-height:1.15}
.mode.feature h3{font-family:var(--serif); font-size:38px; letter-spacing:-.02em; margin-top:4px}
.mode p{margin:0; color:var(--muted); font-size:14.5px; line-height:1.45}
.mode.feature p{color:#CFC6B5; font-size:16px; max-width:430px}
.mode .foot{margin-top:auto; padding-top:14px; display:flex; align-items:center; gap:10px}
.pbar{flex:1; height:10px; border-radius:6px; background:var(--paper2); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--acc); border-radius:6px; transition:width .5s}
.mode.feature .pbar{background:rgba(255,255,255,.12)} .mode.feature .pbar i{background:#FFD27A}
.mode .cnt{font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap}
.mode.feature .cnt{color:#CFC6B5}
.tag{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--paper2); color:var(--ink2); display:inline-block}
.mode.feature .tag{background:#FFD27A; color:#3A2A00}
.vsdemo{margin:22px 0 6px; display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; max-width:560px}
.vsdemo .ex{background:#2C261E; border:1px solid #463C2F; border-radius:14px; padding:12px 14px; font-family:var(--serif); font-style:italic; font-size:14.5px; line-height:1.35; color:#EDE3CF; transform:rotate(-1.2deg)}
.vsdemo .ex + .bolt + .ex{transform:rotate(1.4deg)}
.vsdemo .ex small{display:block; font-family:var(--ui); font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#FFD27A; margin-bottom:5px}
.vsdemo .bolt{color:#FFD27A}
.section-h{display:flex; align-items:baseline; gap:12px; margin:8px 0 12px}
.section-h h2{font-family:var(--serif); font-size:26px; margin:0; letter-spacing:-.02em}
.section-h span{color:var(--muted); font-size:14px}

/* ---------- lesson ---------- */
.lesson{max-width:900px; margin:0 auto; padding:20px 20px 150px}
.lhead{display:flex; align-items:center; gap:16px; margin:6px 0 22px}
.xbtn{border:0; background:transparent; cursor:pointer; color:var(--muted); padding:6px; border-radius:10px; display:grid; place-items:center}
.xbtn:hover{background:var(--paper2); color:var(--ink)}
.lprog{flex:1; height:16px; background:var(--paper2); border-radius:10px; overflow:hidden; position:relative}
.lprog i{position:absolute; left:0; top:0; bottom:0; background:var(--acc); border-radius:10px; transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.lprog i::after{content:""; position:absolute; left:10px; right:10px; top:4px; height:4px; border-radius:3px; background:rgba(255,255,255,.35)}
.lcombo{display:flex; align-items:center; gap:4px; font-weight:800; color:#E0602A; min-width:44px}
.lcombo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35)}}
.qkind{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
.qkind .k{font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--acc-deep)}
.prio{font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; color:#fff; letter-spacing:.05em}
.prio.p1{background:var(--p1)} .prio.p2{background:var(--p2)} .prio.p3{background:var(--p3)}
.lurkb{font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px; background:#2B2620; color:#FFD27A; letter-spacing:.06em}
.qtitle{font-family:var(--serif); font-weight:800; font-size:clamp(26px,3.2vw,36px); letter-spacing:-.02em; line-height:1.1; margin:0 0 18px}
.situ{font-size:17px; line-height:1.55; color:var(--ink2); margin:0 0 14px}
.cmd{background:#1F1B15; color:#EFE6D2; font-family:var(--mono); font-size:14px; border-radius:14px; padding:14px 16px; margin:0 0 18px; white-space:pre-wrap; overflow-wrap:anywhere; position:relative}
.cmd::before{content:"$"; color:#8C8170; margin-right:10px}
.ask{font-weight:700; font-size:18px; margin:18px 0 12px}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; box-shadow:0 3px 0 var(--line); font-size:16px; line-height:1.45; transition:border-color .12s, background .12s, transform .06s}
.opt:hover{border-color:var(--line2); background:#FFFFFB}
.opt:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.opt .key{flex:none; width:28px; height:28px; border-radius:8px; border:2px solid var(--line2); display:grid; place-items:center; font-weight:800; font-size:13px; color:var(--muted); margin-top:-1px}
.opt.sel{border-color:var(--acc); background:var(--acc-soft); box-shadow:0 3px 0 var(--acc)}
.opt.sel .key{border-color:var(--acc); color:var(--acc-deep)}
.opt.right{border-color:var(--ok); background:var(--ok-soft); box-shadow:0 3px 0 var(--ok)}
.opt.right .key{border-color:var(--ok); background:var(--ok); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft); box-shadow:0 3px 0 var(--bad)}
.opt.wrong .key{border-color:var(--bad); background:var(--bad); color:#fff}
.opt.locked{cursor:default}
.opt .why{display:block; font-size:14px; color:var(--ink2); margin-top:6px; padding-top:6px; border-top:1px dashed var(--line2)}
.opt .why::before{content:"Why not — "; font-weight:700; color:var(--bad-deep)}
.multi .opt .key{border-radius:50%}

/* exhibits */
.exhibits{display:grid; grid-template-columns:1fr 54px 1fr; align-items:stretch; margin:6px 0 8px}
.exh{background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:16px 18px 14px; box-shadow:var(--shadow); position:relative; display:flex; flex-direction:column; animation:slideA .5s cubic-bezier(.2,1.2,.4,1) both}
.exh.b{animation-name:slideB; animation-delay:.08s}
@keyframes slideA{from{opacity:0; transform:translateX(-24px) rotate(-2deg)}}
@keyframes slideB{from{opacity:0; transform:translateX(24px) rotate(2deg)}}
.exh .lab{display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:8px}
.exh .lab b{font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--acc-deep)}
.exh .lab span{font-size:12px; color:var(--muted); text-align:right}
.exh blockquote{margin:0; font-family:var(--serif); font-size:17.5px; line-height:1.42; color:var(--ink); flex:1}
.exh blockquote code{font-size:.8em}
.exh .src{margin-top:10px}
.vs{display:grid; place-items:center}
.vs div{width:46px; height:46px; border-radius:50%; background:var(--ink); color:#FFD27A; display:grid; place-items:center; box-shadow:0 0 0 6px var(--paper); animation:zap 1.8s ease-in-out infinite}
@keyframes zap{50%{transform:scale(1.08) rotate(-6deg)}}

/* fill */
.tpl{background:#1F1B15; color:#EFE6D2; font-family:var(--mono); font-size:15px; line-height:2.1; border-radius:16px; padding:16px 18px; white-space:pre-wrap; overflow-wrap:anywhere}
.blank{display:inline-flex; align-items:center; gap:6px; background:#3A3228; border:2px dashed #7C6D58; color:#FFD27A; border-radius:9px; padding:0 10px; line-height:1.7; cursor:pointer; font-family:var(--mono); font-size:14px; vertical-align:baseline; transition:background .12s}
.blank:hover{background:#4A4034}
.blank.filled{border-style:solid; border-color:var(--acc); background:color-mix(in srgb,var(--acc) 30%,#1F1B15); color:#fff}
.blank.right{border-color:#56C06A; background:#1E4A28; color:#C9F5D1}
.blank.wrong{border-color:#F06A6F; background:#4C1D20; color:#FFD0D2}
.blank .corr{color:#9FE3AE; font-size:12px; margin-left:4px}
.menu{position:fixed; z-index:90; background:var(--card); border:1.5px solid var(--line2); border-radius:14px; box-shadow:0 18px 40px -14px rgba(0,0,0,.35); padding:6px; min-width:140px; animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0; transform:translateY(-4px)}}
.menu button{display:block; width:100%; text-align:left; border:0; background:transparent; padding:9px 12px; border-radius:9px; cursor:pointer; font-family:var(--mono); font-size:14px}
.menu button:hover,.menu button:focus{background:var(--acc-soft); outline:none}

/* drag & drop */
.tray{display:flex; flex-wrap:wrap; gap:8px; padding:14px; background:var(--paper2); border-radius:16px; min-height:64px; border:2px dashed transparent; margin-bottom:16px}
.tray.over{border-color:var(--acc)}
.chip{user-select:none; touch-action:none; background:var(--card); border:2px solid var(--line2); border-radius:12px; padding:8px 12px; font-weight:600; font-size:14px; line-height:1.3; cursor:grab; box-shadow:0 3px 0 var(--line2); max-width:100%}
.chip b{font-family:var(--mono); font-size:12.5px; color:var(--acc-deep); margin-right:6px}
.chip.picked{border-color:var(--acc); box-shadow:0 3px 0 var(--acc); background:var(--acc-soft)}
.chip.right{border-color:var(--ok); background:var(--ok-soft); box-shadow:0 3px 0 var(--ok)}
.chip.wrong{border-color:var(--bad); background:var(--bad-soft); box-shadow:0 3px 0 var(--bad)}
.chip.ghost{position:fixed; z-index:100; pointer-events:none; transform:rotate(-3deg) scale(1.04); box-shadow:0 18px 30px -12px rgba(0,0,0,.35); cursor:grabbing}
.chip.dragging{opacity:.3}
.pairs{display:grid; gap:10px}
.pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:12px; align-items:stretch}
.pair .l{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px; display:flex; flex-direction:column; justify-content:center}
.pair .l b{font-family:var(--mono); font-size:14px; color:var(--acc-deep)}
.pair .l span{font-size:14px; color:var(--ink2); line-height:1.35}
.slot{border:2px dashed var(--line2); border-radius:14px; min-height:52px; padding:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; transition:border-color .12s, background .12s; background:rgba(255,255,255,.4)}
.slot.over,.bin.over{border-color:var(--acc); background:var(--acc-soft)}
.slot.hint::before{content:"drop here"; color:var(--muted); font-size:13px; padding-left:8px}
.slot .fix,.bin .fix{font-size:12.5px; color:var(--ok-deep); font-weight:700; padding:0 6px}
.bins{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.bin{border:2px dashed var(--line2); border-radius:16px; padding:10px; min-height:96px; background:rgba(255,255,255,.45); display:flex; flex-direction:column; gap:6px}
.bin h5{margin:0 0 4px; font-size:13px; font-weight:800; color:var(--ink2); letter-spacing:.02em}
.orderl{display:grid; gap:10px; counter-reset:o}
.orow{display:flex; align-items:center; gap:12px; background:var(--card); border:2px solid var(--line2); border-radius:14px; padding:10px 12px; box-shadow:0 3px 0 var(--line2); touch-action:none; user-select:none; cursor:grab}
.orow::before{counter-increment:o; content:counter(o); width:30px; height:30px; flex:none; display:grid; place-items:center; border-radius:9px; background:var(--paper2); font-weight:800}
.orow .t{flex:1; font-size:15px; line-height:1.35}
.orow .t b{font-family:var(--mono); color:var(--acc-deep); margin-right:6px}
.orow .mv{display:flex; flex-direction:column; gap:2px}
.orow .mv button{border:0; background:var(--paper2); border-radius:6px; width:28px; height:20px; cursor:pointer; line-height:1; font-size:12px}
.orow.right{border-color:var(--ok); background:var(--ok-soft)} .orow.wrong{border-color:var(--bad); background:var(--bad-soft)}

ap with\n`auto mail`: a durable, addressed, at-least-once channel between agents on one\nhost. This task is the epic's **T1 — the walking skeleton**.\n\nThe risk T1 exists to retire is not the store. It is **hook → notification**:\nwhether a working agent can be told it has mail, in-band, cheaply, without\nbreaking its turn. Deferring that would defer all the risk, so it is inside the\nskeleton. The second thing it retires is the *oracle*: the harness scenario is\nstood up now so T2–T4 are developed against a working end-to-end test rather\nthan one that arrives at the end and can only confirm what was already built."}]}, {"id": "scope-statement", "title": "What this task is", "summary": "Ontology first, then a harness scenario with two agents on one host, then one message travelling between them and being acked — proven by the scenario.", "tab": "Requirements", "md": "Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab).", "blocks": [{"kind": "md", "text": "Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab)."}]}, {"id": "target-transcript", "title": "The transcript this task must make real (C1)", "summary": "", "tab": "Requirements", "md": "", "blocks": [{"kind": "cli", "idx": 0}]}, {"id": "goals", "title": "Goals", "summary": "", "tab": "Requirements", "md": "1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4).** `auto mail subscribe|send|list|ack` — flat\n   verbs on `mail` as the resource noun, JSON on stdout, diagnostics on stderr.\n   Plus `init`, `docs` and `reset`.\n\n6. **Broadcast delivery with a compare-and-set ack (D-7, G2, G13).** Consumer\n   state is keyed by `(subscription, mail)`, delivery rows are materialised\n   **lazily against a subscription cursor** (D-10), and `ack` is a conditional\n   update inside the append-and-project transaction that **reports whether this\n   call won the transition**.\n\n7. **An in-band nudge to a working agent (G8).** `auto hooks fire` — the\n   existing PostToolUse adapter that already emits `hookSpecificOutput.\n   additionalContext` for hint rules — also tells an agent it has mail. The\n   no-mail path costs a `stat`, never opens the store, and can never stall or\n   break the hook.\n\n8. **The harness scenario is the verdict (G15).** A new, purely additive\n   `mail-flow` scenario under `harness/scenarios/` brings up two agents on one\n   host, runs the C1 loop against the **real `auto` binary in a container**, and\n   asserts the nudge and the ack. A capability that cannot be demonstrated there\n   is not finished.\n\n9. **Nothing already shipped breaks.** The package is new; the only edits to\n   existing code are additive command registration, the hook's mail check, and\n   the glossary. `make check` and `make test` stay green.", "blocks": [{"kind": "md", "text": "1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4).** `auto mail subscribe|send|list|ack` — flat\n   verbs on `mail` as the resource noun, JSON on stdout, diagnostics on stderr.\n   Plus `init`, `docs` and `reset`.\n\n6. **Broadcast delivery with a compare-and-set ack (D-7, G2, G13).** Consumer\n   state is keyed by `(subscription, mail)`, delivery rows are materialised\n   **lazily against a subscription cursor** (D-10), and `ack` is a conditional\n   update inside the append-and-project transaction that **reports whether this\n   call won the transition**.\n\n7. **An in-band nudge to a working agent (G8).** `auto hooks fire` — the\n   existing PostToolUse adapter that already emits `hookSpecificOutput.\n   additionalContext` for hint rules — also tells an agent it has mail. The\n   no-mail path costs a `stat`, never opens the store, and can never stall or\n   break the hook.\n\n8. **The harness scenario is the verdict (G15).** A new, purely additive\n   `mail-flow` scenario under `harness/scenarios/` brings up two agents on one\n   host, runs the C1 loop against the **real `auto` binary in a container**, and\n   asserts the nudge and the ack. A capability that cannot be demonstrated there\n   is not finished.\n\n9. **Nothing already shipped breaks.** The package is new; the only edits to\n   existing code are additive command registration, the hook's mail check, and\n   the glossary. `make check` and `make test` stay green."}]}, {"id": "inherited-rails", "title": "Inherited guard rails", "summary": "Twelve rails from epic 005. Each maps to exactly one acceptance criterion in the Verification tab.", "tab": "Requirements", "md": "| Rail | Constraint (abridged) | Becomes |\n|---|---|---|\n| **G1** | Mail rows and events are immutable; state changes are appended and re-projected | AC-3 |\n| **G2** | Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row | AC-4 |\n| **G3** | Ack is a separate explicit call; reading does not retire mail | AC-5 |\n| **G4** | At-least-once and unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to.", "blocks": [{"kind": "md", "text": "| Rail | Constraint (abridged) | Becomes |\n|---|---|---|\n| **G1** | Mail rows and events are immutable; state changes are appended and re-projected | AC-3 |\n| **G2** | Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row | AC-4 |\n| **G3** | Ack is a separate explicit call; reading does not retire mail | AC-5 |\n| **G4** | At-least-once and unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to."}]}, {"id": "out-of-scope", "title": "Out of Scope", "summary": "", "tab": "Requirements", "md": "Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem).", "blocks": [{"kind": "md", "text": "Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem)."}]}, {"id": "references", "title": "Reference code & docs", "summary": "Verified paths this task builds on or extends.", "tab": "Requirements", "md": "**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck.", "blocks": [{"kind": "md", "text": "**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck."}]}, {"id": "decisions", "title": "Decisions taken while writing these requirements", "summary": "", "tab": "Requirements", "md": "These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected.", "blocks": [{"kind": "md", "text": "These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected."}]}, {"id": "open-questions", "title": "Open Questions & Assumptions", "summary": "No open pd-questions — every fork was resolvable from the epic or an existing repo pattern. These are the assumptions carried forward.", "tab": "Requirements", "md": "Assumptions this task proceeds on. Each is safe to revisit without redoing work:\n\n- [ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\n  backlog records maildir as \"genuinely better for lock-free concurrent append\"\n  but superseded by SQLite once subscriptions, read state and bindings exist.\n  `modernc.org/sqlite` is already a direct dependency of two modules, so this\n  adds no runtime dependency.\n- [ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\n  write connection per process, with every write in one immediate transaction.**\n  D-11 names this as an explicit T1 concern; this is the conventional answer and\n  is asserted under `-race` rather than assumed.\n- [ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\n  cross-host merge argument in the backlog (§3). Subscription ids follow the\n  `sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\n  the store relies on**: cursors and every \"after this point\" comparison use the\n  log's own append sequence, because ULID monotonicity is process-local and\n  every `auto mail` verb is a separate process (D-11).\n- [ ] **The body is a JSON object**, and `--message <text>` is sugar for\n  `{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n  `kind` vocabulary and the open `attributes` map are additive fields on the\n  envelope.\n- [ ] **`auto mail list` with no filters returns every unacked delivery for every\n  subscription the caller is bound to**, per the project convention that\n  list commands return all items when no filters are given. `--address` scopes it\n  to one subscription.\n- [ ] **The sender's `from` address is resolved by a three-rung ladder**, because\n  a plain `auto mail send` process sees neither the hook payload's `agent` nor a\n  `session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n  `--from <address>`; (2) the address of a subscription bound to the caller's\n  `(manager, target)` — lowest subscription id when there is more than one, so it\n  is deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\n  project registry, or `unregistered/agent` when the cwd is not a registered\n  project. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\n  own reply address first, which is also how it becomes reachable for a reply. The\n  result is always a resolved absolute address, never a relative handle (G5).\n- [ ] **`--text` output mode is not built in T1.** JSON is the default and the\n  only mode; the consumers in T1 are agents and the harness. It arrives with T4's\n  adoption surface if a human ever needs it.", "blocks": [{"kind": "md", "text": "Assumptions this task proceeds on. Each is safe to revisit without redoing work:\n\n- [ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\n  backlog records maildir as \"genuinely better for lock-free concurrent append\"\n  but superseded by SQLite once subscriptions, read state and bindings exist.\n  `modernc.org/sqlite` is already a direct dependency of two modules, so this\n  adds no runtime dependency.\n- [ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\n  write connection per process, with every write in one immediate transaction.**\n  D-11 names this as an explicit T1 concern; this is the conventional answer and\n  is asserted under `-race` rather than assumed.\n- [ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\n  cross-host merge argument in the backlog (§3). Subscription ids follow the\n  `sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\n  the store relies on**: cursors and every \"after this point\" comparison use the\n  log's own append sequence, because ULID monotonicity is process-local and\n  every `auto mail` verb is a separate process (D-11).\n- [ ] **The body is a JSON object**, and `--message <text>` is sugar for\n  `{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n  `kind` vocabulary and the open `attributes` map are additive fields on the\n  envelope.\n- [ ] **`auto mail list` with no filters returns every unacked delivery for every\n  subscription the caller is bound to**, per the project convention that\n  list commands return all items when no filters are given. `--address` scopes it\n  to one subscription.\n- [ ] **The sender's `from` address is resolved by a three-rung ladder**, because\n  a plain `auto mail send` process sees neither the hook payload's `agent` nor a\n  `session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n  `--from <address>`; (2) the address of a subscription bound to the caller's\n  `(manager, target)` — lowest subscription id when there is more than one, so it\n  is deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\n  project registry, or `unregistered/agent` when the cwd is not a registered\n  project. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\n  own reply address first, which is also how it becomes reachable for a reply. The\n  result is always a resolved absolute address, never a relative handle (G5).\n- [ ] **`--text` output mode is not built in T1.** JSON is the default and the\n  only mode; the consumers in T1 are agents and the harness. It arrives with T4's\n  adoption surface if a human ever needs it."}]}, {"id": "test-strategy", "title": "Test Strategy", "summary": "Conformance-test driven: the guard rails are written as executable expectations first, and the harness scenario is the verdict.", "tab": "Verification", "md": "The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment.", "blocks": [{"kind": "md", "text": "The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment."}]}, {"id": "coverage-map", "title": "Coverage Map", "summary": "", "tab": "Verification", "md": "", "blocks": [{"kind": "mermaid", "idx": 0}]}, {"id": "acceptance-criteria", "title": "Acceptance Criteria", "summary": "Thirteen criteria: one per inherited guard rail, plus the C1 transcript and the harness scenario itself.", "tab": "Verification", "md": "Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped.", "blocks": [{"kind": "md", "text": "Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped."}]}, {"id": "verification-gaps", "title": "Known Gaps & Risks", "summary": "", "tab": "Verification", "md": "Stated rather than hidden. None of these blocks T1; each names who closes it.\n\n- **The `mail.Client` seam has one implementation.** Seam 1 warns that an\n  abstraction with one implementation is a guess. The conformance suite is the\n  mitigation (D-062-5), but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10).", "blocks": [{"kind": "md", "text": "Stated rather than hidden. None of these blocks T1; each names who closes it.\n\n- **The `mail.Client` seam has one implementation.** Seam 1 warns that an\n  abstraction with one implementation is a guess. The conformance suite is the\n  mitigation (D-062-5), but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10)."}]}, {"id": "approach", "title": "Approach", "summary": "A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle.", "tab": "Solution", "md": "Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built.", "blocks": [{"kind": "md", "text": "Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built."}]}, {"id": "end-state-flow", "title": "How one message travels", "summary": "Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions.", "tab": "Solution", "md": "", "blocks": [{"kind": "mermaid", "idx": 1}]}, {"id": "end-state-schema", "title": "The store at the end of this task", "summary": "", "tab": "Solution", "md": "Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against.", "blocks": [{"kind": "md", "text": "Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against."}, {"kind": "mermaid", "idx": 2}]}, {"id": "end-state-api", "title": "The client seam", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "api", "idx": 0}, {"kind": "api", "idx": 1}]}, {"id": "end-state-cli", "title": "The command surface at the end of this task", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "cli", "idx": 1}]}, {"id": "file-changes", "title": "File Changes", "summary": "", "tab": "Solution", "md": "", "blocks": [{"kind": "files"}]}, {"id": "rejected-alternatives", "title": "Rejected Alternatives", "summary": "", "tab": "Solution", "md": "- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none.", "blocks": [{"kind": "md", "text": "- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none."}]}, {"id": "summary", "title": "Summary", "summary": "", "tab": "Plan", "md": "Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle.", "blocks": [{"kind": "md", "text": "Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent
