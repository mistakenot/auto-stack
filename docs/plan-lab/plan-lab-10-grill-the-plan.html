, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle."}]}, {"id": "execution-sequence", "title": "Execution Sequence", "summary": "", "tab": "Plan", "md": "The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit.", "blocks": [{"kind": "md", "text": "The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit."}, {"kind": "mermaid", "idx": 3}]}, {"id": "success-criteria", "title": "Success Criteria", "summary": "", "tab": "Plan", "md": "- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines.", "blocks": [{"kind": "md", "text": "- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines."}]}], "decisions": [{"id": "D-062-1", "title": "Two agents on one host = two workspaces in one container, not two containers", "status": "accepted", "by": "agent", "summary": "The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts.", "tab": "Requirements", "section": null, "md": "**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control."}, {"id": "D-062-2", "title": "A binding is keyed by the physical context hooks already capture", "status": "accepted", "by": "agent", "summary": "Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing.", "tab": "Requirements", "section": null, "md": "**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes."}, {"id": "D-062-3", "title": "The no-mail hook path is gated by a pending-flag file, not a store read", "status": "accepted", "by": "agent", "summary": "G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite.", "tab": "Requirements", "section": null, "md": "**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package."}, {"id": "D-062-4", "title": "T1 ships init, docs and reset; quickstart and doctor land in T4", "status": "accepted", "by": "agent", "summary": "The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing.", "tab": "Requirements", "section": null, "md": "**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim."}, {"id": "D-062-5", "title": "T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface", "status": "accepted", "by": "agent", "summary": "D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3.", "tab": "Requirements", "section": null, "md": "**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire."}, {"id": "D-062-6", "title": "Inline notification in T1 is the pending flag; the bus event waits for the daemon", "status": "accepted", "by": "agent", "summary": "D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host.", "tab": "Requirements", "section": null, "md": "**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes."}, {"id": "D-062-7", "title": "Losing an ack race is a reported outcome, not an error exit", "status": "accepted", "by": "agent", "summary": "wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage.", "tab": "Requirements", "section": null, "md": "**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free."}, {"id": "D-062-8", "title": "One exported package, `auto-mail/mail`; the store stays internal", "status": "accepted", "by": "agent", "summary": "Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint.", "tab": "Solution", "section": null, "md": "**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence."}, {"id": "D-062-9", "title": "The hook writes one hookSpecificOutput object, carrying every fragment", "status": "accepted", "by": "agent", "summary": "The existing hint path already emits at most one object per event; a second producer must join it, not write a second line.", "tab": "Solution", "section": null, "md": "**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge."}], "threads": [{"anchor": "D-062-2", "status": "resolved", "priority": "p1", "title": "Binding freshness conflicts with the stat-only hook path", "tab": "Requirements", "comments": [{"by": "review", "html": "D-062-2 says every hook fire refreshes `last_seen` on the matching binding row, and AC-9 treats stale versus live bindings as observable through the `bound` count. But AC-10, the end-state flow, and Phase 3 require the hook mail check to perform zero store opens and even leave `~/.auto/mail/alpha-store.db` nonexistent on a host that never ran `auto mail init`. A hook cannot update a SQLite `bindings.last_seen` row without opening or creating the store. The current hook code also only captures context and then emits hints (`auto-cli/cmd/auto/hookscmd.go:94-124`); there is no existing binding-refresh sink. Resolve this before execution: either defer `last_seen`/staleness to T3 and define T1 `bound` as current binding rows, or add an explicit refresh mechanism and acceptance coverage that still satisfies G8."}, {"by": "author", "html": "Correct, and a real contradiction rather than an ambiguity — a `last_seen` refresh is a store write, and G8 forbids one in the hook. Resolved by scoping, not by weakening G8: D-062-2 now states that <strong>`subscribe` is the only writer of a binding row in T1<\/strong>, and that heartbeat refresh arrives with T3, which already owns liveness (G9, D-8) and has a daemon to carry the write. The consequence you implied is now recorded explicitly: in T1 <code>bound<\/code> means \"a binding row exists\", not \"an agent is alive right now\", and <code>auto mail docs<\/code> says so, so nobody reads a liveness promise into the count early. AC-9's \"stale or absent\" wording is corrected to \"no binding row\". The <code>last_seen<\/code> column is still created and stamped at subscribe, so T3 adds a writer rather than a schema change."}]}, {"anchor": "D-062-3", "status": "resolved", "priority": "p1", "title": "Present pending-flag behavior contradicts AC-10", "tab": "Requirements", "comments": [{"by": "review", "html": "D-062-3 says an absent flag returns immediately, but \"only a present flag causes a store open\"; its consequences also say a false positive costs one store open and emits nothing. Later sections require the opposite: the Approach says \"The nudge never opens the store\", the end-state flow says the hook stats the flag with no DB open, AC-10 requires zero store opens on either path, and Phase 3 tests `HasPending` for zero opens on both paths while emitting a nudge when the flag exists. These are mutually exclusive contracts. Pick whether a present flag is authoritative enough to emit the fixed nudge, or whether the hook confirms through the store, then align D-062-3, AC-10, and Phase 3."}, {"by": "author", "html": "Accepted — D-062-3 was written before the design settled and kept its earlier \"a present flag causes a store open\" text while every later section said the opposite. The hook opening the store was the stale half, so D-062-3 is now aligned to the rest: the hook stats exactly one path and <strong>never opens the store on either path<\/strong>; the flag is authoritative for the <em>decision to nudge<\/em>. That is safe precisely because the nudge is a fixed constant carrying no mailbox content, so a wrong decision can neither leak nor misstate anything. The consequences are restated to match: a false positive costs the agent one wasted <code>auto mail list<\/code>, which finds nothing and clears the flag itself, making drift self-healing rather than sticky."}]}, {"anchor": "AC-2", "status": "resolved", "priority": "p1", "title": "Default `from` address is not derivable today", "tab": "Verification", "comments": [{"by": "review", "html": "C1 omits `--from`, but the expected list payload includes `\"from\": \"auto-stack/reviewer\"`. The assumptions and Phase 2 say the fallback is derived from `&lt;project&gt;/&lt;agent&gt;` or `&lt;projectId&gt;/agent` via the registry. Checked `auto-shared/config/projects.go:20-31`: `ProjectRef` stores ID, Path, Remote, Name, Tools, and RegisteredAt, but no agent name. A normal `auto mail send` CLI process also does not receive the hook payload's `agent` or `session_id`, and T2 explicitly defers self-identification. Define the T1 source of `from` before implementation: require `--from` in C1/harness, use a documented env var, use a literal fallback such as `&lt;project&gt;/agent`, or add a subscribe-before-send identity path, then cover that exact behavior in AC-2."}, {"by": "author", "html": "Correct, and the evidence is right — <code>config.ProjectRef<\/code> carries no agent name, and a plain <code>auto mail send<\/code> sees neither the hook payload's <code>agent<\/code> nor a <code>session_id<\/code>; self-identification is exactly what D-13 defers to T2, so T1 must not depend on it. Resolved by defining an explicit three-rung ladder rather than leaving it to the implementer: (1) <code>--from &lt;address&gt;<\/code>; (2) the address of a subscription bound to the caller's <code>(manager, target)<\/code>, lowest subscription id when several so it is deterministic; (3) the literal <code>&lt;projectId&gt;/agent<\/code> from the registry, or <code>unregistered/agent<\/code> outside a registered project. C1's <code>auto-stack/reviewer<\/code> is rung 2 — the sender subscribed to its own reply address first, which is also what makes it reachable for a reply. AC-2 now asserts all three rungs, and the harness scenario has the sender subscribe first so C1's shape is the shape actually exercised."}]}, {"anchor": "AC-4", "status": "resolved", "priority": "p2", "title": "Cursor flag spelling is inconsistent", "tab": "Verification", "comments": [{"by": "review", "html": "AC-4 says the opt-out cursor case is created with `--from now`, but the command surface, file-change tree, and Phase 4 all use `--from-now`. Cobra will only accept `--from now` if a separate `--from` flag is implemented, which the plan does not list. Pick one spelling and make the acceptance criterion, CLI examples, and tests agree; if the intended surface is the flat boolean flag, AC-4 should name `--from-now`."}, {"by": "author", "html": "Correct — a typo in AC-4, not a second flag. Every other surface (the command transcript, the file-change tree, Phase 4) says <code>--from-now<\/code>, which is the intended boolean flag; AC-4 now says the same. No <code>--from<\/code> flag exists on <code>subscribe<\/code>."}]}, {"anchor": "AC-7", "status": "resolved", "priority": "p2", "title": "Duplicate delivery-row test contradicts the delivery key", "tab": "Verification", "comments": [{"by": "review", "html": "AC-7 says duplicate delivery handling is simulated by injecting a duplicate delivery row, but AC-4 and the schema require `deliveries` to be keyed by `(subscription_id, mail_id)`. A duplicate row for the same delivery should be rejected by the schema; a row for another subscription is broadcast fan-out, not a duplicate delivery. If the goal is to prove at-least-once/idempotent handling, simulate duplicate list output at the client/CLI boundary or use two distinct subscriptions deliberately. Do not require a persistent row shape the schema is supposed to forbid."}, {"by": "author", "html": "Accepted — asking a test to insert a row the <code>(subscription_id, mail_id)<\/code> primary key is supposed to forbid would have been asserting against the schema G2 requires. The intent was always the caller-facing half of G4, so the simulation moves to where duplicates can actually appear: a <code>Client<\/code> decorator that repeats one entry in the <code>List<\/code> result. AC-7 now states that explicitly, and says in as many words that a second <code>deliveries<\/code> row must not be used."}]}, {"anchor": "AC-11", "status": "resolved", "priority": "p2", "title": "`alpha.mail.read` is omitted from the alpha event list", "tab": "Verification", "comments": [{"by": "review", "html": "The Solution and Phase 2 define four event types, including `alpha.mail.read`, and the end-state schema says `read_at` is written in T1 so T3 has escalation history. AC-11's event-type list names only `alpha.mail.subscribed`, `alpha.mail.sent`, and `alpha.mail.acked`. If that list is treated as exhaustive, a correct read event will fail the acceptance test; if it is illustrative, the criterion is ambiguous. Include `alpha.mail.read` explicitly or state that the listed event types are examples."}, {"by": "author", "html": "Correct — the list was written before the decision to stamp <code>read_at<\/code> in T1 (taken so T3's escalation predicate has history to read) and was never updated. AC-11 now names the complete T1 vocabulary — <code>alpha.mail.subscribed<\/code>, <code>alpha.mail.sent<\/code>, <code>alpha.mail.read<\/code>, <code>alpha.mail.acked<\/code> — and states that the assertion is twofold: every emitted type carries the <code>alpha.<\/code> prefix, and these four are the complete set. No ambiguity about exhaustive versus illustrative is left."}]}, {"anchor": "AC-12", "status": "resolved", "priority": "p1", "title": "SQLite import guard fails against existing modules", "tab": "Verification", "comments": [{"by": "review", "html": "AC-12 says a repo-wide guard should fail on any `modernc.org/sqlite` import outside `auto-mail/internal/mail`; Phase 5 says outside `auto-mail/internal/store`. Both versions fail against the current repo before this task starts: `auto-watch/internal/store/store.go:15`, `auto-search/internal/indexdb/schema.go:9`, and `auto-search/internal/cochange/load.go:23` already import `modernc.org/sqlite`, and `auto-watch`/`auto-search` have direct v1.53.0 requirements in their `go.mod` files. The seam guard should target direct mail-store access instead: `alpha-store.db`, `~/.auto/mail`, `sqlite3` invocations against that path, and `auto-mail/internal/store` imports from outside the allowed mail packages. Also align the allowed path with the Solution, which uses `auto-mail/internal/store`, not `auto-mail/internal/mail`."}, {"by": "author", "html": "Correct, and this one would have failed on day zero — <code>auto-watch/internal/store/store.go<\/code> and <code>auto-search/internal/indexdb/schema.go<\/code> import <code>modernc.org/sqlite<\/code> for their own stores, entirely legitimately. The guard was aimed at the wrong thing: G11 is about the <em>mail store<\/em>, not about SQLite. AC-12 and Phase 5 are rewritten to target direct mail-store access — the <code>alpha-store.db<\/code> filename, an <code>~/.auto/mail<\/code> path opened as a database, a <code>sqlite3<\/code> invocation against either — plus an import guard on <code>auto-mail/internal/...<\/code> from outside the module. Both now say <code>auto-mail/internal/store<\/code>; the stale <code>internal/mail<\/code> path in AC-12 is gone. AC-12 also notes that the internal-import half is already a compile-time guarantee, so the test is a regression guard rather than the guarantee itself."}]}, {"anchor": "D-062-8", "status": "resolved", "priority": "p2", "title": "`rootcmd` is a second exported package", "tab": "Solution", "comments": [{"by": "review", "html": "D-062-8 says the public surface is exactly one package, `auto-mail/mail`, and that everything else stays under `internal/`. The file-change tree also adds `auto-mail/rootcmd/rootcmd.go`, and `auto-cli/cmd/auto/main.go` must import that package to mount `auto mail`, matching every existing tool's pattern. Clarify that the invariant is \"one exported domain/client API plus the required `rootcmd` mounting facade\"; otherwise an implementer could either hide `rootcmd` under `internal/` and break mounting, or write a seam guard that incorrectly treats the facade as a violation."}, {"by": "author", "html": "Fair, and the wording was genuinely misleading — an implementer following it literally would either have hidden <code>rootcmd<\/code> under <code>internal/<\/code> and broken mounting, or written a guard that flagged the façade. D-062-8 now states the invariant as \"one exported <strong>domain<\/strong> API (<code>auto-mail/mail<\/code>) plus the mandatory <code>rootcmd<\/code> mounting façade\", and records that the façade holds no domain logic and never touches the store — a wiring surface, not an API. The seam guard in Phase 5 is scoped accordingly."}]}], "acs": [{"id": "AC-1", "title": "G16 — the ontology lands before the code that uses it", "phases": "1", "tests": "auto-mail/mail/mail_test.go", "md": "- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green"}, {"id": "AC-2", "title": "C1 — the epic's transcript runs verbatim", "phases": "1,2", "tests": "auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py", "md": "- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `<projectId>/agent`, or `unregistered/agent` outside a registered project"}, {"id": "AC-3", "title": "G1 — mail and events are immutable", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go", "md": "- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)"}, {"id": "AC-4", "title": "G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor", "phases": "2,4", "tests": "auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go", "md": "- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)"}, {"id": "AC-5", "title": "G3 — ack is a separate explicit call; reading does not retire", "phases": "2,4", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "md": "- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller"}, {"id": "AC-6", "title": "G13 / D-7 — ack transitions exactly once and reports whether it won", "phases": "2,5", "tests": "auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go", "md": "- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint"}, {"id": "AC-7", "title": "G4 — at-least-once and unordered, as documented", "phases": "4,5", "tests": "auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go", "md": "- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide"}, {"id": "AC-8", "title": "G5 / D-9 — addresses are virtual and free-form", "phases": "2,3", "tests": "auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go", "md": "- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)"}, {"id": "AC-9", "title": "G6 — send with no subscription persists, and reports both counts", "phases": "4", "tests": "auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py", "md": "- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)"}, {"id": "AC-10", "title": "G8 — the nudge is free when there is no mail, and can never break the hook", "phases": "3", "tests": "auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py", "md": "- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent"}, {"id": "AC-11", "title": "G10 / D-2 — alpha is in the type string and the filename, and reset works", "phases": "1,5", "tests": "auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go", "md": "- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade"}, {"id": "AC-12", "title": "G11 — nothing outside the mail package reads the store", "phases": "5", "tests": "auto-mail/conformance/seam_test.go", "md": "- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")"}, {"id": "AC-13", "title": "G15 — it passes end to end in the harness", "phases": "1,2,3,4,5", "tests": "harness/tests/mail_flow/test_mail_loop.py", "md": "- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the send-before-subscribe case passes (AC-9's J2 half)\n- **And** every assertion uses bounded retry on the observable outcome, with no\n  `sleep`-to-settle and no assertion on counts that duplicates would break\n- **And** the scenario is registered in `harness/src/harness/cli.py`'s `SCENARIOS`\n  and adding it changed no existing scenario\n- **And** `make check` and `make test` are green from the repo root, with\n  `make test-race` green for the new `auto-mail` entry in `RACE_PROJECTS`"}], "phases": [{"n": "1", "title": "Ontology, module skeleton, and the scenario comes up", "files": "docs/concepts/UBIQUITOUS_LANGUAGE.md,auto-mail/go.mod,auto-mail/go.sum,auto-mail/CLAUDE.md,auto-mail/cmd/automail/main.go,auto-mail/rootcmd/rootcmd.go,auto-mail/internal/app/app.go,auto-mail/internal/cli/root.go,auto-mail/internal/cli/init.go,auto-mail/internal/cli/docs.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/config/settings.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/mail_test.go,auto-mail/internal/store/store.go,auto-mail/internal/store/schema.go,auto-cli/cmd/auto/main.go,auto-cli/go.mod,auto-cli/go.sum,go.work,Makefile,CLAUDE.md,harness/scenarios/mail-flow/Dockerfile,harness/scenarios/mail-flow/docker-compose.yaml,harness/scenarios/mail-flow/scripts/host-entrypoint.sh,harness/src/harness/scenarios/mail_flow.py,harness/src/harness/cli.py,harness/tests/mail_flow/__init__.py,harness/tests/mail_flow/conftest.py,harness/tests/mail_flow/test_mail_loop.py", "status": "done", "md": "**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.\n\n1. **Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   with five entries in the house format (bold term, definition, `_Avoid_:`,\n   optional `_Has_:`):\n   - **Mail** — the stored unit of an addressed, durable message between agents.\n     `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n   - **Address** — a virtual, free-form name a Mail is sent to, carrying no\n     physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n     `_Has_`: many Subscriptions.\n   - **Subscription** — a durable reader of an Address, holding its own cursor\n     and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n     `_Has_`: many Deliveries, one Binding.\n   - **Delivery** — the per-Subscription copy of one Mail and its read/ack\n     state. `_Avoid_`: receipt, copy, inbox item.\n   - **Binding** — the current physical target and liveness of a Subscription,\n     recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n     link, attachment, route.\n   Then update the frontmatter `summary` to name the five new terms.\n   **Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   exits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\n   refreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n   **Do not hand-edit the generated ER block.**\n\n2. **Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\n   copying `auto-artifact/`'s shape: `go.mod`\n   (`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n   `replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n   `modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n   `internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n   `internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\n   dir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n   `auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n   **Verify:** `cd auto-mail && go build ./...` after each file, per the project's\n   Go build discipline.\n\n3. **The store, minimal.** `internal/store/store.go`: `Open(path)` with\n   `os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n   `auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n   `busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n   `WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n   `schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n   `subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\n   creating the full shape now avoids a migration inside the task).\n   **Verify:** a store test that opens, migrates twice (idempotent) and closes.\n\n4. **The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\n   all six methods, the input/result types matching the C1 payloads, and sentinel\n   errors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\n   implementation where `List` works (returning an empty slice against a fresh\n   store) and the other four return a `not implemented in this phase` error.\n   Everything else stays under `internal/`, so no other module can reach the\n   store (D-062-8).\n\n5. **CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n   `EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n   `{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\n   reference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n   (JSON array on stdout, `[]` when empty).\n   `internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n   `[]` and writes nothing to stdout but JSON.\n   `auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\n   identifier, table name or event type in the module names the stored unit\n   `message` (the `--message` body flag is explicitly allowed).\n\n6. **Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\n   require + local replace; `auto-cli/cmd/auto/main.go` imports\n   `mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n   `mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n   `auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\n   table (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n   **Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.\n\n7. **The scenario comes up (the epic's second of three things).**\n   `harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\n   monorepo source with context `../../..`, mirroring\n   `harness/scenarios/event-flow/Dockerfile`.\n   `docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\n   healthcheck gating on `/tmp/mail-ready.json`.\n   `scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\n   empty commit + `auto init --project` in **both** `/workspace/project-a` and\n   `/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n   `harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\n   with `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\n   fail-fasts with a diagnostic if the ready file is missing, either workspace is\n   unregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\n   a `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\n   workspace (base64-piped, per the event-flow convention).\n   Register `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n   `harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\n   session-scoped fixture plus one test asserting the stack is up, both\n   workspaces are registered, and `auto mail list` returns `[]` from each.\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   from the repo root `make check` and `make test`; from `harness/`\n   `uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n   `uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\n   scenarios are untouched.\n   **Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`."}, {"n": "2", "title": "One message travels between two agents and is acked", "files": "auto-mail/internal/store/schema.go,auto-mail/internal/store/events.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/internal/ulid/ulid.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/address.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py", "status": "done", "depends-on": "1", "md": "The epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.\n\n1. **Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\n   lexicographically sortable **within one process** (the cross-host merge\n   property `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n   `sub_` + the ULID's leading 8 chars.\n   **Verify:** a test asserting monotonicity across 10k ids in one process and\n   sort order matching generation order — and scoped to say so, because that\n   ordering does not survive a process boundary and nothing in the store may\n   rest on it. Ordering the store depends on comes from the log's own `seq`\n   (see the cursor, below).\n\n2. **Events.** `internal/store/events.go`: the four `alpha.*` types —\n   `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n   `alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n   `Append(tx, ev)` as the **only** writer of the `events` table. Add the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n   `schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.\n\n3. **Projection.** `internal/store/project.go`, all inside one\n   `BEGIN IMMEDIATE` transaction per operation:\n   - `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n     (address + `from_cursor`) and its binding row.\n   - `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n     carrying the `seq` of that event as the store's own ordering of mail. It\n     writes **no** `deliveries` rows: materialisation is the read path's, and\n     only the read path's (D-10). Send additionally *reads* the two counts it\n     reports and the bindings whose pending flag the mail should raise.\n   - `list` → materialise any missing `deliveries` rows from each subscription's\n     `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n     `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n     nothing; return unacked rows.\n   - `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n     AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n     `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).\n\n4. **Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n   `/` explicitly allowed and never normalised (D-9); rejects empty,\n   whitespace-padded, control characters and over-length, each with a remediation\n   message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n   `tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\n   opaque pair. **Neither ever writes physical identity into an address or an\n   envelope** (G5).\n\n5. **The direct client.** Implement the remaining five `Client` methods in\n   `mail/direct.go` over the projection, returning exactly the C1 payload shapes.\n   The sender's `from` follows the three-rung ladder: `--from` → the address of a\n   subscription bound to the caller's `(manager, target)` (lowest subscription id\n   when several) → the literal `<projectId>/agent` from the registry, or\n   `unregistered/agent` outside a registered project. Always a resolved absolute\n   address, never a relative handle.\n\n6. **The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n   `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n   (`--address`, `--subscription`; unfiltered returns every unacked delivery for\n   every subscription bound to the caller), `ack.go` (positional mail id;\n   `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\n   with a remediation hint for an unknown id).\n   `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\n   exact payloads and that stdout is pure JSON.\n\n7. **The harness proves it (G15).** Extend `mail_flow.py` with\n   `subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n   `test_mail_loop.py` with the C1 loop across the two workspaces:\n   **project-a subscribes to its own reply address first** (so `from` resolves by\n   rung 2, as C1 shows), project-b subscribes to the target address, project-a\n   sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\n   presence of the mail id, never on counts (G4 permits duplicates).\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`."}, {"n": "3", "title": "The in-band nudge reaches a working agent", "files": "auto-mail/mail/pending.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/config/settings.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-cli/cmd/auto/hints.go,auto-cli/cmd/auto/hookscmd.go,auto-cli/cmd/auto/hints_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py", "status": "done", "depends-on": "2", "md": "The riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.\n\n1. **The pending flag.** `mail/pending.go`:\n   `flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\n   bytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n   `HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\n   every error — missing dir, permission denied — as \"no mail\". Add\n   `NudgeText() string`, a **constant**: an instruction to run `auto mail list`\n   and `auto mail ack` when acted on, with **no** interpolation of sender,\n   address, subject or body (G14's content rule, adopted for the in-band channel).\n   Wire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\n   subscriptions have nothing unacked left — the self-healing loop that bounds\n   flag drift (D-062-3).\n   **Verify:** `mail_test.go` — a counting store-opener injected over the package\n   var proves `HasPending` performs **zero** opens on both paths; flag lifecycle\n   across send → list → ack; a false-positive flag causes one `list` and then\n   clears itself.\n\n2. **Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\n   change `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\n   fragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\n   add `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\n   which writes **exactly one** `hookResponse` object, or nothing when every\n   fragment is empty. Update `hints_test.go` for the split — the behavioural\n   assertions carry over unchanged.\n\n3. **Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n   `matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n   `mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\n   fragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\n   stays inside the never-return-an-error region — any failure is swallowed and\n   the hook still exits 0.\n\n4. **Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\n   nudge emitted only when the flag exists; only on `PostToolUse`; **one**\n   `hookSpecificOutput` object when a hint rule also matches, with mail first;\n   exit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\n   file; and — the observable form of G8 — firing hooks on a `HOME` where\n   `auto mail init` never ran leaves `alpha-store.db` **non-existent**.\n\n5. **The harness proves it.** Add\n   `harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\n   PostToolUse payload, `cwd` patched per fire, mirroring\n   `event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n   `mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\n   returns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n   `test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n   `hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\n   the next fire emits nothing.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`;\n   `cd auto-cli && go test ./...`; repo-root `make check && make test`;\n   `uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n   (the hints change touches a path `event-flow` exercises — prove it is intact).\n   **Commit** `feat(062): in-band mail nudge on hook fire at stat cost`."}, {"n": "4", "title": "Delivery semantics and the Client conformance suite", "files": "auto-mail/conformance/conformance.go,auto-mail/conformance/conformance_test.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/mail/direct.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py", "status": "done", "depends-on": "3", "md": "The call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).\n\n1. **Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\n   the store's own high-water mark, `MAX(mail.seq)` read inside the same\n   `BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\n   the beginning of the log), and report `backfilled` as the count of unacked\n   mail the new cursor admits.\n\n   The cursor is a log position, **never a minted id**. A `--from-now` cursor of\n   `ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\n   ordering *between processes*, and D-11 makes every verb its own process: two\n   ids drawn in the same millisecond share a timestamp prefix and draw\n   independent tails, so a mail could sort below the cursor and be admitted by\n   nothing, ever. The write lock is what makes a high-water mark true instead.\n   **Verify:** send to an unsubscribed address, subscribe afterwards, `list`\n   returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n   `backfilled` is 0.\n\n2. **Broadcast (D-7).** Two subscriptions on one address each get their own\n   `deliveries` row and their own ack state; acking one leaves the other unacked.\n   **Verify:** `store_test.go` plus a conformance case.\n\n3. **Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n   `bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n   `0/0` for an unknown address, persists the mail, and writes the\n   likely-typo hint to **stderr** only.\n\n4. **The conformance suite.** `auto-mail/conformance/conformance.go` — a\n   `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n   `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\n   the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\n   appending no second event, backfill-on-subscribe both ways,\n   subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\n   with a separator. `conformance_test.go` runs it against `NewDirect`.\n   **Deliberately absent: any assertion about ordering** (G4).\n\n5. **The harness proves the J2 half.** Extend `test_mail_loop.py` with\n   send-before-subscribe across the two workspaces: project-a sends to an address\n   nobody holds, project-b subscribes afterwards and receives it.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`."}, {"n": "5", "title": "Rails made executable: immutability, the ack race, reset, the seam guard, docs", "files": "auto-mail/internal/store/store_test.go,auto-mail/internal/cli/reset.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/cli/docs.go,auto-mail/conformance/seam_test.go,auto-mail/CLAUDE.md,Makefile,harness/CLAUDE.md", "status": "done", "depends-on": "4", "md": "Everything the guard rails assert but nothing so far has been forced to prove.\n\n1. **Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\n   before a `list` + `ack` cycle and assert byte-identical rows after; assert the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\n   assert the ack appears as a **new** `alpha.mail.acked` row.\n\n2. **The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n   `Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\n   event, and every caller seeing `acked: true`. Plus a concurrent-writer test:\n   N processes' worth of goroutines sending to one address lose no events and\n   leave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n   `Makefile`.\n   **Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).\n\n3. **Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n   `alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\n   without `--yes` on a non-empty store with a remediation hint.\n   **Verify:** `cli_test.go` — reset then the C1 loop again from empty.\n\n4. **The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\n   repo root by walking up for `go.work` (skip the test if absent, so a\n   standalone module checkout still passes), then walk every module's Go source,\n   `harness/` and `skills/`, asserting that the **mail store** is named nowhere\n   outside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n   `~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\n   either. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n   `auto-search` import it for their own stores and would fail the guard on day\n   zero. Also assert no package outside `auto-mail` imports\n   `auto-mail/internal/...` (a regression guard over what the compiler already\n   enforces). Failure names the offending file and says \"go through\n   mail.Client\".\n\n5. **The alpha contract in writing (G10, G4).** `internal/cli/docs.go` and\n   `auto-mail/CLAUDE.md` both state, in as many words: **at-least-once,\n   unordered, consumers must be idempotent on mail id**; and **alpha — no\n   upcasters, no migrations, no compatibility guarantee, the store may be wiped\n   on upgrade, `reset` is supported**. `auto-mail/CLAUDE.md` also records the one\n   deliberate exception to `docs/auto-package-patterns.md` (D-062-8) so the next\n   package author does not read it as licence, and notes that `quickstart` and\n   `doctor` are epic task T4's.\n\n6. **Harness docs.** Add the `mail-flow` scenario to `harness/CLAUDE.md`'s\n   Scenarios section alongside `skill-remote` and `event-flow`, including why it\n   is one container (D-062-1).\n\n7. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check`, `make test`, `make test-race`; from `harness/`\n   `uv run pytest -v` (all three scenarios). Run `auto doc fix` if any doc\n   frontmatter drifted. **Commit**\n   `feat(062): mail immutability, ack-race, reset, seam guard and the alpha contract`.\n   Open the PR."}], "files": [{"path": "docs/concepts/UBIQUITOUS_LANGUAGE.md", "change": "edit", "desc": "G16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary."}, {"path": "auto-mail/go.mod", "change": "add", "desc": "module github.com/mistakenot/auto-mail; replace auto-shared => ../auto-shared; modernc.org/sqlite + cobra."}, {"path": "auto-mail/go.sum", "change": "add", "desc": "Checksums for the dependency set (all already present elsewhere in the workspace)."}, {"path": "auto-mail/CLAUDE.md", "change": "add", "desc": "Tool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped)."}, {"path": "auto-mail/cmd/automail/main.go", "change": "add", "desc": "Minimal entry point delegating to cli.Execute."}, {"path": "auto-mail/rootcmd/rootcmd.go", "change": "add", "desc": "New(stdout, stderr) façade so auto-cli can mount `auto mail`."}, {"path": "auto-mail/internal/app/app.go", "change": "add", "desc": "App context (stdout, stderr, cwd), per the blueprint."}, {"path": "auto-mail/internal/cli/root.go", "change": "add", "desc": "Root cobra command, ExitError, Execute; wires the subcommands."}, {"path": "auto-mail/internal/cli/init.go", "change": "add", "desc": "`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store."}, {"path": "auto-mail/internal/cli/docs.go", "change": "add", "desc": "`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer."}, {"path": "auto-mail/internal/cli/subscribe.go", "change": "add", "desc": "`auto mail subscribe <address> [--from-now] [--name]`; records the caller's binding."}, {"path": "auto-mail/internal/cli/send.go", "change": "add", "desc": "`auto mail send --to --message [--body] [--from]`; resolves the sender's absolute from-address."}, {"path": "auto-mail/internal/cli/list.go", "change": "add", "desc": "`auto mail list [--address] [--subscription]`; all bound subscriptions when unfiltered; clears a stale flag."}, {"path": "auto-mail/internal/cli/ack.go", "change": "add", "desc": "`auto mail ack <mail-id>`; prints wonTransition, exit 0 on a lost race (D-062-7)."}, {"path": "auto-mail/internal/cli/reset.go", "change": "add", "desc": "`auto mail reset [--yes]`; removes the store and flag directory, reports what it removed."}, {"path": "auto-mail/internal/cli/cli_test.go", "change": "add", "desc": "Command-level tests against a temp HOME asserting the exact C1 payload shapes and the error paths."}, {"path": "auto-mail/internal/config/settings.go", "change": "add", "desc": "Store and flag paths under ~/.auto/mail/, settings load/validate via auto-shared/config."}, {"path": "auto-mail/mail/client.go", "change": "add", "desc": "The public seam: Client interface, inputs/results, domain types, sentinel errors. The only exported package."}, {"path": "auto-mail/mail/direct.go", "change": "add", "desc": "NewDirect: the direct-store implementation D-11 binds the MVP CLI to."}, {"path": "auto-mail/mail/address.go", "change": "add", "desc": "ValidateAddress — permissive, separator explicitly allowed and never normalised (D-9)."}, {"path": "auto-mail/mail/binding.go", "change": "add", "desc": "BindingFor: the (manager, target) ladder over hooks.CaptureContext (D-062-2)."}, {"path": "auto-mail/mail/pending.go", "change": "add", "desc": "The pending-flag file: Set/Clear/HasPending (stat only) and NudgeText (a fixed constant)."}, {"path": "auto-mail/mail/mail_test.go", "change": "add", "desc": "Address validation, binding ladder, flag lifecycle, and the zero-store-opens assertion via an injected counting opener."}, {"path": "auto-mail/internal/store/store.go", "change": "add", "desc": "Open (MkdirAll, sql.Open, WAL + busy_timeout + foreign_keys), Close, single write connection, transaction helper."}, {"path": "auto-mail/internal/store/schema.go", "change": "add", "desc": "DDL: events (+ append-only triggers), mail (+ immutability trigger), subscriptions, deliveries, bindings, indexes, schema_migrations."}, {"path": "auto-mail/internal/store/events.go", "change": "add", "desc": "The alpha.mail.* event types, the versioned envelope, and the append path (the only writer of `events`)."}, {"path": "auto-mail/internal/store/project.go", "change": "add", "desc": "Same-transaction projection: mail insert, lazy delivery materialisation from the cursor, read stamp, ack compare-and-set, binding upsert."}, {"path": "auto-mail/internal/store/store_test.go", "change": "add", "desc": "Immutability (triggers abort UPDATE/DELETE), cursor backfill, broadcast fan-out, and the concurrent-writer test run under -race."}, {"path": "auto-mail/internal/ulid/ulid.go", "change": "add", "desc": "Sender-generated ids, monotonic and sortable within one process — the cross-host merge property the backlog names. Not the store's ordering: cursors use the log's `seq`."}, {"path": "auto-mail/conformance/conformance.go", "change": "add", "desc": "The Client contract suite, written against the interface: explicit ack, wonTransition, backfill-on-subscribe, subscriptions-vs-bound, idempotent re-ack."}, {"path": "auto-mail/conformance/conformance_test.go", "change": "add", "desc": "Runs the suite against the direct-store implementation; T3 adds the RPC one as a second target."}, {"path": "auto-mail/conformance/seam_test.go", "change": "add", "desc": "AC-12 guard: walks the repo (located via go.work) asserting the store filename and sqlite imports appear only under auto-mail/internal/store."}, {"path": "auto-cli/cmd/auto/main.go", "change": "edit", "desc": "Import mailcmd and add mailcmd.New(stdout, stderr) to root.AddCommand."}, {"path": "auto-cli/cmd/auto/hints.go", "change": "edit", "desc": "Split emission from matching: matchHint returns the rendered fragment; emitAdditionalContext writes exactly one hookSpecificOutput object for all fragments."}, {"path": "auto-cli/cmd/auto/hookscmd.go", "change": "edit", "desc": "After the existing sinks, stat the pending flag for the firing agent's binding and prepend the fixed mail fragment to the single emission."}, {"path": "auto-cli/cmd/auto/hints_test.go", "change": "edit", "desc": "Update for the matchHint/emitAdditionalContext split; existing behaviour assertions unchanged."}, {"path": "auto-cli/cmd/auto/hooksmail_test.go", "change": "add", "desc": "Hook-side tests: nudge emitted only with a flag and only on PostToolUse, one emission when a hint also matches, exit 0 with an absent/unreadable store, and no store file created."}, {"path": "auto-cli/go.mod", "change": "edit", "desc": "Require github.com/mistakenot/auto-mail with a local replace directive."}, {"path": "auto-cli/go.sum", "change": "edit", "desc": "Checksums for the new module edge."}, {"path": "go.work", "change": "edit", "desc": "Add ./auto-mail to the use block."}, {"path": "Makefile", "change": "edit", "desc": "Add auto-mail to PROJECTS and to RACE_PROJECTS (the ack race and concurrent writers must run under -race)."}, {"path": "CLAUDE.md", "change": "edit", "desc": "Add the auto-mail row to the Sub-Projects table."}, {"path": "harness/scenarios/mail-flow/Dockerfile", "change": "add", "desc": "Builds the real auto binary from monorepo source (context ../../..) into a single host image."}, {"path": "harness/scenarios/mail-flow/docker-compose.yaml", "change": "add", "desc": "One `host` service, init: true, healthcheck gating on the mail-ready file."}, {"path": "harness/scenarios/mail-flow/scripts/host-entrypoint.sh", "change": "add", "desc": "Seeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file."}, {"path": "harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json", "change": "add", "desc": "A minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern)."}, {"path": "harness/src/harness/scenarios/mail_flow.py", "change": "add", "desc": "MailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry."}, {"path": "harness/src/harness/cli.py", "change": "edit", "desc": "One line registering mail-flow in SCENARIOS."}, {"path": "harness/tests/mail_flow/__init__.py", "change": "add", "desc": "Package marker, mirroring tests/event_flow."}, {"path": "harness/tests/mail_flow/conftest.py", "change": "add", "desc": "Session-scoped fixture: up(build=True) then down() at teardown."}, {"path": "harness/tests/mail_flow/test_mail_loop.py", "change": "add", "desc": "AC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion."}, {"path": "harness/CLAUDE.md", "change": "edit", "desc": "Document the mail-flow scenario alongside skill-remote and event-flow."}], "clis": [{"id": "C1", "title": "zsh — two agents trading a message", "caption": "Subscribe, send, list, ack — the whole T1 surface. Copied from epic 005; T1 must reproduce these payload shapes.", "section": "target-transcript", "steps": [{"note": "receiver binds a virtual channel", "status": "done", "cmd": "auto mail subscribe auto-web/bugs", "out": "{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"}, {"note": "sender is in a different project, same host", "status": "done", "cmd": "auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"", "out": "{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }"}, {"note": "receiver is nudged mid-turn, then lists", "status": "done", "cmd": "auto mail list", "out": "[\n  {\n    \"id\": \"01K9X2QF7M3B0V8N\",\n    \"from\": \"auto-stack/reviewer\",\n    \"sentAt\": \"2026-08-25T10:14:02Z\",\n    \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" }\n  }\n]"}, {"note": "explicit ack — separate call, always", "status": "done", "cmd": "auto mail ack 01K9X2QF7M3B0V8N", "out": "{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }"}, {"note": "acked mail is gone from the default view", "status": "done", "cmd": "auto mail list", "out": "[]"}]}, {"title": "zsh — the full auto mail surface after T1", "caption": "C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4).", "section": "end-state-cli", "steps": [{"note": "creates ~/.auto/mail/ and the alpha store", "status": "done",
