/* ---------------- files margin ---------------- */
function renderFiles(){
  const F=M.files, cnt=k=>F.filter(f=>f.change===k).length;
  // build tree
  const root={name:'',dirs:{},files:[]};
  F.forEach(f=>{ const parts=f.path.split('/'); let n=root; parts.slice(0,-1).forEach(p=>{ n.dirs[p]=n.dirs[p]||{name:p,dirs:{},files:[]}; n=n.dirs[p]; }); n.files.push(f); });
  const compress = n => { Object.values(n.dirs).forEach(compress);
    const ks=Object.keys(n.dirs);
    Object.values(n.dirs).forEach(ch=>{}); return n; };
  function collapse(n){ // merge single-child chains
    for(const k of Object.keys(n.dirs)){
      let c=n.dirs[k];
      while(Object.keys(c.dirs).length===1 && c.files.length===0){ const only=Object.values(c.dirs)[0]; c={name:c.name+'/'+only.name,dirs:only.dirs,files:only.files}; }
      delete n.dirs[k]; n.dirs[c.name]=c; collapse(c);
    }
  }
  collapse(root);
  const allFiles = n => n.files.concat(...Object.values(n.dirs).map(allFiles));
  const kindGlyph={func:'ƒ',method:'ƒ',type:'T',interface:'I',const:'c',var:'v',test:'✓',cmd:'$'};
  const cgl={add:'+',edit:'~',delete:'−',context:'·',same:'·'};
  const orderF=(a,b)=>{ const o={add:0,edit:1,delete:2,context:3}; return (o[a.change]-o[b.change]) || a.path.localeCompare(b.path); };
  function rd(n,depth){
    const dirs=Object.values(n.dirs).sort((a,b)=>a.name.localeCompare(b.name));
    let h='';
    dirs.forEach(d=>{
      const fs=allFiles(d); const allNew=fs.every(f=>f.change==='add'); const anyCh=fs.some(f=>f.change!=='context');
      const badge = allNew && fs.length>3 ? `<span class="badge">NEW</span>` : (PID&&M.plan.kind==='brownfield'&&anyCh&&fs.some(f=>f.change==='context')? `<span class="badge b">${fs.filter(f=>f.change!=='context').length}/${fs.length}</span>`:'');
      h+=`<div class="dir">▾ ${esc(d.name)}/ ${badge}</div><div class="kids">${rd(d,depth+1)}</div>`;
    });
    n.files.slice().sort(orderF).forEach(f=>{
      const syms=f.symbols||[];
      h+=`<div class="file ${f.change}" data-f="${esc(f.path)}"><button class="frow2" data-lens="f:${esc(f.path)}" data-act="file" data-id="${esc(f.path)}" title="${esc(f.path)}${f.why?' — '+esc(f.why):''}"><span class="cg ${f.change}">${cgl[f.change]||'·'}</span><span class="fname">${esc(f.path.split('/').pop())}</span></button>
        ${syms.length?`<div class="syms">${syms.map(s=>`<div class="sym" data-n="${esc(s.name)}" data-c="${esc(s.change)}" data-lens="s:${esc(f.path)}#${esc(s.name)}" title="${esc(s.sig||s.name)}${s.note?' — '+esc(s.note):''}"><span class="cg ${s.change}">${cgl[s.change]||'·'}</span><span class="k">${kindGlyph[s.kind]||'·'}</span><span class="n">${esc(s.name)}</span></div>`).join('')}<div class="symmore"></div></div>`:''}
      </div>`;
    });
    return h;
  }
  $('#mFiles').innerHTML = `<div class="mh"><span>▤ Files → symbols</span><span class="cnt"><span class="a">+${cnt('add')}</span> <span class="e">~${cnt('edit')}</span> <span class="d">−${cnt('delete')}</span> <span class="c">·${cnt('context')}</span></span></div><div class="tree">${rd(root,0)}</div>`;
}

/* ---------------- deps margin ---------------- */
function renderDeps(){
  const N=M.deps.nodes, E=M.deps.edges;
  const out={}; E.forEach(e=>{ (out[e.from]=out[e.from]||[]).push(e); });
  const hasIn=new Set(E.map(e=>e.to));
  const roots=N.filter(n=>!hasIn.has(n.id)).map(n=>n.id);
  E.forEach(e=>{ if(!IDX.n[e.from] && !roots.includes(e.from)) roots.push(e.from); });
  const reach=id=>{ const s=new Set(); const st=[id]; while(st.length){ const x=st.pop(); (out[x]||[]).forEach(e=>{ if(!s.has(e.to)){ s.add(e.to); st.push(e.to);} }); } return s.size; };
  roots.sort((a,b)=>reach(b)-reach(a));
  const modCount={}; N.forEach(n=>{ if(n.change!=='same' && n.module) modCount[n.module]=(modCount[n.module]||0)+1; });
  const MAIN=Object.keys(modCount).sort((a,b)=>modCount[b]-modCount[a])[0]||'';
  const short=id=> MAIN && id.startsWith(MAIN+'/') ? id.slice(MAIN.length+1) : id;
  const seen=new Set(); let h='';
  const cgl={add:'+',edit:'~',same:'·'};
  function walk(id,depth,edge){
    const n=IDX.n[id]||{id,kind:'pkg',change:'same'};
    const rep=seen.has(id); seen.add(id);
    const ind = depth? '│ '.repeat(depth-1)+'├ ' : '';
    const ext = n.kind==='external';
    h+=`<div class="dn ${ext?'ext':''} ${rep?'rep':''}" data-n="${esc(id)}" data-lens="n:${esc(id)}" title="${esc(id)}${edge&&edge.note?' — '+esc(edge.note):''}${n.kind!=='pkg'?' ('+esc(n.kind)+')':''}">
      <span class="ind">${ind}</span><span class="cg ${n.change==='edit'?'edit':n.change==='add'?'add':'same'}">${cgl[n.change]||'·'}</span><span class="nm">${esc(short(id))}</span>${edge&&edge.change==='add'&&n.change!=='add'?'<span class="ech" title="new import edge">+→</span>':''}${rep&&(out[id]||[]).length?' <span class="ind">↺</span>':''}</div>`;
    if(rep) return;
    (out[id]||[]).slice().sort((a,b)=>((IDX.n[a.to]||{}).kind==='external')-((IDX.n[b.to]||{}).kind==='external')||a.to.localeCompare(b.to)).forEach(e=>walk(e.to,depth+1,e));
  }
  roots.forEach(r=>walk(r,0,null));
  N.forEach(n=>{ if(!seen.has(n.id)) walk(n.id,0,null); });
  const walls = M.deps.forbidden.map((w,i)=>`<div class="wall" data-w="${i}" data-lens="w:${i}" title="${esc(w.why)} · enforced by ${esc(w.enforcedBy)}"><span class="x">✕</span><span>${esc(w.from)} <span class="to">↛ ${esc(w.to)}</span></span></div>`).join('');
  const stacks = M.callstacks.map(c=>`<button class="csr" data-c="${c.id}" data-lens="c:${c.id}" data-act="stack" data-id="${c.id}" title="${esc(c.title)} — ${esc(c.trigger||'')}"><span class="i">≡${c.id.replace('CS','')}</span><span class="t">${esc(c.title)}</span></button>`).join('');
  $('#mDeps').innerHTML = `<div class="mh"><span>⋔ Imports</span><span class="cnt">${N.length} pkgs · ${E.length} edges</span></div>${MAIN?`<div class="mh" style="margin-top:-4px"><span class="cnt" style="letter-spacing:0">${esc(MAIN)}/… shown short</span></div>`:''}<div class="dtree">${h}</div>
    <div class="walls"><div class="mh"><span>✕ Walls</span><span class="cnt">${M.deps.forbidden.length}</span></div>${walls}</div>
    <div class="stacks"><div class="mh"><span>≡ Call stacks</span><span class="cnt">▶ from here</span></div>${stacks}</div>`;
}

/* ---------------- player ---------------- */
function stopPlay(){ if(S.play){ S.play.timers.forEach(clearTimeout); S.play=null; } S.live=null; applyLive(); }
function play(aid, csId){
  stopPlay();
  const a=IDX.a[aid]; const g=a.goal;
  S.openG.add(g); S.openA.add(aid); syncOpen();
  setFocus('a:'+aid, false);
  const el=$('#pl-'+aid); el.classList.add('on');
  const stacks=IDX.stacksOfAc(aid);
  let cs = csId ? IDX.cs[csId] : (stacks.find(c=>!/^BEFORE/i.test(c.title)) || stacks[0]);
  const man=a.verify.kind==='manual';
  const tests=a.verify.tests||[];
  const chips = stacks.length>1 ? stacks.map(c=>`<button class="cs-chip ${c===cs?'on':''} ${/^BEFORE/i.test(c.title)?'before':''}" data-act="playcs" data-id="${aid}" data-cs="${c.id}">≡${c.id} ${esc(c.title.replace(/^(BEFORE|AFTER):\s*/i,m=>m.toLowerCase()).slice(0,48))}</button>`).join('') : (cs?`<span class="cs-chip on">≡${cs.id} ${esc(cs.title.slice(0,60))}</span>`:'');
  let stage='';
  const LW=50, RH=26;
  if(cs){
    const used=LANES.filter(l=>cs.frames.some(f=>f.layer===l));
    const cols=`repeat(${used.length},${LW}px) minmax(0,1fr)`;
    const pts=cs.frames.map((f,i)=>[used.indexOf(f.layer)*LW+LW/2, i*RH+RH/2]);
    const W=used.length*LW, H=cs.frames.length*RH;
    stage = `<div class="stage"><div class="lanes" style="grid-template-columns:${cols}">${used.map(l=>`<div>${l}</div>`).join('')}<div></div></div>
      <div class="rows" style="min-width:${W+260}px">
        ${used.map((l,i)=>`<span class="lanebg" style="left:${i*LW}px"></span>`).join('')}
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
          <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3a4148" stroke-width="2"/>
          <polyline class="trace" points="" fill="none" stroke="#ffd76a" stroke-width="2.5" stroke-linejoin="round"/>
          ${pts.map((p,i)=>`<circle class="fd" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="5" fill="#1a1c1f" stroke="#59626b" stroke-width="2"/>`).join('')}
        </svg>
        ${cs.frames.map((f,i)=>`<div class="frow" data-i="${i}" style="grid-template-columns:${cols}" title="${esc(f.file)}">${used.map(()=>'<span></span>').join('')}<span class="txt"><span class="fsym">${esc(f.symbol)}</span><span class="does">${md(f.does)}</span>${f.effect?`<span class="eff">→ ${md(f.effect)}</span>`:''}</span></div>`).join('')}
      </div></div>
      <div class="res">${esc(cs.result||'')}</div>`;
  }
  const kindLbl = {'go-test':'go test','race':'go test -race','harness':'harness · pytest','grep':'grep','manual':'manual check'}[a.verify.kind]||a.verify.kind;
  el.innerHTML = `<div class="pl-top">${chips}</div>${cs&&cs.trigger?`<div class="pl-trig">${md(cs.trigger)}</div>`:''}${stage}
    <div class="tests">${tests.map(t=>{ const [p,n]=testParts(t); return `<div class="tline"><span class="ok">✓</span> ${esc(n)} <span class="f">${esc(p.split('/').slice(-2).join('/'))}</span></div>`; }).join('')}</div>
    <div class="stamp ${man?'manual':''}"><span class="big">${man?'CHECK BY EYE':'PASS'}</span><span class="sm">${esc(kindLbl)}${tests.length?' · '+tests.length+' named test'+(tests.length>1?'s':''):''} · @${esc(M.plan.builtCommit)}</span></div>
    <div class="pl-note">replay of the traced path + the real test names at ${esc(M.plan.builtCommit)} — run the command above to execute</div>`;
  scrollIntoViewIfNeeded(el.closest('.ac'));
  const P={timers:[]}; S.play=P;
  const T=(ms,fn)=>P.timers.push(setTimeout(()=>{ if(S.play===P) fn(); },ms));
  let t=150;
  if(cs){
    const rows=$$('.frow',el), dots=$$('.fd',el), trace=$('.trace',el);
    const pts=cs.frames.map((f,i)=>{ const used=LANES.filter(l=>cs.frames.some(x=>x.layer===l)); return [used.indexOf(f.layer)*LW+LW/2, i*RH+RH/2]; });
    cs.frames.forEach((f,i)=>{
      T(t,()=>{
        rows.forEach((r,j)=>{ r.classList.toggle('now',j===i); r.classList.toggle('seen',j<i); });
        dots.forEach((d,j)=>{ d.setAttribute('fill', j<i?'#8fd19e':j===i?'#ffd76a':'#1a1c1f'); d.setAttribute('stroke', j<=i?(j===i?'#ffd76a':'#8fd19e'):'#59626b'); d.setAttribute('r', j===i?6.5:5); });
        trace.setAttribute('points', pts.slice(0,i+1).map(p=>p.join(',')).join(' '));
        S.live={file:f.file, symbol:f.symbol}; applyLive();
      });
      t+=520;
    });
    T(t,()=>{ rows.forEach(r=>{r.classList.remove('now');r.classList.add('seen');}); dots.forEach(d=>{d.setAttribute('r',5);d.setAttribute('fill','#8fd19e');d.setAttribute('stroke','#8fd19e');}); $('.res',el).classList.add('on'); S.live=null; applyLive(); });
    t+=450;
  }
  $$('.tline',el).forEach((ln,i)=>{ T(t,()=>{ ln.classList.add('on'); const [p,n]=testParts(tests[i]); S.live={file:p,symbol:n}; applyLive(); }); t+=200; });
  T(t+150,()=>{ $('.stamp',el).classList.add('on'); S.live=null; applyLive(); if(!man){ markPlayed(aid); } else markPlayed(aid);
    const acEl=$('#a-'+aid); acEl.classList.add('done'); $('.box',acEl).textContent='✓';
    refreshPips(); updateScore(); S.play=null; });
}
function refreshPips(){ const played=playedSet(); $$('.pip').forEach(p=>p.classList.toggle('done', played.has(p.title))); }
function scrollIntoViewIfNeeded(el){ if(!el) return; const c=$('#center'); const r=el.getBoundingClientRect(); const vh=window.innerHeight;
  if(r.top<60 || r.top>vh*0.55) el.scrollIntoView({block:'start',behavior:'smooth'}); }

/* ---------------- grill ---------------- */
let GR = null;
function masteryByGoal(){
  const m={}; M.goals.forEach(g=>m[g.id]={c:0,t:0});
  ['ac','dec'].forEach(r=>{ const res=store.get('mastery:'+PID+':'+r,null); if(res) Object.entries(res).forEach(([g,v])=>{ if(m[g]){ m[g].c+=v.c; m[g].t+=v.t; } }); });
  return m;
}
function shuffle(a){ a=a.slice(); let seed=Date.now()%9973; for(let i=a.length-1;i>0;i--){ seed=(seed*9301+49297)%233280; const j=Math.floor(seed/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newGrill(round){
  const items = round==='ac' ? M.acs.map(a=>({id:a.id, kind:'a', text:a.title, ans:[a.goal]}))
                             : M.decisions.map(d=>({id:d.id, kind:'d', text:d.title, ans:(d.goals&&d.goals.length?d.goals:[...new Set((d.acs||[]).map(x=>IDX.a[x].goal))])}));
  GR = {round, items:shuffle(items), placed:{}, picked:null, checked:false};
}
function renderGrill(){
  if(!GR) newGrill('ac');
  const placedCount=Object.keys(GR.placed).length, total=GR.items.length;
  const pool=GR.items.filter(it=>!GR.placed[it.id]);
  const card = it => { const pl=GR.placed[it.id]; const ok = GR.checked && pl ? it.ans.includes(pl) : null;
    return `<button class="card ${it.kind==='a'?'acard':'dcard'} ${GR.picked===it.id?'picked':''} ${ok===true?'ok':ok===false?'bad':''}" draggable="${!GR.checked}" data-card="${it.id}"><span class="gl">${it.kind==='a'?'☑':'◆'}</span><span>${md(it.text)}${ok===false?`<span class="fix">→ ${it.ans.join('/')}</span>`:''}</span></button>`; };
  let score='';
  if(GR.checked){ const c=GR.items.filter(it=>GR.placed[it.id]&&it.ans.includes(GR.placed[it.id])).length;
    score=`<div class="gr-done on"><span class="big">${c}/${total}</span><span>${c===total?'Ladder rebuilt from memory.':'Red cards show where they belong. Heat is now on each rung.'}</span></div>`; }
  const res = GR.checked ? perGoal() : null;
  $('#grill').innerHTML = `
    <div class="gr-top">
      <div class="gr-row">
        <span class="gr-q">${GR.round==='ac'?'Hang each <span class="g-ac">☑ criterion</span> on its <span class="g-goal">◎ goal</span>':'Which <span class="g-goal">◎ goal</span> does each <span class="g-dec">◆ decision</span> constrain?'}</span>
        <span class="gr-prog">${placedCount}/${total}</span>
      </div>
      <div class="gr-row" style="margin-top:8px">
        <div class="seg" id="roundSeg"><button data-round="ac" class="${GR.round==='ac'?'on':''}">☑ → ◎</button><button data-round="dec" class="${GR.round==='dec'?'on':''}">◆ → ◎</button></div>
        <button class="btn pri" data-gact="check" ${placedCount===0||GR.checked?'disabled':''}>Check</button>
        <button class="btn" data-gact="reset">Shuffle again</button>
        <button class="btn" data-gact="back">Back to ladder</button>
      </div>
      ${GR.checked?'':`<div class="pool" id="pool">${pool.map(card).join('') || '<span class="gdesc" style="margin:6px 2px">All placed — press Check.</span>'}</div>`}
    </div>
    ${score}
    <div class="gr-ladder">${M.goals.map(g=>{ const r=res&&res[g.id]; return `<div class="zone" data-zone="${g.id}"><span class="rbar"><span class="gnum">${g.id}</span></span><div><div class="zt">${md(g.title)}</div><div class="zc">${GR.items.filter(it=>GR.placed[it.id]===g.id).map(card).join('')}</div></div>${r&&r.t?`<span class="zh" style="background:${heatColor(r.c/r.t)}">${r.c}/${r.t}</span>`:''}</div>`; }).join('')}</div>`;
  document.body.classList.toggle('picking', !!GR.picked);
}
function perGoal(){ const r={}; M.goals.forEach(g=>r[g.id]={c:0,t:0});
  GR.items.forEach(it=>{ it.ans.forEach(g=>{ if(r[g]){ r[g].t++; if(GR.placed[it.id]===g) r[g].c++; } }); }); return r; }
function gCheck(){ GR.checked=true; GR.picked=null; store.set('mastery:'+PID+':'+GR.round, perGoal()); renderGrill(); updateScore(); }
function place(itemId, g){ if(GR.checked) return; GR.placed[itemId]=g; GR.picked=null; renderGrill(); }

/* ---------------- focus / actions ---------------- */
function setFocus(key, scroll=true){ S.focus=key; applyLens(); if(scroll) scrollFirstLit(); writeHash(); }
function toggleGoal(id){ if(S.openG.has(id)){ S.openG.delete(id); if(S.focus==='g:'+id) S.focus=null; } else { S.openG.add(id); S.focus='g:'+id; } syncOpen(); applyLens(); scrollFirstLit(); writeHash(); }
function toggleAc(id){ if(S.openA.has(id)){ S.openA.delete(id); S.focus='g:'+IDX.a[id].goal; } else { S.openA.add(id); S.focus='a:'+id; } syncOpen(); applyLens(); scrollFirstLit(); writeHash(); }
function jump(key){
  const [k,id]=[key.slice(0,key.indexOf(':')), key.slice(key.indexOf(':')+1)];
  if(k==='g'){ S.openG.add(id); syncOpen(); setFocus(key); flash($('#r-'+id)); $('#r-'+id).scrollIntoView({block:'start',behavior:'smooth'}); }
  if(k==='a'){ const a=IDX.a[id]; if(!a) return; S.openG.add(a.goal); S.openA.add(id); syncOpen(); setFocus(key); flash($('#a-'+id)); $('#a-'+id).scrollIntoView({block:'center',behavior:'smooth'}); }
  if(k==='d'){ const d=IDX.d[id]; const g=(d.goals&&d.goals[0])||(IDX.a[(d.acs||[])[0]]||{}).goal; if(!g) return; S.openG.add(g); S.openD.add(id); syncOpen(); setFocus(key); const el=$(`#d-${g}-${id}`)||$(`.dec[data-d="${id}"]`); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); } }
}
function flash(el){ if(!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function flashBreak(x){ if(x.startsWith('AC')){ const el=$('#a-'+x); if(el && el.offsetParent) flash(el); const g=IDX.a[x]&&IDX.a[x].goal; if(g) flash($('#r-'+g)); } else flash($('#r-'+x)); }

document.addEventListener('click', e=>{
  const t=e.target;
  const planB=t.closest('[data-plan]'); if(planB){ loadPlan(planB.dataset.plan); return; }
  const modeB=t.closest('[data-mode]'); if(modeB){ setMode(modeB.dataset.mode); return; }
  const sh=t.closest('[data-sheet]'); if(sh){ toggleSheet(sh.dataset.sheet); return; }
  if(t.id==='scrim'){ toggleSheet(null); return; }
  if(t.closest('#bOpenAll')){ M.goals.forEach(g=>S.openG.add(g.id)); syncOpen(); return; }
  if(t.closest('#bCloseAll')){ stopPlay(); S.openG.clear(); S.openA.clear(); S.openD.clear(); S.focus=null; syncOpen(); applyLens(); writeHash(); return; }
  if(t.closest('#bClear')){ stopPlay(); setFocus(null); return; }
  const go=t.closest('[data-go]'); if(go){ jump(go.dataset.go); return; }
  const jb=t.closest('[data-jump]'); if(jb){ e.stopPropagation(); jump(jb.dataset.jump); return; }
  // grill
  const rs=t.closest('[data-round]'); if(rs){ newGrill(rs.dataset.round); renderGrill(); return; }
  const ga=t.closest('[data-gact]'); if(ga){ const a=ga.dataset.gact; if(a==='check') gCheck(); if(a==='reset'){ newGrill(GR.round); renderGrill(); } if(a==='back') setMode('ladder'); return; }
  const cd=t.closest('[data-card]'); if(cd && S.mode==='grill'){ if(GR.checked) return; const id=cd.dataset.card;
    if(GR.placed[id] && !GR.picked){ delete GR.placed[id]; renderGrill(); return; }
    GR.picked = GR.picked===id?null:id; renderGrill(); return; }
  const zn=t.closest('[data-zone]'); if(zn && S.mode==='grill'){ if(GR.picked) place(GR.picked, zn.dataset.zone); return; }
  const act=t.closest('[data-act]'); if(!act) return;
  const id=act.dataset.id;
  switch(act.dataset.act){
    case 'goal': toggleGoal(id); break;
    case 'ac': toggleAc(id); break;
    case 'dec': if(S.openD.has(id)) S.openD.delete(id); else S.openD.add(id); syncOpen(); setFocus('d:'+id,true); break;
    case 'play': play(id); break;
    case 'playcs': play(id, act.dataset.cs); break;
    case 'copy': { const a=IDX.a[id]; try{ navigator.clipboard.writeText(a.verify.cmd).then(()=>{act.textContent='copied';setTimeout(()=>act.textContent='copy',1200);},()=>{}); }catch(err){} break; }
    case 'detail': $('#det-'+id).classList.toggle('on'); break;
    case 'file': { const fe=act.closest('.file'); const key='f:'+id; if(S.focus===key){ fe.classList.remove('pinned'); setFocus(null); } else { $$('.file.pinned').forEach(x=>x.classList.remove('pinned')); fe.classList.add('pinned'); setFocus(key,false); } break; }
    case 'stack': { const c=IDX.cs[id]; const a=(c.acs||[])[0]; if(a){ toggleSheet(null); if(S.mode!=='ladder') setMode('ladder'); play(a,id); } break; }
  }
});

// keyboard
document.addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='g'){ setMode(S.mode==='grill'?'ladder':'grill'); return; }
  if(S.mode!=='ladder') { if(e.key==='Escape') setMode('ladder'); return; }
  const vis = visibleNav();
  let i = vis.indexOf(S.cursor);
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); i=Math.min(vis.length-1,i+1); moveCursor(vis[i]); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); i=Math.max(0,i-1); moveCursor(vis[i]); }
  else if(e.key==='Enter'||e.key==='ArrowRight'){ if(!S.cursor) return; e.preventDefault(); const [k,id]=S.cursor.split(':'); if(k==='g'){ if(!S.openG.has(id)) toggleGoal(id);} else if(!S.openA.has(id)) toggleAc(id); }
  else if(e.key==='ArrowLeft'){ if(!S.cursor) return; const [k,id]=S.cursor.split(':'); if(k==='a'){ if(S.openA.has(id)) toggleAc(id); else { moveCursor('g:'+IDX.a[id].goal); } } else if(S.openG.has(id)) toggleGoal(id); }
  else if(e.key===' '){ const c=S.cursor||S.focus; if(c&&c.startsWith('a:')){ e.preventDefault(); play(c.slice(2)); } }
  else if(e.key==='Escape'){ if(S.play){ stopPlay(); return; } if(S.sheet){ toggleSheet(null); return; }
    const f=S.focus; if(f&&f.startsWith('a:')){ const id=f.slice(2); S.openA.delete(id); syncOpen(); setFocus('g:'+IDX.a[id].goal,false); moveCursor('g:'+IDX.a[id].goal,true); }
    else if(f&&f.startsWith('g:')){ S.openG.delete(f.slice(2)); syncOpen(); setFocus(null); }
    else { $$('.file.pinned').forEach(x=>x.classList.remove('pinned')); setFocus(null); } }
});
function visibleNav(){ const out=[]; M.goals.forEach(g=>{ out.push('g:'+g.id); if(S.openG.has(g.id)) IDX.acsOf(g.id).forEach(a=>out.push('a:'+a.id)); }); return out; }
function moveCursor(key,noFocus){ S.cursor=key; const [k,id]=key.split(':'); const el = k==='g'? $('#r-'+id+' .rhead') : $('#a-'+id+' .atitle'); if(el){ el.focus({preventScroll:true}); el.scrollIntoView({block:'nearest',behavior:'smooth'}); } if(!noFocus){ S.focus=key; applyLens(); scrollFirstLit(); } }

function toggleSheet(id){
  S.sheet = (S.sheet===id)?null:id;
  ['mFiles','mDeps'].forEach(m=>$('#'+m).classList.toggle('sheet', S.sheet===m));
  $('#scrim').classList.toggle('on', !!S.sheet);
  $$('#mbar button').forEach(b=>b.classList.toggle('on', b.dataset.sheet===S.sheet));
  if(S.sheet) setTimeout(scrollFirstLit,50);
}
function setMode(m){
  stopPlay(); S.mode=m; document.body.classList.toggle('grilling', m==='grill');
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  if(m==='grill'){ S.hover=null; S.focus=null; applyLens(); if(!GR) newGrill('ac'); renderGrill(); $('#center').scrollTo({top:0}); }
  else { GR && GR.checked && (GR=null); renderLadder(); applyLens(); updateScore(); }
}
function writeHash(){ const h='#'+PID+(S.focus&&/^[gad]:/.test(S.focus)?'/'+S.focus.slice(2):''); if(location.hash!==h) try{ history.replaceState(null,'',h); }catch(e){} }
function loadPlan(id, sub){
  if(!MODELS[id]) id='062';
  stopPlay(); PID=id; M=MODELS[id]; IDX=buildIndex(); GR=null;
  S.openG.clear(); S.openA.clear(); S.openD.clear(); S.focus=null; S.hover=null; S.cursor=null;
  document.body.classList.toggle('brown', M.plan.kind==='brownfield');
  document.title = 'The Ladder · '+id;
  renderTop(); renderPlanHeader(); renderFiles(); renderDeps(); renderLadder();
  if(S.mode==='grill') { newGrill('ac'); renderGrill(); }
  $('#center').scrollTo({top:0}); $('#mFiles').scrollTo({top:0}); $('#mDeps').scrollTo({top:0});
  if(sub){ if(IDX.g[sub]) jump('g:'+sub); else if(IDX.a[sub]) jump('a:'+sub); else if(IDX.d[sub]) jump('d:'+sub); else applyLens(); }
  else { applyLens(); writeHash(); }
}
window.addEventListener('hashchange', ()=>{ const [p,sub]=location.hash.slice(1).split('/'); if(p && p!==PID) loadPlan(p,sub); });
const [p0,sub0]=(location.hash||'#062').slice(1).split('/');
loadPlan(MODELS[p0]?p0:'062', sub0);
})();
</script>
