<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2ea; --paper2:#ece7db; --card:#fbf9f4; --ink:#1c1b18; --ink2:#4f4b43; --ink3:#8a8478; --line:#dcd5c6; --line2:#c9c0ad;
  --goal:#1d3557; --ac:#2d7a4b; --acbg:#e3f0e6; --dec:#6d45a8; --decbg:#eee7f7; --rail:#b8432f; --railbg:#f7e4df; --phase:#a86d12;
  --add:#2d7a4b; --edit:#b07a14; --del:#b8432f; --ctx:#9a9385;
  --accent:#2d7a4b; --accentbg:#e3f0e6;
  --lit:#fff3c4; --litline:#d9a400;
  --term:#1a1c1f; --termink:#d7dcd2; --termdim:#7c8378;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(40,30,10,.25);
  --serif:"Fraunces",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
body.brown{ --accent:#a4552a; --accentbg:#f5e5d9; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141517; --paper2:#1b1d20; --card:#1d2023; --ink:#ebe7de; --ink2:#bdb7aa; --ink3:#857f73; --line:#2e3135; --line2:#3b3f44;
    --goal:#9cc0ec; --ac:#6fcf8f; --acbg:#1d3325; --dec:#b99bef; --decbg:#2a2238; --rail:#f08a73; --railbg:#3a2320; --phase:#e2a54a;
    --add:#6fcf8f; --edit:#e2b04a; --del:#f08a73; --ctx:#7d7a72; --accent:#6fcf8f; --accentbg:#1d3325;
    --lit:#3b3313; --litline:#d9a400; --term:#0d0e10; --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -10px rgba(0,0,0,.6);
  }
  :root:not([data-theme="light"]) body.brown{ --accent:#e59a6a; --accentbg:#3a2a20; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
code,.mono{font-family:var(--mono);font-size:.86em}
:focus-visible{outline:2px solid var(--litline);outline-offset:2px}

/* ---------- top bar ---------- */
.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand svg{display:block}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:var(--paper2)}
.seg button{padding:5px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.seg button b{font-family:var(--mono);font-weight:600;margin-right:6px;color:var(--ink)}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.seg button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.legend span b{font-weight:500;margin-right:3px}
.g-goal{color:var(--goal)} .g-ac{color:var(--ac)} .g-dec{color:var(--dec)} .g-rail{color:var(--rail)} .g-cs{color:var(--ink2)} .g-ph{color:var(--phase)}
.score{display:flex;gap:10px;font:500 12px/1 var(--mono);color:var(--ink2);white-space:nowrap}
.score .pill{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.score .pill i{font-style:normal;color:var(--ink3)}
.keys{text-transform:none;letter-spacing:0;font:500 11px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:4px 7px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;height:calc(100vh - 52px)}
.col{overflow:auto;min-height:0}
.margin{background:var(--paper2);border-right:1px solid var(--line);font-size:12.5px;padding:14px 10px 40px 12px}
.margin.right{border-right:0;border-left:1px solid var(--line)}
.mh{display:flex;align-items:baseline;justify-content:space-between;font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:4px 2px 10px}
.mh .cnt{font:500 11px var(--mono);letter-spacing:0;text-transform:none}
.mh .cnt .a{color:var(--add)} .mh .cnt .e{color:var(--edit)} .mh .cnt .d{color:var(--del)} .mh .cnt .c{color:var(--ctx)}
.center{padding:0 0 120px}

/* ---------- plan header ---------- */
.plan-h{padding:22px 34px 14px 34px;max-width:1040px}
.kicker{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker a{color:var(--ink3);text-decoration:none;letter-spacing:.04em;font-family:var(--mono);text-transform:none;font-weight:500}
.kicker a:hover{color:var(--ink)}
.plan-h h1{font:500 30px/1.1 var(--serif);margin:8px 0 6px;letter-spacing:-.01em}
.one{margin:0;color:var(--ink2);font-size:14.5px;max-width:760px}
.one code{background:var(--paper2);padding:1px 4px;border-radius:4px}
.glance{display:flex;gap:18px;align-items:center;margin-top:14px;flex-wrap:wrap}
.counts{display:flex;gap:12px;font:500 13px var(--mono)}
.counts span{white-space:nowrap}
.terrain{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink3)}
.terrain .bar{display:flex;width:170px;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.terrain .bar i{display:block;height:100%}
.phases{display:flex;gap:2px;align-items:center}
.phases button{font:600 11px var(--mono);color:var(--phase);padding:3px 6px;border-radius:5px}
.phases button:hover,.phases button.lit{background:var(--lit)}
.phases .arr{color:var(--line2);font-size:10px}
.toolbar{display:flex;gap:8px;align-items:center;padding:6px 34px 10px;color:var(--ink3);font-size:12px;max-width:1040px}
.toolbar .btn{border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--card);color:var(--ink2);font-size:12px}
.toolbar .btn:hover{border-color:var(--line2);color:var(--ink)}
.toolbar .hint{margin-left:auto}
.crumb{font:500 12px var(--mono);color:var(--ink2);display:flex;gap:6px;align-items:center}
.crumb button{padding:2px 6px;border-radius:5px;background:var(--lit)}
.crumb .x{background:none;color:var(--ink3)}

/* ---------- ladder ---------- */
.ladder{position:relative;margin:0 34px;max-width:1006px}
.ladder::before,.ladder::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--line2)}
.ladder::before{left:12px} .ladder::after{left:38px}
.rung{position:relative;margin:0 0 10px}
.rhead{display:grid;grid-template-columns:102px minmax(0,1fr) auto;align-items:center;min-height:62px;width:100%;border-radius:12px;padding:6px 14px 6px 0;position:relative}
.rhead:hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
.rbar{position:relative;height:100%;display:flex;align-items:center;justify-content:flex-start;padding-left:48px}
.rbar::before{content:"";position:absolute;left:12px;width:29px;height:5px;border-radius:3px;background:var(--ink2);top:50%;transform:translateY(-50%)}
.rung.open .rbar::before,.rung.lit .rbar::before{background:var(--accent)}
.gnum{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--goal);display:grid;place-items:center;font:600 11.5px var(--mono);color:var(--goal)}
.rung.open .gnum{background:var(--goal);color:var(--paper)}
.heat{position:absolute;left:90px;top:50%;transform:translateY(-50%);width:6px;height:28px;border-radius:3px;background:transparent}
.gtitle{font:500 21px/1.22 var(--serif);letter-spacing:-.005em;padding-right:10px}
.gtitle code{font-size:.7em;background:var(--paper2);padding:1px 4px;border-radius:4px}
.rmeta{display:flex;gap:10px;align-items:center;white-space:nowrap}
.pips{display:flex;gap:3px}
.pip{width:11px;height:11px;border:1.5px solid var(--ac);border-radius:3px}
.pip.done{background:var(--ac)}
.pip.man{border-style:dashed}
.dpips{font-size:11px;color:var(--dec);letter-spacing:1px}
.fchip{font:600 10.5px var(--mono);color:var(--rail);background:var(--railbg);padding:2px 5px;border-radius:4px}
.mast{font:600 10.5px var(--mono);padding:2px 6px;border-radius:4px;color:#fff}
.rung.lit>.rhead{background:var(--lit);box-shadow:inset 0 0 0 1px var(--litline)}
.rung.flash>.rhead{animation:flash 1.2s ease}
@keyframes flash{0%,60%{background:var(--railbg);box-shadow:inset 0 0 0 2px var(--rail)}100%{}}
.lensing .rung:not(.lit):not(.open)>.rhead{opacity:.5}
.rbody{display:none;margin:2px 0 18px 102px;padding-left:2px}
.rung.open>.rbody{display:block;animation:grow .22s ease}
@keyframes grow{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.gdesc{color:var(--ink3);font-size:13px;margin:0 0 12px;max-width:720px}
.gdesc code{font-size:.85em}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr)}
.split>div{min-width:0}
.split.wide .decs .decwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 8px;align-items:start}
.colh{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px 2px}

/* AC */
.ac{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;box-shadow:var(--shadow)}
.ac.lit{border-color:var(--litline);box-shadow:0 0 0 2px var(--lit)}
.ac.flash{animation:flash2 1.2s ease}
@keyframes flash2{0%,60%{box-shadow:0 0 0 2px var(--rail)}}
.lensing .ac:not(.lit):not(.open){opacity:.55}
.ahead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 10px 9px 11px}
.aid{font:600 11px var(--mono);color:var(--ac);display:flex;align-items:center;gap:5px;white-space:nowrap}
.box{display:inline-grid;place-items:center;width:15px;height:15px;border:1.5px solid var(--ac);border-radius:3.5px;font-size:10px;line-height:1}
.ac.done .box{background:var(--ac);color:var(--card)}
.ac.manual .box{border-style:dashed}
.atitle{font-size:14px;color:var(--ink)}
.atitle code{background:var(--paper2);padding:0 3px;border-radius:3px}
.atags{display:flex;gap:4px;align-items:center}
.tag{font:600 10.5px var(--mono);padding:2px 5px;border-radius:4px;white-space:nowrap;cursor:pointer}
.tag.d{color:var(--dec);background:var(--decbg)}
.tag.r{color:var(--rail);background:var(--railbg)}
.tag.a{color:var(--ac);background:var(--acbg)}
.tag.g{color:var(--goal);background:color-mix(in srgb,var(--goal) 12%,transparent)}
.tag:hover{outline:1px solid currentColor}
.playb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--card);font-size:11px;flex:none}
.playb:hover{transform:scale(1.08)}
.ac.manual .playb{background:var(--edit)}
.abody{display:none;padding:0 12px 12px 12px;border-top:1px dashed var(--line)}
.ac.open .abody{display:block}
.gwt{display:grid;grid-template-columns:52px minmax(0,1fr);gap:3px 8px;margin:10px 0;font-size:13px;color:var(--ink2)}
.gwt b{font:600 10px/1.9 var(--sans);letter-spacing:.12em;color:var(--ink3)}
.gwt code{background:var(--paper2);padding:0 3px;border-radius:3px;font-size:.82em}
.more{font-size:12px;color:var(--ink3);text-decoration:underline dotted;margin-left:60px}
.detail{display:none;margin:6px 0 0 60px;font-size:12.5px;color:var(--ink3)}
.detail.on{display:block}
.cmd{display:flex;align-items:stretch;background:var(--term);color:var(--termink);border-radius:8px;overflow:hidden;margin-top:8px}
.cmd pre{margin:0;padding:9px 11px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;flex:1}
.cmd pre .pr{color:#8fd19e;user-select:none}
.cmd .cbtns{display:flex;flex-direction:column;border-left:1px solid #2c3035}
.cmd .cbtns button{padding:6px 10px;font:600 11px var(--mono);color:var(--termink);flex:1;white-space:nowrap}
.cmd .cbtns button:hover{background:#2a2e33}
.cmd .cbtns .run{background:#245c38;color:#e4f6e8}
.cmd .cbtns .run:hover{background:#2d7046}
.vkind{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:8px;display:flex;gap:8px;align-items:center}

/* player */
.player{margin-top:10px;background:var(--term);color:var(--termink);border-radius:8px;padding:10px 12px 12px;font:12px/1.4 var(--mono);display:none}
.player.on{display:block}
.pl-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cs-chip{font:500 11px var(--mono);padding:3px 7px;border-radius:5px;border:1px solid #394048;color:#b8c0b4}
.cs-chip.on{background:#e8e3d4;color:#1a1c1f;border-color:#e8e3d4}
.cs-chip.before{border-color:#6b3b33;color:#f0a090}
.cs-chip.before.on{background:#f0a090;color:#1a1c1f}
.pl-trig{color:var(--termdim);font-size:11px;margin:0 0 8px}
.stage{position:relative;overflow-x:auto}
.lanes{display:grid;font:600 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#8b9388;margin-bottom:2px}
.lanes div{text-align:center;border-left:1px dashed #2f353b;padding:2px 0}
.rows{position:relative}
.rows svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.frow{display:grid;align-items:center;height:26px;opacity:.22;transition:opacity .2s}
.frow.seen{opacity:.72}
.frow.now{opacity:1}
.frow .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px}
.frow .fsym{color:#f2e9c9}
.frow.now .fsym{color:#ffd76a}
.frow .does{color:#9aa296;margin-left:8px;font-family:var(--sans);font-size:12px}
.frow .eff{color:#8fd19e;margin-left:8px;font-size:11px}
.lanebg{position:absolute;top:0;bottom:0;border-left:1px dashed #2f353b}
.res{margin-top:8px;padding:6px 8px;border-radius:5px;background:#23272c;color:#cfd6c9;white-space:pre-wrap;word-break:break-word;display:none;font-size:11.5px}
.res.on{display:block}
.tests{margin-top:8px;overflow:hidden}
.player{overflow:hidden}
.tline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-4px);transition:all .18s}
.tline.on{opacity:1;transform:none}
.tline .ok{color:#8fd19e;font-weight:600}
.tline .f{color:#7c8378}
.stamp{display:none;margin-top:10px;align-items:center;gap:10px}
.stamp.on{display:flex;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.stamp .big{font:700 15px var(--mono);letter-spacing:.14em;color:#0f2416;background:#8fd19e;padding:4px 12px;border-radius:5px}
.stamp.manual .big{background:#e2b04a;color:#2a1e05}
.stamp .sm{color:#9aa296;font-size:11px}
.pl-note{color:#6c7369;font-size:10.5px;margin-top:8px;font-family:var(--sans)}

/* decisions */
.dec{border-left:3px solid var(--dec);background:var(--card);border-radius:0 9px 9px 0;margin-bottom:7px;box-shadow:var(--shadow)}
.dec.lit{box-shadow:0 0 0 2px var(--lit),var(--shadow);border-left-color:var(--litline)}
.lensing .dec:not(.lit):not(.open){opacity:.55}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px;width:100%;align-items:start}
.did{font:600 11px var(--mono);color:var(--dec);white-space:nowrap;padding-top:1px}
.dtitle{font-size:13px}
.dtitle code{font-size:.85em;background:var(--paper2);padding:0 3px;border-radius:3px}
.dsub{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.by{font:500 10px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.dbody{display:none;padding:0 10px 10px 10px;font-size:12.5px}
.dec.open .dbody{display:block}
.opt{display:grid;grid-template-columns:16px 1fr;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.opt .m{font-weight:700}
.opt.ch .m{color:var(--ac)} .opt.rj .m{color:var(--rail)}
.opt.rj .o{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--rail) 60%,transparent);color:var(--ink2)}
.opt .w{color:var(--ink3);font-size:12px;margin-top:2px}
.opt code{font-size:.85em;background:var(--paper2);padding:0 3px;border-radius:3px}
.breaks{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center;font:500 10.5px var(--sans);color:var(--rail)}
.dwhy{color:var(--ink3);font-size:12px;margin-top:6px}

/* files margin */
.tree{font:12px/1.35 var(--mono)}
.dir{color:var(--ink3);padding:3px 4px;margin-top:4px;display:flex;align-items:center;gap:6px;font-weight:500}
.dir .badge{font:600 9px var(--sans);letter-spacing:.1em;color:var(--add);background:var(--acbg);padding:1px 4px;border-radius:3px}
.dir .badge.b{color:var(--edit);background:color-mix(in srgb,var(--edit) 15%,transparent)}
.kids{margin-left:10px;border-left:1px solid var(--line);padding-left:6px}
.file{border-radius:5px}
.frow2{display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:5px;cursor:pointer;width:100%}
.frow2:hover{background:var(--card)}
.cg{width:10px;text-align:center;font-weight:700;flex:none}
.cg.add{color:var(--add)} .cg.edit{color:var(--edit)} .cg.delete{color:var(--del)} .cg.context,.cg.same{color:var(--ctx)}
.fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file.context .fname{color:var(--ink3)}
.file.delete .fname{text-decoration:line-through}
.file.lit>.frow2{background:var(--lit)}
.file.hot>.frow2{background:var(--litline);color:#1c1b18}
.lensing .margin .file:not(.lit){opacity:.33}
.lensing .margin .dir{opacity:.6}
.syms{display:none;margin:1px 0 4px 18px;border-left:2px solid var(--line2);padding-left:6px}
.file.showsyms .syms{display:block}
.sym{display:none;gap:5px;font-size:11px;padding:1px 3px;border-radius:4px;color:var(--ink2);white-space:nowrap}
.file.showsyms .sym.vis{display:flex}
.sym .k{color:var(--ink3);width:10px;flex:none}
.sym .n{overflow:hidden;text-overflow:ellipsis}
.sym.lit{background:var(--lit)}
.sym.hot{background:var(--litline);color:#1c1b18}
.symmore{font-size:10.5px;color:var(--ink3);padding-left:3px}

/* deps margin */
.dtree{font:11.5px/1.3 var(--mono)}
.dn{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px;white-space:nowrap;cursor:pointer}
.dn:hover{background:var(--card)}
.dn .ind{color:var(--line2);flex:none}
.dn .nm{overflow:hidden;text-overflow:ellipsis}
.dn.ext .nm,.dn.rep .nm{color:var(--ink3)}
.dn.rep{font-style:italic}
.dn .ech{color:var(--add);font-weight:700;font-size:10px}
.dn.lit{background:var(--lit)}
.dn.hot{background:var(--litline);color:#1c1b18}
.lensing .margin .dn:not(.lit){opacity:.3}
.walls{margin-top:14px}
.wall{display:grid;grid-template-columns:14px 1fr;gap:4px;padding:4px;border-radius:5px;font:11px/1.35 var(--mono);color:var(--ink2)}
.wall .x{color:var(--rail);font-weight:700}
.wall .to{color:var(--rail)}
.wall.lit{background:var(--railbg);box-shadow:inset 0 0 0 1px var(--rail)}
.lensing .margin .wall:not(.lit){opacity:.35}
.stacks{margin-top:16px}
.csr{display:grid;grid-template-columns:34px 1fr;gap:4px;padding:4px;border-radius:6px;font-size:12px;cursor:pointer;width:100%}
.csr:hover{background:var(--card)}
.csr .i{font:600 11px var(--mono);color:var(--ink2)}
.csr .t{font:11.5px/1.3 var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csr.lit{background:var(--lit)}
.lensing .margin .csr:not(.lit){opacity:.35}
.sec{margin-top:18px}

/* grill */
.grill{margin:0 34px;max-width:1006px;display:none}
body.grilling .grill{display:block}
body.grilling .ladder,body.grilling .toolbar{display:none}
.gr-top{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.gr-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gr-q{font:500 19px/1.25 var(--serif)}
.gr-q .g-ac,.gr-q .g-dec,.gr-q .g-goal{font-family:var(--sans);font-size:.85em}
.gr-row .btn{border:1px solid var(--line2);border-radius:7px;padding:5px 10px;background:var(--card);font-size:12.5px}
.gr-row .btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gr-row .btn:disabled{opacity:.4;cursor:default}
.gr-prog{font:500 12px var(--mono);color:var(--ink3);margin-left:auto}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:32vh;overflow:auto;padding:2px}
.card{display:flex;gap:7px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;max-width:320px;box-shadow:var(--shadow);cursor:grab;text-align:left}
.card .gl{font-weight:700;flex:none}
.card.acard .gl{color:var(--ac)} .card.dcard .gl{color:var(--dec)}
.card.picked{outline:2px solid var(--litline);background:var(--lit)}
.card.ok{border-color:var(--ac);background:var(--acbg)}
.card.bad{border-color:var(--rail);background:var(--railbg)}
.card .fix{font:600 10.5px var(--mono);color:var(--rail);margin-left:4px;white-space:nowrap}
.card code{font-size:.85em}
.zone{display:grid;grid-template-columns:92px 1fr;border-radius:12px;margin-bottom:8px;min-height:64px;border:1.5px dashed transparent;position:relative}
.zone .rbar::before{background:var(--line2)}
.zone .rbar{align-items:flex-start;padding-top:12px}
.zone .rbar::before{top:29px}
.zone.hov,.zone.target{border-color:var(--litline);background:var(--lit)}
body.picking .zone:hover{border-color:var(--litline);cursor:pointer}
.zone .zt{font:500 18px/1.25 var(--serif);padding:10px 12px 4px 0}
.zone .zc{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px 0}
.zone .zh{position:absolute;right:10px;top:10px;font:600 11px var(--mono);padding:2px 6px;border-radius:4px;color:#fff}
.gr-ladder{position:relative}
.gr-ladder::before,.gr-ladder::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--line)}
.gr-ladder::before{left:12px}.gr-ladder::after{left:38px}
.gr-done{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;display:none;align-items:center;gap:14px}
.gr-done.on{display:flex}
.gr-done .big{font:600 30px var(--serif)}

/* mobile */
.mbar{display:none}
.scrim{display:none}
@media (max-width:1100px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  .margin.right{display:none}
  .legend{display:none}
}
@media (max-width:760px){
  body{overflow:auto}
  .top{height:auto;flex-wrap:wrap;padding:8px 16px;gap:8px}
  .brand{width:100%;justify-content:space-between}
  .keys{display:none}
  .score{margin-left:auto}
  .shell{display:block;height:auto}
  .center{overflow:visible;padding-bottom:90px}
  .margin{display:none;position:fixed;left:0;right:0;bottom:56px;top:30vh;z-index:20;border:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .margin.sheet{display:block}
  .margin.right.sheet{display:block}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--paper);border-top:1px solid var(--line);z-index:21;justify-content:space-around;align-items:center}
  .mbar button{font:600 12px var(--sans);padding:8px 14px;border-radius:8px;color:var(--ink2)}
  .mbar button.on{background:var(--lit);color:var(--ink)}
  .plan-h{padding:16px 16px 8px}
  .plan-h h1{font-size:24px}
  .toolbar{padding:6px 16px 10px}
  .toolbar .hint{display:none}
  .ladder,.grill{margin:0 16px}
  .ladder::before{left:6px}.ladder::after{left:22px}
  .gr-ladder::before{left:6px}.gr-ladder::after{left:22px}
  .rhead{grid-template-columns:64px minmax(0,1fr);padding-right:6px}
  .rbar{padding-left:30px}
  .rbar::before{left:6px;width:19px}
  .gnum{width:28px;height:28px;font-size:10.5px}
  .heat{left:60px}
  .rmeta{grid-column:2;justify-content:flex-start;padding:2px 0 4px}
  .gtitle{font-size:18px}
  .rbody{margin-left:12px}
  .split{grid-template-columns:minmax(0,1fr)}
  .gwt{grid-template-columns:44px minmax(0,1fr)}
  .more,.detail{margin-left:52px}
  .zone{grid-template-columns:64px 1fr}
  .zone .zt{font-size:16px}
  .ahead{grid-template-columns:auto minmax(0,1fr) auto}
  .atags{display:none}
  .cmd{flex-direction:column}
  .cmd .cbtns{flex-direction:row;border-left:0;border-top:1px solid #2c3035}
  .cmd .cbtns button{padding:8px 10px;text-align:center}
  .pool{max-height:22vh}
  .lanes div{font-size:8.5px}
}
</style>
</head>

<script type="application/json" id="model-062">{"plan":{"id":"062","title":"auto-mail walking skeleton","kind":"greenfield","oneLiner":"Build the new `auto mail` tool end to end — glossary, store, CLI, hook nudge, harness — so agents on one host can trade durable, acked mail.","problem":"The stack broadcasts events outward, but nothing carries a message to a named recipient and keeps it until acted on. A supervisor learns its child crashed by silence; an agent that finds a bug in another project has nowhere to put it. T1 must also retire the real risk: telling a working agent it has mail, in-band and cheaply.","baseCommit":"41c1516","builtCommit":"0c73e78","pr":"https://github.com/mistakenot/auto-stack/pull/146","epic":"docs/epics/epic-005-auto-mail-mvp.html (T1)","transcript":{"id":"C1","steps":[{"cmd":"auto mail subscribe auto-web/bugs","out":"{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"},{"cmd":"auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }"},{"cmd":"auto mail list","out":"[ { \"id\": \"01K9X2QF7M3B0V8N\", \"from\": \"auto-stack/reviewer\", \"sentAt\": \"2026-08-25T10:14:02Z\", \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" } } ]"},{"cmd":"auto mail ack 01K9X2QF7M3B0V8N","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }"},{"cmd":"auto mail list","out":"[]"}]},"outOfScope":["`#parent` resolution and self-identification (epic T2, D-13)","Waking idle agents: keystrokes, effector seam, liveness, escalation (T3)","Daemon reconcile tick (T3, D-12)","`quickstart`, `doctor`, journey J2 end to end, adoption guidance (T4)","RPC `mail.Client` and `mail.*` daemon methods (D-062-5)","\"You have mail\" bus event (T3, D-062-6)","Queue mode, leases, dead-letter, cross-host, `#new`, prefix subs, `wait`, retention (backlog)","Any change to autowatch `Backend` or `hooks.CaptureEnv` allowlist","`--text` output mode"]},"goals":[{"id":"G1","title":"Mail has its own vocabulary, defined before any code.","description":"Mail, Address, Subscription, Delivery and Binding land in the glossary first, then the same words are used in schema, events, CLI and commits. Nothing in mail is called a Message, which already names a Session exchange.","sources":["plan goal 1","rail G16","epic D-4"]},{"id":"G2","title":"Agents on one host can send each other mail that waits.","description":"Subscribe, send, list, ack work with no daemon running. Mail sent before anyone subscribes still reaches the later subscriber. Addresses are free-form names with no physical identity in them.","sources":["plan goal 5","C1","rail G5","rail G6","epic D-9","epic D-11"]},{"id":"G3","title":"A busy agent is told it has mail at almost no cost.","description":"The existing PostToolUse hook tells the agent it has mail. The no-mail path costs one stat, never opens the store, and can never stall or break the hook.","sources":["plan goal 7","rail G8","D-062-3","D-062-9"]},{"id":"G4","title":"Delivery is honest: explicit ack, at-least-once, one winner.","description":"Reading never retires mail. Each subscription has its own delivery state, filled lazily from a cursor. Concurrent acks resolve to exactly one winner, and losers are told. No ordering or exactly-once is promised.","sources":["plan goal 6","rail G2","rail G3","rail G4","rail G13","epic D-7","epic D-10"]},{"id":"G5","title":"The store is an append-only log that is safe to wipe.","description":"An event log is the authority; projections update in the same transaction and mail rows never change. The `alpha` marker is in the event types and the filename, and `reset` is a supported operation.","sources":["plan goal 4","rail G1","rail G10","epic D-1","epic D-2"]},{"id":"G6","title":"Only the mail client can reach the store.","description":"`mail.Client` is the one API; the store i ation"]},"decisions":["D7","D13"],"phases":["P2","P5"],"rails":["R10"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"At-least-once and unordered is documented; re-acks are idempotent.","given":"`auto mail docs` and `auto-mail/CLAUDE.md`","when":"a delivery is acked twice, or the same id is listed twice","then":"docs state at-least-once/unordered/idempotent; re-ack appends nothing and reports `wonTransition:false`","detail":"Duplicate delivery is simulated at the client boundary (a Client decorator repeating one List entry), never by a second `deliveries` row, which the PK forbids. No test asserts ordering.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract","tests":["auto-mail/conformance/conformance_test.go:TestDirectClientConformance","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheDeliveryContract"]},"phases":["P4","P5"],"rails":["R4"],"source":"AC-7"},{"id":"AC8","goal":"G2","title":"Addresses are free-form and carry no physical identity.","given":"address validation and a sender with TMUX/NTM env set","when":"`auto-web/bugs` is sent to","then":"`/` is accepted and never normalised; no host/session/pane id appears in the mail row","detail":"Validation rejects only empty, whitespace-padded, control-character and over-length values, each with a remediation. Physical context lives only on `bindings` as an opaque (manager, target) pair — no typed `tmux_pane_id` column.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v","tests":["auto-mail/mail/mail_test.go:TestValidateAddressIsPermissive","auto-mail/mail/mail_test.go:TestBindingLadder","auto-mail/mail/mail_test.go:TestNoPhysicalIdentityInStoredMail","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_addresses_carry_no_physical_identity"]},"decisions":["D2","D15"],"phases":["P2","P3"],"rails":["R5"],"source":"AC-8"},{"id":"AC9","goal":"G2","title":"Sending to nobody persists and reports both counts.","given":"an address nobody has subscribed to","when":"`auto mail send --to <address>` runs","then":"exit 0, mail persisted, `subscriptions:0, bound:0`, typo hint on stderr; a later subscriber receives it","detail":"With a subscription but no binding row, payload is `subscriptions:1, bound:0` — in T1 `bound` counts binding rows, not liveness (D-062-2).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'","tests":["auto-mail/internal/cli/cli_test.go:TestSendWithNoSubscriptionPersists","auto-mail/internal/store/store_test.go:TestSubscriptionsAndBoundDiverge","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber"]},"decisions":["D2","D15"],"phases":["P4"],"rails":["R6"],"source":"AC-9"},{"id":"AC10","goal":"G3","title":"The hook nudge costs one stat and can never break the hook.","given":"any mailbox state and a PostToolUse payload","when":"`auto hooks fire --agent claude` runs","then":"zero store opens on both paths; one `hookSpecificOutput` naming `auto mail list` when mail waits; exit 0 always","detail":"Zero opens asserted with a counting store-opener over the package var; stats at most one path. A host that never ran `auto mail init` gets no `alpha-store.db`. Nudge only on PostToolUse; with a matching hint rule both fragments share one emission. Absent, unreadable, locked or corrupt store → exit 0, no malformed stdout, bounded time.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHealsItself' -v && cd ../auto-cli && go test ./cmd/auto -run 'TestFire(NudgesOnlyWhenMailIsWaiting|NudgeCarriesNoMailboxContent|NudgesOnPostToolUseOnly|EmitsOneObjectWhenMailAndHintBothMatch|SurvivesABrokenMailDirectory|CreatesNoMailStore)|TestEmitAdditionalContextWritesAtMostOneObject' -v","tests":["auto-mail/mail/mail_test.go:TestHasPendingOpensNoStore","auto-mail/mail/mail_test.go:TestNudgeTextCarriesNoMailboxContent","auto-mail/mail/mail_test.go:TestPendingFlagLifecycle","auto-mail/mail/mail_test.go:TestFalsePositiveFlagHealsItself","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnlyWhenMailIsWaiting","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgeCarriesNoMailboxContent","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnPostToolUseOnly","auto-cli/cmd/auto/hooksmail_test.go:TestFireEmitsOneObjectWhenMailAndHintBothMatch","auto-cli/cmd/auto/hooksmail_test.go:TestFireSurvivesABrokenMailDirectory","auto-cli/cmd/auto/hooksmail_test.go:TestFireCreatesNoMailStore","auto-cli/cmd/auto/hints_test.go:TestEmitAdditionalContextWritesAtMostOneObject","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail","harness/tests/mail_flow/test_mail_loop.py:test_hook_fire_never_breaks_the_agent","harness/tests/mail_flow/test_mail_loop.py:test_hook_creates_no_store_on_a_host_that_never_ran_init"]},"decisions":["D3","D6","D9","D2"],"phases":["P3"],"rails":["R7"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"`alpha` is in event types and filename, and reset works.","given":"the store","when":"its path, events and `reset` are inspected","then":"path is `~/.auto/mail/alpha-store.db`; types are exactly the four `alpha.mail.*`; envelopes carry `version`; reset wipes and the tool works again","detail":"T1 vocabulary: `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — every type prefixed and these four the complete set. `auto mail reset` reports what it removed. `auto mail docs` states: no upcasters, no migrations, no compatibility guarantee, may be wiped on upgrade.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/store -run 'TestEveryEnvelopeCarriesAVersion|TestAppendRejectsAnEventOutsideTheAlphaNamespace' -v && go test ./internal/cli -run 'TestInitCreatesAlphaStore|TestReset|TestDocsStatesTheAlphaContract' -v && go test ./mail -run 'TestResetWipesTheAlphaStore|TestSchemaAndEventTypesUseTheMailVocabulary'","tests":["auto-mail/internal/store/store_test.go:TestEveryEnvelopeCarriesAVersion","auto-mail/internal/store/store_test.go:TestAppendRejectsAnEventOutsideTheAlphaNamespace","auto-mail/internal/cli/cli_test.go:TestInitCreatesAlphaStore","auto-mail/internal/cli/cli_test.go:TestResetWipesTheStoreAndTheC1LoopRunsAgain","auto-mail/internal/cli/cli_test.go:TestResetOnAFreshHostRemovesNothing","auto-mail/internal/cli/cli_test.go:TestResetRecoversAStoreWrittenByAnotherSchema","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheAlphaContract","auto-mail/mail/mail_test.go:TestResetWipesTheAlphaStore","harness/tests/mail_flow/test_mail_loop.py:test_store_carries_the_alpha_marker_in_its_filename"]},"decisions":["D4","D12"],"phases":["P1","P5"],"rails":["R8"],"source":"AC-11"},{"id":"AC12","goal":"G6","title":"Nothing outside the mail store package opens the mail store.","given":"the whole repository","when":"a guard test walks every module, the harness and `skills/`","then":"no file outside `auto-mail/internal/store` both names the mail store and opens a DB; no outside import of `auto-mail/internal/…`","detail":"Scoped to the mail store, not SQLite in general (auto-watch and auto-search legitimately import `modernc.org/sqlite`). The internal-import half is already a compile-time guarantee; the test is a regression guard. `auto-cli` reaches mail only through `auto-mail/mail`. Failure names the file and says \"go through mail.Client\".","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v","tests":["auto-mail/conformance/seam_test.go:TestNothingOutsideTheMailPackageOpensTheStore"]},"decisions":["D8","D5"],"phases":["P5"],"rails":["R9"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"The whole loop passes end to end in the harness.","given":"`uv run harness mail-flow up` from `harness/`","when":"`uv run pytest tests/mail_flow -v` runs","then":"one container, one host id, two workspaces; the C1 loop, nudge, ack and send-before-subscribe pass against the real binary","detail":"`check_ready()` fails fast if the store is uninitialised or a workspace unregistered. Bounded retry on observable outcomes, no sleep-to-settle, no count assertions duplicates would break. Registered in `SCENARIOS`; no existing scenario changed. `make check`, `make test`, `make test-race` green with auto-mail in `RACE_PROJECTS`.","verify":{"kind":"harness","cmd":"cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race","tests":["harness/tests/mail_flow/test_mail_loop.py:test_single_host_two_registered_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_list_is_empty_json_from_both_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_docs_are_discoverable_from_a_workspace","harness/tests/mail_flow/test_mail_loop.py:test_init_is_idempotent","harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber","harness/tests/mail_flow/test_mail_loop.py:test_from_now_opts_out_of_the_backlog","harness/tests/mail_flow/test_mail_loop.py:test_broadcast_gives_each_subscription_its_own_ack_state","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail"]},"verifyNote":"Harness is not in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One cl <script type="application/json" id="model-052">{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8","F3","F11"]}],"acs":[{"id":"AC1","goal":"G1","title":"gap list surfaces reported gaps","given":"feedback events carrying a `gap`","when":"`auto reflect gap list`","then":"JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted","detail":"Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSurfacesGaps","auto-reflect/internal/cli/gap_integration_test.go:TestGapListOmitsGaplessFeedback"]},"decisions":["D1","D14"],"phases":["P5"],"source":"AC-1"},{"id":"AC2","goal":"G1","title":"gap list obeys list conventions","given":"gaps across sessions and times","when":"`gap list` unfiltered, or with a time filter","then":"all gaps unfiltered; `--since/--after/--before` filter; empty state is `[]`; text mode works","detail":"Given gaps spanning multiple sessions/domains/times, when I run gap list with no filters, then all gaps are returned; and --since/--after/--before and --domain filter correctly (one filter mode at a time), input normalized, JSON by default with --format text available.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapList(SinceFilter|EmptyReturnsArray|TextFormat|DomainUnsupported)'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSinceFilter","auto-reflect/internal/cli/gap_integration_test.go:TestGapListEmptyReturnsArray","auto-reflect/internal/cli/gap_integration_test.go:TestGapListTextFormat","auto-reflect/internal/cli/gap_integration_test.go:TestGapListDomainUnsupported"]},"decisions":["D14"],"phases":["P5"],"source":"AC-2"},{"id":"AC3","goal":"G2","title":"One pending count, two callers agree","given":"an ETL fixture with non-canonical session remotes","when":"`miner status` and `stats` run on it","then":"`pending` == `pending_to_mine`; both from `miner.PendingCount`","detail":"Given any repo + ETL state, when I run `auto reflect miner status` and `auto reflect stats`, then pending == pending_to_mine (both computed by one shared function), and the counted universe is documented. A unit test pins them equal on a fixture where they previously diverged.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestMinerStatusPendingMatchesStats|TestMinerStatusCoveragePctNullWhenNoInScopeSessions'","tests":["auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusPendingMatchesStats","auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusCoveragePctNullWhenNoInScopeSessions"]},"decisions":["D13"],"phases":["P4"],"source":"AC-3"},{"id":"AC4","goal":"G3","title":"Mutations expose a top-level id","given":"the uniform output envelope","when":"`observation add`, `rule create/edit/promote/retire/graduate`, `consolidate`","then":"id(s) at `.id` / `.ids`, never null or only nested","detail":"Given the uniform output envelope, when I run an id-minting / entity mutation (observation add, rule create/edit/promote/retire/graduate, consolidate), then the relevant id(s) are reachable at a predictable top-level path (.id for single, .ids for many), never null and never only nested. (feedback echoes the feedback ids it acted on as ids; rebuild carries counts only.)","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestObservationAddExposesTopLevelID|TestConsolidateDeterministicIDs'","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddExposesTopLevelID","auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs"]},"decisions":["D3","D5","D7"],"phases":["P1","P2","P3"],"source":"AC-4"},{"id":"AC5","goal":"G3","title":"Collection rows expose `.id` without data loss","given":"`retrieve`, `select`, `rule list`, `observation list`, `events list`, `gap list`","when":"their JSON is parsed","then":"each row id at a uniform path; prior fields kept; skill refs + quickstart updated","detail":"Given the envelope migration of retrieve, select, rule list, observation list, events list, gap list, when I parse their JSON, then each element's id is reachable at a uniform path (.[].id or .results[].id), every field present before the change is still present, and the reflect-playbook skill refs + quickstart are updated to the new paths.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestObservationListElementsCarryID && go test ./cmd/autoreflect -run TestE2ELoopQuickstart","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationListElementsCarryID","auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart"]},"decisions":["D7"],"phases":["P1","P3"],"source":"AC-5"},{"id":"AC6","goal":"G4","title":"Consolidate is deterministic and idempotent","given":"one consolidation delta document","when":"`consolidate --dry-run` then `consolidate`, then apply again","then":"same rule id in both runs; second apply adds no duplicate","detail":"Given one consolidation delta document, when I run consolidate --dry-run and then consolidate (separate invocations), then the rule id is identical across both; and re-running the same consolidate a second time is a no-op (no duplicate rule) because the content-derived id already exists.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestConsolidateDeterministicIDs|TestObservationAddIsIdempotent' && go test ./internal/idhash","tests":["auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs","auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddIsIdempotent","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDeterministic"]},"decisions":["D4","D8","D9"],"phases":["P1","P2"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"Ids keep their format","given":"content-derived minting","when":"rule / observation ids are generated","then":"still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; validators unchanged","detail":"Given content-derived minting, when rule/observation ids are generated, then they still match ^r-[0-9a-f]{8}$ / ^ob-[0-9a-f]{8}$; existing validators are unchanged; events already on disk keep their original ids.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/idhash ./internal/observations -run 'TestDerive|TestNewObservationIDFormat|TestCanonicalPartsDeriveStableID'","tests":["auto-reflect/internal/idhash/idhash_test.go:TestDeriveFormat","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDifferentPartsDifferentID","auto-reflect/internal/observations/model_test.go:TestNewObservationIDFormat","auto-reflect/internal/observations/model_test.go:TestCanonicalPartsDeriveStableID"]},"decisions":["D6"],"phases":["P1","P2"],"source":"AC-7"},{"id":"AC8","goal":"G6","title":"init writes an idempotent .gitignore","given":"a repo","when":"`auto reflect init` runs (twice)","then":"`.auto/reflect/.gitignore` ignores `playbook.json`, not `events/`; not rewritten","detail":"Given a repo, when I run auto reflect init (or init --project), then .auto/reflect/.gitignore exists and ignores playbook.json (not events/); running init again does not overwrite or duplicate it.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestInitWritesStateGitignore|TestInitGitignoreIdempotent'","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore","auto-reflect/internal/cli/init_test.go:TestInitGitignoreIdempotent"]},"decisions":["D2","D10"],"phases":["P7"],"source":"AC-8"},{"id":"AC9","goal":"G6","title":"Canonical events tracked, cache ignored","given":"the repo's own `.auto/reflect/`","when":"git status is checked after init","then":"`events/*.jsonl` committable; `playbook.json` untracked","detail":"Given the repo's own .auto/reflect/, when I check git status after init, then .auto/reflect/events/*.jsonl is tracked/committable and playbook.json is untracked (removed from the index with git rm --cached if previously tracked).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestInitWritesStateGitignore && git ls-files .auto/reflect","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore"]},"decisions":["D2"],"phases":["P7"],"source":"AC-9"},{"id":"AC10","goal":"G6","title":"doctor detects stale or partial state","given":"missing `events/`, stale snapshot, or legacy `feedback.jsonl`","when":"`auto reflect doctor`","then":"JSON `[{check,status,message,hint}]`; hints on failures; exit 1 on any fail","detail":"Given a partial reflect state (e.g. state dir present but events/ missing, or playbook.json stale vs the folded event log), when I run auto reflect doctor, then it returns structured JSON [{check,status,message,hint}], each failure carries a concrete remediation hint, and the process exits non-zero on any fail.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestDoctor","tests":["auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorHealthyAllPass","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorMissingEventsFails","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorStaleSnapshotWarns","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorLegacyFeedbackWarns"]},"decisions":["D11"],"phases":["P6"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"Rule listings carry timestamps","given":"a folded rule with timestamps set by `Fold`","when":"`rule list` and `rule get`","then":"both expose non-empty `created_at` / `updated_at`","detail":"Given a folded rule with created_at/updated_at set by Fold, when I run auto reflect rule list and rule get, then both expose non-empty created_at/updated_at (list no longer drops them in its projection map).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/rules -run TestFoldSurfacesTimestampsForListView","tests":["auto-reflect/internal/rules/projection_test.go:TestFoldSurfacesTimestampsForListView"]},"decisions":["D12"],"phases":["P3"],"source":"AC-11"},{"id":"AC12","goal":"G7","title":"outcome enum and correction_density documented","given":"the docs","when":"a reader consults quickstart and skill references","then":"`outcome` enum (distinct from ack status) and `correction_density` definition + scale are documented","detail":"Given the docs, when a reader consults quickstart and the reflect-playbook references, then the feedback outcome enum (success|partial|fail|abandoned, distinct from miner ack status) and correction_density (definition + scale) are documented; a malformed outcome error already names the valid set.","verify":{"kind":"manual","cmd":"auto reflect quickstart | grep -E 'abandoned|correction_density'; grep -n correction_density skills/reflect-playbook/references/mine.md","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"Legacy yaml removed","given":"the superseded process artifacts","when":"the task lands","then":"`docs/reflection/observations.yaml` deleted; only retired `playbook-*` skills referenced it","detail":"Given the superseded process artifacts, when the task lands, then docs/reflection/observations.yaml is deleted and the reflect-playbook 'supersedes' note reflects the removal. The only remaining referencers are the already-superseded playbook-observe/-refine/-search skills (no Go code reads the file); per F11 a future run would regenerate an empty file — the discard is intended.","verify":{"kind":"manual","cmd":"git ls-tree 34d1d22 docs/reflection/observations.yaml  # expect empty; git grep -n 'observations.yaml' 34d1d22 -- '*.go'","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-13"},{"id":"AC14","goal":"G1","title":"No regressions; the e2e loop runs through gap list","given":"all changes","when":"`go build ./...` and the full auto-reflect suite run","then":"all green with assertions moved to the new envelope; loop completes through `gap list`","detail":"Given all changes, when I run go build ./... and the full auto-reflect test suite, then everything builds and passes (existing assertions updated to the new envelope), and the end-to-end reflect loop completes as in quickstart.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go build ./... && go test ./...","tests":["auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EPromoteTaskGate","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2ELifecycleRetrieval","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EGraduateEnforced"]},"decisions":[],"phases":["P1","P2","P3","P4","P5","P6","P7"],"source":"AC-14"}],"decisions":[{"id":"D1","title":"Gaps get a dedicated `gap list` command","chosen":"Dedicated `auto reflect gap list` noun","why":"Matches the gap -> observation mental model and is discoverable.","rejected":[{"option":"Generic `events list --full/--payload` flag","why":"Payload dump, not a gap view; hides the loop-back.","wouldBreak":["G1"]},{"option":"Both","why":"Two surfaces for one need.","wouldBreak":[]}],"by":"charlie","goals":["G1"],"acs":["AC1","AC2"],"source":"D-1"},{"id":"D2","title":"The event log is git-tracked","chosen":"`events/*.jsonl` committed; `.gitignore` ignores only `playbook.json`","why":"Shared playbook history travels with the repo; any clone can `rebuild`.","rejected":[{"option":"Ignore events too (machine-local state)","why":"Loses shared history across clones and hosts.","wouldBreak":["AC9"]}],"by":"charlie","goals":["G6"],"acs":["AC8","AC9"],"source":"D-2"},{"id":"D3","title":"Restructure to a uniform envelope (breaking)","chosen":"Normalize output shapes around top-level ids","why":"Cleanest end state; consumers and skill refs move in lockstep.","rejected":[{"option":"Additive-only `.id`/`.ids` on today's shapes","why":"Leaves the inconsistent nesting in place.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-3"},{"id":"D4","title":"Content-derived ids ship in this task","chosen":"Implement F7 now, not as a follow-up","why":"Deterministic ids make `--dry-run` output actionable; fits the output-contract theme.","rejected":[{"option":"Defer F7 to a follow-up","why":"Dry-run previews stay un-actionable.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-4"},{"id":"D5","title":"Envelope changes CLI output only, not stored events","chosen":"Presentation-layer restructure; payload names + `schema_version=1` untouched","why":"The append-only log must fold identically forever; the playbook is a disposable view.","rejected":[{"option":"Rename stored payload fields / bump schema","why":"Breaks the append-only on-disk contract.","wouldBreak":["AC14"]}],"by":"agent","goals":["G3"],"acs":["AC4"],"source":"D-5"},{"id":"D6","title":"Content-derived ids keep existing formats","chosen":"Only minting changes (random -> hash prefix); regexes stay","why":"Existing ids stay valid and validators unchanged.","rejected":[{"option":"New / longer id format","why":"Invalidates validators and on-disk ids.","wouldBreak":["AC7"]}],"by":"agent","goals":["G4"],"acs":["AC7"],"source":"D-6"},{"id":"D7","title":"Top-level id on mutations, per-row id on reads","chosen":"Mutations expose `.id`/`.ids`; collections stay arrays with row `.id`","why":"Predictable threading with minimal breakage; lists still return plain payloads.","rejected":[{"option":"Wrap every command in `{ok,data}`","why":"Over-wraps reads, breaks more consumers, fights list convention.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-7"},{"id":"D8","title":"Only rule and observation ids are content-derived","chosen":"`r-`/`ob-` hashed; `rt-`/`fb-`/`ev-` stay random","why":"Loop and event records are distinct-in-time; hashing would collapse them.","rejected":[{"option":"Content-derive all ids","why":"Two identical retrievals would merge into one record.","wouldBreak":["AC14"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-8"},{"id":"D9","title":"Pure content hash, no collision suffix","chosen":"`prefix-` + first 8 hex of sha256(parts joined by newline)","why":"Clean idempotency; distinct-content 32-bit collision risk is negligible; evidence in obs hash keeps findings distinct.","rejected":[{"option":"Hash + suffix on collision","why":"Breaks idempot /* ---------------- index ---------------- */
function buildIndex(){
  const I = {g:{},a:{},d:{},f:{},cs:{},n:{},p:{}};
  M.goals.forEach(x=>I.g[x.id]=x); M.acs.forEach(x=>I.a[x.id]=x); M.decisions.forEach(x=>I.d[x.id]=x);
  M.files.forEach(x=>I.f[x.path]=x); M.callstacks.forEach(x=>I.cs[x.id]=x); M.deps.nodes.forEach(x=>I.n[x.id]=x);
  (M.phases||[]).forEach(x=>I.p[x.id]=x);
  I.acsOf = g => M.acs.filter(a=>a.goal===g);
  I.decsOf = g => M.decisions.filter(d=>(d.goals||[]).includes(g) || (d.acs||[]).some(a=>I.a[a]&&I.a[a].goal===g));
  I.decsOfAc = a => { const s=new Set(I.a[a].decisions||[]); M.decisions.forEach(d=>{ if((d.acs||[]).includes(a)) s.add(d.id); }); return [...s].filter(x=>I.d[x]); };
  I.stacksOfAc = a => M.callstacks.filter(c=>(c.acs||[]).includes(a));
  I.railsOfAc = a => (M.rails||[]).filter(r=>r.ac===a);
  I.findingsOf = g => (M.findings||[]).filter(f=>f.goal===g);
  return I;
}
const dirOf = p => p.includes('/') ? p.slice(0,p.lastIndexOf('/')) : '';
function testParts(t){ const i=t.lastIndexOf(':'); return [t.slice(0,i), t.slice(i+1)]; }

/* ---------------- lens: compute related set ---------------- */
function emptyRel(){ return {g:new Set(),a:new Set(),d:new Set(),f:new Set(),s:new Set(),n:new Set(),w:new Set(),cs:new Set(),p:new Set(),deep:false}; }
function addStack(R,c){ R.cs.add(c.id); c.frames.forEach(fr=>{ R.f.add(fr.file); R.s.add(fr.file+'#'+fr.symbol); }); }
function addAc(R,aid,deep){
  const a=IDX.a[aid]; if(!a) return; R.a.add(aid); R.g.add(a.goal);
  IDX.decsOfAc(aid).forEach(d=>R.d.add(d));
  M.files.forEach(f=>{ if((f.acs||[]).includes(aid)) R.f.add(f.path); });
  (a.verify.tests||[]).forEach(t=>{ const [p,n]=testParts(t); R.f.add(p); R.s.add(p+'#'+n); });
  IDX.stacksOfAc(aid).forEach(c=>addStack(R,c));
  (a.phases||[]).forEach(p=>R.p.add(p));
}
function relOf(key){
  const R=emptyRel(); if(!key) return null;
  const [k,id]=[key.slice(0,key.indexOf(':')), key.slice(key.indexOf(':')+1)];
  if(k==='g'){ R.g.add(id); IDX.acsOf(id).forEach(a=>addAc(R,a.id,false)); IDX.decsOf(id).forEach(d=>R.d.add(d.id));
    M.files.forEach(f=>{ if((f.goals||[]).includes(id)) R.f.add(f.path); });
    R.g.clear(); R.g.add(id); }
  else if(k==='a'){ addAc(R,id,true); R.deep=true; }
  else if(k==='d'){ const d=IDX.d[id]; R.d.add(id); (d.goals||[]).forEach(g=>R.g.add(g)); (d.acs||[]).forEach(a=>{ R.a.add(a); const A=IDX.a[a]; if(A) R.g.add(A.goal);
      M.files.forEach(f=>{ if((f.acs||[]).includes(a)) R.f.add(f.path); }); }); }
  else if(k==='f'){ const f=IDX.f[id]; R.f.add(id); R.deep=true; if(f){ (f.goals||[]).forEach(g=>R.g.add(g)); (f.acs||[]).forEach(a=>{R.a.add(a); const A=IDX.a[a]; if(A) R.g.add(A.goal);});
      M.decisions.forEach(d=>{ if((d.acs||[]).some(a=>(f.acs||[]).includes(a))) R.d.add(d.id); });
      M.callstacks.forEach(c=>{ if(c.frames.some(fr=>fr.file===id)) R.cs.add(c.id); });
      M.acs.forEach(a=>(a.verify.tests||[]).forEach(t=>{ if(testParts(t)[0]===id){ R.a.add(a.id); R.g.add(a.goal);} })); } }
  else if(k==='s'){ const [p,n]=id.split('#'); R.f.add(p); R.s.add(id); R.deep=true;
      M.callstacks.forEach(c=>{ if(c.frames.some(fr=>fr.file===p&&fr.symbol===n)){ R.cs.add(c.id); (c.acs||[]).forEach(a=>{R.a.add(a); R.g.add(IDX.a[a].goal);}); } });
      M.acs.forEach(a=>(a.verify.tests||[]).forEach(t=>{ if(t===p+':'+n){R.a.add(a.id);R.g.add(a.goal);} })); }
  else if(k==='n'){ const nd=IDX.n[id]; R.n.add(id);
      M.files.forEach(f=>{ if(dirOf(f.path)===id || (nd&&(nd.files||[]).includes(f.path))){ R.f.add(f.path); (f.goals||[]).forEach(g=>R.g.add(g)); (f.acs||[]).forEach(a=>{R.a.add(a); if(IDX.a[a]) R.g.add(IDX.a[a].goal);}); } }); }
  else if(k==='c'){ const c=IDX.cs[id]; addStack(R,c); R.deep=true; (c.acs||[]).forEach(a=>{R.a.add(a); R.g.add(IDX.a[a].goal);}); (c.goals||[]).forEach(g=>R.g.add(g)); }
  else if(k==='p'){ const p=IDX.p[id]; R.p.add(id); (p.goals||[]).forEach(g=>R.g.add(g)); (p.acs||[]).forEach(a=>R.a.add(a)); (p.files||[]).forEach(f=>R.f.add(f)); }
  else if(k==='w'){ const w=M.deps.forbidden[+id]; R.w.add(id); (w.enforcedBy.match(/AC\d+/g)||[]).forEach(a=>addAc(R,a,false)); }
  // derived: dep nodes + walls
  if(k!=='n'){ M.deps.nodes.forEach(nd=>{ if([...R.f].some(p=>dirOf(p)===nd.id || (nd.files||[]).includes(p))) R.n.add(nd.id); }); }
  M.deps.forbidden.forEach((w,i)=>{ const m=w.enforcedBy.match(/AC\d+/g)||[]; if(m.some(a=>R.a.has(a)) && (k==='a'||k==='g'||k==='w'||k==='d')) R.w.add(String(i)); });
  return R;
}

function applyLens(){
  const key = S.hover || S.focus;
  const R = relOf(key);
  document.body.classList.toggle('lensing', !!R);
  const on = (el,flag)=>el.classList.toggle('lit',!!flag);
  $$('.rung[data-g]').forEach(el=>on(el, R && R.g.has(el.dataset.g)));
  $$('.ac[data-a]').forEach(el=>on(el, R && R.a.has(el.dataset.a)));
  $$('.dec[data-d]').forEach(el=>on(el, R && R.d.has(el.dataset.d)));
  $$('.phases [data-p]').forEach(el=>on(el, R && R.p.has(el.dataset.p)));
  $$('.file[data-f]').forEach(el=>{
    const lit = R && R.f.has(el.dataset.f); on(el,lit);
    const pinned = el.classList.contains('pinned');
    let anyVis=false, hidden=0;
    const syms=$$('.sym',el); const nch=syms.filter(s=>s.dataset.c!=='same').length;
    syms.forEach(sy=>{
      const sl = R && R.s.has(el.dataset.f+'#'+sy.dataset.n); on(sy,sl);
      const vis = pinned || (lit && (sl || (R.deep && sy.dataset.c!=='same' && nch<=6)));
      sy.classList.toggle('vis', !!vis); if(vis) anyVis=true; else hidden++;
    });
    const more=$('.symmore',el); if(more){ more.textContent = (lit||pinned)&&hidden ? `+${hidden} more · click file` : ''; }
    el.classList.toggle('showsyms', !!(anyVis));
  });
  $$('.dn[data-n]').forEach(el=>on(el, R && R.n.has(el.dataset.n)));
  $$('.wall[data-w]').forEach(el=>on(el, R && R.w.has(el.dataset.w)));
  $$('.csr[data-c]').forEach(el=>on(el, R && R.cs.has(el.dataset.c)));
  applyLive();
  renderCrumb();
}
function applyLive(){
  $$('.hot').forEach(e=>e.classList.remove('hot'));
  if(!S.live) return;
  const {file,symbol}=S.live;
  const fe = $(`.file[data-f="${CSS.escape(file)}"]`);
  if(fe){ fe.classList.add('hot','showsyms'); const se=$(`.sym[data-n="${CSS.escape(symbol)}"]`,fe); if(se){ se.classList.add('hot','vis'); scrollMargin(se); } else scrollMargin(fe); }
  const nd = M.deps.nodes.find(n=>dirOf(file)===n.id || (n.files||[]).includes(file));
  if(nd) $$(`.dn[data-n="${CSS.escape(nd.id)}"]`).forEach(e=>{ e.classList.add('hot'); });
  const first=$(`.dn.hot`); if(first) scrollMargin(first);
}
function scrollMargin(el){
  const col = el.closest('.margin'); if(!col || getComputedStyle(col).display==='none') return;
  const r=el.getBoundingClientRect(), c=col.getBoundingClientRect();
  if(r.top < c.top+30 || r.bottom > c.bottom-30) col.scrollTo({top: col.scrollTop + (r.top - c.top) - c.height/3, behavior:'smooth'});
}
function scrollFirstLit(){
  ['#mFiles .file.lit','#mDeps .dn.lit'].forEach(s=>{ const e=$(s); if(e) scrollMargin(e); });
}

function renderCrumb(){
  const el=$('#crumb'); if(!el) return;

  let label = id; if(k==='f') label=id.split('/').pop(); if(k==='s') label=id.split('#')[1]; if(k==='w') label='wall';

  el.innerHTML = `lens ${trail.join('')}<button>${glyph} ${esc(label)}</button><button class="x" id="bClear" title="clear (esc)">✕</button>`;
}

/* ---------------- ladder ---------------- */
function playedSet(){ return new Set(store.get('played:'+PID, [])); }
function markPlayed(aid){ const s=playedSet(); s.add(aid); store.set('played:'+PID,[...s]); }
function heatColor(p){ return p>=0.8?'#2d7a4b':p>=0.5?'#c08a17':'#b8432f'; }

function renderLadder(){
  const played=playedSet(), mast=masteryByGoal();
  $('#ladder').innerHTML = M.goals.map(g=>{
    const acs=IDX.acsOf(g.id), decs=IDX.decsOf(g.id), fnd=IDX.findingsOf(g.id), ms=mast[g.id];
    const heat = ms&&ms.t ? `<span class="heat" style="background:${heatColor(ms.c/ms.t)}" title="grill mastery ${ms.c}/${ms.t}"></span>` : '';
    return `<div class="rung" data-g="${g.id}" id="r-${g.id}">

        <span class="gtitle">${md(g.title)}</span>

          <span class="dpips" title="${decs.length} decisions">${'◆'.repeat(decs.length)}</span>
          ${ms&&ms.t?`<span class="mast" style="background:${heatColor(ms.c/ms.t)}">${Math.round(100*ms.c/ms.t)}%</span>`:''}
        </span>
      </button>
      <div class="rbody">
        ${g.description?`<p class="gdesc">${md(g.description)}</p>`:''}
        <div class="split">
          <div><div class="colh">☑ criteria · ▶ play the proof</div>${acs.map(a=>renderAc(a,played)).join('')}</div>
