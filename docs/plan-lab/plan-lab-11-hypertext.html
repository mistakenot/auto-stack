<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Hypertext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{
  --paper:#f3eee3; --paper2:#ebe5d7; --card:#fbf8f1; --ink:#1c1a16; --ink2:#4a463d; --ink3:#857f72; --rule:#d6cfbf; --rule2:#c4bba8;
  --accent:#2f7d4f; --accent-soft:#dcebdf;
  --t-guardrail:#8c2f39; --t-finding:#b5541c; --t-decision:#3446a0; --t-epicdecision:#6573b8; --t-ac:#2b6a3c; --t-phase:#9a6f00; --t-step:#9a6f00;
  --t-file:#46586a; --t-path:#8a6d3b; --t-command:#146b72; --t-term:#6a3d9e; --t-thread:#a8295f; --t-section:#2d2a24; --t-diagram:#566a1f;
  --t-api:#20588a; --t-symbol:#20588a; --t-epictask:#7a5533; --t-journey:#7a5533; --t-seam:#7a5533; --t-transcript:#146b72;
  --t-assumption:#5e5a52; --t-risk:#9b3d1a; --t-alternative:#6e6a60; --t-feedback:#8a5a2b; --t-address:#6a3d9e; --t-eventtype:#566a1f;
  --t-wanted:#c0392b; --t-home:#1c1a16; --t-special:#1c1a16;
  --add:#2f8a4f; --edit:#c28a12; --delete:#b83a2e;
  --serif:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --ui:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --spine:46px; --paneW:660px;
}
body.p052{ --accent:#8a5a2b; --accent-soft:#efe1cf; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{overflow:hidden;display:flex;flex-direction:column}
a{color:inherit}
/* ---------- header ---------- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:56px;border-bottom:1px solid var(--rule2);background:var(--paper);position:relative;z-index:50}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:var(--accent);opacity:.9}
.brand{font-family:var(--ui);font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .glyph{width:22px;height:22px}
.seg{display:flex;border:1px solid var(--rule2);border-radius:4px;overflow:hidden;font-family:var(--ui);font-size:13px}
.seg button{all:unset;cursor:pointer;padding:6px 11px;display:flex;align-items:center;gap:7px;color:var(--ink2);white-space:nowrap}
.seg button + button{border-left:1px solid var(--rule2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg button .k{font-family:var(--mono);font-weight:600}
.seg button .f{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tb{all:unset;cursor:pointer;font-family:var(--ui);font-size:13px;color:var(--ink2);padding:6px 9px;border-radius:4px;white-space:nowrap}
.tb:hover{background:var(--paper2);color:var(--ink)}
.tb[aria-pressed=true]{background:#f3d9a8;color:#5a3a00}
.spacer{flex:1}
#searchbtn{all:unset;cursor:text;display:flex;align-items:center;gap:10px;border:1px solid var(--rule2);background:var(--card);padding:6px 10px;border-radius:5px;font-family:var(--ui);font-size:13px;color:var(--ink3);min-width:220px}
#searchbtn kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--paper);color:var(--ink2)}
/* ---------- desk / stack ---------- */
#desk{flex:1 1 auto;position:relative;min-height:0}
#stack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
#stack::-webkit-scrollbar{height:10px}#stack::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:5px}
.pane{flex:0 0 var(--paneW);width:var(--paneW);height:100%;position:sticky;background:var(--card);border-right:1px solid var(--rule);box-shadow:-10px 0 24px -14px rgba(40,30,10,.35);display:flex}
.pane.wide{flex-basis:min(1080px,calc(100vw - 80px));width:min(1080px,calc(100vw - 80px))}
.pane .spine{flex:0 0 var(--spine);border-right:1px solid var(--rule);position:relative;cursor:pointer;background:linear-gradient(90deg,var(--paper2),var(--card))}
.pane .spine .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.pane .spine .vt{position:absolute;left:50%;top:14px;writing-mode:vertical-rl;transform:translateX(-50%);font-family:var(--ui);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;max-height:calc(100% - 60px);overflow:hidden;text-overflow:ellipsis}
.pane .spine .vt b{font-family:var(--mono);color:var(--tc);font-weight:600;margin-bottom:8px;display:inline-block}
.pane .spine .x{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);all:unset;position:absolute;bottom:12px;left:13px;cursor:pointer;font-family:var(--ui);color:var(--ink3);font-size:18px;line-height:1}
.pane .spine .x:hover{color:var(--ink)}
.pane .body{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 34px 80px 30px;scroll-behavior:smooth}
.pane.flash{animation:flash 1s}
@keyframes flash{0%{background:#fff4d6}100%{background:var(--card)}}
.pane.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.ghostpane{flex:0 0 360px;display:flex;align-items:center;justify-content:center;padding:30px;color:var(--ink3);font-size:16px;line-height:1.5}
.ghostpane > div{max-width:300px;border:1.5px dashed var(--rule2);border-radius:10px;padding:22px}
.ghostpane svg{color:var(--rule2);display:block;margin-bottom:10px}
@media (max-width:760px){.ghostpane{display:none}}
#ribbons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* ---------- article ---------- */
.prov{font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);white-space:nowrap;text-decoration:none}
.chip.solid{background:var(--tc);color:#fff}
.chip.plain{background:var(--paper2);color:var(--ink2)}
.idtag{font-family:var(--mono);font-weight:600;color:var(--tc);font-size:13px;text-transform:none;letter-spacing:0}
h1.t{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.12;margin:4px 0 12px;letter-spacing:-.01em;text-wrap:balance}
h1.t code{font-size:.8em}
.lead{font-style:italic;font-size:18px;line-height:1.45;color:var(--ink2);margin:0 0 18px;border-left:3px solid var(--tc);padding-left:14px}
.md{font-size:17px;line-height:1.58}
.md p{margin:0 0 .85em}
.md ul,.md ol{padding-left:1.3em;margin:0 0 .9em}.md li{margin:.25em 0}
.md blockquote{margin:0 0 1em;padding:.2em 0 .2em 1em;border-left:3px solid var(--rule2);color:var(--ink2);font-style:italic}
.md table{border-collapse:collapse;font-size:14.5px;margin:0 0 1em;width:100%;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.md th{font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.md input[type=checkbox]{margin-right:6px}
code{font-family:var(--mono);font-size:.82em;background:var(--paper2);padding:1px 4px;border-radius:3px;word-break:break-word}
pre{background:#1f1d19;color:#ece6d6;padding:12px 14px;border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.5}
pre code{background:none;padding:0;color:inherit;font-size:13px}
h2.sub{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:30px 0 10px;display:flex;align-items:center;gap:10px}
h2.sub::after{content:"";flex:1;height:1px;background:var(--rule)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14.5px;margin:0 0 18px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.facts dt{font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.facts dd{margin:0;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
/* links */
a.hl{--tc:var(--ink);color:var(--tc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--tc) 45%,transparent);cursor:pointer;border-radius:2px;transition:background .12s}
a.hl:hover{background:color-mix(in srgb,var(--tc) 13%,transparent);border-bottom-color:var(--tc)}
a.hl.term{border-bottom-style:dotted}
a.hl.wanted{color:var(--t-wanted);border-bottom-style:dashed}
a.hl code{color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,var(--paper2))}
a.hl.idl{font-family:var(--mono);font-size:.86em;font-weight:600;letter-spacing:-.01em}
a.hl.open{background:color-mix(in srgb,var(--tc) 16%,transparent)}
a.hl.trail{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 45%,transparent)}
/* lint */
body.lint .avoid{background:linear-gradient(transparent 62%,#f7cf7a 62%);text-decoration:underline wavy #c0392b;text-decoration-thickness:1px;text-underline-offset:3px;cursor:help}
/* transclusion */
.tx{border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 4%,var(--card));margin:0 0 14px;padding:10px 14px 4px;border-radius:0 6px 6px 0}
.tx > .txh{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;font-family:var(--ui);font-size:14px;font-weight:600}
.tx > .txh .n{font-family:var(--mono);color:var(--tc);font-size:12.5px}
.tx .md{font-size:15.5px}
.linkrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:15.5px;line-height:1.35}
.linkrow .idcol{flex:0 0 auto;min-width:64px}
.linkrow .chg{font-family:var(--mono);font-weight:700;width:14px;text-align:center}
.chg.add{color:var(--add)}.chg.edit{color:var(--edit)}.chg.delete{color:var(--delete)}
/* backlinks */
.bl{padding:10px 0;border-bottom:1px solid var(--rule)}
.bl .h{display:flex;gap:8px;align-items:baseline;font-size:15px}
.bl .snip{font-size:14px;line-height:1.45;color:var(--ink2);margin-top:4px}
.bl .snip mark{background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--ink);padding:0 2px;border-radius:2px}
.bl .lab{font-family:var(--ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-left:auto;white-space:nowrap}
.localgraph{width:100%;height:250px;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.localgraph text{font-family:var(--mono);font-size:10px;fill:var(--ink2);pointer-events:none}
.localgraph .nd{cursor:pointer}
/* terminal */
.term-block{background:#1f1d19;color:#ece6d6;border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.55;margin:0 0 16px;overflow-x:auto}
.term-block .bar{display:flex;gap:6px;margin:-4px 0 12px}.term-block .bar i{width:10px;height:10px;border-radius:50%;background:#4a463d;display:block}
.term-block .note{color:#9c9583;font-style:italic}
.term-block .cmd{color:#fff}.term-block .cmd::before{content:"$ ";color:#7fb88f}
.term-block .out{color:#cfc6b0;white-space:pre;margin:2px 0 12px}
.term-block a.hl{--tc:#9fe0c0;border-bottom-color:#5a8f78}
.term-block .stat{font-family:var(--ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:#3a372f;color:#bdb49e;margin-left:6px}
/* comments */
.cmt{display:flex;gap:12px;margin:0 0 14px}
.cmt .who{flex:0 0 72px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding-top:4px}
.cmt.review .who{color:var(--t-thread)}.cmt.author .who{color:var(--t-ac)}
.cmt .md{font-size:15px;flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.cmt.author .md{background:#f1f5ee}
/* api */
.sig{font-family:var(--mono);font-size:13px;background:var(--paper2);padding:6px 9px;border-radius:5px;display:block;white-space:pre-wrap;word-break:break-word}
.mem{margin:0 0 14px}.mem .md{font-size:15px;margin-top:6px}
.mermaidbox{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;overflow-x:auto;margin:0 0 16px;text-align:center}
.mermaidbox svg{max-width:100%;height:auto}
.mermaidbox .caption{font-style:italic;color:var(--ink2);font-size:14px;margin-top:8px}
.mermaidbox g.node.hlnode{cursor:pointer}.mermaidbox g.node.hlnode:hover rect,.mermaidbox g.node.hlnode:hover polygon{stroke-width:2.5px!important;stroke:var(--accent)!important}
/* home */
.fieldband{border-radius:10px;padding:18px 20px;margin:4px 0 18px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);position:relative;overflow:hidden}
.fieldband .fk{font-family:var(--ui);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--accent)}
.fieldband .fs{font-size:21px;line-height:1.3;margin:6px 0 12px}
.strata{display:flex;height:16px;border-radius:3px;overflow:hidden;margin:10px 0 6px}
.strata div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--ui);font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
.stats div{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.stats b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1}
.stats span{font-family:var(--ui);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.btn{all:unset;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;padding:9px 14px;border-radius:5px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn:hover{filter:brightness(1.15)}
.toc h3{font-family:var(--ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:22px 0 4px;color:var(--ink2)}
.toc .linkrow{font-size:15px;padding:5px 0}
/* popovers */
.pop{position:fixed;z-index:200;width:380px;max-width:calc(100vw - 20px);background:var(--card);border:1px solid var(--rule2);border-top:4px solid var(--tc);border-radius:7px;box-shadow:0 18px 40px -12px rgba(30,20,0,.35),0 2px 6px rgba(30,20,0,.08);padding:12px 15px 10px;animation:pop .14s ease-out;max-height:60vh;overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop .pt{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.2;margin:4px 0 6px}
.pop .md{font-size:14.5px;line-height:1.5;max-height:190px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.pop .pf{font-family:var(--ui);font-size:12px;color:var(--ink3);margin-top:8px;display:flex;gap:12px;border-top:1px solid var(--rule);padding-top:6px}
.pop .lead{font-size:14.5px;margin:0 0 8px;padding-left:10px}
/* palette */
#palette{position:fixed;inset:0;background:rgba(28,26,22,.35);z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:10vh}
#palette.on{display:flex}
#palette .box{width:min(680px,calc(100vw - 32px));background:var(--card);border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--rule2)}
#palette input{all:unset;box-sizing:border-box;width:100%;padding:16px 18px;font-family:var(--serif);font-size:21px;border-bottom:1px solid var(--rule)}
#palette ul{list-style:none;margin:0;padding:6px;max-height:56vh;overflow-y:auto;overflow-x:hidden}
#palette li > span:last-child{min-width:0;flex:1}
#palette li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:6px;cursor:pointer}
#palette li.sel{background:var(--paper2)}
#palette li .pt2{font-size:16px}
#palette li .ps{font-size:13px;color:var(--ink3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#palette .foot{font-family:var(--ui);font-size:12px;color:var(--ink3);padding:8px 14px;border-top:1px solid var(--rule);display:flex;gap:16px}
/* path bar */
#pathbar{flex:0 0 auto;display:none;align-items:center;gap:14px;padding:8px 16px;background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:13px;z-index:60}
body.pathmode #pathbar{display:flex}
#pathbar .dots{display:flex;gap:4px;flex:1;align-items:center;min-width:0;overflow:hidden}
#pathbar .dot{flex:1;height:6px;border-radius:3px;background:#4a463d;cursor:pointer;min-width:6px}
#pathbar .dot.done{background:#8b8574}#pathbar .dot.cur{background:var(--accent);height:10px}
#pathbar .dot:hover{background:#c9c1ac}
#pathbar button{all:unset;cursor:pointer;padding:5px 10px;border:1px solid #5b564b;border-radius:4px;white-space:nowrap}
#pathbar button:hover{background:#34312a}
#pathbar .cur-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;font-family:var(--serif);font-size:15px}
/* map */
.mapwrap{position:relative}
.mapsvg{width:100%;height:calc(100vh - 250px);min-height:420px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;display:block}
.mapsvg text{font-family:var(--mono);font-size:9.5px;fill:var(--ink2);pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters label{cursor:pointer;user-select:none}
.filters input{display:none}
.filters input:not(:checked) + .chip{opacity:.35;text-decoration:line-through}
.dirbar{display:grid;grid-template-columns:240px 1fr 60px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.dirbar .b{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--paper2)}
.dirbar code{font-size:12.5px}
.hint{font-family:var(--ui);font-size:12.5px;color:var(--ink3)}
@media (max-width:760px){
  :root{--paneW:calc(100vw - 8px);--spine:34px}
  #top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
  #searchbtn{min-width:0;flex:1}
  .brand .word{display:none}
  .pane{left:0!important}
  .pane .body{padding:18px 16px 80px 16px}
  h1.t{font-size:25px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dirbar{grid-template-columns:1fr 1fr 40px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4" width="8" height="16" rx="1"/><rect x="13.5" y="4" width="8" height="16" rx="1"/><path d="M8 9 C 12 9, 12 14, 16 14" stroke="var(--accent)" stroke-width="2"/></svg><span class="word">Plan Hypertext</span></div>
  <div class="seg" role="group" aria-label="Plan">
    <button data-plan="062"><span class="k">062</span><span class="f">green field</span></button>
    <button data-plan="052"><span class="k">052</span><span class="f">brown field</span></button>
  </div>
  <div class="seg hide-m" role="group" aria-label="Mode">
    <button data-mode="explore">Explore</button>
    <button data-mode="path">Reading path</button>
  </div>

<script id="plan-data" type="application/json">{"062":{"doc":{"title":"062: auto-mail-walking-skeleton","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/146","generated":"2026-08-25","next-prompt":"/commit-task 062"},"tabs":["Requirements","Verification","Solution","Plan"],"nodes":[{"id":"home","type":"home","title":"062: auto-mail-walking-skeleton","tab":null,"origin":"plan","meta":{"title":"062: auto-mail-walking-skeleton","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/146","generated":"2026-08-25","next-prompt":"/commit-task 062"},"order":1,"rel":[]},{"id":"S:problem","type":"section","title":"Problem","summary":"","body":"The stack carries events *outward* — `auto-shared/bus` broadcasts what happened\nto whoever is listening — but nothing carries a message **to a named recipient**\nand guarantees it survives until someone acts on it. A supervisor learns its\nchild crashed by noticing silence. An agent in `auto-stack` that finds a bug in\n`auto-web` has nowhere to put that fact. Two agents in a swarm rediscover the\nsame thing independently.\n\n[Epic 005](../../epics/epic-005-auto-mail-mvp.html) fills that gap with\n`auto mail`: a durable, addressed, at-least-once channel between agents on one\nhost. This task is the epic's **T1 — the walking skeleton**.\n\nThe risk T1 exists to retire is not the store. It is **hook → notification**:\nwhether a working agent can be told it has mail, in-band, cheaply, without\nbreaking its turn. Deferring that would defer all the risk, so it is inside the\nskeleton. The second thing it retires is the *oracle*: the harness scenario is\nstood up now so T2–T4 are developed against a working end-to-end test rather\nthan one that arrives at the end and can only confirm what was already built.","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"problem"},"order":2,"rel":[]},{"id":"S:scope-statement","type":"section","title":"What this task is","summary":"Ontology first, then a harness scenario with two agents on one host, then one message travelling between them and being acked — proven by the scenario.","body":"Verbatim from the epic's T1:\n\n> Three things, in order: the ontology entries land in the glossary; a minimal\n> harness scenario comes up with two agents on one host; and one message then\n> travels between them and is acked — through the client seam, the event log,\n> the projection, and an in-band nudge to a working agent — proven by that\n> scenario rather than asserted.\n\nIt **delivers** the epic's CLI transcript **C1** and **honors** guard rails\n**G1, G2, G3, G4, G5, G6, G8, G10, G11, G13, G15, G16**. Those rails are\ninherited requirements, not aspirations — most are stated as checkable\nproperties precisely so they become acceptance criteria, and they do (see the\nVerification tab).","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"scope-statement"},"order":3,"rel":[]},{"id":"S:target-transcript","type":"section","title":"The transcript this task must make real (C1)","summary":"","body":"","tab":"Requirements","origin":"plan","meta":{"children":["C1"],"anchor":"target-transcript"},"order":4,"rel":[]},{"id":"C1","type":"transcript","title":"zsh — two agents trading a message","summary":"Subscribe, send, list, ack — the whole T1 surface. Copied from epic 005; T1 must reproduce these payload shapes.","body":"","tab":"Requirements","origin":"plan","meta":{"steps":[{"note":"receiver binds a virtual channel","status":"done","cmd":"auto mail subscribe auto-web/bugs","out":"{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"},{"note":"sender is in a different project, same host","status":"done","cmd":"auto mail send --to auto-web/bugs --message \"normalizeRemote drops the port on ssh:// URLs\"","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"to\": \"auto-web/bugs\", \"subscriptions\": 1, \"bound\": 1 }"},{"note":"receiver is nudged mid-turn, then lists","status":"done","cmd":"auto mail list","out":"[\n  {\n    \"id\": \"01K9X2QF7M3B0V8N\",\n    \"from\": \"auto-stack/reviewer\",\n    \"sentAt\": \"2026-08-25T10:14:02Z\",\n    \"body\": { \"message\": \"normalizeRemote drops the port on ssh:// URLs\" }\n  }\n]"},{"note":"explicit ack — separate call, always","status":"done","cmd":"auto mail ack 01K9X2QF7M3B0V8N","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": true }"},{"note":"acked mail is gone from the default view","status":"done","cmd":"auto mail list","out":"[]"}]},"order":5,"rel":[]},{"id":"S:goals","type":"section","title":"Goals","summary":"","body":"1. **Ontology first (G16).** `docs/concepts/UBIQUITOUS_LANGUAGE.md` gains\n   **Mail**, **Address**, **Subscription**, **Delivery**, **Binding** — the five\n   terms the epic settled in D-4 — *before* any code uses them. The same word is\n   then used in the schema, the event types, the CLI, the RPC method names and\n   the commit messages. Nothing in mail is called a *Message*: that word is\n   already bound to a role-tagged exchange within a Session.\n\n2. **A new `auto-mail` package, mounted as `auto mail`.** A Go module following\n   `docs/auto-package-patterns.md`, added to `go.work`, the `Makefile` PROJECTS\n   list, and `auto-cli`'s root command — alongside `auto doc`, `auto search`,\n   `auto watch` and the rest.\n\n3. **One client seam (G11).** `mail.Client` is the only API. The CLI, the hook\n   and every future consumer go through it; nothing outside the mail package\n   opens the store. T1 ships the **direct-store** implementation (D-11), so\n   `send` / `list` / `ack` work with **no daemon running**.\n\n4. **An event-sourced store (D-1, D-2).** An append-only event log is the\n   authority; `deliveries` and `bindings` are projections maintained in the\n   **same transaction**. Event types are `alpha.*`-prefixed and the store\n   filename carries `alpha` (G10) — no upcasters, no migrations, `reset` is a\n   supported operation.\n\n5. **The four verbs of C1 (D-4).** `auto mail subscribe|send|list|ack` — flat\n   verbs on `mail` as the resource noun, JSON on stdout, diagnostics on stderr.\n   Plus `init`, `docs` and `reset`.\n\n6. **Broadcast delivery with a compare-and-set ack (D-7, G2, G13).** Consumer\n   state is keyed by `(subscription, mail)`, delivery rows are materialised\n   **lazily against a subscription cursor** (D-10), and `ack` is a conditional\n   update inside the append-and-project transaction that **reports whether this\n   call won the transition**.\n\n7. **An in-band nudge to a working agent (G8).** `auto hooks fire` — the\n   existing PostToolUse adapter that already emits `hookSpecificOutput.\n   additionalContext` for hint rules — also tells an agent it has mail. The\n   no-mail path costs a `stat`, never opens the store, and can never stall or\n   break the hook.\n\n8. **The harness scenario is the verdict (G15).** A new, purely additive\n   `mail-flow` scenario under `harness/scenarios/` brings up two agents on one\n   host, runs the C1 loop against the **real `auto` binary in a container**, and\n   asserts the nudge and the ack. A capability that cannot be demonstrated there\n   is not finished.\n\n9. **Nothing already shipped breaks.** The package is new; the only edits to\n   existing code are additive command registration, the hook's mail check, and\n   the glossary. `make check` and `make test` stay green.","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"goals"},"order":6,"rel":[]},{"id":"S:inherited-rails","type":"section","title":"Inherited guard rails","summary":"Twelve rails from epic 005. Each maps to exactly one acceptance criterion in the Verification tab.","body":"| Rail | Constraint (abridged) | Becomes |\n|---|---|---|\n| **G1** | Mail rows and events are immutable; state changes are appended and re-projected | AC-3 |\n| **G2** | Consumer state lives in a `deliveries` join keyed by `(subscription, mail)`, never on the mail row | AC-4 |\n| **G3** | Ack is a separate explicit call; reading does not retire mail | AC-5 |\n| **G4** | At-least-once and unordered *as documented*; consumers idempotent on mail id | AC-7 |\n| **G5** | Addresses are virtual — no physical identity in them or in a stored envelope's `to` | AC-8 |\n| **G6** | Sending to an address with no subscription persists; a later subscriber sees it; send reports `subscriptions` **and** `bound` | AC-9 |\n| **G8** | The no-mail nudge path is a stat-level check and can never stall or break the hook | AC-10 |\n| **G10** | Alpha: `alpha` marker in the type string *and* the filename; reset is supported; nothing may depend on the store | AC-11 |\n| **G11** | Nothing outside the mail package reads the store | AC-12 |\n| **G13** | Ack transitions exactly once and reports whether it won | AC-6 |\n| **G15** | A capability is done when it passes end to end in the harness | AC-13 |\n| **G16** | The ontology lands before the code that uses it | AC-1 |\n\nEpic decisions this task builds to: **D-1** (event log + same-transaction\nprojection), **D-2** (alpha marker), **D-4** (flat verbs, no `message` noun),\n**D-7** (broadcast + compare-and-set ack), **D-9** (free-form addresses),\n**D-10** (lazy delivery rows against a subscription cursor), **D-11** (direct-store\nclient; daemon never required). **D-3** (reuse `auto-shared/rpc` + `transport`)\nconstrains *how* mail goes over the wire when it does — see D-062-5 for why that\nis not in T1. **D-5 is superseded** by D-12 and is not built to.","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"inherited-rails"},"order":7,"rel":[]},{"id":"S:out-of-scope","type":"section","title":"Out of Scope","summary":"","body":"Deferred to later epic tasks — building any of it here would break the vertical\nslice:\n\n- **`#parent` resolution and the self-identification bridge** — epic **T2**\n  (D-13). T1 has no relative handles at all; every address is absolute.\n- **Waking idle agents: keystroke injection, the effector seam, liveness by hook\n  silence, the escalation policy, herdr env capture** — epic **T3** (G7, G9,\n  G12, G14, D-6, D-8). T1's only notification is the in-band hook nudge to an\n  agent that is *already working*.\n- **The reconcile tick in the daemon** — epic **T3** (D-12). T1 notifies inline\n  and nothing else.\n- **The cross-project journey J2 end to end, `quickstart`, `doctor`, and the\n  agent-facing guidance that drives adoption** — epic **T4**. See D-062-4.\n- **The RPC `mail.Client` implementation and `mail.*` methods on the daemon\n  peer** — see D-062-5.\n- **Emitting a \"you have mail\" bus event** — belongs with the daemon-side\n  notifier in T3. See D-062-6.\n\nDeferred to the parked backlog (`docs/auto-mail-beyond-mvp.md`) — read it before\nproposing any of these:\n\n- Competing consumers / queue mode, holds and visibility timeouts, heartbeat\n  leases, fencing tokens, dead-lettering, `delivery_count`.\n- Cross-host delivery, log merge, store clock authority.\n- `#new` spawn-on-send, implicit activation, `#children` / `#siblings` / roles.\n- Prefix and attribute subscriptions, threading, priority, `kind` vocabulary,\n  refs, expiry, correlation ids, cc/bcc, attachments.\n- Blocking receive (`wait`), file leases, search over mail, a web UI, export or\n  archive, retention.\n\nAlso out of scope: any change to autowatch's existing `Backend` interface (D-6),\nand any widening of `hooks.CaptureEnv`'s allowlist (G7 — that is T3's problem).","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"out-of-scope"},"order":8,"rel":[]},{"id":"S:references","type":"section","title":"Reference code & docs","summary":"Verified paths this task builds on or extends.","body":"**Source of truth**\n\n- `docs/epics/epic-005-auto-mail-mvp.html` — the epic. Guard rails, decisions,\n  C1, the ER shape.\n- `docs/auto-mail-beyond-mvp.md` — the parked backlog. What is deliberately out.\n- `docs/concepts/UBIQUITOUS_LANGUAGE.md` — the glossary G16 requires updating\n  first. Has autodoc frontmatter and a generated ER block.\n\n**Blueprints and conventions**\n\n- `docs/auto-package-patterns.md` — new-package layout, baseline subcommands,\n  JSON conventions, `go.mod` and Makefile integration.\n- `harness/CLAUDE.md` — the scenario model and the four-step \"How to add a\n  scenario\" recipe. Adding one is purely additive.\n\n**Code seams this task uses**\n\n- `auto-cli/cmd/auto/main.go` — where each tool's `rootcmd.New(stdout, stderr)`\n  is mounted on the root command.\n- `auto-cli/cmd/auto/hookscmd.go` — `auto hooks fire`: reads the payload,\n  appends the durable envelope, POSTs the bus event, then calls\n  `matchAndEmitHint(...)`. The mail check hooks in at the same point.\n- `auto-cli/cmd/auto/hints.go` — `hookResponse` / `hookSpecificOutput`, the\n  `additionalContext` envelope both Claude and Codex parse. This is the in-band\n  nudge mechanism; it already exists and only needs a second producer.\n- `auto-shared/hooks/log.go` — `CaptureEnv` (allowlists `NTM_*` / `TMUX` /\n  `TMUX_*` only) and `CaptureContext` (adds tmux session / window / pane index\n  and `tmux_pane_id`, behind a 200ms timeout). This is the physical-context\n  capture both `subscribe` and the hook use to derive a binding.\n- `auto-shared/config` — `AutoDir()`, `DecodeJSONFile`, `WriteJSONFile`,\n  `ValidationError`.\n- `auto-shared/rpc/` + `auto-shared/transport/` — the JSON-RPC peer and the\n  unix/tcp transports mail will use when it goes over the wire (D-3). Not used\n  in T1.\n- `modernc.org/sqlite` — pure-Go SQLite, already a direct dependency of\n  `auto-watch` and `auto-search`. No new runtime dependency.\n- `harness/scenarios/event-flow/` — the closest existing pattern: multi-container\n  agents, per-container `HOST_ID` seeding, `auto init --project`, a co-located\n  daemon and a ready-file healthcheck.","tab":"Requirements","origin":"plan","meta":{"children":[],"anchor":"references"},"order":9,"rel":[]},{"id":"S:decisions","type":"section","title":"Decisions taken while writing these requirements","summary":"","body":"These are calls the epic left to the task. Each is recorded rather than buried,\nwith the alternative that was rejected.","tab":"Requirements","origin":"plan","meta":{"children":["D-062-1","D-062-2","D-062-3","D-062-4","D-062-5","D-062-6","D-062-7"],"anchor":"decisions"},"order":10,"rel":[]},{"id":"D-062-1","type":"decision","title":"Two agents on one host = two workspaces in one container, not two containers","summary":"The mail store is host-global, and the harness's own convention gives each container a distinct host id — so two containers would be two hosts.","body":"**Context:** T1's scenario must bring up \"two agents on one host\". `event-flow`'s\npattern is one container per agent, each seeded with a **distinct `HOST_ID`** —\nthat is precisely what makes it a *multi-host* scenario.\n**Decision:** The `mail-flow` scenario is a **single container** with one seeded\nhost id and one `~/.auto`, containing **two registered project workspaces**\n(`/workspace/project-a`, `/workspace/project-b`). Each \"agent\" is a separate\n`auto` process invocation run in one of those workspaces. That is genuinely two\nagents on one host, and it exercises the concurrent-writer case D-11 warns about\nwithout inventing a shared-`HOME` volume pattern the harness does not have.\n**Alternatives:** Two containers sharing a `~/.auto` volume (contradicts the\nharness's one-container-one-host convention, and a shared `HOME` collides on\nready-files and host identity); two containers with distinct host ids (that is\nmulti-host, which the MVP explicitly is not).\n**Consequences:** The scenario is smaller and faster than `event-flow`. When\ncross-host mail arrives, `mail-flow` grows a second container with its own host\nid — additive, and the single-host case stays as the control.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":11,"rel":[]},{"id":"D-062-2","type":"decision","title":"A binding is keyed by the physical context hooks already capture","summary":"Both `auto mail subscribe` and `auto hooks fire` derive the same opaque (manager, target) pair from hooks.CaptureContext — so the nudge can join a hook fire to a subscription with no new plumbing.","body":"**Context:** The nudge needs to answer \"does the agent that just fired this hook\nhave mail?\". The hook payload carries `session_id` and `cwd`; the `auto mail\nsubscribe` process does **not** see `session_id` (it is a tool call, not the hook\nprocess). They need a join key both can compute.\n**Decision:** Binding identity is the **opaque `(manager, target)` pair G12\nmandates**, derived by both sides from the *same* shared helper\n(`auto-shared/hooks.CaptureContext`), on a documented fallback ladder:\n`tmux` + `tmux_pane_id` → `ntm` + the NTM pane identifier → `cwd` + the resolved\nworktree path. **`subscribe` is the only writer of a binding row in T1**, stamping\nthe pair and `last_seen` once. The hook never writes one: refreshing `last_seen`\non every tool call would mean opening the store in the agent's hot path, which\nG8 forbids. Liveness-by-heartbeat therefore arrives with T3, which already owns\nliveness (G9, D-8) and has a daemon to carry the write.\n**Alternatives:** Key on `session_id` (the CLI cannot see it — that is exactly\nthe bridge D-13 defers to T2); key on cwd only (breaks the moment two agents work\nin one checkout, which is this host's normal state — documented in the\nshared-checkout postmortem); a new `--as <label>` flag on subscribe (pushes\nphysical identity onto the caller, and free-form labels collide silently).\n**Consequences:** The nudge works in a container with no tmux (the `cwd` rung),\nwhich is what makes the harness scenario possible. Because nothing refreshes\n`last_seen` in T1, **`bound` means \"a binding row exists\"**, not \"an agent is\nalive right now\" — a distinction stated in `auto mail docs` so nobody reads a\nliveness promise into the count before T3 makes it one. The `last_seen` column\nis created now and stamped at subscribe, so T3's heartbeat is a new writer\nrather than a schema change. The pair stays opaque, so T3\nadds a `herdr` manager as data plus an effector implementation, never a schema\nchange. The `cwd` rung is a *fallback*, not the design — T3 replaces it for\npanes.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":12,"rel":[]},{"id":"TH1","type":"thread","title":"Binding freshness conflicts with the stat-only hook path","tab":"Requirements","origin":"plan","meta":{"anchor":"D-062-2","status":"resolved","priority":"p1","comments":[{"by":"review","md":"D-062-2 says every hook fire refreshes `last_seen` on the matching binding row, and AC-9 treats stale versus live bindings as observable through the `bound` count. But AC-10, the end-state flow, and Phase 3 require the hook mail check to perform zero store opens and even leave `~/.auto/mail/alpha-store.db` nonexistent on a host that never ran `auto mail init`. A hook cannot update a SQLite `bindings.last_seen` row without opening or creating the store. The current hook code also only captures context and then emits hints (`auto-cli/cmd/auto/hookscmd.go:94-124`); there is no existing binding-refresh sink. Resolve this before execution: either defer `last_seen`/staleness to T3 and define T1 `bound` as current binding rows, or add an explicit refresh mechanism and acceptance coverage that still satisfies G8."},{"by":"author","md":"Correct, and a real contradiction rather than an ambiguity — a `last_seen` refresh is a store write, and G8 forbids one in the hook. Resolved by scoping, not by weakening G8: D-062-2 now states that **`subscribe` is the only writer of a binding row in T1**, and that heartbeat refresh arrives with T3, which already owns liveness (G9, D-8) and has a daemon to carry the write. The consequence you implied is now recorded explicitly: in T1 `bound` means \"a binding row exists\", not \"an agent is alive right now\", and `auto mail docs` says so, so nobody reads a liveness promise into the count early. AC-9's \"stale or absent\" wording is corrected to \"no binding row\". The `last_seen` column is still created and stamped at subscribe, so T3 adds a writer rather than a schema change."}]},"body":"","order":13,"rel":[{"to":"D-062-2","label":"anchored on"}]},{"id":"D-062-3","type":"decision","title":"The no-mail hook path is gated by a pending-flag file, not a store read","summary":"G8 demands stat cost. A per-binding marker file, written on send and cleared on ack, means the common case never opens SQLite.","body":"**Context:** G8: \"the common case — no pending mail — must cost about what a\n`stat` costs, and must never be able to stall or break the hook.\" Opening a\nSQLite file and running an indexed count is milliseconds, not a `stat`, and it\nhappens on **every tool call of every agent on the host**.\n**Decision:** The mail package maintains a **pending flag** — an empty marker\nfile per bound subscription under `~/.auto/mail/alpha-flags/`. `send` creates the\nflag for each bound subscription inside the same commit path; `ack` removes it\nwhen that subscription's unacked count reaches zero. The hook computes its\n`(manager, target)` pair and stats **exactly one** path: absent means no nudge,\npresent means emit the fixed nudge text. **The hook never opens the store on\neither path.** The flag is authoritative for the *decision to nudge* — which is\nsafe precisely because the nudge is a constant instruction to go and read mail,\ncarrying no mailbox content that a wrong decision could leak or misstate.\n**Alternatives:** Open the store read-only and count (simple, one source of\ntruth — but it is not stat cost, and it puts a SQLite open in every agent's hot\npath); a shared in-memory/daemon cache (reintroduces the daemon into the path\nD-11 removed it from).\n**Consequences:** The flag is a hint about *state*, not a second copy of the\nmailbox. A false positive costs the agent one wasted `auto mail list`, which\nfinds nothing and clears the flag itself — so drift is self-healing rather than\nsticky. A false negative delays the nudge until the next `send` and, once T3\nlands, until the reconcile tick. Both directions are tested. G11 is unaffected —\nthe flag is written and read only by the mail package.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":14,"rel":[]},{"id":"TH2","type":"thread","title":"Present pending-flag behavior contradicts AC-10","tab":"Requirements","origin":"plan","meta":{"anchor":"D-062-3","status":"resolved","priority":"p1","comments":[{"by":"review","md":"D-062-3 says an absent flag returns immediately, but \"only a present flag causes a store open\"; its consequences also say a false positive costs one store open and emits nothing. Later sections require the opposite: the Approach says \"The nudge never opens the store\", the end-state flow says the hook stats the flag with no DB open, AC-10 requires zero store opens on either path, and Phase 3 tests `HasPending` for zero opens on both paths while emitting a nudge when the flag exists. These are mutually exclusive contracts. Pick whether a present flag is authoritative enough to emit the fixed nudge, or whether the hook confirms through the store, then align D-062-3, AC-10, and Phase 3."},{"by":"author","md":"Accepted — D-062-3 was written before the design settled and kept its earlier \"a present flag causes a store open\" text while every later section said the opposite. The hook opening the store was the stale half, so D-062-3 is now aligned to the rest: the hook stats exactly one path and **never opens the store on either path**; the flag is authoritative for the *decision to nudge*. That is safe precisely because the nudge is a fixed constant carrying no mailbox content, so a wrong decision can neither leak nor misstate anything. The consequences are restated to match: a false positive costs the agent one wasted `auto mail list`, which finds nothing and clears the flag itself, making drift self-healing rather than sticky."}]},"body":"","order":15,"rel":[{"to":"D-062-3","label":"anchored on"}]},{"id":"D-062-4","type":"decision","title":"T1 ships init, docs and reset; quickstart and doctor land in T4","summary":"The epic makes adoption a task, not a chore — and doctor's most valuable check (G11) needs T4's cross-project surface to be worth writing.","body":"**Context:** The project's CLI conventions call for `init` / `doctor` /\n`quickstart` / `docs` on every tool. The epic assigns \"quickstart, doctor and\nagent-facing guidance\" to **T4** and argues explicitly that adoption is a task,\nnot a chore.\n**Decision:** T1 ships `init` (creates `~/.auto/mail/` and the store), `docs`\n(the full command reference — an agent must be able to discover the surface it\nis being asked to use) and `reset` (G10 makes wiping a *supported operation*, and\nthe harness needs it for isolation). `quickstart` and `doctor` are T4's, as the\nepic assigns them.\n**Alternatives:** Ship stub `quickstart`/`doctor` in T1 (a stub quickstart is\nworse than none — it teaches a workflow that is half-built, and it is exactly the\n\"ships complete and unused\" failure the epic's T4 rationale names); pull T4's\nadoption work forward (breaks the slice and duplicates work once `#parent` and\nwaking exist).\n**Consequences:** The harness readiness gate is `auto mail list` returning `[]`\nagainst an initialised store rather than a `doctor` call. G11's doctor check is\nnamed in T4's scope, and T1 enforces the same rule with a repo-wide test instead\n(AC-12), so the constraint is not merely aspirational in the interim.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":16,"rel":[]},{"id":"D-062-5","type":"decision","title":"T1 defines the Client seam and ships one implementation, with the conformance suite written against the interface","summary":"D-11 makes the direct-store client the MVP's; the RPC one is the daemon's and arrives with the daemon in T3.","body":"**Context:** Seam 1 warns that \"an abstraction with one implementation is a\nguess\". D-11 settles that the MVP CLI binds the **direct-store** implementation\nand the RPC one is what the daemon uses.\n**Decision:** T1 defines `mail.Client` and ships the direct-store implementation\nonly. It also ships a **conformance suite written against the interface** (the\n`auto-shared/rpc/conformance` pattern), run against that one implementation now.\nNo `mail.*` methods are registered on the daemon peer in T1.\n**Alternatives:** Build both implementations in T1 (drags the daemon, its\nlifecycle and its failure modes into the walking skeleton — and D-11 exists\nprecisely to keep the daemon out of the critical path); ship no conformance suite\nuntil there are two implementations (then the second implementation pays for the\nsuite, which is when it is most tempting to skip).\n**Consequences:** The seam is guarded by an executable contract from day one, so\nT3's RPC implementation is a second `go test` target rather than a redesign. When\nit lands it registers `mail.*` on the existing peer per D-3 — no new wire.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":17,"rel":[]},{"id":"D-062-6","type":"decision","title":"Inline notification in T1 is the pending flag; the bus event waits for the daemon","summary":"D-12's inline notify needs no bus hop when the receiver's own hook reads the store on the same host.","body":"**Context:** D-12 keeps inline notification as the fast path. The epic's\ncontainer diagram draws the notification arriving over the bus\n(`DAEMON → BUS ⇢ HOOK`), but D-11 removes the daemon from T1 entirely.\n**Decision:** In T1, \"notify inline\" means: `send` sets the receiver's pending\nflag inside its commit path, and the receiver's very next tool-call hook picks it\nup. No bus event is published by `auto mail send` in T1. The `alpha.mail.*` bus\nevent type is defined and reserved, and publishing it is T3's, alongside the\nnotifier and the reconcile tick that consume it.\n**Alternatives:** Publish a bus event from `send` in T1 (buys nothing for the\nin-band path, and adds a live dependency on a daemon that D-11 says must not be\nrequired); rely on the bus *instead of* the flag (the bus is at-most-once and\ndrops slow subscribers by its own spec — that is the D-5 error D-12 corrected).\n**Consequences:** T1's notification latency is bounded by the receiver's next\ntool call, which is exactly what an in-band nudge means. Nothing outside mail is\ntouched. `auto-ui`'s future supervisor view still gets its feed when T3 publishes.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":18,"rel":[]},{"id":"D-062-7","type":"decision","title":"Losing an ack race is a reported outcome, not an error exit","summary":"wonTransition:false on stdout plus a stderr note; exit 0. Losing a race is not invalid usage.","body":"**Context:** G13 requires that a losing ack be \"told, never silently treated as\nsuccess\". That fixes the payload, not the exit code, and the project convention\nreserves fail-fast exits for invalid CLI usage.\n**Decision:** `auto mail ack <id>` always prints\n`{\"id\":…, \"acked\":true, \"wonTransition\":<bool>}` on stdout and exits **0** when\nthe delivery exists. A loser gets `wonTransition:false` plus a one-line note on\nstderr naming who won it. Exit non-zero is reserved for a genuine failure: an\nunknown mail id, an id the caller has no delivery row for, or a store error.\n**Alternatives:** Exit non-zero on a lost race (a shell would treat a correct,\nexpected outcome as a failure, and under pure broadcast the common case has no\nrace at all — two *subscriptions* never contend); exit 0 and say nothing (the\nexact silent-success G13 forbids).\n**Consequences:** `acked:true` means \"this delivery is acked now\", which is what\na caller acts on; `wonTransition` answers \"was it me\". That split is the primitive\ncompeting consumers need later, obtained now for free.","tab":"Requirements","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":19,"rel":[]},{"id":"S:open-questions","type":"section","title":"Open Questions & Assumptions","summary":"No open pd-questions — every fork was resolvable from the epic or an existing repo pattern. These are the assumptions carried forward.","body":"Assumptions this task proceeds on. Each is safe to revisit without redoing work:","tab":"Requirements","origin":"plan","meta":{"children":["A1","A2","A3","A4","A5","A6","A7"],"anchor":"open-questions"},"order":20,"rel":[{"to":"A1","label":"contains"},{"to":"A2","label":"contains"},{"to":"A3","label":"contains"},{"to":"A4","label":"contains"},{"to":"A5","label":"contains"},{"to":"A6","label":"contains"},{"to":"A7","label":"contains"}]},{"id":"A1","type":"assumption","title":"The store is one SQLite file at `~/.auto/mail/alpha-store.db`","body":"[ ] **The store is one SQLite file at `~/.auto/mail/alpha-store.db`.** The\nbacklog records maildir as \"genuinely better for lock-free concurrent append\"\nbut superseded by SQLite once subscriptions, read state and bindings exist.\n`modernc.org/sqlite` is already a direct dependency of two modules, so this\nadds no runtime dependency.","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":21,"rel":[]},{"id":"A2","type":"assumption","title":"Concurrent writers are handled with WAL + `busy_timeout` + a single write connection per process, with every write in one immediate transaction","body":"[ ] **Concurrent writers are handled with WAL + `busy_timeout` + a single\nwrite connection per process, with every write in one immediate transaction.**\nD-11 names this as an explicit T1 concern; this is the conventional answer and\nis asserted under `-race` rather than assumed.","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":22,"rel":[]},{"id":"A3","type":"assumption","title":"Mail ids are ULIDs, sender-generated","body":"[ ] **Mail ids are ULIDs, sender-generated**, per the epic's ER diagram and the\ncross-host merge argument in the backlog (§3). Subscription ids follow the\n`sub_<ULID-prefix>` shape C1 shows. They are identifiers, **not an ordering\nthe store relies on**: cursors and every \"after this point\" comparison use the\nlog's own append sequence, because ULID monotonicity is process-local and\nevery `auto mail` verb is a separate process (D-11).","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":23,"rel":[]},{"id":"A4","type":"assumption","title":"The body is a JSON object","body":"[ ] **The body is a JSON object**, and `--message <text>` is sugar for\n`{\"message\": \"<text>\"}` — matching C1's `body: { \"message\": … }`. A future\n`kind` vocabulary and the open `attributes` map are additive fields on the\nenvelope.","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":24,"rel":[]},{"id":"A5","type":"assumption","title":"`auto mail list` with no filters returns every unacked delivery for every subscription the caller is bound to","body":"[ ] **`auto mail list` with no filters returns every unacked delivery for every\nsubscription the caller is bound to**, per the project convention that\nlist commands return all items when no filters are given. `--address` scopes it\nto one subscription.","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":25,"rel":[]},{"id":"A6","type":"assumption","title":"The sender's `from` address is resolved by a three-rung ladder","body":"[ ] **The sender's `from` address is resolved by a three-rung ladder**, because\na plain `auto mail send` process sees neither the hook payload's `agent` nor a\n`session_id`, and `config.ProjectRef` carries no agent name: (1) an explicit\n`--from <address>`; (2) the address of a subscription bound to the caller's\n`(manager, target)` — lowest subscription id when there is more than one, so it\nis deterministic; (3) the literal `<projectId>/agent`, with `projectId` from the\nproject registry, or `unregistered/agent` when the cwd is not a registered\nproject. C1's `auto-stack/reviewer` is rung 2 — the sender had subscribed to its\nown reply address first, which is also how it becomes reachable for a reply. The\nresult is always a resolved absolute address, never a relative handle (G5).","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":26,"rel":[]},{"id":"A7","type":"assumption","title":"`--text` output mode is not built in T1","body":"[ ] **`--text` output mode is not built in T1.** JSON is the default and the\nonly mode; the consumers in T1 are agents and the harness. It arrives with T4's\nadoption surface if a human ever needs it.","tab":"Requirements","origin":"plan","meta":{"parent":"S:open-questions"},"order":27,"rel":[]},{"id":"S:test-strategy","type":"section","title":"Test Strategy","summary":"Conformance-test driven: the guard rails are written as executable expectations first, and the harness scenario is the verdict.","body":"The epic sets the method and this task adopts it unchanged: **the work is\nconformance-test driven** — for each capability the executable expectation is\nwritten before the implementation, and **the guard rails are the source of those\nexpectations**. Most of them (explicit ack, at-least-once, immutability, ack\nwinning exactly once, addresses free of physical identity) are stated as\ncheckable properties precisely so they can be asserted rather than believed.\n\n**The harness is the oracle (G15).** `harness/scenarios/mail-flow/` runs the real\n`auto` binary in a container and drives the C1 loop. Everything below it is\nsupporting evidence, not the verdict. A capability that cannot be demonstrated\nthere is not finished — and the scenario is stood up **first**, so T2–T4 develop\nagainst a working oracle instead of one that arrives at the end.\n\nFive layers, each with a distinct job:\n\n1. **Package tests (`auto-mail/internal/...`)** — the store, the projection,\n   address validation, cursor backfill, the envelope, the pending flag. Table\n   driven, against a temp `HOME`. This is where immutability and the\n   `(subscription, mail)` keying are pinned.\n2. **The `mail.Client` conformance suite (`auto-mail/conformance/`)** — one suite\n   written against the *interface*, following `auto-shared/rpc/conformance/`. Run\n   against the direct-store implementation now; T3's RPC implementation becomes a\n   second target rather than a redesign (D-062-5). The suite owns the\n   call-site-visible contracts: explicit ack, `wonTransition`, backfill-on-\n   subscribe, send-with-no-subscription.\n3. **Race tests (`-race`)** — `auto-mail` joins `RACE_PROJECTS` in the Makefile\n   alongside `auto-shared` and `auto-watch`. Two properties: N goroutines acking\n   one delivery yield exactly one `wonTransition:true` (G13), and N concurrent\n   processes writing the store never lose an event or corrupt the projection\n   (the concurrent-writer discipline D-11 makes a T1 concern).\n4. **CLI + hook integration tests** — the cobra commands end to end against a\n   temp `HOME`, asserting the exact C1 payload shapes; and `auto hooks fire`\n   asserting the `hookSpecificOutput.additionalContext` envelope, the\n   single-emission discipline, and the stat-only no-mail path.\n5. **The `mail-flow` harness scenario** — two agents on one host, the C1 loop,\n   the nudge, and the ack, against the real binary in a container.\n\n**Two disciplines carried over from `harness/CLAUDE.md`**, both load-bearing:\nassert the observable outcome with **bounded retry**, never poll-to-settle; and\ntreat a **missing product seam as a finding to raise**, never as something to\npatch around inside the scenario. One nuance from the epic: `event-flow` matches\non presence rather than counts because the bus is lossy — mail promises\nat-least-once so its assertions can be stronger, but they must still tolerate\nduplicates, because G4 permits them.\n\n**Two properties need a test shape that is easy to get wrong**, so they are\ncalled out here:\n\n- **G8 (stat cost)** cannot be asserted with a stopwatch — a timing assertion is\n  a flake generator. It is asserted structurally instead, two ways: a package\n  test injects a counting store-opener (the repo's existing\n  `hooks.tmuxRunner` package-var stubbing pattern) and asserts **zero opens**\n  when the pending flag is absent; and the harness asserts that firing hooks on a\n  host that never ran `auto mail init` **does not create the store file** —\n  observable, deterministic, and impossible to satisfy by accident.\n- **G11 (nothing outside the mail package reads the store)** is asserted by a\n  repo-wide test that greps every module for the store filename and for\n  `modernc.org/sqlite` imports outside `auto-mail/internal/mail`, failing with\n  the offending path. A convention that is not executable is a comment.","tab":"Verification","origin":"plan","meta":{"children":[],"anchor":"test-strategy"},"order":28,"rel":[]},{"id":"S:coverage-map","type":"section","title":"Coverage Map","summary":"","body":"","tab":"Verification","origin":"plan","meta":{"children":["M1"],"anchor":"coverage-map"},"order":29,"rel":[]},{"id":"M1","type":"diagram","title":"What each layer proves, and which rails it carries","body":"","tab":"Verification","origin":"plan","meta":{"code":"flowchart TB\n  subgraph L5[\"harness/scenarios/mail-flow — THE VERDICT\"]\n    H1[\"C1 loop end to end<br/>subscribe → send → list → ack → list\"]\n    H2[\"in-band nudge<br/>auto hooks fire emits additionalContext\"]\n    H3[\"no-mail hook never creates the store\"]\n    H4[\"send with no subscription persists<br/>later subscriber sees it\"]\n  end\n  subgraph L4[\"CLI + hook integration (auto-mail, auto-cli)\"]\n    C1[\"exact C1 JSON payload shapes\"]\n    C2[\"single stdout emission, PostToolUse only\"]\n    C3[\"hook exits 0 with a corrupt/absent store\"]\n  end\n  subgraph L3[\"race (-race, RACE_PROJECTS)\"]\n    R1[\"N acks → exactly one wonTransition\"]\n    R2[\"N writer processes → no lost events\"]\n  end\n  subgraph L2[\"conformance suite (auto-mail/conformance)\"]\n    F1[\"explicit ack; list does not retire\"]\n    F2[\"backfill from cursor on subscribe\"]\n    F3[\"subscriptions vs bound counts\"]\n  end\n  subgraph L1[\"package tests (internal/mail)\"]\n    U1[\"append-only log; no UPDATE on events\"]\n    U2[\"deliveries keyed by (subscription, mail)\"]\n    U3[\"free-form addresses; separator allowed\"]\n    U4[\"pending flag: zero store opens when absent\"]\n  end\n  L1 --> L2 --> L3 --> L4 --> L5\n  L5 --> V[\"G15: done\"]"},"order":30,"rel":[]},{"id":"S:acceptance-criteria","type":"section","title":"Acceptance Criteria","summary":"Thirteen criteria: one per inherited guard rail, plus the C1 transcript and the harness scenario itself.","body":"Each criterion names the rail it discharges. The mapping is deliberately\none-to-one so a rail cannot be quietly dropped.","tab":"Verification","origin":"plan","meta":{"children":["AC-1","AC-2","AC-3","AC-4","AC-5","AC-6","AC-7","AC-8","AC-9","AC-10","AC-11","AC-12","AC-13"],"anchor":"acceptance-criteria"},"order":31,"rel":[]},{"id":"AC-1","type":"ac","title":"G16 — the ontology lands before the code that uses it","body":"- **Given** `docs/concepts/UBIQUITOUS_LANGUAGE.md` with no mail vocabulary\n- **When** the glossary is updated as the task's first change, before any Go file\n  is written\n- **Then** it defines **Mail**, **Address**, **Subscription**, **Delivery** and\n  **Binding**, each with a definition and an `_Avoid_` line, and the `_Has_`\n  relations (Address→Subscription, Subscription→Delivery, Subscription→Binding,\n  Mail→Delivery) resolve to defined terms\n- **And** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md` exits 0\n- **And** the generated ER block is refreshed by `glossary.py diagram … --write`,\n  not hand-edited\n- **And** `_Avoid_` for **Mail** lists *message* — and no schema table, event\n  type, Go identifier, CLI noun or JSON field in `auto-mail` is named `message`\n  for the stored unit (`--message` remains the *body* flag, which is the body's\n  own field name, not the entity)\n- **And** the frontmatter `summary` names the five new terms and\n  `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md` leaves the freshness\n  check green","tab":"Verification","origin":"plan","meta":{"phases":"1","tests":"auto-mail/mail/mail_test.go"},"order":32,"rel":[{"to":"P1","label":"delivered in"},{"to":"auto-mail/mail/mail_test.go","label":"tested by"}]},{"id":"AC-2","type":"ac","title":"C1 — the epic's transcript runs verbatim","body":"- **Given** an initialised store and two agent workspaces on one host\n- **When** the four commands of C1 are run in order\n- **Then** each emits the documented JSON payload on **stdout only**:\n  - `subscribe <address>` → `{\"address\":…, \"subscription\":\"sub_…\", \"backfilled\":N}`\n  - `send --to <address> --message <text>` → `{\"id\":\"<ULID>\", \"to\":…, \"subscriptions\":N, \"bound\":N}`\n  - `list` → an array of `{\"id\",\"from\",\"sentAt\",\"body\":{…}}`\n  - `ack <id>` → `{\"id\":…, \"acked\":true, \"wonTransition\":true}`\n  - `list` again → `[]`\n- **And** every payload parses as JSON with no diagnostic text mixed in\n  (diagnostics go to stderr)\n- **And** the ULID in `send`'s `id` is the same id `list` returns and `ack` accepts\n- **And** the `from` field is resolved by the documented three-rung ladder, each\n  rung asserted: `--from` wins; with no flag but a subscription bound to the\n  caller, `from` is that subscription's address (C1's case — which is why the\n  harness has the sender subscribe first); with neither, `from` is\n  `<projectId>/agent`, or `unregistered/agent` outside a registered project","tab":"Verification","origin":"plan","meta":{"phases":"1,2","tests":"auto-mail/internal/cli/cli_test.go,harness/tests/mail_flow/test_mail_loop.py"},"order":33,"rel":[{"to":"P1","label":"delivered in"},{"to":"P2","label":"delivered in"},{"to":"auto-mail/internal/cli/cli_test.go","label":"tested by"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"tested by"}]},{"id":"TH3","type":"thread","title":"Default `from` address is not derivable today","tab":"Verification","origin":"plan","meta":{"anchor":"AC-2","status":"resolved","priority":"p1","comments":[{"by":"review","md":"C1 omits `--from`, but the expected list payload includes `\"from\": \"auto-stack/reviewer\"`. The assumptions and Phase 2 say the fallback is derived from `<project>/<agent>` or `<projectId>/agent` via the registry. Checked `auto-shared/config/projects.go:20-31`: `ProjectRef` stores ID, Path, Remote, Name, Tools, and RegisteredAt, but no agent name. A normal `auto mail send` CLI process also does not receive the hook payload's `agent` or `session_id`, and T2 explicitly defers self-identification. Define the T1 source of `from` before implementation: require `--from` in C1/harness, use a documented env var, use a literal fallback such as `<project>/agent`, or add a subscribe-before-send identity path, then cover that exact behavior in AC-2."},{"by":"author","md":"Correct, and the evidence is right — `config.ProjectRef` carries no agent name, and a plain `auto mail send` sees neither the hook payload's `agent` nor a `session_id`; self-identification is exactly what D-13 defers to T2, so T1 must not depend on it. Resolved by defining an explicit three-rung ladder rather than leaving it to the implementer: (1) `--from <address>`; (2) the address of a subscription bound to the caller's `(manager, target)`, lowest subscription id when several so it is deterministic; (3) the literal `<projectId>/agent` from the registry, or `unregistered/agent` outside a registered project. C1's `auto-stack/reviewer` is rung 2 — the sender subscribed to its own reply address first, which is also what makes it reachable for a reply. AC-2 now asserts all three rungs, and the harness scenario has the sender subscribe first so C1's shape is the shape actually exercised."}]},"body":"","order":34,"rel":[{"to":"AC-2","label":"anchored on"}]},{"id":"AC-3","type":"ac","title":"G1 — mail and events are immutable","body":"- **Given** a mail row and its `alpha.mail.sent` event\n- **When** the mail is listed and then acked\n- **Then** the `mail` row and every previously-appended event row are **byte\n  identical** before and after (asserted by comparing full row snapshots)\n- **And** the state change appears as a **new appended event**\n  (`alpha.mail.acked`), never as a rewrite\n- **And** the event log's insert path is the only write path to that table: a\n  test asserts no `UPDATE` or `DELETE` statement targets `events` anywhere in the\n  package (source-level check plus a SQLite trigger that raises on either)","tab":"Verification","origin":"plan","meta":{"phases":"2,5","tests":"auto-mail/internal/store/store_test.go"},"order":35,"rel":[{"to":"P2","label":"delivered in"},{"to":"P5","label":"delivered in"},{"to":"auto-mail/internal/store/store_test.go","label":"tested by"}]},{"id":"AC-4","type":"ac","title":"G2 / D-10 — consumer state lives in a deliveries join, materialised lazily from a cursor","body":"- **Given** the schema\n- **Then** `read_at` and `acked_at` exist **only** on `deliveries`, keyed by\n  `(subscription_id, mail_id)`, and **no** consumer-state column exists on `mail`\n- **Given** mail sent to an address with **no** subscription\n- **When** a subscription is created afterwards with the default cursor\n- **Then** `list` returns that earlier mail and `subscribe` reports\n  `backfilled: 1` (the J2 requirement D-10 exists to satisfy)\n- **And** when the subscription is created with `--from-now`, `list` returns `[]`\n  and `backfilled: 0`\n- **And** two subscriptions on one address each get their **own** delivery row\n  and their own ack state — acking one leaves the other unacked (broadcast, D-7)\n- **And** `send` writes **no** `deliveries` rows: they are materialised on the\n  read path, against the cursor, and nowhere else. Eager materialisation is the\n  thing D-10 rules out — it is what makes a late subscriber unable to receive\n  earlier mail, and a second write path to rows the reader already owns\n- **And** \"from now\" is a position in the log — the store's own high-water mark\n  taken under the same write lock — never a comparison of two ids minted by\n  different processes (D-11)","tab":"Verification","origin":"plan","meta":{"phases":"2,4","tests":"auto-mail/internal/store/store_test.go,auto-mail/conformance/conformance_test.go"},"order":36,"rel":[{"to":"P2","label":"delivered in"},{"to":"P4","label":"delivered in"},{"to":"auto-mail/internal/store/store_test.go","label":"tested by"},{"to":"auto-mail/conformance/conformance_test.go","label":"tested by"}]},{"id":"TH4","type":"thread","title":"Cursor flag spelling is inconsistent","tab":"Verification","origin":"plan","meta":{"anchor":"AC-4","status":"resolved","priority":"p2","comments":[{"by":"review","md":"AC-4 says the opt-out cursor case is created with `--from now`, but the command surface, file-change tree, and Phase 4 all use `--from-now`. Cobra will only accept `--from now` if a separate `--from` flag is implemented, which the plan does not list. Pick one spelling and make the acceptance criterion, CLI examples, and tests agree; if the intended surface is the flat boolean flag, AC-4 should name `--from-now`."},{"by":"author","md":"Correct — a typo in AC-4, not a second flag. Every other surface (the command transcript, the file-change tree, Phase 4) says `--from-now`, which is the intended boolean flag; AC-4 now says the same. No `--from` flag exists on `subscribe`."}]},"body":"","order":37,"rel":[{"to":"AC-4","label":"anchored on"}]},{"id":"AC-5","type":"ac","title":"G3 — ack is a separate explicit call; reading does not retire","body":"- **Given** one unacked mail\n- **When** `auto mail list` is run twice with no `ack` between them\n- **Then** the mail is returned **both** times\n- **And** no `alpha.mail.acked` event is appended by `list`\n- **And** after `auto mail ack <id>`, `list` returns `[]`\n- **And** there is no flag on `list` that acks (checked against the command's\n  flag set), so the call cannot be conflated by a caller","tab":"Verification","origin":"plan","meta":{"phases":"2,4","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go"},"order":38,"rel":[{"to":"P2","label":"delivered in"},{"to":"P4","label":"delivered in"},{"to":"auto-mail/conformance/conformance_test.go","label":"tested by"},{"to":"auto-mail/internal/cli/cli_test.go","label":"tested by"}]},{"id":"AC-6","type":"ac","title":"G13 / D-7 — ack transitions exactly once and reports whether it won","body":"- **Given** one delivery row and N=16 goroutines calling `Ack` on it concurrently\n  under `-race`\n- **When** they all complete\n- **Then** exactly **one** returns `wonTransition: true` and the other fifteen\n  return `wonTransition: false`\n- **And** exactly **one** `alpha.mail.acked` event exists for that delivery\n- **And** every caller — winner and losers — sees `acked: true` and exit code 0,\n  with the losers additionally told on stderr (D-062-7)\n- **And** acking an unknown id, or an id the caller has no delivery row for,\n  exits non-zero with a remediation hint","tab":"Verification","origin":"plan","meta":{"phases":"2,5","tests":"auto-mail/internal/store/store_test.go,auto-mail/internal/cli/cli_test.go"},"order":39,"rel":[{"to":"P2","label":"delivered in"},{"to":"P5","label":"delivered in"},{"to":"auto-mail/internal/store/store_test.go","label":"tested by"},{"to":"auto-mail/internal/cli/cli_test.go","label":"tested by"}]},{"id":"AC-7","type":"ac","title":"G4 — at-least-once and unordered, as documented","body":"- **Given** `auto mail docs` and the package `CLAUDE.md`\n- **Then** both state the delivery contract in as many words: **at-least-once,\n  unordered, consumers must be idempotent on mail id** — and neither promises\n  exactly-once or ordering\n- **And** `ack` on an already-acked delivery is idempotent: it succeeds, appends\n  no second event, and returns `wonTransition: false`\n- **And** a caller that sees the same mail id twice — simulated at the **client\n  boundary** (a `Client` decorator that repeats one entry in the `List` result),\n  never by inserting a second `deliveries` row, which the\n  `(subscription_id, mail_id)` primary key correctly forbids — still resolves to\n  exactly one transition when it acks both times\n- **And** no test asserts ordering, so nothing in the suite encodes the accidental\n  guarantee the store happens to provide","tab":"Verification","origin":"plan","meta":{"phases":"4,5","tests":"auto-mail/conformance/conformance_test.go,auto-mail/internal/cli/cli_test.go"},"order":40,"rel":[{"to":"P4","label":"delivered in"},{"to":"P5","label":"delivered in"},{"to":"auto-mail/conformance/conformance_test.go","label":"tested by"},{"to":"auto-mail/internal/cli/cli_test.go","label":"tested by"}]},{"id":"TH5","type":"thread","title":"Duplicate delivery-row test contradicts the delivery key","tab":"Verification","origin":"plan","meta":{"anchor":"AC-7","status":"resolved","priority":"p2","comments":[{"by":"review","md":"AC-7 says duplicate delivery handling is simulated by injecting a duplicate delivery row, but AC-4 and the schema require `deliveries` to be keyed by `(subscription_id, mail_id)`. A duplicate row for the same delivery should be rejected by the schema; a row for another subscription is broadcast fan-out, not a duplicate delivery. If the goal is to prove at-least-once/idempotent handling, simulate duplicate list output at the client/CLI boundary or use two distinct subscriptions deliberately. Do not require a persistent row shape the schema is supposed to forbid."},{"by":"author","md":"Accepted — asking a test to insert a row the `(subscription_id, mail_id)` primary key is supposed to forbid would have been asserting against the schema G2 requires. The intent was always the caller-facing half of G4, so the simulation moves to where duplicates can actually appear: a `Client` decorator that repeats one entry in the `List` result. AC-7 now states that explicitly, and says in as many words that a second `deliveries` row must not be used."}]},"body":"","order":41,"rel":[{"to":"AC-7","label":"anchored on"}]},{"id":"AC-8","type":"ac","title":"G5 / D-9 — addresses are virtual and free-form","body":"- **Given** address validation\n- **Then** `auto-web/bugs` is accepted — the separator `/` is explicitly\n  permitted and never normalised away — as are addresses with no separator at all\n- **And** validation rejects only the empty string, leading/trailing whitespace,\n  control characters and over-length values, each with a remediation message\n- **And** a stored envelope's `to` and `from` contain **no** host id, session id,\n  tmux pane id or NTM identifier: a test sends from a process with `TMUX`,\n  `TMUX_PANE` and `NTM_*` set and asserts none of those values appear anywhere in\n  the `mail` row\n- **And** that physical context is present **only** on the `bindings` row, as the\n  opaque `(manager, target)` pair — with no typed `tmux_pane_id` column (G12's\n  shape, adopted now so T3 adds a manager as data)","tab":"Verification","origin":"plan","meta":{"phases":"2,3","tests":"auto-mail/mail/mail_test.go,auto-mail/internal/store/store_test.go"},"order":42,"rel":[{"to":"P2","label":"delivered in"},{"to":"P3","label":"delivered in"},{"to":"auto-mail/mail/mail_test.go","label":"tested by"},{"to":"auto-mail/internal/store/store_test.go","label":"tested by"}]},{"id":"AC-9","type":"ac","title":"G6 — send with no subscription persists, and reports both counts","body":"- **Given** an address nobody has subscribed to\n- **When** `auto mail send --to <address> --message …` runs\n- **Then** it exits **0**, the mail is persisted, and the payload reports\n  `\"subscriptions\": 0, \"bound\": 0`\n- **And** stderr carries a hint that zero subscriptions is the likely-typo case\n  (the mitigation D-9 relies on for free-form addresses)\n- **Given** a subscription exists but has **no binding row** (in T1 `bound`\n  counts binding rows, not liveness — nothing refreshes `last_seen` until T3, per\n  D-062-2)\n- **Then** the payload reports `\"subscriptions\": 1, \"bound\": 0` — the two counts\n  are distinct and mean different things to a sender\n- **And** a later subscriber to that address receives the earlier mail (the J2\n  half that G6 and D-10 jointly guarantee)","tab":"Verification","origin":"plan","meta":{"phases":"4","tests":"auto-mail/conformance/conformance_test.go,harness/tests/mail_flow/test_mail_loop.py"},"order":43,"rel":[{"to":"P4","label":"delivered in"},{"to":"auto-mail/conformance/conformance_test.go","label":"tested by"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"tested by"}]},{"id":"AC-10","type":"ac","title":"G8 — the nudge is free when there is no mail, and can never break the hook","body":"- **Given** any state of the mailbox\n- **When** `auto hooks fire --agent claude` processes a PostToolUse payload\n- **Then** the mail check performs **zero** store opens on **either** path —\n  present flag or absent — asserted with a counting store-opener injected over\n  the package var, and stats at most one path\n- **And** on a host where `auto mail init` was never run, firing hooks **does not\n  create** `~/.auto/mail/alpha-store.db` (asserted in the harness — the\n  observable form of the same property)\n- **Given** pending mail\n- **Then** the hook emits exactly **one** `hookSpecificOutput` JSON object on\n  stdout whose `additionalContext` names `auto mail list`, on `PostToolUse`\n  events only — and when a hint rule also matches, both fragments ride that\n  single emission rather than producing two stdout writes\n- **And** with the store absent, unreadable, locked by another writer, or\n  corrupt, the hook still exits **0**, emits no malformed stdout, and completes\n  within a bounded timeout — the mail check can never stall or break the agent","tab":"Verification","origin":"plan","meta":{"phases":"3","tests":"auto-mail/mail/mail_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/tests/mail_flow/test_mail_loop.py"},"order":44,"rel":[{"to":"P3","label":"delivered in"},{"to":"auto-mail/mail/mail_test.go","label":"tested by"},{"to":"auto-cli/cmd/auto/hooksmail_test.go","label":"tested by"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"tested by"}]},{"id":"AC-11","type":"ac","title":"G10 / D-2 — alpha is in the type string and the filename, and reset works","body":"- **Given** the store\n- **Then** its path is `~/.auto/mail/alpha-store.db` — the marker is in the\n  **filename**, not only in docs\n- **And** every event type is `alpha.mail.*` — the T1 vocabulary is exactly\n  `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n  `alpha.mail.acked` — so no consumer can match a bare `mail.sent`. The\n  assertion is that every type emitted carries the `alpha.` prefix, and that\n  these four are the complete T1 set\n- **And** each stored envelope carries a `version` integer\n- **And** `auto mail reset` removes the store and reports what it removed; the\n  tool works normally afterwards, from an empty state\n- **And** `auto mail docs` states the alpha contract explicitly: no upcasters, no\n  migrations, no compatibility guarantee, the store may be wiped on upgrade","tab":"Verification","origin":"plan","meta":{"phases":"1,5","tests":"auto-mail/internal/cli/cli_test.go,auto-mail/internal/store/store_test.go"},"order":45,"rel":[{"to":"P1","label":"delivered in"},{"to":"P5","label":"delivered in"},{"to":"auto-mail/internal/cli/cli_test.go","label":"tested by"},{"to":"auto-mail/internal/store/store_test.go","label":"tested by"}]},
