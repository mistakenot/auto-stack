{"id":"TH6","type":"thread","title":"`alpha.mail.read` is omitted from the alpha event list","tab":"Verification","origin":"plan","meta":{"anchor":"AC-11","status":"resolved","priority":"p2","comments":[{"by":"review","md":"The Solution and Phase 2 define four event types, including `alpha.mail.read`, and the end-state schema says `read_at` is written in T1 so T3 has escalation history. AC-11's event-type list names only `alpha.mail.subscribed`, `alpha.mail.sent`, and `alpha.mail.acked`. If that list is treated as exhaustive, a correct read event will fail the acceptance test; if it is illustrative, the criterion is ambiguous. Include `alpha.mail.read` explicitly or state that the listed event types are examples."},{"by":"author","md":"Correct — the list was written before the decision to stamp `read_at` in T1 (taken so T3's escalation predicate has history to read) and was never updated. AC-11 now names the complete T1 vocabulary — `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — and states that the assertion is twofold: every emitted type carries the `alpha.` prefix, and these four are the complete set. No ambiguity about exhaustive versus illustrative is left."}]},"body":"","order":46,"rel":[{"to":"AC-11","label":"anchored on"}]},{"id":"AC-12","type":"ac","title":"G11 — nothing outside the mail package reads the store","body":"- **Given** the whole repository\n- **When** a guard test walks every module's Go source, the harness scenarios and\n  the `skills/` tree\n- **Then** nothing outside `auto-mail/internal/store` names the **mail store**:\n  the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, or a\n  `sqlite3` invocation against either. The guard is scoped to the *mail store*,\n  not to SQLite in general — `auto-watch/internal/store/store.go` and\n  `auto-search/internal/indexdb/schema.go` legitimately import\n  `modernc.org/sqlite` for their own stores, and a repo-wide import ban would fail\n  before this task began\n- **And** no package outside `auto-mail` imports `auto-mail/internal/...`; for the\n  mail store this is already impossible (Go rejects it at compile time), so the\n  test is a regression guard against the internal boundary being widened\n- **And** `auto-cli`'s hook path reaches mail only through the exported\n  `auto-mail/mail` package\n- **And** the failure message names the offending file and the remediation (\"go\n  through mail.Client\")","tab":"Verification","origin":"plan","meta":{"phases":"5","tests":"auto-mail/conformance/seam_test.go"},"order":47,"rel":[{"to":"P5","label":"delivered in"},{"to":"auto-mail/conformance/seam_test.go","label":"tested by"}]},{"id":"TH7","type":"thread","title":"SQLite import guard fails against existing modules","tab":"Verification","origin":"plan","meta":{"anchor":"AC-12","status":"resolved","priority":"p1","comments":[{"by":"review","md":"AC-12 says a repo-wide guard should fail on any `modernc.org/sqlite` import outside `auto-mail/internal/mail`; Phase 5 says outside `auto-mail/internal/store`. Both versions fail against the current repo before this task starts: `auto-watch/internal/store/store.go:15`, `auto-search/internal/indexdb/schema.go:9`, and `auto-search/internal/cochange/load.go:23` already import `modernc.org/sqlite`, and `auto-watch`/`auto-search` have direct v1.53.0 requirements in their `go.mod` files. The seam guard should target direct mail-store access instead: `alpha-store.db`, `~/.auto/mail`, `sqlite3` invocations against that path, and `auto-mail/internal/store` imports from outside the allowed mail packages. Also align the allowed path with the Solution, which uses `auto-mail/internal/store`, not `auto-mail/internal/mail`."},{"by":"author","md":"Correct, and this one would have failed on day zero — `auto-watch/internal/store/store.go` and `auto-search/internal/indexdb/schema.go` import `modernc.org/sqlite` for their own stores, entirely legitimately. The guard was aimed at the wrong thing: G11 is about the *mail store*, not about SQLite. AC-12 and Phase 5 are rewritten to target direct mail-store access — the `alpha-store.db` filename, an `~/.auto/mail` path opened as a database, a `sqlite3` invocation against either — plus an import guard on `auto-mail/internal/...` from outside the module. Both now say `auto-mail/internal/store`; the stale `internal/mail` path in AC-12 is gone. AC-12 also notes that the internal-import half is already a compile-time guarantee, so the test is a regression guard rather than the guarantee itself."}]},"body":"","order":48,"rel":[{"to":"AC-12","label":"anchored on"}]},{"id":"AC-13","type":"ac","title":"G15 — it passes end to end in the harness","body":"- **Given** `uv run harness mail-flow up` from `harness/`\n- **Then** the stack comes up with **one** container, one seeded host id, and two\n  registered project workspaces, and `check_ready()` gates fail-fast with a\n  diagnostic if the store is not initialised or a workspace is not registered\n- **When** `uv run pytest tests/mail_flow -v` runs\n- **Then** the full C1 loop passes against the **real `auto` binary built from\n  monorepo source**: agent B subscribes, agent A sends, agent B's hook fire emits\n  the nudge, `list` shows the mail, `ack` reports `wonTransition: true`, and the\n  second `list` is empty\n- **And** the send-before-subscribe case passes (AC-9's J2 half)\n- **And** every assertion uses bounded retry on the observable outcome, with no\n  `sleep`-to-settle and no assertion on counts that duplicates would break\n- **And** the scenario is registered in `harness/src/harness/cli.py`'s `SCENARIOS`\n  and adding it changed no existing scenario\n- **And** `make check` and `make test` are green from the repo root, with\n  `make test-race` green for the new `auto-mail` entry in `RACE_PROJECTS`","tab":"Verification","origin":"plan","meta":{"phases":"1,2,3,4,5","tests":"harness/tests/mail_flow/test_mail_loop.py"},"order":49,"rel":[{"to":"P1","label":"delivered in"},{"to":"P2","label":"delivered in"},{"to":"P3","label":"delivered in"},{"to":"P4","label":"delivered in"},{"to":"P5","label":"delivered in"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"tested by"}]},{"id":"S:verification-gaps","type":"section","title":"Known Gaps & Risks","summary":"","body":"Stated rather than hidden. None of these blocks T1; each names who closes it.","tab":"Verification","origin":"plan","meta":{"children":["R1","R2","R3","R4","R5","R6","R7"],"anchor":"verification-gaps"},"order":50,"rel":[{"to":"R1","label":"contains"},{"to":"R2","label":"contains"},{"to":"R3","label":"contains"},{"to":"R4","label":"contains"},{"to":"R5","label":"contains"},{"to":"R6","label":"contains"},{"to":"R7","label":"contains"}]},{"id":"R1","type":"risk","title":"The `mail.Client` seam has one implementation","body":"**The `mail.Client` seam has one implementation.** Seam 1 warns that an\nabstraction with one implementation is a guess. The conformance suite is the\nmitigation (D-062-5), but the seam is not *proven* until T3's RPC\nimplementation runs against the same suite. Risk accepted: the alternative —\ndragging the daemon into the walking skeleton — is the thing D-11 exists to\nprevent.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":51,"rel":[]},{"id":"R2","type":"risk","title":"The `cwd` rung of the binding ladder is weak on this host","body":"**The `cwd` rung of the binding ladder is weak on this host.** Every pane here\nshares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\nrogue-agent.md`), so two agents in the same worktree with no tmux would collide\non one binding. T1 tests the tmux rung and the cwd rung separately and\ndocuments the collision; T3 replaces the fallback for panes. It does not affect\nthe harness, where each agent has its own workspace.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":52,"rel":[]},{"id":"R3","type":"risk","title":"The pending flag is a second source of truth","body":"**The pending flag is a second source of truth.** Deliberately a *hint*\n(D-062-3): a false positive costs one store open, a false negative is healed by\nthe next send and, from T3, by the reconcile tick. Both directions are tested,\nbut a flag that drifts and stays drifted until the next send is a real (bounded)\nlatency hazard with no daemon running.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":53,"rel":[]},{"id":"R4","type":"risk","title":"Escalation is untestable here, because it does not exist yet","body":"**Escalation is untestable here, because it does not exist yet.** G9, G12, G14\nand D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\nworking. An agent that is idle receives nothing in T1 — by design, and stated in\n`auto mail docs` so nobody builds on a guarantee that is not there.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":54,"rel":[]},{"id":"R5","type":"risk","title":"No cross-host coverage","body":"**No cross-host coverage.** Single host is the MVP. The scenario's\none-container topology is the control the multi-host case will later be\ncompared against.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":55,"rel":[]},{"id":"R6","type":"risk","title":"The harness is not in CI","body":"**The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\nso the G15 oracle runs locally and on demand. That is a pre-existing gap this\ntask inherits rather than creates; the package, conformance and race tests do\nrun in `make test`.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":56,"rel":[]},{"id":"R7","type":"risk","title":"No load or volume testing","body":"**No load or volume testing.** Alpha volumes are a few hundred rows a day\n(D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10).","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":57,"rel":[]},{"id":"S:approach","type":"section","title":"Approach","summary":"A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle.","body":"Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built.","tab":"Solution","origin":"plan","meta":{"children":["D-062-8","D-062-9"],"anchor":"approach"},"order":58,"rel":[]},{"id":"D-062-8","type":"decision","title":"One exported package, `auto-mail/mail`; the store stays internal","summary":"Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint.","body":"**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence.","tab":"Solution","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":59,"rel":[]},{"id":"TH8","type":"thread","title":"`rootcmd` is a second exported package","tab":"Solution","origin":"plan","meta":{"anchor":"D-062-8","status":"resolved","priority":"p2","comments":[{"by":"review","md":"D-062-8 says the public surface is exactly one package, `auto-mail/mail`, and that everything else stays under `internal/`. The file-change tree also adds `auto-mail/rootcmd/rootcmd.go`, and `auto-cli/cmd/auto/main.go` must import that package to mount `auto mail`, matching every existing tool's pattern. Clarify that the invariant is \"one exported domain/client API plus the required `rootcmd` mounting facade\"; otherwise an implementer could either hide `rootcmd` under `internal/` and break mounting, or write a seam guard that incorrectly treats the facade as a violation."},{"by":"author","md":"Fair, and the wording was genuinely misleading — an implementer following it literally would either have hidden `rootcmd` under `internal/` and broken mounting, or written a guard that flagged the façade. D-062-8 now states the invariant as \"one exported **domain** API (`auto-mail/mail`) plus the mandatory `rootcmd` mounting façade\", and records that the façade holds no domain logic and never touches the store — a wiring surface, not an API. The seam guard in Phase 5 is scoped accordingly."}]},"body":"","order":60,"rel":[{"to":"D-062-8","label":"anchored on"}]},{"id":"D-062-9","type":"decision","title":"The hook writes one hookSpecificOutput object, carrying every fragment","summary":"The existing hint path already emits at most one object per event; a second producer must join it, not write a second line.","body":"**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge.","tab":"Solution","origin":"plan","meta":{"status":"accepted","by":"agent"},"order":61,"rel":[]},{"id":"S:end-state-flow","type":"section","title":"How one message travels","summary":"Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions.","body":"","tab":"Solution","origin":"plan","meta":{"children":["M2"],"anchor":"end-state-flow"},"order":62,"rel":[]},{"id":"M2","type":"diagram","title":"The T1 path — no daemon anywhere in it","body":"","tab":"Solution","origin":"plan","meta":{"code":"sequenceDiagram\n  participant A as agent A (auto mail send)\n  participant M as mail.Client (direct)\n  participant DB as alpha-store.db\n  participant FL as alpha-flags/\n  participant HK as agent B hook (auto hooks fire)\n  participant B as agent B (auto mail list/ack)\n\n  B->>M: Subscribe(\"auto-web/bugs\")\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.subscribed;<br/>insert subscription + binding(manager,target); COMMIT\n  A->>M: Send(to, body)\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.sent;<br/>insert mail; insert deliveries for bound subs; COMMIT\n  M->>FL: touch flag(sha8(manager,target))\n  M-->>A: {id, to, subscriptions:1, bound:1}\n  HK->>FL: stat one path (no DB open)\n  HK-->>B: hookSpecificOutput.additionalContext (fixed text)\n  B->>M: List()\n  M->>DB: materialise deliveries from cursor;<br/>append alpha.mail.read (first read only)\n  M-->>B: [ {id, from, sentAt, body} ]\n  B->>M: Ack(id)\n  M->>DB: BEGIN IMMEDIATE;<br/>UPDATE deliveries SET acked_at=? WHERE acked_at IS NULL;<br/>append alpha.mail.acked; COMMIT\n  M->>FL: rm flag if nothing unacked remains\n  M-->>B: {id, acked:true, wonTransition:true}"},"order":63,"rel":[]},{"id":"S:end-state-schema","type":"section","title":"The store at the end of this task","summary":"","body":"Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against.","tab":"Solution","origin":"plan","meta":{"children":["M3"],"anchor":"end-state-schema"},"order":64,"rel":[]},{"id":"M3","type":"diagram","title":"events is the authority; mail is immutable; deliveries and bindings are projections","body":"","tab":"Solution","origin":"plan","meta":{"code":"erDiagram\n  MAIL ||--o{ DELIVERY : \"copied to\"\n  SUBSCRIPTION ||--o{ DELIVERY : \"owns state of\"\n  ADDRESS ||--o{ SUBSCRIPTION : \"bound by\"\n  SUBSCRIPTION ||--o| BINDING : \"currently held by\"\n  EVENT {\n    int seq\n    ulid id\n    string type\n    int version\n    time occurred_at\n    json payload\n  }\n  MAIL {\n    ulid id\n    int seq\n    string to_address\n    json envelope\n    json body\n    time sent_at\n  }\n  SUBSCRIPTION {\n    string id\n    int seq\n    string address\n    string name\n    int from_cursor\n    time created_at\n  }\n  DELIVERY {\n    string subscription_id\n    ulid mail_id\n    time first_seen_at\n    time read_at\n    time acked_at\n    string acked_by\n  }\n  BINDING {\n    string subscription_id\n    string manager\n    string target\n    string session\n    time last_seen\n  }"},"order":65,"rel":[]},{"id":"S:end-state-api","type":"section","title":"The client seam","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["mail.Client","package mail — free functions and types"],"anchor":"end-state-api"},"order":66,"rel":[]},{"id":"mail.Client","type":"api","title":"mail.Client","summary":"The only API. CLI, hook, daemon and every future auto-* tool go through it.","body":"","tab":"Solution","origin":"plan","meta":{"kind":"api","lang":"go","path":"auto-mail/mail/client.go","members":[{"kind":"method","sig":"Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)","doc":"Creates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled."},{"kind":"method","sig":"Send(ctx context.Context, in SendInput) (SendResult, error)","doc":"Appends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6)."},{"kind":"method","sig":"List(ctx context.Context, in ListInput) ([]Delivery, error)","doc":"Materialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3)."},{"kind":"method","sig":"Ack(ctx context.Context, in AckInput) (AckResult, error)","doc":"Compare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13)."},{"kind":"method","sig":"Reset(ctx context.Context) (ResetResult, error)","doc":"Removes the store and the flag directory. A supported operation, because alpha (G10)."},{"kind":"method","sig":"Close() error","doc":"Releases the store handle."}]},"order":67,"rel":[{"to":"auto-mail/mail/client.go","label":"lives in"}]},{"id":"sym:Subscribe","type":"symbol","title":"Subscribe","body":"Creates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled.","tab":"Solution","origin":"plan","meta":{"sig":"Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":68},{"id":"sym:Send","type":"symbol","title":"Send","body":"Appends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6).","tab":"Solution","origin":"plan","meta":{"sig":"Send(ctx context.Context, in SendInput) (SendResult, error)","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":69},{"id":"sym:List","type":"symbol","title":"List","body":"Materialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3).","tab":"Solution","origin":"plan","meta":{"sig":"List(ctx context.Context, in ListInput) ([]Delivery, error)","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":70},{"id":"sym:Ack","type":"symbol","title":"Ack","body":"Compare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13).","tab":"Solution","origin":"plan","meta":{"sig":"Ack(ctx context.Context, in AckInput) (AckResult, error)","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":71},{"id":"sym:Reset","type":"symbol","title":"Reset","body":"Removes the store and the flag directory. A supported operation, because alpha (G10).","tab":"Solution","origin":"plan","meta":{"sig":"Reset(ctx context.Context) (ResetResult, error)","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":72},{"id":"sym:Close","type":"symbol","title":"Close","body":"Releases the store handle.","tab":"Solution","origin":"plan","meta":{"sig":"Close() error","kind":"method","module":"mail.Client"},"rel":[{"to":"mail.Client","label":"member of"}],"order":73},{"id":"package mail — free functions and types","type":"api","title":"package mail — free functions and types","summary":"Deliberately not methods: the nudge must not require a client, because constructing one would open the store.","body":"","tab":"Solution","origin":"plan","meta":{"kind":"api","lang":"go","path":"auto-mail/mail/pending.go","members":[{"kind":"function","sig":"NewDirect(home string) (Client, error)","doc":"The direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process."},{"kind":"function","sig":"HasPending(home string, b Binding) bool","doc":"Stats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8)."},{"kind":"function","sig":"NudgeText() string","doc":"The fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too)."},{"kind":"function","sig":"BindingFor(cwd string) Binding","doc":"Derives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2)."},{"kind":"function","sig":"ValidateAddress(s string) error","doc":"Permissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable."},{"kind":"type","sig":"type Binding struct { Manager, Target, Session string }","doc":"The opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5)."}]},"order":74,"rel":[{"to":"auto-mail/mail/pending.go","label":"lives in"}]},{"id":"sym:NewDirect","type":"symbol","title":"NewDirect","body":"The direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process.","tab":"Solution","origin":"plan","meta":{"sig":"NewDirect(home string) (Client, error)","kind":"function","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":75},{"id":"sym:HasPending","type":"symbol","title":"HasPending","body":"Stats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8).","tab":"Solution","origin":"plan","meta":{"sig":"HasPending(home string, b Binding) bool","kind":"function","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":76},{"id":"sym:NudgeText","type":"symbol","title":"NudgeText","body":"The fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too).","tab":"Solution","origin":"plan","meta":{"sig":"NudgeText() string","kind":"function","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":77},{"id":"sym:BindingFor","type":"symbol","title":"BindingFor","body":"Derives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2).","tab":"Solution","origin":"plan","meta":{"sig":"BindingFor(cwd string) Binding","kind":"function","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":78},{"id":"sym:ValidateAddress","type":"symbol","title":"ValidateAddress","body":"Permissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable.","tab":"Solution","origin":"plan","meta":{"sig":"ValidateAddress(s string) error","kind":"function","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":79},{"id":"sym:Binding","type":"symbol","title":"Binding","body":"The opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5).","tab":"Solution","origin":"plan","meta":{"sig":"type Binding struct { Manager, Target, Session string }","kind":"type","module":"package mail — free functions and types"},"rel":[{"to":"package mail — free functions and types","label":"member of"}],"order":80},{"id":"S:end-state-cli","type":"section","title":"The command surface at the end of this task","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["CLI2"],"anchor":"end-state-cli"},"order":81,"rel":[]},{"id":"CLI2","type":"transcript","title":"zsh — the full auto mail surface after T1","summary":"C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4).","body":"","tab":"Solution","origin":"plan","meta":{"steps":[{"note":"creates ~/.auto/mail/ and the alpha store","status":"done","cmd":"auto mail init","out":"{ \"store\": \"/home/u/.auto/mail/alpha-store.db\", \"created\": true, \"alpha\": true }"},{"note":"the full command reference, including the alpha contract","status":"done","cmd":"auto mail docs","out":""},{"note":"opt to start from now instead of the backlog (D-10)","status":"done","cmd":"auto mail subscribe auto-web/bugs --from-now","out":"{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"},{"note":"nobody has subscribed — still exits 0, still persists (G6)","status":"done","cmd":"auto mail send --to auto-web/typo --message \"hello?\"","out":"{ \"id\": \"01K9X2R0000000000\", \"to\": \"auto-web/typo\", \"subscriptions\": 0, \"bound\": 0 }\n# stderr: no subscription exists for \"auto-web/typo\" — mail is persisted and a later\n# subscriber will receive it, but check the address for a typo."},{"note":"scope to one subscription; no filters returns everything bound to you","status":"done","cmd":"auto mail list --address auto-web/bugs","out":""},{"note":"a second acker is told it lost, and still exits 0 (D-062-7)","status":"done","cmd":"auto mail ack 01K9X2QF7M3B0V8N","out":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": false }\n# stderr: already acked at 2026-08-25T10:15:40Z by sub_01K9X2M4"},{"note":"alpha means reset is supported, not a workaround (G10)","status":"done","cmd":"auto mail reset --yes","out":"{ \"removed\": [\"/home/u/.auto/mail/alpha-store.db\", \"/home/u/.auto/mail/alpha-flags\"] }"}]},"order":82,"rel":[]},{"id":"S:file-changes","type":"section","title":"File Changes","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/subscribe.go","auto-mail/internal/cli/send.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/ack.go","auto-mail/internal/cli/reset.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/address.go","auto-mail/mail/binding.go","auto-mail/mail/pending.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-mail/internal/store/events.go","auto-mail/internal/store/project.go","auto-mail/internal/store/store_test.go","auto-mail/internal/ulid/ulid.go","auto-mail/conformance/conformance.go","auto-mail/conformance/conformance_test.go","auto-mail/conformance/seam_test.go","auto-cli/cmd/auto/main.go","auto-cli/cmd/auto/hints.go","auto-cli/cmd/auto/hookscmd.go","auto-cli/cmd/auto/hints_test.go","auto-cli/cmd/auto/hooksmail_test.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entr 125,"rel":[]},{"id":"harness/scenarios/mail-flow/Dockerfile","type":"file","title":"harness/scenarios/mail-flow/Dockerfile","body":"Builds the real auto binary from monorepo source (context ../../..) into a single host image.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":126,"rel":[]},{"id":"harness/scenarios/mail-flow/docker-compose.yaml","type":"file","title":"harness/scenarios/mail-flow/docker-compose.yaml","body":"One `host` service, init: true, healthcheck gating on the mail-ready file.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":127,"rel":[]},{"id":"harness/scenarios/mail-flow/scripts/host-entrypoint.sh","type":"file","title":"harness/scenarios/mail-flow/scripts/host-entrypoint.sh","body":"Seeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":128,"rel":[]},{"id":"harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","type":"file","title":"harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","body":"A minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":129,"rel":[]},{"id":"harness/src/harness/scenarios/mail_flow.py","type":"file","title":"harness/src/harness/scenarios/mail_flow.py","body":"MailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":130,"rel":[]},{"id":"harness/src/harness/cli.py","type":"file","title":"harness/src/harness/cli.py","body":"One line registering mail-flow in SCENARIOS.","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":131,"rel":[]},{"id":"harness/tests/mail_flow/__init__.py","type":"file","title":"harness/tests/mail_flow/__init__.py","body":"Package marker, mirroring tests/event_flow.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":132,"rel":[]},{"id":"harness/tests/mail_flow/conftest.py","type":"file","title":"harness/tests/mail_flow/conftest.py","body":"Session-scoped fixture: up(build=True) then down() at teardown.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":133,"rel":[]},{"id":"harness/tests/mail_flow/test_mail_loop.py","type":"file","title":"harness/tests/mail_flow/test_mail_loop.py","body":"AC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion.","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":134,"rel":[]},{"id":"harness/CLAUDE.md","type":"file","title":"harness/CLAUDE.md","body":"Document the mail-flow scenario alongside skill-remote and event-flow.","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":135,"rel":[]},{"id":"S:rejected-alternatives","type":"section","title":"Rejected Alternatives","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["X1","X2","X3","X4","X5","X6","X7","X8","X9","X10"],"anchor":"rejected-alternatives"},"order":136,"rel":[{"to":"X1","label":"contains"},{"to":"X2","label":"contains"},{"to":"X3","label":"contains"},{"to":"X4","label":"contains"},{"to":"X5","label":"contains"},{"to":"X6","label":"contains"},{"to":"X7","label":"contains"},{"to":"X8","label":"contains"},{"to":"X9","label":"contains"},{"to":"X10","label":"contains"}]},{"id":"X1","type":"alternative","title":"Put everything under `internal/` per the package blueprint","body":"**Put everything under `internal/` per the package blueprint.** Rejected: the\nblueprint's \"no public API exports\" rule assumes a self-contained tool, and\nmail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\nnarrow package — and keeping the store internal — turns G11 from a convention\ninto a compile-time guarantee, which is a better outcome than either extreme.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":137,"rel":[]},{"id":"X2","type":"alternative","title":"Open the store read-only in the hook and count unacked mail","body":"**Open the store read-only in the hook and count unacked mail.** Rejected under\nG8: a SQLite open on every tool call of every agent on the host is not stat\ncost, and it puts a lock-contending reader in the agent's hot path. The flag\ncosts one `stat` and its drift is bounded and self-healing (D-062-3).","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":138,"rel":[]},{"id":"X3","type":"alternative","title":"Interpolate the sender or the subject into the nudge text","body":"**Interpolate the sender or the subject into the nudge text.** Rejected: G14\nfixes the injected-keystroke sequence as a constant so a sender cannot type\ninto a stranger's pane. The in-band channel is less dangerous but not\ncategorically different — sender-controlled text would be landing in another\nagent's context window — so the same rule applies, and `NudgeText()` is a\nconstant.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":139,"rel":[]},{"id":"X4","type":"alternative","title":"Two containers sharing a `~/.auto` volume for \"two agents on one host\"","body":"**Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\nRejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\nwhich is precisely what makes `event-flow` a multi-host scenario; a shared\n`HOME` also collides on ready files and host identity. One container with two\nworkspaces is what \"one host\" actually means here.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":140,"rel":[]},{"id":"X5","type":"alternative","title":"Key the binding on `session_id`","body":"**Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\ntool call and never sees the hook payload, so it cannot know the session id.\nBridging that gap is exactly the self-identification problem D-13 scopes to T2;\npulling it into T1 would drag `#parent` in with it.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":141,"rel":[]},{"id":"X6","type":"alternative","title":"Emit a `you have mail` bus event from `send`","body":"**Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\nnothing for the in-band path (the receiver's own hook already reads the flag),\nand it adds a live dependency on a daemon that D-11 says must never be\nrequired. The bus event type is reserved and T3 publishes it.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":142,"rel":[]},{"id":"X7","type":"alternative","title":"Route send/list/ack over RPC to the daemon","body":"**Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\nthis task, for two reasons worth repeating: autowatch crash-loops are a\ndocumented failure mode on this host, and a *failing* agent must be able to\npost mail with nothing else alive — which is the case this epic exists for.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":143,"rel":[]},{"id":"X8","type":"alternative","title":"A maildir-style file-per-message store","body":"**A maildir-style file-per-message store.** Genuinely better for lock-free\nconcurrent append, and recorded as such in the backlog (§8.6) — but once\nsubscriptions, read state, bindings and dedup exist it is a relational problem\nwanting transactions, and D-1's same-transaction projection is the whole\ndesign. Superseded by SQLite.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":144,"rel":[]},{"id":"X9","type":"alternative","title":"Skip `read_at` in T1","body":"**Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\nevent now, versus T3 shipping an escalation policy whose predicate (\"unread\npast an age threshold\") has no column to read.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":145,"rel":[]},{"id":"X10","type":"alternative","title":"Ship stub `quickstart` and `doctor` to satisfy the CLI convention","body":"**Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\nRejected in D-062-4: the epic makes adoption a task with an argument behind it,\nand a quickstart that teaches a half-built workflow is worse than none.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":146,"rel":[]},{"id":"S:summary","type":"section","title":"Summary","summary":"","body":"Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle.","tab":"Plan","origin":"plan","meta":{"children":[],"anchor":"summary"},"order":147,"rel":[]},{"id":"S:execution-sequence","type":"section","title":"Execution Sequence","summary":"","body":"The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit.","tab":"Plan","origin":"plan","meta":{"children":["M4","P1","P2","P3","P4","P5"],"anchor":"execution-sequence"},"order":148,"rel":[]},{"id":"M4","type":"diagram","title":"Phase dependency DAG — a chain, because each phase is verified inside the oracle the previous one stood up","body":"","tab":"Plan","origin":"plan","meta":{"code":"flowchart LR\n  P1[\"P1 · Ontology + module + scenario up<br/>glossary · auto mail init/docs/list · mail-flow green\"]\n  P2[\"P2 · One message travels<br/>subscribe/send/list/ack · log + projection · C1 in the harness\"]\n  P3[\"P3 · The in-band nudge<br/>pending flag · hooks fire emits additionalContext\"]\n  P4[\"P4 · Delivery semantics<br/>cursor backfill · broadcast · counts · conformance suite\"]\n  P5[\"P5 · Rails made executable<br/>immutability · ack race · reset · seam guard · docs\"]\n  P1 --> P2 --> P3 --> P4 --> P5"},"order":149,"rel":[]},{"id":"P1","type":"phase","title":"Ontology, module skeleton, and the scenario comes up","body":"**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"","files":"docs/concepts/UBIQUITOUS_LANGUAGE.md,auto-mail/go.mod,auto-mail/go.sum,auto-mail/CLAUDE.md,auto-mail/cmd/automail/main.go,auto-mail/rootcmd/rootcmd.go,auto-mail/internal/app/app.go,auto-mail/internal/cli/root.go,auto-mail/internal/cli/init.go,auto-mail/internal/cli/docs.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/config/settings.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/mail_test.go,auto-mail/internal/store/store.go,auto-mail/internal/store/schema.go,auto-cli/cmd/auto/main.go,auto-cli/go.mod,auto-cli/go.sum,go.work,Makefile,CLAUDE.md,harness/scenarios/mail-flow/Dockerfile,harness/scenarios/mail-flow/docker-compose.yaml,harness/scenarios/mail-flow/scripts/host-entrypoint.sh,harness/src/harness/scenarios/mail_flow.py,harness/src/harness/cli.py,harness/tests/mail_flow/__init__.py,harness/tests/mail_flow/conftest.py,harness/tests/mail_flow/test_mail_loop.py","steps":["P1.1","P1.2","P1.3","P1.4","P1.5","P1.6","P1.7","P1.8"]},"order":150,"rel":[{"to":"docs/concepts/UBIQUITOUS_LANGUAGE.md","label":"touches"},{"to":"auto-mail/go.mod","label":"touches"},{"to":"auto-mail/go.sum","label":"touches"},{"to":"auto-mail/CLAUDE.md","label":"touches"},{"to":"auto-mail/cmd/automail/main.go","label":"touches"},{"to":"auto-mail/rootcmd/rootcmd.go","label":"touches"},{"to":"auto-mail/internal/app/app.go","label":"touches"},{"to":"auto-mail/internal/cli/root.go","label":"touches"},{"to":"auto-mail/internal/cli/init.go","label":"touches"},{"to":"auto-mail/internal/cli/docs.go","label":"touches"},{"to":"auto-mail/internal/cli/list.go","label":"touches"},{"to":"auto-mail/internal/cli/cli_test.go","label":"touches"},{"to":"auto-mail/internal/config/settings.go","label":"touches"},{"to":"auto-mail/mail/client.go","label":"touches"},{"to":"auto-mail/mail/direct.go","label":"touches"},{"to":"auto-mail/mail/mail_test.go","label":"touches"},{"to":"auto-mail/internal/store/store.go","label":"touches"},{"to":"auto-mail/internal/store/schema.go","label":"touches"},{"to":"auto-cli/cmd/auto/main.go","label":"touches"},{"to":"auto-cli/go.mod","label":"touches"},{"to":"auto-cli/go.sum","label":"touches"},{"to":"go.work","label":"touches"},{"to":"Makefile","label":"touches"},{"to":"CLAUDE.md","label":"touches"},{"to":"harness/scenarios/mail-flow/Dockerfile","label":"touches"},{"to":"harness/scenarios/mail-flow/docker-compose.yaml","label":"touches"},{"to":"harness/scenarios/mail-flow/scripts/host-entrypoint.sh","label":"touches"},{"to":"harness/src/harness/scenarios/mail_flow.py","label":"touches"},{"to":"harness/src/harness/cli.py","label":"touches"},{"to":"harness/tests/mail_flow/__init__.py","label":"touches"},{"to":"harness/tests/mail_flow/conftest.py","label":"touches"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"touches"}]},{"id":"P1.1","type":"step","title":"Glossary","body":"**Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\nwith five entries in the house format (bold term, definition, `_Avoid_:`,\noptional `_Has_:`):\n- **Mail** — the stored unit of an addressed, durable message between agents.\n  `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n- **Address** — a virtual, free-form name a Mail is sent to, carrying no\n  physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n  `_Has_`: many Subscriptions.\n- **Subscription** — a durable reader of an Address, holding its own cursor\n  and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n  `_Has_`: many Deliveries, one Binding.\n- **Delivery** — the per-Subscription copy of one Mail and its read/ack\n  state. `_Avoid_`: receipt, copy, inbox item.\n- **Binding** — the current physical target and liveness of a Subscription,\n  recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n  link, attachment, route.\nThen update the frontmatter `summary` to name the five new terms.\n**Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\nexits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\nrefreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n**Do not hand-edit the generated ER block.**","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":1},"rel":[{"to":"P1","label":"step of"}],"order":151},{"id":"P1.2","type":"step","title":"Module scaffold","body":"**Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\ncopying `auto-artifact/`'s shape: `go.mod`\n(`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n`replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n`modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n`internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n`internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\ndir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n`auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n**Verify:** `cd auto-mail && go build ./...` after each file, per the project's\nGo build discipline.","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":2},"rel":[{"to":"P1","label":"step of"}],"order":152},{"id":"P1.3","type":"step","title":"The store, minimal","body":"**The store, minimal.** `internal/store/store.go`: `Open(path)` with\n`os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n`auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n`busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n`WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n`schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n`subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\ncreating the full shape now avoids a migration inside the task).\n**Verify:** a store test that opens, migrates twice (idempotent) and closes.","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":3},"rel":[{"to":"P1","label":"step of"}],"order":153},{"id":"P1.4","type":"step","title":"The seam, minimal","body":"**The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\nall six methods, the input/result types matching the C1 payloads, and sentinel\nerrors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\nimplementation where `List` works (returning an empty slice against a fresh\nstore) and the other four return a `not implemented in this phase` error.\nEverything else stays under `internal/`, so no other module can reach the\nstore (D-062-8).","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":4},"rel":[{"to":"P1","label":"step of"}],"order":154},{"id":"P1.5","type":"step","title":"CLI, minimal","body":"**CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n`EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n`{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\nreference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n(JSON array on stdout, `[]` when empty).\n`internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n`[]` and writes nothing to stdout but JSON.\n`auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\nidentifier, table name or event type in the module names the stored unit\n`message` (the `--message` body flag is explicitly allowed).","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":5},"rel":[{"to":"P1","label":"step of"}],"order":155},{"id":"P1.6","type":"step","title":"Mount it","body":"**Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\nrequire + local replace; `auto-cli/cmd/auto/main.go` imports\n`mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n`mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n`auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\ntable (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n**Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":6},"rel":[{"to":"P1","label":"step of"}],"order":156},{"id":"P1.7","type":"step","title":"The scenario comes up (the epic's second of three things)","body":"**The scenario comes up (the epic's second of three things).**\n`harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\nmonorepo source with context `../../..`, mirroring\n`harness/scenarios/event-flow/Dockerfile`.\n`docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\nhealthcheck gating on `/tmp/mail-ready.json`.\n`scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\nempty commit + `auto init --project` in **both** `/workspace/project-a` and\n`/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n`harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\nwith `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\nfail-fasts with a diagnostic if the ready file is missing, either workspace is\nunregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\na `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\nworkspace (base64-piped, per the event-flow convention).\nRegister `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n`harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\nsession-scoped fixture plus one test asserting the stack is up, both\nworkspaces are registered, and `auto mail list` returns `[]` from each.","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":7},"rel":[{"to":"P1","label":"step of"}],"order":157},{"id":"P1.8","type":"step","title":"Verify (phase gate)","body":"**Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\nfrom the repo root `make check` and `make test`; from `harness/`\n`uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n`uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\nscenarios are untouched.\n**Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`.","tab":"Plan","origin":"plan","meta":{"phase":"P1","n":8},"rel":[{"to":"P1","label":"step of"}],"order":158},{"id":"P2","type":"phase","title":"One message travels between two agents and is acked","body":"The epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"1","files":"auto-mail/internal/store/schema.go,auto-mail/internal/store/events.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/internal/ulid/ulid.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/address.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","steps":["P2.1","P2.2","P2.3","P2.4","P2.5","P2.6","P2.7","P2.8"]},"order":159,"rel":[{"to":"P1","label":"depends on"},{"to":"auto-mail/internal/store/schema.go","label":"touches"},{"to":"auto-mail/internal/store/events.go","label":"touches"},{"to":"auto-mail/internal/store/project.go","label":"touches"},{"to":"auto-mail/internal/store/store_test.go","label":"touches"},{"to":"auto-mail/internal/ulid/ulid.go","label":"touches"},{"to":"auto-mail/mail/client.go","label":"touches"},{"to":"auto-mail/mail/direct.go","label":"touches"},{"to":"auto-mail/mail/address.go","label":"touches"},{"to":"auto-mail/mail/binding.go","label":"touches"},{"to":"auto-mail/mail/mail_test.go","label":"touches"},{"to":"auto-mail/internal/cli/subscribe.go","label":"touches"},{"to":"auto-mail/internal/cli/send.go","label":"touches"},{"to":"auto-mail/internal/cli/list.go","label":"touches"},{"to":"auto-mail/internal/cli/ack.go","label":"touches"},{"to":"auto-mail/internal/cli/cli_test.go","label":"touches"},{"to":"harness/src/harness/scenarios/mail_flow.py","label":"touches"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"touches"}]},{"id":"P2.1","type":"step","title":"Ids","body":"**Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\nlexicographically sortable **within one process** (the cross-host merge\nproperty `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n`sub_` + the ULID's leading 8 chars.\n**Verify:** a test asserting monotonicity across 10k ids in one process and\nsort order matching generation order — and scoped to say so, because that\nordering does not survive a process boundary and nothing in the store may\nrest on it. Ordering the store depends on comes from the log's own `seq`\n(see the cursor, below).","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":1},"rel":[{"to":"P2","label":"step of"}],"order":160},{"id":"P2.2","type":"step","title":"Events","body":"**Events.** `internal/store/events.go`: the four `alpha.*` types —\n`alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n`alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n`Append(tx, ev)` as the **only** writer of the `events` table. Add the\n`BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n`schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":2},"rel":[{"to":"P2","label":"step of"}],"order":161},{"id":"P2.3","type":"step","title":"Projection","body":"**Projection.** `internal/store/project.go`, all inside one\n`BEGIN IMMEDIATE` transaction per operation:\n- `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n  (address + `from_cursor`) and its binding row.\n- `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n  carrying the `seq` of that event as the store's own ordering of mail. It\n  writes **no** `deliveries` rows: materialisation is the read path's, and\n  only the read path's (D-10). Send additionally *reads* the two counts it\n  reports and the bindings whose pending flag the mail should raise.\n- `list` → materialise any missing `deliveries` rows from each subscription's\n  `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n  `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n  nothing; return unacked rows.\n- `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n  AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n  `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":3},"rel":[{"to":"P2","label":"step of"}],"order":162},{"id":"P2.4","type":"step","title":"Addresses and bindings","body":"**Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n`/` explicitly allowed and never normalised (D-9); rejects empty,\nwhitespace-padded, control characters and over-length, each with a remediation\nmessage. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n`tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\nopaque pair. **Neither ever writes physical identity into an address or an\nenvelope** (G5).","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":4},"rel":[{"to":"P2","label":"step of"}],"order":163},{"id":"P2.5","type":"step","title":"The direct client","body":"**The direct client.** Implement the remaining five `Client` methods in\n`mail/direct.go` over the projection, returning exactly the C1 payload shapes.\nThe sender's `from` follows the three-rung ladder: `--from` → the address of a\nsubscription bound to the caller's `(manager, target)` (lowest subscription id\nwhen several) → the literal `<projectId>/agent` from the registry, or\n`unregistered/agent` outside a registered project. Always a resolved absolute\naddress, never a relative handle.","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":5},"rel":[{"to":"P2","label":"step of"}],"order":164},{"id":"P2.6","type":"step","title":"The CLI verbs","body":"**The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n`--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n(`--address`, `--subscription`; unfiltered returns every unacked delivery for\nevery subscription bound to the caller), `ack.go` (positional mail id;\n`wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\nwith a remediation hint for an unknown id).\n`cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\nexact payloads and that stdout is pure JSON.","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":6},"rel":[{"to":"P2","label":"step of"}],"order":165},{"id":"P2.7","type":"step","title":"The harness proves it (G15)","body":"**The harness proves it (G15).** Extend `mail_flow.py` with\n`subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n`test_mail_loop.py` with the C1 loop across the two workspaces:\n**project-a subscribes to its own reply address first** (so `from` resolves by\nrung 2, as C1 shows), project-b subscribes to the target address, project-a\nsends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\npresence of the mail id, never on counts (G4 permits duplicates).","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":7},"rel":[{"to":"P2","label":"step of"}],"order":166},{"id":"P2.8","type":"step","title":"Verify (phase gate)","body":"**Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\nrepo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n**Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`.","tab":"Plan","origin":"plan","meta":{"phase":"P2","n":8},"rel":[{"to":"P2","label":"step of"}],"order":167},{"id":"P3","type":"phase","title":"The in-band nudge reaches a working agent","body":"The riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"2","files":"auto-mail/mail/pending.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/config/settings.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-cli/cmd/auto/hints.go,auto-cli/cmd/auto/hookscmd.go,auto-cli/cmd/auto/hints_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","steps":["P3.1","P3.2","P3.3","P3.4","P3.5","P3.6"]},"order":168,"rel":[{"to":"P2","label":"depends on"},{"to":"auto-mail/mail/pending.go","label":"touches"},{"to":"auto-mail/mail/binding.go","label":"touches"},{"to":"auto-mail/mail/mail_test.go","label":"touches"},{"to":"auto-mail/internal/config/settings.go","label":"touches"},{"to":"auto-mail/internal/cli/list.go","label":"touches"},{"to":"auto-mail/internal/cli/ack.go","label":"touches"},{"to":"auto-cli/cmd/auto/hints.go","label":"touches"},{"to":"auto-cli/cmd/auto/hookscmd.go","label":"touches"},{"to":"auto-cli/cmd/auto/hints_test.go","label":"touches"},{"to":"auto-cli/cmd/auto/hooksmail_test.go","label":"touches"},{"to":"harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","label":"touches"},{"to":"harness/src/harness/scenarios/mail_flow.py","label":"touches"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"touches"}]},{"id":"P3.1","type":"step","title":"The pending flag","body":"**The pending flag.** `mail/pending.go`:\n`flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\nbytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n`HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\nevery error — missing dir, permission denied — as \"no mail\". Add\n`NudgeText() string`, a **constant**: an instruction to run `auto mail list`\nand `auto mail ack` when acted on, with **no** interpolation of sender,\naddress, subject or body (G14's content rule, adopted for the in-band channel).\nWire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\nsubscriptions have nothing unacked left — the self-healing loop that bounds\nflag drift (D-062-3).\n**Verify:** `mail_test.go` — a counting store-opener injected over the package\nvar proves `HasPending` performs **zero** opens on both paths; flag lifecycle\nacross send → list → ack; a false-positive flag causes one `list` and then\nclears itself.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":1},"rel":[{"to":"P3","label":"step of"}],"order":169},{"id":"P3.2","type":"step","title":"Split matching from emission (D-062-9)","body":"**Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\nchange `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\nfragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\nadd `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\nwhich writes **exactly one** `hookResponse` object, or nothing when every\nfragment is empty. Update `hints_test.go` for the split — the behavioural\nassertions carry over unchanged.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":2},"rel":[{"to":"P3","label":"step of"}],"order":170},{"id":"P3.3","type":"step","title":"Wire the nudge","body":"**Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n`matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n`mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\nfragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\nstays inside the never-return-an-error region — any failure is swallowed and\nthe hook still exits 0.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":3},"rel":[{"to":"P3","label":"step of"}],"order":171},{"id":"P3.4","type":"step","title":"Hook tests","body":"**Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\nnudge emitted only when the flag exists; only on `PostToolUse`; **one**\n`hookSpecificOutput` object when a hint rule also matches, with mail first;\nexit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\nfile; and — the observable form of G8 — firing hooks on a `HOME` where\n`auto mail init` never ran leaves `alpha-store.db` **non-existent**.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":4},"rel":[{"to":"P3","label":"step of"}],"order":172},{"id":"P3.5","type":"step","title":"The harness proves it","body":"**The harness proves it.** Add\n`harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\nPostToolUse payload, `cwd` patched per fire, mirroring\n`event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n`mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\nreturns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n`test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n`hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\nthe next fire emits nothing.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":5},"rel":[{"to":"P3","label":"step of"}],"order":173},{"id":"P3.6","type":"step","title":"Verify (phase gate)","body":"**Verify (phase gate):** `cd auto-mail && go test ./...`;\n`cd auto-cli && go test ./...`; repo-root `make check && make test`;\n`uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n(the hints change touches a path `event-flow` exercises — prove it is intact).\n**Commit** `feat(062): in-band mail nudge on hook fire at stat cost`.","tab":"Plan","origin":"plan","meta":{"phase":"P3","n":6},"rel":[{"to":"P3","label":"step of"}],"order":174},{"id":"P4","type":"phase","title":"Delivery semantics and the Client conformance suite","body":"The call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"3","files":"auto-mail/conformance/conformance.go,auto-mail/conformance/conformance_test.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/mail/direct.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","steps":["P4.1","P4.2","P4.3","P4.4","P4.5","P4.6"]},"order":175,"rel":[{"to":"P3","label":"depends on"},{"to":"auto-mail/conformance/conformance.go","label":"touches"},{"to":"auto-mail/conformance/conformance_test.go","label":"touches"},{"to":"auto-mail/internal/store/project.go","label":"touches"},{"to":"auto-mail/internal/store/store_test.go","label":"touches"},{"to":"auto-mail/mail/direct.go","label":"touches"},{"to":"auto-mail/internal/cli/subscribe.go","label":"touches"},{"to":"auto-mail/internal/cli/send.go","label":"touches"},{"to":"auto-mail/internal/cli/list.go","label":"touches"},{"to":"auto-mail/internal/cli/ack.go","label":"touches"},{"to":"auto-mail/internal/cli/cli_test.go","label":"touches"},{"to":"harness/src/harness/scenarios/mail_flow.py","label":"touches"},{"to":"harness/tests/mail_flow/test_mail_loop.py","label":"touches"}]},{"id":"P4.1","type":"step","title":"Cursor backfill (D-10)","body":"**Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\nthe store's own high-water mark, `MAX(mail.seq)` read inside the same\n`BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\nthe beginning of the log), and report `backfilled` as the count of unacked\nmail the new cursor admits.\n\nThe cursor is a log position, **never a minted id**. A `--from-now` cursor of\n`ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\nordering *between processes*, and D-11 makes every verb its own process: two\nids drawn in the same millisecond share a timestamp prefix and draw\nindependent tails, so a mail could sort below the cursor and be admitted by\nnothing, ever. The write lock is what makes a high-water mark true instead.\n**Verify:** send to an unsubscribed address, subscribe afterwards, `list`\nreturns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n`backfilled` is 0.","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":1},"rel":[{"to":"P4","label":"step of"}],"order":176},{"id":"P4.2","type":"step","title":"Broadcast (D-7)","body":"**Broadcast (D-7).** Two subscriptions on one address each get their own\n`deliveries` row and their own ack state; acking one leaves the other unacked.\n**Verify:** `store_test.go` plus a conformance case.","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":2},"rel":[{"to":"P4","label":"step of"}],"order":177},{"id":"P4.3","type":"step","title":"Both counts (G6)","body":"**Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n`bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n`0/0` for an unknown address, persists the mail, and writes the\nlikely-typo hint to **stderr** only.","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":3},"rel":[{"to":"P4","label":"step of"}],"order":178},{"id":"P4.4","type":"step","title":"The conformance suite","body":"**The conformance suite.** `auto-mail/conformance/conformance.go` — a\n`RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n`auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\nthe same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\nappending no second event, backfill-on-subscribe both ways,\nsubscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\nwith a separator. `conformance_test.go` runs it against `NewDirect`.\n**Deliberately absent: any assertion about ordering** (G4).","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":4},"rel":[{"to":"P4","label":"step of"}],"order":179},{"id":"P4.5","type":"step","title":"The harness proves the J2 half","body":"**The harness proves the J2 half.** Extend `test_mail_loop.py` with\nsend-before-subscribe across the two workspaces: project-a sends to an address\nnobody holds, project-b subscribes afterwards and receives it.","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":5},"rel":[{"to":"P4","label":"step of"}],"order":180},{"id":"P4.6","type":"step","title":"Verify (phase gate)","body":"**Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n`make check && make test`; `uv run pytest tests/mail_flow -v`.\n**Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`.","tab":"Plan","origin":"plan","meta":{"phase":"P4","n":6},"rel":[{"to":"P4","label":"step of"}],"order":181},{"id":"P5","type":"phase","title":"Rails made executable: immutability, the ack race, reset, the seam guard, docs","body":"Everything the guard rails assert but nothing so far has been forced to prove.","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"4","files":"auto-mail/internal/store/store_test.go,auto-mail/internal/cli/reset.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/cli/docs.go,auto-mail/conformance/seam_test.go,auto-mail/CLAUDE.md,Makefile,harness/CLAUDE.md","steps":["P5.1","P5.2","P5.3","P5.4","P5.5","P5.6","P5.7"]},"order":182,"rel":[{"to":"P4","label":"depends on"},{"to":"auto-mail/internal/store/store_test.go","label":"touches"},{"to":"auto-mail/internal/cli/reset.go","label":"touches"},{"to":"auto-mail/internal/cli/cli_test.go","label":"touches"},{"to":"auto-mail/internal/cli/docs.go","label":"touches"},{"to":"auto-mail/conformance/seam_test.go","label":"touches"},{"to":"auto-mail/CLAUDE.md","label":"touches"},{"to":"Makefile","label":"touches"},{"to":"harness/CLAUDE.md","label":"touches"}]},{"id":"P5.1","type":"step","title":"Immutability (G1)","body":"**Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\nbefore a `list` + `ack` cycle and assert byte-identical rows after; assert the\n`BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\nassert the ack appears as a **new** `alpha.mail.acked` row.","tab":"Plan","origin":"plan","meta":{"phase":"P5","n":1},"rel":[{"to":"P5","label":"step of"}],"order":183},{"id":"P5.2","type":"step","title":"The ack race (G13)","body":"**The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n`Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\nevent, and every caller seeing `acked: true`. Plus a concurrent-writer test:\nN processes' worth of goroutines sending to one address lose no events and\nleave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n`Makefile`.\n**Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).","tab":"Plan","origin":"plan","meta":{"phase":"P5","n":2},"rel":[{"to":"P5","label":"step of"}],"order":184},{"id":"P5.3","type":"step","title":"Reset (G10)","body":"**Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n`alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\nwithout `--yes` on a non-empty store with a remediation hint.\n**Verify:** `cli_test.go` — reset then the C1 loop again from empty.","tab":"Plan","origin":"plan","meta":{"phase":"P5","n":3},"rel":[{"to":"P5","label":"step of"}],"order":185},{"id":"P5.4","type":"step","title":"The seam guard (G11)","body":"**The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\nrepo root by walking up for `go.work` (skip the test if absent, so a\nstandalone module checkout still passes), then walk every module's Go source,\n`harness/` and `skills/`, asserting that the **mail store** is named nowhere\noutside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n`~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\neither. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n`auto-search` import it for their own stores and would fail the guard on day\nzero. Also assert no package outside `auto-mail` imports\n`auto-mail/internal/...` (a regression guard over what the compiler already\nenforces). Failure names the offending file and says \"go through\nmail.Client\".","tab":"Plan","origin":"plan","meta":{"phase":"P5","n":4},"rel":[{"to":"P5","label":"step of"}],"order":186},{"id":"P5.5","type":"step","title":"The alpha contract in writing (G10, G4)","body":"**The alpha contract i
