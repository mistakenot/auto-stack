    const types=[...new Set(ns.map(x=>x.type))].filter(t=>t!=='home');
    for(const t of types){ const l=ns.filter(x=>x.type===t); h+=`<h2 class="sub">${esc(TYPE[t][0])} · ${l.length}</h2><div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14.5px">${l.map(x=>t==='section'||t==='special'?titleLink(x.id):idLink(x.id)).join('')}</div>`; }
  }
  return h;
}

/* ======================= panes & navigation ======================= */
const stackEl=document.getElementById('stack');
let stack=[]; // {id, from:{el}|null}
let mode='explore', pathIdx=0;
function paneWidth(id){ return id==='special:map'||id==='special:changes'||G.nodes.get(id)?.type==='diagram'?'wide':''; }
function renderStack(fromIndex=0, animateLast=true){
  const panes=[...stackEl.querySelectorAll('.pane')];
  for(let i=panes.length-1;i>=fromIndex;i--) panes[i].remove();
  for(let i=fromIndex;i<stack.length;i++){
    const id=stack[i].id, n=G.nodes.get(id);
    const p=document.createElement('section'); p.className='pane '+paneWidth(id)+(animateLast&&i===stack.length-1?' enter':''); p.dataset.id=id; p.dataset.i=i;
    p.style.left=`calc(${i} * var(--spine))`; p.style.zIndex=10+i; p.style.setProperty('--tc',tc(n.type));
    p.innerHTML=`<div class="spine" title="${esc(plain(n.title))}"><div class="bar"></div><div class="vt"><b>${esc(n.type==='home'?G.key:displayId(n)==='§'?'§':displayId(n))}</b>  ${esc(plain(n.title))}</div>${i>0?'<button class="x" title="Close pane">×</button>':''}</div><div class="body"><article>${paneHTML(id)}</article></div>`;
    stackEl.appendChild(p);
    hydrate(p);
  }
  stackEl.querySelector('.ghostpane')?.remove();
  const gh=document.createElement('div'); gh.className='ghostpane'; gh.innerHTML=`<div><svg viewBox="0 0 120 60" width="120"><rect x="2" y="6" width="34" height="48" rx="3" fill="none" stroke="currentColor"/><rect x="44" y="6" width="34" height="48" rx="3" fill="none" stroke="currentColor" stroke-dasharray="3 3"/><path d="M22 30 H40 Q40 16 50 16 H60" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="1 3" stroke-linecap="round"/><circle cx="60" cy="16" r="3" fill="var(--accent)"/></svg><p><b>Follow any link.</b><br>It opens here as the next pane, wired back to where you clicked. Older panes fold into spines on the left, so the trail stays in view.</p><p class="hint"><kbd>Ctrl</kbd> <kbd>K</kbd> search · hover to preview · ⚑ Lint shows avoid-terms</p></div>`;
  stackEl.appendChild(gh);
  markOpen();
  const last=[...stackEl.querySelectorAll('.pane')].pop();
  const totalW=[...stackEl.querySelectorAll('.pane')].reduce((a,p)=>a+p.offsetWidth,0);
  gh.style.display = totalW+360 <= stackEl.clientWidth ? '' : 'none';
  if(last){ requestAnimationFrame(()=>{ const target=last.offsetLeft+last.offsetWidth-stackEl.clientWidth; stackEl.scrollTo({left:Math.max(0,target),behavior:'smooth'}); setTimeout(drawRibbons,420); }); }
  writeHash();
}
function markOpen(){
  const open=new Set(stack.map(s=>s.id));
  stackEl.querySelectorAll('a.hl.open').forEach(a=>a.classList.remove('open','trail'));
  stackEl.querySelectorAll('a.hl').forEach(a=>{ if(open.has(a.dataset.to)) a.classList.add('open'); });
  stack.forEach((s,i)=>{ if(i>0 && s.from && s.from.isConnected) s.from.classList.add('trail'); });
}
function openNode(id, fromEl, afterIndex){
  if(!G.nodes.has(id)) return;
  closePops();
  const j=stack.findIndex(s=>s.id===id);
  if(j>=0 && (afterIndex==null || j<=afterIndex+1)){ const p=stackEl.querySelectorAll('.pane')[j]; if(j===afterIndex+1 && fromEl){ stack[j].from=fromEl; } focusPane(j); markOpen(); drawRibbons(); return; }
  if(afterIndex==null) afterIndex=stack.length-1;
  if(!fromEl){ const src=stackEl.querySelectorAll('.pane')[afterIndex]; const cand=src && [...src.querySelectorAll('a.hl')].find(a=>a.dataset.to===id); if(cand) fromEl=cand; }
  stack=stack.slice(0,afterIndex+1); stack.push({id,from:fromEl||null});
  renderStack(afterIndex+1);
}
function focusPane(j){ const p=stackEl.querySelectorAll('.pane')[j]; if(!p) return; const target=p.offsetLeft - j*parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spine')); stackEl.scrollTo({left:Math.max(0,Math.min(target, p.offsetLeft+p.offsetWidth-stackEl.clientWidth+ (stackEl.clientWidth - p.offsetWidth))),behavior:'smooth'}); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); setTimeout(drawRibbons,420); }
function closePane(i){ stack=stack.slice(0,i); renderStack(i); }

/* ---------- hydrate a pane: diagrams, local graph, map ---------- */
let mmCount=0;
function hydrate(root){
  root.querySelectorAll('.mermaidbox[data-diagram]').forEach(async box=>{
    const n=G.nodes.get(box.dataset.diagram); const target=box.querySelector('.mm');
    let code=n.meta.code;
    if(/^\s*sequenceDiagram/.test(code)) code=code.split('\n').map(l=>{ const i=l.indexOf(':'); return i>0 && /->>|-->>/.test(l.slice(0,i)) ? l.slice(0,i+1)+l.slice(i+1).replace(/;/g,'#59;') : l; }).join('\n');
    try{ const {svg}=await mermaid.render('mm'+(++mmCount), code); target.innerHTML=svg; linkMermaid(target); }
    catch(e){ target.innerHTML=`<pre><code>${esc(n.meta.code)}</code></pre>`; document.querySelectorAll('body > [id^="dmm"]').forEach(x=>x.remove()); }
  });
  root.querySelectorAll('svg.localgraph').forEach(drawLocalGraph);
  root.querySelectorAll('svg[data-map]').forEach(drawMap);
}
function linkMermaid(svgRoot){
  svgRoot.querySelectorAll('g.node, g.actor, text.actor').forEach(g=>{
    const t=(g.textContent||'').trim(); const m=t.match(/^(P\d|G\d{1,2}|AC-\d{1,2}|D-062-\d|D-\d{1,2})\b/);
    if(m && G.nodes.has(m[1])){ g.classList.add('hlnode'); g.dataset.to=m[1]; }
  });
}
function neighbours(id){
  const s=new Map();
  for(const [t,e] of (G.out.get(id)||new Map())) if(G.nodes.has(t)) s.set(t,{dir:'out',e});
  for(const [f,e] of (G.inn.get(id)||new Map())) if(G.nodes.has(f)) s.set(f,{dir:s.has(f)?'both':'in',e});
  return s;
}
function nodeColor(n){ return n.type==='file'?`var(--${n.meta.change})`:tc(n.type); }
function drawLocalGraph(svg){
  const id=svg.dataset.center; const nb=[...neighbours(id).entries()];
  const deg=k=>(G.out.get(k)?.size||0)+(G.inn.get(k)?.size||0);
  nb.sort((a,b)=>(b[1].e.labels.length-a[1].e.labels.length)||(deg(b[0])-deg(a[0])));
  const show=nb.slice(0,30), extra=nb.length-show.length;
  const W=svg.clientWidth||560, H=250, cx=W/2, cy=H/2;
  const order=Object.keys(TYPE); show.sort((a,b)=>order.indexOf(G.nodes.get(a[0]).type)-order.indexOf(G.nodes.get(b[0]).type));
  let s=''; const R1=Math.min(W/2-50,105);
  const pts=show.map(([k,v],i)=>{ const ang=-Math.PI/2+i/show.length*Math.PI*2; const rr=R1*(show.length>16&&i%2?0.72:1); return [k,v,cx+Math.cos(ang)*rr*(W/H>1.6?1.9:1.2),cy+Math.sin(ang)*rr]; });
  for(const [k,v,x,y] of pts){ s+=`<path d="M${cx},${cy} Q${(cx+x)/2+ (y-cy)*.12},${(cy+y)/2-(x-cx)*.12} ${x},${y}" fill="none" stroke="${nodeColor(G.nodes.get(k))}" stroke-width="${v.e.labels.length?1.8:1}" stroke-opacity=".5" ${v.dir==='in'?'stroke-dasharray="3 3"':''}/>`; }
  for(const [k,v,x,y] of pts){ const n=G.nodes.get(k); const lbl=displayId(n)==='§'?n.title:displayId(n); s+=`<g class="nd hlnode" data-to="${esc(k)}"><circle cx="${x}" cy="${y}" r="${5+Math.min(5,deg(k)/6)}" fill="${nodeColor(n)}" stroke="var(--card)" stroke-width="1.5"/><text x="${x}" y="${y+ (y<cy?-10:17)}" text-anchor="middle">${esc(lbl.length>22?lbl.slice(0,21)+'…':lbl)}</text></g>`; }
  const c=G.nodes.get(id);
  s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="${nodeColor(c)}" stroke="var(--card)" stroke-width="3"/><text x="${cx}" y="${cy+28}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${esc((displayId(c)==='§'?c.title:displayId(c)).slice(0,28))}</text>`;
  s+=`<text x="10" y="${H-10}" style="fill:var(--ink3)">— links out   - - - backlinks${extra>0?`   (+${extra} more below)`:''}</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=s;
}
const LAYERS=[['finding','guardrail','epicdecision','epictask','journey','seam','term','wanted'],['decision','section','thread','assumption','risk','alternative','feedback'],['ac','transcript','command','api','symbol','diagram','address','eventtype'],['phase','step'],['file','path']];
const LAYER=t=>{ const i=LAYERS.findIndex(l=>l.includes(t)); return i<0?2:i; };
function drawMap(svg){
  const pane=svg.closest('.pane');
  const enabled=()=>new Set([...pane.querySelectorAll('[data-mt]')].filter(x=>x.checked).map(x=>x.dataset.mt));
  const run=()=>{
    const en=enabled();
    const nodes=[...G.nodes.values()].filter(n=>en.has(n.type)).map(n=>({id:n.id,n}));
    const idx=new Set(nodes.map(x=>x.id)); const links=[];
    for(const [f,o] of G.out) if(idx.has(f)) for(const [t,e] of o) if(idx.has(t)) links.push({source:f,target:t,s:e.labels.length>0});
    const deg={}; links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1;});
    const W=svg.clientWidth||900, H=svg.clientHeight||600;
    const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(l=>l.s?38:60).strength(.06)).force('charge',d3.forceManyBody().strength(-38)).force('collide',d3.forceCollide(d=>4+Math.sqrt(deg[d.id]||1)*2)).force('x',d3.forceX(d=>LAYER(d.n.type)*(W-200)/4+100).strength(.9)).force('y',d3.forceY(H/2+10).strength(.1)).stop();
    for(let i=0;i<320;i++) sim.tick();
    const sel=d3.select(svg); sel.selectAll('*').remove();
    const heads=['Requirements roots','Decisions & reasoning','Contracts & surface','Phases & steps','Files & cited paths'];
    sel.append('g').selectAll('text').data(heads).join('text').attr('x',(d,i)=>i*(W-200)/4+100).attr('y',20).attr('text-anchor','middle').style('font-family','IBM Plex Sans Condensed').style('font-size','11px').style('letter-spacing','.12em').style('fill','#857f72').text(d=>d.toUpperCase());
    const g=sel.append('g');
    sel.call(d3.zoom().scaleExtent([.3,5]).on('zoom',ev=>g.attr('transform',ev.transform)));
    g.append('g').selectAll('line').data(links).join('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y).attr('stroke',d=>d.s?'#9a8f78':'#c9bfaa').attr('stroke-width',d=>d.s?1:.6).attr('stroke-opacity',.55);
    const ng=g.append('g').selectAll('g').data(nodes).join('g').attr('class','hlnode').attr('data-to',d=>d.id).style('cursor','pointer').attr('transform',d=>`translate(${d.x},${d.y})`);
    ng.append('circle').attr('r',d=>3+Math.sqrt(deg[d.id]||1)*1.5).attr('fill',d=>nodeColor(d.n)).attr('stroke','#fbf8f1').attr('stroke-width',1);
    ng.filter(d=>(deg[d.id]||0)>=9 || ['phase','guardrail','finding'].includes(d.n.type)).append('text').attr('y',d=>-(5+Math.sqrt(deg[d.id]||1)*1.5)).attr('text-anchor','middle').text(d=>{const l=displayId(d.n)==='§'?d.n.title:displayId(d.n); return l.length>20?l.slice(0,19)+'…':l;});
  };
  pane.querySelectorAll('[data-mt]').forEach(x=>x.addEventListener('change',run));
  requestAnimationFrame(run);
}

/* ======================= ribbons (visible links between panes) ======================= */
const rib=document.getElementById('ribbons');
let ribQueued=false;
function drawRibbons(){ if(ribQueued) return; ribQueued=true; requestAnimationFrame(()=>{ ribQueued=false; _draw(); }); }
function _draw(){
  const desk=document.getElementById('desk').getBoundingClientRect(); let s='';
  const panes=[...stackEl.querySelectorAll('.pane')];
  for(let i=1;i<stack.length;i++){
    const from=stack[i].from; const pane=panes[i]; if(!from||!from.isConnected||!pane) continue;
    const prev=panes[i-1]; const a=from.getBoundingClientRect(), b=pane.getBoundingClientRect(), pr=prev.getBoundingClientRect();
    if(!from.closest('.pane')) continue;
    let x1=a.right, y1=a.bottom-1; const x2=b.left, y2=b.top+30;
    if(x1>b.left-6) continue; // source hidden under the next pane
    const body=prev.querySelector('.body').getBoundingClientRect(); let dashed=false;
    if(y1<body.top){y1=body.top+4;dashed=true} if(y1>body.bottom){y1=body.bottom-4;dashed=true}
    const col=getComputedStyle(pane).getPropertyValue('--tc');
    const X1=x1-desk.left, Y1=y1-desk.top, X2=x2-desk.left+26, Y2=y2-desk.top, XR=Math.min(pr.right,b.left)-desk.left-1;
    const r=Math.min(10,Math.abs(Y1-Y2)/2), dir=Y2<Y1?-1:1;
    s+=`<path d="M${X1},${Y1} L${XR-r},${Y1} Q${XR},${Y1} ${XR},${Y1+dir*r} L${XR},${Y2-dir*r} Q${XR},${Y2} ${XR+r},${Y2} L${X2},${Y2}" fill="none" stroke="${col}" stroke-width="1.6" stroke-opacity=".6" stroke-dasharray="${dashed?'3 4':'1 3'}" stroke-linecap="round"/><path d="M${XR},${Y1+dir*r} L${XR},${Y2-dir*r}" stroke="${col}" stroke-width="2.4" stroke-opacity=".75"/><circle cx="${X1}" cy="${Y1}" r="2.5" fill="${col}"/><circle cx="${X2}" cy="${Y2}" r="4" fill="${col}"/>`;
  }
  rib.innerHTML=s;
}
stackEl.addEventListener('scroll',drawRibbons,{passive:true});
stackEl.addEventListener('scroll',drawRibbons,{capture:true,passive:true});
window.addEventListener('resize',()=>{ drawRibbons(); });

/* ======================= popovers ======================= */
const popsEl=document.getElementById('pops'); let pops=[]; let hoverTimer=null, hideTimer=null;
function popHTML(id){
  const n=G.nodes.get(id); if(!n) return '';
  const inn=(G.inn.get(id)||new Map()).size, out=(G.out.get(id)||new Map()).size;
  let body = n.type==='home'?`<p class="hint">${esc(G.doc.title)}</p>`: n.type==='special'?'': (n._preview||'');
  return `<div class="prov">${chipFor(n.type)}${['term','file','path','command','address','eventtype','symbol','special','home'].includes(n.type)||n.id.startsWith('S:')?'':`<span class="idtag" style="--tc:${tc(n.type)}">${esc(n.id)}</span>`}${n.origin==='epic'?'<span>Epic 005</span>':''}</div><div class="pt">${mdi(esc(n.title))}</div>${n.summary?`<p class="lead" style="--tc:${tc(n.type)}">${mdi(n.summary)}</p>`:''}<div class="md">${body}</div><div class="pf"><span>↩ ${inn} backlinks</span><span>↗ ${out} links</span><span style="margin-left:auto">click to open →</span></div>`;
}
function avoidHTML(el){
  const owner=G.nodes.get(el.dataset.owner); const w=el.dataset.avoid;
  const note=Object.entries(owner.meta.avoidNotes||{}).find(([k])=>k.toLowerCase()===w.replace(/s$/,'')||k.toLowerCase()===w)?.[1];
  return `<div class="prov"><span class="chip" style="--tc:var(--delete)">Avoid-term flag</span></div><div class="pt">“${esc(w)}”</div><div class="md"><p>On the <i>Avoid</i> list of ${idLink(owner.id)} in the glossary${note?` — ${esc(note)}`:''}. Canonical word: <b>${esc(owner.title)}</b>.</p><p class="hint">Lexical match only — check whether the prose means ${esc(owner.title)} here.</p></div>`;
}
function showPop(anchor){
  const inPop=anchor.closest('.pop'); const level=inPop?(+inPop.dataset.level+1):0;
  pops.slice(level).forEach(p=>p.el.remove()); pops=pops.slice(0,level);
  const id=anchor.dataset.to; const isAvoid = !id && anchor.classList.contains('avoid');
  if(!id && !isAvoid) return;
  const n=id?G.nodes.get(id):null;
  const el=document.createElement('div'); el.className='pop'; el.dataset.level=level; el.style.setProperty('--tc', isAvoid?'var(--delete)':tc(n?n.type:'wanted'));
  el.innerHTML= isAvoid? avoidHTML(anchor) : popHTML(id);
  popsEl.appendChild(el);
  const srcPane = inPop? +inPop.dataset.pane : (anchor.closest('.pane')? +anchor.closest('.pane').dataset.i : null);
  el.dataset.pane = srcPane==null?'':srcPane;
  const r=anchor.getBoundingClientRect(); const pw=el.offsetWidth, ph=el.offsetHeight;
  let x=inPop? r.right+8 : r.left; let y=r.bottom+8;
  if(inPop && x+pw>innerWidth-8) x=r.left-pw-8;
  if(x+pw>innerWidth-8) x=innerWidth-pw-8; if(x<8) x=8;
  if(y+ph>innerHeight-8) y=Math.max(8,r.top-ph-8);
  el.style.left=x+'px'; el.style.top=y+'px';
  pops.push({el,anchor,level});
}
function closePops(){ pops.forEach(p=>p.el.remove()); pops=[]; }
function checkPops(){
  let keep=-1;
  pops.forEach((p,i)=>{ if(p.el.matches(':hover')||p.anchor.matches(':hover')) keep=i; });
  pops.slice(keep+1).forEach(p=>p.el.remove()); pops=pops.slice(0,keep+1);
}
const hoverSel='a.hl, g.hlnode, span.avoid';
document.addEventListener('mouseover',e=>{
  const a=e.target.closest(hoverSel); if(!a) return;
  if(a.matches('span.avoid') && !document.body.classList.contains('lint')) return;
  if(a.matches('a.hl.avoid') && e.altKey){}
  clearTimeout(hoverTimer); clearTimeout(hideTimer);
  if(pops.some(p=>p.anchor===a)) return;
  hoverTimer=setTimeout(()=>showPop(a), a.closest('.pop')?120:260);
});
document.addEventListener('mouseout',e=>{
  const a=e.target.closest(hoverSel+', .pop'); if(!a) return;
  clearTimeout(hoverTimer); clearTimeout(hideTimer); hideTimer=setTimeout(checkPops,280);
});
document.addEventListener('scroll',()=>{},true);

/* ======================= click handling ======================= */
document.addEventListener('click',e=>{
  const x=e.target.closest('.spine .x'); if(x){ closePane(+x.closest('.pane').dataset.i); return; }
  const sp=e.target.closest('.spine'); if(sp){ focusPane(+sp.closest('.pane').dataset.i); return; }
  const act=e.target.closest('[data-act]'); if(act && act.dataset.act==='path'){ setMode('path'); return; }
  const a=e.target.closest('a.hl, g.hlnode, [data-to]'); if(!a) return;
  e.preventDefault();
  const id=a.dataset.to;
  const pop=a.closest('.pop'); const pane=a.closest('.pane');
  let after = pop? (pop.dataset.pane===''?null:+pop.dataset.pane) : pane? +pane.dataset.i : null;
  const src = pop? pops[0]?.anchor : a;
  openNode(id, src && src.isConnected && src.closest('.pane') ? src : null, after);
});
document.querySelectorAll('[data-special]').forEach(b=>b.addEventListener('click',()=>openNode(b.dataset.special,null,null)));

/* ======================= palette ======================= */
const pal=document.getElementById('palette'), pin=document.getElementById('pin'), plist=document.getElementById('plist');
let pres=[], psel=0;
function openPalette(){ pal.classList.add('on'); pin.value=''; runSearch(); pin.focus(); }
function closePalette(){ pal.classList.remove('on'); }
function plain(s){ return String(s||'').replace(/[`*_>#|]/g,'').replace(/\s+/g,' '); }
function fuzzy(q,s){ let i=0,score=0,run=0; for(const ch of s){ if(ch===q[i]){ i++; run++; score+=run; if(i===q.length) return score; } else run=0; } return 0; }
function runSearch(){
  const q=pin.value.trim().toLowerCase();
  const ns=[...G.nodes.values()];
  let scored;
  if(!q){ scored=PATHS[G.key].map((id,i)=>[G.nodes.get(id),1000-i]).filter(x=>x[0]); }
  else scored=ns.map(n=>{
    const id=n.id.toLowerCase(), t=plain(n.title).toLowerCase(), b=plain(n.body+' '+(n.summary||'')).toLowerCase();
    let s=0; if(id===q||t===q) s+=400; if(id.startsWith(q)) s+=200; if(id.includes(q)) s+=90; if(t.includes(q)) s+=120; if(t.startsWith(q)) s+=40;
    const toks=q.split(/\s+/); if(toks.length>1 && toks.every(k=>t.includes(k)||id.includes(k))) s+=110;
    if(!s){ const f=fuzzy(q,t); if(f>q.length) s+=f*2; }
    if(b.includes(q)) s+=35; else if(toks.length>1 && toks.every(k=>b.includes(k))) s+=20;
    if(s && n.type==='wanted') s-=30;
    return [n,s];
  }).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,40);
  pres=scored.map(x=>x[0]); psel=0;
  plist.innerHTML=pres.map((n,i)=>{ const b=plain(n.summary||n.body); let snip=b.slice(0,140); if(q){ const k=b.toLowerCase().indexOf(q); if(k>60) snip='…'+b.slice(k-50,k+90); } return `<li data-i="${i}" class="${i===0?'sel':''}">${chipFor(n.type)}<span><span class="pt2"><b class="idtag" style="--tc:${tc(n.type)}">${esc(['file','term','special','home'].includes(n.type)||n.id.startsWith('S:')?'':n.id)}</b> ${mdi(esc(n.title))}</span><span class="ps">${esc(snip)}</span></span></li>`; }).join('') || `<li class="hint">No node matches.</li>`;
}
pin.addEventListener('input',runSearch);
pin.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); psel=Math.max(0,Math.min(pres.length-1,psel+(e.key==='ArrowDown'?1:-1))); plist.querySelectorAll('li').forEach((l,i)=>l.classList.toggle('sel',i===psel)); plist.children[psel]?.scrollIntoView({block:'nearest'}); }
  if(e.key==='Enter' && pres[psel]){ closePalette(); openNode(pres[psel].id,null,null); }
  if(e.key==='Escape') closePalette();
});
plist.addEventListener('click',e=>{ const li=e.target.closest('li[data-i]'); if(li){ closePalette(); openNode(pres[+li.dataset.i].id,null,null); } });
pal.addEventListener('click',e=>{ if(e.target===pal) closePalette(); });
document.getElementById('searchbtn').addEventListener('click',openPalette);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); pal.classList.contains('on')?closePalette():openPalette(); return; }
  if(pal.classList.contains('on')) return;
  if(e.key==='Escape'){ closePops(); }
  if(mode==='path' && (e.key===']'||e.key==='ArrowRight' && e.altKey)) pathGo(pathIdx+1);
  if(mode==='path' && (e.key==='['||e.key==='ArrowLeft' && e.altKey)) pathGo(pathIdx-1);
});

/* ======================= reading path ======================= */
function setMode(m){
  mode=m; document.body.classList.toggle('pathmode',m==='path');
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  if(m==='path'){ pathIdx=0; stack=[{id:'home',from:null}]; renderStack(0,false); pathGo(1); }
  else renderPathbar();
  requestAnimationFrame(drawRibbons);
}
function pathGo(i){
  const P=PATHS[G.key]; if(i<0||i>=P.length) return;
  pathIdx=i; const id=P[i];
  if(i===0){ stack=[{id:'home',from:null}]; renderStack(0); }
  else { const j=stack.findIndex(s=>s.id===P[i-1]); openNode(id, null, j>=0?j:stack.length-1); }
  renderPathbar();
}
function renderPathbar(){
  const P=PATHS[G.key];
  document.getElementById('pcount').textContent=`${pathIdx+1} / ${P.length}`;
  const n=G.nodes.get(P[pathIdx]); document.getElementById('ptitle').innerHTML=n?`<b style="font-family:var(--mono);font-size:12px;opacity:.7">${esc(n.id.startsWith('S:')?'§':n.id)}</b> ${mdi(esc(n.title))}`:'';
  document.getElementById('pdots').innerHTML=P.map((id,i)=>`<span class="dot ${i<pathIdx?'done':''} ${i===pathIdx?'cur':''}" data-pi="${i}" title="${esc(G.nodes.get(id)?.title||id)}"></span>`).join('');
}
document.getElementById('pdots').addEventListener('click',e=>{ const d=e.target.closest('[data-pi]'); if(d) pathGo(+d.dataset.pi); });
document.getElementById('pnext').onclick=()=>pathGo(pathIdx+1);
document.getElementById('pprev').onclick=()=>pathGo(pathIdx-1);
document.getElementById('pexit').onclick=()=>setMode('explore');
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ======================= plan switching & hash ======================= */
const graphs={};
let suppressHash=false;
function writeHash(){ if(suppressHash) return; const h='#'+G.key+(stack.length>1?'|'+stack.slice(1).map(s=>encodeURIComponent(s.id)).join('|'):''); if(location.hash!==h) history.replaceState(null,'',h); }
function loadPlan(key, ids){
  G = graphs[key] || (graphs[key]=buildGraph(key));
  document.body.classList.toggle('p052',key==='052');
  document.querySelectorAll('[data-plan]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.plan===key));
  document.title=`Plan Hypertext · ${G.doc.title}`;
  document.getElementById('lintn').textContent=G.lintTotal;
  closePops();
  stack=[{id:'home',from:null}]; for(const id of (ids||[])) if(G.nodes.has(id)) stack.push({id,from:null});
  if(mode==='path'){ mode='explore'; document.body.classList.remove('pathmode'); document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode==='explore')); }
  renderStack(0,false);
}
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1)); const parts=location.hash.slice(1).split('|');
  const key=parts[0]==='052'?'052':'062';
  loadPlan(key, parts.slice(1).map(decodeURIComponent));
}
document.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{ loadPlan(b.dataset.plan,[]); }));
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1).split('|')[0]; if(k!==G.key) fromHash(); });
document.getElementById('linttoggle').addEventListener('click',e=>{ const on=!document.body.classList.contains('lint'); document.body.classList.toggle('lint',on); e.currentTarget.setAttribute('aria-pressed',on); if(on && !stack.some(s=>s.id==='special:lint')) openNode('special:lint',null,null); });

mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme:'base', fontFamily:'IBM Plex Sans Condensed', themeVariables:{primaryColor:'#fbf8f1',primaryBorderColor:'#9a8f78',primaryTextColor:'#1c1a16',lineColor:'#857f72',secondaryColor:'#ebe5d7',tertiaryColor:'#f3eee3',fontSize:'13px',actorBkg:'#fbf8f1',actorBorder:'#9a8f78',noteBkgColor:'#f3d9a8'}});
document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode==='explore'));
fromHash();
</script>
