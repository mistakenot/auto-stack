"},{"to":"P5","label":"delivered in"},{"to":"P6","label":"delivered in"},{"to":"P7","label":"delivered in"},{"to":"auto-reflect/cmd/autoreflect/e2e_loop_test.go","label":"tested by"},{"to":"auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go","label":"tested by"}]},{"id":"S:verification-gaps","type":"section","title":"Known Gaps & Risks","summary":"","body":"","tab":"Verification","origin":"plan","meta":{"children":["R1","R2","R3","R4","R5"],"anchor":"verification-gaps"},"order":40,"rel":[{"to":"R1","label":"contains"},{"to":"R2","label":"contains"},{"to":"R3","label":"contains"},{"to":"R4","label":"contains"},{"to":"R5","label":"contains"}]},{"id":"R1","type":"risk","title":"F5 is a breaking output change","body":"**F5 is a breaking output change.** No external consumers are known, but the\nreflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\nthe documented `jq` paths break. Mitigation: update docs in the same task.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":41,"rel":[]},{"id":"R2","type":"risk","title":"Content-id collisions","body":"**Content-id collisions.** Across *distinct* content an 8-hex prefix collision\nis astronomically unlikely; *identical* content → identical id is intended\n(idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\naccepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\nloop call is a distinct event, not a content identity (see Solution).","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":42,"rel":[]},{"id":"R3","type":"risk","title":"F2 root cause not yet pinned","body":"**F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\nlogic drift. Before collapsing, confirm it isn't a legitimate dual-universe\ncount (subagents/scope) — the unit test must reproduce the divergence first,\nthen prove the shared function fixes it.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":43,"rel":[]},{"id":"R4","type":"risk","title":"doctor depth","body":"**doctor depth.** v1 checks state-dir presence, event decodability, and\nsnapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\nmonotonicity) may be deferred to a follow-up.","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":44,"rel":[]},{"id":"R5","type":"risk","title":"No migration of old ids","body":"**No migration of old ids.** Events written before this task keep random ids;\nonly newly minted ids are content-derived. This is intentional (append-only).","tab":"Verification","origin":"plan","meta":{"parent":"S:verification-gaps"},"order":45,"rel":[]},{"id":"S:approach","type":"section","title":"Approach","summary":"","body":"Nine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced.","tab":"Solution","origin":"plan","meta":{"children":[],"anchor":"approach"},"order":46,"rel":[]},{"id":"S:end-state","type":"section","title":"End-state CLI","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["CLI1"],"anchor":"end-state"},"order":47,"rel":[]},{"id":"CLI1","type":"transcript","title":"zsh — the hardened surface","summary":"What success looks like","body":"","tab":"Solution","origin":"plan","meta":{"steps":[{"note":"F4: gaps are readable, no more grepping jsonl","status":"todo","cmd":"auto reflect gap list --since 7d","out":"[\n  { \"id\": \"ev-3a9c1d77\", \"session_id\": \"518b6d9a…\", \"ts\": \"2026-06-28T13:52:…\",\n    \"report\": \"no rule covered worktree teardown on complete-task\",\n    \"moment\": \"deleting the branch after merge\" }\n]"},{"note":"F7: same id on dry-run and apply (separate runs)","status":"todo","cmd":"auto reflect consolidate --dry-run delta.json | jq -r '.ids[0]'","out":"r-1a2b3c4d"},{"status":"todo","cmd":"auto reflect consolidate delta.json | jq -r '.ids[0]'","out":"r-1a2b3c4d   # identical → pre-stage `rule promote r-1a2b3c4d` from the preview"},{"note":"F1: structured health, exit 1 on fail","status":"todo","cmd":"auto reflect doctor","out":"[\n  { \"check\": \"events_dir\", \"status\": \"pass\", \"message\": \"12 shards, all decodable\" },\n  { \"check\": \"playbook_freshness\", \"status\": \"warn\",\n    \"message\": \"snapshot stale vs log\", \"hint\": \"run auto reflect rebuild\" }\n]"}]},"order":48,"rel":[]},{"id":"TH4","type":"thread","title":"gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists","tab":"Solution","origin":"plan","meta":{"anchor":"end-state","status":"resolved","priority":"p2","comments":[{"by":"review","md":"The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`."},{"by":"author","md":"Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id."}]},"body":"","order":49,"rel":[{"to":"S:end-state","label":"anchored on"}]},{"id":"S:key-apis","type":"section","title":"Key APIs","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["idhash","cli/output"],"anchor":"key-apis"},"order":50,"rel":[]},{"id":"idhash","type":"api","title":"idhash","summary":"One deterministic id minter, reused by rules + observations","body":"","tab":"Solution","origin":"plan","meta":{"kind":"api","lang":"go","path":"auto-reflect/internal/idhash/idhash.go","members":[{"kind":"function","sig":"Derive(prefix string, parts ...string) string","doc":"Returns prefix + first 8 hex of sha256 over the newline-joined parts. Deterministic; keeps the `^<prefix>-[0-9a-f]{8}$` shape."}]},"order":51,"rel":[{"to":"auto-reflect/internal/idhash/idhash.go","label":"lives in"}]},{"id":"sym:Derive","type":"symbol","title":"Derive","body":"Returns prefix + first 8 hex of sha256 over the newline-joined parts. Deterministic; keeps the `^<prefix>-[0-9a-f]{8}$` shape.","tab":"Solution","origin":"plan","meta":{"sig":"Derive(prefix string, parts ...string) string","kind":"function","module":"idhash"},"rel":[{"to":"idhash","label":"member of"}],"order":52},{"id":"cli/output","type":"api","title":"cli/output","summary":"Uniform mutation-result envelope","body":"","tab":"Solution","origin":"plan","meta":{"kind":"api","lang":"go","path":"auto-reflect/internal/cli/output.go","members":[{"kind":"function","sig":"mutationResult(id string, fields map[string]any) map[string]any","doc":"Injects a top-level `id` into a command's result map."},{"kind":"function","sig":"mutationResultIDs(ids []string, fields map[string]any) map[string]any","doc":"Injects top-level `id` (first) + `ids` for multi-id mutations like `consolidate`."}]},"order":53,"rel":[{"to":"auto-reflect/internal/cli/output.go","label":"lives in"}]},{"id":"sym:mutationResult","type":"symbol","title":"mutationResult","body":"Injects a top-level `id` into a command's result map.","tab":"Solution","origin":"plan","meta":{"sig":"mutationResult(id string, fields map[string]any) map[string]any","kind":"function","module":"cli/output"},"rel":[{"to":"cli/output","label":"member of"}],"order":54},{"id":"sym:mutationResultIDs","type":"symbol","title":"mutationResultIDs","body":"Injects top-level `id` (first) + `ids` for multi-id mutations like `consolidate`.","tab":"Solution","origin":"plan","meta":{"sig":"mutationResultIDs(ids []string, fields map[string]any) map[string]any","kind":"function","module":"cli/output"},"rel":[{"to":"cli/output","label":"member of"}],"order":55},{"id":"S:file-changes","type":"section","title":"File Changes","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["auto-reflect/internal/idhash/idhash.go","auto-reflect/internal/idhash/idhash_test.go","auto-reflect/internal/cli/gap.go","auto-reflect/internal/cli/gap_integration_test.go","auto-reflect/internal/cli/doctor.go","auto-reflect/internal/cli/doctor_integration_test.go","auto-reflect/internal/cli/output.go","auto-reflect/internal/cli/root.go","auto-reflect/internal/rules/model.go","auto-reflect/internal/observations/model.go","auto-reflect/internal/observations/model_test.go","auto-reflect/internal/loop/service_test.go","auto-reflect/internal/cli/consolidate.go","auto-reflect/internal/cli/observation.go","auto-reflect/internal/cli/rule.go","auto-reflect/internal/cli/retrieve.go","auto-reflect/internal/cli/select.go","auto-reflect/internal/cli/feedback.go","auto-reflect/internal/cli/miner.go","auto-reflect/internal/cli/miner_integration_test.go","auto-reflect/internal/cli/init.go","auto-reflect/internal/cli/init_test.go","auto-reflect/internal/cli/quickstart.go","auto-reflect/internal/loop/feedback.go","auto-reflect/internal/miner/score.go","auto-reflect/internal/rules/projection_test.go","auto-reflect/internal/cli/consolidate_integration_test.go","auto-reflect/internal/cli/observation_integration_test.go","auto-reflect/cmd/autoreflect/e2e_loop_test.go","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go","auto-reflect/CLAUDE.md",".claude/skills/reflect-playbook/SKILL.md",".claude/skills/reflect-playbook/references/retrieve.md",".claude/skills/reflect-playbook/references/observe.md",".claude/skills/reflect-playbook/references/mine.md",".claude/skills/reflect-playbook/references/consolidate.md","docs/reflection/observations.yaml"],"anchor":"file-changes"},"order":56,"rel":[]},{"id":"auto-reflect/internal/idhash/idhash.go","type":"file","title":"auto-reflect/internal/idhash/idhash.go","body":"Content-hash id helper (F7).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":57,"rel":[]},{"id":"auto-reflect/internal/idhash/idhash_test.go","type":"file","title":"auto-reflect/internal/idhash/idhash_test.go","body":"Determinism + format tests (F7).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":58,"rel":[]},{"id":"auto-reflect/internal/cli/gap.go","type":"file","title":"auto-reflect/internal/cli/gap.go","body":"`gap list` command (F4).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":59,"rel":[]},{"id":"auto-reflect/internal/cli/gap_integration_test.go","type":"file","title":"auto-reflect/internal/cli/gap_integration_test.go","body":"gap list integration tests (F4).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":60,"rel":[]},{"id":"auto-reflect/internal/cli/doctor.go","type":"file","title":"auto-reflect/internal/cli/doctor.go","body":"`doctor` command (F1).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":61,"rel":[]},{"id":"auto-reflect/internal/cli/doctor_integration_test.go","type":"file","title":"auto-reflect/internal/cli/doctor_integration_test.go","body":"doctor integration tests (F1).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":62,"rel":[]},{"id":"auto-reflect/internal/cli/output.go","type":"file","title":"auto-reflect/internal/cli/output.go","body":"Uniform mutation-result envelope helpers (F5).","tab":"Solution","origin":"plan","meta":{"change":"add"},"order":63,"rel":[]},{"id":"auto-reflect/internal/cli/root.go","type":"file","title":"auto-reflect/internal/cli/root.go","body":"Register `gap` + `doctor` commands.","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":64,"rel":[]},{"id":"auto-reflect/internal/rules/model.go","type":"file","title":"auto-reflect/internal/rules/model.go","body":"`NewRuleID(parts…)` content-derived via idhash (F7).","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":65,"rel":[]},{"id":"TH5","type":"thread","title":"Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id","tab":"Solution","origin":"plan","meta":{"anchor":"auto-reflect/internal/rules/model.go","status":"resolved","priority":"p1","comments":[{"by":"review","md":"There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan."},{"by":"author","md":"Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2."}]},"body":"","order":66,"rel":[{"to":"auto-reflect/internal/rules/model.go","label":"anchored on"}]},{"id":"auto-reflect/internal/observations/model.go","type":"file","title":"auto-reflect/internal/observations/model.go","body":"`NewObservationID(parts…)` content-derived incl. evidence (F7).","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":67,"rel":[]},{"id":"auto-reflect/internal/observations/model_test.go","type":"file","title":"auto-reflect/internal/observations/model_test.go","body":"Update zero-arg id test for the variadic signature (F7).","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":68,"rel":[]},{"id":"auto-reflect/internal/loop/service_test.go","type":"file","title":"auto-reflect/internal/loop/service_test.go","body":"Update zero-arg `NewRuleID` call for the variadic signature (F7).","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":69,"rel":[]},{"id":"TH6","type":"thread","title":"Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set","tab":"Solution","origin":"plan","meta":{"anchor":"auto-reflect/internal/observations/model.go","status":"resolved","priority":"p3","comments":[{"by":"review","md":"Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered."},{"by":"author","md":"Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately."}]},"body":"","order":70,"rel":[{"to":"auto-reflect/internal/observations/model.go","label":"anchored on"}]},{"id":"auto-reflect/internal/cli/consolidate.go","type":"file","title":"auto-reflect/internal/cli/consolidate.go","body":"Feed content to id mint; top-level `ids`; deterministic dry-run id (F5/F7).","tab":"Solution","origin":"plan","meta":{"change":"edit"},"order":71,"rel":[]},{"id":"auto-reflect/internal/cli/observation.go","type":"file","title":"auto-reflect/internal/cli/observation.g change":"delete"},"order":95,"rel":[]},{"id":"S:rejected-alternatives","type":"section","title":"Rejected Alternatives","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["X1","X2","X3","X4","X5","X6","X7","X8"],"anchor":"rejected-alternatives"},"order":96,"rel":[{"to":"X1","label":"contains"},{"to":"X2","label":"contains"},{"to":"X3","label":"contains"},{"to":"X4","label":"contains"},{"to":"X5","label":"contains"},{"to":"X6","label":"contains"},{"to":"X7","label":"contains"},{"to":"X8","label":"contains"}]},{"id":"X1","type":"alternative","title":"F4 via a generic `events list --full` flag","body":"**F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n`gap list` matches the gap→observation mental model and is discoverable.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":97,"rel":[]},{"id":"X2","type":"alternative","title":"F5 wrap every command in `{ok,data}`","body":"**F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\nmore consumers, and fights the repo's \"list returns a plain payload of all\nitems\" convention. Top-level id on mutations + per-element id on reads solves\nthe threading pain with the least breakage.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":98,"rel":[]},{"id":"X3","type":"alternative","title":"F5 additive-only (keep all current shapes, just add `.id`)","body":"**F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n(D-3): leaves the inconsistent nesting in place; we still normalize the shapes.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":99,"rel":[]},{"id":"X4","type":"alternative","title":"F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)","body":"**F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\nand event ids are distinct-in-time records; hashing would collapse them.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":100,"rel":[]},{"id":"X5","type":"alternative","title":"F7 hash + collision suffix","body":"**F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\ncollision is negligible; a suffix breaks the idempotency property and adds a\nstate read at mint.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":101,"rel":[]},{"id":"X6","type":"alternative","title":"F9 append to repo-root `.gitignore`","body":"**F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\nper-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":102,"rel":[]},{"id":"X7","type":"alternative","title":"F1 extend `gate check` instead of a new `doctor`","body":"**F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\nthe conventional health command across auto-* tools.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":103,"rel":[]},{"id":"X8","type":"alternative","title":"F6 \"fix\" inside `Fold`","body":"**F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\nonly gap is the list view dropping them.","tab":"Solution","origin":"plan","meta":{"parent":"S:rejected-alternatives"},"order":104,"rel":[]},{"id":"S:solution-decisions","type":"section","title":"Decisions","summary":"","body":"","tab":"Solution","origin":"plan","meta":{"children":["D-7","D-8","D-9"],"anchor":"solution-decisions"},"order":105,"rel":[]},{"id":"D-7","type":"decision","title":"F5 final shape: top-level id on mutations, per-element id on reads","summary":"Mutations expose .id/.ids; collections stay arrays with a uniform .[].id.","body":"**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array.","tab":"Solution","origin":"plan","meta":{"status":"accepted","by":"charlie"},"order":106,"rel":[]},{"id":"D-8","type":"decision","title":"Content-derived ids: rules + observations only","summary":"r-/ob- become content hashes; rt-/fb-/ev- stay random.","body":"**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids.","tab":"Solution","origin":"plan","meta":{"status":"accepted","by":"charlie"},"order":107,"rel":[]},{"id":"D-9","type":"decision","title":"Pure content hash, no collision suffix","summary":"id = prefix + first 8 hex of sha256(content); identical content → identical id is intended.","body":"**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks).","tab":"Solution","origin":"plan","meta":{"status":"accepted","by":"charlie"},"order":108,"rel":[]},{"id":"S:summary","type":"section","title":"Summary","summary":"","body":"Stand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits.","tab":"Plan","origin":"plan","meta":{"children":[],"anchor":"summary"},"order":109,"rel":[]},{"id":"S:execution-sequence","type":"section","title":"Execution Sequence","summary":"","body":"","tab":"Plan","origin":"plan","meta":{"children":["M2"],"anchor":"execution-sequence"},"order":110,"rel":[]},{"id":"M2","type":"diagram","title":"Phase dependency DAG","body":"","tab":"Plan","origin":"plan","meta":{"code":"flowchart LR\n  P1[P1 Foundations + skeleton] --> P2[P2 Rule content ids]\n  P1 --> P3[P3 Envelope rollout + timestamps]\n  P1 --> P4[P4 Pending count]\n  P1 --> P5[P5 gap list]\n  P5 --> P6[P6 doctor]\n  P2 --> P7[P7 Docs, init, cleanup, e2e]\n  P3 --> P7\n  P4 --> P7\n  P6 --> P7"},"order":111,"rel":[]},{"id":"S:phases","type":"section","title":"Phases","summary":"","body":"","tab":"Plan","origin":"plan","meta":{"children":["P1","P2","P3","P4","P5","P6","P7"],"anchor":"phases"},"order":112,"rel":[]},{"id":"P1","type":"phase","title":"Foundations + walking skeleton","body":"Thin path through every layer the task touches: id minting → command → output\n→ test.","tab":"Plan","origin":"plan","meta":{"status":"done","depends":"","files":"auto-reflect/internal/idhash/idhash.go,auto-reflect/internal/idhash/idhash_test.go,auto-reflect/internal/cli/output.go,auto-reflect/internal/observations/model.go,auto-reflect/internal/observations/model_test.go,auto-reflect/internal/cli/observation.go,auto-reflect/internal/cli/observation_integration_test.go","steps":["P1.1","P1.2","P1.3","P1.4","P1.5","P1.6"]},"order":113,"rel":[{"to":"auto-reflect/internal/idhash/idhash.go","label":"touches"},{"to":"auto-reflect/internal/idhash/idhash_test.go","label":"touches"},{"to":"auto-reflect/internal/cli/output.go","label":"touches"},{"to":"auto-reflect/internal/observations/model.go","label":"touches"},{"to":"auto-reflect/internal/observations/model_test.go","label":"touches"},{"to":"auto-reflect/internal/cli/observation.go","label":"touches"},{"to":"auto-reflect/internal/cli/observation_integration_test.go","label":"touches"}]},{"id": ending_to_mine` (396)","body":"Collapse both onto **one shared counting function** (single source of truth); document exactly which session universe it counts.","tab":"Requirements","origin":"plan","meta":{"priority":"P1","pair":[]},"order":161,"rel":[]},{"id":"F5","type":"finding","title":"Each command nests its minted id differently; `rule promote` top-level `.id` is `null`","body":"**Restructure to a uniform output envelope** with a predictable top-level `.id` / `.ids` (and `.[].id` for collection results). Breaking change to the CLI output contract.","tab":"Requirements","origin":"plan","meta":{"priority":"P2","pair":[]},"order":162,"rel":[]},{"id":"F7","type":"finding","title":"Dry-run ids ≠ apply ids, so you can't pre-stage `promote`","body":"Mint rule & observation ids as **deterministic content hashes** so `--dry-run` == apply. Existing id *formats* preserved.","tab":"Requirements","origin":"plan","meta":{"priority":"","pair":[]},"order":163,"rel":[]},{"id":"F9","type":"finding","title":"`.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked)","body":"`auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**.","tab":"Requirements","origin":"plan","meta":{"priority":"","pair":[]},"order":164,"rel":[]},{"id":"F1","type":"finding","title":"Stale/partial init state undetected (dir exists, no `events/`; legacy 0-byte `feedback.jsonl`)","body":"Add init / `doctor` detection of stale or partial reflect state with a concrete remediation hint.","tab":"Requirements","origin":"plan","meta":{"priority":"","pair":[]},"order":165,"rel":[]},{"id":"F6","type":"finding","title":"Rule `created_at` / `updated_at` come back `\"\"` / `null`","body":"Populate them in the rules projection from the underlying event timestamps (`Event.TS`) — no new stored data needed.","tab":"Requirements","origin":"plan","meta":{"priority":"","pair":[]},"order":166,"rel":[]},{"id":"F8","type":"finding","title":"`outcome` enum & `correction_density` undocumented","body":"Document the `outcome` enum (`success\\|partial\\|fail\\|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`.","tab":"Requirements","origin":"plan","meta":{"priority":"P3","pair":["F3"]},"order":167,"rel":[]},{"id":"F3","type":"finding","title":"`outcome` enum & `correction_density` undocumented","body":"Document the `outcome` enum (`success\\|partial\\|fail\\|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`.","tab":"Requirements","origin":"plan","meta":{"priority":"P3","pair":["F8"]},"order":168,"rel":[]},{"id":"F11","type":"finding","title":"Legacy `docs/reflection/*.yaml` from the superseded process still present","body":"**Remove** the legacy yaml (no migration — old process).","tab":"Requirements","origin":"plan","meta":{"priority":"","pair":[]},"order":169,"rel":[]},{"id":"feedback","type":"feedback","title":"Feedback: how 052 actually went","body":"## Problems faced\n1. **The whole loop \"works locally, fails in CI\" on a single omitempty field** — `TestE2ELoopQuickstart` asserted the `gap list` row carried a `session_id`, but `session_id` is `omitempty` and the feedback event's session resolves from `events.DetectSessionID()` (env vars). The dev shell exported a session id (inherited by the test subprocess), so it passed; the clean CI runner had none → field omitted → CI red. Fix was to pin `AUTO_SESSION_ID` for the e2e loop (first in detection precedence) so the loop runs under one deterministic session, matching how a real agent always runs. Lesson: any test asserting an env-derived/`omitempty` field must set that env explicitly, or it's only testing the dev host.\n2. **F2 root cause was a normalization mismatch, not \"two universes\"** — the 390-vs-396 pending divergence came from `miner status` scope-keying with a scheme-strip that skipped `sharedgit.NormalizeRemoteURL`, while `miner.PendingCount` ran it. Sessions whose `git_remote` was `.git`-suffixed / ssh-form / mixed-case fell out of one count but not the other. The plan's instruction to *reproduce the divergence first* (write the failing assertion before collapsing) was what surfaced it cleanly.\n3. **Content-derived ids + a variadic signature is a silent footgun** — `NewRuleID(parts ...string)` means a missed zero-arg caller still compiles but mints a constant id, which `projection.go` then drops all-but-first of. The plan had already flagged the third caller (`rule create`); without that pin it would have been a build-clean, test-passing data-loss bug.\n\n## Reflections\n- **What was tricky?** The CI-only failure — nothing local reproduced it until I cleared the four session env vars (`env -u …`) to simulate a clean runner. That `env -u` trick became the reliable repro.\n- **What would you tell yourself at the start?** Run the full suite *with the ambient session env cleared* before declaring a phase green, especially for anything touching feedback/gate/gap scope. The e2e phase passed locally and still broke CI.\n- **What did you almost do but didn't?** Almost made `gap list` always emit `session_id` (drop `omitempty`) to satisfy the test — but that diverges from the `events list` convention and papers over the real issue (the loop genuinely had no session). Fixing the *test's* environment was the honest fix.\n- The `--all` pending-universe bug (review thread) was a direct consequence of single-sourcing onto `PendingCount` without threading the scope flag — collapsing duplication is right, but the shared function has to carry every axis the callers varied on.\n\n## Useful context\n- `context.md`'s file:line grounding (especially the F2/F6/F7 sections and the \"third `NewRuleID` caller\" note) was the highest-leverage artifact — it turned each phase into a targeted edit rather than a search.\n- `auto-graph/internal/cli/doctor.go` as the canonical `doctor` template; `cli/events.go` as the closest `gap list` pattern. Mirroring existing siblings kept the new nouns idiomatic.\n- Decisions D-5/D-6/D-9 (envelope = presentation-only, no schema bump; pure content hash, idempotency intended) were the load-bearing constraints — they pre-answered the \"should I change the stored payload?\" and \"should I add a collision suffix?\" questions that came up mid-implementation and in review.\n- `reflect-playbook` is a **managed skill**: edit `skills/reflect-playbook/` source and re-render via full `auto skill sync --locked` (never `--target`, which deletes other rendered skills). Editing the `.claude/` render target directly trips the pre-commit `skills-check`.","tab":"feedback.md","origin":"feedback","meta":{},"order":170,"rel":[]},{"id":"term:Session","type":"term","title":"Session","body":"A complete coding agent interaction from start to finish, across one or more tools (Claude, Codex, etc.). The primary unit of analysis in the platform.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Conversation","chat","transcript","thread"],"avoidNotes":{"Conversation":"","chat":"","transcript":"","thread":""},"has":"many Messages, many Subagents, one Host, one Project"},"order":171,"rel":[{"to":"term:Message","label":"has many"},{"to":"term:Subagent","label":"has many"},{"to":"term:Host","label":"has one"},{"to":"term:Project","label":"has one"}]},{"id":"term:Subagent","type":"term","title":"Subagent","body":"A Session spawned by another Session to handle a subtask. Identified by a parent Session ID and a name.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Child session","nested session","sub-session"],"avoidNotes":{"Child session":"","nested session":"","sub-session":""},"has":"one Session"},"order":172,"rel":[{"to":"term:Session","label":"has one"}]},{"id":"term:Message","type":"term","title":"Message","body":"A single role-tagged exchange within a Session — one of user, assistant, tool, system, or thinking.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Turn","entry","row","line"],"avoidNotes":{"Turn":"","entry":"","row":"","line":""},"has":""},"order":173,"rel":[]},{"id":"term:Host","type":"term","title":"Host","body":"The machine where Sessions are recorded. Identified by a stable host ID persisted in `~/.auto/host.json`.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Machine","server","node","instance"],"avoidNotes":{"Machine":"","server":"","node":"","instance":""},"has":""},"order":174,"rel":[]},{"id":"term:Project","type":"term","title":"Project","body":"A registered repository with cross-host identity via its git remote. One Project can have many Sessions across many Hosts.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Workspace","repo","repository","codebase"],"avoidNotes":{"Workspace":"","repo":"","repository":"","codebase":""},"has":"many Sessions"},"order":175,"rel":[{"to":"term:Session","label":"has many"}]},{"id":"term:Outline","type":"term","title":"Outline","body":"The bodies-free, navigable map of a Session — the Subagent spine, each node's timeline cut into Segments, and per-Message leaves addressable for full-fidelity expansion. What `auto search session outline` returns. An Outline never carries message bodies; it carries the structure and the commands that recover them.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Tree","map","skeleton","summary"],"avoidNotes":{"Tree":"","map":"","skeleton":"","summary":""},"has":"many Segments, many Messages"},"order":176,"rel":[{"to":"term:Segment","label":"has many"},{"to":"term:Message","label":"has many"}]},{"id":"term:Segment","type":"term","title":"Segment","body":"A contiguous run of one Session node's timeline, cut at a deterministic structural boundary (subagent dispatch, tool-failure transition, todo/bead marker, wall-clock gap, tool-kind change) and collapsed to a one-line label plus its `message_index` range and counts. Identified as `<session_id>#s<n>`.","tab":"Glossary","origin":"glossary","meta":{"section":"Session Data","avoid":["Phase","chunk","block","step","span"],"avoidNotes":{"Phase":"","chunk":"","block":"","step":"","span":""},"has":""},"order":177,"rel":[]},{"id":"term:Rule","type":"term","title":"Rule","body":"A distilled, reusable directive extracted from past Session analysis. Has a lifecycle (draft, confirmed, stale) and a type (hard or soft).","tab":"Glossary","origin":"glossary","meta":{"section":"Reflection","avoid":["Guideline","recommendation","lesson","learning","insight"],"avoidNotes":{"Guideline":"","recommendation":"","lesson":"","learning":"","insight":""},"has":""},"order":178,"rel":[]},{"id":"term:Observation","type":"term","title":"Observation","body":"An evidence-grounded finding from a single Session — a correction, pattern, gap, or incident — that may later be consolidated into a Rule.","tab":"Glossary","origin":"glossary","meta":{"section":"Reflection","avoid":["Finding","note","issue","flag"],"avoidNotes":{"Finding":"","note":"","issue":"","flag":""},"has":""},"order":179,"rel":[]},{"id":"term:Playbook","type":"term","title":"Playbook","body":"A versioned snapshot of all Rules for a repository. The human-reviewable artifact that agents retrieve from and teams curate.","tab":"Glossary","origin":"glossary","meta":{"section":"Reflection","avoid":["Rule set","rule collection","rulebook","knowledge base"],"avoidNotes":{"Rule set":"","rule collection":"","rulebook":"","knowledge base":""},"has":"many Rules"},"order":180,"rel":[{"to":"term:Rule","label":"has many"}]},{"id":"term:Event","type":"term","title":"Event","body":"A typed, timestamped record carrying structured data and provenance. Qualified by context: Bus Event (CloudEvents pub/sub envelope), Reflect Event (append-only rule lifecycle log), or Watch Event (trigger/task audit record).","tab":"Glossary","origin":"glossary","meta":{"section":"Automation","avoid":["Notification","alert","hook"],"avoidNotes":{"Notification":"","alert":"","hook":""},"has":""},"order":181,"rel":[]},{"id":"term:TaskDef","type":"term","title":"TaskDef","body":"A named unit of automatable work defined in a Project's watch configuration — either a bash command or a Claude prompt.","tab":"Glossary","origin":"glossary","meta":{"section":"Automation","avoid":["Task","job","action","step"],"avoidNotes":{"Task":"","job":"","action":"","step":""},"has":""},"order":182,"rel":[]},{"id":"term:Trigger","type":"term","title":"Trigger","body":"A named condition that fires and launches one or more TaskDefs — a cron schedule or a file glob pattern.","tab":"Glossary","origin":"glossary","meta":{"section":"Automation","avoid":["Watcher","listener","hook","scheduler"],"avoidNotes":{"Watcher":"","listener":"","hook":"","scheduler":""},"has":"many TaskDefs"},"order":183,"rel":[{"to":"term:TaskDef","label":"has many"}]},{"id":"term:Skill","type":"term","title":"Skill","body":"A named, versioned, distributable agent capability — a reusable prompt, workflow, or reference guide that can be installed, synced, and triggered by agents.","tab":"Glossary","origin":"glossary","meta":{"section":"Skills","avoid":["Plugin","extension","template","command"],"avoidNotes":{"Plugin":"","extension":"","template":"","command":""},"has":""},"order":184,"rel":[]},{"id":"term:Context Pack","type":"term","title":"Context Pack","body":"A curated bundle of source files assembled by auto-graph for an agent — includes file contents, reading order, inter-file relationships, guidance, and token budget accounting.","tab":"Glossary","origin":"glossary","meta":{"section":"Code Intelligence","avoid":["Pack","context bundle","file set","context window"],"avoidNotes":{"Pack":"","context bundle":"","file set":"","context window":""},"has":""},"order":185,"rel":[]},{"id":"term:Mail","type":"term","title":"Mail","body":"The stored unit of an addressed, durable message between agents on a Host — immutable once sent, and retired only by an explicit ack.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Message","email","letter","note"],"avoidNotes":{"Message":"that word already names a Session exchange","email":"","letter":"","note":""},"has":"many Deliveries"},"order":186,"rel":[{"to":"term:Delivery","label":"has many"}]},{"id":"term:Address","type":"term","title":"Address","body":"A virtual, free-form name a Mail is sent to. Carries no physical identity — no Host, Session, pane or process is derivable from it.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Mailbox","queue","topic","channel","inbox"],"avoidNotes":{"Mailbox":"","queue":"","topic":"","channel":"","inbox":""},"has":"many Subscriptions"},"order":187,"rel":[{"to":"term:Subscription","label":"has many"}]},{"id":"term:Subscription","type":"term","title":"Subscription","body":"A durable reader of an Address, holding its own cursor and its own ack state.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Subscriber","consumer","listener","reader"],"avoidNotes":{"Subscriber":"","consumer":"","listener":"","reader":""},"has":"many Deliveries, one Binding"},"order":188,"rel":[{"to":"term:Delivery","label":"has many"},{"to":"term:Binding","label":"has one"}]},{"id":"term:Delivery","type":"term","title":"Delivery","body":"The per-Subscription copy of one Mail together with its read and ack state.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Receipt","copy","inbox item"],"avoidNotes":{"Receipt":"","copy":"","inbox item":""},"has":""},"order":189,"rel":[]},{"id":"term:Handle","type":"term","title":"Handle","body":"A relative alias for an Address, written with a leading `#`, resolved at send time and never stored — the stored envelope always carries the resolved absolute Address. Today there is exactly one: `#parent`, the supervisor of an in-process Subagent.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Alias","shortcut","relative address","magic address"],"avoidNotes":{"Alias":"","shortcut":"","relative address":"","magic address":""},"has":"one Address"},"order":190,"rel":[{"to":"term:Address","label":"has one"}]},{"id":"term:Binding","type":"term","title":"Binding","body":"The current physical target of a Subscription, recorded as an opaque `(manager, target)` pair.","tab":"Glossary","origin":"glossary","meta":{"section":"Mail","avoid":["Pane","session link","attachment","route"],"avoidNotes":{"Pane":"","session link":"","attachment":"","route":""},"has":""},"order":191,"rel":[]},{"id":"term:Lock","type":"term","title":"Lock","body":"A serial-update reservation on one Group of a Project, held by exactly one Worker at a time and recorded in the host-global lock store. Taken explicitly with `auto lock take`, freed by `release`, or recovered by a merge-verified `clear` or lost-liveness reclaim — never by a TTL.","tab":"Glossary","origin":"glossary","meta":{"section":"Locks","avoid":["Mutex","reservation","claim","hold","file lock"],"avoidNotes":{"Mutex":"","reservation":"","claim":"","hold":"","file lock":""},"has":"one Group, one Worker, one Project, one Host"},"order":192,"rel":[{"to":"term:Group","label":"has one"},{"to":"term:Worker","label":"has one"},{"to":"term:Project","label":"has one"},{"to":"term:Host","label":"has one"}]},{"id":"term:Group","type":"term","title":"Group","body":"A named, described set of files (one or more repo-relative globs) declared in a Project's `.auto/lock/settings.json` that must be edited serially. The lockable unit — a Lock covers the whole Group, never individual files.","tab":"Glossary","origin":"glossary","meta":{"section":"Locks","avoid":["Lock set","glob set","file group","pattern"],"avoidNotes":{"Lock set":"","glob set":"","file group":"","pattern":""},"has":"one Project"},"order":193,"rel":[{"to":"term:Project","lab ternal/cli/init.go","auto-reflect/internal/cli/init_test.go","auto-reflect/internal/cli/quickstart.go","auto-reflect/internal/loop/feedback.go","auto-reflect/internal/miner/score.go","auto-reflect/internal/rules/projection_test.go","auto-reflect/internal/cli/consolidate_integration_test.go","auto-reflect/internal/cli/observation_integration_test.go","auto-reflect/cmd/autoreflect/e2e_loop_test.go","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go","auto-reflect/CLAUDE.md",".claude/skills/reflect-playbook/SKILL.md",".claude/skills/reflect-playbook/references/retrieve.md",".claude/skills/reflect-playbook/references/observe.md",".claude/skills/reflect-playbook/references/mine.md",".claude/skills/reflect-playbook/references/consolidate.md","docs/reflection/observations.yaml","S:rejected-alternatives","S:solution-decisions","D-7","D-8","D-9","S:summary","S:execution-sequence","M2","S:phases","P1","P2","P3","P4","P5","P6","P7","S:success-criteria"]}}</script>
<script>
"use strict";
const ALL = JSON.parse(document.getElementById('plan-data').textContent);

/* ======================= configuration ======================= */
const TYPE = {
  home:['Main page','home'], special:['Special page','special'], section:['Section','section'], guardrail:['Guard rail','guardrail'],
  finding:['Finding','finding'], decision:['Decision','decision'], epicdecision:['Epic decision','epicdecision'], ac:['Acceptance criterion','ac'],
  thread:['Review thread','thread'], phase:['Phase','phase'], step:['Step','step'], file:['File change','file'], path:['Referenced path','path'],
  command:['Command','command'], transcript:['CLI transcript','transcript'], term:['Glossary term','term'], diagram:['Diagram','diagram'],
  api:['API','api'], symbol:['Symbol','symbol'], epictask:['Epic task','epictask'], journey:['Journey','journey'], seam:['Seam','seam'],
  assumption:['Assumption','assumption'], risk:['Known gap / risk','risk'], alternative:['Rejected alternative','alternative'],
  feedback:['Post-execution feedback','feedback'], address:['Address (example)','address'], eventtype:['Event type','eventtype'], wanted:['Wanted page','wanted']
};
const tc = t => `var(--t-${t})`;
const TERMS = {
  '062':['Mail','Address','Subscription','Delivery','Binding','Handle','Session','Message','Host','Project','Subagent','Event','Skill'],
  '052':['Rule','Observation','Playbook','Session','Message','Event','Project','Host','Skill','Subagent']
};
const TOOL = {'062':'auto mail','052':'auto reflect'};
const PATHS = {
  '062':['home','S:problem','S:scope-statement','C1','S:goals','G16','term:Mail','S:inherited-rails','G8','D-062-1','D-062-2','TH1','D-062-3','S:approach','D-062-8','M2','S:end-state-schema','mail.Client','S:execution-sequence','P1','P2','P3','P4','P5','AC-13','S:verification-gaps','special:map'],
  '052':['home','S:problem','S:goals','F4','D-1','F2','F5','D-3','D-7','F7','D-9','S:approach','CLI1','S:execution-sequence','P1','P2','TH5','P3','P4','P5','P6','P7','AC-14','S:verification-gaps','feedback','special:changes']
};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
marked.setOptions({gfm:true,breaks:false});
const md = s => marked.parse(s||'');
const mdi = s => marked.parseInline(s||'');

/* ======================= graph construction ======================= */
let G = null; // current plan graph
function buildGraph(key){
  const P = ALL[key];
  const g = {key, doc:P.doc, tabs:P.tabs, linear:P.linear, nodes:new Map(), out:new Map(), inn:new Map(), cmdKeys:new Set(), aliases:new Map(), lint:new Map(), lintTotal:0};
  for(const n of P.nodes){ g.nodes.set(n.id, structuredClone(n)); }
  const specials = [
    ['special:map','The map','Every node of this plan as one web, laid out by force. Hover to preview, click to open.'],
    ['special:changes','Recent changes','Every file this plan adds, edits or deletes — and the existing code it only cites.'],
    ['special:linear','The linear plan','The whole plan in its original order, every node transcluded — the escape hatch back to the document.'],
    ['special:lint','Avoid-term lint','Words from the glossary’s _Avoid_ lists found in this plan’s prose.'],
    ['special:wanted','Wanted pages','IDs mentioned in the text that no node defines — the web’s red links.'],
    ['special:index','All pages','Every node, grouped by kind.']
  ];
  for(const [id,title,summary] of specials) g.nodes.set(id,{id,type:'special',title,summary,body:'',meta:{},rel:[]});
  // addresses and event types, from transcripts + code spans
  const addrs = new Set();
  for(const n of g.nodes.values()) if(n.type==='transcript') for(const s of n.meta.steps){
    for(const m of (s.out||'').matchAll(/"(?:address|to|from)"\s*:\s*"([^"]+)"/g)) addrs.add(m[1]);
    const t = s.cmd.match(/--to\s+(\S+)/); if(t) addrs.add(t[1]);
    const sub = s.cmd.match(/subscribe\s+(\S+)/); if(sub) addrs.add(sub[1]);
  }
  for(const a of addrs) g.nodes.set('addr:'+a,{id:'addr:'+a,type:'address',title:a,body:'',meta:{},rel:[{to:'term:Address',label:'is an'}],derived:true});
  // pre-scan all markdown for code spans to register commands, event types
  const texts = [];
  for(const n of g.nodes.values()){ texts.push(n.body||'', n.summary||'', n.title||''); if(n.meta?.comments) n.meta.comments.forEach(c=>texts.push(c.md)); if(n.meta?.steps && n.type==='transcript') n.meta.steps.forEach(s=>texts.push('`'+s.cmd+'`')); }
  for(const t of texts) for(const m of t.matchAll(/`([^`\n]+)`/g)){
    const c = m[1].trim();
    const ck = cmdKey(c); if(ck) g.cmdKeys.add(ck);
    if(/^alpha\.mail\.[a-z*]+$/.test(c) && !c.endsWith('*')) g.nodes.set('evt:'+c, g.nodes.get('evt:'+c) || {id:'evt:'+c,type:'eventtype',title:c,body:'',meta:{},rel:[{to:'term:Event',label:'is an'}],derived:true});
  }
  for(const k of g.cmdKeys){
    const id='cmd:'+k;
    if(!g.nodes.has(id)) g.nodes.set(id,{id,type:'command',title:k,body:'',meta:{invocations:[]},rel:[],derived:true});
    const tool = TOOL[key]+' ';
    if(k.startsWith(tool)){ const tail=k.slice(tool.length); if(tail) g.aliases.set(tail,id); }
  }
  for(const n of g.nodes.values()) if(n.type==='transcript') n.meta.steps.forEach(s=>{ const k=cmdKey(s.cmd); if(k){ const c=g.nodes.get('cmd:'+k); c.meta.invocations.push({...s,from:n.id}); c.rel.push({to:n.id,label:'shown in'});} });
  // file suffix index
  g.files = [...g.nodes.values()].filter(n=>n.type==='file').map(n=>n.id);
  // linkers
  const terms = TERMS[key].filter(t=>g.nodes.has('term:'+t));
  g.termForms = new Map();
  for(const t of terms){ const forms=[t,t+'s',t+'es',t.replace(/y$/,'ies')]; for(const f of forms){ g.termForms.set(f.toLowerCase(),'term:'+t);} }
  g.avoid = new Map();
  for(const t of terms){ const n=g.nodes.get('term:'+t); for(const a of n.meta.avoid){ const w=a.toLowerCase(); if(!g.avoid.has(w)) g.avoid.set(w,'term:'+t); } }
  const idAlt = key==='062'
    ? String.raw`D-062-\d+|AC-\d{1,2}|D-\d{1,2}|G\d{1,2}|T[1-4]|C1|J[12]|(?<!\()P\d(?:\.\d{1,2})?(?!\))|[Pp]hase \d|[Ss]eam \d`
    : String.raw`AC-\d{1,2}|D-\d{1,2}|F\d{1,2}|(?<!\()P\d(?:\.\d{1,2})?(?!\))|[Pp]hase \d`;
  const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
  const termAlt = [...new Set([...g.termForms.keys()].flatMap(f=>[f,cap(f)]))].sort((a,b)=>b.length-a.length).map(reEsc).join('|');
  const avoidForms = []; for(const w of g.avoid.keys()){ avoidForms.push(w, w+'s', cap(w), cap(w)+'s'); }
  const avoidAlt = [...new Set(avoidForms)].sort((a,b)=>b.length-a.length).map(w=>reEsc(w).replace(/ /g,'\\s+')).join('|');
  const fileAlt = g.files.slice().sort((a,b)=>b.length-a.length).map(reEsc).join('|');
  g.re = new RegExp(String.raw`(?<file>(?<![\w/.-])(?:${fileAlt})(?![\w/-]))|(?<id>\b(?:${idAlt})\b)|(?<term>\b(?:${termAlt})\b)|(?<avoid>\b(?:${avoidAlt})\b)`,'g');
  g.idRe = new RegExp(String.raw`^(?:${idAlt})$`);
  G = g;
  // render all article bodies (collect edges)
  for(const n of [...g.nodes.values()]) if(n.type!=='special' && n.type!=='home') renderArticle(n,true);
  // structural edges
  for(const n of g.nodes.values()) if(n.type==='section') for(const c of (n.meta.children||[])) if(!(n.rel||[]).some(r=>r.to===c)) n.rel.push({to:c,label:'contains'});
  for(const n of g.nodes.values()) for(const r of (n.rel||[])){ const to=resolveRelTarget(r.to); if(to) addEdge(n.id,to,{label:r.label,structural:true}); }
  // lint total
  let tot=0; for(const v of g.lint.values()) tot+=v.length; g.lintTotal=tot;
  return g;
}
function resolveRelTarget(t){
  if(G.nodes.has(t)) return t;
  if(G.idRe.test(t)) return wanted(t);
  return null;
}
function cmdKey(c){
  if(!/^auto\s/.test(c)) return null;
  const toks=c.split(/\s+/); const out=[];
  for(const t of toks){ if(/^[a-z][a-z-]*$/.test(t) && out.length<4) out.push(t); else break; }
  return out.length>=2 ? out.join(' ') : null;
}
function wanted(id){
  if(!G.nodes.has(id)) G.nodes.set(id,{id,type:'wanted',title:id,body:'',meta:{},rel:[],derived:true});
  return id;
}
function addEdge(from,to,info){
  if(from===to) return;
  if(!G.out.has(from)) G.out.set(from,new Map());
  if(!G.inn.has(to)) G.inn.set(to,new Map());
  const o=G.out.get(from), i=G.inn.get(to);
  const prev=i.get(from);
  if(prev){ prev.count+=info.structural?0:1; if(info.structural && !prev.labels.includes(info.label)) prev.labels.push(info.label); if(!prev.snip && info.snip) prev.snip=info.snip; return; }
  const e={count:info.structural?0:1,labels:info.structural?[info.label]:[],snip:info.snip||null};
  i.set(from,e); o.set(to,e);
}

/* ---------- code-span resolution ---------- */
const PATHISH = /^(?:~\/|\.{0,2}\/)?[\w.@-]+(?:\/[\w.@*<>-]*)+$|^[\w.-]+\.(?:go|md|py|json|jsonl|yaml|yml|sh|html|db|mod|sum|toml)(?::\d+(?:-\d+)?)?$/;
function resolveCode(raw){
  const t = raw.trim();
  if(G.nodes.has(t) && !['special','home'].includes(G.nodes.get(t).type)) return t;
  if(G.nodes.has('addr:'+t)) return 'addr:'+t;
  if(G.nodes.has('evt:'+t)) return 'evt:'+t;
  if(G.idRe.test(t)) return wanted(t);
  const ck = cmdKey(t); if(ck && G.nodes.has('cmd:'+ck)) return 'cmd:'+ck;
  // alias: tool tails e.g. `gap list`, `doctor`, `send --to …`
  const toks=t.split(/\s+/);
  for(let k=Math.min(3,toks.length);k>=1;k--){ const a=toks.slice(0,k).join(' '); if(G.aliases.has(a) && (k===toks.length || /^(--|<|\S+$)/.test(toks[k]))) return G.aliases.get(a); }
  // symbols
  const sm = t.match(/^(?:mail\.)?([A-Za-z_]\w*)/);
  if(t==='mail.Client' || t==='Client') return G.nodes.has('mail.Client')?'mail.Client':null;
  if(sm && G.nodes.has('sym:'+sm[1]) && (t===sm[0] || /^[(\s]/.test(t.slice(sm[0].length)))) return 'sym:'+sm[1];
  if(G.termForms.has(t.toLowerCase()) && /^[A-Z]/.test(t)) return G.termForms.get(t.toLowerCase());
  // paths
  let p = t.replace(/:\d+(?:-\d+)?$/,'').replace(/\/$/,'');
  if(/\s/.test(p) || p.startsWith('-') || p.startsWith('http')) return null;
  if(!PATHISH.test(t) && !PATHISH.test(p)) return null;
  if(G.nodes.has(p) && G.nodes.get(p).type==='file') return p;
  const suf = G.files.filter(f=>f.endsWith('/'+p));
  if(suf.length===1) return suf[0];
  if(/^[A-Z]/.test(p) && !p.includes('/') && !p.includes('.')) return null;
  const id='path:'+p;
  if(!G.nodes.has(id)) G.nodes.set(id,{id,type:'path',title:p,body:'',meta:{runtime:p.startsWith('~')},rel:[],derived:true});
  return id;
}

/* ---------- linkify a rendered DOM subtree ---------- */
const BLOCK = 'p,li,td,th,blockquote,h1,h2,h3,h4,pre,.cmd,.out,.note,.sig,dd,.snipsrc,.mem,.cmt';
function mkLink(to, text, cls){
  const n=G.nodes.get(to); const a=document.createElement('a');
  a.className='hl '+(cls||'')+(n && n.type==='wanted'?' wanted':''); a.dataset.to=to; a.style.setProperty('--tc',tc(n?n.type:'wanted'));
  a.href='#'; if(typeof text==='string') a.textContent=text; else if(text) a.appendChild(text);
  return a;
}
function snippetOf(blockText, matchText){
  const bt = blockText.replace(/\s+/g,' ').trim(); let i = -1;
  try{ const mm = new RegExp('(^|[^\\w/.-])'+reEsc(matchText)+'(?![\\w/-])').exec(bt); if(mm) i = mm.index + mm[1].length; }catch(e){}
  if(i<0) i = bt.indexOf(matchText);
  const a = Math.max(0,i-110), b = Math.min(bt.length, (i<0?0:i)+matchText.length+130);
  if(i<0) return esc(bt.slice(0,240))+(bt.length>240?'…':'');
  return (a>0?'…':'')+esc(bt.slice(a,i))+'<mark>'+esc(matchText)+'</mark>'+esc(bt.slice(i+matchText.length,b))+(b<bt.length?'…':'');
}
function linkify(root, fromId, collect){
  const seenTerms = new WeakMap();
  // 1) code spans
  root.querySelectorAll('code').forEach(c=>{
    if(c.closest('pre') || c.closest('a')) return;
    const to = resolveCode(c.textContent);
    if(!to || to===fromId) return;
    const a = mkLink(to, null, 'codel'); c.replaceWith(a); a.appendChild(c);
    if(collect){ const blk=a.closest(BLOCK)||root; addEdge(fromId,to,{snip:snippetOf(blk.textContent,c.textContent)}); }
  });
  // 2) text nodes
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(t){
    const p=t.parentElement; if(!p) return NodeFilter.FILTER_REJECT;
    if(p.closest('code,pre,a,.nolink,svg')) return NodeFilter.FILTER_REJECT;
    return t.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const tnodes=[]; while(walker.nextNode()) tnodes.push(walker.currentNode);
  for(const t of tnodes){
    const s=t.nodeValue; G.re.lastIndex=0; let m, last=0; const frag=document.createDocumentFragment(); let changed=false;
    const blk = t.parentElement.closest(BLOCK)||root;
    let seen = seenTerms.get(blk); if(!seen){ seen=new Set(); seenTerms.set(blk,seen); }
    while((m=G.re.exec(s))){
      const txt=m[0]; let node=null;
      if(m.groups.file){ const to=m.groups.file; if(to!==fromId){ node=mkLink(to,txt,'codel'); if(collect) addEdge(fromId,to,{snip:snippetOf(blk.textContent,txt)}); } }
      else if(m.groups.id){
        let id=txt; const ph=txt.match(/^[Pp]hase (\d)$/); if(ph) id='P'+ph[1];
        const sm=txt.match(/^[Ss]eam (\d)$/); if(sm) id='Seam '+sm[1];
        if(!G.nodes.has(id)){ if(/^[Pp]hase/.test(txt)) id=null; else wanted(id); }
        if(id && id!==fromId){ node=mkLink(id,txt,'idl'); if(collect) addEdge(fromId,id,{snip:snippetOf(blk.textContent,txt)}); }
      }
      else if(m.groups.term){
        const to=G.termForms.get(txt.toLowerCase());
        const av = G.avoid.get(txt.toLowerCase()) || G.avoid.get(txt.toLowerCase().replace(/s$/,''));
        if(to && !seen.has(to) && to!==fromId){ seen.add(to); node=mkLink(to,txt,'term'); if(collect) addEdge(fromId,to,{snip:snippetOf(blk.textContent,txt)}); }
        if(av){ const sp=document.createElement('span'); sp.className='avoid'; sp.dataset.avoid=txt.toLowerCase(); sp.dataset.owner=av; if(node){ node.classList.add('avoid'); node.dataset.avoid=txt.toLowerCase(); node.dataset.owner=av; } else { sp.textContent=txt; node=sp; } if(collect) recordLint(fromId,txt,av,blk); }
      }
      else if(m.groups.avoid){
        const w=txt.toLowerCase().replace(/\s+/g,' '); const owner=G.avoid.get(w)||G.avoid.get(w.replace(/s$/,''));
        if(owner && owner!==fromId){ const sp=document.createElement('span'); sp.className='avoid'; sp.dataset.avoid=w; sp.dataset.owner=owner; sp.textContent=txt; node=sp; if(collect) recordLint(fromId,txt,owner,blk); }
      }
      if(node){ frag.appendChild(document.createTextNode(s.slice(last,m.index))); frag.appendChild(node); last=m.index+txt.length; changed=true; }
    }
    if(changed){ frag.appendChild(document.createTextNode(s.slice(last))); t.replaceWith(frag); }
  }
}
function recordLint(from,txt,owner,blk){
  const w=txt.toLowerCase().replace(/\s+/g,' ');
  if(!G.lint.has(w)) G.lint.set(w,[]);
  G.lint.get(w).push({from,owner,snip:snippetOf(blk.textContent,txt)});
}

function idLink(id, label){ const n=G.nodes.get(id); if(!n) return esc(label||id); return `<a class="hl idl" data-to="${esc(id)}" href="#" style="--tc:${tc(n.type)}">${esc(label||displayId(n))}</a>`; }
function titleLink(id){ const n=G.nodes.get(id); if(!n) return esc(id); return `<a class="hl" data-to="${esc(id)}" href="#" style="--tc:${tc(n.type)}">${mdi(esc(n.title))}</a>`; }
function displayId(n){ if(!n) return ''; if(n.type==='term') return n.title; if(['address','command','eventtype','path'].includes(n.type)) return n.title; if(n.type==='symbol') return n.title; if(n.id.startsWith('S:')) return '§'; if(n.type==='file') return n.id.split('/').pop(); return n.id; }
function row(id, extra=''){ const n=G.nodes.get(id); if(!n) return ''; return `<div class="linkrow"><span class="idcol">${n.type==='section'?chipFor('section'):idLink(id)}</span><span>${titleLink(id)}${extra}</span></div>`; }
function changeMark(c){ return `<span class="chg ${c}">${c==='add'?'+':c==='delete'?'−':'~'}</span>`; }

function renderTranscript(n){

function phaseShapeSVG(phases){

  const W=560, nc=Object.keys(cols).length, maxr=Math.max(...Object.values(cols).map(c=>c.length));
  const H=Math.max(70, maxr*38+16); const pos={};
  Object.entries(cols).forEach(([d,ids])=>ids.forEach((id,i)=>{ pos[id]=[30+ (+d)*( (W-60)/Math.max(1,nc-1) ), H/2 + (i-(ids.length-1)/2)*38]; }));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:6px 0 4px">`;
  phases.forEach(p=>(p.meta.depends||'').split(',').filter(Boolean).forEach(d=>{ const a=pos['P'+d.trim()], b=pos[p.id]; s+=`<path d="M${a[0]},${a[1]} C${(a[0]+b[0])/2},${a[1]} ${(a[0]+b[0])/2},${b[1]} ${b[0]},${b[1]}" fill="none" stroke="var(--t-phase)" stroke-width="1.6" opacity=".6"/>`; }));

  return s+'</svg>';
}

    const refs=ns.filter(x=>x.type==='path').sort((a,b)=>((G.inn.get(b.id)||new Map()).size)-((G.inn.get(a.id)||new Map()).size));
    h+=`<h2 class="sub">Cited, not changed · ${refs.length}</h2><p class="hint">Existing code, docs and runtime paths the plan points at while reasoning.</p><div style="display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px">${refs.map(r=>`${idLink(r.id)}<span class="hint">×${(G.inn.get(r.id)||new Map()).size}</span>`).join('')}</div>`;

    const rows=[...G.lint.entries()].sort((a,b)=>b[1].length-a[1].length);

    const w=ns.filter(x=>x.type==='wanted');
    h+= w.length? w.map(x=>row(x.id, ` <span class="hint">· ${(G.inn.get(x.id)||new Map()).size} referrers</span>`)).join('') : `<p>None — every ID mentioned in this plan resolves to a node.</p>`;
  }
