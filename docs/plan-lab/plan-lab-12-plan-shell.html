  <div class="desc" style="margin:6px 0 4px">Goals <span class="gl gl-g">◎</span>, ACs ${glyph('ac')}, decisions <span class="gl gl-d">◆</span>, rails/findings <span class="gl gl-r">▲</span>, phases <span class="gl gl-p">▷</span> and call stacks <span class="gl gl-cs">≡</span> are folders; their contents are symlinks to what they depend on. <code>/repo</code> holds the files the plan touches, down to symbols. Click anything — it types the command for you.</div>`;
  for (const g of Object.keys(groups)) {
    h += `<div style="margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tmute)">${groups[g]}</div><div class="rows" style="grid-template-columns:190px 1fr;font-family:var(--mono);font-size:12px">`;
    for (const c of Object.values(CMDS).filter(c => c.group === g)) h += `<span class="lk" data-cmd="man ${c.name}">${esc(c.usage)}</span><span class="dim tt">${esc(c.desc)}</span>`;
    h += `</div>`;
  }
  h += `<div class="legend" style="margin-top:12px"><span><span class="kbd">Tab</span> complete</span><span><span class="kbd">↑↓</span> history</span><span><span class="kbd">→</span> accept ghost</span><span><span class="kbd">Esc</span> skip / stop</span><span><span class="kbd">Ctrl L</span> clear</span><span>bare ids work: <code>AC6</code> = <code>cat AC6</code></span></div></div>`;
  out(h);
}

function parseFlags(a) { const f = {}, rest = []; for (let i = 0; i < a.length; i++) { const x = a[i]; if (x === '-L') { f.L = +a[++i] || 2; } else if (/^-[a-zA-Z]+$/.test(x)) x.slice(1).split('').forEach(c => f[c] = true); else rest.push(x); } return {f, rest}; }
function need(arg, cmd) {
  const r = resolve(arg);
  if (r.node) return r.node;
  if (r.many) { out(`<span class="dim">${esc(cmd)}: “${esc(arg)}” is ambiguous —</span>` + r.many.slice(0, 12).map(n => `<div>  ${icon(n)} <span class="lk" data-cmd="${esc(cmd)} ${esc(qp(n.path))}">${esc(n.path)}</span></div>`).join('')); return null; }
  errOut(`${esc(cmd)}: ${esc(arg)}: no such file, id or symbol <span class="dim">— try</span> <span class="lk" data-cmd="grep ${esc(arg)}">grep ${esc(arg)}</span>`);
  return null;
}

function cmdLs(a) {
  const {f, rest} = parseFlags(a);
  const n0 = rest.length ? need(rest[0], 'ls') : S.cwd; if (!n0) return;
  const n = real(n0);
  if (!n.children) { out(`${icon(n)} ${pathLink(n)} <span class="dim">${esc(short(metaOf(n), 80))}</span>`); touch(n); return; }
  const ks = kids(n);
  if (!ks.length) return out('<span class="dim">(empty)</span>');
  if (n.type === 'file') { out(symtab(n)); touch(n); return; }
  const plainGrid = !f.l && n.type === 'dir' && n.kind !== 'coll' && (n.path.startsWith('/repo') || n === S.root);
  if (plainGrid) {
    out(`<div class="ls">${ks.map(k => `<span>${icon(k)} <span class="lk ${k.type === 'file' ? 't-' + k.obj.change : k.type === 'dir' ? 't-p' : ''}" data-cmd="${esc(cmdFor(k))}" data-tip="${esc(short(metaOf(k), 110))}">${esc(k.name)}${k.type === 'dir' ? '/' : ''}</span></span>`).join('')}</div>`);
  } else {
    out(`<div class="rows">${ks.map(k => {
      const r = real(k);
      const nm = k.type === 'link' ? `<span class="dim">↪</span> ` : '';
      const label = k.type === 'link' && r.type === 'ent' ? r.obj.id : k.name;
      const cls = r.type === 'ent' ? 't-' + KINDS[r.kind].c : r.type === 'file' ? 't-' + r.obj.change : r.type === 'dir' ? 't-p' : '';
      return `<span>${icon(k)}</span><span class="lk ${cls}" data-cmd="${esc(cmdFor(k))}">${nm}${esc(label)}${r.type === 'dir' ? '/' : ''}</span><span class="dim tt">${f.l && r.type === 'file' ? `${CHGWORD[r.obj.change]} · ${(r.obj.symbols || []).length} sym · ` : ''}${esc(short(metaOf(k), 120))}</span>`;
    }).join('')}</div>`);
  }
  if (n !== S.cwd) touch(n);
}
function cmdCd(a) {
  let n;
  if (!a.length) n = S.root;
  else if (a[0] === '-') n = S.prev;
  else { n = need(a[0], 'cd'); if (!n) return; }
  n = real(n);
  if (!n.children) { n = n.parent; out(`<span class="dim">cd: that is a leaf — moved to its folder</span>`); }
  S.prev = S.cwd; S.cwd = n; S.peek = null;
  touch(n, {peek:false});
  if (n.type === 'dir' && n.kind !== 'coll' && n !== S.root) { S.hot = new Set(); S.warm = new Set(); }
}
function treeLines(n, prefix, depth, maxD, syms, lines) {
  const ks = kids(n);
  ks.forEach((k, i) => {
    const last = i === ks.length - 1, r = real(k);
    const meta = r.type === 'ent' ? short(r.obj.title || r.obj.def, 64) : r.type === 'file' && !syms ? `${(r.obj.symbols || []).length} sym` : r.type === 'sym' ? short(r.obj.sig || '', 50) : '';
    const label = k.type === 'link' && r.type === 'ent' ? r.obj.id : k.name;
    const cls = r.type === 'ent' ? 't-' + KINDS[r.kind].c : r.type === 'file' ? 't-' + r.obj.change : r.type === 'dir' ? 't-p' : '';
    lines.push(`<div class="tl"><span class="fnt">${prefix}${last ? '└── ' : '├── '}</span>${icon(k)} <span class="lk ${cls}" data-cmd="${esc(cmdFor(k))}">${k.type === 'link' ? '<span class="dim">↪</span>' : ''}${esc(label)}${r.type === 'dir' ? '/' : ''}</span> <span class="dim">${esc(meta)}</span></div>`);
    if (k.type !== 'link' && r.children && depth + 1 < maxD && (r.type !== 'file' || syms)) treeLines(r, prefix + (last ? '    ' : '│   '), depth + 1, maxD, syms, lines);
  });
}
function cmdTree(a) {
  const {f, rest} = parseFlags(a);
  const n0 = rest.length ? need(rest[0], 'tree') : S.cwd; if (!n0) return;
  const n = real(n0);
  const maxD = f.L || (n === S.root ? 2 : 8);
  const syms = f.s || n.type === 'file';
  const lines = [`<div class="tl">${icon(n)} <b>${esc(n.path)}</b></div>`];
  treeLines(n, '', 0, maxD, syms, lines);
  out(`<div style="font-size:12.3px">${lines.join('')}</div>` + (lines.length > 3 && !syms && n.path.startsWith('/repo') ? `<div class="dim" style="margin-top:4px">files collapse to a symbol count — <span class="lk" data-cmd="tree ${esc(qp(n.path))} -s">tree -s</span> expands them</div>` : ''));
  touch(n);
}

/* ------------------------------------------------------------- cards */
function kvRow(k, v) { return v ? `<div>${k}</div><div>${v}</div>` : ''; }
function pills(ids) { ids = uniq(ids || []); return ids.length ? `<div class="pills">${ids.map(pill).join('')}</div>` : ''; }
function stacksWith(pred) { return S.M.callstacks.filter(pred).map(c => c.id); }
function pkgOfFile(path) { return S.M.deps.nodes.find(n => (n.files || []).includes(path)); }
function cardHead(glyphHtml, id, path, extra) { return `<div class="ch"><span class="big">${glyphHtml}</span><span class="id">${esc(id)}</span>${extra || ''}<span class="path">${esc(path)}</span></div>`; }
function cmdbox(cmd, withRun) {
  return `<div class="cmdbox"><div class="c">${esc(cmd)}</div><button class="act" data-copy="${esc(cmd)}">copy</button>${withRun ? `<button class="act go" data-cmd="${esc(withRun)}">▶ ${esc(withRun)}</button>` : ''}</div>`;
}
function symtab(fn) {
  const syms = Object.values(fn.children);
  if (!syms.length) return `<div class="dim" style="margin-top:6px">no symbols listed (non-code file)</div>`;
  return `<div class="symtab">${syms.map(s => `<span class="t-${s.obj.change}" style="font-weight:800">${CHG[s.obj.change] || '·'}</span>${kb(s.obj.kind)}<span class="nm lk ${s.obj.change === 'same' ? 'dim' : ''}" data-cmd="cat ${esc(qp(s.path))}">${esc(s.obj.name)}</span><span class="sig" data-tip="${esc(s.obj.sig || '')}${s.obj.note ? ' — ' + esc(s.obj.note) : ''}">${esc(s.obj.sig || s.obj.note || '')}</span>`).join('')}</div>`;
}
function cardFor(n) {
  const M = S.M, o = n.obj;
  if (n.type === 'doc' && n.kind === 'readme') {
    const P = M.plan, kind = P.kind;
    const counts = [['goals', M.goals.length, 'goal'], ['acs', M.acs.length, 'ac'], ['decisions', M.decisions.length, 'dec'], M.rails ? ['rails', M.rails.length, 'rail'] : ['findings', M.findings.length, 'find'], ['phases', M.phases.length, 'phase'], ['stacks', M.callstacks.length, 'cs']];
    return `<div class="card">${cardHead('≣', 'README.md', '/README.md')}
      <div style="font-family:var(--mono);font-size:11px;color:${kind === 'greenfield' ? 'var(--tadd)' : 'var(--tedit)'};margin-top:6px;letter-spacing:.06em;text-transform:uppercase">${kind === 'greenfield' ? '◌ greenfield — a fresh volume' : '◍ brownfield — an overlay on existing code'}</div>
      <h3>${esc(P.id)} · ${esc(P.title)}</h3><div>${rich(P.oneLiner)}</div>
      <details class="more"><summary>the problem</summary><div>${rich(P.problem)}</div></details>
      <div class="pills" style="margin-top:10px">${counts.map(([d, c, k]) => `<span class="pill" data-cmd="ls /${d}">${glyph(k)} ${c} ${d}</span>`).join('')}<span class="pill" data-cmd="du /repo">▸ ${M.files.length} files</span></div>
      <div class="kv">${kvRow('commits', `<code>${esc(P.baseCommit)}</code> → <code>${esc(P.builtCommit)}</code>`)}${kvRow('pr', P.pr ? `<a class="lk" href="${esc(P.pr)}" target="_blank" rel="noopener">${esc(P.pr.replace('https://github.com/', ''))}</a>` : '')}${P.epic ? kvRow('epic', esc(P.epic)) : ''}</div>
      ${P.outOfScope ? `<details class="more"><summary>out of scope (${P.outOfScope.length})</summary><div>${P.outOfScope.map(x => '— ' + rich(x)).join('<br>')}</div></details>` : ''}
    </div>`;
  }
  if (n.type === 'doc' && n.kind === 'journey') {
    const t = M.plan.transcript;
    return `<div class="card">${cardHead('≣', 'journey.sh', '/journey.sh')}<h3>The ${esc(t.id)} transcript the plan must make real</h3>
      <div class="pre" style="font-family:var(--mono);font-size:12px;margin-top:6px">${t.steps.map(s => `<div><span class="dim">$</span> ${esc(s.cmd)}</div>`).join('')}</div>
      <div class="tctl"><button class="act go" data-cmd="play">▶ play it</button><span class="dim" style="font-size:12px">then trace any step through the layers</span></div></div>`;
  }
  if (n.type === 'ent') {
    const id = o.id;
    switch (n.kind) {
      case 'goal': {
        const acs = M.acs.filter(a => a.goal === id);
        const decs = M.decisions.filter(d => (d.goals || []).includes(id)).map(d => d.id);
        const rs = (M.rails || M.findings || []).filter(r => r.goal === id).map(r => r.id);
        return `<div class="card goal">${cardHead(glyph('goal'), id, n.path)}<h3>${esc(o.title)}</h3>
          ${o.description ? `<details class="more"><summary>more</summary><div>${rich(o.description)}</div></details>` : ''}
          <div style="margin-top:10px;font-family:var(--mono);font-size:12.5px">${acs.map(a => `<div>${S.verified[a.id] ? '<span class="okc">●</span>' : '<span class="fnt">○</span>'} ${idLink(a.id)} <span class="dim">${esc(short(a.title, 80))}</span></div>`).join('')}</div>
          <div class="kv">${kvRow('decided', pills(decs))}${kvRow(M.rails ? 'rails' : 'findings', pills(rs))}${kvRow('stacks', pills(stacksWith(c => c.goals.includes(id))))}${kvRow('sources', `<span class="dim" style="font-size:12px">${(o.sources || []).map(s => rich(s)).join(' · ')}</span>`)}</div>
          <div class="tctl"><button class="act go" data-cmd="verify ${id}">▶ verify ${id}</button><button class="act" data-cmd="tree ${id}">tree ${id}</button></div></div>`;
      }
      case 'ac': {
        const g = S.idx[o.goal];
        return `<div class="card">${cardHead(glyph('ac'), id, n.path, `<span class="dim" style="font-size:12px">serves ${idLink(o.goal)} ${g ? esc(short(g.obj.title, 50)) : ''}</span>`)}<h3>${rich(o.title, false)}</h3>
          <div class="gwt"><div>given</div><div>${rich(o.given)}</div><div>when</div><div>${rich(o.when)}</div><div>then</div><div>${rich(o.then)}</div></div>
          ${cmdbox(o.verify.cmd, 'verify ' + id)}
          <div class="kv">${kvRow('proof', `<span class="dim">${esc(o.verify.kind)}</span>${o.verify.tests && o.verify.tests.length ? '' : ' <span class="dim">— no automated test</span>'}`)}
          ${o.verify.tests && o.verify.tests.length ? kvRow('tests', o.verify.tests.map(t => { const s = testNode(t); const nm = t.split(':').pop(); return `<div style="font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${kb('test')} ${s ? pathLink(s, nm) : esc(nm)} <span class="fnt">${esc(t.split(':')[0].split('/').slice(-2).join('/'))}</span></div>`; }).join('')) : ''}
          ${kvRow('decided', pills(o.decisions))}${kvRow('rails', pills(o.rails))}${kvRow('phases', pills(o.phases))}${kvRow('stacks', pills(stacksWith(c => c.acs.includes(id))))}</div>
          <details class="more"><summary>the plan’s words · ${esc(o.source || '')}</summary><div>${rich(o.detail)}</div></details></div>`;
      }
      case 'dec':
        return `<div class="card">${cardHead(glyph('dec'), id, n.path, `<span class="dim" style="font-size:12px">by ${esc(o.by)} · ${esc(o.source || '')}</span>`)}<h3>${rich(o.title, false)}</h3>
          <div class="chosen"><span class="t-d">◆ chosen</span> ${rich(o.chosen)}<div class="dim" style="font-size:12.5px;margin-top:2px">${rich(o.why)}</div></div>
          ${(o.rejected || []).map(r => `<div class="rej"><span class="fnt">◇</span> <b>${rich(r.option)}</b> <span style="font-size:12.5px">— ${rich(r.why)}</span>${r.wouldBreak && r.wouldBreak.length ? ` <span class="dim" style="font-size:11px">would break</span> ${r.wouldBreak.map(pill).join(' ')}` : ''}</div>`).join('')}
          <div class="kv">${kvRow('goals', pills(o.goals))}${kvRow('acs', pills(o.acs))}</div></div>`;
      case 'rail':
        return `<div class="card">${cardHead(glyph('rail'), id, n.path, `<span class="dim" style="font-size:12px">epic guard rail ${esc(o.source)}</span>`)}<h3>${esc(o.title)}</h3><div class="desc">${rich(o.text)}</div><div class="kv">${kvRow('proved by', pills([o.ac]))}${kvRow('goal', pills([o.goal]))}</div></div>`;
      case 'find':
        return `<div class="card">${cardHead(glyph('find'), id, n.path, `<span class="dim" style="font-size:12px">spike finding · priority ${esc(o.priority)}</span>`)}<h3>${rich(o.title, false)}</h3><div class="kv">${kvRow('fix', rich(o.fix))}${kvRow('goal', pills([o.goal]))}${kvRow('acs', pills(M.acs.filter(a => a.goal === o.goal).map(a => a.id)))}</div></div>`;
      case 'phase': {
        const files = (o.files || []).map(f => S.files[f]).filter(Boolean);
        return `<div class="card">${cardHead(glyph('phase'), id, n.path)}<h3>${rich(o.title, false)}</h3><div class="desc">${rich(o.summary)}</div>
          <div class="kv">${kvRow('after', o.dependsOn && o.dependsOn.length ? pills(o.dependsOn) : '<span class="dim">— first</span>')}${kvRow('goals', pills(o.goals))}${kvRow('acs', pills(o.acs))}
          ${kvRow('files', `<div style="font-family:var(--mono);font-size:11.5px">${files.map(f => `<div>${icon(f)} ${pathLink(f, f.obj.path)}</div>`).join('')}</div>`)}</div>
          ${o.commit ? `<div class="cmdbox"><div class="c" style="--x:0">git commit -m ${esc(JSON.stringify(o.commit))}</div></div>` : ''}</div>`;
      }
      case 'cs':
        return `<div class="card">${cardHead(glyph('cs'), id, n.path)}<h3>${esc(o.title)}</h3><div class="desc">${rich(o.trigger)}</div>
          <div style="font-family:var(--mono);font-size:11.5px;margin-top:8px">${o.frames.map((f, i) => `<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="fnt">${String(i + 1).padStart(2, '0')}</span> <span style="color:${LAYERC[f.layer] || '#aaa'}">${esc(f.layer.padEnd(7))}</span>${'  '.repeat(f.depth || 0)}${f._node ? pathLink(f._node, f.symbol) : esc(f.symbol)} <span class="dim">${esc(f.does)}</span></div>`).join('')}</div>
          <div class="tctl"><button class="act go" data-cmd="trace ${id}">▶ trace ${id}</button>${pills(o.goals)}${pills(o.acs)}</div></div>`;
      case 'thread':
        return `<div class="card">${cardHead('<span class="gl gl-t">¶</span>', id, n.path, `<span class="dim" style="font-size:12px">review · ${esc(o.severity)}</span>`)}<h3>${rich(o.title, false)}</h3><div class="kv">${kvRow('problem', rich(o.problem))}${kvRow('resolved', rich(o.resolution))}${kvRow('refs', pills(o.refs))}</div></div>`;
      case 'term':
        return `<div class="card">${cardHead('<span class="gl gl-tm">§</span>', o.term, n.path)}<h3>${esc(o.term)}</h3><div class="desc">${rich(o.def)}</div>${o.avoid && o.avoid.length ? `<div class="kv">${kvRow('avoid', o.avoid.map(x => `<s class="dim">${esc(x)}</s>`).join(' · '))}</div>` : ''}</div>`;
    }
  }
  if (n.type === 'file') {
    const pk = pkgOfFile(o.path), css = stacksWith(c => c.frames.some(f => f.file === o.path));
    return `<div class="card">${cardHead(`<span class="t-${o.change}" style="font-weight:800">${CHG[o.change]}</span>`, CHGWORD[o.change], '/repo/' + o.path)}<h3 style="font-family:var(--mono);font-size:15px">${esc(o.path)}</h3>
      ${o.why ? `<div class="desc">${rich(o.why)}</div>` : ''}
      <div class="kv">${kvRow('goals', pills(o.goals))}${kvRow('acs', pills(o.acs))}${kvRow('phases', pills(o.phases))}${kvRow('stacks', pills(css))}${pk ? kvRow('package', `<span class="pill" data-cmd="deps ${esc(pk.id)}">⇢ ${esc(pk.id)}</span>`) : ''}</div>
      ${symtab(n)}
      <div class="tctl"><button class="act" data-cmd="why ${esc(qp('/repo/' + o.path))}">why</button>${pk ? `<button class="act" data-cmd="deps ${esc(pk.id)}">deps</button>` : ''}<span class="dim" style="font-size:11px">symbols only — file content is never shown</span></div></div>`;
  }
  if (n.type === 'sym') {
    const f = n.file, pk = pkgOfFile(f.path);
    const frames = []; M.callstacks.forEach(c => c.frames.forEach((fr, i) => { if (fr._node === n) frames.push(`<span class="pill t-cs" data-cmd="trace ${c.id}">≡${c.id} #${i + 1}</span>`); }));

    return `<div class="card">${cardHead(kb(o.kind), o.kind, n.path)}<h3 style="font-family:var(--mono);font-size:16px"><span class="t-${o.change}">${CHG[o.change] || ''}</span> ${esc(o.name)}</h3>
      ${o.sig ? `<div class="cmdbox" style="margin-top:4px"><div class="c" style="white-space:pre-wrap">${esc(o.sig)}</div></div>` : ''}
      <div class="kv">${kvRow('change', `<span class="t-${o.change}">${esc(CHGWORD[o.change] || o.change)}</span>${o.note ? ` <span class="dim">— ${rich(o.note)}</span>` : ''}`)}${kvRow('file', `${icon(S.files[f.path])} ${pathLink(S.files[f.path], f.path)}`)}${kvRow('proves', pills(tests))}${kvRow('stacks', frames.length ? `<div class="pills">${frames.join('')}</div>` : '')}${pk ? kvRow('package', `<span class="pill" data-cmd="deps ${esc(pk.id)}">⇢ ${esc(pk.id)}</span>`) : ''}</div>
      <div class="tctl"><button class="act" data-cmd="why ${esc(qp(n.path))}">why does this exist?</button></div></div>`;
  }
  return null;
}
function cmdCat(a) {
  if (!a.length) return errOut('cat: what? e.g. <span class="lk" data-cmd="cat README.md">cat README.md</span>');
  for (const arg of a) {

    const n = real(n0);

}

/* ---------------------------------------------------------------- why */
function cmdWhy(a) {
  if (!a.length) return errOut('why: why what? e.g. <span class="lk" data-cmd="why AC1">why AC1</span>');
  const n0 = need(a[0], 'why'); if (!n0) return;
  const n = real(n0), M = S.M;
  let acs = [], goals = [], lead = '', tail = '';
  if (n.type === 'ent') {
    const o = n.obj;
    switch (n.kind) {
      case 'goal':
        out(`<div>${idLink(o.id)} <b>${esc(o.title)}</b></div><div class="dim" style="margin:4px 0 0 18px">a goal is a root — it exists because of the problem:</div><div class="wrapx" style="margin-left:18px;font-family:var(--ui);font-size:13px;max-width:700px">${rich(M.plan.problem)}</div><div class="dim" style="margin:6px 0 0 18px">sources: ${(o.sources || []).map(s => rich(s)).join(' · ')}</div><div style="margin:6px 0 0 18px">↓ <span class="lk" data-cmd="tree ${o.id}">tree ${o.id}</span> <span class="dim">for everything it justifies</span></div>`);
        touch(n); return;
      case 'ac': acs = [o.id]; break;
      case 'dec': acs = o.acs || []; goals = o.goals || []; lead = `${idLink(o.id, true)}`; break;

/* --------------------------------------------------------------- grep */

  const show = hits.slice(0, 40);
  out(`<div class="dim">${hits.length} match${hits.length === 1 ? '' : 'es'}${hits.length > 40 ? ' — first 40' : ''}</div><div class="rows" style="grid-template-columns:auto minmax(0,auto) 1fr">${show.map(({n, txt}) => `<span>${icon(n)}</span><span class="lk ${n.type === 'ent' ? 't-' + KINDS[n.kind].c : ''}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px" data-cmd="${esc(cmdFor(n))}">${esc(n.type === 'ent' ? n.obj.id : n.type === 'file' ? n.obj.path : base(n.parent.path) + ' › ' + n.obj.name)}</span><span class="tt dim">${hl(txt)}</span>`).join('')}</div>`);

  S.last = null;
}

/* ----------------------------------------------------------------- du */

/* --------------------------------------------------------------- deps */
function pkgLabel(id) { const mods = uniq(S.M.deps.nodes.filter(n => n.kind === 'pkg' && n.change !== 'same').map(n => n.module)); const m = mods[0]; return m && id.startsWith(m + '/') ? id.slice(m.length + 1) : id; }

}
function nodeColor(nd) { return nd.change === 'add' ? 'var(--tadd)' : nd.change === 'edit' ? 'var(--tedit)' : '#6b7080'; }
function cmdDeps(a) {

  const outE = id => D.edges.filter(e => e.from === id), inE = id => D.edges.filter(e => e.to === id);

function depsGraph() {
  const D = S.M.deps, ids = D.nodes.map(n => n.id), set = new Set(ids);
  const edges = D.edges.filter(e => set.has(e.from) && set.has(e.to) && e.from !== e.to);
  const L = {}; ids.forEach(i => L[i] = 0);
  for (let k = 0; k < ids.length; k++) { let ch = false; edges.forEach(e => { if (L[e.to] < L[e.from] + 1 && L[e.from] + 1 < ids.length) { L[e.to] = L[e.from] + 1; ch = true; } }); if (!ch) break; }

  const maxL = Math.max(0, ...ids.filter(i => linked.has(i)).map(i => L[i]));
  ids.forEach(i => { if (!linked.has(i)) L[i] = maxL + 1; });
  const W = 760, NW = 172, NH = 28, GAP = 12, PER = 4, RH = 50;
  const pos = {}; let y = 12; const rowsY = [];
  const layers = [...new Set(ids.map(i => L[i]))].sort((a, b) => a - b);

    const ns = ids.filter(i => L[i] === l).sort((a, b) => { const na = D.nodes.find(n => n.id === a), nb = D.nodes.find(n => n.id === b); return natural((na.module || '') + a, (nb.module || '') + b); });

    }

  rowsY.filter(r => r.unl).slice(0, 1).forEach(r => svg += `<text x="6" y="${r.y - 6}" fill="#6b7080" font-size="10" font-family="JetBrains Mono">not imported · docs / harness / tooling</text>`);
  edges.forEach((e, i) => {
    const a = pos[e.from], b = pos[e.to]; const x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y;

    svg += `<path class="ed" data-f="${esc(e.from)}" data-t="${esc(e.to)}" d="M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}" style="stroke:${col}"${e.change === 'add' ? '' : ' stroke-dasharray="0"'} marker-end=""/>`;
  });
  D.nodes.forEach(nd => {
    const p = pos[nd.id]; const col = nodeColor(nd);
    const ext = nd.kind === 'external' || nd.kind === 'module', doc = nd.kind === 'doc' || nd.kind === 'harness';
    const fill = nd.change === 'add' ? 'rgba(95,208,140,.13)' : nd.change === 'edit' ? 'rgba(242,189,78,.13)' : 'rgba(255,255,255,.03)';
    let lab = pkgLabel(nd.id); const MX = nd.change !== 'same' ? 20 : 22; if (lab.length > MX) lab = '…' + lab.slice(-(MX - 1));
    svg += `<g class="nd" data-id="${esc(nd.id)}" data-cmd="deps ${esc(nd.id)}" data-tip="${esc(nd.id)} · ${esc(nd.kind)} · ${esc(CHGWORD[nd.change] || nd.change)}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="${doc ? 13 : 7}" style="fill:${fill};stroke:${col}" ${ext || doc ? 'stroke-dasharray="3 3"' : ''}/><text x="${p.x + 9}" y="${p.y + 18.5}" font-size="12" font-family="JetBrains Mono" style="fill:${nd.change === 'same' ? '#a9adb8' : '#EDEAE2'}">${nd.change !== 'same' ? `<tspan style="fill:${col}" font-weight="800">${CHG[nd.change]} </tspan>` : ''}${esc(lab)}</text></g>`;
  });
  svg += `</svg>`;
  const fb = D.forbidden.map(f => `<div class="wrapx" style="font-size:12px"><span class="err">✕</span> ${esc(f.from)} <span class="err">↛</span> ${esc(f.to)} <span class="dim">— ${rich(f.why)}</span></div>`).join('');
  const blk = out(`<div class="dim">${D.nodes.length} packages · ${edges.length} imports · <span class="t-add">green = new in this plan</span> · <span class="t-edit">amber = edited</span> · click a package for its tree</div><div class="dg">${svg}</div><div class="legend"><span><span class="t-add">━</span> new import</span><span><span class="dim">━</span> existing import</span><span>▭ dashed = external / module / doc</span></div><div style="margin-top:8px" class="dim">forbidden edges (the seams the plan protects)</div>${fb}`);

async function cmdVerify(a) {

  const arg = a[0].toUpperCase(), vn = S.idxU[arg];

  else if (vn && vn.kind === 'ac') list = [vn.obj];
  else return errOut(`verify: ${esc(a[0])} is not an AC or goal`);
  const fast = list.length > 1;

    const tests = ac.verify.tests || [];
    const blk = out(`<div>${idLink(ac.id)} <span class="dim">serves</span> ${idLink(ac.goal)} <span class="dim">· ${esc(ac.verify.kind)}</span> <span style="font-family:var(--ui)">${rich(ac.title, false)}</span></div>${cmdbox(ac.verify.cmd)}<div class="log" style="margin-top:6px"></div>`);

      line(`<span class="dim">expect:</span> ${rich(ac.then)}`);

      await sleep(fast ? 80 : 300);

    }
    if (ac.verify.kind === 'race') line(`<span class="dim"># race detector on (-race)</span>`);
    const groups = {};
    tests.forEach(t => { const p = t.split(':')[0]; const d = p.split('/').slice(0, -1).join('/'); (groups[d] = groups[d] || {py:p.endsWith('.py'), items:[]}).items.push(t); });
    for (const [dir, g] of Object.entries(groups)) {

        else { line(`<span class="dim">=== RUN   </span>${lk}`); await sleep(fast ? 20 : 120); line(`<span class="okc">--- PASS: </span><span class="dim">${esc(nm)}</span>`); await sleep(fast ? 15 : 60); }
      }
      line(g.py ? `<span class="okc">${g.items.length} passed</span> <span class="dim">${esc(dir)}</span>` : `<span class="okc">ok  </span><span class="dim">${esc(dir)}</span>`);
    }
    S.verified[ac.id] = true;
    line(`<span class="okc">✓ ${ac.id}</span> <span class="dim">replayed ${tests.length} test${tests.length === 1 ? '' : 's'} named in the plan — a simulation; copy the command to run it for real</span>`);
    refresh();

}

/* -------------------------------------------------------------- grill */
function genQuestions() {
  const M = S.M, Q = {};
  const pick = (arr, n, ex) => shuffle(arr.filter(x => !ex.includes(x))).slice(0, n);
  const push = (t, q) => (Q[t] = Q[t] || []).push(q);
  const gT = id => S.idx[id] ? S.idx[id].obj.title : id;
  M.acs.forEach(a => push('goal', {k:'AC → goal', q:'Which goal does this acceptance criterion prove?', stem:`✓ ${a.id}  ${plain(a.title)}`, opts:shuffle([a.goal, ...pick(M.goals.map(g => g.id), 3, [a.goal])]).map(id => ({v:id, h:`<b>◎ ${id}</b> ${esc(gT(id))}`})), right:a.goal, after:`why ${a.id}`, touch:a.id}));
  M.decisions.filter(d => d.rejected && d.rejected.length).forEach(d => push('dec', {k:'decision', q:'One of these was chosen, the rest rejected. Which did the plan choose?', stem:`◆ ${d.id}  decided by ${d.by} · serves ${(d.goals || []).map(g => '◎' + g).join(' ')}`, opts:shuffle([{v:'c', h:rich(short(d.chosen, 120))}, ...d.rejected.slice(0, 3).map((r, i) => ({v:'r' + i, h:rich(short(r.option, 120))}))]), right:'c', after:`cat ${d.id}`, touch:d.id}));
  const code = M.files.filter(f => /\.go$/.test(f.path) && !/_test\.go$/.test(f.path) && f.change !== 'context');
  const names = {}; M.files.forEach(f => (f.symbols || []).forEach(s => names[s.name] = (names[s.name] || 0) + 1));
  code.forEach(f => (f.symbols || []).filter(s => s.change !== 'same' && names[s.name] === 1 && s.kind !== 'test').slice(0, 3).forEach(s => {
    const others = pick(code.map(x => x.path), 3, [f.path]);
    push('sym', {k:'files → symbols', q:'Which file declares this symbol?', stem:`${s.kind}  ${s.name}${s.sig ? '\n' + s.sig : ''}`, opts:shuffle([f.path, ...others]).map(p => ({v:p, h:`<code>${esc(p)}</code>`})), right:f.path, after:`cat ${qp('/repo/' + f.path)}`, touchPath:'/repo/' + f.path});
  }));
  M.callstacks.forEach(c => { const fr = c.frames; for (let i = 1; i < fr.length - 1; i++) { const nxt = fr[i + 1].symbol; const pool = uniq(fr.map(x => x.symbol)).filter(s => s !== nxt && s !== fr[i].symbol); if (pool.length < 3) continue; push('cs', {k:'call stack', q:'What runs next?', stem:`≡ ${c.id}  ${c.title}\n  … ${fr[i].layer} ${fr[i].symbol} — ${fr[i].does}\n  ▼ next?`, opts:shuffle([nxt, ...pick(pool, 3, [])]).map(s => ({v:s, h:`<code>${esc(s)}</code>`})), right:nxt, after:`trace ${c.id}`, touch:c.id}); } });
  M.acs.forEach(a => (a.verify.tests || []).slice(0, 2).forEach(t => push('test', {k:'tests → ACs', q:'Which AC does this test help prove?', stem:`test  ${t.split(':').pop()}\n${t.split(':')[0]}`, opts:shuffle([a.id, ...pick(M.acs.map(x => x.id).filter(x => !M.acs.find(y => y.id === x).verify.tests.includes(t)), 3, [a.id])]).map(id => ({v:id, h:`<b>✓ ${id}</b> ${esc(short(S.idx[id].obj.title, 80))}`})), right:a.id, after:`cat ${a.id}`, touch:a.id})));
  M.files.filter(f => f.change !== 'context' || M.plan.kind === 'brownfield').forEach(f => push('chg', {k:M.plan.kind === 'greenfield' ? 'new or edited?' : 'how does it land?', q:'How does this plan touch this file?', stem:f.path, opts:['add', 'edit', 'delete', 'context'].map(c => ({v:c, h:`<b class="t-${c}">${CHG[c]}</b> ${CHGWORD[c]}`})), right:f.change, after:`cat ${qp('/repo/' + f.path)}`, touchPath:'/repo/' + f.path}));
  const D = M.deps; D.forbidden.filter(f => !/anything|any file/.test(f.from)).forEach(f => { const ok = pick(D.edges, 3, []); push('dep', {k:'dependency tree', q:'Which of these imports does the plan forbid?', stem:'three are real edges in the built import graph; one is a line nobody may cross', opts:shuffle([{v:'x', h:`${esc(f.from)} → ${esc(f.to)}`}, ...ok.map((e, i) => ({v:'e' + i, h:`${esc(e.from)} → ${esc(e.to)}`}))]), right:'x', after:'deps', why:f.why}); });
  (M.rails || M.findings || []).forEach(r => push('rail', {k:M.rails ? 'rail → goal' : 'finding → goal', q:`Which goal does this ${M.rails ? 'guard rail protect' : 'finding threaten'}?`, stem:`▲ ${r.id}  ${plain(r.title)}`, opts:shuffle([r.goal, ...pick(M.goals.map(g => g.id), 3, [r.goal])]).map(id => ({v:id, h:`<b>◎ ${id}</b> ${esc(gT(id))}`})), right:r.goal, after:`cat ${r.id}`, touch:r.id}));
  const types = shuffle(Object.keys(Q)).slice(0, 6);
  while (types.length < 6) types.push(shuffle(Object.keys(Q))[0]);
  return types.map(t => shuffle(Q[t])[0]);
}
function cmdGrill(a) {
  if (a[0] === 'q' || a[0] === 'stop') { S.grill = null; return out('<span class="dim">grill: stopped</span>'); }
  S.grill = {qs:genQuestions(), i:0, score:0, streak:0, pending:false};
  out(`<div class="t-g">? grill — six questions on ${S.plan}. Answer with <b>1–4</b> (or click). <span class="dim">Esc or “grill q” quits.</span></div>`);
  askNext();
}
function askNext() {
  const G = S.grill; if (!G) return;
  if (G.i >= G.qs.length) {
    const best = Math.max(G.score, (S.score[S.plan] || 0)); S.score[S.plan] = best; store.set('score', S.score);
    const verdict = G.score === 6 ? 'you could have written this plan.' : G.score >= 4 ? 'solid — reread the ones you missed.' : 'worth a tour first: ';
    out(`<div class="q"><div class="qk">result</div><div class="qs">${G.score}/6 — ${verdict}${G.score < 4 ? '<span class="lk t-p" data-cmd="tour">tour</span>' : ''}</div><div class="tctl"><button class="act go" data-cmd="grill">↻ another round</button><span class="dim" style="font-size:12px">best on ${S.plan}: ${best}/6</span></div></div>`);
    S.grill = null; return;
  }
  const q = G.qs[G.i];
  const blk = out(`<div class="q"><div class="qk">${G.i + 1}/6 · ${esc(q.k)}${G.streak > 1 ? ` · 🔥 ${G.streak}`.replace('🔥', '▲') : ''}</div><div class="qs">${esc(q.q)}</div><div class="stem">${esc(q.stem)}</div>${q.opts.map((o, i) => `<button class="opt" data-ans="${i + 1}"><span class="n">${i + 1}</span><span>${o.h}</span></button>`).join('')}<div class="verdict"></div></div>`);
  G.pending = true; G.blk = blk;
  S.hot = new Set(); S.warm = new Set(); S.hotPaths = new Set();

}
function grillAnswer(k) {
  const G = S.grill; if (!G || !G.pending) return;
  const q = G.qs[G.i], idx = (+k) - 1; const o = q.opts[idx]; if (!o) return;
  G.pending = false;

  if (right) { G.score++; G.streak++; } else G.streak = 0;
  G.blk.querySelector('.verdict').innerHTML = `${right ? '<span class="okc">✓ right.</span>' : '<span class="err">✗ not quite.</span>'} ${q.why ? `<span class="dim">${rich(q.why)}</span> ` : ''}<span class="lk t-p" data-cmd="${esc(q.after)}">${esc(q.after)}</span> <span class="dim">to see why ·</span> <button class="act go" data-next="1">next ▸</button> <span class="dim" style="font-size:11px">(Enter)</span>`;
  if (q.touch && S.idx[q.touch]) touch(S.idx[q.touch], {peek:false});
  if (q.touchPath) { const n = walk(q.touchPath, S.root); if (n) touch(n); }
  G.i++;
  refresh();
}

/* ============================================================ run loop */
function tokenize(s) { const t = []; const re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m; while ((m = re.exec(s))) t.push(m[1] ?? m[2] ?? m[3]); return t; }
async function until(fn) { while (!fn()) await nap(30); }
function lev(a, b) { const d = Array.from({length:a.length + 1}, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }

async function run(line) {
  line = (line || '').trim();
  if (S.busy) { S.anim.skip = true; await until(() => !S.busy); }
  if (S.grill && !S.grill.pending && !line && S.grill.i > 0) { out(`<div class="echo">${promptHTML()}</div>`); askNext(); refresh(); return; }
  const echo = out(`<div class="echo">${promptHTML()} <span>${esc(line)}</span></div>`);
  if (!line) { OUT.scrollTop = OUT.scrollHeight; return; }
  if (S.hist[S.hist.length - 1] !== line) { S.hist.push(line); if (S.hist.length > 200) S.hist.shift(); store.set('hist', S.hist); }
  S.hpos = -1;
  if (S.grill && S.grill.pending && /^[1-4]$/.test(line)) { grillAnswer(line); refresh(); return; }
  if (S.grill && /^(q|quit)$/i.test(line)) { S.grill = null; out('<span class="dim">grill: stopped</span>'); refresh(); return; }
  if (S.grill && !S.grill.pending && /^(n|next)$/i.test(line)) { askNext(); refresh(); return; }
  const toks = tokenize(line);
  let name = toks[0].toLowerCase(); name = ALIASES[name] || name;
  let c = CMDS[name], args = toks.slice(1);
  if (!c) {
    const r = resolve(line.replace(/^["']|["']$/g, ''));
    if (r.node) { c = CMDS.cat; args = [line.replace(/^["']|["']$/g, '')]; }
    else {
      const best = Object.keys(CMDS).map(k => [k, lev(name, k)]).sort((a, b) => a[1] - b[1])[0];
      errOut(`plansh: command not found: ${esc(toks[0])}${best && best[1] <= 2 ? ` — did you mean <span class="lk" data-cmd="${esc([best[0], ...args].join(' '))}">${esc(best[0])}</span>?` : ''} <span class="dim">· <span class="lk" data-cmd="help">help</span></span>`);
      refresh(); scrollTo(echo); return;
    }
  }
  S.busy = true; S.anim.skip = false; S.anim.paused = false; refresh();
  const startH = OUT.scrollHeight;
  try { await c.f(args, line); }
  catch (e) { errOut(`${esc(name)}: internal error — ${esc(e.message)}`); }
  S.busy = false; S.anim.skip = false;
  refresh();
  if (!['trace', 'verify', 'play', 'grill'].includes(name)) scrollTo(echo); else if (name !== 'grill') OUT.scrollTop = OUT.scrollHeight;
}
async function typeRun(cmd) {
  if (S.busy) { S.anim.skip = true; await until(() => !S.busy); }
  if (S.typing) return;
  if (innerWidth <= 960 && !/^cd /.test(cmd)) setTab('shell');
  const inp = $('#cmd');
  if (!REDUCED) {
    S.typing = true; inp.value = '';
    const step = Math.max(1, Math.ceil(cmd.length / 20));
    for (let i = 0; i < cmd.length; i += step) { inp.value = cmd.slice(0, i + step); ghost(); await nap(14); }

}

/* --------------------------------------------------------- completion */
function candidates(line) {

  if (toks.length === 0 || (toks.length === 1 && !endsSpace)) {
    const p = (toks[0] || '').toLowerCase();
    return {start:0, prefix:p, list:Object.keys(CMDS).filter(k => k.startsWith(p)).map(k => k + ' ')};
  }
  const cmd = ALIASES[toks[0]] || toks[0];
  const p = endsSpace ? '' : toks[toks.length - 1];
  const start = endsSpace ? line.length : line.lastIndexOf(p);
  let list = [];
  const ids = ks => Object.keys(S.idx).filter(k => !k.startsWith('§') && ks.includes(S.idx[k].kind) && k.toLowerCase().startsWith(p.toLowerCase())).sort(natural);
  if (cmd === 'trace') list = ids(['cs']);
  else if (cmd === 'verify') list = ids(['ac', 'goal']).concat('all'.startsWith(p.toLowerCase()) ? ['all'] : []);
  else if (cmd === 'mount') list = ['062', '052'].filter(x => x.startsWith(p));
  else if (cmd === 'man') list = Object.keys(CMDS).filter(k => k.startsWith(p));
  else if (cmd === 'deps') { list = S.M.deps.nodes.map(n => n.id).filter(id => id.startsWith(p)); }
  if (!['trace', 'verify', 'mount', 'man'].includes(cmd)) {
    const i = p.lastIndexOf('/'); const head = p.slice(0, i + 1), bs = p.slice(i + 1).replace(/^"/, '');
    const dir = head ? walk(head, S.cwd) : S.cwd;
    if (dir && real(dir).children) list = list.concat(kids(dir).filter(k => k.name.toLowerCase().startsWith(bs.toLowerCase())).map(k => { const full = head + k.name + (real(k).type === 'dir' ? '/' : ''); return qp(full); }));
    if (!p.includes('/') && p.length) list = list.concat(Object.keys(S.idx).filter(k => !k.startsWith('§') && k.toLowerCase().startsWith(p.toLowerCase())).sort(natural));
  }
  return {start, prefix:p, list:uniq(list)};
}
function lcp(arr) { if (!arr.length) return ''; let s = arr[0]; for (const a of arr) { let i = 0; while (i < s.length && i < a.length && s[i].toLowerCase() === a[i].toLowerCase()) i++; s = s.slice(0, i); } return s; }
function complete() {
  const inp = $('#cmd'); const line = inp.value;
  const {start, prefix, list} = candidates(line);
  if (!list.length) return;
  if (list.length === 1) { inp.value = line.slice(0, start) + list[0]; ghost(); return; }
  const c = lcp(list);
  if (c.length > prefix.length) { inp.value = line.slice(0, start) + c; ghost(); return; }
  out(`<div class="ls">${list.slice(0, 60).map(x => `<span class="lk dim" data-fill="${esc(line.slice(0, start) + x)}">${esc(x)}</span>`).join('')}</div>`);
  OUT.scrollTop = OUT.scrollHeight;
}
function ghost() {
  const inp = $('#cmd'), g = $('#ghost'), v = inp.value;
  let sug = '';
  if (v && inp.selectionStart === v.length) {
    const h = [...S.hist].reverse().find(x => x.startsWith(v) && x !== v);
    if (h) sug = h;
    else { const {start, list} = candidates(v); if (list.length === 1) sug = v.slice(0, start) + list[0]; }
  }
  g.innerHTML = sug ? `<span style="visibility:hidden">${esc(v)}</span>${esc(sug.slice(v.length))}` : '';
  g.dataset.full = sug;
}

/* ------------------------------------------------------------- panes */
function chipCls(id) { return S.hot.has(id) ? 'hot' : S.warm.has(id) ? 'warm' : ''; }
function renderOv() {
  const M = S.M, P = M.plan;
  const ver = M.acs.filter(a => S.verified[a.id] === true).length;
  const chip = (id, label) => { const n = S.idx[id]; if (!n) return ''; const k = n.kind; return `<span class="chip ${chipCls(id)} ${k === 'ac' && S.verified[id] === true ? 'ok' : k === 'ac' && S.verified[id] === 'manual' ? 'man' : ''}" data-cmd="${k === 'cs' ? 'trace ' + id : 'cat ' + id}" data-tip="${esc(id)} · ${esc(short(titleOf(n), 100))}">${glyph(k)}${esc(label || id.replace(/^(AC|D|R|F|CS|P|T)/, ''))}</span>`; };
  let h = `<div class="ov-head"><div class="kind">${P.kind === 'greenfield' ? '◌ greenfield · fresh volume' : '◍ brownfield · overlay'}</div><h2>${esc(P.title)}</h2>
    <div class="ov-stats"><span><b>${M.goals.length}</b> goals</span><span><b>${M.acs.length}</b> ACs</span><span><b>${M.decisions.length}</b> decisions</span><span><b>${M.files.length}</b> files</span></div>
    <div class="ov-stats" style="margin-top:6px"><span>${glyph('ac')} <b>${ver}</b>/${M.acs.length} replayed</span>${S.score[S.plan] != null ? `<span><span class="gl gl-g">?</span> best <b>${S.score[S.plan]}</b>/6</span>` : ''}</div>
    <div class="meter"><i style="width:${(ver / M.acs.length) * 100}%"></i></div></div><div class="goals">`;
  for (const g of M.goals) {
    const acs = M.acs.filter(a => a.goal === g.id).map(a => a.id);
    const decs = M.decisions.filter(d => (d.goals || [])[0] === g.id).map(d => d.id);
    const rs = (M.rails || M.findings || []).filter(r => r.goal === g.id).map(r => r.id);
    const cls = S.hot.has(g.id) ? 'hot' : S.warm.has(g.id) ? 'warm' : '';
    h += `<div class="grow ${cls}" data-cmd="cat ${g.id}" data-tip="${esc(g.id)} — click for the card"><div class="gt"><span class="gid"><span class="gl">◎</span>${g.id}</span><span class="gtt">${esc(g.title)}</span></div>
      <div class="chips">${acs.map(id => chip(id)).join('')}${decs.map(id => chip(id)).join('')}${rs.map(id => chip(id, M.rails ? id.slice(1) : id)).join('')}</div></div>`;
  }
  h += `</div>`;
  h += `<div class="xsec"><h4>▷ phases</h4><div class="xrow">${M.phases.map((p, i) => (i ? '<span class="arrow">→</span>' : '') + chip(p.id, p.id)).join('')}</div></div>`;
  h += `<div class="xsec"><h4>≡ call stacks · click to play</h4><div class="xrow">${M.callstacks.map(c => chip(c.id, c.id.replace('CS', ''))).join('')}</div></div>`;
  if ((M.threads || []).length) h += `<div class="xsec"><h4>¶ review threads</h4><div class="xrow">${M.threads.map(t => `<span class="chip ${chipCls(t.id)}" data-cmd="cat ${t.id}" data-tip="${esc(t.id)} · ${esc(t.title)}"><span class="gl gl-t">¶</span>${t.id.slice(1)}</span>`).join('')}</div></div>`;
  if ((M.terms || []).length) h += `<div class="xsec"><h4>§ glossary</h4><div class="xrow">${M.terms.map(t => `<span class="chip" data-cmd="cat ${esc(qp('/glossary/' + t.term))}" data-tip="${esc(t.def)}"><span class="gl gl-tm">§</span>${esc(t.term)}</span>`).join('')}</div></div>`;
  $('#ov').innerHTML = h;
  document.body.classList.toggle('lens', S.hot.size + S.warm.size > 0);
  $('#ovLens').innerHTML = S.hot.size + S.warm.size ? `<button class="tbtn" style="padding:1px 7px;font-size:10.5px" id="lensX" title="Clear highlight">lens: ${esc([...S.hot][0] || (S.last ? S.last.name : 'grep'))} ✕</button>` : '';
}
function renderFinder() {
  const view = S.peek || S.cwd;
  const segs = view.path.split('/').filter(Boolean);
  let acc = '';
  $('#crumbs').innerHTML = `<button data-cmd="cd /">/</button>` + segs.map((s, i) => { acc += '/' + s; return `${i ? '<span class="s">/</span>' : ''}<button data-cmd="${real(walk(acc, S.root)).type === 'dir' ? 'cd' : 'cat'} ${esc(qp(acc))}">${esc(s)}</button>`; }).join('');
  $('#peek').classList.toggle('on', !!S.peek);
  $('#peekTxt').innerHTML = S.peek ? `peeking at what you touched · cwd is <code>${esc(shortPath(S.cwd.path))}</code>` : '';
  const ks = kids(view);
  const hotAncestor = k => { for (const p of S.hotPaths) if (p.startsWith(k.path + '/')) return true; return false; };
  $('#flist').innerHTML = ks.length ? ks.map(k => {
    const r = real(k);
    const isHot = S.hotPaths.has(r.path) || (r.type === 'ent' && S.hot.has(r.obj.id)) || S.last === r;
    const isWarm = !isHot && ((r.type === 'ent' && S.warm.has(r.obj.id)) || ((r.type === 'dir' || r.type === 'file') && hotAncestor(r)));
    const cls = [r.type === 'dir' ? 'dir' : r.type === 'sym' ? 'sym' : '', isHot ? 'hot' : isWarm ? 'warm' : '', (r.type === 'file' && r.obj.change === 'context') || (r.type === 'sym' && r.obj.change === 'same') ? 'ctx' : ''].join(' ');
    const label = k.type === 'link' && r.type === 'ent' ? r.obj.id : k.name;
    const sub = r.type === 'ent' ? short(r.obj.title || r.obj.def, 70) : k.type === 'link' ? '↪ ' + (r.type === 'sym' ? base(r.parent.path) + ' › ' + r.obj.name : r.path) : r.type === 'sym' ? (r.obj.sig || '') : '';
    const mt = r.type === 'file' ? `${(r.obj.symbols || []).length}` : r.type === 'dir' ? (() => { const c = countFiles(r, {}); return r.path.startsWith('/repo') ? tally(c).replace(/t-/g, 'ch-') : Object.keys(r.children).length; })() : r.type === 'sym' ? `<span class="ch-${r.obj.change}">${CHG[r.obj.change] || ''}</span>` : '';
    return `<div class="fe ${cls}" data-cmd="${esc(cmdFor(k))}" data-tip="${esc(short(metaOf(k), 140))}"><span class="ic">${icon(k, false)}</span><span class="nm">${esc(label)}${r.type === 'dir' ? '/' : ''}${sub ? `<small>${esc(sub)}</small>` : ''}</span><span class="mt">${mt}</span></div>`;
  }).join('') : `<div class="dim" style="padding:12px;color:var(--mute)">empty</div>`;
  const hotEl = $('#flist .fe.hot'); if (hotEl) hotEl.scrollIntoView({block:'nearest'});
  // summary
  let s = '';
  if (view.path.startsWith('/repo') && view.type === 'dir') { const c = countFiles(view, {}); const t = (c.add || 0) + (c.edit || 0) + (c.delete || 0) + (c.context || 0); s = `${bar(c, t, 160)} <span style="margin-left:6px;font-family:var(--mono);font-size:11px">${tally(c).replace(/t-/g, 'ch-')}</span>`; }
  else if (view.type === 'file') s = `<span class="ch-${view.obj.change}" style="font-weight:800">${CHG[view.obj.change]}</span> ${esc(CHGWORD[view.obj.change])} · ${(view.obj.symbols || []).length} symbols · <span style="color:var(--mute)">names + signatures only</span>`;
  else if (view.type === 'ent') s = `${glyph(view.kind)} <b>${esc(view.obj.id)}</b> — its folder holds symlinks to what it depends on`;
  else if (view.kind === 'coll') s = `${glyph(view.of)} ${Object.keys(view.children).length} ${esc(KINDS[view.of].label)}${Object.keys(view.children).length === 1 ? '' : 's'}`;
  else s = `click a folder to <code>cd</code>, anything else to <code>cat</code>`;
  $('#fsum').innerHTML = s;
}
function suggestions() {
  const c = real(S.cwd), M = S.M, L = [];
  const add = (cmd, label) => L.push([cmd, label || cmd]);
  if (S.grill && S.grill.pending) { [1, 2, 3, 4].forEach(i => add(String(i))); add('grill q', 'quit grill'); return L; }
  if (S.grill && !S.grill.pending) { add('n', 'next question ▸'); add('grill q', 'quit grill'); }
  if (S.last && S.last !== c) {
    const r = S.last;
    if (r.type === 'ent' && r.kind === 'ac') { add('verify ' + r.obj.id, `${glyph('ac')} verify ${r.obj.id}`); add('why ' + r.obj.id); }
    if (r.type === 'ent' && r.kind === 'goal') { add('tree ' + r.obj.id); add('verify ' + r.obj.id); }
    if (r.type === 'ent' && r.kind === 'cs') add('trace ' + r.obj.id, `≡ trace ${r.obj.id}`);
    if (r.type === 'sym' || r.type === 'file') { add('why ' + qp(r.path), 'why ' + (r.type === 'sym' ? r.obj.name : r.name)); const pk = pkgOfFile(r.type === 'sym' ? r.file.path : r.obj.path); if (pk) add('deps ' + pk.id, 'deps ' + pkgLabel(pk.id)); }
  }
  if (c === S.root) { add('tour', '▶ tour'); add('ls /goals', '◎ ls /goals'); add('tree /goals'); if (M.plan.transcript) add('play', '▶ play journey'); add('trace ' + M.callstacks[0].id, '≡ trace ' + M.callstacks[0].id); add('du /repo'); add('deps'); add('grill', '? grill'); }
  else if (c.type === 'ent') { add('cat ' + (c.kind === 'term' ? qp(c.path) : c.obj.id)); if (c.kind === 'ac') add('verify ' + c.obj.id); if (c.kind === 'cs') add('trace ' + c.obj.id); add('ls'); add('why .', 'why ' + (c.obj.id || c.name)); }
  else if (c.type === 'file') { add('cat .'); add('why .'); add('ls'); add('deps .'); }
  else if (c.kind === 'coll') { add('ls'); const f = kids(c)[0]; if (f) add('cat ' + f.name); add('tree .'); }
  else if (c.path.startsWith('/repo')) { add('ls -l'); add('du .'); add('tree .'); add('deps .'); }
  if (c !== S.root) add('cd ..', '↑ cd ..');

}
function refresh() {
  tip.classList.remove('on');
  renderOv(); renderFinder();
  $('#prompt').innerHTML = S.grill && S.grill.pending ? `<span class="pr"><i>grill ${S.grill.i + 1}/6</i> ❯</span>` : promptHTML();
  $('#tcwd').textContent = S.cwd.path;
  $('#sugg').innerHTML = suggestions().map(([c, l]) => `<button class="sg" data-cmd="${esc(c)}">${/[<]/.test(l) ? l : esc(l)}</button>`).join('');
  const ver = S.M.acs.filter(a => S.verified[a.id] === true).length;
  const last = S.last ? (S.last.type === 'ent' ? `${glyph(S.last.kind)} ${esc(S.last.obj.id)}` : esc(S.last.name || '/')) : '—';
  $('#status').innerHTML = `<span><b>${S.plan}</b> ${esc(S.M.plan.kind)}</span><span>cwd <b>${esc(shortPath(S.cwd.path))}</b></span><span>last <b>${last}</b></span><span>${glyph('ac')} <b>${ver}</b>/${S.M.acs.length}</span>${S.tour ? `<span class="t-g">▶ tour ${S.tour.i}/${S.tour.n} · Esc stops</span>` : ''}${S.busy ? '<span class="t-cs">● running · Esc skips</span>' : ''}<span class="sp"></span><span class="hide-m">Tab ⇥ complete · ↑ history · click anything</span>`;
}

/* -------------------------------------------------------------- mount */
function motd() {
  const M = S.M, P = M.plan, c = countFiles(S.root.children.repo, {});
  const nsym = M.files.reduce((a, f) => a + (f.symbols || []).length, 0);
  const green = P.kind === 'greenfield';
  out(`<div class="dim">plansh — the plan is a filesystem · <span class="lk" data-cmd="help">help</span> · <span class="lk" data-cmd="tour">tour</span></div>
    <div><span class="${green ? 't-add' : 't-edit'}">${green ? 'mkfs' : 'mount -t overlay'}</span> ${esc(P.id)} <b>${esc(P.title)}</b> <span class="dim">${green ? `— a fresh volume: ${c.add || 0} new files, ${c.edit || 0} small seams into existing code` : `— layered on existing code: ${c.edit || 0} edits + ${c.add || 0} adds over ${c.context || 0} neighbours`}</span></div>
    <div class="dim">  ${['goals', 'acs', 'decisions', M.rails ? 'rails' : 'findings', 'phases', 'stacks'].map(d => `<span class="lk" data-cmd="ls /${d}">/${d}</span> ${Object.keys(S.root.children[d].children).length}`).join('  ')}  <span class="lk" data-cmd="du /repo">/repo</span> ${M.files.length} files · ${nsym} symbols</div>`);
}
function mount(p, announce) {
  S.plan = p; build(MODELS[p]);
  document.body.dataset.kind = S.M.plan.kind;
  $$('.mounts button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.plan === p)));
  if (S.grill) S.grill = null;
  if (S.tour) { S.tour.stop = true; S.tour = null; }
  try { if (location.hash !== '#' + p) history.replaceState(null, '', '#' + p); } catch (e) {}
  if (announce) out(`<div class="dim">umount · ${p === '062' ? '052' : '062'}</div>`);

/* ------------------------------------------------------------- events */
function setTab(t) { document.body.dataset.tab = t; $$('.mtabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t))); }
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
}
document.addEventListener('click', e => {
  const t = e.target; tip.classList.remove('on');
  if (t.closest('#lensX')) { clearLens(); return; }
  const cp = t.closest('[data-copy]'); if (cp) { try { navigator.clipboard.writeText(cp.dataset.copy).then(() => { cp.textContent = 'copied'; setTimeout(() => cp.textContent = 'copy', 1200); }, () => {}); } catch (err) {} return; }
  const an = t.closest('[data-ans]'); if (an && !an.disabled) { out(`<div class="echo">${promptHTML()} <span>${an.dataset.ans}</span></div>`); grillAnswer(an.dataset.ans); return; }

  const tb = t.closest('.mtabs button'); if (tb) { setTab(tb.dataset.tab); return; }
  const mb = t.closest('.mounts button'); if (mb) { if (mb.dataset.plan !== S.plan) typeRun('mount ' + mb.dataset.plan); return; }
  if (t.closest('#themeBtn')) { toggleTheme(); return; }
  if (t.closest('#peekBack')) { S.peek = null; refresh(); return; }
  if (t.closest('a[href]')) return;
  if (t.closest('[data-ctl]') || t.closest('summary')) return;
  const c = t.closest('[data-cmd]') || t.closest('[data-run]');
  if (c) { e.preventDefault(); typeRun(c.dataset.cmd || c.dataset.run); return; }
  if (t.closest('#out') && !getSelection().toString()) $('#cmd').focus({preventScroll:true});
});
const inp = $('#cmd');
inp.addEventListener('keydown', e => {
  if (S.grill && S.grill.pending && !inp.value && /^[1-4]$/.test(e.key)) { e.preventDefault(); out(`<div class="echo">${promptHTML()} <span>${e.key}</span></div>`); grillAnswer(e.key); return; }
  if (S.grill && !S.grill.pending && S.grill.i > 0 && !inp.value && e.key === 'Enter') { e.preventDefault(); askNext(); refresh(); return; }
  if (e.key === 'Enter') { e.preventDefault(); const v = inp.value; inp.value = ''; ghost(); run(v); }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.key === 'ArrowRight' && inp.selectionStart === inp.value.length && $('#ghost').dataset.full) { e.preventDefault(); inp.value = $('#ghost').dataset.full; ghost(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (!S.hist.length) return; if (S.hpos < 0) { S.draft = inp.value; S.hpos = S.hist.length; } S.hpos = Math.max(0, S.hpos - 1); inp.value = S.hist[S.hpos]; ghost(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (S.hpos < 0) return; S.hpos++; if (S.hpos >= S.hist.length) { S.hpos = -1; inp.value = S.draft; } else inp.value = S.hist[S.hpos]; ghost(); }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); OUT.innerHTML = ''; }
  else if (e.key === 'c' && e.ctrlKey && !inp.value.slice(inp.selectionStart, inp.selectionEnd)) { e.preventDefault(); out(`<div class="echo">${promptHTML()} <span>${esc(inp.value)}^C</span></div>`); inp.value = ''; ghost(); S.anim.skip = true; }
});
inp.addEventListener('input', ghost);
document.addEventListener('keydown', e => {

  }
  if (document.activeElement !== inp && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (/^[1-4]$/.test(e.key) && S.grill && S.grill.pending) { e.preventDefault(); out(`<div class="echo">${promptHTML()} <span>${e.key}</span></div>`); grillAnswer(e.key); return; }
    if (e.key === '?' ) { e.preventDefault(); typeRun('help'); return; }
    if (e.key.length === 1 && !/input|textarea|select/i.test(document.activeElement.tagName)) inp.focus();
  }
});
// tooltip
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t || !t.dataset.tip) { tip.classList.remove('on'); return; } tip.innerHTML = esc(t.dataset.tip); tip.classList.add('on'); });
document.addEventListener('mousemove', e => { if (!tip.classList.contains('on')) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 8) x = e.clientX - w - 10; if (y + h > innerHeight - 8) y = e.clientY - h - 10; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });

window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (MODELS[p] && p !== S.plan) typeRun('mount ' + p); });

/* --------------------------------------------------------------- boot */
(function boot() {
  const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
  const p = MODELS[location.hash.slice(1)] ? location.hash.slice(1) : '062';
