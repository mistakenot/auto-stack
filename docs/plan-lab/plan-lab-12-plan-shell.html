<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE2; --pane:#FBF9F4; --pane2:#F4F0E7; --line:#DED7C8; --line2:#CCC3B0;
  --ink:#1C1A16; --ink2:#48433A; --mute:#8A8272; --faint:#B7AE9C;
  --term:#16181D; --term2:#1D2027; --tline:#2A2E37; --tink:#E6E2D8; --tmute:#8B8F9A; --tfaint:#565B67;
  --goal:#D99A1E; --ac:#2E9D5B; --dec:#6B63D9; --rail:#D9573F; --phase:#1C93A6; --cs:#C2468E; --thr:#7E7563; --term-c:#8C6D3F;
  --add:#2E9D5B; --edit:#C98A12; --del:#D24B4B; --ctx:#9A937F;
  --tgoal:#F2BD4E; --tac:#5FD08C; --tdec:#A29CFF; --trail:#FF8A73; --tphase:#4FC8D8; --tcs:#F07AC0; --tthr:#B9AE98;
  --tadd:#5FD08C; --tedit:#F2BD4E; --tdel:#FF7A7A; --tctx:#7D8290;
  --acc:#2E9D5B; --accsoft:#DCEFE2;
  --ui:'Instrument Sans',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px -18px rgba(40,30,10,.35);
}
body[data-kind="brownfield"]{ --acc:#B8612A; --accsoft:#F4E2D3; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --pane:#15181D; --pane2:#1A1E24; --line:#262B33; --line2:#333944;
    --ink:#ECE8DF; --ink2:#C4BFB3; --mute:#8B8F99; --faint:#5A606B;
    --term:#0B0D10; --term2:#12151A; --tline:#232730;
    --goal:#F2BD4E; --ac:#5FD08C; --dec:#A29CFF; --rail:#FF8A73; --phase:#4FC8D8; --cs:#F07AC0; --thr:#B9AE98; --term-c:#D6B37A;
    --add:#5FD08C; --edit:#F2BD4E; --del:#FF7A7A; --ctx:#7D8290;
    --acc:#5FD08C; --accsoft:#18301F; --shadow:0 10px 30px -18px rgba(0,0,0,.8);
  }
  :root:not([data-theme="light"]) body[data-kind="brownfield"]{ --acc:#F0A064; --accsoft:#35251A; }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --pane:#15181D; --pane2:#1A1E24; --line:#262B33; --line2:#333944;
  --ink:#ECE8DF; --ink2:#C4BFB3; --mute:#8B8F99; --faint:#5A606B;
  --term:#0B0D10; --term2:#12151A; --tline:#232730;
  --goal:#F2BD4E; --ac:#5FD08C; --dec:#A29CFF; --rail:#FF8A73; --phase:#4FC8D8; --cs:#F07AC0; --thr:#B9AE98; --term-c:#D6B37A;
  --add:#5FD08C; --edit:#F2BD4E; --del:#FF7A7A; --ctx:#7D8290;
  --acc:#5FD08C; --accsoft:#18301F; --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}
:root[data-theme="dark"] body[data-kind="brownfield"]{ --acc:#F0A064; --accsoft:#35251A; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.9em}
a{color:inherit}

/* ---------- top bar ---------- */
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand .mark{font-family:var(--mono);font-weight:800;font-size:15px;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:6px;letter-spacing:-.02em;align-self:center}
.brand b{font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:-.01em}
.brand b i{color:var(--acc)}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.mounts{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--pane2);margin-left:8px}
.mounts button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;gap:7px;align-items:center}
.mounts button b{color:var(--ink2);font-weight:700}
.mounts button[aria-pressed="true"]{background:var(--pane);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.mounts button[aria-pressed="true"] b{color:var(--ink)}
.mounts .dot{width:8px;height:8px;border-radius:2px}
.top .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--pane);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tbtn:hover{border-color:var(--line2)}
.tbtn kbd,.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mute);background:var(--pane)}
.tbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- layout ---------- */
.main{height:calc(100% - 54px);display:grid;grid-template-columns:minmax(260px,300px) minmax(0,1fr) minmax(280px,340px);gap:12px;padding:12px}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-height:40px}
.phead b{color:var(--ink);font-weight:700}
.phead .sp{flex:1}
.pbody{overflow:auto;min-height:0;flex:1}

/* ---------- glyphs ---------- */
.gl{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);line-height:1}
.gl-g{color:var(--goal)} .gl-ac{color:var(--ac)} .gl-d{color:var(--dec)} .gl-r{color:var(--rail)} .gl-p{color:var(--phase)} .gl-cs{color:var(--cs)} .gl-t{color:var(--thr)} .gl-tm{color:var(--term-c)}
.sq{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border:1.5px solid currentColor;border-radius:3px;font-size:.78em;font-weight:800;line-height:1}
.ch-add{color:var(--add)} .ch-edit{color:var(--edit)} .ch-delete{color:var(--del)} .ch-context,.ch-same{color:var(--ctx)}

/* ---------- overview (left) ---------- */
.ov-head{padding:14px 16px 10px;border-bottom:1px dashed var(--line)}
.ov-head .kind{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700}
.ov-head h2{margin:4px 0 2px;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.08;letter-spacing:-.01em}
.ov-head .one{color:var(--ink2);font-size:12.5px}
.ov-stats{display:flex;gap:10px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--mute);flex-wrap:wrap}
.ov-stats b{color:var(--ink)}
.meter{height:5px;border-radius:3px;background:var(--pane2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ac);width:0;transition:width .5s}
.goals{padding:6px 8px 10px}
.grow{padding:8px 8px 9px;border-radius:10px;cursor:pointer;transition:background .15s,opacity .2s;position:relative}
.grow:hover{background:var(--pane2)}
.grow .gt{display:flex;gap:8px;align-items:flex-start}
.grow .gt .gid{font-family:var(--mono);font-weight:800;font-size:12px;color:var(--goal);white-space:nowrap;padding-top:2px}
.grow .gt .gid .gl{font-size:15px;margin-right:3px}
.grow .gt .gtt{font-weight:600;font-size:13.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 0 30px}
.chip{border:1px solid var(--line);background:var(--pane);border-radius:6px;padding:1px 5px 1px 4px;font-family:var(--mono);font-size:10.5px;display:inline-flex;gap:3px;align-items:center;color:var(--ink2);cursor:pointer;transition:all .15s;line-height:1.5}
.chip:hover{border-color:var(--line2);background:var(--pane2)}
.chip .gl{font-size:11px}
.chip.man .sq{border-style:dashed;color:var(--edit)}
.chip.ok .sq{background:var(--ac);color:var(--pane);border-color:var(--ac)}
body.lens .grow,body.lens .chip,body.lens .xrow .chip{opacity:.38}
body.lens .grow.warm,body.lens .grow.hot{opacity:1}
body.lens .chip.warm{opacity:1;border-color:var(--ink2)}
body.lens .chip.hot{opacity:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
body.lens .chip.hot .gl{color:var(--bg)}
body.lens .grow.hot{background:var(--accsoft)}
.grow.hot::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--goal)}
.xsec{padding:10px 16px 12px;border-top:1px dashed var(--line)}
.xsec h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.xrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.xrow .arrow{color:var(--faint);font-family:var(--mono);font-size:10px}

/* ---------- terminal (center) ---------- */
.termpane{background:var(--term);border-color:#0003;color:var(--tink)}
.termpane .phead{border-bottom-color:var(--tline);color:var(--tmute)}
.termpane .phead b{color:var(--tink)}
.termpane .phead .cwdt{font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:12px;color:var(--tink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--tline);background:var(--term2);color:var(--tink);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-size:11px;text-transform:none;letter-spacing:0;white-space:nowrap}
.hbtn:hover{border-color:#3d4350}
.hbtn.hot{background:var(--tac);color:#0b1a10;border-color:var(--tac);font-weight:700}
#out{position:relative;font-family:var(--mono);font-size:12.8px;line-height:1.55;padding:12px 16px 6px;overflow:auto;flex:1;min-height:0;scroll-behavior:auto}
#out::-webkit-scrollbar{width:10px}#out::-webkit-scrollbar-thumb{background:#2c313b;border-radius:8px;border:2px solid var(--term)}
.blk{margin:0 0 10px}
.echo{color:var(--tink);display:flex;gap:8px;flex-wrap:wrap}
.pr{color:var(--tmute);white-space:nowrap}.pr b{color:var(--tphase);font-weight:500}.pr i{font-style:normal;color:var(--tac)}
.dim{color:var(--tmute)} .fnt{color:var(--tfaint)}
.err{color:var(--tdel)} .okc{color:var(--tac)}
.t-g{color:var(--tgoal)} .t-ac{color:var(--tac)} .t-d{color:var(--tdec)} .t-r{color:var(--trail)} .t-p{color:var(--tphase)} .t-cs{color:var(--tcs)} .t-t{color:var(--tthr)}
.t-add{color:var(--tadd)} .t-edit{color:var(--tedit)} .t-delete{color:var(--tdel)} .t-context,.t-same{color:var(--tctx)}
.lk{cursor:pointer;text-decoration:underline;text-decoration-color:#ffffff30;text-underline-offset:3px}
.lk:hover{text-decoration-color:currentColor;background:#ffffff0d;border-radius:3px}
.pre{white-space:pre;overflow-x:auto}
.wrapx{white-space:pre-wrap;overflow-wrap:anywhere}
#out code{background:#ffffff12;border-radius:4px;padding:0 4px;color:#F3E9D2}
.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px 16px}
.ls span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{display:grid;grid-template-columns:auto auto 1fr;gap:1px 12px;align-items:baseline}
.rows>*{min-width:0}
.rows .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* cards */
.card{border:1px solid var(--tline);background:var(--term2);border-radius:12px;padding:12px 14px;margin:4px 0 2px;font-family:var(--ui);font-size:13.5px;line-height:1.45;max-width:760px}
.card .ch{display:flex;gap:10px;align-items:baseline;font-family:var(--mono)}
.card .ch .big{font-size:20px}
.card .ch .id{font-weight:800;font-size:13px}
.card .ch .path{font-size:11px;color:var(--tmute);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.card h3{margin:4px 0 6px;font-family:var(--ui);font-weight:600;font-size:18px;line-height:1.25;letter-spacing:-.005em;color:#fff}
.card.goal h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
.card .desc{color:#B9BCC4;font-size:13px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 12px;margin-top:8px;font-size:13px}
.kv>div:nth-child(odd){font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tmute);padding-top:2px}
.kv>div{min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-family:var(--mono);font-size:11px;border:1px solid var(--tline);border-radius:6px;padding:0 6px;background:#ffffff08;cursor:pointer;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.pill:hover{border-color:#4a5160;background:#ffffff14}
.cmdbox{margin-top:10px;border:1px solid var(--tline);border-radius:9px;background:var(--term);font-family:var(--mono);font-size:12px;display:flex;align-items:flex-start;gap:8px;padding:8px 10px}
.cmdbox .c{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;color:#F3E9D2}
.cmdbox .c::before{content:"$ ";color:var(--tmute)}
.act{border:1px solid var(--tline);background:var(--term2);color:var(--tink);border-radius:6px;padding:2px 8px;font-family:var(--mono);font-size:11px;white-space:nowrap}
.act:hover{border-color:#4a5160}
.act.go{background:var(--tac);color:#0b1a10;border-color:var(--tac);font-weight:700}
.chosen{border-left:3px solid var(--tdec);padding:4px 0 4px 10px;margin:8px 0 4px}
.rej{padding:3px 0 3px 10px;border-left:3px dashed #ffffff22;margin:4px 0;color:#A7AAB2}
.rej b{text-decoration:line-through;text-decoration-color:#ff7a7a99;color:#C9CBD1;font-weight:500}
.symtab{display:grid;grid-template-columns:14px 42px minmax(0,auto) minmax(0,1fr);gap:2px 8px;font-family:var(--mono);font-size:12px;margin-top:8px;align-items:baseline}
.symtab .sig{color:var(--tmute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.symtab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.kb{font-family:var(--mono);font-size:9.5px;border-radius:4px;padding:0 4px;text-align:center;background:#ffffff10;color:#C8CBD2;letter-spacing:.02em}
.kb.k-test{background:#5fd08c22;color:var(--tac)}
.kb.k-func,.kb.k-method{background:#a29cff22;color:var(--tdec)}
.kb.k-type,.kb.k-interface{background:#4fc8d822;color:var(--tphase)}
.gwt{display:grid;grid-template-columns:48px 1fr;gap:2px 10px;margin-top:8px;font-size:13px}
.gwt>div:nth-child(odd){font-family:var(--mono);font-size:10.5px;color:var(--tmute);text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.more{margin-top:6px}
.more summary{cursor:pointer;color:var(--tmute);font-family:var(--mono);font-size:11px;list-style:none}
.more summary::before{content:"▸ "}
.more[open] summary::before{content:"▾ "}
.more div{color:#B9BCC4;font-size:12.5px;margin-top:4px}
/* trace */
.trace{display:grid;gap:0;margin-top:6px}
.trow{display:grid;align-items:center;min-height:28px;border-radius:6px;transition:background .25s}
.trow.now{background:#ffffff0c}
.trow .tx{padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.trow .lay{display:inline-block;min-width:54px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tmute)}
.eff{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:5px;background:#f07ac022;color:var(--tcs);margin-left:6px}
.tlanes{position:relative}
.tlanes svg{display:block}
.thead{display:grid;font-size:9.5px;color:var(--tmute);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.thead span{text-align:center;overflow:hidden;font-weight:700}
.tctl{display:flex;gap:6px;margin-top:8px;align-items:center}
.result{margin-top:8px;padding:8px 10px;border:1px dashed #5fd08c55;border-radius:8px;color:#CFEFD9;white-space:pre-wrap;overflow-wrap:anywhere}
/* deps graph */
.dg{margin-top:6px;border:1px solid var(--tline);border-radius:12px;background:var(--term2);padding:8px;max-width:900px}
.dg svg{width:100%;height:auto;display:block}
.dg .nd{cursor:pointer}
.dg .nd rect{transition:all .15s}
.dg .nd:hover rect{stroke:#fff}
.dg .ed{fill:none;stroke-width:1.2;opacity:.35;transition:opacity .15s}
.dg.hov .ed{opacity:.07}
.dg.hov .ed.on{opacity:.95;stroke-width:1.8}
.dg.hov .nd{opacity:.35}.dg.hov .nd.on{opacity:1}
.legend{display:flex;gap:14px;font-size:11px;color:var(--tmute);margin:6px 2px 0;flex-wrap:wrap}
/* bars (du) */
.bar{display:inline-flex;height:10px;width:180px;border-radius:3px;overflow:hidden;background:#ffffff0a;vertical-align:middle}
.bar i{display:block;height:100%}
/* grill */
.q{border:1px solid #f2bd4e44;background:linear-gradient(180deg,#f2bd4e10,transparent);border-radius:12px;padding:12px 14px;margin:4px 0;font-family:var(--ui);max-width:760px}
.q .qk{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tgoal)}
.q .qs{font-size:16px;font-weight:600;margin:4px 0 2px;color:#fff}
.q .stem{font-family:var(--mono);font-size:12.5px;color:#D9DBE0;margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--tline);background:var(--term);color:var(--tink);border-radius:9px;padding:7px 10px;margin:5px 0;font-size:13px;align-items:baseline}
.opt:hover:not(:disabled){border-color:#f2bd4e88}
.opt .n{font-family:var(--mono);font-size:11px;color:var(--tgoal);border:1px solid #f2bd4e55;border-radius:4px;padding:0 5px}
.opt.right{border-color:var(--tac);background:#5fd08c18}
.opt.wrong{border-color:var(--tdel);background:#ff7a7a14}
.opt:disabled{cursor:default}
.verdict{margin-top:6px;font-size:13px}
/* input */
.inwrap{border-top:1px solid var(--tline);padding:8px 14px 8px;background:var(--term)}
.inline{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;position:relative}
.inline .field{position:relative;flex:1;min-width:0}
#cmd{width:100%;background:transparent;border:0;outline:0;color:var(--tink);font:inherit;caret-color:var(--tac);padding:4px 0;position:relative;z-index:2}
#ghost{position:absolute;left:0;top:0;padding:4px 0;color:var(--tfaint);white-space:pre;pointer-events:none;z-index:1;font:inherit;overflow:hidden;max-width:100%}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sg{flex:none;border:1px solid var(--tline);background:var(--term2);color:var(--tink);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.sg:hover{border-color:#5a6170;background:#232730}
.sg .gl{margin-right:4px}
.status{display:flex;gap:12px;align-items:center;padding:5px 14px;border-top:1px solid var(--tline);font-family:var(--mono);font-size:10.5px;color:var(--tmute);background:var(--term2);white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status b{color:var(--tink);font-weight:500}
/* ---------- finder (right) ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.crumbs button{border:0;background:transparent;padding:2px 4px;border-radius:5px;color:var(--ink2)}
.crumbs button:hover{background:var(--pane2)}
.crumbs button:last-child{color:var(--ink);font-weight:700}
.crumbs .s{color:var(--faint)}

ny change to autowatch `Backend` or `hooks.CaptureEnv` allowlist","`--text` output mode"]},"goals":[{"id":"G1","title":"Mail has its own vocabulary, defined before any code.","description":"Mail, Address, Subscription, Delivery and Binding land in the glossary first, then the same words are used in schema, events, CLI and commits. Nothing in mail is called a Message, which already names a Session exchange.","sources":["plan goal 1","rail G16","epic D-4"]},{"id":"G2","title":"Agents on one host can send each other mail that waits.","description":"Subscribe, send, list, ack work with no daemon running. Mail sent before anyone subscribes still reaches the later subscriber. Addresses are free-form names with no physical identity in them.","sources":["plan goal 5","C1","rail G5","rail G6","epic D-9","epic D-11"]},{"id":"G3","title":"A busy agent is told it has mail at almost no cost.","description":"The existing PostToolUse hook tells the agent it has mail. The no-mail path costs one stat, never opens the store, and can never stall or break the hook.","sources":["plan goal 7","rail G8","D-062-3","D-062-9"]},{"id":"G4","title":"Delivery is honest: explicit ack, at-least-once, one winner.","description":"Reading never retires mail. Each subscription has its own delivery state, filled lazily from a cursor. Concurrent acks resolve to exactly one winner, and losers are told. No ordering or exactly-once is promised.","sources":["plan goal 6","rail G2","rail G3","rail G4","rail G13","epic D-7","epic D-10"]},{"id":"G5","title":"The store is an append-only log that is safe to wipe.","description":"An event log is the authority; projections update in the same transaction and mail rows never change. The `alpha` marker is in the event types and the filename, and `reset` is a supported operation.","sources":["plan goal 4","rail G1","rail G10","epic D-1","epic D-2"]},{"id":"G6","title":"Only the mail client can reach the store.","description":"`mail.Client` is the one API; the store is internal, so the Go compiler enforces the boundary. A contract suite pins the seam so a second (RPC) client is a new test target, not a redesign.","sources":["plan goal 3","plan goal 2","rail G11","D-062-5","D-062-8"]},{"id":"G7","title":"A real two-agent harness run is the final verdict.","description":"A one-container `mail-flow` scenario runs the real binary through the C1 loop, the nudge and the ack. Existing scenarios and `make check`/`make test` stay green — nothing shipped breaks.","sources":["plan goal 8","plan goal 9","rail G15","D-062-1"]}],"acs":[{"id":"AC1","goal":"G1","title":"The glossary defines the five mail terms, and code avoids `message`.","given":"a glossary with no mail vocabulary","when":"it is updated as the first change, before any Go file","then":"Mail, Address, Subscription, Delivery, Binding exist with _Avoid_/_Has_; `glossary.py check` passes; no mail entity is named `message`","detail":"Defines Mail, Address, Subscription, Delivery and Binding, each with a definition and an _Avoid_ line; _Has_ relations resolve; `glossary.py check` exits 0; ER block refreshed by `glossary.py diagram --write`, not hand-edited; Mail's _Avoid_ lists message and no schema table, event type, Go identifier, CLI noun or JSON field names the stored unit `message` (`--message` stays the body flag); frontmatter summary names the five terms and `auto doc fixed` keeps freshness green.","verify":{"kind":"go-test","cmd":"python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md && cd auto-mail && go test ./mail -run 'TestNoMessageEntity|TestSchemaAndEventTypesUseTheMailVocabulary' -v","tests":["auto-mail/mail/mail_test.go:TestNoMessageEntity","auto-mail/mail/mail_test.go:TestSchemaAndEventTypesUseTheMailVocabulary"]},"verifyNote":"\"Before any code\" is a commit-order property; the squash merge hides it, so ordering is manual (PR history).","decisions":["D10"],"phases":["P1"],"rails":["R12"],"source":"AC-1"},{"id":"AC2"," ation"]},"decisions":["D7","D13"],"phases":["P2","P5"],"rails":["R10"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"At-least-once and unordered is documented; re-acks are idempotent.","given":"`auto mail docs` and `auto-mail/CLAUDE.md`","when":"a delivery is acked twice, or the same id is listed twice","then":"docs state at-least-once/unordered/idempotent; re-ack appends nothing and reports `wonTransition:false`","detail":"Duplicate delivery is simulated at the client boundary (a Client decorator repeating one List entry), never by a second `deliveries` row, which the PK forbids. No test asserts ordering.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run 'TestDirectClientConformance/(re-ack-appends-no-second-event|a-duplicated-delivery-still-transitions-once)' -v && go test ./internal/cli -run TestDocsStatesTheDeliveryContract","tests":["auto-mail/conformance/conformance_test.go:TestDirectClientConformance","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheDeliveryContract"]},"phases":["P4","P5"],"rails":["R4"],"source":"AC-7"},{"id":"AC8","goal":"G2","title":"Addresses are free-form and carry no physical identity.","given":"address validation and a sender with TMUX/NTM env set","when":"`auto-web/bugs` is sent to","then":"`/` is accepted and never normalised; no host/session/pane id appears in the mail row","detail":"Validation rejects only empty, whitespace-padded, control-character and over-length values, each with a remediation. Physical context lives only on `bindings` as an opaque (manager, target) pair — no typed `tmux_pane_id` column.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestValidateAddressIsPermissive|TestBindingLadder|TestNoPhysicalIdentityInStoredMail' -v","tests":["auto-mail/mail/mail_test.go:TestValidateAddressIsPermissive","auto-mail/mail/mail_test.go:TestBindingLadder","auto-mail/mail/mail_test.go:TestNoPhysicalIdentityInStoredMail","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_addresses_carry_no_physical_identity"]},"decisions":["D2","D15"],"phases":["P2","P3"],"rails":["R5"],"source":"AC-8"},{"id":"AC9","goal":"G2","title":"Sending to nobody persists and reports both counts.","given":"an address nobody has subscribed to","when":"`auto mail send --to <address>` runs","then":"exit 0, mail persisted, `subscriptions:0, bound:0`, typo hint on stderr; a later subscriber receives it","detail":"With a subscription but no binding row, payload is `subscriptions:1, bound:0` — in T1 `bound` counts binding rows, not liveness (D-062-2).","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/cli -run TestSendWithNoSubscriptionPersists -v && go test ./internal/store -run TestSubscriptionsAndBoundDiverge && go test ./conformance -run 'TestDirectClientConformance/(send-to-nothing|send-reports)'","tests":["auto-mail/internal/cli/cli_test.go:TestSendWithNoSubscriptionPersists","auto-mail/internal/store/store_test.go:TestSubscriptionsAndBoundDiverge","auto-mail/conformance/conformance_test.go:TestDirectClientConformance","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber"]},"decisions":["D2","D15"],"phases":["P4"],"rails":["R6"],"source":"AC-9"},{"id":"AC10","goal":"G3","title":"The hook nudge costs one stat and can never break the hook.","given":"any mailbox state and a PostToolUse payload","when":"`auto hooks fire --agent claude` runs","then":"zero store opens on both paths; one `hookSpecificOutput` naming `auto mail list` when mail waits; exit 0 always","detail":"Zero opens asserted with a counting store-opener over the package var; stats at most one path. A host that never ran `auto mail init` gets no `alpha-store.db`. Nudge only on PostToolUse; with a matching hint rule both fragments share one emission. Absent, unreadable, locked or corrupt store → exit 0, no malformed stdout, bounded time.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./mail -run 'TestHasPendingOpensNoStore|TestNudgeTextCarriesNoMailboxContent|TestPendingFlag|TestFalsePositiveFlagHealsItself' -v && cd ../auto-cli && go test ./cmd/auto -run 'TestFire(NudgesOnlyWhenMailIsWaiting|NudgeCarriesNoMailboxContent|NudgesOnPostToolUseOnly|EmitsOneObjectWhenMailAndHintBothMatch|SurvivesABrokenMailDirectory|CreatesNoMailStore)|TestEmitAdditionalContextWritesAtMostOneObject' -v","tests":["auto-mail/mail/mail_test.go:TestHasPendingOpensNoStore","auto-mail/mail/mail_test.go:TestNudgeTextCarriesNoMailboxContent","auto-mail/mail/mail_test.go:TestPendingFlagLifecycle","auto-mail/mail/mail_test.go:TestFalsePositiveFlagHealsItself","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnlyWhenMailIsWaiting","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgeCarriesNoMailboxContent","auto-cli/cmd/auto/hooksmail_test.go:TestFireNudgesOnPostToolUseOnly","auto-cli/cmd/auto/hooksmail_test.go:TestFireEmitsOneObjectWhenMailAndHintBothMatch","auto-cli/cmd/auto/hooksmail_test.go:TestFireSurvivesABrokenMailDirectory","auto-cli/cmd/auto/hooksmail_test.go:TestFireCreatesNoMailStore","auto-cli/cmd/auto/hints_test.go:TestEmitAdditionalContextWritesAtMostOneObject","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail","harness/tests/mail_flow/test_mail_loop.py:test_hook_fire_never_breaks_the_agent","harness/tests/mail_flow/test_mail_loop.py:test_hook_creates_no_store_on_a_host_that_never_ran_init"]},"decisions":["D3","D6","D9","D2"],"phases":["P3"],"rails":["R7"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"`alpha` is in event types and filename, and reset works.","given":"the store","when":"its path, events and `reset` are inspected","then":"path is `~/.auto/mail/alpha-store.db`; types are exactly the four `alpha.mail.*`; envelopes carry `version`; reset wipes and the tool works again","detail":"T1 vocabulary: `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`, `alpha.mail.acked` — every type prefixed and these four the complete set. `auto mail reset` reports what it removed. `auto mail docs` states: no upcasters, no migrations, no compatibility guarantee, may be wiped on upgrade.","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./internal/store -run 'TestEveryEnvelopeCarriesAVersion|TestAppendRejectsAnEventOutsideTheAlphaNamespace' -v && go test ./internal/cli -run 'TestInitCreatesAlphaStore|TestReset|TestDocsStatesTheAlphaContract' -v && go test ./mail -run 'TestResetWipesTheAlphaStore|TestSchemaAndEventTypesUseTheMailVocabulary'","tests":["auto-mail/internal/store/store_test.go:TestEveryEnvelopeCarriesAVersion","auto-mail/internal/store/store_test.go:TestAppendRejectsAnEventOutsideTheAlphaNamespace","auto-mail/internal/cli/cli_test.go:TestInitCreatesAlphaStore","auto-mail/internal/cli/cli_test.go:TestResetWipesTheStoreAndTheC1LoopRunsAgain","auto-mail/internal/cli/cli_test.go:TestResetOnAFreshHostRemovesNothing","auto-mail/internal/cli/cli_test.go:TestResetRecoversAStoreWrittenByAnotherSchema","auto-mail/internal/cli/cli_test.go:TestDocsStatesTheAlphaContract","auto-mail/mail/mail_test.go:TestResetWipesTheAlphaStore","harness/tests/mail_flow/test_mail_loop.py:test_store_carries_the_alpha_marker_in_its_filename"]},"decisions":["D4","D12"],"phases":["P1","P5"],"rails":["R8"],"source":"AC-11"},{"id":"AC12","goal":"G6","title":"Nothing outside the mail store package opens the mail store.","given":"the whole repository","when":"a guard test walks every module, the harness and `skills/`","then":"no file outside `auto-mail/internal/store` both names the mail store and opens a DB; no outside import of `auto-mail/internal/…`","detail":"Scoped to the mail store, not SQLite in general (auto-watch and auto-search legitimately import `modernc.org/sqlite`). The internal-import half is already a compile-time guarantee; the test is a regression guard. `auto-cli` reaches mail only through `auto-mail/mail`. Failure names the file and says \"go through mail.Client\".","verify":{"kind":"go-test","cmd":"cd auto-mail && go test ./conformance -run TestNothingOutsideTheMailPackageOpensTheStore -v","tests":["auto-mail/conformance/seam_test.go:TestNothingOutsideTheMailPackageOpensTheStore"]},"decisions":["D8","D5"],"phases":["P5"],"rails":["R9"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"The whole loop passes end to end in the harness.","given":"`uv run harness mail-flow up` from `harness/`","when":"`uv run pytest tests/mail_flow -v` runs","then":"one container, one host id, two workspaces; the C1 loop, nudge, ack and send-before-subscribe pass against the real binary","detail":"`check_ready()` fails fast if the store is uninitialised or a workspace unregistered. Bounded retry on observable outcomes, no sleep-to-settle, no count assertions duplicates would break. Registered in `SCENARIOS`; no existing scenario changed. `make check`, `make test`, `make test-race` green with auto-mail in `RACE_PROJECTS`.","verify":{"kind":"harness","cmd":"cd harness && uv run harness mail-flow up && uv run pytest tests/mail_flow -v; uv run harness mail-flow down; cd .. && make check test test-race","tests":["harness/tests/mail_flow/test_mail_loop.py:test_single_host_two_registered_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_list_is_empty_json_from_both_workspaces","harness/tests/mail_flow/test_mail_loop.py:test_docs_are_discoverable_from_a_workspace","harness/tests/mail_flow/test_mail_loop.py:test_init_is_idempotent","harness/tests/mail_flow/test_mail_loop.py:test_c1_loop_one_message_travels_and_is_acked","harness/tests/mail_flow/test_mail_loop.py:test_send_with_no_subscription_persists_for_a_later_subscriber","harness/tests/mail_flow/test_mail_loop.py:test_from_now_opts_out_of_the_backlog","harness/tests/mail_flow/test_mail_loop.py:test_broadcast_gives_each_subscription_its_own_ack_state","harness/tests/mail_flow/test_mail_loop.py:test_hook_nudges_a_working_agent_that_has_mail"]},"verifyNote":"Harness is not in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One client interface is the only API. A skill or hook running sqlite3 against the store would freeze the schema.","ac":"AC12","goal":"G6","source":"G11"},{"id":"R10","title":"Ack transitions exactly once and reports whether it won","text":"Ack is a conditional update inside the append transaction; a loser is told, never silently treated as success.","ac":"AC6","goal":"G4","source":"G13"},{"id":"R11","title":"Done means it passes end to end in the harness","text":"A harness scenario running the real binary is the verdict; bounded retry, and missing seams are findings, not workarounds.","ac":"AC13","goal":"G7","source":"G15"},{"id":"R12","title":"The ontology lands before the code","text":"Canonical terms go into the glossary first, then the same word is used in every surface.","ac":"AC1","goal":"G1","source":"G16"}],"phases":[{"id":"P1","title":"Ontology, module skeleton, and the scenario comes up","summary":"Glossary first; `auto mail init/docs/list` on a minimal store; mounted in `auto`; `mail-flow` scenario green.","dependsOn":[],"goals":["G1","G6","G7"],"acs":["AC1","AC11","AC13"],"files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","harness/tests/m l/ulid/ulid_test.go`, `auto-mail/mail/export_test.go`.","`cli_test.go` imports `auto-mail/internal/store` (test-only, inside the module — allowed by the internal rule).","Seam guard flags a file only if it both names the mail store (alpha-store.db, alpha-flags, .auto/mail) AND contains a DB opener (sqlite, database/sql, sql.Open, sqlite3) — matches the T7 resolution.","Glossary Binding definition dropped \"and liveness\" from the plan's draft wording — consistent with D-062-2 (no liveness in T1).","Old plan ids G1–G16 are guard rails; renamed R1–R12 here (source keeps the epic id). Goals G1–G7 are new clusters.","Epic decisions D-1, D-2, D-4, D-7, D-9, D-10, D-11 are included as D10–D16 (by: epic); D-3, D-5 (superseded), D-6, D-8, D-12, D-13 are referenced only via out-of-scope."]}</script>
<script type="application/json" id="model-052">{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8","F3","F11"]}],"acs":[{"id":"AC1","goal":"G1","title":"gap list surfaces reported gaps","given":"feedback events carrying a `gap`","when":"`auto reflect gap list`","then":"JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted","detail":"Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSurfacesGaps","auto-reflect/internal/cli/gap_integration_test.go:TestGapListOmitsGaplessFeedback"]},"decisions":["D1","D14"],"phases":["P5"],"source":"AC-1"},{"id":"AC2","goal":"G1","title":"gap list obeys list conventions","given":"gaps across sessions and times","when":"`gap list` unfiltered, or with a time filter","then":"all gaps unfiltered; `--since/--after/--before` filter; empty state is `[]`; text mode works","detail":"Given gaps spanning multiple sessions/domains/times, when I run gap list with no filters, then all gaps are returned; and --since/--after/--before and --domain filter correctly (one filter mode at a time), input normalized, JSON by default with --format text available.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapList(SinceFilter|EmptyReturnsArray|TextFormat|DomainUnsupported)'","tests":["auto-reflect/internal/cli/gap_integration_test.go:TestGapListSinceFilter","auto-reflect/internal/cli/gap_integration_test.go:TestGapListEmptyReturnsArray","auto-reflect/internal/cli/gap_integration_test.go:TestGapListTextFormat","auto-reflect/internal/cli/gap_integration_test.go:TestGapListDomainUnsupported"]},"decisions":["D14"],"phases":["P5"],"source":"AC-2"},{"id":"AC3","goal":"G2","title":"One pending count, two callers agree","given":"an ETL fixture with non-canonical session remotes","when":"`miner status` and `stats` run on it","then":"`pending` == `pending_to_mine`; both from `miner.PendingCount`","detail":"Given any repo + ETL state, when I run `auto reflect miner status` and `auto reflect stats`, then pending == pending_to_mine (both computed by one shared function), and the counted universe is documented. A unit test pins them equal on a fixture where they previously diverged.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestMinerStatusPendingMatchesStats|TestMinerStatusCoveragePctNullWhenNoInScopeSessions'","tests":["auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusPendingMatchesStats","auto-reflect/internal/cli/miner_integration_test.go:TestMinerStatusCoveragePctNullWhenNoInScopeSessions"]},"decisions":["D13"],"phases":["P4"],"source":"AC-3"},{"id":"AC4","goal":"G3","title":"Mutations expose a top-level id","given":"the uniform output envelope","when":"`observation add`, `rule create/edit/promote/retire/graduate`, `consolidate`","then":"id(s) at `.id` / `.ids`, never null or only nested","detail":"Given the uniform output envelope, when I run an id-minting / entity mutation (observation add, rule create/edit/promote/retire/graduate, consolidate), then the relevant id(s) are reachable at a predictable top-level path (.id for single, .ids for many), never null and never only nested. (feedback echoes the feedback ids it acted on as ids; rebuild carries counts only.)","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestObservationAddExposesTopLevelID|TestConsolidateDeterministicIDs'","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddExposesTopLevelID","auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs"]},"decisions":["D3","D5","D7"],"phases":["P1","P2","P3"],"source":"AC-4"},{"id":"AC5","goal":"G3","title":"Collection rows expose `.id` without data loss","given":"`retrieve`, `select`, `rule list`, `observation list`, `events list`, `gap list`","when":"their JSON is parsed","then":"each row id at a uniform path; prior fields kept; skill refs + quickstart updated","detail":"Given the envelope migration of retrieve, select, rule list, observation list, events list, gap list, when I parse their JSON, then each element's id is reachable at a uniform path (.[].id or .results[].id), every field present before the change is still present, and the reflect-playbook skill refs + quickstart are updated to the new paths.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestObservationListElementsCarryID && go test ./cmd/autoreflect -run TestE2ELoopQuickstart","tests":["auto-reflect/internal/cli/observation_integration_test.go:TestObservationListElementsCarryID","auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart"]},"decisions":["D7"],"phases":["P1","P3"],"source":"AC-5"},{"id":"AC6","goal":"G4","title":"Consolidate is deterministic and idempotent","given":"one consolidation delta document","when":"`consolidate --dry-run` then `consolidate`, then apply again","then":"same rule id in both runs; second apply adds no duplicate","detail":"Given one consolidation delta document, when I run consolidate --dry-run and then consolidate (separate invocations), then the rule id is identical across both; and re-running the same consolidate a second time is a no-op (no duplicate rule) because the content-derived id already exists.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestConsolidateDeterministicIDs|TestObservationAddIsIdempotent' && go test ./internal/idhash","tests":["auto-reflect/internal/cli/consolidate_integration_test.go:TestConsolidateDeterministicIDs","auto-reflect/internal/cli/observation_integration_test.go:TestObservationAddIsIdempotent","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDeterministic"]},"decisions":["D4","D8","D9"],"phases":["P1","P2"],"source":"AC-6"},{"id":"AC7","goal":"G4","title":"Ids keep their format","given":"content-derived minting","when":"rule / observation ids are generated","then":"still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; validators unchanged","detail":"Given content-derived minting, when rule/observation ids are generated, then they still match ^r-[0-9a-f]{8}$ / ^ob-[0-9a-f]{8}$; existing validators are unchanged; events already on disk keep their original ids.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/idhash ./internal/observations -run 'TestDerive|TestNewObservationIDFormat|TestCanonicalPartsDeriveStableID'","tests":["auto-reflect/internal/idhash/idhash_test.go:TestDeriveFormat","auto-reflect/internal/idhash/idhash_test.go:TestDeriveDifferentPartsDifferentID","auto-reflect/internal/observations/model_test.go:TestNewObservationIDFormat","auto-reflect/internal/observations/model_test.go:TestCanonicalPartsDeriveStableID"]},"decisions":["D6"],"phases":["P1","P2"],"source":"AC-7"},{"id":"AC8","goal":"G6","title":"init writes an idempotent .gitignore","given":"a repo","when":"`auto reflect init` runs (twice)","then":"`.auto/reflect/.gitignore` ignores `playbook.json`, not `events/`; not rewritten","detail":"Given a repo, when I run auto reflect init (or init --project), then .auto/reflect/.gitignore exists and ignores playbook.json (not events/); running init again does not overwrite or duplicate it.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestInitWritesStateGitignore|TestInitGitignoreIdempotent'","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore","auto-reflect/internal/cli/init_test.go:TestInitGitignoreIdempotent"]},"decisions":["D2","D10"],"phases":["P7"],"source":"AC-8"},{"id":"AC9","goal":"G6","title":"Canonical events tracked, cache ignored","given":"the repo's own `.auto/reflect/`","when":"git status is checked after init","then":"`events/*.jsonl` committable; `playbook.json` untracked","detail":"Given the repo's own .auto/reflect/, when I check git status after init, then .auto/reflect/events/*.jsonl is tracked/committable and playbook.json is untracked (removed from the index with git rm --cached if previously tracked).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestInitWritesStateGitignore && git ls-files .auto/reflect","tests":["auto-reflect/internal/cli/init_test.go:TestInitWritesStateGitignore"]},"decisions":["D2"],"phases":["P7"],"source":"AC-9"},{"id":"AC10","goal":"G6","title":"doctor detects stale or partial state","given":"missing `events/`, stale snapshot, or legacy `feedback.jsonl`","when":"`auto reflect doctor`","then":"JSON `[{check,status,message,hint}]`; hints on failures; exit 1 on any fail","detail":"Given a partial reflect state (e.g. state dir present but events/ missing, or playbook.json stale vs the folded event log), when I run auto reflect doctor, then it returns structured JSON [{check,status,message,hint}], each failure carries a concrete remediation hint, and the process exits non-zero on any fail.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run TestDoctor","tests":["auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorHealthyAllPass","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorMissingEventsFails","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorStaleSnapshotWarns","auto-reflect/internal/cli/doctor_integration_test.go:TestDoctorLegacyFeedbackWarns"]},"decisions":["D11"],"phases":["P6"],"source":"AC-10"},{"id":"AC11","goal":"G5","title":"Rule listings carry timestamps","given":"a folded rule with timestamps set by `Fold`","when":"`rule list` and `rule get`","then":"both expose non-empty `created_at` / `updated_at`","detail":"Given a folded rule with created_at/updated_at set by Fold, when I run auto reflect rule list and rule get, then both expose non-empty created_at/updated_at (list no longer drops them in its projection map).","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/rules -run TestFoldSurfacesTimestampsForListView","tests":["auto-reflect/internal/rules/projection_test.go:TestFoldSurfacesTimestampsForListView"]},"decisions":["D12"],"phases":["P3"],"source":"AC-11"},{"id":"AC12","goal":"G7","title":"outcome enum and correction_density documented","given":"the docs","when":"a reader consults quickstart and skill references","then":"`outcome` enum (distinct from ack status) and `correction_density` definition + scale are documented","detail":"Given the docs, when a reader consults quickstart and the reflect-playbook references, then the feedback outcome enum (success|partial|fail|abandoned, distinct from miner ack status) and correction_density (definition + scale) are documented; a malformed outcome error already names the valid set.","verify":{"kind":"manual","cmd":"auto reflect quickstart | grep -E 'abandoned|correction_density'; grep -n correction_density skills/reflect-playbook/references/mine.md","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-12"},{"id":"AC13","goal":"G7","title":"Legacy yaml removed","given":"the superseded process artifacts","when":"the task lands","then":"`docs/reflection/observations.yaml` deleted; only retired `playbook-*` skills referenced it","detail":"Given the superseded process artifacts, when the task lands, then docs/reflection/observations.yaml is deleted and the reflect-playbook 'supersedes' note reflects the removal. The only remaining referencers are the already-superseded playbook-observe/-refine/-search skills (no Go code reads the file); per F11 a future run would regenerate an empty file — the discard is intended.","verify":{"kind":"manual","cmd":"git ls-tree 34d1d22 docs/reflection/observations.yaml  # expect empty; git grep -n 'observations.yaml' 34d1d22 -- '*.go'","tests":[]},"decisions":[],"phases":["P7"],"source":"AC-13"},{"id":"AC14","goal":"G1","title":"No regressions; the e2e loop runs through gap list","given":"all changes","when":"`go build ./...` and the full auto-reflect suite run","then":"all green with assertions moved to the new envelope; loop completes through `gap list`","detail":"Given all changes, when I run go build ./... and the full auto-reflect test suite, then everything builds and passes (existing assertions updated to the new envelope), and the end-to-end reflect loop completes as in quickstart.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go build ./... && go test ./...","tests":["auto-reflect/cmd/autoreflect/e2e_loop_test.go:TestE2ELoopQuickstart","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EPromoteTaskGate","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2ELifecycleRetrieval","auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go:TestE2EGraduateEnforced"]},"decisions":[],"phases":["P1","P2","P3","P4","P5","P6","P7"],"source":"AC-14"}],"decisions":[{"id":"D1","title":"Gaps get a dedicated `gap list` command","chosen":"Dedicated `auto reflect gap list` noun","why":"Matches the gap -> observation mental model and is discoverable.","rejected":[{"option":"Generic `events list --full/--payload` flag","why":"Payload dump, not a gap view; hides the loop-back.","wouldBreak":["G1"]},{"option":"Both","why":"Two surfaces for one need.","wouldBreak":[]}],"by":"charlie","goals":["G1"],"acs":["AC1","AC2"],"source":"D-1"},{"id":"D2","title":"The event log is git-tracked","chosen":"`events/*.jsonl` committed; `.gitignore` ignores only `playbook.json`","why":"Shared playbook history travels with the repo; any clone can `rebuild`.","rejected":[{"option":"Ignore events too (machine-local state)","why":"Loses shared history across clones and hosts.","wouldBreak":["AC9"]}],"by":"charlie","goals":["G6"],"acs":["AC8","AC9"],"source":"D-2"},{"id":"D3","title":"Restructure to a uniform envelope (breaking)","chosen":"Normalize output shapes around top-level ids","why":"Cleanest end state; consumers and skill refs move in lockstep.","rejected":[{"option":"Additive-only `.id`/`.ids` on today's shapes","why":"Leaves the inconsistent nesting in place.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-3"},{"id":"D4","title":"Content-derived ids ship in this task","chosen":"Implement F7 now, not as a follow-up","why":"Deterministic ids make `--dry-run` output actionable; fits the output-contract theme.","rejected":[{"option":"Defer F7 to a follow-up","why":"Dry-run previews stay un-actionable.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-4"},{"id":"D5","title":"Envelope changes CLI output only, not stored events","chosen":"Presentation-layer restructure; payload names + `schema_version=1` untouched","why":"The append-only log must fold identically forever; the playbook is a disposable view.","rejected":[{"option":"Rename stored payload fields / bump schema","why":"Breaks the append-only on-disk contract.","wouldBreak":["AC14"]}],"by":"agent","goals":["G3"],"acs":["AC4"],"source":"D-5"},{"id":"D6","title":"Content-derived ids keep existing formats","chosen":"Only minting changes (random -> hash prefix); regexes stay","why":"Existing ids stay valid and validators unchanged.","rejected":[{"option":"New / longer id format","why":"Invalidates validators and on-disk ids.","wouldBreak":["AC7"]}],"by":"agent","goals":["G4"],"acs":["AC7"],"source":"D-6"},{"id":"D7","title":"Top-level id on mutations, per-row id on reads","chosen":"Mutations expose `.id`/`.ids`; collections stay arrays with row `.id`","why":"Predictable threading with minimal breakage; lists still return plain payloads.","rejected":[{"option":"Wrap every command in `{ok,data}`","why":"Over-wraps reads, breaks more consumers, fights list convention.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-7"},{"id":"D8","title":"Only rule and observation ids are content-derived","chosen":"`r-`/`ob-` hashed; `rt-`/`fb-`/`ev-` stay random","why":"Loop and event records are distinct-in-time; hashing would collapse them.","rejected":[{"option":"Content-derive all ids","why":"Two identical retrievals would merge into one record.","wouldBreak":["AC14"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-8"},{"id":"D9","title":"Pure content hash, no collision suffix","chosen":"`prefix-` + first 8 hex of sha256(parts joined by newline)","why":"Clean idempotency; distinct-content 32-bit collision risk is negligible; evidence in obs hash keeps findings distinct.","rejected":[{"option":"Hash + suffix on collision","why":"Breaks idempotency and needs a state read at mint.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6","AC7"],"source":"D-9"},{"id":"D10","title":"Per-state-dir .gitignore","chosen":"`.auto/reflect/.gitignore` written stat-then-skip (auto-doc style)","why":"Keeps the policy with the state it governs.","rejected":[{"option":"Append to repo-root `.gitignore` (auto-skill style)","why":"Scatters reflect policy into the repo root.","wouldBreak":["AC8"]}],"by":"agent","goals":["G6"],"acs":["AC8"],"source":"Rejected Alternatives (F9)"},{"id":"D11","title":"Health checks live in a new `doctor`","chosen":"New `auto reflect doctor` mirroring auto-graph's","why":"`doctor` is the conventional health command across auto-* tools.","rejected":[{"option":"Extend `gate check`","why":"Gate is a loop-closure check, not state health.","wouldBreak":["AC10"]}],"by":"agent","goals":["G6"],"acs":["AC10"],"source":"Rejected Alternatives (F1)"},{"id":"D12","title":"Fix timestamps in the list view, not Fold","chosen":"Add `created_at`/`updated_at` to `rule list`'s projection map","why":"`Fold` already sets them from `Event.TS`; only the list map dropped them.","rejected":[{"option":"Change `Fold`","why":"Fold is already correct.","wouldBreak":[]}],"by":"agent","goals":["G5"],"acs":["AC11"],"source":"Rejected Alternatives (F6)"},{"id":"D13","title":"PendingCount carries the scope axis","chosen":"`PendingCount(repoRoot, etlRoot, allWorkspaces bool)`","why":"`miner status --all` must count the same universe as its total/mined breakdown.","rejected":[{"option":"Single-source with repo scope only (as planned)","why":"Under `--all`, total != pending + mined.","wouldBreak":["AC3"]}],"by":"agent","goals":["G2"],"acs":["AC3"],"source":"as-built (PR review)"},{"id":"D14","title":"`gap list --domain` fails fast","chosen":"Exit 1 with hint to `observation list --kind gap --domain`","why":"Feedback gaps carry no domain; a silent `[]` would mislead.","rejected":[{"option":"Accept `--domain` and filter (as planned)","why":"Filter can never match anything.","wouldBreak":[]}],"by":"agent","goals":["G1"],"acs":["AC2"],"source":"as-built"}],"findings":[{"id":"F4","title":"Feedback gaps are write-only","priority":"P1","fix":"Add `auto reflect gap list`.","goal":"G1"},{"id":"F2","title":"`miner status` pending (390) != `stats` pending_to_mine (396)","priority":"P1","fix":"Both call `miner.PendingCount`; scope key uses `sharedgit.NormalizeRemoteURL`.","goal":"G2"},{"id":"F5","title":"Each command nests minted ids differently; `rule promote` `.id` is null","priority":"P2","fix":"Uniform envelope: `.id`/`.ids` on mutations, row `.id` on reads.","goal":"G3"},{"id":"F7","title":"Dry-run ids differ from apply ids","priority":"P2","fix":"Content-hash `r-`/`ob-` ids via `idhash.Derive`.","goal":"G4"},{"id":"F6","title":"Rule `created_at`/`updated_at` come back empty","priority":"P2","fix":"Add them to the `rule list` projection map.","goal":"G5"},{"id":"F1","title":"Stale/partial init state undetected","priority":"P2","fix":"New `auto reflect doctor` with remediation hints.","goal":"G6"},{"id":"F9","title":"`.auto/reflect/` git policy self-contradictory","priority":"P2","fix":"`init` writes `.gitignore` ignoring `playbook.json`; untrack it.","goal":"G6"},{"id":"F8","title":"`outcome` enum undocumented","priority":"P3","fix":"Docstring + quickstart + retrieve.md.","goal":"G7"},{"id":"F3","title":"`correction_density` undocumented","priority":"P3","fix":"Docstring in score.go + mine.md.","goal":"G7"},{"id":"F11","title":"Legacy `docs/reflection/*.yaml` still present","priority":"P3","fix":"Delete `observations.yaml`; no migration.","goal":"G7"},{"id":"F10","title":"No nudge for observed-but-unacked sessions","priority":"P3","fix":"Out of scope (deferred).","goal":null}],"phases":[{"id":"P1","title":"Foundations + walking skeleton","summary":"idhash + output envelope, proven on `observation add/list`.","dependsOn":[],"goals":["G3","G4"],"acs":["AC4","AC5","AC7"],"files":["auto-reflec function ensureDir(path) { let n = S.root; for (const seg of path.split('/').filter(Boolean)) n = n.children[seg] || add(n, N(seg, 'dir')); return n; }
const real = n => (n && n.type === 'link') ? n.to : n;
const isContainer = n => !!(n && real(n) && real(n).children);

function symNode(filePath, name) {
  const f = S.files[filePath]; if (!f) return null;
  const kids = Object.values(f.children);
  const last = String(name).split('.').pop();
  return kids.find(k => k.obj.name === name)
    || kids.find(k => k.obj.name.endsWith('.' + last) && name.endsWith(k.obj.name.split('.').pop()))
    || kids.find(k => k.obj.name === last)

function build(M) {
  S.M = M; S.idx = {}; S.files = {};
  const root = N('', 'dir'); root.path = '/'; root.parent = null; S.root = root;
  add(root, N('README.md', 'doc', {kind:'readme'}));
  if (M.plan.transcript) add(root, N('journey.sh', 'doc', {kind:'journey'}));
  const coll = (name, kind) => add(root, N(name, 'dir', {kind:'coll', of:kind}));
  const reg = (kind, obj, dir) => { const n = add(dir, N(obj.id, 'ent', {kind, obj})); S.idx[obj.id] = n; return n; };
  const dG = coll('goals', 'goal'); M.goals.forEach(o => reg('goal', o, dG));
  const dA = coll('acs', 'ac'); M.acs.forEach(o => reg('ac', o, dA));
  const dD = coll('decisions', 'dec'); M.decisions.forEach(o => reg('dec', o, dD));
  if (M.rails) { const d = coll('rails', 'rail'); M.rails.forEach(o => reg('rail', o, d)); }
  if (M.findings) { const d = coll('findings', 'find'); M.findings.forEach(o => reg('find', o, d)); }
  const dP = coll('phases', 'phase'); M.phases.forEach(o => reg('phase', o, dP));
  const dC = coll('stacks', 'cs'); M.callstacks.forEach(o => reg('cs', o, dC));
  const dT = coll('threads', 'thread'); (M.threads || []).forEach(o => reg('thread', o, dT));
  const dM = coll('glossary', 'term'); (M.terms || []).forEach(o => { const n = add(dM, N(o.term, 'ent', {kind:'term', obj:Object.assign({id:o.term, title:o.def}, o)})); S.idx['§' + o.term.toLowerCase()] = n; });

  for (const f of M.files) {
    const parts = f.path.split('/'); const dir = ensureDir('/repo/' + parts.slice(0, -1).join('/'));
    const fn = add(dir, N(parts[parts.length - 1], 'file', {obj:f}));
    S.files[f.path] = fn;
    for (const s of f.symbols || []) add(fn, N(s.name, 'sym', {obj:s, file:f}));
  }
  // links — the lineage, as symlinks
  const link = (from, to, name) => { if (!to) return; add(from, N(name || to.name, 'link', {to})); };
  const I = id => S.idx[id];
  for (const g of M.goals) {
    const n = I(g.id);
    M.acs.filter(a => a.goal === g.id).forEach(a => link(n, I(a.id)));
    M.decisions.filter(d => (d.goals || []).includes(g.id)).forEach(d => link(n, I(d.id)));
    (M.rails || M.findings || []).filter(r => r.goal === g.id).forEach(r => link(n, I(r.id)));
    M.callstacks.filter(c => (c.goals || []).includes(g.id)).forEach(c => link(n, I(c.id)));
  }
  for (const a of M.acs) {
    const n = I(a.id);
    link(n, I(a.goal));
    (a.decisions || []).forEach(d => link(n, I(d)));
    (a.rails || []).forEach(r => link(n, I(r)));
    (a.phases || []).forEach(p => link(n, I(p)));
    (a.verify.tests || []).forEach(t => { const s = testNode(t); if (s) link(n, s); });
  }
  for (const d of M.decisions) { const n = I(d.id); (d.goals || []).forEach(g => link(n, I(g))); (d.acs || []).forEach(a => link(n, I(a))); }
  for (const r of (M.rails || [])) { const n = I(r.id); link(n, I(r.goal)); link(n, I(r.ac)); }
  for (const r of (M.findings || [])) { const n = I(r.id); link(n, I(r.goal)); }
  for (const p of M.phases) {
    const n = I(p.id);
    (p.dependsOn || []).forEach(x => link(n, I(x)));
    (p.goals || []).forEach(x => link(n, I(x)));
    (p.acs || []).forEach(x => link(n, I(x)));
    (p.files || []).forEach(f => link(n, S.files[f], base(f)));

    const n = I(c.id);

  S.verified = store.get('verified-' + M.plan.id, {});
}

function walk(path, from) {
  if (path == null || path === '') return from;
  let n = (path.startsWith('/') || path.startsWith('~')) ? S.root : from;
  for (const s of path.replace(/^~/, '').split('/').filter(Boolean)) {
    if (s === '.') continue;
    if (s === '..') { n = real(n).parent || S.root; continue; }
    n = real(n);
    if (!n.children) return null;
    let c = n.children[s];
    if (!c) { const low = s.toLowerCase(); const k = Object.keys(n.children).find(k => k.toLowerCase() === low); c = k && n.children[k]; }
    if (!c) return null;
    n = c;
  }
  return n;
}
function resolve(arg) {
  if (arg == null) return {node:S.cwd};
  const w = walk(arg, S.cwd); if (w) return {node:w};
  const id = arg.toUpperCase();
  if (S.idxU[id]) return {node:S.idxU[id]};
  if (S.idx['§' + arg.toLowerCase()]) return {node:S.idx['§' + arg.toLowerCase()]};
  const rp = arg.replace(/^\/?repo\//, '');
  if (S.files[rp]) return {node:S.files[rp]};
  // name search across repo (file basenames, symbols) — exact, then case-insensitive
  const pool = S.all.filter(n => n.type === 'file' || n.type === 'sym');
  let hits = pool.filter(n => n.name === arg || (n.obj && n.obj.name === arg));
  if (!hits.length) { const l = arg.toLowerCase(); hits = pool.filter(n => n.name.toLowerCase() === l || (n.obj && String(n.obj.name).toLowerCase() === l)); }
  if (!hits.length && arg.includes('/')) hits = S.all.filter(n => n.type === 'file' && n.obj.path.endsWith(arg));
  if (!hits.length && arg.includes('.') && !arg.includes('/')) { const last = arg.split('.').pop(); hits = pool.filter(n => n.type === 'sym' && n.obj.name.endsWith('.' + last) && arg.endsWith(n.obj.name)); }
  if (hits.length === 1) return {node:hits[0]};
  if (hits.length > 1) return {many:hits};
  return {};
}

/* ---------------------------------------------------------- rendering */
function glyph(kind, big) {
  if (kind === 'ac') return `<span class="gl gl-ac"><span class="sq">✓</span></span>`;
  const k = KINDS[kind]; return `<span class="gl gl-${k.c}">${k.g}</span>`;
}
function titleOf(n) {
  n = real(n); if (!n) return '';
  if (n.type === 'ent') return n.obj.title || n.obj.def || '';
  if (n.type === 'file') return n.obj.why || n.obj.path;
  if (n.type === 'sym') return n.obj.sig || n.obj.name;
  if (n.type === 'doc') return n.kind === 'readme' ? S.M.plan.oneLiner : 'the C1 transcript';
  return '';
}
function plain(s) { return String(s || '').replace(/`/g, ''); }
function short(s, n = 70) { s = plain(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
/* inline markdown + id linkification. In 062 free text the plan used G-numbers for its epic guard

function rich(s, free = true) {

    }

}

function lineage(n0) {

  const acIds = new Set();
  const acOf = id => M.acs.find(a => a.id === id);
  const warmAC = id => { const a = acOf(id); if (!a) return; warm.add(id); warm.add(a.goal); };
  if (n.type === 'ent') {
    const o = n.obj, id = o.id; hot.add(id);
    switch (n.kind) {
      case 'goal': M.acs.filter(a => a.goal === id).forEach(a => warm.add(a.id)); M.decisions.filter(d => (d.goals || []).includes(id)).forEach(d => warm.add(d.id)); (M.rails || M.findings || []).filter(r => r.goal === id).forEach(r => warm.add(r.id)); M.callstacks.filter(c => c.goals.includes(id)).forEach(c => warm.add(c.id)); break;
      case 'ac': warm.add(o.goal); (o.decisions || []).forEach(d => warm.add(d)); (o.rails || []).forEach(d => warm.add(d)); (o.phases || []).forEach(d => warm.add(d)); M.callstacks.filter(c => c.acs.includes(id)).forEach(c => warm.add(c.id)); (o.verify.tests || []).forEach(t => { const s = testNode(t); if (s) paths.add(s.path); }); break;
      case 'dec': (o.goals || []).forEach(g => warm.add(g)); (o.acs || []).forEach(warmAC); break;
      case 'rail': warm.add(o.goal); warmAC(o.ac); break;
      case 'find': warm.add(o.goal); break;
      case 'phase': (o.goals || []).forEach(g => warm.add(g)); (o.acs || []).forEach(g => warm.add(g)); (o.files || []).forEach(f => S.files[f] && paths.add(S.files[f].path)); break;
      case 'cs': (o.goals || []).forEach(g => warm.add(g)); (o.acs || []).forEach(g => warm.add(g)); o.frames.forEach(f => f._node && paths.add(f._node.path)); break;
      case 'thread': (o.refs || []).forEach(r => warm.add(r)); break;
    }

    const f = n.type === 'file' ? n.obj : n.file;
