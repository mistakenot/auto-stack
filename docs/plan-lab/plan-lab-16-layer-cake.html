<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer Cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4eee3; --paper:#fbf8f2; --ink:#2a211b; --ink2:#5f5248; --ink3:#968779; --line:#e2d7c6; --line2:#cdbfa9;
  --tier:#efe4d2; --tierSide:#d9c7ab; --tierGlow:#f3b23c;
  --ok:#2f8a55; --okBg:#e3f2e7; --bad:#c23b32; --badBg:#fbe6e2; --warn:#b7791f; --warnBg:#fbf0d9; --cyc:#7c3aed; --cycBg:#efe7fd;
  --accent:#d9481c; --needle:#1d4ed8;
  --m-mail:#b83256; --m-reflect:#16786e; --m-cli:#7a4f3a; --m-shared:#b5891f; --m-ext:#5b6470; --m-harness:#3f8a57; --m-doc:#8a7d70;
  --goal:#2a211b; --ac:#2f8a55; --dec:#6d3fc0; --rail:#c2410c;
  --shadow:0 1px 0 rgba(60,40,20,.05),0 6px 18px -8px rgba(60,40,20,.25);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif; --serif:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181410; --paper:#211c17; --ink:#f2e9dc; --ink2:#c7b8a5; --ink3:#8d7f70; --line:#3a3129; --line2:#4d4238;
    --tier:#2a231d; --tierSide:#15110d; --okBg:#173324; --badBg:#3a1b17; --warnBg:#3a2d14; --cycBg:#2a1f45; --needle:#6ea0ff;
    --goal:#f2e9dc; --dec:#a88af0; --ac:#5cc98a;
  }
}
:root[data-theme="dark"]{
    --bg:#181410; --paper:#211c17; --ink:#f2e9dc; --ink2:#c7b8a5; --ink3:#8d7f70; --line:#3a3129; --line2:#4d4238;
    --tier:#2a231d; --tierSide:#15110d; --okBg:#173324; --badBg:#3a1b17; --warnBg:#3a2d14; --cycBg:#2a1f45; --needle:#6ea0ff;
    --goal:#f2e9dc; --dec:#a88af0; --ac:#5cc98a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand h1{font:800 24px/1 var(--serif);margin:0;letter-spacing:-.02em}
.brand h1 i{font-weight:400;color:var(--accent)}
.brand small{font:500 10px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.seg button small{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scrub{display:flex;align-items:center;gap:0;font:500 11px var(--mono)}
.scrub span.lab{color:var(--ink3);margin-right:8px;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.scrub button{border:1px solid var(--line2);background:var(--paper);padding:4px 8px;margin-left:-1px}
.scrub button:first-of-type{border-radius:999px 0 0 999px}
.scrub button:last-of-type{border-radius:0 999px 999px 0}
.scrub button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.quiz[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* ---------- glyphs ---------- */
.g{display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.g-goal{color:var(--goal)}
.g-ac{width:13px;height:13px;border:1.5px solid var(--ac);color:var(--ac);border-radius:2px;font-size:9px;line-height:1}
.g-dec{color:var(--dec)}
.g-rail{color:var(--rail)}
.g-cs{color:var(--needle)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 4px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font:500 11px var(--mono);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink3)}
.chip.hl{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.hl .g{color:inherit;border-color:currentColor}
.chip.dim{opacity:.35}
/* ---------- layout ---------- */
main{display:grid;grid-template-columns:292px minmax(0,1fr) 360px;gap:0;min-height:calc(100vh - 56px)}
#rail{border-right:1px solid var(--line);padding:14px 14px 30px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
#insp{border-left:1px solid var(--line);padding:14px 16px 40px;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 56px);position:sticky;top:56px;background:var(--paper)}
#stage{padding:14px 18px 30px;min-width:0}
.sec-h{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sec-h:first-child{margin-top:0}
/* rail goals */
.goal{padding:7px 8px 8px;border-radius:8px;border:1px solid transparent;margin-bottom:3px;cursor:pointer;transition:opacity .2s,background .2s}
.goal:hover{background:var(--paper);border-color:var(--line)}
.goal .gt{display:flex;gap:8px;align-items:flex-start;font:600 14px/1.25 var(--serif)}
.goal .gt .id{font:600 10.5px var(--mono);color:var(--ink3);margin-top:3px;min-width:18px}
.goal .gt .g-goal{font-size:15px;margin-top:-1px}
.goal .kids{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 0 44px}
.goal.hl{background:var(--paper);border-color:var(--ink)}
.goal.dim{opacity:.33}
.rest{display:flex;flex-wrap:wrap;gap:3px}
.legend{font-size:11.5px;color:var(--ink2);display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}
.lg-sw{width:22px;height:13px;border-radius:3px}
/* ---------- plan strip ---------- */
.strip{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.strip h2{font:600 22px/1.15 var(--serif);margin:0;letter-spacing:-.01em;max-width:760px}
.strip h2 em{font-style:normal;color:var(--accent)}
.strip .meta{font:500 11px var(--mono);color:var(--ink3)}
.hint{font:12px var(--sans);color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 10px}
.hint b{font-weight:600;color:var(--ink)}
.kbd{font:500 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
/* ---------- cake ---------- */
#cakeWrap{position:relative;padding:18px 10px 36px;user-select:none}
#edges,#over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#edges{z-index:1}
#over{z-index:4}
.tierRow{display:flex;align-items:stretch;gap:10px;margin:0 auto 6px;position:relative}
.tierLab{width:46px;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font:600 10px var(--mono);color:var(--ink3);text-align:right;letter-spacing:.06em}
.tierLab b{font:700 18px var(--serif);color:var(--ink2);letter-spacing:0}
.tierLab .tag{font-size:8.5px;margin-top:2px;padding:1px 4px;border-radius:3px;white-space:nowrap}
.tierLab .tag.new{background:var(--m-mail);color:#fff}
.tierLab .tag.chg{background:var(--tierGlow);color:#3a2500}
.tier{flex:1;background:var(--tier);border-radius:14px;padding:10px 12px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  box-shadow:inset 0 -6px 0 var(--tierSide),0 2px 0 rgba(0,0,0,.04);min-height:62px;transition:box-shadow .3s,background .3s;margin:0 auto}
.tier.newtier{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--m-mail) 9%,var(--tier)) 0 10px,var(--tier) 10px 20px)}
.tier.glow{box-shadow:inset 0 -6px 0 var(--tierSide),0 0 0 2px color-mix(in srgb,var(--tierGlow) 70%,transparent),0 0 22px -2px color-mix(in srgb,var(--tierGlow) 60%,transparent)}
.plate{height:18px;margin:4px auto 0;width:92%;border-radius:50%;background:radial-gradient(ellipse at center,var(--line2),transparent 70%);opacity:.9}
.piece{position:relative;z-index:2;border-radius:9px;padding:6px 9px 6px;min-width:96px;cursor:grab;touch-action:none;
  background:var(--paper);border:1.5px solid var(--line2);transition:opacity .25s,transform .25s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;justify-content:center}
.piece .nm{font:600 12.5px/1.2 var(--mono);display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.piece .nm .cg{font-weight:700;width:9px;text-align:center}
.piece .sub{font:500 9.5px var(--mono);color:var(--ink3);margin-top:2px;letter-spacing:.02em;white-space:nowrap}
.piece.add{background:var(--mc);border-color:var(--mc);color:#fff}
.piece.add .sub{color:rgba(255,255,255,.75)}
.piece.edit{background:color-mix(in srgb,var(--mc) 14%,var(--paper));border-color:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tierGlow) 55%,transparent),0 0 16px color-mix(in srgb,var(--tierGlow) 50%,transparent)}
.piece.same{background:color-mix(in srgb,var(--mc) 6%,var(--paper));border-color:color-mix(in srgb,var(--mc) 35%,var(--line2));color:var(--ink2)}
.piece.internal::after{content:"";position:absolute;inset:3px;border-radius:6px;border:1px dashed currentColor;opacity:.35;pointer-events:none}
.piece .wallmark{position:absolute;top:-8px;right:-6px;background:var(--bad);color:#fff;font:700 9px var(--mono);padding:1px 4px;border-radius:4px}
.piece:hover{transform:translateY(-1px)}
.piece.hl{outline:3px solid var(--ink);outline-offset:2px}
.piece.dim{opacity:.25}
.piece.src{outline:3px dashed var(--needle);outline-offset:2px}
.piece.tgt-ok{outline:3px solid var(--ok);outline-offset:2px}
.piece.tgt-bad{outline:3px solid var(--bad);outline-offset:2px}
.piece.tgt-cyc{outline:3px solid var(--cyc);outline-offset:2px}
.piece.tgt-warn{outline:3px solid var(--warn);outline-offset:2px}
.piece.onNeedle{box-shadow:0 0 0 3px var(--needle)}
.piece.ghost{border-style:dashed;background:transparent;color:var(--ink3);cursor:default}
.piece.quizTarget:hover{outline:3px solid var(--accent);outline-offset:2px;cursor:pointer}
.piece.right{outline:3px solid var(--ok);outline-offset:3px}
.piece.wrong{outline:3px solid var(--bad);outline-offset:3px}
.piece.entering{animation:enter .6s ease both}
@keyframes enter{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
/* expanded piece = file slice */
.piece.open{flex-basis:100%;cursor:default;background:var(--paper);color:var(--ink);border-color:var(--mc);box-shadow:var(--shadow)}
.piece.open .sub{color:var(--ink3)}
.piece .files{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.piece.open .files{display:block}
.frow{display:grid;grid-template-columns:14px minmax(100px,150px) 1fr;gap:8px;align-items:start;padding:3px 4px;border-radius:5px}
.frow:hover{background:var(--bg)}
.frow .fc{font:700 12px var(--mono);text-align:center}
.frow .fn{font:500 12px var(--mono);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.hl{background:color-mix(in srgb,var(--needle) 12%,transparent)}
.frow.dim{opacity:.35}
.syms{display:flex;flex-wrap:wrap;gap:3px}
.sym{display:inline-block;vertical-align:top;font:500 10.5px var(--mono);padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;border-radius:4px;border:1px solid var(--line);cursor:pointer;white-space:nowrap;background:var(--paper)}
.sym.add{border-color:var(--ok);color:var(--ok)}
.sym.edit{border-color:var(--warn);color:var(--warn)}
.sym.delete{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.sym.same{color:var(--ink3)}
.sym.k-test::before{content:"✓ ";opacity:.6}
.sym.hl{background:var(--needle);color:#fff;border-color:var(--needle)}
.fc.add{color:var(--ok)} .fc.edit{color:var(--warn)} .fc.delete{color:var(--bad)} .fc.context{color:var(--ink3)}
.closeX{position:absolute;top:5px;right:8px;border:0;background:none;font:600 12px var(--mono);color:var(--ink3);display:none}
.piece.open .closeX{display:block}
/* side shelves */
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.shelf{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--paper) 50%,transparent)}
.shelf h4{margin:0 0 6px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.shelf .dir{font:500 10.5px var(--mono);color:var(--ink3);margin-top:6px}
.shelf .frow{grid-template-columns:14px 1fr}
.shelf .frow .syms{grid-column:2}
/* journeys strip */
#journeys{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#journeys .lab{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.cs{border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:5px 9px;font:500 12px var(--mono);display:inline-flex;gap:6px;align-items:center;max-width:320px}
.cs span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs[aria-pressed="true"]{background:var(--needle);color:#fff;border-color:var(--needle)}
.cs[aria-pressed="true"] .g-cs{color:#fff}
.cs.dim{opacity:.35}
.cs.hl{border-color:var(--needle);box-shadow:0 0 0 2px color-mix(in srgb,var(--needle) 35%,transparent)}
/* inspector */
.insp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insp-h .kind{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.insp-h .x{margin-left:auto;border:1px solid var(--line2);background:none;border-radius:6px;font:500 11px var(--mono);padding:2px 7px;color:var(--ink2)}
.big{font:600 19px/1.25 var(--serif);margin:2px 0 8px}
.p{color:var(--ink2);font-size:13px;margin:6px 0}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:12.5px;margin:8px 0}
.kv dt{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.kv dd{margin:0}
.cmd{font:500 11.5px/1.45 var(--mono);background:#231c16;color:#f5ecdf;border:1px solid var(--line);padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;position:relative;margin:6px 0}
.cmd button{position:absolute;top:5px;right:5px;border:1px solid #5a4d42;background:#3a3029;color:#f5ecdf;font:500 10px var(--mono);border-radius:4px;padding:1px 6px}
.verdict{border-radius:12px;padding:12px 14px;margin:4px 0 10px}
.verdict .vh{font:800 22px/1 var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.verdict .route{font:500 12px var(--mono);margin-top:6px;word-break:break-all}
.v-ok{background:var(--okBg);color:var(--ok)} .v-bad{background:var(--badBg);color:var(--bad)} .v-cyc{background:var(--cycBg);color:var(--cyc)} .v-warn{background:var(--warnBg);color:var(--warn)} .v-exists{background:var(--bg);color:var(--ink)}
.reasons{margin:0;padding:0;list-style:none}
.reasons li{padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.reasons li b{color:var(--ink);font-weight:600}
.reasons .cites{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.frames{list-style:none;margin:6px 0;padding:0}
.frames li{display:grid;grid-template-columns:22px 58px minmax(0,1fr);gap:6px;padding:4px 4px;border-radius:6px;font-size:12px;cursor:pointer;align-items:baseline}
.frames li .n{font:600 10px var(--mono);color:var(--ink3);text-align:right}
.frames li .ly{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:1px 4px;border-radius:3px;background:var(--bg);text-align:center}
.frames li .sy{font:600 11.5px var(--mono);word-break:break-all}
.frames li .ds{color:var(--ink2);font-size:11.5px}
.frames li .ef{font:500 10.5px var(--mono);color:var(--accent)}
.frames li.cur{background:color-mix(in srgb,var(--needle) 14%,transparent)}
.frames li.cur .n{color:var(--needle)}
.frames li.done{opacity:.6}
.ctrls{display:flex;gap:6px;align-items:center;margin:8px 0}
.ctrls button{border:1px solid var(--line2);background:var(--paper);border-radius:7px;padding:4px 10px;font:500 12px var(--mono)}
.ctrls button.primary{background:var(--needle);border-color:var(--needle);color:#fff}
.result{font:500 11px/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:8px;word-break:break-word;white-space:pre-wrap}
.rej{border-left:3px solid var(--bad);padding:4px 0 4px 10px;margin:6px 0;font-size:12.5px;color:var(--ink2)}
.rej b{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--bad)}
.chosen{border-left:3px solid var(--dec);padding:4px 0 4px 10px;margin:6px 0;font-size:13px}
/* quiz */
.qdots{display:flex;gap:4px;margin:4px 0 10px}
.qdots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.qdots i.cur{background:var(--ink)} .qdots i.r{background:var(--ok)} .qdots i.w{background:var(--bad)}
.qq{font:600 17px/1.3 var(--serif);margin:4px 0 10px}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopt{text-align:left;border:1.5px solid var(--line2);background:var(--paper);border-radius:9px;padding:8px 10px;font-size:13px}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt.right{border-color:var(--ok);background:var(--okBg)}
.qopt.wrong{border-color:var(--bad);background:var(--badBg)}
.qopt code{font-size:12px}
.tapnote{border:2px dashed var(--accent);border-radius:10px;padding:10px;font-size:13px;color:var(--accent);text-align:center;font-weight:600}
.qfb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px}
.qfb.r{background:var(--okBg)} .qfb.w{background:var(--badBg)}
.qfb b.h{display:block;font:800 17px var(--serif);margin-bottom:4px}
.qnext{margin-top:10px;width:100%;border:0;border-radius:9px;padding:10px;background:var(--ink);color:var(--paper);font-weight:600}
.score{font:800 54px/1 var(--serif);margin:10px 0}
.floattip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--paper);font:600 12px var(--mono);padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(14px,14px)}
.floattip.ok{background:var(--ok)} .floattip.bad{background:var(--bad)} .floattip.cyc{background:var(--cyc)} .floattip.warn{background:var(--warn)}
.wall-label{font:700 9.5px var(--mono);fill:var(--bad)}
@keyframes wallflash{0%,100%{opacity:.9}50%{opacity:.2}}
.wallflash{animation:wallflash .35s ease 3}
.muted{color:var(--ink3)}
.howto{list-style:none;padding:0;margin:8px 0;font-size:12.5px;color:var(--ink2)}
.howto li{display:flex;gap:9px;padding:5px 0;border-top:1px solid var(--line)}
.howto li .g{width:18px}
.stat{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap}
.stat div{font:500 10px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.stat b{display:block;font:700 22px var(--serif);color:var(--ink);letter-spacing:0;text-transform:none}
/* responsive */
@media (max-width:1180px){ main{grid-template-columns:250px minmax(0,1fr)} #insp{grid-column:1/-1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)} }
@media (max-width:760px){
  header{padding:8px 12px;gap:8px}
  .brand h1{font-size:20px}
  .hdr-right{margin-left:0}

ot in CI (pre-existing gap); it runs locally on demand.","decisions":["D1"],"phases":["P1","P2","P3","P4","P5"],"rails":["R11"],"source":"AC-13"}],"decisions":[{"id":"D1","title":"Two agents on one host = one container, two workspaces","chosen":"Single `host` container, one seeded host id, one `~/.auto`, workspaces `/workspace/project-a` and `project-b`","why":"The mail store is host-global and the harness gives each container its own HOST_ID, so two containers would be two hosts.","rejected":[{"option":"Two containers sharing a `~/.auto` volume","why":"Breaks one-container-one-host; shared HOME collides on ready files and host id","wouldBreak":["AC13"]},{"option":"Two containers with distinct host ids","why":"That is multi-host, which the MVP is not","wouldBreak":["AC13","G2"]}],"by":"agent","goals":["G7"],"acs":["AC13"],"source":"D-062-1"},{"id":"D2","title":"A binding is keyed by the physical context hooks already capture","chosen":"Opaque (manager, target) from `hooks.CaptureContext` on a ladder: tmux pane → ntm → cwd; only `subscribe` writes binding rows","why":"The hook and `subscribe` need a join key both can compute; the CLI never sees `session_id`, and G8 forbids hook writes.","rejected":[{"option":"Key on `session_id`","why":"The CLI cannot see it — that bridge is T2 (D-13)","wouldBreak":["AC10"]},{"option":"Key on cwd only","why":"Two agents in one checkout collide — this host's normal state","wouldBreak":["AC10"]},{"option":"`--as <label>` flag on subscribe","why":"Pushes identity onto the caller; free-form labels collide silently","wouldBreak":["AC8"]},{"option":"Hook refreshes `last_seen` each fire","why":"A store write in the hot path (thread T1)","wouldBreak":["AC10","G3"]}],"by":"agent","goals":["G3","G2"],"acs":["AC8","AC9","AC10"],"source":"D-062-2"},{"id":"D3","title":"The no-mail hook path is gated by a pending-flag file","chosen":"An empty flag file per binding under `~/.auto/mail/alpha-flags/`; set on send, cleared when nothing unacked remains; the hook stats one path and never opens the store","why":"G8 demands stat cost; a SQLite open on every tool call of every agent is not that. The nudge is a constant, so a wrong flag leaks nothing.","rejected":[{"option":"Open the store read-only and count","why":"Not stat cost; puts SQLite in every agent's hot path","wouldBreak":["AC10"]},{"option":"Shared in-memory/daemon cache","why":"Puts the daemon back in the path D-11 removed it from","wouldBreak":["AC10","G2"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-3"},{"id":"D4","title":"T1 ships init, docs and reset; quickstart and doctor are T4's","chosen":"`init`, `docs` (full reference) and `reset` (G10) in T1","why":"The epic makes adoption its own task; a stub quickstart teaches a half-built workflow.","rejected":[{"option":"Stub `quickstart`/`doctor` now","why":"Worse than none — the \"ships complete and unused\" failure","wouldBreak":[]},{"option":"Pull T4 adoption work forward","why":"Breaks the slice; duplicates work once `#parent` and waking exist","wouldBreak":[]}],"by":"agent","goals":["G5","G7"],"acs":["AC11","AC12"],"source":"D-062-4"},{"id":"D5","title":"Define the Client seam; ship one implementation plus a contract suite","chosen":"`mail.Client` + direct-store impl only; conformance suite written against the interface, run now","why":"D-11 makes direct-store the MVP client; a suite now means T3's RPC client is a second test target.","rejected":[{"option":"Build both implementations in T1","why":"Drags the daemon and its failure modes into the skeleton","wouldBreak":["G2"]},{"option":"No suite until two implementations","why":"The second impl then pays for it and skips it","wouldBreak":["AC4","AC5","AC7","AC9"]}],"by":"agent","goals":["G6"],"acs":["AC4","AC5","AC7","AC9","AC12"],"source":"D-062-5"},{"id":"D6","title":"Inline notification is the pending flag; the bus event waits for T3","chosen":"`send` sets the flag; the receiver's next hook picks it up; `alpha.mail.*` bus event reserved, not published","why":"The receiver's own hook reads the flag on the same host — no bus hop needed.","rejected":[{"option":"Publish a bus event from `send` now","why":"Buys nothing in-band; adds a daemon dependency","wouldBreak":["G2"]},{"option":"Rely on the bus instead of the flag","why":"Bus is at-most-once and drops slow subscribers","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-6"},{"id":"D7","title":"Losing an ack race is a reported outcome, not an error exit","chosen":"Exit 0 with `wonTransition:false` on stdout plus a stderr note naming the winner","why":"G13 fixes the payload, not the exit code; losing a race is not invalid usage.","rejected":[{"option":"Exit non-zero on a lost race","why":"Shells would treat a correct outcome as failure","wouldBreak":["AC6"]},{"option":"Exit 0 and say nothing","why":"The silent success G13 forbids","wouldBreak":["AC6"]}],"by":"agent","goals":["G4"],"acs":["AC6"],"source":"D-062-7"},{"id":"D8","title":"One exported domain package, `auto-mail/mail`; the store stays internal","chosen":"Export `auto-mail/mail` plus the `rootcmd` mounting façade; everything else under `internal/`","why":"Makes G11 a compile-time property rather than a convention or a doctor check.","rejected":[{"option":"Export nothing; hook shells out to `auto mail`","why":"A process spawn in the hot path (G8)","wouldBreak":["AC10"]},{"option":"Export the store too","why":"G11 becomes a convention; schema freezes","wouldBreak":["AC12"]},{"option":"Put the client in `auto-shared`","why":"Inverts ownership; store has nowhere to live","wouldBreak":["AC12"]}],"by":"agent","goals":["G6"],"acs":["AC12"],"source":"D-062-8"},{"id":"D9","title":"The hook writes one hookSpecificOutput object carrying every fragment","chosen":"Split `matchHint` (returns fragment) from `emitAdditionalContext` (writes at most one object); mail first","why":"Two JSON objects on one hook's stdout is undefined in both agents' contracts; hints must never bury the nudge.","rejected":[{"option":"Emit a second JSON line","why":"Undefined behaviour the existing code guards against","wouldBreak":["AC10"]},{"option":"Make mail a `triggerRegistry` entry","why":"Registry matches payload shape; mail is a filesystem stat on every PostToolUse","wouldBreak":["AC10"]}],"by":"agent","goals":["G3"],"acs":["AC10"],"source":"D-062-9"},{"id":"D10","title":"No `message` noun: `auto mail` is itself the resource","chosen":"Flat verbs; glossary gains Mail, Address, Subscription, Delivery, Binding","why":"Message already names a Session exchange; `auto mail message get` would collide in one binary.","rejected":[{"option":"`auto mail letter …`","why":"Coins a term; metaphor fights the channel model","wouldBreak":["AC1"]},{"option":"Qualify Message by context","why":"In-binary collision remains","wouldBreak":["AC1"]}],"by":"epic","goals":["G1"],"acs":["AC1"],"source":"epic D-4"},{"id":"D11","title":"Event-source the delivery lifecycle","chosen":"Append-only event log as authority; projections in the same transaction; mail immutable; bindings excluded","why":"Keeps cross-host merge a union rather than conflict resolution.","rejected":[{"option":"Mutable tables","why":"Divergent mutable state across hosts has no good merge","wouldBreak":["AC3"]},{"option":"Full CQRS with a projection process","why":"Rebuild tooling and eventual consistency for a few hundred rows a day","wouldBreak":[]}],"by":"epic","goals":["G5"],"acs":["AC3"],"source":"epic D-1"},{"id":"D12","title":"Alpha marker in the type string and the store filename","chosen":"`alpha.` event prefix, `alpha-store.db`, `version` on the envelope; reset supported","why":"Event types become permanent; the marker buys freedom to get them wrong.","rejected":[{"option":"`v1` naming","why":"Implies v2 and upcasters","wouldBreak":["AC11"]},{"option":"Docs-only note","why":"Does not stop a skill matching a bare type","wouldBreak":["AC11"]}],"by":"epic","goals":["G5"],"acs":["AC11"],"source":"epic D-2"},{"id":"D13","title":"Broadcast delivery, with ack as a compare-and-set","chosen":"Each subscription has its own delivery row; ack is `UPDATE … WHERE acked_at IS NULL` returning whether it won","why":"Two subscriptions never contend; shared-subscription races resolve safely to one winner.","rejected":[{"option":"Separate lock table","why":"A second thing to keep consistent","wouldBreak":[]},{"option":"Unconditional ack write","why":"Cannot tell winner from loser","wouldBreak":["AC6"]}],"by":"epic","goals":["G4"],"acs":["AC4","AC6"],"source":"epic D-7"},{"id":"D14","title":"Subscriptions backfill unacked history from a cursor","chosen":"Delivery rows materialised lazily on read against `from_cursor`; default from the start, `--from-now` opts out","why":"Eager rows at send would stop a late subscriber ever seeing earlier mail (journey J2).","rejected":[{"option":"Eager rows at send time","why":"Silently breaks J2","wouldBreak":["AC4","AC9"]},{"option":"Backfill from subscription time only","why":"Breaks J2 less visibly","wouldBreak":["AC4"]}],"by":"epic","goals":["G4","G2"],"acs":["AC4","AC9"],"source":"epic D-10"},{"id":"D15","title":"Addresses are free-form; structure is convention","chosen":"Opaque string; permissive validation that explicitly allows a separator","why":"Keeps non-project channels expressible and prefix filtering buildable later.","rejected":[{"option":"Enforced `project/name` shape","why":"Breaks swarm channels","wouldBreak":["AC8"]},{"option":"Reject or normalise separators","why":"Forecloses prefix filtering","wouldBreak":["AC8"]}],"by":"epic","goals":["G2"],"acs":["AC8","AC9"],"source":"epic D-9"},{"id":"D16","title":"The MVP CLI writes the store directly; no daemon required","chosen":"Direct-store `mail.Client` for the CLI; RPC client later for the daemon","why":"A failing agent must be able to post mail with nothing else alive; autowatch crash-loops are documented here.","rejected":[{"option":"RPC-first through the daemon","why":"Mail is down whenever the daemon is","wouldBreak":["AC2","G2"]}],"by":"epic","goals":["G2","G6"],"acs":["AC2"],"source":"epic D-11"}],"rails":[{"id":"R1","title":"Mail and events are immutable","text":"A mail row is never updated after insert, and an event is never rewritten. State changes are appended and re-projected — this keeps the log mergeable across hosts.","ac":"AC3","goal":"G5","source":"G1"},{"id":"R2","title":"Consumer state lives in a deliveries join","text":"Read and ack state is keyed by (subscription, mail), never on the mail row, even with one subscription per address.","ac":"AC4","goal":"G4","source":"G2"},{"id":"R3","title":"Ack is a separate explicit call","text":"Reading does not retire mail. Every consumer must call ack.","ac":"AC5","goal":"G4","source":"G3"},{"id":"R4","title":"At-least-once and unordered, as documented","text":"The contract promises neither exactly-once nor order; consumers are idempotent on mail id from day one.","ac":"AC7","goal":"G4","source":"G4"},{"id":"R5","title":"Addresses are virtual","text":"Physical identity appears only as binding metadata — never in an address or a stored envelope's `to`. Validation stays permissive enough to allow a separator.","ac":"AC8","goal":"G2","source":"G5"},{"id":"R6","title":"Send to no subscription persists; report both counts","text":"Mail to an address nobody reads persists, a later subscriber sees it, and send reports `subscriptions` and `bound` separately.","ac":"AC9","goal":"G2","source":"G6"},{"id":"R7","title":"The nudge is free when there is no mail","text":"The no-mail path costs about a stat and can never stall or break the hook.","ac":"AC10","goal":"G3","source":"G8"},{"id":"R8","title":"Alpha: the store may be wiped","text":"Event types and the store filename carry an alpha marker. No upcasters, no migrations, no compatibility guarantee; reset is supported.","ac":"AC11","goal":"G5","source":"G10"},{"id":"R9","title":"Nothing outside the mail package reads the store","text":"One client interface is the only API. A skill or hook running sqlite3 against the store would freeze the schema.","ac":"AC12","goal":"G6","source":"G11"},{"id":"R10","title":"Ack transitions exactly once and reports whether it won","text":"Ack is a conditional update inside the append transaction; a loser is told, never silently treated as success.","ac":"AC6","goal":"G4","source":"G13"},{"id":"R11","title":"Done means it passes end to end in the harness","text":"A harness scenario running the real binary is the verdict; bounded retry, and missing seams are findings, not workarounds.","ac":"AC13","goal":"G7","source":"G15"},{"id":"R12","title":"The ontology lands before the code","text":"Canonical terms go into the glossary first, then the same word is used in every surface.","ac":"AC1","goal":"G1","source":"G16"}],"phases":[{"id":"P1","title":"Ontology, module skeleton, and the scenario comes up","summary":"Glossary first; `auto mail init/docs/list` on a minimal store; mounted in `auto`; `mail-flow` scenario green.","dependsOn":[],"goals":["G1","G6","G7"],"acs":["AC1","AC11","AC13"],"files":["docs/concepts/UBIQUITOUS_LANGUAGE.md","auto-mail/go.mod","auto-mail/go.sum","auto-mail/CLAUDE.md","auto-mail/cmd/automail/main.go","auto-mail/rootcmd/rootcmd.go","auto-mail/internal/app/app.go","auto-mail/internal/cli/root.go","auto-mail/internal/cli/init.go","auto-mail/internal/cli/docs.go","auto-mail/internal/cli/list.go","auto-mail/internal/cli/cli_test.go","auto-mail/internal/config/settings.go","auto-mail/mail/client.go","auto-mail/mail/direct.go","auto-mail/mail/mail_test.go","auto-mail/internal/store/store.go","auto-mail/internal/store/schema.go","auto-cli/cmd/auto/main.go","auto-cli/go.mod","auto-cli/go.sum","go.work","Makefile","CLAUDE.md","harness/scenarios/mail-flow/Dockerfile","harness/scenarios/mail-flow/docker-compose.yaml","harness/scenarios/mail-flow/scripts/host-entrypoint.sh","harness/src/harness/scenarios/mail_flow.py","harness/src/harness/cli.py","harness/tests/m l/ulid/ulid_test.go`, `auto-mail/mail/export_test.go`.","`cli_test.go` imports `auto-mail/internal/store` (test-only, inside the module — allowed by the internal rule).","Seam guard flags a file only if it both names the mail store (alpha-store.db, alpha-flags, .auto/mail) AND contains a DB opener (sqlite, database/sql, sql.Open, sqlite3) — matches the T7 resolution.","Glossary Binding definition dropped \"and liveness\" from the plan's draft wording — consistent with D-062-2 (no liveness in T1).","Old plan ids G1–G16 are guard rails; renamed R1–R12 here (source keeps the epic id). Goals G1–G7 are new clusters.","Epic decisions D-1, D-2, D-4, D-7, D-9, D-10, D-11 are included as D10–D16 (by: epic); D-3, D-5 (superseded), D-6, D-8, D-12, D-13 are referenced only via out-of-scope."]}</script>
<script type="application/json" id="model-052">{"plan":{"id":"052","title":"reflect-tool-hardening","kind":"brownfield","oneLiner":"Make the `auto reflect` loop trustworthy by fixing how it surfaces signal: readable gaps, one pending count, uniform ids, deterministic ids, health checks.","problem":"A spike found the reflect loop's skeleton solid but its read side untrustworthy: feedback gaps are write-only (grep raw JSONL), two pending counts disagree (390 vs 396), each command nests ids differently, dry-run ids differ from apply ids, the `.auto/reflect/` git policy contradicts itself, and docs/projections have gaps.","baseCommit":"f4b0ca4","builtCommit":"34d1d22","pr":"https://github.com/mistakenot/auto-stack/pull/116","outOfScope":["F10 ack-nudge warning (deferred)","Gap resolution tracking (gap -> closing observation link)","On-disk event schema changes (no schema_version bump, no payload renames)","/reflect-playbook skill flow redesign (only its reference docs change)","Generic `events list --full` payload dump"]},"goals":[{"id":"G1","title":"The reflect loop closes: feedback gaps are readable with one command.","description":"`auto reflect gap list` surfaces every reported gap with its source event, session and time, so a gap can be turned into the next observation without grepping JSONL. The end-to-end loop test now runs through `gap list`.","sources":["F4","D-1","AC-14"]},{"id":"G2","title":"Miner status and stats always report the same pending count.","description":"Both surfaces call one shared counting function, and the counted session universe is documented. The real cause was a remote-URL normalization mismatch, not two legitimate universes.","sources":["F2"]},{"id":"G3","title":"Every command exposes the ids it touches at a predictable path.","description":"Mutations return a top-level `.id` / `.ids`; collections keep returning arrays whose rows carry `.id`. This is a deliberate breaking change to CLI output only; stored events are untouched.","sources":["F5","D-3","D-5","D-7"]},{"id":"G4","title":"The same content always gets the same rule or observation id.","description":"Rule and observation ids become content hashes in the existing `r-`/`ob-` 8-hex format, so a consolidate dry-run previews the exact ids apply will mint and re-runs are idempotent. Loop and event ids stay random.","sources":["F7","D-4","D-6","D-8","D-9"]},{"id":"G5","title":"Rule listings show when each rule was created and updated.","description":"`rule list` stops dropping the `created_at`/`updated_at` values that `Fold` already sets from event timestamps.","sources":["F6"]},{"id":"G6","title":"Broken reflect state is diagnosable, and git tracks only the canonical log.","description":"A new `doctor` reports stale or partial state with remediation hints. `init` writes a `.gitignore` that ignores the disposable `playbook.json` while the `events/` log stays tracked.","sources":["F1","F9","D-2"]},{"id":"G7","title":"Docs explain every loop signal, and the legacy process is gone.","description":"The feedback `outcome` enum and `correction_density` are documented in code, quickstart and skill references. The superseded `docs/reflection/observations.yaml` is deleted without migration.","sources":["F8","F3","F11"]}],"acs":[{"id":"AC1","goal":"G1","title":"gap list surfaces reported gaps","given":"feedback events carrying a `gap`","when":"`auto reflect gap list`","then":"JSON rows `{id (ev-), session_id, ts, report, moment}`; gapless feedback omitted","detail":"Given feedback events that carry a gap (report + moment), when I run `auto reflect gap list`, then stdout is JSON listing each gap with its report, moment, and source provenance (the feedback event id `ev-…`, session_id, ts) — no raw-JSONL grep required. Feedback events without a gap are omitted.","verify":{"kind":"go-test","cmd":"cd auto-reflect && go test ./internal/cli -run 'TestGapListSurfacesGaps|TestGapListOmitsGaplessFeedback'","tests":["auto-reflect/internal/cli/gap_integration_test.go: title":"Envelope changes CLI output only, not stored events","chosen":"Presentation-layer restructure; payload names + `schema_version=1` untouched","why":"The append-only log must fold identically forever; the playbook is a disposable view.","rejected":[{"option":"Rename stored payload fields / bump schema","why":"Breaks the append-only on-disk contract.","wouldBreak":["AC14"]}],"by":"agent","goals":["G3"],"acs":["AC4"],"source":"D-5"},{"id":"D6","title":"Content-derived ids keep existing formats","chosen":"Only minting changes (random -> hash prefix); regexes stay","why":"Existing ids stay valid and validators unchanged.","rejected":[{"option":"New / longer id format","why":"Invalidates validators and on-disk ids.","wouldBreak":["AC7"]}],"by":"agent","goals":["G4"],"acs":["AC7"],"source":"D-6"},{"id":"D7","title":"Top-level id on mutations, per-row id on reads","chosen":"Mutations expose `.id`/`.ids`; collections stay arrays with row `.id`","why":"Predictable threading with minimal breakage; lists still return plain payloads.","rejected":[{"option":"Wrap every command in `{ok,data}`","why":"Over-wraps reads, breaks more consumers, fights list convention.","wouldBreak":["AC5"]}],"by":"charlie","goals":["G3"],"acs":["AC4","AC5"],"source":"D-7"},{"id":"D8","title":"Only rule and observation ids are content-derived","chosen":"`r-`/`ob-` hashed; `rt-`/`fb-`/`ev-` stay random","why":"Loop and event records are distinct-in-time; hashing would collapse them.","rejected":[{"option":"Content-derive all ids","why":"Two identical retrievals would merge into one record.","wouldBreak":["AC14"]}],"by":"charlie","goals":["G4"],"acs":["AC6"],"source":"D-8"},{"id":"D9","title":"Pure content hash, no collision suffix","chosen":"`prefix-` + first 8 hex of sha256(parts joined by newline)","why":"Clean idempotency; distinct-content 32-bit collision risk is negligible; evidence in obs hash keeps findings distinct.","rejected":[{"option":"Hash + suffix on collision","why":"Breaks idempotency and needs a state read at mint.","wouldBreak":["AC6"]}],"by":"charlie","goals":["G4"],"acs":["AC6","AC7"],"source":"D-9"},{"id":"D10","title":"Per-state-dir .gitignore","chosen":"`.auto/reflect/.gitignore` written stat-then-skip (auto-doc style)","why":"Keeps the policy with the state it governs.","rejected":[{"option":"Append to repo-root `.gitignore` (auto-skill style)","why":"Scatters reflect policy into the repo root.","wouldBreak":["AC8"]}],"by":"agent","goals":["G6"],"acs":["AC8"],"source":"Rejected Alternatives (F9)"},{"id":"D11","title":"Health checks live in a new `doctor`","chosen":"New `auto reflect doctor` mirroring auto-graph's","why":"`doctor` is the conventional health command across auto-* tools.","rejected":[{"option":"Extend `gate check`","why":"Gate is a loop-closure check, not state health.","wouldBreak":["AC10"]}],"by":"agent","goals":["G6"],"acs":["AC10"],"source":"Rejected Alternatives (F1)"},{"id":"D12","title":"Fix timestamps in the list view, not Fold","chosen":"Add `created_at`/`updated_at` to `rule list`'s projection map","why":"`Fold` already sets them from `Event.TS`; only the list map dropped them.","rejected":[{"option":"Change `Fold`","why":"Fold is already correct.","wouldBreak":[]}],"by":"agent","goals":["G5"],"acs":["AC11"],"source":"Rejected Alternatives (F6)"},{"id":"D13","title":"PendingCount carries the scope axis","chosen":"`PendingCount(repoRoot, etlRoot, allWorkspaces bool)`","why":"`miner status --all` must count the same universe as its total/mined breakdown.","rejected":[{"option":"Single-source with repo scope only (as planned)","why":"Under `--all`, total != pending + mined.","wouldBreak":["AC3"]}],"by":"agent","goals":["G2"],"acs":["AC3"],"source":"as-built (PR review)"},{"id":"D14","title":"`gap list --domain` fails fast","chosen":"Exit 1 with hint to `observation list --kind gap --domain`","why":"Feedback gaps carry no domain; a silent `[]` would mislead.","rejected":[{"option":"Accept `--domain` and filter (as   if(A.kind==="harness"){R.kind="bad";push("The harness is Python: it <b>drives the built binary</b> in a container, it never Go-imports a package.",["AC"+(M.acs.find(x=>x.verify.kind==="harness")?.id||"").slice(2)].filter(x=>x!=="AC"));return R;}

    for(const w of walls.filter(w=>w.runtime)) push(`▲ But a runtime wall still applies: <b>${esc(w.label)}</b> — ${md(w.entry.why)} <span class="muted">(${md(w.entry.enforcedBy)})</span>`,w.cites);

  if(B.kind==="ghost"){ R.kind="bad"; for(const w of walls) push(`▲ <b>${esc(w.label)}</b> — ${md(w.entry.why)} <span class="muted">Enforced by ${md(w.entry.enforcedBy)}.</span>`,w.cites); R.walls=walls; return R; }

    push(`<b>auto-shared is the bottom of the stack</b>: its <code>go.mod</code> has no <code>require</code> at ${esc(M.plan.builtCommit)} (repo fact, not from the plan). Importing <code>${esc(b)}</code> would make the shared module depend on a tool module that already depends on it.`); return R; }

      h+=`<circle cx="${(ra.cx+2*mx+rb.cx)/4}" cy="${(ra.cy+2*my+rb.cy)/4}" r="13" fill="${col}"/><text x="${(ra.cx+2*mx+rb.cx)/4}" y="${(ra.cy+2*my+rb.cy)/4+4.5}" text-anchor="middle" fill="#fff" font-family="IBM Plex Mono" font-weight="700" font-size="13">${VERD[S.verdict.kind][2]}</text>`;
      if(S.verdict.cycle){ const pts=S.verdict.cycle.map(id=>pieceEl(id)).filter(Boolean).map(rectOf); if(pts.length>1) h+=`<polyline points="${pts.map(p=>p.cx+","+p.cy).join(" ")}" fill="none" stroke="var(--cyc)" stroke-width="2" opacity=".6"/>`; }
    } }
  // needle
  if(S.cs){ h+=needleSVG(); }

function framePoint(cs,i){
  const fr=cs.frames[i]; const nid=D.fileNode.get(fr.file);
  let el=null;
  if(nid&&S.open===nid){ el=$(`#cake .frow[data-file="${CSS.escape(fr.file)}"] .sym[data-sym="${CSS.escape(fr.file+"::"+fr.symbol)}"]`)||$(`#cake .frow[data-file="${CSS.escape(fr.file)}"] .fn`); }
  if(!el&&nid) el=pieceEl(nid);
  if(!el) return null;
  const r=rectOf(el); const jig=el.classList.contains("piece")?((i%5)-2)*Math.min(12,r.w/8):0;
  return {x:r.cx+jig,y:r.cy,nid,off:!nid};
}
function needleSVG(){
  const cs=D.csById.get(S.cs); const pts=cs.frames.map((_,i)=>framePoint(cs,i));
  let h=""; const valid=pts.map((p,i)=>[p,i]).filter(x=>x[0]);
  const path=arr=>arr.map((x,k)=>{const p=x[0]; if(!k) return `M${p.x},${p.y}`; const q=arr[k-1][0];
    if(Math.abs(q.y-p.y)<6){const lift=18; return `C${q.x},${q.y-lift} ${p.x},${p.y-lift} ${p.x},${p.y}`;}
    const my=(q.y+p.y)/2; return `C${q.x},${my} ${p.x},${my} ${p.x},${p.y}`;}).join(" ");
  h+=`<path d="${path(valid)}" fill="none" stroke="var(--needle)" stroke-width="1.4" stroke-dasharray="3 5" opacity=".45"/>`;
  const done=valid.filter(x=>x[1]<=S.step);
  if(done.length>1) h+=`<path d="${path(done)}" fill="none" stroke="var(--needle)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
  for(const [p,i] of valid){ if(i>S.step) continue; h+=`<circle cx="${p.x}" cy="${p.y}" r="${i===S.step?0:3.2}" fill="var(--needle)"/>`; }
  const cur=pts[S.step];
  if(cur){ const fr=cs.frames[S.step];
    const lbl=`${S.step+1} · ${fr.layer} · ${fr.symbol}`; const w=lbl.length*6.6+14;
    const tx=Math.min(Math.max(cur.x+14,4),$("#cakeWrap").clientWidth-w-4);
    h+=`<circle cx="${cur.x}" cy="${cur.y}" r="16" fill="var(--needle)" opacity=".18"><animate attributeName="r" values="10;20;10" dur="1.6s" repeatCount="indefinite"/></circle>
        <path d="M${cur.x},${cur.y-22} L${cur.x+4},${cur.y-6} L${cur.x},${cur.y+4} L${cur.x-4},${cur.y-6}Z" fill="var(--needle)"/>
        <circle cx="${cur.x}" cy="${cur.y-18}" r="2" fill="var(--paper)"/>
        <rect x="${tx}" y="${cur.y-40}" width="${w}" height="20" rx="6" fill="var(--needle)"/><text x="${tx+7}" y="${cur.y-26}" fill="#fff" font-family="IBM Plex Mono" font-size="11" font-weight="600">${esc(lbl)}</text>`;
  }
  return h;
}

function related(sel){
  const R={goals:new Set(),acs:new Set(),decs:new Set(),nodes:new Set(),files:new Set(),cs:new Set(),rails:new Set(),syms:new Set()};
  const addFilesBy=pred=>{for(const f of M.files) if(pred(f)){R.files.add(f.path); const n=D.fileNode.get(f.path); if(n) R.nodes.add(n);}};
  const addAC=id=>{const a=D.ac.get(id); if(!a) return; R.acs.add(id); R.goals.add(a.goal); for(const t of a.verify.tests||[]){const [p,fn]=t.split(":"); R.files.add(p); R.syms.add(p+"::"+fn); const n=D.fileNode.get(p); if(n) R.nodes.add(n);} addFilesBy(f=>(f.acs||[]).includes(id)); };
  const {type,id}=sel;
  if(type==="goal"){R.goals.add(id); M.acs.filter(a=>a.goal===id).forEach(a=>addAC(a.id)); M.decisions.filter(d=>(d.goals||[]).includes(id)).forEach(d=>R.decs.add(d.id)); addFilesBy(f=>(f.goals||[]).includes(id)); M.callstacks.filter(c=>(c.goals||[]).includes(id)).forEach(c=>R.cs.add(c.id)); (M.rails||M.findings||[]).filter(r=>r.goal===id).forEach(r=>R.rails.add(r.id));}
  if(type==="ac"){addAC(id); M.decisions.filter(d=>(d.acs||[]).includes(id)).forEach(d=>R.decs.add(d.id)); (D.ac.get(id)?.decisions||[]).forEach(d=>R.decs.add(d)); M.callstacks.filter(c=>(c.acs||[]).includes(id)).forEach(c=>R.cs.add(c.id)); (M.rails||[]).filter(r=>r.ac===id).forEach(r=>R.rails.add(r.id));}
  if(type==="dec"){const d=D.dec.get(id); R.decs.add(id); (d.goals||[]).forEach(g=>R.goals.add(g)); (d.acs||[]).forEach(a=>addAC(a)); M.callstacks.filter(c=>(c.acs||[]).some(a=>(d.acs||[]).includes(a))).forEach(c=>R.cs.add(c.id));}
  if(type==="rail"){const r=D.rail.get(id); R.rails.add(id); if(r.goal) R.goals.add(r.goal); if(r.ac) addAC(r.ac);}
  if(type==="cs"){const c=D.csById.get(id); R.cs.add(id); (c.goals||[]).forEach(g=>R.goals.add(g)); (c.acs||[]).forEach(a=>R.acs.add(a)); for(const fr of c.frames){R.files.add(fr.file); R.syms.add(fr.file+"::"+fr.symbol); const n=D.fileNode.get(fr.file); if(n) R.nodes.add(n);}}
  if(type==="node"){R.nodes.add(id); for(const f of D.nodeFiles.get(id)||[]){R.files.add(f.path);(f.acs||[]).forEach(a=>R.acs.add(a));(f.goals||[]).forEach(g=>R.goals.add(g));} M.decisions.filter(d=>(d.acs||[]).some(a=>R.acs.has(a))).forEach(d=>R.decs.add(d.id)); M.callstacks.filter(c=>c.frames.some(fr=>D.fileNode.get(fr.file)===id)).forEach(c=>R.cs.add(c.id));}
  if(type==="file"||type==="sym"){const p=type==="file"?id:id.split("::")[0]; const f=D.fileByPath.get(p); R.files.add(p); if(type==="sym") R.syms.add(id); const n=D.fileNode.get(p); if(n) R.nodes.add(n); if(f){(f.acs||[]).forEach(a=>R.acs.add(a));(f.goals||[]).forEach(g=>R.goals.add(g));} M.decisions.filter(d=>(d.acs||[]).some(a=>R.acs.has(a))).forEach(d=>R.decs.add(d.id)); M.callstacks.filter(c=>c.frames.some(fr=>fr.file===p&&(type==="file"||fr.file+"::"+fr.symbol===id))).forEach(c=>R.cs.add(c.id));}
  for(const w of D.walls) if(w.node&&(w.cites.some(c=>R.decs.has(c)||(type!=="goal"&&type!=="node"&&R.acs.has(c))||R.rails.has(c)))) R.nodes.add(w.node);
  return R;
}
function applyHL(){

  $$("#rail .goal").forEach(el=>on(el,rel?.goals.has(el.dataset.ref)));
  $$(".chip[data-ref]").forEach(el=>{const r=el.dataset.ref; const yes=!rel?false:r.startsWith("AC")?rel.acs.has(r):r.startsWith("CS")?rel.cs.has(r):/^D/.test(r)?rel.decs.has(r):/^G/.test(r)?rel.goals.has(r):rel.rails.has(r); if(el.closest("#insp")){el.classList.remove("dim","hl");return;} on(el,yes);});

}

    if(!f) return inspHead("symbol")+`<div class="big mono" style="font-size:14px">${esc(id.split("::").pop())}</div><p class="p">${esc(p)}</p>`;
    return inspHead(type==="sym"?"symbol · "+esc(s?.kind||""):"file")+`<div class="big" style="font-family:var(--mono);font-size:14px">${esc(s?s.name:p.split("/").pop())}</div>
     ${s?.sig?`<div class="cmd">${esc(s.sig)}</div>`:""}${s?.note?`<p class="p">${md(s.note)}</p>`:""}
     <p class="p"><span class="fc ${f.change}">${CG[f.change]}</span> <code>${esc(p)}</code><br>${md(f.why||"")}</p>
     <div class="rest">${(f.goals||[]).map(chip).join("")}${(f.acs||[]).map(chip).join("")}${(f.phases||[]).map(x=>`<span class="chip">▷${x.slice(1)}</span>`).join("")}</div>`;}
  if(type==="cs") return csHTML();
  return "";
}
/* ================= interactions ================= */
function select(sel){ if(S.quiz) return; S.sel=sel; S.verdict=null; if(sel&&sel.type!=="cs") {stopPlay(); S.cs=null;}
  if(sel&&(sel.type==="file"||sel.type==="sym")){ const p=sel.type==="file"?sel.id:sel.id.split("::")[0]; const n=D.fileNode.get(p); if(n&&S.open!==n){S.open=n; renderCake(); } }
  renderJourneys(); renderInsp(); drawEdges(); drawOver(); applyHL(); }
function refSel(ref){ if(ref.startsWith("CS")) return pickCS(ref); const type=ref.startsWith("AC")?"ac":/^D\d/.test(ref)?"dec":/^G\d/.test(ref)?"goal":/^[RF]\d/.test(ref)?"rail":null; if(type) select({type,id:ref}); }
function pickCS(id){ if(S.quiz) return; stopPlay(); if(S.cs===id){ /* already on this journey */ } else { S.cs=id; S.step=0; S.sel={type:"cs",id}; S.verdict=null;
    const c=D.csById.get(id); if(/^BEFORE/i.test(c.title)&&S.stage!=="base"){S.stage="base";renderScrub();renderCake();} else if(!/^BEFORE/i.test(c.title)&&S.stage==="base"){S.stage="built";renderScrub();renderCake();} }
  renderJourneys(); renderInsp(); drawEdges(); drawOver(); applyHL(); }
function step(d){ if(!S.cs) return; const c=D.csById.get(S.cs); S.step=Math.max(0,Math.min(c.frames.length-1,S.step+d)); renderInsp(); drawOver(); applyHL(); }
function stopPlay(){ if(S.playing){clearInterval(S.playing);S.playing=null;} }
function togglePlay(){ if(S.playing){stopPlay();renderInsp();return;} const c=D.csById.get(S.cs); if(S.step>=c.frames.length-1) S.step=0;
  S.playing=setInterval(()=>{ if(S.step>=c.frames.length-1){stopPlay();renderInsp();return;} step(1); },950); renderInsp(); }
function clearAll(){ stopPlay(); S.sel=null; S.cs=null; S.verdict=null; if(S.open){S.open=null; renderCake();} renderJourneys(); renderInsp(); drawEdges(); drawOver(); applyHL(); }
let lastAct={k:"",t:0}; function once(k){const n=performance.now(); if(lastAct.k===k&&n-lastAct.t<450) return false; lastAct={k,t:n}; return true;}
function togglePiece(id){ if(!once("p:"+id)) return; S.open=S.open===id?null:id; renderCake(); if(!S.quiz){ if(S.cs) {renderInsp(); } else select({type:"node",id}); } }

/* drag-to-import */
let drag=null;
function onDown(e){
  const p=e.target.closest(".piece"); if(!p||e.target.closest(".files")||e.target.closest(".closeX")) return;
  if(p.classList.contains("ghost")) return;
  drag={id:p.dataset.id,x:e.clientX,y:e.clientY,moved:false,el:p}; p.setPointerCapture?.(e.pointerId);
}
function onMove(e){
  if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<7) return;
  if(!drag.moved){drag.moved=true; drag.el.classList.add("src"); document.body.style.cursor="grabbing";}
  const w=$("#cakeWrap").getBoundingClientRect(); const r=rectOf(drag.el);
  const tgtEl=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList?.contains("piece")&&x!==drag.el);
  $$(".piece.tgt-ok,.piece.tgt-bad,.piece.tgt-cyc,.piece.tgt-warn").forEach(x=>x.classList.remove("tgt-ok","tgt-bad","tgt-cyc","tgt-warn"));
  const tip=$("#tip");
  if(tgtEl){ const v=tryImport(drag.id,tgtEl.dataset.id); const k=v.kind==="exists"?"ok":v.kind; tgtEl.classList.add("tgt-"+k); tip.hidden=false; tip.className="floattip "+k; tip.textContent=VERD[v.kind][2]+" "+VERD[v.kind][0]+(v.kind==="bad"&&v.walls?.length?" — wall":""); }
  else { tip.hidden=false; tip.className="floattip"; tip.textContent="import "+short(drag.id)+" → ?"; }
  tip.style.left=e.clientX+"px"; tip.style.top=e.clientY+"px";
  let g=$("#dragline"); if(!g){ $("#over").insertAdjacentHTML("beforeend",`<line id="dragline" stroke="var(--needle)" stroke-width="2.5" stroke-dasharray="6 4"/>`); g=$("#dragline"); }
  g.setAttribute("x1",r.cx);g.setAttribute("y1",r.cy);g.setAttribute("x2",e.clientX-w.left);g.setAttribute("y2",e.clientY-w.top);
}
function onUp(e){
  if(!drag) return; const d=drag; drag=null; document.body.style.cursor=""; $("#tip").hidden=true; $("#dragline")?.remove();
  $$(".piece.src,.piece.tgt-ok,.piece.tgt-bad,.piece.tgt-cyc,.piece.tgt-warn").forEach(x=>x.classList.remove("src","tgt-ok","tgt-bad","tgt-cyc","tgt-warn"));
  if(!d.moved){ if(S.quiz&&S.quiz.tapping) return quizTap(d.id); return togglePiece(d.id); }
  const tgtEl=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList?.contains("piece")&&x!==d.el);
  if(!tgtEl||S.quiz) return;
  stopPlay(); S.cs=null; S.sel=null;
  S.verdict=tryImport(d.id,tgtEl.dataset.id); renderJourneys(); renderInsp(); drawEdges(); drawOver(); applyHL();
  if(S.verdict.walls?.length) $$(".wallg").forEach(g=>{g.classList.remove("wallflash"); void g.getBBox(); g.classList.add("wallflash");});
}

/* ================= quiz ================= */
function rng(seed){let s=seed>>>0||1; return ()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function shuffle(a,r){a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}
function buildQuiz(){
  const r=rng(Date.now()); const ids=D.graphNodes.map(n=>n.id).filter(id=>D.nodes.get(id).kind==="pkg"||D.nodes.get(id).kind==="module");
  const Q=[];
  const vk=(a,b)=>tryImport(a,b).kind;
  // 1. "which can X import?"
  const srcs=shuffle(ids.filter(a=>a!=="auto-cli/cmd/auto"),r); srcs.unshift("auto-cli/cmd/auto");
  for(const a of srcs){ const ok=ids.filter(b=>b!==a&&["ok","exists"].includes(vk(a,b))&&!D.edges.find(e=>e.from===a&&e.to===b)); const no=ids.filter(b=>b!==a&&["bad","cyc"].includes(vk(a,b)));
    if(ok.length&&no.length>=3){ const right=ok[Math.floor(r()*ok.length)]; const opts=shuffle([right,...shuffle(no,r).slice(0,3)],r);
      Q.push({t:"mc",q:`<code>${esc(a)}</code>${a==="auto-cli/cmd/auto"?" (the hook lives here)":""} wants a new import. Which one would <b>compile and respect the plan</b>?`,opts:opts.map(o=>({h:`<code>${esc(o)}</code>`,v:o})),ans:right,focus:[a],explain:()=>{const v=tryImport(a,right); return `<code>${esc(short(right))}</code>: ${v.reasons.map(x=>x.t).slice(0,2).join(" ")} The others: `+opts.filter(o=>o!==right).map(o=>{const w=tryImport(a,o);return `<code>${esc(short(o))}</code> ${VERD[w.kind][0].toLowerCase()}`;}).join("; ")+".";},cites:()=>tryImport(a,right).reasons.flatMap(x=>x.cites||[])}); if(Q.length>=2) break; } }
  // 2. verdict classification
  const pairs=[]; for(const a of ids) for(const b of ids) if(a!==b) pairs.push([a,b]);
  const byK={}; for(const [a,b] of shuffle(pairs,r)){const k=vk(a,b); (byK[k]=byK[k]||[]).push([a,b]);}
  for(const k of shuffle(["bad","cyc","ok","warn"].filter(k=>byK[k]),r).slice(0,3)){ const [a,b]=byK[k][0];
    Q.push({t:"mc",q:`What does the cake say to <code>${esc(a)}</code> <b>→ import →</b> <code>${esc(b)}</code>?`,opts:["ok","bad","cyc","exists"].concat(byK.warn?["warn"]:[]).map(o=>({h:VERD[o][2]+" "+VERD[o][0],v:o})),ans:k,focus:[a,b],explain:()=>tryImport(a,b).reasons.map(x=>x.t).join(" "),cites:()=>tryImport(a,b).reasons.flatMap(x=>x.cites||[]),after:()=>{S.verdict=tryImport(a,b);drawOver();}}); }
  // 3. what does this edge enable?
  const crossed=[...D.cross.entries()].filter(([k])=>D.edges.find(e=>e.from+"→"+e.to===k));
  for(const [k,v] of shuffle(crossed,r).slice(0,2)){ const [a,b]=k.split("→"); const right=v[0].cs; const wrong=shuffle(M.callstacks.filter(c=>!v.some(x=>x.cs===c.id)),r).slice(0,3);
    if(wrong.length<2) continue; const opts=shuffle([D.csById.get(right),...wrong],r);
    Q.push({t:"mc",q:`What does the edge <code>${esc(short(a))}</code> → <code>${esc(short(b))}</code> enable? Which journey needs it?`,opts:opts.map(c=>({h:`<b>${c.id}</b> <code>${esc(c.title)}</code>`,v:c.id})),ans:right,focus:[a,b],explain:()=>`${v.map(x=>`<b>${x.cs}</b> crosses it at frame ${x.frame+1}, <code>${esc(x.sym)}</code>`).join("; ")}.`,cites:()=>[...v.map(x=>x.cs),...(D.csById.get(right).acs||[])]}); }
  // 4. needle: tap where it goes next
  for(const c of shuffle(M.callstacks,r)){ const fn=c.frames.map(f=>D.fileNode.get(f.file));
    const idx=[]; for(let i=0;i<c.frames.length-1;i++) if(fn[i]&&fn[i+1]&&fn[i]!==fn[i+1]) idx.push(i);
    if(!idx.length) continue; const i=idx[Math.floor(r()*idx.length)]; const f=c.frames[i], g=c.frames[i+1];
    Q.push({t:"tap",q:`≡ <b>${c.id}</b> <code>${esc(c.title)}</code><br>The needle is at <code>${esc(f.symbol)}</code> in <code>${esc(short(fn[i]))}</code> (${md(f.does)}). <b>Tap the layer it pierces next.</b>`,ans:fn[i+1],focus:[fn[i]],explain:()=>`Next frame: <code>${esc(g.symbol)}</code> — ${md(g.does)} (${esc(g.layer)} layer, <code>${esc(g.file)}</code>).`,cites:()=>[c.id,...(c.acs||[])],pre:()=>{S.cs=c.id;S.step=i;drawOver();},after:()=>{S.step=i+1;drawOver();}});
    if(Q.filter(q=>q.t==="tap").length>=2) break; }
  // 5. tap the walled package / which decision governs the wall
  const w=D.walls.find(w=>!w.runtime&&!w.convention&&w.cites.some(c=>/^D/.test(c)));
  if(w){ const tgt=P==="062"?"auto-mail/internal/store":"auto-reflect/internal/idhash"; const d=w.cites.find(c=>/^D/.test(c));
    const wrong=shuffle(M.decisions.filter(x=>!w.cites.includes(x.id)),r).slice(0,3);
    Q.push({t:"mc",q:`Which ◆ decision puts the wall around <code>${esc(short(tgt))}</code>?`,opts:shuffle([D.dec.get(d),...wrong],r).map(x=>({h:`<b>${x.id}</b> ${md(x.title)}`,v:x.id})),ans:d,focus:[tgt],explain:()=>`${md(w.entry.why)} Enforced by ${md(w.entry.enforcedBy)}.`,cites:()=>w.cites}); }
  // 6. tap the new / edited package
  const green=M.plan.kind==="greenfield";
  if(green){ const ed=D.graphNodes.filter(n=>n.change==="edit"); if(ed.length) Q.push({t:"tap",q:`This is a greenfield plan — but one <b>existing</b> package is edited to host it. Tap it.`,ans:ed.map(n=>n.id),explain:()=>`<code>${esc(ed[0].id)}</code>: ${ed.map(n=>(D.nodeFiles.get(n.id)||[]).map(f=>f.path.split("/").pop()).join(", ")).join("")}.`,cites:()=>[...new Set(ed.flatMap(n=>(D.nodeFiles.get(n.id)||[]).flatMap(f=>f.acs||[])))] }); }
  else { const nw=D.graphNodes.filter(n=>n.change==="add"); if(nw.length) Q.push({t:"tap",q:`One package is <b>new</b> in this brownfield change. Tap it — then think: why must it be a leaf?`,ans:nw.map(n=>n.id),explain:()=>`<code>${esc(nw[0].id)}</code>. ${md(M.deps.forbidden.find(f=>/idhash/.test(f.from))?.why||"")}`,cites:()=>["AC7","D8"]}); }
  // 7. which package can the hook import (tap)
  if(P==="062"){ Q.push({t:"tap",q:`The hook (<code>auto-cli/cmd/auto</code>) must learn “is mail waiting?” without opening the store. <b>Tap the package it imports for that.</b>`,ans:"auto-mail/mail",focus:["auto-cli/cmd/auto"],explain:()=>`<code>auto-mail/mail</code> — HasPending, BindingFromContext, NudgeText only. The store is behind Go's internal/ wall, and the hook path may not open it at all.`,cites:()=>["D3","D8","AC10","AC12"]}); }
  else { Q.push({t:"tap",q:`<code>miner status</code> and <code>stats</code> disagreed (390 vs 396). After the fix both call one function. <b>Tap the package that owns it.</b>`,ans:"auto-reflect/internal/miner",explain:()=>`<code>miner.PendingCount</code> — called by cli (miner status) and loop.Service.Stats.`,cites:()=>["AC3","D13","F2"]}); }
  return shuffle(Q,r).slice(0,10);
}
function startQuiz(){ stopPlay(); S.sel=null; S.verdict=null; S.cs=null; S.open=null; S.stage="built"; renderScrub(); renderCake();
  S.quiz={qs:buildQuiz(),i:0,res:[],answered:false}; showQ(); }
function showQ(){ const Z=S.quiz; const q=Z.qs[Z.i]; S.verdict=null; S.cs=null; Z.answered=false; Z.tapping=q&&q.t==="tap";
  if(q&&q.pre) q.pre(); drawOver(); renderInsp();
  $$("#cake .piece").forEach(el=>{el.classList.remove("right","wrong","hl","dim"); el.classList.toggle("quizTarget",!!Z.tapping&&!el.classList.contains("ghost")); if(q&&q.focus&&q.focus.includes(el.dataset.id)) el.classList.add("hl");}); }
function answer(v){ const Z=S.quiz; if(Z.answered) return; const q=Z.qs[Z.i]; Z.answered=true; Z.tapping=false;
  const ok=Array.isArray(q.ans)?q.ans.includes(v):v===q.ans; Z.res.push(ok); Z.last={v,ok};
  if(q.after) q.after(); renderInsp();
  $$("#cake .piece").forEach(el=>el.classList.remove("quizTarget"));
  const ans=Array.isArray(q.ans)?q.ans:[q.ans]; ans.forEach(a=>pieceEl(a)?.classList.add("right")); if(!ok&&q.t==="tap") pieceEl(v)?.classList.add("wrong"); }
function quizTap(id){ if(!once("q:"+id)) return; answer(id); }
function quizHTML(){ const Z=S.quiz;
  if(Z.i>=Z.qs.length){ const n=Z.res.filter(Boolean).length;
    return `<div class="insp-h"><span class="kind">? quiz · done</span><button class="x" data-quizoff="1">exit</button></div><div class="score">${n}/${Z.qs.length}</div><p class="p">${n>=8?"You can read this cake.":n>=5?"Solid — revisit the walls and the needle paths.":"Drag a few imports and play the journeys, then try again."}</p><div class="qdots">${Z.res.map(x=>`<i class="${x?"r":"w"}"></i>`).join("")}</div><button class="qnext" data-quizagain="1">Another ten →</button>`; }
  const q=Z.qs[Z.i];
  let h=`<div class="insp-h"><span class="kind">? quiz · ${Z.i+1}/${Z.qs.length}</span><button class="x" data-quizoff="1">exit</button></div>
   <div class="qdots">${Z.qs.map((_,i)=>`<i class="${i<Z.res.length?(Z.res[i]?"r":"w"):i===Z.i?"cur":""}"></i>`).join("")}</div><div class="qq">${q.q}</div>`;
  if(q.t==="mc") h+=`<div class="qopts">${q.opts.map(o=>{const isAns=Array.isArray(q.ans)?q.ans.includes(o.v):o.v===q.ans; const cls=Z.answered?(isAns?"right":(Z.last.v===o.v?"wrong":"")):""; return `<button class="qopt ${cls}" data-qv="${esc(o.v)}" ${Z.answered?"disabled":""}>${o.h}</button>`;}).join("")}</div>`;
  else if(!Z.answered) h+=`<div class="tapnote">↙ tap a piece on the cake</div>`;
  if(Z.answered){ h+=`<div class="qfb ${Z.last.ok?"r":"w"}"><b class="h">${Z.last.ok?"✓ Right.":"✗ Not quite."}</b>${q.explain()}<div class="rest" style="margin-top:6px">${[...new Set(q.cites())].filter(c=>/^(AC|D|G|R|F|CS)\d/.test(c)).map(chip).join("")}</div></div><button class="qnext" data-qnext="1">${Z.i+1<Z.qs.length?"Next →":"See score →"}</button>`; }
  return h;
}

/* ================= events ================= */
document.addEventListener("pointerdown",onDown);
document.addEventListener("pointermove",onMove);
document.addEventListener("pointerup",onUp);
document.addEventListener("click",e=>{
  const t=e.target;
  const b=t.closest("[data-plan]"); if(b){ location.hash=b.dataset.plan; return; }
  const st=t.closest("[data-st]"); if(st){ S.stage=st.dataset.st; S.verdict=null; if(S.cs&&S.stage!=="built"&&S.stage!=="base"){stopPlay();S.cs=null;} renderScrub(); renderCake(true); renderInsp(); return; }
  if(t.closest("[data-close]")){ S.open=null; renderCake(); return; }
  if(t.closest("[data-clear]")){ clearAll(); return; }
  if(t.closest("[data-quizoff]")){ S.quiz=null; $("#quizBtn").setAttribute("aria-pressed","false"); clearAll(); renderCake(); return; }
  if(t.closest("[data-quizagain]")){ startQuiz(); return; }
  if(t.closest("[data-qnext]")){ S.quiz.i++; if(S.quiz.i<S.quiz.qs.length&&S.quiz.qs[S.quiz.i]) {} S.cs=null; showQ(); return; }
  const qv=t.closest("[data-qv]"); if(qv){ answer(qv.dataset.qv); return; }
  const cp=t.closest("[data-copy]"); if(cp){ try{navigator.clipboard.writeText(cp.dataset.copy); cp.textContent="copied";}catch(_){ } return; }
  const pl=t.closest("[data-play]"); if(pl){ togglePlay(); return; }
  const sp=t.closest("[data-step]"); if(sp){ stopPlay(); step(+sp.dataset.step); return; }
  const fr=t.closest("[data-frame]"); if(fr){ stopPlay(); S.step=+fr.dataset.frame; renderInsp(); drawOver(); applyHL(); return; }
  const cs=t.closest("[data-cs]"); if(cs){ pickCS(cs.dataset.cs); return; }
  const sym=t.closest("[data-sym]"); if(sym&&!S.quiz){ select({type:"sym",id:sym.dataset.sym}); return; }
  const fp=t.closest("[data-filepick]"); if(fp&&!S.quiz){ select({type:"file",id:fp.dataset.filepick}); return; }
  const nd=t.closest("[data-node]"); if(nd&&!S.quiz){ select({type:"node",id:nd.dataset.node}); return; }
  const ch=t.closest(".chip[data-ref]"); if(ch&&!S.quiz){ refSel(ch.dataset.ref); return; }
  const g=t.closest(".goal[data-ref]"); if(g&&!S.quiz){ S.sel?.id===g.dataset.ref?clearAll():select({type:"goal",id:g.dataset.ref}); return; }
});
$("#wallsBtn").onclick=()=>{S.walls=!S.walls; $("#wallsBtn").setAttribute("aria-pressed",S.walls); renderCake();};
$("#edgesBtn").onclick=()=>{S.allEdges=!S.allEdges; $("#edgesBtn").setAttribute("aria-pressed",S.allEdges); drawEdges();};
$("#quizBtn").onclick=()=>{ if(S.quiz){S.quiz=null;$("#quizBtn").setAttribute("aria-pressed","false");clearAll();renderCake();} else {$("#quizBtn").setAttribute("aria-pressed","true"); startQuiz();} };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(S.quiz){return;} clearAll(); }
  if(e.key==="ArrowRight"&&S.cs){e.preventDefault();stopPlay();step(1);} if(e.key==="ArrowLeft"&&S.cs){e.preventDefault();stopPlay();step(-1);}
  if(e.key===" "&&S.cs&&!e.target.closest("button")){e.preventDefault();togglePlay();}
});
let rz; window.addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{if(LAYOUT){drawEdges();drawOver();}},80);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(LAYOUT){drawEdges();drawOver();}});

function load(){
  const want=(location.hash||"#062").slice(1).split("/")[0]; P=MODELS[want]?want:"062"; M=MODELS[P];
  try{localStorage.setItem("lab16-plan",P);}catch(_){}
  stopPlay(); Object.assign(S,{stage:"built",sel:null,open:null,cs:null,step:0,verdict:null,quiz:null}); $("#quizBtn").setAttribute("aria-pressed","false");
  D=derive(); LAYOUT=null;
  $$("#planSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.plan===P));
  $("#oneLiner").innerHTML=md(M.plan.oneLiner);
  $("#meta").innerHTML=`${M.plan.kind} · ${M.goals.length} ◎ · ${M.acs.length} ✓ · ${M.decisions.length} ◆ · ${M.callstacks.length} ≡`;
  document.title="Layer Cake · "+P;
  renderScrub(); renderRail(); renderJourneys(); renderShelves(); renderCake(); renderInsp();
}
window.addEventListener("hashchange",load);
if(!location.hash){ try{const s=localStorage.getItem("lab16-plan"); if(s&&MODELS[s]) history.replaceState(null,"","#"+s);}catch(_){} }
load();
</script>
