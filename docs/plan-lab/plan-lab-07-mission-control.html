    case 'ac': return `<div class="blk" id="m-${esc(n.a.id)}"><div class="bh"><span class="id">${esc(n.a.id)}</span><b>${MDi(n.a.title)}</b><span class="mono faint" style="font-size:10.5px">phases ${esc(n.a.phases)}</span></div><div class="bb">${kids()}<p class="mono faint" style="font-size:10.5px;margin:6px 0 0">tests: ${esc(n.a.tests || '—')}</p></div></div>`;
    case 'cli': { let rows = ''; (n.c || []).forEach(k => { if (k.t === 'cmd') rows += `<div class="row"><div class="cm1">${esc(k.x)}</div>${k.a.note ? `<div class="nt"># ${esc(k.a.note)}${k.a.status ? ' · ' + esc(k.a.status) : ''}</div>` : ''}</div>`; if (k.t === 'out') rows += `<div class="row" style="padding-top:0"><pre>${esc(k.x)}</pre></div>`; });
      return `<div class="term" ${n.a.id ? `id="m-${esc(n.a.id)}"` : ''}><div class="tt"><span>${esc(n.a.title || '')}</span>${n.a.id ? `<span>${esc(n.a.id)}</span>` : ''}</div>${rows}${n.a.caption ? `<div class="nt" style="padding:4px 10px 8px">${esc(n.a.caption)}</div>` : ''}</div>`; }
    case 'mermaid': return `<div class="mer"><div class="cap">${esc(n.a.caption || '')}</div><pre class="mermaid-src" data-src="${esc(n.x)}">${esc(n.x)}</pre></div>`;
    case 'api': return `<div class="blk"><div class="bh"><span class="id">${esc(n.a.kind)}</span><b class="mono">${esc(n.a.name)}</b><span class="mono faint" style="font-size:10.5px">${esc(n.a.path)}</span></div><div class="bb">${n.a.caption ? `<p class="dim" style="margin:0 0 8px">${esc(n.a.caption)}</p>` : ''}<table class="prose api" style="margin:0"><tbody>${(n.c || []).filter(k => k.t === 'member').map(m => `<tr><td>${esc(m.a.sig)}</td><td>${MDi(m.x)}</td></tr>`).join('')}</tbody></table></div></div>`;
    case 'files': return `<div class="blk"><div class="bb" style="padding:4px 12px">${(n.c || []).map(k => k.t === 'file' ? `<div id="m-file-${esc(k.a.path)}" style="display:grid;grid-template-columns:18px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)"><span class="cm ${k.a.change} mono">${{ add: '+', edit: '~', delete: '−' }[k.a.change]}</span><div><div class="mono" style="font-size:11.5px;word-break:break-all">${esc(k.a.path)}</div><div class="prose" style="font-size:12px;color:var(--text2)">${MD(k.x)}</div>${(k.c || []).map(nodeHtml).join('')}</div></div>` : '').join('')}</div></div>`;
    case 'stepper': return kids();
    case 'phase': return `<div class="blk" id="m-phase-${n.a.n}"><div class="bh"><span class="id">P${esc(n.a.n)}</span><b>${esc(n.a.title)}</b><span class="tag">${esc(n.a.status)}</span>${n.a['depends-on'] ? `<span class="mono faint" style="font-size:10.5px">depends-on ${esc(n.a['depends-on'])}</span>` : ''}</div><div class="bb"><p class="mono faint" style="font-size:10.5px;margin:0 0 8px;word-break:break-all">files: ${esc(n.a.files)}</p>${kids()}</div></div>`;
    case 'trace': return traceHtml();
    case 'decisions': { const ds = M.decisions.filter(d => d.tab === currentTabFor(n)); return ''; }
    case 'scope': return '';
    default: return kids();
  }
}
function currentTabFor() { return ''; }
function traceHtml() {
  const P = M.phases.map(p => p.n);
  return `<div class="blk"><div class="bh"><b>Acceptance coverage</b><span class="faint" style="font-size:11px">AC × phase, from each AC's phases attribute</span></div><div class="bb" style="overflow:auto"><table class="prose trace" style="margin:0"><thead><tr><th>AC</th>${P.map(n => `<th>P${n}</th>`).join('')}<th>Tests</th></tr></thead><tbody>${M.acs.map(a => `<tr><td><a href="#" data-open="${a.id}">${a.id}</a></td>${P.map(n => `<td>${a.phases.includes(n) ? '●' : ''}</td>`).join('')}<td style="font-size:10px">${a.tests.map(t => esc(t.split('/').pop())).join(', ') || '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function openManual(anchor) {
  const root = DATA[M.key];
  $('#mnav').innerHTML = `<div class="tb" style="padding-top:4px">${esc(M.doc.title)}</div>` + M.tabs.map(t => `<div class="tb">${esc(t)}</div>` + M.sections.filter(s => s.tab === t).map(s => `<a href="#" data-mjump="m-${esc(s.id)}">${esc(s.title)}</a>`).join('')).join('')
    + `<div class="tb">Appendix</div><a href="#" data-mjump="m-epic">Epic references</a>${M.key === '052' ? '<a href="#" data-mjump="m-feedback">feedback.md</a>' : ''}`;
  let extra = '';
  if (M.key === '062') {
    const ep = DATA.epic005;
    extra = `<div class="mtab" id="m-epic">Appendix · epic 005 references</div><p class="dim">Full text of the guard rails and epic decisions this plan cites, quoted from docs/epics/epic-005-auto-mail-mvp.html.</p>` +
      Object.entries(ep.guardrails).sort((a, b) => +a[0].slice(1) - +b[0].slice(1)).map(([id, g]) => `<div class="blk" id="m-${id}"><div class="bh"><span class="id">${id}</span><b>${esc(g.title)}</b><span class="tag">${esc(g.kind)}</span></div><div class="bb prose">${MD(g.x)}</div></div>`).join('') +
      Object.entries(ep.decisions).sort((a, b) => +a[0].slice(2) - +b[0].slice(2)).map(([id, d]) => `<div class="blk" id="m-${id}"><div class="bh"><span class="id">${id}</span><b>${esc(d.title)}</b><span class="tag">${esc(d.status)}</span></div><div class="bb">${d.summary ? `<p class="dim" style="font-style:italic;margin:0 0 8px">${esc(d.summary)}</p>` : ''}<div class="prose">${MD(d.x)}</div></div></div>`).join('');
  } else {
    extra = `<div class="mtab" id="m-epic">Appendix</div><p class="dim">052 has no parent epic.</p><div class="mtab" id="m-feedback">Post-execution feedback.md</div><div class="prose">${MD(DATA.feedback052)}</div>`;
  }
  $('#mmain').innerHTML = `<div class="mtop"><span><span class="lbl">Flight manual · full plan as written</span> <span class="mono dim" style="margin-left:8px">${esc(M.doc.title)}</span></span><button class="x" data-closemanual>ESC ✕ BACK TO CONSOLE</button></div><div class="mcontent">${nodeHtml(root)}${extra}</div>`;
  $('#manual').classList.add('on');
  runMermaid();
  if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({ block: 'start' }); el.style.outline = '1px solid var(--cyan)'; setTimeout(() => el.style.outline = '', 1600); } }, 60);
}
let mermaidP = null;
function runMermaid() {
  const nodes = [...document.querySelectorAll('pre.mermaid-src:not([data-done])')]; if (!nodes.length) return;
  if (!mermaidP) mermaidP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js'; s.onload = () => { try { mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict', fontFamily: 'IBM Plex Mono', themeVariables: { background: '#0a0f15', primaryColor: '#111821', primaryBorderColor: '#33445a', lineColor: '#5a6b80', primaryTextColor: '#dbe3ec', fontSize: '12px' } }); res(); } catch (e) { rej(e); } }; s.onerror = rej; document.head.appendChild(s); });
  mermaidP.then(async () => {
    for (const el of nodes) {
      el.setAttribute('data-done', '1');
      try { const id = 'mm' + Math.random().toString(36).slice(2); let src = el.dataset.src; if (/^\s*sequenceDiagram/.test(src)) src = src.split('\n').map(l => { const i = l.indexOf(':'); return i > 0 && /->>|-->>|->|-->/.test(l.slice(0, i)) ? l.slice(0, i + 1) + l.slice(i + 1).replace(/;/g, '#59;') : l; }).join('\n');
        const { svg } = await mermaid.render(id, src); const d = document.createElement('div'); d.innerHTML = svg; el.replaceWith(d); } catch (e) { /* keep source text visible */ }
    }
  }).catch(() => { /* offline: source text remains */ });
}

/* ════════════ COMMAND PALETTE ════════════ */
let palItems = [], palIdx = 0;
function palIndex() {
  const it = [];
  M.phases.forEach(p => { it.push({ ty: 'PHASE', id: 'P' + p.n, nm: p.title, bd: p.intro, act: () => selectPhase(p.n) }); p.steps.forEach((s, i) => it.push({ ty: s.gate ? 'GATE' : 'STEP', id: s.id, nm: s.head.replace(/[`*]/g, ''), bd: s.md, act: () => { selectPhase(p.n, i); } })); });
  M.acs.forEach(a => it.push({ ty: 'AC', id: a.id, nm: a.title.replace(/`/g, ''), bd: a.body, act: () => openRef(a.id) }));
  M.decisions.forEach(d => it.push({ ty: 'DECISION', id: d.id, nm: d.title.replace(/`/g, ''), bd: (d.summary || '') + ' ' + d.body, act: () => openRef(d.id) }));
  if (M.key === '062') { Object.entries(DATA.epic005.guardrails).forEach(([id, g]) => it.push({ ty: 'RAIL', id, nm: g.title, bd: g.x, act: () => openRef(id) })); Object.entries(DATA.epic005.decisions).forEach(([id, d]) => it.push({ ty: 'EPIC DEC', id, nm: d.title, bd: d.x, act: () => openRef(id) })); }
  if (M.key === '052') M.findings.forEach(f => it.push({ ty: 'FINDING', id: f.code, nm: f.problem.replace(/`/g, ''), bd: f.fix, act: () => openRef(f.id) }));
  M.threads.forEach(t => it.push({ ty: 'THREAD', id: t.priority.toUpperCase(), nm: t.title.replace(/`/g, ''), bd: t.comments.map(c => c.x).join(' '), act: () => openRef(t.id) }));
  M.files.forEach(f => it.push({ ty: 'FILE', id: { add: '+', edit: '~', delete: '−' }[f.change], nm: f.path, bd: f.note, act: () => openRef('file:' + f.path) }));
  [...M.risks, ...M.assumptions].forEach(r => it.push({ ty: r.kind === 'risk' ? 'RISK' : 'ASSUME', id: r.id, nm: r.lead.replace(/`/g, ''), bd: r.body, act: () => openRef(r.id) }));
  Object.entries(M.ov.preflight || {}).forEach(([n, cs]) => cs.forEach(c => it.push({ ty: 'CAUTION', id: 'P' + n, nm: c.t.replace(/`/g, ''), act: () => selectPhase(+n) })));
  M.sections.forEach(s => it.push({ ty: 'SECTION', id: s.tab.slice(0, 4).toUpperCase(), nm: s.title, bd: s.node.c.filter(k => k.t === 'md').map(k => k.x).join(' '), act: () => openManual('m-' + s.id) }));
  M.clis.forEach(c => it.push({ ty: 'TRANSCRIPT', id: c.id || 'CLI', nm: c.title, act: () => openManual('m-' + c.section) }));
  M.apis.forEach(a => it.push({ ty: 'API', id: a.a.kind, nm: a.a.name + ' — ' + a.a.path, act: () => openManual('m-' + M.sections.find(s => s.node.c.some(k => k.t === 'api' && k.a.name === a.a.name)).id) }));
  M.mermaids.forEach(m => it.push({ ty: 'DIAGRAM', id: '◇', nm: m.caption, act: () => openManual('m-' + m.section) }));
  const other = M.key === '062' ? '052' : '062';
  it.push({ ty: 'CMD', id: '⇄', nm: `Switch to ${other} — ${DATA[other].a.title}`, act: () => switchPlan(other) });
  it.push({ ty: 'CMD', id: '▤', nm: 'Open the flight manual (full plan as written)', act: () => openManual() });
  it.push({ ty: 'CMD', id: '⎘', nm: `Copy P${sel} verify commands`, act: () => { const p = M.phases.find(p => p.n === sel); copy(p.steps.flatMap(s => s.cmds.filter(c => c.verify).map(c => c.c)).join('\n')); } });
  it.push({ ty: 'CMD', id: '▶', nm: 'Replay the plan record (mark every step done, as the plan reports)', act: () => { M.phases.forEach(p => p.status === 'done' && p.steps.forEach(s => S.steps[s.id] = true)); if (!S.met) S.met = Date.now(); save(); renderAll(); toast('Replayed: all phases the plan records as done'); } });
  it.push({ ty: 'CMD', id: '⟲', nm: 'Reset checklist, GO calls and mission clock for this plan', act: () => { S = { steps: {}, ac: {}, met: null, sel: 1 }; save(); renderAll(); toast('Checklist reset'); } });
  it.push({ ty: 'CMD', id: '?', nm: 'Keyboard shortcuts', act: showHelp });
  return it;
}
function score(q, s) { s = s.toLowerCase(); if (!q) return 1; let sc = 0; for (const w of q.toLowerCase().split(/\s+/).filter(Boolean)) { const i = s.indexOf(w); if (i < 0) return 0; sc += 10 - Math.min(i, 9) + (s.startsWith(w) ? 5 : 0); } return sc; }
function palRender() {
  const q = $('#palIn').value.trim(); const all = palIndex();
  palItems = all.map(x => { let sc = Math.max(score(q, x.id + ' ' + x.nm + ' ' + x.ty), score(q, x.nm)); let snip = '';
    if (!sc && q && x.bd) { const b = x.bd.replace(/[`*]/g, '').replace(/\s+/g, ' '); if (score(q, b)) { sc = 0.5; const w = q.toLowerCase().split(/\s+/)[0]; const i = b.toLowerCase().indexOf(w); snip = (i > 30 ? '…' : '') + b.slice(Math.max(0, i - 30), i + 70) + '…'; } }
    return { ...x, sc, snip }; }).filter(x => x.sc > 0);
  if (q) palItems.sort((a, b) => b.sc - a.sc);
  palItems = palItems.slice(0, 80); palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1));
  $('#palList').innerHTML = palItems.map((x, i) => `<li class="${i === palIdx ? 'on' : ''}" data-pi="${i}"><span class="ty">${esc(x.ty)}</span><span class="nm"><b>${esc(x.id)}</b>${esc(x.nm)}${x.snip ? `<span class="faint" style="display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.snip)}</span>` : ''}</span><span class="pl">${M.key}</span></li>`).join('') || `<li><span class="ty">—</span><span class="nm dim">No match</span></li>`;
  $('#palCount').textContent = `${palItems.length} of ${all.length}`;
  const on = $('#palList li.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function openPal() { closeAll(); $('#pal').classList.add('on'); $('#scrim').classList.add('on'); $('#palIn').value = ''; palIdx = 0; palRender(); setTimeout(() => $('#palIn').focus(), 10); }
function closePal() { $('#pal').classList.remove('on'); if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on'); }
function palGo(i) { const x = palItems[i]; if (!x) return; closePal(); $('#scrim').classList.remove('on'); x.act(); }

/* ════════════ ACTIONS ════════════ */
function selectPhase(n, stepIdx = 0, noScroll) {
  sel = n; focusStep = stepIdx; save(); renderDag(); renderCard(); updateHash();
  if (noScroll) return;
  const el = document.querySelector('.step.focus'); if (el && stepIdx) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); else $('#instrument').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function toggleStep(id) {
  S.steps[id] = !S.steps[id]; if (!S.steps[id]) delete S.steps[id];
  if (!S.met && S.steps[id]) S.met = Date.now();
  save(); renderAll();
}
function switchPlan(k) { if (!DATA[k]) return; closeAll(); $('#manual').classList.remove('on'); M = buildModel(k); S = loadState(k); sel = S.sel || 1; if (!M.phases.find(p => p.n === sel)) sel = 1; focusStep = 0; renderAll(); updateHash(); window.scrollTo(0, 0); }
function updateHash() { const h = `#${M.key}/P${sel}`; if (location.hash !== h) history.replaceState(null, '', h); }
function copy(t) {
  const done = () => toast('Copied to clipboard');
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); }
}
function fallbackCopy(t) { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e) { toast('Copy failed — select manually'); } ta.remove(); }
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1400); }
function showHelp() {
  $('#dTitle').innerHTML = '<span class="lbl">Keyboard</span>';
  $('#dBody').innerHTML = `<div class="help">${[['⌘/Ctrl K, /', 'Command palette — every phase, step, AC, decision, rail, finding, file, thread, risk, section, diagram'], ['1 – 9', 'Select phase'], ['← →  or  [ ]', 'Previous / next phase'], ['J / K', 'Next / previous step'], ['X or Space', 'Check / uncheck focused step'], ['C', 'Copy focused step\'s first command (or commit message)'], ['M', 'Open the flight manual (full plan as written)'], ['S', 'Switch plan (062 ⇄ 052)'], ['G', 'Jump to the go/no-go board'], ['Esc', 'Close drawer / palette / manual']].map(([k, v]) => `<kbd style="justify-self:start">${esc(k)}</kbd><span>${esc(v)}</span>`).join('')}</div>
  <p class="dim" style="margin-top:18px;font-size:12px">Checklist ticks, GO/NO-GO calls and the mission clock persist per plan in this browser (localStorage). Deep links: <code>#062/P3</code>, <code>#052/AC-6</code>.</p>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-plan],[data-phase],[data-tick],[data-open],[data-copy],[data-acset],[data-rtab],[data-mjump],[data-closemanual],[data-pi]');
  if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.plan) return switchPlan(t.dataset.plan);
  if (t.dataset.tick) { const st = t.closest('.step'); if (st) { const p = M.phases.find(p => p.n === sel); focusStep = p.steps.findIndex(s => s.id === t.dataset.tick); } return toggleStep(t.dataset.tick); }
  if (t.dataset.copy != null) { copy(t.dataset.copy); t.classList.add('ok'); const o = t.textContent; t.textContent = 'COPIED'; setTimeout(() => { t.classList.remove('ok'); t.textContent = o; }, 1000); return; }
  if (t.dataset.acset) { const [id, v] = t.dataset.acset.split(':'); if (v) S.ac[id] = v; else delete S.ac[id]; save(); renderAll(); openRef(id); return; }
  if (t.dataset.rtab) return renderRight(t.dataset.rtab);
  if (t.dataset.mjump) { const el = document.getElementById(t.dataset.mjump); if (el) el.scrollIntoView({ block: 'start' }); return; }
  if (t.hasAttribute('data-closemanual')) { $('#manual').classList.remove('on'); return; }
  if (t.dataset.pi) return palGo(+t.dataset.pi);
  if (t.dataset.phase) { closeAll(); $('#manual').classList.remove('on'); return selectPhase(+t.dataset.phase); }
  if (t.dataset.open) { if ($('#manual').classList.contains('on') && t.closest('#manual')) { const r = resolve(t.dataset.open); if (r) { $('#manual').classList.remove('on'); } } return openRef(t.dataset.open); }
});
$('#scrim').addEventListener('click', closeAll);
$('#dClose').addEventListener('click', closeAll);
$('#palBtn').addEventListener('click', openPal);
$('#palIn').addEventListener('input', () => { palIdx = 0; palRender(); });
$('#palIn').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palIdx + 1, palItems.length - 1); palRender(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palIdx = Math.max(palIdx - 1, 0); palRender(); e.preventDefault(); }
  else if (e.key === 'Enter') { palGo(palIdx); e.preventDefault(); }
  else if (e.key === 'Escape') { closePal(); $('#scrim').classList.remove('on'); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').classList.contains('on') ? closePal() : openPal(); return; }
  if (e.key === 'Escape') { if ($('#pal').classList.contains('on') || $('#drawer').classList.contains('on')) closeAll(); else $('#manual').classList.remove('on'); return; }
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#manual').classList.contains('on') && e.key !== 'm') return;
  const p = M.phases.find(p => p.n === sel);
  const k = e.key;
  if (k === '/') { e.preventDefault(); openPal(); }
  else if (/^[1-9]$/.test(k) && M.phases.find(p => p.n === +k)) selectPhase(+k);
  else if (k === 'ArrowRight' || k === ']') { const i = M.phases.indexOf(p); if (M.phases[i + 1]) selectPhase(M.phases[i + 1].n); }
  else if (k === 'ArrowLeft' || k === '[') { const i = M.phases.indexOf(p); if (M.phases[i - 1]) selectPhase(M.phases[i - 1].n); }
  else if (k === 'j' || k === 'k') { focusStep = Math.max(0, Math.min(p.steps.length - 1, focusStep + (k === 'j' ? 1 : -1))); renderCard(); const el = document.querySelector('.step.focus'); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (k === 'x' || k === ' ') { e.preventDefault(); const s = p.steps[focusStep]; if (s) toggleStep(s.id); }
  else if (k === 'c') { const s = p.steps[focusStep]; if (s) { const c = (s.cmds[0] || {}).c || s.commit; if (c) copy(c); else toast('No command in this step'); } }
  else if (k === 'm') { $('#manual').classList.contains('on') ? $('#manual').classList.remove('on') : openManual(); }
  else if (k === 's') switchPlan(M.key === '062' ? '052' : '062');
  else if (k === 'g') { const b = $('.board'); if (b) { b.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
  else if (k === '?') showHelp();
});
window.addEventListener('hashchange', fromHash);
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => M && renderDag(), 120); });
function fromHash() {
  const m = location.hash.slice(1).split('/'); const k = DATA[m[0]] ? m[0] : null;
  if (k && (!M || M.key !== k)) switchPlan(k);
  if (m[1]) { if (/^P\d+$/.test(m[1])) selectPhase(+m[1].slice(1), 0, fromHash.boot); else if (M.byId[decodeURIComponent(m[1])]) openRef(decodeURIComponent(m[1])); }
}
$('#modKey').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';

/* boot */
try { history.scrollRestoration = 'manual'; } catch (e) {}
(function boot() {
  const k = (location.hash.slice(1).split('/')[0]) || '062';
  M = buildModel(DATA[k] ? k : '062'); S = loadState(M.key); sel = S.sel || 1; if (!M.phases.find(p => p.n === sel)) sel = 1;
  renderAll();
  if (location.hash.split('/')[1]) { fromHash.boot = true; fromHash(); fromHash.boot = false; } else updateHash();
})();
</script>
