ct rule list` and `rule get`,\n**Then** both expose non-empty `created_at`/`updated_at` (list no longer drops\nthem in its projection map)."}]},{"t":"ac","a":{"id":"AC-12","title":"outcome enum + correction_density documented (F8/F3)","phases":"7","tests":""},"c":[{"t":"md","x":"**Given** the docs,\n**When** a reader consults `quickstart` and the reflect-playbook references,\n**Then** the feedback `outcome` enum (`success|partial|fail|abandoned`, distinct\nfrom miner ack status) and `correction_density` (definition + scale) are\ndocumented; a malformed `outcome` error already names the valid set."}]},{"t":"ac","a":{"id":"AC-13","title":"Legacy yaml removed (F11)","phases":"7","tests":""},"c":[{"t":"md","x":"**Given** the superseded process artifacts,\n**When** the task lands,\n**Then** `docs/reflection/observations.yaml` is deleted and the reflect-playbook\n\"supersedes\" note reflects the removal. The only remaining referencers are the\nalready-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\nreads the file); per F11 (no migration) a future run of those would treat it as\nfirst-run and regenerate an empty file — the discard is intended — so the AC\nconfirms the trio is retired rather than asserting a removal a Go-only grep\ncan't prove."}]},{"t":"thread","a":{"anchor":"AC-13","status":"resolved","priority":"p3","title":"`no Go code references it` is too narrow — the live references are in the still-installed `playbook-*` skills"},"c":[{"t":"comment","a":{"by":"review"},"x":"The deletion is reasonable (reflect-playbook/SKILL.md L31-43 already declares the legacy trio superseded), but AC-13's verification (\"no Go code references it\") checks the wrong surface. The active references to `docs/reflection/observations.yaml` are in the **still-installed** `playbook-observe` / `playbook-refine` / `playbook-search` skills (e.g. `playbook-observe/SKILL.md` does `yq -i '.observations += …'` and reads it on every run). They remain listed as available skills in CLAUDE.md. Deleting the 389 KB file means a stray `/playbook-observe` run treats it as \"first run\" and silently re-creates an empty one, discarding the mined data. F11 says \"no migration\" so the discard is intended — but tighten the AC to also confirm the trio is retired (or note they'll regenerate it), rather than asserting a clean removal a Go-only grep can't prove.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved. AC-13 reworded so the verification no longer relies on a Go-only grep: it records that the only remaining referencers are the already-superseded `playbook-observe`/`-refine`/`-search` skills, which per F11 (no migration) would regenerate an empty file on a future run — the discard is intended — and confirms the trio is retired. P7 step 4 updated to match.","c":[]}]},{"t":"ac","a":{"id":"AC-14","title":"No regressions (cross-cutting)","phases":"1,2,3,4,5,6,7","tests":"auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go"},"c":[{"t":"md","x":"**Given** all changes,\n**When** I run `go build ./...` and the full `auto-reflect` test suite,\n**Then** everything builds and passes (existing assertions updated to the new\nenvelope), and the end-to-end reflect loop completes as in `quickstart`."}]},{"t":"trace","a":{"caption":"Acceptance coverage"},"c":[]}]},{"t":"section","a":{"id":"verification-gaps","title":"Known Gaps & Risks"},"c":[{"t":"md","x":"- **F5 is a breaking output change.** No external consumers are known, but the\n  reflect-playbook skill refs and `quickstart` must move in lockstep (AC-5) or\n  the documented `jq` paths break. Mitigation: update docs in the same task.\n- **Content-id collisions.** Across *distinct* content an 8-hex prefix collision\n  is astronomically unlikely; *identical* content → identical id is intended\n  (idempotency via `projection.go:52-55`). v1 ships **no collision-suffix**;\n  accepted and noted. `retrieve`/`feedback` (`rt-`/`fb-`) stay random — each\n  loop call is a distinct event, not a content identity (see Solution).\n- **F2 root cause not yet pinned.** The off-by-6 is *assumed* to be duplicated\n  logic drift. Before collapsing, confirm it isn't a legitimate dual-universe\n  count (subagents/scope) — the unit test must reproduce the divergence first,\n  then prove the shared function fixes it.\n- **doctor depth.** v1 checks state-dir presence, event decodability, and\n  snapshot staleness (folded-through vs log). Deeper integrity (per-shard seq\n  monotonicity) may be deferred to a follow-up.\n- **No migration of old ids.** Events written before this task keep random ids;\n  only newly minted ids are content-derived. This is intentional (append-only)."}]}]},{"t":"tab","a":{"name":"Solution"},"c":[{"t":"section","a":{"id":"approach","title":"Approach"},"c":[{"t":"md","x":"Nine fixes across one Go module (`auto-reflect/`), all on the read/output side\nplus two hygiene items. Three design decisions were settled with the user (D-7,\nD-8, D-9 below); the rest follow established repo conventions.\n\n**Read-back & observability**\n- **F4 `gap list`** — new `cli/gap.go` noun. Reads `feedback` events, decodes\n  `FeedbackPayload`, emits one row per event that has a `gap`\n  (`report`, `moment`, source event id `ev-…`/`session_id`/`ts`). List-only\n  (a gap has no large body), filters `--since/--after/--before`/`--domain`,\n  returns all when unfiltered.\n- **F1 `doctor`** — new `cli/doctor.go`, mirroring\n  `auto-graph/internal/cli/doctor.go`: structured `[{check,status,message,hint}]`,\n  exit non-zero on any `fail`. Checks: state dir present, `events/` present &\n  decodable, `playbook.json` snapshot fresh vs the folded log (stale ⇒ warn +\n  `run auto reflect rebuild`), legacy 0-byte `feedback.jsonl` flagged.\n  Preserves the 023 null-vs-zero coverage contract.\n\n**Output contract (F5)** — id always reachable at a predictable path:\n- Mutations (`observation add`, `rule create/edit/promote/retire/graduate`,\n  `consolidate`, `feedback`) gain a top-level `id` (and `ids` when many). Fixes\n  `rule promote`'s misleading `null` `.id`.\n- Collections (`retrieve`, `select`, `rule list`, `observation list`,\n  `events list`, `gap list`) stay top-level arrays, but every element carries a\n  uniform top-level `id` (alongside its descriptive `retrieval_id`/`feedback_id`/…).\n- A small `cli/output.go` houses the convention so commands don't drift.\n\n**Identity (F7)** — `r-`/`ob-` ids become a content hash via a new leaf\n`internal/idhash`: `prefix + first 8 hex of sha256(canonical content)`. Rule\ncontent = `domain+use_when+content+rule_type`; observation content =\n`kind+subject+evidence+domain+severity` (evidence included so the same finding\nfrom two sessions stays two observations). Same content ⇒ same id ⇒ `consolidate\n--dry-run` matches apply, and a repeated `consolidate`/`observation add` is an\nidempotent no-op (`projection.go` already ignores a create for an existing id).\nLoop/event ids (`rt-`/`fb-`/`ev-`) stay random.\n\n**Smaller fixes**\n- **F2** — delete `miner status`'s hand-rolled pending loop\n  (`cli/miner.go:280`); call the shared `miner.PendingCount`\n  (`miner/miner.go:223`), the same function `stats` uses. One source of truth.\n- **F6** — `rule list`'s projection map (`cli/rule.go:296`) gains\n  `created_at`/`updated_at` (already populated by `Fold`, just dropped in the\n  list view).\n- **F8/F3** — docstrings + `quickstart`/skill-ref text for the feedback\n  `outcome` enum (`success|partial|fail|abandoned`, distinct from miner ack\n  status) and `correction_density` (corrections per 100 user messages).\n- **F9** — `init` writes an idempotent `.auto/reflect/.gitignore` ignoring\n  `playbook.json` (auto-doc pattern: stat-then-skip-if-exists); the canonical\n  `events/` stays tracked. Repo hygiene: untrack this repo's `playbook.json`.\n- **F11** — delete `docs/reflection/observations.yaml` (no code reads it).\n\nNo event `schema_version` bump: stored payload field names are untouched; F5 is\npresentation-only and F7 changes only how the 8 hex chars are produced."}]},{"t":"section","a":{"id":"end-state","title":"End-state CLI"},"c":[{"t":"cli","a":{"title":"zsh — the hardened surface","caption":"What success looks like"},"c":[{"t":"cmd","a":{"note":"F4: gaps are readable, no more grepping jsonl","status":"todo"},"x":"auto reflect gap list --since 7d"},{"t":"out","a":{},"x":"[\n  { \"id\": \"ev-3a9c1d77\", \"session_id\": \"518b6d9a…\", \"ts\": \"2026-06-28T13:52:…\",\n    \"report\": \"no rule covered worktree teardown on complete-task\",\n    \"moment\": \"deleting the branch after merge\" }\n]"},{"t":"cmd","a":{"note":"F7: same id on dry-run and apply (separate runs)","status":"todo"},"x":"auto reflect consolidate --dry-run delta.json | jq -r '.ids[0]'"},{"t":"out","a":{},"x":"r-1a2b3c4d"},{"t":"cmd","a":{"status":"todo"},"x":"auto reflect consolidate delta.json | jq -r '.ids[0]'"},{"t":"out","a":{},"x":"r-1a2b3c4d   # identical → pre-stage `rule promote r-1a2b3c4d` from the preview"},{"t":"cmd","a":{"note":"F1: structured health, exit 1 on fail","status":"todo"},"x":"auto reflect doctor"},{"t":"out","a":{},"x":"[\n  { \"check\": \"events_dir\", \"status\": \"pass\", \"message\": \"12 shards, all decodable\" },\n  { \"check\": \"playbook_freshness\", \"status\": \"warn\",\n    \"message\": \"snapshot stale vs log\", \"hint\": \"run auto reflect rebuild\" }\n]"}]},{"t":"thread","a":{"anchor":"end-state","status":"resolved","priority":"p2","title":"gap list `id`: example shows `fb-…` but feedback events carry `ev-…` ids — and no `feedback_id` field exists"},"c":[{"t":"comment","a":{"by":"review"},"x":"The `gap list` example emits `\"id\": \"fb-3a9c1d77\"`, but feedback events are appended via `events.AppendEvent` and carry envelope ids matching `^ev-[0-9a-f]{8}$` (`events/log.go` `newEventID`). The `fb-` prefix is the **loop** feedback id (`loop/service.go` `newFeedbackID`), which is *not* persisted on the feedback event. `FeedbackPayload` (`events/model.go:152-158`) has no top-level `feedback_id` either — only `Rankings[].feedback_id` (the ranked rule's id). So when `gap list` reads feedback events (`events.ReadAll`), the only id available is the event's `ev-` id. AC-1's projection \"(`feedback_id`/event id, …)\" is ambiguous about which. Pin it: the row `id` is the `ev-` event id, and fix this example to `ev-…` (or define where a `fb-` id would come from). This also affects AC-5's `.[].id` uniform-path claim for `gap list`.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved. Fixed the `gap list` example to `ev-…` (the feedback *event* id from `events/log.go newEventID`); the `fb-` loop id isn't persisted on the event. AC-1 now states the row `id` is the feedback event id (`ev-…`), and the Solution Approach + Phase-5 gap.go notes match. AC-5's `.[].id` claim holds with the `ev-` id.","c":[]}]}]},{"t":"section","a":{"id":"key-apis","title":"Key APIs"},"c":[{"t":"api","a":{"kind":"module","name":"idhash","lang":"go","path":"auto-reflect/internal/idhash/idhash.go","caption":"One deterministic id minter, reused by rules + observations"},"c":[{"t":"member","a":{"kind":"function","sig":"Derive(prefix string, parts ...string) string"},"x":"Returns prefix + first 8 hex of sha256 over the newline-joined parts. Deterministic; keeps the `^&lt;prefix&gt;-[0-9a-f]{8}$` shape.","c":[]}]},{"t":"api","a":{"kind":"module","name":"cli/output","lang":"go","path":"auto-reflect/internal/cli/output.go","caption":"Uniform mutation-result envelope"},"c":[{"t":"member","a":{"kind":"function","sig":"mutationResult(id string, fields map[string]any) map[string]any"},"x":"Injects a top-level `id` into a command's result map.","c":[]},{"t":"member","a":{"kind":"function","sig":"mutationResultIDs(ids []string, fields map[string]any) map[string]any"},"x":"Injects top-level `id` (first) + `ids` for multi-id mutations like `consolidate`.","c":[]}]}]},{"t":"section","a":{"id":"file-changes","title":"File Changes"},"c":[{"t":"files","a":{},"c":[{"t":"file","a":{"path":"auto-reflect/internal/idhash/idhash.go","change":"add"},"x":"Content-hash id helper (F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/idhash/idhash_test.go","change":"add"},"x":"Determinism + format tests (F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/gap.go","change":"add"},"x":"`gap list` command (F4).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/gap_integration_test.go","change":"add"},"x":"gap list integration tests (F4).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/doctor.go","change":"add"},"x":"`doctor` command (F1).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/doctor_integration_test.go","change":"add"},"x":"doctor integration tests (F1).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/output.go","change":"add"},"x":"Uniform mutation-result envelope helpers (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/root.go","change":"edit"},"x":"Register `gap` + `doctor` commands.","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/rules/model.go","change":"edit"},"x":"`NewRuleID(parts…)` content-derived via idhash (F7).","c":[]},{"t":"thread","a":{"anchor":"auto-reflect/internal/rules/model.go","status":"resolved","priority":"p1","title":"Third NewRuleID caller (`rule create`) is missed — will silently mint a constant id"},"c":[{"t":"comment","a":{"by":"review"},"x":"There are **three** production callers of `rules.NewRuleID()`, not two: `consolidate.go:202` (createDraft), `consolidate.go:485` (split), and **`rule.go:61` (`rule create`)**. Phase 2 and the File Changes only feed content parts to `rules/model.go` + `consolidate.go`; `rule.go:61` (`id := rules.NewRuleID()`) is untouched. The `rule.go` pd-file scopes its edit to \"top-level id + timestamps (F5/F6)\" only. Since the new signature is variadic (`Derive(prefix string, parts ...string)` → `NewRuleID(parts…)`), the zero-arg call at `rule.go:61` **still compiles** — so Phase 2's `go build` will NOT catch it — but it hashes empty content, producing the *same* `r-` id for every manually-created rule. `projection.go:52-55` then drops all but the first (\"a create for an existing id is ignored; the original wins\"), so subsequent `rule create`s silently vanish. Either feed `rule create`'s `domain+use_when+content+rule_type` to `NewRuleID` in Phase 2/3 (and add `rule.go` to Phase 2's file set), or document why manual creates keep a random id. This is the strongest correctness gap in the plan.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved — strongest catch. `rule create` (`rule.go:61`) is the third `NewRuleID` caller and a zero-arg variadic call compiles while minting a constant id (then `projection.go:52-55` keeps only the first). Moved rule-create content-feeding into Phase 2 (added `rule.go` to P2's file set with a step covering all three callers — consolidate createDraft/split + rule create), and set Phase 3 `depends-on=1,2` so its later rule.go envelope/timestamp edits serialize after P2.","c":[]}]},{"t":"file","a":{"path":"auto-reflect/internal/observations/model.go","change":"edit"},"x":"`NewObservationID(parts…)` content-derived incl. evidence (F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/observations/model_test.go","change":"edit"},"x":"Update zero-arg id test for the variadic signature (F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/loop/service_test.go","change":"edit"},"x":"Update zero-arg `NewRuleID` call for the variadic signature (F7).","c":[]},{"t":"thread","a":{"anchor":"auto-reflect/internal/observations/model.go","status":"resolved","priority":"p3","title":"Existing zero-arg id tests will assert against an empty-content hash and aren't in the file set"},"c":[{"t":"comment","a":{"by":"review"},"x":"Two existing tests call the id minters with no args: `observations/model_test.go:248` (`TestNewObservationIDFormat`) and `loop/service_test.go:28` (`rules.NewRuleID()`). After the variadic signature change they'll still compile but now hash empty content, so `TestNewObservationIDFormat` would be asserting format on a constant id. Neither test file is in File Changes. Minor (the executor hits them at phase build/test), but add them to the Phase 1/2 file sets so the determinism contract (AC-7) is updated deliberately rather than discovered.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved. Added `observations/model_test.go` to Phase 1 and `loop/service_test.go` to Phase 2 (both call the minters zero-arg today), each with a step to update it for the variadic signature, and both added to File Changes — so the AC-7 determinism contract changes deliberately.","c":[]}]},{"t":"file","a":{"path":"auto-reflect/internal/cli/consolidate.go","change":"edit"},"x":"Feed content to id mint; top-level `ids`; deterministic dry-run id (F5/F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/observation.go","change":"edit"},"x":"Top-level `id` on add; per-element `id` on list (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/rule.go","change":"edit"},"x":"Top-level `id` on mutations; `created_at`/`updated_at` in list map (F5/F6).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/retrieve.go","change":"edit"},"x":"Per-element top-level `id` (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/select.go","change":"edit"},"x":"Per-element top-level `id` (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/feedback.go","change":"edit"},"x":"Top-level `id`/`ids` on the recorded feedback (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/miner.go","change":"edit"},"x":"Replace hand-rolled pending loop with `miner.PendingCount` (F2).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/miner_integration_test.go","change":"add"},"x":"Pin `miner status` pending == `stats` pending_to_mine (F2).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/init.go","change":"edit"},"x":"Write idempotent `.auto/reflect/.gitignore` (F9).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/init_test.go","change":"add"},"x":"init writes/keeps `.gitignore`; idempotent (F9).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/quickstart.go","change":"edit"},"x":"Docs: gap list, doctor, outcome enum, correction_density, id paths (F4/F1/F8/F3/F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/loop/feedback.go","change":"edit"},"x":"Docstring for the `outcome` enum (F8).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/miner/score.go","change":"edit"},"x":"Docstring for `correction_density` (F3).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/rules/projection_test.go","change":"edit"},"x":"Assert folded timestamps surface (F6).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/consolidate_integration_test.go","change":"edit"},"x":"Assert deterministic ids + new envelope (F5/F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/internal/cli/observation_integration_test.go","change":"edit"},"x":"Assert new envelope + content ids (F5/F7).","c":[]},{"t":"file","a":{"path":"auto-reflect/cmd/autoreflect/e2e_loop_test.go","change":"edit"},"x":"Extend the loop through `gap list`; new envelope paths (F4/F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go","change":"edit"},"x":"Update output-shape assertions (F5).","c":[]},{"t":"file","a":{"path":"auto-reflect/CLAUDE.md","change":"edit"},"x":"Autodoc index: new `gap`/`doctor` commands.","c":[]},{"t":"file","a":{"path":".claude/skills/reflect-playbook/SKILL.md","change":"edit"},"x":"Id-threading invariant, gap list, health check (F4/F5).","c":[]},{"t":"file","a":{"path":".claude/skills/reflect-playbook/references/retrieve.md","change":"edit"},"x":"jq id paths, gap list, outcome enum (F5/F4/F8).","c":[]},{"t":"file","a":{"path":".claude/skills/reflect-playbook/references/observe.md","change":"edit"},"x":"Clarify observation `--kind gap` vs feedback gap (F4).","c":[]},{"t":"file","a":{"path":".claude/skills/reflect-playbook/references/mine.md","change":"edit"},"x":"Document correction_density (F3).","c":[]},{"t":"file","a":{"path":".claude/skills/reflect-playbook/references/consolidate.md","change":"edit"},"x":"Id-threading examples to new envelope (F5).","c":[]},{"t":"file","a":{"path":"docs/reflection/observations.yaml","change":"delete"},"x":"Legacy superseded-process artifact (F11).","c":[]}]}]},{"t":"section","a":{"id":"rejected-alternatives","title":"Rejected Alternatives"},"c":[{"t":"md","x":"- **F4 via a generic `events list --full` flag** — rejected (D-1): a dedicated\n  `gap list` matches the gap→observation mental model and is discoverable.\n- **F5 wrap every command in `{ok,data}`** — rejected: over-wraps reads, breaks\n  more consumers, and fights the repo's \"list returns a plain payload of all\n  items\" convention. Top-level id on mutations + per-element id on reads solves\n  the threading pain with the least breakage.\n- **F5 additive-only (keep all current shapes, just add `.id`)** — rejected\n  (D-3): leaves the inconsistent nesting in place; we still normalize the shapes.\n- **F7 content-derive all ids (`rt-`/`fb-`/`ev-` too)** — rejected (D-8): loop\n  and event ids are distinct-in-time records; hashing would collapse them.\n- **F7 hash + collision suffix** — rejected (D-9): 32-bit distinct-content\n  collision is negligible; a suffix breaks the idempotency property and adds a\n  state read at mint.\n- **F9 append to repo-root `.gitignore`** (auto-skill style) — rejected: a\n  per-state-dir `.gitignore` (auto-doc style) keeps the policy with the state.\n- **F1 extend `gate check` instead of a new `doctor`** — rejected: `doctor` is\n  the conventional health command across auto-* tools.\n- **F6 \"fix\" inside `Fold`** — rejected: `Fold` already sets the timestamps; the\n  only gap is the list view dropping them."}]},{"t":"section","a":{"id":"solution-decisions","title":"Decisions"},"c":[{"t":"decision","a":{"id":"D-7","title":"F5 final shape: top-level id on mutations, per-element id on reads","status":"accepted","by":"charlie","summary":"Mutations expose .id/.ids; collections stay arrays with a uniform .[].id."},"c":[{"t":"md","x":"**Decision:** Mutations gain a top-level `id` (and `ids` when many); collection\ncommands stay top-level arrays but every element carries a uniform top-level\n`id` alongside its descriptive id field.\n**Alternatives:** Wrap everything in `{ok,data}` (rejected — over-wraps reads).\n**Consequences:** Predictable id threading everywhere; minimal breakage; reads\nkeep returning all items as a plain array."}]},{"t":"decision","a":{"id":"D-8","title":"Content-derived ids: rules + observations only","status":"accepted","by":"charlie","summary":"r-/ob- become content hashes; rt-/fb-/ev- stay random."},"c":[{"t":"md","x":"**Decision:** Only persistent identities (`r-`, `ob-`) are content-derived.\n**Consequences:** Fixes dry-run==apply and gives idempotent re-runs; loop/event\nrecords stay distinct-in-time with random ids."}]},{"t":"decision","a":{"id":"D-9","title":"Pure content hash, no collision suffix","status":"accepted","by":"charlie","summary":"id = prefix + first 8 hex of sha256(content); identical content → identical id is intended."},"c":[{"t":"md","x":"**Decision:** No collision suffix. Observation hashes include evidence so\ndistinct-evidence findings stay distinct.\n**Alternatives:** Suffix-on-collision (rejected — breaks idempotency, negligible\nrisk).\n**Consequences:** Clean idempotency; an astronomically rare distinct-content\ncollision would drop the second entry (accepted, noted in Verification risks)."}]},{"t":"decisions","a":{},"c":[]}]}]},{"t":"tab","a":{"name":"Plan"},"c":[{"t":"section","a":{"id":"summary","title":"Summary"},"c":[{"t":"md","x":"Stand up the two shared primitives (content-hash ids + the output-envelope\nconvention) on one command as a walking skeleton, then roll the same patterns\nacross the remaining commands, add the two new nouns (`gap`, `doctor`),\ncollapse the duplicate pending count, and finish with docs/hygiene + an extended\nend-to-end loop. Every phase ends `go build ./...`, package tests, and\n`golangci-lint` clean (019 lesson: full check every phase), then commits."}]},{"t":"section","a":{"id":"execution-sequence","title":"Execution Sequence"},"c":[{"t":"mermaid","a":{"caption":"Phase dependency DAG"},"x":"flowchart LR\n  P1[P1 Foundations + skeleton] --> P2[P2 Rule content ids]\n  P1 --> P3[P3 Envelope rollout + timestamps]\n  P1 --> P4[P4 Pending count]\n  P1 --> P5[P5 gap list]\n  P5 --> P6[P6 doctor]\n  P2 --> P7[P7 Docs, init, cleanup, e2e]\n  P3 --> P7\n  P4 --> P7\n  P6 --> P7"}]},{"t":"section","a":{"id":"phases","title":"Phases"},"c":[{"t":"stepper","a":{},"c":[{"t":"phase","a":{"n":"1","title":"Foundations + walking skeleton","status":"done","files":"auto-reflect/internal/idhash/idhash.go,auto-reflect/internal/idhash/idhash_test.go,auto-reflect/internal/cli/output.go,auto-reflect/internal/observations/model.go,auto-reflect/internal/observations/model_test.go,auto-reflect/internal/cli/observation.go,auto-reflect/internal/cli/observation_integration_test.go"},"c":[{"t":"md","x":"Thin path through every layer the task touches: id minting → command → output\n→ test.\n\n1. Add `internal/idhash/idhash.go`: `Derive(prefix string, parts ...string)\n   string` = `prefix + first 8 hex of sha256(strings.Join(parts,\"\\n\"))`.\n   **Verify:** `idhash_test.go` — same parts → same id; format `^p-[0-9a-f]{8}$`;\n   different parts → different id.\n2. Add `cli/output.go`: `mutationResult(id, fields)` and\n   `mutationResultIDs(ids, fields)` injecting top-level `id`/`ids`.\n   **Verify:** unit/compile.\n3. `observations/model.go`: `NewObservationID` takes canonical parts\n   (`kind,subject,evidence…,domain,severity`) and calls `idhash.Derive(\"ob\",…)`.\n   Update the existing zero-arg `TestNewObservationIDFormat`\n   (`observations/model_test.go`) for the new signature.\n   **Verify:** `go test ./internal/observations/...`.\n4. `observation.go`: `observation add` returns top-level `.id`\n   (via `mutationResult`); `observation list` elements carry top-level `id`.\n   **Verify:** `observation_integration_test.go` — `add` exposes `.id` matching\n   `^ob-[0-9a-f]{8}$`; re-adding identical observation is idempotent (same id);\n   `list | jq '.observations[].id'` non-empty.\n5. **Phase verify:** `go build ./...`; `go test ./internal/observations/...\n   ./internal/cli/... -run 'Observation|Idhash'`; `golangci-lint run`.\n6. **Commit:** `feat(052): content-hash ids + output envelope (skeleton on observation)`."}]},{"t":"phase","a":{"n":"2","title":"Rule content ids + consolidate determinism","status":"done","depends-on":"1","files":"auto-reflect/internal/rules/model.go,auto-reflect/internal/cli/consolidate.go,auto-reflect/internal/cli/rule.go,auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/loop/service_test.go"},"c":[{"t":"md","x":"1. `rules/model.go`: `NewRuleID` takes canonical parts\n   (`domain,use_when,content,rule_type`) → `idhash.Derive(\"r\",…)`.\n   **Verify:** `go test ./internal/rules/...`.\n2. Feed content to **every** `NewRuleID` caller — the signature is variadic, so a\n   missed zero-arg call still compiles but mints a constant id: `consolidate.go`\n   `createDraft`/`split`, **and `rule.go` `rule create`** (the third caller).\n   Emit top-level `ids` from `consolidate` via `mutationResultIDs`; dry-run and\n   apply now mint the same id from the same content. Update `loop/service_test.go`\n   (calls `NewRuleID` zero-arg today) for the new signature.\n   **Verify (the F7 acceptance):** `consolidate_integration_test.go` — run\n   `--dry-run` then apply on one delta in separate command calls; assert\n   `ids[0]` identical; assert a second apply is a no-op (no duplicate rule in\n   the refold); plus a `rule create` smoke check that two distinct creates get\n   distinct ids.\n3. **Phase verify:** `go build ./...`; `go test ./internal/rules/...\n   ./internal/loop/... ./internal/cli/... -run 'Rule|Consolidate|Service'`;\n   `golangci-lint run`.\n4. **Commit:** `feat(052): deterministic content-derived rule ids (F7)`."}]},{"t":"phase","a":{"n":"3","title":"Envelope rollout + rule timestamps","status":"done","depends-on":"1,2","files":"auto-reflect/internal/cli/rule.go,auto-reflect/internal/cli/retrieve.go,auto-reflect/internal/cli/select.go,auto-reflect/internal/cli/feedback.go,auto-reflect/internal/rules/projection_test.go"},"c":[{"t":"md","x":"1. `rule.go`: `create/edit/promote/retire/graduate` return top-level `.id`\n   (fixes the `null`); `rule list` projection map gains `created_at`/`updated_at`\n   (F6 — values already on the folded `Rule`).\n   **Verify:** `rule get`/`list | jq '.rules[].created_at'` non-empty.\n2. `retrieve.go`, `select.go`: each array element gains a top-level `id`\n   (aliasing `retrieval_id`/`feedback_id`, which stay).\n   **Verify:** `retrieve|select | jq '.[].id'` non-empty.\n3. `feedback.go`: recorded result echoes `ids` (the feedback ids acted on).\n4. `projection_test.go`: assert `Fold` surfaces `created_at`/`updated_at` and\n   `rule list` carries them.\n   **Verify (F6).**\n5. **Phase verify:** `go build ./...`; `go test ./internal/...\n   -run 'Rule|Retrieve|Select|Feedback|Projection'`; `golangci-lint run`.\n6. **Commit:** `feat(052): uniform id access on commands + rule timestamps (F5,F6)`."}]},{"t":"phase","a":{"n":"4","title":"Single-source pending count","status":"done","depends-on":"1","files":"auto-reflect/internal/cli/miner.go,auto-reflect/internal/cli/miner_integration_test.go"},"c":[{"t":"md","x":"1. **First reproduce** the divergence: a test that drives `miner status` and\n   `stats` on a fixture and asserts they currently differ (pin the bug before\n   fixing — Verification risk note).\n2. `miner.go`: delete the hand-rolled pending loop (~L280); call\n   `miner.PendingCount(repoRoot, etlRoot)` — the same function `stats` uses.\n   Preserve the 023 null-vs-zero coverage contract in the status output.\n3. **Verify (F2):** `miner_integration_test.go` — `miner status` `pending` ==\n   `stats` `pending_to_mine` on the same fixture.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... ./internal/miner/...\n   -run 'Miner|Stats|Pending'`; `golangci-lint run`.\n5. **Commit:** `fix(052): one pending-count source for miner status + stats (F2)`."}]},{"t":"phase","a":{"n":"5","title":"gap list command","status":"done","depends-on":"1","files":"auto-reflect/internal/cli/gap.go,auto-reflect/internal/cli/gap_integration_test.go,auto-reflect/internal/cli/root.go"},"c":[{"t":"md","x":"1. Add `cli/gap.go` `newGapCmd` → `gap list`: read `feedback` events\n   (`events.ReadAll`), decode `FeedbackPayload`, skip when `Gap == nil`, project\n   `{id (feedback event id, ev-…), session_id, ts, report, moment}` as an array with\n   per-element `id`. Flags `--since/--after/--before`, `--domain`,\n   `--format json|text`; return all when unfiltered (one filter mode at a time).\n2. Register `gap` in `root.go`.\n3. **Verify (F4):** `gap_integration_test.go` — events with gaps surface\n   (report+moment+source); gapless feedback omitted; `--since` filters; empty\n   state returns `[]`; text mode works.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Gap'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect gap list — readable feedback gaps (F4)`."}]},{"t":"phase","a":{"n":"6","title":"doctor command","status":"done","depends-on":"5","files":"auto-reflect/internal/cli/doctor.go,auto-reflect/internal/cli/doctor_integration_test.go,auto-reflect/internal/cli/root.go"},"c":[{"t":"md","x":"1. Add `cli/doctor.go` mirroring `auto-graph/internal/cli/doctor.go`:\n   `[]{check,status(pass|warn|fail),message,hint}` JSON, exit non-zero on any\n   `fail`. Checks: state dir present; `events/` present & decodable; snapshot\n   fresh vs folded log (stale ⇒ warn + `run auto reflect rebuild`); legacy\n   0-byte `feedback.jsonl` flagged. Preserve null-vs-zero coverage.\n2. Register `doctor` in `root.go` (after P5's gap registration — serialized to\n   avoid a root.go conflict).\n3. **Verify (F1):** `doctor_integration_test.go` — healthy state all `pass`\n   exit 0; missing `events/` ⇒ `fail` + hint + exit 1; stale snapshot ⇒ `warn`.\n4. **Phase verify:** `go build ./...`; `go test ./internal/cli/... -run 'Doctor'`;\n   `golangci-lint run`.\n5. **Commit:** `feat(052): auto reflect doctor — state health checks (F1)`."}]},{"t":"phase","a":{"n":"7","title":"Docs, init gitignore, cleanup, e2e","status":"done","depends-on":"2,3,4,6","files":"auto-reflect/internal/cli/init.go,auto-reflect/internal/cli/init_test.go,auto-reflect/internal/cli/quickstart.go,auto-reflect/internal/loop/feedback.go,auto-reflect/internal/miner/score.go,auto-reflect/cmd/autoreflect/e2e_loop_test.go,auto-reflect/cmd/autoreflect/e2e_lifecycle_test.go,auto-reflect/CLAUDE.md,.claude/skills/reflect-playbook/SKILL.md,.claude/skills/reflect-playbook/references/retrieve.md,.claude/skills/reflect-playbook/references/observe.md,.claude/skills/reflect-playbook/references/mine.md,.claude/skills/reflect-playbook/references/consolidate.md,docs/reflection/observations.yaml"},"c":[{"t":"md","x":"1. `init.go`: after `MkdirAll(eventsDir)`, write `.auto/reflect/.gitignore`\n   (`playbook.json\\n`) only if absent (auto-doc stat-then-skip pattern).\n   **Verify (F9):** `init_test.go` — file created with `playbook.json`; second\n   init doesn't overwrite/duplicate; `events/` not ignored.\n2. Repo hygiene: `git rm --cached .auto/reflect/playbook.json`; commit the new\n   `.auto/reflect/.gitignore` and the existing `events/` log (D-2).\n3. Docstrings: `loop/feedback.go` (outcome enum), `miner/score.go`\n   (correction_density). (F8/F3)\n4. Delete `docs/reflection/observations.yaml`. The only live referencers are the\n   already-superseded `playbook-observe`/`-refine`/`-search` skills (no Go code\n   reads it); per F11 no migration — confirm the trio is retired. (F11)\n5. Docs: `quickstart.go` + skill refs (`SKILL.md`, `retrieve.md`, `observe.md`,\n   `mine.md`, `consolidate.md`) — new `jq` id paths, `gap list`, `doctor`,\n   outcome enum, correction_density, observation-`kind gap` vs feedback-gap.\n   `CLAUDE.md` autodoc index (run `auto doc fix`).\n6. Extend `e2e_loop_test.go` through `gap list`; update `e2e_lifecycle_test.go`\n   output-shape assertions to the new envelope.\n   **Verify (F4/F5/AC-14):** full loop mine→…→feedback→gap list passes.\n7. **Phase verify:** `go build ./...`; **full** `go test ./...`;\n   `golangci-lint run`; `auto reflect quickstart` happy path by hand.\n8. **Commit:** `docs(052): gap/doctor/enum docs, init gitignore, drop legacy yaml (F8,F3,F9,F11)`."}]}]}]},{"t":"section","a":{"id":"success-criteria","title":"Success Criteria"},"c":[{"t":"md","x":"- **P1** → AC-4, AC-5 (observation), AC-7\n- **P2** → AC-6, AC-7\n- **P3** → AC-4, AC-5, AC-11\n- **P4** → AC-3\n- **P5** → AC-1, AC-2\n- **P6** → AC-10\n- **P7** → AC-8, AC-9, AC-12, AC-13, and AC-14 (full-suite + e2e green)\n\nAll 14 acceptance criteria pass; `go build ./...` and `go test ./...` clean;\n`golangci-lint` clean; the end-to-end reflect loop completes through `gap list`."}]}]}],"meta":{"id":"052","name":"reflect-tool-hardening","status":"planning","created":"2026-06-28"}},"epic005":{"guardrails":{"G1":{"title":"Messages and events are immutable","kind":"functional","metric":null,"x":"A message row is never updated after insert, and a delivery event is never rewritten. State changes are appended and re-projected. This is what keeps the log mergeable across hosts later."},"G2":{"title":"Consumer state lives in a deliveries join, never on the message","kind":"functional","metric":null,"x":"Read and ack state is keyed by (subscription, message), even though the MVP has exactly one subscription per address. That redundancy is the feature: fan-out becomes extra rows, competing consumers become a column. Putting <code>read_at<\/code> on the message silently encodes \"one consumer, forever\"."},"G3":{"title":"Ack is a separate explicit call, from the first consumer","kind":"functional","metric":null,"x":"Reading does not retire a message. Ack may do nothing but stamp a timestamp — no timer, no redelivery — but every consumer must call it. Retrofitting that call into N prompts and skills is the migration that cannot be done."},"G14":{"title":"Injected keystrokes are a fixed constant, into a verified agent","kind":"security","metric":null,"x":"Two rules, both absolute. <strong>Content:<\/strong> the injected sequence is a fixed constant — an instruction to go and read mail — never interpolated from an envelope or body, or a sender would be typing into a stranger's pane. <strong>Target:<\/strong> the effector must confirm the pane still runs the bound agent before injecting. Hook silence is also what an <em>exited<\/em> agent looks like, and a pane that has fallen back to a shell would execute whatever is typed into it."},"G13":{"title":"Ack transitions exactly once and reports whether it won","kind":"functional","metric":null,"x":"Ack is a conditional update inside the same transaction that appends its event, so concurrent acks on one delivery resolve to exactly one winner. The call returns which it was — a loser is told, never silently treated as success. This is call-site-visible behaviour, so it is fixed now rather than added when leases arrive."},"G4":{"title":"At-least-once and unordered, as documented","kind":"functional","metric":null,"x":"The MVP delivers exactly once, in order, by accident. The contract promises neither. Consumers are idempotent on message id from day one. Promising the stronger guarantee now means ten consumers quietly depend on it."},"G5":{"title":"Addresses are virtual — no physical identity in them","kind":"functional","metric":null,"x":"Physical identity (session, host, herdr/ntm pane) appears only as binding metadata, never in an address, never in a stored envelope's <code>to<\/code> field. Relative handles like <code>#parent<\/code> resolve at send time; the stored envelope always carries the resolved absolute address. Addresses themselves are free-form strings with no enforced structure — validation must stay permissive enough to allow a separator, so hierarchical names remain expressible and prefix filtering stays buildable."},"G6":{"title":"Sending to an address with no subscription persists, and a later subscriber sees it","kind":"reliability","metric":null,"x":"The cross-project journey depends on both halves: mail sent to a project nobody is working in must persist, <em>and<\/em> the agent who subscribes tomorrow must receive it. A send reports two distinct counts — how many <strong>subscriptions<\/strong> exist (durable readers) and how many are currently <strong>bound<\/strong> (live agents) — because zero-subscriptions and zero-bound mean different things to a sender, and only the first is a likely address typo."},"G7":{"title":"Hook environment capture stays an allowlist","kind":"security","metric":"allowlist only, zero secrets persisted","x":"Capture widens to reach herdr panes. It must stay a prefix allowlist and never become \"everything except known secrets\" — agent environments carry live credentials (this host's sessions expose a messaging token in plain env). Captured values land in a host-global store on every hook fire."},"G8":{"title":"The nudge is free when there is no mail","kind":"operability","metric":"no-mail path is a stat-level check","x":"Notification runs in the agent's critical path on tool calls. The common case — no pending mail — must cost about what a <code>stat<\/code> costs, and must never be able to stall or break the hook. Same discipline as the existing tmux capture timeout."},"G9":{"title":"Delivery never corrupts a working agent","kind":"functional","metric":null,"x":"Intrusiveness escalates, never leads. Every message first waits for an in-band hook nudge; keystrokes are the last resort, firing only when the agent is idle by hook silence <em>and<\/em> the message has aged past a threshold. Injection into a running agent can land mid-tool-call or into a permission prompt, so the dangerous mechanism is never spent on the ordinary case."},"G10":{"title":"Alpha: the store may be wiped, nothing may depend on it","kind":"compat","metric":null,"x":"Event types and the store file carry an <code>alpha<\/code> marker. No upcasters, no migrations, no compatibility guarantee; reset is a supported operation. The marker lives in the type string and the filename, not only in docs — a doc note does not stop a skill matching on a bare type name."},"G12":{"title":"No session manager is hard-coded into stored data","kind":"compat","metric":null,"x":"A binding records its physical target as an opaque <code>(manager, target)<\/code> pair — never a typed <code>tmux_pane_id<\/code> / <code>herdr_pane_id<\/code> column. Delivery goes through an effector interface with one implementation per manager. Adding or retiring a manager is then data plus an implementation, never a schema change; and because bindings are a heartbeat-backed projection, retiring one is a delete rather than a migration."},"G15":{"title":"A capability is done when it passes end to end in the harness","kind":"operability","metric":null,"x":"The guiding oracle is a harness scenario running the real <code>auto<\/code> binary in containers over real transports, with a realistic but <em>minimal<\/em> setup. Unit and package tests are supporting evidence, not the verdict — a task whose capability cannot be demonstrated end to end is not finished. Two disciplines carry over from the harness: assert the observable outcome with bounded retry rather than polling to settle, and treat a missing product seam as a finding to raise, never as something to patch around inside the scenario."},"G16":{"title":"The ontology lands before the code that uses it","kind":"functional","metric":null,"x":"Canonical terms go into the ubiquitous-language glossary <em>first<\/em>, and then the same word is used everywhere — schema, event types, CLI, RPC methods, prose and commits. Naming is the one decision that propagates into every surface at once, including the ungreppable ones, so it cannot be tidied up afterwards. This epic already demonstrated the failure: the data model was drafted with an entity named MESSAGE immediately after a decision not to use that noun."},"G11":{"title":"Nothing outside the mail package reads the store","kind":"operability","metric":null,"x":"One client interface is the only API. The moment a skill or hook runs <code>sqlite3<\/code> against the store, the schema is frozen and the transport swap is dead. Worth a doctor check, not just a convention."}},"decisions":{"D-10":{"title":"Subscriptions backfill unacked history from a cursor","status":"accepted","summary":"Delivery rows are materialised lazily against a subscription cursor, not eagerly at send time.","x":"**Context:** G2 keys consumer state by (subscription, message). If delivery rows were created eagerly at send time, a subscription created *later* would have none — and J2 leg 3, where an agent in project B reads mail sent before it existed, could never happen.\n**Decision:** The address holds the mail; a subscription holds a `from_cursor` and its ack state, and delivery rows are materialised **lazily on read**. A new subscription defaults to seeing all unacked mail on the address from the beginning, and can opt to start from now.\n**Alternatives:** Eager rows at send time (silently breaks J2 — the failure only appears when a subscriber arrives late); backfill-from-subscription-time only (breaks J2 for the same reason, just less visibly).\n**Consequences:** A new subscriber to a busy channel inherits the whole unacked backlog — acceptable at alpha volumes, and the cursor is the escape hatch. This is call-site-visible (it determines what `list` returns on a fresh subscription), so it is fixed now rather than discovered by T1."},"D-1":{"title":"Event-source the delivery lifecycle, not everything","status":"accepted","summary":"Append-only log + same-transaction projection; bindings excluded.","x":"**Context:** Storage choice for a low-volume, debugging-heavy, eventually-distributed message store.\n**Decision:** Append-only event log as the authority, projections maintained in the same transaction. Messages immutable. Bindings excluded — the hooks JSONL already is their log.\n**Alternatives:** Mutable tables (simplest, but two hosts' divergent mutable state is a conflict-resolution problem with no good answer); full CQRS with a projection process (rebuild tooling and eventual consistency for a few hundred rows a day).\n**Consequences:** Cross-host merge later is union-and-order-by-ULID rather than conflict resolution. Cost is one extra table and a never-UPDATE discipline. Event types become the most permanent thing in the system — mitigated by D-2."},"D-2":{"title":"Alpha marker in the type string and the store filename","status":"accepted","summary":"alpha, not v1 — a disclaimer, not a compatibility promise.","x":"**Context:** Event sourcing makes the event vocabulary permanent, which raises the stakes on getting it right first time.\n**Decision:** Prefix event types with `alpha` and name the store file with it. Carry a `version` integer on the envelope anyway. Write the alpha contract down explicitly: no upcasters, no migrations, reset supported.\n**Alternatives:** `v1` — implies v2 arrives alongside and obliges upcasters, which is a promise we do not want; a docs-only note — does not stop a skill matching on a bare type name.\n**Consequences:** The versioning tax disappears for now: no upcasting machinery, no closed vocabulary, and a wrong event type can simply be deleted. Cost is an ugly type string, which is load-bearing ugliness. Post-alpha rename touches every subscriber — the accepted price of the disclaimer."},"D-3":{"title":"Reuse auto-shared rpc + transport rather than a new wire","status":"accepted","summary":"mail.* methods on the existing peer; tcp transport already exists.","x":"**Context:** The MVP is single-host but must not foreclose multi-host.\n**Decision:** Register `mail.*` methods on the existing JSON-RPC peer, alongside `doc.*`, `task.*`, `bus.*`. Notification rides the bus; operations ride RPC.\n**Alternatives:** A bespoke socket protocol (rebuilds a solved problem); routing mail over bus events only (at-most-once broadcast cannot carry an ack).\n**Consequences:** Multi-host becomes a dial string rather than a project, and the conformance suite already covers the wire."},"D-11":{"title":"The MVP CLI writes the store directly; the daemon is never required","status":"accepted","summary":"Direct-store client is the default implementation; RPC is the second one, used by the daemon.","x":"**Context:** Seam 2 says send/list/ack are RPC calls, and D-3 registers `mail.*` on the daemon's peer — which would make the daemon the store's owner and put it in the path of every operation.\n**Decision:** `mail.Client` has two implementations. The **direct-store** one is what the MVP CLI binds to: send, list and ack work with no daemon running. The **RPC** one is the second implementation that proves the seam, and is what the daemon uses to observe and notify. Seam 2 describes the contract *when a call crosses the wire*, not a requirement that the MVP route through the daemon.\n**Alternatives:** RPC-first (mail is down whenever the daemon is — and autowatch crash-loops are a documented failure mode on this host; it also breaks the case this epic exists for, since a failing agent must be able to post mail with nothing else alive).\n**Consequences:** Every agent process plus the daemon are concurrent writers to one SQLite file, so WAL and a concurrent-writer discipline become an explicit T1 concern rather than an assumption. G11 still holds — the client is inside the mail package, so \"nothing outside reads the store\" is unaffected."},"D-4":{"title":"No message resource noun on the CLI","status":"accepted","summary":"auto mail send|list|ack — avoids the glossary's Message collision.","x":"**Context:** `docs/concepts/UBIQUITOUS_LANGUAGE.md` binds **Message** to a role-tagged exchange within a Session. A mail resource of the same name would make `auto search message get` and `auto mail message get` mean unrelated things in one binary.\n**Decision:** `auto mail` is itself the resource noun — flat verbs, no `message` subcommand. The glossary gains **Mail** (the stored unit, named `MAIL` in the schema), **Address**, **Subscription**, **Delivery** and **Binding** — the concepts the epic actually uses.\n**Alternatives:** `auto mail letter …` (unambiguous but coins a term, and the metaphor fights the channel/subscription model); qualification by context as the glossary's **Event** entry does (most conventional, but the in-binary collision remains).\n**Consequences:** A glossary update is in scope for this epic, not optional cleanup."},"D-6":{"title":"Mail's effector seam is separate from autowatch's execution Backend","status":"accepted","summary":"Two managers exist today, so the seam is forced — but it is not the Backend refactor.","x":"**Context:** Three session managers are in play (ntm, tmux, herdr), with a long-term intent to consolidate on herdr. autowatch already has a `Backend` interface (`Start` / `Kill` / `SessionExists`) with a single tmux implementation.\n**Decision:** Leave that `Backend` untouched. Mail gets its own narrow effector seam — deliver to a pane, and ask whether it is alive — with one implementation per manager. The manager identity lives in the binding as an opaque `(manager, target)` pair (G12).\n**Alternatives:** Extend the existing `Backend` (wrong lifecycle — it abstracts sessions autowatch *creates and owns*, whereas mail addresses panes created externally by herdr or ntm); hard-code herdr (breaks ntm panes, which hook capture already sees and which the ntm how-to still documents); a general session-manager refactor across autowatch (large, speculative, and unused by this epic).\n**Consequences:** Two implementations are required from day one regardless, because both manager families are live — so naming the interface is free rather than speculative. `#new` maps onto the existing `Backend.Start` when it is built, which is a further reason not to reshape it now on a guess. Doctor becomes manager-aware inside T3/T4."},"D-5":{"title":"The sender notifies inline; no cron sweep in the MVP","status":"superseded","summary":"SUPERSEDED by D-12 — cutting the sweep entirely left D-8's escalation with nothing to drive it.","x":"**Context:** A periodic inbox sweep was the obvious delivery driver, but a one-minute tick sets a 60-second floor on latency and burns work when nothing happened.\n**Decision:** On a single host the sender resolves the binding and notifies inline. The reconciling sweep — which is what heals dropped pushes — is deferred until there are pushes that can drop, i.e. multi-host.\n**Alternatives:** Cron as the primary path (latency floor, and it is the wrong shape even later); no notification at all (mail sits unread, which is the failure mode this epic exists to fix).\n**Consequences:** Removes the daemon from the critical path of the walking skeleton. The effector still lives in the daemon for idle delivery, because keystroke injection needs a process on the owning host."},"D-12":{"title":"Inline notify for latency, plus a minimal reconcile tick for correctness","status":"accepted","summary":"Supersedes D-5: escalation needs a re-drive, so a small sweep is in the MVP after all.","x":"**Context:** D-5 cut the sweep on the premise that on one host there are no pushes to drop. That premise does not survive contact with two facts. D-8 escalates only once mail \"has gone unread past an age threshold\" — a condition that is *false at send time*, when the inline notification runs, so something must re-evaluate later. And the notification path is the bus, which by its own specification is at-most-once and drops slow subscribers; a daemon restart also loses any in-memory timer.\n**Decision:** Keep inline notification as the fast path, and add a **minimal reconcile tick** in the daemon that re-evaluates unacked mail against the escalation policy. autowatch already owns ticker/cron machinery, so this is small. The sweep is not a scheduler — it is the thing that makes escalation and the nobody-was-running case actually happen.\n**Alternatives:** Keep D-5 as written and accept that escalation is best-effort (silently breaks J2, which is a headline journey, and sits badly against G4's at-least-once promise); an in-memory timer only (lost on the daemon restarts this host is known for).\n**Consequences:** T3 gains a small reconcile loop. Latency is still push-driven; the tick only bounds *escalation*, so its interval does not gate ordinary delivery. This restores the \"push for latency, sweep for correctness\" split properly, rather than dropping half of it."},"D-7":{"title":"Broadcast delivery, with ack as a compare-and-set","status":"accepted","summary":"Every subscription gets its own copy; ack transitions exactly once and says whether it won.","x":"**Context:** Q-1 settled fan-out as broadcast, and raised ack atomicity.\n**Decision:** Each subscription holds its own `deliveries` row and its own ack, so two *subscriptions* never contend. Ack is a conditional update inside the existing append-and-project transaction (`WHERE acked_at IS NULL`), and **returns whether this call was the one that transitioned it**. Two agents sharing one subscription therefore race safely: exactly one wins, the loser is told so rather than silently succeeding.\n**Alternatives:** A separate lock table (a second thing to keep consistent, and redundant — the transaction discipline from D-1 already makes ack atomic); ack as an unconditional write (idempotent-looking, but it cannot tell a winner from a loser, which is the whole point).\n**Consequences:** The compare-and-set is exactly the primitive competing consumers and leases need later, obtained now for free. Ack's return value is call-site-visible, so it is fixed in the MVP rather than added later. Note the nuance: under pure broadcast two *agents* only contend if they deliberately share one subscription identity — the common case has no race at all, and both acks correctly succeed."},"D-8":{"title":"Escalating intrusiveness: nudge first, keystrokes last","status":"accepted","summary":"Keys fire only when the agent is idle AND the message has aged past a threshold.","x":"**Context:** Q-2 rejected default-on keystroke injection in favour of escalation.\n**Decision:** Notification escalates in stages. Every message first waits for an in-band hook nudge. Keystrokes fire only when **both** conditions hold: the agent is idle by hook silence, *and* the message has gone unread past an age threshold. Escalation is a policy-table row, not a branch in code.\n**Alternatives:** Keys immediately on idle (reaches the agent fastest, but spends the most dangerous mechanism on the most ordinary case); opt-in per subscription only (the cross-project journey silently does nothing for anyone who did not know to opt in).\n**Consequences:** J2 trades latency for safety — an idle agent is woken after the threshold, not instantly. Acceptable in alpha, and the threshold is data. Two escalation stages also means the `Notifier` seam is exercised by more than one implementation from the start, which is what makes it a real abstraction rather than a guess. **Forward note for T3:** define idleness as a property that can later be *contradicted*, not merely a silence timer — a future blocking receive (`wait`) parks an agent that is emphatically not idle, and escalating into it would be the exact corruption G9 exists to prevent. Leaving room for a binding to declare \"blocked on a receive\" costs nothing now and is awkward to retrofit into a bare timer."},"D-9":{"title":"Addresses are free-form; structure is convention, filtering is v2","status":"accepted","summary":"Validate permissively so prefix filtering stays possible; enforce nothing.","x":"**Context:** Q-3 chose flexibility over an enforced namespace, with prefix filtering deferred.\n**Decision:** An address is an opaque string with no enforced structure and no required project segment. Validation is permissive but must **explicitly allow a separator character**, so hierarchical names remain expressible by convention and prefix filtering stays buildable later. Prefix and attribute subscriptions move to the parked backlog.\n**Alternatives:** An enforced `project/name` shape (breaks addresses that are not about a project, like a swarm channel); a strictly opaque token with separators rejected or normalised away — the one variant that *would* foreclose prefix filtering, and therefore the one to avoid.\n**Consequences:** Free-form addresses make typo-collisions silent, mitigated by G6 reporting when a send finds nothing bound. Nothing else in the MVP depends on address structure, so this stays a validation rule rather than a design."},"D-13":{"title":"#parent covers in-process subagents only, resolved from hook-supplied parentage","status":"accepted","summary":"No launcher changes: the parent id is already on the child's own hook events. Panes are deferred.","x":"**Context:** Q-4, answered in-process only.\n**Decision:** `#parent` resolves from the parentage already carried on an in-process subagent's hook events — the parent's `session_id` alongside the child's `agent_id`. A hook records which agent is currently active for a session so the mail CLI can identify itself, since the hook payload never reaches a tool call and an in-process subagent shares the parent's environment. Used from a spawned pane, or from anything that is not a subagent, `#parent` fails fast with a remediation hint.\n**Alternatives:** Env promotion (`AUTO_MAIL_SELF` → `AUTO_MAIL_PARENT`) — the bootstrap hole review found: a supervisor that subscribes mid-session cannot set a variable in its own running process, so nothing it spawns afterwards inherits anything. Launch-time stamping by herdr/ntm/delegate in the MVP — makes panes work too, but adds a cross-tool dependency this epic does not otherwise carry; parked for later.\n**Consequences:** T2 ships with **no changes outside the mail package**, which is why this scoping is worth taking. J1 is scoped to in-process subagents — which is what this repo's glossary means by *Subagent* anyway, so the journey needs no reinterpretation. The known limitation is that the self-identification bridge races when several subagents run concurrently; it is bounded by concurrent subagent count and T1's harness scenario is the place to exercise it rather than assume it. Waking a sub-agent is moot here: an in-process subagent shares the parent's pane, so it has no separate target to inject into."}}},"feedback052":"# Feedback: Task 052\n\n## Problems faced\n1. **The whole loop \"works locally, fails in CI\" on a single omitempty field** — `TestE2ELoopQuickstart` asserted the `gap list` row carried a `session_id`, but `session_id` is `omitempty` and the feedback event's session resolves from `events.DetectSessionID()` (env vars). The dev shell exported a session id (inherited by the test subprocess), so it passed; the clean CI runner had none → field omitted → CI red. Fix was to pin `AUTO_SESSION_ID` for the e2e loop (first in detection precedence) so the loop runs under one deterministic session, matching how a real agent always runs. Lesson: any test asserting an env-derived/`omitempty` field must set that env explicitly, or it's only testing the dev host.\n2. **F2 root cause was a normalization mismatch, not \"two universes\"** — the 390-vs-396 pending divergence came from `miner status` scope-keying with a scheme-strip that skipped `sharedgit.NormalizeRemoteURL`, while `miner.PendingCount` ran it. Sessions whose `git_remote` was `.git`-suffixed / ssh-form / mixed-case fell out of one count but not the other. The plan's instruction to *reproduce the divergence first* (write the failing assertion before collapsing) was what surfaced it cleanly.\n3. **Content-derived ids + a variadic signature is a silent footgun** — `NewRuleID(parts ...string)` means a missed zero-arg caller still compiles but mints a constant id, which `projection.go` then drops all-but-first of. The plan had already flagged the third caller (`rule create`); without that pin it would have been a build-clean, test-passing data-loss bug.\n\n## Reflections\n- **What was tricky?** The CI-only failure — nothing local reproduced it until I cleared the four session env vars (`env -u …`) to simulate a clean runner. That `env -u` trick became the reliable repro.\n- **What would you tell yourself at the start?** Run the full suite *with the ambient session env cleared* before declaring a phase green, especially for anything touching feedback/gate/gap scope. The e2e phase passed locally and still broke CI.\n- **What did you almost do but didn't?** Almost made `gap list` always emit `session_id` (drop `omitempty`) to satisfy the test — but that diverges from the `events list` convention and papers over the real issue (the loop genuinely had no session). Fixing the *test's* environment was the honest fix.\n- The `--all` pending-universe bug (review thread) was a direct consequence of single-sourcing onto `PendingCount` without threading the scope flag — collapsing duplication is right, but the shared function has to carry every axis the callers varied on.\n\n## Useful context\n- `context.md`'s file:line grounding (especially the F2/F6/F7 sections and the \"third `NewRuleID` caller\" note) was the highest-leverage artifact — it turned each phase into a targeted edit rather than a search.\n- `auto-graph/internal/cli/doctor.go` as the canonical `doctor` template; `cli/events.go` as the closest `gap list` pattern. Mirroring existing siblings kept the new nouns idiomatic.\n- Decisions D-5/D-6/D-9 (envelope = presentation-only, no schema bump; pure content hash, idempotency intended) were the load-bearing constraints — they pre-answered the \"should I change the stored payload?\" and \"should I add a collision suffix?\" questions that came up mid-implementation and in review.\n- `reflect-playbook` is a **managed skill**: edit `skills/reflect-playbook/` source and re-render via full `auto skill sync --locked` (never `--target`, which deletes other rendered skills). Editing the `.claude/` render target directly trips the pre-commit `skills-check`.\n"}</script>

"use strict";
const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MD = (s) => {
  try { if (window.marked) return marked.parse(s || '', { gfm: true, breaks: false }); } catch (e) {}
  // fallback: minimal renderer if the CDN is unreachable
  return '<p>' + esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '</p><p>') + '</p>';
};
const MDi = s => MD(s).replace(/^<p>|<\/p>\s*$/g, '');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* ════════════ MODEL: derive everything from the embedded plan tree ════════════ */

          files: (n.a.files || '').split(',').filter(Boolean), md: (n.c.find(k => k.t === 'md') || {}).x || '' };

      case 'api': M.apis.push({ a: n.a, members: n.c.filter(k => k.t === 'member') }); return;

  M.files.forEach(f => { f.phases = M.phases.filter(p => p.files.includes(f.path)).map(p => p.n); });

    Object.entries(ep.decisions).forEach(([id, d]) => { if (!M.byId[id]) M.byId[id] = { kind: 'decision', obj: { id, title: d.title, status: d.status, summary: d.summary, body: d.x, src: 'epic 005' } }; });

  M.risks = bullets(sectionMd(M, 'verification-gaps')).map((b, i) => ({ id: 'R' + (i + 1), kind: 'risk', ...splitLead(b), phases: (M.ov.riskPhases || [])[i] || [] }));
  M.assumptions = bullets(sectionMd(M, 'open-questions')).map((b, i) => ({ id: 'A' + (i + 1), kind: 'assumption', ...splitLead(b.replace(/^\[ \]\s*/, '')), phases: [] }));

}
function sectionMd(M, id) { const s = M.sections.find(s => s.id === id); if (!s) return ''; return s.node.c.filter(k => k.t === 'md').map(k => k.x).join('\n\n'); }

}
function splitLead(b) { const m = b.match(/^\*\*(.+?)\*\*\s*([\s\S]*)$/); return m ? { lead: m[1], body: m[2], raw: b } : { lead: b.split('\n')[0].slice(0, 80), body: '', raw: b }; }
const CMD_RE = /^(cd |go |make |uv |python3 |auto |golangci-lint|git |\.\/bin\/|env |CGO_ENABLED)/;

function computeGraph(M) {

  P.forEach(p => { p.drawDeps = p.deps.filter(d => !p.deps.some(o => o !== d && byN[o].anc.has(d))); });

  const layer = {}; const L = n => layer[n] ?? (layer[n] = byN[n].deps.length ? 1 + Math.max(...byN[n].deps.map(L)) : 0);

function phaseState(p) {

function renderMet() {
