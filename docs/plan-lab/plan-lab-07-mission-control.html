, but the seam is not *proven* until T3's RPC\n  implementation runs against the same suite. Risk accepted: the alternative —\n  dragging the daemon into the walking skeleton — is the thing D-11 exists to\n  prevent.\n- **The `cwd` rung of the binding ladder is weak on this host.** Every pane here\n  shares one primary checkout (see `docs/postmortems/2026-06-28-shared-checkout-\n  rogue-agent.md`), so two agents in the same worktree with no tmux would collide\n  on one binding. T1 tests the tmux rung and the cwd rung separately and\n  documents the collision; T3 replaces the fallback for panes. It does not affect\n  the harness, where each agent has its own workspace.\n- **The pending flag is a second source of truth.** Deliberately a *hint*\n  (D-062-3): a false positive costs one store open, a false negative is healed by\n  the next send and, from T3, by the reconcile tick. Both directions are tested,\n  but a flag that drifts and stays drifted until the next send is a real (bounded)\n  latency hazard with no daemon running.\n- **Escalation is untestable here, because it does not exist yet.** G9, G12, G14\n  and D-8 are T3's. T1 asserts only the in-band nudge to an agent that is already\n  working. An agent that is idle receives nothing in T1 — by design, and stated in\n  `auto mail docs` so nobody builds on a guarantee that is not there.\n- **No cross-host coverage.** Single host is the MVP. The scenario's\n  one-container topology is the control the multi-host case will later be\n  compared against.\n- **The harness is not in CI.** `harness/CLAUDE.md` lists CI wiring as deferred,\n  so the G15 oracle runs locally and on demand. That is a pre-existing gap this\n  task inherits rather than creates; the package, conformance and race tests do\n  run in `make test`.\n- **No load or volume testing.** Alpha volumes are a few hundred rows a day\n  (D-1). Retention is explicitly an alpha non-answer — \"wipe it\" (G10)."}]}]},{"t":"tab","a":{"name":"Solution"},"c":[{"t":"section","a":{"id":"approach","title":"Approach","summary":"A new auto-mail module whose only exported package is the client seam; an append-only SQLite log with same-transaction projections; a stat-only pending flag driving the hook nudge; and a one-container harness scenario as the oracle."},"c":[{"t":"md","x":"Five things exist at the end of this task, in the order the epic demands them.\n\n**1. The glossary carries the vocabulary (G16).** `Mail`, `Address`,\n`Subscription`, `Delivery`, `Binding` land in\n`docs/concepts/UBIQUITOUS_LANGUAGE.md` **before** the first Go file is written,\nwith `Mail`'s `_Avoid_` line naming *message* explicitly. Every subsequent\nsurface — table names, event types, Go identifiers, CLI text, commit messages —\nuses those words and only those words.\n\n**2. `auto-mail` is a module whose public surface is exactly one package.**\n`auto-mail/mail` exports the `Client` interface, its direct-store constructor,\nthe domain types, address validation, binding derivation and the stat-only\npending check. **Everything else lives under `auto-mail/internal/`** — which\nmeans G11 is enforced by the Go compiler, not by a convention or a `doctor`\ncheck: no package outside this module *can* reach the store, because\n`auto-mail/internal/store` is unimportable from anywhere else. The epic called\nG11 \"worth a doctor check\"; making it a compile-time property is strictly\nstronger, and the repo-wide grep test (AC-12) is then belt-and-braces over a\nguarantee rather than the guarantee itself.\n\n**3. The store is an append-only log with same-transaction projections (D-1).**\nOne SQLite file, `~/.auto/mail/alpha-store.db` — the `alpha` marker in the\nfilename, per D-2. `events` is the authority and is append-only, enforced by\n`BEFORE UPDATE` / `BEFORE DELETE` triggers that `RAISE(ABORT)`; `mail` is an\nimmutable projection under the same discipline; `deliveries` and `bindings` are\nmutable projections rebuildable from the log (bindings excepted — they project\nthe hooks JSONL, per seam 4). Every command opens one immediate transaction,\nappends its event, updates its projections and commits. WAL plus a 5s\n`busy_timeout` — the exact pragma set `auto-watch/internal/store/store.go`\nalready uses — is the concurrent-writer discipline D-11 makes a T1 concern.\n\n**4. The nudge never opens the store.** `send` writes an empty **pending flag**\nfile for each bound subscription; `ack` and `list` remove it when that\nsubscription has nothing unacked left. `auto hooks fire` derives the firing\nagent's `(manager, target)` pair from the same `hooks.CaptureContext` the\nenvelope already uses, stats **one** path, and emits a **fixed** instruction to\ngo and read mail if it is there. No store open on either path, no interpolation\nof anything sender-controlled, and a stale flag self-heals on the next `list`.\nThe flag is a hint whose only failure modes are one wasted `list` (false\npositive) or a nudge that waits for the next `send` (false negative).\n\n**5. The harness scenario is the oracle (G15).** `mail-flow` is one container —\none host id, one `~/.auto`, two registered workspaces — because the mail store\nis host-global and the harness's own convention makes a second container a\nsecond *host* (D-062-1). It drives the C1 loop with the real binary, asserts the\nnudge on a real `auto hooks fire`, and asserts that a host which never ran\n`auto mail init` never grows a store file.\n\nWhat is deliberately **not** here: any relative handle, any keystroke effector,\nany liveness policy, any daemon, any bus publish, any RPC method. T1 is the\nthinnest *verifiable* path, not the thinnest possible one — the nudge is inside\nit because hook→notification is the risk, and the scenario is inside it because\nan oracle that arrives last can only confirm what was already built."}]},{"t":"decision","a":{"id":"D-062-8","title":"One exported package, `auto-mail/mail`; the store stays internal","status":"accepted","by":"agent","summary":"Makes G11 a compile-time property instead of a convention, at the cost of one deliberate exception to the package blueprint."},"c":[{"t":"md","x":"**Context:** `docs/auto-package-patterns.md` says \"all implementation lives under\n`internal/` (no public API exports)\". But seam 1 makes `mail.Client` the API\nevery other `auto-*` tool consumes, and `auto-cli`'s hook is the first consumer —\nso *something* must be exported.\n**Decision:** Export exactly one **domain** package, `auto-mail/mail`: the\n`Client` interface, `NewDirect`, the domain types, address validation, binding\nderivation and the stat-only pending check. Alongside it sits the mandatory\nmounting façade `auto-mail/rootcmd`, which every tool in this monorepo has and\n`auto-cli/cmd/auto/main.go` must import — it holds no domain logic and never\ntouches the store, so it is a wiring surface rather than an API. Everything else\n— most importantly `auto-mail/internal/store` — stays internal and is therefore\n**unimportable from any other module**. The invariant the seam guard enforces is\ntherefore \"one exported domain API plus the `rootcmd` façade\", not \"one exported\npackage\".\n**Alternatives:** Export nothing and have `auto-cli` shell out to `auto mail`\nfrom the hook (a process spawn in the agent's hot path, which G8 forbids); export\nthe store too (G11 becomes a convention again, and the schema freezes the moment\nsomeone reaches past the client); put the client in `auto-shared` (inverts\nownership — `auto-shared` would depend on mail's domain, and the store would have\nnowhere sensible to live).\n**Consequences:** G11 is enforced by the compiler, which is strictly stronger\nthan the doctor check the epic proposed; AC-12's repo-wide grep becomes\nbelt-and-braces over a guarantee rather than the guarantee itself. The blueprint\ngains one documented exception, noted in `auto-mail/CLAUDE.md` so the next\npackage author does not read it as licence."}]},{"t":"thread","a":{"anchor":"D-062-8","status":"resolved","priority":"p2","title":"`rootcmd` is a second exported package"},"c":[{"t":"comment","a":{"by":"review"},"x":"D-062-8 says the public surface is exactly one package, `auto-mail/mail`, and that everything else stays under `internal/`. The file-change tree also adds `auto-mail/rootcmd/rootcmd.go`, and `auto-cli/cmd/auto/main.go` must import that package to mount `auto mail`, matching every existing tool's pattern. Clarify that the invariant is \"one exported domain/client API plus the required `rootcmd` mounting facade\"; otherwise an implementer could either hide `rootcmd` under `internal/` and break mounting, or write a seam guard that incorrectly treats the facade as a violation.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Fair, and the wording was genuinely misleading — an implementer following it literally would either have hidden <code>rootcmd<\/code> under <code>internal/<\/code> and broken mounting, or written a guard that flagged the façade. D-062-8 now states the invariant as \"one exported <strong>domain<\/strong> API (<code>auto-mail/mail<\/code>) plus the mandatory <code>rootcmd<\/code> mounting façade\", and records that the façade holds no domain logic and never touches the store — a wiring surface, not an API. The seam guard in Phase 5 is scoped accordingly.","c":[]}]},{"t":"decision","a":{"id":"D-062-9","title":"The hook writes one hookSpecificOutput object, carrying every fragment","status":"accepted","by":"agent","summary":"The existing hint path already emits at most one object per event; a second producer must join it, not write a second line."},"c":[{"t":"md","x":"**Context:** `matchAndEmitHint` (`auto-cli/cmd/auto/hints.go`) writes a\n`hookSpecificOutput` JSON object to stdout and returns after the **first**\nmatching rule — \"emit at most one hint per event\" — with a comment explaining\nthat unexpected stdout is something an agent might reject. The mail nudge is a\nsecond producer on that same stdout.\n**Decision:** Split matching from emission. `matchHint` returns the rendered\nfragment (or empty); `emitAdditionalContext` writes **exactly one**\n`hookSpecificOutput` object whose `additionalContext` joins the fragments, mail\nfirst. Zero fragments means zero bytes on stdout, exactly as today.\n**Alternatives:** Emit a second JSON line (two objects on one hook's stdout is\nundefined behaviour in both agents' hook contracts and is precisely what the\nexisting comment guards against); make mail a `triggerRegistry` entry (the\nregistry matches on *payload shape*; mail's condition is a filesystem stat, not\na payload predicate, and it must fire on every PostToolUse rather than a\nspecific tool).\n**Consequences:** `hints_test.go` changes shape but not behaviour — the existing\nassertions carry over onto `matchHint`. Ordering is fixed (mail first) so a\nproject's hint rules can never suppress the nudge."}]},{"t":"section","a":{"id":"end-state-flow","title":"How one message travels","summary":"Send writes an event, a mail row, delivery rows for bound subscriptions and a pending flag; the receiver's next hook stats the flag and nudges; list materialises and ack transitions."},"c":[{"t":"mermaid","a":{"caption":"The T1 path — no daemon anywhere in it"},"x":"sequenceDiagram\n  participant A as agent A (auto mail send)\n  participant M as mail.Client (direct)\n  participant DB as alpha-store.db\n  participant FL as alpha-flags/\n  participant HK as agent B hook (auto hooks fire)\n  participant B as agent B (auto mail list/ack)\n\n  B->>M: Subscribe(\"auto-web/bugs\")\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.subscribed;<br/>insert subscription + binding(manager,target); COMMIT\n  A->>M: Send(to, body)\n  M->>DB: BEGIN IMMEDIATE; append alpha.mail.sent;<br/>insert mail; insert deliveries for bound subs; COMMIT\n  M->>FL: touch flag(sha8(manager,target))\n  M-->>A: {id, to, subscriptions:1, bound:1}\n  HK->>FL: stat one path (no DB open)\n  HK-->>B: hookSpecificOutput.additionalContext (fixed text)\n  B->>M: List()\n  M->>DB: materialise deliveries from cursor;<br/>append alpha.mail.read (first read only)\n  M-->>B: [ {id, from, sentAt, body} ]\n  B->>M: Ack(id)\n  M->>DB: BEGIN IMMEDIATE;<br/>UPDATE deliveries SET acked_at=? WHERE acked_at IS NULL;<br/>append alpha.mail.acked; COMMIT\n  M->>FL: rm flag if nothing unacked remains\n  M-->>B: {id, acked:true, wonTransition:true}"}]},{"t":"section","a":{"id":"end-state-schema","title":"The store at the end of this task"},"c":[{"t":"mermaid","a":{"caption":"events is the authority; mail is immutable; deliveries and bindings are projections"},"x":"erDiagram\n  MAIL ||--o{ DELIVERY : \"copied to\"\n  SUBSCRIPTION ||--o{ DELIVERY : \"owns state of\"\n  ADDRESS ||--o{ SUBSCRIPTION : \"bound by\"\n  SUBSCRIPTION ||--o| BINDING : \"currently held by\"\n  EVENT {\n    int seq\n    ulid id\n    string type\n    int version\n    time occurred_at\n    json payload\n  }\n  MAIL {\n    ulid id\n    int seq\n    string to_address\n    json envelope\n    json body\n    time sent_at\n  }\n  SUBSCRIPTION {\n    string id\n    int seq\n    string address\n    string name\n    int from_cursor\n    time created_at\n  }\n  DELIVERY {\n    string subscription_id\n    ulid mail_id\n    time first_seen_at\n    time read_at\n    time acked_at\n    string acked_by\n  }\n  BINDING {\n    string subscription_id\n    string manager\n    string target\n    string session\n    time last_seen\n  }"},{"t":"md","x":"Notes that are load-bearing rather than descriptive:\n\n- **`EVENT` is standalone in the diagram because it is the authority, not a\n  relation.** Every other table is derivable from it (`bindings` excepted — seam\n  4 makes those a projection of the hooks JSONL, which is already an append-only\n  log).\n- **`BINDING` hangs off `SUBSCRIPTION`, not `ADDRESS`** — the correction the\n  epic's review forced, so two live subscribers on one channel never fight over a\n  single row.\n- **`manager` and `target` are an opaque pair (G12)**, never a typed\n  `tmux_pane_id` column. T3 adds `herdr` as a data value plus an effector\n  implementation, with no schema change.\n- **`DELIVERY` looks like pointless indirection in the MVP** — one subscription\n  per address, one row per mail. That is the point: it is the single structural\n  concession that keeps fan-out, competing consumers and leases from ever\n  touching a call site.\n- **`read_at` is written in T1**, once per delivery, guarded by\n  `WHERE read_at IS NULL` so repeated `list` calls append no further events. It\n  is not needed by T1 itself; it is written now because D-8's escalation\n  predicate — \"unread past an age threshold\" — is exactly this column, and\n  retrofitting the write into T3 would mean T3 shipping with no history to\n  escalate against."}]},{"t":"section","a":{"id":"end-state-api","title":"The client seam"},"c":[{"t":"api","a":{"kind":"interface","name":"mail.Client","lang":"go","path":"auto-mail/mail/client.go","caption":"The only API. CLI, hook, daemon and every future auto-* tool go through it."},"c":[{"t":"member","a":{"kind":"method","sig":"Subscribe(ctx context.Context, in SubscribeInput) (SubscribeResult, error)"},"x":"Creates or returns the subscription for an address, records the caller's binding, and reports how many unacked mail items the cursor backfilled.","c":[]},{"t":"member","a":{"kind":"method","sig":"Send(ctx context.Context, in SendInput) (SendResult, error)"},"x":"Appends alpha.mail.sent and inserts the immutable mail row — and no delivery rows, which are the read path's alone (D-10). Sets the pending flag of every binding whose cursor admits the mail, and reports subscriptions and bound as separate counts (G6).","c":[]},{"t":"member","a":{"kind":"method","sig":"List(ctx context.Context, in ListInput) ([]Delivery, error)"},"x":"Materialises delivery rows lazily from each subscription's cursor (D-10), stamps first read, and returns unacked mail. Never retires anything (G3).","c":[]},{"t":"member","a":{"kind":"method","sig":"Ack(ctx context.Context, in AckInput) (AckResult, error)"},"x":"Compare-and-set on acked_at inside the append-and-project transaction; reports whether this call won the transition (G13).","c":[]},{"t":"member","a":{"kind":"method","sig":"Reset(ctx context.Context) (ResetResult, error)"},"x":"Removes the store and the flag directory. A supported operation, because alpha (G10).","c":[]},{"t":"member","a":{"kind":"method","sig":"Close() error"},"x":"Releases the store handle.","c":[]}]},{"t":"api","a":{"kind":"module","name":"package mail — free functions and types","lang":"go","path":"auto-mail/mail/pending.go","caption":"Deliberately not methods: the nudge must not require a client, because constructing one would open the store."},"c":[{"t":"member","a":{"kind":"function","sig":"NewDirect(home string) (Client, error)"},"x":"The direct-store implementation D-11 binds the MVP CLI to. Opens the store with WAL + busy_timeout, migrates, and owns the single write connection for this process.","c":[]},{"t":"member","a":{"kind":"function","sig":"HasPending(home string, b Binding) bool"},"x":"Stats exactly one flag path and returns. No store open, no error surface a caller could mishandle in a hook — an unreadable flag directory reads as \"no mail\" (G8).","c":[]},{"t":"member","a":{"kind":"function","sig":"NudgeText() string"},"x":"The fixed instruction emitted to a working agent. A constant: never interpolated from an envelope, a body or a sender (G14's content rule, adopted for the in-band channel too).","c":[]},{"t":"member","a":{"kind":"function","sig":"BindingFor(cwd string) Binding"},"x":"Derives the opaque (manager, target) pair from hooks.CaptureContext on the documented ladder: tmux pane id → ntm pane → worktree/cwd path (D-062-2).","c":[]},{"t":"member","a":{"kind":"function","sig":"ValidateAddress(s string) error"},"x":"Permissive by design (D-9): rejects only empty, whitespace-padded, control-character and over-length values. The `/` separator is explicitly allowed and never normalised away, so prefix filtering stays buildable.","c":[]},{"t":"member","a":{"kind":"type","sig":"type Binding struct { Manager, Target, Session string }"},"x":"The opaque physical pair G12 mandates. Never appears in an address or a stored envelope's to/from (G5).","c":[]}]}]},{"t":"section","a":{"id":"end-state-cli","title":"The command surface at the end of this task"},"c":[{"t":"cli","a":{"title":"zsh — the full auto mail surface after T1","caption":"C1 plus the baseline commands T1 owns. quickstart and doctor are T4's (D-062-4)."},"c":[{"t":"cmd","a":{"note":"creates ~/.auto/mail/ and the alpha store","status":"done"},"x":"auto mail init"},{"t":"out","a":{},"x":"{ \"store\": \"/home/u/.auto/mail/alpha-store.db\", \"created\": true, \"alpha\": true }"},{"t":"cmd","a":{"note":"the full command reference, including the alpha contract","status":"done"},"x":"auto mail docs"},{"t":"cmd","a":{"note":"opt to start from now instead of the backlog (D-10)","status":"done"},"x":"auto mail subscribe auto-web/bugs --from-now"},{"t":"out","a":{},"x":"{ \"address\": \"auto-web/bugs\", \"subscription\": \"sub_01K9X2M4\", \"backfilled\": 0 }"},{"t":"cmd","a":{"note":"nobody has subscribed — still exits 0, still persists (G6)","status":"done"},"x":"auto mail send --to auto-web/typo --message \"hello?\""},{"t":"out","a":{},"x":"{ \"id\": \"01K9X2R0000000000\", \"to\": \"auto-web/typo\", \"subscriptions\": 0, \"bound\": 0 }\n# stderr: no subscription exists for \"auto-web/typo\" — mail is persisted and a later\n# subscriber will receive it, but check the address for a typo."},{"t":"cmd","a":{"note":"scope to one subscription; no filters returns everything bound to you","status":"done"},"x":"auto mail list --address auto-web/bugs"},{"t":"cmd","a":{"note":"a second acker is told it lost, and still exits 0 (D-062-7)","status":"done"},"x":"auto mail ack 01K9X2QF7M3B0V8N"},{"t":"out","a":{},"x":"{ \"id\": \"01K9X2QF7M3B0V8N\", \"acked\": true, \"wonTransition\": false }\n# stderr: already acked at 2026-08-25T10:15:40Z by sub_01K9X2M4"},{"t":"cmd","a":{"note":"alpha means reset is supported, not a workaround (G10)","status":"done"},"x":"auto mail reset --yes"},{"t":"out","a":{},"x":"{ \"removed\": [\"/home/u/.auto/mail/alpha-store.db\", \"/home/u/.auto/mail/alpha-flags\"] }"}]}]},{"t":"section","a":{"id":"file-changes","title":"File Changes"},"c":[{"t":"files","a":{},"c":[{"t":"file","a":{"path":"docs/concepts/UBIQUITOUS_LANGUAGE.md","change":"edit"},"x":"G16, first: add Mail, Address, Subscription, Delivery, Binding with _Avoid_ and _Has_ lines; refresh the generated ER block; update the frontmatter summary.","c":[]},{"t":"file","a":{"path":"auto-mail/go.mod","change":"add"},"x":"module github.com/mistakenot/auto-mail; replace auto-shared =&gt; ../auto-shared; modernc.org/sqlite + cobra.","c":[]},{"t":"file","a":{"path":"auto-mail/go.sum","change":"add"},"x":"Checksums for the dependency set (all already present elsewhere in the workspace).","c":[]},{"t":"file","a":{"path":"auto-mail/CLAUDE.md","change":"add"},"x":"Tool description, build/test instructions, and the alpha contract stated in as many words (at-least-once, unordered, idempotent consumers, store may be wiped).","c":[]},{"t":"file","a":{"path":"auto-mail/cmd/automail/main.go","change":"add"},"x":"Minimal entry point delegating to cli.Execute.","c":[]},{"t":"file","a":{"path":"auto-mail/rootcmd/rootcmd.go","change":"add"},"x":"New(stdout, stderr) façade so auto-cli can mount `auto mail`.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/app/app.go","change":"add"},"x":"App context (stdout, stderr, cwd), per the blueprint.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/root.go","change":"add"},"x":"Root cobra command, ExitError, Execute; wires the subcommands.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/init.go","change":"add"},"x":"`auto mail init [--project]`: EnsureHost, create ~/.auto/mail/, open+migrate the store.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/docs.go","change":"add"},"x":"`auto mail docs`: embedded full command reference incl. the delivery contract and the alpha disclaimer.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/subscribe.go","change":"add"},"x":"`auto mail subscribe &lt;address&gt; [--from-now] [--name]`; records the caller's binding.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/send.go","change":"add"},"x":"`auto mail send --to --message [--body] [--from]`; resolves the sender's absolute from-address.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/list.go","change":"add"},"x":"`auto mail list [--address] [--subscription]`; all bound subscriptions when unfiltered; clears a stale flag.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/ack.go","change":"add"},"x":"`auto mail ack &lt;mail-id&gt;`; prints wonTransition, exit 0 on a lost race (D-062-7).","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/reset.go","change":"add"},"x":"`auto mail reset [--yes]`; removes the store and flag directory, reports what it removed.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/cli/cli_test.go","change":"add"},"x":"Command-level tests against a temp HOME asserting the exact C1 payload shapes and the error paths.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/config/settings.go","change":"add"},"x":"Store and flag paths under ~/.auto/mail/, settings load/validate via auto-shared/config.","c":[]},{"t":"file","a":{"path":"auto-mail/mail/client.go","change":"add"},"x":"The public seam: Client interface, inputs/results, domain types, sentinel errors. The only exported package.","c":[]},{"t":"file","a":{"path":"auto-mail/mail/direct.go","change":"add"},"x":"NewDirect: the direct-store implementation D-11 binds the MVP CLI to.","c":[]},{"t":"file","a":{"path":"auto-mail/mail/address.go","change":"add"},"x":"ValidateAddress — permissive, separator explicitly allowed and never normalised (D-9).","c":[]},{"t":"file","a":{"path":"auto-mail/mail/binding.go","change":"add"},"x":"BindingFor: the (manager, target) ladder over hooks.CaptureContext (D-062-2).","c":[]},{"t":"file","a":{"path":"auto-mail/mail/pending.go","change":"add"},"x":"The pending-flag file: Set/Clear/HasPending (stat only) and NudgeText (a fixed constant).","c":[]},{"t":"file","a":{"path":"auto-mail/mail/mail_test.go","change":"add"},"x":"Address validation, binding ladder, flag lifecycle, and the zero-store-opens assertion via an injected counting opener.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/store/store.go","change":"add"},"x":"Open (MkdirAll, sql.Open, WAL + busy_timeout + foreign_keys), Close, single write connection, transaction helper.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/store/schema.go","change":"add"},"x":"DDL: events (+ append-only triggers), mail (+ immutability trigger), subscriptions, deliveries, bindings, indexes, schema_migrations.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/store/events.go","change":"add"},"x":"The alpha.mail.* event types, the versioned envelope, and the append path (the only writer of `events`).","c":[]},{"t":"file","a":{"path":"auto-mail/internal/store/project.go","change":"add"},"x":"Same-transaction projection: mail insert, lazy delivery materialisation from the cursor, read stamp, ack compare-and-set, binding upsert.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/store/store_test.go","change":"add"},"x":"Immutability (triggers abort UPDATE/DELETE), cursor backfill, broadcast fan-out, and the concurrent-writer test run under -race.","c":[]},{"t":"file","a":{"path":"auto-mail/internal/ulid/ulid.go","change":"add"},"x":"Sender-generated ids, monotonic and sortable within one process — the cross-host merge property the backlog names. Not the store's ordering: cursors use the log's `seq`.","c":[]},{"t":"file","a":{"path":"auto-mail/conformance/conformance.go","change":"add"},"x":"The Client contract suite, written against the interface: explicit ack, wonTransition, backfill-on-subscribe, subscriptions-vs-bound, idempotent re-ack.","c":[]},{"t":"file","a":{"path":"auto-mail/conformance/conformance_test.go","change":"add"},"x":"Runs the suite against the direct-store implementation; T3 adds the RPC one as a second target.","c":[]},{"t":"file","a":{"path":"auto-mail/conformance/seam_test.go","change":"add"},"x":"AC-12 guard: walks the repo (located via go.work) asserting the store filename and sqlite imports appear only under auto-mail/internal/store.","c":[]},{"t":"file","a":{"path":"auto-cli/cmd/auto/main.go","change":"edit"},"x":"Import mailcmd and add mailcmd.New(stdout, stderr) to root.AddCommand.","c":[]},{"t":"file","a":{"path":"auto-cli/cmd/auto/hints.go","change":"edit"},"x":"Split emission from matching: matchHint returns the rendered fragment; emitAdditionalContext writes exactly one hookSpecificOutput object for all fragments.","c":[]},{"t":"file","a":{"path":"auto-cli/cmd/auto/hookscmd.go","change":"edit"},"x":"After the existing sinks, stat the pending flag for the firing agent's binding and prepend the fixed mail fragment to the single emission.","c":[]},{"t":"file","a":{"path":"auto-cli/cmd/auto/hints_test.go","change":"edit"},"x":"Update for the matchHint/emitAdditionalContext split; existing behaviour assertions unchanged.","c":[]},{"t":"file","a":{"path":"auto-cli/cmd/auto/hooksmail_test.go","change":"add"},"x":"Hook-side tests: nudge emitted only with a flag and only on PostToolUse, one emission when a hint also matches, exit 0 with an absent/unreadable store, and no store file created.","c":[]},{"t":"file","a":{"path":"auto-cli/go.mod","change":"edit"},"x":"Require github.com/mistakenot/auto-mail with a local replace directive.","c":[]},{"t":"file","a":{"path":"auto-cli/go.sum","change":"edit"},"x":"Checksums for the new module edge.","c":[]},{"t":"file","a":{"path":"go.work","change":"edit"},"x":"Add ./auto-mail to the use block.","c":[]},{"t":"file","a":{"path":"Makefile","change":"edit"},"x":"Add auto-mail to PROJECTS and to RACE_PROJECTS (the ack race and concurrent writers must run under -race).","c":[]},{"t":"file","a":{"path":"CLAUDE.md","change":"edit"},"x":"Add the auto-mail row to the Sub-Projects table.","c":[]},{"t":"file","a":{"path":"harness/scenarios/mail-flow/Dockerfile","change":"add"},"x":"Builds the real auto binary from monorepo source (context ../../..) into a single host image.","c":[]},{"t":"file","a":{"path":"harness/scenarios/mail-flow/docker-compose.yaml","change":"add"},"x":"One `host` service, init: true, healthcheck gating on the mail-ready file.","c":[]},{"t":"file","a":{"path":"harness/scenarios/mail-flow/scripts/host-entrypoint.sh","change":"add"},"x":"Seeds one host id, git-inits and registers /workspace/project-a and project-b, runs auto mail init, writes the ready file.","c":[]},{"t":"file","a":{"path":"harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json","change":"add"},"x":"A minimal PostToolUse payload, patched per-fire with cwd (mirrors event-flow's fixture pattern).","c":[]},{"t":"file","a":{"path":"harness/src/harness/scenarios/mail_flow.py","change":"add"},"x":"MailFlowScenario: check_ready gates plus the DSL (subscribe/send/list/ack/fire_hook/assert_nudge) with bounded retry.","c":[]},{"t":"file","a":{"path":"harness/src/harness/cli.py","change":"edit"},"x":"One line registering mail-flow in SCENARIOS.","c":[]},{"t":"file","a":{"path":"harness/tests/mail_flow/__init__.py","change":"add"},"x":"Package marker, mirroring tests/event_flow.","c":[]},{"t":"file","a":{"path":"harness/tests/mail_flow/conftest.py","change":"add"},"x":"Session-scoped fixture: up(build=True) then down() at teardown.","c":[]},{"t":"file","a":{"path":"harness/tests/mail_flow/test_mail_loop.py","change":"add"},"x":"AC-13: the C1 loop, the in-band nudge, send-before-subscribe, and the no-store-created assertion.","c":[]},{"t":"file","a":{"path":"harness/CLAUDE.md","change":"edit"},"x":"Document the mail-flow scenario alongside skill-remote and event-flow.","c":[]}]}]},{"t":"section","a":{"id":"rejected-alternatives","title":"Rejected Alternatives"},"c":[{"t":"md","x":"- **Put everything under `internal/` per the package blueprint.** Rejected: the\n  blueprint's \"no public API exports\" rule assumes a self-contained tool, and\n  mail is explicitly a *seam* other tools consume (seam 1). Exporting exactly one\n  narrow package — and keeping the store internal — turns G11 from a convention\n  into a compile-time guarantee, which is a better outcome than either extreme.\n\n- **Open the store read-only in the hook and count unacked mail.** Rejected under\n  G8: a SQLite open on every tool call of every agent on the host is not stat\n  cost, and it puts a lock-contending reader in the agent's hot path. The flag\n  costs one `stat` and its drift is bounded and self-healing (D-062-3).\n\n- **Interpolate the sender or the subject into the nudge text.** Rejected: G14\n  fixes the injected-keystroke sequence as a constant so a sender cannot type\n  into a stranger's pane. The in-band channel is less dangerous but not\n  categorically different — sender-controlled text would be landing in another\n  agent's context window — so the same rule applies, and `NudgeText()` is a\n  constant.\n\n- **Two containers sharing a `~/.auto` volume for \"two agents on one host\".**\n  Rejected in D-062-1: the harness gives each container a distinct `HOST_ID`,\n  which is precisely what makes `event-flow` a multi-host scenario; a shared\n  `HOME` also collides on ready files and host identity. One container with two\n  workspaces is what \"one host\" actually means here.\n\n- **Key the binding on `session_id`.** Rejected: `auto mail subscribe` runs as a\n  tool call and never sees the hook payload, so it cannot know the session id.\n  Bridging that gap is exactly the self-identification problem D-13 scopes to T2;\n  pulling it into T1 would drag `#parent` in with it.\n\n- **Emit a `you have mail` bus event from `send`.** Rejected in D-062-6: it buys\n  nothing for the in-band path (the receiver's own hook already reads the flag),\n  and it adds a live dependency on a daemon that D-11 says must never be\n  required. The bus event type is reserved and T3 publishes it.\n\n- **Route send/list/ack over RPC to the daemon.** Rejected by D-11 upstream of\n  this task, for two reasons worth repeating: autowatch crash-loops are a\n  documented failure mode on this host, and a *failing* agent must be able to\n  post mail with nothing else alive — which is the case this epic exists for.\n\n- **A maildir-style file-per-message store.** Genuinely better for lock-free\n  concurrent append, and recorded as such in the backlog (§8.6) — but once\n  subscriptions, read state, bindings and dedup exist it is a relational problem\n  wanting transactions, and D-1's same-transaction projection is the whole\n  design. Superseded by SQLite.\n\n- **Skip `read_at` in T1.** Rejected: it is one conditional `UPDATE` and one\n  event now, versus T3 shipping an escalation policy whose predicate (\"unread\n  past an age threshold\") has no column to read.\n\n- **Ship stub `quickstart` and `doctor` to satisfy the CLI convention.**\n  Rejected in D-062-4: the epic makes adoption a task with an argument behind it,\n  and a quickstart that teaches a half-built workflow is worse than none."}]},{"t":"decisions","a":{},"c":[]}]},{"t":"tab","a":{"name":"Plan"},"c":[{"t":"section","a":{"id":"summary","title":"Summary"},"c":[{"t":"md","x":"Five phases in the order the epic's T1 dictates: the ontology lands, then the\nscenario comes up with two agents on one host, then one message travels between\nthem and is acked, then the nudge reaches a working agent, then the remaining\nguard rails are made executable. Phase 1 is a walking skeleton in the strict\nsense — glossary, module, CLI, store and container all wired, with a green\ncontainer test — so every later phase thickens a system that already runs end to\nend inside the oracle."}]},{"t":"section","a":{"id":"execution-sequence","title":"Execution Sequence"},"c":[{"t":"mermaid","a":{"caption":"Phase dependency DAG — a chain, because each phase is verified inside the oracle the previous one stood up"},"x":"flowchart LR\n  P1[\"P1 · Ontology + module + scenario up<br/>glossary · auto mail init/docs/list · mail-flow green\"]\n  P2[\"P2 · One message travels<br/>subscribe/send/list/ack · log + projection · C1 in the harness\"]\n  P3[\"P3 · The in-band nudge<br/>pending flag · hooks fire emits additionalContext\"]\n  P4[\"P4 · Delivery semantics<br/>cursor backfill · broadcast · counts · conformance suite\"]\n  P5[\"P5 · Rails made executable<br/>immutability · ack race · reset · seam guard · docs\"]\n  P1 --> P2 --> P3 --> P4 --> P5"},{"t":"md","x":"The chain is deliberate rather than a failure to parallelise. Each phase's\nverification runs **inside the harness scenario the previous phase stood up**\n(G15), and every phase after the first edits files the previous one created, so\na parallel dispatch would collide on `mail_flow.py`, `test_mail_loop.py`,\n`direct.go` and the store package. The compensating property is that every phase\nboundary is a shippable state: the branch is green and `make check` passes at\neach commit."}]},{"t":"stepper","a":{},"c":[{"t":"phase","a":{"n":"1","title":"Ontology, module skeleton, and the scenario comes up","files":"docs/concepts/UBIQUITOUS_LANGUAGE.md,auto-mail/go.mod,auto-mail/go.sum,auto-mail/CLAUDE.md,auto-mail/cmd/automail/main.go,auto-mail/rootcmd/rootcmd.go,auto-mail/internal/app/app.go,auto-mail/internal/cli/root.go,auto-mail/internal/cli/init.go,auto-mail/internal/cli/docs.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/config/settings.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/mail_test.go,auto-mail/internal/store/store.go,auto-mail/internal/store/schema.go,auto-cli/cmd/auto/main.go,auto-cli/go.mod,auto-cli/go.sum,go.work,Makefile,CLAUDE.md,harness/scenarios/mail-flow/Dockerfile,harness/scenarios/mail-flow/docker-compose.yaml,harness/scenarios/mail-flow/scripts/host-entrypoint.sh,harness/src/harness/scenarios/mail_flow.py,harness/src/harness/cli.py,harness/tests/mail_flow/__init__.py,harness/tests/mail_flow/conftest.py,harness/tests/mail_flow/test_mail_loop.py","status":"done"},"c":[{"t":"md","x":"**The ontology goes first, before any Go file (G16).** Then the thinnest module\nthat can open a store, and then the container that will judge everything after\nit.\n\n1. **Glossary.** Add a `## Mail` section to `docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   with five entries in the house format (bold term, definition, `_Avoid_:`,\n   optional `_Has_:`):\n   - **Mail** — the stored unit of an addressed, durable message between agents.\n     `_Avoid_`: message, email, letter, note. `_Has_`: many Deliveries.\n   - **Address** — a virtual, free-form name a Mail is sent to, carrying no\n     physical identity. `_Avoid_`: mailbox, queue, topic, channel, inbox.\n     `_Has_`: many Subscriptions.\n   - **Subscription** — a durable reader of an Address, holding its own cursor\n     and ack state. `_Avoid_`: subscriber, consumer, listener, reader.\n     `_Has_`: many Deliveries, one Binding.\n   - **Delivery** — the per-Subscription copy of one Mail and its read/ack\n     state. `_Avoid_`: receipt, copy, inbox item.\n   - **Binding** — the current physical target and liveness of a Subscription,\n     recorded as an opaque `(manager, target)` pair. `_Avoid_`: pane, session\n     link, attachment, route.\n   Then update the frontmatter `summary` to name the five new terms.\n   **Verify:** `python3 .claude/skills/domain-modelling/scripts/glossary.py check docs/concepts/UBIQUITOUS_LANGUAGE.md`\n   exits 0; `python3 .claude/skills/domain-modelling/scripts/glossary.py diagram docs/concepts/UBIQUITOUS_LANGUAGE.md --write`\n   refreshes the ER block; `auto doc fixed docs/concepts/UBIQUITOUS_LANGUAGE.md`.\n   **Do not hand-edit the generated ER block.**\n\n2. **Module scaffold.** Create `auto-mail/` per `docs/auto-package-patterns.md`,\n   copying `auto-artifact/`'s shape: `go.mod`\n   (`module github.com/mistakenot/auto-mail`, `go 1.26.1`,\n   `replace github.com/mistakenot/auto-shared => ../auto-shared`, cobra +\n   `modernc.org/sqlite v1.53.0`), `cmd/automail/main.go`, `rootcmd/rootcmd.go`,\n   `internal/app/app.go`, `internal/cli/root.go` (with `ExitError` + `Execute`),\n   `internal/config/settings.go` (store path `~/.auto/mail/alpha-store.db`, flag\n   dir `~/.auto/mail/alpha-flags/`, via `config.AutoDir()`).\n   `auto-mail/CLAUDE.md` states what the tool is and how to build/test it.\n   **Verify:** `cd auto-mail && go build ./...` after each file, per the project's\n   Go build discipline.\n\n3. **The store, minimal.** `internal/store/store.go`: `Open(path)` with\n   `os.MkdirAll`, `sql.Open(\"sqlite\", …)` and the exact pragma set\n   `auto-watch/internal/store/store.go:75-78` uses (`journal_mode = WAL`,\n   `busy_timeout = 5000`, `foreign_keys = ON`), `Close`, and a\n   `WithTx(ctx, fn)` helper that opens `BEGIN IMMEDIATE`. `internal/store/schema.go`:\n   `schema_migrations` plus empty-but-final DDL for `events`, `mail`,\n   `subscriptions`, `deliveries`, `bindings` (phase 2 fills the write paths;\n   creating the full shape now avoids a migration inside the task).\n   **Verify:** a store test that opens, migrates twice (idempotent) and closes.\n\n4. **The seam, minimal.** `auto-mail/mail/client.go`: the `Client` interface with\n   all six methods, the input/result types matching the C1 payloads, and sentinel\n   errors. `auto-mail/mail/direct.go`: `NewDirect(home)` returning an\n   implementation where `List` works (returning an empty slice against a fresh\n   store) and the other four return a `not implemented in this phase` error.\n   Everything else stays under `internal/`, so no other module can reach the\n   store (D-062-8).\n\n5. **CLI, minimal.** `internal/cli/init.go` (`auto mail init [--project]`:\n   `EnsureHost`, create `~/.auto/mail/`, open + migrate, print\n   `{\"store\":…,\"created\":…,\"alpha\":true}`), `internal/cli/docs.go` (embedded\n   reference; the alpha contract text lands in phase 5), `internal/cli/list.go`\n   (JSON array on stdout, `[]` when empty).\n   `internal/cli/cli_test.go`: `init` then `list` against a temp `HOME` returns\n   `[]` and writes nothing to stdout but JSON.\n   `auto-mail/mail/mail_test.go`: the greppable half of G16 — assert no exported\n   identifier, table name or event type in the module names the stored unit\n   `message` (the `--message` body flag is explicitly allowed).\n\n6. **Mount it.** `go.work` gains `./auto-mail`; `auto-cli/go.mod` gains the\n   require + local replace; `auto-cli/cmd/auto/main.go` imports\n   `mailcmd \"github.com/mistakenot/auto-mail/rootcmd\"` and adds\n   `mailcmd.New(stdout, stderr)` to `root.AddCommand`; `Makefile` PROJECTS gains\n   `auto-mail`; root `CLAUDE.md` gains the auto-mail row in the Sub-Projects\n   table (Early / \"Agent-to-agent mailbox — durable addressed messages with ack\").\n   **Verify:** from the repo root `make build && ./bin/auto mail init && ./bin/auto mail list`.\n\n7. **The scenario comes up (the epic's second of three things).**\n   `harness/scenarios/mail-flow/Dockerfile` — build the real `auto` from\n   monorepo source with context `../../..`, mirroring\n   `harness/scenarios/event-flow/Dockerfile`.\n   `docker-compose.yaml` — **one** `host` service (D-062-1), `init: true`,\n   healthcheck gating on `/tmp/mail-ready.json`.\n   `scripts/host-entrypoint.sh` — seed one `~/.auto/host.json`; `git init` +\n   empty commit + `auto init --project` in **both** `/workspace/project-a` and\n   `/workspace/project-b`; `auto mail init`; write the ready file; `sleep infinity`.\n   `harness/src/harness/scenarios/mail_flow.py` — `MailFlowScenario(Scenario)`\n   with `name = \"mail-flow\"`, `services = [\"host\"]`, a `check_ready()` that\n   fail-fasts with a diagnostic if the ready file is missing, either workspace is\n   unregistered in `~/.auto/projects.json`, or `auto mail list` is not `[]`, plus\n   a `mail(workspace, args)` helper that runs `auto mail …` with `cwd` set to a\n   workspace (base64-piped, per the event-flow convention).\n   Register `\"mail-flow\": MailFlowScenario` in `harness/src/harness/cli.py`.\n   `harness/tests/mail_flow/{__init__.py,conftest.py,test_mail_loop.py}` —\n   session-scoped fixture plus one test asserting the stack is up, both\n   workspaces are registered, and `auto mail list` returns `[]` from each.\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   from the repo root `make check` and `make test`; from `harness/`\n   `uv run harness mail-flow up` then `uv run pytest tests/mail_flow -v` then\n   `uv run harness mail-flow down`; `uv run pytest -v` to prove the two existing\n   scenarios are untouched.\n   **Commit** `feat(062): auto-mail ontology, module skeleton and mail-flow scenario`."}]},{"t":"phase","a":{"n":"2","title":"One message travels between two agents and is acked","files":"auto-mail/internal/store/schema.go,auto-mail/internal/store/events.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/internal/ulid/ulid.go,auto-mail/mail/client.go,auto-mail/mail/direct.go,auto-mail/mail/address.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","status":"done","depends-on":"1"},"c":[{"t":"md","x":"The epic's third thing: one message through the client seam, the event log and\nthe projection, acked. C1 runs verbatim by the end of this phase.\n\n1. **Ids.** `internal/ulid/ulid.go`: sender-generated ULIDs, monotonic and\n   lexicographically sortable **within one process** (the cross-host merge\n   property `docs/auto-mail-beyond-mvp.md` §3 depends on). Subscription ids are\n   `sub_` + the ULID's leading 8 chars.\n   **Verify:** a test asserting monotonicity across 10k ids in one process and\n   sort order matching generation order — and scoped to say so, because that\n   ordering does not survive a process boundary and nothing in the store may\n   rest on it. Ordering the store depends on comes from the log's own `seq`\n   (see the cursor, below).\n\n2. **Events.** `internal/store/events.go`: the four `alpha.*` types —\n   `alpha.mail.subscribed`, `alpha.mail.sent`, `alpha.mail.read`,\n   `alpha.mail.acked` — a versioned envelope (`version` integer, default 1), and\n   `Append(tx, ev)` as the **only** writer of the `events` table. Add the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers on `events` and on `mail` to\n   `schema.go`, each `RAISE(ABORT, …)` with a message naming the rail.\n\n3. **Projection.** `internal/store/project.go`, all inside one\n   `BEGIN IMMEDIATE` transaction per operation:\n   - `subscribe` → append `alpha.mail.subscribed`; upsert the subscription\n     (address + `from_cursor`) and its binding row.\n   - `send` → append `alpha.mail.sent`; insert the immutable `mail` row,\n     carrying the `seq` of that event as the store's own ordering of mail. It\n     writes **no** `deliveries` rows: materialisation is the read path's, and\n     only the read path's (D-10). Send additionally *reads* the two counts it\n     reports and the bindings whose pending flag the mail should raise.\n   - `list` → materialise any missing `deliveries` rows from each subscription's\n     `from_cursor` (D-10, lazily on read); stamp `read_at` and append\n     `alpha.mail.read` **only** `WHERE read_at IS NULL`, so repeated lists append\n     nothing; return unacked rows.\n   - `ack` → `UPDATE deliveries SET acked_at=?, acked_by=? WHERE subscription_id=?\n     AND mail_id=? AND acked_at IS NULL`; the affected-row count **is** the\n     `wonTransition` answer; append `alpha.mail.acked` only on a win (G13/D-7).\n\n4. **Addresses and bindings.** `mail/address.go`: `ValidateAddress` — permissive,\n   `/` explicitly allowed and never normalised (D-9); rejects empty,\n   whitespace-padded, control characters and over-length, each with a remediation\n   message. `mail/binding.go`: `BindingFor(cwd)` walking the ladder\n   `tmux` → `ntm` → `cwd` over `hooks.CaptureContext()` (D-062-2), returning the\n   opaque pair. **Neither ever writes physical identity into an address or an\n   envelope** (G5).\n\n5. **The direct client.** Implement the remaining five `Client` methods in\n   `mail/direct.go` over the projection, returning exactly the C1 payload shapes.\n   The sender's `from` follows the three-rung ladder: `--from` → the address of a\n   subscription bound to the caller's `(manager, target)` (lowest subscription id\n   when several) → the literal `<projectId>/agent` from the registry, or\n   `unregistered/agent` outside a registered project. Always a resolved absolute\n   address, never a relative handle.\n\n6. **The CLI verbs.** `subscribe.go` (positional address, `--from-now`,\n   `--name`), `send.go` (`--to`, `--message`, `--body`, `--from`), `list.go`\n   (`--address`, `--subscription`; unfiltered returns every unacked delivery for\n   every subscription bound to the caller), `ack.go` (positional mail id;\n   `wonTransition` in the payload, exit 0 on a lost race per D-062-7, non-zero\n   with a remediation hint for an unknown id).\n   `cli_test.go`: the C1 loop end to end against a temp `HOME`, asserting the\n   exact payloads and that stdout is pure JSON.\n\n7. **The harness proves it (G15).** Extend `mail_flow.py` with\n   `subscribe/send/list/ack` DSL helpers returning parsed JSON, and\n   `test_mail_loop.py` with the C1 loop across the two workspaces:\n   **project-a subscribes to its own reply address first** (so `from` resolves by\n   rung 2, as C1 shows), project-b subscribes to the target address, project-a\n   sends, project-b lists and acks, the second list is empty. Use bounded retry on the observable outcome; assert on\n   presence of the mail id, never on counts (G4 permits duplicates).\n\n8. **Verify (phase gate):** `cd auto-mail && go build ./... && go test ./...`;\n   repo-root `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): mail event log, projection and the C1 subscribe/send/list/ack loop`."}]},{"t":"phase","a":{"n":"3","title":"The in-band nudge reaches a working agent","files":"auto-mail/mail/pending.go,auto-mail/mail/binding.go,auto-mail/mail/mail_test.go,auto-mail/internal/config/settings.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-cli/cmd/auto/hints.go,auto-cli/cmd/auto/hookscmd.go,auto-cli/cmd/auto/hints_test.go,auto-cli/cmd/auto/hooksmail_test.go,harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","status":"done","depends-on":"2"},"c":[{"t":"md","x":"The riskiest integration, and the reason it is inside the walking skeleton\nrather than deferred: hook → notification, in-band, at stat cost, without\nbreaking the agent's turn.\n\n1. **The pending flag.** `mail/pending.go`:\n   `flagPath(home, b Binding)` = `~/.auto/mail/alpha-flags/` + the first 8 hex\n   bytes of `sha256(manager + \"\\x00\" + target)`; `Set`, `Clear`, and\n   `HasPending(home, b) bool` which does **exactly one `os.Stat`** and treats\n   every error — missing dir, permission denied — as \"no mail\". Add\n   `NudgeText() string`, a **constant**: an instruction to run `auto mail list`\n   and `auto mail ack` when acted on, with **no** interpolation of sender,\n   address, subject or body (G14's content rule, adopted for the in-band channel).\n   Wire `Set` into `send` and `Clear` into `ack` and `list` when the binding's\n   subscriptions have nothing unacked left — the self-healing loop that bounds\n   flag drift (D-062-3).\n   **Verify:** `mail_test.go` — a counting store-opener injected over the package\n   var proves `HasPending` performs **zero** opens on both paths; flag lifecycle\n   across send → list → ack; a false-positive flag causes one `list` and then\n   clears itself.\n\n2. **Split matching from emission (D-062-9).** In `auto-cli/cmd/auto/hints.go`,\n   change `matchAndEmitHint` into `matchHint(...) string` (returns the rendered\n   fragment or `\"\"`, same PostToolUse scoping and same first-match-wins rule) and\n   add `emitAdditionalContext(out io.Writer, event string, fragments ...string)`\n   which writes **exactly one** `hookResponse` object, or nothing when every\n   fragment is empty. Update `hints_test.go` for the split — the behavioural\n   assertions carry over unchanged.\n\n3. **Wire the nudge.** In `auto-cli/cmd/auto/hookscmd.go`, at the existing\n   `matchAndEmitHint` call site: compute `mail.BindingFor(cwd)`, call\n   `mail.HasPending(home, b)`, and pass `mail.NudgeText()` as the **first**\n   fragment to `emitAdditionalContext` alongside `matchHint(...)`. Everything\n   stays inside the never-return-an-error region — any failure is swallowed and\n   the hook still exits 0.\n\n4. **Hook tests.** `auto-cli/cmd/auto/hooksmail_test.go`:\n   nudge emitted only when the flag exists; only on `PostToolUse`; **one**\n   `hookSpecificOutput` object when a hint rule also matches, with mail first;\n   exit 0 and no stdout when `~/.auto/mail` is absent, unreadable or a corrupt\n   file; and — the observable form of G8 — firing hooks on a `HOME` where\n   `auto mail init` never ran leaves `alpha-store.db` **non-existent**.\n\n5. **The harness proves it.** Add\n   `harness/scenarios/mail-flow/fixtures/hooks/post-tool-use.json` (a minimal\n   PostToolUse payload, `cwd` patched per fire, mirroring\n   `event-flow/fixtures/hooks/doc-edit.json`), a `fire_hook(workspace)` helper on\n   `mail_flow.py` that base64-pipes it into `auto hooks fire --agent claude` and\n   returns stdout, and an `assert_nudge(workspace)` with bounded retry. Extend\n   `test_mail_loop.py`: after project-a sends, project-b's hook fire emits\n   `hookSpecificOutput.additionalContext` naming `auto mail list`; after the ack,\n   the next fire emits nothing.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`;\n   `cd auto-cli && go test ./...`; repo-root `make check && make test`;\n   `uv run pytest tests/mail_flow -v` **and** `uv run pytest tests/event_flow -v`\n   (the hints change touches a path `event-flow` exercises — prove it is intact).\n   **Commit** `feat(062): in-band mail nudge on hook fire at stat cost`."}]},{"t":"phase","a":{"n":"4","title":"Delivery semantics and the Client conformance suite","files":"auto-mail/conformance/conformance.go,auto-mail/conformance/conformance_test.go,auto-mail/internal/store/project.go,auto-mail/internal/store/store_test.go,auto-mail/mail/direct.go,auto-mail/internal/cli/subscribe.go,auto-mail/internal/cli/send.go,auto-mail/internal/cli/list.go,auto-mail/internal/cli/ack.go,auto-mail/internal/cli/cli_test.go,harness/src/harness/scenarios/mail_flow.py,harness/tests/mail_flow/test_mail_loop.py","status":"done","depends-on":"3"},"c":[{"t":"md","x":"The call-site-visible contracts, written once against the interface so T3's RPC\nimplementation becomes a second `go test` target rather than a redesign\n(D-062-5).\n\n1. **Cursor backfill (D-10).** Make `subscribe` honour `--from-now` (cursor =\n   the store's own high-water mark, `MAX(mail.seq)` read inside the same\n   `BEGIN IMMEDIATE` transaction that stores it) versus the default (cursor = 0,\n   the beginning of the log), and report `backfilled` as the count of unacked\n   mail the new cursor admits.\n\n   The cursor is a log position, **never a minted id**. A `--from-now` cursor of\n   `ulid.NewAt(now)` compared with `mail.id > from_cursor` is a claim about ULID\n   ordering *between processes*, and D-11 makes every verb its own process: two\n   ids drawn in the same millisecond share a timestamp prefix and draw\n   independent tails, so a mail could sort below the cursor and be admitted by\n   nothing, ever. The write lock is what makes a high-water mark true instead.\n   **Verify:** send to an unsubscribed address, subscribe afterwards, `list`\n   returns it and `backfilled` is 1; with `--from-now`, `list` is `[]` and\n   `backfilled` is 0.\n\n2. **Broadcast (D-7).** Two subscriptions on one address each get their own\n   `deliveries` row and their own ack state; acking one leaves the other unacked.\n   **Verify:** `store_test.go` plus a conformance case.\n\n3. **Both counts (G6).** `send` reports `subscriptions` (durable readers) and\n   `bound` (rows with a live binding) as **distinct** numbers, exits 0 with\n   `0/0` for an unknown address, persists the mail, and writes the\n   likely-typo hint to **stderr** only.\n\n4. **The conformance suite.** `auto-mail/conformance/conformance.go` — a\n   `RunSuite(t *testing.T, newClient func(t *testing.T) mail.Client)` following\n   `auto-shared/rpc/conformance/`, covering: explicit ack (`list` twice returns\n   the same mail), `wonTransition` on first ack and on re-ack, idempotent re-ack\n   appending no second event, backfill-on-subscribe both ways,\n   subscriptions-vs-bound, send-to-nothing persisting, and free-form addresses\n   with a separator. `conformance_test.go` runs it against `NewDirect`.\n   **Deliberately absent: any assertion about ordering** (G4).\n\n5. **The harness proves the J2 half.** Extend `test_mail_loop.py` with\n   send-before-subscribe across the two workspaces: project-a sends to an address\n   nobody holds, project-b subscribes afterwards and receives it.\n\n6. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check && make test`; `uv run pytest tests/mail_flow -v`.\n   **Commit** `feat(062): cursor backfill, broadcast delivery and the mail.Client conformance suite`."}]},{"t":"phase","a":{"n":"5","title":"Rails made executable: immutability, the ack race, reset, the seam guard, docs","files":"auto-mail/internal/store/store_test.go,auto-mail/internal/cli/reset.go,auto-mail/internal/cli/cli_test.go,auto-mail/internal/cli/docs.go,auto-mail/conformance/seam_test.go,auto-mail/CLAUDE.md,Makefile,harness/CLAUDE.md","status":"done","depends-on":"4"},"c":[{"t":"md","x":"Everything the guard rails assert but nothing so far has been forced to prove.\n\n1. **Immutability (G1).** `store_test.go`: snapshot every `events` and `mail` row\n   before a `list` + `ack` cycle and assert byte-identical rows after; assert the\n   `BEFORE UPDATE` / `BEFORE DELETE` triggers abort with the expected message;\n   assert the ack appears as a **new** `alpha.mail.acked` row.\n\n2. **The ack race (G13).** A `-race` test: one delivery, 16 goroutines calling\n   `Ack`, exactly one `wonTransition: true`, exactly one `alpha.mail.acked`\n   event, and every caller seeing `acked: true`. Plus a concurrent-writer test:\n   N processes' worth of goroutines sending to one address lose no events and\n   leave a consistent projection. Add `auto-mail` to `RACE_PROJECTS` in the\n   `Makefile`.\n   **Verify:** `make test-race` green (needs `CGO_ENABLED=1` and a C compiler).\n\n3. **Reset (G10).** `internal/cli/reset.go`: `auto mail reset [--yes]` removes\n   `alpha-store.db` and `alpha-flags/`, reports what it removed, and refuses\n   without `--yes` on a non-empty store with a remediation hint.\n   **Verify:** `cli_test.go` — reset then the C1 loop again from empty.\n\n4. **The seam guard (G11).** `auto-mail/conformance/seam_test.go`: locate the\n   repo root by walking up for `go.work` (skip the test if absent, so a\n   standalone module checkout still passes), then walk every module's Go source,\n   `harness/` and `skills/`, asserting that the **mail store** is named nowhere\n   outside `auto-mail/internal/store` — the `alpha-store.db` filename, an\n   `~/.auto/mail` path opened as a database, or a `sqlite3` invocation against\n   either. **Do not ban `modernc.org/sqlite` repo-wide**: `auto-watch` and\n   `auto-search` import it for their own stores and would fail the guard on day\n   zero. Also assert no package outside `auto-mail` imports\n   `auto-mail/internal/...` (a regression guard over what the compiler already\n   enforces). Failure names the offending file and says \"go through\n   mail.Client\".\n\n5. **The alpha contract in writing (G10, G4).** `internal/cli/docs.go` and\n   `auto-mail/CLAUDE.md` both state, in as many words: **at-least-once,\n   unordered, consumers must be idempotent on mail id**; and **alpha — no\n   upcasters, no migrations, no compatibility guarantee, the store may be wiped\n   on upgrade, `reset` is supported**. `auto-mail/CLAUDE.md` also records the one\n   deliberate exception to `docs/auto-package-patterns.md` (D-062-8) so the next\n   package author does not read it as licence, and notes that `quickstart` and\n   `doctor` are epic task T4's.\n\n6. **Harness docs.** Add the `mail-flow` scenario to `harness/CLAUDE.md`'s\n   Scenarios section alongside `skill-remote` and `event-flow`, including why it\n   is one container (D-062-1).\n\n7. **Verify (phase gate):** `cd auto-mail && go test ./...`; repo-root\n   `make check`, `make test`, `make test-race`; from `harness/`\n   `uv run pytest -v` (all three scenarios). Run `auto doc fix` if any doc\n   frontmatter drifted. **Commit**\n   `feat(062): mail immutability, ack-race, reset, seam guard and the alpha contract`.\n   Open the PR."}]}]},{"t":"section","a":{"id":"success-criteria","title":"Success Criteria"},"c":[{"t":"md","x":"- **P1** → AC-1 (ontology, in full), AC-11 baseline (alpha filename), AC-13\n  baseline (the scenario comes up).\n- **P2** → AC-2 (C1 verbatim), AC-4 (deliveries join), AC-5 (explicit ack),\n  AC-6 (compare-and-set behaviour), AC-8 (virtual, free-form addresses).\n- **P3** → AC-10 (stat-cost nudge, one emission, never breaks the hook).\n- **P4** → AC-4 completed (cursor backfill, broadcast), AC-7 (documented\n  at-least-once, idempotent re-ack), AC-9 (both counts, send-to-nothing).\n- **P5** → AC-3 (immutability), AC-6 completed (the race), AC-11 completed\n  (reset + the written contract), AC-12 (seam guard), AC-13 completed.\n- All thirteen criteria pass. `make check`, `make test` and `make test-race` are\n  green from the repo root, and `uv run pytest -v` is green for all three harness\n  scenarios — the last being the verdict G15 defines."}]}]}],"meta":{"id":"062","name":"auto-mail-walking-skeleton","status":"pending","created":"2026-08-25","epic":"005"}},"052":{"t":"doc","a":{"title":"052: reflect-tool-hardening","status":"complete","pr":"https://github.com/mistakenot/auto-stack/pull/116","generated":"2026-06-28","next-prompt":"/execute-task 052"},"c":[{"t":"tab","a":{"name":"Requirements"},"c":[{"t":"section","a":{"id":"problem","title":"Problem"},"c":[{"t":"md","x":"The `/reflect-playbook` end-to-end spike on 2026-06-28\n(`.tmp/reflect-playbook-spike-findings.md`) found the `auto reflect` loop's\n**skeleton is solid** — deterministic, gated, append-only, with good error\nremediation — but its **read / output side is untrustworthy**: the loop\n*captures* signal well yet *surfaces* it poorly.\n\nThe headline: reported feedback **gaps** (the explicit bridge back to Stage-1\nobservation) are persisted to the event log but **cannot be read back through\nany command** — you must `grep` raw JSONL. So the advertised closed loop\n(\"gap → next observation\") is, in practice, open. Alongside it the spike found\ntwo disagreeing pending-counts, per-command JSON shapes that make id-threading\nerror-prone, non-deterministic ids, a self-contradictory git policy for\n`.auto/reflect/`, and a few smaller doc/projection gaps.\n\nThis task fixes the **high-priority** findings so the loop becomes\n\"trustworthy\" rather than \"works if you hold it right.\""}]},{"t":"section","a":{"id":"goals","title":"Goals"},"c":[{"t":"md","x":"Each goal maps to a finding code (`F#`) from the spike report.\n\n| # | Finding | Fix |\n|---|---------|-----|\n| **F4** (P1) | Feedback gaps are write-only | Add `auto reflect gap list` — surfaces each reported gap (report + moment + source feedback id / session / ts), so the gap → observation loop-back has tooling. |\n| **F2** (P1) | `miner status` `pending` (390) ≠ `stats` `pending_to_mine` (396) | Collapse both onto **one shared counting function** (single source of truth); document exactly which session universe it counts. |\n| **F5** (P2) | Each command nests its minted id differently; `rule promote` top-level `.id` is `null` | **Restructure to a uniform output envelope** with a predictable top-level `.id` / `.ids` (and `.[].id` for collection results). Breaking change to the CLI output contract. |\n| **F7** | Dry-run ids ≠ apply ids, so you can't pre-stage `promote` | Mint rule & observation ids as **deterministic content hashes** so `--dry-run` == apply. Existing id *formats* preserved. |\n| **F9** | `.auto/reflect/` git policy is self-contradictory (disposable `playbook.json` tracked; canonical `events/` untracked) | `auto reflect init` writes a `.auto/reflect/.gitignore` that ignores the disposable `playbook.json`; the canonical `events/` log stays **git-tracked**. |\n| **F1** | Stale/partial init state undetected (dir exists, no `events/`; legacy 0-byte `feedback.jsonl`) | Add init / `doctor` detection of stale or partial reflect state with a concrete remediation hint. |\n| **F6** | Rule `created_at` / `updated_at` come back `\"\"` / `null` | Populate them in the rules projection from the underlying event timestamps (`Event.TS`) — no new stored data needed. |\n| **F8 / F3** (P3) | `outcome` enum & `correction_density` undocumented | Document the `outcome` enum (`success\\|partial\\|fail\\|abandoned`) and the `correction_density` signal (definition + scale) in the skill references and `quickstart`. |\n| **F11** | Legacy `docs/reflection/*.yaml` from the superseded process still present | **Remove** the legacy yaml (no migration — old process). |"}]},{"t":"section","a":{"id":"decisions-made","title":"Decisions made (with Charlie, 2026-06-28)"},"c":[{"t":"md","x":"The four load-bearing forks were resolved before drafting; recorded here as ADRs\nso the executor inherits them. Two further constraints (D-5, D-6) are calls the\nagent made to keep the append-only event contract intact."},{"t":"decision","a":{"id":"D-1","title":"F4 surface = dedicated `gap list`","status":"accepted","by":"charlie","summary":"Dedicated `auto reflect gap list`, not a generic events --full flag."},"c":[{"t":"md","x":"**Decision:** Expose gaps via a dedicated `auto reflect gap list` command.\n**Alternatives:** A generic `events list --full/--payload` flag; both.\n**Consequences:** Matches the \"gap → observation\" mental model and is discoverable;\nthe generic payload-dump flag is left out of scope."}]},{"t":"decision","a":{"id":"D-2","title":"Event log is git-tracked","status":"accepted","by":"charlie","summary":"events/ tracked; init .gitignore ignores only playbook.json."},"c":[{"t":"md","x":"**Decision:** The canonical `.auto/reflect/events/*.jsonl` log is committed\n(shared playbook history; any clone can `rebuild`). The init-written\n`.auto/reflect/.gitignore` ignores only the disposable `playbook.json`.\n**Alternatives:** Ignore events too (machine-local reflect state).\n**Consequences:** Reflect history travels with the repo and across hosts."}]},{"t":"decision","a":{"id":"D-3","title":"F5 = restructure to a uniform envelope (breaking)","status":"accepted","by":"charlie","summary":"One uniform output envelope; top-level id/ids. Breaks existing consumers."},"c":[{"t":"md","x":"**Decision:** Restructure command output to one uniform envelope rather than\nadditively bolting a top-level `.id` onto today's shapes.\n**Alternatives:** Non-breaking additive `.id`/`.ids`.\n**Consequences:** Cleanest end state; existing output consumers (and the skill\nreferences' documented extraction paths) must be updated in lockstep."}]},{"t":"decision","a":{"id":"D-4","title":"Content-derived ids included in 052","status":"accepted","by":"charlie","summary":"Deterministic content-hashed ids ship in this task."},"c":[{"t":"md","x":"**Decision:** Implement content-derived ids (F7) in this task, not a follow-up.\n**Consequences:** Adds collision-handling design; fits the output-contract theme\nsince deterministic ids make `--dry-run` output actionable."}]},{"t":"decision","a":{"id":"D-5","title":"F5 changes CLI output only — not the stored event schema","status":"accepted","by":"agent","summary":"Envelope restructure is presentation-layer; on-disk payloads + schema_version=1 unchanged."},"c":[{"t":"md","x":"**Context:** Stored payload field names (`observation_id`, `rule_id`, …) are part\nof the append-only on-disk contract; `events.SchemaVersion` is 1 and must fold\nidentically forever.\n**Decision:** F5 restructures only CLI *output* marshalling. Stored event payload\nfield names and `schema_version` are untouched.\n**Consequences:** No schema bump; the uniform envelope is a view over canonical\ndata, consistent with \"playbook is a disposable cache, events are canonical.\""}]},{"t":"decision","a":{"id":"D-6","title":"Content-derived ids preserve existing id formats","status":"accepted","by":"agent","summary":"Only minting changes (random → content hash); regex formats like ^ob-[0-9a-f]{8}$ stay."},"c":[{"t":"md","x":"**Context:** Ids are validated against fixed regexes (`^ev-[0-9a-f]{8}$`,\n`^ob-[0-9a-f]{8}$`, rule `r-…`).\n**Decision:** Keep the formats; change only how the 8 hex chars are produced —\nfrom random to a prefix of a content hash — with a deterministic collision-suffix\npolicy so two distinct entities never collide.\n**Consequences:** Existing ids stay valid; validators unchanged. Exact hash inputs\nand collision rule are settled in `/new-solution`."}]},{"t":"decisions","a":{},"c":[]}]},{"t":"section","a":{"id":"out-of-scope","title":"Out of Scope"},"c":[{"t":"md","x":"- **F10 ack-nudge** — a \"you observed against session X but never `ack`ed it\"\n  warning. Nice-to-have; deferred.\n- **Gap *resolution* tracking** — linking a reported gap to the observation that\n  closed it. `gap list` lists all gaps; v1 has no resolution state (no such link\n  exists today).\n- **On-disk event schema changes** — no `schema_version` bump, no stored payload\n  field renames (see D-5).\n- **The `/reflect-playbook` skill prompt/flow redesign** — only its reference docs\n  are touched (F8/F3), not its orchestration.\n- **A generic `events list --full` payload dump** — superseded by the dedicated\n  `gap list` (D-1)."}]},{"t":"section","a":{"id":"open-questions","title":"Open Questions"},"c":[{"t":"md","x":"All four load-bearing forks are resolved (see Decisions). The items below are\nassumptions the plan proceeds on — recorded so they can be revisited, but not\ngating:\n\n- [ ] **`gap list` shape** — lists every reported gap with its source (feedback\n  id, session id, ts, `report`, `moment`); no open/resolved state, since no\n  gap → observation link exists. *(assumption)*\n- [ ] **F2 root cause** — the off-by-6 (390 vs 396) is assumed to be one divergent\n  computation, not two legitimately different universes; fix = collapse both call\n  sites onto a shared function. The exact cause is pinned during implementation.\n  *(assumption)*\n- [ ] **Content-hash inputs** — hash over each entity's canonical content fields\n  (rule: `domain + use_when + content + rule_type`; observation:\n  `kind + subject + evidence`). Finalized in `/new-solution`. *(assumption)*\n- [ ] **Scope size** — this bundles 9 findings; if it proves too large at the\n  solution stage, F8/F3 (docs) + F11 (legacy removal) split cleanly into a\n  follow-up. *(assumption)*"}]},{"t":"section","a":{"id":"source","title":"Source"},"c":[{"t":"md","x":"- Spike findings: `.tmp/reflect-playbook-spike-findings.md` (throwaway/demo run,\n  2026-06-28; executor session `518b6d9a`).\n- Tool: `auto-reflect/` (`reflect version v0.24.0-21-ge183760`)."}]}]},{"t":"tab","a":{"name":"Verification"},"c":[{"t":"section","a":{"id":"test-strategy","title":"Test Strategy"},"c":[{"t":"md","x":"The module already has the harnesses we need — lean on them rather than inventing\nnew ones:\n\n- **Unit** — pure-function changes: content-derived id determinism\n  (`rules`/`observations` model tests), `Fold` timestamp population\n  (`projection_test.go`), the single shared pending-count function\n  (`miner` test), feedback-gap projection for `gap list`.\n- **Integration** — CLI output contracts via the existing\n  `*_integration_test.go` (events, observation, consolidate) and a new\n  `gap`/`doctor` integration test. These assert the **new uniform envelope** and\n  are where most of the F5 churn lands (every output-shape assertion moves to\n  `.id`/`.ids`/`.[].id`).\n- **E2E** — the existing `cmd/autoreflect/e2e_*_test.go` lifecycle/loop suites,\n  extended so the full mine → observe → consolidate → promote → retrieve →\n  select → feedback → **gap list** loop runs against an on-disk fixture\n  (per CLAUDE.md: populate a stable dataset on disk, run the tools as a user).\n- **Manual replay** — re-run the spike's bounded loop and confirm every spike\n  finding (F1–F11 in scope) is closed; reset throwaway artifacts after.\n\nConventions enforced throughout (CLAUDE.md / `auto-package-patterns.md`):\nJSON default + 2-space indent, stdout = payload only / diagnostics + remediation\nto stderr, non-zero exit on any error, `validate()` structured errors, and\n`go build ./...` clean after every file."}]},{"t":"section","a":{"id":"coverage-map","title":"Coverage Map"},"c":[{"t":"mermaid","a":{"caption":"Testing layers"},"x":"flowchart TD\n  U[Unit: id determinism, Fold timestamps, pending count, gap projection] --> I[Integration: CLI envelope contracts, gap list, doctor]\n  I --> E[E2E: full reflect loop on disk fixture + gap read-back]\n  E --> M[Manual: replay spike loop, confirm F1-F11 closed]"}]},{"t":"section","a":{"id":"acceptance-criteria","title":"Acceptance Criteria"},"c":[{"t":"ac","a":{"id":"AC-1","title":"gap list surfaces reported gaps (F4)","phases":"5","tests":"auto-reflect/internal/cli/gap_integration_test.go"},"c":[{"t":"md","x":"**Given** feedback events that carry a `gap` (`report` + `moment`),\n**When** I run `auto reflect gap list`,\n**Then** stdout is JSON listing each gap with its `report`, `moment`, and source\nprovenance (the feedback event id `ev-…`, `session_id`, `ts`) — no raw-JSONL\ngrep required. Feedback events without a gap are omitted."}]},{"t":"ac","a":{"id":"AC-2","title":"gap list obeys list conventions (F4)","phases":"5","tests":"auto-reflect/internal/cli/gap_integration_test.go"},"c":[{"t":"md","x":"**Given** gaps spanning multiple sessions/domains/times,\n**When** I run `gap list` with no filters,\n**Then** all gaps are returned; **and** `--since`/`--after`/`--before` and\n`--domain` filter correctly (one filter mode at a time), input normalized, JSON\nby default with `--format text` available."}]},{"t":"ac","a":{"id":"AC-3","title":"One pending count, two callers agree (F2)","phases":"4","tests":"auto-reflect/internal/cli/miner_integration_test.go"},"c":[{"t":"md","x":"**Given** any repo + ETL state,\n**When** I run `auto reflect miner status` and `auto reflect stats`,\n**Then** `pending` == `pending_to_mine` (both computed by one shared function),\nand the counted universe is documented. A unit test pins them equal on a fixture\nwhere they previously diverged."}]},{"t":"ac","a":{"id":"AC-4","title":"Mutating commands expose a top-level id (F5)","phases":"1,2,3","tests":"auto-reflect/internal/cli/observation_integration_test.go,auto-reflect/internal/cli/consolidate_integration_test.go"},"c":[{"t":"md","x":"**Given** the uniform output envelope,\n**When** I run an id-minting / entity mutation (`observation add`, `rule\ncreate/edit/promote/retire/graduate`, `consolidate`),\n**Then** the relevant id(s) — newly minted, or the affected entity's — are\nreachable at a predictable top-level path (`.id` for single, `.ids` for many),\nnever `null` and never only nested. (`feedback` echoes the feedback ids it acted\non as `ids`; `rebuild` carries counts only — neither mints a new entity id.)"}]},{"t":"thread","a":{"anchor":"AC-4","status":"resolved","priority":"p2","title":"`feedback` can't expose a minted top-level id without a service.go change not in the plan"},"c":[{"t":"comment","a":{"by":"review"},"x":"AC-4 names `feedback` as a mutating command whose **minted** id must be top-level. But `loop/feedback.go:57` `SubmitFeedback(in FeedbackInput, sessionOverride string) ([]ValidationError, error)` returns **no** event id, and `cli/feedback.go:59` returns `{recorded:true}`. To surface the minted feedback-event id at top level, `SubmitFeedback` must change to return it — yet `loop/feedback.go` is in Phase 7's file set only for the F8 outcome-enum docstring, and no service-layer signature change is listed. Meanwhile Phase 3 step 3 says feedback \"echoes `ids` (the feedback ids **acted on**)\", i.e. the input rankings' `feedback_id`s — which is a *different* id from the minted event id AC-4 asks for. Pin which one feedback exposes; if it's the minted id, add the `SubmitFeedback` return-value change to the file changes.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved. AC-4 reworded to scope it to id-minting / entity mutations (observation add, rule create/edit/promote/retire/graduate, consolidate) and to state that `feedback` echoes the feedback ids it *acted on* as `ids` — not a newly minted event id — so no `SubmitFeedback`/`service.go` signature change is needed (and none is in scope).","c":[]}]},{"t":"thread","a":{"anchor":"AC-4","status":"resolved","priority":"p2","title":"`rebuild` is in AC-4's mutating-command list but mints no id and is absent from the Solution/File Changes"},"c":[{"t":"comment","a":{"by":"review"},"x":"AC-4's list includes `rebuild`, but `cli/rebuild.go` returns `{rebuilt, rule_count, conflict_count}` and mints no id — it refolds existing events. The Approach (Solution tab, F5) lists the mutations as \"observation add, rule create/edit/promote/retire/graduate, consolidate, feedback\" with **no** `rebuild`, and `rebuild.go` is not in File Changes or any phase. Either drop `rebuild` from AC-4 (it has no \"minted id\" to expose), or define what id it should carry and add `rebuild.go` to the plan. As written AC-4 is untestable for `rebuild`.","c":[]},{"t":"comment","a":{"by":"author"},"x":"Resolved. Dropped `rebuild` from AC-4 — it refolds existing events and mints no id; AC-4 now notes `rebuild` carries counts only. This matches the Solution Approach, which already excludes `rebuild` from the mutation list.","c":[]}]},{"t":"ac","a":{"id":"AC-5","title":"Collection commands expose .[].id without data loss (F5)","phases":"1,3","tests":"auto-reflect/internal/cli/observation_integration_test.go"},"c":[{"t":"md","x":"**Given** the envelope migration of `retrieve`, `select`, `rule list`,\n`observation list`, `events list`, `gap list`,\n**When** I parse their JSON,\n**Then** each element's id is reachable at a uniform path (`.[].id` or\n`.results[].id`), every field present before the change is still present, and the\nreflect-playbook skill refs + `quickstart` are updated to the new paths."}]},{"t":"ac","a":{"id":"AC-6","title":"Content-derived ids make consolidate deterministic + idempotent (F7)","phases":"1,2","tests":"auto-reflect/internal/cli/consolidate_integration_test.go,auto-reflect/internal/idhash/idhash_test.go"},"c":[{"t":"md","x":"**Given** one consolidation delta document,\n**When** I run `consolidate --dry-run` and then `consolidate` (separate\ninvocations),\n**Then** the rule id is identical across both; **and** re-running the same\n`consolidate` a second time is a no-op (no duplicate rule) because the\ncontent-derived id already exists."}]},{"t":"ac","a":{"id":"AC-7","title":"Ids keep their format (F7/D-6)","phases":"1,2","tests":"auto-reflect/internal/idhash/idhash_test.go"},"c":[{"t":"md","x":"**Given** content-derived minting,\n**When** rule/observation ids are generated,\n**Then** they still match `^r-[0-9a-f]{8}$` / `^ob-[0-9a-f]{8}$`; existing\nvalidators are unchanged; events already on disk keep their original ids."}]},{"t":"ac","a":{"id":"AC-8","title":"init writes an idempotent .gitignore (F9)","phases":"7","tests":"auto-reflect/internal/cli/init_test.go"},"c":[{"t":"md","x":"**Given** a repo,\n**When** I run `auto reflect init` (or `init --project`),\n**Then** `.auto/reflect/.gitignore` exists and ignores `playbook.json` (not\n`events/`); running init again does not overwrite or duplicate it."}]},{"t":"ac","a":{"id":"AC-9","title":"Canonical events tracked, cache ignored (F9/D-2)","phases":"7","tests":"auto-reflect/internal/cli/init_test.go"},"c":[{"t":"md","x":"**Given** the repo's own `.auto/reflect/`,\n**When** I check git status after init,\n**Then** `.auto/reflect/events/*.jsonl` is tracked/committable and\n`playbook.json` is untracked (removed from the index with `git rm --cached` if\npreviously tracked)."}]},{"t":"ac","a":{"id":"AC-10","title":"doctor detects stale/partial state (F1)","phases":"6","tests":"auto-reflect/internal/cli/doctor_integration_test.go"},"c":[{"t":"md","x":"**Given** a partial reflect state (e.g. state dir present but `events/` missing,\nor `playbook.json` stale vs the folded event log),\n**When** I run `auto reflect doctor`,\n**Then** it returns structured JSON `[{check,status,message,hint}]`, each failure\ncarries a concrete remediation hint, and the process exits non-zero on any fail."}]},{"t":"ac","a":{"id":"AC-11","title":"Rule listings carry timestamps (F6)","phases":"3","tests":"auto-reflect/internal/rules/projection_test.go"},"c":[{"t":"md","x":"**Given** a folded rule with `created_at`/`updated_at` set by `Fold`,\n**When** I run `auto refle
