truct: `conn io.ReadWriteCloser` (note: **not** `net.Conn`, so `SetReadDeadline` is not available on the field type), `out chan any` (bounded write-pump, default 16 via `WithBufferSize`), `pendingMu sync.Mutex` + `pending map[int64]chan Response`, `closed chan struct{}`, `closeOnce sync.Once`, `pumpDone chan struct{}`.\n9\t- `auto-shared/rpc/peer.go:26-42` — Options pattern: `WithHandler`, `WithOnNotify`, `WithBufferSize`. **This is where a `WithKeepAlive(interval, timeout)` option hooks in.**\n10\t- `auto-shared/rpc/peer.go:147-188` — `readLoop`: `dec := NewDecoder(p.conn)`; `dec.Decode(&raw)` **blocks indefinitely — no read deadline**. The only unblock is ctx cancellation → a goroutine calls `p.shutdown()` (peer.go:118-124) which closes the conn, failing the Decode. **This is the gap:** a half-open connection never unblocks `readLoop`, so `Serve` never returns.\n11\t- `auto-shared/rpc/peer.go:318-381` — `Call`: registers a buffered waiter `ch := make(chan Response, 1)` in `pending`; released on one of three terminal paths — response on `ch`, `<-ctx.Done()` (removes only that waiter), or `<-p.closed` (ErrClosed).\n12\t- `auto-shared/rpc/peer.go:473-488` — `shutdown` (idempotent via `closeOnce`): `close(p.closed)`, then snapshots `pending`, replaces with empty map, and `close(ch)` for each waiter → pending callers get `ok=false` → ErrClosed. **No leak by construction once shutdown runs.**\n13\t\n14\t### Codec / framing (G3 decoder test)\n15\t- `auto-shared/rpc/codec.go:8-39` — NDJSON via stdlib `json.Encoder`/`json.Decoder`. `Decode` buffers internally and yields exactly one JSON value per call regardless of how bytes are chunked. Framing is a `json.Decoder` property, **not** transport-dependent (consistent with GR-N8 §4).\n16\t- `auto-shared/rpc/message.go:27-124` — `Request`/`Response`/`Error` types + `Classify` (validates `jsonrpc==\"2.0\"`, routes by presence of method/result/error/id).\n17\t\n18\t### Conformance harness (G3 lives here)\n19\t- `auto-shared/rpc/c nce criteria, and how the exec…", "body": "I need to examine the plan.html file to understand the phases, acceptance criteria, and how the execution sequence is structured as a directed acyclic graph.", "truncated": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-10"}, {"kind": "assistant", "idx": 11, "summary": "Let me read the plan.html to understand the phases and execution sequence.", "body": "Let me read the plan.html to understand the phases and execution sequence.", "truncated": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-11", "out_tokens": 164}, {"kind": "tool", "idx": 12, "tool": "Read", "summary": "/home/vscode/src/auto-stack/docs/tasks/041-dataplane-backbone-assurance/plan.html", "input": "{\"file_path\":\"/home/vscode/src/auto-stack/docs/tasks/041-dataplane-backbone-assurance/plan.html\"}", "input_trunc": false, "output": "1\t<!doctype html>\n2\t<html lang=\"en\">\n3\t<head>\n4\t  <meta charset=\"utf-8\">\n5\t  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n6\t  <title>041: dataplane-backbone-assurance<\/title>\n7\t  <script src=\"https://cdn.jsdelivr.net/gh/mistakenot/skills@pd-v0.8.0/pd-components/dist/pd.min.js\" defer><\/script>\n8\t<\/head>\n9\t<body>\n10\t  <script type=\"application/json\" id=\"pd-meta\">\n11\t  {\n12\t    \"id\": \"041\",\n13\t    \"name\": \"dataplane-backbone-assurance\",\n14\t    \"epic\": \"003-multi-host-architecture\",\n15\t    \"status\": \"executing\",\n16\t    \"created\": \"2026-06-27\"\n17\t  }\n18\t  <\/script>\n19\t  <!-- AI: When a PR is created for this work, update pr=\"pending\" below with the PR URL -->\n20\t  <pd-doc title=\"041: dataplane-backbone-assurance\" status=\"executing\" pr=\"pending\" generated=\"2026-06-27\">\n21\t\n22\t    <pd-tab name=\"Requirements\">\n23\t\n24\t      <pd-section id=\"problem\" title=\"Problem\">\n25\t        <md><script type=\"text/plain\">\n26\tThe multi-host backbone — the connection / coordination / message-passing data plane built across epic-003 Tasks 1–6 (028, 030, 031, 038, 039, 040, all MERGED) — has good *component-level* tests but cannot yet be trusted from a green CI run alone. The goal of this task is to close the gaps that stand between \"the tests pass\" and \"I believe the backbone works without running it myself.\" An assurance review identified three RED (must-fix) gaps; this task addresses exactly those three. (Two YELLOW gaps — generative correlation testing and the end-to-end relay-seam test — are deferred, see Out of Scope.)\n27\t\n28\t- **G1 — The concurrency tests run with their oracle disabled.** `make test` is `go test ./...` with **no `-race`** (`Makefile` test target), and CI runs exactly that (`.github/workflows/ci.yml:33` → `make test`). The data plane is a goroutine + bounded-channel + mutex design (`auto-shared/rpc/peer.go`: read loop, write pump, `pending` map under `sync.Mutex`, shutdown via `sync.Once`). The concurrency tests exist (`TestConcurrentCallsNoCrosstalk`, the pending-call release matrix) but the race detector — the *primary* oracle for that whole bug class — is never run in CI. A correlation/crosstalk data race can stay green forever.\n29\t- **G2 — There is no liveness detection in the TCP/Unix transport, and GR-N8 makes that load-bearing.** `grep` confirms zero `keepalive` / `SetDeadline` / read-deadline / ping handling in `auto-shared/rpc/peer.go` or `auto-watch/internal/rpcserver/`. By committing to GR-N8 (connection-oriented, reliable, in-order transports — `docs/auto-bus-spec.md` §4), we made **liveness the only way to detect a dead peer**: on a reliable transport a peer whose process was killed / NAT-dropped / rebooted leaves a **half-open** connection that produces no read error until someone writes. Today nothing reaps it — a dead subscriber lingers in the hub's sink set (evicted only slowly/indirectly via drop-on-full, and only while events keep flowing) and a pending `Call` with a non-cancelling context hangs forever. This is the canonical \"works in a 5-minute manual test, fails in production\" failure. (Note: auto-ui's WebSocket path has a 1s ping per `docs/auto-bus-spec.md` §4.2; the new autowatch TCP/Unix RPC transport has no equivalent.)\n30\t- **G3 — Conformance proves transport-invariance only for the trivial path.** The harness shape is right — `auto-shared/rpc/conformance.RunAcrossFixtures` runs a `Scenario` against pipe / Unix / TCP fixtures — but it runs **one** scenario (`echo-and-push`). Every *hard* coordination behavior (concurrent in-flight call correlation, connection-drop-mid-call, slow-consumer drop-on-full) is proven **pipe-only** in `auto-shared/rpc/peer_test.go`, never across Unix/TCP, which is exactly where connection-layer bugs live. A conn wrapper (`CountingConn`) exists in `conformance/fakes.go` but is **observational only** (it counts reads/writes); fault injection (close-mid-stream, blocking-write) is net-new code this task adds.\n31\t        <\/script><\/md>\n32\t      <\/pd-section>\n33", "output_trunc": true, "duration": 455, "is_error": false, "interrupted": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-12", "exit": 0}, {"kind": "thinking", "idx": 14, "summary": "I'm getting a clear picture of the task structure now—five distinct phases to work through. Let me r…", "body": "I'm getting a clear picture of the task structure now—five distinct phases to work through. Let me review the worktree and commit conventions, then check what's currently in place before setting up the worktree.", "truncated": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-14"}, {"kind": "assistant", "idx": 15, "summary": "I have a thorough understanding of the task. Let me read the worktree/commit conventions and check current state.", "body": "I have a thorough understanding of the task. Let me read the worktree/commit conventions and check current state.", "truncated": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-15", "out_tokens": 417}, {"kind": "tool", "idx": 16, "tool": "Bash", "summ rded + reason\nconstraint(scope): hard limits/dependencies discovered\nlearned(scope): API quirks, undocumented behaviors\n```\n\n## Phase Commits (during execution)\n\n```\nfeat($ID): phase N - $description\n\nintent(task): $what_this_phase_accomplishes\n```\n\n## Plan Tracking Commits\n\n```\ndocs($ID): mark phase N complete\n```\n# Task status lifecycle\n\nEvery task carries a status that advances through the workflow. On HTML planning\ndocs it drives the visual banner.\n\nStages: **draft → pending → executing → complete**. (HTML docs also read as\n\"blocked\" automatically whenever a review thread is unresolved — never set by hand.)\n\n| Stage | Set by | When |\n|---|---|---|\n| draft | new-task | doc created |\n| pending | commit-task | planning docs committed |\n| executing | delegate-task | before dispatching to a worker |\n| complete | execute-task | when the implementation PR is opened |\n\n## Setting it\n\nSet the `status` attribute on the `<pd-doc>` element in `plan.html`.\n---ARTIFACTS---\ntotal 12\ndrwxrwxr-x 2 vscode vscode 4096 Jun 27 13:52 .\ndrwxrwxr-x 3 vscode vscode 4096 Jun 27 14:15 ..\n-rw-rw-r-- 1 vscode vscode  492 Jun 27 13:52 README.md\n---GIT---\n M todo.md\n?? .agents/skills/assurance-strategist/\n?? .claude/skills/assurance-strategist\nmain\n/home/vscode/src/auto-stack                                            22f7f32 [main]\n/home/vscode/src/auto-stack-dogfood                                    1a4082e [experiment/reflect-dogfood]\n/home/vscode/src/auto-stack-wt-033                                     a683c71 [task/033-skill-add-discovery]\n/home/vscode/src/auto-stack/.claude/worktrees/agent-a07fe45e35a8dfa01  0b09c1a [quint-mbt-verification]", "output_trunc": false, "duration": 164, "is_error": false, "interrupted": false, "mid": "f2d1dabc-4b4c-467f-89a1-a4cc74d970b5-16", "exit": 0}, {"kind": "thinking", "idx": 18, "summary": "I need to set up the worktree by first fetching the latest changes and ensuring I'm on main, but I'l…", "body" alled shutdown\\n\\t// (conn closed). The pump never blocks indefinitely in Encode.\\n\\tclose(p.stop)\\n\\t<-p.pumpDone\\n\\n\\t// Ensure terminal shutdown ran (idempotent if ctx watcher triggered it).\\n\\tp.shutdown()\\n\\n\\t// Join the keepalive goroutines (released by shutdown closing p.closed).\\n\\t<-kaDone\\n\\n\\treturn err\\n}\\n\\n// pingLoop pushes a $keepalive notification every kaInterval so the remote's\\n// read watchdog stays satisfied. It mirrors the WebSocket ping model in\\n// auto-ui/internal/server/ws.go: a dedicated ticker goroutine using the\\n// drop-on-full enqueue (a stalled writer closes the conn rather than blocking).\\n// Exits on p.closed or ctx cancellation.\\nfunc (p *Peer) pingLoop(ctx context.Context) {\\n\\tt := time.NewTicker(p.kaInterval)\\n\\tdefer t.Stop()\\n\\tfor {\\n\\t\\tselect {\\n\\t\\tcase <-p.closed:\\n\\t\\t\\treturn\\n\\t\\tcase <-ctx.Done():\\n\\t\\t\\treturn\\n\\t\\tcase <-t.C:\\n\\t\\t\\tif !p.enqueue(&Request{JSONRPC: \\\"2.0\\\", Method: pingMethod}) {\\n\\t\\t\\t\\treturn\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n}\\n\\n// watchdogLoop reaps a half-open connection: if no inbound frame has been\\n// decoded within kaTimeout, it calls shutdown (closing the conn, which unblocks\\n// readLoop's Decode and releases all pending callers). It ticks at ~kaTimeout/3\\n// so detection happens within a b", "input_trunc": true, "output": "The file /home/vscode/src/auto-stack-wt-041/auto-shared/rpc/peer.go has been updated successfully. (file state is current in your context — no need to Read it back)", "output_trunc": false, "duration": 141, "is_error": false, "interrupted": false, "mid": "a950299bcf093ab4f-35", "exit": 0}, {"kind": "assistant", "idx": 37, "summary": "Now stamp lastActivity in readLoop and swallow $keepalive in handleNotification:", "body": "Now stamp lastActivity in readLoop and swallow $keepalive in handleNotification:", "truncated": false, "mid": "a950299bcf093ab4f-37", "out_tokens": 3}, {"kind": "tool", "idx": 3 f-open conn.\\n\\tcase <-time.After(testTimeout):\\n\\t\\tt.Fatal(\\\"Serve did not return after half-open keepalive reap\\\")\\n\\t}\\n\\n\\t// The in-flight Call must return ErrClosed (released by shutdown), not its\\n\\t// own deadline.\\n\\tselect {\\n\\tcase err := <-callResult:\\n\\t\\tif !errors.Is(err, ErrClosed) {\\n\\t\\t\\tt.Errorf(\\\"in-flight Call returned %v, want ErrClosed\\\", err)\\n\\t\\t}\\n\\tcase <-time.After(testTimeout):\\n\\t\\tt.Fatal(\\\"in-flight Call did not return after reap\\\")\\n\\t}\\n\\n\\t// Subsequent Call / Notify must also return ErrClosed.\\n\\tpostCtx, postCancel := context.WithTimeout(context.Background(), testTimeout)\\n\\tdefer postCancel()\\n\\tif _, err := peer.Call(postCtx, \\\"anything\\\", nil); !errors.Is(err, ErrClosed) {\\n\\t\\tt.Errorf(\\\"post-reap Call returned %v, want ErrClosed\\\", err)\\n\\t}\\n\\tif err := peer.Notify(\\\"anything\\\", nil); !errors.Is(err, ErrClosed) {\\n\\t\\tt.Errorf(\\\"post-reap Notify returned %v, want ErrClosed\\\", err)\\n\\t}\\n}\\n\\nfunc TestKeepAliveNoFalseReapWhenHealthy(t *testing.T) {\\n\\t// A healthy, idle pair with keepalive enabled on both ends. With no\\n\\t// application traffic, the mutual $keepalive pings keep each side's\\n\\t// lastActivity fresh, so neither watchdog should fire.\\n\\tconst (\\n\\t\\tinterval = 10 * time.Millisecond\\n\\t\\ttimeout  = 40 * time.Millisecond\\n\\t)\\n\\n\\thandlers := map[string]Handler{\\n\\t\\t\\\"echo\\\": func(_ context.Context, params json.RawMessage) (any, error) {\\n\\t\\t\\treturn params, nil\\n\\t\\t},\\n\\t}\\n\\n\\tclient, _, cancel, clientErr, serverErr := newPipe", "input_trunc": true, "output": "The file /home/vscode/src/auto-stack-wt-041/auto-shared/rpc/peer_test.go has been updated successfully. (file state is current in your context — no need to Read it back)", "output_trunc": false, "duration": 159, "is_error": false, "interrupted": false, "mid": "a950299bcf093ab4f-45", "exit": 0}, {"kind": "tool", "idx": 47, "tool" g | Bindings | Contract | Type registry | ctl.* events | watch.task.* mapping\n18:## 1. Overview\n26:## 2. Envelope\n30:### 2.1 Fields\n48:### 2.2 Workspace provenance attributes\n58:| `project` | Registry project ID (logical grouping) | Host-local (registry) |\n64:### 2.3 Typing discipline\n66:The envelope follows a two-tier typing model:\n76:### 2.4 Credential rule: `remote` must be normalized\n86:## 3. Framing\n88:### 3.1 JSON-RPC 2.0 notifications\n115:### 3.2 RPC calls\n117:Two-way RPC (`doc.list`, `doc.get`, `ping`) uses standard id-bearing JSON-RPC 2.0 requests/responses over WebSocket:\n126:### 3.3 Type authority rule\n130:### 3.4 HTTP deviation: error responses for notifications\n138:## 4. Transport bindings\n140:### Transport model and assumptions (guard rail GR-N8)\n142:**GR-N8 — Connection-oriented, reliable, in-order transports only.** Every transport binding MUST be a connection-oriented, reliable, in-order byte stream: TCP, Unix-domain `SOCK_STREAM`, in-process `net.Pipe()`, and WebSocket (which rides TCP) all qualify. Datagram / lossy / unordered transports (UDP, QUIC datagrams, raw message buses with at-most-once *byte* delivery) are **out of scope** and MUST NOT be added without revisiting the framing and correlation layers.\n157:**What this does *not* excuse.** Reliable, in-order, intra-VPC delivery says nothing about the *connection staying up* or the *application keeping pace*. These failure modes are fully present on TCP and are handled at the application layer, not assumed away: connection drop / half-open mid-call (pending callers are released — section 5), backpressure / slow consumer (drop-on-full — section 4.2 / 4.3), and concurrent call correlation (the `pending` map). At-most-once delivery (section 5) is an *application* policy delivered by drop-on-full, **not** an inheritance from the transport — TCP is reliable; the relay deliberately is not.\n159:### 4.1 HTTP POST `/api/rpc` (one-shot publish)\n183:### 4.2 WebSocket `/api/ws` (bidirectional)\n194:| Keepalive | Server pushes `ping` notifications every 1 second |\n197:- `ping` -- echo with sequence number\n204:3. Write pump goroutine drains the outbound channel; ping loop pushes keepalives.\n208:### 4.3 `bus.subscribe` RPC (broadcast-all relay)\n228:### 4.4 Future transports (not implemented)\n233:Any future transport MUST satisfy GR-N8 (connection-oriented, reliable, in-order byte stream — see \"Transport model and assumptions\" above). Datagram/lossy transports are not a permitted extension without reworking the framing and correlation layers.\n237:## 5. Delivery contract\n239:The bus provides **at-most-once, explicitly lossy** delivery. This is an *application-layer* policy (drop-on-full at the consumer buffer), not a property of the transport — the underlying transports are reliable and in-order (GR-N8, section 4). Losses come from the bus deliberately shedding load to a slow or absent consumer, not from the network dropping bytes. Because all v1 networking is intra-VPC (low-loss, low-latency), this lossy policy is a simplification we *choose*, not a hazard we are forced to tolerate:\n258:## 6. Event-type registry\n262:### 6.1 `agent.*` -- agent hook events\n277:**Event type mapping** (from `hook_event_name`):\n302:### 6.2 `doc.*` -- document events\n330:### 6.3 `ctl.*` -- control-plane events\n367:### 6.4 `watch.*` -- auto-watch daemon events\n369:The auto-watch daemon is the named second adopter of the bus standard. The `watch.task.started`, `watch.task.completed`, and `watch.task.failed` types are **live producers**: they are emitted by the daemon's task RPCs over the bus, in addition to being stored in SQLite via `store.EventInput`. The remaining types are paper mappings — defined here to validate the envelope design, with impl", "output_trunc": true, "duration": 133, "is_error": false, "interrupted": false, "mid": "a950299bcf093ab4f-55", "exit": 0}, {"kind": "tool", "idx": 57, "tool": "Read", "summary": "/home/vscode/src/auto-stack-wt-041/docs/auto-bus-spec.md", "input": "{\"file_path\":\"/home/vscode/src/auto-stack-wt-041/docs/auto-bus-spec.md\",\"offset\":183,\"limit\":55}", "input_trunc": false, "output": "183\t### 4.2 WebSocket `/api/ws` (bidirectional)\n184\t\n185\tFull-duplex JSON-RPC 2.0 over WebSocket, supporting both client-initiated RPC calls and server-push event notifications.\n186\t\n187\t| Aspect | Detail |\n188\t|--------|--------|\n189\t| Upgrade | Standard WebSocket upgrade; same-origin policy (no explicit CORS) |\n190\t| Inbound | JSON-RPC requests (with `id`) dispatched to registered handlers |\n191\t| Outbound | JSON-RPC notifications pushed via the hub broadcast |\n192\t| Buffering | 16-slot per-connection outbound buffer |\n193\t| Slow client | Connection dropped (cancelled) when buffer fills; never blocks the hub |\n194\t| Keepalive | Server pushes `ping` notifications every 1 second |\n195\t\n196\t**Registered RPC methods:**\n197\t- `ping` -- echo with sequence number\n198\t- `doc.list` -- list `docs/**/*.md` files for a project/worktree\n199\t- `doc.get` -- read raw markdown content of a single doc\n200\t\n201\t**Session lifecycle:**\n202\t1. WebSocket accepted; `session` created with context and outbound channel.\n203\t2. Session registered with hub via `hub.Subscribe(session)` (session implements `bus.Sink`).\n204\t3. Write pump goroutine drains the outbound channel; ping loop pushes keepalives.\n205\t4. Read loop dispatches inbound JSON-RPC to the shared `Dispatcher`.\n206\t5. On disconnect (or slow-client drop): cancel context, deregister from hub, close connection.\n207\t\n208\t### 4.3 `bus.subscribe` RPC (broadcast-all relay)\n209\t\n210\tThe `bus.subscribe` JSON-RPC method registers a connected peer to receive **all** hub events as server-push notifications. It is parameterless (broadcast-all per GR-N5) -- subscribers receive every event; filtering is client-side.\n211\t\n212\t| Aspect | Detail |\n213\t|--------|--------|\n214\t| Method | `bus.subscribe` |\n215\t| Params | None (broadcast-all) |\n216\t| Response | `{\"status\": \"subscribed\"}` |\n217\t| Idempotent | Yes -- a second call from the same peer is a no-op |\n218\t| Cleanup | Subscription is cancelled when the peer disconnects |\n219\t\n220\t**Relay path:** Hub → per-peer `peerSink` (implements `bus.Sink`) → `Peer.Notify(ev.Type, ev)` → JSON-RPC notification on the wire. The notification shape matches `Event.AsNotification()`: `method` = the event type, `params` = the full envelope with every field intact.\n221\t\n222\t**Per-peer drop-on-full / at-most-once:** `peerSink.Deliver` calls `Peer.Notify`, which uses a non-blocking bounded-channel enqueue (`defaultBufferSize=16`). If the buffer is full, the frame is dropped and the connection is closed -- the hub never blocks on a slow subscriber. This is consistent with the at-most-once delivery contract (section 5) and mirrors auto-ui's WebSocket slow-client policy.\n223\t\n224\t**`ctl.*` gating through the relay:** The relay bridge has no type-specific filter. `ctl.*` events reach subscribers only when `--ctl-events` is enabled (the gate is at emission, not relay). Data-plane events (`doc.changed`, `watch.task.*`, `agent.*`) always relay.\n225\t\n226\t**Implementation:** The bridge lives in `rpcserver` (the accept loop), not `rpcmethods`, so the per-connection subscription state (a cancel func) is co-located with the peer lifecycle. `rpcmethods` remains transport-free.\n227\t\n228\t### 4.4 Future transports (not implemented)\n229\t\n230\tThe following are documented as planned extensions:\n231\t- **Headless `auto bus serve`** -- standalone bus process without the full auto-ui, for environments that don't need the SPA.\n232\t\n233\tAny future transport MUST satisfy GR-N8 (connection-oriented, reliable, in-order byte stream — see \"Transport model and assumptions\" above). Datagram/lossy transports are not a permitted extension without reworking the framing and correlation layers.\n234\t\n235\t---\n236\t\n237\t## 5. Delivery contract", "output_trunc": false, "duration": 97, "is_error": false, "interrupted": false, "mid": "a950299bcf093ab4f-57", "exit": 0}, {"kind": "thinking", "idx": 59, "summary": "I'm deciding where to place a new subsection about RPC-transport keepalive in the documentation—it m…", "body": "I'm deciding where to place a new subsection about RPC-transport keepalive in the documentation—it makes sense to insert it after section 4.3 about the bus.subscribe relay rather than after 4.4, since it's related to the rpc.Peer transport and inserting it later would create awkward numbering.", "truncated": false, "mid": "a950299bcf093ab4f-59"}, {"kind": "assistant", "idx": 60, "summary": "I'll insert a new subsection 4.4 for RPC-transport keepalive and renumber the existing 4.4 to 4.5.", "body": "I'll insert a new subsection 4.4 for RPC-transport keepalive and renumber the existing 4.4 to 4.5.", "truncated": false, "mid": "a950299bcf093ab4f-60", "out_tokens": 7}, {"kind": "tool", "idx": 61, "tool": "Edit", "summary": "/home/vscode/src/auto-stack-wt-041/docs/auto-bus-spec.md", "input": "{\"replace_all\":false,\"file_path\":\"/home/vscode/src/auto-stack-wt-041/docs/auto-bus-spec.md\",\"old_string\":\"### 4.4 Future transports (not implemented)\\n\\nThe following are documented as planned extensions:\",\"new_string\":\"### 4.4 RPC-transport keepalive (TCP / Unix / pipe)\\n\\nThe connection-oriented RPC transport (`rpc.Peer` over TCP, Unix-domain `SOCK_STREAM`, or in-process `net.Pipe()`) carries an **opt-in, application-level liveness** mechanism, mirroring the WebSocket 1-second ping model (section 4.2) at the `rpc.Peer` layer. It exists because GR-N8 makes reliable, in-order transports load-bearing: on such a transport a peer whose process was killed / NAT-dropped / rebooted leaves a **half-open** connection that produces no read error until someone writes. Without liveness nothing reaps it — a dead subscriber lingers in the hub's sink set and a pending `Call` on a non-cancelling context hangs forever.\\n\\n| Aspect | Detail |\\n|--------|--------|\\n| Opt-in | `rpc.WithKeepAlive(interval, timeout)`; default off, so existing callers/tests are behaviorally unchanged |\\n| Ping | A reserved `$keepalive` JSON-RPC notification is pushed every `interval` |\\n| Ping enqueue | Uses the same bounded, drop-on-full enqueue as `Notify` (a stalled writer closes the conn rather than blocking) |\\n| Reap | A watchdog closes the connection (via the normal shutdown path) when no inbound frame has been decoded within `timeout` |\\n| Swallowing | `$keepalive` is consumed by the transport; it is never forwarded to application notification handlers |\\n| Daemon defaults | 15s ping / 45s reap timeout (gentle, intra-VPC-appropriate) |\\n\\n**Why application-level (not OS `SetKeepAlive`):** the same mechanism covers all three transports including the in-process `net.Pipe()` fixture, and the timeout is deterministically testable with short durations.\\n\\n**Why a watchdog-close, not `SetReadDeadline`:** `Peer.conn` is typed `io.ReadWriteCloser` (not `net.Conn`), and a read deadline firing mid-frame leaves `json.Decoder` in a corrupted state. The watchdog calls the existing `shutdown` (closing the conn → the blocked `Decode` returns → `Serve` returns → every pending caller is released as `ErrClosed`), reusing the proven terminal-shutdown path identically across pipe/unix/tcp. This is the section 5 \\\"connection drop / half-open mid-call\\\" failure mode being actively detected rather than waited on.\\n\\nAny inbound frame — including the remote's own `$keepalive` ping — resets the silence window, so a healthy idle connection with keepalive enabled on both ends never false-reaps.\\n\\n### 4.5 Future transports (not implemented)\\n\\nThe following are documented as planned extensions:\"}", "input_trunc": false, "output": "The file /home/vscode/src/auto-stack-wt-041/docs/auto-bus-spec.md has been updated successfully. (file state is current in your context — no nee utines have drained.\n45\tfunc (s *Server) Serve(ctx context.Context) error {\n46\t\tvar wg sync.WaitGroup\n47\t\n48\t\t// When ctx is done, close the listener to unblock Accept.\n49\t\tgo func() {\n50\t\t\t<-ctx.Done()\n51\t\t\t_ = s.ln.Close()\n52\t\t}()\n53\t\n54\t\tfor {\n55\t\t\tconn, err := s.ln.Accept()\n56\t\t\tif err != nil {\n57\t\t\t\tselect {\n58\t\t\t\tcase <-ctx.Done():\n59\t\t\t\t\t// Clean shutdown: close all tracked peers, wait for goroutines.\n60\t\t\t\t\ts.closeAllPeers()\n61\t\t\t\t\twg.Wait()\n62\t\t\t\t\treturn nil\n63\t\t\t\tdefault:\n64\t\t\t\t\t// Fatal accept error.\n65\t\t\t\t\ts.closeAllPeers()\n66\t\t\t\t\twg.Wait()\n67\t\t\t\t\treturn err\n68\t\t\t\t}\n69\t\t\t}\n70\t\n71\t\t\tpeer := rpc.NewPeer(conn)\n72\t\t\ts.handlers.Register(peer)\n73\t\t\tsub := &subscription{}\n74\t\t\tregisterSubscribe(peer, s.hub, sub)\n75\t\n76\t\t\ts.mu.Lock()\n77\t\t\ts.peers[peer] = struct{}{}\n78\t\t\ts.mu.Unlock()\n79\t\n80\t\t\tif s.ctlEvents && s.hub != nil {\n81\t\t\t\tev, err := bus.NewEvent(bus.TypeCtlConnect, \"auto/watch/daemon\", nil)\n82\t\t\t\tif err == nil {\n83\t\t\t\t\ts.hub.Broadcast(ev)\n84\t\t\t\t}\n85\t\t\t}\n86\t\n87\t\t\twg.Go(func() {\n88\t\t\t\t_ = peer.Serve(ctx)\n89\t\n90\t\t\t\tsub.teardown()\n91\t\n92\t\t\t\ts.mu.Lock()\n93\t\t\t\tdelete(s.peers, peer)\n94\t\t\t\ts.mu.Unlock()\n95\t\n96\t\t\t\tif s.ctlEvents && s.hub != nil {\n97\t\t\t\t\tev, err := bus.NewEvent(bus.TypeCtlDisconnect, \"auto/watch/daemon\", nil)\n98\t\t\t\t\tif err == nil {\n99\t\t\t\t\t\ts.hub.Broadcast(ev)\n100\t\t\t\t\t}\n101\t\t\t\t}\n102\t\t\t})\n103\t\t}\n104\t}\n105\t\n106\t// closeAllPeers closes every tracked peer under the mutex.\n107\tfunc (s *Server) closeAllPeers() {\n108\t\ts.mu.Lock()\n109\t\tdefer s.mu.Unlock()\n110\t\tfor p := range s.peers {\n111\t\t\t_ = p.Close()\n112\t\t}\n113\t}\n114\t", "output_trunc": false, "duration": 104, "is_error": false, "interrupted": false, "mid": "a36029f61d3e68ebf-3", "exit": 0}, {"kind": "tool", "idx": 5, "tool" 0\t\t\tsnapshot = append(snapshot, entry)\n61\t\t}\n62\t\th.mu.RUnlock()\n63\t\n64\t\tfor _, entry := range snapshot {\n65\t\t\tentry.sink.Deliver(ev)\n66\t\t}\n67\t}\n68\t", "output_trunc": false, "duration": 97, "is_error": false, "interrupted": false, "mid": "a36029f61d3e68ebf-11", "exit": 0}, {"kind": "thinking", "idx": 13, "summary": "I need to understand how the test seam integrates with the constructor that takes line number, hub, …", "body": "I need to understand how the test seam integrates with the constructor that takes line number, hub, and control events, and figure out where the keepalive durations fit into this setup. Let me review the plan and context to see what guidance they provide.", "truncated": false, "mid": "a36029f61d3e68ebf-13"}, {"kind": "assistant", "idx": 14, "summary": "Let me read the plan and context for the specific guidance.", "body": "Let me read the plan and context for the specific guidance.", "truncated": false, "mid": "a36029f61d3e68ebf-14", "out_tokens": 3}, {"kind": "tool", "idx": 15, "tool": "Bash", "summary": "cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -i \"phase 3\\|G2\\|teardown\\|15s\\|45s\\|SinkCount\\|test seam\\|keepalive\\|keep-alive\\|AC-4\\|AC-10\" plan.html | …", "input": "{\"command\":\"cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -i \\\"phase 3\\\\|G2\\\\|teardown\\\\|15s\\\\|45s\\\\|SinkCount\\\\|test seam\\\\|keepalive\\\\|keep-alive\\\\|AC-4\\\\|AC-10\\\" plan.html | head -80\"}", "input_trunc": false, "output": "29:- **G2 — There is no liveness detection in the TCP/Unix transport, and GR-N8 makes that load-bearing.** `grep` confirms zero `keepalive` / `SetDeadline` / read-deadline / ping handling in `auto-shared/rpc/peer.go` or `auto-watch/internal/rpcserver/`. By committing to GR-N8 (connection-oriented, reliable, in-order transports — `docs/auto-bus-spec.md` §4), we made **liveness the only way to detect a dead peer**: on a reliable transport a peer whose process was killed / NAT-dropped / rebooted leaves a **half-open** connection that produces no read error until someone writes. Today nothing reaps it — a dead subscriber lingers in the hub's sink set (evicted only slowly/indirectly via drop-on-full, and only while events keep flowing) and a pending `Call` with a non-cancelling context hangs forever. This is the canonical \"works in a 5-minute manual test, fails in production\" failure. (Note: auto-ui's WebSocket path has a 1s ping per `docs/auto-bus-spec.md` §4.2; the new autowatch TCP/Unix RPC transport has no equivalent.)\n41:- **G2 — Add application-level liveness to the connection-oriented transport and prove dead peers are reaped.** Give `rpc.Peer` an application-level liveness mechanism — a periodic ping plus a read deadline, mirroring auto-ui's WebSocket 1s-ping model (§4.2) — so a half-open connection is detected within a bounded time, pending callers are released (connection death triggers `shutdown`, which fails waiters), and a dead subscriber is deregistered from the hub. Application-level (rather than OS `SetKeepAlive`) was chosen so the same mechanism covers all three conformance fixtures including the in-process pipe, and so the timeout is testable with fake clocks/conns. Exact ping interval and deadline values are tuned in /new-solution.\n49:        <pd-comment by=\"author\">Valid — the \"compose into make test\" wording contradicted the cgo-decoupling gap. Settled on one model and rewrote G1 (Goals) and the Test Strategy layer-1 to match: (a) `auto-shared` is added to the standard test loop so its existing tests are gated at all; (b) a dedicated `test-race` target (`go test -race` over `auto-shared`+`auto-watch`, `CGO_ENABLED=1`) runs as its **own required CI step**, kept **separate** from plain `make test` so cgo-less local runs stay fast. \"Compose into make test\" is removed. AC-10 now references `make test` (incl. auto-shared) + the new `make test-race`. The exact Makefile/ci.yml wiring is the Solution tab's job.<\/pd-comment>\n58:- **New product behavior or RPC methods.** This is assurance hardening of existing merged surface, plus the minimal transport change required for G2.\n64:- [x] **Scope split:** Keep all three (G1+G2+G3) in this one task as backbone hardening — single PR, single confidence goal.\n65:- [x] **G2 mechanism:** Application-level periodic ping + read deadline in `rpc.Peer` (mirrors the WebSocket ping model), chosen over OS-level TCP keepalive so it covers the in-process pipe fixture and is testable. Interval/deadline values tuned in /new-solution.\n67:- [x] **`Call` default deadline:** Resolved by the G2 mechanism — connection-liveness reap triggers `shutdown` which releases all pending callers, so a hung `Call` on a dead peer is bounded by the read deadline regardless of caller context. A separate per-call default timeout is unnecessary; caller context discipline remains documented as a constraint. (Confirm in /new-solution.)\n83:3. **Liveness tests (G2).** New unit tests for the keepalive mechanism (half-open → bounded reap; healthy-idle → no false reap) at the `rpc.Peer` layer, plus a server-level test that a dead subscriber's hub sink is reaped (no leak).\n114:        <pd-comment by=\"author\">Sharp catch — this was the hidden blocker under G1's premise. Adding `auto-shared` to the standard test loop is now an explicit (a) sub-goal of G1, called out in Test Strategy layer-1, and folded into AC-10's \"`make test` (now including `auto-shared`)\". Whether to add it to `PROJECTS` wholesale (which also pulls it i", "output_trunc": true, "duration": 129, "is_error": false, "interrupted": false, "mid": "a36029f61d3e68ebf-15", "exit": 0}, {"kind": "tool", "idx": 17, "tool": "Bash", "summary": "cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -i \"G2\\|server.go\\|subscribe.go\\|SinkCount\\|relay\\|dead-peer\\|dead peer\" context.md | head -60", "input": "{\"command\":\"cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -i \\\"G2\\\\|server.go\\\\|subscribe.go\\\\|SinkCount\\\\|relay\\\\|dead-peer\\\\|dead peer\\\" context.md | head -60\"}", "input_trunc": false, "output": "7:### RPC peer concurrency core (G2 lives here)\n34:### Server-side relay (G2 dead-peer leak surfaces here)\n35:- `auto-watch/internal/rpcserver/server.go:71-102` — accept loop: `rpc.NewPeer(conn)`, `handlers.Register(peer)`, `registerSubscribe(peer, hub, sub)`, track in `peers` map; Serve goroutine calls `peer.Serve(ctx)` then `sub.teardown()` then removes from map and broadcasts `ctl.disconnect`. **`teardown` runs only after `Serve` returns** — so the leak is caused by `Serve` never returning (the G2 gap), not by missing teardown. Harden: make `sub.teardown()` a `defer`.\n36:- `auto-watch/internal/rpcserver/subscribe.go:15-54` — `peerSink.Deliver` → `peer.Notify(ev.Type, ev)` (non-blocking, ignores ErrClosed); `registerSubscribe` subscribes the sink to the hub and stores the cancel; `subscription.teardown()` is idempotent.\n55:- **Task 040** (autowatch-event-ingest-relay, MERGED): added `bus.subscribe` + `peerSink` relay + host-stamping. The slow-subscriber drop-on-full path this task must conformance-test lives here.\n58:- **No drift:** all context.md line references confirmed current (peer.go struct@48, Serve@106, readLoop/Decode@147-151, Call@318, shutdown@473; conformance.go Fixture@40/FixtureFactory@51/Scenario@55/RunAcrossFixtures@65; fakes.go CountingConn@135, factories@239/263/327; server.go Serve@45, peer.Serve@88 → sub.teardown@90).\n59:- **Last-touched-by:** `auto-shared/rpc/*` + `conformance/` → `233f7cd` feat(030); `rpcserver/server.go`+`subscribe.go` + `bus/hub.go` → `f3430aa` feat(040); `Makefile` → `e712ce8`; `ci.yml` → `79c4382`.\n60:- **`hub.SinkCount()` already exists** — `auto-shared/bus/hub.go:44-48` (`RLock`; `len(h.sinks)`), added in feat(040) for test observability. AC-4's dead rror != nil {\n\t\tt.Errorf(\"error should be nil, got %+v\", got.Error)\n\t}\n}\n\nfunc TestRoundTripNotification(t *testing.T) {\n\tnotif := Request{\n\t\tJSONRPC: \"2.0\",\n\t\tMethod:  \"doc.changed\",\n\t\tParams:  json.RawMessage(`{\"path\":\"docs/plan.md\"}`),\n\t}\n\n\tvar buf bytes.Buffer\n\tenc := NewEncoder(&buf)\n\tif err := enc.Encode(notif); err != nil {\n\t\tt.Fatalf(\"encode: %v\", err)\n\t}\n\n\tdec := NewDecoder(&buf)\n\tvar got Request\n\tif err := dec.Decode(&got); err != nil {\n\t\tt.Fatalf(\"decode: %v\", err)\n\t}\n\n\tif got.JSONRPC != \"2.0\" {\n\t\tt.Errorf(\"jsonrpc = %q, want 2.0\", got.JSONRPC)\n\t}\n\tif got.ID != nil {\n\t\tt.Errorf(\"id should be nil for notification, got %s\", got.ID)\n\t}\n\tif got.Method != \"doc.changed\" {\n\t\tt.Errorf(\"method = %q, want doc.changed\", got.Method)\n\t}\n}\n\n// ---------------------------------------------------------------------------\n// AC-2: Numeric AND string id survive unchanged (json.RawMessage)\n// ---------------------------------------------------------------------------\n\nfunc TestNumericIDRoundTrip(t *testing.T) {\n\treq := Request{\n\t\tJSONRPC: \"2.0\",\n\t\tID:      json.RawMessage(`42`),\n\t\tMethod:  \"test.method\",\n\t}\n\n\tvar buf bytes.Buffer\n\tif err := NewEncoder(&buf).Encode(req); err != nil {\n\t\tt.Fatalf(\"encode: %v\", err)\n\t}\n\n\tvar got Request\n\tif err := NewDecoder(&buf).Decode(&got); err != nil {\n\t\tt.Fatalf(\"decode: %v\", err)\n\t}\n\tif string(got.ID) != `42` {\n\t\tt.Errorf(\"numeric id = %s, want 42\", got.ID)\n\t}\n}\n\nfunc TestStringIDRoundTrip(t *testing.T) {\n\treq := Request{\n\t\tJSONRPC: \"2.0\",\n\t\tID:      json.RawMessage(`\"req-abc-123\"`),\n\t\tMethod:  \"test.method\",\n\t}\n\n\tvar buf bytes.Buffer\n\tif err := NewEncoder(&buf).Encode(req); err != nil {\n\t\tt.Fatalf(\"encode: %v\", err)\n\t}\n\n\tvar got Request\n\tif err := NewDecoder(&buf).Decode(&got); err != nil {\n\t\tt.Fatalf(\"decode: %v\", err)\n\t}\n\tif string(got.ID) != e peer's write pump will block on the pipe,\n\t// and the enqueue channel will overflow.\n\n\t// Hammer notifications until we get ErrClosed.\n\tvar gotClosed bool\n\tfor range 1000 {\n\t\terr := peer.Notify(\"spam\", nil)\n\t\tif errors.Is(err, ErrClosed) {\n\t\t\tgotClosed = true\n\t\t\tbreak\n\t\t}\n\t}\n\n\tif !gotClosed {\n\t\tt.Error(\"expected ErrClosed from Notify after buffer overflow, but never got it\")\n\t}\n\n\tc2.Close()\n}\n\nfunc TestPendingCallReturnsOnEOF(t *testing.T) {\n\t// Terminal path (a): Serve hits EOF.\n\tc1, c2 := net.Pipe()\n\n\tpeer := NewPeer(c1)\n\n\tctx := t.Context()\n\n\tserveErr := make(chan error, 1)\n\tgo func() { serveErr <- peer.Serve(ctx) }()\n\n\t// Start a call in the background. The remote end has no handler and will\n\t// never respond — the call blocks until shutdown.\n\tcallResult := make(chan error, 1)\n\tgo func() {\n\t\tcallCtx, callCancel := context.WithTimeout(context.Background(), testTimeout)\n\t\tdefer callCancel()\n\t\t_, err := peer.Call(callCtx, \"anything\", nil)\n\t\tcallResult <- err\n\t}()\n\n\t// Give the call time to register, then close the remote end -> EOF.\n\ttime.Sleep(50 * time.Millisecond)\n\tc2.Close()\n\n\tselect {\n\tcase err := <-callResult:\n\t\tif !errors.Is(err, ErrClosed) {\n\t\t\tt.Errorf(\"Call returned %v, want ErrClosed\", err)\n\t\t}\n\tcase <-time.After(testTimeout):\n\t\tt.Fatal(\"Call did not return promptly on EOF\")\n\t}\n}\n\nfunc TestPendingCallReturnsOnContextCancel(t *testing.T) {\n\t// Terminal path (b): Serve's context is cancelled. The context watcher\n\t// goroutine closes the connection, which unblocks the readLoop's Decode\n\t// call, triggering shutdown. Pending calls return ErrClosed.\n\tc1, c2 := net.Pipe()\n\tdefer c2.Close()\n\n\tpeer := NewPeer(c1)\n\n\tctx, cancel := context.WithCancel(context.Background())\n\n\tserveErr := make(chan error, 1)\n\tgo func() { serveErr <- peer.Serve(ctx) }()\n\n\tcallResult := make(chan error, 1)\n\tgo func() {\n\t\tcallCtx, callCancel := context.WithTimeout(context.Background(), testTimeout)\n\t\tdefer callCancel()\n\t\t_, err := peer.Call(callCtx, \"anything\", nil)\n\t\tcallResult <- err\n\t}()\n\n\t// Give the call time to register, then cancel the serve context.\n\ttime.Sleep(50 * time.Millisecond)\n\tcancel()\n\n\tselect {\n\tcase err := <-callResult:\n\t\tif !errors.Is(err, ErrClosed) {\n\t\t\tt.Errorf(\"Call returned %v, want ErrClosed\", err)\n\t\t}\n\tcase <-time.After(testTimeout):\n\t\tt.Fatal(\"Call did not return promptly on context cancel\")\n===== CONCURRENT =====\n\nfunc TestConcurrentCallsNoCrosstalk(t *testing.T) {\n\thandlers := map[string]Handler{\n\t\t\"identity\": func(_ context.Context, params json.RawMessage) (any, error) {\n\t\t\t// Return params unchanged.\n\t\t\treturn params, nil\n\t\t},\n\t}\n\n\t// Use large buffers on both sides to accommodate concurrent calls.\n\tclient, _, cancel, _, _ := newPipePeers(t, handlers,\n\t\t[]Option{WithBufferSize(64)},\n\t\tWithBufferSize(64),\n\t)\n\tdefer cancel()\n\n\tconst n = 20\n\ttype result struct {\n\t\tidx int\n\t\tval int\n\t\terr error\n\t}\n\n\tresults := make(chan result, n)\n\n\tfor i := range n {\n\t\tgo func(idx int) {\n\t\t\tctx, c := context.WithTimeout(context.Background(), testTimeout)\n\t\t\tdefer c()\n\t\t\traw, err := client.Call(ctx, \"identity\", map[string]int{\"idx\": idx})\n\t\t\tif err != nil {\n\t\t\t\tresults <- result{idx: idx, err: err}\n\t\t\t\treturn\n\t\t\t}\n\t\t\tvar got map[string]int\n\t\t\t_ = json.Unmarshal(raw, &got)\n\t\t\tresults <- result{idx: idx, val: got[\"idx\"]}\n\t\t}(i)\n\t}\n\n\tfor range n {\n\t\tr := <-results\n\t\tif r.err != nil {\n\t\t\tt.Errorf(\"call %d: %v\", r.idx, r.err)\n\t\t\tcontinue\n\t\t}\n\t\tif r.val != r.idx {\n\t\t\tt.Errorf(\"call %d: got val %d (crosstalk)\", r.idx, r.val)\n\t\t}\n\t}\n}\n\n// ---------------------------------------------------------------------------\n// AC-2 / AC-3: keepalive (opt-in l", "output_trunc": true, "duration": 121, "is_error": false, "interrupted": false, "mid": "a1607684c39cf812a-19", "exit": 0}, {"kind": "thinking", "idx": 21, "summary": "I'm looking at the Phase 4 section in plan.html and checking the relevant parts of context.md to und…", "body": "I'm looking at the Phase 4 section in plan.html and checking the relevant parts of context.md to understand the faultConn/FaultFixture pd-api implementation and decision D-3.", "truncated": false, "mid": "a1607684c39cf812a-21"}, {"kind": "assistant", "idx": 22, "summary": "Let me read the plan and context for the specific API shapes and decisions.", "body": "Let me read the plan and context for the specific API shapes and decisions.", "truncated": false, "mid": "a1607684c39cf812a-22", "out_tokens": 3}, {"kind": "tool", "idx": 23, "tool": "Bash", "summary": "cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && python3 -c \" import re,html,sys t=open('plan.html').read() # strip tags crudely for kw in ['faultConn','FaultFixtur…", "input": "{\"command\":\"cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && python3 -c \\\"\\nimport re,html,sys\\nt=open('plan.html').read()\\n# strip tags crudely\\nfor kw in ['faultConn','FaultFixture','D-3','StallConsumer','ReleaseConsumer','Sever','drop-mid-call','slow-consumer','concurrent-correlation','RunAcrossFaultFixtures']:\\n    pass\\n\\\" 2>/dev/null\\ngrep -n -iE 'faultConn|FaultFixture|StallConsumer|ReleaseConsumer|Sever|RunAcrossFaultFixtures|D-3' plan.html | head -60\",\"description\":\"Find faultConn API references in plan.html\"}", "input_trunc": false, "output": "138:**When** the connection stays healthy for several keepalive intervals,\n162:**When** the connection is severed while a `Call` is in flight,\n240:**G3 — deepen the conformance suite.** A net-new `faultConn` wrapper (the harness has only the observational `CountingConn` today) adds two controllable faults: `Sever()` (close the underlying conn mid-stream) and a blocking-write stall (deterministically forces drop-on-full across unix/tcp, whose OS buffers otherwise absorb writes). A `FaultFixture` extension exposes the control handle to scenarios. Three new `Scenario`s — concurrent-call correlation, connection-drop-mid-call, slow-consumer drop-on-full — run across pipe/unix/tcp via `RunAcrossFixtures`. Two codec tests lock the `json.Decoder` framing property (byte-dribbled frame; two coalesced frames).\n251:        <pd-api kind=\"harness\" name=\"faultConn / FaultFixture\" lang=\"go\" path=\"auto-shared/rpc/conformance/fakes.go\">\n252:          <pd-member kind=\"type\" sig=\"type faultConn struct { net.Conn; ... }\">Wraps a fixture conn. Sever() closes the underlying conn mid-stream; Stall()/Release() make Write block then unblock, simulating a stalled reader for drop-on-full.<\/pd-member>\n253:          <pd-member kind=\"interface\" sig=\"FaultFixture interface { Fixture; Sever(); StallConsumer(); ReleaseConsumer() }\">Fault-capable extension of Fixture; fault scenarios type-assert to it. Built by fault-capable variants of the pipe/unix/tcp factories.<\/pd-member>\n264:          <pd-file path=\"auto-shared/rpc/conformance/fakes.go\" change=\"edit\">Add `faultConn` wrapper + fault-capable pipe/unix/tcp fixture factories returning a FaultFixture.<\/pd-file>\n265:          <pd-file path=\"auto-shared/rpc/conformance/conformance.go\" change=\"edit\">Add the `FaultFixture` interface (Fixture + Sever/StallConsumer/ReleaseConsumer).<\/pd-file>\n268:          <pd-file path=\"auto-watch/internal/rpcserver/server_test.go\" change=\"edit\">Add TestDeadSubscriberSinkReaped (subscribe → sever → bounded return to baseline via the existing `hub.SinkCount()`).<\/pd-file>\n282:- **\"Don't read\" to trigger drop-on-full in conformance.** Non-deterministic on unix/tcp (OS socket buffers absorb writes before blocking). Rejected for a blocking-write `faultConn` that forces the condition on every transport.\n303:      <pd-decision id=\"D-3\" title=\"Blocking faultConn for deterministic drop-on-full across transports\" status=\"accepted\" by=\"author\" summary=\"OS socket buffers make 'don't read' non-deterministic on unix/tcp; a blocking-write conn forces the condition everywhere.\">\n305:**Rationale:** The slow-consumer/drop-on-full scenario must behave identically on pipe/unix/tcp. On unix/tcp the kernel buffers absorb writes, so simply not reading is flaky. A `faultConn` whose `Write` blocks on demand deterministically fills the peer's bounded `out` channel → enqueue fails → drop-on-full → shutdown.\n307:**Consequences:** net-new harness code (`faultConn` + fault-capable factories + `FaultFixture`).\n357:5. Add `TestKeepAliveReapsHalfOpen` (fault/throwaway conn that swallows bytes → within a bounded wait `Serve` returns and a pending `Call` gets `ErrClosed`) and `TestKeepAliveNoFalseReapWhenHealthy` (idle-but-alive over several intervals → a late `Call` still succeeds). Use short durations / an injected clock for determinism — never poll-to-settle. **Verify:** `CGO_ENABLED=1 go test -race ./rpc/...` green.\n368:3. Add `TestDeadSubscriberSinkReaped`: a peer calls `bus.subscribe` (assert `hub.SinkCount()` increments), then its connection is severed; within a bounded wait `SinkCount()` returns to baseline and a subsequent `hub.Broadcast` does not target the dead peer. Use a short test keepalive timeout. **Verify:** `CGO_ENABLED=1 go test -race ./internal/rpcserver/...` green.\n375:1. Add a `faultConn` wrapper in fakes.go: `Sever()` (close underlying conn mid-stream) and `Stall()`/`Release()` (block/unblock `Write` to force drop-on-full). **Verify:** build.\n376:2. Add the `FaultFixture` interface (`Fixture`", "output_trunc": true, "duration": 161, "is_error": false, "interrupted": false, "mid": "a1607684c39cf812a-23", "exit": 0}, {"kind": "thinking", "idx": 25, "summary": "I'm reviewing the context documentation and looking at the acceptance criteria for the Verification …", "body": "I'm reviewing the context documentation and looking at the acceptance criteria for the Verification section, specifically AC-5 through AC-8 and AC-10.", "truncated": false, "mid": "a1607684c39cf812a-25"}, {"kind": "assistant", "idx": 26, "summary": "Let me check the context.md sections and the AC verification details.", "body": "Let me check the context.md sections and the AC verification details.", "truncated": false, "mid": "a1607684c39cf812a-26", "out_tokens": 6}, {"kind": "tool", "idx": 27, "tool": "Bash", "summary": "cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -iE 'AC-5|AC-6|AC-7|AC-8|AC-10|pending map|StallConsumer|which side|consumer|sever' plan.html | head -40 &&…", "input": "{\"command\":\"cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && grep -n -iE 'AC-5|AC-6|AC-7|AC-8|AC-10|pending map|StallConsumer|which side|consumer|sever' plan.html | head -40 && echo \\\"===CONTEXT===\\\" && grep -n -iE 'CountingConn|fault|StallConsumer|which side|consumer|drop-on-full|pending|G3|framing|coalesc|dribble' context.md | head -40\",\"description\":\"Find AC details and context sections\"}", "input_trunc": false, "output": "30:- **G3 — Conformance proves transport-invariance only for the trivial path.** The harness shape is right — `auto-shared/rpc/conformance.RunAcrossFixtures` runs a `Scenario` against pipe / Unix / TCP fixtures — but it runs **one** scenario (`echo-and-push`). Every *hard* coordination behavior (concurrent in-flight call correlation, connection-drop-mid-call, slow-consumer drop-on-full) is proven **pipe-only** in `auto-shared/rpc/peer_test.go`, never across Unix/TCP, which is exactly where connection-layer bugs live. A conn wrapper (`CountingConn`) exists in `conformance/fakes.go` but is **observational only** (it counts reads/writes); fault injection (close-mid-stream, blocking-write) is net-new code this task adds.\n42:- **G3 — Deepen the conformance suite to prove transport-invariance of the hard behaviors.** Make the scenario list data-driven and run each across all three fixtures (pipe/Unix/TCP): (1) N concurrent in-flight calls correlate with no crosstalk; (2) connection dropped mid-call releases pending callers and empties the `pending` map (via a new fault-injecting conn wrapper added to the harness — `CountingConn` today only counts); (3) a slow consumer triggers drop-on-full while the broadcaster keeps serving other peers. Plus one decoder test for split/coalesced frames (a `json.Decoder` property, not a per-transport matrix — GR-N8/§4).\n49:        <pd-comment by=\"author\">Valid — the \"compose into make test\" wording contradicted the cgo-decoupling gap. Settled on one model and rewrote G1 (Goals) and the Test Strategy layer-1 to match: (a) `auto-shared` is added to the standard test loop so its existing tests are gated at all; (b) a dedicated `test-race` target (`go test -race` over `auto-shared`+`auto-watch`, `CGO_ENABLED=1`) runs as its **own required CI step**, kept **separate** from plain `make test` so cgo-less local runs stay fast. \"Compose into make test\" is removed. AC-10 now references `make test` (incl. auto-shared) + the new `make test-race`. The exact Makefile/ci.yml wiring is the Solution tab's job.<\/pd-comment>\n56:- **The auto-ui consumer half (epic-003 Tasks 7–10).** Multi-host aggregation, proxy/backends config, the SPA, and the final hook cut-over are separate tasks; this task hardens the per-host backbone they will build on.\n101:  P1 & P2 & P3 --> SC[\"scenarios:<br/>concurrent-correlation<br/>drop-mid-call<br/>slow-consumer drop-on-full\"]\n114:        <pd-comment by=\"author\">Sharp catch — this was the hidden blocker under G1's premise. Adding `auto-shared` to the standard test loop is now an explicit (a) sub-goal of G1, called out in Test Strategy layer-1, and folded into AC-10's \"`make test` (now including `auto-shared`)\". Whether to add it to `PROJECTS` wholesale (which also pulls it into fmt-check/vet/lint/vulncheck) or to a narrower test-only loop is a Solution-tab decision; the requirement that its concurrency tests join the aggregate gate is now firm.<\/pd-comment>\n138:**When** the connection stays healthy for several keepalive intervals,\n151:        <pd-ac id=\"AC-5\" title=\"Concurrent call correlation holds across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n159:        <pd-ac id=\"AC-6\" title=\"Connection drop mid-call releases pending callers across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n162:**When** the connection is severed while a `Call` is in flight,\n167:        <pd-ac id=\"AC-7\" title=\"Slow consumer triggers drop-on-full without blocking the producer, across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n169:**Given** a fixture whose consumer stalls (a blocking-write fault conn) over pipe, unix, and tcp,\n175:        <pd-ac id=\"AC-8\" title=\"Codec decodes split and coalesced frames correctly\" phases=\"4\" tests=\"auto-shared/rpc/codec_test.go\">\n196:        <pd-ac id=\"AC-10\" title=\"No regressions and guard rails upheld\" phases=\"1,2,3,4,5\" tests=\"auto-shared/rpc/p", "output_trunc": true, "duration": 153, "is_error": false, "interrupted": false, "mid": "a1607684c39cf812a-27", "exit": 0}, {"kind": "thinking", "idx": 29, "summary": "I need to dive deeper into the AC-6, AC-7, and AC-8 requirements, especially around the severing and…", "body": "I need to dive deeper into the AC-6, AC-7, and AC-8 requirements, especially around the severing and stalling mechanics and which side initiates them—let me check the specific section of the plan document.", "truncated": false, "mid": "a1607684c39cf812a-29"}, {"kind": "tool", "idx": 30, "tool": "Bash", "summary": "cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && sed -n '151,200p' plan.html", "input": "{\"command\":\"cd /home/vscode/src/auto-stack-wt-041/docs/tasks/041-dataplane-backbone-assurance && sed -n '151,200p' plan.html\",\"description\":\"Read AC-5 through AC-8 full text\"}", "input_trunc": false, "output": "        <pd-ac id=\"AC-5\" title=\"Concurrent call correlation holds across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n          <md><script type=\"text/plain\">\n**Given** the conformance harness over pipe, unix, and tcp,\n**When** N concurrent `Call`s run against an identity handler,\n**Then** on every transport each response correlates to its own request with zero crosstalk, under `go test -race`. (Promotes `TestConcurrentCallsNoCrosstalk` from pipe-only to transport-invariant.)\n          <\/script><\/md>\n        <\/pd-ac>\n\n        <pd-ac id=\"AC-6\" title=\"Connection drop mid-call releases pending callers across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n          <md><script type=\"text/plain\">\n**Given** a fault-injecting fixture over pipe, unix, and tcp,\n**When** the connection is severed while a `Call` is in flight,\n**Then** on every transport the pending caller returns `ErrClosed` promptly (bounded timeout) and the `pending` map is empty afterward (no leaked waiter).\n          <\/script><\/md>\n        <\/pd-ac>\n\n        <pd-ac id=\"AC-7\" title=\"Slow consumer triggers drop-on-full without blocking the producer, across all three transports\" phases=\"4\" tests=\"auto-shared/rpc/conformance/conformance_test.go\">\n          <md><script type=\"text/plain\">\n**Given** a fixture whose consumer stalls (a blocking-write fault conn) over pipe, unix, and tcp,\n**When** the producer pushes beyond the bounded outbound buffer,\n**Then** on every transport the slow connection is dropped (`ErrClosed`) and the producer never blocks — the documented at-most-once / drop-on-full application policy (bus-spec §5). Asserted via the producer's error and a bounded timeout, never quiescence.\n          <\/script><\/md>\n        <\/pd-ac>\n\n        <pd-ac id=\"AC-8\" title=\"Codec decodes split and coalesced frames correctly\" phases=\"4\" tests=\"auto-shared/rpc/codec_test.go\">\n          <md><script type=\"text/plain\">\n**Given** the NDJSON codec,\n**When** a single frame is delivered one byte at a time, and when two frames arrive coalesced in a single read,\n**Then** `Decode` yields exactly one correct value per frame in both cases — locking the `json.Decoder` framing property GR-N8 §4 relies on (a codec property, asserted once, not a per-transport matrix).\n          <\/script><\/md>\n        <\/pd-ac>\n\n        <pd-ac id=\"AC-9\" title=\"Mutation kill-tests prove the suite catches coordination breaks\" phases=\"5\" tests=\"docs/tasks/041-dataplane-backbone-assurance/artifacts/\">\n          <md><script type=\"text/plain\">\n**Given** the hardened suite,\n**When** each of three mutations is injected one at a time — (a) swapped/duplicated `pending`-map key → crosstalk, (b) removed drop-on-full → producer hang, (c) disabled liveness reap → leaked peer / non-returning `Serve`,\n**Then** a specific named test or conformance scenario turns red for each mutation, the red run output is captured in `docs/tasks/041-dataplane-backbone-assurance/artifacts/`, and the mutation is reverted (one-time evidence, not a permanent gate).\n          <\/script><\/md>\n        <\/pd-ac>\n\n        <pd-thread anchor=\"AC-9\" status=\"resolved\" priority=\"p3\" title=\"Mutation artifacts directory does not exist in the task folder\">\n          <pd-comment by=\"review\">AC-9 requires capturing red run output in `docs/tasks/041-dataplane-backbone-assurance/artifacts/`. Current task folder (list_dir) contains only context.md + plan.html; no artifacts/ yet. Solution/plan must create it (or the evidence files) and commit the captured red outputs as documentation that the suite detects the injected faults. Revert mutations after capture.<\/pd-comment> <script>
const D = window.__SESSION__;
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtDur = ms => { if(!ms) return ''; const s=ms/1000; if(s<60) return s.toFixed(s<10?1:0)+'s'; const m=Math.floor(s/60); return m+'m'+String(Math.round(s%60)).padStart(2,'0')+'s'; };
const fmtTok = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'k':String(n||0);

let agentSeq = 0;
function agentId(){ return 'ag'+(agentSeq++); }

/* ---------- header ---------- */
function renderHeader(){
  const c = D.counts, sub = countTree(D);
  document.getElementById('header').innerHTML = `
    <div class="hdr">
      <h1>${esc(D.title || D.dispatch_label || 'Session')}</h1>
      <div class="sub">${esc(D.id)} · ${esc(D.model)} · ${esc(D.workspace)}</div>
      <div class="intent" onclick="this.classList.toggle('open')">${esc(D.intent)||'<i>no intent</i>'}</div>
      <div class="stats">
        <span class="chip"><b>${fmtDur(D.duration_ms)}</b> wall</span>
        <span class="chip"><b>${fmtTok(D.total_tokens)}</b> tokens</span>
        <span class="chip"><b>${D.msg_count}</b> msgs</span>
        <span class="chip"><b>${sub.agent}</b> sub-agents</span>
        <span class="chip"><b>${sub.bash}</b> bash</span>
        <span class="chip"><b>${sub.file}</b> file ops</span>
        <span class="chip"><b>${sub.error}</b> errors</span>
      </div>
    </div>`;
}
function countTree(n){
  const t={agent:0,bash:0,file:0,error:0,skill:0,tool:0};
  (function walk(x){ for(const k in t) t[k]+=(x.counts[k]||0);
    for(const e of x.events) if(e.kind==='agent'&&e.child) walk(e.child); })(n);
  return t;
}

/* ---------- table of contents (work graph) ---------- */
function renderToc(){
  const out=[];
  (function walk(n, dispatch){
    const label = dispatch || (n.subagent_name? n.subagent_name : 'coordinator');
    out.push(`<button class="toc-item" onclick="jump('${n._aid}')">
        <div class="tlabel">${esc(label)}${n.is_subagent?'<span class="toc-badge">sub</span>':''}</div>
        <div class="tmeta">${fmtDur(n.duration_ms)} · ${fmtTok(n.total_tokens)} · ${n.counts.agent||0}▸</div>
      </button>`);
    const kids=n.events.filter(e=>e.kind==='agent'&&e.child);
    if(kids.length){ out.push('<div class="toc-sub">');
      kids.forEach(e=>walk(e.child, e.summary)); out.push('</div>'); }
  })(D, D.dispatch_label);
  document.getElementById('toc').innerHTML=out.join('');
}
function jump(aid){
  const el=document.getElementById(aid);
  if(!el) return;
  let p=el; while(p){ if(p.classList&&p.classList.contains('agent')) p.classList.remove('collapsed'); p=p.parentElement; }
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.animate([{background:'#f0e6dc'},{background:'transparent'}],{duration:1200});
}

/* ---------- timeline ---------- */
const TOOL_LABEL={Bash:'$ bash',Read:'read',Write:'write',Edit:'edit',Glob:'glob',
  NotebookEdit:'edit nb',Skill:'skill',Grep:'grep',ToolSearch:'search',
  TaskCreate:'task +',TaskUpdate:'task ~',TaskGet:'task ?',SendMessage:'message',
  WebFetch:'web',WebSearch:'web',Agent:'▸ agent'};
function icoFor(e){
  if(e.kind==='user') return 'USER';
  if(e.kind==='assistant') return 'say';
  if(e.kind==='thinking') return 'think';
  if(e.kind==='agent') return '▸ agent';
  if(e.kind==='tool') return TOOL_LABEL[e.tool] || e.tool.toLowerCase();
  return e.kind;
}
function kindClass(e){
  if(e.kind!=='tool') return 'k-'+e.kind;
  if(e.tool==='Bash') return 'k-bash';
  if(['Read','Write','Edit','Glob','NotebookEdit'].includes(e.tool)) return 'k-file';
  if(e.tool==='Skill') return 'k-skill';
  return 'k-tool';
}
function filterKey(e){
  if(e.kind==='thinking') return 'thinking';
  if(e.kind==='assistant') return 'assistant';
  if(e.kind==='user'||e.kind==='agent') return null; // never filtered
  if(e.tool==='Bash') return 'bash';
  if(['Read','Write','Edit','Glob','NotebookEdit'].includes(e.tool)) return 'file';
  return 'tool';
}
function truncNote(t){ return t?'\n<span class="trunc">… truncated — auto search message get …</span>':''; }

function evBody(e){
  let h='';
  if(e.kind==='agent'){
    h += `<span class="seg-label">prompt</span>${esc(e.prompt)}${e.prompt_trunc?'<span class="trunc"> …truncated</span>':''}`;
    h += `<span class="seg-label">result</span>${esc(e.result)||'<i>—</i>'}${e.result_trunc?'<span class="trunc"> …truncated</span>':''}`;
    return h;
  }
  if(e.kind==='tool'){
    h += `<span class="seg-label">input</span>${esc(e.input)||'<i>—</i>'}${e.input_trunc?'<span class="trunc"> …truncated</span>':''}`;
    h += `<span class="seg-label">output</span>${esc(e.output)||'<i>—</i>'}${e.output_trunc?'<span class="trunc"> …truncated</span>':''}`;
    return h;
  }
  return esc(e.body)+ (e.truncated?'<span class="trunc"> …truncated</span>':'');
}
function evMeta(e){
  const m=[];
  if(e.kind==='tool'){
    if(e.tool==='Bash'){ if(e.exit) m.push('<span class="badge err">exit '+e.exit+'</span>'); }
    if(e.is_error) m.push('<span class="badge err">error</span>');
    if(e.interrupted) m.push('<span class="badge err">interrupted</span>');
    if(e.duration>=10000) m.push('<span class="badge slow">'+fmtDur(e.duration)+'</span>');
    else if(e.duration) m.push('<span class="meta">'+fmtDur(e.duration)+'</span>');
  }
  if(e.kind==='assistant'&&e.out_tokens>2000) m.push('<span class="meta">'+fmtTok(e.out_tokens)+'t</span>');
  if(e.kind==='agent'){ m.push('<span class="meta">'+fmtDur(e.child?e.child.duration_ms:e.duration)+'</span>'); }
  return m.join(' ');
}

function renderEvent(e){
  if(e.kind==='agent' && e.child){
    return renderAgent(e.child, e.summary);
  }
  const fk=filterKey(e);
  const div=document.createElement('div');
  div.className='ev '+kindClass(e)+(fk?(' filt-'+fk):'');
  div.innerHTML=`<div class="ev-head">
      <span class="ico">${esc(icoFor(e))}</span>
      <span class="sum">${esc(e.summary)||'<i>—</i>'}</span>
      <span class="meta">${evMeta(e)}</span>
    </div>
    <div class="ev-body">${evBody(e)}</div>`;
  div.querySelector('.ev-head').addEventListener('click',()=>div.classList.toggle('open'));
  return div;
}

function renderAgent(n, dispatch){
  n._aid = agentId();
  const wrap=document.createElement('div');
  wrap.className='agent depth'+(n.depth>2?2:n.depth);
  wrap.id=n._aid;
  const label = dispatch || n.subagent_name || 'coordinator';
  const head=document.createElement('div');
  head.className='agent-head';
  head.innerHTML=`<span class="caret">▾</span>
     <span class="alabel">▸ ${esc(label)}</span>
     <span class="atype">${esc(n.subagent_type||n.subagent_name||'')}</span>
     <span class="jump">${fmtDur(n.duration_ms)} · ${fmtTok(n.total_tokens)} · ${n.msg_count} msgs · ${n.counts.bash} bash · ${n.counts.file} file · ${n.counts.agent}▸</span>`;
  const body=document.createElement('div');
  body.className='agent-body';
  for(const e of n.events){ const el=renderEvent(e); if(el) body.appendChild(el); }
  head.addEventListener('click',()=>{ wrap.classList.toggle('collapsed');
    head.querySelector('.caret').textContent=wrap.classList.contains('collapsed')?'▸':'▾'; });
  wrap.appendChild(head); wrap.appendChild(body);
  return wrap;
}
// collapse styling
const st=document.createElement('style');
st.textContent='.agent.collapsed>.agent-body{display:none}';
document.head.appendChild(st);

function setAll(open){
  document.querySelectorAll('.ev').forEach(d=>d.classList.toggle('open',open));
  document.querySelectorAll('.agent').forEach(d=>{ if(d.classList.contains('depth0'))return;
    d.classList.toggle('collapsed',!open);
    const c=d.querySelector(':scope>.agent-head .caret'); if(c)c.textContent=open?'▾':'▸'; });
}
function applyFilters(){
  const on=k=>document.getElementById('f-'+k).checked;
  ['thinking','file','assistant','bash','tool'].forEach(k=>{
    document.querySelectorAll('.filt-'+k).forEach(d=>d.classList.toggle('hidden',!on(k)));
  });
}
// "Structure only" = the work skeleton: keep bash/other-tools/agents/users,
// drop thinking, assistant prose, and file reads/writes.
function preset(mode){
  const struct = mode==='structure';
  document.getElementById('f-thinking').checked = !struct;
  document.getElementById('f-file').checked = !struct;
  document.getElementById('f-assistant').checked = !struct;
  document.getElementById('f-bash').checked = true;
  document.getElementById('f-tool').checked = true;
  applyFilters();
}

renderHeader();
document.getElementById('timeline').appendChild(renderAgent(D, D.dispatch_label));
renderToc();
applyFilters();
</script>
</body>
