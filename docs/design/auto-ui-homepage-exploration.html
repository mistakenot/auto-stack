<pd-tab name="Overview">

  <pd-section id="context" title="What auto-ui is today">
    <md><script type="text/plain">
Auto-ui is a **self-contained local web dashboard** (Preact + htm SPA, no build step) that serves as a planning-docs explorer. It connects to one or more autowatch daemon backends via WebSocket JSON-RPC 2.0, aggregates projects across hosts, and renders planning documents (markdown + HTML) in a two-pane layout with real-time updates.

**Current views:** Explorer (`#/explore`) with sidebar tree + content pane, and Debug (`#/debug`) with connection/event diagnostics.

**Current aesthetic:** "Drafting table" — warm cream `#f6f2ea`, charcoal `#211e19`, terracotta accent `#c75b39`. Hanken Grotesk / JetBrains Mono / Newsreader type stack.
    </script></md>
  </pd-section>

  <pd-section id="data-sources" title="Available data sources">
    <md><script type="text/plain">
The broader auto-stack has rich data that auto-ui currently does not surface:

| Source | Tool | What it has |
|--------|------|-------------|
| Planning docs + execution state | auto-watch | Task status, branch, PR, review state, executor liveness |
| Session history | auto-etl + auto-search | Normalized agent sessions (messages, tool calls, files touched, durations) |
| Reflection rules | auto-reflect | Extracted playbook rules with lifecycle (draft → confirmed → stale) |
| Code context graphs | auto-graph | File-level import graphs, context packs |
| Evidence artifacts | auto-artifact | Public S3 URLs for screenshots, videos, logs |
| Bus events | auto-watch | Real-time typed events (doc.changed, task.start, etc.) |
    </script></md>
  </pd-section>

<!-- ───────────────── Concept A: Mission Control ───────────────── -->
<pd-tab name="A: Mission Control">

  <pd-section id="mc-thesis" title="Thesis">
    <md><script type="text/plain">
You're running a fleet of AI coding agents. This is your command center. The home page gives you **operational awareness at a glance** — what's active, what completed, what needs you.

The signature element is the **Session Pulse**: a live sparkline showing agent activity rhythm over the last 24 hours. It answers the question "are my agents working?" without reading a single number.
    </script></md>
  </pd-section>

  <pd-section id="mc-visual" title="Visual direction">
    <md><script type="text/plain">
- **Background:** Dark charcoal `#1a1a1a` — not black, not navy. Warm enough to feel intentional.
- **Text:** Warm cream `#e8e0d0` for primary, `#9a9080` for secondary.
- **Status triad:** Green `#6f9a5f` (healthy/done), amber `#c79030` (in progress/warning), red `#c4452f` (failed/blocked). These are the ONLY colors that pop.
- **Type:** Hanken Grotesk for labels and section headers. JetBrains Mono for data values (task IDs, durations, counts). Monospace carries the operational feel.
- **Event stream type color:** Each event type gets its own muted color for the type badge: `#58a6ff` blue for doc events, `#d29922` amber for task events, `#3fb950` green for session events, `#bc8cff` purple for rule events, `#9a9080` grey for system events.
- **Layout:** Single-column, full-width. Six stacked zones with clear 1px borders. Dense but breathing — generous padding within zones, tight between data rows.
- **Signature risk:** The sparkline uses Unicode block characters (▁▂▃▅▇█) rendered in a gradient from green (low activity) through amber to the accent color (peak). It's alive — it updates as sessions start and end.
    </script></md>
  </pd-section>

  <pd-section id="mc-zones" title="Zone breakdown">
    <md><script type="text/plain">
**Header bar** — Brand mark ("AUTO"), view label ("Mission Control"), active agent count with lightning bolt, current time. Minimal. The active count is the single most important number on the page.

**Active Now** — Live list of executing/waiting tasks. Each row: status dot (● active, ○ waiting), task ID, current phase description, project name, time since last activity. Rows sorted by recency. Clicking drills into the planning doc. This zone disappears when nothing is active (the page breathes).

**Recent + Attention** — Side-by-side split. Recent: last N completed/failed tasks with ✓/✗ markers, plus today's session count. Attention: items that need human input — stale docs, pending reviews, draft rules awaiting confirmation. Attention items are the "to-do list" the dashboard generates for you.

**Session Pulse + Projects** — Side-by-side. Pulse: the 24-hour sparkline of session activity (Unicode blocks) with today's aggregate stats. Projects: one row per registered project with a mini progress bar (filled dots = active tasks). Compact reference panels.

**Event Stream** — Anchored to the bottom of the page, below a full-width separator. Grows downward — newest events at top, older ones scroll off the bottom edge of the viewport. This positioning means it never pushes the actionable zones (Active Now, Attention) out of view, and it feels like a log tail pinned to the floor of the control room.

Each line has three columns:

| Column | Width | Content |
|--------|-------|---------|
| Timestamp | fixed | `HH:MM:SS` in secondary text |
| Event type | fixed | Badge-colored by category: `doc.changed`, `task.start`, `session.end`, `rule.fire`, `commit.push`, `hook.fire` |
| Context | flex | Project name + snippet preview of the payload — a truncated file path, commit message first line, rule ID + title, session hash + duration, or hook command |

The stream pauses on hover (so you can read/click) and resumes on mouse-out. A `[pause]` toggle pins it. A `[▾ all]` dropdown filters by event type. Clicking any row navigates to the relevant detail (planning doc, session, rule). Connects to the existing WebSocket notifications and extends to all bus event types as they become available.
    </script></md>
  </pd-section>

  <pd-section id="mc-strengths" title="Strengths and risks">
    <md><script type="text/plain">
**Strengths:**
- Answers "what's happening?" in under 2 seconds
- The event stream is addictive — like `tail -f` but structured and color-coded
- The pulse sparkline is genuinely novel — no other dev tool shows agent activity rhythm this way
- Scales naturally: more agents = more rows, more events = richer stream
- Dark theme is practical for always-on monitoring
- The stream gives the page life even when no tasks are actively executing — hooks, commits, and doc changes keep flowing

**Risks:**
- Could feel generic "ops dashboard" if the zones aren't curated carefully
- Event stream needs careful empty-state design (when nothing has happened yet)
- High event volume could make the stream noisy — the type filter and pause controls are essential
- The dark charcoal is close to GitHub dark mode — needs the warm cream text and status colors to differentiate
    </script></md>
  </pd-section>

</pd-tab>

<!-- ───────────────── Concept B: The Logbook ───────────────── -->
<pd-tab name="B: The Logbook">

  <pd-section id="lb-thesis" title="Thesis">
    <md><script type="text/plain">
This tool records what happened. The home page should *tell the story of the day*. Not in cards, not in grids — in a **chronological narrative** where events from every subsystem interleave into a single timeline. You open the page and read down: here's what your agents did today, in order.

The signature element is **temporal organization itself**. There is no "dashboard" — there's a log. Like a captain's logbook, each entry is a moment in time.
    </script></md>
  </pd-section>

  <pd-section id="lb-visual" title="Visual direction">
    <md><script type="text/plain">
- **Background:** Warm cream `#f5f1e8` — closer to paper than screen.
- **Text:** Deep charcoal `#1a1714` for primary. Event metadata in `#8a7f6f`.
- **Type:** Newsreader (serif) is the star — used for log entries and the date header, giving the page a journal quality. Hanken Grotesk for navigation and instruments (sans-serif ground for the serif figure). The type scale is generous: the date header is large and unhurried.
- **Layout:** Single column, wide margin, no sidebar. The log is a vertical list. Below it, two small panels (Navigate / Instruments) sit side by side as compact reference — they're the "back pages" of the logbook.
- **Color:** Almost monochrome. Event types get a thin 3px left border in muted tones: green for completions, amber for starts, blue for extractions, red for failures. But the palette never shouts — it tints.
- **Signature risk:** The spaced letterspacing on "A U T O" in the header, the serif body, and the single-column flow are this page's personality. It reads like a printed artifact in a world of dashboards. The risk is that it feels too calm for an operational tool — but the argument is: calm *is* the point. If everything is fine, the page should feel quiet.
    </script></md>
  </pd-section>

  <pd-section id="lb-zones" title="Zone breakdown">
    <md><script type="text/plain">
**Header** — "A U T O" in wide letterspacing, a thin rule, and today's date in full human format ("Saturday, 28 June 2026"). No status indicators, no counts, no badges. The date IS the header. This is the one moment where the design pauses.

**The Log** — A vertical list of events, grouped by day ("Today", "Yesterday", then ISO dates). Each entry: timestamp (HH:MM), then a single sentence describing what happened. Events come from all subsystems — task lifecycle, session starts/ends, rule extractions, doc changes, merges, failures. They're interleaved into one stream.

Event types are distinguished by a subtle left-border color (3px), not icons:
- Green: something completed (task merged, session ended)
- Amber: something started (task began, execution dispatched)
- Blue: something was learned (rules extracted, playbook updated)
- Red: something failed (task failed, session errored)

Clicking any log entry navigates to the relevant detail view (planning doc, session transcript, rule).

**Navigate** — Four links to the main views, each with a count in parentheses. This is the site nav — compact, scannable, always at the bottom.

**Instruments** — Four key metrics, no charts. Just numbers and words. "Sessions: 12 today", "Rules: 47 confirmed", "Docs: 2 stale", "Health: all green". The dashboard-in-a-paragraph.
    </script></md>
  </pd-section>

  <pd-section id="lb-strengths" title="Strengths and risks">
    <md><script type="text/plain">
**Strengths:**
- Genuinely distinctive — no other developer tool looks like this
- The single timeline answers "what happened?" with zero cognitive load
- The editorial aesthetic is memorable and calming
- Works beautifully at any data scale (few events → clean, many events → rich narrative)
- The serif type + cream background is a real departure from every developer dashboard

**Risks:**
- May feel too passive — no operational urgency, no "action items"
- The Attention/to-do concept from Mission Control has no home here — you discover problems by reading, not by being alerted
- The lack of structure (no zones, no grids) may frustrate users who want to scan patterns rather than read linearly
- The warm cream + serif is intentionally close to the current "drafting table" palette — might not feel like a refresh
    </script></md>
  </pd-section>

</pd-tab>

<!-- ───────────────── Concept C: Nerve Center ───────────────── -->
<pd-tab name="C: Nerve Center">

  <pd-section id="nc-thesis" title="Thesis">
    <md><script type="text/plain">
For the power user who wants everything visible without clicking. Four quadrants, always on screen. A live event ticker in the center. Keyboard-driven navigation throughout. This is the **Bloomberg terminal for autonomous coding** — maximum information density, minimum interaction cost.

The signature element is the **live event feed**: a real-time ticker streaming every event across all agents and projects, color-coded by type, scrolling like a terminal log but organized and filterable.
    </script></md>
  </pd-section>

  <pd-section id="nc-visual" title="Visual direction">
    <md><script type="text/plain">
- **Background:** Deep navy `#0d1117` — GitHub dark mode territory, but committed to it. This is a power tool, not a consumer product.
- **Text:** `#c9d1d9` for primary (cool, readable), `#6e7681` for secondary.
- **Borders:** 1px `#21262d` hairlines dividing every zone. The grid IS the design — no rounded corners, no shadows, no decorative elements whatsoever.
- **Type:** JetBrains Mono everywhere. No serif, no display face. Every character aligns to the grid. Column widths are measured in character counts, not pixels. Data is king.
- **Status colors:** Bright and saturated against the dark: `#3fb950` green, `#d29922` amber, `#f85149` red, `#58a6ff` blue (events). These are the only non-grey elements.
- **Interaction:** Keyboard shortcuts shown inline: `[/]` search, `[?]` help, `[j]`/`[k]` navigate, `[1-9]` jump to project. Every panel is focusable and scrollable independently. Active panel gets a 1px brighter border.
- **Signature risk:** All-monospace, all-data, zero decoration. The risk is it feels hostile to newcomers. The payoff is it feels *incredible* to power users — the kind of tool you leave open on a second monitor all day.
    </script></md>
  </pd-section>

  <pd-section id="nc-zones" title="Zone breakdown">
    <md><script type="text/plain">
**Header bar** — Project tabs (clickable, keyboard-navigable with number keys). Each tab shows the project name; the active project is highlighted. Search (`[/]`) opens a command palette. Help (`[?]`) shows the full keymap. The header is 1 row, monospace, no logo.

**Tasks panel (left)** — Compact task list for the active project. Each row: status icon (▶ active, ◔ waiting, ✓ done, ✗ failed), task number, lightning bolt if executing. Summary counts at the bottom ("14 open / 6 done"). `[j]`/`[k]` to move, `[enter]` to open planning doc. Column width: ~12 characters.

**Live Feed (center)** — The heartbeat of the page. Real-time event stream, newest at top. Each line: timestamp (HH:MM:SS), event type (`doc.changed`, `task.start`, `rule.fire`, `session.end`, `commit.push`). Event types are color-coded: blue for doc, amber for task, green for session, red for errors. Below the feed: a mini sparkline of event frequency. This panel auto-scrolls but pauses on hover/focus.

**Sessions panel (right)** — Recent sessions for the active project. Each row: session hash (4 chars), project, duration. Below: today's aggregate stats. Click/enter to drill into session transcript.

**Status bar (bottom)** — Full-width dense strip. Two sections divided by a pipe: rules status (confirmed count, draft count, last extraction time) and backend health (per-project connection dots). Always visible, never scrolls.
    </script></md>

  <pd-section id="nc-keyboard" title="Keyboard model">
    <md><script type="text/plain">
The entire page is navigable without a mouse:

| Key | Action |
|-----|--------|
| `1`–`9` | Switch to project tab N |
| `Tab` / `Shift+Tab` | Cycle focus between panels |
| `j` / `k` | Move down/up within focused panel |
| `Enter` | Open selected item |
| `/` | Open search / command palette |
| `?` | Show keymap overlay |
| `r` | Refresh all panels |
| `Esc` | Close overlay / deselect |

The focused panel gets a slightly brighter border (`#30363d` → `#484f58`). Active item within a panel gets a subtle background highlight.
    </script></md>
  </pd-section>

  <pd-section id="nc-strengths" title="Strengths and risks">
    <md><script type="text/plain">
**Strengths:**
- The most information-dense option by far — everything on one screen
- The live event feed is genuinely addictive to watch (like `tail -f` but structured)
- Keyboard-first navigation makes it extremely fast for repeat users
- The monospace-only aesthetic is a strong identity — unmistakable
- Feels like a tool built by and for engineers

**Risks:**
- Intimidating for new users — no affordances, no tooltips, no onboarding
- The all-monospace look is close to "just a terminal" — needs the structured layout and color coding to justify being a web app
- Deep navy + bright status colors is a well-trodden path (VS Code, GitHub dark)
- The four-quadrant layout may feel cramped on smaller screens — needs responsive breakpoints
    </script></md>
  </pd-section>

  <pd-section id="page-sessions" title="1. Session Explorer">
    <md><script type="text/plain">
**The killer feature.** The data exists — auto-etl normalizes every coding session into parquet, auto-search indexes it with BM25 full-text — but there's no visual way to browse it. This page changes that.

**What it shows:** Every past coding session, browseable and searchable. Each session card: hash (4-char), project, start time, duration, tool call count, files touched, one-line summary. Expandable to full transcript with syntax-highlighted tool calls and file diffs.

**Key interactions:**
- Full-text search across all sessions (powered by auto-search)
- Filter by project, date range, duration, tool type
- Sort by recency, duration, or tool-call density
- Expand any session to read the full transcript inline
- Link from session to the planning doc / PR it produced

**Why it matters:** Right now, understanding what agents did requires reading raw JSONL files or running CLI queries. A visual session browser makes the entire history accessible — for debugging, learning, and reflection.
    </script></md>

    <pd-code lang="text" caption="Session Explorer wireframe">
<script type="text/plain">

├─────────────────────────────────────────────────────────────┤

│ ┌─ #a8f2 ──── 28 Jun 12:15 ──── 18m ──── 47 tools ──────┐ │
│ │ Refactored ETL pipeline to handle new message types     │ │

<!-- ───────────────── Foundations ───────────────── -->
<pd-tab name="Foundations">

  <pd-section id="fnd-thesis" title="Two things must exist first">
    <md><script type="text/plain">
None of the home-page concepts or the five new views are buildable on today's plumbing. Two foundations come first — and they compound: the harness feeds fake data at the seam *below* the data layer, so it exercises the real normalization path rather than a parallel mock.

| Foundation | What it is | Why it gates the views |
|------------|-----------|------------------------|
| **1. Unified data layer** | One place in the web-ui code to normalize every source into canonical entities, then project to views | Every advanced view is a *projection* over the same entities. Without it, each view bolts ad-hoc fetch + shaping onto the 27K `store.js` monolith. |
| **2. E2E test harness** | An agent can boot the UI and drive fake data into it — queued RPC responses + publishable events | No front-end test infrastructure exists today. Can't build dense live views without a way to reproduce their data deterministically. |

**Sequence:** data layer first, harness second (it injects beneath the data layer).
    </script></md>
  </pd-section>

  <pd-section id="fnd-today" title="What exists today">
    <md><script type="text/plain">
Grounded in a read of the current code (`auto-ui/web/static/` + `auto-ui/internal/server/` + `auto-watch/internal/rpcmethods/`):

- **Client data flow:** `rpc.js` (WebSocket JSON-RPC singleton — `call` / `on` / `onAny`) → `store.js` (a ~27K monolith doing fetch + normalize + cache + view-state + selectors) → Preact components via `useStore(selector)`.
- **Normalization is scattered:** `parseDocChanged` in `docevents.js`, frontmatter parsing in `content.js`, tree grouping in `tree.js`. No canonical entity types — the same concept gets re-shaped per view.
- **Server proxy is doc-only:** auto-ui exposes `doc.list`, `doc.get`, `project.list`, `backends.list`. The watch daemon already has `task.*` (unused by the UI). Sessions/rules/graph have **no surface** — they live in auto-etl/auto-search (parquet), auto-reflect (`rules.yaml`), auto-graph.
- **Tests:** solid Go tests (in-process + binary daemon fixtures, `net.Pipe` fake backends in `project_aggregate_test.go`) but **zero** front-end test infrastructure.
    </script></md>
  </pd-section>

  <pd-section id="fnd-data-layer" title="1. Unified data layer">
    <md><script type="text/plain">
Split the `store.js` monolith into four layers. The middle two are the single place normalization happens.
    </script></md>

    <pd-mermaid caption="Four layers — RPC responses and bus events fold into the same entities">
flowchart LR
  WS[WebSocket JSON-RPC] --> T[Transport: rpc.js]
  EV[Bus events] --> T
  T --> M[Model: normalizers]
  M --> E[Entity store]
  E --> P[Projections]
  P --> V1[Mission Control]
  P --> V2[Session Explorer]
  P --> V3[Timeline / Heatmap]
  P --> V4[Playbook Manager]
    </pd-mermaid>

    <md><script type="text/plain">
| Layer | File(s) | Job |
|-------|---------|-----|
| **Transport** | `rpc.js` (unchanged) | Dumb wire: `call` / `on` / `onAny` |
| **Model** *(new)* | `model/*.js` | Canonical entity types + **pure normalizers** — one per RPC method and per event type |
| **Entity store** *(refactor of store.js)* | `entities.js` | Normalized cache `{type: {id: entity}}`; the single point where **both** RPC responses and bus events fold in |
| **Projections + view state** | selectors | Pure `entities → viewModel`; one projection per page. Selection/routing/open-doc/pause stay separate from the entity cache |

**Canonical entities speak the ubiquitous language** — `Session`, `Message`, `Host`, `Project`, `Rule`, `Event`, `TaskDef`/Run, `Doc`.

**The decisive rule:** nothing outside `model/` ever touches raw RPC JSON. `parseDocChanged`, frontmatter splitting, and tree grouping all move into `model/` or projections.

**The payoff:**
- Adding a view = adding a projection file (zero new fetch/normalize).
- Adding a data source = one normalizer + one fetch.
- Mission Control's event stream, Timeline's bars, Heatmap's touch counts, and Session Explorer's cards are all projections over the *same* `Session` / `Event` / `Task` entities.
    </script></md>

    <pd-decision id="D-1" title="Normalize once into canonical entities; views are pure projections" status="accepted" by="agent"
      summary="RPC responses and bus events fold into the same ubiquitous-language entities; each view is a pure selector.">
      <md><script type="text/plain">
**Context:** Every advanced view needs data from multiple sources, and needs live updates. Today normalization is scattered and view-specific.
**Decision:** A four-layer split (transport → model → entity store → projections). One normalizer per source; RPC snapshots and bus events write to the same entities; each view is a pure projection.
**Alternatives:** Keep extending `store.js` per view (status quo — scales badly); per-view stores (duplicates normalization); a heavy client DB / state library (violates the no-build-step, minimal-dep ethos).
**Consequences:** A migration of `store.js`; the explorer view must be ported onto projections to prove the pattern before new views land.
      </script></md>
    </pd-decision>
  </pd-section>

  <pd-section id="fnd-identity" title="Entity identity & reconciliation">
    <md><script type="text/plain">
Cross-host is already baked in everywhere, so entity keys must be explicit — this is what lets an RPC snapshot and a live event fold into the *same* entity instead of duplicating:

| Entity | Key | Note |
|--------|-----|------|
| `Project` | normalized git **remote** | cross-host identity (per ubiquitous language) |
| `Session` | `host + hash` | hash alone collides across hosts |
| `Task`/Run | `host + runId` | runId is daemon-local SQLite |
| `Doc` | `host + project + worktree + path` | the existing `docsKey` composite |
| `Event` | CloudEvents `id` | — |

**Snapshot + event reconciliation** — the one subtle bit of the fold. `task.list` gives a snapshot; `watch.task.started/completed/failed` patch it incrementally; on reconnect you miss events. Rule:

- Events **patch** entities; periodic snapshots **reconcile** (snapshot wins on conflict).
- Every entity carries a `lastUpdated` so a stale patch can't clobber a fresher snapshot.

(The existing `revision` / `nonce` fields on `openDoc` already hint at this discipline.)
    </script></md>
  </pd-section>

  <pd-section id="fnd-harness" title="2. E2E test harness">
    <md><script type="text/plain">
The `rpc.js` singleton is the one chokepoint — make it injectable. "Queued RPC responses + publishable events" maps exactly onto its `call` / `on` / `onAny` surface.

**Park guard (needed for agent-browser):** an agent driving a headless browser can't reliably inject *before* `rpc.js` runs its module-level `connect()`. So `?mock=1` makes the singleton skip auto-connect and wait for `__autoui.test.load(fixture)`. It doubles as a "frozen UI" mode for manual inspection.
    </script></md>

    <pd-code lang="json" caption="Fixture format — the stable data set, on disk">
<script type="text/plain">
{
  "responses": { "project.list": [ ... ], "doc.list": { ... } },
  "events": [
    { "at": 0,   "method": "doc.changed",        "params": { ... } },
    { "at": 500, "method": "watch.task.started", "params": { ... } }
  ]
}
</script>
    </pd-code>

    <md><script type="text/plain">
`responses` can be a single payload or a FIFO queue per method. `events` is a timed timeline replayed on demand.

**Mock transport API** (present only under `?mock=1`, on `window.__autoui.test`):

- `load(fixture)` — install responses + events, then un-park the app.
- `publish(method, params)` — fire a notification into `on()` / `onAny()` (drives live updates).
- `flushEvents()` — replay the scripted `events` timeline.
- `setResponse(method, payload)` — queue a response mid-test.

**Two tiers (mirror existing repo precedent):**

| Tier | Seam | Speed | Exercises |
|------|------|-------|-----------|
| **Component** | mock at `rpc.js`, pure browser, no daemon | fast | every projection |
| **Integration** | real auto-ui server + a `net.Pipe` fake backend peer that serves scripted responses and pushes events | slower | server proxy + WS + client |

The integration tier extends the **`project_aggregate_test.go`** fake-backend pattern (which already stands up in-process backends) to also push notifications.

**Record mode (fixture factory):** a wrapper records real `call`/response + notifications against a seeded daemon (reuse the `binaryFactory` setup in `conformance_test.go` — temp home, `projects.json`, git repo, stubbed tmux/claude) into a fixture file. Record once, replay forever.
    </script></md>

    <pd-decision id="D-2" title="Mock at the rpc.js seam; drive with agent-browser (no new dep)" status="accepted" by="agent"
      summary="Inject a scriptable mock at the single rpc.js chokepoint via a ?mock=1 park guard; an agent drives the headless browser.">
      <md><script type="text/plain">
**Context:** No front-end test infra. Need to boot the UI and feed deterministic data including live events.
**Decision:** A `?mock=1` park guard + `window.__autoui.test.*` API at the `rpc.js` singleton. Browser tier driven by **agent-browser** (an agent evaluating JS in a headless browser — the approach already used for conformance today).
**Alternatives:** Playwright (best repeatability + CI, but adds a Node/npm dev dependency to a no-build-step project); chromedp/Go (no npm, more verbose). Both rejected for now to stay dependency-free.
**Consequences:** Less push-button-repeatable in CI than Playwright; relies on the agent-browser flow. Revisit if CI needs headless repeatability.
      </script></md>
    </pd-decision>
  </pd-section>

  <pd-section id="fnd-blocker" title="The real blocker: the source surface">
    <md><script type="text/plain">
The client data layer is **necessary but not sufficient**. Session Explorer, Timeline, Heatmap, and Playbook Manager are all blocked on getting non-doc data to the browser *at all* — it lives in separate binaries with no RPC surface (auto-etl/auto-search parquet, auto-reflect `rules.yaml`, auto-graph). This is a genuine architectural fork, and it shapes the whole data layer.

Crucially, the **client normalizers are identical whichever seam delivers the raw payload** — which is exactly why doing the model layer first pays off regardless of how this fork resolves.
    </script></md>

    <pd-question id="Q-1" status="open" priority="p1" for="charlie"
                 title="How should non-doc data (sessions, rules, graph) reach the browser?">
      <md><script type="text/plain">
Four candidate paths (client normalizers unchanged in all of them):

- **(A) Watch daemon becomes the aggregator** — it grows `session.*`, `rule.*`, `graph.*` RPC reading parquet/yaml/graph daemon-side. Cleanest long-term single query surface; matches the "daemon is the per-host RPC executor" role and the parked live-tier idea. But blocks first views on daemon work + a new dependency on etl/reflect data formats.
- **(B) auto-ui server fans out across tools** — it already aggregates across hosts; extend to aggregate across *tools* (watch socket + search endpoint + reflect). More moving parts; each tool keeps its own surface.
- **(C) Static/snapshot tier first** — auto-ui reads parquet/yaml directly (or one-shot CLI shell-out) for read-only views; defer live session streaming. Fastest path to Session Explorer + Playbook; punts the live story.
- **Live-tier first** — design the streaming event spine (Mission Control) before read-only snapshots, since that's the signature of the home-page concepts.

Author's lean: **(A) long-term, (C) as the first step** — build/dogfood Session Explorer + Playbook without waiting on a daemon RPC expansion. Awaiting your call.
      </script></md>
    </pd-question>
  </pd-section>
