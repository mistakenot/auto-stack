- id: 20260623T175710.722036Z-0016
  description: 'ETL pipelines that write partitioned output (e.g. weekly parquet files) without a file-level checkpoint will
    re-parse and re-transform every input file on every run, even though the write layer skips unchanged partitions. The expensive
    work is still paid on every invocation. Fix: a checkpoint file tracking `{path: mtime}` lets the parse phase skip already-processed
    inputs.'
  context: Session 3 investigated a user complaint that `autoetl run` was parsing all 146 sessions each time. The writer correctly
    skips old partitions, but parser.ScanAndParse() has no incremental logic — it always walks the full input directory. The
    'skipped' count in the log refers to sessions with no timestamps, not skipped files.
  git_commit: 13cc9f3
