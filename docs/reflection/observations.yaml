    contexts like selecting a random array element, replace with `crypto/rand.Int(rand.Reader, big.NewInt(n))` — a simple
    one-liner that satisfies the linter without cryptographic overhead.
  context: Adding a hidden 'autoetl zen' easter egg command. The pre-commit hook ran golangci-lint with gosec enabled and
