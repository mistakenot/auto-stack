- id: 20260623T175710.722193Z-0063
  description: 'Add `Cache-Control: no-store` to dev asset serving from the start — without it, browsers reuse cached ES modules
    on refresh even when the server serves fresh bytes, making edit→reload appear broken.'
  context: '`http.FileServer` sends only `Last-Modified` with no `Cache-Control`, so browsers cache ES modules. The server-vs-browser
    diagnostic (curl works, browser doesn''t) was the key indicator. Confirmed in dev disk mode.'
  git_commit: 13cc9f3
