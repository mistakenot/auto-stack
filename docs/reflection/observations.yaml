- id: 20260623T194128.624055Z-0101
  description: Hash-based stateless slot assignment (e.g. CRC32 mod N) has birthday-paradox collision risk around 12 worktrees,
    and alphabetical port name ordering means adding a new port name reshuffles all existing port assignments. Both risks
    should be explicitly documented or mitigated before shipping.
  context: The auto-env v1 spec used CRC32-mod-99 slot assignment for stateless port allocation. Review identified that ~12
    simultaneous worktrees produces ~5% collision probability, and that inserting a new port name alphabetically would shift
    all downstream port numbers, breaking running environments. These were noted in the spec.
  git_commit: 02bd685
  files:
  - auto-env/docs/requirements-v1.md
  session_ids:
