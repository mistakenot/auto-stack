- id: 20260623T194128.623921Z-0075
  description: Doc infrastructure optimized for maintenance (hash freshness, code links, stale detection) does not automatically
    become doc delivery infrastructure. Agents need the right doc content at the right moment; maintenance tooling only ensures
    docs are accurate, not that they are found.
  context: 'Session ca07a2e3 concluded that autodoc''s infrastructure is strong at maintenance but the actual delivery problem
    — getting the right doc to the agent at the right time — is unsolved. The autodoc index gives agents a library catalog
    but no reason to visit the library. Retrieval systems like cass-memory''s `cm context` call show a complementary pattern:
    task-driven hydration at session start rather than passive listing.'
  git_commit: 02bd685
  files:
  - docs/doc-file-usage-findings.md
  session_ids:
