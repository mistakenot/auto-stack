  sources:
  - kind: feedback
    ref: docs/tasks/019-playbook-retrieval-loop/feedback.md
- id: 20260623T194128.624334Z-0157
  description: Before running a command that creates `.codex/` or `.claude/` directories, check whether those paths already
    exist as files in the repo with `ls -la .codex .claude`. A stray 0-byte file at that path will cause 'not a directory'
    errors that look like installer bugs but are actually bad repo state.
  context: Documented in feedback for task 020. A 0-byte `.codex` file had been accidentally committed to `main` (commit b63d4e8).
    The hooks installer's `os.ReadFile(".codex/hooks.json")` failed with 'not a directory'. The installer was correct; the
    repo state was wrong. Caught with `git log -- .codex`.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/020-auto-hooks-install/feedback.md
- id: 20260623T194128.624337Z-0158
  description: Use a generic `map[string]any` merge for JSON config files that must preserve unknown fields (lossless AC).
    This approach preserves all unknown handler fields (`timeout`, `statusMessage`, `args`, `if`) byte-for-byte and is simpler
    than typed structs that would require migration when the schema evolves.
  context: Documented in feedback for task 020. A P1 review comment rejected typed structs for the hooks config merge. The
    generic-tree merge design was adopted, making the AC-2 (lossless field preservation) test trivial to satisfy and keeping
    the code future-proof against schema additions.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/020-auto-hooks-install/feedback.md
- id: 20260623T194128.624341Z-0159
  description: When testing that a bare installed command works (e.g. `auto hooks fire`), call it via `sh -c 'auto hooks fire
    ...'` after verifying `command -v auto` resolves to the correct binary. Calling the binary directly by path (`./bin/auto`)
    would pass even if `auto` were not on PATH.
  context: Documented in feedback for task 020. AC-5 required proving the bare installed command string works. The test ran
    `command -v auto` then piped a payload through `sh -c 'auto hooks fire ...'` to confirm PATH resolution, not just that
    the binary executed.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/020-auto-hooks-install/feedback.md
- id: 20260623T194128.624344Z-0160
  description: When a planning doc or worktree branches from main before planning docs for the current task are committed,
    rebasing onto updated main creates add/add conflicts on the plan files. Stash untracked planning docs to /tmp before rebasing,
    then restore them.
  context: Documented in feedback for task 021. The task 021 worktree forked before the planning docs were committed to main.
    The rebase caused add/add conflicts on plan.md. The fix was stashing the untracked planning docs to /tmp, rebasing, then
    restoring them.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/021-auto-bus-standard/feedback.md
- id: 20260623T194128.624347Z-0161
  description: Unit tests that load real user config files (e.g. `~/.auto/projects.json`) break in CI. Use a functional-option
    injection pattern (`WithRegistryProvider`) to allow tests to substitute a hermetic registry while production code uses
    the live one.
  context: Documented in feedback for task 021. The auto-bus server would load `~/.auto/projects.json` in unit tests, breaking
    CI because the file doesn't exist there. A `WithRegistryProvider` functional option injected per request kept existing
    tests hermetic while giving the production server live registry refresh.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/021-auto-bus-standard/feedback.md
- id: 20260623T194128.624350Z-0162
  description: When two fields can carry the same semantic (e.g. `params.type` vs `method` as an RPC dispatcher), decide which
    is authoritative before writing code. Ambiguity discovered during plan review causes rework; documented in the plan it
    guides implementation without ambiguity.
  context: Documented in feedback for task 021. The `params.type` vs `method` authority question caused rework during plan
    review. Had this been pinned at solution stage, the phase breakdown would have been stable from the start.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/021-auto-bus-standard/feedback.md
- id: 20260623T194128.624353Z-0163
  description: Even on a loopback-only server, always validate client-supplied paths against a known registry rather than
    allowing arbitrary path traversal. A `doc.get`/`doc.list` endpoint with an unvalidated `worktree` param is a path-traversal
    vulnerability even if only local clients connect.
  context: Documented in feedback for task 021. A security review caught that the `worktree` param on `doc.get`/`doc.list`
    was almost left as an unvalidated arbitrary path. The review flagged it and the fix validated against the known project
    registry.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/021-auto-bus-standard/feedback.md
- id: 20260623T194128.624356Z-0164
  description: When `marked.parse` output is rendered into a web page, always sanitize it before insertion into the DOM. Unsanitized
    markdown output is an XSS vector even in a local-only dashboard.
  context: Documented in feedback for task 021. A security review caught XSS via unsanitized `marked.parse` output in the
    auto-bus UI. The fix sanitized the rendered HTML before inserting it.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/021-auto-bus-standard/feedback.md
