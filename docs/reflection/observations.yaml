    be updated in lockstep — column count mismatches cause silent failures or panics, not helpful error messages. Update both
    the INSERT column list and the VALUES tuple in every test file.
  context: Session 690d42ea added a skill_name column to the auto-search SQLite schema. All raw SQL INSERT calls in indexdb_test.go
