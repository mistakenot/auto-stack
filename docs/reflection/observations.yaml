  - id: 20260623T172706.433174Z-0017
    description: Schema structs embedded in CLAUDE.md drift from the actual model file within a session. Remove inline Go structs from CLAUDE.md and replace with a single pointer to the canonical source file to prevent agents from using stale field lists.
    context: "Session 4462d249 found that AgentMessage, AgentSession, and AgentFileBlob structs in root CLAUDE.md were missing 9+ fields compared to auto-etl/internal/model/model.go. The fix was to replace the ~70-line embedded Go code with a pointer sentence."
