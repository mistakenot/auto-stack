- id: 20260623T194128.623918Z-0074
  description: Documentation instructions should specify WHEN to read docs, not just HOW. Passive instructions ('you can use
    autodoc search') are ignored; active conditional instructions ('before implementing a feature, read its requirements doc')
    drive behavior. The same boilerplate block in every CLAUDE.md consumes context without being actionable in any specific
    task.
  context: Session ca07a2e3 found that all 9 CLAUDE.md files contained identical autodoc search instructions but no conditional
    triggers. Across 420 sessions, `autodoc search keyword` was used in only 1-2 sessions — and those were during autodoc's
    own development. Agents reach docs via path traversal or user direction, not via the search infrastructure. Docs that
    get read (user-journey.md, per-project requirements.md) are either directly referenced in narrative text or the user explicitly
    says 'read the requirements'.
  git_commit: 02bd685
