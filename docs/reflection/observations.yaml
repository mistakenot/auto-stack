- id: 20260623T175710.721974Z-0006
  description: When a pre-commit hook lint failure blocks a commit on a file unrelated to your change, fix the lint error
    in that file and include it in the same commit rather than using --no-verify. This keeps the tree lint-clean and preserves
    hook integrity. In session 9e8c7cca, a `perfsprint` lint error in auto-doc/internal/config/config.go blocked the autosearch
    commit; the agent fixed `fmt.Errorf` → `errors.New` and staged the fix alongside the primary change.
  context: The pre-commit hook runs golangci-lint across all sub-projects. A lint violation in auto-doc surfaced during a
    commit scoped to auto-search changes. The fix was trivial (one-liner) but required also removing the now-unused `fmt`
    import to satisfy the compiler.
