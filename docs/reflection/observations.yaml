observations:
- id: 20260623T172706.433083Z-0001
  description: When implementing a linkscan/tag-detection system for source code, always filter out documentation files (.md,
    .yaml, .json) and test files (_test.go, testdata/) before scanning — otherwise prose descriptions of the tag format and
    test fixtures produce large volumes of false-positive 'malformed tag' errors that are impossible to distinguish from real
    issues.
  context: autodoc's linkscan was scanning all git-tracked files including .md docs and _test.go files. Any line mentioning
    '[autodoc()]' in a comment or string literal was incorrectly flagged as a malformed tag. The fix required adding extension-based
    filtering, suffix-based filtering for test files, and tightening the 'malformed' heuristic to only flag patterns containing
    '@' (indicating an attempted real tag format, not a description).
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/linkscan/linkscan.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433114Z-0002
  description: 'When the beads dependency system uses ''dep add A B'' to mean ''A depends on B (B blocks A)'', it''s easy
    to wire the direction backwards. Always verify by checking br ready after wiring: if the foundational task doesn''t appear
    as ready, the direction is wrong and must be reversed with dep remove.'
  context: 'When building the autodoc v1 epic, the agent initially wired ''tasks -> epic'' (meaning tasks depended on the
    epic), blocking the tasks from showing as ready. After checking br ready and seeing the config migration task was blocked,
    the agent removed all epic links and re-added them in the correct direction (epic depends on final acceptance task). The
    correct pattern: only link the epic to the final ''acceptance pass'' task, not to all tasks.'
  git_commit: 13cc9f3
  files: []
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433122Z-0003
  description: When splitting a CLI init command into global vs project modes, the 'project' init should automatically run
    global init if global config doesn't exist yet — this makes the tool work on a fresh system without requiring users to
    run two separate commands in the right order.
  context: autodoc's init was split into InitGlobal (creates ~/.auto/doc/settings.json and ~/.auto/host.json) and InitProject
    (creates .auto/doc/settings.json). InitProject was wired to call InitGlobal first if ~/.auto/doc/settings.json doesn't
    exist, so autodoc init --project works end-to-end on a fresh system.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/commands/init.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433126Z-0004
  description: When git ls-files is used to enumerate files for scanning, it can return directory entries (e.g. skills installed
    as git submodules or symlinks). Always add an os.Stat + info.IsDir() check before attempting os.ReadFile, otherwise the
    scan crashes with 'is a directory' errors.
  context: 'autodoc fix was crashing with ''read .claude/skills/contextual-commit: is a directory'' because git ls-files returned
    the skills directory as a tracked path. The fix was to stat each path and skip it if IsDir() before calling ReadFile.'
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/linkscan/linkscan.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433130Z-0005
  description: Fix instruction output for stale-hash-only docs should say 'review that title and summary still reflect the
    content' — not 'set summary to...' — because those files already have valid summaries. Conflating 'stale hash' with 'needs
    summary update' produces misleading agent instructions that waste effort on no-op edits.
  context: autodoc fix was generating 'Set summary to one-line description' for files that had correct titles and summaries
    but just needed rehashing after content changed. The fix was to add EmptySummary as a distinct issue type and only emit
    the summary instruction when summary is actually empty.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/commands/fix.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433134Z-0006
  description: When a feature is described as a gap to implement, always grep for existing implementations first before building
    it from scratch — WalkRepo for recursive docs discovery was already fully implemented and tested with multi-root fixtures.
  context: The auto-anp task was to implement recursive docs discovery across nested docs/ directories. After reading the
    tech design doc and searching the codebase, WalkRepo was already implemented in doctree.go using git ls-files to find
    all docs/ directories, with multi-root tests in place. The task was closed as 'already done' with a quick verification
    run.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/doctree/doctree.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433138Z-0007
  description: When Cobra commands are refactored (e.g. Init renamed to InitProject), all internal test calls must be updated
    with replace_all to avoid compilation failures — missed rename in a single test file can block the whole test suite from
    compiling.
  context: When Init() was split into InitGlobal() and InitProject(), the test file init_test.go had multiple calls to Init().
    Using replace_all=true caught all instances at once. A missed call would have caused a compile error that prevents any
    tests from running.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/commands/init_test.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433142Z-0008
  description: To add a persistent --json flag to a Cobra root command that all subcommands can read, declare a package-level
    bool variable, bind it with rootCmd.PersistentFlags().BoolVar(), and reference it directly in each subcommand's RunE closure
    — no need to pass it through function parameters or use context.
  context: autodoc needed --json on all subcommands (tree, stale, fix, fixed, agents). The cleanest approach was a package-level
    'var jsonOutput bool' bound to rootCmd as a persistent flag, with each subcommand's RunE checking jsonOutput directly.
  git_commit: 13cc9f3
  files:
  - auto-doc/cmd/autodoc/main.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433146Z-0009
  description: When a session resumes mid-task, always audit what background agents already completed before starting new
    work. Attempting to close issues that background agents already closed produces a no-op error — check br ready and br
    show before assuming an issue needs implementation.
  context: 'Session 17c23bc9 had multiple parallel background agents implementing auto-k8z.2 through auto-k8z.12. When the
    coordinator later tried to close auto-k8z.2, auto-k8z.5, and auto-k8z.4, they were already closed. The coordinator caught
    this via the ''Warning: Skipped ... already closed'' output from br close.'
  git_commit: 13cc9f3
  files: []
  session_ids:
  - 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433149Z-0010
  description: When implementing FTS5 virtual table queries in SQLite (modernc.org/sqlite), use rowid not a custom column
    name to query matched rows. FTS5 exposes rowid as the hidden column linking back to the content table.
  context: 'A test for FTS trigger sync in auto-search used SELECT doc_id FROM sessions_fts which failed with ''no such column:
    doc_id''. The fix was to switch to rowid. FTS tests should use COUNT(*) rather than selecting a specific column to avoid
    this class of error.'
  git_commit: 13cc9f3
  files:
  - auto-search/internal/indexdb/indexdb_test.go
  - auto-search/internal/indexdb/schema.go
  session_ids:
  - 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433153Z-0011
  description: Before writing or creating a file with the Write tool, always Read it first even when you believe it doesn't
    exist. The 'File has not been read yet' error aborts the write; the 'File has been modified since read' error requires
    re-reading before retrying.
  context: In session 17c23bc9, the agent hit 'File has not been read yet' when trying to Write to indexdb_test.go and discover.go
    without prior reads, and 'File has been modified since read' after a background agent modified search.go between read
    and edit.
  git_commit: 13cc9f3
  files: []
  session_ids:
  - 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433157Z-0012
  description: 'Use br close return code and warning text to detect when background agents have raced ahead: exit code 3 +
    ''Warning: Skipped ... already closed'' means another agent already finished that issue. Treat this as a success signal
    and move on.'
  context: 'The coordinator in session 17c23bc9 ran br close auto-k8z.2 after verifying the implementation, but the issue
    was already closed from an earlier session. Exit code 3 with ''Warning: Skipped auto-k8z.2: already closed'' is the expected
    signal.'
  git_commit: 13cc9f3
  files: []
  session_ids:
  - 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433160Z-0013
  description: When dispatching multiple background agents writing to the same Go module, each agent should write to disjoint
    packages. Two agents that both need to modify the same file will produce 'File has been modified since read' conflicts;
    separate their work at package boundaries.
  context: 'Session 17c23bc9 dispatched two background agents: one for query parsing (internal/query/) and one for incremental
    reindex (internal/indexdb/). The reindex agent also needed to update cli/index.go, which caused conflicts when the coordinator
    was also reading it.'
  git_commit: 13cc9f3
  files:
  - auto-search/internal/cli/search.go
  - auto-search/internal/cli/index.go
  session_ids:
  - 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433164Z-0014
  description: When reviewing a design doc against code, use a dedicated Explore sub-agent per subsystem rather than reading
    files inline. The sub-agent returns a structured summary that can be compared against the doc without the coordinator
    needing to read source files directly.
  context: Session 4462d249 used Explore sub-agents to audit auto-doc and auto-etl internals. The auto-doc sub-agent (68s,
    27 tool uses) answered 8 specific questions; the auto-etl sub-agent (58s, 22 tool uses) answered 10. The coordinator synthesized
    both reports to update docs without re-reading any source files.
  git_commit: 13cc9f3
  files:
  - docs/user-journey.claude.md
  - docs/user-journey.md
  session_ids:
  - 4462d249-56f1-4b85-8d2c-c47dc438748b
