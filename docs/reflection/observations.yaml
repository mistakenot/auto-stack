  description: Distinguish between tracked credentials (in git) and untracked credentials (on disk but in .gitignore). Parallel
    subagents may separately report both as 'critical', causing confusion. Always verify with `git ls-files` before escalating
    a finding — files in .tmp/ that aren't tracked are not a git-exposure risk.
  context: 'Session 2 found Claude OAuth tokens in `auto-etl/.tmp/claude/.credentials.json`. Multiple subagents flagged these
    as CRITICAL, but `git ls-files` confirmed the .tmp/ directory was excluded by .gitignore. The actual risk was only the
    three tracked files: `ask-user-question.txt`, `auto-doc/.tmp/feature-miner-report.md`, and `auto-doc/.tmp/feature-miner-results.json`.'
