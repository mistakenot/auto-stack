- id: 20260623T175710.722253Z-0080
  description: 'The autosearch quickstart is the most effective onboarding mechanism: agents reading it cold became productive
    within the first 2-3 tool calls. Both independent agents in sessions 0e160d60 and b969b0c7 started with ''autosearch quickstart''
