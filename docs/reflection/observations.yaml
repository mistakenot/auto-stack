- id: 20260623T194128.624052Z-0100
  description: Go template delimiters (`{{ }}`) collide with JS template literals, Vue/Handlebars, and Helm chart expressions.
    When templating across multiple file types, document an escape mechanism or support configurable delimiters to avoid this
    on first real-world use.
  context: While writing the auto-env v1 requirements, this risk was identified during review. The spec was updated to include
    a custom delimiter option (`[[ ]]`) to sidestep collisions in ecosystem.config.js files which heavily use `${}` and potentially
    `{{}}` patterns.
  git_commit: 02bd685
