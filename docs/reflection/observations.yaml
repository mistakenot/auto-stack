    and pre-commit hooks. Change such commands to exit 1 when issues are found, then audit all tests that asserted `exit ==
    0` in the presence of issues — they need to flip to `exit != 0`.
  context: Session 3 found `autodoc fix` always returned 0 (only malformed tags triggered non-zero). The user asked for exit
    1 on any issue. The ripple effect was that ~12 unit tests and 5 e2e tests assumed exit 0 when issues existed and all needed
    to be inverted. The pre-commit hook also needed `|| true` to avoid blocking commits on doc drift.
