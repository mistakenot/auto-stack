  context: The auto-watch store migration pattern adds a v2 block containing `CREATE TABLE IF NOT EXISTS file_snapshots` DDL
    and `INSERT OR IGNORE INTO schema_migrations(version) VALUES (2)`. This allows new migrations to be applied to an existing
    database without error.
