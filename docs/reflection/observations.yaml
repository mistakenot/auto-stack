    patching each comment individually — a rewrite avoids residual comment fragments and lets the author reconsider related
    sections holistically. After the rewrite, grep for the comment tag to confirm all are gone.
  context: Session 4008664a had the agent review requirements.md and leave REVIEW comments. The agent first tried to address
    each comment with targeted edits, then rewrote the whole file. Afterwards it ran `grep '<!-- REVIEW' requirements.md`
    which returned no matches, confirming clean resolution.
