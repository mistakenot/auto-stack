- id: 20260623T194128.623927Z-0077
  description: Memory systems like cass-memory solve the doc ranking and lifecycle problem (confidence decay, maturity states,
    relevance scoring) but still rely on the agent initiating the retrieval call. Without an automatic trigger or prominent
    hook, even well-designed retrieval is subject to the same 'agent decides to look' failure mode as manual doc search.
  context: 'Session 62bafdf6 investigated the cass-memory system as a potential solution to the doc-file-usage problem documented
    in `docs/doc-file-usage-findings.md`. The analysis found cass addresses ~60-70% of the problem: it solves rules/conventions
    memory but not reference docs, and its MCP-based retrieval (`cm context`) is agent-initiated, meaning it depends on agent
    judgment to trigger hydration.'
  git_commit: 02bd685
  files:
  - docs/doc-file-usage-findings.md
  session_ids:
  - 62bafdf6-d5b2-44e8-bc27-321683462a1f
  sources:
  - kind: session
    ref: 62bafdf6-d5b2-44e8-bc27-321683462a1f
- id: 20260623T194128.623934Z-0078
  description: A memory system that stores rules as granular bullets with scope metadata (global/workspace/language/framework/task)
    and confidence decay is more useful to agents than a flat document index. Bullet granularity means only the ranked relevant
    subset is hydrated, not entire files.
  context: 'Session 62bafdf6 analyzed cass-memory''s architecture: bullets store ID, content, category, scope, maturity, feedback
    history, and optional embeddings. The `cm context ''<task>''` command scores bullets by keyword overlap + cosine similarity
    and returns only a ranked subset. This contrasts with autodoc''s approach of listing all docs regardless of task relevance.'
  git_commit: 02bd685
  files:
  - docs/doc-file-usage-findings.md
  session_ids:
  - 62bafdf6-d5b2-44e8-bc27-321683462a1f
  sources:
  - kind: session
    ref: 62bafdf6-d5b2-44e8-bc27-321683462a1f
- id: 20260623T194128.623940Z-0079
  description: 'The complementary architecture for agent knowledge delivery is: task-driven retrieval (like cass) for rules
    and conventions, plus code-linked freshness tracking (like autodoc) for reference docs. Neither alone covers both use
    cases.'
  context: Session 62bafdf6 concluded that cass-memory addresses the rules/conventions half of the doc problem (~60-70% overlap)
    but not the reference doc half (schemas, requirements, long-form guides). autodoc's file-level code links and hash-based
    drift detection cover the reference doc half. The ideal system combines cass-style retrieval for rules with autodoc-style
    linking for reference docs.
  git_commit: 02bd685
  files:
  - docs/doc-file-usage-findings.md
  session_ids:
