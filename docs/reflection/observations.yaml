- id: 20260623T172706.433171Z-0016
  description: When a user renames a project directory (e.g., auto-etl-2 to auto-etl), immediately update the root CLAUDE.md
    sub-projects table, then check and update any docs that referenced the old name. Don't wait for the user to ask — git
    status showing staged deletions of the old path is the signal.
  context: 'Session 4462d249: the user said ''i just deleted ./auto-etl old project and renamed ./auto-etl''. git status showed
    22 files staged under auto-etl-2/ as deleted. The agent immediately updated CLAUDE.md and struck through the resolved
    question in the review doc.'
  git_commit: 13cc9f3
