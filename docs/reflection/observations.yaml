  - id: 20260623T172706.433229Z-0032
    description: "A stats/oracle tool for E2E testing should be a transparent observer that records everything it sees (including unknown line types and unparseable data) as named metrics, rather than silently filtering rows to match what the pipeline does."
    context: "The user pushed the agent twice: first to make genstats independent, then to remove all filtering from it. genstats should count all raw lines with linesByType breakdowns, and the test computes expected output from raw counts."
    git_commit: 13cc9f3
