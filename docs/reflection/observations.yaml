- id: 20260623T194128.623735Z-0028
  description: 'A ''seed on first tick'' predicate based on an empty snapshot table is incorrect when files can be deleted:
    after all tracked files are deleted, the snapshot is empty again, causing a re-seed instead of detecting newly created
    files. Use a separate `trigger_state` record to track whether a trigger has ever been evaluated.'
  context: The original `evaluateFileCreatedTrigger` used `len(snapshots) == 0 && len(currentFiles) > 0` to detect first-run
    seeding. The delete+recreate integration test failed because deleting all files emptied the snapshot, then recreating
    a file was silently re-seeded rather than firing tasks. The fix was to check `triggerState.UpdatedAt.IsZero()` from a
    separate `trigger_state` table.
  git_commit: 02bd685
