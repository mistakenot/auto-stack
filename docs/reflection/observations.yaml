- id: 20260623T194128.624130Z-0116
  description: When a tool generates instructional text that gets prepended to user-facing output (such as `fix` prompts),
    the example values in that text must exactly match the format the tool enforces. Redundant prefixes like `"when ..."`
    in `read_when` cause double-printing when the surrounding text already supplies the word.
  context: 'Session fde768d9 fixed autodoc''s `read_when` field format. The `docsindex.go` output already printed `. Read
    when: ` before the field value, but `fix.go` instructed users to write `read_when: "when modifying the auth middleware"`
    — causing output like `Read when: when modifying the auth middleware`. The fix removed `when` from all examples and fixture
    values.'
  git_commit: 02bd685
