- id: 20260623T175710.722071Z-0025
  description: When implementing a new Go library client, build errors from type mismatches in library APIs should be fixed
    immediately — one file at a time — before moving on. The pattern of writing all files then batch-building leads to compounding
    errors across files that reference each other's undefined symbols.
  context: 'Session 3: the agent wrote client.go, syncstate.go, repo.go, fetch.go, transform.go in sequence, running `go build
    ./...` after each file. This caught errors like ''undefined: TransformPR'' and a wrong parquet.ReadBufferSize signature
    immediately rather than after all files were written.'
