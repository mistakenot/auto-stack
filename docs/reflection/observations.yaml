  - id: 20260623T172706.433184Z-0020
    description: "When iterating on a schema design with a user, write the design doc first and share it for review before touching any code. Multiple design reversals were resolved entirely at the doc level, saving rework in code."
    context: "The subagent session-ID design went through at least 3 full reversals: {sessionId}-{agentId}, then {sessionId}/{agentId}, then just agentId as the primary key with a separate parent_session_id FK. All changes were made to the markdown doc before any code was written."
    git_commit: 13cc9f3
    files: ["auto-etl-2/docs/subagent-session-dedup.md"]
