  - kind: feedback
    ref: docs/tasks/018-auto-watch-easy-daemon/feedback.md
- id: 20260623T194128.624314Z-0151
  description: For user-level systemd units, parameterize by a `Scope` enum (unit dir, `systemctl [--user]`, `WantedBy`) rather
    than forking a parallel implementation. System behavior stays byte-identical; existing tests pin to `ScopeSystem`. `exec.Command`
    with nil `Env` inherits the calling environment, so `systemctl --user` gets `XDG_RUNTIME_DIR`/`DBUS_SESSION_BUS_ADDRESS`
    for free.
  context: Documented in feedback for task 018. The cleanest approach to adding user-level systemd was to add a `Scope` enum
    to the existing `daemoninstall` package rather than creating a separate implementation. The nil-env inheritance was a
    useful incidental discovery.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/018-auto-watch-easy-daemon/feedback.md
- id: 20260623T194128.624318Z-0152
  description: 'A pre-phase doc review of acceptance criteria pays for itself: catching AC/implementation gaps before execution
    prevents a task from silently shipping with broken acceptance criteria. In task 018, the plan''s enable/start defaults
    were `false`; the review caught they needed to be `true` for the headline AC to pass.'
  context: Documented in feedback for task 018. The review surfaced that AC-1 (no-flag install must enable+start, not just
    write the unit) was misimplemented — the plan defaulted `enable` and `start` to `false`. Flipping them to `true` at Step
    2.1a was the difference between the AC passing or silently failing.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/018-auto-watch-easy-daemon/feedback.md
- id: 20260623T194128.624321Z-0153
  description: Run `make check` (full golangci-lint) after every phase of multi-phase implementation, not just the final phase.
    Per-step verify gates that only run `gofmt`/`go vet`/`go test` give false confidence and allow lint debt to accumulate
    (27 findings in task 019 accumulated across 3 phases).
  context: Documented in feedback for task 019. Despite the lesson being recorded from tasks 017/018, the plan's per-step
    verify commands still only included `gofmt`/`go vet`/`go test`. Phase 4 had to fix 27 golangci-lint findings (rangeValCopy,
    hugeParam, intrange, modernize, errchkjson, ineffassign) that had accumulated in phases 1-3.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/019-playbook-retrieval-loop/feedback.md
- id: 20260623T194128.624324Z-0154
  description: Verify actual CLI flags and subcommands with `--help` before writing them into a plan or quickstart doc. If
    you assume a flag exists (`--project`) without checking, the plan references a nonexistent surface and agents must adapt
    at execution time.
  context: Documented in feedback for task 019. The plan referenced `auto reflect init --project` but the real CLI is `auto
    reflect init` with no `--project` flag. The Phase 4 subagent correctly adapted, but the plan prose was wrong. This lesson
    was also recorded in task 015 but recurred.
  git_commit: 02bd685
  files: []
