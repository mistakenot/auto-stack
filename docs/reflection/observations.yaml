  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433160Z-0013
  description: When dispatching multiple background agents writing to the same Go module, each agent should write to disjoint
    packages. Two agents that both need to modify the same file will produce 'File has been modified since read' conflicts;
    separate their work at package boundaries.
  context: 'Session 17c23bc9 dispatched two background agents: one for query parsing (internal/query/) and one for incremental
    reindex (internal/indexdb/). The reindex agent also needed to update cli/index.go, which caused conflicts when the coordinator
    was also reading it.'
