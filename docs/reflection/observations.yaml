  - id: 20260623T172706.433225Z-0031
    description: The E2E test oracle (genstats/stats generator) must be a fully independent implementation with no imports from the system under test. Using the same parsing code for both generating expectations and running the ETL means bugs cancel out and tests always pass despite incorrect output.
    context: "Session 00f0bcac shows the agent initially wrote genstats using the same internal parser+transform packages as the ETL binary — the user caught this: 'if we use the same infrastructure to build this test file as we then use to run the ETL scripts, we're not really independently testing it.' The fix was rewriting genstats as a standalone raw JSONL walker."
    git_commit: 13cc9f3
