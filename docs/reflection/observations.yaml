- id: 20260623T175710.722218Z-0071
  description: Rather than overwriting a broken release tag, create a new version tag. This avoids race conditions from deleting
    and recreating tags, preserves history, and allows the fixed workflow to prove itself on a clean release.
  context: 'In session 3, after diagnosing that v0.7.0 had no assets, the user was offered two options: re-tag v0.7.0 (destructive)
    or cut v0.8.0. The user explicitly chose v0.8.0. The new tag triggered the fixed workflow successfully. Overwriting existing
    tags is risky because GitHub caches tag states and force-push to a closed release tag may not re-trigger CI.'
