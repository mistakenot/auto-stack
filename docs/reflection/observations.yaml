- id: 20260623T175710.722236Z-0076
  description: When adding a pre-commit hook step for skills syncing, trigger it only on changes to the skills/ directory
    (`git diff --cached --name-only --diff-filter=ACMR -- 'skills/'`) and use `|| true` so a skills-install failure never
    blocks a commit. Always re-stage `.agents/` after sync since that is where the compiled skill artifacts land.
  context: Session 3 (b6d5cf3a) added a step 4 to the pre-commit hook for skills syncing. The hook ran live during the very
    next commit and confirmed it picked up 4 skills (cass, contextual-commit, recall, release). The selective trigger prevents
