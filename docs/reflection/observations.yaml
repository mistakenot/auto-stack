- id: 20260623T194128.624160Z-0121
  description: When golangci-lint's `nilerr` rule flags an intentional `return nil` after a non-nil error (used to skip unprocessable
    items), use an inline `//nolint:nilerr` comment with an explanatory note rather than restructuring the code. This documents
    the intentional decision and satisfies the linter without introducing unnecessary complexity.
  context: 'Session 3d1aac95 added `//nolint:nilerr // intentional: skip non-autodoc markdown` after the pre-commit hook rejected
    the initial commit. The linter correctly flagged the pattern but the skip was semantically correct; the inline directive
    with explanation is the right tool here.'
