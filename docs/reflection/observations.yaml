- id: 20260623T194128.623982Z-0083
  description: For hash-stripping in scope computation, remove the entire line when its sole content is the autodoc tag comment
    rather than only removing the tag substring, to prevent residual empty comment shells (e.g., '<!--  -->') from causing
    whitespace-variant hash mismatches.
  context: Session 1 (2285390f) revised the scope hash algorithm for markdown tags. The original design only stripped the
    [autodoc(...)] body, leaving '<!--  -->' behind. The REVIEW identified that whitespace variations inside the empty shell
    would cause spurious hash differences; the fix was a whole-line removal regex.
  git_commit: 02bd685
