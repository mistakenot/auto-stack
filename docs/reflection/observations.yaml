  description: 'Before making a repo public, fan out security scanning into at least four independent parallel sub-agents:
    (1) secrets/API keys in current files, (2) PII in current files, (3) data/fixture files and tracked runtime outputs, (4)
    git history. Each agent covers a distinct surface and they can run simultaneously.'
  context: Session 2 was a pre-public security audit. The agent launched 5 parallel background subagents covering secrets,
    PII, data files, git history, and .gitignore coverage. The parallel approach completed the full audit in ~60s wall time
    that would have taken 5× longer serially.
