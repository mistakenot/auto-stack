  sources:
  - kind: session
    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433157Z-0012
  description: 'Use br close return code and warning text to detect when background agents have raced ahead: exit code 3 +
    ''Warning: Skipped ... already closed'' means another agent already finished that issue. Treat this as a success signal
    and move on.'
  context: 'The coordinator in session 17c23bc9 ran br close auto-k8z.2 after verifying the implementation, but the issue
    was already closed from an earlier session. Exit code 3 with ''Warning: Skipped auto-k8z.2: already closed'' is the expected
    signal.'
  git_commit: 13cc9f3
  files: []
  session_ids:
