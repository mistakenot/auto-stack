    'init <name>' for both confuses semantics — init should be idempotent repo configuration, create should fail on name conflicts.
  context: 'In session 4008664a, the user corrected an initial draft of autoskill that used ''autoskill init <name>'' for
    both global setup and individual skill creation. The correction was: init = global and project-local config (like other
    auto-* tools), create <name> --description ''...'' = new skill scaffold with required description. This matches the init/create
    split used in the broader auto-stack CLI conventions.'
