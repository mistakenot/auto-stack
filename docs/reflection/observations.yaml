  description: After replacing a running binary on Linux, always emit a restart hint for the service. The old process keeps
    running from its inode until explicitly restarted; users may not realize they are still on the old version.
  context: install.sh was updated to track which binaries were running during install (via fuser) and print `systemctl --user
    restart <service>` hints at the end. This makes the upgrade path clear when autowatch or other daemons are managed by
    systemd.
