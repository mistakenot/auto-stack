- id: 20260623T175710.722239Z-0077
  description: 'Invoking an OpenProse program from inside Claude Code uses the /open-prose skill with the form: `/open-prose
    prose run <path/to/index.md> -- <key>: "<value>"`. The `prose run` prefix is required even from inside Claude Code — the
    skill does not accept bare program paths.'
  context: 'Session 1 (a0c16027) ended with the user asking ''what command would you run to run that pipeline?'' and then
    ''from inside claude code?''. The agent clarified the distinction between the CLI invocation (`prose run scripts/self-improve/index.md
    -- focus: "autosearch"`) and the Claude Code invocation (`/open-prose prose run scripts/self-improve/index.md -- focus:
