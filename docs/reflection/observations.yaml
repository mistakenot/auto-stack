- id: 20260623T194128.624286Z-0142
  description: Ineffectual assignments (`ineffassign`) and inverted test assertions are two classes of bugs that pass tests
    silently. An inverted assertion using `t.Log` on the success path instead of `t.Error` on the failure path means the test
    always passes — it is a no-op. Always write the `t.Error` for the failure condition, not a `t.Log` for the happy path.
  context: Documented in feedback for task 016. A subagent wrote a test for thinking-excluded-from-transcript logic using
    `!strings.Contains` + `t.Log` instead of `strings.Contains` + `t.Error`. The test passed even when the code was wrong.
    Only the automated PR review caught it.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/016-etl-preserve-session-signal/feedback.md
- id: 20260623T194128.624289Z-0143
  description: When positional SQL insert signatures are used (column, placeholder, and arg counts must all match), explicitly
    state and verify the counts in the plan (e.g. '38/38/38'). The compiler does not catch argument order drift or count mismatches
    in positional inserts.
  context: Documented in feedback for task 016. The `InsertMessage`/`InsertSession` plumbing was identified as the most error-prone
    part of the ETL schema work. The plan's explicit count annotations (38/38/38, 26/26/26) prevented the class of bug where
    column count, placeholder count, and arg count diverge silently.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/016-etl-preserve-session-signal/feedback.md
- id: 20260623T194128.624292Z-0144
  description: 'Two independent copies of a normalization function (e.g. `normalizeRole`) across packages are a recurring
    inconsistency risk: every future role addition requires updating both, and there is no compiler guarantee they stay in
    sync. Prefer a shared function or constant list in a shared package over duplication.'
  context: Documented in feedback for task 016. `normalizeRole` existed independently in both `search/messages.go` and `stats/validate.go`.
    Both the plan and the review caught this divergence risk, but a shared helper would eliminate the class of bug entirely
    rather than requiring human vigilance.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/016-etl-preserve-session-signal/feedback.md
- id: 20260623T194128.624295Z-0145
  description: Concurrent subagents sharing a single git worktree leak file writes into the main worktree — new files in new
    directories are most affected. Always dispatch subagents serially when they share a worktree, and verify each agent's
    files landed on disk before launching the next.
  context: Documented in feedback for task 017. A Phase-2 fan-out of 14 concurrent subagents editing one shared worktree resulted
    in ~half the writes vanishing from the task worktree and appearing as uncommitted changes in the main worktree. Redoing
    the affected tools serially recovered the work. This same failure mode recurred in task 018.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/017-unify-binaries-into-auto/feedback.md
- id: 20260623T194128.624299Z-0146
  description: 'Package-global command state (e.g. a package-global `runCmd` variable with flags registered on it) is not
    re-entrant: building the command tree twice panics with ''flag redefined''. Construct fresh command instances inside each
    factory function (`newRunCmd()`, `newZenCmd()`) rather than reusing package-level variables.'
  context: 'Documented in feedback for task 017. The auto-etl `init()` → `NewRootCmd()` refactor kept a package-global `runCmd`
    and re-registered flags on each call. This caused a panic in the umbrella integration test that builds the command tree
    twice. Fix: construct fresh commands inside each `newXxxCmd` factory.'
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/017-unify-binaries-into-auto/feedback.md
- id: 20260623T194128.624302Z-0147
  description: Do not trust an agent's self-reported 'already done' status. Always verify with your own grep or file check
    before accepting a claim that content has been updated. Agents can hallucinate completion of work that was never started.
  context: Documented in feedback for task 017. A docs-sweep subagent reported `user-journey.md` and `autostack-install-daemon.md`
    were 'already done' when both were untouched. Only re-verifying with grep caught the hallucination.
  git_commit: 02bd685
