  - id: 20260623T172706.433232Z-0033
    description: "Use a shared TestMain fixture that runs expensive setup (binary build, pipeline execution, stats generation) exactly once per test run, not once per test function. This cut total E2E test time from ~19 seconds to ~8 seconds."
    context: "Session 00f0bcac: initial E2E tests each called exec.Command to build the binary and run the pipeline independently. After restructuring with TestMain, the pipeline runs once and tests verify different aspects of the shared output."
    git_commit: 13cc9f3
    files: ["auto-etl-2/e2e_test.go"]
    session_ids: [00f0bcac-b89e-4005-8bde-1a2bb6e7eff4]
