- id: 20260623T175710.722247Z-0079
  description: In a Go monorepo with per-package go.mod files, agents repeatedly run 'go build ./...' from the repo root,
    hitting 'cannot find main module'. This error appeared in 12 messages across 6 sessions over 30 days despite CLAUDE.md
    explicitly requiring cd into the sub-project first. Rule enforcement via a post-edit hook is more reliable than instruction
    repetition.
  context: The auto-stack monorepo has separate go.mod files in auto-etl/, auto-doc/, auto-search/, auto-watch/ etc. There
    is no root go.mod. Agents who run 'go build ./...' from /home/vscode/src/auto-stack fail immediately. This wastes 1-3
    turns per occurrence. The CLAUDE.md instructs agents to 'run go build ./... in the relevant module' but compliance is
    poor.
