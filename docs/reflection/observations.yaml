  description: The `autodoc agents` command was idempotent in theory but accumulated an extra blank line on every run because
    the `block` format string ended with `\n` after `markerEnd`, while the preserved suffix already started with `\n` from
    the original marker line. Each run grew the file by one blank line.
  context: 'Investigated in session 5 (session 02a014c4). The user noticed pre-commit checks were modifying all CLAUDE.md/AGENTS.md
    files with random whitespace on every commit. Root cause was in `auto-doc/internal/commands/agents.go` `updateAgentFile`:
    the replacement concatenated `block` (ending in `\n`) + suffix (starting with `\n`), adding one newline per run. Fixed
    by stripping trailing newline from `block` before appending suffix.'
