  description: When a lint command walks external markdown files to build a validation index (like a doc-ID map), use `return
    nil` (not `return err`) to skip files that fail parsing. Files without the expected format are simply not relevant to
    the index — treating parse errors as fatal crashes the lint process on unrelated files.
  context: 'Session 3d1aac95 fixed `autoskill lint` crashing with `discover docs in /path/docs: frontmatter must start with
    ---` when any docs directory contained non-autodoc markdown files. The fix changed `discoverDocsByID` to skip files that
    fail `parseFrontmatterAndBody()` rather than propagating the error. A `//nolint:nilerr` directive was needed to satisfy
    golangci-lint.'
