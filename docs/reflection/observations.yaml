    ref: 17c23bc9-8d0e-40b7-9e17-ac363b6c77d0
- id: 20260623T172706.433153Z-0011
  description: Before writing or creating a file with the Write tool, always Read it first even when you believe it doesn't
    exist. The 'File has not been read yet' error aborts the write; the 'File has been modified since read' error requires
    re-reading before retrying.
  context: In session 17c23bc9, the agent hit 'File has not been read yet' when trying to Write to indexdb_test.go and discover.go
    without prior reads, and 'File has been modified since read' after a background agent modified search.go between read
    and edit.
  git_commit: 13cc9f3
  files: []
  session_ids:
