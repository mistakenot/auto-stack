- id: 20260623T194128.624250Z-0135
  description: 'Pushing a commit that modifies `.github/workflows/*.yml` requires the `workflow` scope on your GitHub PAT.
    Fine-grained PATs need the ''Workflows: Read and write'' repository permission. Without it the push fails with ''refusing
    to allow a Personal Access Token to create or update workflow ... without `workflow` scope''.'
  context: In session 8 (5f2d3aa2), `git push origin main` failed because commit `0f1a292` modified `.github/workflows/release.yml`.
    The PAT embedded in the remote URL lacked workflow scope. Resolved by granting 'Workflows' permission on the fine-grained
    PAT, then retrying the push.
  git_commit: 02bd685
