- id: 20260623T175710.722221Z-0072
  description: Pre-commit hooks should hard-fail on doc freshness checks (e.g., `autodoc fix`), not silently swallow failures
    with `|| true`. When the hook was `autodoc fix || true`, 13 stale docs accumulated unnoticed. Changing to `autodoc fix`
    (no fallback) makes stale docs block commits and surfaces issues immediately.
  context: 'Session 2 (53450b0f) discovered 13 outstanding autodoc issues. The existing hook had `autodoc fix || true` which
    made the step non-blocking. Once the docs were cleared and the hook changed to hard-fail, the next commit proved the hook
    now catches issues: it printed ''pre-commit: autodoc fix passed'' only after all docs were clean.'
  git_commit: 13cc9f3
  files:
