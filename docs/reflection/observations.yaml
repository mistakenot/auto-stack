  - id: 20260623T172706.433201Z-0024
    description: "FTS5 virtual tables in SQLite use rowid as their primary key column, not any user-defined column like doc_id. A test that queries SELECT doc_id FROM fts_table WHERE fts_table MATCH ... will fail; use SELECT rowid instead."
    context: "In session 07c5ecd3, TestFTSTriggersSync used doc_id in FTS queries and failed with 'SQL logic error: no such column: doc_id'. The fix was to replace all FTS column references with rowid."
    git_commit: 13cc9f3
