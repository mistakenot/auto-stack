- id: 20260623T194128.623702Z-0019
  description: On Linux, you cannot overwrite a running executable with curl -o, but you can delete it first. The running
    process retains its file descriptor to the old inode, so `rm -f` before writing lets the install succeed without killing
    the daemon.
  context: 'install.sh was failing with ''curl: (23) Failure writing output to destination'' because the autowatch daemon
    was running as a systemd service. The fix was to add `rm -f` before each `curl -o` in install.sh so the old inode remains
    open by the running process while a new file is written.'
  git_commit: 02bd685
