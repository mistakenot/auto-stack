- id: 20260623T194128.623914Z-0073
  description: Self-improvement workflows should prioritize finding structural gaps and design insights over tactical bug
    fixes. A workflow optimized only for shipping PRs will produce housekeeping changes while missing the root-cause architectural
    problems those bugs symptomize.
  context: 'After the first self-improve run in session 1fb24631 produced mostly housekeeping PRs (ignores config, link wiring),
    the user noted the session missed the structural insights. The self-improve scripts were updated: the explorer now classifies
    findings as STRUCTURAL vs TACTICAL, the analyst produces an insights report as the primary deliverable (with PRs secondary),
    and the consolidator can produce value even with zero PRs.'
