  - id: 20260623T172706.433181Z-0019
    description: "When the user says 'add to todo', they mean a todo.md file in the relevant project directory, not a beads issue. Create the file if it doesn't exist rather than defaulting to beads tracking."
    context: "In session 51f5dc53, user said 'add to todo - worktree detection' and the agent immediately created auto-etl-2/todo.md. Lightweight deferred items go in a markdown todo file, not the beads issue tracker."
    git_commit: 13cc9f3
