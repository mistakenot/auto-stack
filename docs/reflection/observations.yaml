- id: 20260623T175710.722199Z-0065
  description: Never use `pkill -f` with a string that appears in your own command line — kill by PID via `ss` or similar
    instead to avoid sending SIGTERM to the running shell.
  context: '`pkill -f "autoui serve"` matched the bash command line executing the pattern check itself, terminating the shell
    (exit 144 = SIGTERM). The fix is to look up the listener''s PID via `ss -tlnp` and kill by PID.'
