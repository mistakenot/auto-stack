  description: 'Replace gofmt with goimports in pre-commit hooks: goimports is a strict superset (formats + fixes unused/missing
    imports), and a fallback to gofmt if goimports is absent keeps the hook portable. This eliminates the ''unused import
    → fix import → re-commit'' cycle without adding a mandatory dependency.'
  context: The pre-commit hook ran gofmt only. The agent replaced it with `if command -v goimports; then goimports -w; else
    gofmt -w; fi` pattern, applied the same change to `make fmt`, and verified goimports was installed via `go install golang.org/x/tools/cmd/goimports@latest`.
