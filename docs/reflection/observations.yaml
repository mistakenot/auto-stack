- id: 20260623T194128.624098Z-0111
  description: Clarify config field semantics at the spec stage by distinguishing 'required-to-run' fields from 'optional-with-defaults'.
    Init should create intentionally invalid placeholder values (empty strings) that fail validation with clear error messages,
    rather than fake-but-valid values that silently do nothing.
  context: 'Session 6: the user was asked whether init should produce valid-but-fake placeholder commands (e.g. `echo TODO`)
    or empty strings that fail validation. The decision was empty strings with fail-fast validation on `up`, so the user is
    forced to configure real commands. This was then written into the requirements spec explicitly.'
