- id: 20260623T194128.624105Z-0112
  description: For file-placing tools with a manifest-tracked cleanup, do not track created directories separately — track
    only files. Empty directory cleanup is a cosmetic concern that adds manifest complexity, and the mirror structure between
    a template tree and output tree means files are sufficient for deterministic cleanup.
  context: 'Session 6: the auto-env spec originally tracked both files and directories (with a `dir:` prefix) in the `.generated`
    manifest. The decision was made to track only files, since the template tree in `.auto/env/files/` mirrors the output,
    making directory recovery trivially derivable from file paths.'
  git_commit: 02bd685
