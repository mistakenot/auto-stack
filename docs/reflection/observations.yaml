  context: When implementing the `file_created` trigger with glob support, the agent noted Go's built-in `filepath.Glob` limitation
    and added the `doublestar/v4` dependency. The glob is applied via `doublestar.Glob(os.DirFS(projectPath), trigger.Glob)`.
