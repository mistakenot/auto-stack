- id: 20260623T172706.433171Z-0016
  description: When a user renames a project directory (e.g., auto-etl-2 to auto-etl), immediately update the root CLAUDE.md
    sub-projects table, then check and update any docs that referenced the old name. Don't wait for the user to ask — git
