    ref: a0c16027-b308-4a16-a3e5-c5a23ba0bbd7
- id: 20260623T175710.722233Z-0075
  description: When a code-review agent produces a prioritized findings document, pass it back to the main session with 'read
    <findings-doc> and use your judgement on whether or not to add/fix these' rather than auto-applying everything. The agent
    then independently assesses each finding and applies only the valid ones, acting as a filter for potential false positives.
  context: Session 1 (a0c16027) showed the user providing `docs/self-improve-openprose-high-priority-findings-2026-04-13.md`
    as input. The agent read all three P1 findings, confirmed they were all valid, and fixed them. The phrasing 'use your
    judgement' gave the agent permission to reject findings — it applied all three because they were all correct, but the
    pattern allows for selective application.
