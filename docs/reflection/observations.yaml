  description: When extending an existing algorithm to a new file type, encode the dispatch mode (e.g., ScopeKindIndent vs
    ScopeKindMarkdown) directly on the Tag struct so call sites pass the full struct rather than re-deriving the kind from
    file extension.
  context: Session 1 (2285390f) added ScopeKind to the Tag struct and changed ComputeScopeHash to accept (tag Tag) instead
    of (filePath string, tagLine int). A REVIEW comment (session 2) identified this as the cleaner API; accepting the full
    struct lets the function dispatch internally and avoids callers re-inferring the mode.
