- id: 20260623T194128.623924Z-0076
  description: Docs work when they are part of the active workflow, not when they are a separate resource to consult. Co-evolution
    of doc and code during implementation produces used docs; docs created after the fact as standalone reference material
    tend to be ignored.
  context: Session ca07a2e3 found that docs with genuine readership (signals.md — 31 sessions, random.md — 25 sessions, per-project
    requirements.md files) were either co-created with implementation work or directly referenced in narrative architecture
    descriptions. Dated analysis docs created post-hoc in one session had near-zero future reads.
