- id: 20260623T175710.721981Z-0008
  description: Test coverage for a skip/warn behavior pattern requires both a unit test (direct function call) and an e2e
    test (full CLI invocation) because the unit test doesn't verify that JSON output fields are populated or that warnings
    reach the user-facing stderr channel. In session 9e8c7cca, unit tests in indexer_integration_test.go were written first,
    then an e2e test in cli_integration_test.go was added after the user explicitly asked whether e2e coverage existed.
  context: 'The unit tests validated the indexer''s skip logic in isolation. The e2e test used `runCLI(t, "index", ...)` to
    confirm the full path: CLI parses args → invokes FullBuild → JSON output contains `messages_skipped`/`sessions_skipped`
    → warnings appear on stderr. The user''s question ''has this got e2e test coverage?'' prompted adding the e2e layer proactively.'
