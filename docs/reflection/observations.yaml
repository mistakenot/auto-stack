- id: 20260623T194128.624268Z-0138
  description: When `autodoc fix` runs as a pre-commit hook and a new doc lacks YAML frontmatter, the commit is blocked with
    instructions for fixing the doc. The fix requires running `autodoc fixed <file>` after adding frontmatter to update the
    stored hash — adding the frontmatter alone is not enough.
  context: In session 4 (37944658), a pre-commit hook failure for `auto-reflect/docs/bugfix-git-remote-credential-leak.md`
    blocked the commit. The doc was missing `title`, `summary`, and `read_when` frontmatter. After adding the frontmatter,
    `autodoc fixed <file>` had to be run to register the hash before the commit succeeded.
