- id: 20260623T175710.721977Z-0007
  description: For SQLite UNIQUE constraint violations in batch insert loops, detect the error by string-matching `UNIQUE
    constraint failed` and skip the row with a warning to stderr rather than aborting the transaction. This preserves valid
    rows and makes the tool resilient to dirty source data without silently losing data.
  context: autosearch index was aborting on duplicate message_id values from parquet source files. The fix added `isDuplicateKeyError(err)`
    via `strings.Contains(err.Error(), "UNIQUE constraint failed")`, incremented a skip counter, and emitted a WARNING line
    to stderr with message_id, session_id, and source path. Skip counts were exposed in the CLI JSON output as `messages_skipped`
    and `sessions_skipped`.
  git_commit: 13cc9f3
