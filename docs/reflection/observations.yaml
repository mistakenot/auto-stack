- id: 20260623T194128.624124Z-0115
  description: When using CRC32 hashing to allocate deterministic slot IDs (e.g. for port allocation across worktrees), store
    the hash mod N and document the `maxSlots` constant clearly. The worktree name (not branch name) should be used as the
    hash input because the worktree directory name is stable across rebases.
  context: Session 037deff3 implemented per-worktree port allocation in auto-env. The design used `hash/crc32` on the worktree
    directory name then took `% maxSlots` to assign a stable slot. The key insight was that branch names change (e.g. during
    rebase) but the worktree directory name is stable.
  git_commit: 02bd685
