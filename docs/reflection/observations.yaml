- id: 20260623T175710.722145Z-0048
  description: When a CLI command outputs a guide or tips to stderr after success, existing tests that assert 'stderr must
    be empty' will fail even on the happy path. Loosen such assertions to check that stderr does not contain 'warning' or
    'error' keywords, rather than checking for empty stderr.
  context: Session 1028af22 added a skill authoring guide to stderr on 'autoskill create' success. TestCreateHappyWithDirs
    immediately failed because it asserted `stderr == ''`. The fix was to change the assertion to `!strings.Contains(stderr,
    'warning') && !strings.Contains(stderr, 'error')`. This is the correct pattern whenever a command is expected to emit
    informational text to stderr on success.
