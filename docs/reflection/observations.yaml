- id: 20260623T194128.624112Z-0113
  description: 'When implementing a new Go CLI tool in a monorepo, follow a strict bottom-up build order: foundational packages
    (app, config, worktree, port) first, then domain logic (template, manifest), then CLI wiring, then tests. Run `go build
    ./internal/<pkg>/` after each file to catch compile errors immediately rather than accumulating them.'
  context: Session 037deff3 implemented the auto-env package from scratch. The agent used a 10-step build order (go.mod →
    app → cli/root → init → config → worktree → port → template → manifest → CLI commands) and verified each package compiled
    before moving on. This prevented cascading import errors and made debugging straightforward.
  git_commit: 02bd685
