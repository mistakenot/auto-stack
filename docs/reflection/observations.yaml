- id: 20260623T194128.623823Z-0055
  description: 'Skill instructions that say ''consider'' staging files are ambiguous and lead to ''no changes to commit''
    failures. Staging instructions in skill docs must be explicit: name the exact command (`git add <files>`) and include
    a guard rule (''Never run git commit with nothing staged'').'
  context: 'Session 736aa230: contextual-commit SKILL.md said ''consider all unstaged modifications as candidates ... decide
    what to stage and commit.'' In practice, agents read ''consider'' as optional and ran git commit without staging, producing
    failures. The fix replaced the wording with an explicit `git add` step.'
