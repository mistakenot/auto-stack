  description: 'DuckDB''s json_extract_string fails on empty strings — filter `tool_input != ''''` before using JSON extraction
    functions, otherwise you get ''Malformed JSON at byte 0 of input: input length is 0'' errors that abort the whole query.'
  context: Session 690d42ea involved querying parquet data with duckdb to extract skill names from the Skill tool's tool_input
    column. Half of Skill rows have empty tool_input (the tool_result side), so the first json_extract_string calls failed
    with malformed JSON errors. The fix was adding `AND tool_input IS NOT NULL AND tool_input != ''` before calling json_extract_string.
  git_commit: 13cc9f3
