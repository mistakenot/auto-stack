- id: 20260623T194128.624084Z-0109
  description: Git hooks stored in a `hooks/` directory (not `.git/hooks/`) require an explicit setup step (`git config core.hooksPath
    hooks/`) that is per-clone and easy to skip. Always verify hooks are installed before relying on them, and test them with
    an actual commit rather than inspecting the script.
  context: Session 5 opened with the user asking whether the autodoc fix in the pre-commit hook would fail commits. Investigation
    found that `core.hooksPath` was pointing to `.git/hooks` (default) and no pre-commit hook existed there — `make install-hooks`
    had never been run. The hook was installed and tested with an empty commit, which confirmed it fired and blocked on real
    issues.
  git_commit: 02bd685
