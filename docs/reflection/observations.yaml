- id: 20260623T194128.624183Z-0124
  description: When the pre-commit hook applies gofmt/goimports reformatting, the modified files are NOT re-staged automatically
    — you must re-stage them before re-committing. Running `git commit` again after a formatting hook failure will commit
    the pre-reformatting state unless you re-add the files.
  context: 'Session 3d1aac95 showed the pre-commit hook printing `pre-commit: goimports/gofmt applied` then exiting 1, leaving
    reformatted files unstaged. The subsequent commit required `git add <files>` before `git commit`. This is a common source
    of confusion when gofmt runs as a pre-commit hook.'
