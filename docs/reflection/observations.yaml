  sources:
  - kind: feedback
    ref: docs/tasks/019-playbook-retrieval-loop/feedback.md
- id: 20260623T194128.624328Z-0155
  description: When a solution-stage review resolves design conflicts before any code is written, the phase breakdown stays
    stable and no phase needs re-architecting mid-flight. In task 019, six P1–P3 design issues (sharding key, seq allocation,
    snapshot staleness, gate scope, fold conflicts, NaN selection_rate) were all caught at solution.md review time.
  context: Documented in feedback for task 019. The conflict semantics for multi-field edits (one `rule_edited` event with
    a `deltas` array vs. separate events) and the sharding key design (host+day+worktree to avoid merge collisions for same-host
    parallel worktrees) were both resolved at the solution-review stage before execution began.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/019-playbook-retrieval-loop/feedback.md
- id: 20260623T194128.624331Z-0156
  description: 'A checked-in golden fixture file (e.g. `testdata/events/playbook.golden.json`) doubles as an append-only schema
    stability guard: if future code folds the same events to different output, the test fails immediately. Keep the golden
    file curated as the event schema evolves.'
  context: 'Documented in feedback for task 019. The `internal/rules/testdata/events/` → `playbook.golden.json` fixture was
    used both as a test input and as a contract: any future fold code that produces different output from the same input will
    fail the test.'
