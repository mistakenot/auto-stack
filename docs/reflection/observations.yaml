  - id: 20260623T172706.433167Z-0015
    description: "When answering questions by cross-referencing code, remove questions that are fully answered rather than marking them 'answered'. The user explicitly asked to 'remove questions answered by code existing' — keeping answered questions as annotations adds noise once the code is authoritative."
    context: "Session 4462d249 started with 42 review questions in user-journey.claude.md. After cross-referencing code, the user instructed removal of answered questions. The final doc had 3 actionable items covering only genuine gaps."
