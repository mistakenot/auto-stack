- id: 20260623T175710.722196Z-0064
  description: Using `go run` for long-running server processes leaves orphaned compiled binaries holding ports after the
    parent is killed — build an explicit binary instead for a clean process lifecycle.
  context: Killing the `go run -tags dev` PID left the compiled `autoui` child holding the port, causing the next dev server
    start to fail to bind. Building a `-tags dev` binary gave clean lifecycle control.
