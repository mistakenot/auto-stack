- id: 20260623T175710.722002Z-0014
  description: A broad `.gitignore` pattern like `autosearch` (intended to exclude a built binary) will also silently match
    a directory named `cmd/autosearch/`, causing source files inside it to be untracked. Use `/autosearch` (root-anchored)
    or better, rely on the Makefile's `BUILD_DIR` to place binaries outside the source tree entirely.
  context: Session 3 found that `auto-search/cmd/autosearch/main.go` was absent from the repo after a git reset. `git check-ignore`
    revealed `auto-search/.gitignore` line 2 (`autosearch`) was matching the `cmd/autosearch/` directory. The fix was to remove
    the entry entirely since the binary is built to `../bin/autosearch`, not inside the module.
