- id: 20260623T194128.624283Z-0141
  description: When running `go run ./path/to/cmd` from the repo root in a Go workspace (`go.work`) setup, Go requires you
    to be inside the module's directory — the workspace doesn't bridge `go run` paths across modules. Run from within the
    module directory or build a binary first and run that from the repo root.
  context: In session 8 (5f2d3aa2), running `go run ./auto-env/cmd/autoenv/ agents` from `/home/vscode/src/auto-stack` failed
    with 'cannot find main module'. The fix was to either `cd auto-env` first or `go build -o /tmp/autoenv ./cmd/autoenv/
    && /tmp/autoenv agents` from the repo root.
  git_commit: 02bd685
