  description: A pre-commit hook that runs `git add "$ROOT"` (unscoped, no path filter) after a documentation fixer will accidentally
    stage unrelated files from across the entire working tree, including files the user has not reviewed. Always scope git
    add operations to the specific files or directories the tool modifies.
  context: 'Session 5: the autodoc pre-commit block ran `autodoc fix` then `git add "$ROOT"`, which would stage all modified
    files in the repo. After the issue was identified, the fix was to remove the unscoped `git add "$ROOT"` from the autodoc
    block — the hook now only stages Go files (explicitly listed) and beads/skills directories, not the entire tree.'
