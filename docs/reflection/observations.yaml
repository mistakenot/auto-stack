  - id: 20260623T172706.433204Z-0025
    description: "Use systemctl try-restart rather than systemctl restart when restarting a daemon after binary update. try-restart only restarts if currently running, avoiding unexpectedly starting a daemon the operator intentionally stopped."
    context: "Session 07c5ecd3 included design work on the autostack daemon-install feature. The design doc chose try-restart because the operator may have intentionally left the service stopped. Also noted: daemon-reload is not needed when only the binary changes."
    git_commit: 13cc9f3
    files: ["docs/autostack-install-daemon.md"]
    session_ids: [07c5ecd3-4be8-4764-9986-56ed8da1c1be]
    sources:
      - {kind: session, ref: 07c5ecd3-4be8-4764-9986-56ed8da1c1be}
  - id: 20260623T172706.433208Z-0026
    description: "When spawning an Explore subagent to understand a codebase, give it a structured list of specific things to read (data flow, ID assignment, session creation, test harness) rather than a vague 'explore the codebase'. The subagent returns a comprehensive report organized by those exact sections."
    context: "The Explore subagent prompt in session 51f5dc53 listed 8 specific questions covering file discovery, session creation, session ID assignment, subagent file handling, model definitions, transform logic, and existing tests. The result was a structured report the agent used directly to draft the fix design."
    git_commit: 13cc9f3
    files: []
    session_ids: [51f5dc53-5c8e-4d62-835a-c868531e8420]
    sources:
      - {kind: session, ref: 51f5dc53-5c8e-4d62-835a-c868531e8420}
  - id: 20260623T172706.433211Z-0027
    description: "When inserting a new section into an already-numbered document, renumber all subsequent sections immediately in the same editing pass to prevent duplicate section numbers."
    context: "Session 6250c45c shows ~15 sequential Edit tool calls to renumber sections 2-17 one by one after inserting a new section 2. A pre-planned renumber strategy starting from the highest number downward avoids conflicts."
    git_commit: 13cc9f3
    files: ["auto-watch/docs/solution.md"]
