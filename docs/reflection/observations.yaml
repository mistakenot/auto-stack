  - id: 20260623T172706.433188Z-0021
    description: "Composite primary keys that embed hierarchy (e.g. {parentId}/{childId}) are anti-SQL patterns. Prefer opaque IDs on each row with a separate parent FK column, which standard OLAP query patterns expect."
    context: "The user explicitly overrode the composite-key design ('this feels kinda anti-sql patterns') and chose: subagent session uses agentId as its ID, plus a parent_session_id FK. The same OLAP principle was applied to messages: parent_session_id was denormalized onto the messages table to avoid joins on hot query paths."
    git_commit: 13cc9f3
    files: ["auto-etl-2/docs/subagent-session-dedup.md", "auto-etl-2/internal/model/model.go"]
    session_ids: [51f5dc53-5c8e-4d62-835a-c868531e8420]
    sources:
      - {kind: session, ref: 51f5dc53-5c8e-4d62-835a-c868531e8420}
  - id: 20260623T172706.433194Z-0022
    description: "When a session recovery context is presented (via a summary preamble), start by reading AGENTS.md/CLAUDE.md and then checking br ready before doing anything else. Do not assume the prior session's issue state is current."
    context: "Session 07c5ecd3 opened with a recovery context listing 10 blocked tasks. The agent correctly read AGENTS.md first, then ran br ready to find the 6 actually-unblocked tasks, then br show on the first ready task before starting work."
    git_commit: 13cc9f3
    files: []
