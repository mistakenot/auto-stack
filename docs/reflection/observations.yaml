- id: 20260623T175710.722226Z-0073
  description: When 13 stale doc files need frontmatter updates, fan them out across 4 parallel sub-agents (one per group,
    cheaper model like Haiku) rather than doing them sequentially. Each agent works its group sequentially to avoid write
    conflicts. This pattern is both faster and avoids context window saturation.
  context: 'Session 2 (53450b0f) ran `autodoc fix` which split the 13 files into 4 groups. The agent dispatched 4 parallel
    sub-agents (model: haiku) each handling their group. All 4 completed in ~30 seconds total. The autodoc tool itself guides
    this pattern in its output (the ''Files are split into N groups'' instruction).'
  git_commit: 13cc9f3
