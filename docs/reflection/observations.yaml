    the new convention rather than leaving them on the old format. Tests that assert old values will mask regressions, and
    old fixture values will re-teach the wrong format to agents reading the test code.
  context: Session fde768d9 found that after fixing fix.go's example, test fixtures across frontmatter_test.go, fix_test.go,
    stale_test.go, agents_test.go, and e2e tests still used `"when ..."` values. The agent updated them all to drop the prefix,
    keeping test values consistent with the new convention.
