- id: 20260623T175710.722285Z-0085
  description: When the agent discovers a concrete missing feature (like 'autosearch has no --role filter') while using the
    tool in the same session, it should immediately propose and implement the fix rather than just documenting it. Session
    0e160d60 identified the gap, implemented --role filter, added tests, and committed in the same session — this is the highest-value
    workflow pattern observed across all three sessions.
  context: Session 0e160d60 was doing exploratory analysis when it identified the --role filter gap. Rather than stopping
    at 'this should exist', the agent read the existing code, implemented the flag across CLI/search/sessions layers, added
    12 tests, and committed as 6b9e231. This contrasts with session b969b0c7 which identified the same gap and only wrote
    a findings doc. The closer feedback loop (find → fix → ship) is more valuable than find → document.
  git_commit: 13cc9f3
