    ref: 011dfac8-e3b6-4eee-9a0a-d7cdc646e091
- id: 20260623T194128.624059Z-0102
  description: For new CLI tools, always include `init`, `doctor`, and `render --dry-run` commands from the start. These match
    the stack-wide convention and dramatically reduce first-use friction and debugging time.
  context: When reviewing the auto-env v1 spec, it was noted that the conventional init/doctor pattern from the wider auto-stack
    (used by auto-doc, auto-etl, etc.) was missing. A dry-run flag for the template rendering step was also missing, which
    would have made debugging template variable substitutions difficult.
