- id: 20260623T194128.623988Z-0084
  description: Tag detection inside fenced code blocks must be suppressed to avoid treating illustrative prose in a tool's
    own documentation as real tags. A single-pass fence-state tracker built alongside the heading index handles this at zero
    extra file reads.
  context: Session 1 (2285390f) added this rule after recognising that the markdown-embedded-tags design doc itself, two-way-freshness.md,
    and two-way-freshness-guide.md all show the [autodoc()] syntax in fenced blocks and would self-flag if the scanner didn't
    skip fence contents.
