- id: 20260623T194128.623820Z-0054
  description: When a pre-commit hook lints the entire project rather than just staged files, agents facing pre-existing lint
    failures in unmodified code will eventually bypass the hook with `--no-verify`. Scope lint to staged packages only to
    keep the hook from becoming a blocker.
  context: 'Session 736aa230: the explorer found 14 occurrences across 3 sessions where agents used `git commit --no-verify`.
    The root cause was `make lint` in the pre-commit hook linting the whole project, blocking commits whenever unrelated pre-existing
    failures existed. The fix scoped golangci-lint to staged Go packages.'
