- id: 20260623T175710.722087Z-0030
  description: Profiling before parallelizing revealed that an O(n²) algorithm — not concurrency limits — was the dominant
    bottleneck. Fixing the quadratic scan with a single-pass map index yielded a ~62x speedup vs the ~2-4x expected from parallelization
    alone.
  context: 'auto-etl transform stage: `toolMetaForResult()` was scanning every session line for each tool_result block, causing
    R×L JSON unmarshal operations per session. Replacing it with a single-pass `buildToolUseIndex` map reduced the cost to
    R+L per session. Debug timing (`--debug` flag) was added specifically to expose this, confirming parse took 1.5s, transform
    took 16.8s, and write took 41ms — so transform was clearly the bottleneck.'
  git_commit: 13cc9f3
  files:
  - auto-etl/internal/transform/transform.go
  - auto-etl/cmd/run.go
  - auto-etl/cmd/root.go
  session_ids:
