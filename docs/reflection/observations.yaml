  - id: 20260623T172706.433235Z-0034
    description: "When exploring a new codebase, dispatch parallel sub-agents per subsystem rather than reading all files sequentially. Session 00f0bcac launched three simultaneous Explore sub-agents for auto-etl, auto-doc, and stub directories — dramatically faster than reading files one package at a time."
    context: "Project exploration tasks where the codebase has distinct independent subsystems. The coordinator spawns one sub-agent per subsystem, collects their reports, then synthesizes. This works because exploration is read-only and sub-agents don't need to coordinate."
    git_commit: 13cc9f3
