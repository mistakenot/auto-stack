- id: 20260623T175710.722266Z-0082
  description: When the pre-commit hook applies auto-formatting (gofmt/goimports), the commit fails and the agent must re-stage
    and re-commit. This happened across 10+ sessions in 14 days. Running 'gofmt -w ./...' and 'goimports -w ./...' explicitly
    before 'git commit' eliminates the bounce. Add this as a checklist step before any commit in Go sub-projects.
  context: 'The auto-stack pre-commit hook runs gofmt, goimports, go vet, and golangci-lint. When formatting changes are applied
    automatically, the commit fails with ''pre-commit: goimports/gofmt applied'' and the agent must try again. Sessions b969b0c7
    and 0e160d60 both searched for this pattern and found 31 occurrences of hook-related messages.'
