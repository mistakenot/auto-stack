  - id: 20260623T172706.433239Z-0035
    description: "Claude Code JSONL subagent files are identifiable by path (lives under {session-uuid}/subagents/), the presence of an agentId field on every line, and isSidechain: true. They share the parent's sessionId, so ETL pipelines that create one session row per file will produce duplicate session IDs."
    context: "Session 00f0bcac discovered this by comparing 179 files against 64 unique session IDs. The correct ETL strategy is to use the JSONL file path as the primary key, designate files at depth 2 as parent sessions, and treat files under /subagents/ as child traces."
    git_commit: 13cc9f3
