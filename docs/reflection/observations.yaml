- id: 20260623T175710.722279Z-0084
  description: When reviewing implementation docs, surface architecture-level decisions that cross-cut multiple sections rather
    than reviewing sections in isolation. The most valuable comments in the doc review session identified shared-state coupling
    risks (stats importing search internals), N*M join explosion risks in CTEs, and BM25 sign-convention ambiguity — none
    of which were visible from reading a single section alone.
  context: 'Session 078dd54d reviewed grouping-solution.md for autosearch stats. The most impactful comments identified cross-cutting
    concerns: (1) stats reaching into search internals instead of a shared filter package, (2) session-scope CTE doing an
    N*M join for all buckets instead of post-pagination, (3) SQLite FTS5 bm25() returns negative scores but the doc said ''lowest''
    without clarifying convention. These required holding the architecture in mind across sections.'
