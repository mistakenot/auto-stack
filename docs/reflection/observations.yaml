- id: 20260623T175710.722100Z-0034
  description: After a squash merge, rebasing a local branch that contains the same commits results in conflicts because the
    SHAs differ. The correct resolution is `git rebase --skip` to drop the now-redundant local commit rather than resolving
    conflicts manually.
  context: 'After squash-merging PR #3 from `feature/version-ldflags`, the local branch had commit `7d4a2d7` which contained
    the same content as squash commit `bdeb816` on origin/main. `git rebase origin/main` produced conflicts in all modified
    files. `git rebase --skip` cleanly dropped the duplicate commit.'
