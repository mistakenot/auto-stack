  - id: 20260623T172706.433197Z-0023
    description: "When code was already implemented in a prior session (discoverable via go build ./... and inspecting existing files), close the corresponding beads issue immediately rather than reimplementing. Check first by reading the file tree and verifying with go build."
    context: "Multiple tasks (auto-k8z.4, auto-k8z.5, auto-k8z.8, auto-k8z.9) were already implemented from a prior session. The agent discovered this by reading existing Go files, running go build ./... && echo OK, and verifying the functions existed."
    git_commit: 13cc9f3
