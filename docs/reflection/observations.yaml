- id: 20260623T194128.624308Z-0149
  description: 'golangci-lint caches results across worktrees. When a sibling worktree is deleted mid-stream, the cache may
    contain stale entries pointing to that removed path, producing phantom lint failures. The tell is the file path in the
    error pointing to a non-existent or sibling directory. Fix: `golangci-lint cache clean`.'
  context: Documented in feedback for tasks 017 and 018. In both tasks, `make check` reported phantom lint findings in files
    under a worktree path that no longer existed (e.g. `auto-stack-task-016/...`). Running `golangci-lint cache clean` cleared
    the stale entries.
  git_commit: 02bd685
  files: []
  session_ids: []
  sources:
  - kind: feedback
    ref: docs/tasks/017-unify-binaries-into-auto/feedback.md
- id: 20260623T194128.624311Z-0150
  description: The `modernize` linter finds issues that `go vet` and `go test` do not — for example, `strings.Split` that
    should be `strings.SplitSeq`. Run the actual `make check` (which includes golangci-lint) as part of per-phase verification,
    not just `go build` and `go test`.
  context: Documented in feedback for task 018. A real `modernize` lint finding in `doctor.go` (`strings.Split` → `strings.SplitSeq`)
    only surfaced from `make check`, not from `go vet` or `go test`. This is the same lesson from task 017 that recurred because
    per-phase verify steps didn't include the full lint.
  git_commit: 02bd685
  files: []
  session_ids: []
