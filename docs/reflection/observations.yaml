- id: 20260623T175710.722090Z-0031
  description: A persistent `--debug` flag on the root Cobra command that prints per-phase timing to stderr is the correct
    pattern for instrumenting multi-phase CLI pipelines — it keeps stdout clean (JSON-parseable) while making performance
    regressions immediately visible during manual runs.
  context: Added `--debug` to `rootCmd.PersistentFlags()` in `cmd/root.go` so it applies to all subcommands. Timing went to
    stderr, consistent with existing progress logging. The flag was requested after the user ran the tool and couldn't tell
    which phase was slow — the output showed parse/transform/write/github timing separately.
