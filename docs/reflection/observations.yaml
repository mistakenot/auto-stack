- id: 20260623T175710.722243Z-0078
  description: 'When searching session history for recurring errors, the search index is polluted with meta-search noise:
    previous agents running searches for problem patterns become the dominant hits for those same patterns. Hit counts become
    misleading because the signal is drowned out by agents investigating the signal. Use --role tool to filter to actual command
    output where real errors live.'
  context: Sessions 0e160d60 and b969b0c7 were both given the same open-ended task ('probe session history for things not
    working well') and both discovered that autosearch queries like 'revert OR undo' returned mostly other agents running
    the same query, not actual reverts. The --role filter was subsequently added to fix this. Applies whenever using autosearch
    to diagnose recurring problems.
  git_commit: 13cc9f3
