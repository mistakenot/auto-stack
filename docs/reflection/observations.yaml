- id: 20260623T194128.623708Z-0021
  description: Version strings produced by `git describe --tags --always --dirty` include suffixes like `-3-gc3c0162-dirty`.
    Strip these suffixes before comparing to a semver release tag, or a developer build on the same base version will be incorrectly
    treated as outdated.
  context: The binary was built with VERSION=v0.8.0-3-gc3c0162-dirty while the latest GitHub release was v0.8.0. A naive string
    comparison triggered an unnecessary install. The fix was a baseVersion() function that truncates at the first '-' after
    the numeric version components.
