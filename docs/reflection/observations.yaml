- id: 20260623T194128.623993Z-0085
  description: When an autodoc fixed rewrite would update scopeHash while the tag's docHash is already stale, skip the rewrite
    and emit a stderr warning instead. Silently updating scopeHash under a stale docHash locks in local content against an
    out-of-date consistency assertion.
  context: 'Sessions 1 and 2 surfaced this as Open Question 1 in the design. The resolution: skip-when-stale, because updating
    scopeHash in that state produces a confusing validity signal where the scope appears fresh but the cross-doc assertion
    is known wrong.'
