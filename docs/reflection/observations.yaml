  description: Scope-limiting a file scan to the existing doc index (files with a valid frontmatter id) rather than walking
    all markdown in the repo prevents false positives and controls blast radius when extending a scanning feature to a new
    file type.
  context: In session 1 (2285390f) the design for markdown-embedded autodoc tags initially proposed removing .md from ignoredExtensions,
    which would have scanned all markdown files repo-wide. A REVIEW comment (session 2) flagged the blast radius; the fix
    was to restrict scanning to files already in the doc index, keeping .md in ignoredExtensions for the bare-tag code path.
