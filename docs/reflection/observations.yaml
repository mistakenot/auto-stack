- id: 20260623T172706.433164Z-0014
  description: When reviewing a design doc against code, use a dedicated Explore sub-agent per subsystem rather than reading
    files inline. The sub-agent returns a structured summary that can be compared against the doc without the coordinator
    needing to read source files directly.
  context: Session 4462d249 used Explore sub-agents to audit auto-doc and auto-etl internals. The auto-doc sub-agent (68s,
    27 tool uses) answered 8 specific questions; the auto-etl sub-agent (58s, 22 tool uses) answered 10. The coordinator synthesized
    both reports to update docs without re-reading any source files.
  git_commit: 13cc9f3
