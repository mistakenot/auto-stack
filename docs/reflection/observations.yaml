  - id: 20260623T172706.433177Z-0018
    description: "Denormalize git_remote into both sessions and messages parquet tables as a cross-host project identity key. git_remote provides a stable identifier for the same project across machines with different absolute paths."
    context: "Session 4462d249 identified a gap: multi-host scenarios were described but no cross-host identity key was defined. The user confirmed git_remote as the answer. Messages also got git_branch (not denormalized from session, since branch can change mid-session)."
