  context: The shared `EnsureHost()` function loads and returns an existing host.json, or creates one populated with `os.Hostname()`
    if absent. This pattern was adopted by all three `init` commands (autodoc, autosearch, autoskill), giving them a consistent
    way to guarantee the host file exists without duplicating the creation logic.
