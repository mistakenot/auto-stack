  description: Move all build, lint, cross-compile, and release logic into the Makefile. GitHub Actions workflows should call
    `make check`, `make build`, and `make dist GOOS=... GOARCH=...` — nothing else. This keeps CI and local environments identical
    and avoids duplicating logic that then drifts (e.g. the release.yml had stale references to `auto-etl-2` that the Makefile
    didn't).
  context: 'Session 3 refactored CI after discovering the release.yml referenced a deleted sub-project and missed two new
    ones. The principle applied: Makefile is the source of truth, GitHub Actions is just a trigger. Also caught that Makefile
    shell loops using `${!var}` (bash indirect expansion) fail silently under `/bin/sh`; explicit per-target rules are safer.'
