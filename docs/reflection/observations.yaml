    ref: docs/tasks/017-unify-binaries-into-auto/feedback.md
- id: 20260623T194128.624305Z-0148
  description: When `go work sync` is run, it can rewrite indirect dependency versions in individual `go.mod` files across
    the workspace (MVS unification). This is expected behavior — keep the rewrites rather than reverting them if the workspace
    already builds against those versions.
  context: Documented in feedback for task 017. Running `go work sync` rewrote indirect dep versions in 4 tool `go.mod` files
    (e.g. auto-watch sqlite v1.39.1 → v1.47.0 which auto-search already pinned). The versions were already tested against,
    so the rewrites were safe to keep.
  git_commit: 02bd685
