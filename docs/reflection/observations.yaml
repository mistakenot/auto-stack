- id: 20260623T175710.722230Z-0074
  description: 'In OpenProse programs, unconditionally calling all N parallel service instances when fewer than N priority
    items exist causes runtime failures. Gate each optional service call with `if priorities.count >= N:` and use `parallel
    (on-fail: "continue"):` so a single implementer failure doesn''t abort the whole run before the summary stage.'
  context: 'Session 1 (a0c16027) reviewed high-priority findings from a separate code-review document. Three bugs were identified
    in the self-improve pipeline: (1) parallel block always called 3 implementers even when fewer priorities existed, (2)
    delegates were declared at wrong schema level, (3) parallel was fail-fast but summary expected partial failures. All three
    were fixed before committing.'
  git_commit: 13cc9f3
