- id: 20260623T175710.722152Z-0050
  description: yaml.Marshal on map[string]any produces non-deterministic key ordering in YAML output. For scaffolded files
    where field order matters (e.g. name before description in a SKILL.md template), use a struct with yaml tags or write
    the YAML manually as a template string.
