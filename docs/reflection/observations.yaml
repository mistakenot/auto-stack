observations:
- id: 20260623T172706.433083Z-0001
  description: When implementing a linkscan/tag-detection system for source code, always filter out documentation files (.md,
    .yaml, .json) and test files (_test.go, testdata/) before scanning — otherwise prose descriptions of the tag format and
    test fixtures produce large volumes of false-positive 'malformed tag' errors that are impossible to distinguish from real
    issues.
  context: autodoc's linkscan was scanning all git-tracked files including .md docs and _test.go files. Any line mentioning
    '[autodoc()]' in a comment or string literal was incorrectly flagged as a malformed tag. The fix required adding extension-based
    filtering, suffix-based filtering for test files, and tightening the 'malformed' heuristic to only flag patterns containing
    '@' (indicating an attempted real tag format, not a description).
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/linkscan/linkscan.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433114Z-0002
  description: 'When the beads dependency system uses ''dep add A B'' to mean ''A depends on B (B blocks A)'', it''s easy
    to wire the direction backwards. Always verify by checking br ready after wiring: if the foundational task doesn''t appear
    as ready, the direction is wrong and must be reversed with dep remove.'
  context: 'When building the autodoc v1 epic, the agent initially wired ''tasks -> epic'' (meaning tasks depended on the
    epic), blocking the tasks from showing as ready. After checking br ready and seeing the config migration task was blocked,
    the agent removed all epic links and re-added them in the correct direction (epic depends on final acceptance task). The
    correct pattern: only link the epic to the final ''acceptance pass'' task, not to all tasks.'
  git_commit: 13cc9f3
  files: []
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433122Z-0003
  description: When splitting a CLI init command into global vs project modes, the 'project' init should automatically run
    global init if global config doesn't exist yet — this makes the tool work on a fresh system without requiring users to
    run two separate commands in the right order.
  context: autodoc's init was split into InitGlobal (creates ~/.auto/doc/settings.json and ~/.auto/host.json) and InitProject
    (creates .auto/doc/settings.json). InitProject was wired to call InitGlobal first if ~/.auto/doc/settings.json doesn't
    exist, so autodoc init --project works end-to-end on a fresh system.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/commands/init.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433126Z-0004
  description: When git ls-files is used to enumerate files for scanning, it can return directory entries (e.g. skills installed
    as git submodules or symlinks). Always add an os.Stat + info.IsDir() check before attempting os.ReadFile, otherwise the
    scan crashes with 'is a directory' errors.
  context: 'autodoc fix was crashing with ''read .claude/skills/contextual-commit: is a directory'' because git ls-files returned
    the skills directory as a tracked path. The fix was to stat each path and skip it if IsDir() before calling ReadFile.'
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/linkscan/linkscan.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433130Z-0005
  description: Fix instruction output for stale-hash-only docs should say 'review that title and summary still reflect the
    content' — not 'set summary to...' — because those files already have valid summaries. Conflating 'stale hash' with 'needs
    summary update' produces misleading agent instructions that waste effort on no-op edits.
  context: autodoc fix was generating 'Set summary to one-line description' for files that had correct titles and summaries
    but just needed rehashing after content changed. The fix was to add EmptySummary as a distinct issue type and only emit
    the summary instruction when summary is actually empty.
  git_commit: 13cc9f3
  files:
  - auto-doc/internal/commands/fix.go
  session_ids:
  - 6c71f534-8a37-4157-9ae2-cabe1ab541c9
  sources:
  - kind: session
    ref: 6c71f534-8a37-4157-9ae2-cabe1ab541c9
- id: 20260623T172706.433134Z-0006
  description: When a feature is described as a gap to implement, always grep for existing implementations first before building
    it from scratch — WalkRepo for recursive docs discovery was already fully implemented and tested with multi-root fixtures.
  context: The auto-anp task was to implement recursive docs discovery across nested docs/ directories. After reading the
    tech design doc and searching the codebase, WalkRepo was already implemented in doctree.go using git ls-files to find
    all docs/ directories, with multi-root tests in place. The task was closed as 'already done' with a quick verification
    run.
  git_commit: 13cc9f3
  files:
