- id: 20260623T175710.722259Z-0081
  description: When an agent discovers a problem via tooling and then implements a fix in the same session, later agents benefit
    immediately without being aware of the prior work. Session 0e160d60 found the --role filter gap and added it; session
    b969b0c7 (run later that day) was able to use the fixed binary. However, nothing in the tooling surfaces 'this pattern
    was already fixed in commit X' — agents rediscover the same findings independently. Cross-referencing known issues with
    search results would close this loop.
