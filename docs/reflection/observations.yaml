- id: 20260623T194128.624256Z-0136
  description: Git remote URLs with embedded credentials (e.g. `https://x-access-token:TOKEN@github.com/...`) must be stripped
    before being persisted to any log, JSONL feedback file, or bus event. String-based stripping is insufficient — use `net/url.Parse`
    to extract only `Host` and `Path`, and handle scp-style remotes (`git@host:path`) with generic `@`-prefix stripping rather
    than hardcoding `git@`.
  context: In session 4 (37944658), the auto-reflect `normalizeRemote` function stripped the URL scheme but not the userinfo
    component. A credential-bearing URL like `https://x-access-token:ghp_abc@github.com/org/repo` was persisted verbatim into
    `.auto/reflect/feedback.jsonl`. The fix used `net/url.Parse` for scheme-bearing URLs and generic `strings.Index('@')`
    stripping for scp-style. Regression tests were added in `internal/gitutil/git_test.go`.
  git_commit: 02bd685
  files:
  - auto-reflect/internal/gitutil/git.go
  - auto-reflect/internal/gitutil/git_test.go
  session_ids:
  - 37944658-6535-4f81-b1e8-c0c89ca4533c
  sources:
  - kind: session
    ref: 37944658-6535-4f81-b1e8-c0c89ca4533c
- id: 20260623T194128.624262Z-0137
  description: Security regression tests for credential stripping should use a dedicated test function that feeds known credential-bearing
    URLs through the sanitizer and asserts the output never contains `@`, known token patterns, or passwords — not just a
    table test that verifies correct output for known inputs.
  context: In session 4 (37944658), `TestNormalizeRemote_NeverLeaksCredentials` was added alongside the standard table test.
    This catches any future code path that routes a new URL format through without stripping — it would fail even if the expected
    output wasn't known in advance.
  git_commit: 02bd685
