- id: 20260623T175710.722212Z-0069
  description: 'When a GitHub Actions release workflow uses `gh release create` and a release for the tag already exists (e.g.,
    created manually or by a race condition), the job fails with ''a release with the same tag name already exists'' and leaves
    the release with zero assets. Fix by adding a fallback: `gh release create ... || gh release upload ... --clobber`.'
  context: Session 3 (b6d5cf3a) investigated a 404 from install.sh. The v0.7.0 release had been created (empty) before the
    workflow's release job ran. The `gh release create` step failed, binaries were never uploaded. The workflow had no fallback
    for pre-existing releases. The fix is to detect the pre-existing release and upload assets to it instead.
  git_commit: 13cc9f3
  files:
  - .github/workflows/release.yml
  - install.sh
  session_ids:
  - b6d5cf3a-815f-42dd-ba56-41899cac9724
  sources:
  - kind: session
    ref: b6d5cf3a-815f-42dd-ba56-41899cac9724
- id: 20260623T175710.722215Z-0070
  description: When debugging a failed install (404 on binary download), the fastest diagnosis is to check `gh release view
    <tag> --json assets` — if the assets list is empty the release job failed, not the install script. Follow up with `gh
    run list --workflow=release.yml` then `gh run view <id> --log-failed` to get the exact error.
  context: 'Session 3 (b6d5cf3a) traced a user''s 404 install error to an empty release in under 5 steps: check install.sh
    URL pattern → check release assets → check workflow run list → view failed logs. The root cause (pre-existing release
    blocking `gh release create`) was visible in the logs.'
  git_commit: 13cc9f3
  files:
  - install.sh
  - .github/workflows/release.yml
  session_ids:
  - b6d5cf3a-815f-42dd-ba56-41899cac9724
  sources:
