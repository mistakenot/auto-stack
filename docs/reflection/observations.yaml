  - id: 20260623T172706.433222Z-0030
    description: "A tmux-based executor should use remain-on-exit on the tmux session, detect completion via an exit-code file (not tmux has-session), and call capture-pane before killing the session to capture the agent's final output without blocking."
    context: "Designing executor interfaces for daemon-launched Claude Code sessions. The naive approach (poll tmux has-session) fails to capture last output because the session disappears on process exit. Writing exit code to a file and keeping the pane alive decouples completion signal from cleanup."
