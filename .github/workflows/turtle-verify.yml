name: turtle-verify

# Verify the RDF/Turtle spec pipeline: parse -> lint -> validate -> test.
# Any stage failure (parse/lint/SHACL validate/SPARQL test) fails the build.
on:
  push:
    branches: [main]
    paths:
      - "turtle-spike/**"
      - ".github/workflows/turtle-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "turtle-spike/**"
      - ".github/workflows/turtle-verify.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: turtle-spike

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: turtle-spike/requirements.txt

      - name: Cache virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: turtle-spike/.venv
          key: turtle-venv-${{ runner.os }}-py3.12-${{ hashFiles('turtle-spike/requirements.txt') }}

      - name: Create venv and install deps
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements.txt

      - name: Run verification pipeline (parse, lint, validate, test)
        run: make all
