version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /auto-doc
      - /auto-env
      - /auto-etl
      - /auto-watch
      - /auto-search
      - /auto-reflect
      - /auto-skill
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
